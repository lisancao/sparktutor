  Output: |
    ## readStream with File Source

    The file source watches a directory for new files. When a new file
    appears, Spark reads it as the next micro-batch. Supported formats:
    CSV, JSON, Parquet, ORC. PayGuard receives transactions as JSON files:

    ```python
    stream_df = (spark.readStream
        .format("json")
        .schema(tx_schema)
        .load("/data/payguard/transactions/"))
    ```

    **Critical**: You must provide `.schema()`. `inferSchema` does not
    exist for streaming — there is no complete dataset to sample.

