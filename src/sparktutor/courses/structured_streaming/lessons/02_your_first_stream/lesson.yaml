    ## Why New Files = New Data

    Think of the directory as a mailbox. Each new file is a new letter.
    Spark periodically checks the mailbox. When it finds new letters
    (files), it reads them and processes them as one micro-batch. Files
    are processed exactly once (based on modification time). If you add
    files while the stream is running, they will be picked up in the
    next trigger.

- Class: text
  Depth: all
  Output: |
    ## writeStream to Console Sink

    The console sink prints results to stdout — perfect for debugging.
    Each micro-batch produces a table output:

    ```python
    query = (result_df.writeStream
        .outputMode("append")
        .format("console")
        .start())

    query.awaitTermination()
    ```

    `start()` returns a `StreamingQuery` object. `awaitTermination()`
    blocks until the query is stopped (e.g., Ctrl+C). For stateless
    transforms like `select` and `filter`, `append` mode outputs only
    new rows each batch.

- Class: text
  Depth: all
  Output: |
    ## StreamingQuery Lifecycle

    ```python
    query = result_df.writeStream.format("console").start()

    query.id
    query.runId
    query.status
    query.lastProgress
    query.stop()
    query.awaitTermination()
    ```

    - `start()` — begins the query; returns immediately
    - `awaitTermination()` — blocks until stopped
    - `stop()` — gracefully stops the query
    - `lastProgress` — latest batch info (rows processed, duration)
    - `status` — current state (ACTIVE, STOPPED, etc.)

    In production, you might run `start()` and then monitor `lastProgress`
    from another thread or a monitoring system.

