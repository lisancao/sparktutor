    ## What Happens When No New Files Arrive?

    If the directory is empty or no new files appear, Spark still triggers
    (based on the trigger setting). Each trigger produces an empty
    micro-batch — no output is written. The query stays active, waiting.
    This is normal. PayGuard's transaction stream might have quiet
    periods (e.g., overnight) with no new files. The query keeps running.

