    ## File Source Behavior: Exactly-Once Semantics

    The file source assigns each file to exactly one micro-batch based on
    its modification time. Once processed, Spark tracks which files were
    read (in the checkpoint). On restart, it will not re-read them. This
    gives exactly-once processing for file sources — no duplicates, no
    missed files (as long as you use checkpointing).

