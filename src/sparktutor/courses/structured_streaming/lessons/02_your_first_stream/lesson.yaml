    ## A Complete File-Based Stream (Conceptual)

    ```python
    stream_df = (spark.readStream
        .format("json")
        .schema(tx_schema)
        .load("/data/payguard/transactions/"))

    summary = stream_df.select("tx_id", "user_id", "amount", "event_time")

    query = (summary.writeStream
        .outputMode("append")
        .format("console")
        .option("checkpointLocation", "/tmp/checkpoint")
        .start())

    query.awaitTermination()
    ```

    We use `select` (stateless) so `append` mode works. The checkpoint
    location (set via `.option("checkpointLocation", ...)`, not as an
    argument to `.start()`) enables fault tolerance — we will cover
    this in Lesson 10.

