    ## PayGuard's Transaction Stream

    PayGuard receives transaction events from payment gateways, mobile apps,
    and point-of-sale systems. These events arrive as files dropped into a
    directory (or as Kafka messages). Your first streaming job will read
    new PayGuard transaction files and print summaries to the console —
    the foundation for all downstream fraud detection.

- Class: text
