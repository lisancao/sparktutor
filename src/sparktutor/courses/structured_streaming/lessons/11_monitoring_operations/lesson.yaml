  Output: |
    ## StreamingQueryListener for Metrics

    Attach a listener to capture metrics on each batch:

    ```python
    from pyspark.sql.streaming import StreamingQueryListener

    class MetricsListener(StreamingQueryListener):
        def onQueryProgress(self, event):
            progress = event.progress
            print(f"Batch: {progress.batchId}, Rows: {progress.numInputRows}, "
                  f"Duration: {progress.batchDuration}")

    spark.streams.addListener(MetricsListener())
    ```

    Progress includes: numInputRows, processedRowsPerSecond, batchDuration,
    stateOperators (state size). Log these to your monitoring system.

- Class: text
  Depth: all
  Output: |
    ## Key Metrics to Track

    - **numInputRows**: Rows in this batch. Sudden drop to 0? Source
      might be empty or stalled.
    - **processedRowsPerSecond**: Throughput. Declining? Backpressure.
    - **batchDuration**: Time to process. Growing? Slowdown.
    - **stateOperators**: State size per operator. Growing unbounded?
      Check watermarks.
    - **inputRowsPerSecond**: Rate from source. Compare to processed.

    PayGuard alerts when batchDuration > 60s or stateOperators grows
    >10% per hour. Early warning for OOM or stall.

