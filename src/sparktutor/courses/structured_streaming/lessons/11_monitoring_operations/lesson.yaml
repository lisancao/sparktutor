    ## Backpressure and Rate Limiting

    If the source produces data faster than Spark can process, the
    buffer grows. **maxOffsetsPerTrigger** limits how much to read per
    batch: `option("maxOffsetsPerTrigger", 10000)` for Kafka. Slows
    ingestion, prevents overload. Use when you can't scale processing
    fast enough.

    **minOffsetsPerTrigger** (Kafka): Wait until at least N offsets
    available. Reduces empty batches when data is sparse.

