    ## PayGuard's Production Operations

    A streaming query can run for weeks. You need to know: Is it healthy?
    Is it keeping up? Is state growing? **StreamingQueryListener** and
    progress metrics give you visibility. Backpressure, scaling, and
    alerting complete the operations picture.

- Class: text
