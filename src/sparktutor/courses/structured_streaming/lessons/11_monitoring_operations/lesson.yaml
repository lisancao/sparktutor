    ## Scaling Strategies

    - **More partitions**: Increase Kafka partitions or file source
      parallelism. More partitions = more parallel tasks.
    - **More executors**: Scale out the cluster. Each executor handles
      a subset of partitions.
    - **Partition-aware processing**: If your aggregation is skewed
      (e.g., one user has 80% of traffic), consider salting the key or
      splitting hot keys. Advanced topic for later.

