    ## Time Range Condition for Stream-Stream

    The condition must be an inequality on event time. Spark uses it to
    prune the buffer: "don't keep auth events older than (tx_event_time
    - 10 min)." Supported: `<=`, `>=`, `BETWEEN`, `AND` of time bounds.
    Equi-join on keys (user_id) + time range. Example: `event_time
    BETWEEN auth_time - 5 min AND auth_time + 5 min` for "auth within
    ±5 min of transaction."

