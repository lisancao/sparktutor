    ## Stream-Stream Joins

    Both sides are streams. Spark matches rows from both sides. Without
    bounds, you'd buffer forever. **Both sides need watermarks** and a
    **time range condition** to limit how far back to look.

    ```python
    tx_stream = tx_stream.withWatermark("event_time", "10 minutes")
    auth_stream = auth_stream.withWatermark("auth_time", "10 minutes")

    matched = tx_stream.join(auth_stream,
        f.expr("tx_stream.user_id = auth_stream.user_id AND "
               "auth_time <= event_time AND event_time <= auth_time + interval 10 minutes"))
    ```

    The time range: "auth event must be within 10 minutes before the
    transaction." Without it, Spark can't bound the join buffer.

- Class: text
  Depth: all
  Output: |
    ## Watermark Requirements for Stream-Stream

    - Both streams must have withWatermark on their event time column.
    - The join condition must include a time range (e.g., event_time
      between auth_time and auth_time + 10 min). Otherwise Spark can't
      decide when to drop old rows from the buffer.
    - Watermark threshold determines how late data can arrive. Too tight
      → dropped matches. Too loose → large buffer, memory pressure.

    PayGuard matches transactions with merchant auth events: "did this
    transaction occur within 5 minutes of a successful auth?" Both
    streams need 5‑minute watermarks and the time range in the join.

