    ## PayGuard's Enrichment Needs

    Raw transactions have user_id and merchant_id. For fraud detection,
    you need: account tier (from account lookup), merchant category (from
    merchant table), and whether the transaction matches a recent auth
    event (from auth stream). **Stream-static** joins enrich with lookup
    tables. **Stream-stream** joins match two event streams. Both are
    critical for PayGuard's pipeline.

- Class: text
  Depth: all
  Output: |
    ## Stream-Static Joins

    Join a streaming DataFrame with a **batch** (static) DataFrame. The
    static side is broadcast or shuffled once per micro-batch. No
    watermarks needed. The stream is the left side; the static table is
    the right.

    ```python
    accounts_df = spark.read.parquet("/data/accounts/")
    enriched = stream_df.join(accounts_df, "user_id", "left")
    ```

    PayGuard joins transactions with the account lookup (account_id,
    tier, risk_level). Each micro-batch: stream rows + full accounts
    table. Small static table → broadcast. Large → shuffle join.

