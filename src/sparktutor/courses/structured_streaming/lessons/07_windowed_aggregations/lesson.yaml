    ## Window Column Structure

    The `window` function returns a struct column with `start` and `end`
    timestamps. You can select them: `df.select("window.start", "window.end")`.
    For ordering: `orderBy("window")` or `orderBy(f.col("window.start"))`.
    The window is inclusive of start, exclusive of end: [start, end).

