    ## Sliding Windows: Overlapping Buckets

    **Sliding windows** overlap. A 10-minute window sliding every 5
    minutes: [0-10), [5-15), [10-20), ... Each event can appear in
    multiple windows. Use for smoothed metrics: "transactions in the
    last 10 minutes, updated every 5."

    ```python
    windowed = (stream_df
        .groupBy(window("event_time", "10 minutes", "5 minutes"), "user_id")
        .count())
    ```

    Sliding increases state (more windows) but gives finer granularity.
    PayGuard uses tumbling for velocity — simpler and less state.

