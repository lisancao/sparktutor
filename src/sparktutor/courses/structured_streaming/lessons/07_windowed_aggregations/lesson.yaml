    ## Why Windows Bound State

    Without windows, groupBy("user_id") keeps state for every user
    forever. With groupBy(window(...), "user_id"), state is per
    (window, user_id). Old windows can be discarded once you know no
    more data will arrive (watermarks). So state = (number of active
    windows) × (users per window). Bounded by time, not unbounded.

