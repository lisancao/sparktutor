    ## PayGuard's Velocity Rule

    A key fraud signal: **velocity** — too many transactions in a short
    window. A stolen card might be used 10 times in 5 minutes. PayGuard
    needs to detect "more than 5 transactions per user in 10 minutes."
    **Windowed aggregations** group events by time buckets. They bound
    state naturally: each window is a finite bucket. When the window
    closes, you output and discard.

- Class: text
  Depth: all
  Output: |
    ## Tumbling Windows: Non-Overlapping Buckets

    **Tumbling windows** partition time into fixed-size, non-overlapping
    buckets. 10-minute tumbling: [0-10), [10-20), [20-30), ...

    ```python
    from pyspark.sql.functions import window

    windowed = (stream_df
        .groupBy(window("event_time", "10 minutes"), "user_id")
        .count()
        .filter(f.col("count") > 5))
    ```

    Each event falls into exactly one window. State is bounded: you
    only keep windows that might still receive data (watermarks handle
    when to discard — Lesson 8). For now, tumbling gives you
    "transactions per user per 10-minute bucket."

- Class: text
  Depth: all
