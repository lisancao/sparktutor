    ## Session Windows (Spark 3.2+)

    **Session windows** are gap-based: a new session starts when there's
    a gap larger than the timeout. Useful for "bursts" of activity: a
    user's shopping session might be 30 minutes of activity, then 2
    hours of nothing. Session windows group the burst without fixed
    boundaries.

    ```python
    from pyspark.sql.functions import session_window
    windowed = stream_df.groupBy(session_window("event_time", "30 minutes"), "user_id").count()
    ```

    PayGuard could use sessions for "transactions per shopping session"
    — a different fraud signal than fixed windows.

