    ## Exactly-Once with Idempotent Sinks

    Continuous mode provides at-least-once, not exactly-once. But you
    can achieve **effectively exactly-once** by making your sink
    idempotent:

    **Database with upsert:** Write alerts keyed by `(tx_id, rule_name)`.
    If the same alert is produced twice (due to reprocessing after
    failure), the second write is a no-op update.

    **Kafka with deduplication:** Include a unique key in each message.
    Downstream consumers deduplicate by key.

    **Idempotent file writes:** Use a deterministic filename derived from
    the data (e.g., `alert_{tx_id}_{rule_name}.json`). Rewriting the
    same file is idempotent.

    For async micro-batch, the same idempotent sink strategy handles
    the small window of potential reprocessing. Most production systems
    already need idempotent sinks for other reasons (network retries,
    duplicate messages from Kafka), so this is not an extra burden.

