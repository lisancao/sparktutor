    ## Summary

    In this lesson you learned:

    - **Micro-batch** — the default mode with highest throughput and
      exactly-once guarantees, but 100ms+ latency per batch
    - **Continuous processing** — sub-10ms latency for stateless
      transforms, but no aggregation/joins and only at-least-once
    - **Async offset tracking** — best of both worlds: micro-batch
      capabilities with 2-5x lower latency, production-ready in 3.4+
    - **Hybrid design** — split rules by latency requirement, run
      multiple queries on the same source with separate checkpoints
    - **Idempotent sinks** — make any mode effectively exactly-once

    In the next lesson, you will assemble the complete fraud detection
    capstone — combining hybrid processing modes, all detection rules,
    and production monitoring into one system.
