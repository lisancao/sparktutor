    ## When to Use Each Mode — A Decision Framework

    Ask these questions about your streaming use case:

    **1. Does your query need aggregation, joins, or windows?**
    - Yes → micro-batch or async micro-batch. Continuous is out.
    - No → all three modes are options.

    **2. What latency does your use case require?**
    - Sub-10ms → continuous (if stateless)
    - 50ms-2s → async micro-batch
    - 1s-10s → standard micro-batch

    **3. Do you need exactly-once guarantees?**
    - Yes, without idempotent sink → standard micro-batch only
    - Yes, with idempotent sink → any mode works
    - At-least-once is fine → any mode works

    **4. Is the feature production-ready for your Spark version?**
    - Standard micro-batch → always production-ready
    - Async tracking → production-ready in Spark 3.4+
    - Continuous → experimental (use with caution in production)

    For most production workloads, **async micro-batch** is the sweet
    spot: it supports all operations and provides significantly lower
    latency than standard micro-batch.

