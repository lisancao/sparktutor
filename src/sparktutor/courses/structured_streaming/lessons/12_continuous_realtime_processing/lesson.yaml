    ## Continuous Mode Limitations

    Continuous processing comes with significant restrictions:

    **Supported operations only:**
    - Projection and selection (`select`, `filter`, `withColumn`)
    - `map`-like operations (stateless transforms)

    **NOT supported:**
    - Aggregations (`groupBy`, `count`, `sum`)
    - Joins (any kind)
    - `dropDuplicates`
    - Windowed operations
    - `foreachBatch` sink

    **Fault tolerance:**
    - Provides **at-least-once** guarantees (not exactly-once)
    - Records between the last epoch commit and a failure are
      reprocessed on restart

    This means our velocity detection rule (windowed aggregation)
    **cannot** run in continuous mode. But our amount threshold rule
    (stateless filter) and blocklist rule (stateless filter or
    broadcast lookup) can.

