    ## Designing Hybrid Pipelines

    Real systems rarely use a single processing mode. PayGuard's
    production architecture splits rules by their latency needs:

    ```
    Kafka topic: transactions
        │
        ├── Stream 1: Continuous mode
        │   ├── Amount threshold filter (> $1000) → immediate block
        │   └── Blocklist filter → immediate block
        │
        └── Stream 2: Async micro-batch
            ├── Velocity detection (10-min window) → review queue
            └── Geo-impossible detection (join + window) → review queue
    ```

    Two separate streaming queries read the same Kafka topic. Each
    has its own checkpoint location. The continuous stream fires
    sub-second alerts for simple rules. The micro-batch stream handles
    complex stateful rules with slightly higher latency.

    Both write to the same alerts sink (Kafka topic or database).
    Downstream services don't care which mode produced the alert.

