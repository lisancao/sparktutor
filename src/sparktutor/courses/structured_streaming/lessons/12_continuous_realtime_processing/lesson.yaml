    This simulates the async micro-batch stream. Apply stateful rules:
    1. Add a 10-minute tumbling window on event_time with watermark
    2. Group by window + user_id, count transactions
    3. Filter where count > 3 (velocity violation)
    4. Add columns: `rule_name` ("velocity"), `severity` ("high"),
       `evidence` (concat "count=" with the count)
    5. Return the velocity alerts DataFrame

