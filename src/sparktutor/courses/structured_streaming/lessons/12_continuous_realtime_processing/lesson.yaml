    ## Continuous Processing Mode

    Spark 3.x introduced **continuous processing** as an experimental
    feature. Instead of planning and committing per batch, Spark
    launches long-running tasks that continuously poll the source and
    process records one at a time (or in very small groups):

    ```python
    query = (result_df.writeStream
        .outputMode("append")
        .format("console")
        .trigger(continuous="1 second")    # epoch interval
        .start())
    ```

    The `"1 second"` is the **epoch interval** — how often Spark
    commits offsets for fault tolerance. Records are processed
    immediately as they arrive; the epoch interval only controls how
    often checkpoints happen.

    This achieves **true millisecond-level latency** — records are
    processed as soon as they arrive, not batched.

