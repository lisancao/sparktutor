    ## Comparing the Three Modes

    | Feature | Micro-batch | Async Micro-batch | Continuous |
    |---------|------------|-------------------|------------|
    | Latency | 100ms-10s | 50ms-2s | 1-10ms |
    | Throughput | Highest | High | Lower |
    | Aggregations | Yes | Yes | No |
    | Joins | Yes | Yes | No |
    | Windows | Yes | Yes | No |
    | Exactly-once | Yes | Needs idempotent sink | No (at-least-once) |
    | Production ready | Yes | Yes (3.4+) | Experimental |
    | Checkpointing | Synchronous | Async (background) | Epoch-based |

    For PayGuard:
    - **Velocity rule** → Async micro-batch (needs aggregation, want low latency)
    - **Amount threshold** → Continuous (stateless, needs sub-second)
    - **Blocklist** → Continuous (stateless lookup)

