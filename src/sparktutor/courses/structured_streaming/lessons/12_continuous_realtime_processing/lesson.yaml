    ## What You'll Learn

    Everything you have built so far uses **micro-batch** processing —
    Spark collects data into small batches and processes them one at a
    time. This gives good throughput and exactly-once guarantees, but
    each batch has overhead: scheduling, planning, committing offsets.
    For PayGuard, micro-batch latency of 1-10 seconds may be acceptable.
    But some fraud patterns need **sub-second** detection.

    Spark offers two alternatives to micro-batch: **continuous processing
    mode** and the newer **async offset tracking**. This lesson covers
    both, along with the tradeoffs that determine which mode fits your
    use case.

    By the end of this lesson you will be able to:

    - Explain the three processing modes: micro-batch, continuous, async
    - Configure continuous processing with `trigger(continuous="1 second")`
    - Understand the latency vs. exactly-once tradeoff
    - Use async offset tracking for low-overhead micro-batch
    - Choose the right mode for different fraud detection rules
    - Design hybrid pipelines that mix processing modes

