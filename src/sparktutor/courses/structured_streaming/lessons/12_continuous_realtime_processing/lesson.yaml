    ## The Micro-Batch Model — What You've Been Using

    In micro-batch mode, Spark processes data in discrete batches:

    ```
    Time:   0s     2s     4s     6s     8s
            |---B1---|---B2---|---B3---|---B4---|
            plan     plan     plan     plan
            execute  execute  execute  execute
            commit   commit   commit   commit
    ```

    Each batch has three phases: **plan** (check source for new data,
    build query plan), **execute** (process the data), **commit** (write
    offsets to checkpoint). The planning and commit overhead is fixed —
    even a batch with 1 row pays the same overhead as one with 100K rows.

    This fixed overhead means micro-batch has a latency floor. Even with
    `trigger(processingTime="0 seconds")` (as-fast-as-possible), each
    batch takes at minimum 50-200ms for the planning/commit cycle.

    For PayGuard's velocity detection (lesson 7), this latency is fine.
    But for blocking a fraudulent transaction before it completes, you
    may need latency under 10ms.

- Class: text
  Depth: beginner
  Output: |
    Think of micro-batch like a bus route: the bus (batch) leaves every
    2 minutes whether it has 1 passenger or 50. If you arrive just after
    the bus leaves, you wait 2 minutes. The bus has overhead: stopping,
    opening doors, closing doors — even for one passenger.

    Continuous mode is like a taxi: each passenger (record) is picked up
    immediately and taken to the destination. No waiting for a full bus.
    But the taxi doesn't batch passengers, so it's less efficient when
    there's heavy traffic.

    The choice depends on what matters more: **latency** (taxi) or
    **throughput** (bus).

