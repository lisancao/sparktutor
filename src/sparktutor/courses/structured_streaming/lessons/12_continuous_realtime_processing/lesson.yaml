    ## Continuous Mode Internals

    In micro-batch mode, Spark's driver orchestrates each batch:
    1. Driver queries source for new offsets
    2. Driver creates a physical plan
    3. Driver schedules tasks on executors
    4. Executors process data
    5. Driver commits offsets

    In continuous mode, the driver launches **long-running tasks**
    (one per partition). Each task:
    1. Polls the source partition directly
    2. Processes each record immediately (no batching)
    3. Writes to the sink immediately

    The driver only intervenes for epoch commits — it signals tasks
    to report their current offsets, collects them, and writes to the
    checkpoint. Between epochs, tasks run autonomously.

    This architecture eliminates the per-batch scheduling overhead but
    means the driver has less control. State-dependent operations would
    require cross-task coordination, which is why they're not supported.

