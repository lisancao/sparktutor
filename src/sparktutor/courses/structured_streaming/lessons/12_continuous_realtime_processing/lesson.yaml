    ## Async Offset Tracking — The Middle Ground

    Spark 3.4+ introduced **asynchronous offset tracking** — a mode
    that keeps the micro-batch execution model but removes the
    synchronous offset commit from the critical path:

    ```python
    query = (result_df.writeStream
        .outputMode("append")
        .option("asyncProgressTrackingEnabled", "true")
        .option("asyncProgressTrackingCheckpointIntervalMs", "1000")
        .trigger(processingTime="0 seconds")
        .start())
    ```

    In standard micro-batch, each batch waits for the offset commit
    to complete before starting the next batch. With async tracking,
    the commit happens in a background thread. The next batch starts
    immediately.

    **Result:** micro-batch latency drops significantly (often 2-5x
    improvement) while still supporting aggregations, joins, and
    windowed operations.

    **Tradeoff:** on failure, Spark may reprocess a few more batches
    than standard micro-batch (those whose offsets hadn't committed
    yet). With an idempotent sink, this is acceptable.

