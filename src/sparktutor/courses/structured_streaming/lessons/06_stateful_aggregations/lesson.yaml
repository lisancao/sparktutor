    ## State Store Internals (Advanced)

    Spark stores state in a **state store** — typically RocksDB. Each
    partition has its own store. Keys are (group keys, optional window).
    Values are the aggregation buffer. On checkpoint, state is written
    to HDFS/S3. On recovery, state is restored. State store size is
    visible in the Spark UI under the Streaming tab. Monitor it — if it
    grows without bound, add watermarks or windows.

