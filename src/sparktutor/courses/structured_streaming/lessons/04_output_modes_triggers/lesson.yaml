    ## Exercise: Aggregation for All Output Modes

    Implement `aggregate_by_user` that groups transactions by user_id and
    computes tx_count (count) and amount_sum (sum of amount). This
    aggregation produces the same result regardless of output mode — the
    mode only affects *what gets written* each trigger (new rows, changed
    rows, or full table). In batch simulation we return the full result.

    The test harness validates: (1) each user has correct count and sum,
    (2) the aggregation logic would work with update or complete mode in
    a real streaming query. Append would require a watermark (Lesson 8).
