    ## Failure-Driven Learning: Wrong Mode in Action

    Imagine you run a groupBy count with append mode and no watermark.
    Spark fails with a clear error. The fix: add a watermark (if you use
    event time and can bound lateness) or switch to update/complete.

    If you use complete mode for a query that grows to millions of keys,
    you will see memory and I/O grow. The fix: add a watermark and use
    append or update so only new/changed rows are written.

