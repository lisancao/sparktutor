  Output: |
    ## What Happens When You Use the Wrong Mode

    | Operation     | Append | Update | Complete |
    |---------------|--------|--------|----------|
    | select, filter| ✓      | ✓      | ✓        |
    | groupBy (no wm)| ✗     | ✓      | ✓        |
    | groupBy (wm)   | ✓      | ✓      | ✓        |

    **Wrong**: append mode without watermark on aggregation → Spark throws
    "Append output mode not supported when there are streaming aggregations
    on streaming DataFrames/DataSets without watermarking."

    **Wrong**: using complete for a huge result table → memory pressure,
    slow writes. Use update with watermark when possible.

