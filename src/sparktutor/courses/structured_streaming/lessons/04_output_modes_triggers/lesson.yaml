    ## PayGuard's Aggregation Outputs

    PayGuard runs multiple streaming queries: one counts transactions per
    user (for velocity checks), another sums amounts per merchant. Each
    query needs the right **output mode** — what gets written to the sink
    each trigger. Use the wrong mode and you get errors or incorrect
    results. This lesson teaches you to choose correctly.

- Class: text
  Depth: all
  Output: |
    ## Append Mode: Only New Rows

    **Append** mode writes only rows that are *new* since the last trigger.
    Use for stateless transforms (select, filter, map) or for aggregations
    *with watermarks* (where late data can arrive).

    ```python
    # Stateless: each new row is output once
    (stream_df.filter(col("amount") > 100)
        .writeStream.outputMode("append").format("console").start())
    ```

    For aggregations *without* watermarks, append mode is **not supported** —
    Spark cannot know when a row is "final" for an unbounded group. You will
    get an error if you try.

- Class: text
  Depth: all
  Output: |
    ## Update Mode: Changed Rows Only

    **Update** mode writes only rows that *changed* since the last trigger.
    Use for aggregations (groupBy, count, sum) where you care about the
    latest value per key. Each micro-batch may update existing keys.

    ```python
    # Aggregation: output updated counts per user
    (stream_df.groupBy("user_id").count()
        .writeStream.outputMode("update").format("console").start())
    ```

    If user u1 had 3 transactions, then 2 more arrive, update mode outputs
    the row (u1, 5) — not (u1, 3) and (u1, 5). Only the changed row.

- Class: text
  Depth: all
  Output: |
    ## Complete Mode: Entire Result Table

    **Complete** mode writes the *entire* result table every trigger. Use
    for aggregations without watermarks (e.g., global count, top-N). The
    sink receives the full table each time.

    ```python
    (stream_df.groupBy("user_id").count()
        .writeStream.outputMode("complete").format("console").start())
    ```

    For large result tables, complete mode can be expensive — you're
    rewriting everything. For small tables (e.g., a few dashboard metrics),
    it's fine. PayGuard's merchant count dashboard uses complete mode.

