    ## Trigger Types

    | Trigger           | Behavior                              |
    |-------------------|---------------------------------------|
    | (default)         | Process as fast as possible           |
    | processingTime    | Every N seconds (e.g., "10 seconds")   |
    | availableNow      | Process all available data, then stop |
    | once              | Process one micro-batch, then stop    |
    | continuous        | Low-latency mode (experimental)       |

    ```python
    .trigger(processingTime="30 seconds")
    .trigger(availableNow=True)
    .trigger(once=True)
    ```

    PayGuard uses `processingTime="10 seconds"` for real-time detection.
    For batch-style testing, `availableNow` processes all pending data
    then stops — no need to keep the query running.

