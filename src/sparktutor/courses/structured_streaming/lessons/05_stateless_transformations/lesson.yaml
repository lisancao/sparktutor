    ## Analogy: The Assembly Line

    Stateless transforms are like an assembly line where each worker
    handles one item at a time. Worker A filters; Worker B adds a
    sticker; Worker C packs. No worker remembers what came before. Each
    transaction flows through independently. This is fast and scalable —
    no state to manage, no memory growth.

