    ## Enriching PayGuard Transactions

    Raw transaction events have tx_id, user_id, amount, event_time. For
    fraud detection, you need more: risk scores, merchant categories,
    time-of-day features. These come from **stateless** transformations —
    each row is processed independently. No history, no memory across
    batches. The same operations you use in batch work identically in
    streaming.

- Class: text
  Depth: all
  Output: |
    ## filter, select, withColumn — Identical to Batch

    Stateless transforms operate on each row in isolation. They do not
    need to remember previous rows. For streaming, this means append
    mode works: each new row is output once.

    ```python
    enriched = (stream_df
        .filter(f.col("amount") > 0)
        .select("tx_id", "user_id", "amount", "event_time")
        .withColumn("amount_usd", f.col("amount").cast("double")))
    ```

    PayGuard uses filter to drop test transactions (amount=0), select to
    project columns, and withColumn to add derived fields.

- Class: text
  Depth: all
