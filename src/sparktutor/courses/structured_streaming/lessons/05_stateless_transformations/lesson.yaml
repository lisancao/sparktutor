    ## flatMap and explode

    Sometimes one row becomes many. `explode` turns an array into
    multiple rows: [a, b, c] → 3 rows. `flatMap` applies a function
    that returns an iterator. For PayGuard, you might explode a list
    of linked transactions (e.g., a split payment) into separate rows.

    ```python
    from pyspark.sql.functions import explode

    # If tx has "linked_tx_ids" array
    exploded = stream_df.withColumn("linked_id", explode("linked_tx_ids"))
    ```

    Each row with N linked IDs becomes N rows. Stateless — no cross-row
    memory. Works with append mode.

