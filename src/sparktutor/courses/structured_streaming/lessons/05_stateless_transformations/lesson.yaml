    ## Adding Derived Columns

    Fraud detection needs features. You can compute them per-row:

    ```python
    from pyspark.sql.functions import hour, when

    enriched = (stream_df
        .withColumn("hour_of_day", hour("event_time"))
        .withColumn("time_of_day", when(hour("event_time") < 6, "night")
            .when(hour("event_time") < 12, "morning")
            .when(hour("event_time") < 18, "afternoon")
            .otherwise("evening"))
        .withColumn("risk_score", f.when(f.col("amount") > 1000, 0.8)
            .when(f.col("amount") > 500, 0.5)
            .otherwise(0.2)))
    ```

    risk_score is a simple rule-based heuristic. Later you might join with
    a model-scored table. time_of_day helps detect anomalies (e.g., night
    purchases in unusual time zones).

