    ## map vs withColumn

    `map` applies a function to each row and returns a new Row or dict.
    `withColumn` adds a column via an expression. For most cases,
    withColumn is preferred — it's optimized and works with the Catalyst
    optimizer. Use map when you need complex Python logic (e.g., calling
    an external API per row). For PayGuard's risk_score, withColumn is
    sufficient; for a model inference call, you might use map or a UDF.

