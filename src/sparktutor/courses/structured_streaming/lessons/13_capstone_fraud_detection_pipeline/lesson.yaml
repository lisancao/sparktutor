- Class: text
  Depth: all
  Output: |
    ## Pipeline Architecture

    ```
    Transactions (stream) → Enrich (account lookup) → Windowed velocity
    → Amount threshold → Merchant blocklist → Alerts (output)
    ```

    - **Enrich**: Stream-static join with account table (tier, risk_level)
    - **Velocity**: >5 tx per user in 10 min (window + watermark)
    - **Amount**: Single tx > 1000
    - **Blocklist**: Merchant in blocked set
    - **Alerts**: Combine all, add severity, output

- Class: text
  Depth: all
  Output: |
    ## Multiple Detection Rules

    PayGuard runs several rules in parallel (or in sequence):

    1. **Velocity**: groupBy window + user_id, count > 5
    2. **Amount threshold**: filter amount > 1000
    3. **Geo-impossible**: (future) same user, two locations in 5 min
    4. **Merchant blocklist**: join with blocked merchants

    Each rule produces alerts. You can union them or run separate
    queries. For the capstone, we combine velocity and amount in one
    pipeline.

- Class: text
  Depth: all
  Output: |
    ## Alert Output with Severity

    Each alert should have: tx_id, user_id, rule_name, severity, evidence.
    Severity: "high" (velocity, amount threshold), "medium" (blocklist).
    Evidence: e.g., "count=6 in window" or "amount=1500".

    ```python
    alerts = alerts.withColumn("severity", f.when(...).otherwise(...))
    ```

    Downstream systems consume alerts by severity. High → immediate
    block. Medium → review queue. Low → log only.

