    ## Combining Stream-Static and Windowed

    Order matters: enrich first (add account tier), then apply rules.
    Velocity rule needs window + watermark. Amount rule is stateless.
    Blocklist rule needs stream-static join with blocked_merchants_df.

    In batch simulation: we have transactions_df, accounts_df,
    blocked_merchants_df. Apply enrich, then apply each rule, union
    alerts, add severity column.

