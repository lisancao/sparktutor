    6. Returns the alerts DataFrame

    Input: transactions_df, accounts_df, blocked_merchants_df (list of
    merchant_ids). Output: alerts with tx_id, user_id, rule_name, severity,
    evidence. Same logic works for streaming with readStream, writeStream,
    checkpoint. Batch simulation validates the full pipeline.
