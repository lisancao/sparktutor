    ## Exercise: Complete PayGuard Fraud Detection Pipeline

    Implement `run_fraud_detection_pipeline` that:

    1. Enriches transactions with accounts (stream-static join on user_id)
    2. Applies velocity rule: 10-min window + watermark, count > 5 per user
    3. Applies amount rule: amount > 1000
    4. Applies blocklist rule: merchant_id in blocked_merchants
