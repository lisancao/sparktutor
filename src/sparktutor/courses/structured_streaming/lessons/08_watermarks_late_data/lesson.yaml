    ## Tuning Watermarks

    - **Too tight** (e.g., 1 min): Many late events dropped. If your
      data often arrives 2-3 minutes late, use at least 5 minutes.
    - **Too loose** (e.g., 24 hours): State holds 24 hours of windows.
      For 10-min windows, that's 144 windows per key. Scale by users →
      huge state. Use the minimum that covers your actual latency.
    - **Rule of thumb**: watermark >= 2× your p99 event latency.

