    ## Writing to Multiple Sinks

    A single streaming query writes to one sink. To write to multiple
    sinks (e.g., console and file), you have two options:

    1. **Multiple queries**: Start two writeStreams from the same
       DataFrame. Each consumes the source independently. Use with
       replayable sources (Kafka, checkpointed file source).
    2. **foreachBatch**: In the batch function, write to multiple
       destinations. One query, one sink type, but multiple outputs.

    PayGuard uses foreachBatch to write alerts to Parquet and Kafka in
    one pass — avoids duplicate processing.

