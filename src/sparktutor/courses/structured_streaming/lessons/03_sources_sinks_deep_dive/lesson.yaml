    ## Kafka Sink for Alerts

    PayGuard publishes fraud alerts to a Kafka topic for downstream
    consumers (e.g., blocklist service, customer notification):

    ```python
    (alerts_df.writeStream
        .format("kafka")
        .option("kafka.bootstrap.servers", "broker:9092")
        .option("topic", "payguard-alerts")
        .option("checkpointLocation", "/checkpoints/alerts")
        .start())
    ```

    The DataFrame must have `key` and `value` columns (or `topic`).
    Kafka sink supports append and update modes. Exactly-once requires
    idempotent Kafka producer and transaction support.

