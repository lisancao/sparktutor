    ## Kafka Source — The Production Standard

    Kafka is the dominant streaming platform. PayGuard's real-time
    gateway publishes transactions to the `payguard-transactions` topic:

    ```python
    stream = (spark.readStream.format("kafka")
        .option("kafka.bootstrap.servers", "broker1:9092,broker2:9092")
        .option("subscribe", "payguard-transactions")
        .option("startingOffsets", "latest")
        .load())
    ```

    Kafka returns rows with `key`, `value`, `topic`, `partition`, `offset`,
    `timestamp`. You typically parse `value` (bytes) into your schema:

    ```python
    from pyspark.sql.functions import from_json
    parsed = stream.select(from_json(col("value").cast("string"), schema).alias("data"))
    transactions = parsed.select("data.*")
    ```

