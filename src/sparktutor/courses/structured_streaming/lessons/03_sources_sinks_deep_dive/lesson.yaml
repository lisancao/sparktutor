    ## PayGuard's Data Pipeline Architecture

    PayGuard receives transactions from multiple sources: file drops from
    legacy systems, Kafka topics from real-time gateways, and synthetic
    rate streams for testing. Alerts must go to the console (debugging),
    files (audit trail), and Kafka (downstream systems). This lesson
    covers the major sources and sinks you will use in production.

- Class: text
  Depth: all
  Output: |
    ## File Source: CSV, JSON, Parquet

    The file source watches a directory. New files = new micro-batches.
    Spark uses file modification time to order and assign files. Options:

    ```python
    # CSV
    stream = (spark.readStream.format("csv")
        .option("header", "true")
        .schema(schema).load("/data/incoming/"))

    # JSON
    stream = (spark.readStream.format("json")
        .schema(schema).load("/data/incoming/"))

    # Parquet (often best for performance)
    stream = (spark.readStream.format("parquet")
        .load("/data/incoming/"))
    ```

    Parquet can infer schema from files, but for consistency with other
    formats, providing schema is recommended. PayGuard's legacy system
    drops JSON files; the real-time gateway writes Parquet.

