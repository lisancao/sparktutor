    ## foreach and foreachBatch

    **foreach**: Called for each row. Use for custom sinks (e.g., call an
    API, write to a database per row). Must be idempotent for exactly-once.

    **foreachBatch**: Called with each micro-batch as a DataFrame. You can
    use batch APIs (e.g., `df.write.parquet()`). More efficient for
    bulk writes. PayGuard uses foreachBatch to write alerts to both
    Parquet and a REST API in one pass:

    ```python
    def write_batch(batch_df, batch_id):
        batch_df.write.mode("append").parquet("/alerts/")
        batch_df.write.format("jdbc").option("url", "...").save()
    ```

