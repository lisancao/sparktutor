    ## Sinks: Where Results Go

    | Sink      | Use Case                    | Output Mode      |
    |-----------|-----------------------------|------------------|
    | console   | Debugging, development      | append, update, complete |
    | memory    | In-process testing          | append, complete  |
    | file      | Parquet/ORC for audit       | append only      |
    | foreach   | Custom logic per row        | append, update   |
    | foreachBatch | Batch-level custom write | append, update   |
    | Kafka     | Downstream consumers         | append, update   |

    PayGuard writes alerts to console (dev), Parquet (audit), and Kafka
    (alerting service). File sink requires `path` and `checkpointLocation`.

