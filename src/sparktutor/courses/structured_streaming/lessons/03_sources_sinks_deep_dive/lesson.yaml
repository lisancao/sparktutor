    ## Rate Source — Synthetic Data for Testing

    When you need to test streaming logic without Kafka or files, the
    rate source generates rows at a configurable rate:

    ```python
    rate_stream = (spark.readStream.format("rate")
        .option("rowsPerSecond", 10)
        .option("numPartitions", 2)
        .load())
    ```

    Each row has `timestamp` and `value` (incrementing long). You can
    join this with static data or use it to simulate event timing. Useful
    for load testing and development when no real stream exists.

