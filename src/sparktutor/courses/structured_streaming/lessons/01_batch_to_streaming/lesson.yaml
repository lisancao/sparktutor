    ## Same Transformations, Different Execution

    When you write `stream_df.groupBy("user_id").count()`, Spark builds a
    logical plan. For batch, it executes once. For streaming, it executes
    incrementally: each micro-batch gets new rows, Spark updates the
    aggregation state, and outputs the new/changed results. The *logic* is
    identical; the *runtime behavior* is different.

    This means you can develop and test streaming logic using batch
    DataFrames. The same code that works for `stream_df` works for `batch_df`
    — a powerful pattern for unit testing and dry-run validation.

