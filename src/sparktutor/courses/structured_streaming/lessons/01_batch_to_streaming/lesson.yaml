    ## Micro-Batch Execution Under the Hood

    Spark runs streaming queries in **micro-batches**. Each trigger (e.g.,
    every 10 seconds) fetches new data from the source, runs your
    transformations on that batch, and writes results to the sink. Stateful
    operations (aggregations, joins) maintain state across batches. The
    micro-batch model balances latency (small batches = faster) with
    throughput (larger batches = fewer overheads). PayGuard's pipeline will
    process transaction events in micro-batches of a few seconds.

