    ## Why Schema Is Required for Streaming

    In batch, you can use `inferSchema=True` — Spark samples the data to
    guess the schema. In streaming, there is no "complete" dataset to sample.
    Data arrives over time. You must provide an explicit schema:

    ```python
    from pyspark.sql.types import StructType, StructField, StringType, DoubleType, TimestampType

    tx_schema = StructType([
        StructField("tx_id", StringType(), False),
        StructField("user_id", StringType(), False),
        StructField("amount", DoubleType(), False),
        StructField("event_time", TimestampType(), False),
    ])
    stream_df = spark.readStream.schema(tx_schema).csv("/data/transactions/")
    ```

    This schema is used for every micro-batch. PayGuard's transaction schema
    includes tx_id, user_id, merchant_id, amount, event_time, and more.

