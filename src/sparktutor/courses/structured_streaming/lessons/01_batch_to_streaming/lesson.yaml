    ## readStream vs read, writeStream vs write

    The API is nearly identical. Swap `read` for `readStream` and `write`
    for `writeStream`:

    ```python
    # Batch: read once, process, write once
    batch_df = spark.read.csv("/data/transactions/")
    result = batch_df.groupBy("user_id").count()
    result.write.parquet("/output/")

    # Streaming: read continuously, process incrementally, write continuously
    stream_df = spark.readStream.schema(schema).csv("/data/transactions/")
    result = stream_df.groupBy("user_id").count()
    result.writeStream.outputMode("complete").format("console").start()
    ```

    The transformations (`groupBy`, `count`) are the same. The execution
    model changes: batch runs once; streaming runs forever in micro-batches.

