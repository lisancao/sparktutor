    ## The PayGuard Fraud Detection Challenge

    **PayGuard** is a fintech company processing millions of transactions daily.
    Their fraud team needs to detect suspicious activity *as it happens* — not
    hours later when a batch job finishes. A stolen card used for 10 purchases
    in 5 minutes must trigger an alert before the 11th transaction.

    Over the next 12 lessons, you will build PayGuard's real-time fraud
    detection system. Every lesson adds a real capability: streaming ingestion,
    enrichment, windowed velocity checks, watermarks for late data, and
    production alerting. By the capstone, you will have a complete pipeline.

