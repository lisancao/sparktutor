    ## The Unbounded Table Model

    Structured Streaming treats a stream as a **continuously appended table**.
    New events are like new rows being inserted. Your query runs incrementally:
    each micro-batch processes the new rows and updates the result. You never
    "finish" — the table keeps growing.

    ```
    Input stream (unbounded):     Output table (incremental):
    t1: tx_1, tx_2               → result_1
    t2: tx_3, tx_4, tx_5          → result_2 (builds on result_1)
    t3: tx_6, tx_7                → result_3 (builds on result_2)
    ...
    ```

    The same DataFrame API you use for batch works for streaming. Spark
    figures out how to run it incrementally.

