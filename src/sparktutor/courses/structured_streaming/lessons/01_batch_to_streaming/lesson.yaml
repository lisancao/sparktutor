    ## Why Batch Processing Isn't Enough

    Imagine PayGuard runs a daily batch job at midnight. It processes all
    transactions from the previous day and flags suspicious patterns. By the
    time the report is ready at 6 AM, the fraudster has already drained the
    victim's account. **Latency matters.** For fraud detection, seconds and
    minutes — not hours — separate effective prevention from damage control.

    Batch processing assumes you have a *bounded* dataset: a fixed set of
    files or table partitions. Streaming assumes *unbounded* data: events
    arrive continuously, and you process them as they come.

