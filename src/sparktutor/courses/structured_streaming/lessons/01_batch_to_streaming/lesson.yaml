    ## Analogy: The Security Guard vs. The Night Auditor

    **Batch processing** is like a night auditor who reviews all the day's
    transactions after the hotel closes. They find problems, but the damage
    is already done. **Streaming** is like a security guard watching the
    lobby in real time. They see each transaction as it happens and can
    intervene immediately when something looks wrong.

    PayGuard needs the security guard model — continuous monitoring, not
    post-mortem analysis.

