    ## PayGuard's Streaming Uptime

    PayGuard's fraud detection runs 24/7. When a node crashes, a deploy
    fails, or the cluster restarts, the query must recover without data
    loss or duplication. **Checkpointing** is the mechanism. Without it:
    restart from scratch and reprocess everything (or worse, lose
    offsets and duplicate or skip data).

- Class: text
  Depth: all
  Output: |
    ## What Happens Without Checkpoints

    When your streaming query crashes:
    - **No checkpoint**: Spark doesn't know which offsets were processed.
      On restart, it might re-read from the beginning (duplicates) or
      use a default (skip data). State is lost. Exactly-once is
      impossible.
    - **With checkpoint**: Spark stores offsets, state, and metadata in
      the checkpoint directory. On restart, it reads the checkpoint,
      resumes from the last committed offset, and restores state. No
      duplicates, no gaps (for idempotent sinks).

- Class: text
  Depth: all
  Output: |
    ## Checkpoint Location

    ```python
    query = (result_df.writeStream
        .outputMode("update")
        .option("checkpointLocation", "/checkpoints/payguard_fraud")
        .format("console")
        .start())
    ```

    The checkpoint stores:
    - **Offsets**: Which source records were processed (Kafka offsets,
      file paths)
    - **State**: Aggregation state (for groupBy, windows)
    - **Metadata**: Query ID, batch IDs, etc.

    Never share a checkpoint between two different queries. Never clear
    the checkpoint without understanding the consequences.

- Class: text
  Depth: all
  Output: |
    ## Exactly-Once Semantics

    Exactly-once requires:
    1. **Replayable source**: Kafka, file source — can re-read from
       offsets. Socket is not replayable.
    2. **Checkpoint**: Tracks what was processed.
    3. **Idempotent sink**: Writing the same data twice produces the
       same result. Parquet with unique paths per batch (e.g., batch_id
       in path) is idempotent. Console is not (you'd see duplicates).
    4. **Deterministic processing**: Same input → same output.

    PayGuard uses Kafka (replayable) + checkpoint + Parquet (idempotent
    with batch_id in path). Exactly-once for alerts.

