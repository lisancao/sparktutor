  Output: |
    ## Recovery: When to Clear the Checkpoint

    - **Logic change** (e.g., you change the aggregation): The old
      checkpoint has incompatible state. Clear it and restart. You will
      reprocess from the beginning. For Kafka, use "earliest" or
      specific offsets to start fresh.
    - **Bug fix** (same logic): Keep checkpoint. Restart. Spark resumes.
    - **New query**: Never reuse an old checkpoint. Use a new path.

