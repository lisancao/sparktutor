course:
  id: messy_data
  title: "Messy Data with Apache Spark 4.2: Zero to Internals"
  description: "Semi-structured, unstructured and multimodal data with Spark 4.2 at three levels. Basics follows the shape of Learning Spark: how Spark runs, schemas and cleaning, every built-in source from CSV to Avro, VARIANT, documents, images and audio, UDFs, your first Python data source, plans, streaming, Delta, text analytics and inference. Intermediate builds production Python data sources (files, APIs, databases, pushdown, writers, streaming, packaging), UDTFs, tuning, quality-checked ingestion, similarity search and entity resolution. Advanced goes inside the engine: Catalyst and the Python worker protocol, JVM DSv2 connectors, session extensions and Spark Connect plugins, Parquet and VARIANT internals, distributed algorithms, streaming state internals, reliability, deployment, observability and an upstream bug from repro to fix"
  version: "2.0.0"
  requires_lakehouse: false
  prerequisites:
    - "Python 3.10+ and basic Python (functions, classes, dicts); no Spark experience needed"
    - "Java 17 or 21 (Java 25 also works); the advanced Java lessons need a full JDK with javac"
    - 'pip install "pyspark[connect,pipelines]==4.2.0" "pandas<3" (SparkTutor installs both)'
    - "Recommended alongside, not required: the learning_spark course; the intermediate capstone also uses spark_declarative_pipelines lessons 'Bronze: Ingesting Raw Data', 'Silver: Types, Duplicates and Quarantine' and 'Gold: Aggregates for the Business'"
  lessons:
