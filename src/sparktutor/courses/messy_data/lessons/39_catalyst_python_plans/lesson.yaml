    ## Spark Connect: The Plan as Protobuf

    On Spark Connect the client has no Catalyst. A DataFrame is a tree of
    `LogicalPlan` objects in `pyspark.sql.connect.plan` that serializes
    to the `Relation` protobuf message
    (`sql/connect/common/src/main/protobuf/spark/connect/relations.proto`).
    You can print it. With a local Connect server (run under the shared
    port lock, with `SPARK_TESTING=1`):

    ```python
    spark = SparkSession.builder.remote("local[2]").getOrCreate()
    df = (spark.read.text(os.path.abspath("data/messy/logs/access.log"))
          .select(F.split("value", " ")[6].alias("path"))
          .filter(area("path") == "api"))
    p = df._plan.to_proto(spark.client)
    print(p)
    ```

    ```text
    root {
      common { plan_id: 2 }
      filter {
        input {
          common { plan_id: 1 }
          project {
            input {
              common { plan_id: 0 }
              read { data_source { format: "text" schema: ""
                options { key: "wholetext" value: "false" }
                paths: ".../data/messy/logs/access.log" } }
            }
            expressions { alias { expr { unresolved_extract_value { ... } } name: "path" } }
          }
        }
        condition {
          unresolved_function {
            function_name: "=="
            arguments {
              common_inline_user_defined_function {
                function_name: "area"
                deterministic: true
                arguments { unresolved_attribute { unparsed_identifier: "path" } }
                python_udf {
                  output_type { string { collation: "UTF8_BINARY" } }
                  eval_type: 101
                  command: "\200\005\225\007\003\000\000..."
                  python_ver: "3.12"
                }
              }
            }
            arguments { literal { string: "api" } }
          }
        }
      }
    }
    ```

    (Reformatted to fewer lines; the real output also carries
    `python_origin` entries with the file and line of each call, used
    for error messages.) The whole message was 2069 bytes. Everything
    is **unresolved**: names are strings, functions are names, and the
    UDF is its cloudpickled bytes plus the eval type and the client's
    Python version.

    On the server, `SparkConnectPlanner`
    (`sql/connect/server/src/main/scala/org/apache/spark/sql/connect/planner/SparkConnectPlanner.scala`)
    turns the message into an unresolved Catalyst plan:
    `transformRelation` dispatches on the relation type
    (`case proto.Relation.RelTypeCase.FILTER => transformFilter(...)`),
    and `transformPythonUDF` builds a `PythonUDF` from the command bytes,
    with the server's Python executable and the session's artifacts
    added to its includes. From there it is the same `QueryExecution` as
    in a classic session, and the plans you print with `explain()` are
    the same.

