    ## Grouped and Map Operators

    `mapInPandas`, `mapInArrow`, `applyInPandas` and friends are not
    expressions; they are logical operators of their own, defined in
    `sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/plans/logical/pythonLogicalOperators.scala`
    and planned by `SparkStrategies.BasicOperators`. From 4.2.0 runs over
    the `files` source:

    ```text
    df.mapInPandas(lambda it: it, df.schema).filter("kind = 'png'")

    *(2) Filter (isnotnull(kind#34) AND (kind#34 = png))
    +- MapInPandas <lambda>(path#29, kind#30, size#31L)#32, [path#33, kind#34, size#35L], false
       +- *(1) Project [path#29, kind#30, size#31L]
          +- BatchScan files[path#29, kind#30, size#31L] (Python) RuntimeFilters: []
    ```

    ```text
    df.groupBy("kind").applyInPandas(lambda p: p.head(1), df.schema)

    AdaptiveSparkPlan isFinalPlan=false
    +- FlatMapGroupsInPandas [kind#30], <lambda>(path#29, kind#30, size#31L)#36, [path#37, kind#38, size#39L]
       +- Sort [kind#30 ASC NULLS FIRST], false, 0
          +- Exchange hashpartitioning(kind#30, 200), ENSURE_REQUIREMENTS, [plan_id=132]
             +- Project [kind#30, path#29, kind#30, size#31L]
                +- BatchScan files[...] (Python) RuntimeFilters: []
    ```

    What to read from them:

    - The output columns of a map operator have **new expression IDs**
      (`kind#34`, not `kind#30`). Catalyst cannot know that your
      function passes `kind` through unchanged, so the filter on
      `kind#34` cannot move below `MapInPandas`. Filter **before**
      `mapInPandas` when the filter does not depend on its output.
    - The trailing `false` is the `isBarrier` flag
      (`mapInPandas(..., barrier=True)` runs all tasks of the stage
      together, for distributed training).
    - `FlatMapGroupsInBatchExec` declares a required distribution
      (`ClusteredDistribution` on the keys) and ordering, so the planner
      adds an `Exchange` and a `Sort`. Each group is then fed to Python
      as one pandas DataFrame, which is why one huge group can run a
      worker out of memory (more in "Memory, Spill and Very Large
      Files").
    - These operators are opaque for column pruning as well: the
      `Project` feeds every input column to Python, used or not. Select
      only the columns the function needs before calling it.

