    ## What You'll Learn

    "Plans, Partitions and Caching" taught you to read `explain()`, and
    "Filter Pushdown" showed what a Python data source receives from the
    optimizer. This lesson follows a query that contains Python through
    every phase of Catalyst and the physical planner, and explains the
    shapes you see in its plans.

    By the end of this lesson you will be able to:

    - Get each phase of a query (parsed, analyzed, optimized, physical,
      executed) as text and as JVM objects, and watch individual rules
      rewrite a plan with `spark.sql.planChangeLog.*`
    - Explain how `ExtractPythonUDFs` turns UDF calls into
      `ArrowEvalPython` and `BatchEvalPython` nodes, when it fuses
      several UDFs into one node and when it cannot
    - Predict which filters reach a file scan when a query mixes native
      expressions and Python, and why a nondeterministic UDF changes that
    - Show, with call counts, when Spark 4.2.0 runs a Python UDF more
      than once per row, and rewrite the query so it runs once
    - Name the classes that plan a Python data source (`PythonDataSourceV2`,
      `PythonScanBuilder`, `PythonScan`, `PythonBatch`) and the Python
      planning workers they call
    - Explain why Python nodes split whole-stage code generation
    - Recognise a 4.2.0 hang caused by a new columnar path into Arrow UDFs
      (SPARK-58241) and switch it off
    - Show the protobuf plan a Spark Connect client sends, and explain
      what lazy analysis on Connect means for errors
    - Inspect plans programmatically, in tests, from the JVM tree or from
      the formatted text

