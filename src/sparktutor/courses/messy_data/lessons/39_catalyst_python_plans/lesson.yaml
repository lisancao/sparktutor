    ## Summary

    - A query moves through `QueryExecution`: `logical`, `analyzed`,
      `optimizedPlan`, `sparkPlan`, `executedPlan`, `toRdd`. In a classic
      session each is a JVM object you can walk with `nodeName()` and
      `children()`; descend into `AdaptiveSparkPlan.executedPlan()`.
    - Rules run in batches; `spark.sql.planChangeLog.level=WARN` with
      `.rules` or `.batches` shows each rewrite, and
      `RuleExecutor.dumpTimeSpent()` shows where planning time goes.
    - In 4.2, `@udf` is Arrow-optimized by default (eval type 101).
      `ExtractPythonUDFs`, in the `Extract Python UDFs` batch near the
      end of optimization, inserts `ArrowEvalPython` / `BatchEvalPython`
      below the operator that uses the UDF and fuses UDFs of the same
      eval type; different eval types need separate nodes.
    - Native conditions next to a UDF are still pushed; a filter written
      after a **nondeterministic** UDF is not; a UDF used as a predicate
      never reaches the source. Map and grouped operators give their
      output new IDs, so nothing moves below them.
    - On 4.2.0 a filter on a Python UDF's output column evaluates the UDF
      twice (alias substitution puts it in two operators). The guard of
      SPARK-47672 covers Scala UDFs only; SPARK-59693 adds Python in
      4.4.0. Filter first and use `asNondeterministic()`, go native, or
      materialize.
    - Python data sources: `PythonDataSourceV2`, `PythonScanBuilder`
      (filters only, so no column pruning), `PythonScan`, `PythonBatch`,
      planning workers on the driver, reads as eval type 207 on
      executors. The planned read lives on the provider instance, which
      is the root of the 4.2.0 plan-reuse bug.
    - Python nodes are not `CodegenSupport`, so they end codegen stages.
    - On 4.2.0, an Arrow UDF straight over a vectorized Parquet scan can
      hang (SPARK-58241, fixed in 4.2.1): set
      `spark.sql.execution.arrow.pythonUDF.columnarInput.enabled=false`.
    - Spark Connect sends an unresolved protobuf plan
      (`df._plan.to_proto(client)`); `SparkConnectPlanner` builds the
      Catalyst plan on the server; analysis errors appear at the first
      schema call or action.

    Next: **The Python Worker Protocol**, which follows a UDF out of the
    plan and into the Python process that runs it, down to the bytes on
    the socket.
