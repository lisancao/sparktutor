    ## The Running Example

    The examples use the web server log `data/messy/logs/access.log`
    (200 lines), parsed with a regular expression and written to Parquet
    in a temporary folder, so that the plans show a real file scan with
    pushed filters:

    ```python
    LOG = r'^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) (\S+) [^"]*" (\d{3}) (\d+)'
    raw = spark.read.text("data/messy/logs/access.log")
    logs = raw.select(F.regexp_extract("value", LOG, 1).alias("ip"),
                      F.regexp_extract("value", LOG, 4).alias("path"),
                      F.regexp_extract("value", LOG, 5).cast("int").alias("status"))
    logs.write.parquet(tmp + "/access")
    df = spark.read.parquet(tmp + "/access")

    @F.udf("string")
    def area(path):
        # "/api/orders/42?session=s9" -> "api"; "/?session=s1" -> "home"
        return path.split("?")[0].split("/")[1] or "home"
    ```

    Of the 200 requests, 98 have status 200, and 31 of those are API
    calls. Keep those numbers in mind; call counts later in the lesson
    are measured against them.

    Every session in this lesson sets one configuration that you will
    understand by the end:
    `spark.sql.execution.arrow.pythonUDF.columnarInput.enabled=false`.
    Without it, some of these queries hang forever on 4.2.0.

