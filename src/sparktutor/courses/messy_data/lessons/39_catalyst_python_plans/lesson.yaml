    ## How a Python Data Source Is Planned

    A Python data source looks like any DSv2 source to Catalyst. The
    classes are in
    `sql/core/src/main/scala/org/apache/spark/sql/execution/datasources/v2/python/`:

    | Class | Role | Python worker it starts |
    |---|---|---|
    | `PythonDataSourceV2` | The `TableProvider`; creates the Python `DataSource` once per instance (`getOrCreateDataSourceInPython`) and holds the planned read (`readInfo`) | `pyspark.sql.worker.create_data_source` |
    | `PythonTable` | `Table` with `SupportsRead` (and write) | |
    | `PythonScanBuilder` | `ScanBuilder` with `SupportsPushDownFilters` only | `pyspark.sql.worker.data_source_pushdown_filters` (when the flag is on and filters exist) |
    | `PythonScan` | `Scan`; `description` is `(Python)`, metadata `PushedFilters` and `ReadSchema` | |
    | `PythonBatch` | `Batch`: `planInputPartitions()` and `createReaderFactory()` | `pyspark.sql.worker.plan_data_source_read` |
    | `PythonPartitionReaderFactory` | On executors: runs `read()` | the normal UDF worker, eval type 207 |

    All of these "planning workers" run on the **driver**, through
    `PythonPlannerRunner`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/python/PythonPlannerRunner.scala`),
    which starts a Python process with the same factory as executor
    workers, writes one request, reads one answer and releases the
    worker. Pushdown and partition planning share a call: when filters
    are pushed, `data_source_pushdown_filters` also returns the
    partitions and the pickled read function, and `PythonScanBuilder`
    stores that result with `ds.setReadInfo(...)`, saving a second
    worker call.

    On executors there is no special reader in the JVM:
    `PythonPartitionReaderFactory.createReader` builds a
    `MapInBatchEvaluatorFactory` with eval type `SQL_MAP_ARROW_ITER_UDF`
    and feeds it **one row**, the pickled partition. Your `read()` runs
    as if it were the function of a `mapInArrow`; tuples you yield are
    turned into Arrow batches in Python, which is why "Types, Arrow and
    Performance" found the conversion cost in Python.

    Three consequences you can now explain from the classes:

    - **No column pruning.** `PythonScanBuilder` does not implement
      `SupportsPushDownRequiredColumns`, so `ReadSchema` is always the
      full schema ("Filter Pushdown" observed this). No limit or
      aggregate pushdown either. "A DSv2 Connector in Java" implements
      all three.
    - **`PushedFilters` only in `explain("formatted")`.** It is metadata
      of `PythonScan` (`getMetaData`), which the formatted mode prints
      per node; the one-line `BatchScan files[...] (Python)` does not.
    - **The 4.2.0 plan-reuse bug.** `readInfo` lives on the
      `PythonDataSourceV2` instance, and that instance belongs to the
      relation the DataFrame (or a view) holds, not to one scan. So
      **every scan of the same relation shares one planned read**. A
      scan whose filters cannot be pushed never calls `pushFilters`, so
      its `PythonBatch` calls `getOrCreateReadInfo` and finds whatever
      planned read another scan of that relation left there, possibly a
      **filtered** one. Across queries, that is the wrong-results trap
      from "Filter Pushdown" (a later `df.count()` returns the filtered
      count). It also happens **inside one query** that reads the
      relation twice: a `d.union(d.filter(...))` plans two scans of one
      relation. This lesson's `files` source is its own, not the one
      from "Filter Pushdown": its `kind` is the bare file extension
      (`png`, `json`), not a category such as `image`, and it lists all
      of `data/messy`, which has grown many folders since the early
      lessons, so its counts are larger and will keep changing. Over
      that folder `d.union(d.filter("kind = 'png'")).count()` should be
      the number of files plus the number of PNGs; at the time of
      writing (190 files, 53 PNGs) it returned 106, twice the PNG count,
      on the first run and the next: the unfiltered side read the
      PNG-only plan too. "From Wrong Results to a Fix: An Upstream Case Study"
      takes it apart and reads the fix on Spark's master branch, which
      keeps the planned read on each scan.

    On Spark Connect it is worth knowing that the server caches
    translated plans per session (`spark.connect.session.planCache.enabled`,
    internal, default `true`, since 4.0), and since 4.1 always caches
    the translation of data source reads
    (`spark.connect.session.planCache.alwaysCacheDataSourceReadsEnabled`,
    internal, default `true`). That is one reason the reuse trap appears
    on Connect as well: two DataFrames built from the same read can share
    one relation.

