    ## The Advanced Level

    The basics level taught Spark's built-in ways to read messy data
    and the core of the engine as a user sees it. The intermediate level
    built production tools on Spark's public APIs: Python data sources
    that push filters, write atomically and stream, UDTFs, tuning,
    quality-checked ingestion, similarity search, entity resolution and
    inference. The advanced level goes **inside the engine** and
    **extends it**.

    You will read Spark's source (always the 4.2.0 tag, with file paths
    you can open), look at plans as objects rather than pictures, watch
    the bytes that cross between the JVM and Python, write Java against
    Spark's own interfaces (a DSv2 connector, Catalyst rules and native
    expressions, Spark Connect plugins), take Parquet and VARIANT apart
    byte by byte, build distributed algorithms (LSH, IVF, connected
    components, sketches) from primitives, and prove reliability with
    fault injection. The level ends with an upstream case study, from a
    wrong result to a fix in Spark itself, and a final project: your own
    connector.

    It assumes the basics and intermediate levels, especially "Your
    First Python Data Source" and "Plans, Partitions and Caching" from
    the basics, and "Types, Arrow and Performance", "Filter Pushdown",
    "Tuning Python on Spark" and "Packaging, Registration, Testing and
    Debugging" from the intermediate level. Lessons here prefer
    evidence you produce yourself (a plan node, a log line, a hexdump, a
    JVM object reached through `spark._jvm`) over statements in prose.
    Exercises check harder properties than "the answer is right": how
    many times a function ran, which bytes were read, what the plan
    looks like after a rewrite.

    A note on the tools: several experiments reach into the JVM through
    Py4J (`df._jdf`, `spark._jvm`). That only works in a **classic**
    session, which is what SparkTutor's `spark-submit` exercises use.
    Experiments that need Py4J say so; on Spark Connect, read plans as
    text, or build a plugin as in "Spark Connect Plugins".

