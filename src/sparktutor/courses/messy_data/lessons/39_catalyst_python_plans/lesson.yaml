    ## The Phases as Objects

    In a classic session, `df._jdf` is the JVM `Dataset` behind a
    DataFrame, and its `queryExecution()` gives you every phase as a
    JVM object through Py4J:

    ```python
    q = df.filter(F.col("status") == 200).withColumn("area", area("path"))
    qe = q._jdf.queryExecution()
    print(qe.logical().toString())
    print(qe.analyzed().getClass().getName())
    print(qe.executedPlan().getClass().getName())
    ```

    ```text
    'Project [unresolvedstarwithcolumns(area, <lambda>('path)#17, None)]
    +- Filter (status#8 = 200)
       +- Relation [ip#6,path#7,status#8] parquet

    org.apache.spark.sql.catalyst.plans.logical.Project
    org.apache.spark.sql.execution.WholeStageCodegenExec
    ```

    (The UDF in this run was a lambda, hence `<lambda>`.) The parsed
    plan shows what `withColumn` really builds in 4.2: an
    `unresolvedstarwithcolumns` projection that the analyzer expands.

    Every plan node is a `TreeNode`: `nodeName()`, `children()` (a Scala
    `Seq`, so use `.length()` and `.apply(i)` from Python),
    `treeString()`, `simpleString(maxFields)`, and node-specific members
    such as `condition()` on a `FilterExec`. This is how the exercise
    walks plans:

    ```python
    def walk(plan, depth=0):
        yield depth, plan
        if plan.nodeName() == "AdaptiveSparkPlan":
            yield from walk(plan.executedPlan(), depth + 1)
            return
        children = plan.children()
        for i in range(children.length()):
            yield from walk(children.apply(i), depth + 1)
    ```

    Walking the executed plan of a nondeterministic-UDF query printed:

    ```text
    WholeStageCodegen (2)
      Project
        Filter
          InputAdapter
            ArrowEvalPython
              WholeStageCodegen (1)
                Filter
                  ColumnarToRow
                    InputAdapter
                      Scan parquet
    ```

    Three details: `explain()` hides `WholeStageCodegen` and
    `InputAdapter` nodes and shows `*(n)` instead; the Parquet scan's
    `nodeName()` is `Scan parquet` (with a trailing space), while
    `explain()` prints `FileScan parquet`; and a plan with an exchange
    starts with `AdaptiveSparkPlan`, a leaf as far as `children()` is
    concerned, so you must descend into its `executedPlan()` yourself.

    The tracker records when each phase ran:
    `qe.tracker().phases()` printed
    `Map(planning -> PhaseSummary(...), optimization -> ..., analysis -> ...)`
    with start and end times in milliseconds.

