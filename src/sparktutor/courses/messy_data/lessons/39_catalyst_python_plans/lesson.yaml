    ## Whole-Stage Codegen and Why Python Splits It

    The `*(1)`, `*(2)` prefixes in a physical plan are **codegen stage
    IDs**. `CollapseCodegenStages`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/WholeStageCodegenExec.scala`)
    fuses chains of operators that implement `CodegenSupport` into one
    generated Java class whose `processNext()` loops over rows with no
    virtual calls between operators. `explain("codegen")` prints the
    generated source. For the UDF query with a pushed filter:

    ```text
    Found 2 WholeStageCodegen subtrees.
    == Subtree 1 / 2 (maxMethodCodeSize:462; maxConstantPoolSize:166(0.25% used); numInnerClasses:0) ==
    *(1) Filter (isnotnull(status#9) AND (status#9 = 200))
    +- *(1) ColumnarToRow
       +- FileScan parquet [...]
    Generated code:
    ...
    /* 039 */           boolean columnartorow_isNull_2 = columnartorow_mutableStateArray_2[2].isNullAt(columnartorow_rowIdx_0);
    /* 040 */           int columnartorow_value_2 = columnartorow_isNull_2 ? -1 : (columnartorow_mutableStateArray_2[2].getInt(columnartorow_rowIdx_0));
    /* 041 */
    /* 042 */           boolean filter_value_2 = !columnartorow_isNull_2;
    /* 043 */           if (!filter_value_2) continue;
    /* 044 */
    /* 045 */           boolean filter_value_3 = false;
    /* 046 */           filter_value_3 = columnartorow_value_2 == 200;
    /* 047 */           if (!filter_value_3) continue;
    ...
    == Subtree 2 / 2 (maxMethodCodeSize:314; maxConstantPoolSize:124(0.19% used); numInnerClasses:0) ==
    *(2) Project [ip#7, path#8, status#9, bytes#10L, pythonUDF0#227 AS a#21]
    +- ArrowEvalPython [_area(path#8)#19], [pythonUDF0#227], 101
       +- ...
    ```

    You can read the filter `status = 200` straight out of lines 39 to
    47: a null check and an `int` comparison inlined into the scan
    loop over `OnHeapColumnVector`s. `ArrowEvalPythonExec` (like every
    Python exec node) does not implement `CodegenSupport`, so the stage
    ends below it and a new one starts above it, joined by an
    `InputAdapter`. Between them rows are materialized as `UnsafeRow`s,
    copied into Arrow batches, sent to Python, and the results joined
    back to the rows Spark kept (the next lesson shows those bytes).

    That boundary is the real price of a UDF, more than the Python
    function itself: the JVM side loses fusion, and every column the
    node passes through is buffered. "Tuning Python on Spark" measured
    it; here you can see where it comes from.

