    ## The Life of a Query

    A DataFrame is a plan, not data. Every action hands that plan to a
    `QueryExecution` object
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/QueryExecution.scala`),
    which moves it through these phases, each a lazy value computed from
    the one before:

    | Phase | `QueryExecution` member | What happens |
    |---|---|---|
    | Parsed | `logical` | The tree the API built: names not yet resolved (`'path`) |
    | Analyzed | `analyzed` | The `Analyzer` resolves names, types and functions against the catalog |
    | Optimized | `optimizedPlan` | The `Optimizer` (and `SparkOptimizer`) rewrites the tree with rules |
    | Physical | `sparkPlan` | The `SparkPlanner` strategies pick an operator for each logical node |
    | Executed | `executedPlan` | Preparation rules add exchanges, code generation stages, AQE |
    | RDD | `toRdd` | The physical plan becomes an RDD of `InternalRow` that tasks run |

    `explain("extended")` prints the first four. For a filter with a
    native part and a UDF part:

    ```python
    df.filter((F.col("status") == 200) & (area("path") == "api")).explain("extended")
    ```

    ```text
    == Parsed Logical Plan ==
    'Filter 'and('`=`('status, 200), '`=`(area('path)#11, api))
    +- Relation [ip#7,path#8,status#9,bytes#10L] parquet

    == Analyzed Logical Plan ==
    ip: string, path: string, status: int, bytes: bigint
    Filter ((status#9 = 200) AND (area(path#8)#11 = api))
    +- Relation [ip#7,path#8,status#9,bytes#10L] parquet

    == Optimized Logical Plan ==
    Project [ip#7, path#8, status#9, bytes#10L]
    +- Filter (pythonUDF0#13 = api)
       +- ArrowEvalPython [area(path#8)#11], [pythonUDF0#13], 101
          +- Filter (isnotnull(status#9) AND (status#9 = 200))
             +- Relation [ip#7,path#8,status#9,bytes#10L] parquet

    == Physical Plan ==
    *(2) Project [ip#7, path#8, status#9, bytes#10L]
    +- *(2) Filter (pythonUDF0#13 = api)
       +- ArrowEvalPython [area(path#8)#11], [pythonUDF0#13], 101
          +- *(1) Filter (isnotnull(status#9) AND (status#9 = 200))
             +- *(1) ColumnarToRow
                +- FileScan parquet [...] PushedFilters: [IsNotNull(status), EqualTo(status,200)], ...
    ```

    (This run used an extra `bytes` column; the plans were taken from a
    real 4.2.0 run and shortened only where marked `...`.) A leading `'`
    marks something unresolved. `#11` is an **expression ID**: Catalyst
    names every attribute by ID, not by name, which is how it knows that
    `path#8` in one node is the same column as `path#8` in another even
    after renames.

    Notice that the analyzed plan still has one `Filter` with the UDF in
    it. The optimized plan has a new node, `ArrowEvalPython`, that did
    not exist in anything you wrote. Most of this lesson is about where
    that node comes from.

