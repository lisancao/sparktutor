  Output: |
    ## Lazy Analysis on Connect

    The difference you notice first is **when errors appear**. In a
    classic session the `Dataset` constructor analyzes eagerly, so a bad
    column fails at `select`:

    ```text
    classic: spark.range(3).select("nope")
    AnalysisException [UNRESOLVED_COLUMN.WITH_SUGGESTION] A column, variable, or function
    parameter with name `nope` cannot be resolved. Did you mean one of the following? [`id`].
    SQLSTATE: 42703
    ```

    On Connect, `select("nope")` returns a DataFrame without contacting
    the server. The error comes with the first call that needs analysis:
    `df.columns`, `df.schema`, `printSchema()`, `explain()` or an
    action. Each sends an `AnalyzePlan` RPC, handled by
    `SparkConnectAnalyzeHandler`; the server log said
    `Spark Connect RPC error during: analyze` and the client raised the
    same `AnalysisException` at `bad.columns`.

    Two practical consequences:

    - **Tests on Connect must touch the schema** (or run an action) to
      prove a transformation is valid. A function that only builds
      DataFrames passes even when every column name is wrong.
    - **Schema calls cost a round trip.** The client caches the schema
      on each DataFrame (`_cached_schema` in
      `pyspark/sql/connect/dataframe.py`), but every new DataFrame you
      derive starts uncached. A loop that calls `df.columns` after each
      `withColumn` makes one RPC per iteration; build the projection
      once with `select` or `withColumns`.

    The Python-specific tools of this lesson are classic only: `df._jdf`
    and `spark._jvm` do not exist on Connect. Text inspection works on
    both, because `explain()` prints the server's plan.
    `contextlib.redirect_stdout` around `df.explain("formatted")` is the
    portable way to test plans, and the exercise's `pushed_filters` uses
    it.

