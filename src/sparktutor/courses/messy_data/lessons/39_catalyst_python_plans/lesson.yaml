    ## When a UDF Runs Twice

    Filter on the column a UDF produced, and look at the plan:

    ```python
    slow = (df.withColumn("area", area("path"))
              .filter(F.col("area") == "api")
              .filter(F.col("status") == 200))
    slow.explain()
    ```

    ```text
    *(3) Project [ip#6, path#7, status#8, pythonUDF0#13 AS area#11]
    +- ArrowEvalPython [<lambda>(path#7)#9], [pythonUDF0#13], 101
       +- *(2) Project [ip#6, path#7, status#8]
          +- *(2) Filter (pythonUDF0#12 = api)
             +- ArrowEvalPython [<lambda>(path#7)#9], [pythonUDF0#12], 101
                +- *(1) Filter (isnotnull(status#8) AND (status#8 = 200))
                   +- *(1) ColumnarToRow
                      +- FileScan parquet [...] PushedFilters: [IsNotNull(status), EqualTo(status,200)], ...
    ```

    Two `ArrowEvalPython` nodes for one UDF. The optimizer rule
    `PushDownPredicates` (through its part `PushPredicateThroughNonJoin`)
    pushed `area = 'api'` below the projection by **substituting the
    alias**: the filter became `area_udf(path) = 'api'`, and the
    projection still computes `area_udf(path) AS area`. Those are now
    two operators that each contain the UDF, and `ExtractPythonUDFs`
    deduplicates only within one operator. The plan change log in "Rules,
    Batches and the Plan Change Log" showed exactly this rewrite.

    To measure it, the exercise counts calls with an accumulator added
    to inside the UDF:

    | Query (200 rows, 98 with status 200, 31 API hits among them) | UDF calls |
    |---|---|
    | `withColumn(area).collect()` | 200 |
    | `withColumn(area).count()` | **0** |
    | `slow` (filter on `area` and `status`) | **129** = 98 + 31 |
    | filter on `area` only, then `collect()` | 270 = 200 + 70 |
    | `u.union(u).collect()` | 400 |
    | filter on `area` only, UDF nondeterministic | 200 |
    | `count()` with the UDF nondeterministic | 0 |

    The `count()` lines are the other side of the same coin: a UDF
    column that nothing downstream reads is removed by column pruning,
    deterministic or not, so the UDF never runs. If your UDF has side
    effects you rely on, such as writing files or calling a service, an
    action that does not use its result may skip it entirely. Side
    effects belong in `foreach`, `foreachPartition` or a writer, not in
    a UDF.

    Spark 4.2.0 added a guard for exactly this problem, but not for
    Python. SPARK-47672 (fixed in 4.2.0) introduced
    `spark.sql.optimizer.avoidDoubleFilterEval` (default `true`): a
    filter that references an **expensive** projected expression is not
    pushed through the projection. "Expensive" is the `expensive` flag on
    `Expression`, and in 4.2.0 `ScalaUDF` sets it but `PythonUDF` does
    not. SPARK-59693 extends the guard to Python UDFs; it is fixed in
    4.4.0. Until you run 4.4, these rewrites avoid the second evaluation:

    - **Filter first, then make the UDF nondeterministic.**
      `df.filter(status == 200).withColumn("area", area.asNondeterministic()("path")).filter(area == "api")`
      gives one Python node, keeps `status = 200` pushed (it was below
      the UDF already), and runs the UDF 98 times. This is the
      exercise's rewrite. The cost: any filter you write **after** the
      nondeterministic column stays above it.
    - **Replace the UDF by native functions** where you can
      (`F.split(F.split("path", r"\?")[0], "/")[1]` here). No Python
      node at all.
    - **Materialize.** Cache or write the UDF column, then filter.
      After `c = u.cache()` and `c.count()` (200 calls, which builds the
      cache), `c.filter("area = 'api'").collect()` made 0 calls. One
      trap, measured in a classic session: if you had already run
      `u.collect()` **before** calling `cache()`, a later `c.collect()`
      on that same object ran the UDF 200 more times, because the
      DataFrame reuses the physical plan it planned before the cache
      existed. DataFrames derived from it (the filter) did use the
      cache. Cache before the first action, or act on a derived
      DataFrame.

    The same mechanics explain why one UDF call costs more than you
    think in bigger plans: every operator that ends up with a copy of
    the expression evaluates it again, and only an exchange, a cache or
    a write stops that.

