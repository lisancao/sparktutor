  Output: |
    ## Fusing UDFs: Chains, Siblings and Mixed Types

    One `ArrowEvalPython` node can evaluate several UDFs in one trip to
    Python. The comment in `ExtractPythonUDFs` names two kinds of
    fusing: **nested chaining** (`f(g(x))`, the output of one feeds the
    next inside the worker) and **parallel chaining** (`f(x), g(y)`,
    evaluated side by side). Measured on 4.2.0 (in these runs `area`
    wraps a Python function named `_area`, which is the name plans
    print; `upper` is a second UDF and `strip_q` a pandas UDF):

    ```text
    df.select(upper(area("path")))           # nested, same eval type
    ArrowEvalPython [upper(_area(path#8)#15)#16], [pythonUDF0#18], 101

    df.select(area("path"), upper("ip"))      # siblings, same eval type
    ArrowEvalPython [_area(path#8)#19, upper(ip#7)#20], [pythonUDF0#23, pythonUDF1#24], 101
    ```

    Fusing requires the **same eval type**. A pandas UDF inside an
    Arrow-optimized UDF becomes two nodes, with a projection between
    them:

    ```text
    df.select(area(strip_q("path")))          # 101 around 200
    *(2) Project [pythonUDF0#29 AS _area(strip_q(path))#27]
    +- ArrowEvalPython [_area(pythonUDF0#28)#26], [pythonUDF0#29], 101
       +- *(1) Project [pythonUDF0#28]
          +- ArrowEvalPython [strip_q(path#8)#25], [pythonUDF0#28], 200
    ```

    Two more rules from the source: iterator UDFs
    (`SQL_SCALAR_PANDAS_ITER_UDF`, `SQL_SCALAR_ARROW_ITER_UDF`) are never
    fused with siblings, and a chain stops at any non-UDF expression in
    between: `foo(1 + bar(x))` needs two nodes because `1 + ...` must
    run in the JVM. Each extra node is another serialization of the
    rows to Python and back, so if you control the code, put the logic
    in one UDF, or keep the UDFs of one query in one flavour.

    The deduplication is real too: the rule keeps UDFs in an
    `ExpressionSet` by their canonical form, so the same deterministic
    UDF call written twice in one operator is evaluated once.

