    ## Filters Around Python

    "Filter Pushdown" taught what a data source receives. The other half
    is what reaches the source after Python is in the plan. Four cases,
    all from 4.2.0 runs over the Parquet log:

    **A UDF next to a native condition.** The plan in "The Life of a
    Query" shows `status = 200` in the scan's `PushedFilters` and only
    the UDF comparison left above `ArrowEvalPython`. The optimizer
    splits a condition at its `AND`s, so the native part travels down on
    its own.

    **A filter written after a UDF column.** For
    `df.withColumn("a", area("path")).filter("status = 200")`, the
    filter moves below the projection and into the scan. The Project
    that computes `a` sits on top:

    ```text
    *(2) Project [ip#7, path#8, status#9, bytes#10L, pythonUDF0#32 AS a#31]
    +- ArrowEvalPython [_area(path#8)#30], [pythonUDF0#32], 101
       +- *(1) Filter (isnotnull(status#9) AND (status#9 = 200))
          +- *(1) ColumnarToRow
             +- FileScan parquet [...] PushedFilters: [IsNotNull(status), EqualTo(status,200)], ...
    ```

    **The same with a nondeterministic UDF.** Mark the UDF
    `asNondeterministic()` and the filter stays above the Python node,
    and nothing is pushed:

    ```text
    *(1) Project [ip#7, path#8, status#9, bytes#10L, pythonUDF0#35 AS a#34]
    +- *(1) Filter (isnotnull(status#9) AND (status#9 = 200))
       +- ArrowEvalPython [_area(path#8)#33], [pythonUDF0#35], 101
          +- FileScan parquet [...] PushedFilters: [], ...
    ```

    The reason is in `PushPredicateThroughNonJoin`
    (`sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/optimizer/Optimizer.scala`):
    a filter only moves through a `Project` if **every** field of the
    projection is deterministic (SPARK-13473). Moving it would change
    which rows the nondeterministic expression sees, and so its results.
    The UDF now runs on all 200 rows, and Parquet reads every row group.

    **A UDF as the predicate itself.** `df.filter(ok("status"))` with
    `ok = udf(lambda s: s < 400, "boolean")` pushes nothing: a Python
    function is opaque to Catalyst, so it cannot become a Parquet
    `LessThan`. The native `F.col("status") < 400` pushes
    `LessThan(status,400)`. On a messy-data job that filters a large
    table by a UDF, this is the cheapest big win there is.

    One more rule from the source: after extraction, `canPushThrough`
    lets a filter move **through** `ArrowEvalPython` and
    `BatchEvalPython` nodes (they do not change rows), which is how the
    native `status = 200` in the first case ended up below the Python
    node even though the extraction put the node there afterwards.

