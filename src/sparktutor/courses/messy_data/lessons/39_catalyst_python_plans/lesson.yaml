    ## How a Python UDF Enters the Plan

    `F.udf(f, "string")` builds a `PythonUDF` expression
    (`sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/expressions/PythonUDF.scala`)
    holding the pickled function, the return type, a `deterministic`
    flag and an **eval type**, a number that tells the Python worker how
    to call the function. From `PythonEvalType` in
    `core/src/main/scala/org/apache/spark/api/python/PythonRunner.scala`:

    | Eval type | Name | Made by |
    |---|---|---|
    | 100 | `SQL_BATCHED_UDF` | `udf(..., useArrow=False)` |
    | 101 | `SQL_ARROW_BATCHED_UDF` | `udf(...)` with Arrow on (the 4.2 default) |
    | 200 | `SQL_SCALAR_PANDAS_UDF` | `pandas_udf`, Series to Series |
    | 204 | `SQL_SCALAR_PANDAS_ITER_UDF` | `pandas_udf`, iterator of Series |
    | 205 | `SQL_MAP_PANDAS_ITER_UDF` | `mapInPandas` |
    | 207 | `SQL_MAP_ARROW_ITER_UDF` | `mapInArrow`, and Python data source reads |
    | 250 | `SQL_SCALAR_ARROW_UDF` | `arrow_udf` (4.1) |

    In Spark 4.2, regular Python UDFs are **Arrow-optimized by default**:
    `spark.sql.execution.pythonUDF.arrow.enabled` now defaults to `true`
    (the PySpark 4.2 migration guide says so; set it to `false` for the
    old behaviour). That is why the plans above say
    `ArrowEvalPython ... 101` for a plain `@udf`.

    A `PythonUDF` cannot be evaluated by the JVM. Until the optimizer is
    almost finished it sits inside ordinary expressions like any
    function call, which lets every logical rule move it around. Then,
    in `SparkOptimizer`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/SparkOptimizer.scala`),
    a batch called `Extract Python UDFs` runs once:

    ```scala
    Batch("Extract Python UDFs", Once,
      ExtractPythonUDFFromJoinCondition,
      CheckCartesianProducts,
      ExtractPythonUDFFromAggregate,
      ExtractGroupingPythonUDFFromAggregate,
      ExtractPythonUDFs,
      ExtractPythonUDTFs,
      // The eval-python node may be between Project/Filter and the scan node, which breaks
      // column pruning and filter push-down. Here we rerun the related optimizer rules.
      ColumnPruning,
      LimitPushDown,
      PushPredicateThroughNonJoin,
      PushProjectionThroughLimitAndOffset,
      RemoveNoopOperators),
    ```

    `ExtractPythonUDFs`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/python/ExtractPythonUDFs.scala`)
    visits each operator bottom-up. For an operator whose expressions
    contain UDFs it can evaluate, it inserts a `BatchEvalPython`
    (eval type 100) or `ArrowEvalPython` (the Arrow and pandas eval
    types) **below** the operator. That node evaluates the UDFs and
    appends their results as new columns (`pythonUDF0#13`), and the
    operator is rewritten to read those columns instead of calling the
    UDF. The planner strategy `PythonEvals` in `SparkStrategies.scala`
    then maps `ArrowEvalPython` to `ArrowEvalPythonExec` and
    `BatchEvalPython` to `BatchEvalPythonExec`.

    The rule is listed in `nonExcludableRules`: you cannot switch it off
    with `spark.sql.optimizer.excludedRules`, because without it the
    plan would not run at all.

