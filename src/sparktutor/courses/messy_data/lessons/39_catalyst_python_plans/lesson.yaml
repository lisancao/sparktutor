    ## Rules, Batches and the Plan Change Log

    The analyzer and the optimizer are both `RuleExecutor`s
    (`sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/rules/RuleExecutor.scala`).
    A `RuleExecutor` holds **batches**; each batch is a list of rules run
    either `Once` or to a `FixedPoint` (repeat until the plan stops
    changing, up to `spark.sql.optimizer.maxIterations`). Each rule is a
    function from plan to plan, usually a pattern match on tree shapes.

    You can watch them work. Three internal settings, all since 3.1:

    - `spark.sql.planChangeLog.level`: the log4j level the messages are
      written at (default `TRACE`, so you never see them; set `WARN`)
    - `spark.sql.planChangeLog.rules`: a comma-separated list of rule
      names (full class names) to log
    - `spark.sql.planChangeLog.batches`: a comma-separated list of batch
      names to log

    ```python
    spark.sparkContext.setLogLevel("WARN")
    spark.conf.set("spark.sql.planChangeLog.level", "WARN")
    spark.conf.set("spark.sql.planChangeLog.rules",
                   "org.apache.spark.sql.execution.python.ExtractPythonUDFs,"
                   "org.apache.spark.sql.catalyst.optimizer.PushDownPredicates")
    files.withColumn("b", big("size")).filter("b").explain()
    ```

    (`files` is a small Python data source and `big` a UDF returning
    `size > 1000`.) Among the output, written to stderr by
    `PlanChangeLogger`:

    ```text
    === Applying Rule org.apache.spark.sql.catalyst.optimizer.PushDownPredicates ===
    !Filter b#19: boolean                                                Project [path#15, kind#16, size#17L, big(size#17L)#18 AS b#19]
    !+- Project [path#15, kind#16, size#17L, big(size#17L)#18 AS b#19]   +- Filter big(size#17L)#18
        +- RelationV2[path#15, kind#16, size#17L] files                     +- RelationV2[path#15, kind#16, size#17L] files

    === Applying Rule org.apache.spark.sql.execution.python.ExtractPythonUDFs ===
    !Project [path#15, kind#16, size#17L, big(size#17L)#18 AS b#19]   Project [path#15, kind#16, size#17L, pythonUDF0#21 AS b#19]
    !+- Filter big(size#17L)#18                                       +- ArrowEvalPython [big(size#17L)#18], [pythonUDF0#21], 101
    !   +- RelationV2[path#15, kind#16, size#17L] files                  +- Project [path#15, kind#16, size#17L]
    !                                                                       +- Filter pythonUDF0#20: boolean
    !                                                                          +- ArrowEvalPython [big(size#17L)#18], [pythonUDF0#20], 101
    !                                                                             +- RelationV2[path#15, kind#16, size#17L] files
    ```

    Left is before, right is after, `!` marks changed lines. Hold on to
    this log: it shows a UDF being **copied** into a filter and then
    extracted **twice**. You will measure the cost of that below.

    Even with `rules` set, the logger also prints a summary line for
    each batch ("Batch Hints has no effect.") and the result of each
    batch that changed something; use `batches` to narrow it further.
    It also prints `=== Metrics of Executed Rules ... ===` per executor.

    For timing across the whole session,
    `spark._jvm.org.apache.spark.sql.catalyst.rules.RuleExecutor.dumpTimeSpent()`
    returns a table of every rule's effective and total time and runs:

    ```text
    === Metrics of Analyzer/Optimizer Rules ===
    Total number of runs: 2333
    Total time: 0.610194592 seconds

    Rule                                                       Effective Time / Total Time   Effective Runs / Total Runs
    org.apache.spark.sql.catalyst.analysis.ResolveDataSource   287834102 / 287944388         2 / 16
    org.apache.spark.sql.catalyst.analysis.Analyzer$ResolveReferences  16610935 / 28896925   5 / 16
    ...
    ```

    Times are nanoseconds. When planning a query is slow (a very wide
    schema, a huge `CASE WHEN`, hundreds of unions), this table is
    where you start.

