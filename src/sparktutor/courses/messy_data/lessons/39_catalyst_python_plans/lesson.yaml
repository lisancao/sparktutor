    ## Reading Plans in Tests: JVM Tree or Text?

    Both have a place:

    | | JVM tree (`_jdf.queryExecution()`) | Text (`explain()` captured) |
    |---|---|---|
    | Works on Connect | no | yes |
    | Stable across versions | node classes and names, fairly | formats change more often |
    | Node details | typed: `condition()`, `output()`, `metrics()` | what the printer chose to print |
    | AQE | descend into `AdaptiveSparkPlan.executedPlan()` | prints `isFinalPlan=false` until executed |
    | Expression IDs | available (`exprId()`) | printed as `#n`, differ per run |

    Rules of thumb for plan assertions that survive upgrades: assert on
    node names and on the presence of a pushed filter, not on the full
    string; never hard-code expression IDs (match `name#\d+`); and run
    `explain()` after the action when you care about the final adaptive
    plan, as "Plans, Partitions and Caching" showed.

    Plan inspection is also how the advanced lessons check your work:
    "Catalyst Extensions: Rules and Native Functions" asserts that a
    Python node disappears after your rule runs, and "A DSv2 Connector
    in Java" asserts on the pushed predicates and required columns of
    your scan.

