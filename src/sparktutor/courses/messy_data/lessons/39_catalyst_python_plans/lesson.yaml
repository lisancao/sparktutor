    ## A 4.2.0 Trap: Columnar Input to Arrow UDFs

    Look again at a UDF directly over a Parquet scan, with default
    settings:

    ```python
    spark.range(3).selectExpr("cast(id as string) s").write.parquet(p)
    q = spark.read.parquet(p).select(F.udf(lambda s: s + "!", "string")("s"))
    q.explain()
    q.collect()
    ```

    ```text
    *(1) Project [pythonUDF0#6 AS <lambda>(s)#4]
    +- ArrowEvalPython [<lambda>(s#2)#3], [pythonUDF0#6], 101
       +- FileScan parquet [s#2] Batched: true, ...
    ```

    There is no `ColumnarToRow`. Spark 4.2.0 added a columnar path into
    Arrow UDFs (SPARK-56350): `ArrowEvalPythonExec.supportsColumnar` is
    `child.supportsColumnar && spark.sql.execution.arrow.pythonUDF.columnarInput.enabled`
    (new in 4.2.0, default `true`), and then
    `ColumnarArrowEvalPythonEvaluatorFactory` consumes the scan's
    `ColumnarBatch`es directly. A vectorized Parquet scan is columnar,
    so the planner takes that path.

    And `collect()` **never returns**. No error, no log line, a task
    that waits forever. The cause is SPARK-58241 (affects 4.2.0, fixed
    in 4.2.1 and 4.3.0): the columnar runner writes the input schema to
    the Python worker in the place the 4.1 protocol had it, while the
    4.2.0 worker expects it in the eval configuration, so the two sides
    disagree about the bytes and both wait. "The Python Worker Protocol"
    reproduces it at the byte level and shows how to turn the hang into
    an error.

    Which shapes hang, from runs on 4.2.0:

    | Query over a vectorized Parquet scan | Result |
    |---|---|
    | `@udf` (Arrow-optimized, 101) on a column, nothing in between | **hangs** |
    | the same with `useArrow=False` (100) | works |
    | `pandas_udf` (200) on a column | works |
    | `@udf` on `concat(s, 'x')` | works |
    | `@udf` on `status + 0` | **hangs** (so don't count on wrapping the column) |
    | a `Filter` between scan and UDF | works (the child is row-based) |
    | `spark.sql.parquet.enableVectorizedReader=false` | works |

    The fix on 4.2.0 is one setting, which every session in this lesson
    sets:

    ```python
    spark.conf.set("spark.sql.execution.arrow.pythonUDF.columnarInput.enabled", "false")
    ```

    SPARK-60294 turns the setting off by default in 4.4.0 because of
    further problems with producers that reuse their vectors. Keep it off
    on 4.2.x unless you have measured a gain and tested your query
    shapes.

