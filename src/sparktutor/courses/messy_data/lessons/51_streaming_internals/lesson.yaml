    ## What You'll Learn

    You have run streaming queries since "Streaming Files: Your First
    Structured Streaming Job", built your own offsets and an idempotent
    sink in "Streaming Readers and Writers", and sessionized messy
    clicks with state, watermarks and dead letters in the intermediate
    lesson "Streaming Messy Data: Drift, Dead Letters and State". This
    lesson assumes all of that and opens the engine up. Everything here
    is something you can see on disk, in a plan, or in the 4.2.0 source.

    By the end you will be able to:

    - Read every file in a checkpoint by hand (`metadata`, `offsets/`,
      `commits/`, `sources/`, `state/`) and say what the next run of
      the query will do before you start it
    - Explain the offset/commit protocol in `MicroBatchExecution`, why a
      batch is replayed, and why some batches have no input at all
    - Decode a state store delta file byte by byte, and know what the
      RocksDB provider writes instead
    - Inspect live state with the state data source (`statestore`,
      `state-metadata`), including `transformWithState` variables,
      timers and the change feed
    - Explain how Python `transformWithState` talks to the JVM, when
      timers fire, how TTL works, and the traps in each
    - Predict which state schema changes survive a restart, with the
      exact error for each one that does not
    - Run Real-Time Mode on a laptop, hit each of its 4.2.0
      restrictions, and measure what a Python sink does to its latency

    Source paths in this lesson are relative to the root of the Spark
    4.2.0 repository (`git checkout v4.2.0`). The streaming engine lives
    in `sql/core/src/main/scala/org/apache/spark/sql/execution/streaming/`;
    paths below shorten that prefix to `streaming/`.

