    ## A Checkpoint Is a Set of Logs

    Run a windowed count over a folder of JSON twice (two files, each
    run with `trigger(availableNow=True)`), then list the checkpoint:

    ```python
    import json, os, shutil, tempfile
    from pyspark.sql import functions as F

    work = tempfile.mkdtemp()
    inbox, ck, out = f"{work}/inbox", f"{work}/ck", f"{work}/out"
    os.makedirs(inbox)

    def drop(name, rows):
        with open(f"{inbox}/{name}", "w") as f:
            f.writelines(json.dumps(r) + "\n" for r in rows)

    def run():
        q = (spark.readStream.schema("user STRING, ts TIMESTAMP").json(inbox)
             .withWatermark("ts", "10 minutes")
             .groupBy(F.window("ts", "5 minutes"), "user").count()
             .writeStream.format("parquet").option("path", out)
             .option("checkpointLocation", ck)
             .outputMode("append").trigger(availableNow=True).start())
        q.awaitTermination()
        print([(p.batchId, p.numInputRows) for p in q.recentProgress])

    spark.conf.set("spark.sql.shuffle.partitions", "2")
    spark.conf.set("spark.sql.session.timeZone", "UTC")
    drop("a.json", [{"user": "u1", "ts": "2026-10-01T10:00:00"},
                    {"user": "u2", "ts": "2026-10-01T10:01:00"}])
    run()
    drop("b.json", [{"user": "u1", "ts": "2026-10-01T10:20:00"}])
    run()
    for d, _, files in sorted(os.walk(ck)):
        for name in sorted(files):
            if not name.endswith(".crc"):
                path = os.path.join(d, name)
                print(os.path.relpath(path, ck), os.path.getsize(path))
    ```

    ```text
    [(0, 2), (1, 0)]
    [(2, 1), (3, 0)]
    commits/0 41        offsets/0 1031       sources/0/0 88
    commits/1 41        offsets/1 1043       sources/0/1 88
    commits/2 41        offsets/2 1043       metadata 45
    commits/3 41        offsets/3 1043
    state/0/0/1.delta 107    state/0/1/1.delta 107
    state/0/0/2.delta 46     state/0/1/2.delta 46
    state/0/0/3.delta 107    state/0/1/3.delta 46
    state/0/0/4.delta 94     state/0/1/4.delta 94
    state/0/0/_metadata/schema 466
    state/0/_metadata/metadata 150
    ```

    (The listing is rearranged into columns; every file also has a
    `.crc` twin.) Each folder is written by one class:

    | Path | Written by | Holds |
    |---|---|---|
    | `metadata` | `StreamMetadata` (`streaming/runtime/StreamMetadata.scala`) | the query `id`, stable across restarts |
    | `offsets/<batch>` | `OffsetSeqLog` (`streaming/checkpointing/OffsetSeqLog.scala`) | what batch N will read, written *before* it runs |
    | `commits/<batch>` | `CommitLog` (`streaming/checkpointing/CommitLog.scala`) | that batch N finished, written *after* the sink |
    | `sources/<i>/<n>` | the source itself (here `FileStreamSourceLog`) | the file source's own log of files it has seen |
    | `state/<op>/<partition>/` | the state store provider | one store per stateful operator and shuffle partition |
    | `state/<op>/_metadata/` | `OperatorStateMetadataWriter` (`streaming/state/OperatorStateMetadata.scala`) | which operator owns the state |

    The `.crc` files come from Hadoop's local `ChecksumFileSystem`; on
    S3 or ADLS you will not see them. Every log file is written to a
    temporary name and renamed into place by `CheckpointFileManager`,
    which is why a half-written batch file never appears.

    Two runs, four batches. Batches 1 and 3 read zero rows: they are
    **no-data batches**, which the next sections explain.

- Class: text
