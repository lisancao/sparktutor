    ## Settings That a Checkpoint Pins

    The `conf` map in every offsets file is
    `OffsetSeqMetadata.relevantSQLConfs` (in
    `streaming/checkpointing/OffsetSeq.scala`): the state store
    provider class, the state encoding format, the compression codec,
    the state format versions of each operator, the RocksDB format
    version, the multiple-watermark policy and a few more. They are
    recorded on the first batch, and on every restart
    `OffsetSeqMetadata.setSessionConf` copies them back over your
    session, logging a warning if you tried to change one.

    `spark.sql.shuffle.partitions` is in that map too (through an
    internal alias), because it fixes how many state store partitions
    each stateful operator has. Change it and restart:

    ```python
    spark.conf.set("spark.sql.shuffle.partitions", "5")
    drop("c.json", [{"user": "u3", "ts": "2026-10-01T10:40:00"}])
    run()
    print(spark.conf.get("spark.sql.shuffle.partitions"))
    print(sorted(os.listdir(f"{ck}/state/0")))
    ```

    ```text
    [(4, 1), (5, 0)]
    5
    ['0', '1', '_metadata']
    ```

    The query still has two state partitions, and the driver log says
    `WARN OffsetSeqMetadata: Updating the value of conf
    'spark.sql.streaming.internal.stateStore.partitions' in current
    session from '5' to '2'.` (the internal alias under which the
    checkpoint stores the shuffle partition count). The same thing
    happens if you set `spark.sql.streaming.stateStore.providerClass`
    to RocksDB and restart a query that began on the HDFS provider: it
    keeps writing `.delta` files, while `spark.conf.get` in your session
    still shows the RocksDB class, because the checkpoint's value is
    applied to the query's own copy of the session.

    Changing the provider needs a new checkpoint. Changing the number
    of state partitions has an escape hatch new in 4.2.0, marked
    experimental and reachable only through an underscore name in
    Classic mode: `spark._streamingCheckpointManager.repartition(checkpoint, n)`
    (`StreamingCheckpointManager` in `pyspark/sql/streaming/query.py`,
    `OfflineStateRepartitionRunner` in `streaming/state/`). The query
    must be stopped. It refuses the HDFS provider
    (`STATE_REPARTITION_INVALID_CHECKPOINT.UNSUPPORTED_PROVIDER`); on a
    RocksDB checkpoint with two batches it wrote a third batch
    (`offsets/2` and `commits/2`) that reads no input and rewrites the
    state into four partitions, and the restarted query continued on
    four partitions with correct counts. In the same run the state data
    source could no longer read that checkpoint and `state-metadata`
    still reported two partitions, so treat it as the experiment it is
    labelled, on a copy of the checkpoint.

