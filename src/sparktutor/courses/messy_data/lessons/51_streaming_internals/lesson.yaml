    ## The RocksDB State Store

    The HDFS provider keeps all state in executor memory, which limits
    how much state a query can hold. `RocksDBStateStoreProvider`
    (`streaming/state/RocksDBStateStoreProvider.scala`, with the engine
    in `RocksDB.scala` and the file handling in `RocksDBFileManager.scala`)
    keeps a RocksDB instance per partition on the executor's local
    disk and uploads it to the checkpoint at each commit.

    ```python
    spark.conf.set("spark.sql.streaming.stateStore.providerClass",
        "org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider")
    ```

    Set it before the query's first batch; afterwards the checkpoint
    pins it. What it writes depends on **changelog checkpointing**
    (`spark.sql.streaming.stateStore.rocksdb.changelogCheckpointing.enabled`,
    default `false` in 4.2.0):

    - **off:** every commit uploads a `<version>.zip` holding RocksDB's
      small files (`CURRENT`, `MANIFEST-*`, `OPTIONS-*`, the write-ahead
      log) and a `metadata` JSON that lists which SST files make up the
      version. The SST files themselves go to a shared `SSTs/` folder
      under unique names, so versions share unchanged files.
    - **on:** every commit uploads only a `<version>.changelog` (the
      changed keys, like an HDFS delta), and a full snapshot zip is
      uploaded in the background every `minDeltasForSnapshot` versions.
      Commits get cheaper; recovery replays changelogs.

    From the exercise's checkpoint (changelog checkpointing off):

    ```text
    state/0/0/1.zip ... state/0/0/6.zip
    state/0/0/SSTs/000008-bda65361-ff58-4a3c-947f-dbf32d35b29e.sst
    state/0/0/SSTs/000024-e4fdf144-f22f-4e35-8e7d-0c0f55adcb1d.sst
    ...
    6.zip: OPTIONS-000023, CURRENT, MANIFEST-000021, 000020.log, metadata
    metadata: v1
    {"sstFiles":[{"localFileName":"000024.sst",
