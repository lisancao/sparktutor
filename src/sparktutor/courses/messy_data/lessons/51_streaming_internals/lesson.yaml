    ## State TTL

    Every state variable takes an optional `ttlDurationMs`. TTL is
    measured in **processing time**: each update sets the expiry to the
    batch's processing timestamp plus the duration, expired values stop
    being returned, and Spark deletes them in later batches. That is
    why TTL exists only in `ProcessingTime` mode (`validateTTLConfig` in
    `StatefulProcessorHandleImpl.scala`). In `EventTime` mode
    `getValueState("v", "n INT", ttlDurationMs=60000)` fails in
    `init()`:

    ```text
    PySparkRuntimeError: Error initializing value state:
    [STATEFUL_PROCESSOR_INCORRECT_TIME_MODE_TO_ASSIGN_TTL] Cannot use TTL for
    state=v in timeMode=EventTime, use TimeMode.ProcessingTime() instead. SQLSTATE: 42802
    ```

    A run with a 2 second TTL, a `processingTime="500 milliseconds"`
    trigger and three files arriving 1 s, 1 s and 4 s apart:

    ```python
    import time

    class Counter(StatefulProcessor):
        def init(self, handle):
            self.v = handle.getValueState("v", "n INT", ttlDurationMs=2000)
        def handleInputRows(self, key, rows, timerValues):
            prev = self.v.get() if self.v.exists() else None
            n = (prev[0] if prev else 0) + sum(1 for _ in rows)
            self.v.update((n,))
            yield Row(k=key[0], before=prev[0] if prev else None, after=n)
        def close(self):
            pass

    ttl = tempfile.mkdtemp()
    os.makedirs(f"{ttl}/in")
    seen = []
    q = (spark.readStream.schema("k STRING").json(f"{ttl}/in").groupBy("k")
         .transformWithState(Counter(), "k STRING, before INT, after INT",
                             "Update", "ProcessingTime")
         .writeStream.foreachBatch(
             lambda df, b: seen.extend((b, r.before, r.after) for r in df.collect()))
         .option("checkpointLocation", f"{ttl}/ck")
         .trigger(processingTime="500 milliseconds").start())
    for i, pause in enumerate([1, 1, 4]):
        time.sleep(pause)
        with open(f"{ttl}/in/{i}.json", "w") as f:
            f.write(json.dumps({"k": "a"}) + "\n")
    time.sleep(3)
    q.stop()
    print("(batch, before, after):", seen)
    print("batches run:", q.lastProgress.batchId + 1)
    ```

    ```text
    (batch, before, after): [(0, None, 1), (1, 1, 2), (9, None, 1)]
    batches run: 15
    ```

    The third file found the counter gone: it had expired between
    batches 1 and 9. (The batch numbers depend on timing; the `None`
    in the third row does not.) And 15 batches ran for three files, which is the
    `ProcessingTime` no-data batch behaviour from the previous section
    again: TTL cleanup needs those batches.

    For event-time expiry (close a session 30 minutes after its last
    click in event time), use timers, as the exercise does. TTL and
    timers answer different questions: TTL bounds how long state
    lingers on the wall clock, timers act on the data's own clock.

