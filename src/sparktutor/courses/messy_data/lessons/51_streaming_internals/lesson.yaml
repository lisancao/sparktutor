    ## transformWithState in Python, from the Inside

    "Streaming Messy Data: Drift, Dead Letters and State" used
    `transformWithState` to sessionize clicks. Here is what runs when
    you do. Python has two flavours on `GroupedData`:
    `transformWithStateInPandas` (4.0, pandas DataFrames in and out)
    and `transformWithState` (4.1, `Row` objects in and out). Both
    plan to the same physical operator,
    `TransformWithStateInPySparkExec`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/python/streaming/`),
    shown in plans as `TransformWithStateInPySpark ... python_row` or
    `... pandas`.

    For each partition of each batch, the executor:

    1. filters rows older than the watermark (in `EventTime` mode) and
       groups the rest by key;
    2. starts a Python worker with `TransformWithStateInPySparkPythonRunner`,
       which streams the grouped rows to Python as Arrow batches;
    3. opens a **state server** for that task,
       `TransformWithStateInPySparkStateServer`, on a local socket (a
       Unix domain socket or a TCP port), and tells the worker where
       it is;
    4. Python calls your `init()`, then `handleInputRows(key, rows,
       timerValues)` for each key with data, then
       `handleExpiredTimer(key, timerValues, expiredTimerInfo)` for each
       expired timer, then `close()`;
    5. commits the RocksDB store when the task ends.

    Every state call in Python (`self.session.get()`,
    `self.seen.containsKey(...)`, `registerTimer`) is a request to the
    state server: a protobuf message defined in
    `sql/core/src/main/protobuf/org/apache/spark/sql/execution/streaming/StateMessage.proto`
    (`StateRequest`, `StateResponse`, `ValueStateCall`, `MapStateCall`,
    `TimerRequest`...), answered by the JVM from RocksDB. So **each
    state access is a round trip between processes**. Reading a value
    once per key and keeping it in a local variable, as the exercise
    does, is not a micro-optimisation; it is the difference between
    one round trip and dozens per key.

    The query plan shows the pieces:

    ```text
    ~WriteToMicroBatchDataSourceV1 FileSink[...]
    +- ~TransformWithStateInPySpark transformWithStateUDF(user#313, page#314,
         ts#315-T600000ms)#317, 1, [user#318, start#319, ...], Append, EventTime, python_row, false, 0
       :- ~Project [user#313, user#313, page#314, ts#315-T600000ms]
       :  +- ~EventTimeWatermark ..., ts#315: timestamp, 10 minutes
       :     +- ~StreamingExecutionRelation FileStreamSource[...]
       +- LocalRelation <empty>
    ```

    The second child, `LocalRelation <empty>`, is the slot for
    `initialState`; the operator is a binary node because initial
    state must be co-partitioned with the input.

