    Think of the checkpoint as a ship's log kept in several books. One
    book lists the course for each leg before the ship leaves port
    (`offsets/`), another gets a stamp when the leg is done
    (`commits/`), and the cargo hold has its own inventory pages
    (`state/`). After a storm, the captain compares the first two books
    to find the last leg that really finished.

