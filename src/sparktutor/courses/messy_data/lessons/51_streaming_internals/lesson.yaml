    ## Reading State with the State Data Source

    Decoding bytes by hand is a way to understand the format, not a
    tool. The tool is the **state data source** (4.0), in
    `sql/core/src/main/scala/org/apache/spark/sql/execution/datasources/v2/state/`:
    `format("statestore")` (`StateDataSource`) reads the rows of a
    store, and `format("state-metadata")` (`StateMetadataSource`)
    reads the operator metadata. Both are batch readers over a
    checkpoint path; the query does not have to be running.

    ```python
    (spark.read.format("statestore").load(ck)
         .selectExpr("key.user", "value.count", "partition_id").show())
    (spark.read.format("statestore").option("readChangeFeed", "true")
         .option("changeStartBatchId", 0).load(ck).show(truncate=False))
    ```

    ```text
    +----+-----+------------+
    |user|count|partition_id|
    +----+-----+------------+
    |  u1|    2|           0|
    |  u2|    2|           1|
    |  u3|    1|           1|
    +----+-----+------------+

    +--------+-----------+----+-----+------------+
    |batch_id|change_type|key |value|partition_id|
    +--------+-----------+----+-----+------------+
    |0       |update     |{u1}|{2}  |0           |
    |0       |update     |{u2}|{1}  |1           |
    |1       |update     |{u2}|{2}  |1           |
    |1       |update     |{u3}|{1}  |1           |
    +--------+-----------+----+-----+------------+
    ```

    The change feed is exactly the delta files decoded above, with the
    batch id attached. The options (from `StateSourceOptions` in
    `StateDataSource.scala`):

    | Option | Meaning |
    |---|---|
    | `batchId` | read the state as of this batch (default: the last committed one) |
    | `operatorId`, `storeName` | which operator and store, when a query has several |
    | `joinSide` | `left` or `right` for stream-stream join state |
    | `readChangeFeed`, `changeStartBatchId`, `changeEndBatchId` | read changes between batches instead of a snapshot |
    | `snapshotStartBatchId`, `snapshotPartitionId` | rebuild one partition from a given snapshot (debugging corrupt checkpoints) |
    | `stateVarName` | for `transformWithState`: which state variable |
    | `readRegisteredTimers` | for `transformWithState`: read the timers instead |
    | `flattenCollectionTypes` | for list and map state: one row per element (default `true`) |

    On a query with no stateful operator, `statestore` fails with
    `STDS_FAILED_TO_READ_STATE_SCHEMA`, while `state-metadata` simply
    returns no rows.

