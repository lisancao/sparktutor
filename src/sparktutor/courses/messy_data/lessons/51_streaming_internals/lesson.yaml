    ## Summary

    - A checkpoint is logs: `offsets/N` (the plan, written before the
      batch, with pinned settings such as the state store provider and
      the number of state partitions), `commits/N` (written after the
      sink), the source's own log, and `state/` per operator and
      partition.
    - On restart, an `offsets/N` without `commits/N` means batch N is
      replayed with the same offsets, state version and batch id.
      Sinks must be idempotent per batch id. No-data batches run when
      the watermark moves past something a stateful operator holds.
    - The HDFS provider writes LZ4-compressed delta files of
      `UnsafeRow` key/value records (version = batch id + 1) and
      periodic snapshots. RocksDB uploads zips plus shared SST files,
      or changelogs when changelog checkpointing is on.
    - The state data source (`statestore`, `state-metadata`) reads any
      checkpoint as a table, including the change feed,
      `transformWithState` variables and timers.
    - Python `transformWithState` (`transformWithStateInPandas` 4.0,
      row-based 4.1) runs on RocksDB only. Every state call is a
      protobuf round trip to a per-task state server. Event-time
      timers fire at expiry <= watermark, after the input rows.
      `handleExpiredTimer`'s parameter names matter, timestamps read
      back from state are naive local times, and `ProcessingTime` mode
      keeps `availableNow` running forever in 4.2.0.
    - TTL is processing-time only. Value state evolves only with the
      `avro` encoding format chosen at the start, and an Avro rename
      silently drops the old value.
    - Real-Time Mode keeps tasks running for the whole batch. In 4.2.0
      it accepts Kafka sources, console, `foreach` and Kafka sinks,
      update mode and stateless operators, no Python UDFs, and a Python
      `foreach` sink batches records by design.

    Next: **Determinism, Retries and Fault Injection**, where the replays
    you just watched in streaming meet their batch cousins (task
    retries, stage retries after lost shuffle files) and you prove a
    pipeline correct by breaking it on purpose.
