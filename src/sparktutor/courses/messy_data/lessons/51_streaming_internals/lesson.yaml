    ## A Timestamp Trap in Python State

    Store a `TIMESTAMP` in a value state, read it back in a later
    batch, and compare it with the input. This processor records what
    it sees (session time zone UTC, machine time zone
    America/Los_Angeles):

    ```python
    from pyspark.sql import Row
    from pyspark.sql.streaming import StatefulProcessor

    spark.conf.set("spark.sql.session.timeZone", "UTC")
    spark.conf.set("spark.sql.streaming.stateStore.providerClass",
        "org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider")

    class Probe(StatefulProcessor):
        def init(self, handle):
            self.v = handle.getValueState("v", "t TIMESTAMP")
        def handleInputRows(self, key, rows, timerValues):
            prev = self.v.get()
            for r in rows:
                self.v.update((r.ts,))
                yield Row(k=key[0], input_repr=repr(r.ts), input_ts=r.ts,
                          state_repr=repr(prev[0]) if prev else None,
                          state_ts=prev[0] if prev else None)
        def close(self):
            pass

    probe = tempfile.mkdtemp()
    os.makedirs(f"{probe}/in")
    for name, ts in [("a.json", "2026-10-01T10:00:00"), ("b.json", "2026-10-01T11:00:00")]:
        with open(f"{probe}/in/{name}", "w") as f:
            f.write(json.dumps({"k": "a", "ts": ts}) + "\n")
    os.utime(f"{probe}/in/a.json", (1, 1))              # a.json is the older file
    q = (spark.readStream.schema("k STRING, ts TIMESTAMP").option("maxFilesPerTrigger", 1)
         .json(f"{probe}/in").groupBy("k")
         .transformWithState(Probe(), "k STRING, input_repr STRING, input_ts TIMESTAMP, "
                             "state_repr STRING, state_ts TIMESTAMP", "Update", "None")
         .writeStream.format("memory").queryName("probe").outputMode("update")
         .option("checkpointLocation", f"{probe}/ck").trigger(availableNow=True).start())
    q.awaitTermination()
    spark.table("probe").show(truncate=False, vertical=True)
    ```

    ```text
    -RECORD 0-----------------------------------------------------------------
     k          | a
     input_repr | datetime.datetime(2026, 10, 1, 10, 0, tzinfo=zoneinfo.ZoneInfo(key='UTC'))
     input_ts   | 2026-10-01 10:00:00
     state_repr | NULL
     state_ts   | NULL
    -RECORD 1-----------------------------------------------------------------
     k          | a
     input_repr | datetime.datetime(2026, 10, 1, 11, 0, tzinfo=zoneinfo.ZoneInfo(key='UTC'))
     input_ts   | 2026-10-01 11:00:00
     state_repr | datetime.datetime(2026, 10, 1, 3, 0)
     state_ts   | 2026-10-01 03:00:00
    ```

    The previous batch stored 10:00 UTC. Input rows arrive as
    timezone-aware datetimes in the session time zone, but the value
    comes back from state as a **naive datetime in the Python worker's
    local time zone** (03:00 in Los Angeles is 10:00 UTC). Comparing the
    two raises `TypeError: can't compare offset-naive and offset-aware
    datetimes`, and emitting the naive value writes 03:00, seven hours
    off. On a machine whose zone equals the session zone you see only
    the `TypeError`, which makes this easy to miss in tests and hit in
    production. Store event times in state as `LONG` epoch
    milliseconds (`int(r.ts.timestamp() * 1000)`), as the exercise
    does, and convert at the edges.

