  Output: |
    ## Decoding a Delta File in Pure Python

    ```python
    import glob, struct

    def lz4_block(src):                     # LZ4 block format, decompression only
        out, i = bytearray(), 0
        while i < len(src):
            token = src[i]; i += 1
            n = token >> 4                  # literal length
            if n == 15:
                while True:
                    b = src[i]; i += 1; n += b
                    if b != 255: break
            out += src[i:i + n]; i += n
            if i >= len(src): break         # the last sequence has literals only
            offset = src[i] | (src[i + 1] << 8); i += 2
            m = token & 15                  # match length minus 4
            if m == 15:
                while True:
                    b = src[i]; i += 1; m += b
                    if b != 255: break
            for _ in range(m + 4):          # byte by byte: a match may overlap itself
                out.append(out[-offset])
        return bytes(out)

    def lz4_java_stream(data):              # LZ4BlockOutputStream framing
        out, i = bytearray(), 0
        while i < len(data):
            assert data[i:i + 8] == b"LZ4Block"
            method = data[i + 8] & 0xF0     # 0x10 raw, 0x20 LZ4
            clen, olen, _checksum = struct.unpack_from("<iii", data, i + 9)
            body = data[i + 21:i + 21 + clen]
            out += body if method == 0x10 else lz4_block(body)
            i += 21 + clen
        return bytes(out)

    def records(raw):                       # the delta file records
        i = 0
        while True:
            klen, = struct.unpack_from(">i", raw, i); i += 4
            if klen == -1: return
            key = raw[i:i + klen]; i += klen
            vlen, = struct.unpack_from(">i", raw, i); i += 4
            if vlen == -1:
                yield key, None
                continue
            yield key, raw[i:i + vlen]; i += vlen

    def unsafe_field(row, ordinal, nfields):
        """UnsafeRow: a null bitset of 8-byte words, one 8-byte slot per
        field, then the variable-length region. A string slot holds
        (offset << 32 | size); a long slot holds the value."""
        slot, = struct.unpack_from("<q", row, ((nfields + 63) // 64) * 8 + 8 * ordinal)
        return slot

    def unsafe_string(row, ordinal, nfields):
        slot = unsafe_field(row, ordinal, nfields)
        return row[slot >> 32:(slot >> 32) + (slot & 0xFFFFFFFF)].decode()

    spark.conf.set("spark.sql.shuffle.partitions", "2")   # undo the previous example
    work = tempfile.mkdtemp()
    inbox, ck = f"{work}/in", f"{work}/ck"
    os.makedirs(inbox)
    for i, users in enumerate([["u1", "u2", "u1"], ["u2", "u3"]]):
        with open(f"{inbox}/{i}.json", "w") as f:
            f.writelines(json.dumps({"user": u}) + "\n" for u in users)
        (spark.readStream.schema("user STRING").json(inbox).groupBy("user").count()
         .writeStream.format("console").outputMode("update")
         .option("checkpointLocation", ck).trigger(availableNow=True)
         .start().awaitTermination())

    for path in sorted(glob.glob(f"{ck}/state/0/*/*.delta")):
        raw = lz4_java_stream(open(path, "rb").read())
        print(path.split("state/")[1], len(raw), "bytes:",
              [(unsafe_string(k, 0, 1), None if v is None else unsafe_field(v, 0, 1))
               for k, v in records(raw)])
    ```

    ```text
    0/0/1.delta 52 bytes: [('u1', 2)]
    0/0/2.delta 4 bytes: []
    0/1/1.delta 52 bytes: [('u2', 1)]
    0/1/2.delta 100 bytes: [('u2', 2), ('u3', 1)]
    ```

    `u1` hashed to partition 0 and `u2`, `u3` to partition 1. Partition
    0 had nothing to change in batch 1, so its version-2 delta is just
    the end marker: four bytes of `ff ff ff ff`. The second batch did
    not write `u1` again, which is why a store has to replay deltas on
    top of the latest snapshot to rebuild itself, and why snapshots
    exist.

    The schema of those rows is in `state/0/0/_metadata/schema` (key
    and value `StructType`s as JSON, written by
    `StateSchemaCompatibilityChecker`), and the operator that owns them
    is in `state/0/_metadata/metadata`:

    ```text
    v1
    {"operatorInfo":{"operatorId":0,"operatorName":"stateStoreSave"},
     "stateStoreInfo":[{"storeName":"default","numColsPrefixKey":0,"numPartitions":2}]}
    ```

