    ## State on Disk: the HDFS-Backed Provider

    The default provider, `HDFSBackedStateStoreProvider`
    (`streaming/state/HDFSBackedStateStoreProvider.scala`), keeps each
    partition's state as a hash map in executor memory and writes one
    **delta file per version**. Batch N produces version N + 1, so
    `state/0/1/2.delta` is partition 1's change in batch 1. Every
    `spark.sql.streaming.stateStore.minDeltasForSnapshot` deltas
    (default 10) a background maintenance task (every
    `spark.sql.streaming.stateStore.maintenanceInterval`, default 60s)
    writes a `<version>.snapshot` with the whole map, and old files are
    deleted once more than `spark.sql.streaming.minBatchesToRetain`
    (default 100) versions exist. Short test runs never reach a
    snapshot; a production checkpoint shows both kinds of file.

    The format is in `writeUpdateToDeltaFile` and
    `writeRemoveToDeltaFile`: a stream compressed with the codec in
    `spark.sql.streaming.stateStore.compression.codec` (default `lz4`),
    holding records of

    ```text
    int keySize, key bytes, int valueSize, value bytes     (an update)
    int keySize, key bytes, int -1                         (a removal)
    ...
    int -1                                                 (end of file)
    ```

    where the key and value are `UnsafeRow` bytes and the ints are big
    endian (Java's `DataOutputStream`). Here is a file from a simple
    `groupBy("user").count()`:

    ```text
    $ xxd state/0/1/1.delta
    00000000: 4c5a 3442 6c6f 636b 2528 0000 0034 0000  LZ4Block%(...4..
    00000010: 0083 038c 0853 0000 0018 0001 00a3 0200  .....S..........
    00000020: 0000 1000 0000 7532 1100 020f 0001 0200  ......u2........
    00000030: c001 0000 0000 0000 00ff ffff ff4c 5a34  .............LZ4
    00000040: 426c 6f63 6b15 0000 0000 0000 0000 0000  Block...........
    ```

    `LZ4Block` is the framing of lz4-java's `LZ4BlockOutputStream`:
    a token byte (`0x25`: method LZ4, level 5), the compressed and
    original lengths as little-endian ints (`0x28` = 40, `0x34` = 52),
    a checksum, then an LZ4 block. The file ends with an empty block
    (token `0x15`, raw, length 0). You can read the whole thing with
    the standard library:

