    ## Running Real-Time Mode on a Laptop

    The only built-in source that supports it is Kafka
    (`KafkaMicroBatchStream` implements `SupportsRealTimeMode`). The
    main jar also ships a source meant for Spark's own tests,
    `LowLatencyMemoryStream`
    (`streaming/sources/LowLatencyMemoryStream.scala`). Through
    `spark._jvm` in Classic mode you can use it to watch Real-Time Mode
    run without a broker. Treat it strictly as a lab instrument:

    ```python
    import time
    from pyspark.sql import DataFrame

    jvm = spark._jvm
    LL = jvm.org.apache.spark.sql.execution.streaming.sources.LowLatencyMemoryStream
    stream = LL.apply(spark._jsparkSession, 1, jvm.org.apache.spark.sql.Encoders.STRING())
    rt_df = DataFrame(stream.toDF(), spark)

    def add(value):
        values = jvm.java.util.ArrayList()
        values.add(value)
        stream.addData(jvm.scala.jdk.javaapi.CollectionConverters.asScala(values))

    rt_dir = tempfile.mkdtemp()
    sink_log = f"{rt_dir}/sink.log"

    def write_row(row):                       # a Python foreach sink
        with open(sink_log, "a") as f:
            f.write(json.dumps({"v": row.value, "seen_ms": int(time.time() * 1000)}) + "\n")

    q = (rt_df.writeStream.foreach(write_row).option("checkpointLocation", f"{rt_dir}/ck")
         .outputMode("update").trigger(realTime="15 seconds").start())
    t0 = time.time(); time.sleep(3)
    sent = {}
    for i in range(10):
        sent[f"m{i}"] = int(time.time() * 1000); add(f"m{i}"); time.sleep(1.0)
    time.sleep(14)
    q.stop()
    for line in open(sink_log):
        r = json.loads(line)
        print(r["v"], "added at %.1fs" % (sent[r["v"]] / 1000 - t0),
              "latency_ms", r["seen_ms"] - sent[r["v"]])
    ```

    Ten records, one per second, into one 15 second batch:

    ```text
    m0 added at 3.0s latency_ms 12030
    m1 added at 4.0s latency_ms 11020
    m2 added at 5.0s latency_ms 10017
    ...
    m8 added at 11.0s latency_ms 3997
    m9 added at 12.0s latency_ms 2993
    ```

    Every record reached Python when the batch ended. The engine was
    streaming; the Python sink was not. `PythonForeachWriter`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/python/streaming/PythonForeachWriter.scala`)
    pickles rows with `SerDeUtil.AutoBatchedPickler`, whose batch size
    starts at 1 and doubles while batches are under 1 MB, and the
    `PythonRunner` writer thread fills a buffer of `spark.buffer.size`
    bytes (default 65536) before it sends anything to the worker. A
    trickle of tiny rows never fills it. Start the session with
    `.config("spark.buffer.size", "64")` and the same run gives:

    ```text
    m0 added at 3.0s latency_ms 1040
    m1 added at 4.0s latency_ms 2017
    m2 added at 5.0s latency_ms 1014
    m3 added at 6.0s latency_ms 4016
    m4 added at 7.0s latency_ms 3013
    m5 added at 8.0s latency_ms 2011
    m6 added at 9.0s latency_ms 1008
    m7 added at 10.0s latency_ms 5450
    ...
    ```

    Now the pickler's doubling shows: records arrive in groups of 1, 2,
    4 and then the rest, each group waiting for its last member. The
    lesson for real systems: Real-Time Mode's latency is a property of
    the whole path, and in 4.2.0 a Python stage in it batches. Low
    latency pipelines keep the hot path in the JVM (Kafka in, Kafka
    out) and do Python work elsewhere. "The Python Worker Protocol"
    takes these runner classes apart.

