                            "session":2,"default":1,"$eventTimers_keyToTimestamp":4}, ...}
    ```

    and from a `groupBy().count()` with changelog checkpointing on,
    after four batches: only `state/0/0/1.changelog` to
    `4.changelog`, no zip yet.

    Other RocksDB settings worth knowing, all under
    `spark.sql.streaming.stateStore.rocksdb.` (defaults from
    `RocksDBConf` in `RocksDB.scala`): `boundedMemoryUsage` (`false`)
    and `maxMemoryUsageMB` (`500`) to cap the memory of all instances
    on an executor, `blockCacheSizeMB` (`8`), `compactOnCommit`
    (`false`), and `formatVersion` (`5`, pinned by the checkpoint).

    Column families matter for the next section: `transformWithState`
    gives every state variable its own column family in one RocksDB
    instance (`session`, `seen` above) and keeps event-time timers in
    two more, `$eventTimers_keyToTimestamp` (prefix-scanned by key) and
    `$eventTimers_timestampToKey` (range-scanned in time order, so
    finding expired timers is one ordered scan). The HDFS provider has
    no column families, and `validateStateStoreProvider` in
    `streaming/operators/stateful/transformwithstate/TransformWithStateExecBase.scala`
    allows only `RocksDBStateStoreProvider`. With the default provider
    the query fails:

    ```python
    from pyspark.sql.streaming import StatefulProcessor

    class Noop(StatefulProcessor):
        def init(self, handle):
            pass
        def handleInputRows(self, key, rows, timerValues):
            return iter([])
        def close(self):
            pass

    PROVIDER = "spark.sql.streaming.stateStore.providerClass"
    spark.conf.set(PROVIDER,
        "org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider")
    try:
        (spark.readStream.schema("user STRING").json(inbox).groupBy("user")
         .transformWithState(Noop(), "user STRING", "Update", "None")
         .writeStream.format("console").option("checkpointLocation", tempfile.mkdtemp())
         .trigger(availableNow=True).start().awaitTermination())
    except Exception as e:
        print(str(e).splitlines()[0])
    spark.conf.set(PROVIDER,
        "org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider")
    ```

    ```text
    [UNSUPPORTED_FEATURE.STORE_BACKEND_NOT_SUPPORTED_FOR_TWS] The feature is not
    supported: Store backend org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider
    is not supported by TransformWithState operator. Please use RocksDBStateStoreProvider.
    ```

