    ## The Restart Protocol

    `MicroBatchExecution.populateStartOffsets`
    (`streaming/runtime/MicroBatchExecution.scala`) decides where a
    restarted query begins. It reads the newest offsets file N and the
    newest commit file M:

    | Checkpoint state | What the next run does |
    |---|---|
    | no offsets at all | a new query: batch 0. If `commits/` or `state/` already hold files it fails with `STATE_STORE_CHECKPOINT_LOCATION_NOT_EMPTY` (internal `spark.sql.streaming.verifyCheckpointDirectoryEmptyOnStart`, 4.1, default `true`) |
    | M == N | batch N finished: plan batch N + 1, starting from N's end offsets and the watermark in `commits/N` |
    | M == N - 1 | batch N was planned but never committed: **re-run batch N with exactly the offsets recorded in `offsets/N`** |
    | M < N - 1 | logged as a warning; the same as above |

    The middle row is the heart of exactly-once. The order inside each
    batch (in `runBatch` and `markMicroBatchEnd`) is:

    1. write `offsets/N` (the plan)
    2. run the batch: tasks read the source range, update the state
       store (which writes state version N + 1) and write to the sink
    3. the sink commits
    4. write `commits/N`

    A crash anywhere before step 4 replays batch N. The replay reads the
    same offsets, starts from the same state version N, and hands the
    sink the same batch id, so a source that can re-read a range and a
    sink that is idempotent per batch id give exactly-once results. A
    crash between 3 and 4 is the case the sink must handle: the data
    is already out, and it will arrive again.

    **No-data batches.** After the data runs out, the engine asks each
    stateful operator `shouldRunAnotherBatch(newWatermark)`. If the
    watermark moved past something the operator is holding (a window
    to emit, state to evict, a timer to fire), Spark plans one more
    batch with no new input (`spark.sql.streaming.noDataMicroBatches.enabled`,
    default `true`). That is batch 1 and batch 3 above: they wrote the
    windows that the new watermark closed. With `availableNow`, the
    query stops only when neither new data nor a no-data batch is due.

