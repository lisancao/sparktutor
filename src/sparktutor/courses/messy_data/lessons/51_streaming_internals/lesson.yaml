    ## Timers, Precisely

    In `EventTime` mode a timer fires when its expiry is **less than
    or equal to** the watermark used for eviction in that batch
    (`TimerStateImpl.getExpiredTimers`, the `<=` comparison in
    `streaming/operators/stateful/transformwithstate/timers/TimerStateImpl.scala`).
    A timer registered at exactly 10:00:00 with the watermark reaching
    exactly 10:00:00 fired in the next batch in my run, with
    `expiredTimerInfo.getExpiryTimeInMs()` equal to
    `timerValues.getCurrentWatermarkInMs()`.

    Within one task, keys with new rows are handled first and expired
    timers after them: the Python serializers in
    `python/pyspark/sql/pandas/serializers.py` yield every
    `PROCESS_DATA` group, then one `PROCESS_TIMER` step, then
    `COMPLETE`. And the watermark lags the data. In the exercise, user
    `u4`'s last click is at 10:05:44, so its timer is at 10:35:44. The
    batch that brings u4's next click (10:58:40, 53 minutes later) runs
    with an eviction watermark of 10:02:28, so the timer has not
    fired. Only `handleInputRows` can see the gap: it emits the old
    session itself, starts a new one and moves the timer. A processor
    that closes sessions only in `handleExpiredTimer` would merge the
    two sessions into one.

    Two traps I hit while writing this lesson:

    - **Parameter names are part of the API.** PySpark calls
      `handleExpiredTimer(key=..., timerValues=..., expiredTimerInfo=...)`
      with keyword arguments. A processor that names its parameters
      `(self, key, tv, info)` fails at the first expired timer with
      `TypeError: T.handleExpiredTimer() got an unexpected keyword
      argument 'timerValues'`.
    - **`ProcessingTime` mode never lets `availableNow` finish.** In
      4.2.0 `shouldRunAnotherBatch` returns `true` unconditionally for
      `timeMode="ProcessingTime"` (the code carries a TODO to check for
      registered timers), so after the data runs out the query plans
      no-data batch after no-data batch. A test query with
      `availableNow` and `ProcessingTime` passed 750 batches before I
      killed it. Use `processingTime=` triggers with an explicit
      `stop()` for such queries, or `EventTime` mode.

