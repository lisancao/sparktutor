    ## Which Changes Survive a Restart

    Changing a stateful query and restarting it on the old checkpoint
    goes through `StateSchemaCompatibilityChecker`
    (`streaming/state/StateSchemaCompatibilityChecker.scala`) and the
    operator metadata check. I restarted a one-variable
    `transformWithState` query with a changed value schema, once with
    each `spark.sql.streaming.stateStore.encodingFormat` (4.0; default
    `unsaferow`, and pinned by the checkpoint at the first batch). The
    second column shows what the restarted query read from state:

    | Change to the value state | `unsaferow` | `avro` |
    |---|---|---|
    | none | `(1,)` | `(1,)` |
    | rename `n INT` to `count INT` | `(1,)`: accepted, names are ignored | `(None,)`: **silently lost** |
    | add a field | `STATE_STORE_VALUE_SCHEMA_NOT_COMPATIBLE` | `(1, None)` |
    | drop a field | (not tested) | `(1,)` |
    | widen `INT` to `LONG` | `STATE_STORE_VALUE_SCHEMA_NOT_COMPATIBLE` | `(1,)` |
    | narrow `LONG` to `INT` | (not tested) | `STATE_STORE_INVALID_VALUE_SCHEMA_EVOLUTION` |
    | `INT` to `STRING` | (not tested) | `STATE_STORE_INVALID_VALUE_SCHEMA_EVOLUTION` |
    | value state to list state | (not tested) | `STATE_STORE_INVALID_VARIABLE_TYPE_CHANGE` |

    The rules behind the table:

    - With `unsaferow`, the check is
      `DataType.equalsIgnoreNameAndCompatibleNullability`: same types in
      the same positions, names ignored. Rows are read by position, so
      a rename works; the tested changes failed, and by this rule any
      other change should too.
    - With `avro`, value schemas may evolve
      (`schemaEvolutionEnabled = usingAvro && ...` in
      `statefulOperators.scala`): the new schema must be able to read
      every old one under Avro's resolution rules (checked with Avro's
      `SchemaValidatorBuilder().canReadStrategy`). Avro matches fields
      **by name**, so a rename is a drop plus an add, and the old value
      reads as `None`. Spark gives no warning.
    - The number of value schema versions per state variable is capped
      by `spark.sql.streaming.stateStore.valueStateSchemaEvolutionThreshold`
      (default 16), after which you get
      `STATE_STORE_VALUE_SCHEMA_EVOLUTION_THRESHOLD_EXCEEDED`.

    Changes outside the value schema, on any operator:

    | Change | Error |
    |---|---|
    | different grouping key (`groupBy("u")` to `groupBy(upper("u"), "u")`) | `STATE_STORE_KEY_SCHEMA_NOT_COMPATIBLE` |
    | different stateful operator (`count()` to `dropDuplicates`) | `STREAMING_STATEFUL_OPERATOR_NOT_MATCH_IN_STATE_METADATA` |
    | `state/` deleted, offsets kept | `STREAMING_STATEFUL_OPERATOR_MISSING_STATE_DIRECTORY` |
    | `metadata` file deleted, offsets kept | `STREAMING_CHECKPOINT_MISSING_METADATA_FILE` |

    If you expect a value schema to change, start the query with
    `encodingFormat` set to `avro` (you cannot switch later), only add
    fields or widen types, and never rename. The schema history lives
    in `state/<op>/_stateSchema/default/` (one file per evolution,
    referenced from the `v2` operator metadata in
    `state/<op>/_metadata/v2/<batch>`).

