  Output: |
    ## Offsets and Commits, Byte by Byte

    Every log file starts with a version line and then JSON. Here are
    `metadata`, `offsets/0` and `commits/0` from the run above (the
    `conf` map is shortened):

    ```text
    metadata:
    {"id":"f59ea917-034c-4199-bbf6-0926083741a4"}

    offsets/0:
    v1
    {"batchWatermarkMs":0,"batchTimestampMs":1793219188602,"conf":{
      "spark.sql.streaming.stateStore.providerClass":"org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider",
      "spark.sql.streaming.stateStore.encodingFormat":"unsaferow",
      "spark.sql.streaming.stateStore.compression.codec":"lz4",
      "spark.sql.shuffle.partitions":"2", ...}}
    {"logOffset":0}

    commits/0:
    v1
    {"nextBatchWatermarkMs":1790848260000}
    ```

    An offsets file has three parts:

    1. `v1`: the offset log format. 4.2.0 can also write `v2`, with one
       `sourceId:offset` line per source instead of a list by position
       (selected by the internal `spark.sql.streaming.offsetLog.formatVersion`,
       new in 4.2.0, default 1); it goes with the 4.2 work on adding
       and removing sources by name (SPARK-54909).
    2. `OffsetSeqMetadata`: the batch's watermark, the batch's
       processing timestamp, and a `conf` map.
    3. One line per source, in source order: whatever that source's
       offset serializes to. The file source's offset `{"logOffset":0}`
       points into its own log, `sources/0/0`, which lists the files:

    ```text
    v1
    {"path":"file:///.../inbox/a.json","timestamp":1793219187200,"batchId":0}
    ```

    The commit file stores only the watermark for the *next* batch:
    `nextBatchWatermarkMs` is 10:01 minus 10 minutes as epoch
    milliseconds, the max event time seen in batch 0 minus the delay.
    (The commit log also has formats `v2` and `v3`, which add state
    store checkpoint ids and per-sink metadata. The version follows the
    internal `spark.sql.streaming.stateStore.checkpointFormatVersion`,
    default 1, so you will rarely meet them.)

