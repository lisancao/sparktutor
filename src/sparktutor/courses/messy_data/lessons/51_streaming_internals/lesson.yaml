    ## Real-Time Mode

    Micro-batches have a floor on latency: planning, scheduling and
    committing each batch takes time, and a record that arrives just
    after a batch started waits for the next one. **Real-Time Mode**
    (4.1 in Scala, SPARK-53737; PySpark trigger in 4.2, SPARK-54660)
    changes the shape of a batch: tasks are launched once per long
    batch and keep reading and writing records as they arrive, until
    the batch duration is up. The checkpoint protocol is unchanged
    (offsets before, commits after), so the batch duration is the
    checkpoint interval, not the latency.

    The trigger is `.trigger(realTime="5 seconds")` on `writeStream`,
    with `outputMode("update")`; the next section runs a full query.

    The Learning Spark course's "Structured Streaming" lesson lists the
    restrictions; here
    is where they live and what each one looks like. The allowlist is
    `RealTimeModeAllowlist` (`streaming/runtime/RealTimeModeAllowlist.scala`):
    sinks console, `foreach`, Kafka and a test-only memory sink;
    operators such as project, filter, generate (explode), union,
    broadcast hash join and the watermark node. I tried each case:

    | Query | Result in 4.2.0 |
    |---|---|
    | file source | `STREAMING_REAL_TIME_MODE.INPUT_STREAM_NOT_SUPPORTED` (`FileStreamSource`), when the query runs |
    | rate source | `STREAMING_REAL_TIME_MODE.INPUT_STREAM_NOT_SUPPORTED` (`RateStreamMicroBatchStream`) |
    | append output mode | `STREAMING_REAL_TIME_MODE.OUTPUT_MODE_NOT_SUPPORTED`, at `start()` |
    | `foreachBatch` sink | `STREAMING_REAL_TIME_MODE.OPERATOR_OR_SINK_NOT_IN_ALLOWLIST` (`ForeachBatchSink`), at `start()` |
    | `groupBy().count()` | `OPERATOR_OR_SINK_NOT_IN_ALLOWLIST` (`HashAggregateExec`, `ShuffleExchangeExec`), when the query runs |
    | a Python UDF | `OPERATOR_OR_SINK_NOT_IN_ALLOWLIST` (`ArrowEvalPythonExec`), when the query runs |
    | `realTime="1 second"` | `INVALID_STREAMING_REAL_TIME_MODE_TRIGGER_INTERVAL`: below `spark.sql.streaming.realTimeMode.minBatchDuration` (default 5000 ms) |
    | projection and filter, console sink | runs |

    `spark.sql.streaming.realTimeMode.allowlistCheck=false` turns the
    operator and sink check off "at your own risk", in the words of
    the error. Python UDFs not being on the list is the big one for
    this course: in 4.2.0 a Real-Time Mode query cannot run Python per
    row except in a `foreach` sink.

