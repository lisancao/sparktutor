    ## Theta Sketches and Set Operations

    HLL answers "how many distinct". Questions like "how many users
    came back the next day" need **intersections**, and HLL cannot do
    them well. Spark 4.1 added theta sketches (SPARK-52407):
    `theta_sketch_agg`, `theta_union`, `theta_union_agg`,
    `theta_intersection`, `theta_intersection_agg`, `theta_difference`
    and `theta_sketch_estimate`.

    A theta sketch keeps the `k` **smallest hash values** it has seen
    (as fractions of the hash range) and a threshold `theta`: the
    largest hash still kept. If `k` hashes fall below `theta`, the
    number of distinct values is about `k / theta`. Because it keeps
    actual hashes, two sketches can be intersected: keep the hashes
    below both thresholds that appear in both. From the JVM:

    ```text
    org.apache.datasketches.theta.HeapCompactSketch 4096 0.04177634717109197 98045.91060164096 ...

    ### HeapCompactSketch SUMMARY:
       Estimate                : 98045.91060164096
       Upper Bound, 95% conf   : 101104.03886023912
       Lower Bound, 95% conf   : 95079.89637942011
       Theta (double)          : 0.04177634717109197
       EstMode?                : true
       Retained Entries        : 4096
       Seed Hash               : 93cc | 37836
    ```

    100,000 values, 4,096 hashes kept below `theta ≈ 0.0418`, estimate
    `4096 / 0.0418 ≈ 98,046`. `lgNomEntries` defaults to 12 and ranges
    from 4 to 26 (`ThetaSketchUtils` in
    `sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/util/`).
    Spark stores theta sketches with `toByteArrayCompressed`, the
    compressed compact format (serial version 4, the second byte of the
    sketch), 25,618 bytes here.

    The **seed hash** `93cc` identifies the hash seed: DataSketches'
    default update seed is 9001
    (`org.apache.datasketches.thetacommon.ThetaUtil.DEFAULT_UPDATE_SEED`),
    and sketches built with different seeds refuse to merge. Spark does
    not let you change it, which is what you want.

    Over 200 groups of 20,000 the default theta sketch measured an RSE
    of 1.21%, comparable to `1 / sqrt(4096) = 1.56%`.

