  Output: |
    ## Compatibility With Other DataSketches Libraries

    The sketches Spark writes are ordinary DataSketches serializations,
    which is why `HllSketch.heapify`, `Sketch.heapify` and
    `KllDoublesSketch.heapify` from the bundled `datasketches-java` 6.2.0
    read them back above. The DataSketches project defines one binary
    format per sketch family for its Java, C++ and Python libraries, so
    in principle a Python job can read Spark's sketches with the
    `datasketches` package. This lesson did not verify that (the package
    is not part of PySpark's dependencies). What you would check, with
    a sketch from each family (the Python names below are from the
    `datasketches` package's API and were not run here):

    - HLL: `datasketches.hll_sketch.deserialize(b).get_estimate()`
      equals `hll_sketch_estimate`; Spark writes the **updatable** form
      of an HLL_8 sketch.
    - Theta: `datasketches.compact_theta_sketch.deserialize(b)` reads
      the **compressed** compact format (serial version 4, written by
      `toByteArrayCompressed`), so the reader's version must support
      serial version 4. The seed must be the default 9001.
    - KLL: `datasketches.kll_doubles_sketch.deserialize(b)` and the same
      quantiles for the same ranks (within `ε`, since KLL merges are
      randomized).

    And in the other direction, a sketch produced elsewhere must use the
    same hashing of the same bytes: a Python sketch of `str(user_id)` and
    a Spark sketch of a BIGINT user id are different sets.

