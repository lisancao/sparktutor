    ## What You'll Learn

    "Production Ingestion: Quality Rules, Quarantine and Pipelines" in
    the intermediate level profiled data with `approx_count_distinct`
    and saw it report 37 customers where there were 40, then stored an
    `hll_sketch_agg` per file to count customers across files later.
    This lesson takes the sketches apart: how each one is built, what
    its bytes contain, what error it promises, how to measure that
    error against exact answers, and how to design tables of sketches
    that answer weekly questions without ever reading the raw data
    again.

    "Building LSH and an IVF Vector Index" and "Distributed Connected
    Components" were distributed algorithms you built from primitives.
    Sketches are the other kind: small summaries that a task builds over
    its partition, that merge associatively, and whose error is known in
    advance. That last property is why Spark can make them aggregate
    functions.

    By the end of this lesson you will be able to:

    - Explain Spark's own HyperLogLog++ behind `approx_count_distinct`
      (`rsd`, precision, registers, linear counting, bias correction)
      and why its state cannot be stored
    - Build, store, merge and inspect DataSketches HLL sketches
      (`hll_sketch_agg`, 3.5), read their bytes and their error bounds
      through the JVM
    - Avoid the traps of hashing messy values: types, empty strings,
      case and spaces, collations, mismatched `lgConfigK`
    - Use theta sketches (4.1) for unions, intersections and
      differences, and predict when an intersection estimate is useless
    - Use tuple sketches (4.2) for distinct keys with a summary, and
      scale their summaries correctly
    - Use KLL quantile sketches (4.1) and reason in rank error, not value
      error
    - Roll daily sketches up to weekly answers from a sketch table, and
      prove that the rollup never touched the raw data

