    ## Hashing Messy Values

    A sketch counts distinct **hashes**, so anything that changes a
    value's bytes changes the count. The same 1,000 ids sketched as
    BIGINT and as STRING, then unioned:

    ```text
    bigint+string union: 2009
    bigint+int union: 988
    theta bigint+int union: 1000
    ```

    `"1"` and `1` are different values to a hash: the union counts every
    user twice. INT and BIGINT agree because DataSketches' HLL sketch has
    no `update(int)` (`javap` on `BaseHllSketch` lists `update(long)`,
    `update(double)`, `update(String)`, byte, char, int-array and
    long-array forms), so Spark's `Int` goes to `update(long)`. Store the type you
    sketched next to the sketch, and never union sketches of different
    types.

    Messy ids are worse. Five spellings of two people, an empty string
    and a NULL:

    ```python
    messy = spark.createDataFrame(
        [("Alice",), ("alice",), ("ALICE ",), (" alice",), ("",), (None,), ("Bob",)], "u string")
    ```

    ```text
    raw=5, lcase=4, normalized=2, acd=6, acd_lcase=5, exact=6, theta=5
    ```

    - `raw`, `hll_sketch_agg(u)`: 5. The empty string is skipped.
    - `lcase`, `hll_sketch_agg(u :: STRING COLLATE UTF8_LCASE)`: 4. The
      HLL functions hash the collation key (collation support came in
      4.0 with SPARK-48003; 4.1 changed it to hash the raw collation key
      bytes, SPARK-53559), so `Alice` and `alice` fold, but the spaces
      still count.
    - `normalized`, `hll_sketch_agg(lower(trim(u)))`: 2, the right
      answer.
    - `acd`, `approx_count_distinct(u)`: 6, and `exact`,
      `count_distinct(u)`: 6. Both count `""` as a value.
    - `theta`: 5, like HLL.

    So on data with empty strings, a sketch and an exact count disagree
    even when the sketch is exact. Normalize first (trim, case, empty to
    NULL), and do it in one function that every sketch and every exact
    check shares. The exercise starts there.

