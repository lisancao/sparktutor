    ## Count-Min: Frequencies

    For "how often does this value appear", Spark has had a count-min
    sketch since 2.0 (`countMinSketch` in the Scala
    `DataFrameStatFunctions`; PySpark's `df.stat` does not have it), and
    since 3.5 the
    aggregate `count_min_sketch(col, eps, confidence, seed)`, which
    returns the serialized sketch as BINARY. The implementation is
    Spark's own, in `common/sketch/` (`org.apache.spark.util.sketch.CountMinSketch`).
    It overestimates, never underestimates, by at most `eps` times the
    total count with probability `confidence`:

    ```python
    c = spark._jvm.org.apache.spark.util.sketch.CountMinSketch.readFrom(bytearray(cms))
    ```

    ```text
    cms bytes 112076 est(7) 5100 exact 5100 est(8) 100 exact 100 total 105000 depth 7 width 2000
    ```

    `eps = 0.001` gave a width of 2,000 counters and `confidence = 0.99`
    a depth of 7 hash rows. It is Spark-specific: there is no SQL
    function to read it back, so you read it through the JVM or with
    your own decoder. For "top values" inside SQL, `approx_top_k` (4.1)
    is the tool "Production Ingestion" used.

