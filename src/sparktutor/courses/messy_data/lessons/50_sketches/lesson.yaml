    ## KLL: Quantiles You Can Merge

    Spark 4.1 added KLL quantile sketches (SPARK-53991):
    `kll_sketch_agg_bigint`, `_float`, `_double`, with
    `kll_sketch_get_quantile_*`, `kll_sketch_get_rank_*`,
    `kll_sketch_get_n_*`, `kll_sketch_merge_*` and
    `kll_sketch_to_string_*`. The aggregate that merges a column of
    stored sketches, `kll_merge_agg_*`, came later (SPARK-54785) and is
    documented as new in 4.1.2 (SPARK-57116 corrected its `versionadded`
    from 4.1.0). `k` defaults to 200 and ranges from 8 to 65,535.

    KLL keeps a hierarchy of sorted buffers. When a level fills, it
    sorts and keeps every other item (choosing odd or even positions at
    random) and promotes them, with double weight, to the next level.
    The guarantee is on **rank**: the estimated quantile `q` for rank
    `r` has a true rank within `ε` of `r`. DataSketches gives `ε` for a
    `k`; from a merged sketch:

    ```text
    normalized rank error k=200: 0.013294757464848584 k=50: 0.05117564776262976
    ```

    and `kll_sketch_to_string_double`:

    ```text
    ### KllKllDoublesSketch Summary:
       K                      : 200
       N                      : 200000
       Epsilon                : 1.329%
       Epsilon PMF            : 1.652%
       Estimation Mode        : true
       Levels                 : 10
       Retained Items         : 496
       Compact Storage Bytes  : 4044
    ```

    200,000 latencies in 496 retained items and 4 KB. Measured against
    the exact quantiles of a log-normal latency sample:

    ```text
    q0.5 54.48 exact 54.81 rank error -0.00292
    q0.9 151.31 exact 152.36 rank error -0.00157
    q0.95 199.27 exact 203.18 rank error -0.00265
    q0.99 362.38 exact 353.0 rank error 0.00087
    q0.999 669.32 exact 661.31 rank error 6e-05
    q50_0.95 235.83 exact 203.18 rank error 0.01615
    q50_0.999 420.91 exact 661.31 rank error -0.00428
    ```

    (`q50_` rows used `k = 50`, 988 bytes.) Read them in ranks, not
    milliseconds. With `k = 50` the p99.9 estimate is 420 ms against a
    true 661 ms, which looks terrible, yet its rank error is only 0.43%,
    well within `ε = 5.1%`: in the far tail a small rank error is a
    large distance in value. For tail latencies, use a larger `k`, or
    check how many items sit above your threshold with
    `kll_sketch_get_rank_double` (the rank of 200 ms was 0.95136 against
    an exact 0.94781).

    Two more things to know. KLL is **randomized**: the same data gives
    slightly different quantiles from run to run (the exercise's p99
    was 351.58, 348.28 and 385.16 in three runs), so tests must check
    rank error against `ε`, never exact values. Over 60 repeated runs
    on 250,000 values the largest rank error was 0.58%, well inside
    1.33%. And `percentile_approx` (3.1) is a different, deterministic
    algorithm whose state, like `approx_count_distinct`'s, cannot be
    stored.

