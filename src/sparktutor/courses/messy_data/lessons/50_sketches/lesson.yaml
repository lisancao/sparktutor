    ## Summary

    - Distinct counts and quantiles do not add; sketches are fixed-size,
      mergeable summaries with known error. Spark plans them as
      `ObjectHashAggregate` with partial and final steps.
    - `approx_count_distinct` is Spark's HyperLogLog++
      (`p = ceil(2 log2(1.106 / rsd))`, 6-bit registers, linear counting,
      bias correction). Its error matches `1.04 / sqrt(m)`, and its state
      cannot be stored.
    - `hll_sketch_agg` (3.5): DataSketches HLL_8, `lgConfigK` 4 to 21
      (default 12), updatable bytes that start sparse. Merged sketches
      are out of order; check against `getRelErr(True, True, lgK, n)`.
    - Hashes see bytes: never mix types, normalize ids (trim, case, empty
      to NULL), know that sketches skip `""` while exact counts do not,
      and keep one `lgConfigK` per column (`HLL_UNION_DIFFERENT_LG_K`).
    - Theta sketches (4.1) keep the `k` smallest hashes and support
      union, intersection and difference; intersection error is relative
      to the union, so small overlaps of big sets are unreliable. Check
      against the result sketch's bounds.
    - Tuple sketches (4.2) attach summaries to keys; in estimation mode
      the summary covers retained keys only, so scale by `theta`.
    - KLL (4.1, `kll_merge_agg_*` in 4.1.2) bounds **rank** error
      (1.33% at `k = 200`); tail values can be far off in milliseconds;
      results vary from run to run.
    - A table of daily sketches with fixed parameters and normalized
      inputs answers weekly questions in a fraction of the space, and
      you can prove it never needs the raw data.

    Next: **Streaming Internals: Checkpoints, State and Real-Time Mode**,
    where state that must survive restarts is not a summary but every
    key a query has seen.
