    ## Union Rules and the Errors You Get

    Merging needs compatible sketches, and Spark checks:

    ```text
    [HLL_UNION_DIFFERENT_LG_K] Sketches have different `lgConfigK` values: 10 and 12. Set the
    `allowDifferentLgConfigK` parameter to true to call `hll_union_agg` with different `lgConfigK`
    values. SQLSTATE: 22000
    ```

    With `hll_union_agg("s", True)` the union works and the result has
    the **smaller** `lgConfigK`, so the precision of the whole union
    drops to the least precise input. Pick one `lgConfigK` per table
    and keep it forever.

    The other errors, all from real runs:

    ```text
    [HLL_INVALID_LG_K] Invalid call to `hll_sketch_agg`; the `lgConfigK` value must be between 4
    and 21, inclusive: 30. SQLSTATE: 22546

    [HLL_K_MUST_BE_CONSTANT] Invalid call to `hll_sketch_agg`; the `K` value must be a constant
    value, but got a non-constant expression. SQLSTATE: 42K0E

    [HLL_INVALID_INPUT_SKETCH_BUFFER] Invalid call to `hll_sketch_estimate`; only valid HLL sketch
    buffers are supported as inputs (such as those produced by the `hll_sketch_agg` function).
    SQLSTATE: 22546

    [DATATYPE_MISMATCH.UNEXPECTED_INPUT_TYPE] Cannot resolve "hll_sketch_agg(CAST(id AS DOUBLE), 12)"
    due to data type mismatch: The first parameter requires the ("INT" or "BIGINT" or "STRING" or
    "BINARY") type, however "CAST(id AS DOUBLE)" has the type "DOUBLE". SQLSTATE: 42K09
    ```

    The constant-K rule (SPARK-54138, in 4.1) means you cannot choose
    precision per group with a column. Doubles are rejected on purpose
    (the source comment: "due to imprecision"); theta sketches accept
    them, but think twice before counting distinct floating point
    values.

