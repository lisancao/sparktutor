    ## Spark's Own HyperLogLog++

    `approx_count_distinct(col, rsd=0.05)` is not a DataSketches
    function. It is `HyperLogLogPlusPlus`
    (`sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/expressions/aggregate/HyperLogLogPlusPlus.scala`),
    with the algorithm in `HyperLogLogPlusPlusHelper`
    (`sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/util/HyperLogLogPlusPlusHelper.scala`),
    following Heule, Nunkesser and Hall, "HyperLogLog in Practice"
    (2013). From the 4.2.0 source:

    - **Precision** from the requested `rsd`:
      `p = ceil(2 * log2(1.106 / rsd))`, and `m = 2^p` registers.
    - **Hashing**: `XxHash64Function.hash(value, dataType, 42L,
      isCollationAware = true, ...)`. The first `p` bits of the hash
      pick a register; the register keeps the largest number of leading
      zeros (plus one) seen in the remaining bits.
    - **Storage**: 6-bit registers (`REGISTER_SIZE = 6`), ten per 64-bit
      word, `m / 10 + 1` longs in the aggregation buffer.
    - **Estimate**: the harmonic mean of `2^register`, with **linear
      counting** `m * ln(m / V)` (`V` empty registers) for small
      cardinalities, below a per-precision threshold table, and an
      empirical **bias correction** (k-nearest-neighbour interpolation,
      `K = 6`, in tables copied from the paper's appendix) in between.
    - `trueRsd = 1.04 / sqrt(m)`, always at or below what you asked for.

    | `rsd` | `p` | registers | buffer | `trueRsd` |
    |---|---|---|---|---|
    | 0.05 (default) | 9 | 512 | 52 longs, 416 bytes | 0.0460 |
    | 0.01 | 14 | 16,384 | 1,639 longs, 13,112 bytes | 0.0081 |

    Measured over 200 groups of exactly 20,000 distinct values each:

    ```text
    acd05: mean rel err -0.0061  measured RSE 0.0481  max |err| 0.1210
    acd01: mean rel err -0.0010  measured RSE 0.0077  max |err| 0.0207
    ```

    The measured relative standard error matches `trueRsd`, and the
    worst of 200 groups is off by 12% at the default. "Production
    Ingestion" saw 37 for 40 customers: with 512 registers and 40
    values, linear counting is nearly exact on average, but a few
    unlucky register collisions move a small count by several units.

    The limitation that matters for this lesson: the buffer of 52 longs
    is internal. There is no function that returns it, so an
    `approx_count_distinct` result cannot be stored and merged later.
    For that, Spark has the DataSketches functions.

