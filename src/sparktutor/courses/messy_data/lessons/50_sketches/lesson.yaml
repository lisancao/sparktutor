    ## DataSketches HLL: hll_sketch_agg

    Spark 3.5 added `hll_sketch_agg`, `hll_union_agg`, `hll_union` and
    `hll_sketch_estimate` (SPARK-16484), built on Apache DataSketches
    (`datasketches-java-6.2.0.jar` ships in PySpark's `jars/` folder).
    From `HllSketchAgg` in
    `sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/expressions/aggregate/datasketchesAggregates.scala`:

    - the target type is `TgtHllType.HLL_8` (one byte per register)
    - `lgConfigK` defaults to `HllSketch.DEFAULT_LG_K` (12, so 4,096
      registers) and must be a constant between 4 and 21
    - the result is `sketch.toUpdatableByteArray`, a BINARY value
    - inputs: INT, BIGINT, STRING, BINARY; NULLs, empty byte arrays
      and strings equal to `""` under their collation are **ignored**

    A sketch is just bytes, so you can open it with the same library on
    the JVM (classic session, `spark._jvm`):

    ```python
    H = spark._jvm.org.apache.datasketches.hll.HllSketch
    b = spark.range(20000).agg(F.hll_sketch_agg("id")).first()[0]
    s = H.heapify(bytearray(b))
    print(s.toString(True, False, False, False))
    ```

    ```text
    ### HLL SKETCH SUMMARY:
      Log Config K   : 12
      Hll Target     : HLL_8
      Current Mode   : HLL
      Memory         : false
      LB             : 20351.24727153787
      Estimate       : 20680.03548970646
      UB             : 21020.283717383856
      OutOfOrder Flag: true
      CurMin         : 0
      NumAtCurMin    : 23
      HipAccum       : 0.0
      KxQ0           : 584.8881149291992
      KxQ1           : 0.0
      Rebuild KxQ Flg: false
    ```

    `OutOfOrder Flag: true` is worth understanding. A sketch built from
    one stream of values can use the HIP estimator, which is more
    accurate. A sketch that is the **union** of others cannot, and
    Spark's partial and final aggregation merges sketches (`merge` in
    `HllSketchAgg` builds a `Union`), so the sketches Spark returns are
    marked out of order, as above. DataSketches publishes the bound for
    both cases (`HllSketch.getRelErr(upperBound, outOfOrder, lgK,
    numStdDev)`):

    ```text
    hll lgK 10 relErr 1sd upper (ooo=False, True): 0.025991325 0.032433119
    hll lgK 12 relErr 1sd upper (ooo=False, True): 0.012920332 0.016186662
    ```

    Measured on the same 200 groups of 20,000:

    ```text
    hll12: mean rel err -0.0016  measured RSE 0.0129  max |err| 0.0386
    hll10: mean rel err -0.0001  measured RSE 0.0302  max |err| 0.0764
    ```

    Within the out-of-order bound. The exercise checks its estimates
    against `getRelErr(True, True, lgK, 3)`, the 3-sigma bound.

