    ## Tuple Sketches: Distinct Keys With a Summary (4.2)

    Spark 4.2 adds tuple sketches (SPARK-54179): a theta sketch whose
    retained hashes carry a **summary**. `tuple_sketch_agg_double(key,
    summary, lgNomEntries=12, mode="sum")` (and the `_integer` variants)
    with modes `sum`, `min`, `max` and `alwaysone`, plus
    `tuple_union*`, `tuple_intersection*`, `tuple_difference*`,
    `tuple_sketch_estimate_*`, `tuple_sketch_summary_*` and
    `tuple_sketch_theta_*`. A typical question: distinct buyers and what
    they spent, mergeable by day.

    The trap is in what the summary means once the sketch is in
    estimation mode. 100,000 users, three purchases of 10.0 each:

    ```text
    tuple 100k users x3 x10.0: Row(users=98045.91060164096, summary_sum=122880.0, theta=0.04177634717109197)
    tuple 10 users x3 x10.0: Row(tuple_sketch_estimate_double(t)=10.0, tuple_sketch_summary_double(t, sum)=300.0, tuple_sketch_summary_double(t, max)=30.0)
    ```

    With 10 users the sketch is exact and the sum is 300. With 100,000
    the sum is **122,880**, not 3,000,000: it is the sum over the 4,096
    **retained** keys (4,096 times 30). To estimate the total, divide by
    `theta`: `122,880 / 0.0418 ≈ 2.94 million`. And
    `tuple_sketch_theta_double` returns that `theta` as a DOUBLE, not a
    sketch:

    ```text
    [DATATYPE_MISMATCH.UNEXPECTED_INPUT_TYPE] Cannot resolve "theta_sketch_estimate(tuple_sketch_theta_double(t))"
    due to data type mismatch: The first parameter requires the "BINARY" type, however
    "tuple_sketch_theta_double(t)" has the type "DOUBLE". SQLSTATE: 42K09
    ```

    The two `mode`s are separate. `mode` in the aggregate decides how
    values for the same key combine inside the sketch (the 10-user
    sketch above summed each user's three purchases to 30); `mode` in
    `tuple_sketch_summary_double` decides how the per-key summaries
    combine into one number (`max` gave 30, the largest per-user total).

