    ## When an Intersection Is Useless

    The error of a theta set operation is relative to the **union**,
    not to the result. Two sets of 100,000 values each, with an overlap
    from 50,000 down to 100 (default `lgNomEntries`):

    ```text
    overlap exact est relerr
    50000 48118 -0.038 diff 49983 union 149587
    10000 10058 +0.006 diff 88099 union 192828
    1000 1237 +0.237 diff 96826 union 200806
    100 49 -0.510 diff 98117 union 201723
    ```

    The intersection estimate is the union estimate times the fraction
    of retained hashes that are in both. With 4,096 hashes retained from
    a union of 200,000, an overlap of 1,000 leaves about 20 shared hashes
    to count, and 100 leaves about 2. Over 30 trials with an overlap of
    1,000 the relative error had a standard deviation of 15.9%, from
    -46% to +24%. A rough rule: the relative error of an intersection is
    about `sqrt(|A ∪ B| / |A ∩ B|) / sqrt(k)` (22% here). If you need
    small overlaps of large sets, raise `lgNomEntries`, or compute those
    exactly.

    For that reason, test intersections against the sketch's own
    bounds, not a fixed tolerance. The result of `theta_intersection` is
    a sketch, and its `getLowerBound(3)` and `getUpperBound(3)` say how
    wide the answer is. The exercise checks that the exact number of
    returning users falls inside that interval.

