    ## A Table of Sketches

    The design the exercise builds, for a week of app events (user id,
    country, latency):

    ```python
    user = F.lower(F.trim("user"))
    user = F.when(user == "", None).otherwise(user)
    daily = (events.groupBy("day", "country")
             .agg(F.hll_sketch_agg(user, 14).alias("users_hll"),
                  F.theta_sketch_agg(user, 12).alias("users_theta"),
                  F.kll_sketch_agg_double("latency_ms", 200).alias("latency_kll"),
                  F.count("*").alias("events")))
    daily.write.partitionBy("day").parquet(sketch_dir)
    ```

    One row per day and country, three BINARY columns and an exact
    count. From the exercise's run:

    ```text
    raw events: 15.4 MB; daily sketches: 0.90 MB (35 rows)
    ```

    Rollups are aggregations over the sketch table:

    ```python
    week = sketches.groupBy("country").agg(
        F.hll_sketch_estimate(F.hll_union_agg("users_hll")).alias("users"))
    ```

    Rules that keep such a table useful for years:

    - **Fix the parameters per column** (`lgConfigK`, `lgNomEntries`,
      `k`) and record them, in the column name, a comment or table
      properties. A change means a new column, not a silent mix.
    - **Fix the input**: the same normalization function and type, or
      the sketches do not merge meaningfully.
    - **Choose the grain** you will need: you can roll day and country up
      to week and region, never down to hour or city.
    - **Keep exact counts next to sketches** when they are additive
      (events, bytes): they cost nothing and catch mistakes.
    - **Expect sizes to vary**: small groups have small sketches (an HLL
      of three users is 40 bytes).

    The exercise proves the most important property directly: it
    deletes the raw events after writing the sketches, runs every
    rollup, and checks that each rollup's `inputFiles()` lists only
    sketch files. A rollup that needs raw data cannot pass.

