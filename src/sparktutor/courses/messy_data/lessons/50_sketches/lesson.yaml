    ## Why Sketches

    Distinct counts do not add. If 12,000 people used the app on Monday
    and 13,000 on Tuesday, the number who used it on either day is
    anything from 13,000 to 25,000. In the exercise's week of events
    the seven daily distinct counts sum to **89,320**; the true number
    of distinct users is **33,285**. Quantiles do not add either: the
    median of medians is not the median.

    The exact answers need the raw values (every user id, every latency)
    for the whole period. A **sketch** is a fixed-size summary with two
    properties:

    - **mergeable**: `merge(sketch(A), sketch(B))` equals (in
      distribution) `sketch(A ∪ B)`, so a sketch per day can become a
      sketch per week, and a sketch per task a sketch per query
    - **bounded error**: the estimate is within a known relative error
      (distinct counts) or rank error (quantiles), with a known
      probability, whatever the size of the input

    Mergeability is what Spark exploits. The sketch aggregates are
    `TypedImperativeAggregate`s, planned as `ObjectHashAggregate` with a
    partial step before the shuffle and a final step after it:

    ```text
    ObjectHashAggregate(keys=[_groupingexpression#20L], functions=[hll_sketch_agg(id#15L, 12, 0, 0)])
    +- Exchange hashpartitioning(_groupingexpression#20L, 200), ENSURE_REQUIREMENTS
       +- ObjectHashAggregate(keys=[_groupingexpression#20L], functions=[partial_hll_sketch_agg(id#15L, 12, 0, 0)])
          +- Project [id#15L, (id#15L % 3) AS _groupingexpression#20L]
             +- Range (0, 1000, step=1, splits=2)
    ```

    Each task builds a sketch of its rows, the sketches are shuffled
    (a few kilobytes each instead of the rows), and the final step
    merges them. Storing the sketch in a table is the same merge,
    delayed by a week.

