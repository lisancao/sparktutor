    ## The Bytes of an HLL Sketch

    The first eight bytes are a preamble. For 3, 300 and 20,000 distinct
    values at `lgConfigK = 12`:

    ```text
    3 bytes 40 mode LIST est 3.0 head 02 01 07 0c 03 00 03 08
    300 bytes 2060 mode SET est 300.0 head 03 01 07 0c 09 00 00 09
    20000 bytes 4136 mode HLL est 20253.2 head 0a 01 07 0c 00 10 00 0a
    ```

    - byte 0: preamble size in 4-byte ints (2, 3, 10)
    - byte 1: serial version 1
    - byte 2: family id 7, which is
      `org.apache.datasketches.common.Family.HLL.getID()`
    - byte 3: `lgConfigK` (`0x0c` = 12)
    - byte 6: in LIST mode, the number of entries (3)
    - byte 7: the current mode in the low bits (0 LIST, 1 SET, 2 HLL)
      and the target type above them (`0x08` = HLL_8 in LIST mode)

    An HLL sketch starts **sparse**: a list of coupons (register index
    and value pairs), then a hash set of them, and moves to the full
    array of 4,096 one-byte registers as it grows. So a sketch of three
    users is 40 bytes, not 4 KB, and a table of sketches per day and
    country costs little for small groups.

