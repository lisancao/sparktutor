    ## Audio: Reading WAV Files

    A WAV file starts with a small header (the `RIFF` and `fmt ` chunks:
    sample rate, channels, bits per sample) followed by a `data` chunk of
    raw samples. Python's standard `wave` module reads the header, and
    `array("h", ...)` turns the sample bytes into 16-bit integers. That
    is enough for duration and loudness:

    ```python
    def wav_bytes_info(content):
        import array, io, math, wave
        with wave.open(io.BytesIO(content)) as w:
            rate, channels, frames = w.getframerate(), w.getnchannels(), w.getnframes()
            samples = array.array("h", w.readframes(frames))
        rms = math.sqrt(sum(s * s for s in samples) / len(samples)) / 32768 if samples else 0.0
        return (rate, channels, frames / rate, rms)

    wav_info = F.udf(wav_bytes_info,
                     "struct<rate:int, channels:int, seconds:double, rms:double>")

    audio = (spark.read.format("binaryFile")
             .option("pathGlobFilter", "*.wav")
             .load("data/messy/audio")
             .select(F.col("_metadata.file_name").alias("file"), "content"))

    (audio.select("file", wav_info("content").alias("w"))
          .select("file", "w.*").orderBy("file").show())
    ```

    ```
    +------------------+----+--------+-------+--------------------+
    |              file|rate|channels|seconds|                 rms|
    +------------------+----+--------+-------+--------------------+
    |       silence.wav|8000|       1|    0.5|                 0.0|
    |      tone_440.wav|8000|       1|   0.25|  0.3535257984378311|
    |tone_880_quiet.wav|8000|       1|   0.25|0.035342214201892604|
    +------------------+----+--------+-------+--------------------+
    ```

    - **Duration** is frames divided by the sample rate.
    - **RMS** (root mean square) is the usual measure of loudness. Dividing
      by 32768 scales it to 0..1. A sine wave at half volume has RMS
      0.5 / sqrt(2), about 0.354, which is what the 440 Hz tone shows.

    The standard library used to have an `audioop` module for this kind
    of arithmetic; it was removed in Python 3.13, so use `array` (or
    NumPy). For MP3, AAC or FLAC you need a decoder library (or ffmpeg);
    `wave` reads only uncompressed PCM WAV.

