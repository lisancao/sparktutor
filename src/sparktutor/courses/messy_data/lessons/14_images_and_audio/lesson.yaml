       `.wav` files with `binaryFile`, one file per trigger, into a
       memory sink named `incoming_audio` with `availableNow`, and
       return `numInputRows` of each non-empty batch.

    The harness checks the six files and the two invalid ones, channel
    counts and modes, file sizes, the BGR bytes of the red image, the
    mean colors, WAV durations and loudness, window counts and peaks,
    and that the stream took three batches of one file.
