    ## Pixels and Samples

    An **image** is a rectangle of `width x height` pixels. Each pixel
    has one byte per **channel**: one channel for gray images, three for
    color (red, green, blue), four when there is also transparency
    (alpha). A file format such as PNG or JPEG compresses that grid;
    *decoding* turns the file back into `width x height x channels`
    bytes.

    An **audio** file is a sequence of **samples**: the position of the
    microphone membrane measured thousands of times per second (the
    **sample rate**). The sample files here are 8000 samples per second,
    one channel (mono), 16 bits per sample, so a quarter of a second is
    2000 numbers between -32768 and 32767.

    Once you see them this way, the useful questions become arithmetic:
    how big, how bright, how long, how loud, and where in the recording
    something happens.

- Class: text
  Depth: beginner
  Output: |
    A picture is like a sheet of graph paper where every square is
    colored in, and the file stores the color of every square. A sound
    recording is like a seismograph trace: a line that wiggles up and
    down, written down as a number many times per second. Loud sounds
    make big wiggles; silence is a flat line at zero.

