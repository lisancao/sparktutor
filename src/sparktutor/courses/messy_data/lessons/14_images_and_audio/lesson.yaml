    ## Gotcha: Pixels Are Stored as B, G, R

    `red_16x8.png` is solid red. Look at its first pixel:

    ```python
    red = (spark.read.format("image")
           .load("data/messy/images/products/red_16x8.png")
           .select("image.data").first()[0])
    print(bytes(red[:3]).hex(" "))
    ```

    ```
    00 00 ff
    ```

    Red is the *third* byte. The image source stores pixels in the order
    OpenCV uses: blue, green, red, and then alpha for four-channel
    images. A blue logo pixel with full opacity reads `ff 00 00 ff`. Code
    that assumes R, G, B swaps red and blue without any error, so test
    your pixel code on an image whose colors you know. Use a lossless
    format (PNG, BMP) for such tests: JPEG is lossy, and a pure green
    JPEG pixel can come back as `01 ff 00`.

    For a single image on the driver, `ImageSchema.toNDArray` turns the
    struct into a NumPy array of shape `(height, width, nChannels)`;
    reverse the last axis to get R, G, B:

    ```python
    from pyspark.ml.image import ImageSchema

    row = (spark.read.format("image")
           .load("data/messy/images/products/red_16x8.png").first())
    pixels = ImageSchema.toNDArray(row.image)
    print(pixels.shape, pixels[0, 0], pixels[0, 0, ::-1])
    ```

    ```
    (8, 16, 3) [  0   0 255] [255   0   0]
    ```

