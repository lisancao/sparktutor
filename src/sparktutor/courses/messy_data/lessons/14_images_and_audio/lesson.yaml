    ## Choosing the Tool for Binary Data

    | Job | Tool |
    |-----|------|
    | Header fields at fixed byte positions | Built-in `substring`, `hex`, `conv` ("Files as Files: binaryFile, Globs and Metadata") |
    | Decoded pixels | `format("image")` |
    | One value per file, needs Python | UDF returning a struct |
    | One value per file, vectorized work on bytes | `arrow_udf` (4.1) |
    | Many rows per file, per-batch setup | `mapInArrow` |
    | Many rows per file, simple per-row logic | Python UDTF ("Documents to Rows") |
    | New files arriving over time | `readStream` with an explicit schema |

