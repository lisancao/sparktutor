    ## Gotcha: Joining Images to File Metadata

    You often want the image rows next to facts from `binaryFile` (file
    size, a content hash from "Files as Files: binaryFile, Globs and Metadata"). The obvious join returns
    nothing:

    ```python
    files = (spark.read.format("binaryFile")
             .option("recursiveFileLookup", "true")
             .load("data/messy/images"))

    print(images.join(files, images["image.origin"] == files["path"]).count())

    scheme = r"^[a-z]+:/+"
    print(files.select(F.regexp_extract("path", scheme, 0)).first()[0],
          images.select(F.regexp_extract("image.origin", scheme, 0)).first()[0])
    ```

    ```
    0
    file:/ file:///
    ```

    `binaryFile` writes paths as `file:/...`, while `image.origin` is
    `file:///...`. Both point at the same file, but the strings differ.
    Join on `_metadata.file_path`, which every file source fills in the
    same form:

    ```python
    sized = (images.select(F.col("_metadata.file_path").alias("file_path"), "image")
             .join(files.select(F.col("_metadata.file_path").alias("file_path"), "length"),
                   "file_path"))
    print(sized.count())
    ```

    ```
    6
    ```

