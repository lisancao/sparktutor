    ## Gotcha: Arrow Types Must Match the Schema Exactly

    PyArrow turns Python integers into `int64` unless you say otherwise.
    The schema above declares `window int`, which is 32-bit. If you build
    the batch the easy way, the query fails with an error that does not
    mention your column:

    ```python
    def easy_windows(batches):
        import pyarrow as pa
        for batch in batches:
            yield pa.RecordBatch.from_pydict(
                {"file": ["x.wav"], "window": [0], "peak": [0.0]})

    audio.mapInArrow(easy_windows, "file string, window int, peak double").collect()
    ```

    ```
    [UNSUPPORTED_CALL.WITHOUT_SUGGESTION] Cannot call the method "getInt"
    of the class "org.apache.spark.sql.vectorized.ArrowColumnVector$ArrowVectorAccessor".
    ```

    Spark tried to read a 32-bit integer from a 64-bit Arrow vector. In
    4.2.0 `mapInArrow` does not convert the batch to the declared types
    (SPARK-56999 proposes it; still open). The fix is to build each
    array with the Arrow type that matches the Spark type: `int` is
    `pa.int32()`, `bigint` is `pa.int64()`, `double` is `pa.float64()`,
    `string` is `pa.string()`. Or declare the column as `bigint`.

