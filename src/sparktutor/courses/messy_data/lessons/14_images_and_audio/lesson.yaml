    ## Invalid Files Stay Unless You Drop Them

    The folder also holds `corrupt.png` (a PNG signature followed by
    garbage) and `readme.txt`. The image source does not fail on them.
    By default it returns a row for every file, with `-1` for width,
    height, channels and mode and empty `data`. With
    `.option("dropInvalid", True)` it drops them:

    ```python
    print(spark.read.format("image")
          .option("recursiveFileLookup", "true")
          .option("dropInvalid", True)
          .load("data/messy/images").count())
    ```

    ```
    4
    ```

    Keeping the invalid rows is usually the better choice in a pipeline:
    you can count them, report them and quarantine them, instead of
    wondering later why a file never showed up. Filter on
    `image.nChannels > 0` when you need only the valid ones.

    Two costs to keep in mind:

    - Every valid image is fully decoded into memory. A 4000 x 3000
      color photo becomes 36 MB of `data` in a single row. Read large
      images in small batches and keep only what you need.
    - A plain `count()` without `dropInvalid` does not open the files at
      all (Spark only needs to know they exist). With `dropInvalid`,
      Spark must decode every image to know which ones to drop.

