    ## Exercise: Images and Audio

    The per-file helpers are written for you as plain Python
    (`bgr_to_rgb_means`, `wav_bytes_info`, `wav_windows`). Wire them into
    Spark:

    1. `read_images(spark, folder)`: read every file under `folder` with
       `format("image")` (subfolders too, invalid files kept). Return
