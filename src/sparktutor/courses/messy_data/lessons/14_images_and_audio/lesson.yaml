    ## What Needs a Library

    Statistics, thresholds and simple masks are NumPy arithmetic on the
    decoded bytes. Other image work needs more:

    - **Resizing and thumbnails, re-encoding to JPEG or WebP**: use
      Pillow inside a UDF. It is not installed with SparkTutor.
    - **Models** (classification, captions, embeddings, OCR): load the
      model once per task inside `mapInArrow` or an iterator-style UDF,
      and feed it batches. "Running a Model over Your Data with pandas
      UDFs" shows how.
    - **Writing images**: the image source is read-only. Writing fails
      with "Write is not supported for image data source"; write the
      bytes yourself or store them in a Parquet `binary` column.

