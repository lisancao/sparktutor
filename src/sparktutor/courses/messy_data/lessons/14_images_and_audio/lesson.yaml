    ## What You'll Learn

    Product photos, scanned receipts, call recordings and voice notes are
    data too. They are not text, so regular expressions do not help, but
    they have simple structure underneath: an image is a grid of pixels,
    and an audio file is a long list of numbers sampled at a fixed rate.
    This lesson turns both into rows and numbers Spark can work with.

    By the end of this lesson you will be able to:

    - Read images with the built-in `image` source, understand its
      schema, and find the invalid files
    - Read pixel bytes correctly (they are stored blue, green, red) and
      compute per-image statistics with an Arrow UDF (Spark 4.1)
    - Join image rows to file metadata without falling into the path
      format trap
    - Parse WAV headers and samples with Python's standard library
    - Turn one audio file into many rows (time windows) with
      `mapInArrow`, and declare Arrow types that match the schema
    - Stream new binary files into Spark one micro-batch at a time
    - Know what needs a library (resizing, other audio formats, models)
      and what does not

