    ## Pixel Statistics With an Arrow UDF

    How bright is each image, and what is its main color? That needs the
    pixel bytes, so it needs Python. An **Arrow UDF** (`arrow_udf`, Spark
    4.1, SPARK-52214) receives whole batches of rows as PyArrow arrays
    and returns a PyArrow array of the same length. There is no per-row
    conversion into Python objects on the way in, and you can hand each
    image's bytes straight to NumPy:

    ```python
    import pyarrow as pa

    def bgr_to_rgb_means(data, channels):
        import numpy as np
        if data is None or channels is None or channels < 1:
            return None
        px = np.frombuffer(data, dtype=np.uint8).reshape(-1, channels).astype(float)
        if channels == 1:
            gray = float(px[:, 0].mean())
            return {"r": gray, "g": gray, "b": gray}
        return {"r": float(px[:, 2].mean()), "g": float(px[:, 1].mean()),
                "b": float(px[:, 0].mean())}

    COLOR = pa.struct([("r", pa.float64()), ("g", pa.float64()), ("b", pa.float64())])

    @F.arrow_udf("struct<r:double, g:double, b:double>")
    def rgb_means(data: pa.Array, channels: pa.Array) -> pa.Array:
        return pa.array([bgr_to_rgb_means(d, c)
                         for d, c in zip(data.to_pylist(), channels.to_pylist())],
                        type=COLOR)

    (images.filter("image.nChannels > 0")
           .select(F.col("_metadata.file_name").alias("file"),
                   rgb_means("image.data", "image.nChannels").alias("c"))
           .select("file", "c.*")
           .orderBy("file").show())
    ```

    ```
    +-------------------+-----+-----+-----+
    |               file|    r|    g|    b|
    +-------------------+-----+-----+-----+
    | gradient_32x32.png|124.0|124.0|128.0|
    |     gray_20x10.png|114.0|114.0|114.0|
    |logo_rgba_12x12.png|  0.0|  0.0|255.0|
    |       red_16x8.png|255.0|  0.0|  0.0|
    +-------------------+-----+-----+-----+
    ```

    Details worth noticing:

    - `reshape(-1, channels)` gives one row per pixel and one column per
      channel; column 0 is blue, column 2 is red, and column 3 (alpha)
      is ignored.
    - The returned array's type must match the declared return type, so
      build it with an explicit `type=`.
    - As with any UDF, create it after the session exists ("Documents to Rows").
    - The per-image work stays a small, plain Python function you can
      test on its own.

