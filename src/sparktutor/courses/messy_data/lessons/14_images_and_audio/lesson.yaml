    ## Streaming New Files In

    This section is a preview: "Streaming Files: Your First Structured
    Streaming Job" explains streaming properly. Three words you need for
    now:

    - **micro-batch**: a streaming query runs as a series of small batch
      jobs, each one processing the files that arrived since the last.
    - **checkpoint**: a folder where the query records which files it has
      already processed, so a restart does not read them twice.
    - **availableNow**: a trigger that processes everything present when
      the query starts, then stops, instead of running forever.

    Uploads keep arriving. A streaming `binaryFile` query picks up new
    files as they land, and `maxFilesPerTrigger` caps how many go into
    each micro-batch, so a burst of large files does not arrive in one
    huge batch:

    ```python
    import tempfile

    query = (spark.readStream.format("binaryFile")
             .schema("path string, modificationTime timestamp, length long, content binary")
             .option("pathGlobFilter", "*.wav")
             .option("maxFilesPerTrigger", 1)
             .load("data/messy/audio")
             .select("path", "length")
             .writeStream.format("memory").queryName("audio_demo")
             .option("checkpointLocation", tempfile.mkdtemp())
             .trigger(availableNow=True)
             .start())
    query.awaitTermination()
    print([p.numInputRows for p in query.recentProgress])
    ```

    ```
    [1, 1, 1]
    ```

    - **The schema is required.** Streaming file sources do not infer
      schemas, even for `binaryFile`, whose schema never changes. Without
      `.schema(...)` the query fails with `IllegalArgumentException:
      Schema must be specified when creating a streaming source
      DataFrame`. The same applies to `format("image")`.
    - `availableNow` processes everything present at start, in as many
      batches as the limit requires, then stops. It suits scheduled jobs
      and tests.
    - Read progress with attributes (`p.numInputRows`), which work in
      both Spark Classic and Spark Connect.

