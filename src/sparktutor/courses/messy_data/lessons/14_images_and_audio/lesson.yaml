    ## One File, Many Rows: Windows With mapInArrow

    Summary numbers hide *where* things happen. Splitting a recording
    into short windows (here 50 ms, 400 samples) and measuring each one
    finds the loud moments, the silences and the clipping. That is one
    file in, many rows out.

    `mapInArrow` (Spark 3.3) runs your function over an iterator of
    PyArrow `RecordBatch`es and lets it yield batches with any number of
    rows, in a schema you declare:

    ```python
    def wav_windows(batches, window_ms=50):
        import array, io, wave
        import pyarrow as pa
        for batch in batches:
            files, windows, peaks = [], [], []
            for name, content in zip(batch.column("file").to_pylist(),
                                     batch.column("content").to_pylist()):
                with wave.open(io.BytesIO(content)) as w:
                    rate = w.getframerate()
                    samples = array.array("h", w.readframes(w.getnframes()))
                step = rate * window_ms // 1000
                for i in range(0, len(samples), step):
                    files.append(name)
                    windows.append(i // step)
                    peaks.append(max(abs(s) for s in samples[i:i + step]) / 32768)
            yield pa.RecordBatch.from_arrays(
                [pa.array(files, pa.string()), pa.array(windows, pa.int32()),
                 pa.array(peaks, pa.float64())],
                names=["file", "window", "peak"])

    windows = audio.mapInArrow(wav_windows, "file string, window int, peak double")
    (windows.groupBy("file")
            .agg(F.count("*").alias("windows"), F.round(F.max("peak"), 3).alias("peak"))
            .orderBy("file").show())
    ```

    ```
    +------------------+-------+----+
    |              file|windows|peak|
    +------------------+-------+----+
    |       silence.wav|     10| 0.0|
    |      tone_440.wav|      5| 0.5|
    |tone_880_quiet.wav|      5|0.05|
    +------------------+-------+----+
    ```

    Unlike a UDF, its output replaces the input rows: only the columns
    you yield come out, so carry the file name through yourself. Unlike a UDTF, it gets a whole
    batch at a time, which is the right place to do expensive setup once
    (loading a model, for example).

