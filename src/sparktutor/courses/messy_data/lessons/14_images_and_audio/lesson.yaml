    ## Summary

    In this lesson you learned:

    - **Images** are `width x height x channels` bytes after decoding;
      **audio** is a list of samples at a sample rate
    - **`format("image")`** (2.4) decodes PNG, JPEG, GIF and BMP into an
      `image` struct (`origin`, `height`, `width`, `nChannels`, `mode`,
      `data`); invalid files become `-1` rows unless you set
      `dropInvalid`
    - **Pixels are B, G, R(, A)**: test pixel code on an image whose
      colors you know; `ImageSchema.toNDArray` for a quick look
    - **Join on `_metadata.file_path`**, not `image.origin` to `path`
      (`file:///` versus `file:/`)
    - **`arrow_udf`** (4.1) for vectorized per-file work on bytes, with
      an explicitly typed result array
    - **WAV** with `wave` and `array` (not `audioop`, gone in Python
      3.13): duration, RMS loudness
    - **`mapInArrow`** for one-to-many, with Arrow types that match the
      schema exactly (`int` means `pa.int32()`; SPARK-56999 is open)
    - **Streaming `binaryFile`** needs an explicit schema;
      `maxFilesPerTrigger` sizes the batches

    That completes the built-in toolbox: bytes, text, JSON, VARIANT,
    XML, documents, images and audio. Some formats still do not fit any
    of these, and some sources are not files at all.

    Next: **Your First Python Data Source**, where you teach Spark a new
    `format(...)` of your own.
