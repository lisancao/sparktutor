    ## The Image Source

    Spark has a built-in image reader (Spark 2.4, SPARK-22666). It lives
    in the MLlib jar, which PySpark already includes, and decodes images
    with Java's ImageIO library, so PNG, JPEG, GIF and BMP files work out
    of the box. It is a file source, so the options from "Files as Files: binaryFile, Globs and Metadata"
    (`recursiveFileLookup`, `pathGlobFilter`, `_metadata`) work too.

    ```python
    from pyspark.sql import functions as F

    images = (spark.read.format("image")
              .option("recursiveFileLookup", "true")
              .load("data/messy/images"))
    images.printSchema()

    (images.select(F.col("_metadata.file_name").alias("file"),
                   "image.width", "image.height", "image.nChannels", "image.mode",
                   F.length("image.data").alias("data_bytes"))
           .orderBy("file").show())
    ```

    ```
    root
     |-- image: struct (nullable = true)
     |    |-- origin: string (nullable = true)
     |    |-- height: integer (nullable = true)
     |    |-- width: integer (nullable = true)
     |    |-- nChannels: integer (nullable = true)
     |    |-- mode: integer (nullable = true)
     |    |-- data: binary (nullable = true)

    +-------------------+-----+------+---------+----+----------+
    |               file|width|height|nChannels|mode|data_bytes|
    +-------------------+-----+------+---------+----+----------+
    |        corrupt.png|   -1|    -1|       -1|  -1|         0|
    | gradient_32x32.png|   32|    32|        3|  16|      3072|
    |     gray_20x10.png|   20|    10|        1|   0|       200|
    |logo_rgba_12x12.png|   12|    12|        4|  24|       576|
    |         readme.txt|   -1|    -1|       -1|  -1|         0|
    |       red_16x8.png|   16|     8|        3|  16|       384|
    +-------------------+-----+------+---------+----+----------+
    ```

    Everything is in one struct column called `image`:

    - `origin`: where the image came from (a URI)
    - `width`, `height`, `nChannels`: the size of the pixel grid
    - `mode`: an OpenCV type code. `16` is `CV_8UC3` (three 8-bit
      channels), `24` is `CV_8UC4` (four), `0` is `CV_8U` (one).
      `pyspark.ml.image.ImageSchema.ocvTypes` lists them.
    - `data`: the decoded pixels, exactly `height * width * nChannels`
      bytes, row by row

