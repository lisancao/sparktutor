    ## The Sample Files

    `data/messy/delimited/` holds one file per kind of trouble:

    | File | What is wrong with it |
    |------|-----------------------|
    | `products.csv` | quotes doubled inside quoted fields, line breaks inside descriptions, SKUs with leading zeros, `NA` for missing |
    | `orders_eu.csv` | a byte order mark, `#` comment lines, `;` separator, decimal commas (`1.234,50`), `dd.MM.yyyy` dates, two bad rows |
    | `legacy_latin1.tsv` | tab separated, ISO-8859-1 encoded, Windows line endings, a duplicated and a blank header name |
    | `stores_fixed.txt` | fixed-width columns, a header and a trailer record, one truncated line |
    | `sales/` | one feed over three days: columns reordered on day 2, a new column on day 3, a short row and a bad amount |

    To try small cases, it is easiest to write tiny files yourself. The
    examples in this lesson use this helper:

    ```python
    import os, tempfile
    from pyspark.sql import functions as F

    tmp = tempfile.mkdtemp()

    def csv_file(name, text, encoding="utf-8"):
        """Write `text` to a new file and return its path."""
        path = os.path.join(tmp, name)
        with open(path, "w", encoding=encoding, newline="") as f:
            f.write(text)
        return path
    ```

