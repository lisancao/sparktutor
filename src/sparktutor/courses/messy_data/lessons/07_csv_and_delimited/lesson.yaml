    ## Dates, Timestamps and Locale

    `dateFormat` and `timestampFormat` give the patterns for `DATE` and
    `TIMESTAMP` columns (same pattern letters as "Columns and
    Expressions: Cleaning Values"). Without them, only ISO-style text
    parses, and anything else is NULL, **silently** in the default mode:

    ```python
    eu = "data/messy/delimited/orders_eu.csv"
    plain = spark.read.option("header", True).option("sep", ";").option("comment", "#")
    s = "order_id INT, sku STRING, customer STRING, amount STRING, order_date DATE, note STRING"
    plain.schema(s).csv(eu).select("order_id", "amount", "order_date").show(3)
    plain.schema(s).option("dateFormat", "dd.MM.yyyy").csv(eu).select("order_id", "amount", "order_date").show(3)
    ```

    ```
    +--------+--------+----------+
    |order_id|  amount|order_date|
    +--------+--------+----------+
    |    1001|1.234,50|      NULL|
    |    1002|   12,50|      NULL|
    |    1003|    7,00|      NULL|
    +--------+--------+----------+
    only showing top 3 rows
    +--------+--------+----------+
    |order_id|  amount|order_date|
    +--------+--------+----------+
    |    1001|1.234,50|2026-10-01|
    |    1002|   12,50|2026-10-02|
    |    1003|    7,00|      NULL|
    +--------+--------+----------+
    only showing top 3 rows
    ```

    Order 1003 is dated `31.09.2026`, which does not exist, so it stays
    NULL even with the right format: a malformed row (see "Parse
    Modes").

    - **Month names** follow `locale` (default `en-US`). `6 janv. 2026`
      with `dateFormat="d MMM yyyy"` is NULL until you add
      `locale="fr-FR"`, then it is 2026-01-06.
    - **Time zones**: timestamps without an offset are read in the
      session time zone, or in the `timeZone` option if you set one.
      `2026-01-05 10:00:00` read with `timeZone="America/Toronto"` is
      15:00 UTC.
    - **`TIMESTAMP_NTZ`** columns keep the wall-clock reading with no
      zone at all (`timestampNTZFormat` sets their pattern).

