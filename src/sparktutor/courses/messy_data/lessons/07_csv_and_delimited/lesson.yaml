    ## CSV Inside a Column: from_csv and schema_of_csv

    CSV also turns up inside other data: a Kafka message, a log field,
    a column of a database table. `from_csv` parses a string column with
    a schema and returns a struct:

    ```python
    events = spark.createDataFrame([("evt1", "42;19.99;2026-10-01"), ("evt2", "7;abc;2026-10-02"),
                                    ("evt3", None), ("evt4", "1;2")], "id STRING, payload STRING")
    spark.range(1).select(F.schema_of_csv(F.lit("42;19.99;2026-10-01"), {"sep": ";"})).first()[0]
    # 'STRUCT<_c0: INT, _c1: DOUBLE, _c2: DATE>'

    (events.select("id", F.from_csv("payload",
                "qty INT, price DOUBLE, day DATE, _corrupt_record STRING", {"sep": ";"}).alias("p"))
           .select("id", "p.*").show(truncate=False))
    ```

    ```
    +----+----+-----+----------+----------------+
    |id  |qty |price|day       |_corrupt_record |
    +----+----+-----+----------+----------------+
    |evt1|42  |19.99|2026-10-01|NULL            |
    |evt2|7   |NULL |2026-10-02|7;abc;2026-10-02|
    |evt3|NULL|NULL |NULL      |NULL            |
    |evt4|1   |2.0  |NULL      |1;2             |
    +----+----+-----+----------+----------------+
    ```

    The same rules as the file reader apply (options as a dict, the
    corrupt column in the schema), plus:

    - `schema_of_csv` needs a **literal** example: passing a column
      fails with `DATATYPE_MISMATCH.NON_FOLDABLE_INPUT`. Its inferred
      names are `_c0`, `_c1`, ..., so write your own DDL for real use.
    - Only `PERMISSIVE` and `FAILFAST`: `DROPMALFORMED` fails with
      `PARSE_MODE_UNSUPPORTED`.
    - A NULL input gives a NULL struct (`evt3`); malformed input gives a
      struct with NULL fields, so test the fields, not the struct.
    - `to_csv(struct, options)` goes the other way:
      `F.to_csv(F.struct("id", "payload"), {"sep": "|"})` gives
      `evt1|42;19.99;2026-10-01`.

