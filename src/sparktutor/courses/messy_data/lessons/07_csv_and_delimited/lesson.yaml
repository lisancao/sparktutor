    ## Line Breaks Inside Fields: multiLine

    By default, Spark reads CSV **line by line**, which lets it split a
    large file into byte ranges and read them in parallel. A quoted field
    with a line break in it is then cut in two:

    ```python
    spark.read.option("header", True).csv("data/messy/delimited/products.csv").count()   # 17
    ```

    ```
    +---------------+-------------+---------------------+
    |sku            |name         |description          |
    +---------------+-------------+---------------------+
    |00042          |Kettle, steel|Boils 1.7 L.         |
    |Auto shut-off."|39.99        |yes                  |
    |00107          |Tea mug      |"The ""classic"" mug"|
    +---------------+-------------+---------------------+
    ```

    The file has 15 products. With `multiLine` (and the RFC escape):

    ```python
    good = (spark.read.option("header", True).option("multiLine", True)
            .option("escape", '"').csv("data/messy/delimited/products.csv"))
    good.count()   # 15
    ```

    ```
    +-----+-------------+----------------------------+
    |sku  |name         |description                 |
    +-----+-------------+----------------------------+
    |00042|Kettle, steel|Boils 1.7 L.\nAuto shut-off.|
    |00107|Tea mug      |The "classic" mug           |
    |00230|Spoon set    |NULL                        |
    +-----+-------------+----------------------------+
    ```

    The cost: in `multiLine` mode a file can no longer be split, so each
    file is read by one task from start to end. Fine for many
    small-to-medium files, a bottleneck for one huge file.

    A second cost is fragility. A quote that is opened and never closed
    swallows **the rest of the file** in `multiLine` mode:

    ```python
    un = csv_file("unterminated.csv", 'id,note\n1,"never closed\n2,b\n3,c\n')
    spark.read.option("header", True).csv(un).collect()
    # 3 rows: ('1', 'never closed'), ('2', 'b'), ('3', 'c')
    spark.read.option("header", True).option("multiLine", True).csv(un).collect()
    # 1 row:  ('1', 'never closed\n2,b\n3,c\n')
    ```

    Check row counts against something independent (a trailer record, a
    count from the producer, `wc -l` on a sample) when you turn
    `multiLine` on.

