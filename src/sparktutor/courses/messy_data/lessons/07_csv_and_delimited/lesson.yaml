    ## The CSV Reader and Its Defaults

    Three spellings, one reader:

    ```python
    spark.read.option("header", True).option("sep", ";").csv(path)
    spark.read.csv(path, header=True, sep=";")
    spark.read.format("csv").option("header", True).option("sep", ";").load(path)
    ```

    Unlike the `wholetext` keyword of `text()` ("Text and Logs"), every
    keyword of `csv()` defaults to `None`, which means "not set", so
    mixing `.option(...)` and keywords is safe here. Option names are
    case-insensitive.

    The defaults, from `CSVOptions` in the 4.2.0 source, are worth
    knowing by heart, because most CSV bugs are a default that doesn't
    fit the file:

    | Option | Default | Meaning |
    |--------|---------|---------|
    | `sep` (alias `delimiter`) | `,` | field separator |
    | `header` | `false` | first line is data, columns are `_c0`, `_c1`, ... |
    | `inferSchema` | `false` | every column is `STRING` |
    | `enforceSchema` | `true` | a given schema wins over the header, by position |
    | `quote` | `"` | quote character |
    | `escape` | `\` | escape character inside quotes (not RFC 4180's `""`) |
    | `multiLine` | `false` | one record per line |
    | `nullValue` | empty string | text that means NULL |
    | `emptyValue` | empty string | what a quoted `""` becomes |
    | `nanValue`, `positiveInf`, `negativeInf` | `NaN`, `Inf`, `-Inf` | special floating-point values |
    | `ignoreLeadingWhiteSpace`, `ignoreTrailingWhiteSpace` | `false` when reading, `true` when writing | trim values |
    | `encoding` (alias `charset`) | `UTF-8` | text encoding |
    | `comment` | disabled | lines starting with this character are skipped |
    | `mode` | `PERMISSIVE` | what to do with malformed rows |
    | `locale` | `en-US` | for month names and decimal parsing |
    | `unescapedQuoteHandling` | `STOP_AT_DELIMITER` | stray quotes inside values |
    | `maxColumns`, `maxCharsPerColumn` | 20480, unlimited | parser limits |

