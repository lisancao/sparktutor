    ## Whitespace: Different Rules for Different Types

    Reading does **not** trim by default
    (`ignoreLeadingWhiteSpace` and `ignoreTrailingWhiteSpace` are false),
    and the type parsers disagree about spaces:

    ```python
    ws = csv_file("ws.csv", " 7 , 2.5 , 2026-01-01 \n")
    spark.read.schema("a INT, b DOUBLE, c DATE").csv(ws).collect()
    # [Row(a=None, b=2.5, c=datetime.date(2026, 1, 1))]
    (spark.read.schema("a INT, b DOUBLE, c DATE")
        .option("ignoreLeadingWhiteSpace", True).option("ignoreTrailingWhiteSpace", True)
        .csv(ws).collect())
    # [Row(a=7, b=2.5, c=datetime.date(2026, 1, 1))]
    ```

    The padded integer is NULL, the padded double and date parse. Turn on
    both options for fixed-layout exports padded with spaces; leave them
    off when spaces are meaningful in string columns. Note that this is
    the CSV parser's own number parsing: `CAST(' 7 ' AS INT)` in SQL
    trims and gives 7. When you write CSV, both options default to
    **true**, which matters at the end of this lesson.

