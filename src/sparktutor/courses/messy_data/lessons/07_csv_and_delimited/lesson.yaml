    ## Stray Quotes: unescapedQuoteHandling

    Hand-made files contain quotes that are not escaped at all. Since
    3.1 (SPARK-33566), `unescapedQuoteHandling` chooses what the parser
    does with them. On the line `2,"x"y,z",8` (header `id,note,n`):

    | Setting | Result for row 2 |
    |---------|------------------|
    | `STOP_AT_DELIMITER` (default) | `'"x"y'`, `'z"'` (the 8 is lost) |
    | `STOP_AT_CLOSING_QUOTE` | `'x"y,z'`, `'8'` |
    | `BACK_TO_DELIMITER` | `'xy,z'`, `'8'` |
    | `SKIP_VALUE` | NULL, `'z"'` |
    | `RAISE_ERROR` | the read fails: `TextParsingException: Unescaped quote character '"' inside quoted value of CSV field` |

    A quote in the middle of an unquoted value (`a "b" c`) is just a
    character in every mode. None of these modes recovers every case
    correctly, which is the point: use `RAISE_ERROR` in a check job to
    find out whether a feed has the problem at all, and fix the producer
    if you can.

