    ## Writing CSV Safely

    Writing has its own defaults, and they are not the reading defaults:

    ```python
    df = spark.createDataFrame([(1, "  padded  ", 'say "hi"', "a,b", "", None, "two\nlines")],
        "id INT, pad STRING, q STRING, comma STRING, empty STRING, nul STRING, nl STRING")
    out = os.path.join(tmp, "out_default")
    df.coalesce(1).write.option("header", True).csv(out)
    ```

    `out` is a **folder**, not a file:

    ```
    ['._SUCCESS.crc', '.part-00000-...-c000.csv.crc', '_SUCCESS', 'part-00000-...-c000.csv']
    ```

    One `part-*.csv` per task, a `_SUCCESS` marker written when the job
    commits, and checksum files. The part file holds:

    ```
    id,pad,q,comma,empty,nul,nl
    1,padded,"say \"hi\"","a,b","",,"two
    lines"
    ```

    Three surprises in two lines:

    - **Whitespace was trimmed** (`padded`): the writer's
      `ignoreLeadingWhiteSpace` and `ignoreTrailingWhiteSpace` default
      to true.
    - **Quotes were escaped with a backslash.** Python's `csv` module
      (like Excel) reads that value as `say \hi\""`.
    - The empty string is written `""` and NULL as nothing. Spark tells
      them apart on write; by default it does not on read.

    For files that other tools must read exactly, write RFC 4180:

    ```python
    (df.coalesce(1).write.mode("overwrite")
       .option("header", True)
       .option("escape", '"')
       .option("ignoreLeadingWhiteSpace", False)
       .option("ignoreTrailingWhiteSpace", False)
       .option("nullValue", "NULL")      # only if the reader knows this marker
       .csv(out))
    ```

    ```
    id,pad,q,comma,empty,nul,nl
    1,  padded  ,"say ""hi""","a,b","",NULL,"two
    lines"
    ```

    Python's `csv.reader` now returns `['1', '  padded  ', 'say "hi"',
    'a,b', '', 'NULL', 'two\nlines']`, and Spark reads it back exactly
    with `multiLine`, `escape='"'` and `nullValue="NULL"`. `quoteAll`
    quotes every field, which some strict consumers want.

