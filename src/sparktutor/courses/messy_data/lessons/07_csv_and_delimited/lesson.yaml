  Output: |
    ## Under the Hood: Parsing, Splitting and Limits

    - **The parser** is univocity-parsers, configured from `CSVOptions`
      in `sql/catalyst/.../csv/CSVOptions.scala`
      (`asParserSettings` and `asWriterSettings`). Errors such as
      `TextParsingException` come from it, which is why some CSV
      failures carry a library message rather than a Spark error
      condition.
    - **Splitting**: in line mode a large file is cut into byte ranges
      (`spark.sql.files.maxPartitionBytes`, 128 MB by default) and each
      task starts at the first line break after its range begins. This
      is why line mode cannot respect quoted line breaks: a task cannot
      know whether it starts inside a quote. `multiLine` gives up
      splitting for correctness.
    - **Column pruning** passes only the required columns to the parser,
      which is fast and is the reason for the `DROPMALFORMED` counts
      above. It is disabled automatically in `multiLine` mode.
    - **Limits**: `maxColumns` (20480) and `maxCharsPerColumn`
      (unlimited) protect the parser. Exceeding them fails with a
      `TextParsingException`, for example "Length of parsed input (6)
      exceeds the maximum number of characters defined in your parser
      settings (5)". A runaway quote in a huge `multiLine` file is the
      classic way to build a gigantic value; a `maxCharsPerColumn` limit
      turns that into an error instead of an out-of-memory task.
    - **Inference** (`CSVInferSchema`) tries, per value, integer, long,
      decimal, double, date (with `preferDate`), timestamp without time
      zone, timestamp and boolean before falling back to string, then
      merges the types per column across all rows.

