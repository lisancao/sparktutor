    ## Separators

    `sep` (or its alias `delimiter`) is the field separator. Get it wrong
    and you don't get an error, you get one wide column:

    ```python
    semi = csv_file("semi.csv", "a;b\n1,5;2\n")
    spark.read.option("header", True).csv(semi).collect()
    # [Row(a;b='1')]          the comma in 1,5 split the line instead
    spark.read.option("header", True).option("sep", ";").csv(semi).collect()
    # [Row(a='1,5', b='2')]
    ```

    - Tabs: `sep="\t"` in Python (a tab character). Spark also accepts
      the two characters backslash and `t`, `sep="\\t"`, which is handy
      in config files.
    - **Multi-character separators** work since 3.0 (SPARK-24540):
      `option("sep", "||")` reads `1|x||2` as `1|x` and `2`.
    - Any single character, including non-ASCII ones such as `¦` or the
      control character U+0001 that Hive uses.
    - An empty separator fails with `IllegalArgumentException: Delimiter
      cannot be empty`.

    A semicolon-separated file is often a European export, where the
    comma is already taken as the decimal point. Keep that in mind for
    the numbers section below.

