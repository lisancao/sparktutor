    ## Decimal Commas: A Silent 100x Error

    The `locale` option also controls how `DECIMAL` columns are parsed.
    Watch what the default `en-US` locale does with European amounts:

    ```python
    for t in ["DECIMAL(10,2)", "DOUBLE"]:
        for loc in ["en-US", "de-DE"]:
            r = plain.schema(f"order_id INT, sku STRING, customer STRING, amount {t}").option("locale", loc).csv(eu)
            print(t, loc, [x["amount"] for x in r.limit(4).collect()])
    ```

    ```
    DECIMAL(10,2) en-US [Decimal('1.23'), Decimal('1250.00'), Decimal('700.00'), Decimal('25.00')]
    DECIMAL(10,2) de-DE [Decimal('1234.50'), Decimal('12.50'), Decimal('7.00'), Decimal('25.00')]
    DOUBLE en-US [None, None, None, 25.0]
    DOUBLE de-DE [None, None, None, 25.0]
    ```

    The file says 1.234,50, 12,50, 7,00 and 25. With the default locale,
    `DECIMAL` reads the comma as a thousands separator: **12,50 became
    1250.00 and 7,00 became 700.00**, and `1.234,50` became 1.23. No
    error, no NULL, just wrong numbers, a hundred times too big. With
    `locale="de-DE"` all four are right.

    `DOUBLE` (and `INT`) columns don't use the locale: they reject both
    the comma and grouping separators, so you get NULL instead. The same
    applies to US-style grouping: `"1,234.50"` reads as `1234.50` into a
    `DECIMAL` but as NULL into a `DOUBLE`.

    So for money in CSV: use `DECIMAL`, set `locale` to the producer's
    locale, and test a known row. Or read the column as `STRING` and
    convert it yourself, as in "Columns and Expressions:
    Cleaning Values".

