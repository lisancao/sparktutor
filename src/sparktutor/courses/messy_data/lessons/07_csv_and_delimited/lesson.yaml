    ## NULL, Empty and NaN

    Four options decide which text becomes NULL, an empty string or a
    special number:

    ```python
    nv = csv_file("nulls.csv",
        'id,s,x\n1,,1.5\n2,"",NaN\n3,NA,NA\n4,  ,-Inf\n5,null,Inf\n6,N/A,inf\n')
    sch = "id INT, s STRING, x DOUBLE"
    spark.read.option("header", True).schema(sch).csv(nv).show()
    spark.read.option("header", True).schema(sch).option("nullValue", "NA").csv(nv).show()
    ```

    ```
    +---+----+---------+
    | id|   s|        x|
    +---+----+---------+
    |  1|NULL|      1.5|
    |  2|NULL|      NaN|
    |  3|  NA|     NULL|
    |  4|    |-Infinity|
    |  5|null| Infinity|
    |  6| N/A|     NULL|
    +---+----+---------+

    +---+----+---------+
    | id|   s|        x|
    +---+----+---------+
    |  1|NULL|      1.5|
    |  2|    |      NaN|
    |  3|NULL|     NULL|
    |  4|    |-Infinity|
    |  5|null| Infinity|
    |  6| N/A|     NULL|
    +---+----+---------+
    ```

    The first table is the default, the second uses `nullValue="NA"`.

    - **By default you cannot tell an empty field from a quoted empty
      string**: `,,` and `,"",` are both NULL, because `nullValue` and
      `emptyValue` are both the empty string.
    - With `nullValue="NA"`, `NA` is NULL, an unquoted empty field is
      still NULL, and `""` becomes a real empty string (row 2).
      `emptyValue` sets what `""` becomes (`emptyValue="<empty>"` turns
      row 2's `s` into `<empty>`).
    - `null`, `N/A` and spaces are just text. Normalize them afterwards,
      as in "Columns and Expressions: Cleaning Values".
    - In a `DOUBLE` column, `NaN`, `Inf` and `-Inf` (the `nanValue`,
      `positiveInf` and `negativeInf` defaults) become the special
      values. `inf` in lower case is not one of them, so row 6 is a
      malformed value and becomes NULL. And row 3's `NA` in `x` is
      NULL for the same reason, not because of `nullValue`: it is not a
      number. More on malformed values below.

