    ## The Spark 4.0 Charset List

    Since Spark 4.0 (SPARK-48857), the CSV reader accepts only a fixed
    list of charsets, so that results don't depend on which JVM you run:

    ```python
    cp = csv_file("cp1252.csv", "id,name\n1,“quoted” €5\n", encoding="cp1252")
    spark.read.option("header", True).option("encoding", "windows-1252").csv(cp)
    ```

    ```
    [INVALID_PARAMETER_VALUE.CHARSET] The value of parameter(s) `charset` in
    `CSVOptions` is invalid: expects one of the iso-8859-1, us-ascii, utf-16,
    utf-16be, utf-16le, utf-32, utf-8, but got windows-1252. SQLSTATE: 22023
    ```

    Aliases such as `latin1` are rejected the same way; write
    `ISO-8859-1`. Windows-1252 ("ANSI" in many Windows tools) is the
    awkward one: it is almost Latin-1, so reading it as `ISO-8859-1`
    *works* for letters but turns the extra characters into control
    codes (`“quoted” €5` becomes `'\x93quoted\x94 \x805'`). The internal
    setting `spark.sql.legacy.javaCharsets=true` restores the JVM's full
    list, after which `windows-1252` decodes correctly. The migration
    guide documents the same restriction for `encode` and `decode`.

- Class: text
