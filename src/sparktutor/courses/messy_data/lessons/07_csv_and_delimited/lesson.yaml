    ## Headers

    Without `header`, the first line is a data row and columns are
    named by position. With it, names come from the first line, and
    Spark makes them unique:

    ```python
    p = csv_file("headers.csv", "id,name,id,,  city  \n1,Ada,7,x,Toronto\n")
    spark.read.csv(p).columns
    # ['_c0', '_c1', '_c2', '_c3', '_c4']
    spark.read.option("header", True).csv(p).columns
    # ['id0', 'name', 'id2', '_c3', '  city  ']
    spark.read.option("header", True).csv(csv_file("case.csv", "ID,id\n1,2\n")).columns
    # ['ID0', 'id1']
    ```

    - A **duplicated name** gets its position appended (`id0`, `id2`),
      and so does a case-insensitive duplicate (`ID`/`id`, because
      `spark.sql.caseSensitive` is false by default).
    - A **blank name** becomes `_c` plus its position (`_c3`).
    - **Spaces are kept** (`'  city  '`).

    Names with dots, spaces or brackets need backticks, because a dot
    otherwise means "field of a struct":

    ```python
    odd = spark.read.option("header", True).csv(
        csv_file("odd.csv", "first name,amount (CAD),e.mail\nAda,1,a@x.ca\n"))
    odd.select("e.mail")
    # [UNRESOLVED_COLUMN.WITH_SUGGESTION] ... name `e`.`mail` cannot be resolved.
    # Did you mean one of the following? [`e.mail`, `first name`, `amount (CAD)`].
    odd.select("`e.mail`", F.col("`amount (CAD)`"))          # works
    odd.toDF("first_name", "amount_cad", "email").columns    # rename them all
    ```

    `toDF(*names)` renames every column by position, the quickest way to
    replace a bad header (as in the exercise's `legacy_latin1.tsv`).

