    ## Parse Modes and the Corrupt Record Column

    A CSV row is **malformed** when a value does not parse as its
    column's type, or when the row has fewer or more fields than the
    schema. `mode` decides what happens:

    - `PERMISSIVE` (default): keep the row; bad fields become NULL.
    - `DROPMALFORMED`: drop the row.
    - `FAILFAST`: fail the query on the first malformed row.

    In `PERMISSIVE` mode, Spark can keep the raw line of every malformed
    row in a string column. Unlike JSON, CSV inference never adds this
    column for you: declare it in the schema, as `STRING`, named
    `_corrupt_record` or whatever `columnNameOfCorruptRecord` says:

    ```python
    bad = csv_file("bad.csv", "id,amount,day\n1,2.5,2026-01-01\n2,abc,2026-01-02\n"
                              "3,4.0\n4,5.0,2026-01-04,EXTRA\n5,6.0,2026-02-30\n")
    sch = "id INT, amount DOUBLE, day DATE"
    spark.read.option("header", True).schema(sch + ", _corrupt_record STRING").csv(bad).show(truncate=False)
    ```

    ```
    +---+------+----------+----------------------+
    |id |amount|day       |_corrupt_record       |
    +---+------+----------+----------------------+
    |1  |2.5   |2026-01-01|NULL                  |
    |2  |NULL  |2026-01-02|2,abc,2026-01-02      |
    |3  |4.0   |NULL      |3,4.0                 |
    |4  |5.0   |2026-01-04|4,5.0,2026-01-04,EXTRA|
    |5  |6.0   |NULL      |5,6.0,2026-02-30      |
    +---+------+----------+----------------------+
    ```

    All four problems are caught: a bad number, a missing field, an
    extra field and an impossible date. The fields that did parse are
    kept, so a flagged row is not empty. Without the corrupt column, the
    same read gives five rows and no way to tell rows 2 to 5 from rows
    with genuinely missing values.

    Details that bite:

    - The column must be a nullable `STRING`; `_corrupt_record INT`
      fails at the first action with `INVALID_CORRUPT_RECORD_TYPE`.
    - `FAILFAST` fails with `FAILED_READ_FILE.NO_HINT`, caused by
      `MALFORMED_RECORD_IN_PARSING.WITHOUT_SUGGESTION` ("Malformed
      records are detected in record parsing: [2,null,20455]") and the
      underlying `NumberFormatException: For input string: "abc"`.
    - **Querying only the corrupt column is refused**, (as "JSON Drift
      and Quarantine" will show for JSON):

      ```python
      raw = spark.read.option("header", True).schema(sch + ", _corrupt_record STRING").csv(bad)
      raw.filter(F.col("_corrupt_record").isNotNull()).count()
      # [UNSUPPORTED_FEATURE.QUERY_ONLY_CORRUPT_RECORD_COLUMN] ...
      raw.cache().filter(F.col("_corrupt_record").isNotNull()).count()   # 4
      ```

      The corrupt column is only filled while the other columns are
      parsed. "JSON Drift and Quarantine" explains this error and its
      fixes in detail; for CSV the fix is the same: cache, or select a
      data column too.

