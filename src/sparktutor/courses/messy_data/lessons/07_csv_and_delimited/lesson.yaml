    ## Encodings

    The CSV reader decodes UTF-8 unless you set `encoding` (unlike the
    `text` source, it honours it). `legacy_latin1.tsv` was written in
    ISO-8859-1:

    ```python
    lat = "data/messy/delimited/legacy_latin1.tsv"
    spark.read.option("header", True).option("sep", "\t").csv(lat).select("name1", "city").show(2)
    (spark.read.option("header", True).option("sep", "\t").option("encoding", "ISO-8859-1")
        .csv(lat).select("name1", "city").show(2))
    ```

    ```
    +-----+---------+
    |name1|     city|
    +-----+---------+
    |  Zo�| Montr�al|
    | Jos�|S�o Paulo|
    +-----+---------+
    only showing top 2 rows
    +-----+---------+
    |name1|     city|
    +-----+---------+
    |  Zoë| Montréal|
    | José|São Paulo|
    +-----+---------+
    only showing top 2 rows
    ```

    **UTF-16 and UTF-32 need `multiLine`.** In line mode Spark finds
    line breaks by looking for the byte `0x0A`, which in UTF-16 is only
    half of a character, so the lines are cut in the wrong places:

    ```python
    u16 = csv_file("utf16.csv", "id,name\n1,Zoë\n2,Nguyễn\n", encoding="utf-16")
    spark.read.option("header", True).option("encoding", "UTF-16").csv(u16).collect()
    # [('1', 'Zoë�'), ('2', 'NguyÅṮ�'), ('�', None)]
    spark.read.option("header", True).option("encoding", "UTF-16").option("multiLine", True).csv(u16).collect()
    # [('1', 'Zoë'), ('2', 'Nguyễn')]
    ```

    Single-byte encodings (ISO-8859-1, US-ASCII) and UTF-8 work in both
    modes.

