    ## Folders Whose Columns Change

    The sales feed changed its layout twice. Read the folder as one CSV
    and look:

    ```python
    folder = "data/messy/delimited/sales"
    (spark.read.option("header", True).csv(folder)
        .withColumn("file", F.col("_metadata.file_name")).show(truncate=False))
    ```

    ```
    +----------+------+----------+--------+--------------------+
    |id        |amount|day       |currency|file                |
    +----------+------+----------+--------+--------------------+
    |10        |13.00 |2026-10-03|EUR     |sales_2026-10-03.csv|
    ...
    |5         |3.10  |2026-10-01|NULL    |sales_2026-10-01.csv|
    |2026-10-02|6     |12.00     |NULL    |sales_2026-10-02.csv|
    |2026-10-02|7     |n/a       |NULL    |sales_2026-10-02.csv|
    ...
    ```

    Spark took the column names from **one** file (here the day-3 file,
    with four columns), skipped the first line of every file, and laid
    every other file's values out **by position**. Day 2's dates are in
    `id`. Nothing failed. With an explicit schema and the default
    `enforceSchema`, the same thing happens; with
    `enforceSchema=false`, the read fails on the first file that
    differs, which at least tells you.

    Two ways to match columns by name:

    **1. Read each file with its own header and union by name.** List
    the files (`binaryFile` lists them without reading content, as in
    "Files as Files: binaryFile, Globs and Metadata"), read each one, and combine them with
    `unionByName(other, allowMissingColumns=True)` (3.1), which matches
    columns by name and fills columns a file doesn't have with NULL. The
    exercise does this, with a corrupt record column per file. It
    starts one small read per file, so it suits tens or hundreds of
    files, not millions.

    **2. One `VARIANT` column per row (4.1).** The option
    `singleVariantColumn` (SPARK-51298, 4.1) reads every row into one
    `VARIANT` value whose field names come from **each file's own
    header**:

    ```python
    v = spark.read.option("header", True).option("singleVariantColumn", "v").csv(folder)
    v.select("v", F.col("_metadata.file_name").alias("file")).show(5, truncate=False)
    ```

    ```
    +-----------------------------------------------------------+--------------------+
    |v                                                          |file                |
    +-----------------------------------------------------------+--------------------+
    |{"amount":13,"currency":"EUR","day":"2026-10-03","id":10}  |sales_2026-10-03.csv|
    |{"amount":2.5,"currency":"CAD","day":"2026-10-03","id":11} |sales_2026-10-03.csv|
    ...
    |{"amount":10.5,"day":"2026-10-01","id":1}                  |sales_2026-10-01.csv|
    +-----------------------------------------------------------+--------------------+
    ```

    ```python
    v.select(F.try_variant_get("v", "$.id", "int").alias("id"),
             F.try_variant_get("v", "$.amount", "decimal(10,2)").alias("amount"),
             F.try_variant_get("v", "$.day", "date").alias("day"),
             F.try_variant_get("v", "$.currency", "string").alias("currency"))
    ```

    Day 2's reordered columns now land in the right fields, and day 3's
    `currency` is simply present where it exists. "VARIANT Basics:
    Profiling and Nested Data" explains `VARIANT` and `try_variant_get`. Caveats, all verified on
    4.2.0:

    - Values inside the variant are **typed by inference**, so a SKU
      `00123` is stored as the number 123: the leading-zero problem
      again. Use this for feeds without such identifiers, or recover
      them from another source.
    - The schema may be only the variant column, or the variant column
      plus a `STRING` corrupt record column; anything else fails with
      `INVALID_SINGLE_VARIANT_COLUMN`. With the corrupt column, day 1's
      short row `3,4.00` keeps its raw text there.
    - The option is not in the 4.2 CSV options page; it is in the
      `CSVOptions` source (`singleVariantColumn`).

