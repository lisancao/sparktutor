    ## What You'll Learn

    "Columns and Expressions: Cleaning Values" read a CSV file with every
    column as a string and cleaned the values afterwards. "Files as
    Files: binaryFile, Globs and Metadata" showed `_metadata` and how Spark lists files, and "Text and
    Logs" read text line by line and met encodings. This lesson is about
    the CSV reader itself, which can do a lot of that work for you, and
    can also get it silently wrong.

    CSV is the most common messy format there is: every spreadsheet,
    database and legacy system can export it, and no two of them agree
    on the details. There is an informational standard (RFC 4180), but
    real files differ in separators, quoting, escaping, line breaks,
    encodings, null markers, number and date conventions, and whether
    the header matches the data.

    By the end of this lesson you will be able to:

    - Read headers correctly, including duplicate and blank names, and
      know why `enforceSchema` defaults to ignoring them
    - Decide when `inferSchema` is worth its cost, and what it breaks
      (leading zeros, mixed columns, dates)
    - Set `sep`, `quote`, `escape`, `unescapedQuoteHandling` and
      `multiLine` for the file you actually have
    - Control `nullValue`, `emptyValue`, `nanValue`, whitespace,
      `dateFormat`, `timestampFormat` and `locale` (decimal commas)
    - Read other encodings, byte order marks and comment lines, and know
      the Spark 4.0 charset restriction
    - Keep malformed rows with `mode` and `columnNameOfCorruptRecord`,
      and avoid the `DROPMALFORMED` counting trap
    - Read a folder whose files have reordered or extra columns
    - Parse CSV inside a column with `from_csv` and `schema_of_csv`, and
      fixed-width files with `substring`
    - Write CSV that other tools read back exactly

- Class: text
  Depth: beginner
  Output: |
    A CSV file is a spreadsheet printed as plain text: one line per row,
    commas between the cells. It carries no types, so `00042` could be a
    number or a code, and no rules for awkward cells, so every program
    invents its own way to write a comma, a quote or a line break inside
    one. Reading CSV well means finding out which rules this particular
    file follows, and telling Spark.

