  Output: |
    ## Byte Order Marks and Comment Lines

    Some tools (Excel's "CSV UTF-8", many Windows programs) start a UTF-8
    file with the bytes `EF BB BF`, the **byte order mark** (BOM,
    U+FEFF). Read naively, it sticks to the first column name. Spark
    handles it for you:

    ```python
    bom = csv_file("bom.csv", "id,name\n1,Ada\n", encoding="utf-8-sig")   # writes the BOM
    open(bom, "rb").read()[:6]                       # b'\xef\xbb\xbfid,'
    spark.read.option("header", True).csv(bom).columns   # ['id', 'name'], 'id' has length 2
    ```

    The BOM is dropped in line mode (by the line reader) and in
    `multiLine` mode (by the CSV parser). The `text` source drops it in
    line mode too, but `text(..., wholetext=True)` keeps it as the first
    character, so check for it if you split whole files yourself.

    `comment` names one character; lines that **start** with it are
    skipped, including before the header:

    ```python
    spark.read.option("header", True).option("sep", ";").csv(eu).columns
    # ['# Export Kassensystem 2026-10-05']
    spark.read.option("header", True).option("sep", ";").option("comment", "#").csv(eu).columns
    # ['order_id', 'sku', 'customer', 'amount', 'order_date', 'note']
    ```

    Only the first character of the line counts: `  # indented` and a
    value such as `1,# not a comment` are data. A longer marker such as
    `//` fails with `OPTION_VALUE_EXCEEDS_ONE_CHARACTER`.

