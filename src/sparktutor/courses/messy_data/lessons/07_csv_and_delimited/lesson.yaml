  Output: |
    ## Summary

    In this lesson you learned:

    - **Defaults to remember**: `sep=","`, `header=false`, every column
      `STRING`, a backslash as `escape` (not RFC 4180's `""`),
      `multiLine=false`, `nullValue` and `emptyValue` both empty, no
      trimming on read but trimming on write, UTF-8, `en-US` locale.
    - **Headers**: duplicates get their position appended, blanks become
      `_cN`; backticks for odd names; `toDF` renames by position. With a
      schema, `enforceSchema=true` ignores the header and fills columns
      by position; set it to `false` to have the header checked.
    - **`inferSchema`** costs a full extra pass, drops leading zeros,
      turns a column with one odd value into a string, and with
      `samplingRatio` can turn unseen values into NULL. Infer once,
      then pass an explicit schema.
    - **Quoting**: set `escape='"'` for files from other tools;
      `unescapedQuoteHandling` (3.1) for stray quotes; `multiLine` for
      line breaks inside fields, at the cost of splitting and with the
      runaway-quote risk.
    - **Values**: `nullValue`, `emptyValue`, `nanValue`; padded integers
      are NULL unless you trim; `dateFormat`/`timestampFormat`/`timeZone`;
      `locale` for month names and **decimal commas** (`12,50` read as
      `DECIMAL` with `en-US` is 1250.00).
    - **Encodings**: `encoding` works in line mode for single-byte
      charsets and UTF-8, UTF-16 needs `multiLine`; 4.0 allows only a
      fixed charset list (`INVALID_PARAMETER_VALUE.CHARSET`). BOMs are
      dropped for you; `comment` skips lines starting with one character.
    - **Malformed rows**: declare `_corrupt_record STRING` and use
      `PERMISSIVE`; don't query it alone; `DROPMALFORMED` with `count()`
      gives a different number than `collect()`.
    - **Changing layouts**: a folder read lays files out by position;
      read per file and `unionByName(allowMissingColumns=True)`, or use
      `singleVariantColumn` (4.1).
    - **`from_csv`/`schema_of_csv`/`to_csv`** for CSV in a column;
      **fixed width** with `text` and `substring`, validating length.
    - **Writing**: a folder of part files; `escape='"'` and no trimming
      for exact round trips; nested types need `to_json`.

    Next: **JSON Drift and Quarantine**, where the format describes
    itself and the trouble is that the description keeps changing.
