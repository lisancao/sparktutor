    ## More Writing Rules

    - **Existing output**: the default save mode is "error if exists",
      so writing to `out` again fails with `PATH_ALREADY_EXISTS` ("Set
      mode as "overwrite" to overwrite the existing path").
      `mode("overwrite")` replaces the folder; `mode("append")` adds
      part files.
    - **One file**: `coalesce(1)` makes one task write everything, so it
      is slow for big data and the file name is still `part-...csv`
      inside a folder. If a consumer needs `report.csv`, write to a
      temporary folder and move the single part file afterwards (on a
      local disk, `glob` plus `shutil.move`), or keep the folder: every
      Spark reader and most tools read a folder of parts.
    - **Nested types fail**: a struct, array or map column gives
      `UNSUPPORTED_DATA_TYPE_FOR_DATASOURCE` ("The CSV datasource doesn't
      support the column `s` of the type ..."). Turn it into text first
      with `to_json`.
    - **Dates and timestamps** are written as `2026-01-05` and
      `2026-01-05T10:00:00.000Z` (in the session time zone) unless you
      set `dateFormat` and `timestampFormat` for the write too.
    - **Compression**: `option("compression", "gzip")` writes
      `part-...csv.gz`, which every Spark reader decompresses by its
      extension. A gzip file cannot be split, so one task reads each.

