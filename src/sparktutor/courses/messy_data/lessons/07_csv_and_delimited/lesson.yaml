  Output: |
    ## DROPMALFORMED and count(): Three Different Answers

    CSV parsing is **lazy per column**: Spark parses only the columns a
    query needs (`spark.sql.csv.parser.columnPruning.enabled`, true by
    default). With `DROPMALFORMED`, that changes which rows are
    malformed:

    ```python
    dm = spark.read.option("header", True).option("mode", "DROPMALFORMED").schema(sch).csv(bad)
    len(dm.collect())          # 1: every column parsed, rows 2 to 5 dropped
    dm.count()                 # 5: no column needed, nothing parsed, nothing dropped
    dm.select("id").count()    # 5: every id parses fine
    ```

    With column pruning switched off, `count()` gives **3**: the rows
    with the wrong number of fields are dropped, but the bad values in
    rows 2 and 5 are still not converted, so they survive. After
    `dm.cache()`, `count()` is 1 again, because caching materializes
    every column.

    The CSV docs say it directly: "corrupt records can be different
    based on required set of fields". So `DROPMALFORMED` plus `count()`
    is not a way to measure how many good rows you have, and
    `DROPMALFORMED` in general hides data loss. Prefer `PERMISSIVE` with
    a corrupt record column, and count the quarantine.

