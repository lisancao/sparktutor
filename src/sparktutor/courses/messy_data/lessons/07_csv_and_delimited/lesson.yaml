    ## inferSchema: Convenient, Slow and Lossy

    `inferSchema` reads the data to guess a type for each column:

    ```python
    inv = csv_file("infer.csv",
        "sku,zip,qty,price,day,ts,flag,mixed\n"
        "00123,02139,1,1.50,2026-01-05,2026-01-05 10:00:00,true,7\n"
        "00456,10001,2,2.25,2026-01-06,2026-01-06 11:30:00,false,x\n")
    df = spark.read.option("header", True).option("inferSchema", True).csv(inv)
    df.printSchema()
    df.show()
    ```

    ```
    root
     |-- sku: integer (nullable = true)
     |-- zip: integer (nullable = true)
     |-- qty: integer (nullable = true)
     |-- price: double (nullable = true)
     |-- day: date (nullable = true)
     |-- ts: timestamp (nullable = true)
     |-- flag: boolean (nullable = true)
     |-- mixed: string (nullable = true)

    +---+-----+---+-----+----------+-------------------+-----+-----+
    |sku|  zip|qty|price|       day|                 ts| flag|mixed|
    +---+-----+---+-----+----------+-------------------+-----+-----+
    |123| 2139|  1|  1.5|2026-01-05|2026-01-05 10:00:00| true|    7|
    |456|10001|  2| 2.25|2026-01-06|2026-01-06 11:30:00|false|    x|
    +---+-----+---+-----+----------+-------------------+-----+-----+
    ```

    What went wrong:

    - **Leading zeros are gone.** `00123` became `123` and the ZIP code
      `02139` became `2139`. Identifiers that look like numbers must stay
      strings.
    - **One odd value makes a column `string`** (`mixed`), and on a
      bigger file that one value may be in row 9 million.
    - **Dates are only found in ISO format** (`preferDate`, an option
      since 3.4 and on by default, makes `2026-01-05` a `DATE`).
      `05/01/2026` stays a string unless you pass `dateFormat`, and then
      it is inferred as a date in that format.
    - **Padded numbers become doubles**: ` 7 ` is inferred as `double`,
      because the integer check is stricter than the double check.

    It also costs time. Counting the Spark jobs that just *defining*
    the DataFrame starts (with `spark.sparkContext.statusTracker()` and a
    job group) on `products.csv`:

    ```
    schema given:          0 jobs
    header only:           1 job   (read the first line for the names)
    header + inferSchema:  2 jobs  (first line, then a full pass)
    ```

    The full pass reads the **entire** input before your query starts.
    `samplingRatio` makes it cheaper and riskier: a column of 1,000
    numbers followed by one `hello` is `string` with full inference and
    `int` with `samplingRatio=0.1`, and then `hello` silently becomes
    NULL.

    Use inference to explore a new file, then copy the schema it found
    (`df.schema.simpleString()`, as in "Schemas for Data You Don't
    Control"), fix the types that are wrong, and pass that schema in the
    real job.

