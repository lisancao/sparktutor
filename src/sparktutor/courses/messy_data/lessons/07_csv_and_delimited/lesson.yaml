    ## enforceSchema: Your Schema Wins, Silently

    When you pass a schema **and** `header=True`, the header line is
    skipped and **ignored**: columns are taken by position. If the file's
    columns are in another order, nothing complains:

    ```python
    swapped = csv_file("swapped.csv", "name,id\nAda,1\nBao,2\n")
    spark.read.option("header", True).schema("id INT, name STRING").csv(swapped).show()
    ```

    ```
    +----+----+
    |  id|name|
    +----+----+
    |NULL|   1|
    |NULL|   2|
    +----+----+
    ```

    The names went into `id` (not integers, so NULL) and the IDs into
    `name`. Set `enforceSchema` to `false` (2.4, SPARK-23786) and Spark
    checks the header against the schema instead:

    ```python
    (spark.read.option("header", True).option("enforceSchema", False)
        .schema("id INT, name STRING").csv(swapped).collect())
    ```

    ```
    [FAILED_READ_FILE.NO_HINT] Encountered error while reading file .../swapped.csv.
    Caused by: SparkIllegalArgumentException: CSV header does not conform to the schema.
     Header: name, id
     Schema: id, name
    Expected: id but found: name
    ```

    It does not reorder the columns for you; it refuses to read them
    wrongly, which is what you want in a production job. The check
    happens per file when it is read, so it also catches a single file
    in a folder whose layout changed. A corrupt record column (later in
    this lesson) in the schema does not break the check.

