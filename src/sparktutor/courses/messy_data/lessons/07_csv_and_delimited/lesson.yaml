    ## Fixed-Width Files

    Mainframes, banks and government systems still produce files where
    each column is a fixed range of characters, with no separator at
    all:

    ```
    HDR20261005STORES
    0001Corner Store        Toronto     201903010001250050
    0002Le Petit Marché     Montréal    202006150000000999
    0003Pho Kitchen         Hà Nội      202111010007342210
    0004Harbour Books       Halifax     202301200000000000
    0005Broken Line
    TRL000004
    ```

    There is no fixed-width reader in Spark; read lines with `text` and
    cut them with `substring` (positions count from 1):

    ```python
    lines = spark.read.text("data/messy/delimited/stores_fixed.txt")
    recs = lines.filter(~F.col("value").startswith("HDR") & ~F.col("value").startswith("TRL"))
    stores = recs.select(
        F.substring("value", 1, 4).alias("store_id"),
        F.trim(F.substring("value", 5, 20)).alias("name"),
        F.trim(F.substring("value", 25, 12)).alias("city"),
        F.try_to_date(F.substring("value", 37, 8), "yyyyMMdd").alias("opened"),
        (F.substring("value", 45, 10).try_cast("decimal(12,0)") / 100).cast("decimal(12,2)").alias("sales"),
        F.length("value").alias("len"))
    stores.show()
    ```

    ```
    +--------+---------------+--------+----------+--------+---+
    |store_id|           name|    city|    opened|   sales|len|
    +--------+---------------+--------+----------+--------+---+
    |    0001|   Corner Store| Toronto|2019-03-01|12500.50| 54|
    |    0002|Le Petit Marché|Montréal|2020-06-15|    9.99| 54|
    |    0003|    Pho Kitchen|  Hà Nội|2021-11-01|73422.10| 54|
    |    0004|  Harbour Books| Halifax|2023-01-20|    0.00| 54|
    |    0005|    Broken Line|        |      NULL|    NULL| 15|
    +--------+---------------+--------+----------+--------+---+
    ```

    What the layout spec usually doesn't tell you:

    - **Header and trailer records** (`HDR...`, `TRL000004`) carry batch
      metadata; filter them out by their prefix, and use the trailer's
      count (4 stores) to check you read everything.
    - **Validate the length.** `substring` beyond the end of a line
      returns `""`, so a truncated line becomes a row of empty values
      (`0005`). Keep lines whose `length` is the record width, and
      quarantine the rest.
    - **Implied decimals**: `0001250050` with "2 implied decimals" is
      12500.50. Cast to `DECIMAL` and divide, never via `DOUBLE`.
    - **Characters or bytes?** `substring` counts characters. The
      `Marché` line is 54 characters but 56 bytes in UTF-8. Many specs
      written for single-byte encodings count bytes; if the file is
      UTF-8 and the spec counts bytes, every accented letter shifts the
      following columns. For a byte-based layout, read with `binaryFile`
      and cut bytes with `substring` on the binary, then `decode`.

