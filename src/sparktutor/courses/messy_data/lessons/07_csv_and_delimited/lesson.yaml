    ## Quotes and Escapes: Spark Is Not RFC 4180 by Default

    A field that contains the separator, a quote or a line break is
    wrapped in quotes. Inside quotes, there are two conventions for a
    literal quote character: RFC 4180 (Excel, Python's `csv` module,
    most databases) doubles it, `""`; Spark's default escapes it with a
    backslash, `\"`.

    ```python
    q = csv_file("quotes.csv",
        'id,note\n1,"hello, world"\n2,"she said ""hi"""\n3,"back\\"slash"\n')
    spark.read.option("header", True).csv(q).show(truncate=False)
    spark.read.option("header", True).option("escape", '"').csv(q).show(truncate=False)
    ```

    ```
    +---+-----------------+
    |id |note             |
    +---+-----------------+
    |1  |hello, world     |
    |2  |"she said ""hi"""|
    |3  |back"slash       |
    +---+-----------------+

    +---+-------------+
    |id |note         |
    +---+-------------+
    |1  |hello, world |
    |2  |she said "hi"|
    |3  |"back\"slash"|
    +---+-------------+
    ```

    With the default escape, the RFC-style row 2 comes back with all its
    quotes; with `escape='"'` it is right and the backslash-style row 3
    is wrong. Neither setting reads both. Find out which convention the
    producer uses (it is almost always `""` for files from other tools)
    and set `escape` to match. `quote` changes the quote character
    (`quote="'"` for single quotes), and an empty `quote` turns quoting
    off entirely.

