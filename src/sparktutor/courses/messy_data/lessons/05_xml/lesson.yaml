    ## Reading XML: rowTag

    ```xml
    <orders>
      <order id="0" channel="store"><customer>C0</customer><items>
          <item sku="P8"><qty>2</qty></item><item sku="P7"><qty>3</qty></item>
        </items><coupon>SAVE0</coupon></order>
      <order id="2" channel="store"><customer>C2</customer><items>
          <item sku="P1"><qty>3</qty></item>
        </items></order>
      ...
    </orders>
    ```

    A JSON Lines file has one record per line. An XML file is one big
    tree, so you tell Spark which element is a record:

    ```python
    orders = spark.read.option("rowTag", "order").xml("data/messy/xml/orders.xml")
    ```

    `rowTag` is required. Without it, both `spark.read.xml(path)` and
    `format("xml").load(path)` fail with `XML_ROW_TAG_MISSING` ("`rowTag`
    option is required for reading/writing files in XML format"). Writing
    needs it too, and `rootTag` names the element that wraps the rows:

    ```python
    orders.write.option("rowTag", "order").option("rootTag", "orders").xml(out)
    ```

