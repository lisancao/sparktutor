    ## Exercise: Items Per Order, Two Ways

    Get one row per ordered item from `data/messy/xml/orders.xml`, once
    with an inferred struct schema and once with VARIANT, and parse XML
    stored in a string column.

    1. `read_orders(spark, path)`: one row per `<order>`.
    2. `items_from_struct(orders)`: `order_id` (from the `id`
       attribute), `sku` (from the `sku` attribute) and `qty` (an int),
       one row per item.
    3. `read_orders_variant(spark, path)`: one VARIANT column `v` per
       order.
    4. `items_from_variant(spark, ov)`: the same three columns from
       VARIANT, normalizing "one item" (an object) and "several items"
       (an array) to an array first.
    5. `parse_prices(df)`: `df` has a column `xml` with values such as
       `<price cur="CAD">4.5</price>`; add `amount` (double) and
       `currency` (string) with `from_xml`.

    The harness parses the file with Python's `xml.etree` to get the
    expected items, then checks: 10 orders with attribute columns and 4
    coupons, the same items (order, SKU, quantity) from both paths, the
    single-item orders being OBJECTs in VARIANT mode, and the three
    parsed prices, including one with no currency attribute.
