    In JSON, a list always looks like a list: `"items": [ ... ]`. XML
    has no list syntax. A list is just the same element written several
    times in a row:

    ```xml
    <items><item>A</item><item>B</item></items>   <!-- two items -->
    <items><item>A</item></items>                 <!-- one item -->
    ```

    Looking at the second line alone, nobody can tell whether `<item>` is
    "a list with one entry" or "a single thing". Spark has to guess, and
    the next two sections are about how it guesses.

