    ## Summary

    In this lesson you learned:

    - **The built-in XML source** (4.0) needs `rowTag` to read and to
      write (`XML_ROW_TAG_MISSING` otherwise); `rootTag` wraps written
      rows.
    - **Mapping**: child elements are fields, attributes get the `_`
      prefix (`attributePrefix`), and the text of an element that also
      has attributes is `_VALUE` (`valueTag`).
    - **One child or many**: struct inference makes a repeated element
      an array only if some row repeats it, so pin `ARRAY` in an explicit
      schema for pipelines. In VARIANT mode, one child is an `OBJECT`
      and several are an `ARRAY`, so normalize with
      `CASE WHEN schema_of_variant(...) LIKE 'ARRAY%' ... ELSE array(...)`.
    - **XML in strings**: `from_xml` with a schema or `'variant'`, and
      `schema_of_xml(F.lit(sample))`; a bare column name is parsed as XML
      text and silently gives a `_corrupt_record`-only schema.
    - **Malformed XML in 4.2.0**: with the default parser, a broken tag
      can put the rest of the file into one corrupt record; the legacy
      parser (`useLegacyXMLParser`) isolates the bad record. Count rows
      independently when the source is untrusted.

    Next: **Documents to Rows**, where the input is e-mails, PDFs and
    Markdown, and each file becomes one or many rows of text with
    metadata.
