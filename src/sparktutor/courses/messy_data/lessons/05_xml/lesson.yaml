    ## What You'll Learn

    XML is older than JSON and still everywhere: bank and insurance
    feeds, government data, invoices (UBL), product catalogues, office
    documents, RSS. Since Spark 4.0, reading it needs no extra package:
    the XML data source is built in (SPARK-44265), along with the
    `from_xml` and `schema_of_xml` functions.

    `learning_spark` lesson 3 showed the basics (`rowTag`, `rootTag`,
    the `_` prefix for attributes). This lesson is about the parts of XML
    that make it messier than JSON.

    By the end of this lesson you will be able to:

    - Explain how elements, attributes and text map to columns
      (`attributePrefix`, `_VALUE`)
    - Predict when a repeated element becomes an array and when it does
      not, in both struct and VARIANT mode
    - Normalize "one child or many" so no rows go missing
    - Parse XML that sits inside a string column with `from_xml` and
      `schema_of_xml`
    - Know how malformed XML behaves in 4.2.0, and why one broken tag can
      cost you more than one record

    The sample file is `data/messy/xml/orders.xml`: ten orders, each with
    attributes, a customer, one to three items, and sometimes a coupon.

