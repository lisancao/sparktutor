    ## One Child or Many: Struct Mode

    Orders 2 and 6 have one `<item>`; the others have two or three. In struct
    mode, inference looks at **all** rows, sees that `item` repeats
    somewhere, and makes it an array everywhere. Order 2 simply gets an
    array of one:

    ```python
    orders.select("_id", F.size("items.item").alias("n"))   # order 2: n = 1
    items = (orders
        .select(F.col("_id").alias("order_id"), F.explode("items.item").alias("it"))
        .select("order_id", F.col("it._sku").alias("sku"), "it.qty"))
    ```

    That is convenient, and also a trap: the schema depends on the data
    in the folder. Read a file in which **every** order has exactly one
    item, and `items.item` is inferred as a struct, not an array:

    ```
     |-- items: struct
     |    |-- item: struct
     |    |    |-- _sku: string
     |    |    |-- qty: long
    ```

    Now `explode("items.item")` fails, because you cannot explode a
    struct, and a job that worked yesterday breaks on today's file. For a
    pipeline, declare the schema with `ARRAY` where you know a child can
    repeat:

    ```python
    schema = """_id BIGINT, _channel STRING, customer STRING, coupon STRING,
                items STRUCT<item: ARRAY<STRUCT<_sku: STRING, qty: BIGINT>>>"""
    spark.read.schema(schema).option("rowTag", "order").xml(path)
    ```

    With an explicit array type, a single child is read as an array of
    one, whatever the rest of the file looks like.

