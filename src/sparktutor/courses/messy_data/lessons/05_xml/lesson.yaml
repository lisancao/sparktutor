    ## Malformed XML in 4.2.0: One Bad Tag, Many Lost Rows

    The XML source supports the same `mode` and `_corrupt_record`
    handling as JSON. But XML is a tree, not a list of lines, and a
    broken tag can confuse the parser about where the next record
    starts. Take this file, with a typo in the middle order:

    ```xml
    <orders>
    <order id="1"><customer>C1</customer></order>
    <order id="2"><customer>C2</custo></order>
    <order id="3"><customer>C3</customer></order>
    </orders>
    ```

    With default settings in 4.2.0, you get **two** rows, not three:

    ```
    +------------------------------------------------+----+--------+
    |_corrupt_record                                 |_id |customer|
    +------------------------------------------------+----+--------+
    |NULL                                            |1   |C1      |
    |<orders>\n<order id="1">...</orders>\n          |NULL|NULL    |
    +------------------------------------------------+----+--------+
    ```

    Order 1 parsed; then the parser hit `</custo>`, gave up on the rest
    of the file, and put the whole file text in the corrupt column. The
    perfectly valid order 3 is gone, and it does not appear anywhere as
    a row.

    The default parser since 4.1 is a newer, more memory-efficient one.
    The older parser is still available with
    `option("useLegacyXMLParser", True)` (or the internal session setting
    `spark.sql.legacy.useLegacyXMLParser`), and on this file it gives
    three rows: order 1, a corrupt row holding only
    `<order id="2"><customer>C2</custo></order>`, and order 3.

    Practical advice: when XML comes from a source you do not trust,
    count `rowTag` elements independently (for example, a quick
    `regexp_count` on the raw text, or a Python check like the exercise
    harness), compare with the rows you got, and try the legacy parser
    when the numbers disagree.

