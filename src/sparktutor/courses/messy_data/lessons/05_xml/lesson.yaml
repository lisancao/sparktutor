    ## Elements, Attributes and Text

    ```
    root
     |-- _channel: string (nullable = true)
     |-- _id: long (nullable = true)
     |-- coupon: string (nullable = true)
     |-- customer: string (nullable = true)
     |-- items: struct (nullable = true)
     |    |-- item: array (nullable = true)
     |    |    |-- element: struct (containsNull = true)
     |    |    |    |-- _sku: string (nullable = true)
     |    |    |    |-- qty: long (nullable = true)
    ```

    The mapping rules:

    - **Child elements** become fields: `<customer>C0</customer>` is
      `customer`.
    - **Attributes** become fields with a prefix, `_` by default:
      `id="0"` is `_id`. Change the prefix with
      `option("attributePrefix", "@")` (giving `@id`), or drop attributes
      with `option("excludeAttribute", True)`.
    - **Types are inferred** from the text: `_id` and `qty` are `long`.
      `option("inferSchema", False)` keeps everything as strings.
    - **Optional elements** are NULL where absent: 4 of the 10 orders have
      a `coupon`.
    - **Wrapper elements stay**: `<items>` holding `<item>`s is a struct
      with one field, `item`, so the path is `items.item`.

    One case has no JSON equivalent: an element with **both text and
    attributes**, such as `<total cur="CAD">4.5</total>`. Its text goes
    into a field called `_VALUE`, next to the attributes:

    ```
     |-- total: struct
     |    |-- _VALUE: double
     |    |-- _cur: string
    ```

    `option("valueTag", "amount")` renames `_VALUE`. Once one row has an
    attribute on `<total>`, the column is a struct for every row: a plain
    `<total>3</total>` elsewhere becomes `{3.0, NULL}`.

