    ## Normalizing: Always an Array

    Decide per row: if it is already an array, cast it; otherwise wrap
    the single object in a one-element array:

    ```sql
    WITH norm AS (
      SELECT v:_id::bigint AS order_id,
             CASE WHEN schema_of_variant(v:items.item) LIKE 'ARRAY%'
                  THEN v:items.item::array<variant>
                  ELSE array(v:items.item)
             END AS items
      FROM ov
    )
    SELECT order_id, size(items) AS n,
           transform(items, i -> i:_sku::string) AS skus
    FROM norm
    ```

    ```
    +--------+---+------------+
    |order_id|n  |skus        |
    +--------+---+------------+
    |0       |2  |[P8, P7]    |
    |1       |3  |[P9, P8, P4]|
    |2       |1  |[P1]        |
    ...
    ```

    `CASE` evaluates only the branch that applies, so the cast never sees
    a single object. After this step every order has an
    `array<variant>`, and an ordinary `explode` gives one row per item.
    Missing elements still work: if `<items>` were absent,
    `v:items.item` would be NULL, `array(NULL)` would give one NULL
    item, and you would filter it out.

