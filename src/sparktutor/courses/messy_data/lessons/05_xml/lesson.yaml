    ## XML Inside a String Column

    XML also turns up as a value inside other data: a SOAP payload in a
    log, a column in a CSV export, a message on a queue. `from_xml`
    (4.0) parses a string column with a schema, where the root element
    of each string is the row:

    ```python
    prices = spark.createDataFrame(
        [(1, '<price cur="CAD">4.5</price>'), (2, '<price>7.25</price>')], ["id", "xml"])

    prices.select("id", F.from_xml("xml", "_VALUE DOUBLE, _cur STRING").alias("p"))
    # {4.5, CAD} and {7.25, NULL}
    ```

    `schema_of_xml` (4.0) infers the DDL from one example:

    ```python
    lines = spark.read.text("data/messy/xml/orders.xml").filter(F.col("value").contains("<order "))
    one = lines.first()[0].strip()
    ddl = spark.range(1).select(F.schema_of_xml(F.lit(one))).first()[0]
    # STRUCT<_channel: STRING, _id: BIGINT, coupon: STRING, customer: STRING,
    #        items: STRUCT<item: ARRAY<STRUCT<_sku: STRING, qty: BIGINT>>>>

    parsed = lines.select(F.from_xml(F.trim("value"), ddl).alias("o")).select("o.*")
    ```

    Like `schema_of_json`, `schema_of_xml` takes a **literal**. Pass a
    column name as a plain string and it is parsed as XML text, which is
    worse than an error: `F.schema_of_xml("value")` quietly returns a
    schema with only a `_corrupt_record` field. Always wrap the sample in
    `F.lit(...)`.

    And `from_xml(col, 'variant')` parses into VARIANT instead of a
    struct, with the same "one child is an object" rule:
    `from_xml('<o><a>1</a><a>2</a></o>', 'variant')` is `{"a":[1,2]}`,
    while `<o><a>1</a></o>` gives `{"a":1}`.

