  SolutionFile: solution.py
  Hint: "Struct: orders.select(F.col('_id').alias('order_id'), F.explode('items.item').alias('it')). VARIANT: CASE WHEN schema_of_variant(v:items.item) LIKE 'ARRAY%' THEN v:items.item::array<variant> ELSE array(v:items.item) END, then LATERAL VIEW explode(items) t AS it. Prices: F.from_xml('xml', '_VALUE DOUBLE, _cur STRING')."

