    ## More XML Options Worth Knowing

    A few options from the 4.2.0 `XmlOptions` that come up with real
    feeds:

    - `ignoreNamespace`: drop namespace prefixes such as `ns1:` from
      element and attribute names (without it, `<a:row a:id="1">` gives
      columns like `_a:id`, and `rowTag` must be `a:row`).
    - `rowValidationXSDPath`: validate each row against an XSD schema;
      rows that fail are handled by `mode` like any malformed record.
    - `nullValue`: a string to read as NULL (for example `"N/A"`).
    - `ignoreSurroundingSpaces`: trim whitespace around values (on by
      default: `<name>  x  </name>` reads as `x`).
    - `samplingRatio`: infer the schema from a fraction of rows.

    And the design choice from the last two lessons applies here too:
    infer while exploring, then either pin an explicit schema (with
    `ARRAY` where children can repeat) or land the rows as VARIANT and
    normalize at read time.

