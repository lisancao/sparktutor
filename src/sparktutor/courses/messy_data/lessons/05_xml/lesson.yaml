    ## One Child or Many: VARIANT Mode

    `singleVariantColumn` works for XML too, giving one VARIANT per row
    and no inference:

    ```python
    ov = (spark.read.option("rowTag", "order")
          .option("singleVariantColumn", "v")
          .xml("data/messy/xml/orders.xml"))
    ```

    VARIANT has no cross-row schema, so each order is converted on its
    own. An order with several `<item>`s gets an array; an order with one
    gets **a single object**:

    ```sql
    SELECT v:_id::int AS id, schema_of_variant(v:items.item) AS t FROM ov
    ```

    ```
    +---+----------------------------------------+
    |id |t                                       |
    +---+----------------------------------------+
    |0  |ARRAY<OBJECT<_sku: STRING, qty: BIGINT>>|
    |1  |ARRAY<OBJECT<_sku: STRING, qty: BIGINT>>|
    |2  |OBJECT<_sku: STRING, qty: BIGINT>       |
    ...
    ```

    And `schema_of_variant_agg(v)` merges that to `items: OBJECT<item:
    VARIANT>`: the "more than one type" signal from the last lesson.

    Each quick fix loses orders 2 and 6:

    - `v:items.item::array<variant>` fails the query with
      `INVALID_VARIANT_CAST` ("The variant value {"_sku":"P1","qty":3}
      cannot be cast into "ARRAY<VARIANT>"").
    - `try_variant_get(v:items.item, '$', 'array<variant>')` returns
      NULL for them, so they silently vanish from an explode.
    - `v:items.item[0]` returns NULL for a single object, for the same
      reason.

