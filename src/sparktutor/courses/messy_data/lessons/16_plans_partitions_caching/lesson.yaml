    ## The Sample Query

    The examples use the cleaned events from "JSON Drift and
    Quarantine": the drift-absorbing schema, the corrupt record column,
    and `coalesce` over the old and new field names. A `day` column
    comes from the timestamp.

    ```python
    from pyspark.sql import SparkSession, functions as F

    spark = (SparkSession.builder.master("local[4]")
             .config("spark.sql.session.timeZone", "UTC").getOrCreate())

    EVENT_SCHEMA = """
        event STRING, event_type STRING, user_id BIGINT,
        user STRUCT<id: BIGINT, plan: STRING, geo: STRUCT<country: STRING>>,
        amount STRING,
        items ARRAY<STRUCT<sku: STRING, qty: INT>>,
        ts TIMESTAMP,
        _corrupt STRING
    """
    raw = (spark.read.schema(EVENT_SCHEMA)
           .option("columnNameOfCorruptRecord", "_corrupt")
           .json("data/messy/events"))

    amount = F.coalesce(F.col("amount").try_cast("double"),
                        F.get_json_object("amount", "$.value").try_cast("double"))
    silver = (raw.filter(F.col("_corrupt").isNull())
              .select(F.coalesce("event_type", "event").alias("event_type"),
                      F.coalesce(F.col("user.id"), F.col("user_id")).alias("user_id"),
                      F.col("user.plan").alias("plan"),
                      amount.alias("amount"),
                      "ts",
                      F.to_date("ts").alias("day")))
    ```

    Setting the session time zone to UTC keeps `to_date("ts")` and the
    printed timestamps the same on every machine. Without it Spark uses
    your computer's time zone.

