  Output: |
    ## Partition Folder Gotchas

    Folder names are text, and Spark guesses their types when it reads
    them back (`spark.sql.sources.partitionColumnTypeInference.enabled`,
    default `true`). That is how `day` came back as a `date`. It is also
    how messy codes get damaged:

    ```python
    spark.createDataFrame([("001", 1), ("010", 2)], "code string, n int") \
        .write.partitionBy("code").parquet("/tmp/by_code")
    spark.read.parquet("/tmp/by_code").orderBy("n").show()
    ```

    ```
    +---+----+
    |  n|code|
    +---+----+
    |  1|   1|
    |  2|  10|
    +---+----+
    ```

    The leading zeros are gone: every folder name looked like a number,
    so `code` became an `int`. Add a folder named `code=abc` and the
    column stays a string, so the type depends on which values exist
    today. Keep the strings by passing a schema
    (`spark.read.schema("code string, n int")`) or setting the inference
    setting to `false`.

    And:

    - The partition column comes back as the **last** column, not where
      it was.
    - Reading one folder directly (`.parquet(".../day=2026-10-02")`)
      loses the `day` column. Add `.option("basePath", ".../events_by_day")`
      to keep it.

