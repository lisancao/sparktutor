    ## Many Small Files

    Small files are the most common performance problem with messy
    data: one JSON file per API call, one image per upload. The packing
    rule keeps the task count reasonable, but each file still has to be
    listed, opened and closed, and that per-file cost is what
    `openCostInBytes` models. A few knobs:

    - `spark.sql.files.maxPartitionNum` (3.5, unset by default): if the
      packing makes more partitions than this, Spark repacks them into
      about that many (and logs a warning saying it ignored
      `maxPartitionBytes`).
    - `spark.sql.files.minPartitionNum` (3.1): raise it to cut big
      inputs into more pieces than you have cores.
    - The real fix is upstream: compact small files into bigger ones
      once (read, `repartition`, write), or land them in a table format
      that can compact itself (`OPTIMIZE` in Delta, covered in the
      advanced "Designing Tables for Blobs").

- Class: text
  Depth: all
  Output: |
    ## repartition Versus coalesce

    Both change the number of partitions; only one shuffles. On
    `silver` (3 partitions, one per file):

    ```
    repartition(8)               8 Exchange RoundRobinPartitioning(8), REPARTITION_BY_NUM
    repartition(8, 'user_id')    8 Exchange hashpartitioning(user_id#10L, 8), REPARTITION_BY_NUM
    repartition('user_id')       1 Exchange hashpartitioning(user_id#10L, 200), REPARTITION_BY_COL
    repartitionByRange(4, 'ts')  4 Exchange rangepartitioning(ts#6 ASC NULLS FIRST, 4), REPARTITION_BY_NUM
    coalesce(1)                  1 Coalesce 1
    ```

    (label, `rdd.getNumPartitions()`, and the top line of the plan)

    - `repartition(n)` deals rows round-robin into exactly `n`
      partitions: even sizes, full shuffle.
    - `repartition(n, col)` hashes the column, so every row with the
      same value lands in the same partition.
    - `repartition(col)` with no number uses
      `spark.sql.shuffle.partitions` (200) and marks the exchange
      `REPARTITION_BY_COL`, which AQE may coalesce: here to 1, because
      the data is tiny. A number you give (`REPARTITION_BY_NUM`) is
      kept.
    - `repartitionByRange` samples the data to pick ranges, for sorted
      output.
    - `coalesce(n)` merges neighbouring partitions without a shuffle. It
      can only reduce: `coalesce(10)` on 3 partitions stays 3. And
      because there is no stage boundary, everything upstream runs in
      those `n` tasks too: `coalesce(1)` after an expensive parse runs
      the whole parse on one core. When that hurts, `repartition(1)`
      costs a shuffle but keeps the upstream parallel.

    One detail: `df.rdd.getNumPartitions()` on a DataFrame with a
    shuffle runs the stages before the shuffle to answer, which is how
    it could report AQE's 1 for `repartition('user_id')`. On Spark
    Connect `df.rdd` does not exist at all (`[NOT_IMPLEMENTED] rdd is
    not implemented.`); count distinct `F.spark_partition_id()` values
    instead.

