    ## Reading a FileScan Line

    The `FileScan` line packs most of what you need into one row. The
    `formatted` mode prints the same facts one per line:

    ```python
    user_1.explain("formatted")
    ```

    ```
    == Physical Plan ==
    * Project (3)
    +- * Filter (2)
       +- Scan json  (1)


    (1) Scan json
    Output [3]: [event#0, user_id#2L, amount#4]
    Batched: false
    Location: InMemoryFileIndex [file:/.../data/messy/events]
    PushedFilters: [IsNotNull(user_id), EqualTo(user_id,1)]
    ReadSchema: struct<event:string,user_id:bigint,amount:string>

    (2) Filter [codegen id : 1]
    Input [3]: [event#0, user_id#2L, amount#4]
    Condition : (isnotnull(user_id#2L) AND (user_id#2L = 1))

    (3) Project [codegen id : 1]
    Output [2]: [event#0, amount#4]
    Input [3]: [event#0, user_id#2L, amount#4]
    ```

    | Field | Meaning |
    |-------|---------|
    | `[event#0, user_id#2L, amount#4]` / `ReadSchema` | the columns the scan produces. Everything else was **pruned**: Spark will not build it. |
    | `Location: InMemoryFileIndex` | the list of files, made when you called `load()` |
    | `PartitionFilters` | filters on folder names such as `day=2026-10-02`. They remove whole files before reading. |
    | `PushedFilters` | filters handed to the file reader so it can skip data early. For Parquet that means skipping row groups using their statistics. |
    | `DataFilters` | the filters on data columns, as Spark sees them |
    | `Batched` | whether the reader hands over columnar batches (`true` for Parquet and ORC) |

    Notice that the `Filter` node stays in the plan even
    though the filter was pushed: a pushed filter is a hint the reader
    may use to skip data, and Spark still checks every row it gets back.
    And for JSON, pushing happens while parsing
    (`spark.sql.json.filterPushdown.enabled`, default `true` since 3.1):
    the reader still reads every line of every file, it just stops
    building rows that cannot match. Only formats with statistics, such
    as Parquet, can skip data without reading it.

