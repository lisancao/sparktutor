    ## Adaptive Query Execution, Before and After

    Every plan above starts with `AdaptiveSparkPlan isFinalPlan=false`.
    Adaptive query execution (AQE, on by default since Spark 3.2,
    SPARK-33679; `spark.sql.adaptive.enabled`) runs the plan one shuffle
    stage at a time, looks at the real sizes each stage produced, and
    re-plans the rest. Plans with no shuffle (the Parquet query later in
    this lesson) have no `AdaptiveSparkPlan` at the top at all, because
    there is nothing to adapt.

    Run a query, then print its plan again:

    ```python
    per_type = silver.groupBy("event_type").agg(F.sum("amount").alias("revenue"))
    per_type.collect()
    per_type.explain()
    ```

    ```
    AdaptiveSparkPlan isFinalPlan=true
    +- == Final Plan ==
       ResultQueryStage 1
       +- *(2) HashAggregate(keys=[event_type#9], functions=[sum(amount#12)])
          +- AQEShuffleRead coalesced
             +- ShuffleQueryStage 0
                +- Exchange hashpartitioning(event_type#9, 200), ENSURE_REQUIREMENTS, [plan_id=244]
                   +- *(1) HashAggregate(keys=[event_type#9], functions=[partial_sum(amount#12)])
                      +- ...
    +- == Initial Plan ==
       HashAggregate(keys=[event_type#9], functions=[sum(amount#12)])
       +- Exchange hashpartitioning(event_type#9, 200), ENSURE_REQUIREMENTS, [plan_id=228]
          +- ...
    ```

    - `ShuffleQueryStage 0` is the part before the shuffle, run as its
      own job.
    - `AQEShuffleRead coalesced`: the exchange wrote 200 partitions
      (`spark.sql.shuffle.partitions`), almost all empty, and AQE read
      them back as far fewer.
    - The initial plan is kept underneath for comparison.

    AQE also converts a sort-merge join into a broadcast join when a
    shuffle turns out small. Run the un-hinted `silver.join(prices, ...)`
    and its final plan shows `BroadcastHashJoin` over `AQEShuffleRead
    local` reads. The two shuffles still ran first, though, so the
    hint is cheaper than the rescue.

