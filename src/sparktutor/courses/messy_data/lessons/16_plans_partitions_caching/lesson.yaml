    ## The Optimizer Copies Filters Across a Join

    One more thing joins do in plans: when you filter one side on the
    join key, Spark infers the same filter for the other side. Joining
    the events to a large Parquet table of users, filtered to
    `user_id < 5`, gives a scan of the *events* with

    ```
    DataFilters: [isnull(_corrupt#7), (coalesce(user#3.id, user_id#2L) < 5), ...]
    ```

    even though you only filtered the users. Rows that cannot match are
    dropped before the join. This is constraint propagation, and it is
    one more reason to read the plan instead of guessing.

