    ## Nested Columns: What JSON Can and Cannot Skip

    Filter on a field inside a struct and compare the two formats.
    JSON:

    ```python
    raw.filter(F.col("user.plan") == "pro").select("user.plan").explain()
    ```

    ```
    *(1) Project [user#3.plan AS plan#49]
    +- *(1) Filter (isnotnull(user#3.plan) AND (user#3.plan = pro))
       +- FileScan json [user#3] ... PushedFilters: [],
          ReadSchema: struct<user:struct<id:bigint,plan:string,geo:struct<country:string>>>
    ```

    The same data written to Parquet and read back:

    ```
    FileScan parquet [user#42] ... PushedFilters: [IsNotNull(user.plan), EqualTo(user.plan,pro)],
    ReadSchema: struct<user:struct<plan:string>>
    ```

    JSON builds the whole `user` struct and pushes nothing. Parquet
    reads only the `plan` leaf (nested schema pruning) and pushes the
    filter on it, because it stores every leaf as its own column. For
    messy JSON you query often, this is a strong reason to land it as
    Parquet or Delta ("Landing Messy Data in Delta Lake") once, and query
    that.

