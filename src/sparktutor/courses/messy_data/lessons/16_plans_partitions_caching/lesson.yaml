    ## A Folder per Day: partitionBy

    `write.partitionBy("day")` writes one folder per value, named
    `day=<value>`, and leaves the column out of the files (the folder
    name holds it):

    ```python
    silver.write.partitionBy("day").parquet("/tmp/events_by_day")
    ```

    ```
    events_by_day/_SUCCESS
    events_by_day/day=2026-10-01/part-00002-...c000.snappy.parquet
    events_by_day/day=2026-10-02/part-00001-...c000.snappy.parquet
    events_by_day/day=2026-10-03/part-00000-...c000.snappy.parquet
    ```

    How many files land in each folder? One per **task that holds rows
    for that value**. Counting `.parquet` files per folder for four
    ways of writing the same 60 rows:

    ```
    plain                       {'day=2026-10-01': 1, 'day=2026-10-02': 1, 'day=2026-10-03': 1}
    repartition(4) first        {'day=2026-10-01': 4, 'day=2026-10-02': 4, 'day=2026-10-03': 4}
    repartition("day") first    {'day=2026-10-01': 1, 'day=2026-10-02': 1, 'day=2026-10-03': 1}
    maxRecordsPerFile 8         {'day=2026-10-01': 3, 'day=2026-10-02': 3, 'day=2026-10-03': 3}
    ```

    The plain write happens to give one file per day only because each
    input file holds one day. After `repartition(4)` every task holds
    rows of every day, so files = tasks x days. With 200 tasks and a
    year of days that is 73,000 tiny files. `repartition("day")` before
    the write sends each day to one task. The `maxRecordsPerFile`
    option caps rows per file (20 rows per day here, so 3 files).

    Choose partition columns with few values and that queries filter
    on: a date, a country. Never a user id or a timestamp.

