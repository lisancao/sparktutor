    ## What You'll Learn

    You can now read almost anything: bytes, text, CSV, JSON, VARIANT,
    XML, documents, images, audio, and your own format through a Python
    data source. "Why Spark for Messy Data, and How It Runs Your Code"
    showed you that Spark turns your code into a plan of stages and
    tasks, that an `Exchange` is a shuffle, and that each file becomes
    one or more partitions. This lesson is the toolkit for the next
    question: is Spark doing what I think it is doing, and is it doing
    too much?

    It follows chapter 7 of *Learning Spark* (optimizing and tuning),
    applied to the messy sample files. By the end you will be able to:

    - Read `explain()` in all five modes and say what each line of a
      `FileScan` means (`PushedFilters`, `PartitionFilters`,
      `DataFilters`, `ReadSchema`)
    - Explain why `count()` on the cleaned events fails with
      `QUERY_ONLY_CORRUPT_RECORD_COLUMN`, using column pruning
    - Recognize `HashAggregate`, `BroadcastHashJoin` and
      `SortMergeJoin`, and make Spark broadcast a small table
    - Read an adaptive plan before and after it runs, and know which
      actions update the plan you print
    - Predict how many partitions a file read makes, from
      `spark.sql.files.maxPartitionBytes` and `openCostInBytes`, and
      know which files can never be split
    - Choose between `repartition` and `coalesce`
    - Write a folder-per-day layout with `partitionBy` and prove that a
      query reads only one day
    - Cache the right things, see the cache in the plan, and avoid the
      stale-listing trap

    Everything here is checked through plans and partition counts,
    never through timings: timings on a laptop change from run to run,
    plans do not.

- Class: text
  Depth: beginner
  Output: |
    Think of `explain()` as asking a moving company for the plan before
    they start: which rooms they will empty (the scan), what they will
    leave behind (pruned columns and filtered rows), when everything has
    to go through one hallway (a shuffle), and which small boxes they
    will simply carry to every truck (a broadcast). Reading the plan
    costs nothing, and it catches most expensive mistakes before any
    work is done.

