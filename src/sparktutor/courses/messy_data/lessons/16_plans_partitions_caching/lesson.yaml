    ## Gotcha: Which Actions Update the Plan You Print

    `explain()` after an action shows the final plan only if the action
    ran *this* DataFrame's plan. Many actions run a slightly different
    query built on top of it. Checked on 4.2.0, a fresh `per_type` per
    line, then `"isFinalPlan=true" in` the explain output:

    ```
    count     False
    show      False
    take(1)   False
    collect   True
    toPandas  True
    ```

    `count()` adds an aggregate, `show()` and `take()` add a limit, and
    each of those is a new plan with its own adaptive execution. The
    Spark UI's SQL tab shows every one of them, so use it (or
    `collect()` on a small result) when you want to see what AQE did.

