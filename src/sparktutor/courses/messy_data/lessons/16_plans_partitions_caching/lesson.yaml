    ## Caching

    `cache()` keeps a DataFrame's rows after the first action that
    computes them, so later actions skip the work. It is lazy, and it
    returns the same DataFrame:

    ```python
    events = spark.read.schema(EVENT_SCHEMA).json("data/messy/events")
    print(events.storageLevel, events.is_cached)
    events.cache()
    print(events.storageLevel, events.is_cached)
    events.filter("user_id = 1").explain()
    ```

    ```
    Serialized 1x Replicated False
    Disk Memory Deserialized 1x Replicated True
    == Physical Plan ==
    *(1) Filter (isnotnull(user_id#2L) AND (user_id#2L = 1))
    +- InMemoryTableScan [event#0, event_type#1, user_id#2L, ...], [isnotnull(user_id#2L), (user_id#2L = 1)]
          +- InMemoryRelation [event#0, event_type#1, user_id#2L, ...], StorageLevel(disk, memory, deserialized, 1 replicas)
                +- FileScan json [...] ... PushedFilters: [], ...
    ```

    The plan now reads from `InMemoryTableScan`. The file scan below it
    has no pushed filters any more, because the cache must hold every
    row; the filter is handed to the cache scan instead (the second list
    after `InMemoryTableScan`), which can skip cached batches using
    their min and max values. Until an action runs,
    the cache is empty and the first query fills it while it runs.
    Spark matches caches by plan, not by variable: a new DataFrame
    built the same way (`spark.read.schema(EVENT_SCHEMA).json(...)`
    again, plus more steps) also reads from the cache.

    `cache()` is `persist()` with the default level,
    `MEMORY_AND_DISK_DESER` (the "Optimization & Tuning" lesson of the
    learning_spark course has the full table of levels). Pick another with
    `persist(StorageLevel.DISK_ONLY)` and friends. Surprises:

    - Asking again with a different level does nothing. A second
      `persist(StorageLevel.DISK_ONLY)` on a cached DataFrame logs
      `WARN CacheManager: Asked to cache already cached data.` and the
      level stays `Disk Memory Deserialized`. `unpersist()` first.
    - `CACHE TABLE events` in SQL is **eager**: it fills the cache
      immediately. `CACHE LAZY TABLE events` waits for the first query,
      like `cache()`.

    Release with `df.unpersist()` (or `UNCACHE TABLE`, or
    `spark.catalog.clearCache()` for everything).

