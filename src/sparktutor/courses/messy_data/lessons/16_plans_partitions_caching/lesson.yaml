    ## Five Ways to Explain

    `df.explain(mode)` prints the plan without running anything. The
    modes, from the 4.2.0 error message you get for a wrong one:

    ```
    IllegalArgumentException: Unknown explain mode: bogus. Accepted explain
    modes are 'simple', 'extended', 'codegen', 'cost', 'formatted'.
    ```

    | Mode | Shows |
    |------|-------|
    | `simple` (the default) | the physical plan |
    | `extended` | the parsed, analyzed and optimized logical plans, then the physical plan |
    | `formatted` | a short tree with numbered nodes, then each node's details |
    | `cost` | the optimized logical plan with size estimates (`Statistics(sizeInBytes=...)`) |
    | `codegen` | the Java code Spark generates for each fused stage |

    `extended` is where you see the optimizer at work. A filter and a
    projection on the raw events:

    ```python
    user_1 = raw.filter(F.col("user_id") == 1).select("event", "amount")
    user_1.explain("extended")
    ```

    ```
    == Parsed Logical Plan ==
    'Project ['event, 'amount]
    +- Filter (user_id#2L = cast(1 as bigint))
       +- Relation [event#0,event_type#1,user_id#2L,user#3,amount#4,items#5,ts#6,_corrupt#7] json

    == Analyzed Logical Plan ==
    event: string, amount: string
    Project [event#0, amount#4]
    +- Filter (user_id#2L = cast(1 as bigint))
       +- Relation [event#0,event_type#1,user_id#2L,user#3,amount#4,items#5,ts#6,_corrupt#7] json

    == Optimized Logical Plan ==
    Project [event#0, amount#4]
    +- Filter (isnotnull(user_id#2L) AND (user_id#2L = 1))
       +- Relation [event#0,event_type#1,user_id#2L,user#3,amount#4,items#5,ts#6,_corrupt#7] json

    == Physical Plan ==
    *(1) Project [event#0, amount#4]
    +- *(1) Filter (isnotnull(user_id#2L) AND (user_id#2L = 1))
       +- FileScan json [event#0,user_id#2L,amount#4] Batched: false, DataFilters: [isnotnull(user_id#2L), (user_id#2L = 1)], Format: JSON, Location: InMemoryFileIndex(1 paths)[file:/.../data/messy/events], PartitionFilters: [], PushedFilters: [IsNotNull(user_id), EqualTo(user_id,1)], ReadSchema: struct<event:string,user_id:bigint,amount:string>
    ```

    (Paths are shortened here and below.) Reading top to bottom:

    - **Parsed**: what you wrote. The quote in `'Project ['event` means
      "not resolved yet": Spark has not checked that the columns exist.
    - **Analyzed**: columns resolved to ids (`event#0`), types known,
      and the literal `1` cast to `bigint` to match `user_id`.
    - **Optimized**: the optimizer simplified the cast away and added
      `isnotnull(user_id)`, which lets sources skip NULLs cheaply.
    - **Physical**: what will run. The relation became a `FileScan`
      that reads only three columns.

