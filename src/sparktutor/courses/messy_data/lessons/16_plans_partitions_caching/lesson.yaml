  Output: |
    ## When Caching Helps, and When It Hurts

    Cache when the same expensive result feeds several actions: a parsed
    and cleaned DataFrame that you split into a good table and a
    quarantine table, explore interactively, or loop over. "JSON Drift
    and Quarantine" also uses caching to make the corrupt record column
    queryable.

    Do not cache:

    - something used once (filling the cache costs more than it saves)
    - a raw read you filter heavily afterwards (cache the filtered
      result instead)
    - more than fits: partitions that do not fit in memory go to disk
      (with the default level) or are recomputed, and cached data
      competes with joins and aggregations for the same memory

    And one trap that matters more for messy data than any memory
    setting: **a DataFrame keeps the file list it made at `load()`**,
    cached or not.

    ```python
    df = spark.read.schema(EVENT_SCHEMA).json(inbox)   # inbox holds day 1
    shutil.copy("data/messy/events/events_2026-10-02.json", inbox)
    print(df.count())                                       # still day 1 only
    print(spark.read.schema(EVENT_SCHEMA).json(inbox).count())
    ```

    ```
    20
    40
    ```

    The new file is invisible to `df` even though no action had run
    before it arrived: listing happens when the DataFrame is created.
    Delete a listed file instead and the next action fails with
    `[FAILED_READ_FILE.FILE_NOT_EXIST] Encountered error while reading
    file ... File does not exist. It is possible the underlying files
    have been updated.` For folders that change, read again (or use a
    stream, next lesson); `spark.catalog.refreshByPath(path)` refreshes
    cached data and tables over that path, but did not change what this
    `df` saw.

