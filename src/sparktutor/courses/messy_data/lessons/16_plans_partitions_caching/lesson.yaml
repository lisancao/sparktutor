    ## Column Pruning, and Why count() Fails on the Cleaned Events

    "JSON Drift and Quarantine" warned that a query touching only the
    corrupt record column fails. Here is the same error from a query
    that does not mention the corrupt column at all:

    ```python
    silver.count()
    ```

    ```
    AnalysisException: [UNSUPPORTED_FEATURE.QUERY_ONLY_CORRUPT_RECORD_COLUMN] The feature
    is not supported: Queries from raw JSON/CSV/XML files are disallowed when the
    referenced columns only include the internal corrupt record column ...
    ```

    The plan explains it. `count()` is a `groupBy().count()`, so look at
    that plan:

    ```python
    silver.groupBy().count().explain()
    ```

    ```
    == Physical Plan ==
    AdaptiveSparkPlan isFinalPlan=false
    +- HashAggregate(keys=[], functions=[count(1)])
       +- Exchange SinglePartition, ENSURE_REQUIREMENTS, [plan_id=66]
          +- HashAggregate(keys=[], functions=[partial_count(1)])
             +- Project
                +- Filter isnull(_corrupt#7)
                   +- FileScan json [_corrupt#7] ... ReadSchema: struct<_corrupt:string>
    ```

    Counting needs none of the selected columns, so the optimizer pruned
    them all. The only column left is the one in the filter,
    `_corrupt`, and that is exactly the query Spark refuses (the corrupt
    column is filled only while the other columns are parsed). Pruning
    is usually a pure win; here it changed which query reached the
    reader.

    Anything that keeps a real column in the scan avoids it, for
    example `silver.filter(F.col("ts").isNotNull()).count()` (60 rows),
    and so does caching (`raw.cache()` before the filter), because a
    cached DataFrame is parsed once with every column.

