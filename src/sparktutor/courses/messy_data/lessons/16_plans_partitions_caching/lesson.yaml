    ## The Storage and SQL Tabs

    "Why Spark for Messy Data, and How It Runs Your Code" showed how to
    keep a session open to look at the UI. The tabs that matter here:

    - **Storage** lists every cached dataset with its storage level, the
      fraction of partitions cached and the size in memory and on disk.
      A DataFrame cached with `cache()` is listed under its plan text;
      `CACHE TABLE events` shows up as `In-memory table events`. Less
      than 100% cached means partitions did not fit.
    - **SQL / DataFrame** has one entry per query with the plan AQE
      finally ran and per-node metrics: on a file scan, **number of
      files read**, **size of files read** and **number of output
      rows**; on an exchange, the shuffle sizes. This is where you prove
      pruning worked and see which of `count()`, `show()` and
      `collect()` ran which plan.

    From code, `spark.sparkContext._jsc.sc().getRDDStorageInfo()`
    (classic only) lists the same cached blocks; the exercise uses it to
    check that the cache really filled.

