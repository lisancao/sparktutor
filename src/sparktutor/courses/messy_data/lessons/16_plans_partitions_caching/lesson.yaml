    ## Aggregations and Joins in a Plan

    "Why Spark for Messy Data, and How It Runs Your Code" walked through
    `HashAggregate (partial)`, `Exchange`, `HashAggregate (final)`.
    Joins add two more shapes. Enrich each event with the price of its
    plan, from a two-row table:

    ```python
    prices = spark.createDataFrame([("free", 0.0), ("pro", 9.99)], "plan string, monthly double")
    silver.join(prices, "plan", "left").explain()
    ```

    ```
    AdaptiveSparkPlan isFinalPlan=false
    +- Project [...]
       +- SortMergeJoin [plan#11], [plan#50], LeftOuter
          :- Sort [plan#11 ASC NULLS FIRST], false, 0
          :  +- Exchange hashpartitioning(plan#11, 200), ENSURE_REQUIREMENTS, [plan_id=149]
          :     +- Project [...]
          :        +- Filter isnull(_corrupt#7)
          :           +- FileScan json [...]
          +- Sort [plan#50 ASC NULLS FIRST], false, 0
             +- Exchange hashpartitioning(plan#50, 200), ENSURE_REQUIREMENTS, [plan_id=150]
                +- Filter isnotnull(plan#50)
                   +- Scan ExistingRDD[plan#50,monthly#51]
    ```

    A **sort-merge join** shuffles both sides by the key, sorts them,
    and walks them together: two shuffles and two sorts for a lookup in
    a two-row table. Spark chose it because it could not tell how big
    `prices` is. A DataFrame made from a Python list shows up as
    `Scan ExistingRDD`, which has no size statistics, so Spark assumes
    it is huge. Tell it:

    ```python
    silver.join(F.broadcast(prices), "plan", "left").explain()
    ```

    ```
    AdaptiveSparkPlan isFinalPlan=false
    +- Project [...]
       +- BroadcastHashJoin [plan#11], [plan#50], LeftOuter, BuildRight, false, false
          :- Project [...]
          :  +- Filter isnull(_corrupt#7)
          :     +- FileScan json [...]
          +- BroadcastExchange HashedRelationBroadcastMode(List(input[0, string, false]),false), [plan_id=179]
             +- Filter isnotnull(plan#50)
                +- Scan ExistingRDD[plan#50,monthly#51]
    ```

    A **broadcast hash join** sends the small side (`BuildRight`: the
    right side is the one built into a hash table) to every task, and
    the big side never moves. No `Exchange hashpartitioning`, no
    `Sort`.

    Spark broadcasts on its own when it knows a side is below
    `spark.sql.autoBroadcastJoinThreshold` (default `10MB`; `-1` turns
    automatic broadcasting off). For a left join only the right side can
    be broadcast, since every left row must be kept. Broadcast only what
    really is small: the whole table is copied to every executor.

