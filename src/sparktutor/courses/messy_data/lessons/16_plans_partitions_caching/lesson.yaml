    ## Summary

    In this lesson you learned:

    - **`explain()` modes**: `simple`, `extended` (parsed, analyzed,
      optimized, physical), `formatted`, `cost`, `codegen`
    - **The FileScan line**: pruned columns and `ReadSchema`,
      `PartitionFilters` (skip files), `PushedFilters` (let the reader
      skip data; Spark still filters every row), `DataFilters`
    - **Column pruning** explains `count()` failing with
      `QUERY_ONLY_CORRUPT_RECORD_COLUMN`; JSON does not prune or push
      into nested fields, Parquet does
    - **Joins**: sort-merge (two shuffles) versus broadcast hash
      (none); local DataFrames have no size estimate, so hint
      `F.broadcast` for small lookups
    - **AQE** (on since 3.2): coalesced shuffle reads, runtime broadcast,
      skew splitting; `collect()` and `toPandas()` update the plan you
      print, `count()`, `show()` and `take()` do not
    - **File partitions**: `max_split = min(maxPartitionBytes,
      max(openCostInBytes, total / minPartitionNum))`, small files
      packed, big splittable files cut, gzip, `multiLine`, `wholetext`
      and `binaryFile` never split
    - **`repartition` shuffles, `coalesce` does not** (and drags
      upstream work into its tasks)
    - **`partitionBy`**: files per folder = tasks holding the value;
      pruning only on the partition column; inferred folder types can
      eat leading zeros
    - **Caching** is lazy, matched by plan, ignored when asked twice;
      `CACHE TABLE` is eager; and a DataFrame never sees files that
      arrive after `load()`

    Next: **Streaming Files: Your First Structured Streaming Job**,
    where a query keeps watching that folder and reads each new file
    exactly once.
