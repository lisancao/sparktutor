    ## Files That Never Split

    The last four rows of that table are one partition whatever the
    settings, because those formats cannot start reading in the middle
    of a file:

    - **gzip** (and other non-splittable compression): the only way to
      reach byte 1,000,000 of the text is to decompress everything
      before it. A single 10 GB `.json.gz` is one task, on one core,
      however big the cluster. Spark splits a compressed file only if
      its Hadoop codec implements `SplittableCompressionCodec` (the
      check is in `FileFormat.scala`). bzip2 does: the same JSON Lines
      as a 9 KB `.json.bz2` read with a 2 KB split size gave 5
      partitions and all 400,000 rows. gzip does not.
    - **`multiLine` JSON** (and CSV): one record may span lines, so a
      reader starting mid-file cannot find the next record boundary.
    - **`wholetext`** and **`binaryFile`**: one row per file by
      definition ("Files as Files: binaryFile, Globs and Metadata").

    For messy inputs that means: many small files are packed together
    (cheap), big splittable files are cut up (good), and big
    non-splittable files are a bottleneck you can only fix upstream (ask
    for smaller files, or for a splittable format) or by rewriting them
    once into Parquet.

