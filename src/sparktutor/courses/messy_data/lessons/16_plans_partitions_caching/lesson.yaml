    ## AQE Settings Worth Knowing

    All of these are SQL settings you can change with `spark.conf.set`
    (defaults from the 4.2.0 source):

    | Setting | Default | Effect |
    |---------|---------|--------|
    | `spark.sql.adaptive.enabled` | `true` | AQE on or off |
    | `spark.sql.adaptive.coalescePartitions.enabled` | `true` | merge small shuffle partitions |
    | `spark.sql.adaptive.advisoryPartitionSizeInBytes` | `64MB` | target size when merging or splitting |
    | `spark.sql.adaptive.coalescePartitions.parallelismFirst` | `true` | ignore the target size and keep enough partitions to use every core |
    | `spark.sql.adaptive.skewJoin.enabled` | `true` | split skewed partitions in sort-merge joins |
    | `spark.sql.adaptive.skewJoin.skewedPartitionFactor` | `5.0` | skewed means this many times the median size... |
    | `spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes` | `256MB` | ...and bigger than this |
    | `spark.sql.adaptive.autoBroadcastJoinThreshold` | (falls back to `spark.sql.autoBroadcastJoinThreshold`) | broadcast limit used at runtime |

    Skew is common in messy data: one bot, one tenant or one "unknown"
    key holds most rows. To watch the skew join work on a laptop, shrink
    the thresholds and join 400,000 rows, three quarters of them on key
    `0`, to a 100-row table:

    ```python
    spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "-1")
    spark.conf.set("spark.sql.adaptive.advisoryPartitionSizeInBytes", "64KB")
    spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes", "256KB")

    skewed = spark.range(0, 400_000).select(
        F.when(F.col("id") < 300_000, 0).otherwise(F.col("id") % 100).alias("k"),
        F.col("id").alias("v"))
    dim = spark.range(0, 100).select(F.col("id").alias("k"), F.col("id").cast("string").alias("name"))
    s = skewed.join(dim, "k")
    s.toArrow()      # an action that runs s's own plan
    s.explain()
    ```

    ```
    AdaptiveSparkPlan isFinalPlan=true
    +- == Final Plan ==
       ResultQueryStage 2
       +- *(5) Project [k#25L, v#26L, name#29]
          +- *(5) SortMergeJoin(skew=true) [k#25L], [k#28L], Inner
             :- *(3) Sort [k#25L ASC NULLS FIRST], false, 0
             :  +- AQEShuffleRead coalesced and skewed
             ...
             +- *(4) Sort [k#28L ASC NULLS FIRST], false, 0
                +- AQEShuffleRead coalesced
    ```

    `SortMergeJoin(skew=true)` and `AQEShuffleRead coalesced and skewed`
    say the big partition for key `0` was split into several tasks, each
    joined against a copy of the matching rows from the other side.
    Unset the three settings afterwards (`spark.conf.unset(...)`).

