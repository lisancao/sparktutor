    ## Partition Pruning: Reading One Day

    Read the layout back and filter on the partition column:

    ```python
    back = spark.read.parquet("/tmp/events_by_day")
    q = back.filter((F.col("day") == "2026-10-02") & (F.col("amount") > 20)).select("user_id", "amount")
    q.explain()
    ```

    ```
    == Physical Plan ==
    *(1) Project [user_id#26L, amount#29]
    +- *(1) Filter (isnotnull(amount#29) AND (amount#29 > 20.0))
       +- *(1) ColumnarToRow
          +- FileScan parquet [user_id#26L,amount#29,day#31] Batched: true, DataFilters: [isnotnull(amount#29), (amount#29 > 20.0)], Format: Parquet, Location: InMemoryFileIndex(1 paths)[file:/tmp/events_by_day], PartitionFilters: [isnotnull(day#31), (day#31 = 2026-10-02)], PushedFilters: [IsNotNull(amount), GreaterThan(amount,20.0)], ReadSchema: struct<user_id:bigint,amount:double>
    ```

    Both kinds of skipping are in one line: `PartitionFilters` drop the other
    days' folders before any file is opened, and `PushedFilters` let
    the Parquet reader skip row groups whose statistics rule out
    `amount > 20`. After running it, the Spark UI's SQL tab shows
    **number of files read: 1** on the scan node (the metric is called
    `numFiles` in the source). The exercise reads the same metric.

    Pruning only works on the partition column itself. A filter that
    means the same thing but goes through another column does not prune:

    | Filter | PartitionFilters |
    |--------|------------------|
    | `F.col("day") == "2026-10-02"` | `[isnotnull(day), (day = 2026-10-02)]` |
    | `F.col("day") >= "2026-10-02"` | `[isnotnull(day), (day >= 2026-10-02)]` |
    | `F.to_date("ts") == "2026-10-02"` | `[]` (pushed as a `ts` range instead; all files opened) |

