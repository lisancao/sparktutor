    ## How Many Partitions Does a File Read Make?

    Each partition of a file read is one task. Spark decides the count
    when it plans the scan, in `FilePartition.maxSplitBytes` and
    `getFilePartitions` (Spark source,
    `sql/core/.../datasources/FilePartition.scala`). The rule:

    1. Every file costs its size **plus `openCostInBytes`** (default
       `4MB`, an internal setting that stands for the time it takes to
       open a file). Add those up: `total`.
    2. `bytes_per_core = total / minPartitionNum`, where
       `spark.sql.files.minPartitionNum` defaults to the default
       parallelism (the number of cores in local mode).
    3. `max_split = min(maxPartitionBytes, max(openCostInBytes,
       bytes_per_core))`, with `spark.sql.files.maxPartitionBytes`
       defaulting to `128MB`.
    4. Files that can be split are cut into pieces of at most
       `max_split` bytes.
    5. Pieces are sorted largest first and packed in order: a new
       partition starts when the current one plus the next piece would
       exceed `max_split`. Each piece adds its size plus
       `openCostInBytes` to the partition.

    Measured with `df.rdd.getNumPartitions()` on `local[4]`:

    | Input | Partitions |
    |-------|------------|
    | `data/messy/logs` (2 small files) | 2 |
    | `data/messy/events` (3 small files) | 3 |
    | every file under `data/messy` (`recursiveFileLookup`; the folder grows as the course adds data) | about one per 32 files, since each small file counts as 4 MB |
    | 200 one-line JSON files | 7 |
    | the same, with `openCostInBytes` set to `1` | 5 |
    | one 30.8 MB JSON Lines file | 4 |
    | the same, `maxPartitionBytes` `4MB` | 8 |
    | the same, `maxPartitionBytes` `1MB` | 30 |
    | the same file gzipped (104 KB), `1MB` | 1 |
    | the same file with `multiLine` true, `1MB` | 1 |
    | the same file with `wholetext=True`, `1MB` | 1 |
    | the same file with `binaryFile`, `1MB` | 1 |

    Work two of them through the rule. The 200 tiny files: each counts
    as about 4 MB, so `total` is about 800 MB, `bytes_per_core` about
    200 MB, `max_split = min(128MB, 200MB) = 128MB`, and 32 files fit
    in each partition: 7 partitions. The 30.8 MB file with the default
    settings: `total` is 34.8 MB, `bytes_per_core` 8.7 MB, so
    `max_split` is 8.7 MB and the file is cut into 4 pieces. Spark made
    the file read smaller than 128 MB on purpose, to keep all 4 cores
    busy.

