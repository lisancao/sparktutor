    ## When a Custom Writer Makes Sense

    Spark already writes Parquet, JSON, CSV, ORC, text and (through
    connectors) Delta, Iceberg and JDBC tables. Use those whenever they
    fit; they are faster and better tested than anything you will write
    in an afternoon.

    A Python writer earns its place when the destination is something
    Spark does not know about:

    - A service with an HTTP API (a ticket system, a vector store, a
      search index) that takes batches of records
    - A file layout another tool expects, such as one JSON file per
      document plus an index file
    - A side effect per batch: a manifest, a notification, a row in an
      audit table

    The API is the same in each case. What changes is the code inside
    `write()`.

