    Think of a write as a group project with a coordinator. The
    coordinator (the driver) hands each person (a task) a stack of rows.
    Each person does their part and hands back a slip of paper saying
    what they did (the commit message). Only when every slip is in does
    the coordinator announce the result (`commit`). If anyone drops out,
    the coordinator calls the whole thing off (`abort`) and has to tidy
    up whatever was already done.

