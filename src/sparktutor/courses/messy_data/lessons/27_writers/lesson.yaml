    ## When a Task Fails: abort()

    If any task fails, Spark cancels the others and calls
    `abort(messages)` on the driver instead of `commit()`. The list has
    one entry per task, and the entry is `None` for every task that did
    not finish successfully, including the ones Spark cancelled.

    Here is what happened when one task raised an error in the middle of
    a three-task write that wrote straight into the output folder:

    - `abort()` received `[None, None, None]`
    - the folder still held three half-written `part-*.jsonl` files

    So the messages cannot tell `abort()` what to clean up. Two habits
    fix this:

    1. **Stage, then publish.** Tasks write into a staging folder, and
       only `commit()` moves files to where readers look.
    2. **A job id created on the driver.** Generate it in the writer's
       `__init__`. Spark pickles that writer object for every task, so
       the tasks, `commit()` and `abort()` all see the same id, and
       `abort()` can delete `_staging/<job id>` without knowing which
       tasks got how far.

    ```python
    class JsonLogWriter(DataSourceWriter):
        def __init__(self, options, overwrite):
            self.root = options["path"]
            self.overwrite = overwrite
            self.job = uuid.uuid4().hex[:8]          # same value in every task
            self.staging = os.path.join(self.root, "_staging", self.job)

        def abort(self, messages):
            shutil.rmtree(self.staging, ignore_errors=True)
    ```

    Folder and file names that start with `_` or `.` are hidden from
    Spark's file readers, so `spark.read.json(root)` never sees
    `_staging/` or `_MANIFEST.json`.

