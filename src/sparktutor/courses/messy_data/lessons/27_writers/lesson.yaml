    ## Exercise: A Committed JSON Lines Table

    The starter parses `data/messy/logs/access.log` into 200 requests
    (`ip`, `path`, `status`, `bytes`) spread over 3 tasks, and gives you
    `read_manifest`, `write_manifest` and the `FileWritten` commit
    message. Complete the writers:

    1. `JsonLogWriter.write(rows)`: write the task's rows as JSON lines
       into `self.staging` and return `FileWritten(name, count)`.
    2. `JsonLogWriter.commit(messages)`: move the staged files into the
       table folder, write the new manifest (append adds to the old
       file list and row count, overwrite replaces them), delete the
       old manifest's files on overwrite, and remove the staging
       folder.
    3. `JsonLogWriter.abort(messages)`: delete the staging folder.
    4. `ArrowParquetWriter.write(batches)`: write the task's Arrow
       batches as one Parquet file.

    The harness appends twice (400 rows), overwrites (back to 200 rows
    and 3 files), runs a write that fails on purpose and checks that the
    table did not change, checks that the default save mode is refused,
    and reads the Arrow writer's Parquet back with Spark.
