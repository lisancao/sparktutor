    ## Publishing in One Step: a Manifest

    Moving files one by one in `commit()` still leaves a moment where a
    reader could see some new files and not others. Table formats solve
    this with a **manifest**: a single file that lists exactly which
    data files make up the table. Readers trust the manifest, not the
    folder listing, and a write becomes visible the moment the new
    manifest replaces the old one.

    Replacing a file in one step on a local disk is `os.replace`:
    write the new manifest to a temporary name in the same folder, then
    rename it over the old one.

    ```python
    def write_manifest(root, manifest):
        tmp = os.path.join(root, f".{MANIFEST}.{uuid.uuid4().hex}")
        with open(tmp, "w") as f:
            json.dump(manifest, f, indent=1)
        os.replace(tmp, os.path.join(root, MANIFEST))
    ```

    The order inside `commit()` matters:

    1. Move the staged files into the folder (readers still use the old
       manifest, so nobody sees them yet).
    2. Write the new manifest (now they are visible).
    3. Only then, on overwrite, delete the files the old manifest
       listed.
    4. Remove the staging folder.

    If the driver dies between steps, you end up with extra files that
    no manifest mentions, which is untidy but harmless. Deleting first
    would risk a table with no data.

    This is a toy. It has no protection against two jobs committing at
    the same time (the second manifest silently wins), and on object
    stores such as S3 a rename is a copy, not an atomic step. Delta Lake
    and Apache Iceberg exist to solve exactly these problems; the
    exercise is here so you know what they are doing for you.

