    ## What You'll Learn

    Every data source so far in this course has been a reader. Spark can
    also hand rows to your Python code to write them somewhere: a custom
    file layout, an API that accepts uploads, a search index, a registry
    of what was ingested. The writer half of the Python Data Source API
    has been in Spark since 4.0 (SPARK-44076), and it has a small but
    strict contract that decides whether a failed job leaves garbage
    behind.

    By the end of this lesson you will be able to:

    - Explain who runs what: `writer()` and `commit()` on the driver,
      `write()` once per task on the executors
    - Return commit messages from tasks and use them in `commit()`
    - Use the two save modes a Python writer accepts (`append` and
      `overwrite`) and know what `overwrite` does *not* do for you
    - Clean up after a failed job in `abort()`, using a staging folder
      and a job id shared by the driver and the tasks
    - Publish a write in one step with a manifest file
    - Write Arrow record batches with `DataSourceArrowWriter` (4.0)

    You need the reader basics from "Your First Python Data Source". The
    exercise writes the web server log from "Text and Logs" into a tiny
    file format of your own, with a manifest that says which files
    belong to the table.

