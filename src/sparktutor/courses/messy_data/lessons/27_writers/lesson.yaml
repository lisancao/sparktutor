    ## Writer Gotchas Worth Knowing

    - **No `writer()`, no write.** A source with only a reader fails at
      `.save()` with `PYTHON_DATA_SOURCE_ERROR` ("Failed to initialize
      Python data source writer") wrapping `[NOT_IMPLEMENTED] writer is
      not implemented.`
    - **Errors in `write()`** fail the task as `PYTHON_EXCEPTION`, with
      your Python traceback inside. Errors in `commit()` or `abort()`
      surface on the driver as `PYTHON_DATA_SOURCE_ERROR` ("Failed to
      commit or abort Python data source write").
    - **File count equals task count.** Every partition becomes a task
      and every task calls `write()`, even one with no rows. Use
      `repartition(n)` or `coalesce(n)` before writing to control how
      many files you produce.
    - **The writer object is shared state only at the start.** Each
      task gets its own unpickled copy, so changing `self.something` in
      `write()` is invisible to other tasks and to `commit()`. Anything
      the driver needs must travel in the commit message.
    - **Imports inside `write()`.** Import libraries such as `pyarrow`
      and `TaskContext` inside the method, as with readers, so the code
      runs wherever the task lands.

