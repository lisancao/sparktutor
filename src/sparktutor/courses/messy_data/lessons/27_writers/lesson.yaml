    ## Arrow Writers (4.0)

    A plain `DataSourceWriter` receives `Row` objects. Spark ships the
    data to the Python worker as Arrow batches anyway, and then builds a
    Python `Row` for every record, which is slow for large writes.
    `DataSourceArrowWriter` (4.0, SPARK-50471) skips that step: its
    `write()` receives an iterator of `pyarrow.RecordBatch`.

    ```python
    class ArrowParquetWriter(DataSourceArrowWriter):
        def __init__(self, options):
            self.root = options["path"]

        def write(self, batches):
            import pyarrow as pa
            import pyarrow.parquet as pq
            from pyspark import TaskContext

            batches = list(batches)
            rows = sum(b.num_rows for b in batches)
            if not batches:
                return FileWritten(None, 0)
            os.makedirs(self.root, exist_ok=True)
            name = f"part-{TaskContext.get().partitionId():05d}.parquet"
            pq.write_table(pa.Table.from_batches(batches), os.path.join(self.root, name))
            return FileWritten(name, rows)
    ```

    Everything else (`commit`, `abort`, commit messages, save modes) is
    the same as for a row writer; `DataSourceArrowWriter` is a subclass
    of `DataSourceWriter`. Use it when the destination speaks Arrow or
    columnar data (Parquet, an Arrow Flight server, pandas), or when you
    write many rows.

    Batch size follows `spark.sql.execution.arrow.maxRecordsPerBatch`
    (default 10000). With it set to 50, a task holding 67 rows received
    two batches of 50 and 17 rows. Batches keep Spark's types:
    an `int` column arrives as Arrow `int32`, a `long` as `int64`.

