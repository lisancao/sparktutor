    ## Save Modes: Only Append and Overwrite

    A Python writer accepts two save modes. Spark's default mode for
    `DataFrameWriter` is `errorifexists`, so a write without `.mode(...)`
    fails before any task runs:

    ```text
    [UNSUPPORTED_DATA_SOURCE_SAVE_MODE] The data source "countingsink"
    cannot be written in the "ErrorIfExists" mode. Please use either the
    "Append" or "Overwrite" mode instead. SQLSTATE: 0A000
    ```

    `mode("error")` and `mode("ignore")` fail the same way. Always write
    `.mode("append")` or `.mode("overwrite")`.

    `overwrite` reaches your code only as the boolean `overwrite`
    argument of `writer(schema, overwrite)`. **Spark deletes nothing.**
    If your writer ignores the flag, an overwrite behaves exactly like
    an append. Deciding what "replace the old data" means (delete the
    old files, truncate a remote table, start a new index version) is
    your job, and the safest place to do it is `commit()`, after the
    new data is complete.

    Two details about options:

    - `.save(path)` puts the path into the options as `path`, so
      `.save("/tmp/x")` and `.option("path", "/tmp/x").save()` are the
      same to your writer.
    - Options are case-insensitive: `.option("Path", ...)` and
      `.option("path", ...)` reach you as the same key, stored in
      lower case.

