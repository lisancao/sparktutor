    ## The Write Path: Who Runs What

    A write is one Spark job. It has three kinds of steps, and they run
    in different places:

    | Step | Runs | How many times |
    |---|---|---|
    | `DataSource.writer(schema, overwrite)` | driver side, in a Python worker | once |
    | `DataSourceWriter.write(rows)` | executors | once per task (one task per partition of the DataFrame) |
    | `DataSourceWriter.commit(messages)` | driver side, in a Python worker | once, if every task succeeded |
    | `DataSourceWriter.abort(messages)` | driver side, in a Python worker | once, if any task failed |

    "Driver side" means a Python worker next to the driver, not your
    script's process (as in "Your First Python Data Source"): `commit()`
    cannot see your script's variables, and its `print` output does not
    reach your console.

    Spark creates the writer on the driver, pickles it, and sends a copy
    to every task. Each task calls `write()` with an iterator over its
    rows and returns a **commit message**. Spark collects the messages
    from all tasks and passes them, in task order, to `commit()`.

    Here is the smallest useful writer. It writes one text file per task
    and, in `commit()`, records how many rows each task wrote:

    ```python
    import json
    import os
    from pyspark.sql.datasource import DataSource, DataSourceWriter, WriterCommitMessage

    class RowCount(WriterCommitMessage):
        def __init__(self, task, rows):
            self.task, self.rows = task, rows

    class CountingSink(DataSource):
        @classmethod
        def name(cls):
            return "countingsink"

        def writer(self, schema, overwrite):
            return CountingWriter(self.options["path"])

    class CountingWriter(DataSourceWriter):
        def __init__(self, path):              # on the driver
            self.path = path

        def write(self, rows):                 # once per task, on an executor
            from pyspark import TaskContext
            task = TaskContext.get().partitionId()
            os.makedirs(self.path, exist_ok=True)
            n = 0
            with open(os.path.join(self.path, f"part-{task}.txt"), "w") as f:
                for row in rows:
                    f.write(f"{row.id}\n")
                    n += 1
            return RowCount(task, n)

        def commit(self, messages):            # once, on the driver
            with open(os.path.join(self.path, "_COMMITTED"), "w") as f:
                json.dump({m.task: m.rows for m in messages}, f)

    spark.dataSource.register(CountingSink)
    spark.range(10).repartition(3).write.format("countingsink").mode("append").save("/tmp/counting")
    print(open("/tmp/counting/_COMMITTED").read())
    ```

    The folder ends up with `part-0.txt`, `part-1.txt`, `part-2.txt` and
    `_COMMITTED`, which maps each of the three tasks to its row count
    (the counts add up to 10).

    A source that only writes does not need `schema()` or `reader()`.
    The `schema` argument of `writer()` is the schema of the DataFrame
    being written, so you can validate it before any task starts.

- Class: text
