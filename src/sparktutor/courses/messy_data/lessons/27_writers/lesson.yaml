    ## Summary

    - A Python writer (4.0) has three parts: `writer()` and `commit()`
      on the driver, and `write()` once per task on the executors.
    - `write()` must return a `WriterCommitMessage`; anything else fails
      with `DATA_SOURCE_TYPE_MISMATCH`. Keep messages small.
    - Only `append` and `overwrite` are accepted; the default
      `errorifexists` fails with `UNSUPPORTED_DATA_SOURCE_SAVE_MODE`.
      Overwrite is a flag, and deleting old data is your code's job.
    - `abort()` gets `None` for every failed or cancelled task, so stage
      files under a job id created in the writer's `__init__` and
      delete the staging folder in `abort()`.
    - A manifest replaced with one rename publishes a write in one step;
      real table formats add conflict detection on top.
    - `DataSourceArrowWriter` (4.0) receives `pyarrow.RecordBatch`
      objects instead of rows.

    Next: **Streaming Readers and Writers**, where offsets, checkpoints and
    a batch id turn these ideas into an incremental pipeline.
