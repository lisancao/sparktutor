    ## Commit Messages

    `write()` must return an instance of `WriterCommitMessage` (or a
    subclass). Forget the `return`, and every task fails with:

    ```text
    [DATA_SOURCE_TYPE_MISMATCH] Expected 'WriterCommitMessage' as the
    return type of the `write` method, but got NoneType.
    ```

    The same error appears if you return a plain object that does not
    inherit from `WriterCommitMessage`. The message travels from the
    executor back to the driver by pickling, so keep it small and
    picklable: file names, row counts, byte counts, an upload id. Never
    put the rows themselves in it; the driver would have to hold the
    whole dataset in memory.

    The messages are the only thing the driver learns about what the
    tasks did. Design them around what `commit()` needs to publish the
    result.

