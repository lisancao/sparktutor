  Output: |
    ## Timestamps and Time Zones

    "Schemas for Data You Don't Control" explained `TIMESTAMP` (an
    instant) versus `TIMESTAMP_NTZ` (a wall-clock reading), and that
    `collect()` hands you Python datetimes in your machine's zone. For
    parsing, the rule to remember is: text **with** an offset
    (`2026-03-04T09:30:00-05:00`) names an instant by itself; text
    **without** one (`2026-03-04 09:30`) is read in the session time
    zone. Formatting with `date_format(ts, '... XXX')` shows the zone:

    ```python
    q = """SELECT date_format(try_to_timestamp('2026-03-04 09:30'), 'yyyy-MM-dd HH:mm XXX') AS no_offset,
      date_format(try_to_timestamp('2026-03-04T09:30:00-05:00'), 'yyyy-MM-dd HH:mm XXX') AS with_offset"""
    spark.sql(q).show(truncate=False)                       # session time zone UTC
    spark.conf.set("spark.sql.session.timeZone", "America/Toronto")
    spark.sql(q).show(truncate=False)
    spark.conf.set("spark.sql.session.timeZone", "UTC")    # back to UTC
    ```

    ```
    +------------------+------------------+
    |no_offset         |with_offset       |
    +------------------+------------------+
    |2026-03-04 09:30 Z|2026-03-04 14:30 Z|
    +------------------+------------------+

    +-----------------------+-----------------------+
    |no_offset              |with_offset            |
    +-----------------------+-----------------------+
    |2026-03-04 09:30 -05:00|2026-03-04 09:30 -05:00|
    +-----------------------+-----------------------+
    ```

    The text without an offset became a **different instant** when the
    session zone changed; the text with one did not. When a source
    writes local times without an offset, set the session time zone to
    that source's zone while parsing (or parse into `TIMESTAMP_NTZ` with
    `to_timestamp_ntz` and convert later), and know which of your
    sources carry an offset. Epoch numbers are a third format:
    `timestamp_seconds(1772616600)` is `2026-03-04 09:30:00` UTC.

