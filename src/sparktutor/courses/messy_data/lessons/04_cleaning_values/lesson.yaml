    ## Dates in Many Formats

    `try_to_date(col)` without a format accepts ISO dates
    (`2025-03-04`, also `2025-03-09T14:30:00`). With a format it accepts
    exactly that format. When a column mixes formats, try each in turn
    and keep the first that parses, with `coalesce` (which returns its
    first non-NULL argument):

    ```python
    DATE_PATTERNS = ["yyyy/MM/dd", "dd/MM/yyyy", "d MMM yyyy", "MMMM d, yyyy", "yyyyMMdd"]

    def parse_date(c):
        return F.coalesce(F.try_to_date(c), *[F.try_to_date(c, p) for p in DATE_PATTERNS])

    dates = spark.createDataFrame([(v,) for v in ["2025-03-04", "2025/03/05", "05/03/2025",
        "4 Mar 2025", "March 4, 2025", "20250306", "2025-03-09T14:30:00", "2025-02-30", "unknown"]],
        "s STRING")
    dates.select("s", F.try_to_date("s").alias("default_only"),
                 parse_date(F.col("s")).alias("parsed")).show(truncate=False)
    ```

    ```
    +-------------------+------------+----------+
    |s                  |default_only|parsed    |
    +-------------------+------------+----------+
    |2025-03-04         |2025-03-04  |2025-03-04|
    |2025/03/05         |NULL        |2025-03-05|
    |05/03/2025         |NULL        |2025-03-05|
    |4 Mar 2025         |NULL        |2025-03-04|
    |March 4, 2025      |NULL        |2025-03-04|
    |20250306           |NULL        |2025-03-06|
    |2025-03-09T14:30:00|2025-03-09  |2025-03-09|
    |2025-02-30         |NULL        |NULL      |
    |unknown            |NULL        |NULL      |
    +-------------------+------------+----------+
    ```

    `parse_date` is a Python function that returns a `Column`, a handy
    way to give a name to an expression you use more than once. 30
    February is not a date in any format, so it stays NULL: a reject,
    not a guess.

    Pattern letters (Spark's datetime patterns): `yyyy` year, `MM` month
    number, `MMM` short month name (`Mar`, matched case-insensitively),
    `MMMM` full month name, `dd` day, `HH` hour (0 to 23), `mm` minute,
    `ss` second, `X` or `XXX` a zone offset. Literal text goes in single
    quotes (`yyyy-MM-dd'T'HH:mm`).

