    ## Whitespace: What trim Misses

    `F.trim` removes **space characters** (U+0020) from both ends, and
    nothing else:

    ```python
    names = spark.createDataFrame(
        [("  ana   maria  ",), ("\tBinh\n",), ("\u00a0Chloé\u00a0",)], "s STRING")
    names.select("s", F.length("s").alias("len"),
                 F.trim("s").alias("trimmed"), F.length(F.trim("s")).alias("len2")).show()
    ```

    ```
    +---------------+---+-----------+----+
    |              s|len|    trimmed|len2|
    +---------------+---+-----------+----+
    |  ana   maria  | 15|ana   maria|  11|
    |       \tBinh\n|  6|   \tBinh\n|   6|
    |         Chloé |  7|     Chloé |   7|
    +---------------+---+-----------+----+
    ```

    The tab and newline stay, the non-breaking spaces around `Chloé`
    stay, and the run of spaces inside `ana   maria` stays. Non-breaking
    spaces are common in data copied from web pages, PDFs and
    spreadsheets, and they defeat equality tests: `"Chloé" == trim(s)`
    is false here.

    `trim` can take the characters to remove as a second argument (in
    PySpark since 4.0), but it must be a **column**: a plain string is
    read as a column name, a trap you will meet again with the regex
    functions in "Text and Logs".

    ```python
    names.select(F.trim("s", " \t\n"))
    # [UNRESOLVED_COLUMN.WITH_SUGGESTION] A column ... with name ` \t\n` cannot be resolved.

    names.select(F.trim("s", F.lit(" \t\n\u00a0")))   # works
    ```

    The robust fix collapses **every** run of whitespace to one space,
    then trims:

    ```python
    squeeze = F.trim(F.regexp_replace("s", r"[\s\u00a0]+", " "))
    ```

    Spark uses Java regular expressions, where `\s` means
    `[ \t\n\x0B\f\r]` only. Adding `\u00a0` to the class (or starting
    the pattern with `(?U)`, which makes `\s` Unicode-aware) catches the
    non-breaking space too. Measured on the three names, the result
    lengths are 9, 4 and 7 with plain `\s+` (the `Chloé` row keeps its
    non-breaking spaces) and 9, 4 and 5 with either fix.

    Related functions: `ltrim` and `rtrim` (one side), `btrim(str,
    chars)` (3.5, SQL's `TRIM(BOTH chars FROM str)`), and in SQL
    `TRIM(LEADING '0' FROM '000120')` gives `120`.

