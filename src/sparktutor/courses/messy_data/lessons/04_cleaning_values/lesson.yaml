    ## Collations: Case- and Accent-Insensitive Comparison

    Spark 4.0 added **collations** (SPARK-46830): a string can carry
    rules for how it is compared and sorted. Attach one with
    `F.collate(col, name)` or `COLLATE name` in SQL:

    ```python
    spark.sql("""SELECT 'Montréal' = 'MONTREAL' AS plain,
      'Montréal' COLLATE UTF8_LCASE = 'MONTRÉAL' AS lcase,
      'Montréal' COLLATE UNICODE_CI = 'montréal' AS ci,
      'Montréal' COLLATE UNICODE_CI_AI = 'montreal' AS ci_ai""").show()
    ```

    ```
    +-----+-----+----+-----+
    |plain|lcase|  ci|ci_ai|
    +-----+-----+----+-----+
    |false| true|true| true|
    +-----+-----+----+-----+
    ```

    The names read as: `UTF8_BINARY` (the default, byte by byte),
    `UTF8_LCASE` (ignore case), `UNICODE` (Unicode ordering), `_CI`
    case-insensitive, `_AI` accent-insensitive, and `_RTRIM` variants
    that ignore trailing spaces. `SELECT name FROM collations()` lists
    them all, including language-specific ones.

    Grouping by a collated column treats equal-under-the-collation values
    as one group:

    ```python
    cities = spark.createDataFrame([(c,) for c in ["Montréal", "MONTREAL", "montréal",
        "Toronto", "toronto", "Hà Nội", "Ha Noi"]], "city STRING")
    cities.groupBy("city").count().count()                          # 7 groups
    cities.groupBy(F.collate("city", "UNICODE_CI_AI").alias("city")).count().show()
    ```

    ```
    +--------+-----+
    |    city|count|
    +--------+-----+
    |  Hà Nội|    2|
    |Montréal|    3|
    | Toronto|    2|
    +--------+-----+
    ```

    The values are not changed: each group is shown with one of its
    original spellings (which one is not guaranteed), and the column's
    type is now `string collate UNICODE_CI_AI`. A misspelt name fails
    with `COLLATION_INVALID_NAME` and a suggestion. "What Spark 4.x Adds
    for Messy Data" goes deeper into collations; for this lesson, they
    are the cleanest way to say "same city, different typing".

