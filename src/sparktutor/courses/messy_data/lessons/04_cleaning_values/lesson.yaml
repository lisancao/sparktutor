    ## Booleans: yes, Y, 1 and true

    Casting text to `BOOLEAN` already understands the usual spellings,
    case-insensitively and after trimming:

    ```python
    spark.sql("""SELECT x, try_cast(x AS BOOLEAN) AS b FROM VALUES
      ('yes'), ('Y'), ('t'), ('1'), (' TRUE '), ('no'), ('n'), ('0'),
      ('false'), ('on'), ('maybe') AS v(x)""").show()
    ```

