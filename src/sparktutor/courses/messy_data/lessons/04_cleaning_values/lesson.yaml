    ## Standardizing Categories: Mapping Tables, Not Endless CASE WHEN

    The country column has a dozen spellings of four countries. A first
    attempt is a `when` chain over a normalized key:

    ```python
    key = F.upper(F.regexp_replace(F.trim("country"), r"\.", ""))
    case_version = (F.when(key.isin("CANADA", "CA", "CAN"), "CA")
                     .when(key.isin("US", "USA", "UNITED STATES", "UNITED STATES OF AMERICA"), "US")
                     .when(key.isin("VIET NAM", "VIETNAM", "VN"), "VN"))
    ```

    It works until the next spelling arrives, and every new one is a
    code change. Put the mapping in **data** instead,
    `data/messy/cleaning/country_codes.csv` (`raw`, `code`), and join:

    ```python
    codes = spark.read.option("header", True).csv("data/messy/cleaning/country_codes.csv")
    mapped = (raw.withColumn("key", key)
                 .join(F.broadcast(codes), F.col("key") == F.col("raw"), "left"))
    (mapped.select("customer_id", "country", "code")
        .withColumn("by_case", case_version).show(8))
    ```

    ```
    +-----------+--------+----+-------+
    |customer_id| country|code|by_case|
    +-----------+--------+----+-------+
    |       C001|  Canada|  CA|     CA|
    |       c002|    usa |  US|     US|
    |       C003|    U.S.|  US|     US|
    |       C004|Viet Nam|  VN|     VN|
    |       C005|      VN|  VN|     VN|
    |       C006|    Mars|NULL|   NULL|
    |       C007|     can|  CA|     CA|
    |       C008|  France|  FR|   NULL|
    +-----------+--------+----+-------+
    only showing top 8 rows
    ```

    The `when` chain forgot France and nothing complained; the mapping
    table has it, and a non-technical colleague can add the next
    spelling without touching code. Three details:

    - **`"left"` join**: rows without a match (`Mars`) are kept with a
      NULL code, so you can report them. An inner join would drop them
      silently.
    - **`F.broadcast(codes)`** tells Spark the table is small enough to
      send a full copy to every task, so the big side is never shuffled.
      The plan shows `BroadcastHashJoin` with a `BroadcastExchange` on
      the mapping side. ("Plans, Partitions and Caching" explains
      shuffles and join strategies.)
    - **Joins don't promise any row order.** This broadcast join happened
      to keep the file's order; a join that shuffles both sides will
      not. Sort explicitly when order matters.

    Finding the values that need a new mapping entry is one query:
    `mapped.filter(F.col("country").isNotNull() & F.col("code").isNull())`
    returns only `Mars` here.

