    ## NaN Is Not NULL

    `NaN` behaves differently from NULL, and Spark's rules for it differ
    from IEEE floating point:

    ```python
    v.select("k", "score", F.isnan("score").alias("isnan"),
             F.col("score").isNull().alias("isnull"),
             F.nanvl("score", F.lit(None)).alias("nan_to_null")).show()
    ```

    ```
    +---+-----+-----+------+-----------+
    |  k|score|isnan|isnull|nan_to_null|
    +---+-----+-----+------+-----------+
    |  a|  NaN| true| false|       NULL|
    |  b|  1.0|false| false|        1.0|
    |  c| NULL|false|  true|       NULL|
    |  d|  2.0|false| false|        2.0|
    +---+-----+-----+------+-----------+
    ```

    - `isNull` is false for NaN; test with `F.isnan` (or the
      `Column.isNaN` method, 4.0).
    - In Spark, `NaN = NaN` is **true** and NaN is larger than every
      other number, so it sorts last ascending and wins `max`.
    - Aggregates don't skip NaN: on the score column, `count` is 3,
      `avg` and `max` are `NaN`. After
      `F.nanvl("score", F.lit(None))` (NaN becomes NULL) they are 2,
      `1.5` and `2.0`.
    - `df.fillna({"score": 0.0})` replaces NULL **and** NaN in numeric
      columns, which may or may not be what you meant.

