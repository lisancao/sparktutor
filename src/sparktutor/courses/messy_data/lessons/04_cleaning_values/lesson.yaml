    ## The Same Logic in SQL: F.expr, selectExpr and spark.sql

    Everything you can write with `F.` functions you can also write as
    SQL text, and mix freely:

    ```python
    a = raw.select(F.expr("upper(trim(customer_id)) AS id"),
                   F.expr("try_cast(trim(age) AS INT) AS age"))

    b = raw.selectExpr("upper(trim(customer_id)) AS id",
                       "try_cast(trim(age) AS INT) AS age")

    raw.createOrReplaceTempView("raw_customers")
    c = spark.sql("SELECT upper(trim(customer_id)) AS id, "
                  "try_cast(trim(age) AS INT) AS age FROM raw_customers")
    ```

    All three produce the same physical plan; `a.explain()` and
    `c.explain()` both print:

    ```
    *(1) Project [upper(trim(customer_id#17, None)) AS id#84,
                  try_cast(trim(age#25, None) as int) AS age#85]
    +- FileScan csv [customer_id#17,age#25] ... ReadSchema: struct<customer_id:string,age:string>
    ```

    So choose by readability, not speed. The DataFrame API is easier to
    build programmatically (loops over columns, helper functions that
    return expressions, as in this lesson's exercise); SQL is handy for
    one-off expressions and for SQL-only syntax such as
    `TRIM(LEADING '0' FROM x)` or the `'12'::INT` cast shorthand (4.0,
    SPARK-45574).

