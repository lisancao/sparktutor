    ## Conditions: &, |, ~ and Parentheses

    Combine conditions with `&` (and), `|` (or) and `~` (not), never
    Python's `and`, `or` and `not`, and **always put parentheses around
    each comparison**. In Python, `&` binds tighter than `>` and `==`, so
    this does not mean what it looks like:

    ```python
    raw.filter(F.col("age") > 30 & F.col("city") == "Paris")
    ```

    ```
    PySparkValueError: [CANNOT_CONVERT_COLUMN_INTO_BOOL] Cannot convert
    column into bool: please use '&' for 'and', '|' for 'or', '~' for
    'not' when building DataFrame boolean expressions.
    ```

    ```python
    raw.filter((F.col("age").try_cast("int") > 30) & (F.col("city") == "Paris")).count()   # 2
    ```

    (`try_cast` is coming up; it turns the text ages into numbers.)

