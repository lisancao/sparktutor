    ## Exercise: Clean the Customer Export

    Turn `customers_raw.csv` into a typed table with a reject reason for
    every row that had a bad value. The harness reads the file with
    every column as a string and passes you the mapping table.

    Implement five functions:

    1. `tidy(c)`: collapse every run of `[\s\u00a0]` to one space,
       trim, and return NULL when the upper-cased result is one of
       `NULL_TOKENS` (`""`, `N/A`, `NA`, `NULL`, `NONE`, `-`).
    2. `parse_date(c)`: `coalesce` of `try_to_date(c)` and
       `try_to_date(c, p)` for each of `DATE_PATTERNS`.
    3. `parse_money(c)`: remove `$`, `,` and whitespace, then
       `try_cast("decimal(12,2)")`.
    4. `clean_customers(raw, countries)`: tidy every column, then build
       - `customer_id` upper-cased, `name` with `initcap`
       - `email` lower-cased, kept only if it matches `EMAIL_RE`
       - `phone` as 10 digits (drop a leading `1` from 11 digits)
       - `country` from the mapping table (broadcast left join)
       - `signup_date`, `lifetime_value`, `newsletter` (boolean) and
