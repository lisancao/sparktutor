  Output: |
    ## Date Traps

    **Ambiguity cannot be parsed away.** `04/03/2026` is 4 March with
    `dd/MM/yyyy` and 3 April with `MM/dd/yyyy`, and both parse:

    ```python
    spark.sql("""SELECT try_to_date('04/03/2026', 'dd/MM/yyyy') AS day_first,
      try_to_date('04/03/2026', 'MM/dd/yyyy') AS month_first""").show()
    ```

    ```
    +----------+-----------+
    | day_first|month_first|
    +----------+-----------+
    |2026-03-04| 2026-04-03|
    +----------+-----------+
    ```

    In a `coalesce`, whichever pattern comes first wins, silently. Find
    out which convention the source uses (the sample file documents
    day/month/year) and use only that one, per source.

    **Pattern letters are case-sensitive, and some mistakes are silent:**

    ```python
    spark.sql("""SELECT try_to_date('2026-03-04', 'yyyy-mm-dd') AS minutes_trap,
      try_to_date('4/3/2026', 'dd/MM/yyyy') AS dd_needs_two,
      try_to_date('4/3/2026', 'd/M/yyyy') AS d_takes_both,
      try_to_date('04-Mar-69', 'dd-MMM-yy') AS yy_69""").show()
    ```

    ```
    +------------+------------+------------+----------+
    |minutes_trap|dd_needs_two|d_takes_both|     yy_69|
    +------------+------------+------------+----------+
    |  2026-01-04|        NULL|  2026-03-04|2069-03-04|
    +------------+------------+------------+----------+
    ```

    - `mm` is **minutes**, so `yyyy-mm-dd` reads `03` as a minute and
      gives 4 **January**. No error.
    - `dd` requires two digits; `d` accepts one or two, so `d/M/yyyy`
      is the forgiving choice.
    - `yy` maps two-digit years into 2000 to 2099, so `69` is 2069. A
      birth date of `04-Mar-69` needs a rule of your own.
    - `YYYY` (week-based year) is rejected outright, even by
      `try_to_date`: it raises
      `INCONSISTENT_BEHAVIOR_CROSS_VERSION.DATETIME_PATTERN_RECOGNITION`.
      Use `yyyy`.

