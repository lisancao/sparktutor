    ## Invalid UTF-8, Briefly

    Spark strings are UTF-8. Bytes that are not valid UTF-8 (typically a
    Latin-1 file read as UTF-8) can still end up inside a string column.
    Spark 4.0 added four functions to find and fix them:

    ```python
    # The same word as Latin-1 bytes (E9) and as UTF-8 bytes (C3 A9), cast to strings
    bad = (spark.createDataFrame([(bytearray(b"Caf\xe9"),), (bytearray("Café".encode()),)], "b BINARY")
           .select(F.col("b").cast("string").alias("s")))
    bad.select(F.hex(F.col("s").cast("binary")).alias("bytes"),
               F.is_valid_utf8("s").alias("valid"),
               F.make_valid_utf8("s").alias("made_valid"),
               F.try_validate_utf8("s").alias("try_valid")).show()
    ```

    ```
    +----------+-----+----------+---------+
    |     bytes|valid|made_valid|try_valid|
    +----------+-----+----------+---------+
    |  436166E9|false|      Caf�|     NULL|
    |436166C3A9| true|      Café|     Café|
    +----------+-----+----------+---------+
    ```

    `make_valid_utf8` replaces bad bytes with U+FFFD (the "�"), which
    loses the letter; `validate_utf8` fails with `INVALID_UTF8_STRING`.
    None of them can recover the original text: for that you need the
    right encoding when reading, which "Text and Logs" and "CSV and
    Delimited Files" show.

