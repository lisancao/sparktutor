    ## The try_ Family

    Each `try_` function does the same work as its plain version but
    returns `NULL` where the plain one would raise:

    ```python
    raw.select("customer_id", "age", F.col("age").try_cast("int").alias("age_int")).show(8)
    ```

    ```
    +-----------+------+-------+
    |customer_id|   age|age_int|
    +-----------+------+-------+
    |       C001|    34|     34|
    |       c002|   41 |     41|
    |       C003|  NULL|   NULL|
    |       C004|    -3|     -3|
    |       C005|    29|     29|
    |       C006|thirty|   NULL|
    |       C007|   200|    200|
    |       C008|    52|     52|
    +-----------+------+-------+
    ```

    The ones you will use most (versions are when they arrived in
    PySpark):

    | Function | Instead of | Since |
    |----------|------------|-------|
    | `Column.try_cast(type)`, SQL `try_cast(x AS type)` | `cast` | 4.0 (Python method) |
    | `try_to_number(col, format)` | `to_number` | 3.5 |
    | `try_to_date(col, format)` | `to_date` | 4.1 (SPARK-52866; the docstring says 4.0) |
    | `try_to_timestamp(col, format)` | `to_timestamp` | 3.5 |
    | `try_divide`, `try_add`, `try_subtract`, `try_multiply` | `/`, `+`, `-`, `*` | 3.5 |
    | `try_mod` | `%` | 4.0 |
    | `try_element_at` | `element_at` | 3.5 |
    | `try_sum`, `try_avg` | `sum`, `avg` (overflow) | 3.5 |
    | `try_parse_json`, `try_parse_url`, `try_url_decode` | `parse_json`, ... | 4.0 |

    ```python
    spark.sql("""SELECT try_divide(10, 0) AS a, try_add(2147483647, 1) AS b,
      try_cast('12a' AS INT) AS c, '12'::INT + 1 AS d,
      try_element_at(array(1, 2), 5) AS e""").show()
    ```

    ```
    +----+----+----+---+----+
    |   a|   b|   c|  d|   e|
    +----+----+----+---+----+
    |NULL|NULL|NULL| 13|NULL|
    +----+----+----+---+----+
    ```

    A `NULL` from a `try_` function is information: "this value was
    present and did not parse". Keep the raw value next to it so you can
    tell that apart from "this value was missing", which is what the
    exercise's reject reasons do.

