    ## Adding and Renaming Many Columns

    `withColumn(name, expr)` adds or replaces one column. For several at
    once, `withColumns` (3.3) takes a dict, and `withColumnsRenamed`
    (3.4) renames several:

    ```python
    wide = raw.withColumns({
        "name": F.trim("full_name"),
        "email": F.lower(F.trim("email")),
    }).withColumnsRenamed({"lifetime_value": "ltv_raw", "signup_date": "signup_raw"})
    print(wide.columns)
    ```

    ```
    ['customer_id', 'full_name', 'email', 'phone', 'country', 'signup_raw',
     'ltv_raw', 'newsletter', 'age', 'city', 'name']
    ```

    Replacing an existing name (`email`) keeps its position; a new name
    (`name`) goes at the end. `withColumnsRenamed` ignores names that
    don't exist, so a typo silently does nothing; check `columns` when
    it matters.

    Prefer one `withColumns` or one `select` over a long loop of
    `withColumn` calls: each call adds a step to the query plan that
    Spark has to analyze, and plans built from hundreds of them get slow
    to plan.

