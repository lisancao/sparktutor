    ## Summary

    In this lesson you learned:

    - **Column expressions** from `pyspark.sql.functions` (imported as
      `F`) describe work that runs later, on every row. Build many
      columns with `withColumns` (3.3), rename with `withColumnsRenamed`
      (3.4), combine conditions with `&`, `|`, `~` and parentheses, and
      write the same logic as SQL with `F.expr`, `selectExpr` or
      `spark.sql`: one engine, one plan.
    - **`when`/`otherwise`**: first true branch wins; no `otherwise`
      means NULL.
    - **ANSI mode** (default since 4.0) fails the query on bad casts,
      division by zero and overflow (`CAST_INVALID_INPUT`,
      `DIVIDE_BY_ZERO`, `ARITHMETIC_OVERFLOW`). The **`try_` functions**
      return NULL instead; keep the raw value to tell "bad" from
      "missing".
    - **Strings**: `trim` removes only spaces; collapse
      `[\s\u00a0]+` with `regexp_replace` to catch tabs and
      non-breaking spaces. `initcap` for display, lower-cased keys or
      collations for matching. `translate` for single characters.
    - **Accents**: no built-in unaccent in 4.2. Use collations
      (`UNICODE_CI_AI`, 4.0) to compare and group, `translate` for known
      letters, or a Python UDF with `unicodedata` (slower, opaque).
      `is_valid_utf8` and friends (4.0) find invalid bytes.
    - **Money**: `try_to_number` for one strict format, strip-and-cast
      to `DECIMAL` for mixed input, and never guess between `1.234,50`
      and `1,234.50`.
    - **Dates**: `coalesce` over `try_to_date` patterns; ambiguity must
      be resolved per source; `mm` is minutes, `d` beats `dd`, `yy` is
      2000 to 2099, `YYYY` is rejected; set `spark.sql.session.timeZone`.
    - **Booleans**: `try_cast(x AS BOOLEAN)` handles yes/no/y/n/t/f/1/0.
    - **Missing values**: normalize markers to NULL once; NULL
      comparisons are NULL (use `isNull`, `eqNullSafe`, `<=>`); beware
      `NOT IN` with NULLs; `concat_ws` skips NULLs; NaN is a value
      (`isnan`, `nanvl`).
    - **Mapping tables** joined with `F.broadcast` and a left join beat
      long `CASE WHEN` chains, and show you unmapped values.

    Next: **Files as Files: binaryFile, Globs and Metadata**, where you
    step back from values to the files themselves: listing, filtering
    and identifying them before any parsing.
