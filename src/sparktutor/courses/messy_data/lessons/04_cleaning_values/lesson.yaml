    ## when and otherwise

    `F.when(condition, value)` is SQL's `CASE WHEN`. Chain more `.when`
    calls for more cases and finish with `.otherwise`:

    ```python
    age = F.col("age").try_cast("int")
    raw.select("customer_id", "age",
        F.when(age.isNull(), "unknown")
         .when(age < 18, "minor")
         .when(age < 65, "adult")
         .otherwise("senior").alias("band"),
        F.when(age > 100, "check me").alias("flag")).show(8)
    ```

    ```
    +-----------+------+-------+--------+
    |customer_id|   age|   band|    flag|
    +-----------+------+-------+--------+
    |       C001|    34|  adult|    NULL|
    |       c002|   41 |  adult|    NULL|
    |       C003|  NULL|unknown|    NULL|
    |       C004|    -3|  minor|    NULL|
    |       C005|    29|  adult|    NULL|
    |       C006|thirty|unknown|    NULL|
    |       C007|   200| senior|check me|
    |       C008|    52|  adult|    NULL|
    +-----------+------+-------+--------+
    ```

    Two rules to remember:

    - **The first true branch wins**, so order matters: check
      `age.isNull()` first, or a NULL age would fall through to
      `otherwise`.
    - **No `otherwise` means NULL** for rows that match nothing (the
      `flag` column). That is often what you want, and occasionally a
      silent bug when you forgot a case.

    Notice also that `-3` landed in `minor` and `200` in `senior`: the
    expression did exactly what it was told. Range checks are a separate
    step, as you will see in the exercise.

