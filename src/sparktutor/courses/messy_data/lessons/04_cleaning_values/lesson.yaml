    ## regexp_replace and translate

    `regexp_replace(col, pattern, replacement)` replaces every match of
    a Java regular expression. `translate(col, from, to)` replaces single
    characters: each character of `from` becomes the character at the
    same position in `to`, or is deleted when `to` is shorter.

    ```python
    phones = spark.createDataFrame([("(416) 555-0199",), ("416.555.0123",),
                                    ("+1 416 555 0147",), ("n/a",)], "p STRING")
    phones.select("p",
        F.regexp_replace("p", r"[^0-9]", "").alias("digits"),
        F.translate("p", "()-. +", "").alias("translated")).show()
    ```

    ```
    +---------------+-----------+-----------+
    |              p|     digits| translated|
    +---------------+-----------+-----------+
    | (416) 555-0199| 4165550199| 4165550199|
    |   416.555.0123| 4165550123| 4165550123|
    |+1 416 555 0147|14165550147|14165550147|
    |            n/a|           |        n/a|
    +---------------+-----------+-----------+
    ```

    "Keep only digits" (`[^0-9]` means "anything that is not a digit")
    is more robust than listing the characters to delete, because it
    also handles separators you didn't think of. Note what it does to
    `n/a`: an empty string, not NULL. Handle null markers **before**
    stripping characters, or `""` slips through as a value.

    Replacements can refer to capture groups as `$1`, `$2`:

    ```python
    F.regexp_replace("n", r"^(\w+), (\w+)$", "$2 $1")   # "Nguyen, Linh" -> "Linh Nguyen"
    ```

