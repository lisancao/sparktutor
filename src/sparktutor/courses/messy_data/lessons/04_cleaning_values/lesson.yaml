    ## Columns Are Expressions, Not Values

    The examples in this course import Spark's functions like this:

    ```python
    from pyspark.sql import functions as F
    ```

    `pyspark.sql.functions` holds hundreds of functions (`trim`, `upper`,
    `to_date`, ...), and the `F.` prefix keeps them apart from Python's
    own names (`F.sum` is not Python's `sum`, and a bare `from ...
    import *` would replace Python's `sum`, `min`, `max` and `round`).
    You will also see `sf` in the PySpark API docs; the name doesn't
    matter, the prefix does.

    A function such as `F.trim` does not trim anything when you call it.
    It returns a `Column`: a description of a computation that Spark will
    run later, on every row, inside its engine:

    ```python
    name = F.trim(F.col("full_name"))
    print(name)
    ```

    ```
    Column<'trim(full_name)'>
    ```

    You use expressions inside `select`, `withColumn`, `filter` and
    friends. Most functions accept a column name as a string or a
    `Column`; `F.lit(value)` turns a plain Python value into a constant
    column:

    ```python
    out = raw.select(
        "customer_id",
        F.trim("full_name").alias("name"),
        F.lower(F.col("email")).alias("email"),
        F.lit("crm").alias("source"))
    out.show(3, truncate=False)
    ```

    ```
    +-----------+-------------------+------------------------+------+
    |customer_id|name               |email                   |source|
    +-----------+-------------------+------------------------+------+
    |C001       |ana   maria  nguyen| ana.nguyen@example.com |crm   |
    | c002      |BINH TRAN          |binh@example.com        |crm   |
    |C003       |Zoë Tremblay       |n/a                     |crm   |
    +-----------+-------------------+------------------------+------+
    ```

    Expressions nest freely, and nothing runs until an action such as
    `show`, `count` or `collect` (the lazy evaluation from the first
    lessons). That has a consequence you will meet in a moment: an
    expression that fails on bad data fails when the action runs, not
    where you wrote it.

