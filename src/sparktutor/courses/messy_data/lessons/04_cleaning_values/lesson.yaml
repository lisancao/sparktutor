    ## The Sample File: customers_raw.csv

    `data/messy/cleaning/customers_raw.csv` is a customer export from an
    imaginary CRM. Every column is text and every column has problems.
    `data/messy/cleaning/country_codes.csv` is a small mapping table you
    will use near the end.

    Read the export with every column as a string. The `header` option
    takes column names from the first line; without a schema (and
    without `inferSchema`) the CSV reader makes every column a `STRING`,
    which is exactly what you want before cleaning. "CSV and Delimited
    Files" covers the CSV reader and its many options properly.

    ```python
    from pyspark.sql import functions as F

    raw = spark.read.option("header", True).csv("data/messy/cleaning/customers_raw.csv")
    raw.select("customer_id", "full_name", "lifetime_value", "age").show(5, truncate=False)
    ```

    ```
    +-----------+----------------------+--------------+----+
    |customer_id|full_name             |lifetime_value|age |
    +-----------+----------------------+--------------+----+
    |C001       |  ana   maria  nguyen |$1,234.50     |34  |
    | c002      |BINH TRAN             |1234.5        | 41 |
    |C003       |Zoë Tremblay          |$12           |NULL|
    |C004       |José\tGarcía          |-$5.00        |-3  |
    |C005       |nguyễn thị hà         |N/A           |29  |
    +-----------+----------------------+--------------+----+
    only showing top 5 rows
    ```

    Already you can see padded and lower-case IDs, names in every case,
    a tab inside a name (`show()` prints it as `\t`), money with and
    without `$`, a negative age, and `N/A`. Some problems don't show at
    all: the space in `Zoë Tremblay` is a **non-breaking space**
    (U+00A0), which looks like a space and behaves differently. And the
    reader has already turned empty fields into `NULL` (C003's age).

