    ## Money and Numbers

    `to_number(col, format)` (3.5) parses text by a format string, and
    `try_to_number` returns NULL instead of failing. Format characters:
    `9` or `0` a digit, `.` the decimal point, `,` a grouping separator,
    `$` a dollar sign, `S` a sign, `MI` a trailing minus, `PR` angle
    brackets for negatives. It returns a `DECIMAL`.

    ```python
    money = spark.createDataFrame([(v,) for v in
        ["$1,234.50", "$12", "1234.5", "-$5.00", " $7.25 ", "1.234,50", "abc"]], "s STRING")
    money.select("s",
        F.try_to_number("s", F.lit("$9,999.99")).alias("to_number"),
        F.regexp_replace("s", r"[$,\s]", "").try_cast("decimal(12,2)").alias("stripped")).show()
    ```

    ```
    +---------+---------+--------+
    |        s|to_number|stripped|
    +---------+---------+--------+
    |$1,234.50|  1234.50| 1234.50|
    |      $12|    12.00|   12.00|
    |   1234.5|     NULL| 1234.50|
    |   -$5.00|     NULL|   -5.00|
    |   $7.25 |     NULL|    7.25|
    | 1.234,50|     NULL|    1.23|
    |      abc|     NULL|    NULL|
    +---------+---------+--------+
    ```

    `to_number` is strict: the text must fit the format, so `1234.5`
    (no `$`) and ` $7.25 ` (spaces) fail. It suits clean machine output
    in one known format; `S$999.99`, `999.99MI` and `999.99PR` cover
    signed forms such as `-$5.00`, `5.00-` and `<5.00>`. For mixed human
    input, **strip and cast** is more forgiving: remove the currency
    symbol, grouping commas and spaces, then `try_cast` to a `DECIMAL`.

    Now look at the `1.234,50` row: the strip-and-cast gave **1.23**, a
    plausible, wrong number, with no error. In much of Europe `.` groups
    thousands and `,` is the decimal point, and no single rule handles
    both conventions. Decide per source, and for European text swap the
    separators deliberately:

    ```python
    eu = F.regexp_replace(F.regexp_replace(F.col("s"), r"\.", ""), ",", ".")
    eu.try_cast("decimal(12,2)")   # "1.234,50" -> 1234.50, "12,5" -> 12.50
    ```

    Use `DECIMAL(p, s)` for money, never `DOUBLE` ("Schemas for Data You
    Don't Control" showed `0.1 + 0.2` as doubles). To format numbers for
    output, `to_char(1234.5, '$9,999.99')` gives `$1,234.50` and
    `format_number(1234567.891, 2)` gives `1,234,567.89`.

