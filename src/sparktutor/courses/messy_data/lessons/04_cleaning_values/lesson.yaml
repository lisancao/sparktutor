    ## Normalizing Missing Values

    Turn every spelling of "missing" into a real NULL early, once, so
    the rest of the pipeline only has one case to handle:

    ```python
    v.select("k", "city",
        F.coalesce("city", F.lit("unknown")).alias("coalesce"),
        F.nullif(F.col("city"), F.lit("")).alias("nullif_empty"),
        F.when(F.upper(F.trim("city")).isin("", "N/A", "NA", "NULL"), None)
         .otherwise(F.col("city")).alias("markers_to_null")).show()
    ```

    ```
    +---+-----+--------+------------+---------------+
    |  k| city|coalesce|nullif_empty|markers_to_null|
    +---+-----+--------+------------+---------------+
    |  a| NULL| unknown|        NULL|           NULL|
    |  b|     |        |        NULL|           NULL|
    |  c|  N/A|     N/A|         N/A|           NULL|
    |  d|Paris|   Paris|       Paris|          Paris|
    +---+-----+--------+------------+---------------+
    ```

    - `coalesce(a, b, ...)` returns the first non-NULL argument; `""`
      and `"N/A"` are not NULL, so it keeps them. (`nvl` and `ifnull`
      are two-argument versions.)
    - `nullif(a, b)` is NULL when `a = b`, otherwise `a`.
    - `when(... isin(markers), None)` handles a whole list of markers.

    One more trap: `coalesce` needs one type for its result. Mixing a
    date with a text default, `coalesce(try_to_date(x), 'n/a')`, makes
    Spark cast `'n/a'` to `DATE`, which fails with `CAST_INVALID_INPUT`.
    Keep "missing" as NULL in typed columns and put the explanation in a
    separate column.

