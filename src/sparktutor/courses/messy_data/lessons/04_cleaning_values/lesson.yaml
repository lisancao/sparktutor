    ## Case

    `lower`, `upper` and `initcap` work on Unicode letters (`zoë` and
    `ZOË` round-trip). `initcap` upper-cases the first letter after each
    **space** and lower-cases everything else, which is usually right
    for names and sometimes not:

    ```python
    (spark.createDataFrame([("BINH TRAN",), ("o'neil",), ("mary-jane van dyke",), ("McDONALD",)], "s STRING")
        .select("s", F.initcap("s")).show())
    ```

    ```
    +------------------+------------------+
    |                 s|        initcap(s)|
    +------------------+------------------+
    |         BINH TRAN|         Binh Tran|
    |            o'neil|            O'neil|
    |mary-jane van dyke|Mary-jane Van Dyke|
    |          McDONALD|          Mcdonald|
    +------------------+------------------+
    ```

    For matching and grouping, don't change the case of what you store;
    compare a lower-cased key, or use a case-insensitive collation (two
    sections down). Keep `initcap` for display.

