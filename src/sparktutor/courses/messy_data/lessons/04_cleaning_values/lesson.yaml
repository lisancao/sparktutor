    ## NULL, "", "N/A" and NaN

    Four different things that all mean "no proper value":

    ```python
    v = spark.createDataFrame([("a", None, float("nan")), ("b", "", 1.0),
                               ("c", "N/A", None), ("d", "Paris", 2.0)],
                              "k STRING, city STRING, score DOUBLE")
    v.show()
    ```

    ```
    +---+-----+-----+
    |  k| city|score|
    +---+-----+-----+
    |  a| NULL|  NaN|
    |  b|     |  1.0|
    |  c|  N/A| NULL|
    |  d|Paris|  2.0|
    +---+-----+-----+
    ```

    - `NULL` is SQL's "unknown". It is not equal to anything, not even
      another NULL.
    - `""` is a real string of length 0.
    - `"N/A"`, `"null"`, `"-"` are real strings that a person meant as
      missing. Spark has no idea.
    - `NaN` ("not a number") is a real floating-point value, produced by
      things like `0.0 / 0.0` in other systems and stored as such.

    **Comparisons with NULL are NULL**, and `filter` drops rows whose
    condition is NULL:

    ```python
    v.filter(F.col("city") != "Paris").count()    # 2: b and c, not a
    v.filter(F.col("city") == None).count()        # 0, always
    v.filter(F.col("city").isNull()).count()       # 1
    ```

    `col == None` builds the SQL `city = NULL`, which is never true; use
    `isNull()`/`isNotNull()`. To compare treating NULLs as equal values,
    use the null-safe forms `eqNullSafe` (Python), `<=>` or
    `equal_null` (SQL):

    ```python
    spark.sql("""SELECT NULL = NULL AS eq, NULL <=> NULL AS null_safe,
      equal_null(NULL, NULL) AS fn, 'x' NOT IN ('a', NULL) AS not_in,
      concat('a', NULL) AS concat, concat_ws('-', 'a', NULL, 'b') AS concat_ws""").show()
    ```

    ```
    +----+---------+----+------+------+---------+
    |  eq|null_safe|  fn|not_in|concat|concat_ws|
    +----+---------+----+------+------+---------+
    |NULL|     true|true|  NULL|  NULL|      a-b|
    +----+---------+----+------+------+---------+
    ```

    `NOT IN` with a NULL in the list is NULL for every value, so a
    filter with it returns nothing: a classic bug when the list comes
    from data. `concat` is NULL if any part is NULL; `concat_ws` skips
    NULLs, which makes it perfect for building a list of reasons, as in
    the exercise.

