    ## What a Cast Accepts

    Casting text to a number is stricter than you might guess, and
    stricter in some places than others:

    ```python
    vals = spark.createDataFrame([(v,) for v in
        [" 12 ", "+12", "0012", "12.7", "1e3", "1,234", "\u00a012"]], "s STRING")
    vals.select("s", F.col("s").try_cast("int").alias("as_int"),
                F.col("s").try_cast("double").alias("as_double")).show()
    ```

    ```
    +-----+------+---------+
    |    s|as_int|as_double|
    +-----+------+---------+
    |  12 |    12|     12.0|
    |  +12|    12|     12.0|
    | 0012|    12|     12.0|
    | 12.7|  NULL|     12.7|
    |  1e3|  NULL|   1000.0|
    |1,234|  NULL|     NULL|
    |   12|  NULL|     NULL|
    +-----+------+---------+
    ```

    - Spaces, tabs and newlines around the number are trimmed, but the
      non-breaking space (the last row) is not.
    - `12.7` is not an `INT` under ANSI mode (it used to be truncated to
      12); cast to `DOUBLE` or `DECIMAL` first if you mean to round.
    - Thousands separators always fail. Strip them first (see "Money and
      Numbers" below).
    - Leading zeros disappear in any numeric type. Keep IDs, ZIP codes
      and phone numbers as strings.

