    ## Accents and Other Unicode Differences

    `Montréal`, `Montreal` and `MONTRÉAL` are the same city to a person
    and three different strings to `==`. Spark 4.2 has **no built-in
    function that removes accents** (there is no Unicode normalization
    function in the 4.2.0 function registry). You have three tools,
    each right for a different job.

    **1. Compare without changing the data: collations.** Covered in the
    next section; the best choice for grouping, joining and filtering.

    **2. `translate` for a known, small set of characters.** Fast and
    built in, but you have to list every letter, and letters that are
    not a base letter plus an accent (Vietnamese `Đ`, the ligature `ﬁ`)
    need their own entries:

    ```python
    F.translate("s", "éễịàëặ", "eeiaea")   # "Nguyễn Thị Hà" -> "Nguyen Thi Ha"
    ```

    **3. A Python UDF with `unicodedata`.** A **user-defined function**
    (UDF) is a Python function that Spark calls for every row. Python's
    standard library can split an accented letter into the base letter
    plus a combining mark (Unicode normalization form NFKD), and the
    marks can then be dropped:

    ```python
    import unicodedata
    from pyspark.sql.types import StringType

    @F.udf(StringType())
    def strip_accents(s):
        if s is None:
            return None
        decomposed = unicodedata.normalize("NFKD", s)
        return "".join(ch for ch in decomposed if not unicodedata.combining(ch))

    people = spark.createDataFrame(
        [(s,) for s in ["Montréal", "Nguyễn Thị Hà", "Zoë", "Đặng", "ﬁancé", None]], "s STRING")
    people.select("s", strip_accents("s").alias("ascii_ish")).show()
    ```

    ```
    +-------------+-------------+
    |            s|    ascii_ish|
    +-------------+-------------+
    |     Montréal|     Montreal|
    |Nguyễn Thị Hà|Nguyen Thi Ha|
    |          Zoë|          Zoe|
    |         Đặng|         Đang|
    |        ﬁancé|       fiance|
    |         NULL|         NULL|
    +-------------+-------------+
    ```

    Two lessons in that output. NFKD also unpacks compatibility
    characters (`ﬁ` becomes `fi`), but `Đ` is a separate letter in
    Unicode, not `D` plus a mark, so it survives; Vietnamese data needs
    `translate` for `Đ` and `đ` as well. And a UDF has a cost: Spark
    cannot look inside it, so it cannot optimize it, and every value is
    shipped to a separate Python worker process and back. The plan shows
    that as its own step (`ArrowEvalPython` in 4.2, where Arrow-optimized
    Python UDFs are the default). Use a UDF when no built-in does the
    job; "Running a Model over Your Data with pandas UDFs" covers UDFs
    in depth.

