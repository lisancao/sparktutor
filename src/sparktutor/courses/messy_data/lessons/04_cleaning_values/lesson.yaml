    ## Built-ins, UDFs and Plans

    Everything in this lesson except `strip_accents` is a built-in
    expression. Built-ins run inside the JVM on Spark's internal row
    format, take part in whole-stage code generation (the `*(1)` in the
    plans above marks a generated stage), and can be reordered and
    simplified by the optimizer. A Python UDF is opaque: its rows leave
    the JVM, are converted to Arrow or pickled, processed by a Python
    worker and sent back.

    Practical consequences when cleaning large data:

    - Reach for a UDF last, and keep it small and deterministic (same
      input, same output), because Spark may call it more than once per
      row.
    - Build expressions with Python helpers (`tidy`, `parse_date`) and
      apply them in one `select` or `withColumns`: the helpers cost
      nothing at run time, they only build the plan.
    - Long `coalesce` lists are cheap: each `try_to_date` attempt only
      runs when the previous one returned NULL.
    - `explain()` is how you check: a cleaning query made only of
      built-ins shows one `Project` over the `FileScan`.

