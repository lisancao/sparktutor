    ## Reject Reasons: Keep the Row, Say What Was Wrong

    Later in this level, "Text and Logs" will split records into parsed
    and rejected. For a table
    of many columns, a finer pattern works well: keep every row, give
    every typed column NULL when its value was bad, and add a
    `reject_reason` column that lists **which** checks failed.

    A value is *bad* when the raw text was present but its typed version
    is NULL. Each check is a `when` that yields a reason name or NULL,
    and `concat_ws` joins the non-NULL ones:

    ```python
    bad_age = F.when(F.col("age").isNotNull() & F.col("age").try_cast("int").isNull(), "bad_age")
    bad_ltv = F.when(F.col("lifetime_value").isNotNull()
                     & F.regexp_replace("lifetime_value", r"[$,\s]", "").try_cast("decimal(12,2)").isNull()
                     & (F.col("lifetime_value") != "N/A"), "bad_ltv")
    reasons = F.concat_ws(",", bad_age, bad_ltv)
    (raw.select("customer_id", reasons.alias("reasons"),
                F.nullif(reasons, F.lit("")).alias("reject_reason"))
        .filter("customer_id IN ('C001', 'C006')").show())
    ```

    ```
    +-----------+---------------+---------------+
    |customer_id|        reasons|  reject_reason|
    +-----------+---------------+---------------+
    |       C001|               |           NULL|
    |       C006|bad_age,bad_ltv|bad_age,bad_ltv|
    +-----------+---------------+---------------+
    ```

    With every reason in a column you can count problems per check,
    send rows with reasons to a quarantine table, and still load the
    good columns of a partly bad row. (That `!= "N/A"` is ugly; the
    exercise normalizes null markers first so each check stays simple.)
    You will build on this idea later in this level in "JSON Drift and
    Quarantine", and again in the intermediate "Production Ingestion:
    Quality Rules, Quarantine and Pipelines".

