    +------+-----+
    |   yes| true|
    |     Y| true|
    |     t| true|
    |     1| true|
    | TRUE | true|
    |    no|false|
    |     n|false|
    |     0|false|
    | false|false|
    |    on| NULL|
    | maybe| NULL|
    +------+-----+
    ```

    `true`, `t`, `yes`, `y` and `1` are true; `false`, `f`, `no`, `n`
    and `0` are false. Anything else (`on`, `si`, `maybe`) is NULL with
    `try_cast` and `CAST_INVALID_INPUT` with `cast`. For other
    vocabularies, map them with `when` or a mapping table first.

