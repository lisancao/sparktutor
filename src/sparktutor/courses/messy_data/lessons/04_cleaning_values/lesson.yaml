    ## ANSI Mode: Bad Values Fail Loudly

    Since Spark 4.0, `spark.sql.ansi.enabled` is `true` by default
    (SPARK-44444). ANSI mode makes Spark follow the SQL standard: an
    operation that cannot produce a correct value **raises an error**
    instead of quietly returning `NULL` or a wrong number. "Schemas for
    Data You Don't Control" showed it for numbers that overflow their
    type; on messy text the failure you will meet most is a cast.

    ```python
    spark.conf.get("spark.sql.ansi.enabled")   # 'true'

    ages = raw.select("customer_id", F.col("age").cast("int").alias("age"))
    ages.columns        # ['customer_id', 'age']: defining it is fine
    ages.collect()      # the action fails
    ```

    ```
    [CAST_INVALID_INPUT] The value 'thirty' of the type "STRING" cannot be
    cast to "INT" because it is malformed. Correct the value as per the
    syntax, or change its target type. Use `try_cast` to tolerate
    malformed input and return NULL instead. SQLSTATE: 22018
    ```

    The error names the error condition (`CAST_INVALID_INPUT`), the bad
    value, and the fix. Other conditions you will see on messy data:

    | Query | Error condition |
    |-------|-----------------|
    | `SELECT 10 / 0` | `DIVIDE_BY_ZERO` |
    | `SELECT 2147483647 + 1` | `ARITHMETIC_OVERFLOW` |
    | `SELECT CAST(3000000000 AS INT)` | `CAST_OVERFLOW` |
    | `SELECT element_at(array(1, 2), 5)` | `INVALID_ARRAY_INDEX_IN_ELEMENT_AT` |
    | `to_date('2026-03-04', 'dd/MM/yyyy')` | `CANNOT_PARSE_TIMESTAMP` |

    With ANSI mode off, `CAST('12a' AS INT)`, `10 / 0` and
    `2147483647 + 1` return `NULL`, `NULL` and `-2147483648` (the
    integer wrapped around). That is why
    turning it off is the wrong fix: the job "works" and the numbers are
    wrong. One row out of millions is enough to fail an ANSI job, so on
    messy data you choose, per expression, between failing and
    tolerating, with the `try_*` functions.

