    ## What You'll Learn

    "Why Spark for Messy Data, and How It Runs Your Code" showed what
    happens when Spark runs a job, "Setup, a First Session and a Tour of
    the Sample Data" got you reading files into DataFrames, and "Schemas
    for Data You Don't Control" showed how to give those DataFrames the
    right column types. This lesson works one level down: on the values
    inside the columns.

    Real exports are full of values that are almost right. A name with
    three spaces in the middle, a price written `$1,234.50`, a date as
    `4 Mar 2025` in one row and `05/03/2025` in the next, `N/A` where a
    value is missing, `yes` and `Y` and `1` for the same answer. Typing
    the column (as in the schemas lesson) only works once the values
    have been cleaned.

    By the end of this lesson you will be able to:

    - Build and combine **column expressions** with
      `pyspark.sql.functions`, `when`/`otherwise`, `withColumns` (3.3)
      and `withColumnsRenamed` (3.4), and write the same logic as SQL
      with `F.expr`, `selectExpr` and `spark.sql`
    - Explain what **ANSI mode** (on by default since Spark 4.0) changes,
      and use the `try_*` functions so one bad value does not fail a job
    - Clean strings: whitespace (including the non-breaking space that
      `trim` misses), case, `regexp_replace`, `translate`
    - Handle accents and case-insensitive grouping with **collations**
      (4.0) or a small Python UDF, and spot invalid UTF-8
    - Parse money with `try_to_number` or a strip-and-cast, dates in
      several formats with `coalesce` over `try_to_date`, and yes/no
      booleans
    - Tell `NULL`, `""`, `"N/A"` and `NaN` apart and use `isNull`,
      `coalesce`, `nullif`, `<=>`/`eqNullSafe`, `isnan` and `nanvl`
    - Standardize categories with a mapping table instead of a growing
      `CASE WHEN`, and record a **reject reason** for every bad row
      instead of dropping it

