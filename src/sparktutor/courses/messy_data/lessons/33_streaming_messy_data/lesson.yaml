    ## Sessions with session_window

    A **session** is a burst of activity from one user, separated from
    the next by a gap of inactivity. `session_window` (3.2,
    SPARK-10816) builds them from event time:

    ```python
    sessions = (deduped
                .groupBy("user_id", F.session_window("ts", "5 minutes").alias("s"))
                .agg(F.count("*").alias("events"),
                     F.max(F.col("type") == "checkout").alias("checkout"))
                .select("user_id", F.col("s.start").alias("start"),
                        F.col("s.end").alias("end"), "events", "checkout"))
    ```

    In `append` mode a session is written once, when the watermark
    passes its end (last event plus the gap). After all four drops:

    ```text
    +-------+-------------------+-------------------+------+--------+
    |user_id|start              |end                |events|checkout|
    +-------+-------------------+-------------------+------+--------+
    |u1     |2026-10-05 09:00:51|2026-10-05 09:08:35|3     |false   |
    |u1     |2026-10-05 09:14:46|2026-10-05 09:21:40|3     |false   |
    |u2     |2026-10-05 09:02:03|2026-10-05 09:16:38|7     |true    |
    |u3     |2026-10-05 09:08:51|2026-10-05 09:17:44|3     |false   |
    |u3     |2026-10-05 09:26:22|2026-10-05 09:34:48|3     |false   |
    |u4     |2026-10-05 09:16:51|2026-10-05 09:30:15|6     |false   |
    |u4     |2026-10-05 09:31:31|2026-10-05 09:36:31|1     |false   |
    +-------+-------------------+-------------------+------+--------+
    ```

    - `u1`'s second session includes the late `e028` (09:16:40), and
      `u4`'s first includes the late `e029` (09:22:10): late, but not
      too late.
    - `end` is the last event plus the gap, not the last event.
    - `u5`, `u6` and `u3`'s third session are not there yet. Their ends
      are after the final watermark (09:40:51), so they are still in
      state, waiting for the next run. Append mode trades latency for
      never having to correct a row.
    - `u2`'s session ran on after the checkout (09:11:30) because a
      session window only knows about gaps. A business rule like "a
      checkout ends the session" needs custom state.

