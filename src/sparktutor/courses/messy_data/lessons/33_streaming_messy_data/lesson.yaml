  Output: |
    ## Dead Letters with foreachBatch

    A **dead-letter** table (or folder) keeps the rows a pipeline could
    not use, with the reason, so someone can fix the producer and replay
    them. The built-in sinks write one DataFrame to one place; to split
    a micro-batch in two, use `foreachBatch`, which hands you each
    micro-batch as a plain DataFrame plus its batch id:

    ```python
    def route_batch(batch, batch_id, root):
        batch = batch.persist()          # used twice: compute it once
        try:
            (batch.where("error IS NOT NULL").select("line", "error")
             .write.mode("overwrite").json(f"{root}/dead_letter/batch_id={batch_id}"))
            (batch.where("error IS NULL")
             .select("event_id", "user_id", "type", "page", "ts", "unknown_keys")
             .write.mode("overwrite").parquet(f"{root}/silver/batch_id={batch_id}"))
        finally:
            batch.unpersist()

    (parse_events(spark.readStream.text(inbox), now)
     .writeStream.foreachBatch(lambda df, i: route_batch(df, i, root))
     .option("checkpointLocation", checkpoint)
     .trigger(availableNow=True).start())
    ```

    "Streaming Files: Your First Structured Streaming Job" showed why
    a replayed batch must be harmless (key every write by the batch id
    and overwrite) and why a batch written twice should be persisted.
    Here persisting matters for one more reason: anything
    nondeterministic in the parsing (`current_timestamp()` in a
    production future-event check, a UDF that calls a service), which
    each write job would evaluate again, could otherwise
    route a row to silver in one write and to the dead letters in the
    other. One rule is specific to dead letters:

    - **Write every batch, even an empty one.** The folder
      `dead_letter/batch_id=0` with no rows says "batch 0 had no dead
      letters", which you can tell apart from "batch 0 was never
      written".

    Reading the folders back later, Spark turns `batch_id=N` into a
    `batch_id` column (partition discovery), which is handy for
    tracing a dead letter back to its micro-batch:

    ```text
    +------------+------------------------------------------------------------+--------+
    |       error|                                                        line|batch_id|
    +------------+------------------------------------------------------------+--------+
    |    bad_json|       {"event_id": "e900", "user_id": "u3", "type": "page_v|       1|
    |      bad_ts|{"event_id": "e901", "user_id": "u3", "type": "page_view"...|       1|
    |missing_user|{"event_id": "e902", "type": "page_view", "page": "/", "t...|       1|
    |   future_ts|{"event_id": "e903", "user_id": "u4", "type": "page_view"...|       1|
    +------------+------------------------------------------------------------+--------+
    ```

    Keep the raw `line`, not the parsed columns: the parsed columns of
    a bad row are exactly the ones you cannot trust.

