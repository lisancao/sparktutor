    ## One Event from the Future

    Run the same session query without the `future_ts` check, so the
    event dated 2026-10-06 (a phone a day ahead) reaches
    `withWatermark`:

    ```text
    drop_01.jsonl 0 10 1970-01-01T00:00:00.000Z [('sessionWindowStateStoreSaveExec', 3, 0, 3), ('dedupeWithinWatermark', 10, 0, 10)]
    drop_01.jsonl 1 0 2026-10-05T09:02:44.000Z [('sessionWindowStateStoreSaveExec', 3, 0, 0), ('dedupeWithinWatermark', 10, 0, 0)]
    drop_02.jsonl 2 16 2026-10-05T09:02:44.000Z [('sessionWindowStateStoreSaveExec', 6, 0, 5), ('dedupeWithinWatermark', 20, 1, 10)]
    drop_02.jsonl 3 0 2026-10-06T09:12:00.000Z [('sessionWindowStateStoreSaveExec', 1, 0, 0), ('dedupeWithinWatermark', 1, 0, 0)]
    drop_03.jsonl 4 10 2026-10-06T09:12:00.000Z [('sessionWindowStateStoreSaveExec', 1, 0, 0), ('dedupeWithinWatermark', 1, 10, 0)]
    drop_04.jsonl 5 10 2026-10-06T09:12:00.000Z [('sessionWindowStateStoreSaveExec', 1, 0, 0), ('dedupeWithinWatermark', 1, 10, 0)]
    ```

    (Columns: drop, batch id, input rows, watermark, then per operator:
    name, rows in state, rows dropped by watermark, rows updated.)

    One event moved the watermark to `2026-10-06T09:12:00`, a day
    ahead. From then on **every** real event is "late": 10 of 10 rows
    of drop 3 and 10 of 10 of drop 4 were dropped, and the query
    reported success every time. The watermark never moves backwards,
    so the damage lasts until the event time catches up, here a full
    day, or until you start over with a new checkpoint.

    Defences, cheapest first:

    - Reject events from the future **before** `withWatermark` (the
      `future_ts` dead letter), with a tolerance for ordinary clock
      skew.
    - Prefer a server-side time (when your collector received the
      event) as the watermark column, and keep the device time as data.
    - Alert on `numRowsDroppedByWatermark`. A healthy stream drops a
      few; this one dropped everything.

    Spark offers one more knob: with several watermarked inputs (a
    join, a union), `spark.sql.streaming.multipleWatermarkPolicy`
    (`min` by default) picks the slowest input's watermark, so one
    fast input does not make the others late. `max` would, so leave it
    at `min` for messy sources.

