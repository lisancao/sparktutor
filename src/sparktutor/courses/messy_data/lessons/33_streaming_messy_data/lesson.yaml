    ## Every Row Gets a Reason

    Before routing anything, give each row exactly one `error`, the
    first problem found, or NULL. The order matters: a row that is not
    JSON has no user to complain about.

    ```python
    error = (F.when(F.col("_bad_json"), "bad_json")
             .when(F.col("event_id").isNull(), "missing_event_id")
             .when(F.col("user_id").isNull(), "missing_user")
             .when(F.col("ts").isNull(), "bad_ts")
             .when(F.col("ts") > now + F.expr("INTERVAL 5 minutes"), "future_ts"))
    ```

    Over all four drops, the exercise's `parse_events` finds:

    ```text
    Errors in all drops: {'missing_user': 1, 'future_ts': 1, None: 42, 'bad_json': 1, 'bad_ts': 1}
    ```

    `future_ts` needs a notion of "now". A production job passes
    `F.current_timestamp()`; the exercise passes a fixed
    `2026-10-05 10:00:00` so the results never depend on the day you
    run it. Why bother checking for the future at all? Two sections
    from now, one future event wrecks the whole stream.

