    ## Corrupt Records in a Stream

    The corrupt record column from "JSON Drift and Quarantine" works in
    a stream too. Add it to the schema and drop 2's two broken lines
    show up there:

    ```python
    raw = (spark.readStream
           .schema(SCHEMA + ", _corrupt_record STRING")
           .json(inbox))
    q = (raw.where("_corrupt_record IS NOT NULL")
         .writeStream.format("memory").queryName("corrupt")
         .option("checkpointLocation", f"{work}/ck_b")
         .trigger(availableNow=True).start())
    q.awaitTermination()
    spark.table("corrupt").select("event_id", "ts", "_corrupt_record").show(truncate=45)
    ```

    ```text
    +--------+----+---------------------------------------------+
    |event_id|  ts|                              _corrupt_record|
    +--------+----+---------------------------------------------+
    |    NULL|NULL|{"event_id": "e900", "user_id": "u3", "typ...|
    |    e901|NULL|{"event_id": "e901", "user_id": "u3", "typ...|
    +--------+----+---------------------------------------------+
    ```

    Two details:

    - `e901` (`"ts": "yesterday"`) is valid JSON, but its `ts` could not
      become a TIMESTAMP, so the whole line counts as corrupt, while the
      fields that did parse (`event_id`) are still filled in.
    - The `QUERY_ONLY_CORRUPT_RECORD_COLUMN` rule applies to streams.
      `raw.select("_corrupt_record")` starts fine and then the query
      dies on its first batch:

    ```text
    StreamingQueryException: [STREAM_FAILED] Query [id = ..., runId = ...]
    terminated with exception: [UNSUPPORTED_FEATURE.QUERY_ONLY_CORRUPT_RECORD_COLUMN]
    The feature is not supported: Queries from raw JSON/CSV/XML files are
    disallowed when the referenced columns only include the internal corrupt
    record column (named `_corrupt_record` by default).
    ```

    In a batch job the fix was `cache()`. In a stream, select at least
    one real column next to it, as the filter above does by keeping
    every column.

    The corrupt record column still has the problem from the previous
    section: a renamed field is not corrupt, it is just missing. For
    drifting data there is a better tool.

- Class: text
  Depth: all
  Output: |
    ## Read Lines, Parse with VARIANT

    Read the files with the **text** source instead. Its schema is one
    `value STRING` column, so it can never drift. Then parse each line
    into a VARIANT with `try_parse_json`, and pull fields out with
    `try_variant_get`:

    ```python
    KNOWN_KEYS = ["event_id", "user_id", "type", "event_type", "page", "ts"]
    lines = spark.read.text("data/messy/clickstream/drop_0[23].jsonl")   # or readStream.text(inbox)
    v = lines.select(F.col("value").alias("line"), F.try_parse_json("value").alias("v"))
    events = v.select(
        F.try_variant_get("v", "$.event_id", "string").alias("event_id"),
        F.coalesce(F.try_variant_get("v", "$.type", "string"),
                   F.try_variant_get("v", "$.event_type", "string")).alias("type"),
        F.try_to_timestamp(F.try_variant_get("v", "$.ts", "string")).alias("ts"),
        F.array_except(F.expr("json_object_keys(line)"),
                       F.array(*[F.lit(k) for k in KNOWN_KEYS])).alias("unknown_keys"),
        F.col("v").isNull().alias("bad_json"))
    events.where("bad_json OR ts IS NULL OR size(unknown_keys) > 0").show(4, truncate=False)
    ```

    ```text
    +--------+---------+-------------------+-------------+--------+
    |event_id|type     |ts                 |unknown_keys |bad_json|
    +--------+---------+-------------------+-------------+--------+
    |NULL    |NULL     |NULL               |NULL         |true    |
    |e901    |page_view|NULL               |[]           |false   |
    |e023    |page_view|2026-10-05 09:25:15|[app_version]|false   |
    |e020    |page_view|2026-10-05 09:26:22|[app_version]|false   |
    +--------+---------+-------------------+-------------+--------+
    ```

    What each piece buys you:

    - **`try_parse_json`** returns NULL for the truncated line instead
      of failing. Its strict sibling `parse_json` raises
      `MALFORMED_RECORD_IN_PARSING.WITHOUT_SUGGESTION`, which in a
      stream kills the query.
    - **`try_variant_get`** returns NULL when a path is missing *or*
      the value cannot be cast. `variant_get` raises
      `INVALID_VARIANT_CAST` for `{"n": "two"}` read as `int`.
    - **`coalesce` of both names** absorbs the rename, so drop 3's
      events keep their type.
    - **`unknown_keys`** lists keys you did not expect
      (`json_object_keys` of the line minus `KNOWN_KEYS`). The day
      tracker 2.0 shipped, this column started saying `[app_version]`.
      Alert on it and you hear about the next drift from your own job,
      not from an analyst a month later.

    The row is a VARIANT, so nothing about the stream's schema changes
    when the producer adds, renames or retypes a field. You decide in
    code how to map old and new shapes, and you can redeploy that code
    on the same checkpoint, because the source schema is still `value
    STRING`.

