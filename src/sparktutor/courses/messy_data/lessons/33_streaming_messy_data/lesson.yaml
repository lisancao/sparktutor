- Class: text
  Depth: all
  Output: |
    ## Admission Control and Housekeeping

    "Streaming Files: Your First Structured Streaming Job" covered the
    admission options (`maxFilesPerTrigger`, `maxBytesPerTrigger`,
    `latestFirst`, `maxFileAge`), the oldest-first file order and the
    `sources/0/` log of files read. Two things matter more on messy,
    bursty inboxes. First, files with the same modification time come
    in no guaranteed order: with
    `maxFilesPerTrigger` 1 and `drop_01` and `drop_02` given the same
    modification time, the first batch read `drop_02`. Never rely on
    file order to mean event order; that is what event time (next
    section) is for.

    Second, housekeeping: `cleanSource` (default `off`) set to
    `archive` moves processed files to `sourceArchiveDir`, and `delete`
    deletes them. It has two surprises worth seeing once:

    ```text
    inbox after run1: ['drop_01.jsonl']
    archive: ['/archive/inbox/drop_02.jsonl']
    ```

    - **The last batch's files stay put.** A source is told a batch is
      done (`commit`) when Spark plans the *next* batch, so the files of
      the last batch of a run are archived by the following run. Do not
      treat "the file is still in the inbox" as "it was not processed".
    - **The archive keeps the full path** under `sourceArchiveDir`
      (`archive/inbox/drop_02.jsonl`), and the archive directory must
      not be somewhere the source pattern could match, or the query
      fails on start:

    ```text
    StreamingQueryException: [STREAM_FAILED] ... requirement failed: Base archive
    path cannot be set to the path where archived path can possibly match with
    source pattern. Ensure the base archive path doesn't match with source pattern
    in depth, where the depth is minimum of depth on both paths.
    ```

    Forgetting `sourceArchiveDir` fails the same way with `Archive mode
    must be used with 'sourceArchiveDir' option.`

    The `sources/0/` log of files read is why the built-in source does
    not have the "old modification time" blind spot of the hand-written reader in
    "Streaming Readers and Writers", and also why a file that is
    rewritten in place under the same name is **not** read again.

- Class: text
  Depth: all
  Output: |
    ## Event Time and Watermarks

    "Streaming Files: Your First Structured Streaming Job" introduced
    the watermark on clean data: `withWatermark("ts", "10 minutes")`
    means watermark = (largest `ts` seen so far) minus 10 minutes,
    stateful operators drop events at or below it, and it is computed
    at the **end** of a micro-batch and used by the **next** one. On
    the clickstream, here is the session query of the exercise, one
    drop per run (from `query.recentProgress`):

    ```text
    drop_01.jsonl: session batches [0, 1], watermark 2026-10-05T09:02:44.000Z, late rows 0
    drop_02.jsonl: session batches [2, 3], watermark 2026-10-05T09:14:54.000Z, late rows 1
    drop_03.jsonl: session batches [4, 5], watermark 2026-10-05T09:26:06.000Z, late rows 0
    drop_04.jsonl: session batches [6, 7], watermark 2026-10-05T09:40:51.000Z, late rows 3
    ```

    - Drop 1's newest event is 09:12:44, so after its batch the
      watermark is 09:02:44.
    - Each run made **two** batches although each drop is one file.
      The second has no input: it is a **no-data batch**, which Spark
      runs for stateful queries when the watermark moved, so state can
      be emitted and evicted without waiting for more data
      (`spark.sql.streaming.noDataMicroBatches.enabled`, default
      `true`). With `availableNow`, this is what makes finished
      sessions appear at the end of a run.
    - Drop 3's two out-of-order events (09:16:40 and 09:22:10) are late
      by the clock but not by the watermark (09:14:54), so they are
      kept and join their users' sessions.
    - Drop 2's one late row is the re-sent `e001` (09:00:51, below
      09:02:44). Drop 4's three are its two 09:05 events and the
      re-sent `e023` (09:25:15, below 09:26:06). The re-sends are
      counted as late, not as duplicates: the watermark filter runs
      before the duplicate check.

    Late rows are counted per stateful operator in
    `progress.stateOperators[i].numRowsDroppedByWatermark`. Watch that
    number in production: a sudden rise means a producer is buffering
    events, or a clock is wrong.

    Late events are only late for the stateful query. The silver folder
    from `foreachBatch` keeps all 38 unique events, the 09:05 ones
    included, because an event that happened is still a fact even if
    it missed its session.

- Class: text
  Depth: beginner
  Output: |
    A watermark works like the "doors close" time at a concert. Once the
    doors close, people who arrive are turned away, even if their ticket
    is valid. Here the doors close 10 minutes after the latest arrival
    anyone has seen, and the time is only updated between batches, like
    a sign someone changes once per song.

