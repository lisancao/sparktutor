    ## The Clickstream Drops

    `data/messy/clickstream/` holds four JSON Lines files that a web
    shop's tracker uploaded one after another. Each line is an event:

    ```json
    {"event_id": "e001", "user_id": "u1", "type": "page_view", "page": "/p/chair", "ts": "2026-10-05T09:00:51"}
    ```

    | File | Event time | What is wrong with it |
    |---|---|---|
    | `drop_01.jsonl` | 09:00 to 09:12 | nothing |
    | `drop_02.jsonl` | 09:10 to 09:24 | two events re-sent from drop 1, one line sent twice, a truncated line, `"ts": "yesterday"`, an event with no `user_id`, and an event dated **2026-10-06** from a device whose clock is a day ahead |
    | `drop_03.jsonl` | 09:16 to 09:36 | tracker 2.0: `type` is now `event_type`, and a new field `app_version` appears; two events arrive a few minutes out of order |
    | `drop_04.jsonl` | 09:05 to 09:50 | one event re-sent from drop 3, and two events from 09:05, far too late |

    The lesson streams the drops in that order, one per run, the way a
    scheduled job would meet them. Every number below comes from doing
    exactly that.

- Class: text
  Depth: all
  Output: |
    ## The Schema Is Fixed When the Query Starts

    A batch read can look at the files and infer a schema. A stream
    cannot, because the files it will read do not exist yet. Streaming
    file sources therefore require a schema, as you saw in "Streaming
    Files: Your First Structured Streaming Job" (`Schema must be specified when creating a streaming source
    DataFrame`). There is an escape hatch,
    `spark.sql.streaming.schemaInference` (default `false`): with it set
    to `true`, Spark infers the schema **once, when the query starts**,
    from the files already in the folder. With only drop 1 present, and
    then again after drop 3 arrived and the query was restarted:

    ```text
    schema: struct<event_id:string,page:string,ts:string,type:string,user_id:string>
    schema: struct<app_version:string,event_id:string,event_type:string,page:string,ts:string,type:string,user_id:string>
    ```

    New fields are invisible until the next restart, and every restart
    lists and samples the whole folder again, which gets slow as the
    folder grows. The usual choice is an explicit schema. Here is the
    tracker 1.0 schema meeting tracker 2.0's drop 3:

    ```python
    SCHEMA = "event_id STRING, user_id STRING, type STRING, page STRING, ts TIMESTAMP"
    q = (spark.readStream.schema(SCHEMA).json(inbox)
         .writeStream.format("memory").queryName("v1_schema")
         .option("checkpointLocation", f"{work}/ck_a")
         .trigger(availableNow=True).start())
    q.awaitTermination()
    spark.table("v1_schema").show(3)
    ```

    ```text
    +--------+-------+----+--------+-------------------+
    |event_id|user_id|type|    page|                 ts|
    +--------+-------+----+--------+-------------------+
    |    e023|     u4|NULL| /search|2026-10-05 09:25:15|
    |    e020|     u3|NULL|/p/chair|2026-10-05 09:26:22|
    |    e021|     u3|NULL| /search|2026-10-05 09:27:26|
    +--------+-------+----+--------+-------------------+
    ```

    All 10 rows of drop 3 have `type` NULL, and nothing failed. A JSON
    reader ignores fields that are not in the schema (`event_type`,
    `app_version`) and fills missing ones with NULL. **Drift against a
    fixed schema is silent data loss**, which is worse than a crash.

