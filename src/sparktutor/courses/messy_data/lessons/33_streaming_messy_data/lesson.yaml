    ## transformWithState Gotchas (4.2.0)

    - **RocksDB is required.** With the default state store the query
      fails on its first batch:

    ```text
    [UNSUPPORTED_FEATURE.STORE_BACKEND_NOT_SUPPORTED_FOR_TWS] The feature is not
    supported: Store backend
    org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider is
    not supported by TransformWithState operator. Please use
    RocksDBStateStoreProvider.
    ```

    - **Timestamps in state lose their time zone.** The first version
      of this processor kept `start` and `last` as `TIMESTAMP` in state
      and failed in the second batch with `TypeError: can't subtract
      offset-naive and offset-aware datetimes`. Input rows arrived as
      timezone-aware UTC datetimes (the session time zone was UTC),
      while values read back from state were naive datetimes in the
      worker's local time zone (a 09:06:09 UTC event came back as
      02:06:09 on a machine in Pacific time). Store epoch milliseconds
      (`F.unix_millis`) and convert at the end with
      `F.timestamp_millis`, and the problem cannot happen.
    - **Event-time timers are compared with the watermark**, so they
      only fire in batches; with `availableNow`, the no-data batch at
      the end of a run is the one that fires them.
    - **TTL** is processing time: `getValueState(name, schema,
      ttlDurationMs)` expires a value that has not been updated for
      that long *by the clock*, whatever the event times say. Use it to
      bound state for users who never come back, not as session logic.
    - **Read the state back** with the state data source from the
      learning_spark course. After the run, two users still had open
      sessions:

    ```python
    spark.read.format("statestore").option("stateVarName", "session").load(checkpoint).show()
    ```

    ```text
    +----+---------------------------------+------------+
    |key |value                            |partition_id|
    +----+---------------------------------+------------+
    |{u3}|{1791193507000, 1791193507000, 1}|1           |
    |{u6}|{1791193851000, 1791193851000, 1}|1           |
    +----+---------------------------------+------------+
    ```

    `format("state-metadata")` lists the operator and its state
    variables, including the hidden `$eventTimers_keyToTimestamp`
    timer state. "Streaming Internals: Checkpoints, State and Real-Time
    Mode" in the advanced level opens these files byte by byte.

