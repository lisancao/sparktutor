    ## Exercise: A Clickstream That Survives Its Producers

    Complete three functions in the starter:

    1. `parse_events(lines, now)`: from a DataFrame with one `value`
       column, return `line, event_id, user_id, type, page, ts,
       unknown_keys, error`. Read both `type` and `event_type`, list
       unknown keys, and set `error` to `bad_json`,
       `missing_event_id`, `missing_user`, `bad_ts` or `future_ts`
       (later than `now` plus `CLOCK_SKEW`), first match wins.
    2. `route_batch(batch, batch_id, root)`: the `foreachBatch` body.
       Dead letters (`line`, `error`) as JSON in
       `root/dead_letter/batch_id=<id>`; valid events, deduplicated
       within the batch and against silver's *other* batches, as
       Parquet in `root/silver/batch_id=<id>`. Overwrite both.
    3. `sessions(events)`: valid events, a 10 minute watermark,
       `dropDuplicatesWithinWatermark` on `event_id`, 5 minute session
       windows, with `events` (count) and `checkout` columns.

    The harness first tests `parse_events` on a batch DataFrame of all
    four drops (42 clean lines, one of each error, 20 drifted lines with
    their type intact). Then it copies the drops into an inbox one at a
    time and restarts both streaming queries from their checkpoints
    after each drop. It checks 4 dead letters, 38 unique events in
    silver, 7 finished sessions (including `u2`'s 7-event session with a
    checkout) and exactly 4 rows dropped by the watermark. Finally it
    deletes the last ingest commit, so Spark replays that batch, and
    checks that silver and the dead letters did not change.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "type: F.coalesce of try_variant_get on $.type and $.event_type. unknown_keys: F.array_except(F.expr('json_object_keys(line)'), F.array(*[F.lit(k) for k in KNOWN_KEYS])). error: a chain of F.when, with now + F.expr(f'INTERVAL {CLOCK_SKEW}') for future_ts. route_batch: persist, write dead letters with mode('overwrite').json, then dropDuplicates(['event_id']) and a left_anti join against spark.read.parquet(silver).where(F.col('batch_id') != batch_id)."

