    ## Custom State with transformWithState

    "Structured Streaming" in the learning_spark course introduced
    `transformWithState`: a `StatefulProcessor` with state variables and
    timers, available in Python as `transformWithStateInPandas` (4.0)
    and the `Row`-based `transformWithState` (4.1). Here is a
    sessionizer that ends a session at a checkout *or* after 5 minutes
    of silence:

    ```python
    GAP_MS = 5 * 60 * 1000

    class Sessionizer(StatefulProcessor):
        def init(self, handle):
            self.handle = handle
            # epoch milliseconds, not TIMESTAMP: see the time zone gotcha below
            self.session = handle.getValueState("session", "start_ms BIGINT, last_ms BIGINT, n INT")

        def _row(self, key, s, reason):
            return Row(user_id=key[0], start_ms=s[0], end_ms=s[1], n=s[2], reason=reason)

        def handleInputRows(self, key, rows, timerValues):
            cur = self.session.get() if self.session.exists() else None
            for r in sorted(rows, key=lambda r: r.ts_ms):
                if cur is not None and r.ts_ms - cur[1] > GAP_MS:
                    yield self._row(key, cur, "timeout")
                    cur = None
                cur = (r.ts_ms, r.ts_ms, 1) if cur is None else (cur[0], max(cur[1], r.ts_ms), cur[2] + 1)
                if r.type == "checkout":
                    yield self._row(key, cur, "checkout")
                    cur = None
            for t in self.handle.listTimers():
                self.handle.deleteTimer(t)
            if cur is None:
                self.session.clear()
            else:
                self.session.update(cur)
                self.handle.registerTimer(cur[1] + GAP_MS)   # event time, in ms

        def handleExpiredTimer(self, key, timerValues, expiredTimerInfo):
            if self.session.exists():
                s = self.session.get()
                self.session.clear()
                yield self._row(key, s, "timeout")

        def close(self):
            pass

    spark.conf.set("spark.sql.streaming.stateStore.providerClass",
                   "org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider")
    sessions = (events.withColumn("ts_ms", F.unix_millis("ts"))
                .withWatermark("ts", "10 minutes").groupBy("user_id")
                .transformWithState(statefulProcessor=Sessionizer(),
                                    outputStructType="user_id STRING, start_ms BIGINT, end_ms BIGINT, n INT, reason STRING",
                                    outputMode="Append", timeMode="EventTime"))
    ```

    With `timeMode="EventTime"`, a timer fires when the **watermark**
    passes it, so a quiet user's session is closed by the no-data batch
    at the end of a run. After the four drops (no deduplication in this
    version, so `u1`'s second session counts the twice-sent `e012`):

    ```text
    +-------+-------------------+-------------------+---+--------+
    |user_id|start              |end                |n  |reason  |
    +-------+-------------------+-------------------+---+--------+
    |u1     |2026-10-05 09:00:51|2026-10-05 09:03:35|3  |timeout |
    |u1     |2026-10-05 09:14:46|2026-10-05 09:16:40|4  |timeout |
    |u2     |2026-10-05 09:02:03|2026-10-05 09:11:30|7  |checkout|
    |u2     |2026-10-05 09:11:38|2026-10-05 09:11:38|1  |timeout |
    |u3     |2026-10-05 09:08:51|2026-10-05 09:12:44|3  |timeout |
    |u3     |2026-10-05 09:26:22|2026-10-05 09:29:48|3  |timeout |
    |u4     |2026-10-05 09:16:51|2026-10-05 09:25:15|6  |timeout |
    |u4     |2026-10-05 09:31:31|2026-10-05 09:31:31|1  |timeout |
    |u5     |2026-10-05 09:30:55|2026-10-05 09:41:30|6  |checkout|
    |u6     |2026-10-05 09:41:51|2026-10-05 09:42:34|2  |timeout |
    +-------+-------------------+-------------------+---+--------+
    ```

    `u2` and `u5` now end at their checkouts, and `end` is the last
    event (this processor's choice), not last event plus gap.

