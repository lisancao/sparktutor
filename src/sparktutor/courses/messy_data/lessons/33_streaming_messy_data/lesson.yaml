    ## What You'll Learn

    "Streaming Files: Your First Structured Streaming Job" taught the
    core on a folder of clean JSON: the schema a stream needs,
    micro-batches, admission control (`maxFilesPerTrigger`,
    `maxBytesPerTrigger`, file order), the checkpoint and a restart,
    idempotent `foreachBatch` writes, and watermarks. "Streaming Readers
    and Writers" built a
    stream reader and an idempotent stream writer from scratch. This
    lesson takes the built-in file source into the real world, where
    the files a tracker uploads are not clean:

    - lines that are cut off, timestamps that are not timestamps,
      events with no user
    - a tracker upgrade that renames a field halfway through the day
    - events sent twice, events that arrive out of order, events that
      arrive far too late
    - a phone whose clock is a day ahead

    By the end you will be able to:

    - Explain why a stream's schema is fixed when the query starts, and
      what that means when the data drifts
    - Read drifting JSON as text and parse it with VARIANT so that drift
      never fails the query, and detect new fields as they appear
    - Route bad rows to a dead-letter folder with `foreachBatch`,
      written so that a replayed batch changes nothing
    - Archive processed files with `cleanSource`, know its surprises,
      and know why file order is not event order
    - Reason about event time: watermarks, late data, and why one event
      from the future can silently drop everything after it
    - Remove duplicates with bounded state
      (`dropDuplicatesWithinWatermark`), build sessions with
      `session_window`, and write custom state with
      `transformWithState`
    - Know which query changes a checkpoint survives, and which fail
      with which error

    It also uses "JSON Drift and Quarantine" (corrupt records) and
    "VARIANT Basics: Profiling and Nested Data" (`parse_json`,
    `variant_get`).

