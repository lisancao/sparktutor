    ## What a Checkpoint Survives

    A stateful query's checkpoint stores the state's schema and the list
    of stateful operators. Restarting the session query (one drop
    processed) with a changed query gave:

    | Change | Result on restart |
    |---|---|
    | session gap 5 to 10 minutes | runs, although the sessions already in state were built with the old gap |
    | watermark delay 10 to 20 minutes | runs |
    | a filter after the aggregation | runs |
    | group by `user_id, event_id` instead of `user_id` | `STATE_STORE_KEY_SCHEMA_NOT_COMPATIBLE` |
    | one more aggregate (`max("ts")`) | `STATE_STORE_VALUE_SCHEMA_NOT_COMPATIBLE` |
    | add `dropDuplicatesWithinWatermark` before the window | `STREAMING_STATEFUL_OPERATOR_NOT_MATCH_IN_STATE_METADATA` |
    | switch the state store to RocksDB | runs, **still on the old store**: the checkpoint's recorded `spark.sql.streaming.stateStore.providerClass` wins over the session's |

    The key schema error, for example:

    ```text
    [STATE_STORE_KEY_SCHEMA_NOT_COMPATIBLE] Provided key schema does not match
    existing state key schema. Please check number and type of fields.
    Existing key_schema=StructType(StructField(user_id,StringType,true),
    StructField(sessionStartTime,TimestampType,false)) and new
    key_schema=StructType(StructField(user_id,StringType,true),
    StructField(event_id,StringType,true),StructField(sessionStartTime,TimestampType,false)).
    If you want to force running the query without schema validation, please set
    spark.sql.streaming.stateStore.stateSchemaCheck to false.
    ```

    Do not take the last sentence's advice: reading state with the
    wrong schema gives undefined results. The rules that follow:

    - Stateless changes (filters, projections, the parsing code) are
      safe. This is the payoff of parsing in code from a `value STRING`
      source: fixing a drift mapping is a stateless change.
    - Changing keys, aggregates or the set of stateful operators needs a
      new checkpoint, and so does changing the state store.
    - Changing a parameter that state depends on (gap, delay) is
      accepted and can quietly mix two behaviours. Treat it as a new
      query unless mixed results are acceptable.
    - A new checkpoint means reprocessing from the files, so keep raw
      input (or a bronze table) long enough to rebuild from.

