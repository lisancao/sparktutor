    ## Duplicates with Bounded State

    `dropDuplicates(["event_id"])` on a stream remembers every
    `event_id` forever, and the state grows without end.
    `dropDuplicatesWithinWatermark` (3.5, SPARK-42931) remembers each
    id only until the watermark passes the event's time plus the delay,
    which is enough for re-sends that arrive within the delay:

    ```python
    deduped = (events.where("error IS NULL")
               .withWatermark("ts", "10 minutes")
               .dropDuplicatesWithinWatermark(["event_id"]))
    ```

    In the run above, drop 2's re-sent `e005` (09:04:23, still above
    the watermark of 09:02:44) was removed as a duplicate; the re-sent
    `e001` (09:00:51) was removed as late before the duplicate check
    even looked at it. Either way it is gone, but they land in
    different counters, which matters when you read the metrics.

    The docstring states the guarantee precisely: "Events are
    deduplicated as long as the time distance of earliest and latest
    events are smaller than the delay threshold of watermark." So
    choose the delay from how late re-sends really arrive, not only
    from how late first sends arrive. The plain `dropDuplicates` on a
    stream can only evict state when the event time column is one of
    its keys, and then two copies with different times are not
    duplicates at all.

