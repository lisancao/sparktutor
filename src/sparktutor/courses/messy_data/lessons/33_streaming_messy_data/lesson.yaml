    ## Taking It Further

    - **Replay dead letters.** Once the producer fix ships, a batch job
      can read `dead_letter/`, re-parse `line` with the new rules, and
      write the rows that now pass into silver with a new `batch_id`
      range (for example negative ids), so the replay is itself
      idempotent.
    - **Multi-hop streaming.** Make silver a Delta table and run the
      session query as a second stream over it (`readStream` on the
      Delta table), so parsing happens once. Overwriting a batch folder
      that a downstream file stream has already read would make it read
      the new files again; a Delta table's transaction log avoids that.
    - **Drift alerts.** A small query over silver
      (`explode(unknown_keys)` grouped by key and day) is a drift
      dashboard; add a `StreamingQueryListener` to log each batch's
      dead-letter count.
    - **Real-Time Mode** (PySpark in 4.2) lowers latency, but in 4.2.0
      only for stateless queries from Kafka in update mode; the
      learning_spark course's "Structured Streaming" lesson lists the
      constraints. This pipeline could not use it even for the
      stateless parsing and routing: "Streaming Internals: Checkpoints,
      State and Real-Time Mode" shows the file source and the
      `foreachBatch` sink are both rejected, and the sessions are
      stateful.

- Class: text
  Depth: all
  Output: |
    ## Summary

    - A stream's schema is fixed when the query starts. Against a fixed
      schema, drift is silent: renamed fields become NULL. Reading JSON
      Lines as text and parsing with `try_parse_json` and
      `try_variant_get` makes drift a code change, and an
      `unknown_keys` column tells you when it happens.
    - Corrupt records work in streams, but a query that references only
      `_corrupt_record` fails at its first batch with
      `UNSUPPORTED_FEATURE.QUERY_ONLY_CORRUPT_RECORD_COLUMN`.
    - `foreachBatch` splits a micro-batch into silver and dead letters.
      Persist the batch, overwrite folders keyed by `batch_id`, and a
      replayed batch changes nothing.
    - The file source reads oldest first with no order among equal
      modification times, remembers files in `sources/0`, and with
      `cleanSource` moves a batch's files only when the next batch is
      planned.
    - The watermark (max event time minus delay) is updated between
      batches; no-data batches emit and evict state. One event from the
      future pushes it ahead and drops everything after it, so reject
      future events before `withWatermark`.
    - `dropDuplicatesWithinWatermark` (3.5) bounds deduplication state;
      `session_window` (3.2) builds gap-based sessions;
      `transformWithState` handles custom rules but needs RocksDB, and
      state is safest in epoch milliseconds. `TwsTester` (4.2) unit-tests
      processors.
    - Checkpoints reject changed keys, aggregates and operators with
      named errors, silently accept changed gaps and delays, and keep
      their original state store.

    Next: **Production Ingestion: Quality Rules, Quarantine and
    Pipelines**, which turns the dead-letter idea into rules as data,
    quality gates and a Declarative Pipeline.
