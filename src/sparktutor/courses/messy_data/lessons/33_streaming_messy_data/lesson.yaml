    ## Unit-Testing a Processor with TwsTester (4.2)

    Spark 4.2 added `pyspark.sql.streaming.TwsTester` (SPARK-54805),
    which runs a `StatefulProcessor` without a stream, so the session
    logic gets ordinary unit tests:

    ```python
    from pyspark.sql.streaming import TwsTester

    M = 60_000
    T0 = 1_791_190_800_000  # 2026-10-05 09:00 UTC
    t = TwsTester(Sessionizer(), timeMode="EventTime", eventTimeExtractor=lambda r: r.ts_ms)
    print(t.test("u1", [Row(user_id="u1", type="page_view", ts_ms=T0 + 0),
                        Row(user_id="u1", type="page_view", ts_ms=T0 + 2 * M)]))
    print(t.peekValueState("session", "u1"))
    print(t.test("u1", [Row(user_id="u1", type="page_view", ts_ms=T0 + 10 * M)]))
    print(t.test("u2", [Row(user_id="u2", type="page_view", ts_ms=T0 + 20 * M)]))
    print(t.setWatermark(T0 + 26 * M))
    ```

    ```text
    []
    (1791190800000, 1791190920000, 2)
    [Row(user_id='u1', start_ms=1791190800000, end_ms=1791190920000, n=2, reason='timeout')]
    []
    [Row(user_id='u2', start_ms=1791192000000, end_ms=1791192000000, n=1, reason='timeout')]
    ```

    `setWatermark` fires the timers at or below the new watermark and
    returns what `handleExpiredTimer` yielded. Its docstring lists what
    it does not simulate: TTL, and the automatic watermark that a real
    stream computes per batch. One trap: the tester's watermark starts
    at 0 and late events (event time at or below the watermark) are
    filtered, so a test that uses `ts_ms=0` silently loses its first
    row. Use realistic epoch times, as above.

