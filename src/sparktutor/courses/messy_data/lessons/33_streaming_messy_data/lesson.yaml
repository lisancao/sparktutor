  Output: |
    ## Duplicates Across Batches, Without State

    Inside `foreachBatch` the batch is an ordinary DataFrame, so
    `dropDuplicates(["event_id"])` removes duplicates *within* the
    batch (drop 2 sends `e012` twice). Duplicates *across* batches
    (drop 2 re-sends `e001` from drop 1) need a memory of what was
    already written. The silver folder is that memory: anti-join the
    batch against the event ids of every *other* batch.

    ```python
    seen = (spark.read.parquet(f"{root}/silver")
            .where(F.col("batch_id") != batch_id).select("event_id"))
    good = good.join(seen, "event_id", "left_anti")
    ```

    `!= batch_id`, not "all of silver": on a replay of batch 3, silver
    already holds batch 3's own rows, and excluding them would make the
    replay write an empty batch. With the filter, a replay recomputes
    exactly the same rows and overwrites them with themselves.

    This lookup grows with the table, so on large tables it becomes a
    `MERGE INTO` against a Delta table keyed on `event_id` (see
    "Landing Messy Data in Delta Lake"), which does the same job with
    file skipping. "Duplicates with Bounded State" below shows the
    streaming alternative, which keeps a bounded amount of state
    instead of a lookup.

