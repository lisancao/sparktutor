- Class: text
  Depth: all
  Output: |
    ## What You'll Learn

    This is the last lesson of the course, and it is a project rather
    than a lesson: you build a complete connector for a messy format you
    have not seen before, and a harness grades every capability on its
    own so you can work through it in stages.

    "Capstone: An Unstructured Ingestion Source and a Catalog Pipeline"
    at the end of the intermediate level built one
    reader with one pushed filter and an inbox stream. This project asks
    for everything a connector your team could rely on needs, at once:

    | Capability | Built on (by title) |
    |---|---|
    | partitions planned by bytes | "Reading a Custom File Format, in Parallel" |
    | loose metadata as VARIANT | "VARIANT Basics: Profiling and Nested Data" |
    | exact filter pushdown, safe from the 4.2.0 leak | "Filter Pushdown", "From Wrong Results to a Fix: An Upstream Case Study" |
    | a writer with an atomic commit | "Writers" |
    | a stream with byte offsets, admission control and restart | "Streaming Readers and Writers" |
    | logs you can read back from executors | "Packaging, Registration, Testing and Debugging" |
    | a test suite that runs without Spark, and catches broken code | "Packaging, Registration, Testing and Debugging" |
    | a written design review | everything above |

    It is harder than the capstone in three ways. There are three
    tables with three grains instead of one. The format has two
    versions and planted problems that must become data, not crashes.
    And the harness checks properties, not just answers: that no batch
    exceeds its byte budget, that a failed write leaves the folder
    byte-for-byte as it was, that a stream and a batch read of the same
    folder agree row for row, and that your tests fail on deliberately
    broken versions of your own functions.

    The lesson describes the format, the contract and each stage's
    design problems. It shows the reference solution's output, but not
    its code; that is in `solution.py` for when you are done or stuck.
    A Java (DSv2) path is described at the end for those who did "A
    DSv2 Connector in Java"; the harness grades the Python one.

