  Depth: all
  Output: |
    ## Stage offline_tests: Tests That Catch Broken Code

    `OfflineTests` is a plain `unittest.TestCase` that needs no Spark:
    parsers, statuses, the planner, and a reader driven by hand
    (`partitions()` then `read()`, with `schema=None`; the reader then
    takes the column names from the DDL string, because building a
    `StructType` from DDL needs a running session). The harness checks
    that no SparkContext exists before and after, that there are at
    least five tests, and that they pass.

    Passing is the easy half. A test suite is only as good as the bugs
    it catches, so the harness also does **mutation testing**: it swaps
    one of your functions for a broken version, runs your suite again,
    and expects at least one failure. The broken versions are:

    - a planner that ignores the byte target, and one that splits by
      count instead of bytes
    - an index parser that forgets the BOM, treats version 1 as broken,
      ignores time zone offsets, or accepts any priority
    - a change parser that keeps the `\r` of CRLF lines, or accepts
      lines without `->`
    - a checksum check that always says ok

    A surviving mutant is reported by name ("your tests did not catch:
    an index parser that forgets the BOM"). The swap replaces the
    module-level name, so call your functions by name in the tests (not
    through a saved reference). Write each test so it would fail for
    one specific bug; a single test that checks everything at once
    tells you less when it fails.

