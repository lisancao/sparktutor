    ## Stage design_review: Write It Down

    A connector outlives its author. `DESIGN_REVIEW` in the exercise is
    a Markdown string with five sections; the harness checks they exist,
    have at least 30 words each, that Failure modes has at least four
    bullets, and that Decisions mentions partitions, offsets, the
    manifest and VARIANT. The template:

    ```markdown
    ## Decisions
    For each choice: what you chose, the alternatives, and why.
    Tables and grain, partition planning, VARIANT for metadata, stream
    offsets, the commit protocol, pushdown.

    ## Trade-offs
    What each choice costs, and at what scale you would choose differently.

    ## Failure modes
    - One bullet per failure: what happens, what the user sees, what is
      left on disk. Task failure, rejected commit, the driver dying at
      the worst moment, a log rewritten instead of appended, a corrupt
      index, a filter you push but apply wrongly.

    ## Testing
    What runs without Spark, what needs a session, and what each test
    would catch.

    ## What I would change for production
    The next three things, in order.
    ```

    Questions worth answering in yours: what happens if the driver dies
    between `os.replace` and the cleanup? What if a log shrinks? Which
    planted problem does your connector *not* report (the reference does
    not flag out-of-order change lines; why not, in a stream)?

