    ## The Format: Case Files

    `data/messy/casefiles` is an export from a made-up help desk, the
    kind of thing ticketing and legal systems produce:

    ```text
    casefiles/
      CASE-0001/
        case.json          the index: metadata plus the list of attachments
        attachments/       request.eml, invoice_1001.pdf
        changes.log        one line per change to the case
      CASE-0002/ ... CASE-0010/, case-0009/
      README.txt  .DS_Store  _staging/job-3f2a/CASE-0099/   (not cases)
    ```

    A version 2 index (`CASE-0004/case.json`, start):

    ```json
    {
      "schema": 2,
      "case_id": "CASE-0004",
      "opened": "2026-03-09T10:00:00Z",
      "status": "waiting",
      "priority": "P2",
      "tags": [
        "damaged"
      ],
      "meta": {
        "customer": {
          "id": "C021",
          "tier": "silver"
        },
        "order": 1044
      },
      "attachments": [
        {
          "name": "phot
    ```

    Each attachment entry has `name`, `sha256` and `bytes`. Older cases
    use version 1, with other names and types for the same things
    (`CASE-0007/case.json`):

    ```json
    {
      "id": "case-0007",
      "created": 1772616600,
      "state": "OPEN",
      "prio": 2,
      "labels": "billing, vip",
      "attachments": [
        "photo.png"
      ],
      "extra": {
        "imported_from": "legacy-crm",
        "legacy_id": 7731
      }
    }
    ```

    The change log is one change per line,
    `<ISO timestamp> | <field> | <old> -> <new> | <actor>`
    (`CASE-0006/changes.log`):

    ```text
    2026-03-12T09:00:00Z | status | new -> open | ana
    2026-03-12T09:07:00Z | status | open -> triage | ana
    2026-03-12T09:14:00Z | priority | P2 -> P1 | emma
    2026-03-12T08:00:00Z | status | open -> resolved | emma
    ```

    (The last line is out of order: its time is earlier than the line
    before it.) The generator is `scripts/messy_gen/casefiles.py`; its
    `PROBLEMS` dictionary lists what is planted where:

    | Case | Problem |
    |---|---|
    | CASE-0001 | none (a comment line and a trailing blank line in the log) |
    | CASE-0002 | none, but `call.wav` is 40044 bytes, far more than the rest |
    | CASE-0003 | the log's last line has no newline |
    | CASE-0004 | the index lists `scan.png`, which is not on disk; a malformed log line |
    | CASE-0005 | `stray.tmp` is on disk but not in the index |
    | CASE-0006 | `receipt.pdf` does not match its `sha256`; an out-of-order log line |
    | CASE-0007 | version 1 index |
    | CASE-0008 | `case.json` is truncated (invalid JSON) |
    | case-0009 | lowercase folder, UTF-8 BOM and CRLF line endings, `+02:00` offset |
    | CASE-0010 | priority `"urgent"`; a blank line and a line without `->` in the log |

    The BOM is visible in the first bytes of `case-0009/case.json`
    (`od -c`):

    ```text
    0000000 357 273 277   {  \n           "   s   c   h   e   m   a   "   :
    ```

