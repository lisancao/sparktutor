    ## Stage logs: Tell Someone What Was Wrong

    Problems are data (the `problems` and `status` columns), but an
    operator also wants to see them without writing a query. The reader
    logs one warning per problem under the logger `casefile`
    (`"CASE-0004 missing_attachment"`, `"CASE-0006 sha_mismatch receipt.pdf"`),
    and the harness reads them back with `python_worker_logs()`, polling
    because they arrive asynchronously ("Packaging, Registration,
    Testing and Debugging").

    A gotcha from building the reference: with a module-level
    `log = logging.getLogger("casefile")` plus
    `log.addHandler(logging.NullHandler())`, every warning still
    appeared on the job's stderr. A `Logger` pickles **by name** (since
    Python 3.7), so the worker gets a fresh logger with no handlers, and
    Python's last-resort handler prints the warning. Get the logger where
    you log, and add the handler there (the given `get_log()` does).
    The `NullHandler` only silences records nobody collects: with
    `spark.sql.pyspark.worker.logging.enabled` on, they still reach
    `python_worker_logs()`.

