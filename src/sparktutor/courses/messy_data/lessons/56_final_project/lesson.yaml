    ## Stage planning: Partitions by Bytes

    `plan_by_bytes(items, target)` groups `(key, size)` pairs so each
    group holds at most `target` bytes, with **first fit decreasing**:
    largest first (ties by key), each into the first group that still
    has room, a new group otherwise; an item bigger than the target gets
    a group of its own. On the harness's example:

    ```text
    plan_by_bytes([("a", 50), ("b", 30), ("c", 30), ("d", 20), ("big", 500)], 60)
    [['big'], ['a'], ['b', 'c'], ['d']]
    ```

    What is an item? It depends on the table, because the cost of a
    task is the bytes it reads:

    - **attachments**: one item per file on disk, `((folder, name), size)`.
      Computing a checksum reads every byte, so the 40 KB recording
      should not share a task with the other files.
    - **cases**: one item per folder, sized by its `case.json`; the
      cases table never reads attachment bytes (it only lists names and
      sizes).
    - **changes**: one item per folder, sized by its `changes.log`.

    The reference plan for the attachments, with the default target:

    ```text
    1 [('CASE-0002', 'call.wav')]
    13 [('CASE-0001', 'invoice_1001.pdf'), ('CASE-0006', 'receipt.pdf'), ('case-0009', 'lettre.eml')]
    ```

    (one partition with the recording, one with the other 13 files; the
    first three keys of each are shown.) Files of one case can land in
    different partitions, so decide which task emits the rows that have
    no file at all (`scan.png` of CASE-0004). The reference gives them
    to the task that holds the folder's first file by name.

    `list_case_folders(root)` decides what a case is: a folder with a
    `case.json`, not starting with `_` or `.`, and not a job folder
    (`name@job`, below). With a manifest it returns exactly what the
    manifest lists. `README.txt`, `.DS_Store` and `_staging/` are not
    cases.

    A gotcha for this stage: if your `partitions()` raises
    `NotImplementedError` (a natural placeholder), Spark does not fail.
    `write_read_func_and_partitions` in
    `python/pyspark/sql/worker/plan_data_source_read.py` catches it, for
    readers written against an old base class, and plans a single
    `InputPartition(None)` instead. Your `read()` then receives a
    partition it does not expect. That is why the exercise's
    placeholders raise their own `TODO` exception.

