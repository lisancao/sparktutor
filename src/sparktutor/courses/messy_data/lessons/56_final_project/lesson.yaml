    ## Stage streaming: Byte Offsets and Partial Lines

    The changes table also streams, for logs that keep growing. The
    offset is a byte position per log, plus a line count so rows keep
    their line numbers:

    ```text
    {"v": 1, "pos": {"CASE-0001": [343, 8], "CASE-0002": [51, 1]}}
    ```

    (that is the end offset of the reference's first micro-batch: all
    343 bytes and 8 lines of CASE-0001's log, and the first line of
    CASE-0002's.) The design rules:

    - **Only complete lines.** A line counts once its newline has been
      written. The writer of a log may be halfway through a line when
      `latestOffset` runs; consuming it would split one change across
      two rows. The given `complete_lines(path, start)` returns the end
      byte of every complete line after `start`.
    - **Admission control by bytes.** `getDefaultReadLimit()` returns
      `ReadMaxBytes(maxBytesPerTrigger)` (4.2, `limit.max_bytes`).
      `latestOffset(start, limit)` takes whole lines, folder by folder,
      while they fit, and always at least one line so a stream with one
      huge line still moves. With `ReadAllAvailable` it takes
      everything.
    - **AvailableNow** freezes a target per log in
      `prepareForTriggerAvailableNow`, as in "Streaming Readers and
      Writers".
    - **`read()` reads its byte range only**, and numbers lines from
      the offset's count. A BOM can only be at byte 0, and
      `change_rows` strips it.

    With `maxBytesPerTrigger` 400 the reference's first run made these
    batches (batch id, rows):

    ```text
    [(0, 7), (1, 7), (2, 8), (3, 7), (4, 7), (5, 7)]
    ```

    That is 43 rows, one fewer than the batch reader's 44: CASE-0003's
    last line has no newline yet. The harness then appends to that log
    (completing the old line, adding a full line and a new partial one),
    adds a new case folder, restarts from the checkpoint (4 new rows),
    completes the partial line and restarts again (1 row). Its oracle is
    the batch reader: after the last run, the rows the stream wrote to
    its Parquet sink must equal `spark.read.format("casefile")` of the
    same folder, row for row, with no line twice. It also reads every
    `offsets/<batch>` file of the checkpoint and checks that no batch
    consumed more than 400 bytes.

