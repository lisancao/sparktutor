    ## The Contract

    One data source, `format("casefile")`, three tables chosen with an
    option, as JDBC chooses a table with `dbtable`:

    ```text
    cases        case_id string, folder string, schema_version int, opened timestamp,
                 status string, priority int, tags array<string>, meta variant,
                 attachments int, bytes long, problems array<string>
    attachments  case_id string, folder string, name string, kind string, size long,
                 sha256 string, expected_sha256 string, status string
    changes      case_id string, line int, ts timestamp, field string, old string,
                 new string, actor string, raw string, problem string
    ```

    | Option | Default | Meaning |
    |---|---|---|
    | `table` | `cases` | which table |
    | `maxPartitionBytes` | `16384` | target bytes per partition |
    | `pushdown` | `false` | `true` to use the reader that pushes filters |
    | `audit` | none | a folder; tasks write a marker per case folder they open |
    | `maxBytesPerTrigger` | `1024` | streaming: bytes of change log per micro-batch |

    Writing: `df.write.format("casefile").mode("append" | "overwrite").save(path)`
    writes one case folder per row of a DataFrame shaped like `cases`.
    Streaming: `spark.readStream.format("casefile").option("table", "changes")`.

    The exercise file gives you the schemas, the small helpers
    (`parse_ts`, `kind_of`, `parse_priority`, `parse_tags`,
    `change_rows`, `read_manifest`, `complete_lines`, `get_log`) and the
    skeleton of every class, with a docstring that states what each
    method must do. You write the rest. Every unfinished part raises
    `TODO("<name> (stage <stage>)")`, and the harness prints one line
    per stage:

    ```text
    FAIL  parsing          0.0s  TODO: parse_index (stage parsing)
    FAIL  planning         0.0s  TODO: plan_by_bytes (stage planning)
    FAIL  offline_tests    0.0s  write at least 5 tests in OfflineTests, found 1
    FAIL  design_review    0.0s  DESIGN_REVIEW still contains TODO
    FAIL  batch            3.1s  TODO: CaseFileReader.partitions (stage batch)
    ...
    0 of 10 stages passed
    ```

    Set `ONLY = ["parsing"]` at the top of the file to run one stage
    while you work on it; the run then ends with "Set ONLY = None to
    grade every stage", so you cannot forget to grade the whole thing.
    The plain Python stages run before any SparkSession exists.

