    ## Stage writer: Publish by Swapping a Pointer

    The writer in "Writers" staged files and moved them into place in
    `commit()`. Moving many folders is not atomic: a reader that lists
    the folder halfway through sees half a write, and an overwrite that
    deletes old folders first leaves nothing at all for a moment. The
    design here never moves or renames data:

    ```text
    write()   (each task)   CASE-0006@<job>/case.json, attachments/, changes.log
                            (job folders: invisible, list_case_folders skips name@job)
    commit()  (driver)      1. reject duplicates in this job, and appends of existing ids
                            2. write the new manifest to a temporary file
                            3. os.replace(tmp, _manifest.json)        <- the commit point
                            4. delete folders the new manifest no longer lists
    abort()   (driver)      delete every *@<job> folder
    ```

    `_manifest.json` maps each `case_id` to its folder. Readers that
    find a manifest read exactly what it lists, so the new data appears
    all at once, in the single `os.replace` (atomic on POSIX when both
    paths are on one file system), and an overwrite never shows an empty
    table. This is the idea behind table formats such as Delta Lake:
    immutable data, published by replacing one small pointer.

    `commit()` raising is a normal way to refuse a write. When it raises,
    Spark logs "Data source write support ... is aborting" and calls
    `abort()` with every task's message, so the job folders are deleted
    there:

    ```text
    ERROR AppendDataExec: Data source write support org.apache.spark.sql.execution.datasources.v2.python.PythonBatchWrite@4f93ade9 is aborting.
    ERROR AppendDataExec: Data source write support org.apache.spark.sql.execution.datasources.v2.python.PythonBatchWrite@4f93ade9 aborted.
    ```

    Gotcha when you test this: a failure injected with
    `F.raise_error(...)` in the DataFrame being written does **not**
    test `abort()`. The JVM computes the rows it feeds to the Python
    writer on its own thread; in testing, the task failed before
    `write()` had written a single folder, even with
    `spark.sql.execution.arrow.maxRecordsPerBatch` set to 2, so an
    `abort()` that does nothing still "passed". The harness instead
    sends a row whose `case_id` is not `CASE-dddd`, sorted last into one
    task, and your `write()` must reject it with a `ValueError`
    containing "invalid case_id" after writing four folders. Then a
    broken `abort()` is caught:

    ```text
    FAIL  writer  7.4s  a failed write must leave the manifest and the folder exactly as they
    were (abort() should delete this job's folders); new entries: ['CASE-0006@ac40da3e',
    'CASE-0007@ac40da3e', 'CASE-0008@ac40da3e', 'CASE-0009@ac40da3e']
    ```

    The stage also checks a duplicate `case_id` in one write ("duplicate"
    in the error), appending an existing case ("already exists"), that
    rejected commits change nothing, an overwrite that removes the
    replaced folders, and a round trip of `case_id`, `status`,
    `priority`, `opened` and `meta` through write and read.

