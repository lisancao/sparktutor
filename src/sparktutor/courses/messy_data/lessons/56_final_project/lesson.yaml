  Output: |
    ## The Java Path

    If you did "A DSv2 Connector in Java", you can build the same
    connector on the JVM. The pieces map one to one:

    | Python data source | DSv2 (Java) |
    |---|---|
    | `DataSource.name()`, `schema()` | `TableProvider` + `DataSourceRegister.shortName()`, `inferSchema` |
    | `reader()` | `Table` with `SupportsRead.newScanBuilder` |
    | `pushFilters` | `SupportsPushDownV2Filters.pushPredicates` |
    | (no equivalent in 4.2) | `SupportsPushDownRequiredColumns.pruneColumns` |
    | `partitions()` | `Batch.planInputPartitions` |
    | `read()` | `PartitionReaderFactory` + `PartitionReader<InternalRow>` |
    | `writer()`, `commit()`, `abort()` | `SupportsWrite`, `BatchWrite.commit/abort`, `DataWriter` |
    | `DataSourceStreamReader` | `MicroBatchStream` with `SupportsAdmissionControl` |

    Java buys you column pruning (the cases table could skip `meta`),
    aggregate pushdown (`COUNT(*)` from the folder listing), reporting
    partitioning and statistics, and no Python worker on the read path.
    It costs a build, a jar on every executor, and `InternalRow` and
    `UTF8String` instead of tuples. A scan builder for the cases table,
    compiled with `javac --release 17 -cp "<pyspark>/jars/*"`:

    ```java
    package demo;

    import java.util.ArrayList;
    import java.util.List;

    import org.apache.spark.sql.connector.expressions.NamedReference;
    import org.apache.spark.sql.connector.expressions.filter.Predicate;
    import org.apache.spark.sql.connector.read.Scan;
    import org.apache.spark.sql.connector.read.ScanBuilder;
    import org.apache.spark.sql.connector.read.SupportsPushDownRequiredColumns;
    import org.apache.spark.sql.connector.read.SupportsPushDownV2Filters;
    import org.apache.spark.sql.types.StructType;

    /** The cases table: pushes "=" and "IN" on case_id and status, and prunes columns. */
    public class CasesScanBuilder implements ScanBuilder, SupportsPushDownV2Filters,
        SupportsPushDownRequiredColumns {
      private StructType schema;
      private final List<Predicate> pushed = new ArrayList<>();

      public CasesScanBuilder(StructType schema) { this.schema = schema; }

      @Override
      public Predicate[] pushPredicates(Predicate[] predicates) {
        List<Predicate> rest = new ArrayList<>();
        for (Predicate p : predicates) {
          boolean onKey = p.children().length > 0 && p.children()[0] instanceof NamedReference ref
              && List.of("case_id", "status").contains(String.join(".", ref.fieldNames()));
          if (onKey && (p.name().equals("=") || p.name().equals("IN"))) {
            pushed.add(p);          // applied when listing case folders
          } else {
            rest.add(p);            // Spark evaluates these after the scan
          }
        }
        return rest.toArray(new Predicate[0]);
      }

      @Override
      public Predicate[] pushedPredicates() { return pushed.toArray(new Predicate[0]); }

      @Override
      public void pruneColumns(StructType required) { this.schema = required; }

      @Override
      public Scan build() {
        // A real connector returns a Scan whose toBatch() plans InputPartitions by
        // bytes and whose PartitionReaderFactory reads case folders into InternalRows.
        throw new UnsupportedOperationException("sketch: " + pushed + " " + schema.simpleString());
      }
    }
    ```

    The 4.2.0 leak lived in the Python wrapper's provider, not in DSv2
    itself: Spark creates a scan builder per scan
    (`createScanBuilder` in `V2ScanRelationPushDown`), so a Java
    connector that keeps pushdown state in its `ScanBuilder` and `Scan`,
    never in its `TableProvider` or `Table`, cannot leak this way. To
    grade a Java version yourself, run the harness's Spark stages
    against `format("<your short name>")`; the plain Python stages and
    the design review apply unchanged.

