  Output: |
    ## Summary

    - The final project is a connector for a new messy format: three
      tables through one source, two index versions normalized into one
      shape, and planted problems that become rows and warnings instead
      of exceptions.
    - Partitions are planned by bytes with first fit decreasing, over
      what each table actually reads.
    - Loose metadata is VARIANT, built with `VariantVal.parseJson`.
    - Pushdown is exact and opt-in: a reader without `pushFilters` by
      default (no `DATA_SOURCE_PUSHDOWN_DISABLED`, no 4.2.0 leak), a
      pushdown reader on request, and a helper that loads afresh per
      table reference. Pushed timestamps arrive as aware UTC datetimes;
      `PushedFilters` displays them in the JVM's time zone.
    - Writes are invisible until one `os.replace` of a manifest;
      `commit()` refuses duplicates and clashes, and Spark then calls
      `abort()`. A `raise_error` in the input does not exercise `abort()`;
      a failure inside `write()` does.
    - The stream uses byte offsets per log, reads complete lines only,
      admits by bytes, restarts from its checkpoint and agrees with the
      batch reader row for row.
    - Logs come back through `python_worker_logs()`; a `Logger` pickles
      by name, so configure it in the worker.
    - Tests are judged by the bugs they catch: mutation testing against
      broken versions of your own functions.

    This is the end of the course. Thank you for working through it.
