    ## Closing: What You Can Do Now

    You started this course by reading a folder of files as files. You
    can now:

    - Read anything Spark has a reader for, and know what it does with
      bad input: CSV, JSON with drift, XML, Avro and Protobuf, text,
      binary files, images and audio, with schemas you control and
      quarantine for what does not fit.
    - Model messy data with structs, arrays, maps and VARIANT, and know
      when VARIANT is the right choice and how it is stored.
    - Build Python data sources that read, push down, write, stream and
      ship, and the same thing in Java against DSv2 when Python is not
      enough.
    - Read a query plan, a Parquet footer, a VARIANT value, a
      checkpoint and an event log as evidence, and reason about what
      the engine will do before it does it.
    - Take a wrong result from symptom to a regression test, a fix and
      a JIRA.

    Where to go next:

    - **Contribute to Spark.** The method of "From Wrong Results to a
      Fix: An Upstream Case Study" is how contributions start: a minimal repro, a JIRA, a test
      that fails, the smallest fix. The contributing guide
      (https://spark.apache.org/contributing.html) and the developer
      tools page (https://spark.apache.org/developer-tools.html) explain
      the process and the build. Python data sources are a young API
      with open issues; reviewing and testing release candidates is
      valuable work too.
    - **Read the Spark docs and source side by side.** The Python data
      source guide lives in `python/docs/source/tutorial/sql/python_data_source.rst`
      in the Spark repository; when the docs and the code disagree, you
      now know how to find out which is right, and the docs take pull
      requests like the code does.
    - **The other SparkTutor courses.** "Learning Spark 4.2: From
      Fundamentals to Production" for the rest of Spark (SQL, joins,
      tuning, MLlib), "Spark 4.2 Declarative Pipelines" for building the
      pipelines your connectors feed, and "What's New in Apache Spark
      4.x" to keep up with each release.

