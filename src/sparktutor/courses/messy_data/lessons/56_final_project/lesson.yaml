    ## Stage variant: Loose Metadata as VARIANT

    `meta` has different keys in every case and comes from a different
    field in each version: the textbook case for VARIANT ("VARIANT
    Basics: Profiling and Nested Data"). A Python data source returns a
    VARIANT value as a `pyspark.sql.types.VariantVal`, and
    `VariantVal.parseJson` (4.0) builds one from a JSON string:

    ```python
    from pyspark.sql.types import VariantVal

    meta = VariantVal.parseJson(json.dumps(index["meta"])) if index["meta"] is not None else None
    ```

    The column is then queryable without a schema:

    ```python
    cases.select("case_id",
                 F.expr("variant_get(meta, '$.customer.tier', 'string')").alias("tier"),
                 F.expr("try_variant_get(meta, '$.sla_hours', 'int')").alias("sla_hours"),
                 F.expr("schema_of_variant(meta)").alias("meta_schema")).orderBy("case_id").show(truncate=False)
    ```

    ```text
    +---------+------+---------+----------------------------------------------------------------------------------------------------+
    |case_id  |tier  |sla_hours|meta_schema                                                                                         |
    +---------+------+---------+----------------------------------------------------------------------------------------------------+
    |CASE-0001|gold  |24       |OBJECT<channel: STRING, customer: OBJECT<id: STRING, tier: STRING>, sla_hours: BIGINT>              |
    |CASE-0002|NULL  |NULL     |OBJECT<channel: STRING, recording: OBJECT<rate: BIGINT, seconds: DECIMAL(2,1)>>                     |
    |CASE-0003|NULL  |NULL     |OBJECT<customer: OBJECT<id: STRING>, escalated: BOOLEAN>                                            |
    |CASE-0004|silver|NULL     |OBJECT<customer: OBJECT<id: STRING, tier: STRING>, order: BIGINT>                                   |
    |CASE-0005|NULL  |NULL     |OBJECT<browser: STRING, channel: STRING>                                                            |
    |CASE-0006|gold  |NULL     |OBJECT<customer: OBJECT<id: STRING, tier: STRING>, refund: OBJECT<amount: STRING, currency: STRING>>|
    |CASE-0007|NULL  |NULL     |OBJECT<imported_from: STRING, legacy_id: BIGINT>                                                    |
    |CASE-0008|NULL  |NULL     |NULL                                                                                                |
    |CASE-0009|NULL  |NULL     |OBJECT<channel: STRING, customer: OBJECT<id: STRING, name: STRING>, lang: STRING>                   |
    |CASE-0010|gold  |4        |OBJECT<customer: OBJECT<id: STRING, tier: STRING>, sla_hours: BIGINT>                               |
    +---------+------+---------+----------------------------------------------------------------------------------------------------+
    ```

    Note `seconds: DECIMAL(2,1)`: JSON `2.5` becomes an exact decimal
    in VARIANT, not a double. The harness also checks that
    `Hélène Côté` survives the trip from a BOM-prefixed file to a
    VARIANT and back.

- Class: text
  Depth: all
  Output: |
    ## Stage pushdown: Exact, Opt-in, and Safe From the Leak

    The pushdown reader takes over:

    | Table | Column | Filters |
    |---|---|---|
    | all | `case_id` | `EqualTo`, `In` |
    | cases | `status` | `EqualTo`, `In` |
    | cases | `opened` | `GreaterThan`, `GreaterThanOrEqual`, `LessThan`, `LessThanOrEqual` |

    and applies them while listing folders, so tasks never open a case
    that cannot match. `case_id` is known from the folder name; `status`
    and `opened` need the index, read on the driver during planning.
    Apply them **exactly** as Spark would: a NULL `status` matches no
    `EqualTo`, a NULL `opened` passes no comparison. Several filters on
    one column intersect.

    Timestamps arrive as timezone-aware `datetime` objects in UTC,
    already converted from the session time zone. With
    `spark.sql.session.timeZone` set to `America/Toronto`,
    `t >= timestamp'2026-03-01 00:00:00'` reached `pushFilters` as:

    ```text
    GreaterThanOrEqual(attribute=('t',), value=datetime.datetime(2026, 3, 1, 5, 0, tzinfo=zoneinfo.ZoneInfo(key='UTC')))
    ```

    so compare them with aware UTC values, never naive ones. The plan
    shows what was pushed, with a surprise:

    ```text
    (1) BatchScan casefile
    Output [11]: [case_id#167, folder#168, schema_version#169, opened#170, status#171, ...]
    PushedFilters: [EqualTo(status,open), GreaterThanOrEqual(opened,2026-03-09 17:00:00.0)]
    ```

    That query asked for `opened >= timestamp'2026-03-10 00:00:00'` with
    the session in UTC. `PushedFilters` prints the value as a JVM
    timestamp in the **JVM's default time zone** (the machine's, here
    `America/Los_Angeles`, UTC-7 on that date), not the session's. The
    filter is right; only its display is local. Do not "fix" your
    comparison to match the plan.

    **Why two reader classes.** You learned in "Filter Pushdown" that a
    reader which defines `pushFilters` fails every query with
    `DATA_SOURCE_PUSHDOWN_DISABLED` when
    `spark.sql.python.filterPushdown.enabled` is false, and in "From
    Wrong Results to a Fix: An Upstream Case Study" that with the flag
    on, 4.2.0 (and the identical code of 4.1.0 and the 4.3 branch) can
    leak a pushed read into other scans of the same relation. Spark decides
    whether pushdown is implemented by looking at the reader **object**
    that `reader()` returns, so a data source can choose:

    ```python
    def reader(self, schema):
        if self.options.get("pushdown", "false").lower() == "true":
            return PushdownCaseFileReader(self.options, schema)
        return CaseFileReader(self.options, schema)
    ```

    The default reader has no `pushFilters`: it works with the flag off
    and cannot leak. Users who want pushdown opt in, and get a helper
    that loads afresh for every table reference:

    ```python
    cf = CaseFiles(spark, "data/messy/casefiles", pushdown="true")
    open_cases = cf.table("cases").filter("status = 'open'")
    joined = cf.table("cases").alias("c").join(cf.table("attachments").alias("a"), "case_id")
    ```

    The harness checks the flag-off path, the `PushedFilters` line,
    audit markers that prove only matching folders were opened (the
    five open cases; three cases in a date window; two cases by id),
    a reused DataFrame on the default reader (10, 5, 10), and a join of
    two `CaseFiles` tables.

