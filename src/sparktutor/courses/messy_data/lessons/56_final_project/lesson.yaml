    ## Taking It Further

    - **A catalog file.** Pushdown on `status` reads every index during
      planning. Write a small summary file (case id, status, opened) in
      `commit()` and plan from it instead.
    - **Vacuum.** Folders that a crashed commit left behind, or that a
      manifest stopped listing before cleanup ran, are garbage. Add a
      `vacuum(root, keep_jobs=...)` function, and think about readers
      that are still using an old manifest.
    - **Shrinking logs.** If a log is ever shorter than its offset, the
      stream should fail loudly rather than read garbage. Add the check
      to `latestOffset`.
    - **Package it** as `pyspark_casefile` with a `DefaultSource`, as in
      "Packaging, Registration, Testing and Debugging", with
      `OfflineTests` as its pytest suite.
    - **Ship it** to a cluster ("Shipping Python Dependencies to a
      Cluster") and watch it with the event log and listeners
      ("Observability: Listeners, Metrics and Profiling Executors").
    - **Prove it** under retries ("Determinism, Retries and Fault
      Injection"): run the writer with `local[2,3]` and a `write()` that
      fails on its first attempt, and show the output is identical.

