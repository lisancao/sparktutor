    ## Stage parsing: Two Versions, One Shape

    `parse_index(raw, folder)` turns the bytes of any `case.json` into
    one dict. The mapping:

    | Field | Version 2 | Version 1 |
    |---|---|---|
    | recognised by | `"schema": 2` | no `schema` key, has `id` |
    | `case_id` | `case_id`, upper case | `id`, upper case |
    | `opened` | ISO 8601 with `Z` or an offset, to UTC | `created`, epoch seconds |
    | `status` | `status`, lower case | `state`, lower case |
    | `priority` | `"P1"` to `"P4"` | `prio`, 1 to 4 |
    | `tags` | a list | `labels`, comma separated |
    | `meta` | `meta` | `extra` |
    | attachments | `{name, sha256, bytes}` | names only (no checksum) |

    The rules that keep messy input from becoming crashes:

    - **Decode with `utf-8-sig`.** It removes a byte order mark if
      there is one and is plain UTF-8 otherwise. `json.loads` on a
      string that starts with a BOM fails.
    - **A broken index is a row, not an exception.** Invalid JSON, or a
      document that is neither version, gives `case_id` from the folder
      name, every other field NULL, and `problems = ['bad_index']`. One
      truncated file must not fail a query over thousands of cases.
    - **Unknown values become NULL plus a problem.** `"urgent"` is not a
      priority: `priority` NULL, `problems = ['bad_priority']`. A missing
      priority is just NULL.
    - **Timestamps are aware and in UTC.** `datetime.fromisoformat`
      accepts `Z` only from Python 3.11; replacing `Z` by `+00:00`
      works everywhere (the given `parse_ts` does it).

    The reference parser on the version 1 case:

    ```text
    {'case_id': 'CASE-0007', 'schema_version': 1, 'opened': datetime.datetime(2026, 3, 4, 9, 30, tzinfo=datetime.timezone.utc), 'status': 'open', 'priority': 2, 'tags': ['billing', 'vip'], 'problems': []}
    ```

    `parse_change_line(line)` returns `{ts, field, old, new, actor}` or
    `None`. Strip a trailing `\r` first: CRLF files split on `\n` leave
    it at the end of every line, and it would end up in `actor`. A line
    without `->`, or with a timestamp that does not parse, is not a
    change. The given `change_rows` turns a block of lines into table
    rows: comments and blank lines produce nothing, and a line that is
    not a change produces a row with `raw` and `problem = 'unparsed'`,
    so nothing in the log disappears silently.

    `attachment_status(expected_sha, actual_sha, listed, on_disk)`
    decides between `ok`, `sha_mismatch`, `unverified` (listed without
    a checksum, as in version 1), `missing` and `unlisted`.

