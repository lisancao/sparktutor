    ## A Search Index in a Pipeline

    Put the steps in a `Pipeline` so the same tokenization runs on the
    documents and on the query:

    ```python
    from pyspark.ml import Pipeline
    from pyspark.ml.feature import HashingTF, IDF, Normalizer

    pipeline = Pipeline(stages=[
        RegexTokenizer(inputCol="text", outputCol="tokens", pattern=r"[^a-zA-Z]+"),
        StopWordsRemover(inputCol="tokens", outputCol="words"),
        HashingTF(inputCol="words", outputCol="tf", numFeatures=1 << 12),
        IDF(inputCol="tf", outputCol="tfidf"),
        Normalizer(inputCol="tfidf", outputCol="vec", p=2.0),
    ])
    model = pipeline.fit(docs)
    indexed = model.transform(docs)
    ```

    `Normalizer` scales each vector to length 1. For unit vectors the dot
    product **is** the cosine similarity: 1 when two texts use the same
    words in the same proportions, 0 when they share no weighted word.
    That makes scores comparable across documents of different lengths.

    To score a query, run it through the same fitted model, cross join
    the one query row to the documents, and take the dot product:

    ```python
    q = model.transform(spark.createDataFrame(
        [("how long does express shipping take",)], "text string")) \
        .select(F.col("vec").alias("q"))

    dot = F.udf(lambda a, b: float(a.dot(b)), "double")
    indexed.crossJoin(q).select("doc", dot("vec", "q").alias("score")) \
        .orderBy(F.desc("score")).show()
    ```

    ```text
    +-----------+-------------------+
    |        doc|              score|
    +-----------+-------------------+
    |shipping.md|0.32652261788171955|
    | privacy.md|                0.0|
    | returns.md|                0.0|
    |warranty.md|                0.0|
    +-----------+-------------------+
    ```

    MLlib vectors are not a SQL type you can multiply with built-in
    functions, so the dot product runs in a small Python UDF; `float(...)`
    turns NumPy's result into a plain Python float the UDF can return.
    The cross join is cheap here because the query side has one row.

