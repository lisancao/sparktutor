    ## Near Duplicates With MinHash

    Support queues fill up with the same message sent twice, or the same
    template with a different order number. To find them, compare
    messages as **sets of words** with the **Jaccard distance**:

    ```text
    distance(A, B) = 1 - |A ∩ B| / |A ∪ B|
    ```

    Two of the support e-mails, tokenized with `pattern=r"\W+"`:

    ```text
    ticket_0: hello order 1000 has a problem please help
    ticket_1: hello order 1001 has a problem please help
    ```

    They share 7 words out of 9 distinct ones, so the distance is
    `1 - 7/9 = 2/9`, about 0.222. Two chat messages that differ only in
    punctuation tokenize to the same set and have distance 0.

    Comparing every pair is quadratic. **MinHash locality-sensitive
    hashing** avoids that: it hashes each set so that similar sets are
    likely to land in the same bucket, and only compares sets that share
    a bucket. In MLlib:

    ```python
    from pyspark.ml.feature import HashingTF, MinHashLSH, RegexTokenizer

    tokens = RegexTokenizer(inputCol="text", outputCol="tokens",
                            pattern=r"\W+").transform(messages)
    features = HashingTF(inputCol="tokens", outputCol="features",
                         numFeatures=1 << 10, binary=True).transform(tokens)
    model = MinHashLSH(inputCol="features", outputCol="hashes",
                       numHashTables=5, seed=7).fit(features)

    pairs = model.approxSimilarityJoin(features, features, 0.3) \
        .filter("datasetA.id < datasetB.id") \
        .select(F.col("datasetA.id").alias("a"),
                F.col("datasetB.id").alias("b"),
                F.col("distCol").alias("distance"))
    ```

    - `binary=True` turns word counts into 0/1, because MinHash works on
      sets.
    - `approxSimilarityJoin` returns struct columns `datasetA` and
      `datasetB` with the original rows, plus `distCol`, the **exact**
      Jaccard distance of each candidate pair. The approximation is only
      in which pairs become candidates: a true pair can be missed, never
      reported with a wrong distance.
    - More hash tables (`numHashTables`) miss fewer pairs and cost more.
    - A self-join returns every pair twice and every row paired with
      itself; `datasetA.id < datasetB.id` keeps each pair once.
    - `model.approxNearestNeighbors(features, key_vector, k)` answers
      "which messages look like this one?" for a single message.

