- Class: text
  Depth: all
  Output: |
    ## Summary

    - Plain functions (`split`, `explode`, `sentences`) are enough for a
      first look at text.
    - `RegexTokenizer` with a pattern that splits on punctuation beats
      `Tokenizer`, which only splits on whitespace. `StopWordsRemover`
      drops common words. MLlib does not stem.
    - **TF-IDF** weights words that are frequent in a document and rare
      in the corpus; MLlib's IDF is `log((N + 1) / (df + 1))`, so a word
      in every document weighs 0.
    - `HashingTF` needs no vocabulary; `CountVectorizer` keeps one.
    - `Normalizer` plus a dot product gives **cosine similarity** for
      ranking documents against a query.
    - **MinHashLSH** finds near-duplicate sets cheaply; `distCol` is the
      exact Jaccard distance of each candidate pair. Choose the threshold
      by looking at real pairs.
    - Filter empty texts before MinHash, and keep the default `distCol`
      name (Spark Connect ignores the argument in 4.2.0).

    Next: **Running a Model over Your Data with pandas UDFs**, where a
    small classifier labels every document at scale.