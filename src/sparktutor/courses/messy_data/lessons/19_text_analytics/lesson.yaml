    ## Choosing a Threshold

    The threshold decides what "duplicate" means for you, and the sample
    data shows why there is no universal value. The four support e-mails
    are the same template with different order numbers, so every pair of
    them is 0.222 apart:

    | Threshold | Pairs found |
    |---|---|
    | 0.1 | the two chat messages only (exact repeats) |
    | 0.3 | the chat pair plus all six pairs of templated e-mails |

    If you want to drop accidental double sends, 0.1 is right: the
    e-mails are different orders. If you want to group tickets by the
    kind of complaint, 0.3 is right. Look at pairs on both sides of your
    threshold before you trust it.

    Short texts make this harder: one changed word in a message of five
    is already a distance of about 0.3. For long documents, compare sets
    of word n-grams (`NGram(n=3)`, called shingles) instead of single
    words, so that the same words in a different order do not look
    identical.

