- Class: text
  Depth: advanced
  Output: |
    ## Scaling Up

    - **Many queries.** Transform all queries at once and cross join them
      with the documents only if both sides are small. For a large
      corpus, keep the document vectors in a table, broadcast the query
      vectors, and keep the top results per query with a window
      (`row_number() OVER (PARTITION BY query ORDER BY score DESC)`; see
      "Window Functions in One Page" in "Binary Records: Avro and
      Protobuf").
    - **Vocabulary size.** With `HashingTF`, pick `numFeatures` well
      above the number of distinct words you expect (a power of two, as
      the docs advise) to keep collisions rare. Collisions only ever add
      false similarity.
    - **Reuse the fitted model.** Save the `PipelineModel`
      (`model.write().overwrite().save(path)`) so queries next week use
      the same IDF weights as the index.
    - **LSH cost.** `approxSimilarityJoin` explodes each row into one row
      per hash table and joins on the hashes, so very common buckets
      (for example, many messages that are just "thanks") create large
      joins. Drop trivial messages before the join.

