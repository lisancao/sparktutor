    ## Words and Sentences With Plain Functions

    For a quick look you do not need MLlib at all. Read each document as
    one row with `wholetext=True` (and remember from "Text and Logs" that
    the keyword wins over `.option("wholetext", ...)`):

    ```python
    docs = (spark.read.text("data/messy/docs/*.md", wholetext=True)
        .select(F.col("_metadata.file_name").alias("doc"),
                F.col("value").alias("text")))

    words = docs.select("doc",
        F.explode(F.split(F.lower("text"), r"[^a-z]+")).alias("word"))
    words.filter(F.length("word") > 3).groupBy("word").count() \
        .orderBy(F.desc("count"), "word").show(3)
    ```

    ```text
    +---------+-----+
    |     word|count|
    +---------+-----+
    | shipping|    7|
    |customers|    6|
    |     days|    6|
    +---------+-----+
    ```

    `sentences(text)` (3.2; an optional language argument since 4.0)
    splits text into an array of sentences, each an array of words, using
    Java's locale-aware sentence rules. Each policy file has a heading
    plus three copies of a two-sentence paragraph, and `sentences` finds
    6 sentences in each (the heading merges with the first sentence,
    because it has no full stop):

    ```python
    docs.select("doc", F.size(F.sentences("text")).alias("n")).show()
    ```

    Hand-made splitting gets you far, but the details multiply: case,
    punctuation, numbers, stop words. MLlib packages those steps as
    reusable transformers you can put in a pipeline. Three words to know:

    - A **transformer** turns one DataFrame into another by adding a
      column (`model.transform(df)`), for example a column of words.
    - An **estimator** first learns something from your data
      (`fit(df)`), such as a vocabulary, and returns a transformer that
      applies what it learned.
    - A **Pipeline** chains transformers and estimators into one
      estimator, so `pipeline.fit(df)` runs every step in order and
      returns a `PipelineModel` you can apply to new data.

