    ## What You'll Learn

    In "Documents to Rows" you turned e-mails, PDFs and Markdown into rows
    of text. Now you want to do something with that text: find the policy
    that answers a customer's question, or notice that ten tickets are
    really the same complaint.

    A large language model can do both, but it costs money per call, needs
    a network, and gives a different answer tomorrow. Classic text
    analytics runs on any Spark cluster, costs nothing per row, gives the
    same answer every time, and you can explain every score. It is also
    the baseline any fancier approach has to beat.

    By the end of this lesson you will be able to:

    - Split text into words and sentences, and count words without stop
      words
    - Explain TF-IDF and build a search index with Spark MLlib
      (`RegexTokenizer`, `StopWordsRemover`, `HashingTF`, `IDF`,
      `Normalizer`)
    - Rank documents for a query by cosine similarity
    - Find near-duplicate messages with `MinHashLSH` and choose a
      threshold
    - Avoid the tokenizer, empty-text and Spark Connect traps

