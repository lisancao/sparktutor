  Depth: intermediate
  Output: |
    ## Traps

    **Empty text breaks MinHash.** A message with no tokens becomes an
    all-zero vector, and MinHash refuses it when it hashes the row:
    the job fails with `[FAILED_EXECUTE_UDF]` caused by
    `IllegalArgumentException: requirement failed: Must have at least 1
    non zero entry.` Filter those rows out first, for example with
    `F.size("tokens") > 0`.

    **The `distCol` argument on Spark Connect.** In a classic session,
    `approxSimilarityJoin(a, b, 0.3, distCol="jaccard")` names the
    distance column `jaccard`. On a Spark Connect session in 4.2.0 the
    argument is ignored and the column is still called `distCol`, so a
    later `select("jaccard")` fails with
    `UNRESOLVED_COLUMN.WITH_SUGGESTION`. Keep the default name and rename
    it with `alias` afterwards, which works in both modes. (MLlib runs on
    Spark Connect since 4.0, SPARK-50812.)

    **`wholetext` for documents, lines for logs.** The search index
    treats each row as a document. Read a folder of documents with
    `wholetext=True`; without it every line becomes its own "document"
    and the IDF counts lines.

