    ## Reading the Scores

    Try a few queries against the four policies:

    | Query | Best match | Score |
    |---|---|---|
    | how long does express shipping take | `shipping.md` | 0.3265 |
    | can I return an unopened item for a refund | `returns.md` | 0.2243 |
    | battery warranty | `warranty.md` | 0.2009 |
    | pizza | none | 0 everywhere |

    - The other documents score exactly 0 because they share no word
      with non-zero weight. `days` is in both `shipping.md` and
      `returns.md`, but none of these queries uses it.
    - `battery warranty` matches only through `warranty`: the document
      says `batteries` (no stemming).
    - `can I return an unopened item for a refund` matches `return` and
      `unopened` but not `refund` (the document says `refunds`) or `item`
      (`items`).
    - A score is only comparable within one query. 0.33 for one query and
      0.22 for another does not mean the first answer is better.

    On four tiny documents TF-IDF looks almost too easy. On real corpora
    it is still a strong baseline for keyword search, and the place to
    start before reaching for embeddings.

