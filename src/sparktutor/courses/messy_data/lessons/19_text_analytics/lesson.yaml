    ## TF-IDF: Words That Matter Here

    A search engine has to decide which words in a document are
    important. Two ideas combine:

    - **Term frequency (TF)**: a word that appears often in a document is
      probably about that document. `shipping` appears 7 times in
      `shipping.md`.
    - **Inverse document frequency (IDF)**: a word that appears in
      *every* document tells you nothing about any of them. MLlib's IDF
      for a term is `log((N + 1) / (df + 1))`, where `N` is the number of
      documents and `df` is how many contain the term. `policy` is in all
      4 policy files, so its IDF is `log(5 / 5) = 0`, and it drops out of
      every score.

    TF-IDF multiplies the two. MLlib needs the words as a vector first,
    and offers two ways to build it:

    - `HashingTF` hashes each word into one of `numFeatures` slots
      (default `1 << 18`, which is 262144). No vocabulary to fit or store,
      so it works on unbounded data, but two words can share a slot and
      you cannot turn a slot back into a word.
    - `CountVectorizer` learns a vocabulary in a fitting pass, so you can
      map positions back to words (`model.vocabulary`), at the cost of
      that pass and of keeping the vocabulary in memory.

    `IDF` is an estimator: fitting it counts document frequencies over
    your corpus. The fitted model then weights any new text, such as a
    search query, with the corpus's IDF.

