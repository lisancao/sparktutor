    ## Tokenizers and Stop Words

    MLlib has two tokenizers, and the difference matters:

    - `Tokenizer` lowercases and splits on whitespace only, so
      `"Please help."` becomes `["please", "help."]`. The full stop stays
      on the word, and `help.` never matches `help`.
    - `RegexTokenizer` lowercases too (`toLowercase=True`) and splits on
      a regular expression you choose (`pattern`, default `\s+`, with
      `gaps=True` meaning the pattern matches the separators). With
      `pattern=r"\W+"`, `"Hello, order 1000 has a problem. Please help."`
      becomes `[hello, order, 1000, has, a, problem, please, help]`.
      `minTokenLength` (default 1) drops shorter tokens.

    `StopWordsRemover` then drops very common words ("a", "has", "the",
    "can") that carry little meaning. Its default list is English;
    `StopWordsRemover.loadDefaultStopWords(language)` loads lists for
    Danish, Dutch, English, Finnish, French, German, Hungarian, Italian,
    Norwegian, Portuguese, Russian, Spanish, Swedish and Turkish. It is
    case-insensitive unless you set `caseSensitive=True`.

    ```python
    from pyspark.ml.feature import RegexTokenizer, StopWordsRemover

    tokens = RegexTokenizer(inputCol="text", outputCol="tokens",
                            pattern=r"[^a-zA-Z]+").transform(docs)
    words = StopWordsRemover(inputCol="tokens", outputCol="words").transform(tokens)
    ```

    There is **no stemming** in MLlib: `battery` and `batteries`,
    `refund` and `refunds` are different words. You will see the effect
    in the search results below. If you need stemming, apply a stemmer in
    a UDF (a library such as NLTK, which is not installed here) or
    normalize the few words that matter yourself.

