    ## What You'll Learn

    In "JSON Drift and Quarantine" you tamed drifting JSON with one
    carefully written schema. That works, but you had to know every shape
    in advance, and the next drift means editing the schema again.
    "Complex Types and Higher-Order Functions" then showed how to work
    with structs and arrays once their shape is declared. VARIANT is the
    next step: nested data whose shape you do not have to declare at all. **VARIANT** (Spark 4.0)
    takes the other route: store each record as one semi-structured value,
    keep everything, and decide how to read it at query time.

    This lesson loads the same drifting events from `data/messy/events/`
    without writing a field-level schema, and uses VARIANT to find out
    what is really in them.

    By the end of this lesson you will be able to:

    - Load JSON files straight into a VARIANT column with
      `singleVariantColumn`, keeping malformed lines (4.1)
    - Read fields with `:` paths, `::` casts and `try_variant_get`, and
      know exactly when each returns NULL or fails
    - Profile which keys and types occur with `variant_explode` (4.0) and
      `schema_of_variant`
    - Normalize a field that is sometimes a number, sometimes a string and
      sometimes an object
    - Explode arrays nested inside a VARIANT, without losing rows

    If VARIANT is new to you, `spark_4_whats_new` lesson 2 is a good
    short tour; the next section recaps what you need.

