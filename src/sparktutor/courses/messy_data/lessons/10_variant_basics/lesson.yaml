    ## Profiling: Which Keys, Which Types?

    `schema_of_variant_agg(v)` gives the merged shape in one string:

    ```
    OBJECT<amount: VARIANT, event: STRING, event_type: STRING,
           items: ARRAY<OBJECT<qty: BIGINT, sku: STRING>>, ts: STRING,
           user: OBJECT<geo: OBJECT<country: STRING>, id: BIGINT, plan: STRING>,
           user_id: BIGINT>
    ```

    `amount: VARIANT` says "more than one type", but not which types, or
    how many rows have each key. For that, turn every key into a row with
    the table-valued function `variant_explode` (4.0, SPARK-47680):

    ```sql
    SELECT pos, key, value FROM variant_explode(parse_json('{"b": [1,2], "a": {"x": 1}}'))
    ```

    ```
    +---+---+-------+
    |pos|key|  value|
    +---+---+-------+
    |  0|  a|{"x":1}|
    |  1|  b|  [1,2]|
    +---+---+-------+
    ```

    Applied to a table with `LATERAL`, it runs once per row, and a
    profile is a `GROUP BY` away:

    ```sql
    SELECT key,
           count(*) AS n,
           collect_set(schema_of_variant(value)) AS types
    FROM ev, LATERAL variant_explode(v)
    GROUP BY key
    ```

    Keys come back sorted (VARIANT objects store their keys in sorted
    order), each with its `pos`, `key` and `value`. For an array,
    `variant_explode` returns one row per element with `key` NULL; for a
    scalar such as a string it returns no rows.

