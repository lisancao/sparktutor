    ## Nested Arrays in a VARIANT

    `items` is an array of objects inside each record. Explode it with
    `variant_explode_outer`, the variant of `variant_explode` that keeps a
    row (of NULLs) when the input is NULL or not an array:

    ```sql
    SELECT item.value:sku::string AS sku,
           sum(item.value:qty::int) AS qty
    FROM ev, LATERAL variant_explode_outer(v:items) AS item
    GROUP BY 1
    ORDER BY 1
    ```

    ```
    +----+----+
    | sku| qty|
    +----+----+
    |NULL|NULL|
    |  P1|   8|
    |  P2|  12|
    ...
    ```

    The `NULL` group holds the 21 records without items (day 1 and the
    malformed line): 82 rows in all, against 61 with `variant_explode`.
    The trade-off is exactly `explode` versus `explode_outer` from "JSON
    Drift and Quarantine" (and the arrays of "Complex Types and
    Higher-Order Functions"), and the same advice applies: keep the outer form and
    filter explicitly.

    There is also a pure-DataFrame route: cast the array to
    `array<variant>` and use the ordinary `explode`:

    ```python
    (ev.select(F.explode(F.try_variant_get("v", "$.items", "array<variant>")).alias("it"))
       .select(F.variant_get("it", "$.sku", "string").alias("sku")))
    ```

    Note that `try_variant_get(..., "array<variant>")` returns NULL for
    a single object (it is not an array). That matters for XML, where one
    child element and several child elements have different shapes, as
    you will see in "XML".

