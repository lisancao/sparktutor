    ## VARIANT Gotchas You Will Hit While Profiling

    - **You cannot group or sort by a VARIANT.** `GROUP BY v:user` fails
      with `GROUP_EXPRESSION_TYPE_IS_NOT_ORDERABLE`. Group by a cast
      (`v:user.plan::string`) or by the JSON text: `to_json(v:user)` works,
      and gives one string per distinct object because `to_json` writes
      keys in sorted order (`to_json(parse_json('{"b":2,"a":1}'))` is
      `{"a":1,"b":2}`).
    - **Missing is not the same as JSON null.** For a missing key,
      `v:key IS NULL` is true. For `{"key": null}`, `v:key` is a VARIANT
      holding JSON null, so `IS NULL` is false and `is_variant_null(v:key)`
      is true. Check both when "no value" matters.
    - **Decimals are exact.** `schema_of_variant(parse_json('1.50'))` is
      `DECIMAL(2,1)` (the trailing zero is not kept), while
      `parse_json('1e3')` is a `DOUBLE`. That is why the profile strips
      the precision.

