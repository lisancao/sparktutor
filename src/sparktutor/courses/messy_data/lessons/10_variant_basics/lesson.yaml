    ## Normalizing a Field With Three Shapes

    The profile told you `amount` is a number, a numeric string, or an
    object with a `value`. Read every shape with `try_variant_get` and take
    the first that works:

    ```python
    amount = F.coalesce(
        F.try_variant_get("v", "$.amount", "double"),        # 6.13 and "32.83"
        F.try_variant_get("v", "$.amount.value", "double"))  # {"value": 29.93, ...}
    ```

    The first reading handles numbers and numeric strings (the cast
    converts `"32.83"`), and returns NULL for objects; the second handles
    objects. Renames and moves are the same pattern:

    ```python
    F.coalesce(F.try_variant_get("v", "$.event_type", "string"),
               F.try_variant_get("v", "$.event", "string"))
    F.coalesce(F.try_variant_get("v", "$.user.id", "bigint"),
               F.try_variant_get("v", "$.user_id", "bigint"))
    ```

    And `try_variant_get(v, "$.ts", "timestamp")` turns the ISO string
    into a real timestamp, in the session time zone.

    Compare with "JSON Drift and Quarantine": there, `amount` had to be declared as
    `STRING` in advance so that objects survived as text. With VARIANT
    nothing had to be declared; the shapes were discovered by profiling
    and handled at read time.

