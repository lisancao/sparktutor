    ## The Same Profile in the DataFrame API

    Table-valued functions are also available from Python as
    `spark.tvf` (4.0), and `DataFrame.lateralJoin` (4.0) applies one per
    row. `outer()` marks the column as coming from the left side of the
    lateral join:

    ```python
    profile = (ev.lateralJoin(spark.tvf.variant_explode(F.col("v").outer()))
        .groupBy("key").agg(F.count("*").alias("n"))
        .orderBy("key"))
    ```

    It gives the same counts as the SQL. Use whichever reads better to
    you; the lessons use SQL for lateral queries because it is shorter.

