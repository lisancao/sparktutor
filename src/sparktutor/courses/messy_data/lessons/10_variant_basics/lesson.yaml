    A typed column is a form with fixed boxes: if the "amount" box only
    takes numbers, a form that says "amount: twelve" is rejected. A
    VARIANT is more like keeping the whole original letter in a folder,
    with sticky tabs that say where each part is. You never throw a
    letter away; when you need the amount, you look it up and decide how
    to read what you find.

