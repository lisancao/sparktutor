    ## Gotcha: Option Order in Classic PySpark

    These two reads look the same, and in classic PySpark only the first
    one works:

    ```python
    (spark.read.option("singleVariantColumn", "v")
               .option("columnNameOfCorruptRecord", "_bad")
               .schema("v VARIANT, _bad STRING"))          # works

    (spark.read.schema("v VARIANT, _bad STRING")
               .option("singleVariantColumn", "v")
               .option("columnNameOfCorruptRecord", "_bad"))  # fails
    ```

    ```
    [INVALID_SINGLE_VARIANT_COLUMN] User specified schema
    "STRUCT<v: VARIANT, _bad: STRING>" is invalid when the
    `singleVariantColumn` option is enabled. The schema must either be a
    variant field, or a variant field plus a corrupt column field.
    ```

    In the 4.2.0 source, the classic `DataFrameReader` checks the schema
    against the options **on every `.option()` and `.schema()` call**.
    In the second read, at the moment `singleVariantColumn` is set, the
    corrupt column is still called `_corrupt_record`, so `_bad` looks like
    an unexpected extra field. Passing both options in one
    `.options(singleVariantColumn="v", columnNameOfCorruptRecord="_bad")`
    after the schema fails the same way. A Spark Connect session checks
    later and accepts any order.

    The rule that always works: **options first, schema last** (or use
    the default name `_corrupt_record`).

