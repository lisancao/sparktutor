    ## Summary

    In this lesson you learned:

    - **`singleVariantColumn`** loads each JSON record into one VARIANT
      column with no inference pass. A malformed line gives a NULL `v`;
      since 4.1 a `v VARIANT, _bad STRING` schema plus
      `columnNameOfCorruptRecord` keeps its raw text.
    - **Option order matters in classic PySpark**: set the options before
      the schema, or the read fails with `INVALID_SINGLE_VARIANT_COLUMN`.
    - **Reading fields**: `:` paths return NULL when missing; `::` and
      `variant_get` fail with `INVALID_VARIANT_CAST` on impossible casts;
      `try_variant_get` returns NULL and converts numeric strings.
    - **Profiling**: `LATERAL variant_explode(v)` turns keys into rows;
      group by key with `collect_set` over the base type name from
      `schema_of_variant`.
    - **Normalizing**: `coalesce` over several `try_variant_get` readings
      handles type changes, renames and moves.
    - **Nested arrays**: `variant_explode_outer(v:items)` keeps records
      without items; `variant_explode` drops them.
    - **Gotchas**: no grouping or sorting by VARIANT (group by a cast or
      `to_json`), missing key versus JSON null (`is_variant_null`).

    Next: **XML**, where attributes, text nodes and "one child or many"
    give semi-structured data a few new tricks.
