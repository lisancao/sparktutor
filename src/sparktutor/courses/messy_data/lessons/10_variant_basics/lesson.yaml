    ## Making the Type Set Readable

    Run that profile and the `amount` row is a mess:

    ```
    [OBJECT<currency: STRING, value: DECIMAL(3,2)>, STRING, DECIMAL(4,2),
     OBJECT<currency: STRING, value: DECIMAL(3,1)>, DECIMAL(2,1), ...]
    ```

    `schema_of_variant` reports JSON numbers with a fraction as the
    smallest `DECIMAL(precision, scale)` that holds each exact value, so
    `6.13` is `DECIMAL(3,2)` and `32.83` is `DECIMAL(4,2)`. Every
    distinct precision becomes a separate "type". For a profile you want
    the kind, not the exact precision: keep the leading capital letters.

    ```sql
    sort_array(collect_set(regexp_extract(schema_of_variant(value), '^[A-Z]+', 0))) AS types
    ```

    ```
    +----------+---+-------------------------+
    |key       |n  |types                    |
    +----------+---+-------------------------+
    |amount    |60 |[DECIMAL, OBJECT, STRING]|
    |event     |40 |[STRING]                 |
    |event_type|20 |[STRING]                 |
    |items     |40 |[ARRAY]                  |
    |ts        |60 |[STRING]                 |
    |user      |40 |[OBJECT]                 |
    |user_id   |20 |[BIGINT]                 |
    +----------+---+-------------------------+
    ```

    Now the drift is readable at a glance: `amount` has three shapes,
    `event` and `event_type` together cover 60 rows (a rename), and
    `user_id` plus `user` cover 60 (a move). The same query one level
    down (`LATERAL variant_explode(v:user)`) shows `geo` in only 20 rows.

