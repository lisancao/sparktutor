    ## Loading Files as VARIANT

    The JSON source (and CSV and XML) can put each whole record into one
    VARIANT column:

    ```python
    ev = spark.read.option("singleVariantColumn", "v").json("data/messy/events")
    ev.printSchema()
    ```

    ```
    root
     |-- v: variant (nullable = true)
    ```

    No inference pass and no schema to maintain: whatever fields a record
    has, they are in `v`. Compare that with the eight-column union schema
    that inference produced in "JSON Drift and Quarantine".

    What about the truncated line at the end of day 3? It becomes a row
    whose `v` is NULL. Since Spark 4.1 (SPARK-51296) you can also keep its
    raw text, by giving a schema with the variant column plus a string
    corrupt column:

    ```python
    ev = (spark.read
        .option("singleVariantColumn", "v")
        .option("columnNameOfCorruptRecord", "_bad")
        .schema("v VARIANT, _bad STRING")
        .json("data/messy/events")
        .cache())

    ev.filter("_bad IS NOT NULL").select("v", "_bad").collect()
    # [Row(v=None, _bad='{"event_type": "purchase", "user": {"id": 9')]
    ```

    The `.cache()` is there for the same reason as in "JSON Drift and
    Quarantine": a
    query that reads only the corrupt column fails with
    `UNSUPPORTED_FEATURE.QUERY_ONLY_CORRUPT_RECORD_COLUMN`.

    Without the option, the corrupt column must have the default name:
    `.schema("v VARIANT, _corrupt_record STRING")` works on its own.

