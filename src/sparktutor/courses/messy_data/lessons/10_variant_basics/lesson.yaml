    ## Exercise: Profile and Normalize Without a Schema

    Work on the same `data/messy/events/` files as "JSON Drift and Quarantine", this
    time without a field-level schema.

    1. `load_events(spark, path)`: one VARIANT column `v` per record,
       malformed lines kept in `_bad` (options first, then the schema
       `v VARIANT, _bad STRING`), plus `file` from `_metadata`, cached.
    2. `key_profile(spark, ev)`: one row per top-level key with `key`,
       `n` and `types`, the sorted set of base type names (`DECIMAL`,
       `OBJECT`, `STRING`, ...), using `LATERAL variant_explode(v)`.
    3. `normalize(ev)`: for every record that parsed, `event_type`,
       `user_id`, `plan`, `amount` (a double for every shape), `ts` (a
       timestamp) and `file`.
    4. `item_rows(spark, ev)`: `sku` and `qty` per item with
       `LATERAL variant_explode_outer(v:items)`.

    The harness computes the expected values with Python's `json` module
    and checks: 61 rows with exactly one malformed record captured, the
    whole key profile (including the three shapes of `amount`), no NULLs
    in the normalized key fields, the sum of all amounts, and the item
    rows and quantities per SKU.
