- Class: text
  Depth: advanced
  Output: |
    ## When to Leave VARIANT

    VARIANT is the right landing type for data whose shape you do not
    control. It is not a reason to never model data. Once profiling has
    shown you the fields everyone queries (`event_type`, `user_id`,
    `amount`, `ts`), promote them to typed columns in a silver table, as
    the exercise does, and keep the original `v` next to them for the
    long tail of rarely used fields.

    Typed columns are easier to filter, join, group and validate, and
    other tools understand them. VARIANT also has a storage side: when it
    is written to Parquet, Spark 4.1 and later store stable fields as
    typed columns inside the file ("shredding"). "VARIANT Shredding and
    Performance", in the intermediate level, opens a Parquet file to show what was
    shredded and what that means for query speed.

