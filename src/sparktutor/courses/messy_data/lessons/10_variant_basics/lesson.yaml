    ## VARIANT in One Page

    A `VARIANT` value holds any JSON-like data (objects, arrays, strings,
    numbers, booleans, null) in a compact binary encoding that records the
    type of every value and where each field lives.

    ```sql
    SELECT parse_json('{"user": {"id": 7}, "tags": ["a", "b"]}') AS v
    ```

    - `parse_json(str)` builds one, and fails the query on invalid JSON
      (`MALFORMED_RECORD_IN_PARSING.WITHOUT_SUGGESTION`).
      `try_parse_json(str)` returns NULL instead.
    - `v:user.id` follows a path and returns a VARIANT; `v:tags[0]`
      indexes an array. A path that does not exist gives NULL, never an
      error.
    - `::` casts: `v:user.id::bigint`. In Python,
      `F.variant_get(col, "$.user.id", "bigint")` is the same thing.
    - A cast that cannot work fails the query:
      `[INVALID_VARIANT_CAST] The variant value {"currency":"CAD","value":29.93}
      cannot be cast into "DOUBLE"`. `try_variant_get` returns NULL
      instead.
    - `schema_of_variant(v)` describes one value's type, and
      `schema_of_variant_agg(v)` merges the types across all rows.

    Casts are value conversions, not just labels. `try_variant_get` on the
    JSON string `"12.5"` with type `double` gives `12.5`; on `"abc"` it
    gives NULL; on an object it gives NULL; and the number `12.5` read as
    `int` gives `12` (the fraction is dropped, with no error). Pick the
    target type deliberately.

    In Python, a collected VARIANT arrives as a `VariantVal`; its
    `toPython()` method turns it into ordinary dicts and lists (decimals
    come back as `Decimal`).

