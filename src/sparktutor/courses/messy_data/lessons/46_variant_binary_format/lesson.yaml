    ## Shredding at the Byte Level

    "VARIANT Shredding and Performance" showed the shredded columns in
    the footer. Here is what a row in them contains. Write the three days
    of events to one file and read the `v` struct back with pyarrow (no
    Spark involved in the reading):

    ```python
    import glob, json
    import pyarrow.parquet as pq

    events.coalesce(1).write.mode("overwrite").parquet("/tmp/var_shred")
    f = glob.glob("/tmp/var_shred/*.parquet")[0]
    rows = pq.read_table(f).column("v").to_pylist()

    def show(x):
        if isinstance(x, bytes):
            return x.hex(" ")
        if isinstance(x, dict):
            return {k: show(v) for k, v in x.items() if v is not None}
        if isinstance(x, list):
            return [show(v) for v in x]
        return x

    print(json.dumps(show(rows[25])))
    ```

    Row 25 is a day-two purchase (shortened, indented by hand):

    ```text
    {"metadata": "01 09 00 05 09 0b 0f 15 1a 1d 20 22 65 76 65 6e 74 ...",
     "typed_value": {
       "amount": {"value": "11 32 35 2e 38"},
       "event": {"typed_value": "purchase"},
       "event_type": {},
       "items": {"typed_value": [{"typed_value": {"qty": {"typed_value": 1}, "sku": {"typed_value": "P9"}}}, ...]},
       "ts": {"typed_value": "2026-10-02T11:04:00"},
       "user": {"typed_value": {"geo": {}, "id": {"typed_value": 4}, "plan": {"typed_value": "pro"}}},
       "user_id": {}}}
    ```

    - `metadata` is the row's **original** dictionary, unchanged.
    - The top-level `value` is null: every field of this object fits the
      file's shredding schema.
    - `amount` has no `typed_value` column in this file (its types
      disagree across the days), so its `value` holds ordinary VARIANT
      bytes: `11 32 35 2e 38` is the short string `"25.8"`.
    - `event_type`, `user_id` and `user.geo` are `{}`: both columns
      null, which in an object means **the field is absent** in this row.

