    ## The Metadata Dictionary

    ```text
    01                header: version 1, sorted_strings 0, offset_size 1
    04                dictionary size: 4 keys
    00 05 0c 12 14    5 offsets (size + 1) into the string bytes
    65 76 65 6e 74    "event"     bytes  0..5
    75 73 65 72 5f 69 64          "user_id"   5..12
    61 6d 6f 75 6e 74             "amount"   12..18
    74 73             "ts"       18..20
    ```

    The header byte packs three things: the low 4 bits are the version
    (always 1), bit 4 is `sorted_strings`, and bits 6 and 7 hold
    `offset_size - 1`. `VariantBuilder.result()` computes it as
    `VERSION | ((offsetSize - 1) << 6)`:

    - `offset_size` is the smallest width (1 to 4 bytes) that holds both
      the total string length and the number of keys. The dictionary
      size itself is written with that same width.
    - Spark never sets `sorted_strings`. Keys appear in the order the
      parser first met them (`event`, `user_id`, `amount`, `ts`: the JSON
      order of the first object), so a reader can't binary-search the
      dictionary itself.

    A source-reading note: the class comment of `VariantUtil.java` still
    describes the dictionary size as a "4-byte little-endian unsigned
    integer". The builder writes `offsetSize` bytes, and the bytes above
    agree with the builder. When a comment and the code disagree, the
    bytes decide.

