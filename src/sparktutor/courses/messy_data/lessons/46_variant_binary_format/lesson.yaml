    ## Summary

    - A VARIANT is a **metadata** dictionary (header with version and
      offset size, key count, offsets, UTF-8 keys in first-seen order)
      and a **value** whose first byte packs a basic type and type info.
    - Scalars carry their own type ids: INT1 to INT8 by width, DECIMAL4/8/16
      by precision with the written scale, DOUBLE for exponents, short
      strings up to 63 bytes in the header, DATE, TIMESTAMP and
      TIMESTAMP_NTZ, BINARY, FLOAT, LONG_STR.
    - Objects store sorted id and offset lists and unsorted data. Ids
      **must** be sorted by key: from 32 fields on, `getFieldByKey`
      binary-searches, and unsorted ids give silent NULLs.
    - `VariantVal(value, metadata)` lets you hand Spark your own bytes;
      only bounds are checked (`MALFORMED_VARIANT`), not the format.
    - Duplicate keys fail parsing (`VARIANT_DUPLICATE_KEY` under
      `MALFORMED_RECORD_IN_PARSING`); the size limit is 128 MiB despite
      the 16 MiB in one error message.
    - Shredded columns keep the row's metadata; `typed_value` holds what
      fits, `value` holds VARIANT bytes for the rest, both null means
      missing, and a partially shredded object merges the two.

    Next: **Designing Tables for Blobs**, where the payload stops being a
    few hundred bytes of JSON and becomes images, PDFs and audio.
