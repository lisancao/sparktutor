    ## An Object, Byte by Byte

    The object header's type info is `0 b4 b3b2 b1b0`: `b4` says whether
    the field count takes 1 byte or 4 (`is_large`, set above 255
    fields), `b3b2` is `field_id_size - 1` and `b1b0` is
    `field_offset_size - 1`. Then come the field count, the field ids,
    `count + 1` offsets (the last one is the total data size), and the
    field data. Here is the first day-one event:

    ```text
    02                      OBJECT, 1-byte count, 1-byte ids, 1-byte offsets
    04                      4 fields
    02 00 03 01             field ids:  amount(2) event(0) ts(3) user_id(1)
    07 00 0d 05 21          offsets:    7        0        13     5    end=33
    11 76 69 65 77          data +0:  "view"           (short string, 4 bytes)
    0c 00                   data +5:  0                (INT1)
    20 02 65 02 00 00       data +7:  6.13             (DECIMAL4, scale 2, unscaled 613)
    4d 32 30 ... 30         data +13: "2026-10-01T10:00:00" (short string, 19 bytes)
    ```

    Two orders are at work, and confusing them is the classic decoder
    bug:

    - The **id and offset lists are sorted by key name** (`amount`,
      `event`, `ts`, `user_id`). `VariantBuilder.finishWritingObject`
      sorts its `FieldEntry` list (compared with Java's
      `String.compareTo`) before it writes them.
    - The **data stays in the original JSON order** (`event` at offset 0,
      then `user_id`, `amount`, `ts`). Offsets let the sorted lists point
      anywhere.

    `field_id_size` is chosen from the largest id in this object and
    `field_offset_size` from this object's data size, so a small nested
    object inside a huge one still uses 1-byte fields. Objects nest by
    simply containing another value header in their data.

    Arrays are objects without ids. Type info `000 b2 b1b0` holds
    `is_large` and `offset_size - 1`:

    ```text
    [1,"a",null]   03 03 00 02 04 05 0c 01 05 61 00
                   ARRAY, 3 elements, offsets 0 2 4 end 5,
                   then 0c 01 (1), 05 61 ("a"), 00 (null)
    ```

