    ## Why the Field Ids Must Be Sorted

    `Variant.getFieldByKey` (`Variant.java`) is what `variant_get` uses
    to find a key. For objects with fewer than 32 fields
    (`BINARY_SEARCH_THRESHOLD`) it scans the id list; from 32 fields on,
    it **binary-searches** it, comparing dictionary strings. Build an
    object whose id list is in dictionary order instead of key order,
    once small and once with 40 fields:

    ```python
    def obj(keys, values_int, sort_ids):
        n = len(keys)
        strs = b"".join(k.encode() for k in keys)
        offs = [0]
        for k in keys:
            offs.append(offs[-1] + len(k))
        meta = bytes([0x01, n]) + bytes(offs) + strs
        fields = list(range(n))
        if sort_ids:
            fields.sort(key=lambda i: keys[i])
        data, dataoffs = b"", {}
        for i in range(n):
            dataoffs[i] = len(data)
            data += bytes([0x0c, values_int[i]])
        val = bytes([0x02, n]) + bytes(fields) + bytes(dataoffs[i] for i in fields) + bytes([len(data)]) + data
        return VariantVal(val, meta)

    for n in [5, 40]:
        keys = [f"k{i:02d}" for i in reversed(range(n))]   # dictionary in reverse order
        vals = [int(k[1:]) for k in keys]
        for sort in [True, False]:
            r = spark.createDataFrame([(obj(keys, vals, sort),)], "v variant").select(
                sf.variant_get("v", "$.k01", "int").alias("k01"), sf.variant_get("v", "$.k03", "int").alias("k03"),
                sf.substring(sf.to_json("v"), 1, 30).alias("json")).first()
            print(n, "sorted" if sort else "UNSORTED", r)
    ```

    ```text
    5 sorted Row(k01=1, k03=3, json='{"k00":0,"k01":1,"k02":2,"k03"')
    5 UNSORTED Row(k01=1, k03=3, json='{"k04":4,"k03":3,"k02":2,"k01"')
    40 sorted Row(k01=1, k03=3, json='{"k00":0,"k01":1,"k02":2,"k03"')
    40 UNSORTED Row(k01=None, k03=None, json='{"k39":39,"k38":38,"k37":37,"k')
    ```

    The unsorted 40-field object is accepted, prints fine, and
    `variant_get` returns **NULL** for keys that are right there. No
    error, no warning: a wrong result. With 5 fields the linear scan
    hides the bug, so a writer can pass every small test and still
    corrupt real data. If you ever produce VARIANT bytes outside Spark (a
    custom data source, another engine, the exercise below), sort the id
    and offset lists by key, and test with objects of at least 32 fields.

    (Spark's builder sorts with Java `String.compareTo`, which compares
    UTF-16 code units. A writer that sorts by code point or by UTF-8
    bytes agrees with it except for keys that mix characters above
    U+FFFF with characters from U+E000 to U+FFFF; test such keys if
    your data has them.)

