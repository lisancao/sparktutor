    ## Hand-Made Bytes, Read by Spark

    `VariantVal(value, metadata)` accepts any bytes, and a DataFrame
    with a `variant` column accepts any `VariantVal`. Encode
    `{"a": 1, "b": "hi"}` by hand:

    ```python
    from pyspark.sql.types import VariantVal

    metadata = bytes([0x01, 0x02, 0x00, 0x01, 0x02]) + b"ab"
    value = bytes([0x02, 0x02, 0x00, 0x01, 0x00, 0x02, 0x05, 0x0c, 0x01, 0x09]) + b"hi"
    df = spark.createDataFrame([(VariantVal(value, metadata),)], "v variant")
    df.select(sf.to_json("v"), sf.variant_get("v", "$.b", "string"), sf.schema_of_variant("v")).show(truncate=False)
    ```

    ```text
    +----------------+-------------------+----------------------------+
    |to_json(v)      |variant_get(v, $.b)|schema_of_variant(v)        |
    +----------------+-------------------+----------------------------+
    |{"a":1,"b":"hi"}|hi                 |OBJECT<a: BIGINT, b: STRING>|
    +----------------+-------------------+----------------------------+
    ```

    Nothing validates the bytes on the way in. A truncated object is
    accepted by `createDataFrame` and fails only when an expression
    reads it:

    ```python
    bad = spark.createDataFrame([(VariantVal(bytes([0x02, 0x05]), metadata),)], "v variant")
    print("created fine")
    bad.select(sf.to_json("v")).collect()
    ```

    ```text
    created fine
    SparkRuntimeException [MALFORMED_VARIANT] Variant binary is malformed. Please check the data source is valid. SQLSTATE: 22023
    ```

    `VariantUtil.checkIndex` raises `MALFORMED_VARIANT` whenever a read
    would run past the end of the buffer. It is a bounds check, not a
    validation of the format, which matters for the next experiment.

