    ## The Value Header

    Every value starts with one header byte. The low 2 bits are the
    **basic type**, the high 6 bits the **type info**:

    | Basic type | Meaning | Type info |
    |---|---|---|
    | 0 PRIMITIVE | a scalar | the primitive type id |
    | 1 SHORT_STR | a string of 0 to 63 bytes | its length; the UTF-8 bytes follow |
    | 2 OBJECT | an object | sizes of its integer fields |
    | 3 ARRAY | an array | sizes of its integer fields |

    The primitive type ids, from `VariantUtil.java`, with the content
    that follows the header:

    | Id | Type | Content |
    |---|---|---|
    | 0, 1, 2 | null, true, false | nothing |
    | 3, 4, 5, 6 | INT1, INT2, INT4, INT8 | little-endian signed, 1/2/4/8 bytes |
    | 7 | DOUBLE | 8 bytes IEEE |
    | 8, 9, 10 | DECIMAL4, DECIMAL8, DECIMAL16 | 1 scale byte + 4/8/16-byte signed unscaled |
    | 11 | DATE | 4-byte days since 1970-01-01 |
    | 12, 13 | TIMESTAMP, TIMESTAMP_NTZ | 8-byte microseconds since the epoch |
    | 14 | FLOAT | 4 bytes IEEE |
    | 15 | BINARY | 4-byte length + bytes |
    | 16 | LONG_STR | 4-byte length + UTF-8 bytes |
    | 20 | UUID | 16 bytes, big-endian |

    So the header byte of a primitive is `type_id << 2`: `0c` is INT1
    (3 << 2), `20` is DECIMAL4 (8 << 2), `40` is LONG_STR. A short string
    is `(length << 2) | 1`: `11` is a 4-byte string, `4d` a 19-byte one.
    That is why short strings stop at 63 bytes: 6 bits of type info.

