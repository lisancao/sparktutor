    ## Limits and Parse Errors

    - **Duplicate keys.** `parse_json('{"a":1,"a":2}')` fails. In a
      classic PySpark script it arrives as a raw
      `Py4JJavaError`, with the real conditions in its text:
      `[MALFORMED_RECORD_IN_PARSING.WITHOUT_SUGGESTION] Malformed records
      are detected in record parsing` caused by `[VARIANT_DUPLICATE_KEY]
      Failed to build variant because of a duplicate object key `a``.
      `try_parse_json` returns NULL instead. The internal
      `spark.sql.variant.allowDuplicateKeys` (default false, 4.0) keeps
      the last value: `{"a":2}`. Messy feeds do contain duplicate keys,
      so decide which behaviour you want before the first bad file.
    - **Size.** `VariantUtil.SIZE_LIMIT` is 128 MiB for a value and for
      a metadata blob (16 MiB only when Spark runs its own tests). The
      message of `VARIANT_CONSTRUCTOR_SIZE_LIMIT` in
      `error-conditions.json` still says 16 MiB; the code says 128. A
      20 MB string parses fine:

      ```python
      spark.sql("SELECT length(to_json(parse_json(concat('\"', repeat('x', 20000000), '\"')))) AS n").first().n
      ```

      ```text
      20000002
      ```

      Building a value over the limit fails with `VARIANT_SIZE_LIMIT`
      ("Cannot build variant bigger than <sizeLimit> in
      <functionName>"), so a VARIANT column is not a place for blobs; "Designing
      Tables for Blobs" covers what is.
    - **Offsets.** Offsets and ids are at most 4 bytes, and data
      offsets are relative to the object or array that contains them, so
      deep nesting costs a few header bytes per level, not a rewrite.

