    ## What You'll Learn

    "VARIANT Basics: Profiling and Nested Data" used VARIANT as a type,
    "VARIANT Shredding and Performance" (intermediate level) looked at
    which columns Spark writes, and "Parquet from the Inside" decoded the
    Parquet file around them. Every one of those lessons treated the two
    blobs inside a VARIANT as opaque. This lesson opens them.

    You will read the encoding the way Spark's own code does, from
    `common/variant/src/main/java/org/apache/spark/types/variant/` in the
    4.2.0 repo (`VariantUtil.java` for the layout and type ids,
    `VariantBuilder.java` for how `parse_json` writes it, `Variant.java`
    for how a lookup reads it), and you will check every rule against
    real bytes from the sample events.

    By the end you will be able to:

    - Decode a VARIANT metadata dictionary and value by hand, header bit
      by header bit
    - Predict exactly which bytes `parse_json` produces for a document,
      including integer widths, decimal versus double, field order and
      offset sizes
    - Build VARIANT bytes yourself and hand them to Spark, and know what
      Spark checks (and doesn't) when it reads them
    - Read a shredded VARIANT column at the byte level with pyarrow and
      rebuild the original value from `typed_value` and `value`
    - Explain the performance model: offset lookups, binary search over
      sorted keys, and what shredding saves

    `common/variant/README.md` is short and worth quoting: Spark
    implements the Parquet project's VariantEncoding and VariantShredding
    specs at a pinned parquet-format commit, "but does not yet support
    Variant values containing UUID, Time, or nanosecond-precision
    Timestamp", and has no public API to choose a shredding schema.
    VARIANT arrived in 4.0 (SPARK-45827).

