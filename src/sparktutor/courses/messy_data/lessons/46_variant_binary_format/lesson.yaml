    ## PySpark Already Has a Decoder

    `pyspark/sql/variant_utils.py` contains `VariantUtils` (the
    decoder behind `VariantVal.toPython()` and `toJson()`) and a Python
    `VariantBuilder` (behind `VariantVal.parseJson`). They are worth
