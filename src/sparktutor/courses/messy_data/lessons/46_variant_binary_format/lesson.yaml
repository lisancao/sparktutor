    ## Two Blobs per Value

    In Python a VARIANT comes back as `pyspark.sql.types.VariantVal`
    (4.0) with two attributes, `value` and `metadata`, both `bytes`:

    ```python
    events = spark.read.option("singleVariantColumn", "v").json("data/messy/events")
    first = events.filter(sf.col("_metadata.file_name").contains("10-01")).first().v
    print(type(first).__name__, first.toJson())
    print(len(first.metadata), first.metadata.hex(" "))
    print(len(first.value), first.value.hex(" "))
    ```

    ```text
    VariantVal {"amount":6.13,"event":"view","ts":"2026-10-01T10:00:00","user_id":0}
    27 01 04 00 05 0c 12 14 65 76 65 6e 74 75 73 65 72 5f 69 64 61 6d 6f 75 6e 74 74 73
    44 02 04 02 00 03 01 07 00 0d 05 21 11 76 69 65 77 0c 00 20 02 65 02 00 00 4d 32 30 32 36 2d 31 30 2d 30 31 54 31 30 3a 30 30 3a 30 30
    ```

    The **metadata** is a dictionary of every object key used anywhere
    in the value. The **value** refers to keys by their position in that
    dictionary. Each row carries its own metadata: there is no table-wide
    dictionary. (In Parquet, the `v.metadata` column of the sample events
    is dictionary-encoded, so three distinct blobs over 61 rows cost 224
    bytes in total; Parquet de-duplicates what VARIANT repeats.)

