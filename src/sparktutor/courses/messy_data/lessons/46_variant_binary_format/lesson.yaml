    ## The Reconstruction Rules

    The sample events don't show every case, so write a file that does
    (40 regular rows, then five odd ones):

    ```python
    docs = [{"a": i, "b": {"x": i, "y": "s"}} for i in range(40)]
    docs += [{"a": None, "b": {"x": 1, "y": "s"}}, {"a": 2, "b": {"x": 1, "y": "s", "z": True}},
             {"a": 4}, {"a": 5, "b": {"x": None, "y": "s"}}, {"a": 6, "b": {"y": "s"}, "c": [1]}]
    df = spark.createDataFrame([(json.dumps(d),) for d in docs], "j string").select(sf.parse_json("j").alias("v"))
    df.coalesce(1).write.mode("overwrite").parquet("/tmp/var_cases")
    ```

    `a`, `b.x` and `b.y` get typed columns (the rare `z` and `c` don't).
    The odd rows, without metadata:

    ```text
    {'a': None, 'b': {'x': 1, 'y': 's'}}           -> {'typed_value': {'a': {'value': '00'}, 'b': {'typed_value': {'x': {'typed_value': 1}, 'y': {'typed_value': 's'}}}}}
    {'a': 2, 'b': {'x': 1, 'y': 's', 'z': True}}   -> {'typed_value': {'a': {'typed_value': 2}, 'b': {'value': '02 01 04 00 01 04', 'typed_value': {'x': {'typed_value': 1}, 'y': {'typed_value': 's'}}}}}
    {'a': 4}                                       -> {'typed_value': {'a': {'typed_value': 4}, 'b': {}}}
    {'a': 5, 'b': {'x': None, 'y': 's'}}           -> {'typed_value': {'a': {'typed_value': 5}, 'b': {'typed_value': {'x': {'value': '00'}, 'y': {'typed_value': 's'}}}}}
    {'a': 6, 'b': {'y': 's'}, 'c': [1]}            -> {'value': '02 01 03 00 06 03 01 00 02 0c 01', 'typed_value': {'a': {'typed_value': 6}, 'b': {'typed_value': {'x': {}, 'y': {'typed_value': 's'}}}}}
    ```

    Read every node the same way:

    | `typed_value` | `value` | Meaning |
    |---|---|---|
    | set | null | the value, from the typed column |
    | null | set | VARIANT bytes: a type that didn't fit, or a JSON `null` (`00`) |
    | null | null | missing (only valid for an object field) |
    | object, set | object, set | a **partially shredded** object: merge the typed fields with the residual object in `value` |

    `02 01 04 00 01 04` is an object with one field, id 4 (`z` in that
    row's dictionary), data `04` (true). `02 01 03 00 06 03 01 00 02 0c
    01` is the top-level residual `{"c": [1]}`. A JSON null is **not**
    the same as a missing field: `{"x": None}` stores `value = 00`,
    `{}` stores nothing.

    `VariantShreddingWriter.java` produces these columns and
    `ShreddingUtils.java` rebuilds a VARIANT from them on read when a
    query needs the whole value. A query that asks for one typed field
    (`try_variant_get(v, '$.a', 'int')` with `pushVariantIntoScan`)
    reads that field's own columns instead of rebuilding the whole
    value.

