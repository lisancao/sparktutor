    ## What the Format Costs and Saves

    The design choices add up to a clear performance model:

    - **Lookups are offset jumps.** To get `$.user.plan`, Spark reads the
      object header, finds `user` in the id list (scan or binary search,
      comparing dictionary strings), jumps by its offset, and repeats one
      level down. It never parses the other fields' bytes. JSON text must
      be tokenized up to the field you want.
    - **Keys are resolved by string comparison** against the row's
      dictionary, because each row has its own dictionary. There are no
      global field ids to cache.
    - **Shredding skips the format entirely** for typed fields: a
      shredded `user.id` is an INT64 Parquet column, decoded by the
      vectorized reader like any other.
    - **Building is the expensive direction.** `to_json` or rebuilding a
      full VARIANT from shredded columns touches every byte.

    An indicative measurement on a laptop (`local[4]`, 100,000 objects
    of 100 integer keys each, stored as JSON strings in Parquet or as
    unshredded VARIANT; best of three runs; your numbers will differ):

    | Query | JSON string, `get_json_object` | VARIANT, `variant_get` | Ratio |
    |---|---|---|---|
    | sum of `$.k000` | 0.21 s | 0.09 s | 2.4 |
    | sum of `$.k099` | 0.20 s | 0.08 s | 2.4 |
    | sum of `length(to_json(v))` | | 2.02 s | |

    Two honest observations: extracting the first and the last of 100
    keys costs the same for both formats here (the lookup is not where
    the time goes at this size), and turning the whole VARIANT back into
    text is more than twenty times slower than extracting a field. Don't
    `to_json` a VARIANT column to filter on it.

