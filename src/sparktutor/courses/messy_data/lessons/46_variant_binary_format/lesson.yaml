    ## How parse_json Picks Each Encoding

    ```python
    for text in ["1", "-129", "300", "70000", "5000000000", "9223372036854775808", "12.34", "1.50",
                 "0.000001", "1234567890.12", "1.5e3", "1E2", '"hi"', "true", "null", "[1,\"a\",null]"]:
        v = spark.sql(f"SELECT parse_json('{text}') AS v").first().v
        print(f"{text:22} {v.value.hex(' ')}")
    ```

    ```text
    1                      0c 01
    -129                   10 7f ff
    300                    10 2c 01
    70000                  14 70 11 01 00
    5000000000             18 00 f2 05 2a 01 00 00 00
    9223372036854775808    28 00 00 00 00 00 00 00 00 80 00 00 00 00 00 00 00 00
    12.34                  20 02 d2 04 00 00
    1.50                   20 02 96 00 00 00
    0.000001               20 06 01 00 00 00
    1234567890.12          24 02 14 1a 99 be 1c 00 00 00
    1.5e3                  1c 00 00 00 00 00 70 97 40
    1E2                    1c 00 00 00 00 00 00 59 40
    "hi"                   09 68 69
    true                   04
    null                   00
    [1,"a",null]           03 03 00 02 04 05 0c 01 05 61 00
    ```

    The rules, from `VariantBuilder.buildJson`, `appendLong`,
    `tryParseDecimal` and `appendDecimal`:

    - **Integers** use the narrowest of INT1, INT2, INT4, INT8 that holds
      them. `-129` needs INT2 (`10 7f ff`).
    - **An integer too big for a long** (`9223372036854775808`) is parsed
      as a decimal with scale 0, and with 19 digits it lands in DECIMAL16.
    - **A number with a fraction and no exponent** becomes a decimal if
      its precision and scale are at most 38, in the narrowest of
      DECIMAL4 (precision and scale up to 9), DECIMAL8 (18) and
      DECIMAL16. The scale is kept as written: `1.50` is scale 2,
      unscaled 150 (`96 00 00 00`), not 1.5.
    - **A number with an exponent** (`1.5e3`, `1E2`), or one with more
      than 38 digits, becomes a DOUBLE.

    That last rule is why "VARIANT Shredding and Performance" found that
    a field mixing `1` and `1.5e3` is never shredded: an integer and a
    double don't merge, while an integer and a decimal do.

    `schema_of_variant` hides the widths: it reports every integer as
    `BIGINT`. The bytes are the only place to see them.

