    ## Types JSON Can't Express

    JSON has no dates, timestamps or bytes, but VARIANT does. Casting a
    typed value to VARIANT keeps its type:

    ```python
    r = spark.sql("""SELECT cast(date'2026-10-01' AS variant) AS d,
                            cast(timestamp'2026-10-01 10:00:00' AS variant) AS t,
                            cast(timestamp_ntz'2026-10-01 10:00:00' AS variant) AS n,
                            cast(X'CAFE' AS variant) AS b,
                            cast(1.5f AS variant) AS f""").first()
    for k in r.asDict():
        print(k, r[k].value.hex(" "), repr(r[k].toPython()), r[k].toJson())
    ```

    ```text
    d 2c f7 50 00 00 datetime.date(2026, 10, 1) "2026-10-01"
    t 30 00 08 92 7a c4 5c 06 00 datetime.datetime(2026, 10, 1, 10, 0, tzinfo=zoneinfo.ZoneInfo(key='UTC')) "2026-10-01 10:00:00+00:00"
    n 34 00 08 92 7a c4 5c 06 00 datetime.datetime(2026, 10, 1, 10, 0) "2026-10-01 10:00:00"
    b 3c 02 00 00 00 ca fe b'\xca\xfe' "yv4="
    f 38 00 00 c0 3f 1.5 1.5
    ```

    `0x50f7` is 20727 days after 1970-01-01. TIMESTAMP and TIMESTAMP_NTZ
    store identical microseconds and differ only in the type id (12
    versus 13); the difference is how they are rendered. In JSON output a
    date and a timestamp become strings and binary becomes base64, so
    `to_json` is lossy: `parse_json(to_json(v))` gives you strings back,
    not dates. For ingestion that means a VARIANT built from JSON never
    contains a DATE, whatever the text looked like.

