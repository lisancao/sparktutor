    ## Writes That Survive Retries and Reruns

    A retried task is safe for Spark's file writers because of the
    commit protocol (`spark.sql.sources.commitProtocolClass`, default
    `SQLHadoopMapReduceCommitProtocol`, over Hadoop's
    `FileOutputCommitter` with algorithm version 1, which
    `SparkHadoopUtil` sets unless you set
    `spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version`). Each task attempt writes under its own
    directory, and only the job commit moves files into place. Looking
    from inside a running task (a UDF that lists the output folder,
    during a two-task write where one task fails once):

    ```text
    _temporary/0/_temporary/attempt_20261028141622117626066273813706_0000_m_000000_0/
        part-00000-7ef571dc-21d8-47e1-9a16-58e86f27f31f-c000.snappy.parquet
    ```

    and after the job: `_SUCCESS`, `part-00000-...` and `part-00001-...`,
    one file per partition, no matter how many attempts ran. "Writers"
    built the same idea by hand for a Python data source (staging
    folder, job id, manifest).

    What the commit protocol does not cover is the **rerun**: the job
    succeeded, something after it failed, and the scheduler runs the
    whole job again. Then the save mode decides:

    - `append` adds a second copy of everything.
    - `overwrite` replaces the table, which is idempotent for a job
      that rebuilds all of it.
    - For partitioned outputs where a run produces some partitions
      (one day, one source), `partitionBy(...)` with
      `spark.sql.sources.partitionOverwriteMode=dynamic` replaces only
      the partitions present in the new data. The default is `static`,
      where `overwrite` deletes every partition first.
    - Table formats make this explicit: Delta's `replaceWhere` or a
      `MERGE` keyed by a content id ("Landing Messy Data in Delta Lake").

    And side effects that are not files: an email, a payment, a row
    posted to another system. Inside a task they repeat with every
    retry, every recomputed stage, every speculative copy and every
    extra action. The rule is the same as for a streaming sink: give
    each effect a stable key (the content id, the batch id), and either
    perform it once on the driver after the data is committed, or make
    the receiver ignore a repeated key.

