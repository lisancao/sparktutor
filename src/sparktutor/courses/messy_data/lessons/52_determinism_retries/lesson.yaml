    ## A Lost Shuffle, Three Ways

    When a reducer cannot read a map output (the executor that wrote it
    died, or its disk was wiped), the task fails with a
    `FetchFailedException`. That does not count as a task failure;
    `DAGScheduler` marks the map output lost and resubmits the map
    stage (only the missing map tasks) and then the failed stage.

    You can cause one on a laptop: run a job, delete one map task's
    shuffle files from `spark.local.dir`, and run the same DataFrame
    again. The second `collect()` reuses the shuffle (the map stage is
    skipped), and the reducers find a file missing:

    ```python
    import shutil

    def lost_shuffle(udf_kind, full_retry):
        local = tempfile.mkdtemp()
        spark = fresh("local[4]", **{
            "spark.local.dir": local,
            "spark.sql.adaptive.enabled": "false",
            "spark.sql.shuffle.orderIndependentChecksum.enableFullRetryOnMismatch": full_retry})

        def bucket(x):
            return random.randint(0, 3) if udf_kind == "random" else x % 4

        df = (spark.range(0, 4000, numPartitions=4)
              .withColumn("b", F.udf(bucket, "int")("id"))
              .repartition(4, "b")
              .groupBy("b").agg(F.count("*").alias("n")))
        first = sorted((r.b, r.n) for r in df.collect())
        victim = sorted(glob.glob(f"{local}/**/shuffle_*_0_0.data", recursive=True))[0]
        for f in glob.glob(victim.replace(".data", ".*")):
            os.remove(f)                                     # map task 0's output is gone
        try:
            second = sorted((r.b, r.n) for r in df.collect())
            print(f"{udf_kind:7} fullRetry={full_retry:5}  same result: {first == second}  "
                  f"rows: {sum(n for _, n in second)}")
        except Exception as e:
            msg = [l for l in str(e).splitlines() if "Job aborted" in l][0]
            print(f"{udf_kind:7} fullRetry={full_retry:5}  FAILED: {msg[msg.index('Job aborted'):][:200]}")
        shutil.rmtree(local, ignore_errors=True)

    lost_shuffle("modulo", "true")
    lost_shuffle("random", "false")
    lost_shuffle("random", "true")
    ```

    ```text
    modulo  fullRetry=true   same result: True  rows: 4000
    random  fullRetry=false  same result: False  rows: 4000
    random  fullRetry=true   FAILED: Job aborted due to stage failure: A shuffle map stage
      with indeterminate output was failed and retried. However, Spark cannot rollback the
      ResultStage 3 to re-process the input data, and has to fail this job. Please eliminate
      the indeterminacy by checkpointing the RDD before repartition and try again.
    ```

    (The `fresh()` helper turns logging off. At level `ERROR` the log
    shows `ShuffleBlockFetcherIterator: Error occurred while fetching
    local blocks` with a `java.nio.file.NoSuchFileException` for
    `shuffle_0_0_0.index`; that is the fetch failure. The stage retry
    itself is silent unless you read the log or the stage attempts in
    the Spark UI.)

    - With a deterministic UDF, the recomputed map task wrote the same
      data, and the result is identical: the retry was invisible.
    - With a random UDF and the 4.2 check turned off, the job
      "succeeded" with different counts. The second answer is not
      wrong in itself (the bucketing is random), but nothing told you
      that a recomputation happened and that the data under the result
      changed. When reducers that already finished read the *old* map
      output and the others read the *new* one, rows are lost or
      duplicated; that is the failure mode behind SPARK-23207 and
      SPARK-51756 ("Non-deterministic stage could lead to incorrect
      results with partial retry").
    - With the default settings, Spark noticed and refused.

    What noticed it is new. Spark 4.1 (SPARK-51756) taught SQL shuffle
    map tasks to compute an **order-independent checksum** of what they
    write to each reduce partition and report it with their map status
    (`spark.sql.shuffle.orderIndependentChecksum.enabled`). When a
    recomputed map task reports a different checksum,
    `MapOutputTracker.registerMapOutput` flags a mismatch, the stage
    becomes `isRuntimeIndeterminate` (`ShuffleMapStage.scala`), and
    `DAGScheduler` rolls back every stage that consumed it so that all
    of their tasks run again
    (`spark.sql.shuffle.orderIndependentChecksum.enableFullRetryOnMismatch`).
    Both settings were `false` in 4.1 and are `true` by default in 4.2
    (SPARK-54830), which is why this protection is new to most
    readers. A `ShuffleMapStage` can be rolled back (unless the legacy
    `spark.shuffle.useOldFetchProtocol` is on). A `ResultStage` that
    already finished some partitions cannot, because those results may
    already be in your driver or written out (SPARK-25342, "Support
    rolling back a result stage", is still open), so
    `filterAndAbortUnrollbackableStages` aborts the job with the message
    above. In 4.2.0 SQL shuffles use this runtime detection instead of
    the older static rule (`isStaticallyIndeterminate`, from the RDD
    level) whenever full retry is enabled.

    The advice in the error message, checkpoint before the shuffle, is
    the general fix: a reliably checkpointed RDD is `DETERMINATE` by
    definition (`isReliablyCheckpointed` in `RDD.outputDeterministicLevel`).
    The better fix is not to feed a shuffle with values that change on
    recomputation.

