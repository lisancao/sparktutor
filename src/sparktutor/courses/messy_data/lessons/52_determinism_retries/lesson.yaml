    ## Local Mode Hides Retries

    Run the same failing task under two masters. The UDF fails on the
    first attempt of partition 1 and records every call with its
    attempt number:

    ```python
    import glob, os, random, tempfile
    from pyspark import TaskContext
    from pyspark.sql import SparkSession, functions as F
    from pyspark.sql.types import DoubleType

    def fresh(master, **conf):
        """Stop the active session and start one with this master.
        builder.getOrCreate() would silently reuse the old one."""
        active = SparkSession.getActiveSession()
        if active is not None:
            active.stop()
        builder = SparkSession.builder.master(master)
        for k, v in conf.items():
            builder = builder.config(k, v)
        s = builder.getOrCreate()
        s.sparkContext.setLogLevel("OFF")
        return s

    def attempt_demo(master):
        spark = fresh(master)
        log = tempfile.mkdtemp()

        def flaky(x, r):
            ctx = TaskContext.get()
            v = random.random()
            with open(f"{log}/p{ctx.partitionId()}_a{ctx.attemptNumber()}.txt", "a") as f:
                f.write(f"{x} {v} {r}\n")
            if ctx.partitionId() == 1 and ctx.attemptNumber() == 0 and x == 150:
                raise RuntimeError("injected failure on the first attempt")
            return v

        df = (spark.range(0, 400, numPartitions=4).select("id", F.rand(7).alias("r"))
              .withColumn("py", F.udf(flaky, DoubleType())("id", "r")))
        try:
            print(master, "rows:", df.count() and len(df.collect()))
        except Exception as e:
            print(master, "failed:", type(e).__name__)
        print("  attempt files:", sorted(os.path.basename(p) for p in glob.glob(f"{log}/*")))
        return log

    attempt_demo("local[4]")
    log = attempt_demo("local[4,2]")
    for a in (0, 1):
        line = [l for l in open(f"{log}/p1_a{a}.txt") if l.startswith("120 ")][0]
        print(f"  id 120, attempt {a}: random.random()={line.split()[1]}  rand(7)={line.split()[2]}")
    ```

    ```text
    local[4] failed: PythonException
      attempt files: ['p0_a0.txt', 'p1_a0.txt', 'p2_a0.txt', 'p3_a0.txt']
    local[4,2] rows: 400
      attempt files: ['p0_a0.txt', 'p1_a0.txt', 'p1_a1.txt', 'p2_a0.txt', 'p3_a0.txt']
      id 120, attempt 0: random.random()=0.17458449299896028  rand(7)=0.6118994604433453
      id 120, attempt 1: random.random()=0.8618682996681739  rand(7)=0.6118994604433453
    ```

    (`df.count()` does not call the UDF, because the `py` column is
    pruned; `collect()` does. The files are written by the `collect()`.)

    `SparkContext.createTaskScheduler` (`core/src/main/scala/org/apache/spark/SparkContext.scala`)
    builds the local scheduler with `MAX_LOCAL_TASK_FAILURES = 1` for
    `local` and `local[N]`: **one failure fails the job**, and
    `spark.task.maxFailures` is not consulted. The master
    `local[N,F]` (regex `LOCAL_N_FAILURES_REGEX`) allows F attempts per
    task. Tests that never use it never see a retry.

    Speculation cannot be tried locally at all: `TaskSchedulerImpl.start`
    schedules the speculation check only when `!isLocal`. Even
    `local-cluster[2,1,1024]` (real executor JVMs on one machine) never
    launched a copy in my runs, because a speculative copy must run on
    a different host from the original. To study speculation you need
    two machines; to defend against it, apply everything below: a
    speculative copy is just a second attempt that runs at the same
    time as the first.

