    ## Spark Connect Analyses Every Action Again

    In Classic mode a DataFrame holds a `QueryExecution`: it is
    analyzed once, and its optimized plan (where `current_timestamp()`
    becomes a literal and random seeds are fixed) is computed once and
    kept. A Spark Connect DataFrame is an unresolved plan on the
    client; every action sends it to the server, which analyzes and
    optimizes it from scratch. The same script in both modes:

    ```python
    import time
    from pyspark.sql import SparkSession, functions as F

    def compare(spark, mode):
        sql_df = spark.sql("SELECT rand() AS r, uuid() AS u, current_timestamp() AS t")
        api_df = spark.range(1).select(F.rand().alias("r"), F.uuid().alias("u"),
                                       F.current_timestamp().alias("t"))
        for name, df in [("spark.sql", sql_df), ("DataFrame API", api_df)]:
            a = df.collect()[0]; time.sleep(1.1); b = df.collect()[0]
            print(f"{mode:8} {name:14} same rand: {a.r == b.r}  same uuid: {a.u == b.u}  "
                  f"same timestamp: {a.t == b.t}")
    ```

    ```text
    classic  spark.sql      same rand: True  same uuid: True  same timestamp: True
    classic  DataFrame API  same rand: True  same uuid: True  same timestamp: True
    connect  spark.sql      same rand: False  same uuid: False  same timestamp: False
    connect  DataFrame API  same rand: True  same uuid: True  same timestamp: False
    ```

    (For Connect, run it with `SparkSession.builder.remote("local[2]")`
    instead of `master`.)

    Two surprises:

    - In Classic, `current_timestamp()` stayed the same across two
      actions on the same DataFrame, more than a second apart, because
      the optimized plan with the timestamp folded in is reused. A new
      DataFrame gets a new time.
    - In Connect, the Python client generates a seed itself when you
      call `F.rand()` or `F.uuid()` without one (`pyspark/sql/connect/functions/builtin.py`
      passes `lit(py_random.randint(0, sys.maxsize))`), so DataFrame API
      randomness is stable across actions. SQL text is re-analyzed on
      the server and `ResolveRandomSeed` picks a new seed each time.

    For pipelines this means: in Connect, a DataFrame built with
    `spark.sql("... rand() ...")` gives a different sample to each
    action that uses it. Write the seed into the SQL (`rand(42)`), or
    materialize the result before using it twice.

