    ## What You'll Learn

    "Streaming Internals: Checkpoints, State and Real-Time Mode" showed
    a micro-batch being replayed after a crash and a sink surviving it.
    Batch jobs replay too, in more ways and with less ceremony: a task
    is retried, a stage is recomputed because its shuffle files
    vanished, a slow task gets a speculative twin, a DataFrame without
    a cache is computed once per action. Each time, your Python runs
    again. If it is deterministic and its effects are idempotent, you
    never notice. If not, you get duplicates, drifting ids and, in the
    worst case, a job that Spark itself refuses to finish.

    This lesson assumes "Writers" and "Streaming Readers and Writers"
    (commit protocols and batch ids) and "How Catalyst Plans Python"
    (Python UDFs in plans). By the end you will be able to:

    - List every way Spark 4.2 can execute the same code twice, and
      reproduce most of them on a laptop
    - Tell retry-stable nondeterminism (`rand(seed)`, `uuid()`) from
      the kind that breaks retries (Python `random`, wall clocks)
    - Predict what Catalyst does with a nondeterministic expression,
      and prove it with a plan and a call count
    - Read `RDD.outputDeterministicLevel` and explain how
      `DAGScheduler` handles a lost shuffle from an indeterminate stage,
      including the 4.2 checksum-based retry and the error you get when
      Spark gives up
    - Show why Spark Connect re-runs analysis per action, and what that
      does to `rand()` and `current_timestamp()`
    - Inject failures deliberately (`local[N,F]`, `attemptNumber()`,
      deleted shuffle files, a crash flag) and prove a pipeline gives
      byte-identical results under them

    Paths below are relative to the Spark 4.2.0 source tree; the
    scheduler is in `core/src/main/scala/org/apache/spark/scheduler/`.

