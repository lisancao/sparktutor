    ## Summary

    - Spark re-executes code on task failures, fetch failures (map
      stage resubmission), indeterminate rollbacks, speculation, every
      action on an uncached DataFrame, cache rebuilds, streaming
      replays, and (for analysis) every Spark Connect action.
    - `local[N]` never retries a task; `local[N,F]` allows F attempts.
      Speculation is off in local mode by construction.
    - `rand(seed)`, `uuid()` and friends are seeded per partition and
      repeat on retry; Python randomness, clocks and services do not.
      `monotonically_increasing_id()` and `sample()` depend on
      partitioning. Ids that must survive reruns come from content.
    - The deterministic flag is a promise to the optimizer:
      `asNondeterministic()` keeps filters above the UDF, and
      nondeterministic expressions are rejected where they would be
      unsafe (`INVALID_NON_DETERMINISTIC_EXPRESSIONS`).
    - RDDs report `DETERMINATE`, `UNORDERED` or `INDETERMINATE`;
      `sortBeforeRepartition` keeps round-robin repartitions safe. In
      4.2, SQL shuffles checksum their output, and a recomputed map task
      with different output rolls back all consumers, or aborts the job
      if a result stage already finished partitions.
    - Accumulator updates from failed tasks are dropped, but second
      actions and recomputed stages count again. `observe()` counts what
      was written, once.
    - Classic DataFrames keep their optimized plan (same timestamp
      across actions); Connect re-analyzes per action, so SQL `rand()`
      changes between actions.
    - Commit protocols make a job atomic, not a rerun idempotent: choose
      overwrite semantics, key every external effect, and post effects
      after the commit.

    Next: **Shipping Python Dependencies to a Cluster**, where the code
    that all these retries re-run has to reach the executors in the
    first place.
