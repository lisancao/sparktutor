    ## Determinism Levels in the DAG

    The scheduler knows nothing about expressions. It works with RDDs,
    and each RDD reports `outputDeterministicLevel`
    (`core/src/main/scala/org/apache/spark/rdd/RDD.scala`), one of:

    - `DETERMINATE`: same data in the same order on every computation
    - `UNORDERED`: same data, order may differ. Every shuffle read is
      at least this, because fetched blocks arrive in random order
    - `INDETERMINATE`: the data itself may differ

    `getOutputDeterministicLevel` derives it from the parents. The
    case that matters is an **order-sensitive** function on `UNORDERED`
    input, which gives `INDETERMINATE` (`MapPartitionsRDD`,
    `PartitionwiseSampledRDD`). The classic order-sensitive function is
    a round-robin repartition: row k goes to partition k mod n, so a
    different order sends rows to different partitions. You can read the
    level of a plan's final RDD in Classic mode:

    ```python
    spark = fresh("local[4]", **{"spark.sql.adaptive.enabled": "false"})

    def level(df):
        return df._jdf.queryExecution().toRdd().outputDeterministicLevel().toString()

    base = spark.range(0, 1000, numPartitions=4)
    shuffled = base.groupBy((F.col("id") % 10).alias("k")).count()
    for name, df in {
        "range": base,
        "groupBy": shuffled,
        "hash repartition after groupBy": shuffled.repartition(4, "k"),
        "round-robin repartition after groupBy": shuffled.repartition(3),
        "sample after groupBy": shuffled.sample(0.5, seed=1),
    }.items():
        print(f"{name:40} {level(df)}")
    spark.conf.set("spark.sql.execution.sortBeforeRepartition", "false")
    print(f"{'round-robin, sortBeforeRepartition=false':40} {level(shuffled.repartition(3))}")
    ```

    ```text
    range                                    DETERMINATE
    groupBy                                  UNORDERED
    hash repartition after groupBy           UNORDERED
    round-robin repartition after groupBy    UNORDERED
    sample after groupBy                     UNORDERED
    round-robin, sortBeforeRepartition=false INDETERMINATE
    ```

    Round-robin `repartition(n)` is safe by default because
    `ShuffleExchangeExec` sorts each input partition before assigning
    rows (`spark.sql.execution.sortBeforeRepartition`, internal,
    default `true`, added for SPARK-23207, "Shuffle+Repartition on an
    DataFrame could lead to incorrect answers"); it marks the RDD
    order-sensitive only when that sort is off. The level also says
    nothing about Python: a UDF that calls `random.random()` before a
    shuffle leaves the map stage "DETERMINATE" as far as the scheduler
    knows.

