    ## Nondeterminism That Survives a Retry, and the Kind That Does Not

    The output above holds the most useful fact in this lesson.
    `rand(7)` gave the same value to row 120 in both attempts;
    Python's `random.random()` did not.

    Spark's own random expressions implement the `Nondeterministic`
    trait (`sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/expressions/Expression.scala`):
    `initialize(partitionIndex)` seeds the generator with the
    expression's seed plus the partition index. `rand`, `randn`,
    `uuid`, `shuffle`, `random` all work this way. Given the same seed,
    the same partition and the same input order, a retried task
    produces the same values. A seed you do not give is chosen at
    analysis time by the analyzer rule `ResolveRandomSeed` (in
    `Analyzer.scala`) and then fixed in the plan.

    So `rand()` is repeatable *within a query* and for the same
    partitioning; it is not repeatable across queries, or when the rows
    arrive in another order. Python code has none of these guarantees:
    `random`, `uuid.uuid4()`, `time.time()`, `datetime.now()` and a
    call to a service all give a retry different answers. (One
    classic source is defused for you: `SparkContext` sets
    `PYTHONHASHSEED` to `0` for Python workers unless you set it, in
    `pyspark/core/context.py`, so iterating a `set` of strings gives the
    same order in every worker.)

    `monotonically_increasing_id()` is the other trap: it encodes the
    partition index and the row's position, so a retried task repeats
    it only if it sees its rows in the same order (not after a
    shuffle), and it changes whenever the partitioning does (more
    files, a different `maxPartitionBytes`, AQE coalescing). For ids
    that must survive reruns, derive them from content:
    `F.sha2(F.concat_ws("|", key columns), 256)` or `F.xxhash64(...)`.

