    ## Accumulators, Actions and observe()

    Accumulators look like the natural way to count things from tasks.
    Measure them against the causes of re-execution:

    ```python
    spark = fresh("local[4,3]")
    calls = spark.sparkContext.accumulator(0)

    def counted(x):
        calls.add(1)
        if TaskContext.get().attemptNumber() == 0 and x % 100 == 50:
            raise RuntimeError("injected")               # every task fails once, midway
        return x

    u = F.udf(counted, "long")
    df = spark.range(0, 400, numPartitions=4).select(u("id").alias("v"))
    out = tempfile.mkdtemp()

    df.agg(F.sum("v")).first()
    print("one action, every task retried once:", calls.value)
    df.write.mode("overwrite").parquet(out)
    print("after a second action:", calls.value)

    calls.value = 0
    obs = Observation("m")
    observed = df.observe(obs, F.count(F.lit(1)).alias("rows"), F.sum("v").alias("total"))
    observed.write.mode("overwrite").parquet(out)
    print("observe() on the write:", obs.get, " accumulator:", calls.value)
    print("part files:", len(glob.glob(f"{out}/part-*")),
          " rows read back:", spark.read.parquet(out).count())
    ```

    ```text
    one action, every task retried once: 400
    after a second action: 800
    observe() on the write: {'rows': 400, 'total': 79800}  accumulator: 400
    part files: 4  rows read back: 400
    ```

    The failed attempts called the UDF 51 times each, but their
    accumulator updates were dropped: the driver merges a task's
    accumulator updates only when the task succeeds (failed tasks
    report only internal metrics that ask for it, `countFailedValues`).
    So a retry does not double count; a **second action** does, because
    it is a second, successful computation. Recomputed stages after a
    fetch failure double count the same way.

    `DataFrame.observe` (3.3, `Observation` in Python) computes named
    aggregates as a side output of the query that actually writes the
    data (`CollectMetricsExec` in the plan), from successful tasks
    only, and hands them to you when the action finishes. It counts the
    rows that were written, once, whatever happened on the way. Use it
    for row counts and sums that you report or check thresholds on.

    `cache()` is the other answer to "two actions", with a caveat: an
    evicted or lost cache block is recomputed from the plan, so a
    cache makes repeated actions cheaper, not deterministic.

