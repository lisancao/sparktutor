    ## A Fault Injection Toolkit

    Every technique in this lesson, collected:

    | To provoke | Do | Observe |
    |---|---|---|
    | task retries | master `local[N,F]`, and fail when `TaskContext.get().attemptNumber() == 0` | attempt numbers in a log written by the task |
    | a fetch failure and stage resubmission | set `spark.local.dir` to a temp folder, run an action, delete `shuffle_<shuffle>_<map>_0.*`, run an action on the same DataFrame | the stage's attempts in the UI; `NoSuchFileException` in the log |
    | an indeterminate map stage | a Python UDF with `random` before a shuffle, then the step above | the abort message, or a changed result with full retry off |
    | a rerun | call the job function twice | duplicates with `append` |
    | different partitioning | `spark.sql.files.maxPartitionBytes`, `openCostInBytes`, `spark.sql.shuffle.partitions`, AQE on or off | `df.rdd.getNumPartitions()`, changing `monotonically_increasing_id()` and `sample()` results |
    | a streaming replay | raise in `foreachBatch` after writing, restart | `offsets/N` without `commits/N` (previous lesson) |
    | a crash flag executors can see | a file at an absolute path created and removed by the driver | Python workers inherit no variables you set in the driver after the JVM started, but they share the local disk in local mode |

    A test harness that uses them compares a clean run with a chaos run
    and requires identical results. That is the exercise.

