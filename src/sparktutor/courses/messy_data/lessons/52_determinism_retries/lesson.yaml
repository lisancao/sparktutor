    ## When Spark Runs Your Code Again

    | Cause | What runs again | Where it lives in 4.2.0 |
    |---|---|---|
    | task failure (exception, lost executor) | that task, up to `spark.task.maxFailures` (default 4) attempts | `TaskSetManager.handleFailedTask` |
    | fetch failure (shuffle files lost) | the lost map tasks of the parent stage, then the failed stage; up to `spark.stage.maxConsecutiveAttempts` (default 4) | `DAGScheduler.handleTaskCompletion`, case `FetchFailed` |
    | indeterminate rollback | *all* tasks of the affected stages | `DAGScheduler.rollbackSucceedingStages` |
    | speculation (`spark.speculation`, default `false`) | a second copy of a slow task, racing the first | `TaskSetManager.checkSpeculatableTasks` |
    | several actions on one uncached DataFrame | the whole plan, once per action | every action builds a job |
    | evicted cache blocks | the partitions needed to rebuild them | `RDD.getOrCompute` |
    | Spark Connect | analysis (and so seeds and timestamps) per action | the server re-plans each request |
    | streaming replay | a whole micro-batch, same batch id | `MicroBatchExecution` (previous lesson) |

    Two things in the list are easy to forget. A retried task re-runs
    everything in its stage, including Python UDFs and side effects
    from earlier in the stage, not just the line that failed. And
    accumulators, the classic way to count things from tasks, behave
    differently for each row of the table, as you will measure below.

    Adaptive query execution is not on the list on purpose: it
    re-plans the part of a query that has not run yet between stages,
    and reuses the shuffle output of stages that finished. Re-running
    finished work comes from the causes above, not from AQE.

