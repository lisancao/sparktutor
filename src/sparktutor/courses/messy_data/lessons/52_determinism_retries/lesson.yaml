    ## Two Small Gotchas from Writing This Lesson

    - `F.udf(f, "double")` at module level, before any session exists,
      fails in 4.2.0 with `[SESSION_OR_CONTEXT_NOT_EXISTS] SparkContext
      or SparkSession should be created first.`: creating the UDF
      parses the DDL return type, and the parser needs a session. Pass
      a `DataType` (`DoubleType()`) for UDFs defined at import time.
    - A UDF object pickles its function, with the globals it uses,
      **once**: the first time you call it to build a column (the
      Java-side UDF is created and cached then). Everything later
      reuses that pickle. With `CFG = {"x": 1}` and
      `u = F.udf(lambda v: CFG["x"], LongType())`, building `df1` with
      `u`, setting `CFG["x"] = 2` and building `df2` with `u` gives
      `1` for both; a new `F.udf(...)` object picks up the new value.
      In the exercise's starter, an accumulator stored in a global dict
      after the DataFrame was built reached the tasks as `None`.
      Create such objects first, pass values as columns or literals, or
      build the UDF inside the function that uses it.

