    ## How Catalyst Treats a Nondeterministic Expression

    Every Catalyst expression has `deterministic`; a Python UDF is
    deterministic unless you call `asNondeterministic()` on it. The
    optimizer uses the flag to decide which rewrites are safe. A filter
    can be pushed below a projection only if the projection is
    deterministic (`PushPredicateThroughNonJoin` in
    `sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/optimizer/Optimizer.scala`),
    because evaluating a nondeterministic expression on fewer rows
    changes its results. That changes how often your UDF runs:

    ```python
    spark = fresh("local[4]")
    calls = spark.sparkContext.accumulator(0)

    def plus_one(x):
        calls.add(1)
        return x + 1

    det = F.udf(plus_one, "long")
    nondet = F.udf(plus_one, "long").asNondeterministic()
    base = spark.range(0, 1000, numPartitions=4)
    for name, u in [("deterministic", det), ("asNondeterministic", nondet)]:
        calls.value = 0
        q = base.withColumn("y", u("id")).where("id < 10")
        q.collect()
        print(f"{name}: {calls.value} UDF calls for 10 rows")
        print(q._jdf.queryExecution().optimizedPlan().toString())
    ```

    ```text
    deterministic: 10 UDF calls for 10 rows
    Project [id#24L, pythonUDF0#27L AS y#26L]
    +- ArrowEvalPython [plus_one(id#24L)#25L], [pythonUDF0#27L], 101
       +- Filter (id#24L < 10)
          +- Range (0, 1000, step=1, splits=Some(4))

    asNondeterministic: 1000 UDF calls for 10 rows
    Project [id#24L, pythonUDF0#30L AS y#29L]
    +- Filter (id#24L < 10)
       +- ArrowEvalPython [plus_one(id#24L)#28L], [pythonUDF0#30L], 101
          +- Range (0, 1000, step=1, splits=Some(4))
    ```

    Marking a UDF nondeterministic is honest and expensive: the filter
    stays above it, so it runs on every row. (`ArrowEvalPython`, not
    `BatchEvalPython`, because `spark.sql.execution.pythonUDF.arrow.enabled`
    defaults to `true`; "How Catalyst Plans Python" covers both.) Mark
    a UDF nondeterministic when its result really varies (it reads a
    clock, samples, calls a service), and do not mark it to "be safe":
    the optimizer stops collapsing projections over it, pushing filters
    through it and using it in some places at all. A nondeterministic
    expression in a join condition is rejected at analysis:

    ```python
    a = spark.range(5)
    b = spark.range(5).withColumnRenamed("id", "j")
    try:
        a.join(b, (a.id == b.j) & (F.rand(1) > 0.5)).collect()
    except Exception as e:
        print(e.getCondition(), str(e).splitlines()[0][:160])
    ```

    ```text
    INVALID_NON_DETERMINISTIC_EXPRESSIONS [INVALID_NON_DETERMINISTIC_EXPRESSIONS] The operator
    expects a deterministic expression, but the actual expression is "((id = j) AND (rand(1) > 0.5))".
    ```

    Note the flag is a *promise to the optimizer*, nothing more. A UDF
    that calls `random.random()` but is left deterministic gets
    optimized as if it were pure, and Spark has no way to know that a
    retry changed its output, until the 4.2 checksums later in this
    lesson notice.

