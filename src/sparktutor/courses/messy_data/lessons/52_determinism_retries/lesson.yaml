    ## Exercise: Make a Fragile Job Correct

    A batch job turns the checkout service's events
    (`data/messy/checkout_events/`) into a charges table: one row per
    `pay` event with a `charge_id`, the amount converted to USD by a
    payment service (`call_service`, given), an audit sample, a
    ledger with one posting per charge, and metrics (number of charges,
    total revenue in USD).

    The starter works, once, on a good day. Every piece of it breaks
    under re-execution:

    1. `with_charge_id`: uses `uuid()`, so the same charge gets another
       id in every query. Derive the id from the event's content.
    2. `audit_sample`: uses `sample(0.5, seed=42)`, which depends on
       partitioning and row order. Choose rows by a hash of `charge_id`.
    3. `_to_usd`: posts to the ledger from inside the UDF, so retries
       and extra actions post again. Make it only convert, and complete
       `post_ledger` to post from the driver after the write, keyed by
       `charge_id`, replacing the ledger file in one step.
    4. `run_job`: counts with an accumulator, runs a second action for
       the revenue, and appends. Use `observe()` on the write and
       `mode("overwrite")`.

    The harness runs a clean job (`local[2]`), stops the session, then
    runs a chaos job in a new session: `local[4,4]`, tiny input splits,
    7 shuffle partitions, AQE off, the payment service failing the
    first attempt of every task, and the job run twice in a row. The
    charges, the audit sample, the ledger and the metrics must be
    identical between the two.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "charge_id: F.sha2(F.concat_ws('|', 'event_id', 'user'), 256).substr(1, 16). Sample: F.pmod(F.xxhash64('charge_id'), F.lit(2)) == 0. In run_job: obs = Observation('charges'); charges = charges.observe(obs, F.count(F.lit(1)).alias('charges'), F.round(F.sum('amount_usd'), 2).alias('revenue_usd')), write with mode('overwrite'), then read obs.get. post_ledger: read the committed parquet, build a dict by charge_id, write a temp file and os.replace it."

