    ## Yielding Arrow Batches

    To skip the per-row conversion, build the columns yourself:

    ```python
    import pyarrow as pa

    SCHEMA = "id int, sensor string, value double, ts timestamp"
    ARROW_SCHEMA = pa.schema([
        ("id", pa.int32()),
        ("sensor", pa.string()),
        ("value", pa.float64()),
        ("ts", pa.timestamp("us", tz="UTC")),
    ])

    def read_arrow(lo, hi, size):
        for start in range(lo, hi, size):
            ids = range(start, min(start + size, hi))
            yield pa.RecordBatch.from_arrays([
                pa.array(ids, pa.int32()),
                pa.array([f"s{i % 10}" for i in ids], pa.string()),
                pa.array([i * 0.5 for i in ids], pa.float64()),
                pa.array([BASE + timedelta(seconds=i) for i in ids],
                         pa.timestamp("us", tz="UTC")),
            ], schema=ARROW_SCHEMA)
    ```

    The Spark to Arrow mapping you need most:

    | Spark | Arrow |
    |---|---|
    | `tinyint`, `smallint`, `int`, `bigint` | `int8`, `int16`, `int32`, `int64` |
    | `float`, `double` | `float32`, `float64` |
    | `string` | `string` (not `large_string`) |
    | `binary` | `binary` |
    | `boolean` | `bool` |
    | `date` | `date32` |
    | `timestamp` | `timestamp("us", tz="UTC")` |
    | `timestamp_ntz` | `timestamp("us")` |
    | `decimal(p,s)` | `decimal128(p, s)` |

    When in doubt, ask PySpark: `to_arrow_schema` in
    `pyspark.sql.pandas.types` is the function the reader uses. With a
    session running,
    `to_arrow_schema(_parse_datatype_string(SCHEMA), timezone="UTC")`
    (`_parse_datatype_string` is in `pyspark.sql.types`) prints the exact
    schema to match. Both are internal helpers, so use them to check, not
    in production code.

    Batch size is yours to choose. Bigger batches mean fewer calls and
    more memory per task; a few thousand to a few tens of thousands of
    rows is a good range.

