    ## Conforming Someone Else's Arrow Data

    Libraries that return Arrow (a database driver, a Parquet reader, a
    vendor SDK) choose their own types: `int64` for every integer, naive
    timestamps, columns in their own order. Do not rebuild the arrays by
    hand; reorder by name and cast:

    ```python
    def conform(batch):
        return batch.select(ARROW_SCHEMA.names).cast(ARROW_SCHEMA)
    ```

    `RecordBatch.select` and `RecordBatch.cast` exist in every pyarrow
    that PySpark 4.2 accepts (its minimum is 18.0.0). The cast is
    **safe** by default: an `int64` value that does not fit in `int32`
    raises `ArrowInvalid: Integer value 1099511627776 not in range:
    -2147483648 to 2147483647` instead of wrapping around. Casting a
    naive `timestamp("us")` to `timestamp("us", tz="UTC")` reads the
    naive values as UTC, which is usually what such libraries mean, but
    check yours.

