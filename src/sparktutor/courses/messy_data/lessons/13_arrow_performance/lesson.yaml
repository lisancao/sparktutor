    ## What You'll Learn

    Every reader so far yielded Python tuples, one per row. That is the
    easiest way to write a data source and often fast enough. When it is
    not, the fix is to hand Spark **Arrow record batches**: columns of
    typed values, thousands of rows at a time.

    Arrow is also where most of the confusing errors come from, because
    Arrow types are stricter than Python's. Spark 4.2 made the check
    stricter still.

    By the end of this lesson you will be able to:

    - Explain what Spark does with the tuples your reader yields
    - Predict which Python values convert to which Spark types, including
      the ones that convert **silently and wrongly**
    - Yield `pyarrow.RecordBatch` objects with exactly the right schema
    - Read `DATA_SOURCE_RETURN_SCHEMA_MISMATCH`,
      `DATA_SOURCE_INVALID_RETURN_TYPE` and the bare `ArrowInvalid` and
      `AssertionError` failures
    - Conform Arrow data from another library to your declared schema
    - Measure the difference, and know when it matters

