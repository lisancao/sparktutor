    ## The Time Zone Trap

    A `timestamp` column (with local time zone semantics) stores an
    instant. For each `datetime` you yield, the converter calls
    `value.astimezone(timezone.utc)`. On a **naive** datetime (no
    `tzinfo`), Python's `astimezone` assumes the **operating system's
    local time zone of the Python worker**, not
    `spark.sql.session.timeZone`. With the session time zone set to UTC,
    yielding `datetime(2026, 10, 1, 10, 0)` and casting the result to a
    string gives:

    | Worker's `TZ` | Naive datetime | Aware (`tzinfo=timezone.utc`) |
    |---|---|---|
    | `UTC` | 2026-10-01 10:00:00 | 2026-10-01 10:00:00 |
    | `America/Los_Angeles` | **2026-10-01 17:00:00** | 2026-10-01 10:00:00 |
    | `Asia/Ho_Chi_Minh` | **2026-10-01 03:00:00** | 2026-10-01 10:00:00 |

    The same code gives different data on a laptop and on a cluster whose
    machines run in UTC. Two fixes:

    - For instants, always yield **aware** datetimes
      (`datetime(..., tzinfo=timezone.utc)`, or
      `datetime.fromisoformat("2026-10-01T10:00:00+00:00")`).
    - For wall-clock values with no zone (a local opening hour), declare
      the column `timestamp_ntz` and yield naive datetimes. An aware
      datetime in a `timestamp_ntz` column fails with the bare
      `AssertionError`.

    One more surprise when you check your work: `collect()` turns
    `timestamp` values back into naive datetimes in the **driver's** local
    time zone, so printing collected rows can look shifted even when the
    stored instant is right. Compare `cast("string")` results (which use
    the session time zone) instead.

