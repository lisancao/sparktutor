    ## The 4.2 Type Check

    Before 4.2, Spark checked only the number and names of the columns in
    the first batch. A batch with an `int64` column where the schema said
    `int` got through, and the job could then fail with a cryptic error
    from Arrow's `VectorLoader` in the JVM. Spark 4.2 compares the first batch's whole
    Arrow schema with the expected one (the PySpark 4.2 migration guide
    lists the change):

    ```text
    [DATA_SOURCE_RETURN_SCHEMA_MISMATCH] Return schema mismatch in the
    result from 'read' method. Expected: id: int32
    label: string columns, Found: id: int64
    label: string columns. Make sure the returned values match the
    required output schema.
    ```

    The comparison is `pyarrow.Schema.equals`, which is strict about more
    than types. Each of these fails with the same error even though the
    values are fine:

    - the right columns in a **different order**
    - `large_string` instead of `string`
    - a field marked **not nullable** (`pa.field("id", pa.int32(),
      nullable=False)`)
    - a **naive** `timestamp("us")` for a `timestamp` column

    And one gap: only the **first** batch is checked. A later batch with a
    different schema fails with the less helpful
    `pyarrow.lib.ArrowInvalid: Tried to write record batch with different
    schema`. Mixing styles fails too. A batch first and then tuples gives
    `[UDF_RETURN_TYPE] Return type of the user-defined function should be
    iterator of pyarrow.RecordBatch, but is iterator of tuple`; tuples
    first and then a batch gives `DATA_SOURCE_RETURN_SCHEMA_MISMATCH`
    with the batch's row count as its "column" count. Pick one style per
    reader.

