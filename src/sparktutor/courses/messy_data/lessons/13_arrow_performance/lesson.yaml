    ## Which Python Values Fit Which Spark Types

    With tuples, the declared schema decides the Arrow type of each
    column, and `pyarrow` converts your Python value to it. Measured on
    4.2.0 with a one-column source:

    | Declared | You yield | Result |
    |---|---|---|
    | `int` | `7` | 7 |
    | `int` | `None` | NULL |
    | `int` | `1.5` | **1, silently truncated** |
    | `int` | `True` | fails: `ArrowTypeError: Expected integer, got bool` |
    | `int` | `"7"` | fails: `ArrowInvalid: Could not convert '7' with type str: tried to convert to int32` |
    | `int` | `2**40` | fails: `ArrowInvalid: Value 1099511627776 too large to fit in C integer type` |
    | `double` | `2` | 2.0 |
    | `decimal(5,2)` | `Decimal("1.25")` | 1.25 |
    | `decimal(5,2)` | `1.25` (a float) | fails: bare `AssertionError` |
    | `date` | `"2026-10-01"` | fails: `ArrowTypeError` |
    | `timestamp` | `"2026-10-01 10:00:00"` | fails: bare `AssertionError` |
    | `binary` | `b"\x00\x01"` | the bytes |
    | `binary` | `"ab"` | fails: bare `AssertionError` |
    | `array<int>` | `[1, 2]` | the array |
    | `map<string,int>` | `{"k": 1}` | the map |
    | `struct<a:int,b:string>` | `(1, "x")` or `{"a": 1, "b": "x"}` | the struct |
    | `variant` | `VariantVal.parseJson(...)` | the value (a dict fails with `MALFORMED_VARIANT`) |

    The failures all surface as `PYTHON_EXCEPTION` from the task, with the
    Python error at the bottom of the traceback. Three takeaways from the
    table:

    - **Parse strings yourself.** Dates, timestamps, numbers and decimals
      must arrive as `datetime.date`, `datetime.datetime`, `int`/`float`
      and `decimal.Decimal`.
    - **The bare `AssertionError`** (no message at all) means a converter
      got the wrong Python type for a decimal, timestamp or binary column.
      Look at that column first.
    - **A float in an int column loses data without an error.** Convert
      explicitly (`int(round(x))`) or declare the column `double`.

