    ## What Happens to Your Tuples

    A Python data source's `read()` runs in a Python worker, but Spark
    itself runs in the JVM. Rows have to cross from one to the other, and
    in Spark 4.2 they always cross as Arrow. When you yield tuples,
    PySpark does the conversion for you (`records_to_arrow_batches` in
    `pyspark/sql/worker/plan_data_source_read.py`):

    1. Collect up to `spark.sql.execution.arrow.maxRecordsPerBatch`
       (default 10000) rows.
    2. For each row, check it is a tuple, list or `Row` with the right
       number of fields, and run a small converter per column (timestamps
       to UTC, decimals rescaled, dicts and `Row`s into structs).
    3. Build one Arrow array per column with `pyarrow` and send the batch.

    Step 2 is a Python function call per value, which is where the time
    goes. If `read()` yields `pyarrow.RecordBatch` objects instead,
    PySpark skips all three steps and sends your batches as they are
    (Arrow batch reads arrived in 4.0, SPARK-48493).

- Class: text
  Depth: beginner
  Output: |
    Imagine shipping a library to another city. Tuples are like handing
    the movers one book at a time: they check the title, wrap it, and put
    it in a box. Arrow batches are like handing them boxes you already
    packed and labeled. The second way is much faster, but if your label
    says "novels" and the box holds atlases, the movers refuse the box.

