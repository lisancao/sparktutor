    ## How Much Faster?

    An indicative measurement on a 16-core machine (`local[4]`, 2 million
    rows of `id bigint, sensor string, value double` over 4 partitions,
    aggregated with `sum` and `count_distinct`, best of three runs):

    | `read()` yields | Time |
    |---|---|
    | `Row` objects | 1.34 s |
    | tuples | 0.42 s |
    | Arrow batches built from Python lists | 0.22 s |
    | Arrow batches built from NumPy arrays | 0.17 s |

    Arrow halved the time, and it is the same Python work otherwise
    (building the values). The rest of the gap closes when the values
    never become Python objects at all: NumPy arithmetic, or batches that
    come straight from a library. The exercise prints its own timings;
    yours will differ.

    When does it matter? If your reader spends its time waiting for the
    network (the API source in "Reading from an API") or parsing files
    with Python code, the conversion is a small share and tuples are
    fine. If it produces many small rows quickly (a generator, a database
    cursor, a columnar file), Arrow is worth it.

- Class: text
  Depth: advanced
  Output: |
    ## Details for Tuning

    - `spark.sql.execution.arrow.maxRecordsPerBatch` (default 10000) sets
      how many tuples PySpark packs into each batch. It does not change
      the size of batches you yield yourself.
    - The type check compares the first batch only, so a reader that
      switches schemas half way (for example after a schema change in a
      file) must conform every batch, as `conform` does.
    - On Spark Connect nothing changes: the reader runs in the same
      Python worker on the server side, so the exercise gives the same
      results with `SparkSession.builder.remote(...)`.

