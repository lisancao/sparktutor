  Output: |
    ## Summary

    - Tuples you yield are converted to Arrow by PySpark, one value at a
      time; `RecordBatch`es you yield are sent as they are (4.0,
      SPARK-48493).
    - The **declared schema** decides the conversion. Strings are never
      parsed for you, a float in an int column is **silently truncated**,
      and a bare `AssertionError` points at a decimal, timestamp or
      binary column with the wrong Python type.
    - Naive datetimes in a `timestamp` column are read in the **worker's
      OS time zone**. Yield aware datetimes, or use `timestamp_ntz`.
    - Tuples match by position, named `Row`s by name (and slowly);
      dicts fail with `DATA_SOURCE_INVALID_RETURN_TYPE`.
    - Spark 4.2 checks the first batch's whole Arrow schema
      (`DATA_SOURCE_RETURN_SCHEMA_MISMATCH`): types, order, nullability,
      `string` versus `large_string`, time zone.
    - Conform foreign Arrow data with `batch.select(names).cast(schema)`.
    - Arrow pays off when conversion, not I/O, is the bottleneck.

    Next: **Filter Pushdown**, where your reader learns which rows the
    query wants and skips files it does not need to open.
