    ## Tuples, Lists and Rows

    `read()` may yield tuples, lists, `pyspark.sql.Row` objects or Arrow
    batches. Anything else (a dict, a scalar, a pandas DataFrame) fails:

    - A dict or a scalar:
      `[DATA_SOURCE_INVALID_RETURN_TYPE] Unsupported return type ('dict')
      from Python data source 'probe'. Expected types: tuple, list,
      pyspark.sql.types.Row, pyarrow.RecordBatch.`
    - A tuple with the wrong number of fields:
      `[DATA_SOURCE_RETURN_SCHEMA_MISMATCH] ... Expected: 2 columns,
      Found: 1 columns.`
    - A pandas DataFrame gives that same "columns" message with its
      **row** count, because PySpark measures it with `len()`. If the
      numbers in the message look like row counts, you yielded a
      DataFrame.

    Tuples are matched to columns **by position**. A `Row` with field
    names is matched **by name**, so `Row(b="x", a=1)` fills `a` and `b`
    correctly whatever the order, and a `Row` whose names differ from the
    schema fails with `DATA_SOURCE_RETURN_SCHEMA_MISMATCH` listing both
    sets of names. The price is speed: in the measurement below, `Row`
    objects were about three times slower than tuples.

