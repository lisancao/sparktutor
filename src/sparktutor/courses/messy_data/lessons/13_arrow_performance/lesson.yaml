    ## Exercise: Three Ways to Yield Sensor Readings

    The `sensors` source has a `mode` option. `reading(i)` builds one row
    as a tuple and `vendor_batches` imitates a library with its own Arrow
    types; both are written. Complete:

    1. `ARROW_SCHEMA`: the Arrow schema for
       `id int, sensor string, value double, ts timestamp`.
    2. `read_tuples(lo, hi)`: yield `reading(i)` for each row.
    3. `read_arrow(lo, hi, size)`: the same rows as batches of at most
       `size` rows with exactly `ARROW_SCHEMA`.
    4. `conform(batch)`: reorder and cast a vendor batch to
       `ARROW_SCHEMA`.

    The harness first tests your functions as plain Python (no Spark),
    then checks that all three modes return identical counts, sums,
    sensors and time ranges, that the source has 4 partitions, and that
    unconformed vendor batches are rejected with
    `DATA_SOURCE_RETURN_SCHEMA_MISMATCH`. It prints the time per mode.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "pa.array(values, type) builds one column; pa.RecordBatch.from_arrays([...], schema=ARROW_SCHEMA) builds the batch. For the timestamps use BASE + datetime.timedelta(seconds=i), which is already timezone-aware."

