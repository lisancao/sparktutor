    ## Metrics While You Write: observe and Observation

    The gate needs counts (rows, quarantined, warned). Counting with
    separate `count()` calls reads the data again for each number.
    `DataFrame.observe` (3.3) attaches named aggregates to a query; they
    are computed by the next action that runs it, at no extra pass, and
    an `Observation` object holds the result:

    ```python
    from pyspark.sql import Observation

    obs = Observation("orders_quality")
    checked = orders.withColumn("bad_price", F.col("unit_price").try_cast("decimal(10,2)").isNull())
    observed = checked.observe(obs, F.count(F.lit(1)).alias("rows"),
                               F.count_if("bad_price").alias("bad_price"))
    observed.write.mode("overwrite").parquet(out + "/o")
    print("observation:", obs.get)
    ```

    ```text
    observation: {'rows': 120, 'bad_price': 3}
    ```

    What else the runs showed, the same in Spark Classic and on Spark
    Connect (`SparkSession.builder.remote("local[2]")`):

    - `obs.get` waits for the action and returns a dict. Calling it
      before any action raises `PySparkAssertionError:
      [NO_OBSERVE_BEFORE_GET] Should observe by calling
      DataFrame.observe before get.`
    - The metrics count the rows that flowed **through the observe
      point**. Put `observe` before the `where` that picks the
      quarantined rows, and it counts the whole file while the write
      only writes the bad rows. The exercise does exactly that.
    - A second action on the same observed DataFrame did not change the
      values (`{'rows': 120, 'bad_price': 3}` again). An `Observation`
      is meant for one action; create a new one per run.
    - On a stream, pass a string name instead: `observe("quality",
      ...)`. The values arrive per micro-batch in the query's progress
      (`[p.observedMetrics for p in q.recentProgress]` gave
      `[{'quality': Row(rows=60, bad_price=1)}]` for day 1). An
      `Observation` object is refused when the query starts:

    ```text
    IllegalArgumentException: Observation does not support streaming Datasets.This is
    because there will be multiple observed metrics as microbatches are constructed.
    Please register a StreamingQueryListener and get the metric for each microbatch
    in QueryProgressEvent.progress, or use query.lastProgress or query.recentProgress.
    ```

