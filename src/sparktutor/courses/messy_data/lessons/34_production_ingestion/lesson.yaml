- Class: text
  Depth: all
  Output: |
    ## What You'll Learn

    You have quarantined bad rows before: in "JSON Drift and
    Quarantine" with a corrupt record column, in "Landing Messy Data in
    Delta Lake" with a quarantine table, and in "Streaming Messy Data:
    Drift, Dead Letters and State" with a dead-letter folder. Those were
    one-off rules written into the code. A production ingestion job
    needs more:

    - a **profile** of what arrived, before deciding what "bad" means
    - **rules as data**, applied in one pass, that say *which* rules a
      row broke, not just that it is bad
    - **dataset-level checks** that no single row can answer:
      uniqueness, referential integrity, freshness, volume
    - **metrics** collected while the data is written, not by a second
      pass
    - a **quality gate**: a threshold that stops a bad file from
      reaching the tables people trust
    - writes that are safe to **re-run**, and tables that **refuse**
      bad data on their own
    - the same design as a **Declarative Pipeline**

    You will build it twice: as a script that lands daily order files
    into Delta tables, and as a pipeline graded by `check_*` views. The
    script needs "Landing Messy Data in Delta Lake"; the pipeline needs
    "Bronze: Ingesting Raw Data", "Silver: Types, Duplicates and
    Quarantine" and "Gold: Aggregates for the Business" in the
    Declarative Pipelines course.

