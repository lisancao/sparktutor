    ## The Gate That Never Ran

    `assert_true` in a DataFrame has a trap. A gate computed as a
    one-row DataFrame and cross-joined to the data looks like it guards
    the data:

    ```python
    rows = spark.range(10).withColumn("bad", F.col("id") > 2)       # 70% bad
    gate = rows.agg(F.assert_true(F.avg(F.col("bad").cast("int")) <= 0.2, "gate failed").alias("_gate"))
    rows.crossJoin(gate).select("id").count()
    ```

    ```text
    unused 10 rows: gate NOT enforced
    ```

    Spark's optimizer prunes columns nobody uses. `_gate` is not
    selected, so the plan computes an aggregate with no functions at
    all, and the assertion is never evaluated:

    ```text
    +- HashAggregate(keys=[], functions=[])
    ```

    Even keeping `_gate` in the DataFrame is not enough if the action
    does not need it: `rows.crossJoin(gate).count()` also passed. Make
    the result depend on the gate, for example by filtering on it
    (`assert_true` returns NULL when it passes):

    ```python
    rows.crossJoin(gate).where(F.col("_gate").isNull()).select("id").count()
    ```

    ```text
    where isNull raised: [USER_RAISED_EXCEPTION] gate failed SQLSTATE: P0001
    ```

    The `check_*` views of the Declarative Pipelines course do not have
    this problem because they *write* the asserted column into a table,
    and a write evaluates every output column. A gate in front of
    another table needs the filter.

