    ## Sketches for Profiles You Keep

    A profile of one file is a query; a profile you keep for every file
    and combine later wants **sketches**: small binary summaries that
    can be merged. `hll_sketch_agg` (3.5) builds a HyperLogLog sketch
    per group, `hll_union_agg` merges them, and `hll_sketch_estimate`
    reads the count:

    ```python
    per_file = orders.groupBy(F.col("_metadata.file_name").alias("file")) \
                     .agg(F.hll_sketch_agg("customer_id").alias("sk"))
    per_file.select(F.hll_sketch_estimate(F.hll_union_agg("sk")).alias("customers_both_days")).show()
    ```

    ```text
    +-------------------+
    |customers_both_days|
    +-------------------+
    |                 40|
    +-------------------+
    ```

    Store `sk` (a BINARY column) per day, and a weekly distinct count is
    a union of seven small values, without touching the raw files. Spark
    4.1 added theta sketches (with intersections) and KLL quantile
    sketches; "Sketches: HLL, Theta and KLL from the Inside" in the
    advanced level takes them apart.

