    ## The NULL Trap

    Why `coalesce(check, false)`? Because SQL has three truth values.
    `try_cast(q AS INT) > 0` is NULL when `q` is NULL or not a number,
    and `NOT NULL` is still NULL:

    ```sql
    SELECT q, try_cast(q AS INT) > 0 AS check_value,
           NOT (try_cast(q AS INT) > 0) AS naive_broken,
           NOT coalesce(try_cast(q AS INT) > 0, false) AS broken
    FROM VALUES ('3'), ('0'), (NULL), ('two') AS t(q)
    ```

    ```text
    +----+-----------+------------+------+
    |   q|check_value|naive_broken|broken|
    +----+-----------+------------+------+
    |   3|       true|       false| false|
    |   0|      false|        true|  true|
    |NULL|       NULL|        NULL|  true|
    | two|       NULL|        NULL|  true|
    +----+-----------+------------+------+
    ```

    With the naive form, `when(NULL, name)` takes the "otherwise" branch
    and a blank or non-numeric quantity passes the rule it should fail.
    Decide what NULL means for each rule and write it down; "a check
    that cannot be evaluated is broken" is the safe default.

    Delta Lake's CHECK constraints (later in this lesson) take the same
    position: a NULL `quantity` violates `CHECK (quantity > 0)`.

