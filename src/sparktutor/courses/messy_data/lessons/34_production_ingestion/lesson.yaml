    ## Running It Twice: Two 4.2.0 Traps

    In SparkTutor each run starts empty. A real pipeline runs every day
    against the tables of the day before (the Declarative Pipelines
    capstone shows how: `spark-pipelines --conf
    spark.sql.catalogImplementation=hive run`). Running this pipeline
    twice that way, with day 3 added to the landing folder before the
    second run, showed two things the single run cannot.

    **withColumn on a pipeline dataset loses its dependency.** The
    first version of `orders_checked` and `quality_report` added
    columns with `withColumn`. The first run was correct. In the second
    run the log showed `quality_report` and `quarantine_orders`
    finishing *before* `bronze_orders` and `customers_dim`, and the
    report was stale and wrong:

    ```text
    +--------------------+----+-----------+------+-----------+
    |        _source_file|rows|quarantined|warned|error_ratio|
    +--------------------+----+-----------+------+-----------+
    |orders_2026-10-02...|  60|         60|     0|        1.0|
    |orders_2026-10-01...|  60|         60|     1|        1.0|
    +--------------------+----+-----------+------+-----------+
    ```

    Only two files (bronze had three), and every row quarantined with
    `customer_known` among its failed rules. A minimal
    pipeline isolates it: after a second run with one new bronze row,
    `select`, `where` and `groupBy().agg()` over `bronze` saw 2 rows,
    while `withColumn` (alone, or after an `agg`) saw the old 1. It is
    reported upstream as SPARK-59663 (open), "withColumn on an in-graph
    table read silently drops the dependency edge once the upstream
    table exists". It is the same family as the `drop()` problem in the
    Declarative Pipelines course's silver lesson: the Spark Connect
    planner analyzes the input of these operations immediately. On the
    first run the table does not exist and the edge survives; once it
    exists, the edge is lost and the flow runs early, on old data. The pipeline in this lesson therefore adds
    columns with `select("*", expr.alias(name))`, which ran in the
    right order with fresh data on the second run:

    ```text
    +--------------------+----+-----------+------+-----------+
    |        _source_file|rows|quarantined|warned|error_ratio|
    +--------------------+----+-----------+------+-----------+
    |orders_2026-10-03...|  60|         45|     0|       0.75|
    |orders_2026-10-02...|  60|          8|     0|     0.1333|
    |orders_2026-10-01...|  60|          6|     1|        0.1|
    +--------------------+----+-----------+------+-----------+
    ```

    **A failed refresh can leave the table empty.** The gate stopped
    the second run, as it should. But afterwards:

    ```text
    bronze_orders 180
    silver_orders 0
    quarantine_orders 59
    ```

    Silver had 103 rows after the first run and **0** after the failed
    second one. A materialized view refresh overwrites its table, and
    the default (Parquet) table is emptied before the new data is
    written, so a refresh that fails part way leaves nothing. The gate
    kept bad data out; it did not keep the good data in. Two ways to
    get both:

    - Store silver in a table format with atomic overwrites, so a failed
      write leaves the previous version (Delta Lake behaves that way
      for the script in Exercise 1: a rejected write left the table
      unchanged). Test it in your own deployment before relying on it.
    - Or gate *before* the pipeline: run the quality job from Exercise 1
      first and let the pipeline read only files that passed (for
      example, move them from `incoming/` to `orders/`).

    Either way, downstream readers should treat "silver is empty" as an
    incident, which is one more reason for a volume check.

