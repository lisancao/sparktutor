    ## Taking It Further

    - **Rules with owners.** Add `owner` and `since` to each rule, and
      write a per-rule count table per run (explode `failed_rules`,
      group by rule). A rule whose count jumps is a producer change; a
      rule that never fires may be dead.
    - **Contracts.** Combine rules with the schema contract from
      "Schemas for Data You Don't Control": the producer publishes both,
      and your job refuses files whose header does not match before any
      row rule runs.
    - **Quarantine replay.** Once a producer fixes their export, replay
      quarantined rows through the same rules and MERGE the ones that
      now pass; `failed_rules` tells you which rows to expect back.
    - **Streaming ingestion.** The same rules run inside the
      `foreachBatch` of "Streaming Messy Data: Drift, Dead Letters and
      State", with Delta's
      `txnAppId`/`txnVersion` keyed by the batch id, and the gate
      raising an exception that stops the stream.
    - **Sketch history.** Keep a `hll_sketch_agg` of customer ids per
      file and alert when today's distinct count falls far outside the
      last weeks', without rereading old files.

