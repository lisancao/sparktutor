    ## Rules as Data

    Hard-coding rules as `when(...)` chains, as earlier lessons did,
    works until the rules change weekly or another team owns them. Keep
    them as data instead. `rules.json`:

    ```json
    {"name": "quantity_positive", "severity": "error",
     "check": "try_cast(quantity AS INT) > 0"},
    {"name": "status_lowercase", "severity": "warn",
     "check": "status = lower(trim(status))"},
    {"name": "customer_known", "severity": "error",
     "check": "_customer_known"},
    ```

    Each rule is a name, a severity and a SQL boolean that is true for
    a good row. `error` rules send the row to quarantine; `warn` rules
    keep it (after normalizing) and count it. Rules may use columns the
    job adds, like `_customer_known` (from a join) and `_file_date`
    (the date in the file name).

    One pass over the rows turns them into an array of the broken
    rules' names:

    ```python
    def names(severity):
        return F.array_compact(F.array(*[
            F.when(~F.coalesce(F.expr(r["check"]), F.lit(False)), F.lit(r["name"]))
            for r in rules if r["severity"] == severity]))

    checked = df.withColumn("failed_rules", names("error")).withColumn("warnings", names("warn"))
    ```

    `F.array(...)` holds one element per rule: the rule's name if it is
    broken, else NULL. `array_compact` (3.4) removes the NULLs. Every
    rule is evaluated for every row in the same projection, so ten
    rules cost one scan, and the result says *everything* wrong with a
    row, which is what the person fixing the producer needs:

    ```text
    |O0004   |NULL       |...|[customer_id_present, customer_known]   |[]                |
    |O0032   |C014       |...|[]                                      |[status_lowercase]|
    |O0041   |C021       |...|[quantity_is_integer, quantity_positive]|[]                |
    ```

