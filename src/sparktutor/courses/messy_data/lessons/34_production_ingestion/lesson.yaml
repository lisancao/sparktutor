    ## The Quality Gate

    A gate is a decision made on the metrics: if more than a set share
    of a file is bad, **stop**, before the tables people read change. In
    a script it is an ordinary exception:

    ```python
    class QualityGateError(Exception):
        """Raised when a file has too many bad rows to publish."""

    ratio = m["quarantined"] / m["rows"] if m["rows"] else 1.0
    if ratio > max_error_ratio:
        raise QualityGateError(
            f"{file_name}: {m['quarantined']} of {m['rows']} rows ({ratio:.0%}) broke a rule; "
            f"the limit is {max_error_ratio:.0%}. Silver was not changed; see the quarantine.")
    ```

    For day 3:

    ```text
    gate: orders_2026-10-03.csv: 45 of 60 rows (75%) broke a rule; the limit is 20%.
    Silver was not changed; see the quarantine.
    ```

    Design choices that matter:

    - **Where the gate sits.** After bronze and quarantine are written,
      before silver. The evidence (raw rows, the reasons) is kept for
      whoever investigates; the trusted table is untouched.
    - **The threshold.** These sample files are deliberately dirty
      (10% and 13% bad), so the limit is 20%. Set yours from the
      profile of normal days, and alert well below the limit.
    - **An empty file is a failure**: `rows == 0` gives ratio 1.0 here,
      not a division by zero.
    - **A job that fails loudly** is what schedulers, on-call people
      and CI understand. Exit non-zero; do not log and continue.

    Inside SQL the same decision is `raise_error` (or `assert_true`,
    which raises when its argument is false), both 3.1:

    ```text
    SELECT CASE WHEN count(*) < 100 THEN raise_error('too few rows') END FROM ...
    [USER_RAISED_EXCEPTION] too few rows SQLSTATE: P0001
    ```

