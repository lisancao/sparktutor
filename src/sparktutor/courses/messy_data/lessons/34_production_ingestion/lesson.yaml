    ## The Same Design as a Declarative Pipeline

    Does open source Spark 4.2.0's `pyspark.pipelines` have expectation
    decorators like Databricks' `@dlt.expect`, `expect_or_drop` and
    `expect_or_fail`? No. The module's public names in 4.2.0 are:

    ```text
    ['api', 'append_flow', 'create_auto_cdc_flow', 'create_sink',
     'create_streaming_table', 'flow', 'graph_element_registry',
     'materialized_view', 'output', 'source_code_location', 'table',
     'temporary_view', 'type_error_utils']
    ```

    and the pipelines module of the Spark source (`sql/pipelines`) has
    no expectation concept. Quality is built from datasets, as the
    Declarative Pipelines course does, and the design above maps onto
    them directly:

    | Script | Pipeline dataset |
    |---|---|
    | bronze write | `bronze_orders`, a streaming table (`@dp.table`) over the CSV folder |
    | customers | `customers_dim`, one row per id (window `row_number`, since `dropDuplicates` on a pipeline dataset fails at registration in 4.2.0) |
    | `apply_rules` | `orders_checked`, a temporary view with `failed_rules` and `warnings` |
    | Observation counts | `quality_report`, a materialized view: rows, quarantined, warned, error ratio per file |
    | the gate | `quality_gate`, a temporary view with one `assert_true` |
    | silver MERGE | `silver_orders`, a materialized view computed *through* the gate |
    | quarantine write | `quarantine_orders` |
    | harness asserts | `check_*` views |

    The rules file is read with plain Python at the top of the pipeline
    file, so the pipeline's rules are the same data as the script's:

    ```python
    RULES = json.load(open(f"{QUALITY}/rules.json"))
    ```

    The gate has to sit in silver's dependency path, filtered on, for
    the reason in "The Gate That Never Ran":

    ```python
    @dp.temporary_view
    def quality_gate() -> DataFrame:
        report = spark.read.table("quality_report")
        return report.agg(
            F.assert_true(F.max("error_ratio") <= MAX_ERROR_RATIO,
                          f"quality gate: a file has more than {MAX_ERROR_RATIO:.0%} bad rows; "
                          "see quality_report").alias("_gate"))

    @dp.materialized_view
    def silver_orders() -> DataFrame:
        return (spark.read.table("orders_checked")
                .crossJoin(spark.read.table("quality_gate"))
                .where(F.col("_gate").isNull())
                .where(F.size("failed_rules") == 0)
                ...)
    ```

    The first version of this pipeline had the cross join without the
    filter. With the broken day 3 included, the log said `Flow
    spark_catalog.default.silver_orders has COMPLETED`, with the 75%
    bad file in it. With the filter:

    ```text
    Flow spark_catalog.default.bronze_orders has COMPLETED.
    Flow spark_catalog.default.quality_report has COMPLETED.
    Flow spark_catalog.default.quarantine_orders has COMPLETED.
    Flow 'spark_catalog.default.silver_orders' has FAILED.
    Error: [USER_RAISED_EXCEPTION] quality gate: a file has more than 20% bad rows; see quality_report SQLSTATE: P0001
    Flow 'spark_catalog.default.check_silver' SKIPPED due to upstream failure(s).
    ```

    The run fails, silver's flow fails, and everything that depends on
    silver is skipped, while the quarantine and the report, which do
    not depend on the gate, are still refreshed for whoever
    investigates. (In that run the fixed-number checks on bronze,
    quarantine and the report failed too, since a third file changes
    every count; the gate is the check that holds for any input.)

