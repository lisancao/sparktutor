    ## Landing in Delta, Safely

    "Landing Messy Data in Delta Lake" introduced bronze, silver and
    quarantine tables in Delta Lake 4.4.1. For production you also want
    every step to be **safe to run again**: schedulers retry, people
    re-run a day after fixing a bug, and a re-run must not duplicate
    anything.

    **Bronze and quarantine: replace one file's rows.** `replaceWhere`
    overwrites only the rows matching a predicate, atomically:

    ```python
    (raw.write.format("delta").mode("overwrite")
        .option("replaceWhere", "_source_file = 'orders_2026-10-01.csv'")
        .save(f"{root}/bronze"))
    ```

    Run it twice and bronze still has 60 rows for that file. It also
    works on a path that is not a table yet (it creates it). If the
    DataFrame contains a row that does not match the predicate, Delta
    refuses the whole write:

    ```text
    [DELTA_REPLACE_WHERE_MISMATCH] Written data does not conform to partial table
    overwrite condition or constraint '_source_file = 'orders_2026-10-01.csv''.
    [DELTA_VIOLATE_CONSTRAINT_WITH_VALUES] CHECK constraint ... violated by row with values:
     - _source_file : x.csv
    ```

    **Silver: MERGE on the business key.**

    ```sql
    MERGE INTO delta.`.../silver` AS t
    USING incoming_orders AS s
    ON t.order_id = s.order_id
    WHEN NOT MATCHED THEN INSERT *
    ```

    Re-sent orders match and are skipped, so day 2 inserts 49 of its 52
    valid rows, and running day 2 again inserts 0 (and, as "Landing
    Messy Data in Delta Lake" showed, writes no new version). That
    lesson's other `MERGE` trap applies too: an insert-only `MERGE`
    inserts both copies of a new key, so the exercise keeps one row per
    `order_id` with `row_number()` before merging (O0073 is listed
    twice in day 2).

    **Appends that might repeat: transaction ids.** For a plain append
    that may be retried, Delta's writer options `txnAppId` and
    `txnVersion` make the second write with the same pair a no-op:

    ```python
    df.write.format("delta").mode("append") \
      .option("txnAppId", "ingest").option("txnVersion", 7).save(path)
    ```

    Writing the same 60 rows twice with `txnVersion` 7 left 60 rows.
    In `foreachBatch`, the batch id is the natural `txnVersion`, which
    is the Delta answer to the replay problem from "Streaming Messy
    Data: Drift, Dead Letters and State".

