    ## Checks No Single Row Can Answer

    Some problems are only visible across rows. Each is a small
    aggregate or join:

    **Uniqueness.** Group by the key and keep groups with more than one
    row:

    ```python
    orders.groupBy("order_id").count().where("count > 1").orderBy("order_id").show()
    ```

    ```text
    +--------+-----+
    |order_id|count|
    +--------+-----+
    |   O0006|    2|
    |   O0007|    2|
    |   O0073|    2|
    +--------+-----+
    ```

    A window count shows *where* the copies are, which tells re-sends
    across files apart from a duplicate inside one file:

    ```text
    +--------+-------------------+------+---------------------+
    |order_id|order_ts           |copies|file                 |
    +--------+-------------------+------+---------------------+
    |O0006   |2026-10-01 08:35:00|2     |orders_2026-10-01.csv|
    |O0006   |2026-10-01 08:35:00|2     |orders_2026-10-02.csv|
    |O0007   |2026-10-01 09:42:00|2     |orders_2026-10-01.csv|
    |O0007   |2026-10-01 09:42:00|2     |orders_2026-10-02.csv|
    |O0073   |2026-10-02 10:24:00|2     |orders_2026-10-02.csv|
    |O0073   |2026-10-02 10:24:00|2     |orders_2026-10-02.csv|
    +--------+-------------------+------+---------------------+
    ```

    **Referential integrity.** Orders whose customer does not exist: a
    left anti join keeps the rows of the left side with no match on the
    right. The exercise's `dataset_checks` finds `O0012` (`C099`) and
    `O0063` (`C100`), and the duplicate customer key `C017`.

    **Freshness.** The newest event time tells you whether the data is
    current, and catches the opposite problem too:

    ```python
    orders.select(F.max(F.try_to_timestamp("order_ts")).alias("newest")).show()
    ```

    ```text
    +-------------------+
    |             newest|
    +-------------------+
    |2027-01-15 09:00:00|
    +-------------------+
    ```

    An order "from the future" is the same clock problem as in
    "Streaming Messy Data: Drift, Dead Letters and State". Here the rule `order_ts_not_after_file_day`
    (`to_date(order_ts) <= _file_date`) quarantines it, while letting
    the re-sent day-1 orders in the day-2 file through to deduplication.

    **Volume.** Rows per file against what is normal. Both order files
    have 60 rows; a file with 6 or 6000 deserves a look before anything
    else runs.

    Row rules decide where a row goes. Dataset checks decide whether
    the *file* can be trusted at all, which leads to the quality gate.

