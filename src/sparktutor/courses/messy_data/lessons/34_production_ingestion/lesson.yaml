    ## The Sample Data

    `data/messy/quality/` holds a customer list and order files from a
    shop's export, with problems planted at known rows:

    | File | Contents |
    |---|---|
    | `customers.csv` | 41 rows for 40 customers: `C017` twice, an e-mail without `@`, a blank e-mail, a blank country, a signup date in month 13 |
    | `orders/orders_2026-10-01.csv` | 60 orders: a blank and an unknown customer, quantity `0` and blank, price `N/A`, status `SHIPPED`, currency `EUR` |
    | `orders/orders_2026-10-02.csv` | 60 orders: an unknown and a blank customer, quantity `-2` and `two`, a blank price, price `1,299.00`, status `shiped`, an order dated 2027, two orders re-sent from day 1 and one listed twice |
    | `incoming/orders_2026-10-03.csv` | 60 orders from a broken export: 45 have no price |
    | `rules.json` | the row-level rules for orders |

    Every column is read as a string. That is deliberate, as in the
    Declarative Pipelines course's bronze lesson: under ANSI mode (the
    default since 4.0, SPARK-44444) a strict cast of one bad value
    fails the whole job:

    ```text
    [CAST_INVALID_INPUT] The value '1,299.00' of the type "STRING" cannot be cast
    to "DECIMAL(10,2)" because it is malformed. Correct the value as per the
    syntax, or change its target type. Use `try_cast` to tolerate malformed input
    ```

    Strings in, rules over strings, types only for the rows that pass.

- Class: text
  Depth: all
  Output: |
    ## Profiling Before Rules

    A **profile** answers "what is in this column?" before you write a
    rule about it. `summary()` is the quick look:

    ```python
    customers = spark.read.option("header", True).csv("data/messy/quality/customers.csv")
    customers.summary().show()
    ```

    ```text
    +-------+-----------+-----------+--------------------+-------+-----------+
    |summary|customer_id|       name|               email|country|signup_date|
    +-------+-----------+-----------+--------------------+-------+-----------+
    |  count|         41|         41|                  40|     40|         41|
    |   mean|       NULL|       NULL|                NULL|   NULL|       NULL|
    | stddev|       NULL|       NULL|                NULL|   NULL|       NULL|
    |    min|       C001|    Ana Kim|ana.kim6@example.com|     CA| 2025-01-01|
    |    25%|       NULL|       NULL|                NULL|   NULL|       NULL|
    |    50%|       NULL|       NULL|                NULL|   NULL|       NULL|
    |    75%|       NULL|       NULL|                NULL|   NULL|       NULL|
    |    max|       C040|Tuan Nguyen|tuan.nguyen9@exam...|     VN| 2025-13-01|
    +-------+-----------+-----------+--------------------+-------+-----------+
    ```

    Already useful: `max(signup_date)` is `2025-13-01`, because strings
    sort as text. `count` of `email` is 40: the CSV reader turned the
    blank e-mail into NULL. (`describe()` is the same without the
    percentiles.) What `summary()` does not give you is the rest of a
    profile, so build it yourself, **in one pass**:

    ```python
    missing = customers.select([
        F.count_if(F.col(c).isNull() | (F.trim(c) == "")).alias(c) for c in customers.columns])
    ```

    ```text
    +-----------+----+-----+-------+-----------+
    |customer_id|name|email|country|signup_date|
    +-----------+----+-----+-------+-----------+
    |          0|   0|    1|      1|          0|
    +-----------+----+-----+-------+-----------+
    ```

    A loop of `df.filter(...).count()` per column would read the file
    once per column; one `select` of aggregates reads it once. The same
    goes for the other profile measures:

    | Measure | Function | Notes |
    |---|---|---|
    | missing | `count_if(isNull or blank)` | `count_if` is in `pyspark.sql.functions` since 3.5 |
    | distinct | `approx_count_distinct(c, rsd)` | HyperLogLog++; `rsd` is the relative standard deviation, default 0.05 |
    | most frequent | `mode(c, deterministic)` | 3.4; `deterministic=True` (4.0) returns the lowest value on ties |
    | top k | SQL `approx_top_k(c, k)` | 4.1; SQL only, no Python function in 4.2.0 |
    | quantiles | `percentile_approx(c, [0.5, 0.9, 0.99])` | 3.1 |

    "Approximate" is not a figure of speech. On 40 distinct customer
    ids:

    ```text
    approx_count_distinct("customer_id")        -> 37
    approx_count_distinct("customer_id", 0.01)  -> 40
    count_distinct("customer_id")               -> 40
    ```

    At the default `rsd` of 0.05, off by 3 on 40 is within the error
    bound. For a profile that is fine; for a uniqueness check it is
    not, so those use exact counts (below).

    `approx_top_k` found the countries and their counts:

    ```text
    SELECT approx_top_k(country, 3) AS top FROM c
    [{US, 15}, {CA, 14}, {VN, 11}]
    ```

    And `percentile_approx` over `try_cast(unit_price AS DOUBLE)`,
    for all 120 orders, gave `[60.42, 112.63, 119.85]` for the median,
    90th and 99th percentiles. A 99th percentile of 119.85 when prices
    are generated up to 120 is what you want to see; `1,299.00` did not
    move it because `try_cast` turned it into NULL, which is itself a
    reason to count NULLs next to every quantile.

