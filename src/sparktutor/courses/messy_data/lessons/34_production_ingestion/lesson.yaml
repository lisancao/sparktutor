    ## Summary

    - Read messy files as strings; under ANSI mode a strict cast of one
      bad value fails the job. Type only the rows that pass.
    - Profile in one pass (`count_if`, `approx_count_distinct` with an
      explicit `rsd`, `mode`, `approx_top_k`, `percentile_approx`), and
      remember approximate means approximate (37 for 40 at the default
      rsd).
    - Keep rules as data and evaluate all of them in one projection
      into a `failed_rules` array. Count a NULL check as broken.
    - Uniqueness, referential integrity (left anti join), freshness and
      volume are dataset checks; they decide whether a file is trusted.
    - `observe` with an `Observation` collects metrics during the write
      (Classic and Connect alike); place it before the filter.
    - A quality gate stops a bad file after bronze and quarantine and
      before silver. An `assert_true` nobody uses is pruned: filter on
      it.
    - In Delta: `replaceWhere` per file, `MERGE` on the key after
      deduplicating the source, `txnAppId`/`txnVersion` for repeatable
      appends, CHECK constraints (NULL violates; add them with `ALTER
      TABLE`), and quality counts in `userMetadata`.
    - Open source SDP 4.2.0 has no expectations; build quality from a
      checked view, a report, a gate in silver's dependency path, a
      quarantine and `check_*` views.

    Next: **Feature Vectors and Similarity Search**, which turns the
    images, audio and text from earlier lessons into vectors and finds
    their nearest neighbours.
