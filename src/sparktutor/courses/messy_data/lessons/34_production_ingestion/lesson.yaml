  Depth: all
  Output: |
    ## Tables That Refuse Bad Data

    Rules in the job can have bugs. A **CHECK constraint** on the Delta
    table is a last line of defence that every writer must pass:

    ```sql
    ALTER TABLE delta.`.../silver` ADD CONSTRAINT quantity_positive CHECK (quantity > 0)
    ```

    "Landing Messy Data in Delta Lake" showed how these behave on Delta
    4.4.1 (a violating write fails as a whole, NULL violates, existing
    rows are checked, the error arrives as a `Py4JJavaError`, constraints
    are stored as table properties), along with schema enforcement and
    why a Delta folder must never be read as plain Parquet. One more
    restriction matters when you script table creation:
    `CREATE TABLE ... (..., CONSTRAINT c CHECK (...)) USING delta` fails
    with `UNSUPPORTED_FEATURE.TABLE_OPERATION` ("does not support table
    constraint"), so create the table first and add constraints with
    `ALTER TABLE`, as the exercise's `create_tables` does.

