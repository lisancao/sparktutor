    ## Quality in the Table History

    The counts the gate used belong with the data. Delta records a
    free-form `userMetadata` string in each commit: the writer option
    `userMetadata` for DataFrame writes, or the session setting
    `spark.databricks.delta.commitInfo.userMetadata` for SQL such as
    `MERGE`:

    ```python
    spark.conf.set("spark.databricks.delta.commitInfo.userMetadata", json.dumps(metadata))
    try:
        spark.sql("MERGE INTO ...")
    finally:
        spark.conf.unset("spark.databricks.delta.commitInfo.userMetadata")
    ```

    ```text
    +-------+--------------+----------------------------------------------------------------------------+
    |version|operation     |userMetadata                                                                |
    +-------+--------------+----------------------------------------------------------------------------+
    |0      |CREATE TABLE  |NULL                                                                        |
    |1      |ADD CONSTRAINT|NULL                                                                        |
    |2      |ADD CONSTRAINT|NULL                                                                        |
    |3      |MERGE         |{"file": "orders_2026-10-01.csv", "rows": 60, "quarantined": 6, "warned": 1}|
    |4      |MERGE         |{"file": "orders_2026-10-02.csv", "rows": 60, "quarantined": 8, "warned": 0}|
    +-------+--------------+----------------------------------------------------------------------------+
    ```

    Unset it in `finally`: the setting applies to every later commit
    in the session until you do. The re-run of day 2 and the gated day
    3 left no MERGE versions, so the history says exactly which files
    reached silver, and with what quality.

