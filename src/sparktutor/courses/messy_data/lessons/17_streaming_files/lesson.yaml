- Class: text
  Depth: all
  Output: |
    ## Output Modes

    | Mode | Writes after each batch | Allowed for |
    |------|--------------------------|-------------|
    | `append` (default) | only new rows that will never change | queries without aggregation; aggregations with a watermark |
    | `update` | rows that changed in this batch | aggregations (and simple queries, where it means the same as append) |
    | `complete` | the whole result table | aggregations only |

    Spark checks the mode when the query starts:

    ```
    append   [STREAMING_OUTPUT_MODE.UNSUPPORTED_OPERATION] Invalid streaming output mode:
             append. This output mode is not supported for streaming aggregations without
             watermark on streaming DataFrames/DataSets. SQLSTATE: 42KDE
    complete [STREAMING_OUTPUT_MODE.UNSUPPORTED_OPERATION] Invalid streaming output mode:
             complete. This output mode is not supported for no streaming aggregations on
             streaming DataFrames/DataSets. SQLSTATE: 42KDE
    ```

    Without a watermark Spark can never know a count is final, so
    `append` is refused for aggregations; with nothing aggregated there
    is no "whole result table" to repeat, so `complete` is refused.

    The memory sink adds its own rule: it can only restart from a
    checkpoint in `complete` mode. Restarting an `append`-mode memory
    query fails with `AnalysisException: This query does not support
    recovering from checkpoint location. Delete .../offsets to start
    over.` (error class `_LEGACY_ERROR_TEMP_1299`).

    The memory, console, `foreach`, `foreachBatch` and `noop` sinks may
    run without any `checkpointLocation` (`SOURCES_ALLOW_ONE_TIME_QUERY`
    in `DataStreamWriter.scala`). They get a temporary checkpoint that
    is thrown away, so every run starts from scratch and reads the whole
    folder again. Fine for a quick look, wrong for a job.

- Class: text
