  Output: |
    ## Triggers

    | Trigger | Behaviour |
    |---------|-----------|
    | none | start the next micro-batch as soon as the last one ends, forever |
    | `processingTime="2 seconds"` | start a batch every 2 seconds, forever |
    | `availableNow=True` (3.3) | everything available at start, in batches that respect the limits, then stop |
    | `once=True` | one batch with everything, then stop; deprecated since 3.4 in favour of `availableNow` |
    | `realTime="5 seconds"` (PySpark 4.2) | Real-Time Mode, for Kafka; see the learning_spark course |

    A query that runs forever needs stopping:

    ```python
    q = (stream().select("ts").writeStream.format("memory").queryName("ticking")
         .option("checkpointLocation", os.path.join(work, "checkpoints", "ticking"))
         .trigger(processingTime="2 seconds").start())
    print(q.awaitTermination(5), q.isActive, q.status)
    q.stop()
    print(q.isActive, q.status)
    ```

    ```
    False True {'message': 'Waiting for next trigger', 'isDataAvailable': False, 'isTriggerActive': False}
    False {'message': 'Stopped', 'isDataAvailable': False, 'isTriggerActive': False}
    ```

    `awaitTermination(5)` waits at most 5 seconds and returns whether
    the query ended. `spark.streams.active` lists every running query,
    which is handy in a `finally:` block to stop them all.

    For scheduled jobs (every hour, every night) `availableNow` gives
    you streaming's bookkeeping (each file once, restart where you
    stopped) with batch-job economics: nothing runs between schedules.

