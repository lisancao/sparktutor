    ## Reading Progress

    Every micro-batch produces a progress report. `query.lastProgress`
    is the latest one, `query.recentProgress` a list of recent ones:

    ```python
    print(query.lastProgress.prettyJson)
    ```

    ```
    {
        "id": "d6f0e6a9-29da-47b9-ab17-5159a60ea2fc",
        "runId": "fc3481a9-f071-44e2-a551-56d11ab8552a",
        "name": "event_counts",
        "timestamp": "2026-10-28T20:53:13.877Z",
        "batchId": 0,
        "batchDuration": 1584,
        "numInputRows": 20,
        "inputRowsPerSecond": 0.0,
        "processedRowsPerSecond": 12.6,
        "durationMs": {
            "addBatch": 1246,
            "commitOffsets": 59,
            "getBatch": 22,
            "latestOffset": 84,
            "queryPlanning": 131,
            "triggerExecution": 1582,
            "walCommit": 27
        },
        "stateOperators": [
            {
                "operatorName": "stateStoreSave",
                "numRowsTotal": 2,
                "numRowsUpdated": 2,
                ...
                "numRowsDroppedByWatermark": 0,
                "numShufflePartitions": 4,
                "numStateStoreInstances": 4,
                ...
            }
        ],
        "sources": [
            {
                "description": "FileStreamSource[file:/tmp/work/inbox]",
                "startOffset": null,
                "endOffset": {
                    "logOffset": 0
                },
                "numInputRows": 20,
                ...
            }
        ],
        "sink": {
            "description": "MemorySink",
            "numOutputRows": 2
        }
    }
    ```

    The fields you will use most:

    - `id` stays the same across restarts (it lives in the checkpoint);
      `runId` changes every time the query starts.
    - `batchId` counts micro-batches from 0, across restarts.
    - `numInputRows` is how many rows this batch read. Twenty: day 1.
    - `durationMs` splits the batch time: `addBatch` is running your
      query and writing to the sink; `walCommit` and `commitOffsets`
      are the two checkpoint writes.
    - `stateOperators[0].numRowsTotal` is the size of the running state:
      2 groups.
    - `sources[0].endOffset` is the file source's position: `logOffset`
      0 means "the first batch of files I recorded".

    Read fields as attributes (`p.numInputRows`, `p.batchId`). In Spark
    Classic the progress object also behaves like a dict, but on Spark
    Connect `p["numInputRows"]` returns `None` while `p.numInputRows`
    returns 20 (checked on 4.2.0).

