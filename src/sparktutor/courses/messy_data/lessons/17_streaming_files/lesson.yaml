    ## How Much per Batch, and in What Order

    With all three days in a folder (modification times one hour apart,
    day 1 oldest), the batch sizes for different options:

    ```python
    def stream(**opts):
        reader = (spark.readStream.schema(EVENT_SCHEMA)
                  .option("columnNameOfCorruptRecord", "_corrupt"))
        for key, value in opts.items():
            reader = reader.option(key, value)
        return reader.json(box)

    def sizes(name, **opts):
        q = (stream(**opts).select("ts").writeStream.format("memory").queryName(name)
             .option("checkpointLocation", os.path.join(work, "checkpoints", name))
             .trigger(availableNow=True).start())
        q.awaitTermination()
        return [p.numInputRows for p in q.recentProgress]

    print(sizes("l1", maxFilesPerTrigger=1))    # and so on, one checkpoint each
    ```

    ```
    no limit                [61]
    maxFilesPerTrigger 1    [20, 20, 21]
    maxFilesPerTrigger 2    [40, 21]
    maxBytesPerTrigger 1    [20, 20, 21]
    2 + latestFirst         [41, 20]
    ```

    - `maxFilesPerTrigger` caps the files per batch. Use it so a backlog
      (the first run over a folder with a year of files) becomes many
      reasonable batches instead of one enormous one.
    - `maxBytesPerTrigger` caps by size; a batch always takes at least
      one file, so `1` means one file per batch. You cannot set both:
      the query fails at start with `Options 'maxFilesPerTrigger' and
      'maxBytesPerTrigger' can't be both set at the same time`.
    - Files are taken **oldest modification time first**, not by name.
      `latestFirst=True` reverses that (day 3 and day 2 first, then day
      1), useful when fresh data matters more than old data.
    - `maxFileAge` (default `7d`) lets the source forget very old
      entries; it is measured from the newest file seen, and it is
      ignored when `latestFirst` is combined with a per-batch limit.

    Because a file is identified by its path:

    - **A file that changes after it was read is not read again.**
      Appending a line to day 1 and running again read nothing:
      `numInputRows` 0. Files in an inbox must be complete when they
      appear, and never edited.
    - **Moving or renaming a file makes it new.** `fileNameOnly=true`
      compares only the file name, for sources that move files between
      folders.

- Class: text
  Depth: all
  Output: |
    ## foreachBatch: Any Batch Code You Like

    `foreachBatch` hands each micro-batch to your function as an
    ordinary DataFrame, plus its batch id. Anything a batch DataFrame
    can do, the function can do: write two tables, call `MERGE`, run
    checks.

    ```python
    seen = []
    def look(batch_df, batch_id):
        files = sorted(r.file for r in batch_df.select("file").distinct().collect())
        seen.append((batch_id, batch_df.isStreaming, files))

    q = (stream(maxFilesPerTrigger=2)
         .withColumn("file", F.col("_metadata.file_name"))
         .writeStream.foreachBatch(look)
         .option("checkpointLocation", os.path.join(work, "checkpoints", "look"))
         .trigger(availableNow=True).start())
    q.awaitTermination()
    for s in seen: print(s)
    ```

    ```
    (0, False, ['events_2026-10-01.json', 'events_2026-10-02.json'])
    (1, False, ['events_2026-10-03.json'])
    ```

    `batch_df.isStreaming` is `False`: inside the function you are back
    in batch land. Gotchas:

    - **Select file metadata in the stream, not in the function.**
      `batch_df.select("_metadata.file_name")` inside `look` fails with
      `[UNRESOLVED_COLUMN.WITH_SUGGESTION] A column ... with name
      _metadata.file_name cannot be resolved`: by then the batch is a
      plain DataFrame (a `LogicalRDD` in its plan) with no file behind
      it. Add `file` with `withColumn` before `writeStream`, as above.
    - **Each action on `batch_df` runs the batch's query again.** If
      the function writes `batch_df` to two places, call
      `batch_df.persist()` first and `batch_df.unpersist()` at the end.
    - **On Spark Connect the function runs on the server**, in its own
      Python process. Appending to a Python list in your script, as
      `look` does, leaves the list empty on Connect (checked on 4.2.0).
      Write results somewhere instead: a table, a file.

- Class: text
  Depth: all
  Output: |
    ## When a Batch Fails, and Why Writes Must Be Idempotent

    A `foreachBatch` function that fails on its first call, the way a
    full disk or a dropped connection would:

    ```python
    calls = []
    def fragile(batch_df, batch_id):
        calls.append((batch_id, batch_df.count()))
        if len(calls) == 1:
            raise ValueError(f"disk full while writing batch {batch_id}")
    ```

    The first run fails, and `awaitTermination()` raises:

    ```
    StreamingQueryException: [STREAM_FAILED] Query [id = ..., runId = ...] terminated
    with exception: [FOREACH_BATCH_USER_FUNCTION_ERROR] An error occurred in the user
    provided function in foreach batch sink. Reason: ... ValueError: disk full while
    writing batch 0
    ```

    The checkpoint now has `offsets: ['0']` and `commits: []`. Start the
    same query again and it runs batch 0 again, with the same 61 rows:

    ```
    calls: [(0, 61), (0, 61)]
    ```

    Your function saw batch 0 twice. If the first call had written half
    its output before failing, a plain `append` would now hold that half
    plus a full copy. Spark guarantees each batch is *processed* until it
    succeeds; it is up to the sink to make a repeated batch harmless.
    The usual ways, all keyed by `batch_id`:

    - overwrite a location named after the batch
      (`.../batch_id=7`), as the exercise does
    - `MERGE` on a key, so a repeated row updates instead of duplicating
      ("Landing Messy Data in Delta Lake")
    - record the last `batch_id` written and skip ones already done

    Spark's own file sink (`format("parquet")` and friends) already
    does this with a `_spark_metadata` log next to the data, and it
    refuses to start without a checkpoint:

    ```
    AnalysisException: checkpointLocation must be specified either through
    option("checkpointLocation", ...) or SparkSession.conf.set("spark.sql.streaming.checkpointLocation", ...).
    ```

