    ## A Stream Needs a Schema

    `spark.readStream` works like `spark.read`, with one difference that
    matters right away:

    ```python
    from pyspark.sql import SparkSession, functions as F

    spark = (SparkSession.builder.master("local[4]")
             .config("spark.sql.session.timeZone", "UTC")
             .config("spark.sql.shuffle.partitions", "4")
             .getOrCreate())

    spark.readStream.json(inbox)
    ```

    ```
    IllegalArgumentException: Schema must be specified when creating a streaming
    source DataFrame. If some files already exist in the directory, then depending
    on the file format you may be able to create a static DataFrame on that
    directory with 'spark.read.load(directory)' and infer schema from it.
    ```

    A batch read can look at every file to infer a schema. A stream
    cannot: tomorrow's files do not exist yet, and the schema must stay
    the same for the life of the query. So you give it one. For the
    events, that is the drift-absorbing schema from "JSON Drift and
    Quarantine":

    ```python
    EVENT_SCHEMA = """
        event STRING, event_type STRING, user_id BIGINT,
        user STRUCT<id: BIGINT, plan: STRING, geo: STRUCT<country: STRING>>,
        amount STRING,
        items ARRAY<STRUCT<sku: STRING, qty: INT>>,
        ts TIMESTAMP,
        _corrupt STRING
    """
    events = (spark.readStream
              .schema(EVENT_SCHEMA)
              .option("columnNameOfCorruptRecord", "_corrupt")
              .json(inbox))
    ```

    You can switch inference on with
    `spark.sql.streaming.schemaInference` set to `true`, but look at
    what it does with only day 1 in the folder:

    ```
    inferred: struct<amount:double,event:string,ts:string,user_id:bigint>
    ```

    The schema is inferred once, at `readStream`, from the files that
    happen to be there, and then fixed. Day 2's nested `user` and
    `items` would be silently dropped, and `ts` stays a string. For
    data that drifts, always write the schema.

