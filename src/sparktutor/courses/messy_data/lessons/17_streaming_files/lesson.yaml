    ## Event Time, Windows and Watermarks

    So far the counts were over all time. Real questions are about time
    periods: purchases per day, errors per minute. The events carry
    their own timestamp `ts` (**event time**), which is not the time the
    file arrived. Group by a window of event time, and give Spark a
    **watermark**: how late an event may arrive and still be counted.

    ```python
    per_day = (stream(maxFilesPerTrigger=1)
               .filter(F.col("_corrupt").isNull())
               .withWatermark("ts", "1 hour")
               .groupBy(F.window("ts", "1 day"))
               .count())
    ```

    After each batch, the watermark is the latest `ts` seen minus one
    hour. Read in order (day 1, day 2, day 3), in `append` mode:

    ```
    batch rows watermark                 dropped
    0     20   1970-01-01T00:00:00.000Z  0
    1     20   2026-10-01T09:19:00.000Z  0
    2     21   2026-10-02T10:19:00.000Z  0
    3     0    2026-10-03T11:19:00.000Z  0
    +-------------------+-----+
    |          day_start|count|
    +-------------------+-----+
    |2026-10-01 00:00:00|   20|
    |2026-10-02 00:00:00|   20|
    +-------------------+-----+
    ```

    - The watermark used by a batch comes from the batches before it, so
      batch 0 runs with none (shown as 1970).
    - `append` emits a window once, when the watermark passes its end.
      After the last file the watermark is 11:19 on day 3, so the day 3
      window is still open and nothing has been written for it. It will
      appear when later data moves the watermark past midnight. Batch 3
      read nothing: Spark ran it only to emit windows the new watermark
      had closed.
    - `update` mode on the same data writes all three windows, each with
      its count so far.

    Now deliver the days out of order: day 2, day 3, and day 1 last.

    ```
    0     20   1970-01-01T00:00:00.000Z  0
    1     21   2026-10-02T10:19:00.000Z  0
    2     20   2026-10-03T11:19:00.000Z  1
    +-------------------+-----+
    |          day_start|count|
    +-------------------+-----+
    |2026-10-02 00:00:00|   20|
    |2026-10-03 00:00:00|   20|
    +-------------------+-----+
    ```

    Day 1's events arrived when the watermark was already on day 3,
    much later than the hour allowed, so they were dropped. The progress
    shows `numRowsDroppedByWatermark: 1` and not 20, because Spark
    pre-aggregates each batch before the state store sees it and counts
    what is dropped there. The watermark is a trade: a longer delay
    keeps more late data, a shorter one keeps less state and emits
    results sooner.

    Also: one-day windows start at midnight **UTC** whatever the
    session time zone (they are aligned to the epoch; `window` has a
    `startTime` argument to shift them), which is one more reason to set
    the session time zone to UTC. And event-time rules apply only to
    stateful queries; `select`, `filter` and `foreachBatch` see every
    row regardless of the watermark.

