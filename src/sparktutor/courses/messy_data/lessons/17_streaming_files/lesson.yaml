- Class: text
  Depth: all
  Output: |
    ## What You'll Learn

    "Plans, Partitions and Caching" ended with a trap: a DataFrame keeps
    the file list it made at `load()`, so files that land later are
    invisible to it. Messy data rarely arrives all at once. Exports land
    in a folder every night, devices upload every minute, a partner
    drops a file whenever they feel like it. You want each new file read
    once, the results updated, and nothing read twice, even when your
    job stops and starts again.

    That is what **Structured Streaming** does. This lesson follows
    chapter 8 of *Learning Spark* at the basics level, on a folder of
    the drifting JSON events. By the end you will be able to:

    - Explain the streaming model: an unbounded table, micro-batches,
      triggers, output modes, sinks and checkpoints
    - Stream the JSON files of a folder with an explicit schema, and say
      why the schema is required
    - Run a query that processes what is there and stops
      (`trigger(availableNow=True)`), so jobs and tests finish
    - Limit batch sizes with `maxFilesPerTrigger` and
      `maxBytesPerTrigger`, and know in which order files are read
    - Test with the memory sink and `foreachBatch`, and read
      `lastProgress` and `recentProgress`
    - Restart from a checkpoint and process only the new files, and
      write output that stays correct when Spark replays a batch
    - Count events in event-time windows with a watermark, and see late
      data dropped

    "Images and Audio" already streamed `binaryFile` uploads; this
    lesson is the full picture behind that example. Drift, dead-letter
    output and custom state come later, in the intermediate "Streaming
    Messy Data: Drift, Dead Letters and State".

- Class: text
