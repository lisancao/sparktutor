    ## Restarting: Only the New Files

    Day 2 lands. Run exactly the same code again, with the same
    checkpoint folder:

    ```python
    deliver("events_2026-10-02.json", inbox)
    query = run_counts()          # the code above, in a function
    print([(p.batchId, p.numInputRows) for p in query.recentProgress])
    print(sorted(map(tuple, spark.table("event_counts").collect())))
    ```

    ```
    [(1, 20)]
    [('purchase', 29), ('view', 11)]
    ```

    Batch 1 read only the 20 new rows, and the counts cover both days:
    the running counts came back from the state store in the checkpoint.
    That is the whole point of the checkpoint. Run it once more with
    nothing new:

    ```
    [(2, 0)]
    0
    ```

    No rows read, and one more surprise: `spark.table("event_counts")`
    is now **empty**. The memory sink lives only for one run of the
    query; this run produced no batch, so it wrote nothing. The counts
    are safe in the checkpoint's state, and they come back with the next
    batch that has data. The memory sink is a testing tool, not storage.

    `deliver` copies a file into the inbox under a hidden name and then
    renames it:

    ```python
    def deliver(name, inbox):
        hidden = os.path.join(inbox, "." + name + ".tmp")
        shutil.copy(os.path.join("data/messy/events", name), hidden)
        os.rename(hidden, os.path.join(inbox, name))
    ```

    Spark's file listing skips hidden names such as this one (the exact
    rule is in "Setup, a First Session and a Tour of the Sample Data"),
    and a rename on the same file system is atomic. Without that, a slow copy can be picked up half written.
    Producers that write into your inbox should do the same.

- Class: text
  Depth: all
  Output: |
    ## What Is in the Checkpoint

    After those runs, the checkpoint folder holds (checksum `.crc` files
    left out, and only one of the four state folders shown):

    ```
    . ['metadata']
    commits ['0', '1']
    offsets ['0', '1']
    sources/0 ['0', '1']
    state/0/0 ['1.delta', '2.delta']
    ```

    - `metadata`: the query `id`.
    - `offsets/N`: written **before** batch N runs: which source
      position it covers, plus the settings that must not change (the
      shuffle partition count is in there):

      ```
      v1
      {"batchWatermarkMs":0,"batchTimestampMs":1793220812989,"conf":{..."spark.sql.shuffle.partitions":"4",...}}
      {"logOffset":1}
      ```

    - `sources/0/N`: the file source's own log of which files belong to
      each batch:

      ```
      v1
      {"path":"file:///tmp/work/inbox/events_2026-10-02.json","timestamp":1793220812910,"batchId":1}
      ```

    - `commits/N`: written **after** batch N finished writing to the
      sink.
    - `state/0/<partition>/`: the running counts, one versioned file per
      batch.

    On start, Spark compares the two logs. If the last offset has a
    matching commit, it plans a new batch from the files that are not
    in `sources/` yet. If not, the last batch did not finish, and Spark
    runs it again with exactly the same files. The advanced "Streaming
    Internals: Checkpoints, State and Real-Time Mode" opens every one of
    these files properly.

