    Picture an inbox tray on a desk. A clerk checks it every so often,
    takes out whatever arrived since the last check, processes those
    papers, and writes in a notebook which ones they took. If the clerk
    goes home and someone else takes over in the morning, the notebook
    says exactly where to continue. The tray is the folder, each check
    is a micro-batch, and the notebook is the checkpoint.

- Class: text
  Depth: all
  Output: |
    ## The Model: A Table That Keeps Growing

    Structured Streaming treats a source as a table that rows keep being
    appended to. You write the query as if it were a normal DataFrame
    query; Spark runs it again and again on the new rows only, and keeps
    whatever it needs between runs (for example running counts).

    | Piece | What it is | In this lesson |
    |-------|------------|----------------|
    | **Source** | where new rows come from | files landing in a folder |
    | **Micro-batch** | one run of the query over the rows that are new since the last run | one or more new files |
    | **Trigger** | when the next micro-batch starts | `availableNow`: everything there now, then stop |
    | **Sink** | where results go | `memory` (a table in the driver), `foreachBatch` (your function), files |
    | **Output mode** | which result rows go to the sink after each batch | `append`, `update`, `complete` |
    | **Checkpoint** | a folder where Spark records what it read and what it committed | one per query, kept forever |

    The "Structured Streaming" lesson of the learning_spark course
    covers Kafka, joins, Real-Time Mode and `transformWithState`. This
    lesson stays with files and gets every detail of them right.

