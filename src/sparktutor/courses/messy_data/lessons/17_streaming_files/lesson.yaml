    ## Exercise: An Incremental Counter Over an Inbox

    The harness delivers the event files into an inbox one day at a
    time and runs your queries again after each delivery, always with
    the same checkpoints.

    1. `read_inbox(spark, inbox)`: a streaming DataFrame over the JSON
       files with `EVENT_SCHEMA`, `_corrupt` as the corrupt record
       column, one file per micro-batch, plus a `file` column (the file
       name, from `_metadata`) and a `kind` column (`event_type`, or the
       old name `event`).
    2. `run_counter(spark, inbox, checkpoint)`: count parsed events
       (`_corrupt` is NULL) per `kind` into the memory sink
       `event_counts` in complete mode, with `availableNow`; wait; return
       the `numInputRows` of each micro-batch.
    3. `write_ledger(batch_df, batch_id, ledger)`: one row per file in
       the batch with `file`, `rows`, `bad` (corrupt lines) and
       `latest_ts`, written so that running the same batch again
       replaces its rows: overwrite `ledger/batch_id=<batch_id>`.
    4. `run_ledger(spark, inbox, checkpoint, ledger)`: stream the inbox
       through `write_ledger` with `foreachBatch` and `availableNow`;
       return the finished query.

    The harness checks: each run reads only the new file; the counts
    after each day match the files (counted with Python's `json`);
    a run with nothing new reads nothing; the truncated day 3 line is
    not counted but appears as `bad` in the ledger. Then it deletes the
    last commit file, as if the job had crashed after writing, and
    checks that Spark replays batch 2 and the ledger still has exactly
    one row per file.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "readStream.schema(EVENT_SCHEMA).option('columnNameOfCorruptRecord', '_corrupt').option('maxFilesPerTrigger', 1).json(inbox), then withColumn('file', F.col('_metadata.file_name')) and withColumn('kind', F.coalesce('event_type', 'event')). Counter: writeStream.format('memory').queryName('event_counts').outputMode('complete').option('checkpointLocation', ...).trigger(availableNow=True). Ledger: groupBy('file').agg(F.count('*'), F.count('_corrupt'), F.max('ts')) then .write.mode('overwrite').parquet(f'{ledger}/batch_id={batch_id}')."

- Class: text
  Depth: all
  Output: |
    ## Summary

    In this lesson you learned:

    - **The model**: an unbounded table processed in micro-batches;
      source, trigger, sink, output mode and checkpoint
    - **File streams need a schema**; `schemaInference` guesses once
      from the files present and never updates
    - **Streaming DataFrames** can be explained but not counted;
      results come out through `writeStream...start()`
    - **`availableNow`** (3.3) processes what is there and stops; set
      `spark.sql.shuffle.partitions` small for local stateful queries,
      and know it is fixed in the checkpoint
    - **Progress**: `batchId`, `numInputRows`, `durationMs`,
      `stateOperators`, `sources[].endOffset`; read them as attributes
      (Connect returns `None` for dict access)
    - **Checkpoints** hold offsets (before), commits (after), the file
      log and state; a restart processes only new files, and an offset
      without a commit is replayed
    - **Files are read once by path**, oldest modification time first;
      deliver them atomically (hidden name, then rename) and never edit
      them; `maxFilesPerTrigger` or `maxBytesPerTrigger`, not both
    - **`foreachBatch`** gives a batch DataFrame: add `_metadata` columns
      before it, persist if you write twice, make writes idempotent by
      `batch_id`; on Connect it runs on the server
    - **Output modes** are checked at start; the memory sink restarts
      only in complete mode and forgets its table between runs
    - **Windows and watermarks**: append emits a window once the
      watermark passes it, late events are dropped, windows align to
      UTC

    Next: **Landing Messy Data in Delta Lake**, where each batch lands in
    a table that enforces its schema, merges duplicates away and
    remembers every version.
