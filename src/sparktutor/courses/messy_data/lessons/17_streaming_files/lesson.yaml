    ## A Streaming DataFrame Is a Plan, Not Data

    `events.isStreaming` is `True`, and an action fails:

    ```python
    events.count()
    ```

    ```
    AnalysisException: Queries with streaming sources must be executed with
    writeStream.start(), or from a streaming table or flow definition within a
    Spark Declarative Pipeline.;
    ```

    `count()`, `show()` and `collect()` ask for a final answer, and a
    stream never has one. You can still `explain()` it; the source shows
    up as a `StreamingRelation`:

    ```
    == Physical Plan ==
    *(1) Filter (isnotnull(user_id#12L) AND (user_id#12L = 1))
    +- StreamingRelation FileSource[/tmp/work/inbox], [event#10, event_type#11, user_id#12L, ...]
    ```

    Everything you know about DataFrames still applies to the query
    itself: `filter`, `select`, `withColumn`, `coalesce` over drifting
    names, `groupBy`. Only the start and the end change.

- Class: text
  Depth: all
  Output: |
    ## The First Query

    Count parsed events per kind, over everything that ever arrived.
    Day 1 is already in the inbox:

    ```python
    counts = (events.filter(F.col("_corrupt").isNull())
              .groupBy(F.coalesce("event_type", "event").alias("kind"))
              .count())

    query = (counts.writeStream
             .format("memory")
             .queryName("event_counts")
             .outputMode("complete")
             .option("checkpointLocation", os.path.join(work, "checkpoints", "counts"))
             .trigger(availableNow=True)
             .start())
    query.awaitTermination()

    spark.table("event_counts").orderBy("kind").show()
    ```

    ```
    +--------+-----+
    |    kind|count|
    +--------+-----+
    |purchase|    9|
    |    view|   11|
    +--------+-----+
    ```

    Line by line:

    - `writeStream` is the streaming `write`. `start()` launches the
      query in the background and returns a `StreamingQuery`.
    - `format("memory")` with `queryName("event_counts")` keeps the
      output in a table in the driver, readable with
      `spark.table("event_counts")`. It is for tests and small results
      only.
    - `outputMode("complete")` writes the whole result table after every
      batch, which is what you want for running totals.
    - `checkpointLocation` is where Spark records its progress. One
      folder per query, never shared.
    - `trigger(availableNow=True)` (3.3) processes everything available
      when the query starts, in as many batches as the limits require,
      then stops. Without it the query runs until you stop it.
    - `awaitTermination()` blocks until the query has stopped.

    `spark.sql.shuffle.partitions` set to `4` at the top matters more
    here than in batch jobs: a streaming aggregation keeps its running
    counts in a **state store** with one piece per shuffle partition.
    With the default 200, this tiny query wrote 200 state folders and
    its first batch took about three times as long on the machine used
    to write this course (4.4 against 1.6 seconds). The number is
    recorded in the
    checkpoint on the first run and kept: changing the setting later has
    no effect on that query.

