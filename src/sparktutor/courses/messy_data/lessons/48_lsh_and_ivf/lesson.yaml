    ## Shingles: Text as a Set

    Jaccard similarity compares **sets**: `J(A, B) = |A ∩ B| / |A ∪ B|`.
    Word sets are too coarse for short listings (one typo replaces a
    whole word), so the lesson uses **character 5-shingles**: every
    substring of five characters of the normalized text (lower case,
    runs of anything that is not a letter or a digit replaced by one
    space). Each shingle is hashed to an integer below the prime
    `P = 2^31 - 1`:

    ```python
    P = 2147483647
    text = F.trim(F.regexp_replace(F.lower("description"), r"[^a-z0-9]+", " "))
    grams = F.when(F.length(text) < 5, F.array(text)).otherwise(
        F.transform(F.sequence(F.lit(1), F.length(text) - 4),
                    lambda i: F.substring(text, i, 5)))
    sh = listings.select("listing_id",
        F.transform(F.array_distinct(grams),
                    lambda s: F.pmod(F.xxhash64(s), F.lit(P))).alias("h"))
    ```

    The listings have between 89 and 250 distinct shingles, 145 on
    average.

    The `when` guards a real trap. `sequence(1, n)` with `n < 1` does
    not return an empty array: it counts **down**. Without the guard:

    ```text
    +-----------+-------------------------------------------------+
    |text       |sh                                               |
    +-----------+-------------------------------------------------+
    |abc        |[abc, abc, c]                                    |
    |           |[, , , , , ]                                     |
    |hello world|[hello, ello , llo w, lo wo, o wor,  worl, world]|
    +-----------+-------------------------------------------------+
    ```

    `sequence(1, -1)` is `[1, 0, -1]`, and `substring` with a position
    of 0 or less counts from the other end. Every empty description
    would get the same set of empty strings and match every other empty
    description perfectly. Keep one shingle for short texts (or drop
    them), never let them through unguarded. ("Text Analytics Without an
    LLM" showed the MLlib form of the same problem: an empty vector is an
    error there.)

