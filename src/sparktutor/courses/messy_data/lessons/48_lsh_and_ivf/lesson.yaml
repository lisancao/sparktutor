    ## Random Projections: LSH for Cosine Similarity

    MinHash is for sets. For vectors and cosine similarity, the matching
    trick is **random hyperplanes** (also called SimHash): draw a random
    vector `w` with independent normal components and keep one bit,
    `w · v >= 0`. Two vectors at angle `θ` get different bits only when
    the hyperplane falls between them, which happens with probability
    `θ / π`:

    ```text
    Pr[ bit(u) == bit(v) ] = 1 - θ(u, v) / π
    ```

    That is a coin again, so banding works unchanged: `b` bands of `r`
    bits, each band packed into an integer bucket key. On 2,000 random
    pairs of the lesson's vectors with 256 hyperplanes, the measured
    agreement rate was within 0.023 of `1 - θ/π` on average.

    In Spark, with the planes as a literal array and the bits packed
    with `aggregate`:

    ```python
    def dot(u, v):
        return F.aggregate(F.zip_with(u, v, lambda x, y: x * y), F.lit(0.0), lambda acc, z: acc + z)

    bits = F.transform(planes, lambda p: F.when(dot(F.col("v"), p) >= 0, 1).otherwise(0))
    keys = F.transform(F.sequence(F.lit(0), F.lit(b - 1)),
                       lambda i: F.aggregate(F.slice(bits, i * r + 1, r), F.lit(0),
                                             lambda acc, bit: acc * 2 + bit))
    ```

    Searching the 200 queries for their 10 nearest neighbours among the
    20,000 vectors this way (candidates from shared band keys, exact
    cosine on the candidates):

    ```text
    simhash b=8 r=8 recall@10=0.9020 scored=751778 frac=0.1879
    simhash b=12 r=6 recall@10=0.9945 scored=1429178 frac=0.3573
    ```

    Random hyperplanes ignore where the data is: the same planes cut a
    dense cluster and an empty region alike. On clustered data, an index
    that learns the clusters does much better, which is the next
    section.

