    ## Measuring the Estimate

    With `K = 100` hash functions, the lesson compared the MinHash
    estimate with the exact Jaccard similarity for all 89,676 pairs,
    grouped by the exact value. The last column is the theoretical
    standard deviation at the middle of each bucket:

    ```text
    bucket   pairs   mean(est - J)   sd(est - J)   sqrt(J(1-J)/K)
    0.0      70475   -0.0037         0.0174        0.0218
    0.1      13164   -0.0083         0.0304        0.0357
    0.2       2689   -0.0105         0.0367        0.0433
    0.3       1408   -0.0039         0.0421        0.0477
    0.4        796   -0.0016         0.0444        0.0497
    0.5        548    0.0045         0.0475        0.0497
    0.6        161    0.0079         0.0525        0.0477
    0.7        113    0.0040         0.0410        0.0433
    0.8        150    0.0081         0.0343        0.0357
    0.9        172    0.0030         0.0199        0.0218
    ```

    The spread follows the theory: largest near 0.5, smallest at the
    ends. The bias is small but not zero; `(a * x + b) mod P` is not a
    truly random permutation. Over every pair that shares a shingle,
    the mean absolute error was 0.017. The exercise checks this number.

    The signature replaces a set of about 145 shingles with 100 numbers,
    which is not much of a saving here. The point is what comes next:
    signatures can be **bucketed**, and sets cannot.

