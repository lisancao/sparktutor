    ## Predicting Candidates Before You Join

    Because the S-curve is a formula, you can predict the size of the
    join from the similarity distribution: the expected number of
    candidates is the sum of `1 - (1 - s^r)^b` over all pairs. With the
    exact similarities of all 89,676 pairs, predicted and measured,
    and the recall of the 435 pairs with `J >= 0.7`:

    ```text
    b    r    threshold   predicted   measured   predicted   measured
                          candidates  candidates  recall      recall
    100  1    0.010       81008       82593       1.0000      1.0000
    50   2    0.141       20792       18862       1.0000      1.0000
    25   4    0.447       2388        2244        1.0000      1.0000
    20   5    0.549       1359        1431        0.9985      1.0000
    10   10   0.794       390         414         0.8108      0.8299
    ```

    The prediction is good to a few percent. `b = 25, r = 4` finds every
    repost while comparing 2,244 pairs, 2.5% of the 89,676. `b = 10,
    r = 10` compares even fewer but loses 17% of the reposts, because
    its threshold (0.79) sits above many of them.

    In practice you do not know the distribution in advance, so you
    pick `(b, r)` from the curve alone. A useful rule: choose the
    largest `r` (fewest false candidates) such that a pair exactly at
    your threshold still becomes a candidate with high probability. For
    `K = 100`, `t = 0.7` and 99%:

    ```text
    r    b     P(candidate | s = 0.7)
    1    100   1.0000
    2    50    1.0000
    4    25    0.9990
    5    20    0.9748
    10   10    0.2491
    ```

    `r = 4` is the largest that clears 0.99. The exercise asks you to
    write this choice as a function.

