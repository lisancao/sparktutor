    ## What You'll Learn

    "Text Analytics Without an LLM" used MLlib's `MinHashLSH` to find
    near-duplicate support messages, and "Feature Vectors and Similarity
    Search" in the intermediate level turned text and images into
    vectors and searched them with MLlib's LSH. "Designing Tables for
    Blobs" stored embeddings in a derived table keyed by content hash.
    This lesson builds the indexes themselves, from DataFrame
    primitives, and measures them against exact answers.

    Approximate search is only worth what you can prove about it. Every
    index in this lesson is checked the two ways "Feature Vectors and
    Similarity Search" measured MLlib's LSH: **recall** (what
    fraction of the true answers it finds, against an exact computation
    on the same data) and **work saved** (how many pairs or vectors it
    had to score, against brute force). Time is a poor measure on a
    laptop; candidate counts are not.

    By the end of this lesson you will be able to:

    - Compute exact Jaccard similarity for every pair of a small corpus,
      and explain why an inverted index does not make the exact answer
      cheap on messy text
    - Build MinHash signatures with Spark's higher-order functions, with
      hash functions of the form `(a * x + b) mod p`, and stay inside
      64-bit arithmetic under ANSI mode
    - Derive the banding S-curve, choose bands and rows for a target
      similarity, and predict candidate counts and recall before
      running the join
    - Explain from the 4.2.0 source why MLlib's LSH compares far more
      pairs than a banded index, and measure the difference
    - Find hot buckets, the LSH version of skew, and say where they
      come from
    - Build random-projection LSH (SimHash) for cosine similarity
    - Build an IVF index: k-means centroids, inverted lists, search over
      the `nprobe` nearest lists, a recall curve, and the skew that
      makes the work larger than `nprobe / nlist`
    - Choose between a literal array, a broadcast join and
      `mapInPandas` for shipping centroids to executors

