    ## Getting Centroids to the Executors

    Every vector needs every centroid. Four ways to ship them, measured
    on the assignment step (20,000 cached vectors, 64 centroids, `noop`
    sink, best of three runs on the machine used to write this lesson;
    the ratios matter, not the seconds):

    ```text
    literal array + higher-order functions: best of 3 1.85s
    broadcast crossJoin + min_by: best of 3 3.62s
    mapInPandas + numpy: best of 3 0.04s
    literal array + vector_l2_distance: best of 3 0.19s
    ```

    All four assigned every vector to the same list.

    1. **A literal array with higher-order functions** (the exercise's
       way). The centroids are part of the plan, serialized with each
       task; no join, no shuffle. But `transform`, `zip_with` and
       `aggregate` are `CodegenFallback` expressions
       (`sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/expressions/higherOrderFunctions.scala`):
       Catalyst interprets the lambda for every element, 64 times 32 per
       vector here. Beyond a few thousand centroids the plan itself gets
       large (`explain()` prints every number).

    2. **A broadcast cross join** with `min_by` (3.3):

       ```python
       vectors.crossJoin(F.broadcast(cdf)).groupBy("id").agg(
           F.min_by("list", sqdist(F.col("v"), F.col("c"))).alias("list"))
       ```

       ```text
       HashAggregate(keys=[id#0], functions=[min_by(list#480, aggregate(zip_with(v#1, c#481, ...)))])
       +- Exchange hashpartitioning(id#0, 8), ENSURE_REQUIREMENTS
          +- HashAggregate(keys=[id#0], functions=[partial_min_by(list#480, ...)])
             +- BroadcastNestedLoopJoin BuildRight, Cross
                :- InMemoryTableScan [id#0, v#1]
                +- BroadcastExchange IdentityBroadcastMode
       ```

       It materializes 1,280,000 rows and shuffles them to regroup by
       vector: clean to read, the slowest here.

    3. **`mapInPandas` with a broadcast variable** and numpy:

       ```python
       bc = spark.sparkContext.broadcast(np.array(centroids))

       def nearest(batches):
           C = bc.value
           for pdf in batches:
               V = np.stack(pdf["v"].to_numpy())
               d = (V * V).sum(1)[:, None] - 2 * V @ C.T + (C * C).sum(1)[None, :]
               yield pd.DataFrame({"id": pdf["id"], "list": d.argmin(1).astype("int32")})

       vectors.mapInPandas(nearest, "id int, list int")
       ```

       One `MapInPandas` node and one matrix multiply per Arrow batch,
       with the Python workers already warm (an accumulator in the
       function confirmed all 20,000 rows went through it on each run).
       This is the shape for large `nlist` and high dimensions, at the
       cost of the Python worker round trip ("The Python Worker
       Protocol"). It is a map over Arrow batches, not an Arrow UDF, so
       the 4.2.0 hang of SPARK-58241 (an `@udf` straight over a Parquet
       scan; see "How Catalyst Plans Python") does not apply to it.

    4. **The 4.2 vector functions.** "Feature Vectors and Similarity
       Search" introduced `vector_l2_distance` and friends (SPARK-54713):
       compiled loops instead of interpreted lambdas, ten times faster
       than option 1 here, but `array<float>` only (cast both sides) and
       single precision, with the 4.2.0 overflow on huge values that
       lesson describes (SPARK-58544):

       ```python
       cf = F.array(*[F.array(*[F.lit(float(x)).cast("float") for x in c]) for c in centroids])
       d = F.transform(cf, lambda c: F.call_function(
           "vector_l2_distance", F.col("v").cast("array<float>"), c))
       ```

    One trap when you benchmark this yourself: if an earlier step cached
    the very same query (the index, say), the `CacheManager` substitutes
    the cached result for an identical plan, and you time a cache read.
    A first version of this comparison did exactly that and reported the
    literal array at 0.4 seconds.

