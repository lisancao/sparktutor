    ## IVF: An Inverted File over Vectors

    An **IVF** index (inverted file) partitions the vector space with
    k-means: `nlist` centroids, and an **inverted list** per centroid
    holding the vectors nearest to it. A query computes its distance to
    every centroid (cheap: `nlist` distances), picks the `nprobe` nearest
    lists, and scores only the vectors in those lists. Quality comes
    from the probes: the true neighbours of a query near the edge of a
    cell live partly in the next cell.

    Three steps, all DataFrames:

    1. **Train** centroids. MLlib's `KMeans` wants an ML vector column,
       and `pyspark.ml.functions.array_to_vector` (3.1) converts
       `array<double>`:

       ```python
       km = KMeans(k=64, seed=1, maxIter=20, featuresCol="f").fit(
           vectors.select(array_to_vector("v").alias("f")))
       centroids = [c.tolist() for c in km.clusterCenters()]
       ```

       `clusterCenters()` returns numpy arrays. Use `tolist()`: passing
       `list(c)` (numpy floats) to `createDataFrame` with an
       `array<double>` schema fails with
       `[FIELD_DATA_TYPE_UNACCEPTABLE_WITH_NAME] element in array field
       c: DoubleType() can not accept object
       np.float64(-0.08270024441535336) in type <class 'numpy.float64'>.`

    2. **Assign** every vector to its nearest centroid:

       ```python
       def sqdist(u, v):
           return F.aggregate(F.zip_with(u, v, lambda x, y: (x - y) * (x - y)),
                              F.lit(0.0), lambda acc, z: acc + z)

       d = F.transform(centroid_array(centroids), lambda c: sqdist(F.col("v"), c))
       index = vectors.withColumn("list", F.array_position(d, F.array_min(d)) - 1)
       ```

       `array_position` is 1-based and returns the first match, so ties
       go to the lower list.

    3. **Search**: rank the centroids for each query, explode the first
       `nprobe`, join to the index on `list`, score, and keep the top
       `k` per query:

       ```python
       ranked = F.array_sort(F.arrays_zip(d.alias("d"), F.sequence(F.lit(0), F.lit(63)).alias("l")))
       probes = queries.select("qid", "q", F.explode(F.slice(ranked, 1, nprobe)).alias("p"))
       scored = (probes.select("qid", "q", F.col("p.l").alias("list"))
                 .join(index, "list")
                 .select("qid", "id", sqdist(F.col("q"), F.col("v")).alias("dist")))
       top = scored.groupBy("qid").agg(
           F.slice(F.array_sort(F.collect_list(F.struct("dist", "id"))), 1, 10).alias("top"))
       ```

       `array_sort` on structs sorts by the first field, then the next,
       so `(dist, id)` gives nearest first with a deterministic tie
       break.

    The vectors are unit length, so squared Euclidean distance ranks
    neighbours exactly as cosine similarity does
    (`|u - v|^2 = 2 - 2 u·v`).

