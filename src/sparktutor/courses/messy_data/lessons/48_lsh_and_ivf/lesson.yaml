    ## Taking It Further

    - **Product quantization.** IVF still stores full vectors in the
      lists. PQ splits each vector into `m` sub-vectors, runs k-means in
      each subspace (typically 256 centroids, so one byte per
      sub-vector), and stores only the codes; distances are computed
      from per-query lookup tables. It cuts memory by an order of
      magnitude or more (32 doubles are 256 bytes; 8 one-byte codes are
      8) at a further cost in recall, and is the "PQ" in IVF-PQ
      indexes. This lesson did not build it.
      The same Spark pieces apply (k-means per subspace, a broadcast of
      codebooks, `mapInPandas` for the lookup), but the recall must be
      measured again the same way: against exact search, never assumed.
    - **Re-ranking.** Search with a cheap representation (PQ codes,
      SimHash bits) for the top 100, then compute exact distances on
      those to return the top 10.
    - **Incremental data.** New vectors go to their nearest existing
      list without retraining; track list sizes and retrain or split
      when the largest list grows past your bound.
    - **Joins, not lookups.** Everything here answers a batch of queries
      at once, which is what Spark is good at (deduplication, "find
      similar items for every item"). For single interactive queries in
      milliseconds, export the index to a vector database or a library
      built for it; Spark is the place to build and evaluate the index.

