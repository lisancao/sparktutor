    ## Summary

    - Measure approximate search two ways, against exact answers on the
      same data: recall, and the work saved (candidate pairs or vectors
      scored versus brute force). Not time.
    - On messy text, an inverted index on shingles is worse than brute
      force: boilerplate shingles appear in hundreds of documents (1.67
      million join rows for 89,676 pairs here).
    - MinHash: `Pr[min h(A) = min h(B)] = J(A, B)`. Build signatures
      with `transform` and `array_min` over `(a * x + b) % P`, with a
      31-bit prime so the arithmetic stays exact under ANSI mode.
      `sequence(1, n)` counts down for `n < 1`; guard short texts.
    - Banding: `b` bands of `r` rows make a pair with similarity `s` a
      candidate with probability `1 - (1 - s^r)^b`, an S-curve with
      threshold near `(1/b)^(1/r)`. Candidate counts and recall can be
      predicted from it, and matched the measurements within a few
      percent.
    - MLlib's LSH is OR-amplification only (`r = 1`, SPARK-18450 never
      landed): the same recall cost 17,730 to 56,168 comparisons
      instead of 2,244.
    - Boilerplate makes hot buckets; more rows per band dilute them,
      template sellers still show up as the largest buckets.
    - Verification on candidates keeps precision at 1.0.
    - Random hyperplanes give LSH for cosine: `Pr[same bit] = 1 - θ/π`.
    - IVF: k-means centroids, inverted lists, `nprobe` nearest lists.
      Full probe must equal brute force. Skewed data makes the work
      larger than `nprobe / nlist` and makes tasks uneven; splitting big
      lists bounds the worst case at some recall per probe.
    - Ship centroids as a literal (small; use the 4.2 `vector_*`
      functions on `array<float>` for speed), a broadcast join (simple,
      slow) or a broadcast variable in `mapInPandas` (large).

    Next: **Distributed Connected Components**, which takes the pairs
    an index like this finds and turns them into clusters of the same
    item, for graphs with millions of edges.
