    ## The Exact Answer, and Why It Is Expensive

    424 listings make `424 * 423 / 2 = 89,676` pairs. That is small
    enough to compute every Jaccard similarity exactly, and the lesson
    does so, because you cannot measure recall without the truth:

    ```python
    a = sh.select(F.col("listing_id").alias("a"), F.col("h").alias("ha"))
    b = sh.select(F.col("listing_id").alias("b"), F.col("h").alias("hb"))
    pairs = a.join(b, F.col("a") < F.col("b")).select("a", "b",
        (F.size(F.array_intersect("ha", "hb")) / F.size(F.array_union("ha", "hb"))).alias("j"))
    ```

    The distribution, in buckets of 0.1 (`floor(j * 10)`):

    ```text
    +------+-----+
    |bucket|count|
    +------+-----+
    |     0|70475|
    |     1|13164|
    |     2| 2689|
    |     3| 1408|
    |     4|  796|
    |     5|  548|
    |     6|  161|
    |     7|  113|
    |     8|  150|
    |     9|  107|
    |    10|   65|
    +------+-----+
    ```

    435 pairs have `J >= 0.7` (the reposts), 65 are identical after
    normalization. Everything else is noise you never want to compare.
    The join is a `BroadcastNestedLoopJoin` (a non-equi condition, so
    Spark has no hash key): quadratic, fine at 424 rows, hopeless at a
    million.

    The usual trick for sparse similarity is an **inverted index**:
    explode the shingles, join on the shingle, and only pairs that share
    at least one shingle meet. On messy text it is worse than brute
    force. The most common shingles here are pieces of "located in":

    ```text
    +-----+-----+
    |    g|count|
    +-----+-----+
    |ed in|  371|
    |d in |  370|
    |ted i|  357|
    |ated |  356|
    |ocate|  355|
    |locat|  355|
    | loca|  355|
    |cated|  355|
    +-----+-----+
    ```

    A shingle in `n` listings makes `n * (n - 1) / 2` join rows, and
    summing that over the 3,218 distinct shingles gives **1,674,500**
    rows: 18 times more than comparing every pair directly, and 87,566
    of the 89,676 pairs share at least one shingle anyway. Boilerplate
    is what makes messy text messy, and it defeats exact indexes. You
    could drop frequent shingles, but then the similarities are no
    longer exact. LSH takes the other way out: keep the exact
    similarity, give up on finding *every* similar pair, and say with
    numbers how many you miss.

