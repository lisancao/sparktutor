    ## Banding: Turning Signatures into Buckets

    Cut each signature into `b` **bands** of `r` values (`b * r = K`).
    Two listings become a **candidate pair** if all `r` values agree in
    at least one band. For a pair with similarity `s`:

    - one band agrees with probability `s^r` (AND within the band)
    - no band agrees with probability `(1 - s^r)^b`
    - so the pair is a candidate with probability `1 - (1 - s^r)^b` (OR
      across bands)

    Plotted against `s` this is an **S-curve**: near 0 for dissimilar
    pairs, near 1 for similar ones, with the steepest point near the
    threshold `t ≈ (1/b)^(1/r)`. More rows per band push the curve
    right and make it steeper; more bands push it left.

    In Spark, each band becomes a bucket key, `xxhash64` of the band's
    `r` values, and candidates come from a self-join on `(band, bucket)`:

    ```python
    bands = sig.select("listing_id",
        F.posexplode(F.transform(F.sequence(F.lit(0), F.lit(b - 1)),
                                 lambda i: F.xxhash64(F.slice("sig", i * r + 1, r))))
         .alias("band", "bucket"))
    x, y = bands.alias("x"), bands.alias("y")
    cands = (x.join(y, (F.col("x.band") == F.col("y.band"))
                     & (F.col("x.bucket") == F.col("y.bucket"))
                     & (F.col("x.listing_id") < F.col("y.listing_id")))
             .select(F.col("x.listing_id").alias("a"), F.col("y.listing_id").alias("b"))
             .distinct())
    ```

    `slice` is 1-based, hence `i * r + 1`. The `distinct` matters: a
    pair that agrees in five bands meets five times. The physical plan
    (shortened):

    ```text
    HashAggregate(keys=[a#1859, b#1860], functions=[])
    +- Exchange hashpartitioning(a#1859, b#1860, 8), ENSURE_REQUIREMENTS
       +- HashAggregate(keys=[a#1859, b#1860], functions=[])
          +- Project [listing_id#7 AS a#1859, listing_id#1849 AS b#1860]
             +- BroadcastHashJoin [band#1846, bucket#1847L], [band#1856, bucket#1857L], Inner, BuildRight,
                (listing_id#7 < listing_id#1849), false, false
                :- Generate posexplode(transform(..., lambdafunction(xxhash64(slice(sig#360, ...), 42), ...)))
                +- BroadcastExchange HashedRelationBroadcastMode(List(input[1, int, false], input[2, bigint, false]),false)
                   +- Generate posexplode(...)
    ```

    Now the join is an **equi-join** on `(band, bucket)`, so Spark can
    hash it (here a broadcast hash join; at scale a sort-merge join on
    those keys), and `a < b` is only a filter on the matches. That is
    the whole trick: an equality key that similar items are likely to
    share.

