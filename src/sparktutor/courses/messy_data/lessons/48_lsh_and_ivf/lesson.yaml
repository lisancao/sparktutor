    ## Staying Inside 64 Bits

    `x` is below `P = 2^31 - 1` and so is `a`, so `a * x + b` is below
    `2^62`: it fits in a `bigint`. That is why the shingle hashes are
    reduced with `pmod` first and why `P` is a 31-bit prime, not the
    61-bit Mersenne prime many papers use. Spark 4 runs with ANSI mode
    on (`spark.sql.ansi.enabled` is `true` by default since 4.0), so an
    overflowing multiplication is an error, not a silent wrap. With
    `P = 2^61 - 1` and a large `a`:

    ```text
    ArithmeticException [ARITHMETIC_OVERFLOW] overflow. Use 'try_multiply' to tolerate overflow
    and return NULL instead. If necessary set "spark.sql.ansi.enabled" to "false" to bypass this
    error. SQLSTATE: 22003
    ```

    Do not take either suggestion. `try_multiply` would turn the overflow
    into NULL, and `array_min` skips NULLs, so some signatures would be
    computed from fewer shingles without any error. Turning ANSI off
    makes the product wrap around, which is a different hash function
    from the one your maths assumes. Pick a prime that keeps the
    arithmetic exact.

    The other edge: `array_min` of an **empty** array is NULL. Every
    listing with no shingles would get a signature of NULLs, and all of
    them would land in the same buckets. The shingle guard above makes
    that impossible here; in your own data, filter empty sets out before
    hashing.

