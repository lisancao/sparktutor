    ## MinHash: One Number That Estimates Jaccard

    Take a random permutation of all possible shingles, and for a set
    `A` keep `min(A)`, the first of its shingles in that order. For two
    sets, the first shingle of `A ∪ B` in the permutation is equally
    likely to be any element of the union, and the two minima are equal
    exactly when that element is in both sets. So:

    ```text
    Pr[ min(A) == min(B) ] = |A ∩ B| / |A ∪ B| = J(A, B)
    ```

    One permutation gives a coin that lands heads with probability `J`.
    `K` independent permutations give `K` coins; the fraction of
    positions where two **signatures** agree is an unbiased estimate of
    `J` with standard deviation `sqrt(J (1 - J) / K)`.

    Real permutations of 2^31 values are too big to store, so MinHash
    uses hash functions instead: `h(x) = (a * x + b) mod P` with random
    `a` in `[1, P)` and `b` in `[0, P)`, where `P` is a prime. This is
    the family MLlib uses too; in
    `mllib/src/main/scala/org/apache/spark/ml/feature/MinHashLSH.scala`
    (4.2.0) the hash is `((1L + i) * a + b) % MinHashLSH.HASH_PRIME`
    with `HASH_PRIME = 2038074743`.

    In Spark the whole signature is two nested higher-order functions,
    with the `K` coefficient pairs as a literal array of structs:

    ```python
    def minhash(sh, params):
        coeffs = F.array(*[F.struct(F.lit(a).cast("bigint").alias("a"),
                                    F.lit(b).cast("bigint").alias("b")) for a, b in params])
        sig = F.transform(coeffs, lambda c: F.array_min(
            F.transform("h", lambda x: (c["a"] * x + c["b"]) % P)))
        return sh.withColumn("sig", sig)
    ```

    No UDF, no `explode`, no shuffle: each row's signature depends only
    on that row, so the plan is a single `Project`. The physical plan
    prints the coefficients inline:

    ```text
    Project [listing_id#7, h#51, transform([[695425565,2035525362],[323946140,847876999],...],
      lambdafunction(array_min(transform(h#51, lambdafunction((((lambda x_4#361.a * lambda x_5#362L)
      + lambda x_4#361.b) % 2147483647), lambda x_5#362L, false))), lambda x_4#361, false)) AS sig#360]
    ```

    The literal travels inside the serialized plan to every task. That
    is right for 100 pairs of numbers; for megabytes, use a broadcast
    (the IVF section compares the options).

