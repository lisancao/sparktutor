    ## Hot Buckets: Skew in LSH

    Prediction from the S-curve is an **expectation**. The variance can
    be large on messy text, and you can see why by counting, for each of
    the 100 hash functions on its own, how many pairs share its minimum:

    ```text
     i   pairs  biggest
     0  5191.0       53
     1 20425.0      184
     2 15453.0      150
     3 19581.0      185
     4  5781.0       75
    count      100.000000
    mean      6521.730000
    std       5746.830961
    min       2594.000000
    max      48108.000000
    ```

    For hash function 1, 184 listings share one minimum. That happens
    when a boilerplate shingle (from "located in", "pick up only") gets
    a small hash value: every listing that contains it has the same
    minimum. On average over hash functions the collision rate is right;
    for one hash function it can be more than seven times the mean. Banding with
    only the first five hash functions and `r = 1` produced 46,495
    candidates where the S-curve predicted 24,783, because three of
    those five are heavy hitters.

    Rows per band are the cure: a bucket key needs `r` minima to agree,
    and the chance that `r` independent hash functions all pick
    boilerplate is small. With `b = 25, r = 4` the largest bucket held
    17 listings, and the buckets with 15 or more belonged to:

    ```text
    +---------------+--------+
    |         seller|listings|
    +---------------+--------+
    |        user114|       1|
    |        user068|       6|
    |        user018|       5|
    |        user052|       1|
    |liquidation_pro|      15|
    |  deals_by_marc|      20|
    |        user089|       2|
    +---------------+--------+
    ```

    The template sellers. A bucket of `m` listings costs `m (m - 1) / 2`
    pairs, so at scale one template seller with 10,000 ads would add 50
    million candidates. Watch the bucket size distribution
    (`groupBy("band", "bucket").count()`) the way you would watch key
    skew in any join, and treat very large buckets separately: verify
    them with a stricter rule, sample them, or remove the template text
    before shingling.

