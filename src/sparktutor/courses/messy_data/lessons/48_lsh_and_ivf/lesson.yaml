    ## Exercise: A Banded MinHash Index and an IVF Search

    The harness loads the listings, shingles them with the given
    `shingles()`, makes the vectors with `make_vectors()` and trains
    k-means centroids for you. It computes the exact answers in plain
    Python and numpy. Complete:

    1. `minhash(sh, params)`: the `sig` column, with built-in functions
       only.
    2. `candidate_probability(s, b, r)` and `choose_bands(k, threshold,
       min_prob)`: the S-curve, and the `(b, r)` with the largest `r`
       that still makes a pair at the threshold a candidate with
       probability `min_prob` (None if none does).
    3. `candidate_pairs(sig, b, r)`: distinct pairs `a < b` sharing a
       band bucket.
    4. `verify(cands, sh, threshold)`: exact Jaccard `j`, kept if at
       least the threshold.
    5. `assign_lists(vectors, centroids)`: the 0-based nearest centroid
       as `list`.
    6. `ivf_candidates(queries, index, centroids, nprobe)` and
       `top_k(scored, k)`.

    The checks: signatures equal `min((a * x + b) % P)` computed in
    Python, the plan of `minhash` has no Python, `Exchange` or
    `Generate` node, the estimate is within 0.05 of the exact Jaccard
    on average, `choose_bands` picks the right shapes, the banded index
    finds at least 99% of the pairs with `J >= 0.7` while comparing at
    most 5% of all pairs, verification has precision 1.0, every vector
    is in its nearest list, IVF at full probe equals brute force, and
    IVF reaches recall 0.88 at `nprobe = 8` and 0.97 at `nprobe = 16`
    while scoring at most a quarter of brute force at `nprobe = 8`.
