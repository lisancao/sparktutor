    ## The Data: Reposted Listings and Clustered Vectors

    `data/messy/listings/listings.jsonl` holds 424 listings from a
    second-hand marketplace, posted by 152 sellers. Sellers repost the
    same item again and again, and every repost differs a little. One
    seller's kayak:

    ```text
    +----------+----------+--------+----------------------------------------------------------------------------------------------------------------------------------------------------------------------+
    |listing_id|posted    |price   |description                                                                                                                                                           |
    +----------+----------+--------+----------------------------------------------------------------------------------------------------------------------------------------------------------------------+
    |L0007     |2026-09-12|785.00  |Mint sit on top kayak with paddle and seat, stored indoors over winter. Works perfectly. Downsizing. Located in Montreal.                                             |
    |L0008     |2026-09-13|$760 OBO|Mnit sit on top kayak with paddle and seat, stored indoors over winter. Works perfectly. Downsizing. Located in Montreal. Must go this week.                          |
    |L0009     |2026-09-17|$710 OBO|Serious buyers only. Mint sit on top kayak with paddle and seat, stored indoors over winter. Downsizing. Located in Montreal.                                         |
    |L0010     |2026-09-21|710 CAD |Mint sit on top kayak with paddle and seat stored indoors over winter Works perfectly Downsizing Located in Montreal                                                  |
    |L0011     |2026-09-23|710.00  |Mint sit on top kayak with paddle and seat, stored indoors over winter. Works perfectly. Located in Montreal. Price drop!                                             |
    |L0012     |2026-09-25|685     |Open to offers. mint sit on top kayak with paddle and seat, stored indoors over winter. works perfectly. downsizing. located in montreal. can deliver for a small fee.|
    +----------+----------+--------+----------------------------------------------------------------------------------------------------------------------------------------------------------------------+
    ```

    A typo ("Mnit"), punctuation dropped, a sentence added, a sentence
    removed, a change of case. Two sellers also post many *different*
    items from one template, which makes their listings look alike
    without being the same item:

    ```text
    L0391 Marc's Furniture Outlet. 27 inch gaming monitor, 165 hz, no dead pixels, original box in great
          condition. All our items are cleaned and inspected. Delivery available across the island. ...
    L0403 Marc's Furniture Outlet. Computerised sewing machine, 100 stitches, barely used in great
          condition. All our items are cleaned and inspected. Delivery available across the island. ...
    ```

    Those two have a Jaccard similarity of 0.60 on character shingles
    (below). The generator is `scripts/messy_gen/listings.py`.

    The second half of the lesson needs vectors. Real embeddings come
    from a model, as in "Feature Vectors and Similarity Search"; here the
    exercise makes 20,000 synthetic unit vectors in 32 dimensions with
    numpy (a fixed seed), drawn around 40 cluster centres whose sizes
    follow a Zipf law, plus 200 held-out query vectors. The skew is on
    purpose: real embedding spaces have dense regions too.

