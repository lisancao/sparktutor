    ## What MLlib Does Instead

    MLlib's `LSH` base class
    (`mllib/src/main/scala/org/apache/spark/ml/feature/LSH.scala`) says
    it in its own doc comment: "This LSH class implements
    OR-amplification: more than 1 hash functions can be chosen, and each
    input vector are hashed by all hash functions. Two input vectors are
    defined to be in the same bucket as long as ANY one of the hash
    value matches." Each of the `numHashTables` tables holds **one** hash
    value; there is no AND inside a table. In banding terms, MLlib always
    uses `r = 1`. The `hashFunction` in `MinHashLSH.scala` even carries
    the comment `// TODO: Output vectors of dimension numHashFunctions
    in SPARK-18450`; SPARK-18450, "Add AND-amplification to Locality
    Sensitive Hashing", was resolved as Incomplete without a fix.

    `approxSimilarityJoin` posexplodes the hash array, joins on
    `(entry, hashValue)`, takes `distinct()`, computes the exact distance
    with a UDF, and filters. The candidate set is the join before the
    filter. Rebuilding that join on MLlib's own hashes over the same
    shingles (`HashingTF` with `binary=True`, distance threshold 0.3,
    that is `J >= 0.7`):

    ```text
    MLlib numHashTables=5:  candidate pairs inside the join 17730, returned 435, recall vs exact J>=0.7 1.000
    MLlib numHashTables=25: candidate pairs inside the join 56168, returned 435, recall vs exact J>=0.7 1.000
    ```

    Same answer as the banded index, but 17,730 or 56,168 exact distance
    computations instead of 2,244. With `r = 1` the S-curve is
    `1 - (1 - s)^b`, which is not an S at all: at `s = 0.1`, five tables
    already make 41% of pairs candidates. More tables raise recall
    *and* the number of candidates; only rows per band can make the
    curve steep. MLlib's LSH is a fine tool for "Feature Vectors and
    Similarity Search" sizes; for millions of items, banding is what
    keeps the join from becoming quadratic again.

