    ## The Recall Curve

    With 64 lists over the 20,000 vectors, against exact top-10
    neighbours computed with numpy:

    ```text
    IVF: 64 lists, sizes from 16 to 610 (mean 312)
      nprobe= 1: recall@10=0.424, vectors scored 79820 (2.0% of brute force)
      nprobe= 4: recall@10=0.765, vectors scored 308524 (7.7% of brute force)
      nprobe= 8: recall@10=0.913, vectors scored 588344 (14.7% of brute force)
      nprobe=16: recall@10=0.988, vectors scored 1004910 (25.1% of brute force)
      nprobe=64: recall@10=1.000, vectors scored 4000000 (100.0% of brute force)
    ```

    Brute force is 200 queries times 20,000 vectors, 4,000,000 distances.
    Two facts make this table trustworthy:

    - At `nprobe = nlist` the index scores every vector and must return
      **exactly** the brute-force answer. If it does not, the bug is in
      your top-k, not in the index. The exercise checks this.
    - Recall rises with `nprobe` and so does work, monotonically. The
      useful region is the knee: here `nprobe = 8` gives 91% recall for
      15% of the work, and `nprobe = 16` gives 99% for 25%.

    Compare SimHash above on the same vectors and queries: random
    hyperplanes reached 90% recall for 19% of brute force and 99.5% for
    36%; learned centroids reach 91% for 15% and 98.8% for 25%. An index
    that adapts to the data spends its work where the neighbours are.

