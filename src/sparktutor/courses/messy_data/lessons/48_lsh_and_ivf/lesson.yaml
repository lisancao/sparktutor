    ## Skew: Why the Work Is More Than nprobe / nlist

    At `nprobe = 1` you might expect to score `1/64` of the index per
    query, 62,500 vectors for 200 queries. The run scored 79,820. Queries
    are drawn from the same distribution as the data, so they land in
    dense lists more often than in sparse ones: the expected work is the
    sum over queries of the size of the list each one probes, and with
    this data that sum is exactly the 79,820 measured. Skewed data means
    skewed work.

    It also means skewed tasks. With `k = 16` lists the Zipf clusters
    show through:

    ```text
    k=16 sizes [3355, 2107, 1994, 1987, 1963, 1359, 1305, 1299, 1019, 803, 783, 602, 497, 453, 267, 207]
    rows per partition after repartition(8,'list') with k=16: [5318, 1010, 1305, 1236, 2665, 6359, 2107]
    ```

    Partitioning the index by list (the natural layout: one list per
    task) gave seven non-empty partitions for eight slots, and the
    largest held 6,359 vectors against a mean of 2,500. A query batch
    that probes the big lists waits for that one task.

    The usual fix is to **split large lists**: run k-means again inside
    every list larger than twice the mean and replace it with the
    sub-lists. With `k = 16`, one list was over the limit (3,355) and
    became three, for 18 lists:

    ```text
    before (16 lists)  nprobe 1: recall 0.680, scored 369995    nprobe 2: recall 0.861, scored 648176
    after (18 lists)   nprobe 1: recall 0.598, scored 282517    nprobe 2: recall 0.831, scored 567194
                       nprobe 4: recall 0.999, scored 1105909
    ```

    Splitting is not free: smaller cells mean more of a query's
    neighbours sit across a border, so the same `nprobe` finds fewer.
    What it buys is a bound on the largest list (2,107 instead of
    3,355), and so on the slowest task and the worst query. Choose
    `nlist` the way this section did, by measuring the recall curve and
    the list sizes for a few values, and re-check list sizes whenever
    you add data without retraining.

