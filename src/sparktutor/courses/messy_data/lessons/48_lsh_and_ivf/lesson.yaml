    ## Verification Keeps the Answer Exact

    LSH decides which pairs to compare; it never decides the answer. The
    last step recomputes the exact similarity of every candidate:

    ```python
    j = F.size(F.array_intersect("ha", "hb")) / F.size(F.array_union("ha", "hb"))
    found = cands.join(ha, "a").join(hb, "b").select("a", "b", j.alias("j")).filter("j >= 0.7")
    ```

    So **precision is always 1.0**: every reported pair really is above
    the threshold. Only recall is approximate. This is the same promise
    as MLlib's `distCol` ("Text Analytics Without an LLM" made the point
    for the MLlib version) and the reason you can tune `(b, r)` with
    confidence: the only error you can make is a missed pair, and the
    S-curve tells you how likely that is.

    If the sets are large, ship signatures instead of sets and accept
    the MinHash estimate as the answer; then precision is approximate
    too, and you should say so in the output (for example, a column
    with the estimate's standard deviation).

