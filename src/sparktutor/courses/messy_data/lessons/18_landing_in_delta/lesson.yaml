    ## Day 3: Evolving Silver on Purpose

    Day 3 brings `user.geo.country`, which silver did not have. The
    producer's new field is wanted, so the silver code adds a `country`
    column, and the `MERGE` into silver gets `WITH SCHEMA EVOLUTION`.
    Without it, as shown above, the column would be silently dropped.

    After day 3 (and the second delivery of day 2), the silver history:

    ```
    [(0, 'CREATE TABLE'), (1, 'ADD CONSTRAINT'), (2, 'MERGE'), (3, 'MERGE')]
    ```

    Version 2 is days 1 and 2 (40 rows, no `country`), version 3 adds
    day 3 and the column. Running the refinement again adds no version,
    for the reason above: nothing changed.

    This is the difference between drift and evolution. Drift is what
    the producer does to you; evolution is what you decide to do about
    it, in code, with a version in the history that shows when.

