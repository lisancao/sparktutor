    ## Time Travel and History

    Every commit is a version you can read:

    ```python
    spark.read.format("delta").option("versionAsOf", 2).load(silver_path)
    spark.sql(f"SELECT * FROM {table(root, 'silver')} VERSION AS OF 2")
    spark.read.format("delta").option("timestampAsOf", "2026-10-28 21:04:38.118").load(silver_path)
    ```

    The errors are precise:

    ```
    [DELTA_VERSION_NOT_FOUND] Cannot time travel Delta table to version 99. Available versions: [0, 3].
    [DELTA_TIMESTAMP_EARLIER_THAN_COMMIT_RETENTION] The provided timestamp (...) is before the earliest version available to this table (...).
    ```

    **Time zone gotcha.** Get the timestamp for `timestampAsOf` from
    Spark as a string, not from a Python datetime:

    ```python
    ts = (spark.sql(f"DESCRIBE HISTORY {t}").filter("version = 1")
          .select(F.col("timestamp").cast("string")).first()[0])
    ```

    As "Schemas for Data You Don't Control" showed, `collect()` turns
    timestamps into Python datetimes in your computer's local time zone,
    while Spark reads a timestamp string in the session time zone. With the session in UTC on a machine in
    Pacific time, `str(row.timestamp)` was 7 hours off and the read failed
    with `DELTA_TIMESTAMP_EARLIER_THAN_COMMIT_RETENTION` (whose message,
    to add to the fun, prints times in the JVM's local zone).

    `DESCRIBE HISTORY` is the table's audit log: `version`,
    `timestamp`, `operation`, `operationParameters` (the `MERGE`
    condition, the write mode) and `operationMetrics` (rows inserted,
    files added and removed). When a number in gold looks wrong, start
    there.

    To undo a bad load, `RESTORE TABLE ... TO VERSION AS OF n` makes a
    new version whose content equals version `n`. History is not
    rewritten; the restore is itself a version (`RESTORE` in the
    history), so you can undo the undo.

    Old versions stay readable as long as their files exist. `VACUUM`
    deletes files that no retained version needs (7 days by default);
    after it, time travel to older versions stops working. The advanced
    "Designing Tables for Blobs" covers `VACUUM` and `OPTIMIZE`.

