    ## Schema Enforcement on Writes

    A DataFrame `write.format("delta").mode("append")` is checked against
    the table schema in the log. On a table with `event_id STRING, kind
    STRING, user_id BIGINT, amount DOUBLE`:

    | Append | Result |
    |--------|--------|
    | an extra column `country` | `DELTA_METADATA_MISMATCH` |
    | the same, `.option("mergeSchema", "true")` | OK, `country` added |
    | `amount` as a string, even with `mergeSchema` | `DELTA_FAILED_TO_MERGE_FIELDS` |
    | `user_id` as `int` (narrower) | `DELTA_FAILED_TO_MERGE_FIELDS` |
    | the same after `.cast("bigint")` | OK |
    | only `event_id` and `kind` | OK, the other columns NULL |
    | `mode("overwrite")` with `amount` as a string | `DELTA_FAILED_TO_MERGE_FIELDS` |
    | the same, `.option("overwriteSchema", "true")` | OK, table schema replaced |

    The `DELTA_METADATA_MISMATCH` message tells you exactly what
    differs and how to proceed:

    ```
    [DELTA_METADATA_MISMATCH] A metadata mismatch was detected when writing to the Delta table.
    - A schema mismatch detected when writing to the Delta table (Table ID: e61e08b4-...).
    To enable schema migration using DataFrameWriter or DataStreamWriter, please set: '.option("mergeSchema", "true")'.
    For other operations, set the session configuration spark.databricks.delta.schema.autoMerge.enabled to "true". ...

    Table schema:
    root
     |-- event_id: string (nullable = true)
     ...
    Data schema:
    root
     |-- event_id: string (nullable = true)
     ...
     |-- country: string (nullable = true)
    ```

    What this means for messy data:

    - **New fields** are the safe kind of drift. Decide per table
      whether they may arrive on their own (`mergeSchema`) or need a
      code change first.
    - **Type changes** are refused even with `mergeSchema`. That is the
      day 3 `amount` object: it cannot land in a `DOUBLE` column, and
      that is a feature. Handle it in the code that builds silver (the
      `coalesce` of `try_cast` and `get_json_object` from "JSON Drift
      and Quarantine"), so silver keeps one meaning per column.
    - **No silent widening on DataFrame appends**: an `int` column does
      not go into a `bigint` one. Cast to the table's types before
      writing. (SQL `INSERT INTO ... VALUES` does cast: inserting `3`
      into a `DOUBLE` column works.)
    - A missing column is filled with NULL, which can hide a producer
      that stopped sending a field. A `NOT NULL` or `CHECK` constraint
      turns that into an error.

