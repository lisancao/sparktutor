    ## Summary

    In this lesson you learned:

    - **A table format** adds a transaction log to Parquet files:
      atomic commits, isolation, schema enforcement, versions. In Delta
      the log is `_delta_log/NNNN.json` with `metaData`, `add`, `remove`
      and `commitInfo` actions
    - **Delta 4.4.1 for Spark 4.2**: `io.delta:delta-spark_4.2_2.13:4.4.1`
      plus the extension and catalog settings, or
      `# spark-connectors: delta`
    - **Always `format("delta")`**: a plain or Parquet read of the folder
      returns removed files too, silently
    - **Layers**: bronze keeps raw lines with their origin, silver is
      typed and cleaned, quarantine keeps what failed with a reason,
      gold answers questions
    - **`MERGE` on a content-based id** makes redelivery harmless;
      deduplicate the source yourself; a merge that changes nothing makes
      no commit; two source rows for one target row fail on update
    - **Enforcement**: `DELTA_METADATA_MISMATCH` for new columns
      (`mergeSchema` to allow), `DELTA_FAILED_TO_MERGE_FIELDS` for type
      changes (always refused), no widening on DataFrame appends;
      `MERGE ... INSERT *` drops new columns unless `WITH SCHEMA
      EVOLUTION`
    - **Constraints**: `NOT NULL` at create time only; Delta's `CHECK`
      rejects NULL unless you allow it; violations arrive as task
      failures carrying `DELTA_VIOLATE_CONSTRAINT_WITH_VALUES`
    - **Time travel** with `versionAsOf` / `timestampAsOf` (pass Spark's
      own timestamp string), `DESCRIBE HISTORY`, `RESTORE`
    - **Change data feed** for row-level changes, and **streaming into
      Delta** with one commit per micro-batch

    Next: **Text Analytics Without an LLM**, where the clean text you
    can now land reliably becomes a search index and a duplicate
    detector.
