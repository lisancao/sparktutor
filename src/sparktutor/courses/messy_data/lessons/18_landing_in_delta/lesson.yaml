    ## Landing Bronze Twice Without Duplicates

    Files get delivered twice: a retry after a timeout, a partner who
    resends the whole week. An `append` would store every line twice.
    Give each line an id that depends only on its content and origin,
    and `MERGE` it in, inserting only ids the table does not have:

    ```python
    def land_bronze(spark, root, files):
        lines = (spark.read.text(files)
                 .select(F.col("_metadata.file_name").alias("file"), F.col("value").alias("raw"))
                 .withColumn("record_id", F.sha2(F.concat_ws("|", "file", "raw"), 256))
                 .withColumn("ingested_at", F.current_timestamp())
                 .dropDuplicates(["record_id"]))
        lines.createOrReplaceTempView("incoming_lines")
        return spark.sql(f"""
            MERGE INTO {table(root, 'bronze')} AS t
            USING incoming_lines AS s
            ON t.record_id = s.record_id
            WHEN NOT MATCHED THEN INSERT *""")

    land_bronze(spark, root, days[:2]).show()     # day 1 and 2
    land_bronze(spark, root, days[1:]).show()     # day 2 again, and day 3
    land_bronze(spark, root, days[1:]).show()     # the same again
    ```

    ```
    +-----------------+----------------+----------------+-----------------+
    |num_affected_rows|num_updated_rows|num_deleted_rows|num_inserted_rows|
    +-----------------+----------------+----------------+-----------------+
    |               40|               0|               0|               40|
    +-----------------+----------------+----------------+-----------------+
    ... 21 inserted ...
    ... 0 inserted ...
    ```

    And the history (`DESCRIBE HISTORY`, with two of the
    `operationMetrics`):

    ```
    0 CREATE TABLE {}
    1 MERGE {'numSourceRows': '40', 'numTargetRowsInserted': '40'}
    2 MERGE {'numSourceRows': '41', 'numTargetRowsInserted': '21'}
    ```

    61 rows in bronze, no duplicates. Details:

    - The third `MERGE` changed nothing and **made no commit**: there is
      no version 3. An empty append behaves the same way.
    - `dropDuplicates(["record_id"])` matters. An insert-only `MERGE`
      does not deduplicate its *source*: two identical source rows that
      both find no match are both inserted (checked: a source with `d`
      twice inserted `d` twice). The `MERGE` protects you from the table's
      past, not from duplicates inside today's delivery.

