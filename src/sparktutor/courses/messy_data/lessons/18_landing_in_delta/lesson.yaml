    ## Silver and Quarantine From Bronze

    Silver parses bronze's raw lines with `from_json` and the
    drift-absorbing schema from "JSON Drift and Quarantine", with a
    corrupt record column so a line that does not parse is caught
    instead of becoming a row of NULLs:

    ```python
    parsed = (spark.read.format("delta").load(os.path.join(root, "bronze"))
              .withColumn("e", F.from_json("raw", EVENT_SCHEMA,
                                           {"columnNameOfCorruptRecord": "_corrupt"})))
    amount = F.coalesce(F.col("e.amount").try_cast("double"),
                        F.get_json_object("e.amount", "$.value").try_cast("double"))
    good = (parsed.filter(F.col("e._corrupt").isNull())
            .select(F.col("record_id").alias("event_id"),
                    F.coalesce("e.event_type", "e.event").alias("kind"),
                    F.coalesce(F.col("e.user.id"), F.col("e.user_id")).alias("user_id"),
                    F.col("e.user.plan").alias("plan"),
                    amount.alias("amount"),
                    F.col("e.ts").alias("ts"),
                    "file"))
    bad = (parsed.filter(F.col("e._corrupt").isNotNull())
           .select("record_id", "file", "raw", F.lit("malformed").alias("reason"),
                   F.current_timestamp().alias("quarantined_at")))
    ```

    Both go in with an insert-only `MERGE` keyed by the bronze
    `record_id`, so rebuilding silver from all of bronze after every
    delivery is safe: rows already there are skipped. Reusing the bronze
    id as the silver key also gives you lineage for free: join silver
    back to bronze on it to see the raw line.

    Quarantine is a table, not a log message. It can be counted,
    alerted on, fixed and replayed, and its `raw` column holds exactly
    what arrived:

    ```
    +----------------------+---------+-------------------------------------------+
    |file                  |reason   |raw                                        |
    +----------------------+---------+-------------------------------------------+
    |events_2026-10-03.json|malformed|{"event_type": "purchase", "user": {"id": 9|
    +----------------------+---------+-------------------------------------------+
    ```

