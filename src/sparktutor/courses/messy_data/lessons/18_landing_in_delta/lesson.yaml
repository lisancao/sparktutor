    ## Why a Folder of Parquet Is Not Enough

    Take a silver folder with `amount DOUBLE` and append a batch where a
    producer sent `amount` as text:

    ```python
    p = "/tmp/silver_parquet"
    spark.createDataFrame([("a", "purchase", 12.5)], "event_id string, kind string, amount double") \
        .write.parquet(p)
    spark.createDataFrame([("b", "purchase", "12.50 CAD")], "event_id string, kind string, amount string") \
        .write.mode("append").parquet(p)
    ```

    The append succeeds. Nothing checked it against the existing files.
    The damage shows up later, for whoever reads the folder:

    ```
    struct<event_id:string,kind:string,amount:string>
    [FAILED_READ_FILE.PARQUET_COLUMN_DATA_TYPE_MISMATCH] ...
    ```

    Spark took the schema from one file and failed on the other. With
    `mergeSchema` the read fails earlier, with
    `CANNOT_MERGE_SCHEMAS`/`CANNOT_MERGE_INCOMPATIBLE_DATA_TYPE`. Either
    way the folder is broken until someone finds and deletes the bad
    file. Plain folders have the other problems too: a job that dies
    halfway leaves some of its files behind, a reader during a write sees
    some of the new files, and an overwrite destroys the old version.

    A **table format** keeps a transaction log next to the data files.
    Data files only count once a commit in the log lists them, so a
    write is all or nothing (atomic), readers see one committed version
    (isolation), the log records the schema and rejects data that does
    not match it (enforcement), and old versions stay readable (time
    travel).

