    ## The Trap: Always Say format("delta")

    Change a few rows, then read the folder three ways:

    ```python
    spark.sql(f"UPDATE delta.`{path}` SET raw = upper(raw) WHERE raw LIKE '%\"user_id\": 1,%'")
    print(spark.read.format("delta").load(path).count(),
          spark.read.load(path).count(),
          spark.read.parquet(path).count())
    ```

    ```
    20 40 40
    ```

    The table has 20 rows. The `UPDATE` wrote a new Parquet file with
    all 20 (the old file had to be rewritten to change 4 of them) and
    logged a `remove` for the old one. The old file is still in the
    folder, so it is still there for time travel. `spark.read.load(path)`
    without a format uses the default source, which is Parquet
    (`spark.sql.sources.default`), lists every Parquet file in the
    folder and returns both copies, with no error and no warning. The
    same happens with `spark.read.parquet(path)` and with any tool that
    reads the folder as plain Parquet.

    Read Delta tables with `format("delta")` or by table name, every
    time.

