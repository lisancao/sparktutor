    ## Bronze, Silver, Gold, and Quarantine

    The usual way to land messy data is in layers, each a table:

    | Layer | Holds | For messy events |
    |-------|-------|------------------|
    | **bronze** | the input as it arrived, plus where and when it came from | one row per raw line: `record_id`, `file`, `raw`, `ingested_at` |
    | **silver** | typed, cleaned, one row per real thing | one row per event: `event_id`, `kind`, `user_id`, `plan`, `amount`, `ts`, `file` |
    | **quarantine** | what could not become silver, with the reason | the truncated line of day 3 |
    | **gold** | small tables shaped for a question | events and revenue per day |

    Bronze keeps the raw text on purpose. When the parsing rules
    change (a new field, a bug fix in how `amount` is read), you rebuild
    silver from bronze instead of asking for the files again, and you
    can always show a doubter the exact line an event came from.

    Create the tables up front with explicit schemas, so the first write
    does not decide them by accident:

    ```python
    def table(root, name):
        return f"delta.`{os.path.join(root, name)}`"

    spark.sql(f"""
        CREATE TABLE IF NOT EXISTS {table(root, 'bronze')} (
            record_id STRING NOT NULL, file STRING, raw STRING, ingested_at TIMESTAMP)
        USING delta""")
    ```

