    ## The Change Data Feed

    Time travel shows whole versions. The **change data feed** shows
    the rows that changed between them, which is what an incremental
    gold job wants. Switch it on per table:

    ```python
    spark.sql(f"CREATE TABLE {cdf} (event_id STRING, amount DOUBLE) USING delta "
              "TBLPROPERTIES (delta.enableChangeDataFeed = true)")
    # version 1: insert a and b; version 2: MERGE updates a, inserts c; version 3: delete b

    (spark.read.format("delta").option("readChangeFeed", "true").option("startingVersion", 2)
     .load(cdf_path)
     .select("event_id", "amount", "_change_type", "_commit_version")
     .orderBy("_commit_version", "event_id", "_change_type").show())
    ```

    ```
    +--------+------+----------------+---------------+
    |event_id|amount|    _change_type|_commit_version|
    +--------+------+----------------+---------------+
    |       a|  10.0|update_postimage|              2|
    |       a|   1.0| update_preimage|              2|
    |       c|   3.0|          insert|              2|
    |       b|   2.0|          delete|              3|
    +--------+------+----------------+---------------+
    ```

    An update shows both the old row (`update_preimage`) and the new one
    (`update_postimage`). The feed also works as a stream
    (`spark.readStream.format("delta").option("readChangeFeed",
    "true")`), and changes are recorded only from the version where the
    feed was enabled. Applying a feed like this to keep another table in
    sync is exactly what the Declarative Pipelines course's "Auto CDC:
    Keeping a Table in Sync (Spark 4.2)" lesson does.

