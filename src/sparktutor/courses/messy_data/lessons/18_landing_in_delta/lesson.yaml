    ## What You'll Learn

    "JSON Drift and Quarantine" turned three days of drifting events
    into one clean DataFrame. "Plans, Partitions and Caching" showed why
    you want that result stored as Parquet instead of re-parsing JSON on
    every query, and "Streaming Files: Your First Structured Streaming
    Job" read each new file exactly once. What is still missing is a
    place to put the results that does not fall apart when the data
    misbehaves: a second delivery of the same file, a field that
    changes type, a job that dies halfway through a write, a question
    about what the table looked like yesterday.

    That place is a **table format**. This lesson follows chapter 9 of
    *Learning Spark* (building reliable data lakes) with Delta Lake 4.4.1
    on Spark 4.2. By the end you will be able to:

    - Say what a table format adds to a folder of Parquet files, and see
      it in the `_delta_log`
    - Avoid the silent trap of reading a Delta folder without
      `format("delta")`
    - Lay out bronze (raw), silver (typed and cleaned), quarantine and
      gold tables for messy input
    - Make a second delivery of the same file harmless with `MERGE`
    - Read the schema enforcement errors (`DELTA_METADATA_MISMATCH`,
      `DELTA_FAILED_TO_MERGE_FIELDS`), and evolve a schema on purpose
      with `mergeSchema` and `MERGE WITH SCHEMA EVOLUTION`
    - Guard a table with `NOT NULL` and `CHECK` constraints, and know how
      Delta treats NULL in a check
    - Time travel with `versionAsOf` and `timestampAsOf`, read `DESCRIBE
      HISTORY`, and `RESTORE`
    - Read a table's change data feed

    The "Data Lakes & Lakehouses" lesson of the learning_spark course
    compares Delta, Iceberg and Hudi and covers Spark 4.2's new change
    data capture API. This lesson stays with Delta and with what messy
    data does to a table.

- Class: text
  Depth: beginner
  Output: |
    A folder of Parquet files is like a shared drive where everyone
    drops files: nobody can tell a finished upload from a half-copied
    one, nothing stops someone from dropping a spreadsheet with the
    columns in a different order, and deleted files are gone for good. A
    table format adds a librarian with a ledger. A file only counts once
    the ledger says so, every change is a numbered entry, and the
    librarian refuses deliveries that do not match the catalog card.

