    ## Constraints: NOT NULL and CHECK

    Declare `NOT NULL` in `CREATE TABLE`, and add `CHECK` constraints
    with `ALTER TABLE`:

    ```python
    spark.sql(f"CREATE TABLE {t} (event_id STRING NOT NULL, kind STRING, amount DOUBLE) USING delta")
    spark.sql(f"ALTER TABLE {t} ADD CONSTRAINT positive_amount CHECK (amount > 0)")
    ```

    Then:

    | Insert | Result |
    |--------|--------|
    | `('a', 'purchase', -5.0)` | `DELTA_VIOLATE_CONSTRAINT_WITH_VALUES`: `CHECK constraint positive_amount (amount > 0) violated by row with values: - amount : -5.0` |
    | `('b', 'view', NULL)` | `DELTA_VIOLATE_CONSTRAINT_WITH_VALUES` ... `- amount : null` |
    | `(NULL, 'view', 1.0)` | `DELTA_NOT_NULL_CONSTRAINT_VIOLATED`: `NOT NULL constraint violated for column: event_id.` |

    The middle row surprises people who know SQL: in standard SQL a
    `CHECK` that evaluates to NULL passes, but Delta 4.4.1 rejects the
    row. If NULL is allowed, say so:
    `CHECK (amount IS NULL OR amount > 0)`. (Adding a constraint that
    existing rows violate fails too, with
    `DELTA_NEW_CHECK_CONSTRAINT_VIOLATION`, which is how this was first
    noticed: one old row had a NULL amount.)

    Practical notes:

    - The violation is found by a task while it writes, and in Python it
      arrives as a plain `Py4JJavaError`, not as a PySpark exception with
      a condition you can read with `getCondition()`. Its first line is
      `An error occurred while calling o54.save.` and the second names
      Delta's `DeltaInvariantViolationException: [DELTA_VIOLATE_CONSTRAINT_WITH_VALUES] ...`.
      Search the message for the condition name; the exercise harness
      does exactly that.
    - `NOT NULL` cannot be added later: `ALTER TABLE ... ALTER COLUMN
      kind SET NOT NULL` fails with `Cannot change nullable column to
      non-nullable: kind.` (`_LEGACY_ERROR_TEMP_2330`). Decide at
      `CREATE TABLE`.
    - Constraints live in the table properties
      (`delta.constraints.positive_amount` in `SHOW TBLPROPERTIES`),
      and a column a constraint refers to cannot change type: appending
      a string `amount` to such a table fails with
      `DELTA_CONSTRAINT_DATA_TYPE_MISMATCH` instead of
      `DELTA_FAILED_TO_MERGE_FIELDS`.

    A failed write adds no version and leaves no rows: the commit never
    happened.

