    ## Exercise: Land Three Days of Drift

    This exercise uses Delta Lake 4.4.1 (first line
    `# spark-connectors: delta`). Implement:

    1. `create_tables(spark, root)`: empty Delta tables `bronze`,
       `silver` and `quarantine` under `root` (the DDL is in the
       starter), plus the CHECK constraint `positive_amount` on silver
       that allows NULL.
    2. `land_bronze(spark, root, files)`: raw lines with `record_id`
       (`sha2` of file name, `|` and line), `file`, `raw`,
       `ingested_at`, merged in so a file delivered twice adds nothing.
    3. `refine(spark, root, with_country)`: bronze to silver and
       quarantine, insert-only `MERGE`s keyed by `record_id`. With
       `with_country=True`, silver also gets `country` from
       `user.geo.country`, and the silver `MERGE` must evolve the schema.
    4. `build_gold(spark, root)`: `day`, `events`, `revenue` (rounded to
       2 places) from silver, overwritten each time, read back.
    5. `history(spark, root, name)` and `silver_as_of(spark, root,
       version)`.

    The harness lands day 1 and 2, checks counts, then tries two bad
    appends to your silver (a string `user_id`, a negative `amount`)
    and expects `DELTA_FAILED_TO_MERGE_FIELDS` and
    `DELTA_VIOLATE_CONSTRAINT_WITH_VALUES` and no new version. Then it
    lands day 2 again with day 3, refines twice, and checks: 61 bronze
    rows, 60 silver events with amounts for every shape, `country` on
    exactly the 20 day 3 events, the truncated line in quarantine, gold
    against totals computed with Python's `json`, and that the silver
    version from before day 3 has 40 rows and no `country` column.
