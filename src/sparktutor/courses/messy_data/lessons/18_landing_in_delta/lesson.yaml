    ## MERGE Errors and Silent Drops

    More `MERGE` behaviour to know before you rely on it.

    **Two source rows for one target row** fail, when the merge would
    update or delete:

    ```
    UnsupportedOperationException: [DELTA_MULTIPLE_SOURCE_ROW_MATCHING_TARGET_ROW_IN_MERGE]
    Cannot perform Merge as multiple source rows matched and attempted to modify the same
    target row in the Delta table in possibly conflicting ways. ...
    ```

    Which of the two values should win is ambiguous, so Delta refuses.
    Deduplicate the source first, keeping the row you mean (the latest
    by timestamp, for example).

    **A new column in the source is dropped** by `INSERT *` unless you
    ask for schema evolution. A source with an extra `country` column:

    ```python
    spark.sql(f"MERGE INTO {t} t USING wider s ON t.event_id = s.event_id "
              "WHEN NOT MATCHED THEN INSERT *")
    ```

    succeeds, inserts the row, and leaves the table's columns as
    `['event_id', 'amount']`. The country value is gone, without an
    error. Add `WITH SCHEMA EVOLUTION` (Spark 4.0 SQL, SPARK-47627) and
    the column is added; rows that existed before get NULL:

    ```python
    spark.sql(f"MERGE WITH SCHEMA EVOLUTION INTO {t} t USING wider2 s "
              "ON t.event_id = s.event_id WHEN NOT MATCHED THEN INSERT *")
    ```

    ```
    +--------+------+-------+
    |event_id|amount|country|
    +--------+------+-------+
    |       a|   1.0|   NULL|
    |       d|   4.0|   NULL|
    |       d|   4.0|   NULL|
    |       e|   5.0|   NULL|
    |       f|   6.0|     VN|
    +--------+------+-------+
    ```

    (The two `d` rows are the duplicate-source insert from the previous
    section; `e` came through the plain merge, which dropped its `CA`.)

    The DataFrame form, `DataFrame.mergeInto` (4.0), works on Delta
    4.4.1 too, but with a path table you have to spell the target's
    columns with its full name, as in
    ``F.expr(f"{t}.event_id = s.event_id")``, since the target cannot be
    aliased. A wrong name there failed in our run with a confusing
    `[INTERNAL_ERROR] Cannot find main error class
    'DELTA_MERGE_UNRESOLVED_EXPRESSION'`: Delta raised its own error
    class, and Spark's error formatter did not know it. For path tables
    the SQL form is simpler.

