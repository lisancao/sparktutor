    ## Streaming Into Delta

    The streaming query from "Streaming Files: Your First Structured
    Streaming Job" can write straight into a Delta table, with exactly
    once semantics, by changing only the sink:

    ```python
    q = (spark.readStream.text(inbox)
         .select(F.col("_metadata.file_name").alias("file"), F.col("value").alias("raw"))
         .writeStream.format("delta")
         .option("checkpointLocation", os.path.join(root, "checkpoints", "raw"))
         .trigger(availableNow=True)
         .start(os.path.join(root, "raw_stream")))
    q.awaitTermination()
    ```

    Run it after day 1 arrives and again after day 2: the table has 40
    rows, and its history shows one commit per micro-batch, each tagged
    with the query id and batch number:

    ```
    0 STREAMING UPDATE {'epochId': '0', 'outputMode': 'Append', 'queryId': 'a37db5ef-...'}
    1 STREAMING UPDATE {'epochId': '1', 'outputMode': 'Append', 'queryId': 'a37db5ef-...'}
    ```

    The Delta sink uses that query id and batch number to skip a batch
    it has already committed when Spark replays it, which is the
    idempotent write the streaming lesson asked for. For the `MERGE`
    style of landing, call `MERGE` inside `foreachBatch`.

