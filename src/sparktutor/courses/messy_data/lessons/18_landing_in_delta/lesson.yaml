    ## Delta Lake With Spark 4.2

    Delta Lake is not part of Apache Spark; it is a connector with a
    build per Spark version. For Spark 4.2 use Delta 4.4.1. Outside
    SparkTutor:

    ```bash
    spark-submit \
      --packages io.delta:delta-spark_4.2_2.13:4.4.1 \
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
      my_job.py
    ```

    `delta-spark_4.2_2.13` names the Spark version (4.2) and Scala
    version (2.13) the jar was built for. The extension adds `MERGE`,
    `DESCRIBE HISTORY`, `RESTORE` and friends; the catalog lets
    `CREATE TABLE ... USING delta` work. In a SparkTutor exercise, the
    first line `# spark-connectors: delta` does all of that. The
    learning_spark course's "Data Lakes & Lakehouses" lesson also shows
    the `pip install delta-spark` route.

    Every example here uses **path tables**: the table is a folder,
    named in SQL as ``delta.`/path/to/table` ``. That keeps exercises
    self-contained; with a metastore you would use names like
    `lake.silver` instead.

