    ## The Transaction Log

    Write day 1's raw lines as a Delta table and look inside:

    ```python
    from pyspark.sql import SparkSession, functions as F

    lines = (spark.read.text("data/messy/events/events_2026-10-01.json")
             .select(F.col("_metadata.file_name").alias("file"), F.col("value").alias("raw")))
    lines.write.format("delta").save(path)
    ```

    ```
    . ['part-00000-5df065a0-...-c000.snappy.parquet']
    _delta_log ['00000000000000000000.json']
    _delta_log/_staged_commits []
    ```

    (checksum files left out). The data is ordinary Parquet. The log is
    one JSON file per commit, numbered from 0, each line one **action**:

    ```
    commitInfo {"timestamp": 1793221269903, "operation": "WRITE", "operationParameters": {"mode": "ErrorIfExists", ...
    metaData   {"id": "df0ab44c-...", "format": {"provider": "parquet", "options": {}}, "schemaString": "{\"type\":\"struct\", ...
    protocol   {"minReaderVersion": 1, "minWriterVersion": 2}
    add        {"path": "part-00000-5df065a0-...-c000.snappy.parquet", "partitionValues": {}, "size": 1571, ...
    ```

    - `metaData` holds the schema: this is what enforcement checks
      against.
    - `add` says "this file is part of the table from now on" (with
      row counts and min/max statistics in `stats`). Later commits add
      `remove` actions for files that an update or delete replaced.
    - `commitInfo` is what `DESCRIBE HISTORY` shows.

    Committing is writing the next numbered JSON file, and only one
    writer can create it. That single step is what makes a write
    atomic.

