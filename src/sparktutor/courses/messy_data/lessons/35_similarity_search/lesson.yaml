    ## Length, Scale and What "Close" Means

    Two measures of closeness cover most uses:

    - **Cosine similarity** is the cosine of the angle between two
      vectors: 1 when they point the same way, 0 when they share nothing
      (for vectors without negative values, such as histograms). It
      ignores length, so a vector and twice that vector are identical.
    - **Euclidean distance** is the straight-line distance: the square
      root of the sum of squared differences. It cares about length.

    For **unit vectors** (length 1) they agree exactly:
    `distance^2 = 2 - 2 * cosine`. Ranking by smallest distance and by
    largest cosine then gives the same neighbours, which is why the
    usual recipe is: normalize every vector to length 1, then use
    whichever measure the tool supports. MLlib's
    `BucketedRandomProjectionLSH` supports only Euclidean distance, so
    you will feed it unit vectors.

    MLlib has transformers for scaling (all checked in 4.2.0):

    - `Normalizer(p=2.0)` (default `p` is 2.0) scales each **row** to
      length 1.
    - `StandardScaler` learns each **column's** spread and divides by
      it. Its defaults are `withStd=True` and `withMean=False`: it does
      not subtract the mean unless you ask, because subtracting would
      turn sparse vectors dense.
    - `MinMaxScaler` maps each column to the range 0 to 1.
    - `VectorAssembler` concatenates columns (numbers and vectors) into
      one vector.

    Column scaling matters as soon as you mix features with different
    units. Append the file size in bytes to the 16 audio bands and the
    `original` and `hires` copies of a tone differ by 1000 bytes, so
    their Euclidean distance is at least 1000, while every band
    difference is below 1: the size decides every neighbour. The fitted
    `StandardScaler` reports that column's standard deviation (`std`,
    here 405.1) and divides by it. Scaling equalizes spread, but it
    cannot tell you whether file size *should* matter; leaving it out is
    the real fix.

