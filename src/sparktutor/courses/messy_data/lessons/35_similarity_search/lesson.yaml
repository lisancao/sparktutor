    ## Gotcha: Bands Must Be in Hertz, Not FFT Positions

    The tempting shortcut is to cut the FFT output into 16 equal slices
    by position (`np.array_split(power, 16)`). That works until two
    files have different sample rates or lengths. The `hires` copies were
    saved at 8000 samples per second: the same number of FFT positions
    then covers twice the frequency range, so position 3 means a
    different pitch in each file. With the shortcut, the nearest
    neighbour was in the right family for **30 of the 40** clips, and
    every `hires` file matched something else (the 1000 Hz `hires` tone
    looked identical to the 440 Hz original). With bands computed from
    `rfftfreq` and the file's own rate, all **40 of 40** match.

    This is the general lesson of messy feature extraction: a feature
    has *units*. Pixel fractions instead of pixel counts, hertz instead
    of array positions, seconds instead of samples. Whenever files in
    one library were produced differently, compute features in units
    that do not depend on how the file was produced.

