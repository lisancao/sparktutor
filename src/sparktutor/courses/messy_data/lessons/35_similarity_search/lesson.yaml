    ## On Spark Connect

    MLlib runs on Spark Connect since 4.0 (SPARK-50812): `fit` trains on
    the server, and the client holds a reference to a server-side model
    ("Spark Connect" in the learning_spark course explains the model
    cache). For this lesson we ran every piece under a local
    Connect session on 4.2.0:

    - Work the same: `array_to_vector`, `vector_to_array` (including
      `dtype="float32"`), `VectorAssembler` (with the same errors),
      `Normalizer`, `StandardScaler` and its `mean`/`std`,
      `MinMaxScaler`, `BucketedRandomProjectionLSH` fit and transform,
      `approxNearestNeighbors`, `approxSimilarityJoin`, the 4.2 vector
      functions, and the whole exercise solution, with the same recall.
    - Differs: **the `distCol` argument is ignored**.
      `approxSimilarityJoin(a, b, 0.5, distCol="d")` returns columns
      `datasetA, datasetB, distCol` on Connect and `datasetA, datasetB,
      d` in classic mode; `approxNearestNeighbors` behaves the same way.
      "Text Analytics Without an LLM" met this with MinHash. Keep the
      default name and rename with `alias`.
    - Errors from the server keep their class and message, but a JVM
      exception without an error class (such as the `VectorSizeHint`
      one) arrives wrapped differently than in classic mode, so match
      on the message text, not the Python exception type.

