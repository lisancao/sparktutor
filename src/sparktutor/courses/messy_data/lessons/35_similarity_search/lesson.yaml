    ## What You'll Learn

    "Images and Audio" decoded pixels and WAV samples into numbers,
    "Text Analytics Without an LLM" turned documents into TF-IDF vectors
    and found near-duplicate messages with `MinHashLSH`, and "Running a
    Model over Your Data with pandas UDFs" ran Python over every row in
    batches. This lesson joins those threads into one job that every
    media library, product catalogue and search system needs: **given a
    file, find the files most like it.**

    The recipe has three steps, and each has its own traps:

    1. **Features.** Turn each file into a fixed-length list of numbers
       (a *feature vector*) so that similar files get similar numbers.
    2. **Similarity.** Decide what "close" means: cosine similarity,
       Euclidean distance, and why scaling decides the answer.
    3. **Search.** Compare every pair exactly (simple, correct, and
       quadratic), or let locality-sensitive hashing propose a few
       candidates (fast, and sometimes wrong), and *measure* how wrong.

    By the end of this lesson you will be able to:

    - Build colour histograms for images and frequency-band energies for
      audio with pandas UDFs, and make them robust to the mess in a real
      library (gray and RGBA images, different sizes, different sample
      rates)
    - Move between `array<float>` columns and MLlib vectors
      (`array_to_vector`, `vector_to_array`), and use `VectorAssembler`,
      `Normalizer` and `StandardScaler`
    - Use the **vector functions new in Spark 4.2**
      (`vector_cosine_similarity`, `vector_l2_distance`,
      `vector_normalize`, `vector_avg` and friends), and know their type
      rules, NULL rules and a float overflow bug in 4.2.0
    - Run an exact k-nearest-neighbour search with a self join and a
      window, read its plan, and explain why it does not scale
    - Run approximate search with `BucketedRandomProjectionLSH`
      (`approxNearestNeighbors`, `approxSimilarityJoin`), choose
      `bucketLength` and `numHashTables`, and measure recall against the
      exact answer
    - Say which of these pieces work on Spark Connect in 4.2.0, and
      where real embedding models fit

    Building LSH and an IVF index from scratch is the subject of the
    advanced lesson "Building LSH and an IVF Vector Index"; here you use
    what MLlib ships.

- Class: text
  Depth: beginner
  Output: |
    Imagine describing every photo in a shoebox with a short list of
    numbers: how much of it is red, how much is blue, how much is white.
    Two photos of the same red mug get almost the same list, even if one
    is a little brighter. Finding "photos like this one" then becomes
    finding lists of numbers that are close to each other. Comparing
    your photo with every other photo works for a shoebox. For a
    warehouse of photos you need a shortcut, and the shortcut sometimes
    misses. This lesson builds both and measures the miss.

