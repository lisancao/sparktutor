    ## Text Vectors Fit the Same Pattern

    The TF-IDF vectors from "Text Analytics Without an LLM" are MLlib
    *sparse* vectors, already normalized to length 1 by `Normalizer`.
    `BucketedRandomProjectionLSH` accepts sparse vectors, so the same
    recall method applies to documents. For short texts compared as
    sets of words, `MinHashLSH` with Jaccard distance (from that lesson)
    is usually the better choice; for longer texts or learned
    embeddings, cosine on unit vectors is.

    To use the 4.2 vector functions on TF-IDF, convert with
    `vector_to_array(col, "float32")`, which makes every one of the
    `numFeatures` slots explicit: 4096 floats per document is fine,
    262144 is a megabyte per row. Keep large sparse vectors as MLlib
    vectors.

