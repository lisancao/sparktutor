    ## Why the Exact Search Does Not Scale

    The number of pairs grows with the *square* of the library:

    | Files | Pairs to score |
    |---|---|
    | 42 | 1722 |
    | 10 000 | about 100 million |
    | 1 000 000 | about 1 trillion |

    A trillion cosine computations is not impossible for a big cluster,
    but it has to be repeated whenever the library changes, and a
    broadcast nested loop join needs one whole side in every task's
    memory. Two common ways out:

    - **Restrict the pairs** by a key you already trust: compare only
      within a product category, a language or a file type. That is
      *blocking*, and "Deduplication and Entity Resolution" builds on
      it.
    - **Let a hash propose candidates**, so that most far-apart pairs
      are never compared. That is locality-sensitive hashing, next.

    The exact search keeps one essential job even at scale: on a
    **sample**, it is the ground truth that tells you how good the
    approximate search is.

