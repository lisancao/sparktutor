    ## The Same Maths With Higher-Order Functions

    Before 4.2, or when you need `double` precision, write the dot
    product with the higher-order functions from "Complex Types and
    Higher-Order Functions": `zip_with` multiplies element by element and
    `aggregate` adds up:

    ```python
    dot = F.aggregate(F.zip_with("a", "b", lambda x, y: x * y), F.lit(0.0), lambda acc, x: acc + x)
    norm = lambda c: F.sqrt(F.aggregate(F.transform(c, lambda x: x * x), F.lit(0.0), lambda acc, x: acc + x))

    pairs.select((dot / (norm("a") * norm("b"))).alias("cosine_double"),
                 F.call_function("vector_cosine_similarity",
                                 F.col("a").cast("array<float>"),
                                 F.col("b").cast("array<float>")).alias("cosine_float")).show()
    ```

    ```text
    +------------------+------------+
    |     cosine_double|cosine_float|
    +------------------+------------+
    |0.9746318461970762|   0.9746319|
    +------------------+------------+
    ```

    Both run in the JVM with no Python worker. The built-in is shorter
    and faster (it is a single tight loop); the higher-order version
    works on any numeric array and any Spark version since 3.1, and
    keeps double precision. For MLlib vectors there is no SQL function
    at all: convert with `vector_to_array` or use a Python UDF such as
    `float(a.dot(b))` from "Text Analytics Without an LLM".

