    ## Gotcha: Do Not Derive a Distance From a Float Cosine

    For unit vectors `distance = sqrt(2 - 2 * cosine)`, so it is tempting
    to compute the cosine once and derive the distance. In `float`
    precision that loses most of the digits exactly where they matter,
    for near-duplicates:

    ```python
    spark.sql("""SELECT vector_cosine_similarity(a, b) AS cosine,
      sqrt(2 - 2 * vector_cosine_similarity(a, b)) AS dist_from_cosine,
      vector_l2_distance(a, b) AS dist_direct
    FROM VALUES (vector_normalize(array(1.0F, 0.001F)), vector_normalize(array(1.0F, 0.0F))) AS t(a, b)""").show()
    ```

    ```text
    +---------+----------------+-----------+
    |   cosine|dist_from_cosine|dist_direct|
    +---------+----------------+-----------+
    |0.9999995|     9.765625E-4|9.999997E-4|
    +---------+----------------+-----------+
    ```

    The cosine is stored with about 7 significant digits, and `2 - 2 *
    0.9999995` keeps only one of them. While building this lesson, a
    recall check that compared MLlib's double-precision distances with
    distances derived this way reported misses that were not misses.
    Compare like with like: cosines with cosines, or distances computed
    directly.

