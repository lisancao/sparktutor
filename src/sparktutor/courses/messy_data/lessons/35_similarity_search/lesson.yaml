    ## What a Histogram Cannot See

    A histogram describes *how much* of each colour, not *where*. That is
    why the moved mug matches the original, and it has two consequences
    worth knowing before you trust it:

    - **It is not a fingerprint.** `mug_red_bright.png` has the same
      histogram as the original (brightening by 20 did not push any
      pixel into another cell), so the re-uploaded `IMG_0042.png` is
      "identical" to two different files. For exact duplicates use a
      content hash of the bytes (`sha2(content, 256)` on a `binaryFile`
      read, as in "Files as Files: binaryFile, Globs and Metadata") and
      keep similarity search for *near* duplicates.
    - **Hard cell edges are brittle.** A small shift that crosses a cell
      boundary moves a pixel's whole weight. The one image in this
      library whose nearest neighbour is from another family,
      `plant_green_bright.png`, is exactly that: brightening pushed the
      leaves and the pot across cell edges. Real systems blur the edges
      (soft binning), use colour spaces that separate brightness from
      hue, or use a learned embedding, which is the end of this lesson.

