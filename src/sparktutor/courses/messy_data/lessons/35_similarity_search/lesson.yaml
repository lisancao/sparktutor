    ## Gotcha: Float Overflow in 4.2.0

    The 4.2.0 vector functions add up products and squares in single
    precision, and those intermediate sums are *quadratic* in the input,
    so they overflow long before the result would:

    ```python
    spark.sql("""SELECT vector_cosine_similarity(array(1e20F, 1e20F), array(1e20F, 1e20F)) AS cos_big,
     vector_l2_distance(array(3e19F, 0F), array(-3e19F, 0F)) AS l2_big,
     vector_norm(array(3e19F, 4e19F)) AS norm_big,
     vector_cosine_similarity(array(1e-30F, 1e-30F), array(1e-30F, 1e-30F)) AS cos_tiny,
     vector_normalize(array(3e19F, 4e19F)) AS unit_big""").show()
    ```

    ```text
    +-------+--------+--------+--------+----------+
    |cos_big|  l2_big|norm_big|cos_tiny|  unit_big|
    +-------+--------+--------+--------+----------+
    |    NaN|Infinity|Infinity|    NULL|[0.0, 0.0]|
    +-------+--------+--------+--------+----------+
    ```

    Every value should be ordinary (1.0, 6e19, 5e19, 1.0 and
    `[0.6, 0.8]`). SPARK-58544 fixes it in 4.3.0. Normalized features
    such as histograms and band shares are nowhere near these ranges,
    but raw counts, money in cents or embeddings from a badly scaled
    model can be. Normalize or scale *before* calling the functions, in
    Python if necessary.

