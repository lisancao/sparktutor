    ## Exact Nearest Neighbours

    With unit vectors in an `array<float>` column `unit`, the exact
    search is a self join, a score and a window:

    ```python
    from pyspark.sql import Window

    a = vectors.select("file", F.col("unit").alias("a"))
    b = vectors.select(F.col("file").alias("neighbour"), F.col("unit").alias("b"))
    pairs = (a.crossJoin(b).filter(F.col("file") != F.col("neighbour"))
             .select("file", "neighbour",
                     F.call_function("vector_cosine_similarity", "a", "b").alias("cosine")))
    best = Window.partitionBy("file").orderBy(F.desc("cosine"), "neighbour")
    nearest = pairs.withColumn("rank", F.row_number().over(best)).filter("rank = 1").drop("rank")
    ```

    ```text
    +------------------+------------------+---------+
    |file              |neighbour         |cosine   |
    +------------------+------------------+---------+
    |IMG_0042.png      |mug_red_bright.png|1.0      |
    |checker_gray.png  |checker_bright.png|1.0      |
    |mug_red_bright.png|IMG_0042.png      |1.0      |
    |sky_bright.png    |sky_large.png     |0.7395378|
    |sunset_bright.png |sunset_noisy.png  |0.6599892|
    +------------------+------------------+---------+
    ```

    - **Drop the pair of a file with itself**, or every file's nearest
      neighbour is itself at cosine 1.
    - **Break ties.** Several files have identical vectors (the
      checkerboards, the mug copies). Ordering by the neighbour's name
      after the score makes the answer the same on every run; without it
      `row_number` picks any of the tied rows. For `k` neighbours, keep
      `rank <= k`.
    - Over the whole library, the nearest neighbour is in the right
      family for **41 of 42** images and **40 of 40** clips. The bright
      sky and sunset still find their family, at a much lower cosine
      than the others: a sign that brightness is the weak spot of this
      feature.

    The plan shows what the join costs:

    ```text
    +- BroadcastNestedLoopJoin BuildRight, Cross, NOT (file#73 = neighbour#432)
       :- Project [file#73, static_invoke(VectorFunctionImplUtils.vectorNormalize(features#74, 2.0, vector_normalize)) AS a#431]
       ...
       +- BroadcastExchange IdentityBroadcastMode, [plan_id=573]
    ```

    A `BroadcastNestedLoopJoin` sends one side to every task and
    compares every row with every row: 42 x 42 = 1764 pairs, 1722 after
    dropping self pairs. The built-in functions appear as
    `static_invoke(VectorFunctionImplUtils...)`, plain JVM code with no
    Python step.

