  Output: |
    ## Summary

    - A **feature vector** is a fixed-length list of numbers; store it
      as `array<float>`, convert to an MLlib vector with
      `array_to_vector` (3.1) when an estimator needs one (never a NULL
      array).
    - **Features need units** that do not depend on how a file was
      produced: pixel fractions, B, G, R order handled, gray and alpha
      handled; frequency bands in hertz from the file's own sample rate.
    - A histogram is **not a fingerprint**: use a content hash for exact
      duplicates.
    - **Normalize to length 1**, and cosine and Euclidean distance rank
      neighbours the same way. Column scaling (`StandardScaler`,
      defaults `withStd=True`, `withMean=False`) matters when features
      have different units.
    - Spark 4.2's **vector functions** (`vector_cosine_similarity`,
      `vector_l2_distance`, `vector_normalize`, `vector_avg`, ...) take
      `array<float>` only, have no Python wrappers (use
      `F.call_function`), return NULL for zero vectors, and overflow in
      4.2.0 for huge values (SPARK-58544, fixed in 4.3.0).
    - **Exact search** is a self join (a `BroadcastNestedLoopJoin`), a
      score and a window with a tie-breaker; it is quadratic, and it is
      your ground truth on a sample.
    - **`BucketedRandomProjectionLSH`** needs an explicit
      `bucketLength`, one model per vector length, and unit vectors for
      cosine-like search. `approxNearestNeighbors` can return fewer than
      `k` rows; `approxSimilarityJoin` keeps pairs with distance below
      the threshold. On Connect, `distCol` is ignored.
    - **Measure recall and work** against the exact answer; prefer more
      tables over wider buckets.

    Next: **Deduplication and Entity Resolution**, where the things to
    match are customer records from several systems, and finding pairs
    is only the first step towards one record per real person.
