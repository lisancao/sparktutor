    ## Vector Functions in Spark 4.2

    Spark 4.2.0 added SQL functions for float vectors stored as arrays:

    | Function | Returns | JIRA |
    |---|---|---|
    | `vector_cosine_similarity(a, b)` | float | SPARK-54713 |
    | `vector_inner_product(a, b)` | float | SPARK-54713 |
    | `vector_l2_distance(a, b)` | float | SPARK-54713 |
    | `vector_norm(v, degree)` | float | SPARK-55030 |
    | `vector_normalize(v, degree)` | array<float> | SPARK-55030 |
    | `vector_sum(v)`, `vector_avg(v)` (aggregates) | array<float> | SPARK-55031 |

    `degree` is optional (2.0 by default); 1.0, 2.0 and `float('inf')`
    are the accepted values. There are **no Python wrappers** in
    `pyspark.sql.functions` in 4.2.0, so call them by name with
    `F.call_function` (3.5) or write SQL:

    ```python
    spark.sql("""SELECT vector_cosine_similarity(array(1.0F, 2.0F, 3.0F), array(4.0F, 5.0F, 6.0F)) AS cos,
      vector_inner_product(array(1.0F, 2.0F, 3.0F), array(4.0F, 5.0F, 6.0F)) AS dot,
      vector_l2_distance(array(1.0F, 2.0F, 3.0F), array(4.0F, 5.0F, 6.0F)) AS l2,
      vector_norm(array(3.0F, 4.0F)) AS n2, vector_norm(array(3.0F, 4.0F), 1.0F) AS n1,
      vector_normalize(array(3.0F, 4.0F)) AS unit""").show()

    pairs.select(F.call_function("vector_cosine_similarity", "a", "b").alias("cosine"))
    ```

    ```text
    +---------+----+--------+---+---+----------+
    |      cos| dot|      l2| n2| n1|      unit|
    +---------+----+--------+---+---+----------+
    |0.9746319|32.0|5.196152|5.0|7.0|[0.6, 0.8]|
    +---------+----+--------+---+---+----------+
    ```

    The rules, each checked on 4.2.0:

    - **`array<float>` only.** An `array<double>` (what Python floats
      become by default) or an `array<int>` fails at analysis with
      `[DATATYPE_MISMATCH.UNEXPECTED_INPUT_TYPE] ... The first parameter
      requires the "ARRAY<FLOAT>" type, however "v" has the type
      "ARRAY<DOUBLE>".` There is no implicit cast: cast with
      `F.col("v").cast("array<float>")`, or produce `float32` features
      as the UDFs in this lesson do. Even an untyped `NULL` literal fails
      the same way (its type is `VOID`); write `CAST(NULL AS
      ARRAY<FLOAT>)`.
    - **Same length.** Different lengths fail at run time with
      `[VECTOR_DIMENSION_MISMATCH] Vectors passed to
      vector_cosine_similarity must have the same dimension, but got 2
      and 3. SQLSTATE: 22000`. The aggregates raise the same condition.
    - **NULLs.** A NULL array, a NULL element, an empty array or a
      zero-length vector gives NULL from `vector_cosine_similarity`
      (there is no angle to measure), and `vector_normalize` of a zero
      vector is NULL. `vector_avg` and `vector_sum` skip NULL arrays
      and also **skip any vector that contains a NULL element**, so the
      average of `[1, NULL]` and `[3, 4]` is `[3.0, 4.0]`.
    - A degree other than 1, 2 or infinity fails with
      `[INVALID_VECTOR_NORM_DEGREE]`.

