    ## Two Ways to Ask

    **One query: `approxNearestNeighbors(dataset, key, k)`.** Give it the
    query as an MLlib vector and how many neighbours you want:

    ```python
    key = audio_vectors.filter("file = 'chirp_original.wav'").first().vec
    model.approxNearestNeighbors(audio_vectors, key, 5) \
        .select("file", F.round("distCol", 4).alias("distance")).show()
    ```

    ```text
    +------------------+--------+
    |              file|distance|
    +------------------+--------+
    |chirp_original.wav|     0.0|
    |   chirp_quiet.wav|     0.0|
    |   chirp_hires.wav|  0.0052|
    |   chirp_noisy.wav|  0.0483|
    | chirp_detuned.wav|  0.0721|
    +------------------+--------+
    ```

    The query file itself comes first at distance 0 because it is in the
    dataset. With narrower buckets and one table
    (`bucketLength=0.05, numHashTables=1`) the same call returns only
    **three** rows:

    ```text
    +------------------+--------+
    |              file|distance|
    +------------------+--------+
    |chirp_original.wav|     0.0|
    |   chirp_quiet.wav|     0.0|
    |   chirp_hires.wav|  0.0052|
    +------------------+--------+
    ```

    In 4.2.0 the public method searches only rows that share a bucket
    with the key (the Scala source calls this single probe), so **it can
    return fewer than k rows**. Treat `k` as a maximum.

    **All pairs: `approxSimilarityJoin(datasetA, datasetB, threshold)`.**
    It explodes each row's hashes into one row per table, joins on
    (table, bucket), removes duplicate pairs, computes the exact
    Euclidean distance of each candidate pair and keeps those with
    distance strictly **less than** `threshold`. The result has struct
    columns `datasetA` and `datasetB` with the original rows and a
    `distCol` column:

    ```python
    hashed = model.transform(audio_vectors)
    candidates = (model.approxSimilarityJoin(hashed, hashed, 2.0)
                  .filter(F.col("datasetA.file") != F.col("datasetB.file"))
                  .select(F.col("datasetA.file").alias("file"),
                          F.col("datasetB.file").alias("neighbour"),
                          F.col("distCol").alias("distance")))
    ```

    Two unit vectors are never more than 2 apart, so a threshold of 2.0
    keeps every candidate, which is what you want when you then pick the
    best per file with a window. Passing already hashed data saves
    hashing twice; the method only hashes inputs that lack the output
    column.

