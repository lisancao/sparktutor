    ## The Data: a Small Media Library

    `data/messy/media_library/` holds product photos and short sound
    clips that come in **families**: the same thing captured or exported
    in different ways.

    - `images/`: eight families (a red mug, a blue shirt, a green
      plant, a yellow banana, a gray laptop, a sunset, a checkerboard, a
      sky), each as an original, a brighter copy, a noisy copy, a larger
      copy (40 x 40 instead of 24 x 24) and a copy with the object moved.
    - `audio/`: eight families of mono 16-bit WAV clips (tones at 220,
      440 and 1000 Hz, a two-note chord, white noise, a rising chirp, a
      pulsed beep and a hum), each as an original, a quiet copy, a noisy
      copy, a copy detuned by 2 percent and a copy saved at 8000 samples
      per second instead of 4000.
    - `labels.csv`: `file, kind, family` for every valid file. It is the
      answer key: a good feature puts each file next to a member of its
      own family.

    The mess a real library has is planted too: the sky family was
    exported with an alpha channel, the checkerboard also exists as a
    one-channel gray image, `IMG_0042.png` is a byte-for-byte re-upload
    of the mug, and `thumbnail_cache.png` is not a PNG at all.

    ```python
    from pyspark.sql import functions as F

    labels = spark.read.option("header", True).csv("data/messy/media_library/labels.csv")
    labels.groupBy("kind").agg(F.count("*").alias("files"),
                               F.count_distinct("family").alias("families")).show()
    ```

    ```text
    +-----+-----+--------+
    | kind|files|families|
    +-----+-----+--------+
    |audio|   40|       8|
    |image|   42|       8|
    +-----+-----+--------+
    ```

    The folder is small on purpose, so that an exact search over every
    pair finishes in a second and you can check every approximate answer
    against it. The code is the same for a million files; only the
    search step has to change, and the end of the lesson says how.

