    ## VectorAssembler and Missing Values

    `VectorAssembler` refuses NULLs by default (`handleInvalid="error"`)
    and the job fails with `[FAILED_EXECUTE_UDF]`, caused by
    `Encountered null while assembling a row with handleInvalid =
    "error"`. The other settings:

    - `handleInvalid="skip"` drops the rows with a NULL input. Count
      before and after so files do not vanish silently.
    - `handleInvalid="keep"` puts NaN in the missing positions, but it
      has to know how many positions a vector column has. For a vector
      column made by `array_to_vector` it cannot, and fails with
      `Can not infer column lengths with handleInvalid = "keep". Consider
      using VectorSizeHint to add metadata for columns: [v].` Add a
      `VectorSizeHint(inputCol="v", size=16)` stage before the
      assembler.

    The same behaviour holds on Spark Connect; there the failure arrives
    as a `SparkException` for the first case and as an
    `UnknownException` wrapping the `java.lang.RuntimeException` for the
    second.

