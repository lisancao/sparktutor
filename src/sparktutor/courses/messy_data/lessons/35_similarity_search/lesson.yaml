    ## A Vector Is a Row of Numbers

    A feature vector is just a fixed-length list of numbers. Spark can
    hold one in two ways, and you will use both:

    - **`array<float>` (or `array<double>`)**: an ordinary SQL array.
      Every SQL function, Parquet, `from_json` and the new 4.2 vector
      functions understand it. This is the format to store.
    - **An MLlib vector** (`pyspark.ml.linalg.DenseVector` or
      `SparseVector`, column type `VectorUDT`, shown as `vector` in a
      schema). MLlib estimators such as `StandardScaler` and
      `BucketedRandomProjectionLSH` require it. A sparse vector stores
      only the non-zero positions, which is how TF-IDF vectors with
      262144 slots fit in memory.

    ```python
    from pyspark.ml.linalg import Vectors
    from pyspark.ml.functions import array_to_vector, vector_to_array

    d = Vectors.dense([0.5, 0.0, 0.5])
    s = Vectors.sparse(3, [0, 2], [0.5, 0.5])
    print(d, s, d == s, d.dot(s), d.norm(2))

    df = spark.createDataFrame([("a", [0.5, 0.0, 0.5])], "id string, arr array<double>")
    v = df.withColumn("vec", array_to_vector("arr"))
    v.printSchema()
    v.select(vector_to_array("vec", "float32").alias("back")).printSchema()
    ```

    ```text
    [0.5,0.0,0.5] (3,[0,2],[0.5,0.5]) True 0.5 0.7071067811865476
    root
     |-- id: string (nullable = true)
     |-- arr: array (nullable = true)
     |    |-- element: double (containsNull = true)
     |-- vec: vector (nullable = true)

    root
     |-- back: array (nullable = false)
     |    |-- element: float (containsNull = false)
    ```

    - `array_to_vector` (3.1) turns a numeric array into a dense
      vector; `vector_to_array` (3.0) goes back, as `double` by default
      or `float` with `dtype="float32"`.
    - A dense and a sparse vector with the same values are equal.
    - **`array_to_vector` does not accept a NULL array.** The task fails
      with `[FAILED_EXECUTE_UDF]` caused by a
      `java.lang.NullPointerException`. Filter NULL features out before
      converting; a file whose features could not be computed has no
      place in a vector index anyway.

