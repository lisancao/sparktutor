    ## Approximate Search: BucketedRandomProjectionLSH

    **Locality-sensitive hashing** (LSH) gives similar vectors the same
    hash value more often than dissimilar ones, then only compares
    vectors that share a value. "Text Analytics Without an LLM" used
    `MinHashLSH` for sets of words (Jaccard distance). For numeric
    vectors and Euclidean distance, MLlib has
    `BucketedRandomProjectionLSH` (2.2):

    - It draws `numHashTables` random directions (unit vectors, from
      `seed`).
    - For each direction it projects your vector onto it (a dot product)
      and cuts the line into buckets of width `bucketLength`: the hash
      is `floor(projection / bucketLength)`. Nearby vectors have nearby
      projections, so they usually land in the same bucket.
    - Two vectors become **candidates** when they share a bucket in
      **any** table (the MLlib source calls this OR-amplification). More
      tables mean more chances to meet: more candidates, fewer misses.

    ```python
    from pyspark.ml.feature import BucketedRandomProjectionLSH

    lsh = BucketedRandomProjectionLSH(inputCol="vec", outputCol="hashes",
                                      bucketLength=0.1, numHashTables=3, seed=42)
    model = lsh.fit(audio_vectors)
    model.transform(audio_vectors).select("file", "hashes") \
        .filter(F.col("file").startswith("tone_440")).show(truncate=False)
    ```

    ```text
    +---------------------+-----------------------+
    |file                 |hashes                 |
    +---------------------+-----------------------+
    |tone_440_detuned.wav |[[-3.0], [0.0], [-4.0]]|
    |tone_440_hires.wav   |[[-3.0], [0.0], [-4.0]]|
    |tone_440_noisy.wav   |[[-3.0], [0.0], [-4.0]]|
    |tone_440_original.wav|[[-3.0], [0.0], [-4.0]]|
    |tone_440_quiet.wav   |[[-3.0], [0.0], [-4.0]]|
    +---------------------+-----------------------+
    ```

    `hashes` is an `array<vector>`, one one-element vector per table.
    All five variants of the tone share all three buckets.

    Things that surprised us in 4.2.0:

    - **`bucketLength` has no default.** `fit()` succeeds without it,
      and the first `transform` fails with `[FAILED_EXECUTE_UDF]`
      caused by `java.util.NoSuchElementException: Failed to find a
      default value for bucketLength`. `numHashTables` defaults to 1.
    - **Set `seed` yourself.** The Python default is
      `hash(type(self).__name__)`, Python's string hash, which is
      randomized per process unless `PYTHONHASHSEED` is set. Two runs of
      `python job.py` got default seeds `3768212157542391484` and
      `5963237220475713588`, so different random directions and
      different candidates. `spark-submit` sets `PYTHONHASHSEED=0`, which
      happens to make it stable there. An explicit `seed=42` makes the
      index the same everywhere.
    - **One index per vector length.** The model takes its size from the
      data, and a vector of another length fails with `requirement
      failed: The columns of A don't match the number of elements of x.
      A: 64, x: 16` (wrapped in `FAILED_EXECUTE_UDF`). Images and audio
      need separate models; so would two embedding models.
    - The vectors must not be NULL (see `array_to_vector` above).

