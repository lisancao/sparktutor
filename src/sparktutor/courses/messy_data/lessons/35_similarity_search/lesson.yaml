    ## Measuring Recall

    LSH trades misses for work, so measure both against the exact answer:

    - **Work**: how many candidate pairs it compared, out of all
      `n * (n - 1)` ordered pairs.
    - **Recall@1**: for what fraction of files it found a neighbour as
      similar as the true nearest one. Compare *similarities*, not
      names: when several files tie for nearest, finding any of them is
      correct.

    With `seed=42` on this library:

    | Kind | bucketLength | Tables | Pairs compared | Recall@1 |
    |---|---|---|---|---|
    | image | 0.05 | 1 | 408 of 1722 (24%) | 0.905 |
    | image | 0.05 | 5 | 1026 (60%) | 0.976 |
    | image | 0.1 | 5 | 1428 (83%) | 1.000 |
    | image | 0.2 | 3 | 1602 (93%) | 1.000 |
    | audio | 0.05 | 1 | 180 of 1560 (12%) | 0.800 |
    | audio | 0.05 | 5 | 550 (35%) | 1.000 |
    | audio | 0.1 | 5 | 906 (58%) | 1.000 |
    | audio | 0.5 | 1 | 792 (51%) | 0.900 |

    Reading it:

    - **Wider buckets and more tables** raise both recall and work.
      Past some width every vector lands in the same few buckets and LSH
      degenerates into the exact search (the image index compares every
      pair at width 0.5 with five tables).
    - **More tables beat wider buckets** for the same work: audio at
      width 0.05 with five tables finds everything with 35 percent of
      the pairs; width 0.5 with one table compares more and misses more.
    - **Choose `bucketLength` from the distances you care about.** Most
      nearest neighbours here are within 0.2 of each other (many are
      exact copies at 0); the brightened images are 0.4 to 0.8 away.
      Buckets much narrower than the distances you need to find split
      families; buckets much wider merge everything.
    - The fractions are high because the library is tiny: 42 files
      cannot spread out. On a million files the same settings compare a
      far smaller share; what stays true is the method: sweep on a
      sample, measure recall and work against an exact search, then
      pick.

