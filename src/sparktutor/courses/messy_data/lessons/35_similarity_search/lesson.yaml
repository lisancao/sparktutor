    ## Where Real Embedding Models Fit (Ungraded)

    A colour histogram knows nothing about mugs. In production you
    would replace `color_histogram` and `band_energies` with a learned
    **embedding model** (an image encoder, an audio encoder, a sentence
    embedding model) that maps each file to a few hundred floats where
    distance tracks meaning. Nothing else in this lesson changes:

    - Run the model with an **iterator pandas UDF** that loads it once
      per task and returns `array<float>`, exactly as in "Running a
      Model over Your Data with pandas UDFs"; "Model Inference in
      Production" adds caching by content hash so each file is embedded
      once.
    - **Store** the vectors as `array<float>` in Parquet or Delta, next
      to the file's content hash and the model's name and version, so a
      new model version never mixes with the old one in one index.
    - **Normalize** once (`vector_normalize`), then search with
      `vector_cosine_similarity` exactly, or LSH approximately, and
      measure recall on a sample as above.
    - Learned embeddings are dense and have hundreds of dimensions.
      Random-projection LSH needs more tables there; the advanced lesson
      "Building LSH and an IVF Vector Index" builds an IVF index
      (k-means lists searched a few at a time) from DataFrame primitives
      and compares its recall curve with LSH's. Dedicated vector
      databases do the same with more engineering; Spark's strength is
      building, refreshing and evaluating the vectors in bulk.

