    ## The Source, Piece by Piece

    The `docs` source is the reader from "Reading a Custom File Format,
    in Parallel" with three additions.

    **A parser per kind.** `parse_file(path)` runs on an executor,
    reads the bytes once, and yields one dict per part. The image
    branch checks the magic bytes before trusting the header:

    ```python
    if kind == "image":
        # PNG: 8-byte signature, then the IHDR chunk with width and height
        if data[:8] == PNG_MAGIC and data[12:16] == b"IHDR" and len(data) >= 24:
            base["width"], base["height"] = struct.unpack(">II", data[16:24])
        yield base
    ```

    The PDF branch yields one dict per page with `part` set to the page
    number. Its regular expression works only for the course's tiny,
    uncompressed PDFs; real PDFs need a library such as `pypdf`. Text
    files try UTF-8 and fall back to Latin-1, which is how
    `notes_latin1.txt` comes out as `Café crème` instead of replacement
    characters.

    **Pushdown on kind.** `pushFilters` keeps `EqualTo` and `In` on
    `kind` and yields every other filter back to Spark. `partitions()`
    then lists only files of the wanted kinds, so a query for PDFs never
    opens a WAV file:

    ```python
    def pushFilters(self, filters):
        for f in filters:
            if isinstance(f, EqualTo) and f.attribute == ("kind",):
                self.kinds = {f.value}
            elif isinstance(f, In) and f.attribute == ("kind",):
                self.kinds = set(f.value)
            else:
                yield f      # not handled: Spark keeps filtering on it
    ```

    This only works with `spark.sql.python.filterPushdown.enabled` set
    to `true` (it is `false` by default in 4.2.0), as in "Filter
    Pushdown". The proof is the plan: with pushdown working,
    `filter(kind IN ('pdf', 'audio'))` leaves no `Filter` node at all;
    without it, the plan shows `Filter kind IN (pdf,audio)` above the
    scan. The 4.2.0 trap from that lesson applies here too: with
    pushdown on, call `load()` for each query rather than reusing a
    DataFrame or view after a filtered query.

    **A stream reader.** `streamReader()` returns the inbox reader from
    "Streaming Readers and Writers", keyed by `(mtime_ns, path)`, with
    `ReadMaxFiles` and `SupportsTriggerAvailableNow`. It reuses
    `parse_file`, so a streamed PDF still becomes one row per page.

