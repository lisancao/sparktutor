    ## One Row per Document Part

    A catalog of unstructured files needs a grain: what is one row?
    "One row per file" is simple but wrong for documents with pages,
    and "one row per page" makes no sense for an image. The design here
    is **one row per part**, where a part depends on the kind of file:

    | kind | a part is | columns filled |
    |---|---|---|
    | `image` | the file | `width`, `height` (NULL if it is not a valid PNG) |
    | `audio` | the file | `seconds` |
    | `pdf` | a page (`part` 1, 2, ...) | `text` |
    | `email` | the message | `title` (subject), `text` (body) |
    | `text`, `log`, `json`, `xml` | the file | `title` (first line), `text` |

    Every row also has `path`, `kind`, `part` (0 when the file has no
    pages), `size` and `sha256`. The schema is one wide table with NULLs
    where a column does not apply:

    ```text
    path string, kind string, part int, size long, sha256 string,
    width int, height int, seconds double, title string, text string
    ```

    One wide table is easy to query (`WHERE kind = 'pdf'`), easy to
    union, and easy to extend with a new kind. The alternative, one
    table per kind, is cleaner per kind but forces every consumer to
    union them. For a catalog, wide wins.

    For `data/messy` the counts are:

    | kind | files | parts |
    |---|---|---|
    | audio | 3 | 3 |
    | email | 4 | 4 |
    | image | 5 (4 PNGs and `corrupt.png`) | 5 |
    | json | 3 | 3 |
    | log | 2 | 2 |
    | pdf | 2 | 3 (pages) |
    | text | 6 (4 Markdown, `notes_latin1.txt`, `readme.txt`) | 6 |
    | xml | 1 | 1 |

    The kind comes from the file extension, so `readme.txt` in the
    `images/scans` folder is text, and `corrupt.png` is an image whose
    header does not parse. Checking magic bytes, as in "Files as
    Files", is what keeps that file from producing nonsense widths.

