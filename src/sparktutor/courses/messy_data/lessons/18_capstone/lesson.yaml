    ## What You'll Learn

    This is the last lesson of the course. You will build the same
    thing twice, in the two styles the course has taught:

    1. **An ingestion source.** A Python data source, `format("docs")`,
       that reads a folder of mixed files (PNG, WAV, PDF, e-mail, text,
       logs, JSON, XML) and returns **one row per document part**: one
       row per PDF page, one per e-mail, one per image, and so on. It
       pushes filters on `kind` into the file listing and also runs as a
       stream over an inbox folder.
    2. **A catalog pipeline.** A Declarative Pipeline that builds the
       same catalog from built-in sources (`binaryFile`, `image`) and
       Python UDFs, in bronze, silver and gold layers, with `check_*`
       views that fail the run when the catalog is wrong.

    Both produce the same answer for `data/messy`: **27 parts from 26
    files**. Along the way you will see why the pipeline cannot simply
    use the data source on Spark 4.2.0 (SPARK-59135), and what to do
    about it.

    What you need from earlier lessons, by title:

    - "Files as Files: binaryFile, Globs and Metadata" (inventory,
      `_metadata`, magic bytes)
    - "Text and Logs" (Latin-1 text), "Documents to Rows" (e-mail and
      PDF pages), "Images and Audio" (PNG headers, the `image` source,
      WAV durations)
    - "Reading a Custom File Format, in Parallel", "Filter Pushdown" and
      "Streaming Readers and Writers" (the source's structure)
    - The Declarative Pipelines course, lessons 4 to 6, for the second
      exercise

