    ## Summary

    - A catalog of unstructured files needs a grain. One row per
      document part, in one wide table, handles pages, messages, images
      and audio alike.
    - The `docs` data source parses each kind with the standard library,
      checks magic bytes before trusting headers, pushes `kind` filters
      into the file listing (with
      `spark.sql.python.filterPushdown.enabled`), and streams new files
      with the offsets and limits from "Streaming Readers and Writers".
    - On Spark 4.2.0 a Python data source inside a Declarative Pipeline
      makes `spark-pipelines` exit with status 1 after a successful run
      (SPARK-59135, fixed in 4.4.0). Split the job, or build the
      pipeline from `binaryFile`, `image` and UDFs.
    - The pipeline keeps bronze free of file contents, joins sources on
      `_metadata.file_path`, explodes UDF arrays for one-to-many
      parsing, left-joins so no file disappears, and guards the result
      with `check_*` views.
    - In pipeline code, select columns instead of calling `drop()` on
      another pipeline table; on 4.2.0 the drop is analyzed at
      registration and fails with `TABLE_OR_VIEW_NOT_FOUND`.

    This ends the course. You can now take a folder of messy files
    (logs, drifting JSON, XML, documents, images and audio) and turn it
    into tables with Spark's built-in sources, VARIANT, UDFs, and your
    own Python data sources, from a first reader to streaming, pushdown,
    writers and packaging.
