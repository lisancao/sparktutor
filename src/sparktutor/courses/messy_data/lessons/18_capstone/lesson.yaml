    ## The Catalog Pipeline

    The pipeline has the usual layers:

    | Dataset | Layer | Built from |
    |---|---|---|
    | `files_inventory` | bronze | `binaryFile` with `recursiveFileLookup`, without `content`: path, file name, size, modification time, kind |
    | `images` | silver | `format("image")` with `dropInvalid`: the 4 decodable PNGs with width, height, channels |
    | `audio` | silver | `binaryFile` of `*.wav` plus a UDF for the duration |
    | `doc_parts` | silver | `binaryFile` of documents plus a UDF that returns an array of parts, exploded |
    | `catalog` | gold | the inventory left-joined to the three silver tables: 27 rows |

    A few design points:

    - **Bronze reads no bytes.** Selecting only metadata columns from
      `binaryFile` means the file contents are never loaded, so the
      inventory stays cheap however large the files are.
    - **Join on `_metadata.file_path`.** `binaryFile`'s `path` column is
      `file:/...` while `image.origin` is `file:///...`, so joining them
      returns nothing (the surprise from "Images and Audio"). Both
      sources expose `_metadata.file_path` in the same form.
    - **One-to-many with a UDF.** A UDF that returns
      `array<struct<part:int, title:string, text:string>>`, followed by
      `explode`, turns one PDF row into one row per page:

    ```python
    PART_TYPE = "array<struct<part:int, title:string, text:string>>"

    @F.udf(PART_TYPE)
    def split_parts(kind, content):
        if kind == "pdf":
            pages = re.findall(rb"BT .*?\((.*?)\) Tj ET", content, re.S)
            return [(n, None, t.decode("latin-1")) for n, t in enumerate(pages, 1)]
        ...

    files.select("path", "kind", F.explode(split_parts("kind", "content")).alias("p")) \
         .select("path", "kind", "p.part", "p.title", "p.text")
    ```

    - **The gold table keeps every file.** Left joins from the
      inventory mean a file that no parser understood still appears,
      with NULLs, instead of disappearing. `corrupt.png` is in the
      catalog with no width; the check counts exactly one such image.

    The `check_*` materialized views at the bottom use `assert_true`, as
    in the Declarative Pipelines course: each aggregates one dataset into
    a single boolean and fails the run, with its message, when the
    boolean is false. They check the inventory counts per kind, that no
    invalid image reached silver, the WAV durations, every PDF page, and
    27 catalog rows from 26 distinct files.

