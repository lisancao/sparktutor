    ## Exercise 1: The Ingestion Source

    The starter has the whole `docs` source except the parts that make
    it an ingestion source. Complete:

    1. The `image` branch of `parse_file`: width and height from the
       PNG header, only when the magic bytes and `IHDR` are there.
    2. The `audio` branch: duration in seconds with `wave`.
    3. The `pdf` branch: one part per page, numbered from 1.
    4. The `email` branch: subject as `title`, plain body as `text`.
    5. `pushFilters`: keep `EqualTo` and `In` on `kind`.
    6. `partitions()`: list only the wanted kinds, round-robin into
       `self.n` partitions. Round robin is fine here because the sample
       files are tiny; for real folders, balance by bytes as in
       "Reading a Custom File Format, in Parallel".

    The harness reads `data/messy` and checks 27 parts from 26 files and
    the per-kind counts, every PNG size (with NULL for `corrupt.png`),
    the WAV durations, the three PDF pages and their text, e-mail
    subjects and bodies, and the Latin-1 file. It then checks that
    `kind IN ('pdf', 'audio')` leaves no `Filter` on `kind` in the plan,
    streams an inbox in two runs (batches of 3 and 1 rows, then 2), and
    writes the catalog as Parquet.
