  Hint: "PNG: struct.unpack('>II', data[16:24]). WAV: with wave.open(io.BytesIO(data)) as w: w.getnframes() / w.getframerate(). PDF: for n, t in enumerate(pages, 1). partitions(): files = [p for p in files if self.kinds is None or kind_of(p) in self.kinds]."

