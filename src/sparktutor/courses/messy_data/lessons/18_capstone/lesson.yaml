    ## A Pipeline Gotcha: drop() on Another Pipeline Table

    The first version of `catalog` dropped a column from `doc_parts`:

    ```python
    parts = spark.read.table("doc_parts").drop("kind")
    ```

    The pipeline failed before running anything, while registering the
    `catalog` flow:

    ```text
    [TABLE_OR_VIEW_NOT_FOUND] The table or view `doc_parts` cannot be found.
    ```

    Pipeline code builds plans that Spark resolves later, once every
    dataset in the graph is known. Most DataFrame methods are lazy on
    Spark Connect, but in 4.2.0 the Connect server turns a `drop()` into
    a plan by analyzing its input immediately, and at registration time
    `doc_parts` does not exist yet. Selecting the columns you want
    instead works:

    ```python
    parts = spark.read.table("doc_parts").select("path", "part", "title", "text")
    ```

    The same code is fine in a `spark-submit` script, where the table
    exists before the line runs. If a pipeline fails at registration
    with `TABLE_OR_VIEW_NOT_FOUND` for a dataset you did define, look for
    a `drop()` on it.

