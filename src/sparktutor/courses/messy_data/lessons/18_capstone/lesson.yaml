    ## Why the Pipeline Cannot Use the Source (on 4.2.0)

    The natural next step is a Declarative Pipeline whose bronze layer is
    `spark.read.format("docs")`. On Spark 4.2.0 that does not work
    cleanly. A pipeline with a Python data source, batch or streaming,
    runs every flow, passes every check, prints `Run is COMPLETED`, and
    then `spark-pipelines` fails and **exits with status 1**:

    ```text
    pyspark.errors.exceptions.base.PySparkValueError: [UNKNOWN_RESPONSE]
    Unknown response: Plan observed(__python_accumulator__=...)
    ```

    `spark-pipelines` talks to Spark through Spark Connect. Python data
    source workers report Python accumulator values with their results,
    and the 4.2.0 client that runs the pipeline command does not expect
    that kind of response, so it raises after the run has finished. This
    is SPARK-59135, fixed in 4.4.0. A control pipeline with a plain
    Python UDF, and one with the `binaryFile` and `image` sources, exit
    with status 0.

    The data is fine, but anything that runs the pipeline and looks at
    the exit code (a scheduler, CI, SparkTutor's grader) sees a failure.
    Until you are on 4.4.0, you have two options:

    - **Split the job.** Run the data source in a `spark-submit` job
      that writes the catalog as Parquet (or a table), and let the
      pipeline read that output with a built-in source. Exercise 1 ends
      by writing exactly that Parquet.
    - **Use built-in sources plus UDFs inside the pipeline.** Read the
      bytes with `binaryFile` and `image`, and parse them with Python
      UDFs, which work in pipelines. That is Exercise 2.

    SparkTutor runs each exercise in its own temporary folder, so
    Exercise 2 cannot read Exercise 1's Parquet; it rebuilds the
    catalog from the files.

