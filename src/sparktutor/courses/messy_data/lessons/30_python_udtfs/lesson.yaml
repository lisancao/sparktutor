    ## What eval May Yield

    The schema is fixed by `returnType` (or `analyze`). What you yield is
    converted to it, and the two execution paths convert differently.
    Measured on 4.2.0:

    | `eval` yields, for the schema shown | Arrow (4.2 default) | Non-Arrow (`useArrow=False`) |
    |---|---|---|
    | `(1, "x")`, `[1, "x"]`, `Row(a=1, b="x")` for `a int, b string` | the row | the row |
    | `{"b": "x", "a": 1}` (a dict, any key order) | the row, matched by name | the row, matched by name |
    | `1` for `a int` (not a tuple) | the row | `UDTF_INVALID_OUTPUT_ROW_TYPE` |
    | `(2.7,)` for `a int` | **2, truncated** | **NULL** |
    | `("5", 7)` for `a int, s string` | `UDTF_ARROW_DATA_CONVERSION_ERROR` | **`a` NULL, `s` `'7'`** |
    | `(1,)` for `a int, b string` | `UDTF_RETURN_SCHEMA_MISMATCH` | `UDTF_RETURN_SCHEMA_MISMATCH` |
    | `None` | one row of NULLs | one row of NULLs |
    | nothing (`return`, or `return None`) | no rows | no rows |
    | `return [(1,), (2,)]` (a list instead of `yield`) | two rows | two rows |
    | `eval` raises `ValueError("bad line: 1")` | `UDTF_EXEC_ERROR` ... `in the 'eval' method: bad line: 1` | same |

    All the runtime errors arrive as `PYTHON_EXCEPTION` from the task
    with the UDTF condition inside, for example:

    ```text
    PySparkRuntimeError: [UDTF_RETURN_SCHEMA_MISMATCH] The number of columns in
    the result does not match the specified schema. Expected column count: 2,
    Actual column count: 1. ...
    ```

    The lesson for messy data: **convert values yourself** and yield
    exactly the declared types. Both paths have a row in the table that
    silently turns a value into something else, and they disagree with
    each other. Two errors happen when you create the UDTF, before any
    query: a class without `eval` (`INVALID_UDTF_NO_EVAL`) and a class
    with neither `returnType` nor `analyze` (`INVALID_UDTF_RETURN_TYPE`).

