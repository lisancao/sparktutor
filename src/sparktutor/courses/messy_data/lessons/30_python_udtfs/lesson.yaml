    ## analyze(): Choosing the Schema From the Arguments

    Instead of a fixed `returnType`, a UDTF can have a static method
    `analyze` (4.0). Spark calls it **during analysis, on the driver**, in
    a Python worker, with one `AnalyzeArgument` per argument, and uses
    the returned `AnalyzeResult` as the output schema. For a call like
    `pick(line, 'action,user')` in a lateral join, the arguments were:

    ```text
    AnalyzeArgument(dataType=StringType(), value=None, isTable=False, isConstantExpression=False)
    AnalyzeArgument(dataType=StringType(), value='action,user', isTable=False, isConstantExpression=True)
    ```

    A column has no value at analysis time; a literal does. So a constant
    argument can steer the schema:

    ```python
    @dataclass
    class KeysResult(AnalyzeResult):
        keys: tuple = ()

    @udtf
    class Pick:
        @staticmethod
        def analyze(line: AnalyzeArgument, keys: AnalyzeArgument):
            if not keys.isConstantExpression or not isinstance(keys.value, str):
                raise ValueError("keys must be a constant string such as 'user,action'")
            names = tuple(k.strip() for k in keys.value.split(","))
            schema = StructType()
            for n in names:
                schema = schema.add(n, StringType())
            return KeysResult(schema=schema, keys=names)

        def __init__(self, analyze_result=None):
            self.keys = analyze_result.keys

        def eval(self, line, keys):
            pairs = dict(p.split("=", 1) for p in (line or "").split() if "=" in p)
            yield tuple(pairs.get(k) for k in self.keys)
    ```

    ```text
    SELECT p.* FROM lines, LATERAL pick(line, 'action,user') p
    +------+----+
    |action|user|
    +------+----+
    | login|  u1|
    |  NULL|  u2|
    +------+----+
    ```

    Three things to take from it:

    - **Subclass `AnalyzeResult`** (a dataclass, deliberately not frozen)
      to carry what `analyze` worked out (here, the parsed keys) to the
      executors. Spark pickles the result and passes it to
      `__init__(self, analyze_result)`, so `eval` need not parse the
      spec again for every row.
    - **Errors in `analyze` fail the query at analysis**, before any job
      runs, as `[TABLE_VALUED_FUNCTION_FAILED_TO_ANALYZE_IN_PYTHON]
      Failed to analyze the Python user defined table function:
      Traceback ... ValueError: keys must be a constant string ...`.
      Validate arguments there.
    - **Build the schema from type objects** (`StringType()`,
      `IntegerType()`). `StructType().add("ms", "int")` fails, in
      `analyze` or anywhere else in PySpark, with `[CANNOT_PARSE_DATATYPE]
      Unable to parse datatype. int.`, because `add` with a string expects
      the JSON type name (`"integer"`, `"long"`, `"string"`), not the
      DDL name.

