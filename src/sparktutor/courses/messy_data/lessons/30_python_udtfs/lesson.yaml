    ## Where a UDTF Fits

    | Tool | Rows in | Rows out | Typical use |
    |---|---|---|---|
    | built-in function | 1 | 1 | anything Spark already does |
    | `explode`, `inline`, `posexplode` | 1 | 0 to n | arrays and maps you already have |
    | Python UDF (`udf`, `pandas_udf`) | 1 | 1 | a value Spark cannot compute |
    | **Python UDTF**, scalar arguments | 1 | 0 to n | parse one value into many rows |
    | **Python UDTF**, `TABLE` argument | a partition of a table | 0 to n | stateful work per group, in order |
    | `applyInPandas` | a group, as a pandas DataFrame | 0 to n | per-group work that fits in memory |
    | `mapInPandas`, `mapInArrow` | a partition, in batches | 0 to n | batch work, model scoring |

    A UDTF is called like a table (`SELECT * FROM f(...)`), works in SQL
    as well as Python, streams rows one at a time instead of holding a
    whole group in memory like `applyInPandas`, and can choose its output
    schema from its arguments. Python UDTFs arrived in Spark 3.5
    (SPARK-43798); `analyze()` and `PARTITION BY` / `ORDER BY` on table
    arguments in 4.0 (SPARK-44380, SPARK-44503); in 4.2 they are
    Arrow-optimized by default (SPARK-54555).

