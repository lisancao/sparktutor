    ## Determinism, the Optimizer and Performance

    - **UDTFs are non-deterministic by default** (the `udtf` docstring
      says so). Mark a pure function with `.asDeterministic()` so the
      optimizer may treat it like any other expression.
    - **UDTFs are opaque to the optimizer.** A `WHERE` after the UDTF is
      evaluated on its output, and the input of a `TABLE` argument is read
      in full unless you filter it inside `TABLE(SELECT ... WHERE ...)`.
      Filter before the UDTF, not after.
    - **Where the time goes.** Each row crosses from the JVM to Python
      and back; with the Arrow path it travels in batches. `PARTITION BY`
      adds a shuffle and a sort. One very large key means one very busy
      instance: count rows per key before you trust a `PARTITION BY`.
    - **Where analysis runs.** `analyze` runs in a Python worker on the
      driver (or on the Spark Connect server), once per query analysis.
      Keep it fast and free of network calls.

