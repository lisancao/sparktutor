    ## TABLE Arguments: a Function Over a Table

    A UDTF can take a whole table (or query) as an argument. Each `eval`
    call then receives one `Row` of that table, and the clauses after
    `TABLE(...)` decide how the rows are grouped and ordered:

    ```python
    @udtf(returnType="k string, n_rows int, first_v int, instance string, pid int")
    class Lifecycle:
        def __init__(self):
            self.id = uuid.uuid4().hex[:6]
            self.k, self.n, self.first = None, 0, None
        def eval(self, row):
            if self.k is None:
                self.k, self.first = row["k"], row["v"]
            self.n += 1
        def terminate(self):
            yield self.k, self.n, self.first, self.id, os.getpid()

    spark.udtf.register("lifecycle", Lifecycle)
    data = spark.createDataFrame([("a", 3), ("b", 1), ("a", 1), ("c", 5), ("b", 2), ("a", 2)],
                                 "k string, v int")
    data.createOrReplaceTempView("data")
    spark.sql("SELECT * FROM lifecycle(TABLE(data) PARTITION BY k ORDER BY v)").show()
    ```

    ```text
    +---+------+-------+--------+-------+
    |  k|n_rows|first_v|instance|    pid|
    +---+------+-------+--------+-------+
    |  a|     3|      1|  37ff25|3475345|
    |  b|     2|      1|  c7c0ea|3475345|
    |  c|     1|      5|  266679|3475345|
    +---+------+-------+--------+-------+
    ```

    Every key got its **own instance** (three ids, one Python process),
    and each saw its rows in `v` order (`first_v` is the smallest). That
    is what makes per-group state safe. The other forms:

    - `TABLE(data)` with no clause: one instance per input partition,
      with whatever rows it happens to hold. Here it gave two rows,
      `(a, 3, 3)` and `(c, 3, 5)`: the partitions of `createDataFrame`.
    - `TABLE(data) WITH SINGLE PARTITION`: one instance sees everything
      (`(a, 6, 3)`). Fine for small inputs, a bottleneck for large ones.
    - `TABLE(SELECT ... FROM ... WHERE ...)`: any query can be the
      argument.

    In the DataFrame API (4.0), `DataFrame.asTable()` returns a table
    argument with `partitionBy`, `orderBy` and `withSinglePartition`:

    ```python
    Lifecycle(data.asTable().partitionBy("k").orderBy("v")).show()
    ```

    The plan shows the price of `PARTITION BY`: a shuffle by the key and
    a sort, before the UDTF runs.

    ```text
    +- ArrowEvalPythonUDTF lifecycle(c#112)#105, [k#106, n_rows#107, ...], 301
       +- Project [named_struct(k, k#0, v, v#1, partition_by_0, partition_by_0#111) AS c#112]
          +- Sort [partition_by_0#111 ASC NULLS FIRST, v#1 ASC NULLS FIRST], false, 0
             +- Exchange hashpartitioning(partition_by_0#111, 3), REPARTITION_BY_COL, [plan_id=236]
    ```

    A `Row` lets you read fields by name (`row["k"]`). The helper column
    `partition_by_0` in the plan is not visible to `eval`: the row's
    fields were just `k` and `v`.

