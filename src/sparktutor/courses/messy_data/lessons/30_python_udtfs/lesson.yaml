    ## Letting the Function Choose Its Partitioning

    `AnalyzeResult` can also require how a `TABLE` argument is grouped
    and ordered, so callers cannot forget:

    ```python
    @udtf
    class PerKey:
        @staticmethod
        def analyze(t):
            return AnalyzeResult(
                schema=StructType().add("k", StringType()).add("total", LongType()),
                partitionBy=[PartitioningColumn("k")],
                orderBy=[OrderingColumn("v")])
        ...
    spark.sql("SELECT * FROM per_key(TABLE(data))").show()   # a 6, b 3, c 5
    ```

    The caller then must not add a clause of their own:

    ```text
    [TABLE_VALUED_FUNCTION_REQUIRED_METADATA_INCOMPATIBLE_WITH_CALL] Failed to
    evaluate the table function per_key because its table metadata specified its
    own required partitioning of the input table, but the function call specified
    the WITH SINGLE PARTITION or PARTITION BY clause; ...
    ```

    The other fields: `withSinglePartition=True` (exclusive with
    `partitionBy`), and `select=[SelectedColumn("k"),
    SelectedColumn("v * 2", alias="dv")]`, which makes `eval` receive
    only those expressions (an alias is required for anything that is not
    a plain column). With that `select`, `eval` read `row["k"]` and
    `row["dv"]`, and the query returned `[Row(k='a', doubled=6), Row(k='b',
    doubled=2)]`.

