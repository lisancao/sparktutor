    ## Summary

    - A UDTF instance runs `__init__`, `eval` per row, `terminate`, then
      `cleanup` (which also runs after a failure; `terminate` does not).
    - Call `udtf(...)` after the session exists: the Arrow decision (4.2
      default, SPARK-54555) is made at creation time, and a UDTF created
      before a Connect session cannot run on it.
    - Yield exactly the declared types: Arrow and non-Arrow paths coerce
      wrong values differently and silently.
    - Scalar arguments: one instance per task, rows from `terminate`
      attach to the last input row and crash on an empty partition. Use
      `TABLE` arguments for state.
    - In 4.2.0 `LEFT JOIN LATERAL` without a condition and
      `lateralJoin(..., how="left")` drop rows (SPARK-60564). Prefer a
      UDTF that always yields a row; `ON true` works but decorrelates
      into a join over distinct inputs.
    - `TABLE(t) PARTITION BY k ORDER BY c` gives one instance per key, in
      order, after a shuffle and sort; `asTable().partitionBy().orderBy()`
      is the DataFrame form. Use named arguments after `ORDER BY`.
    - `analyze` (4.0) runs on the driver, sees constants but not column
      values, can return a subclassed `AnalyzeResult` that reaches
      `__init__`, and can require partitioning, ordering and selected
      columns.
    - `arrow_udtf` (4.1) works on Arrow batches and cannot be used in a
      lateral join.

