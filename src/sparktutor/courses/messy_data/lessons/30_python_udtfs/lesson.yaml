    ## The Lifecycle, Observed

    A UDTF is a class. Spark creates instances of it on the executors
    and calls, in order:

    1. `__init__(self)` (or `__init__(self, analyze_result)`, below)
    2. `eval(self, *args)` once per input row; it may `yield` any number
       of rows
    3. `terminate(self)` once, after the last row; it may `yield` too
    4. `cleanup(self)` once at the very end, also after a failure

    To see it, this UDTF writes every call to a file, together with the
    task's partition id:

    ```python
    @udtf(returnType="tag string, total int")
    class Trace:
        def __init__(self):
            self.id = uuid.uuid4().hex[:4]
            self.t = 0
            self.log("init", TaskContext.get().partitionId())
        def eval(self, tag, v):
            self.log("eval", tag, v)
            self.t += v
            yield tag, v
        def terminate(self):
            self.log("terminate", self.t)
            yield "end", self.t
        def cleanup(self):
            self.log("cleanup")
    ```

    Over three rows in one partition, in a lateral join
    (`SELECT d.tag AS input, t.* FROM d, LATERAL trace(tag, v) t`):

    ```text
    a130 init 0
    a130 eval x 1
    a130 eval y 2
    a130 eval z 3
    a130 terminate 6
    a130 cleanup
    ```

    ```text
    [Row(input='x', tag='x', total=1), Row(input='y', tag='y', total=2),
     Row(input='z', tag='z', total=3), Row(input='z', tag='end', total=6)]
    ```

    One instance served the whole partition, so `self.t` carried over
    from row to row. With scalar arguments that is a side effect of how
    tasks are cut, not something to rely on: another partitioning gives
    other totals. The row from `terminate()` is attached to the **last**
    input row (`input='z'`), which is rarely what you want. State across
    rows is meant for `TABLE` arguments.

    When `eval` raises, `cleanup()` still runs and `terminate()` does
    not. In a test where the second of two runs failed, the log files
    held `terminate: 't'` (from the good run only) and `cleanup: 'cc'`
    (both runs). Put closing of files and connections in `cleanup`.

