    ## The Left Lateral Join Trap (SPARK-60564)

    To keep rows that produce nothing, you ask for a left join. In 4.2.0
    the obvious forms return the inner join's result:

    ```python
    df.lateralJoin(Words(sf.col("text").outer()), how="left").collect()
    spark.sql("SELECT id, w.* FROM t LEFT JOIN LATERAL words(text) w").collect()
    ```

    ```text
    [Row(id=1, text='a b', word='a', n=0), Row(id=1, text='a b', word='b', n=1),
     Row(id=4, text='c', word='c', n=0)]
    [Row(id=1, word='a', n=0), Row(id=1, word='b', n=1), Row(id=4, word='c', n=0)]
    ```

    Rows 2 and 3 are gone, without an error. Re-verified on 4.2.0 for
    this lesson; it is SPARK-60564 (open, affects 3.5 to 4.2), and it is
    not specific to Python: `LEFT JOIN LATERAL (SELECT explode(...))`
    behaves the same. The analyzed plan is right (`LateralJoin ...,
    LeftOuter`); the optimizer rule `OptimizeOneRowRelationSubquery`
    (`sql/catalyst/src/main/scala/org/apache/spark/sql/catalyst/optimizer/subquery.scala`)
    then matches `LateralJoin(left, LateralSubquery(OneRowSubquery(plan)),
    _, None)`, ignores the join type, and turns the generator into an
    inner one. The `None` in that pattern is the join condition, which is
    why adding one avoids the rule.

    **Workaround 1: an explicit condition.** `ON true` in SQL, or
    `on=sf.lit(True)` in `lateralJoin`:

    ```python
    df.lateralJoin(Words(sf.col("text").outer()), on=sf.lit(True), how="left").collect()
    ```

    ```text
    [Row(id=1, text='a b', word='b', n=1), Row(id=1, text='a b', word='a', n=0),
     Row(id=2, text='', word=None, n=None), Row(id=3, text=None, word=None, n=None),
     Row(id=4, text='c', word='c', n=0)]
    ```

    Correct, but look at what it costs:

    ```text
    SortMergeJoin [coalesce(text#1, ), isnull(text#1)], [coalesce(text#13, ), isnull(text#13)], LeftOuter
    :- Sort ... +- Exchange hashpartitioning(coalesce(text#1, ), isnull(text#1), 200)
    :     +- Scan ExistingRDD[id#0,text#1]
    +- Sort ... +- Exchange hashpartitioning(...)
          +- ArrowEvalPythonUDTF Words(text#13)#9, [text#13], [word#11, n#12], 301
             +- HashAggregate(keys=[text#1], functions=[])
                +- Exchange hashpartitioning(text#1, 200)
    ```

    Spark decorrelates the subquery: it computes the UDTF once per
    **distinct** input value and joins the results back, with three
    shuffles. A marker file per `eval` call counted 4 calls for 5 input
    rows, because two rows had the same text. For a UDTF with side
    effects or randomness that changes behaviour, not only speed.

    **Workaround 2 (better): a UDTF that never yields nothing.** If every
    input must appear in the output, make the function say so:

    ```python
    @udtf(returnType="word string, n int")
    class WordsOrNull:
        def eval(self, text):
            words = (text or "").split()
            if not words:
                yield None, None
                return
            for i, w in enumerate(words):
                yield w, i
    ```

    An inner lateral join then keeps every row, and the plan is one
    `ArrowEvalPythonUDTF` node again. The exercise's `kv_extract` works
    this way: a blank line gives one row with `_error = 'blank'`.

