    ## Create UDTFs After the Session Exists

    `udtf(cls, returnType=...)` (or `@udtf(...)` on the class) decides
    **when it is called** whether the function runs Arrow-optimized. It
    reads `spark.sql.execution.pythonUDTF.arrow.enabled` (default `true`
    in 4.2) from the active session, and if there is no session yet it
    falls back to the old, non-Arrow path. The same class, decorated
    before and after `getOrCreate()`:

    ```python
    @udtf(returnType="a int")
    class Early:
        def eval(self, x): yield (2.7,)

    spark = SparkSession.builder.master("local[2]").getOrCreate()

    @udtf(returnType="a int")
    class Late:
        def eval(self, x): yield (2.7,)

    Early(sf.lit(1)).explain(); Late(sf.lit(1)).explain()
    print(Early(sf.lit(1)).collect(), Late(sf.lit(1)).collect())
    ```

    ```text
    == Physical Plan ==
    BatchEvalPythonUDTF Early(1)#0, [a#1]
    +- *(1) Scan OneRowRelation[]

    == Physical Plan ==
    ArrowEvalPythonUDTF Late(1)#2, [a#3], 301
    +- *(1) Scan OneRowRelation[]

    [Row(a=None)] [Row(a=2)]
    ```

    Two different execution paths, and two different answers for the
    same code (more on that in the next section). On Spark Connect it is
    worse: a UDTF created before a Connect session exists is a classic
    one, and calling it fails:

    ```text
    [JVM_ATTRIBUTE_NOT_SUPPORTED] Attribute `sparkContext` is not supported in
    Spark Connect as it depends on the JVM. ...
    ```

    The rule from "Documents to Rows" for
    UDFs holds for UDTFs: define the class anywhere, but call `udtf(...)`
    after the session exists. The exercise does it in a `make_udtfs()`
    function. To force a path, pass `useArrow=True` or `useArrow=False`.

    The number at the end of `ArrowEvalPythonUDTF ... 301` is the Python
    evaluation type (`PythonEvalType` in `pyspark/util.py`): 300 is a
    plain UDTF, 301 an Arrow-optimized one, 302 an `arrow_udtf`.

