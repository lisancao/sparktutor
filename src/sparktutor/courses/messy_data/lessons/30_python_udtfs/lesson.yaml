    ## Stopping Early

    To stop reading a partition (you found what you needed), raise
    `SkipRestOfInputTableException` from `eval`. Spark stops sending rows
    to that instance and calls `terminate()`:

    ```python
    from pyspark.sql.udtf import SkipRestOfInputTableException

    @udtf(returnType="k string, v int")
    class FirstTwo:
        def __init__(self): self.n = 0
        def eval(self, row):
            self.n += 1
            if self.n > 2:
                raise SkipRestOfInputTableException("done")
            yield row["k"], row["v"]
    ```

    Over five `a` rows and three `b` rows with `PARTITION BY k ORDER BY
    v` it returned `a 0, a 1, b 0, b 1`. Note that Spark still shuffles
    and sorts the whole input; only the Python work stops.

