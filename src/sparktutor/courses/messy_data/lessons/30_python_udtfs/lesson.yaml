    ## What You'll Learn

    "Documents to Rows" used a Python user-defined table function (UDTF)
    to turn one PDF into one row per page, joined it back to the files
    with `lateralJoin`, and warned about a left join that drops files.
    That was a UDTF in its simplest form: a function of one row that
    yields rows.

    UDTFs can do much more, and messy data needs most of it:

    - read a **whole table** (or each group of it, in order) and keep
      state between rows: sessions, deduplication, gap filling
    - decide their **output columns at analysis time** from their
      arguments, so one function can extract whatever fields a query asks
      for
    - report problems as data instead of failing the job

    By the end of this lesson you will be able to:

    - Explain the lifecycle (`__init__`, `eval`, `terminate`, `cleanup`)
      and how many instances Spark creates, with evidence
    - Create UDTFs at the right moment so they run Arrow-optimized, and
      predict what each kind of yielded value turns into
    - Call UDTFs with scalar arguments in lateral joins, and with `TABLE`
      arguments with `PARTITION BY`, `ORDER BY` and `WITH SINGLE
      PARTITION`, from SQL and from the DataFrame API
    - Write `analyze()` for dynamic schemas, pass state from it to the
      executors, and let a function require its own partitioning
    - Avoid the 4.2.0 traps: the left lateral join that drops rows
      (SPARK-60564), `terminate()` in a lateral join, and a parser
      ambiguity in `TABLE` arguments
    - Know when `arrow_udtf` (4.1) is the better tool

    The exercise parses a service's `key=value` logs
    (`data/messy/service_logs/kv.log`) into typed columns with a
    function whose columns come from its arguments, and then turns the
    events into user sessions with a function over a partitioned, ordered
    table.

