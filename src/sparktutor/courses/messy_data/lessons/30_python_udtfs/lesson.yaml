    ## terminate() in a Lateral Join: Two More Surprises

    You saw that rows from `terminate()` attach to the last input row of
    the partition. When a partition has **no** input rows, there is no
    row to attach them to, and the task fails in the JVM:

    ```python
    @udtf(returnType="total int")
    class Total:
        def __init__(self): self.t = 0
        def eval(self, v): self.t += v
        def terminate(self): yield (self.t,)

    df = spark.range(0, 3, 1, 4)          # 4 partitions, one of them empty
    df.lateralJoin(Total(sf.col("id").cast("int").outer())).collect()
    ```

    ```text
    java.lang.NullPointerException: Cannot invoke
    "org.apache.spark.sql.catalyst.InternalRow.numFields()" because "this.row1" is null
    ```

    It happens with and without Arrow, in classic and Spark Connect
    sessions (4.2.0). The cause is in `EvalPythonUDTFExec`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/python/EvalPythonUDTFExec.scala`):
    output rows after the last input row are joined with "the last
    element of its child output", which an empty partition never set. A
    JIRA search found no report of it. The rule that avoids both
    surprises: with scalar arguments, yield only from `eval`; use
    `terminate()` with `TABLE` arguments, where each partition's rows
    belong to the function and no join is involved.

