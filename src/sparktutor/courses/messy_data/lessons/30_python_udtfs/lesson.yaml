    ## Scalar Arguments and Lateral Joins

    With scalar arguments, a UDTF is usually joined to the rows it was
    computed from. In the DataFrame API (4.0), mark the columns that come
    from the outer DataFrame with `.outer()`; in SQL, use `LATERAL`
    after a comma or a `JOIN`:

    ```python
    @udtf(returnType="word string, n int")
    class Words:
        def eval(self, text):
            if text is None:
                return
            for i, w in enumerate(text.split()):
                yield w, i

    df = spark.createDataFrame([(1, "a b"), (2, ""), (3, None), (4, "c")],
                               "id int, text string")
    df.lateralJoin(Words(sf.col("text").outer())).collect()

    spark.udtf.register("words", Words)
    df.createOrReplaceTempView("t")
    spark.sql("SELECT id, w.* FROM t, LATERAL words(text) w").collect()
    ```

    ```text
    [Row(id=1, text='a b', word='a', n=0), Row(id=1, text='a b', word='b', n=1),
     Row(id=4, text='c', word='c', n=0)]
    [Row(id=1, word='a', n=0), Row(id=1, word='b', n=1), Row(id=4, word='c', n=0)]
    ```

    The plan is a single node over the input, no join at all:

    ```text
    ArrowEvalPythonUDTF words(text#1)#39, [id#0], [word#40, n#41], 301
    +- *(1) Scan ExistingRDD[id#0,text#1]
    ```

    Rows 2 and 3 produced nothing, so an inner lateral join drops them.
    Arguments can also be passed by name, in SQL and Python, and Python
    defaults work:

    ```python
    @udtf(returnType="a string, b string")
    class Named:
        def eval(self, a, b="dflt"):
            yield a, b
    spark.udtf.register("named", Named)
    spark.sql("SELECT * FROM named(b => 'x', a => 'y')").collect()   # [Row(a='y', b='x')]
    spark.sql("SELECT * FROM named('only')").collect()               # [Row(a='only', b='dflt')]
    Named(b=sf.lit("x"), a=sf.lit("y")).collect()                    # [Row(a='y', b='x')]
    ```

