    ## arrow_udtf (4.1): Batches Instead of Rows

    `arrow_udtf` (4.1) is a different kind of table function. `eval`
    receives a `pyarrow.RecordBatch` (for a `TABLE` argument) or
    `pyarrow.Array`s (for scalar arguments) and yields Arrow tables or
    batches, so the work can be vectorized:

    ```python
    import pyarrow as pa, pyarrow.compute as pc
    from pyspark.sql.functions import arrow_udtf

    @arrow_udtf(returnType="k string, v2 int")
    class ArrowDouble:
        def eval(self, batch: pa.RecordBatch):
            yield pa.table({"k": batch.column("k"), "v2": pc.multiply(batch.column("v"), 2)})

    ArrowDouble(data.asTable()).collect()   # [Row(k='a', v2=6), Row(k='b', v2=2)]
    ```

    It appears in the plan with evaluation type 302. It cannot sit on the
    right side of a lateral join:

    ```text
    [LATERAL_JOIN_WITH_ARROW_UDTF_UNSUPPORTED] LATERAL JOIN with Arrow-optimized
    user-defined table functions (UDTFs) is not supported. Arrow UDTFs cannot be
    used on the right-hand side of a lateral join.
    ```

    Reach for it when the per-row Python work is the bottleneck and the
    logic can be written with `pyarrow.compute`; keep the row-based UDTF
    for parsing and stateful logic, which is most of messy data.

