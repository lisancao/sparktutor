    Picture a clerk at a counter. A UDF is a clerk who takes one form and
    hands back one stamped form. A UDTF clerk may hand back several forms
    or none, and can keep notes between customers. With a `TABLE`
    argument and `PARTITION BY user`, every user gets their own clerk
    with a fresh notepad, and `ORDER BY ts` lines that user's forms up in
    time order. When the queue for one clerk is empty, the clerk can hand
    over a summary (`terminate`) before going home (`cleanup`).

