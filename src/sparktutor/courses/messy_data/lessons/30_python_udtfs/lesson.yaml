    ## A Parser Trap With Extra Arguments

    Scalar arguments can follow a `TABLE` argument. Written the natural
    way, the parser reads the comma as part of `ORDER BY`:

    ```sql
    SELECT * FROM sessionize(TABLE(events) PARTITION BY user ORDER BY ts, 30)
    ```

    ```text
    [_LEGACY_ERROR_TEMP_0064] The table function call includes a table argument
    with an invalid partitioning/ordering specification: the ORDER BY clause
    included multiple expressions without parentheses surrounding them; please
    add parentheses around these expressions and then retry the query again.
    ```

    The same happens after `PARTITION BY user, 30`, and with `ORDER BY ts
    DESC, 30`. Any of these work:

    ```sql
    SELECT * FROM sessionize(TABLE(events) PARTITION BY user ORDER BY (ts), 30)
    SELECT * FROM sessionize(TABLE(events) PARTITION BY user ORDER BY ts, gap_minutes => 30)
    SELECT * FROM sessionize(TABLE(events) PARTITION BY user ORDER BY (ts, k), 30)
    ```

    Named arguments (`gap_minutes => 30`, the name of the `eval`
    parameter) read best. `PARTITION BY` on a scalar argument is a plain
    `PARSE_SYNTAX_ERROR`.

