    ## Summary

    - Entities are the connected components of the match graph: the
      transitive closure of the pairs. Clean the edges first (NULLs,
      self-loops, both directions, repeats) and bring isolated records
      back from the vertex table.
    - Label propagation needs about as many rounds as the diameter (100
      for a path of 100). Large-star / small-star needs about `log2 n`
      on paths (11 for 2,000 nodes, 15 for 20,000).
    - Large-star links larger neighbours to `m(u)`; small-star collapses
      smaller neighbours onto their minimum. The fixed point is stars
      around each component's minimum, recognised locally: every `src`
      has one `dst`, and no node is on both sides.
    - A step that reads its input `k` times multiplies the plan by `k`
      every round (12 for the join form: 1,728 leaves after three
      rounds, then an `OutOfMemoryError`). Write steps that read their
      input once: a window instead of `groupBy` plus join, an `explode`
      instead of `union`. Check with `collectLeaves().length()`.
    - `cache()` does not cut lineage, and cached plans print their
      history: under AQE each round doubles the plan string, and every
      action renders it for the SQL UI event
      (`SQLExecution.withNewExecutionId0`). `spark.sql.maxPlanStringLength`
      only hides it.
    - `checkpoint()` (reliable, needs a directory) and
      `localCheckpoint()` (fast, lost with an executor) replace the plan
      with a `LogicalRDD`. Materialize the new round before unpersisting
      the old one.
    - Giant components put a component's every edge in one window
      partition; watch degrees, and fix the matches that build them.
    - Test against a union-find on graphs designed to break the code.
    - Transitivity turns a few bad pairs into one big wrong entity; the
      precision of the edges decides the quality of the clusters.

    Next: **Sketches: HLL, Theta and KLL from the Inside**, another kind
    of distributed algorithm: summaries small enough to store, that
    merge without going back to the raw data.
