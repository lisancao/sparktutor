    ## Testing Against a Union-Find

    A distributed graph algorithm needs a reference answer on the
    driver. A union-find (disjoint set forest) computes connected
    components in nearly linear time in plain Python, and with "the
    smaller root wins" it produces the same labels:

    ```python
    def union_find(nodes, edges):
        parent = {n: n for n in nodes}
        def find(x):
            while parent[x] != x:
                parent[x] = parent[parent[x]]      # path halving
                x = parent[x]
            return x
        for a, b in edges:
            if a is None or b is None:
                continue
            ra, rb = find(a), find(b)
            if ra != rb:
                parent[max(ra, rb)] = min(ra, rb)
        return {n: find(n) for n in nodes}
    ```

    Then choose graphs that break implementations, not random ones only:

    | Graph | What it catches |
    |---|---|
    | a path with ids in order | too many rounds; a round bound of `2 log2 n` |
    | a path with shuffled ids | logic that assumes ids follow structure |
    | a star whose hub has the **largest** id | small-star mistakes |
    | isolated vertices | forgetting the vertex table |
    | reversed and repeated edges, self-loops, NULLs | missing cleanup |
    | a random sparse graph | many small components at once |

    The exercise runs all of them as one graph in separate id ranges:
    14,243 vertices, 14,232 raw edges, 816 components, 12 rounds.

    Ids do not have to be numbers: `min`, `least` and `<` work on
    strings, so `"L0007"` labels its component as well as `7` would
    (the exercise clusters listings by their string ids). If you map
    strings to longs to save space, do it with a dense numbering, not
    `xxhash64`: two records whose hashes collide would become one node,
    merging two entities with no edge between them.

