    ## Exercise: Large-Star / Small-Star

    Complete:

    1. `clean_edges(raw)`: no NULL ends, no self-loops, `src < dst`,
       distinct.
    2. `large_star(edges)` and `small_star(edges)`, each reading its
       input **once** (window plus explode, no union, no self-join).
    3. `is_converged(edges)`: the local test.
    4. `connected_components(vertices, raw_edges, checkpoint_every,
       max_rounds, on_round)`: the loop, checkpointing every
       `checkpoint_every` rounds, caching and unpersisting in between,
       calling `on_round(edges)` after every round, and returning
       `(labels, rounds)` with a label for every vertex.

    The checks: the small examples above, exactly one leaf in each star
    operation's analyzed plan, both non-converged cases of the local
    test, labels equal to a union-find on a graph combining a path of
    4,096 nodes in order and shuffled, a star with the largest id as
    hub, a random sparse graph, isolated vertices, reversed and repeated
    edges, self-loops and NULLs; at most `2 log2 4096 = 24` rounds; an
    optimized plan of at most 200 lines after every round (checked as
    the rounds run, before the driver runs out of memory); and the
    listing clusters equal to union-find.
