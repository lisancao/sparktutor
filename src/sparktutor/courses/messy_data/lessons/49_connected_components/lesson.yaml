    ## Rounds in Practice

    With the join form, on graphs built to be awkward (`local[4]`,
    checkpointing every two rounds, each result compared with a
    union-find):

    ```text
    chain sorted: n=2000 rounds=11 ok=True 7.8s
    chain random ids: n=2000 rounds=9 ok=True 3.5s
    chain reversed: n=2000 rounds=11 ok=True 3.8s
    star: n=5000 rounds=1 ok=True 0.5s
    star hub max: n=5001 rounds=1 ok=True 0.5s
    random: n=2399 rounds=5 ok=True 1.9s
    chain sorted 20000: n=20000 rounds=15 ok=True 6.9s
    ```

    About `log2 n` for paths (`log2 2000 ≈ 11`, `log2 20000 ≈ 14.3`),
    slightly fewer when ids are random along the path, one round for a
    star whatever the hub's id, five for a random sparse graph with many
    small components. The window form needs the same rounds (it
    computes the same edges). Ten times the nodes cost four more
    rounds; label propagation would have needed ten times the rounds.

    Rounds count the whole graph: they are the maximum over components.
    That is why the exercise can run every test graph at once, as a
    disjoint union in separate id ranges, and check each part.

