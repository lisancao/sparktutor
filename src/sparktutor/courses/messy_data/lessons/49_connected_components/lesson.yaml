    ## Skew: Giant Components and Hubs

    Near convergence, every node of a component points to its minimum,
    so the minimum has an edge to every node of the component. In the
    next large-star, all of those edges share one `u` and go to one
    window partition. On a converged component of 200,000 nodes plus
    50,000 small pairs, rows per shuffle partition when partitioned by
    `u`:

    ```text
    rows per partition when partitioned by u: [37595, 37615, 37638, 37619, 37542, 237300, 37281, 37410]
    top degrees [(0, 200000), (2, 1), (12, 1)]
    ```

    One task gets six times the rows of the others. The `Window`
    operator also buffers all rows of one key: beyond
    `spark.sql.windowExec.buffer.in.memory.threshold` (an internal
    setting, 4,096 rows) it moves them to a buffer that can spill to
    disk. A million-node component means a million-row window group in
    one task, every round until the end.

    How to see it coming:

    - **Degree distribution** each round:
      `edges.groupBy("dst").count().orderBy(F.desc("count")).limit(10)`.
      A component's size is visible as the degree of its minimum.
    - **Component sizes** after a first run on a sample. In entity
      resolution a component of thousands of "people" is never real; it
      is a bridge of bad matches (see the listings below).

    What to do about it:

    - Fix the matches. Giant components in entity resolution are
      almost always a data problem: a placeholder phone number, a shared
      office e-mail, a template text. Drop edges built on values that
      occur too often, before the graph.
    - Use the `groupBy` + join form for rounds with known hubs. A
      `min` aggregation is pre-aggregated on the map side, so the hub's
      200,000 rows become one partial row per task before the shuffle;
      the join then streams the hub's edges past one row. It reads its
      input more than once, so checkpoint it every round.
    - Adaptive skew-join splitting (`spark.sql.adaptive.skewJoin.enabled`)
      applies only to sort-merge and shuffled hash joins whose skewed
      partition is over `skewedPartitionFactor` (5) times the median
      **and** `skewedPartitionThresholdInBytes` (256MB). On this plan it
      did not split the hub's partition even with both lowered to small
      values, so do not count on it; check the final plan
      (`explain()` after the action) for `skew=true` before you do.
    - GraphFrames (below) has a `broadcastThreshold` for exactly this
      case.

