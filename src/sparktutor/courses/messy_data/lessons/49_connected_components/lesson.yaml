    ## From Matches to Entities

    "Deduplication and Entity Resolution" made the case: entities are
    the **connected components** of the match graph (its transitive
    closure), labelled here by their smallest node id. What changes at
    scale is the shape of the input. Match output is messy in its own
    way:

    - the same pair in both directions, `(a, b)` and `(b, a)`
    - the same pair several times (several blocking passes or rules)
    - self-pairs `(a, a)` from a self-join that forgot `a < b`
    - NULL ends from a failed lookup
    - records with no match at all, which are still entities

    So the first step is always the same cleanup: drop NULLs and
    self-loops, orient each edge as `(least, greatest)`, deduplicate.
    Records with no edges come back at the end from the vertex table.

    ```python
    def clean_edges(raw):
        return (raw.filter(F.col("src").isNotNull() & F.col("dst").isNotNull()
                           & (F.col("src") != F.col("dst")))
                .select(F.least("src", "dst").alias("src"), F.greatest("src", "dst").alias("dst"))
                .distinct())
    ```

