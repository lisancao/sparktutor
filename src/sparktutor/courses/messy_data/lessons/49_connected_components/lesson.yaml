    ## Lineage II: Cached Plans That Remember

    With one leaf per round the analyzed plan grows by about 20 lines a
    round, which is harmless. The window form with `cache()` every round
    still died, in round 13, and the time of each `count()` doubled on
    the way:

    ```text
    round      9      10     11     12
    count()    0.43s  0.77s  1.25s  2.36s     (round 13: OutOfMemoryError: Java heap space)
    ```

    The culprit is in the **optimized** plan. When a cached DataFrame
    appears in a later plan, the `CacheManager` substitutes an
    `InMemoryRelation`, and an `InMemoryRelation` prints the physical
    plan it was cached from. Under adaptive execution that plan is an
    `AdaptiveSparkPlan isFinalPlan=true`, which prints both its final
    and its initial plan, and each of them contains the previous
    round's `InMemoryRelation`, which prints its own history twice.
    Lines of the optimized plan and `InMemoryTableScan` nodes in the
    executed plan, per round:

    ```text
    1 executed plan lines 68 InMemoryTableScan 1 optimized lines 66
    2 executed plan lines 189 InMemoryTableScan 3 optimized lines 187
    3 executed plan lines 431 InMemoryTableScan 7 optimized lines 429
    4 executed plan lines 915 InMemoryTableScan 15 optimized lines 913
    5 executed plan lines 1883 InMemoryTableScan 31 optimized lines 1881
    6 executed plan lines 3819 InMemoryTableScan 63 optimized lines 3817
    7 executed plan lines 7691 InMemoryTableScan 127 optimized lines 7689
    8 executed plan lines 15435 InMemoryTableScan 255 optimized lines 15433
    ```

    `2^r - 1` scans: doubling. And who prints the plan on every action,
    even if you never call `explain()`? `SQLExecution.withNewExecutionId0`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/SQLExecution.scala`)
    calls `queryExecution.explainString(planDescriptionMode)` to fill
    `physicalPlanDescription` of the `SparkListenerSQLExecutionStart`
    event behind the SQL tab of the UI. Every action renders the whole
    plan as text, and that is where the heap ran out.

    `spark.sql.maxPlanStringLength` (3.0, unlimited by default) caps the
    string. With it set to `8k`, the run no longer crashed but kept
    doubling, because the tree is still walked in full:

    ```text
    14 19999 4.10s
    15 19999 7.97s
    16 19999 15.78s
    17 19999 31.43s
    18 19999 67.45s
    ```

    A cap treats the symptom. The cure is to give each round a plan
    with no history at all.

