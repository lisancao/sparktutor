    ## Lineage I: Plans That Multiply

    "Deduplication and Entity Resolution" showed the optimized plan of
    its label propagation doubling every round without
    `localCheckpoint()`, and noted that `cache()` alone does not help.
    This section and the next show where that growth comes from, how
    fast it can be, and what it does to the driver. A loop like this one
    rebinds `edges` every round:

    ```python
    while not done:
        edges = small_star(large_star(edges)).cache()
    ```

    Every DataFrame is a plan, and the new plan **contains** the old one.
    If a step refers to its input once, the plan grows by a constant
    each round. If it refers to it twice, the plan doubles. The join
    form refers to its input a lot: the union reads `edges` twice, the
    `groupBy` and the join each read the union (4 copies), and
    small-star's join and its extra `(u, m)` rows read the oriented
    edges three times. **Twelve** copies of the previous plan per round,
    so the analyzed plan has `12^r` leaves after `r` rounds. Measured on
    a 20,000-node path, with `cache()` every round (leaves of the
    analyzed plan, characters of its string):

    ```text
    1 (12, 8202)
    2 (144, 153569)
    3 (1728, 2466353)
    ```

    Then, in the fourth round:

    ```text
    py4j.protocol.Py4JJavaError: An error occurred while calling o5717.collectToPython.
    : java.lang.OutOfMemoryError: Java heap space
        at java.base/java.util.Arrays.copyOf(Arrays.java:3481)
        ...
        at org.apache.spark.sql.catalyst.util.StringConcat.append(StringConcat.scala:42)
        at org.apache.spark.sql.execution.QueryExecution.$anonfun$explainString$1(QueryExecution.scala:466)
        ...
        at org.apache.spark.sql.catalyst.trees.TreeNode.generateTreeString(TreeNode.scala:1058)
    ```

    `cache()` did not help: it changes what the **physical** plan reads
    (an `InMemoryTableScan` of the cached rows) but not the logical plan
    the analyzer and optimizer walk, which keeps the full tree. The data
    was tiny; the driver died of the plan.

    That is the reason for the window and the explode: with them, each
    star operation's analyzed plan has **one leaf**. You can check it in
    one line, and the exercise does:

    ```python
    small_star(large_star(edges))._jdf.queryExecution().analyzed().collectLeaves().length()
    ```

