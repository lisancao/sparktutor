    ## Label Propagation and the Diameter

    The intermediate lesson's loop gave every record its own id as a
    label and, each round, the smallest label among itself and its
    neighbours. A label moves **one edge per round**, so the loop needs
    as many rounds as the graph's **diameter** (the longest shortest
    path), plus one to see that nothing changed. That lesson's customers
    converged in 4 rounds; match graphs with chains (A and B share a
    phone, B and C an e-mail, and so on) do not.

    On a path of 100 nodes with ids in order, measured on the machine
    used to write this lesson (`local[4]`), a label propagation loop
    like that lesson's against this lesson's algorithm:

    ```text
    naive LP chain 100 rounds 100 20.7s
    LS/SS chain 100 rounds 7 3.2s
    ```

    A path of a million nodes would take a million rounds of label
    propagation; by the trend measured in "Rounds in Practice" below,
    large-star / small-star needs about 20.

    GraphX's `ConnectedComponents`
    (`graphx/src/main/scala/org/apache/spark/graphx/lib/ConnectedComponents.scala`)
    is the same propagation written with `Pregel`: it gives each vertex
    "the lowest vertex id in the connected component", one superstep per
    hop.

