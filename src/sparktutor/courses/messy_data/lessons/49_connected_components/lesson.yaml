    ## The Star Operations as DataFrames

    Both operations need "the minimum over a node's neighbours", for
    every edge of that node. Two ways to get it:

    - aggregate the minimum per node with `groupBy`, then **join** it
      back to the edges
    - compute it with a **window**, `F.min("v").over(Window.partitionBy("u"))`,
      which keeps every edge row and adds the minimum

    Large-star also needs each edge in both directions. Again two ways:
    `edges.union(swapped)`, or one `explode` of an array of two structs.

    The lesson's version uses the window and the explode:

    ```python
    def large_star(edges):
        both = edges.select(F.explode(F.array(
            F.struct(F.col("src").alias("u"), F.col("dst").alias("v")),
            F.struct(F.col("dst").alias("u"), F.col("src").alias("v")))).alias("e")).select("e.u", "e.v")
        m = F.least(F.min("v").over(Window.partitionBy("u")), F.col("u"))
        return (both.withColumn("m", m)
                .filter(F.col("v") > F.col("u"))
                .select(F.col("v").alias("src"), F.col("m").alias("dst"))
                .distinct())
    ```

    Its physical plan has one shuffle by `u` for the window and one for
    the `distinct`:

    ```text
    HashAggregate(keys=[src#318L, dst#319L], functions=[])
    +- Exchange hashpartitioning(src#318L, dst#319L, 4), ENSURE_REQUIREMENTS
       +- HashAggregate(keys=[src#318L, dst#319L], functions=[])
          +- Project [v#314L AS src#318L, least(_we0#317L, u#313L) AS dst#319L]
             +- Filter (isnotnull(v#314L) AND (v#314L > u#313L))
                +- Window [min(v#314L) windowspecdefinition(u#313L, specifiedwindowframe(RowFrame,
                   unboundedpreceding$(), unboundedfollowing$())) AS _we0#317L], [u#313L]
                   +- Sort [u#313L ASC NULLS FIRST], false, 0
                      +- Exchange hashpartitioning(u#313L, 4), ENSURE_REQUIREMENTS
                         +- Project [e#312.u AS u#313L, e#312.v AS v#314L]
                            +- Filter isnotnull(e#312.u)
                               +- Generate explode(array(struct(u, src#2L, v, dst#3L),
                                  struct(u, dst#3L, v, src#2L))), false, [e#312]
                                  +- ...
    ```

    Small-star is the same shape: orient with `greatest`/`least`, the
    window minimum per `u`, one explode emitting `(v, m)` and `(u, m)`,
    a filter for self-loops, `distinct`.

    The choice of window and explode over join and union looks like
    style. The next two sections show it is the difference between a
    program that finishes and one that cannot.

