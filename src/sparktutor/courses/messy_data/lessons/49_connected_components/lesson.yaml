    ## Large-Star and Small-Star

    The algorithm rewrites the **edge set** instead of passing labels.
    Write `Γ(u)` for the neighbours of `u`, and `m(u)` for the smallest
    of `u` and its neighbours.

    **Large-star(u):** connect every neighbour `v` of `u` with `v > u`
    to `m(u)`. Emit `(v, m(u))`. Edges to smaller neighbours are dropped
    (they are handled from the other side).

    **Small-star(u):** take only the neighbours `v <= u` (orient every
    edge from its larger end to its smaller end), let `m` be the
    smallest of them, and connect `u` and each of them to `m`. Emit
    `(v, m)` for each, and `(u, m)`, without self-loops.

    Each operation **preserves connectivity** (two nodes connected
    before are connected after) and never invents a connection, and
    neither ever replaces a component's minimum. Large-star makes a node
    the centre of a star of its larger neighbours; small-star collapses
    a node's smaller neighbours onto their minimum. Alternating them,
    long paths fold up quickly: the paper bounds the number of rounds by
    `O(log² n)`.

    On the path 1-2-3-4-5 plus the edge 6-7, the edges after each step:

    ```text
    1 large: [(2, 1), (3, 1), (4, 2), (5, 3), (7, 6)] small: [(2, 1), (3, 1), (4, 2), (5, 3), (7, 6)] converged: False
    2 large: [(2, 1), (3, 1), (4, 1), (5, 1), (7, 6)] small: [(2, 1), (3, 1), (4, 1), (5, 1), (7, 6)] converged: True
    3 large: [(2, 1), (3, 1), (4, 1), (5, 1), (7, 6)] small: [(2, 1), (3, 1), (4, 1), (5, 1), (7, 6)] converged: True
    ```

    In round 1, node 2 (neighbours 1 and 3) makes 3 point to 1, node 3
    (neighbours 2 and 4) makes 4 point to 2, node 4 makes 5 point to 3.
    In round 2, node 2 now has neighbours 1 and 4, so 4 points to 1, and
    so on. Round 3 changes nothing: that is the fixed point.

