    ## Checkpoints Cut the Plan

    "Deduplication and Entity Resolution" introduced both checkpoints,
    including how to set `spark.checkpoint.dir` (4.0) when the session
    starts on Spark Connect. In short, `checkpoint()` and
    `localCheckpoint()` compute the DataFrame and return a new one whose
    plan is just the saved rows:

    ```text
    LogicalRDD [src#2L, dst#3L], false
    ```

    One node, no history. Both are **eager** by default (they run a job
    right away; `eager=False` defers it to the first action).

    | | `checkpoint()` | `localCheckpoint()` |
    |---|---|---|
    | Where | files under `sparkContext.setCheckpointDir(...)` | blocks in the executors' block managers |
    | Survives losing an executor | yes, data is reread from the files | no: the RDD docs warn of "an irrecoverable job failure", and against dynamic allocation |
    | Needs | a checkpoint directory (on a cluster, a shared file system) | nothing |
    | Speed | writes and rereads files | faster |

    Without a directory:

    ```text
    org.apache.spark.SparkException: Checkpoint directory has not been set in the SparkContext
    ```

    With one, each checkpoint is an `rdd-<id>` folder under a folder
    with a random UUID name that `setCheckpointDir` creates (in the
    lesson's run: `87e62939-.../rdd-467/part-00000`). Spark does not delete them when
    you are done unless `spark.cleaner.referenceTracking.cleanCheckpoints`
    is on; clean the directory yourself.

    How often? Checkpointing every round of the join form on the
    20,000-node path:

    ```text
    localCheckpoint every round: rounds 15 7.0s    leaves per round: 1
    localCheckpoint every 2:     rounds 15 7.9s    leaves per round: 12, 1, 12, 1, ...
    localCheckpoint every 3:     rounds 15 17.2s   leaves per round: 12, 144, 1, ...
    ```

    For a step that multiplies its plan, checkpoint every round or two.
    For single-read steps, every two to five rounds is plenty, and the
    rounds in between can `cache()`. The pattern for a cached round, so
    that old data does not pile up in memory:

    ```python
    nxt = small_star(large_star(edges)).cache()
    nxt.count()          # materialize the new edges while the old ones are still cached
    edges.unpersist()    # then drop the old ones
    edges = nxt
    ```

    Unpersisting before the new edges are materialized would make Spark
    recompute the old edges from their own plan.

