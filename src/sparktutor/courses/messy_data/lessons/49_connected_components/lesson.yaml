    ## Clusters of Listings, and the Trouble With Transitivity

    Run on the marketplace listings of "Building LSH and an IVF Vector
    Index", with an edge for every pair whose Jaccard similarity on raw
    lower-case 5-shingles is at least a threshold:

    ```text
    J>=0.5: 1131 pairs, 72 clusters, rounds 3
      size 24 sellers ['user001', 'user008', 'user042', 'user097'] 8 titles ['bunk bed'] 1
      size 24 sellers ['user016', 'user019', 'user037', 'user046'] 10 titles ['dresser'] 1
      size 23 sellers ['user032', 'user058', 'user076', 'user090'] 6 titles ['vinyl records'] 1
      size 20 sellers ['user018', 'user052', 'user068', 'user089'] 5 titles ['air fryer'] 1
      size 20 sellers ['deals_by_marc'] 1 titles ['acoustic guitar', 'aquarium', 'baby stroller', 'bread maker'] 15
    J>=0.7: 351 pairs, 212 clusters, rounds 2
      size 8 sellers ['user003', 'user144'] 2 titles ['kayak'] 1
      size 8 sellers ['user010', 'user023'] 2 titles ['camera lens'] 1
      size 6 sellers ['user012'] 1 titles ['baby stroller'] 1
      size 6 sellers ['user011', 'user101'] 2 titles ['piano keyboard'] 1
      size 6 sellers ['user043'] 1 titles ['acoustic guitar'] 1
    ```

    (Sellers and titles show the first four names and the count.) At
    0.5 the largest "item" is 24 bunk-bed ads from 8 different sellers:
    their descriptions share the same product phrase, each ad matches a
    few others, and transitivity chains them all into one. The template
    seller becomes one item with 15 different titles. At 0.7 the
    clusters are reposts by one seller, or two sellers with the same ad
    text.

    This is "Clustering Changes the Score" from "Deduplication and
    Entity Resolution" at a larger scale: there, one wrong edge turned
    into nine false pairs. Connected components never weakens a match;
    it only adds. One edge between two clusters merges them, so the
    precision of the pairs decides the quality of the entities. Raise the threshold, add rules
    that forbid an edge (different seller **and** different price, for
    example), or cut clusters that are too large or too loosely
    connected. The algorithm here only makes the closure cheap.

