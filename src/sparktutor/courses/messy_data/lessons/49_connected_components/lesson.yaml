    ## GraphFrames and GraphX

    You rarely need to write this yourself in production:

    - **GraphFrames** is a separate project with a connected components
      implementation on DataFrames. Its Spark 4 artifact is
      `io.graphframes:graphframes-spark4_2.13`; the latest release on
      Maven Central when this lesson was written is 0.12.3, whose pom
      builds against `spark-sql_2.13` **4.1.2** (provided), with the
      Python package `graphframes-py` 0.12.3 on PyPI. It was not tested
      against 4.2.0 for this lesson; try it on your version before you
      depend on it. Its Python `connectedComponents` takes
      `algorithm` (`"two_phase"`, `"randomized_contraction"`, `"graphx"`;
      `"graphframes"` is a deprecated alias of `"two_phase"`),
      `checkpointInterval=2`, `use_local_checkpoints`, and
      `broadcastThreshold`, which broadcasts the labels of high-degree
      nodes (its docstring recommends `-1` to let adaptive execution
      handle skewed joins instead). It needs a checkpoint directory
      unless you use local checkpoints, for the reasons above.
    - **GraphX** ships with Spark (`spark-graphx_2.13-4.2.0.jar` is in
      PySpark's `jars/` folder) but has no Python API, and its
      connected components is the Pregel label propagation from the
      start of this lesson.

    Knowing the algorithm still matters when you use a library: it tells
    you why a checkpoint directory is required, why a giant component
    makes the last rounds slow, and why the answer depends entirely on
    the quality of your edges.

