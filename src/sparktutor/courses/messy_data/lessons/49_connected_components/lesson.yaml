    ## When to Stop: a Local Test

    At the fixed point every component is a **star around its smallest
    node**: each other node has exactly one edge, to the minimum. You
    could detect it by comparing the edge set with the previous round
    (`exceptAll` both ways), but there is a cheaper test that looks at
    one edge set only. With edges stored as `(src, dst)`, `src > dst`:

    1. every `src` has exactly one `dst`, and
    2. no node is both a `src` and a `dst`.

    Why it is enough: by (1) each non-centre node points to one node,
    and by (2) that node points nowhere, so each component is a star
    whose centre is the `dst`. Every edge has `src > dst`, so the centre
    is smaller than all its leaves: it is the minimum. And both
    conditions are necessary, because the stars around the minimum
    satisfy them.

    ```python
    def is_converged(edges):
        most = edges.groupBy("src").count().agg(F.max("count")).first()[0]
        if most is not None and most > 1:
            return False
        centres = edges.select(F.col("dst").alias("node"))
        leaves = edges.select(F.col("src").alias("node"))
        return centres.intersect(leaves).limit(1).count() == 0
    ```

    Condition (1) alone is not enough: in `(2, 1), (3, 2)` every `src`
    has one `dst`, but 2 is both a leaf and a centre. Condition (2) alone is not enough either:
    `(3, 1), (3, 2)` has no node on both sides, but 3 has two edges and 2
    is not yet labelled 1. The exercise tests both cases.

    The result is then a lookup: the final edges map each `src` to its
    component's minimum, the minimum itself and every isolated vertex
    map to themselves.

