    ## What You'll Learn

    "Deduplication and Entity Resolution" in the intermediate level
    scored pairs of records and grouped the matches into entities with
    a simple iterative label propagation. "Building LSH and an IVF
    Vector Index" produced pairs of near-duplicate listings. Both end
    with the same question: given pairs that say "these two are the
    same", which records belong together? That is the **connected
    components** of a graph whose nodes are records and whose edges are
    matches.

    This lesson builds the algorithm that scales, **large-star /
    small-star** (Kiveris, Lattanzi, Mirrokni, Rastogi and Vassilvitskii,
    "Connected Components in MapReduce and Beyond", SoCC 2014), from
    DataFrame operations, and spends as much time on what kills
    iterative DataFrame programs as on the algorithm itself: plans that
    grow until the driver runs out of memory.

    By the end of this lesson you will be able to:

    - Explain why label propagation needs as many rounds as the graph's
      diameter, and measure it
    - Define large-star and small-star, say what each preserves, and
      prove a local test for convergence
    - Write each star operation so it reads its input once, and say why
      that matters
    - Recognise the two ways a loop over DataFrames grows its plan (a
      plan tree that multiplies, and cached plans that print their
      history), read the evidence, and cut it with `checkpoint()` or
      `localCheckpoint()`
    - Find giant components and hub nodes before they become one slow
      task
    - Test a distributed graph algorithm against a union-find, on graphs
      chosen to break it
    - Explain why connected components turns a few bad matches into one
      huge false entity

