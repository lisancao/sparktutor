  SolutionFile: solution.py
  Hint: "large_star: explode(array(struct(src as u, dst as v), struct(dst as u, src as v))), m = least(min(v) over Window.partitionBy('u'), u), keep v > u, select v as src and m as dst, distinct. small_star: u = greatest, v = least, m = min(v) over the window, explode(array(struct(v, m), struct(u, m))), drop src == dst, distinct. Loop: localCheckpoint() when rounds % checkpoint_every == 0, else cache() and count(); then unpersist the old edges."

