    ## Exercise: Test, Register and Debug a Source

    The starter has the finished `mailbox` source (one row per `.eml`
    file; it logs `parsed <folder>/<file>` at `INFO` for each file and
    raises `ValueError` for a file without a `From` header). Write the
    three tools around it:

    1. `read_without_spark(source_cls, options, schema)`: create the
       reader, check it pickles with `cloudpickle`, check that
       `partitions()` returns a list of `InputPartition`, read every
       partition, check each row's length against the schema, and
       return the rows.
    2. `error_condition(action)`: run `action()` and return `None`, or
       the error's condition (`getCondition()`, else the first
       `[NAME]` in the message).
    3. `wait_for_worker_logs(spark, logger, prefix, expected)`: poll
       `spark.tvf.python_worker_logs()` until `expected` messages from
       `logger` starting with `prefix` arrive, or the timeout passes.

    The harness runs the reader without Spark first (no session exists
    yet), then starts a session with worker logging on and checks:
    `DATA_SOURCE_NOT_FOUND` before registration, identical rows from
    Spark and from your unit test, `DATA_SOURCE_ALREADY_EXISTS` for a
    source named `json`, replacement by a second `register()`, the two
    error surfaces, and one log line per ticket.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "error_condition: get = getattr(e, 'getCondition', None); name = get() if get else None; return name or the regex match. wait_for_worker_logs: a while True loop with time.monotonic() and time.sleep(0.5)."

