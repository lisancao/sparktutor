    ## Unit Tests Without Spark

    A reader is a plain Python object. You can create it, plan its
    partitions and call `read()` without a SparkSession, which makes
    tests fast and errors easy to read. The useful trick is to apply
    **the same checks Spark applies**, so a test fails for the reasons a
    real query would:

    | Spark checks | In a real query you would see |
    |---|---|
    | `partitions()` returns a `list` | `DATA_SOURCE_TYPE_MISMATCH`: Expected 'partitions' to return a list, but got 'generator'. |
    | every partition is an `InputPartition` | `DATA_SOURCE_TYPE_MISMATCH`: Expected elements in 'partitions' to be of type 'InputPartition', but got 'int', 'int'. |
    | each row has one value per column | `DATA_SOURCE_RETURN_SCHEMA_MISMATCH`: Expected: 2 columns, Found: 1 columns. |
    | the reader and partitions pickle | a pickling error before any task starts |

    Spark pickles with cloudpickle, which `pyspark` ships as
    `pyspark.cloudpickle`; using it in tests catches the same problems
    (an open file, socket or lock stored on `self`).

    A pytest file for the packaged source can be this small:

    ```python
    import pytest
    from pyspark_mailbox import MailboxDataSource

    def read_all(options):
        reader = MailboxDataSource(options).reader(None)
        return [row for p in reader.partitions() for row in reader.read(p)]

    def test_one_row_per_email():
        assert len(read_all({"path": "data/messy/mail", "partitions": "3"})) == 4

    def test_missing_path_is_a_clear_error():
        with pytest.raises(ValueError, match="needs a folder"):
            MailboxDataSource({}).reader(None)
    ```

    `python -m pytest` runs it in a fraction of a second. The rules from
    "Your First Python Data Source" still apply: option values are
    strings (`{"partitions": "3"}`, not `3`), and schemas are built from
    `StructType` objects, not DDL strings. A plain dict is fine here
    because every key is already lowercase; use a `CaseInsensitiveDict`
    when a test passes mixed-case keys.

    Then keep a few integration tests that run a real local session, to
    catch what plain Python cannot: registration, type conversion on the
    Spark side, and pushdown.

