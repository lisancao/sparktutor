    ## A Source as a Package

    Spark finds Python data sources in installed packages by a naming
    convention. When a session first needs a Python data source, Spark
    starts a Python worker that imports **every top-level module whose
    name starts with `pyspark_`**, and registers the `DefaultSource`
    class of each one that has it (the code is in
    `pyspark/sql/worker/lookup_data_sources.py`). The source is
    registered under its own `name()`, not the module name.

    A minimal layout:

    ```text
    pyspark-mailbox/
      pyproject.toml
      src/pyspark_mailbox/__init__.py
      src/pyspark_mailbox/source.py      # MailboxDataSource and its reader
      tests/test_reader.py
    ```

    ```toml
    [build-system]
    requires = ["setuptools>=68"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "pyspark-mailbox"
    version = "0.1.0"
    requires-python = ">=3.10"
    dependencies = ["pyspark>=4.0"]

    [tool.setuptools.packages.find]
    where = ["src"]
    ```

    ```python
    # src/pyspark_mailbox/__init__.py
    from pyspark_mailbox.source import MailboxDataSource

    # Spark looks for this name in every top-level module called pyspark_*
    DefaultSource = MailboxDataSource
    ```

    Install it and use it, with no `register()` anywhere:

    ```bash
    pip install -e ./pyspark-mailbox
    ```

    ```python
    df = spark.read.format("mailbox").load("data/messy/mail")
    df.count()   # 4
    ```

    `pip install -e` (editable) links the package to your source folder,
    so code changes take effect the next time you start Spark, without
    reinstalling. Build a wheel for everyone else.

