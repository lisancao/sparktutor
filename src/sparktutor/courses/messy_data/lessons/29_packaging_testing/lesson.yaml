    ## Summary

    - Name a top-level module `pyspark_<something>`, export
      `DefaultSource`, and `pip install` it: Spark registers the source
      automatically, once per application, in the Python its workers
      use.
    - Classes from `__main__` are pickled by value; classes from an
      installed module by reference, so install the package on every
      node (or on the Connect server).
    - `register()` replaces Python sources (including auto-registered
      ones, since 4.1) and refuses built-in names with
      `DATA_SOURCE_ALREADY_EXISTS`; names are case-insensitive.
    - Unit test readers as plain Python with Spark's checks: a list of
      `InputPartition`, picklable objects, one value per column. Build
      test schemas with `StructType`.
    - Planning errors surface as `PYTHON_DATA_SOURCE_ERROR`, task errors
      as `PYTHON_EXCEPTION`; read conditions with `getCondition()` and a
      fallback on the message.
    - `spark.sql.pyspark.worker.logging.enabled` plus
      `python_worker_logs()` (4.1) bring worker logs to the driver; set
      log levels deliberately and poll, because logs arrive
      asynchronously.

    Next: **Python UDTFs in Depth**, where table functions take whole
    tables as input and decide their output schema at analysis time.