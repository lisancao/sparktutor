    ## Debugging with Worker Logs (4.1)

    `read()` runs in a Python worker on an executor. A `print()` there
    does not show up in your notebook or terminal, and on a cluster it
    lands in a log file on a machine you may not be able to reach.
    Spark 4.1 added a way to collect those logs into a table:

    ```python
    spark.conf.set("spark.sql.pyspark.worker.logging.enabled", "true")

    spark.read.format("mailbox").load("data/messy/mail").collect()

    spark.tvf.python_worker_logs() \
        .filter("logger = 'mailbox'") \
        .select("ts", "level", "msg", "context").show(truncate=False)
    ```

    The setting defaults to `false`. The table has the columns `ts`,
    `level`, `msg`, `context` (a map with the calling function), an
    `exception` struct for logged exceptions, and `logger`. It collects
    `logging` calls from UDFs, UDTFs and data source readers, and also
    `print()` output, under the logger name `stdout` at level `INFO`.

    Three things surprised us:

    - **Levels follow Python's rules.** `log.info(...)` is dropped
      unless the logger's level allows it, because the default level
      is `WARNING`. Call `logging.getLogger("mailbox").setLevel(logging.INFO)`
      in `read()`, or log warnings.
    - **`print("parsed", name)` becomes two rows**, one per argument,
      because `print` writes its pieces separately. Use one f-string or
      `logging` with a format string.
    - **Logs arrive asynchronously.** In one run the first query right
      after an action returned fewer rows than a later one. SPARK-59547
      (open) proposes flushing worker logs before a task completes. Until
      then, poll: read the table again for a few seconds until the
      lines you expect are there, and never assert on a single read.

