    ## Where the Package Must Be Installed

    The lookup and every `read()` run in **Spark's Python workers**, not
    necessarily in the Python you typed `pip install` into. Workers use
    the interpreter named by `PYSPARK_PYTHON` (or the
    `spark.pyspark.python` setting), and `python3` from the `PATH` if
    neither is set.

    With the package installed in one virtual environment but the
    workers pointed at another, two things happened in testing:

    - `format("mailbox")` failed with `DATA_SOURCE_NOT_FOUND`, because
      the lookup ran in the other Python and found nothing
    - registering the class by hand from the driver
      (`from pyspark_mailbox import MailboxDataSource`) got further, but
      the read failed with `PYTHON_DATA_SOURCE_ERROR` caused by
      `ModuleNotFoundError: No module named 'pyspark_mailbox'`

    The second case shows a pickling rule worth remembering. A class
    defined in your script's `__main__` is pickled **by value** (its code
    travels with it), which is why every exercise in this course works
    without installing anything. A class imported from an installed
    module is pickled **by reference** ("import `pyspark_mailbox` and use
    `MailboxDataSource`"), so that module must be importable on every
    worker. On a cluster, install the package on the driver and on every
    executor. On Spark Connect, install it where the Connect server runs.

    Two more details from the lookup code:

    - It runs once per Spark application. A package installed after the
      session started is not seen until you restart it.
    - If importing any `pyspark_*` module raises an error, Spark logs
      "Skipping the lookup of Python Data Sources due to the failure"
      and registers none of them, so one broken package hides all the
      others.

