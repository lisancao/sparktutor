    ## Two Error Surfaces

    Errors from a Python data source reach you at two different
    moments, with two different conditions:

    - **At the first action** (`collect()`, `count()`, `show()` and
      friends): Spark creates your reader and calls `partitions()`
      on the driver. An exception there, such as the `ValueError` for a
      missing `path`, surfaces as `PYTHON_DATA_SOURCE_ERROR` ("Failed to
      initialize Python data source reader"), with your traceback in the
      message. `load()` alone only calls `schema()` (on Spark Connect,
      not even that until something needs the schema, as in "Reading
      from an API"), so `df.columns` still works on a DataFrame that
      will fail later.
    - **When a task runs**: an exception inside `read()` fails the task
      as `PYTHON_EXCEPTION` ("An exception was thrown from the Python
      worker"), again with your traceback. Spark checks of `read()`'s
      output, such as `DATA_SOURCE_RETURN_SCHEMA_MISMATCH`, appear inside
      it.

    To branch on an error in code, ask for its condition with
    `e.getCondition()`. It is not always filled in on the Python side,
    and the gaps differ by mode (from testing on 4.2.0):

    | Error | Classic | Connect |
    |---|---|---|
    | `DATA_SOURCE_NOT_FOUND` | `Py4JJavaError`, no condition | condition set |
    | `PYTHON_EXCEPTION` from `read()` | condition set | `getCondition()` is `None` |
    | `PYTHON_DATA_SOURCE_ERROR`, `DATA_SOURCE_ALREADY_EXISTS` | condition set | condition set |

    Every message still starts with or contains `[CONDITION_NAME]`, so a
    robust helper uses `getCondition()` and falls back to the first
    bracketed name in `str(e)`. You write that helper in the exercise.

