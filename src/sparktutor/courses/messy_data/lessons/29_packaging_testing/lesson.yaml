    ## Registration Rules

    `spark.dataSource.register(cls)` registers a class for the current
    session, under `cls.name()`:

    - **Names are case-insensitive.** After registering `mailbox`,
      `format("MailBox")` finds it.
    - **Registering a name again replaces the source.** A second
      `register()` with the same name wins (Spark logs a warning), and
      the same applies to a source that was auto-registered from a
      package: since 4.1 you can override a statically registered
      source with `register()` (SPARK-51919). This is handy for testing
      a fix without reinstalling.
    - **Built-in and JVM source names are refused.** Registering a
      Python source called `json` fails at `register()`:

    ```text
    [DATA_SOURCE_ALREADY_EXISTS] Data source 'json' already exists.
    Please choose a different name for the new data source. SQLSTATE: 42710
    ```

    Spark checks whether the name already resolves to a non-Python
    source (`json`, `parquet`, `csv`, `text`, `rate`, and any connector
    on the classpath) and refuses it, so a Python source can never
    shadow one. Pick distinctive names.

    - **An unknown name** fails when the DataFrame is created:
      `[DATA_SOURCE_NOT_FOUND] Failed to find the data source: mailbox.`

