    ## A Checklist Before You Ship a Source

    - Name it something no built-in or connector uses.
    - Validate required options in `DataSource.__init__` (they fail
      when the plan is analyzed, as in "Reading from an API") and the
      rest in the reader's constructor; both surface before any task
      runs.
    - Keep `__init__` free of open connections and file handles; open
      them in `read()`. Readers are pickled.
    - Import third-party libraries inside `read()` so the module loads
      even where only the driver has them, and list them as package
      dependencies so executors get them too.
    - Unit test `partitions()` and `read()` with Spark's own checks;
      keep a small integration test with a local session.
    - Log with `logging` under a logger named after the source.
    - Know the 4.2.0 limits: filter pushdown needs
      `spark.sql.python.filterPushdown.enabled` (default `false`), and
      Python data sources inside Declarative Pipelines make
      `spark-pipelines` exit with status 1 even when the run completes
      (SPARK-59135, fixed in 4.4.0). The capstone works around the
      second one.

