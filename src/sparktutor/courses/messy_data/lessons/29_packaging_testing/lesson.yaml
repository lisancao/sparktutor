    ## What You'll Learn

    Until now every data source lived inside the exercise file and was
    registered by hand. That is fine for learning, but a source your
    team relies on needs to be installable, tested without starting
    Spark, and debuggable when it fails on an executor you cannot see.

    By the end of this lesson you will be able to:

    - Package a source so that `format("mailbox")` works after
      `pip install`, with no `register()` call, through the `pyspark_*`
      auto-registration convention
    - Explain registration rules: replacing a source, case-insensitive
      names, and why a source named `json` is refused
    - Unit test a reader as plain Python, with the same checks Spark
      applies, and no SparkSession
    - Tell the two error surfaces apart (planning versus execution) and
      name the error condition in Classic and Connect
    - Read your reader's log lines back with `python_worker_logs()`
      (4.1), and poll for them because they arrive asynchronously

    The source in this lesson reads e-mails, as in "Documents to Rows":
    one row per `.eml` file with sender, subject and body.

