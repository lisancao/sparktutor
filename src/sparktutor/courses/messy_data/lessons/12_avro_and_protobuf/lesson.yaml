  Output: |
    ## How Spark Types Map to Avro

    Writing a row with one column of each common type, Spark 4.2.0
    produced this Avro schema (the literals were `NOT NULL`, so there
    are no unions):

    | Spark type | Avro type written | Read back as |
    |------------|-------------------|--------------|
    | `DATE` | `int`, logicalType `date` | `date` |
    | `TIMESTAMP` | `long`, `timestamp-micros` | `timestamp` |
    | `TIMESTAMP_NTZ` | `long`, `local-timestamp-micros` | `timestamp_ntz` |
    | `DECIMAL(4,2)` | `fixed` (2 bytes), logicalType `decimal` | `decimal(4,2)` |
    | `MAP<STRING, INT>` | `map` of `int` | `map<string,int>` |
    | `ARRAY<INT>` | `array` of `int` | `array<int>` |
    | `BINARY` | `bytes` | `binary` |
    | `TINYINT`, `SMALLINT` | `int` | `integer` (widened) |
    | `FLOAT` | `float` | `float` |

    And in the other direction, `schema_of_avro` (SQL, 4.0) shows what
    an Avro schema becomes without reading any data:

    | Avro type | Spark type |
    |-----------|------------|
    | `enum` | `STRING` (the symbol name) |
    | `fixed` | `BINARY` |
    | `timestamp-millis` and `timestamp-micros` | `TIMESTAMP` |
    | `string` with logicalType `uuid` | `STRING` |
    | `["null", "string"]` | nullable `STRING` |
    | `["null", "double", "string"]` | `STRUCT<member0: DOUBLE, member1: STRING>` |

    That last row is the one that bites. A union of several non-null
    types (common in schemas generated from loosely typed sources)
    becomes a struct with one field per branch, named by position:
    exactly one is set per row. Add a branch to the union and the
    positions move. The option `enableStableIdentifiersForUnionType`
    (`true`) names the fields after the types instead,
    `STRUCT<member_double: DOUBLE, member_string: STRING>`, which
    survives that change.

    Two Spark types cannot be written to Avro at all: `VARIANT` fails
    with `[UNSUPPORTED_DATA_TYPE_FOR_DATASOURCE] The Avro datasource
    doesn't support the column `v` of the type "VARIANT"`, and so do
    the 4.2 geospatial types. Convert a VARIANT with `to_json` first.

    When an exact Avro schema matters (an enum instead of a string, a
    schema another team owns), pass it when writing with
    `option("avroSchema", schema_json)`. Spark then checks the data
    against it: a value outside an enum fails the write with
    `IncompatibleSchemaException: ... "BLUE" cannot be written since
    it's not defined in enum "RED", "GREEN"`.

- Class: text
  Depth: all
  Output: |
    ## Avro Schema Evolution

    Avro resolves two schemas when it reads: the **writer's schema**
    (the one the bytes were written with) and the **reader's schema**
    (the one you want). Fields are matched **by name**, and the rules
    decide what happens to every difference:

    | Change in the reader | Result |
    |----------------------|--------|
    | field added, with a `default` | filled with the default |
    | field added, nullable with `"default": null` | NULL |
    | field added, no default | fails: `AvroTypeException: Found topLevelRecord, expecting topLevelRecord, missing required field region` |
    | field removed | silently skipped |
    | field renamed, old name in `aliases` | read under the new name |
    | `long` in the writer read as `int` | fails: `AvroTypeException: Found long, expecting int` |
    | `int` read as `long`, `float` as `double` | promoted |
    | non-null type read as a `["null", ...]` union | works |

    For files, the reader's schema is the `avroSchema` option. Here two
    folders were written with an older and a newer schema (`currency`
    was added in the newer one):

    ```python
    reader = json.dumps({"type": "record", "name": "topLevelRecord", "fields": [
        {"name": "order_id", "type": "string"},
        {"name": "user_id", "type": "long"},
        {"name": "amount", "type": "double"},
        {"name": "currency", "type": "string", "default": "CAD"}]})
    spark.read.format("avro").option("avroSchema", reader).load(folder).show()
    ```

    ```
    +--------+-------+------+--------+---+
    |order_id|user_id|amount|currency|day|
    +--------+-------+------+--------+---+
    |     O-2|      8|  30.0|     USD|  2|
    |     O-1|      7|  12.5|     CAD|  1|
    +--------+-------+------+--------+---+
    ```

    The old file's row got the default. A rename uses an alias in the
    reader: `{"name": "total", "type": "double", "aliases": ["amount"]}`
    reads the writer's `amount` as `total`.

    The errors above show up at the first action, wrapped in
    `[FAILED_READ_FILE.NO_HINT] Encountered error while reading file
    ...`, with the Avro message in the cause. Read the cause.

- Class: text
  Depth: all
  Output: |
    ## The Mixed-Folder Trap

    Without `avroSchema`, which schema does Spark use for a folder whose
    files were written by different versions? **One file's.** Spark
    opens the first file it can in its file listing and uses that file's
    schema for everything; there is no merging. On the two-version folder
    above, without the option:

    ```
    root
     |-- order_id: string (nullable = true)
     |-- user_id: long (nullable = true)
     |-- amount: double (nullable = true)
     |-- day: integer (nullable = true)
    ```

    `currency` is gone, for every row, without a warning. Which file is
    "first" is not something to rely on: in a second test where the
    newer file sat in the folder that sorts first, Spark still picked the
    older one. `option("mergeSchema", "true")` is accepted and does
    nothing (the 4.2.0 Avro source has no such option).

    Two ways to get every field:

    - **`option("avroSchema", ...)`** with the newest schema, as above:
      Avro fills in defaults for older files.
    - **A Spark schema**, `.schema("order_id STRING, currency STRING")`:
      Spark matches columns by name and gives NULL where a file lacks
      one (no Avro default). A type that does not match fails with
      `IncompatibleSchemaException: Cannot convert Avro field 'amount'
      to SQL field 'amount' because schema is incompatible (avroType =
      "double", sqlType = STRING)`.

    The first keeps Avro's evolution rules (defaults, aliases); use it
    when you have the registry's schema.

