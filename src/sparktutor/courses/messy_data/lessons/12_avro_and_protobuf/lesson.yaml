    ## Summary

    In this lesson you learned:

    - **The modules**: `spark-avro` and `spark-protobuf` are separate
      jars (`--packages org.apache.spark:spark-avro_2.13:4.2.0`, or
      `# spark-connectors: avro, protobuf` in SparkTutor); without them
      you get "Failed to find data source: avro" or
      `AVRO_NOT_LOADED_SQL_FUNCTIONS_UNUSABLE` /
      `PROTOBUF_NOT_LOADED_SQL_FUNCTIONS_UNUSABLE`.
    - **Avro files** carry their schema in the header (`Obj\x01`),
      compress per block (`snappy` by default), turn nullable columns
      into unions, and cannot hold VARIANT.
    - **Avro evolution** resolves writer and reader schemas by name:
      defaults fill added fields, aliases handle renames, a new field
      without a default or a narrowing type fails. A folder of mixed
      versions is read with **one file's schema** unless you pass
      `avroSchema`.
    - **Avro bytes** (`from_avro`/`to_avro`) have no schema: a wrong
      schema can fail, or silently succeed with wrong data. Pass the
      writer schema as the argument and the reader schema as
      `avroSchema`. FAILFAST is the default; PERMISSIVE gives a struct
      of NULLs.
    - **The Confluent wire format** puts a 0 byte and a 4-byte schema id
      in front (plus message indexes for Protobuf). `from_avro` does not
      strip it and decodes it as garbage; strip it with `substring`.
    - **Protobuf** needs a descriptor set (`protoc --include_imports
      --descriptor_set_out`, or `descriptor_pb2`), identifies fields by
      number, ignores unknown fields, and in proto3 does not write zero
      values: they read as NULL unless `emit.default.values` is set.
      PERMISSIVE gives NULL, and `MALFORMED_PROTOBUF_MESSAGE` is the
      FAILFAST error.
    - **Keep the raw bytes** and a dead-letter table: decoding problems
      are found later, and you will want to decode again.

    Next: **Documents to Rows**, where the input is whole documents
    (e-mails, PDFs, Markdown) and the job is to turn each one into rows.
