    ## Protobuf Evolution and Bad Messages

    The evolution cases, run on 4.2.0:

    | Writer and reader | Result |
    |-------------------|--------|
    | newer writer added field 7, older reader | field 7 silently ignored |
    | older writer, newer reader with field 7 | field 7 is NULL |
    | writer changed field 1 from `string` to `int64` | `PROTOBUF_FIELD_TYPE_MISMATCH` |
    | truncated bytes | `MALFORMED_PROTOBUF_MESSAGE` |
    | empty bytes (`b""`) | a valid message with every field unset |

    In **FAILFAST** (the default) any failure stops the job:

    ```
    [MALFORMED_PROTOBUF_MESSAGE] Malformed Protobuf messages are detected
    in message deserialization. Parse Mode: FAILFAST. To process
    malformed protobuf message as null result, try setting the option
    'mode' as 'PERMISSIVE'.
    ```

    with the reason in the cause: `InvalidProtocolBufferException: While
    parsing a protocol message, the input ended unexpectedly in the
    middle of a field` for truncated bytes, or `[PROTOBUF_FIELD_TYPE_MISMATCH]
    Type mismatch encountered for field: ...` for a retyped field.

    In **PERMISSIVE** mode a bad message gives **NULL**. Note the
    difference: `from_protobuf` returns NULL, `from_avro` returns a
    struct of NULLs. Code that handles both must test both ways, which
    is what the exercise's `classify` does.

    A 4.2.0 quirk worth knowing: the field named in
    `PROTOBUF_FIELD_TYPE_MISMATCH` is looked up by using the field
    *number* as a list *position*. When field 1 (`sku`) of a message
    `Item {sku = 1; qty = 2; note = 3}` was retyped, the error named
    `demo.Item.qty`; and when the retyped number is not smaller than the
    number of fields, the cause is an `ArrayIndexOutOfBoundsException`
    instead. Compare the writer's and reader's descriptors rather than
    trusting the name.

    Encoding has its own checks, at analysis time:

    - a struct field that is not in the message:
      `[UNABLE_TO_CONVERT_TO_PROTOBUF_MESSAGE_TYPE] Unable to convert SQL
      type "STRUCT<...>" to Protobuf type Payment` (also for a field of
      the wrong type);
    - an enum string that is not a value:
      `[CANNOT_CONVERT_SQL_VALUE_TO_PROTOBUF_ENUM_TYPE] Cannot convert SQL
      `method` to Protobuf field 'method' because BITCOIN is not in
      defined values for enum`;
    - fields of the message that the struct lacks are simply not
      written.

