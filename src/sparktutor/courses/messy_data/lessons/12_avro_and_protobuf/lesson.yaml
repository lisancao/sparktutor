    ## One Shape for Every Version

    The sample orders topic has messages written with schema ids 1 and
    2. Version 2 (`schemas/orders-value-2.avsc`) renamed `amount` to
    `total` (with `"aliases": ["amount"]`), and added `currency`
    (default `"CAD"`), `coupon` (nullable, default null) and `items`
    (default `[]`). One expression decodes both into the version 2
    shape:

    ```python
    opts = {"avroSchema": V2, "mode": "PERMISSIVE"}
    o = (F.when(F.col("schema_id") == 1, from_avro("payload", V1, opts))
          .when(F.col("schema_id") == 2, from_avro("payload", V2, opts)))
    ```

    ```
    +------+------+----------+--------+------+--------+------+---------------------------+
    |offset|key   |schema_id |order_id|total |currency|coupon|items                      |
    +------+------+----------+--------+------+--------+------+---------------------------+
    |0     |O-2001|1         |O-2001  |103.93|CAD     |NULL  |[]                         |
    |5     |O-2003|NULL      |NULL    |NULL  |NULL    |NULL  |NULL                       |
    |13    |O-2013|2         |O-2013  |95.63 |CAD     |FALL10|[{P3, 3}, {P1, 1}, {P2, 2}]|
    |17    |O-2900|7         |NULL    |NULL  |NULL    |NULL  |NULL                       |
    |26    |O-2960|1328362041|NULL    |NULL  |NULL    |NULL  |NULL                       |
    ...
    ```

    Both `from_avro` calls return the same type because the output
    follows `avroSchema`, so `when` accepts them. A version 1 message
    shows its `amount` under `total` and gets the defaults. Offset 5 is a
    **tombstone** (a NULL value, which in a compacted Kafka topic means
    "delete this key"), offset 17 uses a schema id that was never
    registered, and offset 26 has no header. The `timestamp-millis`
    field `ts` arrives as a Spark `TIMESTAMP`.

