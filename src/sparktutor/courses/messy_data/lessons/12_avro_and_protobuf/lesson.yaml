- Class: text
  Depth: all
  Output: |
    ## What You'll Learn

    The formats so far ("CSV and Delimited Files", "JSON Drift and
    Quarantine", "XML") are text: you can open them in an editor, and
    every record spells out its own field names. Systems that move a lot
    of records between programs (Kafka topics, RPC calls, event
    pipelines, data lake files) usually use **binary record formats**
    instead. The two you will meet most are **Apache Avro** and
    **Protocol Buffers** (Protobuf).

    They are messy in a different way. Nothing is human-readable, a
    record does not say what its fields are, and the schema that
    explains the bytes lives somewhere else: in a file header, in a
    schema registry, or in a `.proto` file in another team's repository.
    Most failures are not parse errors but **silent wrong answers** from
    reading bytes with the wrong schema. This lesson teaches you to
    recognise them.

    You already know structs, arrays and maps from "Complex Types and
    Higher-Order Functions"; both formats decode into exactly those
    types. By the end of this lesson you will be able to:

    - Add the `spark-avro` and `spark-protobuf` modules to a session,
      and recognise the errors when they are missing
    - Read and write `.avro` files, choose a compression codec, and read
      a folder whose files were written with different schema versions
    - Evolve an Avro schema safely (added fields with defaults, removed
      fields, renames with aliases) and predict which changes fail
    - Decode Avro bytes in a column with `from_avro`, including the
      Confluent wire format that Kafka producers use
    - Decode Protobuf with `from_protobuf` and a descriptor set (from
      `protoc` or built in Python), and explain why a proto3 `0` comes
      back as NULL
    - Turn undecodable messages into a dead-letter table instead of a
      failed job

    The sample data is in `data/messy/binary/`: dumps of an `orders`
    topic (Avro) and a `payments` topic (Protobuf), with the schemas a
    registry would hold.

- Class: text
  Depth: all
  Output: |
    ## Why Binary Records Exist

    Here is the same order three ways:

    | Format | Bytes | What the record carries |
    |--------|-------|-------------------------|
    | JSON | `{"order_id": "O-2001", "user_id": 5, "amount": 103.93, "ts": 1790841600000}` (75 bytes) | field names, values as text |
    | Avro | `0C 4F 2D 32 30 30 31 0A EC 51 B8 1E 85 FB 59 40 80 E0 D1 E7 9E 68` (22 bytes) | values only, in schema order |
    | Protobuf | field number and type tag, then the value, for each field that is set | numbered fields, no names |

    Binary formats are smaller and faster to parse because the names and
    types are written once, in a **schema**, instead of in every record.
    The price is that the bytes are meaningless without that schema.
    The schemas also carry **evolution rules**: which changes a producer
    may make (add a field, remove one, rename one) so that old readers
    and new readers keep working.

    | | Avro | Protobuf |
    |---|---|---|
    | Schema language | JSON (`.avsc`) | `.proto` files, compiled to descriptors |
    | Fields identified by | position, resolved by name | number |
    | Schema travels | in the file header (`.avro` files); outside the bytes for single messages | always outside the bytes |
    | Typical home | data lake files, Kafka with a schema registry | RPC (gRPC), Kafka, mobile and service events |
    | Spark functions | `format("avro")`, `from_avro`, `to_avro`, `schema_of_avro` | `from_protobuf`, `to_protobuf` |

    In Spark, Avro has had a file data source since 2.4 and the Python
    `from_avro`/`to_avro` functions since 3.0; Protobuf support arrived in
    3.4. There is no `.proto` file data source: Protobuf in Spark is
    always bytes in a column.

- Class: text
  Depth: beginner
  Output: |
    Think of a JSON record as a filled-in form where every box has its
    label printed next to it. An Avro record is the same form with the
    labels torn off: just the answers, in order. To read it you need the
    blank form (the schema) that says "the first answer is the order id,
    the second is the user id". Hold the wrong blank form against it and
    you will still read *something*, just not the truth.

