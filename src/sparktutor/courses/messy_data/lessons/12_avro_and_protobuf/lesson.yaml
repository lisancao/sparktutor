    ## How Protobuf Types Map to Spark

    A message with a nested message, a timestamp, a map, a `oneof` and
    an `Any`, decoded with default options:

    | Protobuf | Spark |
    |----------|-------|
    | `string`, `bytes`, `bool` | `string`, `binary`, `boolean` |
    | `int32`, `int64` | `integer`, `bigint` |
    | `uint64` | `bigint`: 2^64 - 1 reads as `-1` |
    | `enum` | `string` (the value's name) |
    | a nested message | `struct` |
    | `repeated` | `array` (never NULL, `[]` when empty) |
    | `map<string, string>` | `map<string,string>` |
    | `google.protobuf.Timestamp` | `timestamp` |
    | `google.protobuf.Int32Value` (a wrapper type) | `struct<value: int>` |
    | `oneof payload { int32 click_x = 5; string search_q = 6; }` | two columns, `click_x` and `search_q`; at most one is set |
    | `google.protobuf.Any` | `struct<type_url: string, value: binary>` |

    The options that change this, all read in the 4.2.0
    `ProtobufOptions` source and checked here:

    | Option | Effect |
    |--------|--------|
    | `emit.default.values` | zero values instead of NULL (above) |
    | `enums.as.ints` | `method` becomes an `integer` (`1` for CARD) |
    | `upcast.unsigned.ints` | `uint32` as `bigint`, `uint64` as `decimal(20,0)` (2^64 - 1 reads correctly) |
    | `unwrap.primitive.wrapper.types` | `Int32Value` as a plain `int` (an `Int32Value(0)` still reads NULL unless `emit.default.values` is also set) |
    | `convert.any.fields.to.json` | an `Any` as a JSON string, for example `{"@type":"type.googleapis.com/demo.Item","sku":"P9","qty":1}`, if its type is in the descriptor set |
    | `recursive.fields.max.depth` | how deep to unroll a recursive message |
    | `retain.empty.message.types` | keep empty messages as a struct with a dummy field instead of dropping them |
    | `mode` | `FAILFAST` (default) or `PERMISSIVE` |

    A recursive message (`message Node { string name = 1; Node child =
    2; }`) cannot become a Spark type by default:
    `[RECURSIVE_PROTOBUF_SCHEMA] Found recursive reference in Protobuf
    schema, which can not be processed by Spark by default:
    demo.Node.child. try setting the option `recursive.fields.max.depth`
    1 to 10.` With depth `1` the recursive field is dropped
    (`struct<name:string>`); `2` keeps one level
    (`struct<name:string,child:struct<name:string>>`), and so on. Deeper
    data is cut off at that depth.

