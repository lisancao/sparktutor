  Output: |
    ## The Schema Is Not in the Bytes

    Because a message has no schema, `from_avro` believes whatever schema
    you give it. The 4.2.0 docstring says it plainly: "The specified
    schema must match the read data, otherwise the behavior is undefined:
    it may fail or return arbitrary result." All of these were run:

    | Bytes written with | Decoded with | Result |
    |--------------------|--------------|--------|
    | v2 (v1 plus `currency`) | v1 | **succeeds**: v1's fields, the trailing bytes ignored |
    | v1 | v2 as the writer schema | fails: `java.io.EOFException` (the bytes ran out) |
    | v1 | a schema with the fields in another order | fails: `Malformed data. Length is negative: -40` |
    | v1 with a 5-byte header in front | v1 | **succeeds with garbage**: `order_id` empty, `user_id` 0, `amount` 2.57602727545058E... |

    The first and last rows are the dangerous ones: no error, wrong
    data. You will meet the last one again in a moment.

    To read with evolution, pass **both** schemas: the writer's as the
    second argument and the reader's as the `avroSchema` option:

    ```python
    from_avro("value", V1, {"avroSchema": V2})     # v1 bytes, v2 shape
    ```

    ```
    +--------+-------+------+--------+
    |order_id|user_id|amount|currency|
    +--------+-------+------+--------+
    |     O-1|      7|  12.5|     CAD|
    |     O-2|     -1|   0.0|     CAD|
    +--------+-------+------+--------+
    ```

    The output type always follows the `avroSchema` option when it is
    set, so messages written with different versions can all be decoded
    into one shape. That is how the exercise unifies the topic.

