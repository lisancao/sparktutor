    ## Avro Files

    Writing and reading Avro files works like Parquet:

    ```python
    ev = spark.read.json("data/messy/events/events_2026-10-01.json")
    ev.write.format("avro").save(out)
    spark.read.format("avro").load(out).show(3)
    ```

    ```
    +------+--------+-------------------+-------+
    |amount|   event|                 ts|user_id|
    +------+--------+-------------------+-------+
    |  6.13|    view|2026-10-01T10:00:00|      0|
    | 16.02|purchase|2026-10-01T10:01:00|      1|
    | 38.14|    view|2026-10-01T10:02:00|      2|
    ```

    An Avro **object container file** starts with the magic bytes
    `Obj\x01`, then a header map with the writer's schema as JSON, the
    codec, and a 16-byte sync marker; then blocks of records. The start
    of the file Spark just wrote:

    ```
    b'Obj\x01\x06\x16avro.schema\xb4\x03{"type":"record","name":"topLevelRecord",
    "fields":[{"name":"amount","type":["double","null"]},{"name":"event",
    "type":["string","null"]},{"name":"ts","type":["string","null"]},
    {"name":"user_id","type":["long","null"]}]}0org.apache.spark.version
    \n4.2.0\x14avro.codec\x0csnappy\x00...'
    ```

    Three things to notice:

    - **The schema is in the file.** That is why an Avro file needs no
      inference pass: Spark reads the header and knows the schema.
    - **A nullable Spark column becomes a union with `null`**:
      `["double","null"]`. A `NOT NULL` column becomes the plain type.
    - **The record is named `topLevelRecord`** unless you set
      `recordName` (and `recordNamespace`) when writing, for example
      `.option("recordName", "Order").option("recordNamespace", "shop")`
      to produce a schema other teams can register as `shop.Order`.

    Compression is per block, chosen with `option("compression", ...)`
    or `spark.sql.avro.compression.codec` (default `snappy`). For the 20
    events above (1,589 bytes of JSON), one file each:

    | codec | bytes |
    |-------|-------|
    | `uncompressed` | 1,116 |
    | `snappy` (default) | 645 |
    | `deflate` | 571 |
    | `zstandard` | 613 |

    The allowed values are `uncompressed`, `deflate`, `snappy`,
    `bzip2`, `xz` and `zstandard`; anything else, such as `gzip`, fails
    with `[CODEC_SHORT_NAME_NOT_FOUND] Cannot find a short name for the
    codec gzip`. Tiny files are dominated by the header; the ratios on
    real data will differ.

    Files do not need the `.avro` extension to be read (a file called
    `data.bin` in the folder is read too); use the general
    `pathGlobFilter` option (`"*.avro"`) to select files. The old
    `ignoreExtension` option is deprecated.

- Class: text
