    ## Choosing a Format, and Where Each Bites

    | Situation | Reach for | Watch out for |
    |-----------|-----------|---------------|
    | files in a lake that other engines read | Avro or Parquet | Avro is row-oriented: whole records are read even if you need one column; Parquet suits analytics better |
    | a Kafka topic with a schema registry | Avro or Protobuf, whatever the producers use | the 5-byte header, unknown schema ids |
    | service-to-service events from typed code | Protobuf | proto3 zero values, enum zero values |
    | data whose shape you do not control at all | land it as VARIANT (next to the raw bytes) | Avro cannot store VARIANT; `to_json` it |

    In every case, keep the raw bytes (or a pointer to them) alongside
    what you decoded. When a schema problem is found later, you can
    decode again; if you only kept the decoded columns, the wrong answers
    are permanent.

