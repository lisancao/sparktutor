    ## Window Functions in One Page

    The exercise asks for "the latest message per key", a job that comes
    up again and again with messy data (the newest version of a record,
    the closest store per delivery, the top results per query). A
    **window function** computes a value for each row from the other
    rows in its group, without collapsing the group the way `groupBy`
    does. `row_number()` numbers the rows of each group in a chosen
    order, so "latest per key" is "row number 1, newest first":

    ```python
    from pyspark.sql import Window

    msgs = spark.createDataFrame(
        [("O-1", 10, "10:00", "placed"), ("O-1", 14, "10:05", "paid"),
         ("O-2", 11, "10:01", "placed"), ("O-2", 12, "10:03", "cancelled"),
         ("O-2", 13, "10:03", "refunded")],
        "key string, offset long, ts string, status string")

    latest = Window.partitionBy("key").orderBy(F.col("offset").desc())
    (msgs.withColumn("rn", F.row_number().over(latest))
         .filter(F.col("rn") == 1)
         .drop("rn")
         .orderBy("key")
         .show())
    ```

    ```
    +---+------+-----+--------+
    |key|offset|   ts|  status|
    +---+------+-----+--------+
    |O-1|    14|10:05|    paid|
    |O-2|    13|10:03|refunded|
    +---+------+-----+--------+
    ```

    `partitionBy` says which rows belong together (one group per key),
    and `orderBy` says how to number them inside each group.

    **Ties.** Order `O-2` by `ts` instead and two messages share `10:03`.
    `row_number()` still gives exactly one row the number 1, but which
    of the tied rows gets it is not defined and can change from run to
    run. (`rank()` gives both tied rows 1, so filtering on it would keep
    two rows.) Make the order deterministic by adding a **tie-breaker**,
    a column that is unique within the group, as the last sort key:

    ```python
    by_ts = Window.partitionBy("key").orderBy(F.col("ts").desc(), F.col("offset").desc())
    ```

    With it, `O-2` always resolves to offset 13, `refunded`.

    **The same in SQL.** A window function cannot go in `WHERE`
    (`WINDOW_FUNCTION_NOT_ALLOWED_IN_CLAUSE`), because `WHERE` runs
    before windows are computed, so the classic form numbers the rows in
    a subquery and filters outside it:

    ```sql
    SELECT key, offset, ts, status FROM (
      SELECT *, row_number() OVER (PARTITION BY key ORDER BY ts DESC, offset DESC) AS rn
      FROM msgs)
    WHERE rn = 1
    ```

    Spark 4.2 adds `QUALIFY`, a filter that runs after window functions,
    so the subquery goes away:

    ```sql
    SELECT key, offset, ts, status FROM msgs
    QUALIFY row_number() OVER (PARTITION BY key ORDER BY ts DESC, offset DESC) = 1
    ```

    Both return the same two rows as the DataFrame version.

