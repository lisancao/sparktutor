    ## Protobuf on the Wire

    A Protobuf message is a list of `(field number, wire type, value)`
    entries. The key byte is `field_number << 3 | wire_type`, where wire
    type 0 is a varint and 2 is length-delimited (strings, bytes, nested
    messages, packed lists). Payment `P-2`, with `amount_cents = 0` and
    `method = CASH`, encodes as:

    ```
    0A 03 50 2D 32   field 1 (payment_id), length 3, "P-2"
    12 03 4F 2D 32   field 2 (order_id), length 3, "O-2"
    20 02            field 4 (method), varint 2 = CASH
    ```

    Field 3 is not there at all. In **proto3**, a singular field that
    holds its default value (0, `""`, `false`, the enum value numbered 0)
    is **not written**, so a reader cannot tell "zero" from "not set".
    That is the whole story behind a gotcha that surprises everyone.

    Because fields are identified by number, Protobuf evolution has its
    own rules: renaming a field is free (names are not on the wire),
    adding a field is safe, and reusing or retyping a number is not.

