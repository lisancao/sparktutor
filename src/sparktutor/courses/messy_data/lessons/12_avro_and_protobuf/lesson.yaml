  Output: |
    ## Parse Modes for from_avro

    `from_avro` takes a `mode` option, and the default is **FAILFAST**:
    one bad message fails the whole job.

    ```
    org.apache.spark.SparkException: Malformed records are detected in
    record parsing. Current parse Mode: FAILFAST. To process malformed
    records as null result, try setting the option 'mode' as 'PERMISSIVE'.
    ```

    (In 4.2.0 this error has no error condition, only the message; the
    real reason, such as `java.io.EOFException`, is in its cause.)

    With `{"mode": "PERMISSIVE"}`, a bad message gives a **struct of
    NULLs, not NULL**, and a NULL input gives NULL:

    ```
    +------------------+------+--------+
    |                 o|isnull|order_id|
    +------------------+------+--------+
    |{NULL, NULL, NULL}| false|    NULL|      <- truncated bytes
    |              NULL|  true|    NULL|      <- NULL value
    +------------------+------+--------+
    ```

    So `o IS NULL` does not find bad messages. Test a field the schema
    says can never be NULL, such as `o.order_id IS NULL`. (In
    PERMISSIVE mode every field of the result is nullable, for this
    reason.) `DROPMALFORMED` is not supported: `[PARSE_MODE_UNSUPPORTED]
    The function `from_avro` doesn't support the DROPMALFORMED mode.
    Acceptable modes are PERMISSIVE and FAILFAST.`, the same rule as
    `from_json` in "JSON Drift and Quarantine".

