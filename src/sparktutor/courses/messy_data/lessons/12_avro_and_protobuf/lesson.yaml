    ## Confluent Framing for Protobuf

    The Confluent wire format for Protobuf adds one more piece after the
    5-byte header: the **message indexes**, which say which message in
    the schema file this is (a schema can define several, and nested
    ones). Confluent's documentation describes them as an array of
    zigzag varints, length first, with the common case "the first
    message in the file" shortened to a single `0` byte. A payment from
    the sample topic:

    ```
    00 | 00 00 00 03 | 00 | 0A 08 50 41 59 2D 39 30 30 34 12 06 4F 2D 32 30 30 34 20 03
    magic  id 3      index   "PAY-9004"                    "O-2004"            GIFT_CARD
    ```

    So the Protobuf payload starts at byte 7 here. Every message in the
    sample topic uses the first message type, so the index is always
    the single `0` byte; a topic whose producers use other message types
    needs a small parser for the index list (check the first byte: `0`
    means one byte, anything else is a length). Note that this payment
    has no field 3: it was paid 0 cents.

