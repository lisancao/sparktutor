  Output: |
    ## The Confluent Wire Format

    Most Kafka producers that use a schema registry (Confluent's
    serializers, and many compatible ones) do not write the bare Avro
    record. They put a 5-byte header in front:

    | Bytes | Meaning |
    |-------|---------|
    | 1 | magic byte, `0` |
    | 2 to 5 | the schema id in the registry, a 4-byte big-endian integer |
    | 6 onward | the Avro record |

    The first message in `data/messy/binary/orders_topic.jsonl`:

    ```
    00 | 00 00 00 01 | 0C 4F 2D 32 30 30 31 0A EC 51 B8 1E 85 FB 59 40 80 E0 D1 E7 9E 68
    magic  id 1        "O-2001"            user 5  amount 103.93 (8 bytes)  ts (long)
    ```

    **`from_avro` does not know about this header.** Give it the whole
    value and it decodes the header as data: `00` is an empty string,
    the next `00` is the long 0, and 8 bytes that straddle the header and
    the record become a nonsense double. No error, in any mode; this is
    the garbage row in the table two sections back. It is the most
    common Avro bug in Spark jobs that read Kafka.

    Split the header off with built-in functions (positions are 1-based
    and `substring` works on `BINARY` too):

    ```python
    framed = raw.select("*",
        (F.hex(F.substring("value", 1, 1)) == "00").alias("framed"),
        F.conv(F.hex(F.substring("value", 2, 4)), 16, 10).cast("int").alias("schema_id"),
        F.expr("substring(value, 6)").alias("payload"))
    ```

    `F.hex` turns the four id bytes into the text `00000001`, and `conv`
    reads that as a base-16 number. Then decode `payload`, choosing the
    writer schema by `schema_id`. Apache Spark 4.2 has no schema
    registry client: the options of `from_avro` are the ones above, and
    fetching schemas by id is up to you (download them once from the
    registry's REST API, or keep them in files, as this lesson does).
    Some vendor platforms add registry integration; that is not part of
    Apache Spark.

    Check `framed` too: a producer configured without the registry
    writes bare records, and the "schema id" you read from them is
    nonsense (one message in the sample topic gives `1328362041`).

