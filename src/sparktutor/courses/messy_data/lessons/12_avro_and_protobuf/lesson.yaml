    ## Why a 0 Comes Back as NULL

    Decode three payments with the defaults, then with
    `emit.default.values`:

    ```python
    from_protobuf("value", "shop.Payment", binaryDescriptorSet=desc)
    ```

    ```
    +----------+--------+------------+------+-------------+------+
    |payment_id|order_id|amount_cents|method|        flags|  note|
    +----------+--------+------------+------+-------------+------+
    |       P-1|     O-1|        1250|  CARD|[fraud_check]|thanks|
    |       P-2|     O-2|        NULL|  CASH|           []|  NULL|
    |       P-3|    NULL|         500|  NULL|           []|      |
    +----------+--------+------------+------+-------------+------+
    ```

    ```python
    from_protobuf("value", "shop.Payment", options={"emit.default.values": "true"},
                  binaryDescriptorSet=desc)
    ```

    ```
    +----------+--------+------------+------------------+-------------+------+
    |payment_id|order_id|amount_cents|            method|        flags|  note|
    +----------+--------+------------+------------------+-------------+------+
    |       P-1|     O-1|        1250|              CARD|[fraud_check]|thanks|
    |       P-2|     O-2|           0|              CASH|           []|  NULL|
    |       P-3|        |         500|METHOD_UNSPECIFIED|           []|      |
    +----------+--------+------------+------------------+-------------+------+
    ```

    Row by row:

    - **`amount_cents` 0 (P-2) and `order_id` `""` (P-3)** were not on
      the wire, so by default Spark returns NULL. With
      `emit.default.values` they come back as `0` and `""`.
    - **`method` `METHOD_UNSPECIFIED` (P-3)** is the zero enum value:
      NULL by default, the name with the option. That is why well-made
      proto3 enums start with an `..._UNSPECIFIED = 0` value: it lets
      "the producer did not say" be told apart from a real choice. Map
      it to NULL yourself after decoding (`F.nullif`).
    - **`note` is declared `optional`**, so presence is tracked: P-3's
      `""` comes back as `""` and P-2's unset note stays NULL, with or
      without the option.
    - **`flags` is `repeated`**: an empty list is `[]`, never NULL.

    Which is right? If NULL must mean "unknown", the default is right
    for `optional` fields only. For plain proto3 fields, the wire format
    cannot say "unknown", so `emit.default.values` gives you the
    producer's actual value (a free order is 0 cents, not an unknown
    amount). Decide per topic, and write the decision down.

