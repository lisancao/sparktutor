    ## Avro Bytes in a Column

    In a Kafka topic, each message value is **one Avro record with no
    header**: no magic bytes, no schema, just the values. Spark decodes
    such a column with `from_avro(col, writer_schema_json)` and encodes
    with `to_avro(struct, schema_json)`:

    ```python
    V1 = json.dumps({"type": "record", "name": "Order", "namespace": "shop", "fields": [
        {"name": "order_id", "type": "string"}, {"name": "user_id", "type": "long"},
        {"name": "amount", "type": "double"}]})

    rows = spark.createDataFrame([("O-1", 7, 12.5), ("O-2", -1, 0.0)],
        "order_id STRING NOT NULL, user_id BIGINT NOT NULL, amount DOUBLE NOT NULL")
    b = rows.select(to_avro(F.struct("order_id", "user_id", "amount"), V1).alias("value"))
    ```

    ```
    +----------------------------------------+
    |value                                   |
    +----------------------------------------+
    |[06 4F 2D 31 0E 00 00 00 00 00 00 29 40]|
    |[06 4F 2D 32 01 00 00 00 00 00 00 00 00]|
    +----------------------------------------+
    ```

    Read the first one byte by byte:

    - `06`: the string length. Avro writes `int` and `long` in
      **zigzag** varint form, which maps 0, -1, 1, -2, 2, ... to 0, 1, 2,
      3, 4, ..., so 3 becomes 6.
    - `4F 2D 31`: `O-1` in UTF-8.
    - `0E`: the long 7, zigzagged to 14. In the second row, -1 is `01`.
    - `00 00 00 00 00 00 29 40`: the double 12.5, 8 bytes little-endian.

    No field names, no types, no lengths for fixed-size values. A
    nullable field adds one byte in front of its value, the union
    branch: with nullable columns and the default schema, the same row is
    `00 06 4F 2D 31 00 0E ...`. Without a schema argument, `to_avro`
    derives one from the Spark type.

    `from_avro("value", V1)` turns the bytes back into
    `{O-1, 7, 12.5}`. In SQL (4.0):

    ```sql
    SELECT o.order_id, o.amount FROM (
      SELECT from_avro(value, '<schema json>', map('mode', 'PERMISSIVE')) AS o FROM t)
    ```

