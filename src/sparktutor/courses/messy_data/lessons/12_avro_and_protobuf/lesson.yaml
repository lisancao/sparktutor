    ## Adding the Modules

    Avro and Protobuf support ship with Apache Spark but are not on the
    default classpath; each is a separate module (a jar). Without them:

    ```python
    spark.read.format("avro").load(path)
    ```

    ```
    AnalysisException: Failed to find data source: avro. Avro is built-in
    but external data source module since Spark 2.4. Please deploy the
    application as per the deployment section of Apache Avro Data Source
    Guide.
    ```

    (In 4.2.0 that message has no named error condition yet; it is
    `_LEGACY_ERROR_TEMP_1139`.) The functions fail with named
    conditions:

    ```
    [AVRO_NOT_LOADED_SQL_FUNCTIONS_UNUSABLE] Cannot call the TO_AVRO SQL
    function because the Avro data source is not loaded.

    [PROTOBUF_NOT_LOADED_SQL_FUNCTIONS_UNUSABLE] Cannot call the
    FROM_PROTOBUF SQL function because the Protobuf data source is not
    loaded.
    ```

    Outside SparkTutor, add the modules when you start Spark. The
    Scala version (`_2.13`) and the Spark version (`4.2.0`) must match
    your installation:

    ```bash
    spark-submit --packages org.apache.spark:spark-avro_2.13:4.2.0,org.apache.spark:spark-protobuf_2.13:4.2.0 job.py
    pyspark --packages org.apache.spark:spark-avro_2.13:4.2.0
    ```

    or in code, before the session starts:

    ```python
    spark = (SparkSession.builder
             .config("spark.jars.packages", "org.apache.spark:spark-avro_2.13:4.2.0")
             .getOrCreate())
    ```

    `--packages` downloads the jar from Maven Central (and its
    dependencies) the first time. The Protobuf module bundles a shaded
    copy of the Protobuf Java library, so it needs nothing else.

    Inside SparkTutor, the first line of an exercise asks for them:

    ```python
    # spark-connectors: avro, protobuf
    ```

    and the tutor passes the two jars to `spark-submit`. The exercise
    in this lesson starts with that line.

    In Python the functions live in their own modules:

    ```python
    from pyspark.sql.avro.functions import from_avro, to_avro
    from pyspark.sql.protobuf.functions import from_protobuf, to_protobuf
    ```

    and since 4.0 they are SQL functions too (`from_avro`, `to_avro`,
    `schema_of_avro`, `from_protobuf`, `to_protobuf`).

