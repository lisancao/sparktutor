    ## Protobuf: Schemas Are Descriptors

    A Protobuf schema is a `.proto` file. `data/messy/binary/schemas/payments.proto`:

    ```protobuf
    syntax = "proto3";
    package shop;

    enum Method { METHOD_UNSPECIFIED = 0; CARD = 1; CASH = 2; GIFT_CARD = 3; }

    message Payment {
      string payment_id = 1;
      string order_id = 2;
      int64 amount_cents = 3;
      Method method = 4;
      repeated string flags = 5;
      optional string note = 6;
    }
    ```

    Spark does not read `.proto` text. It needs the compiled form, a
    **descriptor set** (a `FileDescriptorSet`, itself a Protobuf
    message). `protoc` makes one:

    ```bash
    protoc --include_imports --descriptor_set_out=payments.desc payments.proto
    ```

    (`--include_imports` matters as soon as your `.proto` imports
    another, such as `google/protobuf/timestamp.proto`.) The sample data
    ships that file as `schemas/payments.desc`. There are three ways to
    hand a schema to `from_protobuf`:

    ```python
    from_protobuf("payload", "shop.Payment", "data/messy/binary/schemas/payments.desc")
    from_protobuf("payload", "shop.Payment", binaryDescriptorSet=desc_bytes)   # 3.5
    from_protobuf("payload", "com.example.protos.Payment")   # a compiled Java class
    ```

    - **A descriptor file path.** In PySpark the file is read by your
      Python driver process (`open(path, "rb")`), so it must be a local
      path on the driver, not an `s3://` URL.
    - **The bytes**, if you fetch the descriptor from a registry or
      build it in code.
    - **A Java class** from a jar on the classpath, compiled with
      Protobuf shaded to `org.sparkproject.spark_protobuf.protobuf.*`
      (the docstring points to a helper project for that). Rarely worth
      it from Python.

    The message name can be the full name (`shop.Payment`) or, when it
    is unique, the short one (`Payment`). A name that is not in the
    descriptor fails at analysis:
    `[PROTOBUF_MESSAGE_NOT_FOUND] Unable to locate Message shop.Pay in
    Descriptor.`

    Without `protoc`, build the descriptor set in Python with the
    `protobuf` package (installed with `pyspark[connect]`):

    ```python
    from google.protobuf import descriptor_pb2
    FD = descriptor_pb2.FieldDescriptorProto

    fds = descriptor_pb2.FileDescriptorSet()
    f = fds.file.add(name="payments.proto", package="shop", syntax="proto3")
    m = f.message_type.add(name="Payment")
    m.field.add(name="payment_id", number=1, type=FD.TYPE_STRING, label=FD.LABEL_OPTIONAL)
    m.field.add(name="amount_cents", number=3, type=FD.TYPE_INT64, label=FD.LABEL_OPTIONAL)
    # ... one line per field; an enum is f.enum_type.add(...)
    desc_bytes = fds.SerializeToString()
    ```

    That is handy for tests, as long as it matches what the producers
    compiled; in production, take the producers' descriptor.

