    ## Limits to Know Now

    - **Declarative Pipelines**: on 4.2.0 a pipeline that reads a Python
      data source finishes its flows and then `spark-pipelines` exits
      with status 1 (SPARK-59135, fixed in 4.4.0). Use Python data
      sources from scripts and jobs for now; this course does.
    - **Built-in names are taken**: registering a Python source named
      `json`, `parquet` or another built-in name fails with
      `DATA_SOURCE_ALREADY_EXISTS`. "Packaging, Registration, Testing and Debugging" covers naming and
      overriding.
    - **Python speed**: every row passes through Python. For large reads,
      yielding PyArrow batches instead of tuples is much faster
      ("Types, Arrow and Performance"), and filter pushdown ("Filter Pushdown") avoids producing rows
      that would be thrown away.

