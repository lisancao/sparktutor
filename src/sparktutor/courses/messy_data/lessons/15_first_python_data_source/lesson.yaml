    ## Where Each Piece Runs

    Your script defines the classes, but most of the methods do not run
    in your script's Python process. Spark starts separate Python worker
    processes and sends them your objects by pickling them:

    | When | Where | What runs |
    |------|-------|-----------|
    | `register(...)` | your script | the class is pickled and handed to Spark |
    | `.load()` | a Python worker started by Spark | `DataSource(options)` and `schema()` |
    | first action (`count`, `show`, `collect`) | a Python worker | `reader(schema)`, `reader.__init__`, `partitions()`; then the reader and partitions are pickled |
    | each task | a Python worker on an executor | `read(partition)` on an unpickled copy of the reader |

    Printing `os.getpid()` from each method shows different process ids
    from your script's. Three consequences:

    - **Everything on `self` must pickle.** A reader that keeps a lock or
      a socket fails at the first action with `PYTHON_DATA_SOURCE_ERROR`
      ("Failed to initialize Python data source reader ... cannot pickle
      'socket' object"). Keep only plain values (strings, numbers,
      lists, dicts) on `self`, and open connections, files and clients
      inside `read()`.
    - **Imports for `read()` belong inside `read()`** (or at the top of
      a module that every worker can import). The class is pickled by
      value because it is defined in your `__main__` script, so the
      workers do not need your file on disk.
    - **Changing a global variable in `read()` changes nothing in your
      script.** Each task works on its own copy. Results come back only
      as rows.

    In local mode, anything a method prints to `stderr` shows up in your
    console, which is handy while learning. On a cluster it goes to the
    executor logs; "Packaging, Registration, Testing and Debugging" shows how to collect worker logs properly.

