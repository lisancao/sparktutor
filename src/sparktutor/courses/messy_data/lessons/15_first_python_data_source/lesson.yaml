    ## Partitions: Splitting the Work

    `partitions()` returns a list of `InputPartition` objects. Spark
    runs **one task per partition**, in parallel, and calls
    `read(partition)` once in each task. A partition is a small, plain
    description of a share of the work ("ids 0 to 3", "these four
    files", "page 2 of the API"), not the data itself.

    ```python
    from pyspark.sql.datasource import InputPartition

    class RangePartition(InputPartition):
        def __init__(self, start, end):
            self.start = start
            self.end = end
    ```

    The planning logic is plain Python, so keep it in a function you
    can test on its own:

    ```python
    def plan_ranges(rows, partitions):
        n = min(partitions, rows)
        if n <= 0:
            return []
        base, extra = divmod(rows, n)
        ranges, start = [], 0
        for i in range(n):
            end = start + base + (1 if i < extra else 0)
            ranges.append((start, end))
            start = end
        return ranges

    print(plan_ranges(10, 3), plan_ranges(2, 5), plan_ranges(0, 2))
    ```

    ```
    [(0, 4), (4, 7), (7, 10)] [(0, 1), (1, 2)] []
    ```

    Rules Spark enforces:

    - `partitions()` must return a **list** (a generator fails with
      `DATA_SOURCE_TYPE_MISMATCH`: "Expected 'partitions' to return a
      list") of `InputPartition` instances.
    - **An empty list does not mean "no tasks".** Spark replaces it with
      `[InputPartition(None)]` and calls `read()` once with that. Your
      `read()` must handle a partition that is not one of yours, usually
      by yielding nothing.
    - If you do not override `partitions()`, you get that same single
      `InputPartition(None)`, so everything runs in one task.

