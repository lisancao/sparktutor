    ## The Smallest Data Source

    ```python
    from pyspark.sql.datasource import DataSource, DataSourceReader

    class Hello(DataSource):
        def schema(self):
            return "greeting string"

        def reader(self, schema):
            return HelloReader()

    class HelloReader(DataSourceReader):
        def read(self, partition):
            yield ("hello",)
            yield ("world",)

    spark.dataSource.register(Hello)
    spark.read.format("Hello").load().show()
    ```

    ```
    +--------+
    |greeting|
    +--------+
    |   hello|
    |   world|
    +--------+
    ```

    Three things happened:

    - `schema()` told Spark the columns. A DDL string like
      `"id long, label string"` is the easy form; a `StructType` works
      too.
    - `reader(schema)` returned the object that produces rows.
    - `read(partition)` yielded rows as tuples, in schema order. It may
      also yield `Row(...)` objects (matched to columns by name) or
      PyArrow `RecordBatch`es ("Types, Arrow and Performance"). A `dict` is not accepted: it
      fails with `DATA_SOURCE_INVALID_RETURN_TYPE`.

    The format name is `name()`, which defaults to the class name, and
    Spark matches it case-insensitively: `format("hello")` and
    `format("HELLO")` work too. Real sources override `name()` with a
    short lowercase name.

