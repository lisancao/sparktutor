    ## Why Not Just Use Python?

    You could read anything with plain Python on the driver and call
    `spark.createDataFrame(rows)`. That is fine for a hundred rows. It
    breaks down because:

    - All the data passes through one process (the driver), so it does
      not scale and can run out of memory.
    - Nothing runs in parallel: one connection, one file at a time.
    - It is not reusable: every notebook repeats the code, and SQL users
      cannot use it at all.
    - It cannot stream ("Streaming Readers and Writers") or be a write target ("Writers").

    A data source moves the reading into Spark tasks on the executors,
    and gives it a name everyone can use.

