    ## Testing Without Spark

    Every piece except `register` is ordinary Python, so you can test it
    in milliseconds with no session: build the options and schema
    yourself, call `partitions()` and `read()` the way Spark would, and
    check that the reader pickles.

    ```python
    import pickle
    from pyspark.sql.datasource import CaseInsensitiveDict
    from pyspark.sql.types import LongType, StringType, StructField, StructType

    SCHEMA_STRUCT = StructType([StructField("id", LongType()), StructField("label", StringType())])

    def read_without_spark(options):
        reader = CounterReader(CaseInsensitiveDict(options), SCHEMA_STRUCT)
        return [row for p in reader.partitions() for row in reader.read(p)]

    print(read_without_spark({"rows": "3", "partitions": "2"}))
    pickle.loads(pickle.dumps(CounterReader(CaseInsensitiveDict({"rows": "3"}), SCHEMA_STRUCT)))
    ```

    ```
    [(0, 'row-0'), (1, 'row-1'), (2, 'row-2')]
    ```

    Two details:

    - Pass a `CaseInsensitiveDict`, as Spark does, so the test sees the
      same lowercase keys and string values.
    - Build the `StructType` from type objects. Parsing a DDL string
      (`StructType.fromDDL`, `udf("...")`) needs a running session and
      fails with `SESSION_OR_CONTEXT_NOT_EXISTS` without one.

    These tests do not prove that Spark accepts your rows (types are
    checked when Spark converts them), so keep one small end-to-end read
    as well. The exercise does both.

