    ## Exercise: The counter Source

    Build the `counter` source from this lesson, piece by piece. The
    harness first tests your code as plain Python, **before any Spark
    session exists**, then reads it through Spark.

    1. `plan_ranges(rows, partitions)`: split `range(rows)` into at most
       `partitions` contiguous `(start, end)` pairs whose sizes differ by
       at most one, earlier ranges larger, none empty.
    2. `CounterDataSource`: `name()` (a classmethod) returns
       `"counter"`, `schema()` returns `SCHEMA`, `reader(schema)` returns
       a `CounterReader`.
    3. `CounterReader.__init__(options, schema)`: read `rows` (required),
       `partitions` (default `"2"`) and `prefix` (default `"row"`) with
       the `_whole_number` helper, remember the schema's column names,
       and raise `ValueError` for a column other than `id` and `label`.
    4. `partitions()`: one `RangePartition` per range from
       `plan_ranges`.
    5. `read(partition)`: yield one tuple per id, in the schema's column
       order; yield nothing for a partition that is not a
       `RangePartition`.
    6. `read_without_spark(options)`: create a reader with
       `CaseInsensitiveDict(options)` and `SCHEMA_STRUCT`, and return all
       rows from all its partitions.

    The harness checks the ranges, plain-Python reads, option errors,
    pickling, then through Spark: schema, rows, a 4/3/3 split across
    three partitions, case-insensitive names, `prefix`, user schemas
    (fewer and reordered columns), `rows` 0, the error for a missing
    option, and a SQL view.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "plan_ranges: n = min(partitions, rows); base, extra = divmod(rows, n); the first `extra` ranges get one more row. read(): if not isinstance(partition, RangePartition): return; then values = {'id': i, 'label': f'{self.prefix}-{i}'} and yield tuple(values[c] for c in self.columns)."

