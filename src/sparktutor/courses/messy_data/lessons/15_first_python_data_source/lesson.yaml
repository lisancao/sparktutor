    ## Summary

    In this lesson you learned:

    - **The Python Data Source API** (4.0, SPARK-44076): a `DataSource`
      (name, schema, reader), a `DataSourceReader` (partitions, read) and
      `InputPartition`s, registered with `spark.dataSource.register`
    - **`name()`** is a classmethod, defaults to the class name, and is
      matched case-insensitively; registered sources work in SQL with
      `USING name OPTIONS (...)`
    - **Options** are strings with lowercase keys: convert and validate
      them in the reader with messages that name the option
    - **Partitions** are small plain descriptions of work, one task each;
      `partitions()` returns a list, and an empty list still means one
      `read(InputPartition(None))` call
    - **Where code runs**: `schema()` at `load()`, the reader and
      `partitions()` at the first action, `read()` in the tasks, all in
      Python workers; everything on `self` must pickle
    - **User schemas** skip `schema()`; build rows in the order of the
      schema you are given
    - **Test without Spark** with `CaseInsensitiveDict` and a
      `StructType` built from type objects
    - **Errors**: `PYTHON_DATA_SOURCE_ERROR` from planning (at `load()`
      or the first action), `PYTHON_EXCEPTION` from `read()`

    Next: **Plans, Partitions and Caching**, where you learn to read
    what Spark plans to do with all of these sources, and why.