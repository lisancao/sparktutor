    ## Honouring the User's Schema

    `reader(schema)` receives the schema Spark will use. Usually that is
    what your `schema()` returned, but a user can pass their own:

    ```python
    (spark.read.format("counter")
          .schema("label string, id long")
          .option("rows", 2)
          .load()
          .show())
    ```

    ```
    +-----+---+
    |label| id|
    +-----+---+
    |row-0|  0|
    |row-1|  1|
    +-----+---+
    ```

    When the user supplies a schema, Spark does **not** call your
    `schema()` at all; it passes the user's schema straight to
    `reader()`. Spark does not reorder your values either. If `read()`
    yielded `(id, label)` tuples here, Spark would put `"row-0"` into the
    `id` column and the task would fail with `PYTHON_EXCEPTION` wrapping
    `ArrowInvalid: Could not convert 'row-0' with type str: tried to
    convert to int64`; with two columns of the same type you would get
    swapped values and no error at all. That is why `CounterReader`
    builds each row from `self.columns`, in the order the schema asks
    for. Check the names
    too, and fail with a clear message for a column you do not produce,
    instead of quietly returning `None`.

    A user schema is also how you skip work: a schema with fewer columns
    lets `read()` compute less. "Reading a Custom File Format, in Parallel" uses this to avoid opening files
    when only metadata is asked for.

