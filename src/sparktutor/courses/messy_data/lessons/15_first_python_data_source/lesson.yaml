    ## Options Are Strings in a Case-Insensitive Dict

    Everything after `format(...)` that you pass with `.option(key,
    value)` arrives in `self.options`, a `CaseInsensitiveDict` whose
    **keys are lowercased** and whose **values are strings**, whatever
    type you passed:

    ```python
    from pyspark.sql.datasource import CaseInsensitiveDict

    opts = CaseInsensitiveDict({"Rows": "5"})
    print(opts["rows"], opts.get("ROWS"), "rows" in opts, opts.get("prefix", "row"))
    ```

    ```
    5 5 True row
    ```

    `.option("rows", 10)` therefore gives you `"10"`, and
    `.option("enabled", True)` gives you `"true"`. Convert and check
    every option yourself, and raise `ValueError` with a message that
    names the option and the value you got. The user sees that message
    (inside Spark's error), so it is your source's user interface.

