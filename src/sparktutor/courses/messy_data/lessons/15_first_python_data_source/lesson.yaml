    ## What You'll Learn

    So far you have read messy data with Spark's built-in sources and
    then parsed it with functions and UDFs. That works until the data
    lives somewhere Spark cannot list or open by itself: a file format
    with no reader, an internal API, a device, a queue. For those, Spark
    4.0 added the **Python Data Source API** (SPARK-44076): you write a
    few small Python classes, register them, and from then on
    `spark.read.format("yourname").load()` works like any built-in
    source, in parallel, from DataFrames and SQL.

    This lesson builds the smallest useful data source, slowly, and
    shows exactly what Spark does with each piece. The data source lessons
    that follow build on the same shape, so the habits you form here (validate
    options early, plan partitions as plain data, test without Spark)
    pay off later.

    By the end of this lesson you will be able to:

    - Write a `DataSource`, a `DataSourceReader` and an `InputPartition`
    - Register a source and read it with `format(...)` and from SQL
    - Handle options (always strings, keys case-insensitive) and
      validate them with clear messages
    - Split the work into partitions that run as parallel tasks
    - Explain which method runs where, and why everything must pickle
    - Honour a schema the user passes with `.schema(...)`
    - Test the reader as plain Python, without a Spark session
    - Recognize the error conditions and when each one appears

