    ## From SQL

    A registered Python source is available to SQL in the same session:

    ```python
    spark.sql("""
        CREATE OR REPLACE TEMPORARY VIEW five
        USING counter OPTIONS (rows '5', prefix 'n')
    """)
    spark.sql("SELECT * FROM five WHERE id >= 3").show()
    ```

    ```
    +---+-----+
    | id|label|
    +---+-----+
    |  3|  n-3|
    |  4|  n-4|
    +---+-----+
    ```

    Registration lasts for the session. A new session (or a new
    `spark-submit`) must register again; "Packaging, Registration, Testing and Debugging" packages a source so
    Spark finds it automatically.

