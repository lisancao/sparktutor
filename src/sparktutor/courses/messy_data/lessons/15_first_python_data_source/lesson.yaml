    Think of Spark as a restaurant kitchen and your data source as a new
    supplier. You tell the kitchen three things: the supplier's name (so
    orders can say `format("counter")`), what the deliveries look like
    (the schema), and how to split a big order into boxes (partitions)
    that several cooks can unpack at the same time. Each cook opens one
    box (one `read(partition)` call) and hands over rows.

