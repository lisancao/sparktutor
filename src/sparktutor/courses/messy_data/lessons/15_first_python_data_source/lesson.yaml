    ## When Things Go Wrong

    Errors from a Python data source surface at three different moments,
    with different conditions. Knowing which is which tells you where to
    look:

    | Where the bug is | When it fails | Condition |
    |------------------|---------------|-----------|
    | `DataSource.schema()` (or `__init__`) | at `.load()` (on Spark Connect, when something first needs the schema) | `PYTHON_DATA_SOURCE_ERROR`: "Failed to create Python data source instance" |
    | `reader()`, `reader.__init__` (option checks), pickling the reader | at the first action | `PYTHON_DATA_SOURCE_ERROR`: "Failed to initialize Python data source reader" |
    | `partitions()` | at the first action | `PYTHON_DATA_SOURCE_ERROR`: "Failed to generate Python data source read partitions" |
    | `read()`, or rows that do not fit the schema | while the tasks run | `PYTHON_EXCEPTION`, with your traceback inside |

    For example, a missing required option:

    ```python
    df = spark.read.format("counter").load()   # no error yet
    df.collect()
    ```

    ```
    AnalysisException: [PYTHON_DATA_SOURCE_ERROR] Failed to initialize
    Python data source reader: Traceback (most recent call last):
      ...
    ValueError: option 'rows' is required
    ```

    `load()` succeeded because only `schema()` ran; the reader, which
    checks the options, is created at the first action. Rows of the
    wrong length fail inside the task: `PYTHON_EXCEPTION` wrapping
    `DATA_SOURCE_RETURN_SCHEMA_MISMATCH` ("Expected: 2 columns, Found: 1
    columns"). Always scroll to the last lines of the Python traceback:
    that is your code's error.

