  Output: |
    ## Summary

    - **Cache by content**: `sha2` of exactly what the model sees, with
      the **model version** stored next to it. A rerun pays only for new
      inputs; a new version recomputes everything.
    - **New work** is a left anti join against the cache and the
      dead-letter table for the current version.
    - **Call services from `mapInPandas`** with one client per
      partition, batched requests and a per-task rate limit; the service
      sees `rate x concurrent tasks`. A UDF per row made 232 requests and
      got 216 rate-limit errors; the partition version made 34 and got
      none.
    - **Retry what can heal** (429 with `Retry-After`, 5xx, timeouts,
      per-item retryable errors) with exponential backoff and jitter, a
      timeout on every request and a cap on attempts; send the rest to a
      **dead-letter table** with the error.
    - A timeout means "unknown": an **idempotency key** derived from the
      content makes the retry free.
    - **Write once, then split**: two writes of the same `mapInPandas`
      result call the service twice; a cache is a hint, a file is a
      fact. Never write results from inside the function.
    - On 4.2.0, a plain `@udf` over a Parquet column can hang
      (SPARK-58241, fixed in 4.2.1): turn off
      `spark.sql.execution.arrow.pythonUDF.columnarInput.enabled`, or use
      a pandas UDF or `mapInPandas`. Wrapping the column in an
      expression is not a reliable fix.
    - **`applyInPandas`** runs one model per group, at the price of a
      shuffle and a whole group in memory. Stage-level scheduling (GPUs)
      needs a cluster manager, not local mode.
    - **LLM answers** are validated in Spark with `try_parse_json` and
      `try_variant_get`; invalid answers are dead letters with a reason.

    Next: **Capstone: An Unstructured Ingestion Source and a Catalog
    Pipeline**, the last lesson of the intermediate level, where the
    pieces of this level come together in one source and one pipeline.
