    Think of the service as a translation agency you pay per page. You
    would not send pages one envelope at a time, you would not resend a
    page they already translated because your mailroom lost the receipt,
    and you would keep a binder of finished translations so next month
    you only send the new pages. When the agency says "too busy, try
    later", you wait a bit longer each time instead of hammering their
    door. That is this lesson, with Spark doing the mailroom.

