    ## New Work Is a Left Anti Join

    A **left anti join** keeps the rows on the left that have no match on
    the right: exactly "inputs we have not answered yet".

    ```python
    def new_work(keyed, done, model_version):
        finished = done.filter(F.col("model_version") == model_version).select("key").distinct()
        return keyed.select("key", "text").dropDuplicates(["key"]).join(finished, "key", "left_anti")
    ```

    `done` is the result cache **and** the dead-letter table together:
    an input that failed permanently ("no text") should not be retried
    on every run. When you fix the cause (a new model that handles empty
    text, a bug in the request), delete those dead letters or bump the
    version and they come back as new work.

    On the very first run neither table exists yet, and
    `spark.read.parquet(path)` on a missing folder fails at once with
    `[PATH_NOT_FOUND]`. Catch it and use an empty DataFrame with the
    result schema:

    ```python
    def read_or_empty(path):
        try:
            return spark.read.schema(RESULT_SCHEMA).parquet(path)
        except Exception:
            return spark.createDataFrame([], RESULT_SCHEMA)
    ```

    A table format with a catalog ("Landing Messy Data in Delta Lake")
    removes that dance: create the table once, empty, then `MERGE` into
    it by `key` and `model_version`, which also makes the write itself
    safe to repeat.

