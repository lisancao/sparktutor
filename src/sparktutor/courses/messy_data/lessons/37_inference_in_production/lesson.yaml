    ## One Model per Group: applyInPandas

    Sometimes the model is per group: one forecasting model per store,
    one anomaly threshold per sensor, one classifier per language.
    `groupBy(...).applyInPandas(func, schema)` (3.0) shuffles the rows so
    that each group arrives at one call of your function as **one pandas
    DataFrame**, and your function returns a DataFrame of any length.

    As a tiny example, "train" a keyword model per channel: the three
    most frequent words for each label, from the labelled inbox:

    ```python
    def train_channel(pdf: pd.DataFrame) -> pd.DataFrame:
        rows = []
        for label, g in pdf.groupby("label"):
            words = Counter(w for t in g["text"] for w in re.findall(r"[a-z]+", (t or "").lower())
                            if w not in STOP and len(w) > 2)
            rows.append({"channel": pdf["channel"].iloc[0], "label": label, "tickets": len(g),
                         "top_words": [w for w, _ in words.most_common(3)]})
        return pd.DataFrame(rows)

    models = train.groupBy("channel").applyInPandas(
        train_channel, "channel string, label string, tickets long, top_words array<string>")
    ```

    ```text
    +--------+--------+-------+------------------------------+
    |channel |label   |tickets|top_words                     |
    +--------+--------+-------+------------------------------+
    |chat    |privacy |23     |[data, information, marketing]|
    |chat    |returns |15     |[size, changed, mind]         |
    |chat    |shipping|25     |[not, does, shipping]         |
    ...
    |web_form|warranty|19     |[warranty, one, year]         |
    +--------+--------+-------+------------------------------+
    ```

    The plan shows the price:

    ```text
    +- FlatMapGroupsInPandas [channel#1], train_channel(...), [channel#25, label#26, tickets#27L, top_words#28]
       +- Sort [channel#1 ASC NULLS FIRST], false, 0
          +- Exchange hashpartitioning(channel#1, 4), ENSURE_REQUIREMENTS, [plan_id=198]
    ```

    - **A shuffle and a sort** bring each group together.
    - **With the `pd.DataFrame -> pd.DataFrame` form, a whole group lives
      in memory at once**: the PySpark docstring warns of "the potential
      OOM risk if data is skewed and certain groups are too large to fit
      in memory". One giant store (or the `NULL` group) can sink the
      job; check group sizes first with `groupBy(...).count()`.
    - **4.1 added an iterator form** (`Iterator[pd.DataFrame] ->
      Iterator[pd.DataFrame]`, or with the key first,
      `(key, Iterator[pd.DataFrame])`), which receives each group in Arrow
      batches. With `maxRecordsPerBatch` set to 25, the chat group
      (84 tickets) arrived as batches of `[25, 25, 25, 9]` instead of one
      DataFrame of 84. Use it when your per-group work can be done
      incrementally (running sums, streaming updates to a model); a
      model that needs all rows at once still needs them in memory.
    - The function sees the grouping key in its DataFrame; the result
      columns are matched by name, as with `mapInPandas`.
    - Store the per-group models (as here, as rows) and apply them with a
      join; do not retrain them in every scoring job.

