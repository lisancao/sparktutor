    ## Retries You Do Not Write: Task Retries

    Your retry loop handles the service. Spark has its own retries one
    level up: when a task fails (a Python exception you did not catch, a
    lost executor), the scheduler runs the **whole partition** again,
    from the first row, up to `spark.task.maxFailures` times (4 by
    default on a cluster). Speculative execution may also run a slow
    task twice at the same time. Local mode does not retry tasks at all
    (a failed task fails the job) unless the master is written
    `local[N,F]`.

    So the requests of a partition can be sent again even when your code
    is perfect. The design above already survives it:

    - The **idempotency key** makes repeated requests free at the
      service.
    - The **output is only written through Spark** (the staging write
      and the appends), which commits a task's output only when the task
      succeeds. Never write results to the cache *from inside*
      `mapInPandas`: a task that fails halfway leaves half its rows
      behind, and its retry writes them again.
    - **Catch what you expect** (`RetryableError`, `PermanentError`) and
      turn it into a row; let only truly unexpected errors fail the
      task.

    "Determinism, Retries and Fault Injection" in the advanced level
    forces these retries on purpose and proves the output is identical.

