    ## Rate Limits Are per Task; Budgets Are Global

    A limiter inside `mapInPandas` limits **one task**. The service sees
    the sum over every task running at the same time:

    ```text
    total rate = rate per task x tasks running at once
    ```

    The exercise repartitions the work to `NUM_TASKS = 4` and allows
    `REQUESTS_PER_SECOND = 2.0` per task: at most 8 requests per second
    against a service that allows 16, with headroom for retries. On a
    cluster, "tasks running at once" is the number of partitions or the
    number of executor cores, whichever is smaller, so fix it
    explicitly with `repartition(n)` (or `coalesce(n)`) right before the
    calls, and derive the per-task rate from the service's budget.

    The `RateLimiter` in the exercise is the simplest token bucket: one
    request every `1 / rate` seconds. When the service still says 429,
    respect its `Retry-After` header instead of your own backoff: it
    knows its load better than you do.

    Even with a limit, a retry storm can happen if every task retries on
    the same schedule. That is what **jitter** prevents, next.

