    ## Structured Answers From an LLM (Ungraded)

    An LLM extraction job is the same pipeline with a prompt in the
    request and JSON in the answer: content key over **prompt template
    version plus input**, model version in the cache, batched calls with
    retries, and a dead-letter table. The new part is that the answer is
    text that *should* be JSON and often is not. Validate it in Spark,
    after the call, with the VARIANT functions from "VARIANT Basics:
    Profiling and Nested Data" (all 4.0):

    ```python
    LABELS = ["shipping", "returns", "warranty", "privacy"]
    v = answers.withColumn("v", F.try_parse_json("answer"))
    label = F.try_variant_get("v", "$.label", "string")
    checked = v.select("ticket_id",
        F.lower(F.trim(label)).alias("label"),
        F.try_variant_get("v", "$.order_id", "bigint").alias("order_id"),
        F.when(F.col("v").isNull(), "not json")
         .when(label.isNull(), "no label")
         .when(~F.lower(F.trim(label)).isin(LABELS), "unknown label")
         .alias("problem"))
    ```

    ```text
    +---------+--------+--------+-------------+
    |ticket_id|label   |order_id|problem      |
    +---------+--------+--------+-------------+
    |I0001    |warranty|NULL    |NULL         |
    |I0002    |NULL    |NULL    |not json     |
    |I0003    |warranty|1301    |NULL         |
    |I0004    |billing |1301    |unknown label|
    |I0005    |NULL    |77      |no label     |
    |I0006    |NULL    |NULL    |not json     |
    +---------+--------+--------+-------------+
    ```

    The six answers were: valid JSON; `Sure! Here is the JSON:
    {"label": "shipping"}`; `{"label": "Warranty ", "order_id":
    "1301"}`; a label outside the list; JSON without a label; and no
    answer at all (NULL).

    - `try_parse_json` returns NULL instead of failing on text that is
      not JSON, which is how chatter around the JSON becomes a countable
      problem.
    - `try_variant_get` casts on the way out and returns NULL when it
      cannot: the string `"1301"` became the number 1301, while
      `"1301x"` gives NULL. Its strict sibling `variant_get` fails the
      job with `[INVALID_VARIANT_CAST] The variant value "1301x" cannot
      be cast into "BIGINT". Please use try_variant_get instead.`
    - `schema_of_variant(v)` per row (`OBJECT<label: STRING, order_id:
      STRING>` for `I0003`) is a quick way to profile what the model
      actually returns across thousands of answers.
    - Rows with a `problem` go to the dead-letter table **with the
      answer**, and can be retried with a repair prompt ("your previous
      answer was not valid JSON; answer only with ..."). Count them per
      model version: the rate of invalid answers is a quality metric of
      the model.

