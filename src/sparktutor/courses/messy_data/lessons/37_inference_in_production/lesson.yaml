    ## One Client per Partition, Not a Request per Row

    The obvious way to call a service is a UDF: one row in, one request
    out. Here it is against the fake service, with a fresh connection
    per call and no rate limit, over the 232 inputs on `local[4]`:

    ```python
    @F.udf("string")
    def classify_one(key, text):
        c = ServiceClient(url)
        try:
            r = c.classify([{"key": key, "text": text}], MODEL_VERSION, idempotency_key(MODEL_VERSION, [key]))
            return r[0].get("label") or r[0].get("error")
        except (RetryableError, PermanentError) as e:
            return f"ERROR {e}"
        finally:
            c.close()
    ```

    Counting at the service afterwards: **232 requests, 216 of them
    answered 429** (Too Many Requests), and 221 rows came back as errors
    (the 216 plus the 5 texts without letters). Four tasks firing requests as fast as they can blew through the
    service's limit almost at once, and adding retries to this UDF would
    only make it worse (every row retrying on its own schedule). The
    same work through `mapInPandas` with a client, a rate limiter and
    batches of 10 per partition made **34 requests and got no 429 at
    all**. What the partition-level function buys:

    - **One connection per task**, reused (keep-alive): no TCP and TLS
      handshake per row, and one place to hold authentication.
    - **Batching**: 10 items per request instead of 1. Most model
      APIs accept lists; the per-request overhead dominates small
      inputs.
    - **A rate limit you control**: the limiter lives in the task, so
      it sees every request the task makes.
    - **Retries with a view of the whole batch**: re-send only the items
      that failed, together.

    The client is created **inside** the function, at the top. As
    "Running a Model over Your Data with pandas UDFs" showed, a global
    in your script is reset for every task anyway, and a client object
    created on the driver cannot be pickled with its open socket.

