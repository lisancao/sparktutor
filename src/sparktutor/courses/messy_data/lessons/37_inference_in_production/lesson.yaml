    ## Content Keys: Never Pay Twice for the Same Input

    The first rule of expensive inference: **the cache key is the
    content**, not the row id. Two tickets with the same text get the
    same answer, so hash the text:

    ```python
    keyed = tickets.withColumn("key", F.sha2(F.coalesce(F.col("text"), F.lit("")), 256))
    print(tickets.count(), keyed.select("key").distinct().count())
    keyed.groupBy("key").agg(F.count("*").alias("tickets"), F.first("text").alias("text")) \
         .filter("tickets > 1").select("tickets", "text").show()
    ```

    ```text
    240 232
    +-------+----+
    |tickets|text|
    +-------+----+
    |      3|    |
    |      3|  ?!|
    |      2| ...|
    |      4|NULL|
    +-------+----+
    ```

    240 tickets, 232 distinct inputs. Here the duplicates are junk; in
    a real inbox they are template e-mails, retries of a web form, the
    same product photo uploaded by many sellers, and the savings are
    large.

    Design points:

    - **Hash exactly what the model sees.** If you clean text before
      sending it, hash the cleaned text; otherwise two inputs that the
      model cannot tell apart get two keys. `coalesce(text, "")` makes
      NULL and empty one input, on purpose (the model gets the same
      thing either way).
    - **Keep the model version next to the key**, not inside it. The
      cache table has `key, model_version, label, ...`; a lookup asks
      for "this key **with this version**". Rolling out `kw-2` then
      recomputes everything without touching the `kw-1` rows, which you
      keep for comparison or rollback.
    - SHA-256 (`sha2(col, 256)`, Spark 1.5) is overkill for collisions
      and cheap; `xxhash64` (3.0) is faster but 64 bits are too few to
      trust as an identity across billions of rows.

