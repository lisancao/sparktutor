    ## Timeouts and Idempotency Keys

    A timeout is not a failure. It means **"I don't know"**: the request
    may never have arrived, or the service may have done the work and
    the answer got lost. If the work has a cost (a paid model call) or a
    side effect (an e-mail sent, a ticket created), a blind retry can do
    it twice.

    An **idempotency key** is an id the client sends with a request so
    the service can recognize a repeat. The exercise derives it from the
    model and the sorted item keys, so a retry of the same items carries
    the same key:

    ```python
    def idempotency_key(model, keys):
        return hashlib.sha256((model + "|" + ",".join(sorted(keys))).encode()).hexdigest()
    ```

    The fake service stores each answer under its key and returns the
    stored answer for a repeat, without running the model again. The
    harness checks the service's own count: after a run with several
    timeouts, the model ran **exactly once** per input. Many real APIs
    accept an `Idempotency-Key` header for exactly this reason; when a
    service does not, make the side effect itself idempotent (an upsert
    keyed by your content key instead of an insert).

    Derive the key from the **content**, never from `uuid4()` per call
    and never from the task attempt: a key that changes on retry is not
    an idempotency key.

