    ## GPUs and Resource Profiles (Mention Only)

    A local model on a GPU needs executors with GPUs and tasks that ask
    for them. Spark's **stage-level scheduling** lets one stage of a job
    request different resources from the rest: build a
    `ResourceProfile` with `ResourceProfileBuilder`,
    `ExecutorResourceRequests` and `TaskResourceRequests` (for example
    `TaskResourceRequests().cpus(2).resource("gpu", 1)`), and pass it as
    `profile=` to `mapInPandas` or `mapInArrow` (both accept it in 4.2).

    It needs a cluster manager. In local mode on 4.2.0 both forms fail
    at once:

    ```text
    SparkException: TaskResourceProfiles are only supported for Standalone, Yarn and
    Kubernetes cluster for now when dynamic allocation is disabled.

    SparkException: ResourceProfiles are only supported on YARN and Kubernetes and
    Standalone with dynamic allocation enabled.
    ```

    (the first for a task-only profile, the second for one that also
    asks for executor resources). On a real cluster you also need GPU
    discovery (`spark.executor.resource.gpu.amount` and a discovery
    script) and a model that pins itself to the GPU it was assigned
    (`TaskContext.get().resources()["gpu"]`). For a remote service, none
    of this applies: the service owns the hardware, and your job owns the
    rate.

