    ## What You'll Learn

    "Running a Model over Your Data with pandas UDFs" got a model onto
    the executors: the iterator form to load it once per task,
    `mapInPandas` for whole-batch scoring, and a list of surprises (a
    filter on a UDF's output runs the UDF twice, a global cache in your
    script resets for every task, `mapInPandas` drops extra columns
    silently, nullable integers arrive as `float64`). Its LLM sketch
    ended with what it left out. This lesson is that list.

    In production the model is often **not on the executor at all**: it
    is a service behind an HTTP API (a hosted model, an LLM provider, an
    internal classifier, a geocoder). Every call costs time or money,
    the service fails in several different ways, and Spark, as you saw,
    may run your code more than once. The job has to stay correct and
    cheap anyway.

    By the end of this lesson you will be able to:

    - Cache results by a **content hash** and the **model version**, so
      a rerun only pays for new inputs and a new model recomputes
      everything
    - Find new work with a **left anti join** against a result table and
      a dead-letter table
    - Call a service from `mapInPandas` with **one client per
      partition**, **batched requests** and a **client-side rate
      limit**, and explain with numbers why a UDF per row is worse
    - Retry the failures that can heal (429, 5xx, timeouts, per-item
      "busy") with **exponential backoff and jitter**, and send the ones
      that cannot to a **dead-letter table**
    - Use an **idempotency key** so that a retry after a timeout is not
      paid twice, and write results **once** so Spark's re-evaluation is
      not paid twice either
    - Avoid a 4.2.0 hang with plain Python UDFs over Parquet columns
      (SPARK-58241)
    - Train or apply one model per group with `applyInPandas`, and say
      what stage-level scheduling (GPUs, resource profiles) can and
      cannot do in local mode
    - Validate structured LLM answers with `try_parse_json` and
      `try_variant_get`

