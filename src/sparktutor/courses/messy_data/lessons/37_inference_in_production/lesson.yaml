    ## Write Once, Then Split

    The results have to go to two places: successes to the cache,
    failures to the dead-letter table. The natural code calls the
    service **twice**, because each write is an action and each action
    runs the plan from the start, including your `mapInPandas`:

    ```python
    results = work.mapInPandas(make_caller(url), RESULT_SCHEMA)
    results.filter("status = 'ok'").write.parquet(cache_dir)          # calls the service
    results.filter("status = 'failed'").write.parquet(dead_dir)       # calls it again
    ```

    Measured against the fake service, the same 232 inputs:

    | Pattern | HTTP requests |
    |---|---|
    | two filtered writes of `results` | 63 |
    | one write to staging, then split the staged copy | 34 |

    The model ran 228 times in both cases only because the idempotency
    key turned the second pass into stored answers. Against a service
    without one, the split writes would have paid twice. This is the
    re-evaluation that "Why Your Model May Run More Than Once" in
    "Running a Model over Your Data with pandas UDFs" warned about and
    "Tuning Python on Spark" measured (a filter on a UDF's output runs
    it twice, every action recomputes uncached Python), one level up:
    **anything expensive must be computed once and stored before you
    branch on it**.

    ```python
    results.write.mode("overwrite").parquet(staging_dir)
    staged = spark.read.parquet(staging_dir)
    staged.filter("status = 'ok'").write.mode("append").parquet(cache_dir)
    staged.filter("status = 'failed'").write.mode("append").parquet(dead_letter_dir)
    ```

    Why not `results.cache()`? A cache is a hint: blocks can be evicted
    under memory pressure, or lost with an executor, and then Spark
    recomputes them silently, calling the service again. A written file
    is a fact. Counting `work` before the call (the exercise does, to
    return how many items it sends) is free: `work` is the input of
    `mapInPandas`, so its plan does not contain the call at all.

