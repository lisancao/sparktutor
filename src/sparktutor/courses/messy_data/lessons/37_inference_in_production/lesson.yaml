    ## Retries: What, How Long, How Often

    Sort every failure into one of two bins before writing any retry
    code:

    - **Retryable**: rate limited (429), server errors (5xx), timeouts,
      connection resets, and items the service marks
      `retryable: true` ("model busy"). They may heal.
    - **Permanent**: bad requests (400, 413, 422), authentication
      errors, and items marked `retryable: false` ("no text"). Retrying
      wastes money and time; record them.

    For the retryable ones, wait longer after each attempt
    (**exponential backoff**) and randomize the wait (**jitter**) so that
    tasks that failed together do not retry together:

    ```python
    def backoff_seconds(attempt, base=0.05, cap=2.0):
        return random.uniform(0, min(cap, base * 2 ** attempt))
    ```

    After `MAX_ATTEMPTS` (4 here, counting the first) an item gives up
    and becomes a failure with its last error. The attempt count goes
    into the output so you can see what the retries cost. From one run
    of the exercise solution:

    ```text
    +------+--------+-----+
    |status|attempts|count|
    +------+--------+-----+
    |failed|       1|    2|
    |failed|       2|    2|
    |    ok|       1|  167|
    |    ok|       2|   45|
    |    ok|       3|   16|
    +------+--------+-----+
    ```

    228 of 232 succeeded, 61 of them only thanks to a retry (busy items,
    and requests whose answer came too late). The 4 failures are the
    texts without letters, the permanent kind: two of them show 2
    attempts because the *whole request* they were in timed out once;
    none was re-sent after the service said "no text".

    Two limits keep retries from hanging a job:

    - A **timeout on every request** (`http.client.HTTPConnection(...,
      timeout=0.5)` in the exercise). Without one, a service that never
      answers holds the task forever.
    - A **cap on attempts** and on the backoff (`cap=2.0` seconds), so a
      partition has a bounded worst case.

