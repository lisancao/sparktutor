    ## The Setup: a Service That Misbehaves

    The data is the support inbox from "Running a Model over Your Data
    with pandas UDFs": 240 tickets in
    `data/messy/support_tickets/inbox/`. The model is a remote
    classifier. The exercise file contains a small HTTP server,
    `FakeClassifier`, that the harness starts on `127.0.0.1` with a
    free port, and every executor (in local mode, a process on your
    machine) can reach it. It answers `POST /v1/classify` with one
    result per item, and it fails the way real services fail:

    | Behaviour | What the client sees | Heals on retry? |
    |---|---|---|
    | more than 16 requests in a second | HTTP 429 with `Retry-After: 0.5` | yes, after waiting |
    | more than 20 items in a request | HTTP 413 | no |
    | an item whose text has no letters | per-item `{"error": "no text", "retryable": false}` | no |
    | about one key in seven, first time | per-item `{"error": "model busy", "retryable": true}` | yes |
    | about one request in five | the answer arrives after 1 second | yes, if you retry with the same idempotency key |

    The last row is the nasty one: the service *did the work*, but the
    client gave up waiting (its timeout is 0.5 seconds). A naive retry
    pays for the same work twice.

    The exercise also gives you a small `ServiceClient` (one keep-alive
    `http.client` connection; it raises `RetryableError` for 429, 5xx,
    timeouts and resets, and `PermanentError` for other 4xx), a
    `RateLimiter`, `backoff_seconds` and `idempotency_key`. Everything
    in this lesson runs with the standard library: no network, no keys.

