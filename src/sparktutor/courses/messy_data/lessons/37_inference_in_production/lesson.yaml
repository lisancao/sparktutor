    ## Gotcha: Plain Python UDFs Over Parquet Can Hang in 4.2.0

    The cache is Parquet, so sooner or later you will run a Python
    function over a column you read back from it. On stock 4.2.0 a
    plain `@udf` (Arrow-optimized by default) over a vectorized Parquet
    column can hang forever with no error: SPARK-58241, fixed in 4.2.1
    and 4.3.0. "Tuning Python on Spark" shows the hang, "How Catalyst
    Plans Python" measures which query shapes hang, and "The Python
    Worker Protocol" shows what the worker is waiting for.

    - **Measured** in those lessons on 4.2.0: setting
      `spark.sql.execution.arrow.pythonUDF.columnarInput.enabled` to
      `false`, a `pandas_udf`, `useArrow=False`, or a filter between the
      scan and the UDF all return normally.
    - **Not a fix:** wrapping the column in an expression.
      `up(F.trim("text"))` returned in our runs, but "Tuning Python on
      Spark" shows `col + 0` hanging just like the bare column, so don't
      count on it.
    - **Per the JIRA**, `mapInPandas` is not affected; this exercise
      calls the service from `mapInPandas`, which is why it never meets
      the hang.

