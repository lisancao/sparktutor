    ## The Extension Points

    Three protobuf messages have a slot for "anything", a
    `google.protobuf.Any`
    (`sql/connect/common/src/main/protobuf/spark/connect/`):

    | Message | Field | Plugin interface | Setting (static) |
    |---|---|---|---|
    | `Relation` (`relations.proto`) | `google.protobuf.Any extension = 998;` | `RelationPlugin` | `spark.connect.extensions.relation.classes` |
    | `Expression` (`expressions.proto`) | `google.protobuf.Any extension = 999;` | `ExpressionPlugin` | `spark.connect.extensions.expression.classes` |
    | `Command` (`commands.proto`) | `google.protobuf.Any extension = 999;` | `CommandPlugin` | `spark.connect.extensions.command.classes` |

    The interfaces are in
    `sql/connect/server/src/main/java/org/apache/spark/sql/connect/plugin/`:

    ```java
    public interface RelationPlugin {
        Optional<LogicalPlan> transform(byte[] relation, SparkConnectPlanner planner);
    }
    public interface ExpressionPlugin {
        Optional<Expression> transform(byte[] relation, SparkConnectPlanner planner);
    }
    public interface CommandPlugin {
        boolean process(byte[] command, SparkConnectPlanner planner);
    }
    ```

    Extensions arrived in 3.4 (SPARK-41629) as Scala traits that took a
    protobuf `Any`. Spark 4.0 moved them to Java interfaces
    (SPARK-47062, "Make Spark Connect Plugins Java Compatible"); as a
    Java `Optional<Void>` cannot be non-empty, a command plugin returns
    `boolean`. Two more interfaces sit in the same folder:
    `GetStatusPlugin` (setting
    `spark.connect.extensions.getStatus.classes`, 4.1) extends the
    `GetStatus` RPC, and `MLBackendPlugin` (4.0, experimental) swaps
    Spark ML implementations.

    How the server uses them is in `SparkConnectPlanner.scala` and
    `SparkConnectPluginRegistry.scala`:

    - For a `Relation` whose type is `EXTENSION`, the planner calls
      `transform(extension.toByteArray, this)` on each configured plugin
      **in order** and takes the first non-empty result. Returning
      `Optional.empty()` means "not mine". If nobody answers:

      ```text
      [CONNECT_INVALID_PLAN.NO_HANDLER_FOR_EXTENSION] The Spark Connect plan is invalid. No
      handler found for extension type: type.googleapis.com/jplug.Note SQLSTATE: 56K00
      ```

    - Plugin classes are instantiated with their **no-argument
      constructor** (otherwise `CONNECT.PLUGIN_CTOR_MISSING`; an
      exception in the constructor gives `CONNECT.PLUGIN_RUNTIME_ERROR`).
      The javadoc asks that they "should not rely on internal state":
      one instance serves every session.
    - The registry is built **lazily**, the first time any extension is
      planned, from `SparkEnv.get.conf`, and then cached for the whole
      server process.

