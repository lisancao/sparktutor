    ## The Client Side in Python

    The 4.2 Python client has no public API for extensions, but its
    internal classes are designed to be subclassed: every DataFrame wraps
    a `pyspark.sql.connect.plan.LogicalPlan`, whose `plan(session)`
    returns a `proto.Relation`. Treat what follows as code that may need
    changes on a Spark upgrade, like any use of internals.

    **Messages without protoc.** `google.protobuf` (installed with
    `pyspark[connect]`) can build message classes at run time from a
    `FileDescriptorProto`:

    ```python
    from google.protobuf import descriptor_pb2, descriptor_pool, message_factory

    FD = descriptor_pb2.FieldDescriptorProto
    fdp = descriptor_pb2.FileDescriptorProto(name="jplug/messages.proto", package="jplug",
                                             syntax="proto3")
    m = fdp.message_type.add(name="PlanNodes")
    m.field.add(name="input", number=1, type=FD.TYPE_BYTES, label=FD.LABEL_OPTIONAL)
    m.field.add(name="stage", number=2, type=FD.TYPE_STRING, label=FD.LABEL_OPTIONAL)
    pool = descriptor_pool.DescriptorPool()
    pool.Add(fdp)
    PlanNodes = message_factory.GetMessageClass(pool.FindMessageTypeByName("jplug.PlanNodes"))
    ```

    A real project writes a `.proto` file and generates both the Python
    module and the Java classes with `protoc`; the bytes are the same.

    **A relation.** Subclass `LogicalPlan`, build the `Relation`, pack
    the message into its `extension` field, and wrap the plan in a
    Connect `DataFrame`:

    ```python
    from pyspark.sql.connect.dataframe import DataFrame
    from pyspark.sql.connect.plan import LogicalPlan

    class PlanNodesRelation(LogicalPlan):
        def __init__(self, child, stage):
            super().__init__(child)
            self._stage = stage

        def plan(self, session):
            rel = self._create_proto_relation()          # sets common.plan_id
            msg = PlanNodes(input=self._child.plan(session).SerializeToString(), stage=self._stage)
            rel.extension.Pack(msg)                       # type.googleapis.com/jplug.PlanNodes
            return rel

    def plan_nodes(df, stage="optimized"):
        return DataFrame(PlanNodesRelation(df._plan, stage), df.sparkSession)
    ```

    `self._child.plan(session)` serializes the user's DataFrame, which
    is how the server receives it as `input`. `_create_proto_relation()`
    sets `common.plan_id`, which the server uses to resolve column
    references such as `df["x"]` back to this node.

