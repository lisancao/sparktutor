    ## Artifacts: What They Can and Cannot Deliver

    `spark.addArtifacts(*paths, pyfile=False, archive=False, file=False)`
    uploads files from the client into the **session's** artifact
    directory: `.py` files and zips for Python UDFs (`pyfile=True`),
    archives, plain files, and jars. Artifact jars go on a classloader
    for that session only (local servers started by `remote(...)` set
    `spark.sql.artifact.isolation.enabled=true`), which is enough for a
    Scala or Java UDF the client registers.

    Can an artifact deliver a plugin? An experiment: a server started
    with `spark.connect.extensions.relation.classes=jplug.PlanNodesPlugin`
    but **without** the jar on `spark.jars`:

    ```python
    plan_nodes(spark.range(3)).collect()   # before addArtifacts
    spark.addArtifacts(jplug_jar)
    plan_nodes(spark.range(3)).collect()   # after
    ```

    ```text
    before addArtifacts: UnknownException (java.lang.ClassNotFoundException) jplug.PlanNodesPlugin
    after addArtifacts:  [Row(id=0, parent=None, depth=0, node='Range', detail='Range (0, 3, step=1, splits=Some(2))')]
    ```

    It worked, but read the registry source before relying on it. The
    plugin list is built lazily on first use and the failed attempt left
    it unbuilt, so the second attempt ran inside a session whose
    classloader had the jar. From then on the cached instance serves
    **every** session of the server, loaded from one user's artifact.
    That is a side effect of lazy, process-wide initialization in
    `SparkConnectPluginRegistry`, not a supported way to install
    plugins. Put plugin jars on the server's classpath (`spark.jars`,
    `--jars`, or the image), and use artifacts for per-session code.

