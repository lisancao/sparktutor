    ## The Relation Plugin

    ```java
    public class PlanNodesPlugin implements RelationPlugin {
      public static final String TYPE_URL = "type.googleapis.com/jplug.PlanNodes";

      @Override public Optional<LogicalPlan> transform(byte[] any, SparkConnectPlanner planner) {
        Map<Integer, Object> a = Wire.fields(any);                  // Any: 1 = type_url, 2 = value
        if (!TYPE_URL.equals(Wire.string(a, 1, ""))) return Optional.empty();
        Map<Integer, Object> msg = Wire.fields(Wire.bytes(a, 2));
        String stage = Wire.string(msg, 2, "optimized");
        Relation input = ConnectProtoUtils.parseRelationWithRecursionLimit(Wire.bytes(msg, 1), 1024);
        LogicalPlan child = planner.transformRelation(input);
        SparkSession session = planner.session();                   // org.apache.spark.sql.classic
        QueryExecution qe = Dataset.ofRows(session, child).queryExecution();
        QueryPlan<?> root = switch (stage) {
          case "analyzed" -> qe.analyzed();
          case "optimized" -> qe.optimizedPlan();
          case "physical" -> qe.executedPlan();
          default -> throw new IllegalArgumentException("stage must be analyzed, optimized or physical, ...");
        };
        List<Row> rows = new ArrayList<>();
        walk(root, null, 0, rows);
        return Optional.of(session.createDataFrame(rows, SCHEMA).logicalPlan());
      }
    }
    ```

    Three pieces of the planner API do the work:

    - `planner.transformRelation(Relation)` (`@DeveloperApi`) turns the
      embedded client plan into a Catalyst `LogicalPlan`, exactly as if
      the client had sent it alone. Your plugin can wrap any DataFrame
      the user has.
    - `planner.session()` (`@Since("4.0.0") @DeveloperApi`) is the
      **classic** `SparkSession` behind this client's Connect session,
      with its conf and catalog. Through it the plugin has the whole
      JVM API: `Dataset.ofRows`, `queryExecution()`, `createDataFrame`.
    - The result is a `LogicalPlan`. Here it is the plan of a small
      `DataFrame` built from `java.util.List<Row>` (a `LocalRelation`),
      but it could be any operator, including one of your own.

    `walk` visits `children()` depth first. One node needs care:
    `AdaptiveSparkPlanExec`, the root of a physical plan under adaptive
    execution, keeps its plan in `executedPlan()` rather than in
    `children()`, so the walk steps into it.

