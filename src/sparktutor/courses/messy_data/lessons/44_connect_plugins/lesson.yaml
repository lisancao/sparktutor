    ## Exercise: plan_nodes, End to End

    The exercise file contains the Java for three plugins (`Wire`, the
    wire-format reader; `PlanNodesPlugin`; `MagicPlugin`; `NotePlugin`),
    the Python message classes built with `descriptor_pb2`, and the
    client classes. It compiles the jar, starts a local Connect server
