  Output: |
    Think of the Connect client as a customer ordering by mail. The
    order form (the protobuf plan) has boxes for every standard item.
    For anything else there is one box marked "special request", where
    you staple a sealed envelope with a label on it. A plugin is the
    clerk at the warehouse who knows that label, opens the envelope and
    knows what to do with what is inside.

