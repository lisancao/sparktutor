    ## Plans From a Connect Client

    ```python
    df = spark.range(10).filter("id > 3").groupBy((F.col("id") % 2).alias("k")).count()
    plan_nodes(df).show(truncate=False)
    plan_nodes(df, "physical").show(truncate=False)
    ```

    ```text
    +---+------+-----+---------+------------------------------------------------------------------------------------------+
    |id |parent|depth|node     |detail                                                                                    |
    +---+------+-----+---------+------------------------------------------------------------------------------------------+
    |0  |NULL  |0    |Aggregate|Aggregate [_groupingexpression#5L], [_groupingexpression#5L AS k#2L, count(1) AS count#3L]|
    |1  |0     |1    |Project  |Project [(id#1L % 2) AS _groupingexpression#5L]                                           |
    |2  |1     |2    |Filter   |Filter (id#1L > 3)                                                                        |
    |3  |2     |3    |Range    |Range (0, 10, step=1, splits=Some(2))                                                     |
    +---+------+-----+---------+------------------------------------------------------------------------------------------+

    +---+------+-----+-------------+------------------------------------------------------------------------------------------+
    |id |parent|depth|node         |detail                                                                                    |
    +---+------+-----+-------------+------------------------------------------------------------------------------------------+
    |0  |NULL  |0    |HashAggregate|HashAggregate(keys=[_groupingexpression#33L], functions=[count(1)])                       |
    |1  |0     |1    |Exchange     |Exchange hashpartitioning(_groupingexpression#33L, 200), ENSURE_REQUIREMENTS, [plan_id=25]|
    |2  |1     |2    |HashAggregate|HashAggregate(keys=[_groupingexpression#33L], functions=[partial_count(1)])               |
    |3  |2     |3    |Project      |Project [(id#29L % 2) AS _groupingexpression#33L]                                         |
    |4  |3     |4    |Filter       |Filter (id#29L > 3)                                                                       |
    |5  |4     |5    |Range        |Range (0, 10, step=1, splits=2)                                                           |
    +---+------+-----+-------------+------------------------------------------------------------------------------------------+
    ```

    The result is an ordinary DataFrame: filter it, join it, assert on
    it. A test on a Connect client can now say "the Parquet scan has
    `PushedFilters: [IsNotNull(k), EqualTo(k,3)]`" or "this query has
    exactly one `ArrowEvalPython` node" (the exercise checks both),
    which the `explain()` string only lets you do by parsing text.

    Note what the plugin does **not** do: it runs no job. Planning the
    input (`queryExecution().executedPlan()`) happens on the server's
    driver; the rows are made there too. `transform` is called while the
    server plans the client's query, so keep it fast and free of side
    effects; a plan may be planned more than once (`explain()`,
    `schema`, `collect()` each send it).

