    ## What Works Over Connect Without a Plugin

    Before writing a plugin, check whether you need one. A Connect
    server is an ordinary Spark driver, so anything that is reachable
    **by name** from the DataFrame API or SQL works from a Connect client
    once the jar is on the server:

    - a DSv2 source with a short name: `spark.read.format("jdocs")`
    - a function injected by an extension: with the previous lesson's
      jar and `spark.sql.extensions=jext.Extensions` on the server, a
      Connect client ran both of these:

      ```python
      spark.sql("SELECT is_png(X'89504E470D0A1A0A') AS p").collect()
      spark.range(1).select(F.call_function("is_png", F.lit(b"\x89PNG\r\n\x1a\n"))).collect()
      ```

      ```text
      [Row(p=True)]
      [Row(is_png(X'89504E470D0A1A0A')=True)]
      ```

    - optimizer and check rules, which run on whatever plan the server
      builds

    What does **not** work is anything that needs the client to hold a
    JVM object:

    ```text
    [JVM_ATTRIBUTE_NOT_SUPPORTED] Attribute `_jvm` is not supported in Spark Connect as it
    depends on the JVM. If you need to use this attribute, do not use Spark Connect when
    creating your session. ...
    ```

    Plugins fill that gap. Use one when you need a **new operator** or
    **typed arguments** that SQL cannot express (nested messages, byte
    strings, lists of structures), when you want the server to compute
    something from its own JVM state (a plan, a catalog, a cache), or
    when a command has a side effect the API does not offer.

- Class: text
