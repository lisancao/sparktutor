    ## Building a Plugin Project

    The Maven `pom.xml` from "A DSv2 Connector in Java" builds the
    plugins with one more `provided` dependency:

    ```xml
    <dependency>
      <groupId>org.apache.spark</groupId>
      <artifactId>spark-connect_2.13</artifactId>
      <version>${spark.version}</version>
      <scope>provided</scope>
    </dependency>
    ```

    With it, the lesson's plugin sources compiled with `mvn package`
    into `target/jplug-0.1.0.jar`. If your plugin uses protobuf-java
    itself (generated message classes), bundle it with the
    `maven-shade-plugin` and **relocate** it to your own package, so it
    cannot clash with the protobuf that Spark already relocated to
    `org.sparkproject.connect.protobuf`. A client in another language
    (Go, Rust, Scala) uses the same `.proto` file to send the same
    message: that is the point of a protocol extension.

