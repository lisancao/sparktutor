    ## Starting a Server With the Plugin

    `SparkSession.builder.remote("local[2]")` (3.4) does not connect to
    an existing server: it starts one **inside your Python process** and
    connects to it. `_start_connect_server` in
    `python/pyspark/sql/connect/session.py` creates a classic
    `SparkContext` with your builder options plus
    `spark.plugins=org.apache.spark.sql.connect.SparkConnectPlugin`, so
    static settings reach the server:

    ```python
    spark = (SparkSession.builder
        .remote("local[2]")
        .config("spark.jars", jar)
        .config("spark.connect.extensions.relation.classes", "jplug.PlanNodesPlugin")
        .config("spark.connect.extensions.expression.classes", "jplug.MagicPlugin")
        .config("spark.connect.extensions.command.classes", "jplug.NotePlugin")
        .getOrCreate())
    ```

    Two surprises from running this on 4.2.0:

    - **Harmless warnings.** After the server is up, the client also
      tries to set every builder option on the Connect session and
      static ones refuse, so you get one warning per static setting:

      ```text
      UserWarning: Failed to set spark.jars to Some(/tmp/jplug_45uludc1/jplug.jar) due to
      [CANNOT_MODIFY_CONFIG] Cannot modify the value of the Spark config: "spark.jars".
      UserWarning: Failed to set spark.connect.extensions.relation.classes to
      Some(jplug.PlanNodesPlugin) due to [CANNOT_MODIFY_STATIC_CONFIG] ...
      ```

      The server already has them; the plugins work. The exercise hides
      these with `warnings.filterwarnings("ignore", message="Failed to set")`.
    - **Port 15002.** The local server listens on the default Connect
      port, 15002, and the client connects to `localhost:15002`. If some
      other process already listens there (another Connect server, a
      container), the client can end up talking to **that** server,
      which knows nothing about your plugin. If your plugin is "not
      found" for no reason, check what owns the port
      (`lsof -i :15002` or `ss -ltnp`).

    Outside PySpark, a Spark distribution starts a standalone server
    with `sbin/start-connect-server.sh`, which runs `spark-submit` with
    the class `org.apache.spark.sql.connect.service.SparkConnectServer`;
    pass the same `--jars` and `--conf` options. (The pip package of
    pyspark does not include `sbin/start-connect-server.sh`.)

