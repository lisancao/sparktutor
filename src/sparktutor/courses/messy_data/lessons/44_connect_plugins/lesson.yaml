  Output: |
    ## Summary

    - A Connect client sends protobuf, not JVM objects: no `_jvm`
      (`JVM_ATTRIBUTE_NOT_SUPPORTED`), no `_jdf`. Jars on the server
      still give you data sources by name and SQL extension functions.
    - `Relation`, `Expression` and `Command` each carry a
      `google.protobuf.Any extension`. `RelationPlugin`,
      `ExpressionPlugin` and `CommandPlugin` (Java interfaces since 4.0,
      SPARK-47062) receive it as `byte[]`, configured with the static
      `spark.connect.extensions.{relation,expression,command}.classes`.
    - Plugins are asked in order; `Optional.empty()` (or `false`) means
      "not mine"; nobody answering gives
      `CONNECT_INVALID_PLAN.NO_HANDLER_FOR_EXTENSION`.
    - Bytes, because Spark's protobuf is shaded. The wire format is keys
      (`field << 3 | type`) and values; `bytes` and embedded messages
      share wire type 2, so a client can send a `Relation` as `bytes`.
    - On the server: `ConnectProtoUtils.parse*WithRecursionLimit`,
      `planner.transformRelation` / `transformExpression`, and
      `planner.session()`, the classic session with the full JVM API.
    - `remote("local[2]")` starts a server in-process with your static
      settings (and warns harmlessly that it cannot set them again).
    - On the client: message classes from `descriptor_pb2`, a
      `LogicalPlan` subclass for relations, an `Expression` subclass for
      columns, `client.execute_command` for commands. These are internal
      APIs.
    - Put plugin jars on the server classpath. An artifact jar happened
      to work once in 4.2.0 because of lazy initialization, and then
      serves every session.

    Next: **Parquet from the Inside**, where you leave the JVM APIs and
    read the bytes of a Parquet file: row groups, pages, encodings,
    statistics and the footer that decides what Spark can skip.
