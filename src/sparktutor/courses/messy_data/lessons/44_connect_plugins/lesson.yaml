    ## Expression and Command Plugins

    An **expression plugin** returns a Catalyst `Expression`. The client
    side subclasses `pyspark.sql.connect.expressions.Expression` and
    implements `to_plan(session)`, which returns a `proto.Expression`
    with the message packed into its `extension`; a `Column` wraps it:

    ```python
    class HasMagicExpression(Expression):
        def __init__(self, child, magic):
            super().__init__()
            self._child, self._magic = child, magic

        def to_plan(self, session):
            e = pb.Expression()
            e.extension.Pack(HasMagic(child=self._child.to_plan(session).SerializeToString(),
                                      magic=self._magic))
            return e

    def has_magic(col, magic):
        return Column(HasMagicExpression(col._expr, magic))

    imgs.select("path", has_magic(F.col("content"), b"\x89PNG").alias("png"))
    ```

    On the server, `MagicPlugin` parses the child with
    `ConnectProtoUtils.parseExpressionWithRecursionLimit`, resolves it
    with `planner.transformExpression`, and returns
    `EqualTo(Substring(child, 1, n), Literal(magic))`. The user gets a
    function that takes raw bytes as an argument, with no SQL string
    escaping.

    A **command plugin** has a side effect and returns `true` if it
    handled the message. The client sends a `proto.Command` through the
    client's `execute_command`:

    ```python
    cmd = pb.Command()
    cmd.extension.Pack(Note(text="checked by the plugins exercise"))
    spark.client.execute_command(cmd)
    spark.conf.get("jplug.note")      # 'checked by the plugins exercise'
    ```

    `NotePlugin` stores the text with
    `planner.session().conf().set("jplug.note", text)`, so the client can
    read it back through the normal conf API. The planner calls command
    plugins in order, and the first that returns `true` wins; if none
    does, the error is the same `NO_HANDLER_FOR_EXTENSION`.

