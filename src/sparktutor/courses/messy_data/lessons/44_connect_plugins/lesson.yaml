    ## Bytes on the Wire

    Why `byte[]` and not a protobuf object? Spark Connect ships its own
    copy of protobuf-java **shaded**: inside `spark-connect_2.13-4.2.0.jar`
    the class is `org/sparkproject/connect/protobuf/Any.class`, not
    `com.google.protobuf.Any`. A plugin compiled against
    `com.google.protobuf` would not link against that. Bytes keep the
    interface independent of Spark's internal protobuf. A plugin can then
    use its own (relocated) protobuf-java and classes generated by
    `protoc`, or, for small messages, read the wire format itself.

    The wire format is short enough to read by hand. Each field is a
    **key**, a varint equal to `field_number << 3 | wire_type`, then the
    value: a varint for wire type 0, or a varint length and that many
    bytes for wire type 2 (strings, bytes and embedded messages). This
    lesson's message is:

    ```text
    message PlanNodes { bytes input = 1; string stage = 2; }   // package jplug
    ```

    Packed into an `Any` in Python:

    ```python
    from google.protobuf import any_pb2

    msg = PlanNodes(input=b"ab", stage="physical")
    print(msg.SerializeToString())
    a = any_pb2.Any()
    a.Pack(msg)
    print(a.type_url, a.SerializeToString())
    ```

    ```text
    b'\n\x02ab\x12\x08physical'
    type.googleapis.com/jplug.PlanNodes b'\n#type.googleapis.com/jplug.PlanNodes\x12\x0e\n\x02ab\x12\x08physical'
    ```

    Decode it: `\n` is `0x0a` = field 1, wire type 2 (`1 << 3 | 2`);
    `#` is `0x23` = 35 bytes of type URL. `\x12` = field 2, wire type 2;
    `\x0e` = 14 bytes of value, which is the `PlanNodes` message itself:
    field 1 (`\n`) of length 2 (`ab`), field 2 (`\x12`) of length 8
    (`physical`). The Java side's `Wire.fields(byte[])` (about forty
    lines, in the exercise) does exactly this and returns a map from field
    number to value.

    Notice that `bytes input = 1` and an embedded message field
    `spark.connect.Relation input = 1` look **identical** on the wire:
    both are wire type 2 with a length. That is why the client can
    declare `input` as `bytes`, put a serialized `Relation` in it, and
    the server can parse it as a `Relation` with
    `ConnectProtoUtils.parseRelationWithRecursionLimit(bytes, 1024)`
    (`sql/connect/common/.../ConnectProtoUtils.scala`, `@DeveloperApi`).
    The recursion limit guards against deeply nested plans; Spark's own
    example plugin (`SparkConnectPluginRegistrySuite.scala`) uses 1024.

