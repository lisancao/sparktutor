    ## What You'll Learn

    "A DSv2 Connector in Java" and "Catalyst Extensions: Rules and
    Native Functions" put Java code into the Spark JVM and tested it
    through `spark._jvm` and `df._jdf`. "How Catalyst Plans Python"
    showed that a Spark Connect client does not build JVM objects at
    all: it sends an **unresolved plan as protobuf**, and the server's
    `SparkConnectPlanner` turns it into a Catalyst plan. A Connect
    client has no Py4J gateway, so none of those back doors exist.

    Spark Connect's answer is **plugins**: JVM classes on the server
    that translate your own protobuf messages into Catalyst plans,
    expressions or side effects. This lesson builds all three kinds and
    calls them from a Python client:

    - `plan_nodes(df, stage)`: a **relation plugin** that returns the
      analyzed, optimized or physical plan of any DataFrame as rows, so
      a Connect client can test plan shapes (the thing you could not do
      without `_jdf`)
    - `has_magic(col, b"\x89PNG")`: an **expression plugin**, a typed
      `Column` built from a custom message
    - `note(spark, text)`: a **command plugin** that changes state on
      the server

    By the end of this lesson you will be able to:

    - Say what needs a plugin and what does not (server-side jars and
      SQL extensions already work over Connect)
    - Name the plugin interfaces and settings in 4.2.0, and the errors
      they produce
    - Read and write the protobuf wire format of a
      `google.protobuf.Any`, and explain why plugins receive `byte[]`
    - Start a local Connect server with a plugin jar from PySpark
    - Build custom messages in Python without `protoc`, and wrap them in
      a client `LogicalPlan`, `Expression` or `Command`
    - Explain what Connect artifacts (`spark.addArtifacts`) can and
      cannot deliver

