    ## Using the Model From SQL

    A pandas UDF can be registered for SQL like any UDF, so analysts can
    call your model without Python:

    ```python
    spark.udf.register("classify", label_batch)
    inbox.createOrReplaceTempView("inbox")
    spark.sql("""
        SELECT classify(text) AS label, count(*) AS n
        FROM inbox GROUP BY 1 ORDER BY n DESC
    """).show()
    ```

    ```text
    +--------+---+
    |   label|  n|
    +--------+---+
    | returns| 63|
    |shipping| 58|
    | privacy| 54|
    |warranty| 53|
    | unknown| 12|
    +--------+---+
    ```

    The registration lives in the session that made it; a new session
    (or a scheduled job) has to register it again.

