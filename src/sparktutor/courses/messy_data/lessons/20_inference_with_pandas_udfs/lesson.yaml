    ## The Nullable Integer Trap

    pandas has no NULL for a plain `int64` column. When a batch of a
    nullable integer column contains a NULL, PySpark 4.2.0 hands your
    pandas UDF a `float64` Series with `NaN`, and a float64 cannot hold
    every integer above 2^53 exactly:

    ```python
    @F.pandas_udf("string")
    def dtype_of(s: pd.Series) -> pd.Series:
        return pd.Series([str(s.dtype)] * len(s))

    @F.pandas_udf("long")
    def same(s: pd.Series) -> pd.Series:
        return s

    ids = spark.createDataFrame([(9007199254740993,), (None,)], "order_id bigint").coalesce(1)
    ids.select("order_id", dtype_of("order_id").alias("dtype"), same("order_id").alias("back")).show()
    ```

    ```text
    +----------------+-------+----------------+
    |        order_id|  dtype|            back|
    +----------------+-------+----------------+
    |9007199254740993|float64|9007199254740992|
    |            NULL|float64|            NULL|
    +----------------+-------+----------------+
    ```

    The identity function changed the ID, silently. The dtype also
    depends on the **batch**: a batch with no NULLs arrives as `int64`,
    so the same UDF sees different types in different tasks.

    4.2 adds `spark.sql.execution.pythonUDF.pandas.preferIntExtensionDtype`
    (default `false`). With it set to `true`, integer columns always
    arrive as pandas' nullable extension types (`Int64`, `Int32`, ...)
    and the value survives:

    ```text
    +----------------+-----+----------------+
    |        order_id|dtype|            back|
    +----------------+-----+----------------+
    |9007199254740993|Int64|9007199254740993|
    |            NULL|Int64|            NULL|
    +----------------+-----+----------------+
    ```

    Careful: the 4.2.0 PySpark migration guide says nullable integers
    now arrive as extension dtypes, but on a stock 4.2.0 install the
    config is off and you get `float64` as shown. Turn it on, or pass
    IDs to pandas UDFs as strings.

