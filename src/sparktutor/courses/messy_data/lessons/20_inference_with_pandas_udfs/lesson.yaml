    ## Load the Model Once per Task: the Iterator Form

    Real models live in files: weights on disk or in object storage. In
    a scalar pandas UDF, the only place to load one is inside the
    function, which runs once per batch. The exercise gives you
    `load_model_for_task(model_path, marker_dir)`, which loads the model
    from a JSON file and leaves an empty marker file behind each time,
    so you can count loads. With 4 partitions of 60 tickets and batches
    of 25:

    ```python
    spark.conf.set("spark.sql.execution.arrow.maxRecordsPerBatch", "25")
    tickets = inbox.repartition(4)

    @F.pandas_udf("string")
    def label_loading_each_batch(text: pd.Series) -> pd.Series:
        m = load_model_for_task(model_path, markers)
        return pd.Series(predict_batch(m, text.tolist())[0])

    tickets.select(label_loading_each_batch("text")).collect()
    ```

    ```text
    12 loads
    ```

    Three batches per task, four tasks, twelve loads. The **iterator
    form** (Spark 3.0, SPARK-26412) fixes this. The function receives an
    *iterator* of batches for the whole task and yields one result per
    batch, so code before the loop runs once per task:

    ```python
    from typing import Iterator

    @F.pandas_udf("string")
    def label_per_task(batches: Iterator[pd.Series]) -> Iterator[pd.Series]:
        m = load_model_for_task(model_path, markers)   # runs once per task
        for text in batches:
            yield pd.Series(predict_batch(m, text.tolist())[0])

    tickets.select(label_per_task("text")).collect()
    ```

    ```text
    ['load-p0-a0-pid3435988-feaa41e0', 'load-p1-a0-pid3435993-c431b157',
     'load-p2-a0-pid3435993-a696c4bc', 'load-p3-a0-pid3435988-5f3f3128']
    ```

    Four loads, one per partition (`p0` to `p3`), each by the first
    attempt of its task (`a0`). The marker names also show the process
    ID of the Python worker: two workers (two cores) shared the four
    tasks.

    Rules for the iterator form:

    - The type hints are required to select it. Without them Spark
      treats the function as scalar and fails with `[UDF_RETURN_TYPE]
      Return type of the user-defined function should be pandas.Series,
      but is generator.`
    - Yield one result per input batch, of the same length. Across the
      task the counts must match, or you get `[RESULT_ROWS_MISMATCH] The
      number of output rows (1) must match the number of input rows
      (3).`
    - For several input columns, the hint is
      `Iterator[Tuple[pd.Series, pd.Series]]` and each batch unpacks
      into one Series per column:

    ```python
    from typing import Tuple

    @F.pandas_udf("string")
    def label_with_channel(batches: Iterator[Tuple[pd.Series, pd.Series]]) -> Iterator[pd.Series]:
        m = load_model_for_task(model_path, markers)
        for text, channel in batches:
            labels, _ = predict_batch(m, text.tolist())
            yield pd.Series([f"{c}:{l}" for c, l in zip(channel, labels)])

    tickets.select(label_with_channel("text", "channel").alias("routed")).show(3)
    ```

    ```text
    +----------------+
    |          routed|
    +----------------+
    |   chat:shipping|
    |web_form:privacy|
    |   email:returns|
    +----------------+
    only showing top 3 rows
    ```

