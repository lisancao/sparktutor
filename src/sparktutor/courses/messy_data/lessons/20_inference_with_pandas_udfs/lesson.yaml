    ## The Data: Support Tickets

    `data/messy/support_tickets/` holds three things:

    - `train.csv`: 160 labelled tickets (`ticket_id, text, label`), 40
      for each of four labels that match the policy documents in
      `data/messy/docs/`: `shipping`, `returns`, `warranty`, `privacy`.
    - `inbox/part-0000N.jsonl`: 240 unlabelled tickets in four JSON
      Lines files (`ticket_id, channel, text`). They are messy on
      purpose: shouting, HTML tags, emoji, runs of spaces, a few tickets
      that mention two topics, and a few with no usable text at all
      (empty, punctuation only, or `null`).
    - `inbox_labels.csv`: the answer key for the inbox, so you can
      measure accuracy. Tickets with no usable text are labelled
      `unknown`.

    ```python
    inbox = (spark.read.schema("ticket_id string, channel string, text string")
             .json("data/messy/support_tickets/inbox"))
    inbox.show(5, truncate=60)
    ```

    ```text
    +---------+--------+------------------------------------------------------------+
    |ticket_id| channel|                                                        text|
    +---------+--------+------------------------------------------------------------+
    |    I0181|   email|Hello, unsubscribe me from marketing emails. update my pr...|
    |    I0182|web_form|Hello, please refund the original payment? can I send it ...|
    |    I0183|    chat|  Hello   team,   do   you   offer   express   shipping  ...|
    |    I0184|   email|     Hello, do you offer express shipping to Vietnam? Cheers|
    |    I0185|web_form|HI, HOW MANY DAYS DO I HAVE TO RETURN ITEMS? PLEASE REFUN...|
    +---------+--------+------------------------------------------------------------+
    only showing top 5 rows
    ```

    The rows start at `I0181` because Spark packs the largest file
    (`part-00003.jsonl`) into a partition first. File order is not row
    order; sort when order matters.

