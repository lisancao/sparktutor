    ## What You'll Learn

    "Documents to Rows" turned e-mails and documents into rows with
    Python UDFs, "Images and Audio" ran NumPy over pixels with an Arrow
    UDF, and "Text Analytics Without an LLM" built a search index with
    Spark MLlib. This lesson closes the loop that most real projects
    need: you have a model written in Python (yours, or one from
    scikit-learn, PyTorch or a vendor SDK) and you want to run it over
    every row of a large table.

    The model here is deliberately tiny, a naive Bayes text classifier
    in plain Python and NumPy, so that you can see every moving part.
    The Spark side is exactly what you would write for a big model.

    By the end of this lesson you will be able to:

    - Train a small model on the driver and score data with it on the
      executors
    - Write a `pandas_udf` that takes and returns a pandas Series, and
      explain how it differs from a plain `@udf`
    - Control how many rows each call sees with
      `spark.sql.execution.arrow.maxRecordsPerBatch`
    - Load a model **once per task** with the iterator form of
      `pandas_udf`, and prove it with evidence instead of hoping
    - Ship a model to executors in a closure, a broadcast variable or a
      file, and know what each costs
    - Score whole batches with `mapInPandas`
    - Explain why Spark may run your model more than once for the same
      row, and what to do about it
    - Sketch how an LLM call fits the same pattern

- Class: text
  Depth: beginner
  Output: |
    Think of a model as a recipe and your table as a mountain of
    ingredients. Training happens once, in one kitchen (the driver). To
    cook the whole mountain you hand copies of the recipe to many cooks
    (the executors). Each cook gets a crate of ingredients (a partition)
    and works through it a tray at a time (a batch).

    The expensive part is often reading the recipe, not cooking: loading
    a real model can take seconds and hundreds of megabytes. So the
    question this lesson keeps asking is: how often does each cook read
    the recipe? Once per tray is wasteful. Once per crate is what you
    want.

