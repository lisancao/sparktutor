    ## How Big Is a Batch?

    Spark cuts each partition into Arrow batches of at most
    `spark.sql.execution.arrow.maxRecordsPerBatch` rows (default
    `10000`). A batch never spans two partitions. You can watch it with
    a UDF that reports the size of the Series it received:

    ```python
    @F.pandas_udf("long")
    def batch_size(text: pd.Series) -> pd.Series:
        return pd.Series([len(text)] * len(text))

    print(inbox.rdd.getNumPartitions())
    inbox.select(batch_size("text").alias("rows_in_batch")) \
        .groupBy("rows_in_batch").count().show()
    ```

    ```text
    2
    +-------------+-----+
    |rows_in_batch|count|
    +-------------+-----+
    |          120|  240|
    +-------------+-----+
    ```

    On `local[2]` the four small files become two partitions of 120
    rows, far below 10000, so each partition is one batch. The setting
    is a runtime SQL conf, so you can change it between queries:

    ```python
    spark.conf.set("spark.sql.execution.arrow.maxRecordsPerBatch", "25")
    inbox.select(batch_size("text").alias("rows_in_batch")) \
        .groupBy("rows_in_batch").count().orderBy("rows_in_batch").show()
    ```

    ```text
    +-------------+-----+
    |rows_in_batch|count|
    +-------------+-----+
    |           20|   40|
    |           25|  200|
    +-------------+-----+
    ```

    Each partition of 120 rows is now four batches of 25 and one of 20.

    Choosing the size is a memory trade. Every batch lives in the Python
    worker as Arrow data and pandas objects at the same time, plus
    whatever your model allocates for it. 10000 short strings are
    nothing; 10000 images are gigabytes. Lower the value for wide rows
    (documents, images, embeddings) and for models whose memory grows
    with the batch. There is also an internal byte limit,
    `spark.sql.execution.arrow.maxBytesPerBatch` (4.0, default 64 MiB),
    and a batch is cut when either limit is reached.

