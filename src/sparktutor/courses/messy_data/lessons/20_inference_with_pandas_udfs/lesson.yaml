    ## Why Your Model May Run More Than Once

    You write `withColumn("label", model_udf("text"))` once, but that is
    a description, not an instruction to run the model once. Spark
    decides how often to evaluate it. To see what actually happens, wrap
    the model in a pandas UDF that appends the size of each batch to a
    file, and count rows after each query:

    | Query on `labeled = inbox.withColumn("label", udf("text"))` | Rows the model saw |
    |---|---|
    | `labeled.collect()` | 240 |
    | `labeled.collect()` again | 240 more |
    | `labeled.count()` | **0** |
    | `labeled.show(3)` | 4 |
    | `labeled.filter("label = 'warranty'").collect()` (53 rows) | **293** |
    | same filter, UDF marked `.asNondeterministic()` | 240 |
    | `labeled.cache().count()`, then two more queries on it | 240, then 0 |

    Each line has a reason:

    - **Every action starts from the plan.** Without a cache, the second
      `collect()` scores everything again.
    - **Unused columns are pruned.** `count()` does not need `label`, so
      Spark never calls the model. Do not time a UDF with `count()`.
    - **`show(3)` fetches one extra row** (to know whether to print
      "only showing top 3 rows") and only from the first partition.
    - **A filter on the output can duplicate the call.** Spark treats
      your UDF as deterministic, so it pushes the filter below the
      projection by substituting the UDF into the condition. The plan
      then has two Python evaluations: one for the filter over all 240
      rows, one for the 53 rows that survive:

    ```text
    *(2) Project [ticket_id#23, channel#24, text#25, pythonUDF0#49 AS label#37]
    +- ArrowEvalPython [counted(text#25)#36], [pythonUDF0#49], 200
       +- *(1) Project [ticket_id#23, channel#24, text#25]
          +- *(1) Filter (pythonUDF0#48 = warranty)
             +- ArrowEvalPython [counted(text#25)#36], [pythonUDF0#48], 200
                +- FileScan json [ticket_id#23,channel#24,text#25] ...
    ```

    - **`asNondeterministic()`** tells Spark the result may differ
      between calls, so it may not duplicate or move the call. That stops
      the double scoring, at the price of blocking optimizations around
      it. Use it when calls are expensive or have side effects, or when
      the model really is random (sampling, dropout at inference).
    - **Caching** ("Plans, Partitions and Caching") scores once and
      serves later queries from memory. For an expensive model, writing
      the scores to a table is even better: they survive the session.

    Beyond these, a failed task is retried from the start of its
    partition, a slow one may be duplicated by speculative execution, and
    a lost executor means recomputing its partitions. So: **never rely on
    a model call happening exactly once**. Keep calls free of side
    effects, or make them idempotent. "Determinism, Retries and Fault
    Injection" in the advanced level forces each of these on purpose.

