    ## Row at a Time: a Plain Python UDF

    You already know one way to run Python over every row, from
    "Documents to Rows": a UDF.

    ```python
    @F.udf("string")
    def label_row(text):
        return predict_one(model, text)[0]

    inbox.select("ticket_id", label_row("text").alias("label")).show(3)
    ```

    ```text
    +---------+--------+
    |ticket_id|   label|
    +---------+--------+
    |    I0181| privacy|
    |    I0182| returns|
    |    I0183|shipping|
    +---------+--------+
    only showing top 3 rows
    ```

    The function captures `model` from the enclosing scope. PySpark
    pickles the function together with everything it refers to and sends
    it to every task, so the executors get a copy of the model for free.

    In 4.2 the plan shows `ArrowEvalPython`, because Arrow-optimized
    UDFs are the default (`spark.sql.execution.pythonUDF.arrow.enabled`
    is `true`, SPARK-54555). With `useArrow=False` you get the older
    pickled path, `BatchEvalPython`:

    ```text
    +- ArrowEvalPython [label_row(text#40)#67], [pythonUDF0#69], 101
    +- BatchEvalPython [label_row_pickled(text#40)#70], [pythonUDF0#72]
    ```

    Either way, Spark sends rows to the Python worker in batches, but
    **your function is still called once per row**. For a model, that
    means one prediction call per row, and no chance to use the
    vectorized math (matrix products, GPU batches) that models are built
    for.

