    ## A Note on LLMs (Ungraded)

    Calling a large language model is the same pattern with a network in
    the middle: one client per task, batched requests, and a structured
    answer you validate in Spark. The sketch below runs anywhere because
    `FakeClient` stands in for a real SDK; no key, no network:

    ```python
    class FakeClient:
        """Stands in for an LLM SDK client: one call takes a list of prompts."""
        def complete(self, prompts):
            out = []
            for p in prompts:
                t = p.rsplit("Ticket: ", 1)[1].lower()
                if "broken" in t:
                    out.append('{"label": "warranty", "order_id": null}')
                elif "order" in t:
                    out.append('Sure! {"label": "shipping"}')          # not valid JSON
                else:
                    out.append('{"label": "returns", "order_id": 1234}')
            return out

    PROMPT = ("Classify the support ticket as shipping, returns, warranty or privacy. "
              'Answer with JSON only: {{"label": "...", "order_id": <number or null>}}.'
              "\n\nTicket: {text}")

    def ask_model(batches):
        client = FakeClient()          # one client per task: connections, auth, rate limits
        for pdf in batches:
            prompts = [PROMPT.format(text=t or "") for t in pdf["text"]]
            answers = []
            for start in range(0, len(prompts), 20):     # 20 prompts per request
                answers += client.complete(prompts[start:start + 20])
            yield pd.DataFrame({"ticket_id": pdf["ticket_id"], "answer": answers})

    ANSWER = "struct<label:string, order_id:bigint>"
    answers = inbox.mapInPandas(ask_model, "ticket_id string, answer string")
    parsed = answers.withColumn("parsed", F.from_json("answer", ANSWER))
    parsed.select("ticket_id", "answer", "parsed.label").show(4, truncate=45)
    ```

    ```text
    +---------+--------------------------------------+-------+
    |ticket_id|                                answer|  label|
    +---------+--------------------------------------+-------+
    |    I0181|{"label": "returns", "order_id": 1234}|returns|
    |    I0182|           Sure! {"label": "shipping"}|   NULL|
    |    I0183|           Sure! {"label": "shipping"}|   NULL|
    |    I0184|{"label": "returns", "order_id": 1234}|returns|
    +---------+--------------------------------------+-------+
    ```

    The fake model, like real ones, sometimes wraps its JSON in chatter.
    `from_json` in its default PERMISSIVE mode turns that into a struct
    of NULLs instead of failing the job, so you can count and quarantine
    bad answers as in "JSON Drift and Quarantine". What this sketch
    leaves out, and "Model Inference in Production" adds: timeouts,
    retries with backoff, rate limits per executor, a dead-letter table
    for failed calls, and caching answers by a hash of the input so a
    rerun never pays twice. Remember the previous section, too: Spark
    may call `ask_model` more than once for the same rows, and every
    call costs money.

