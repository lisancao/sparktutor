    ## Is Batching Faster?

    Usually, but measure instead of assuming. Scoring the inbox repeated
    1000 times (240000 rows, cached) on `local[2]`, best of three runs on
    one laptop, with a per-row function that is as tight as the batch
    one (the vocabulary lookup built once, not per row):

    | Style | Time |
    |---|---|
    | `@udf` (Arrow, the 4.2 default) | 0.92 s |
    | `@udf(useArrow=False)` | 0.84 s |
    | `pandas_udf` with `predict_batch` | 0.55 s |

    The batch version wins, but by less than you might expect, and the
    Arrow-optimized plain UDF is not faster than the pickled one for this
    function. The reason is the model: tokenizing is a Python loop over
    words in both versions, and only the scoring is a matrix product. The
    more of a model's work is vectorized (NumPy, a neural network
    framework, a GPU), the larger the gap. Numbers on your machine will
    differ; the ranking is what to take away. "Tuning Python on Spark"
    in the intermediate level goes into profiling Python on executors.

