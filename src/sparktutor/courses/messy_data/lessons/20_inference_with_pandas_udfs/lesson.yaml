    ## Batch Scoring With mapInPandas

    A pandas UDF adds one column. Sometimes you want to work on whole
    rows instead: read several columns, drop rows, emit more than one row
    per input, or return a table with its own schema. `mapInPandas`
    (Spark 3.0, SPARK-28198) hands your function an iterator of pandas
    DataFrames for each partition (the same batches as above) and expects
    an iterator of DataFrames back:

    ```python
    def score(batches):
        m = load_model_for_task(model_path, markers)     # once per partition
        for pdf in batches:
            labels, conf = predict_batch(m, pdf["text"].tolist())
            yield pd.DataFrame({"ticket_id": pdf["ticket_id"],
                                "label": labels, "confidence": conf})

    scored = tickets.mapInPandas(score, "ticket_id string, label string, confidence double")
    scored.show(3)
    ```

    ```text
    +---------+--------+------------------+
    |ticket_id|   label|        confidence|
    +---------+--------+------------------+
    |    I0006|warranty| 0.848571880452549|
    |    I0208|warranty|0.9996754525940297|
    |    I0192|warranty|0.6060703527200753|
    +---------+--------+------------------+
    only showing top 3 rows
    ```

    The function is called once per partition, so the model loads once
    per partition with no special type hints. Things to know:

    - **Columns are matched by name**, not position. A missing or
      misspelled column fails with `[RESULT_COLUMN_NAMES_MISMATCH] Column
      names of the returned data do not match specified schema. Missing:
      label. Unexpected: lbl.` Extra columns are dropped silently.
    - **Any number of rows** per batch is fine, including zero. That is
      the difference from a UDF, which must return exactly one value per
      row.
    - The input is the **whole row**: select only the columns the
      function needs first, so Spark does not ship the rest to Python.

    "Images and Audio" used `mapInArrow`, the same idea with PyArrow
    record batches instead of pandas DataFrames.

    Which one to use:

    | Job | Tool |
    |---|---|
    | One value per row, cheap Python | `@udf` |
    | One value per row, vectorized model, cheap to load | `pandas_udf`, Series to Series |
    | One value per row, expensive model load | `pandas_udf`, iterator form |
    | Model cached across tasks and queries | `predict_batch_udf` |
    | Whole rows in, any rows out | `mapInPandas` (or `mapInArrow`) |

