    ## How Good Is It?

    Scoring is only half the job; you also want to know how often the
    model is right. Join the predictions to the answer key and average a
    boolean:

    ```python
    answers = (spark.read.option("header", True).csv("data/messy/support_tickets/inbox_labels.csv")
               .select(F.col("ticket_id").alias("id"), F.col("label").alias("expected")))
    (answers.join(scored.withColumnRenamed("ticket_id", "id"), "id")
        .agg(F.avg((F.col("label") == F.col("expected")).cast("double")).alias("accuracy"))
        .show())
    ```

    ```text
    +------------------+
    |          accuracy|
    +------------------+
    |0.9666666666666667|
    +------------------+
    ```

    232 of 240. The eight mistakes are honest ones: a ticket that
    mentions a warranty claim *and* a privacy setting, polite openers
    ("To whom it may concern") that appear more often in one label's
    training tickets, and "when will my order be delivered" losing to
    `returns`. The inbox was generated from the same phrases as the
    training set, so 97% is flattering; real tickets would score lower.
    The point is the method: hold out labelled data, score it with the
    same code path as production, and look at the mistakes.

