    ## Train on the Driver

    A **multinomial naive Bayes** classifier is a good first model
    because you can read it. Training counts how often each word appears
    in each label's tickets. To classify a new ticket, it adds up, for
    each label, the log probability of the label and of every known
    word in the ticket under that label, and picks the largest total.
    Words it never saw in training are ignored, and a ticket with no
    known words gets the label `unknown`.

    The exercise file gives you the whole model as plain Python
    functions: `tokenize(text)`, `train_naive_bayes(rows)`,
    `predict_one(model, text)` for one text, and
    `predict_batch(model, texts)` which does the same for a list of texts
    with one NumPy matrix product. None of them touches Spark, so you
    can test them on their own.

    The training data is small, so read it with Spark, bring it to the
    driver with `collect()`, and train there:

    ```python
    train = spark.read.option("header", True).csv("data/messy/support_tickets/train.csv")
    rows = train.select("text", "label").collect()
    model = train_naive_bayes([(r.text, r.label) for r in rows])

    print(len(model["vocab"]), "words;", len(json.dumps(model)), "bytes as JSON")
    print(predict_one(model, "My parcel never arrived"))
    print(predict_one(model, "The screen is cracked, can you repair it?"))
    print(predict_one(model, "?!"))
    ```

    ```text
    133 words; 12168 bytes as JSON
    ('shipping', 0.8858863779906665)
    ('warranty', 0.9763135735565716)
    ('unknown', 0.0)
    ```

    The second number is the model's confidence: the probability it
    gives the winning label, between 0 and 1.

    `collect()` is safe here because the training set is 160 rows. That
    is the shape of most real projects: a training set that fits in one
    machine's memory and a table to score that does not. When the
    training data is large too, train with Spark MLlib (see "MLlib or
    Your Own Model?" below) or sample first.

