    ## A Batch at a Time: pandas_udf

    A **pandas UDF** (`pandas_udf`, Spark 2.3; the type-hint style since
    3.0) is called once per **batch**. It receives each input column as
    a `pandas.Series` holding many rows and must return a Series of the
    same length:

    ```python
    import pandas as pd

    @F.pandas_udf("string")
    def label_batch(text: pd.Series) -> pd.Series:
        labels, _ = predict_batch(model, text.tolist())
        return pd.Series(labels)

    inbox.groupBy(label_batch("text").alias("label")).count().orderBy("label").show()
    ```

    ```text
    +--------+-----+
    |   label|count|
    +--------+-----+
    | privacy|   54|
    | returns|   63|
    |shipping|   58|
    | unknown|   12|
    |warranty|   53|
    +--------+-----+
    ```

    The **type hints are not decoration**: they tell Spark which kind of
    pandas UDF this is. `pd.Series -> pd.Series` is the scalar kind; you
    will meet the iterator kind below. The plan shows the same
    `ArrowEvalPython` node with a different eval type number at the end
    (`200` for a scalar pandas UDF, `101` for an Arrow-optimized plain
    UDF):

    ```text
    +- ArrowEvalPython [label_batch(text#40)#85], [pythonUDF0#87], 200
    ```

    Two rules the result must follow, with the errors you get when it
    does not (both arrive as `PYTHON_EXCEPTION` from the task, with the
    real reason at the bottom of the traceback):

    - **Same length as the input.** Dropping the NULL texts before
      predicting returns one value too few:
      `[SCHEMA_MISMATCH_FOR_PANDAS_UDF] Result vector from pandas_udf was
      not the required length: expected 120, got 119.`
    - **Values that fit the declared type.** Returning `text.str.len() /
      2` (floats) from a UDF declared `"long"` fails with `Failed to
      convert the value of the column '_0' with type 'float64' to Arrow
      type 'int64'. ... Arrow safe type check can be disabled by using
      SQL config spark.sql.execution.pandas.convertToArrowArraySafely.`
      Do not disable the check; declare `"double"`, or convert
      explicitly with `.round().astype("Int64")` (the capital-I pandas
      type keeps NULLs as NULL).

    `None` inside a returned Series of strings becomes NULL, which is how
    the model's `unknown` rows could have been NULL instead if you
    preferred.

