    ## Summary

    In this lesson you learned:

    - **Train on the driver, score on the executors**: collect a small
      training set, fit a plain Python model, apply it with a UDF
    - **`@udf`** calls your function once per row (Arrow-optimized by
      default in 4.2, `ArrowEvalPython ... 101`); **`pandas_udf`**
      (Series to Series) once per batch (`ArrowEvalPython ... 200`), and
      must return the same number of values with types that fit
    - **Batch size** is `spark.sql.execution.arrow.maxRecordsPerBatch`
      (default 10000), a runtime conf; lower it for wide rows and big
      models
    - **Nullable integers** reach pandas UDFs as `float64` when a batch
      has a NULL, losing precision above 2^53, unless you set
      `spark.sql.execution.pythonUDF.pandas.preferIntExtensionDtype`
      (4.2, default `false`)
    - **The iterator form** (`Iterator[pd.Series] -> Iterator[pd.Series]`)
      runs setup once per task: load the model before the loop. Count
      loads with evidence, such as a marker file per load
    - **Shipping the model**: a closure for small models, a broadcast in
      classic mode, a file on shared storage for anything large or on
      Spark Connect; a global in your script is reset for every task, and
      `predict_batch_udf` (3.4) caches per worker process
    - **`mapInPandas`** for whole-row batch scoring; columns are matched
      by name
    - **Spark may run your model more than once**: repeated actions,
      filters on the output, retries and speculation; `count()` may not
      run it at all. Cache or write results, use `asNondeterministic()`
      for expensive or side-effecting calls, keep calls idempotent
    - An **LLM call** is the same pattern: a client per task, batched
      requests, validated JSON

    Next: **What Spark 4.x Adds for Messy Data**, the last lesson of the
    basics level: geospatial types, collations, the TIME type and the
    other 4.x features that help with messy data.
