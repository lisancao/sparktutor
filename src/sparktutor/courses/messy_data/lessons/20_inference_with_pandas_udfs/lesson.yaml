    ## Getting the Model to the Executors

    There are three ways to give executors the model, and you have
    already used two:

    **In the closure.** The UDFs above capture `model`, so it travels
    pickled inside the UDF. For this model the whole pickled UDF is
    6987 bytes:

    ```python
    from pyspark.serializers import CloudPickleSerializer
    print(len(CloudPickleSerializer().dumps(label_batch.func)), "bytes pickled")
    ```

    That is fine for kilobytes. In classic PySpark, a pickled UDF bigger
    than `spark.broadcast.UDFCompressionThreshold` (default 1 MiB) is
    turned into a broadcast automatically. Either way, everything in the
    closure has to be pickleable, and a big closure is memory every task
    holds whether it uses the model or not.

    **As a broadcast variable** (classic mode only). The driver sends the
    value to each executor once, where it is cached and read through
    `.value`:

    ```python
    bc = spark.sparkContext.broadcast(model)

    @F.pandas_udf("string")
    def label_bc(text: pd.Series) -> pd.Series:
        return pd.Series(predict_batch(bc.value, text.tolist())[0])
    ```

    On a Spark Connect session there is no `sparkContext`; touching it
    fails with:

    ```text
    [JVM_ATTRIBUTE_NOT_SUPPORTED] Attribute `sparkContext` is not supported
    in Spark Connect as it depends on the JVM.
    ```

    Closures and files work in both modes.

    **As a file the executors load.** Save the model where every
    executor can read it and load it in the UDF, once per task, as the
    iterator form above does. This is the only option that scales to
    large models, and the only one that works for models that cannot be
    pickled (many deep learning models hold native resources). On a
    cluster the path must be on shared storage (object storage, a
    distributed file system, or a file shipped with
    `spark.sparkContext.addFile` and found with `SparkFiles.get`); a
    path on the driver's local disk does not exist on the executors. In
    local mode every executor is your laptop, so a temporary directory
    works.

