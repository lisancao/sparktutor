    ## Once per Task Is Not Once per Worker

    Python workers are reused across tasks by default
    (`spark.python.worker.reuse` is `true`), so it is tempting to cache
    the model in a global variable and load it once per worker process:

    ```python
    _MODEL = None

    @F.pandas_udf("string")
    def label_global(text: pd.Series) -> pd.Series:
        global _MODEL
        if _MODEL is None:
            _MODEL = load_model_for_task(model_path, markers)
        return pd.Series(predict_batch(_MODEL, text.tolist())[0])
    ```

    It does not work when the UDF is defined in your script (the
    `__main__` module): four tasks gave four loads, even though only two
    worker processes ran them:

    ```text
    ['load-p0-a0-pid3435993-...', 'load-p1-a0-pid3436560-...',
     'load-p2-a0-pid3435993-...', 'load-p3-a0-pid3435993-...']
    ```

    The UDF is pickled **by value** together with its globals, and each
    task unpickles a fresh copy, so `_MODEL` starts as `None` every time.
    A cache survives between tasks only when it lives in a module the
    workers *import* (a package installed on the executors, or a file
    shipped with `spark.sparkContext.addPyFile`), because Python keeps
    imported modules in the worker process.

    Spark ML has a helper built on exactly that: `predict_batch_udf`
    (3.4) in `pyspark.ml.functions`. You give it a function that loads
    the model and returns a `predict` function over NumPy arrays; it
    keeps the result in `pyspark.ml.model_cache.ModelCache` inside the
    worker process:

    ```python
    import numpy as np
    from pyspark.ml.functions import predict_batch_udf
    from pyspark.sql.types import StringType

    def make_predict_fn():
        m = load_model_for_task(model_path, markers)
        def predict(text: np.ndarray) -> np.ndarray:
            return np.asarray(predict_batch(m, text.tolist())[0], dtype=object)
        return predict

    classify = predict_batch_udf(make_predict_fn, return_type=StringType(), batch_size=50)
    tickets.select(classify("text")).collect()
    tickets.select(classify("text")).collect()
    ```

    ```text
    first query:  ['load-p0-a0-pid3436560-...', 'load-p1-a0-pid3435993-...']
    second query: []
    ```

    Two loads for four tasks (one per worker process), and none for the
    second query. The fine print, from the `ModelCache` source: it holds
    at most three models per worker, it needs worker reuse on, and an
    idle worker is killed after one minute, which empties its cache.
    `batch_size` re-slices Spark's Arrow batches into model-sized pieces.
    Caching across tasks and queries is a production concern; "Model
    Inference in Production" in the intermediate level builds on it.

