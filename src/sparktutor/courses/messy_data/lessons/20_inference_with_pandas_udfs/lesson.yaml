    ## Returning Several Values: a Struct

    A label alone hides how sure the model was. Declare a struct return
    type and yield a pandas **DataFrame** whose column names match the
    struct's fields:

    ```python
    @F.pandas_udf("struct<label:string, confidence:double>")
    def label_and_confidence(batches: Iterator[pd.Series]) -> Iterator[pd.DataFrame]:
        m = load_model_for_task(model_path, markers)
        for text in batches:
            labels, conf = predict_batch(m, text.tolist())
            yield pd.DataFrame({"label": labels, "confidence": conf})

    (tickets.select("ticket_id", label_and_confidence("text").alias("p"))
        .select("ticket_id", "p.label", F.round("p.confidence", 3).alias("confidence"))
        .filter("label != 'unknown'")
        .orderBy("confidence").show(5))
    ```

    ```text
    +---------+--------+----------+
    |ticket_id|   label|confidence|
    +---------+--------+----------+
    |    I0162| returns|       0.3|
    |    I0018| returns|     0.383|
    |    I0045| returns|     0.398|
    |    I0160| returns|     0.418|
    |    I0195|shipping|     0.476|
    +---------+--------+----------+
    only showing top 5 rows
    ```

    The least confident predictions are worth a look: the first four are
    shipping tickets ("when will my order be delivered", "delivery is
    late") that the model got wrong, and the fifth is right but barely. Selecting `p.label` and `p.confidence` from the
    struct does not run the UDF twice; Spark evaluates `p` once and reads
    both fields from it. A DataFrame with the wrong column names fails
    with a `KeyError` naming the missing columns.

