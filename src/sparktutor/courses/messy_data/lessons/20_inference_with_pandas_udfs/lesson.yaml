    ## MLlib or Your Own Model?

    Spark MLlib has a naive Bayes classifier too
    (`pyspark.ml.classification.NaiveBayes`, default
    `modelType="multinomial"`, `smoothing=1.0`), and with the
    `RegexTokenizer`, `StopWordsRemover` and `HashingTF` stages from
    "Text Analytics Without an LLM" you could train and apply it without
    any Python on the executors. Prefer MLlib when the algorithm you
    need is there: training is distributed, scoring runs in the JVM, and
    the fitted pipeline saves and loads as one object.

    Use the pattern in this lesson when the model comes from somewhere
    else: a scikit-learn pipeline, a PyTorch or ONNX network, a
    tokenizer from a model hub, a vendor SDK. That is most models people
    actually deploy, and the Spark side stays the same: train or download
    on the driver, ship by file, load once per task, score in batches.

