    ## Reading the Numbers

    The field ids are not guesses. The Thrift classes inside
    `parquet-format-structures-1.17.0.jar` (shipped in pyspark's `jars/`)
    list them; this is what they say for the structs you need:

    | Struct | Fields |
    |---|---|
    | FileMetaData | 1 version, 2 schema, 3 num_rows, 4 row_groups, 5 key_value_metadata, 6 created_by, 7 column_orders |
    | SchemaElement | 1 type, 3 repetition_type, 4 name, 5 num_children, 6 converted_type, 7 scale, 8 precision, 10 logicalType |
    | RowGroup | 1 columns, 2 total_byte_size, 3 num_rows, 5 file_offset, 6 total_compressed_size, 7 ordinal |
    | ColumnChunk | 3 meta_data, 4/5 offset index offset/length, 6/7 column index offset/length |
    | ColumnMetaData | 1 type, 2 encodings, 3 path_in_schema, 4 codec, 5 num_values, 7 total_compressed_size, 9 data_page_offset, 11 dictionary_page_offset, 12 statistics, 14/15 bloom filter offset/length |
    | Statistics | 1 max, 2 min (deprecated), 3 null_count, 5 max_value, 6 min_value |
    | PageHeader | 1 type, 2 uncompressed size, 3 compressed size, 5 data page header, 7 dictionary page header, 8 data page header v2 |

    And the enums: physical type 0 BOOLEAN, 1 INT32, 2 INT64, 3 INT96,
    4 FLOAT, 5 DOUBLE, 6 BYTE_ARRAY, 7 FIXED_LEN_BYTE_ARRAY; repetition 0
    REQUIRED, 1 OPTIONAL, 2 REPEATED; encoding 0 PLAIN, 2
    PLAIN_DICTIONARY, 3 RLE, 4 BIT_PACKED, 5 DELTA_BINARY_PACKED, 7
    DELTA_BYTE_ARRAY, 8 RLE_DICTIONARY; codec 0 UNCOMPRESSED, 1 SNAPPY,
    2 GZIP, 6 ZSTD, 7 LZ4_RAW.

    So `{1: 2, 3: 1, 4: b'user_id'}` is an OPTIONAL INT64 named
    `user_id`; `{1: 3, 3: 1, 4: b'ts'}` is an OPTIONAL **INT96**. The
    root element has `num_children` 4 and no type: it is a group. Spark
    also stores its own schema as JSON in the key-value metadata
    (`org.apache.spark.sql.parquet.row.metadata`), and its reader
    (`ParquetReadSupport`) uses it to restore Spark types and column
    metadata that the Parquet types alone don't carry: the INT96 `ts`
    comes back as a Spark `timestamp` because the JSON says so.

    pyarrow gives the same facts, decoded:

    ```python
    import pyarrow.parquet as pq
    md = pq.ParquetFile(f).metadata
    print(md.num_rows, md.num_row_groups, md.serialized_size, md.created_by)
    col = md.row_group(0).column(3)
    print(col.path_in_schema, col.physical_type, col.encodings, col.compression)
    print(col.statistics.min, col.statistics.max, col.statistics.null_count)
    ts = md.row_group(0).column(2)
    print(ts.path_in_schema, ts.physical_type, ts.statistics.has_min_max)
    ```

    ```text
    20 1 904 parquet-mr version 1.17.0 (build fac0c746532e133beb928a7f6a7e57b510b477a1)
    user_id INT64 ('BIT_PACKED', 'PLAIN_DICTIONARY', 'RLE') SNAPPY
    0 4 0
    ts INT96 False
    ```

    Hold on to that last line: the timestamp column has **no min/max**.
    It comes back later as a performance bug.

