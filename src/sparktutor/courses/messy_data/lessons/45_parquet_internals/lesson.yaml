    ## A Bigger File to Work With

    Twenty rows don't show row groups or pages. From here on the lesson
    uses a scaled-up copy of the day-one events built inside Spark from
    hashes, so it is the same on every run: 200,000 rows over ten days
    (2026-10-01 to 2026-10-10) and 5000 users, in random arrival order,
    with a 16-character hex `session_id` added. The exercise uses the
    same function:

    ```python
    def make_events(spark, n=200_000):
        h = lambda salt: sf.pmod(sf.hash("id", sf.lit(salt)), sf.lit(1 << 30))
        return spark.range(n).select(
            (h(1) % 5000).cast("bigint").alias("user_id"),
            sf.substring(sf.sha2(sf.col("id").cast("string"), 256), 1, 16).alias("session_id"),
            sf.element_at(sf.array(*[sf.lit(e) for e in ["view", "cart", "purchase"]]),
                          (h(2) % 3 + 1).cast("int")).alias("event"),
            ((h(3) % 5000) / 100).cast("decimal(9,2)").alias("amount"),
            sf.timestamp_seconds(sf.lit(1790812800) + (h(4) % 10) * 86400 + h(5) % 86400).alias("ts"),
        )

    events = make_events(spark).cache()
    ```

    The writer settings that shape a file, with their defaults in
    parquet-mr 1.17.0 (`ParquetOutputFormat` and `ParquetProperties`) and
    Spark 4.2.0 (`SQLConf`):

    | Setting | Default | Controls |
    |---|---|---|
    | `parquet.block.size` | 128 MB | target row group size in bytes |
    | `parquet.block.row.count.limit` | unlimited | maximum rows per row group |
    | `parquet.page.size` | 1 MB | target page size |
    | `parquet.page.row.count.limit` | 20,000 | maximum rows per page |
    | `parquet.dictionary.page.size` | 1 MB | dictionary size before falling back to PLAIN |
    | `parquet.enable.dictionary` | true | dictionary encoding |
    | `parquet.writer.version` | v1 | page format and encodings |
    | `spark.sql.parquet.compression.codec` | snappy | codec |
    | `spark.sql.parquet.outputTimestampType` | INT96 | timestamp encoding |

    Any of them can be passed as a writer option for one write.
    `DataFrameWriter` options are copied into the Hadoop configuration of
    the write job, and `ParquetUtils.prepareWrite` fills in Spark's own
    keys only with `DataSourceUtils.setConfIfAbsent`, so an option wins
    over the session value:

    ```python
    df.write.option("spark.sql.parquet.outputTimestampType", "TIMESTAMP_MICROS") \
        .option("parquet.block.row.count.limit", 10000).parquet(path)
    ```

