    ## Encodings and Codecs, Measured

    `parquet.writer.version=v2` switches to `DATA_PAGE_V2` pages and the
    newer encodings. Spark's vectorized reader has decoded them since 3.3
    (SPARK-36879: `VectorizedDeltaBinaryPackedReader`,
    `VectorizedDeltaByteArrayReader` and friends in
    `sql/core/src/main/java/org/apache/spark/sql/execution/datasources/parquet/`).

    ```python
    events.coalesce(1).sortWithinPartitions("user_id").write.mode("overwrite") \
        .option("parquet.writer.version", "v2").parquet("/tmp/pq_v2")
    md = pq.ParquetFile(glob.glob("/tmp/pq_v2/*.parquet")[0]).metadata
    for j in range(md.num_columns):
        c = md.row_group(0).column(j)
        print(f"{c.path_in_schema:10} {c.encodings}")
    ```

    ```text
    user_id    ('PLAIN', 'RLE_DICTIONARY')
    session_id ('DELTA_BYTE_ARRAY',)
    event      ('PLAIN', 'RLE_DICTIONARY')
    amount     ('PLAIN', 'RLE_DICTIONARY')
    ts         ('PLAIN', 'RLE_DICTIONARY')
    ```

    The page header type is 3 (`DATA_PAGE_V2`) and the file drops from
    5,545,507 to 5,384,067 bytes (snappy, sorted). `session_id` now uses
    `DELTA_BYTE_ARRAY` (shared prefixes plus suffixes) instead of PLAIN.
    Before you switch a table to v2, check that every engine that reads
    it supports v2 data pages.

    The codec, for the same sorted data in one file
    (`.option("compression", codec)`):

    | Codec | Bytes |
    |---|---|
    | none | 6,971,721 |
    | snappy (default) | 5,545,507 |
    | lz4_raw | 5,615,703 |
    | gzip | 3,881,559 |
    | zstd | 3,654,035 |

    The random hex session ids dominate the bytes: zstd and gzip find
    their 4 bits of entropy per character, snappy and LZ4 mostly don't.
    Compression applies **per page** after encoding, so a page must be
    decompressed whole even when one value is needed. That is one more
    reason the page index (below) matters.

