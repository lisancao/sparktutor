    ## INT96 Timestamps, and How the Plan Hides It

    Sort by `ts`, write it both ways, and query a two-hour window:

    ```python
    window = (sf.col("ts") >= sf.lit("2026-10-05 08:00:00").cast("timestamp")) & \
             (sf.col("ts") < sf.lit("2026-10-05 10:00:00").cast("timestamp"))
    by_ts = events.coalesce(1).sortWithinPartitions("ts").write.mode("overwrite") \
        .option("parquet.block.row.count.limit", 10000)
    by_ts.parquet("/tmp/pq_ts_int96")
    by_ts.option("spark.sql.parquet.outputTimestampType", "TIMESTAMP_MICROS").parquet("/tmp/pq_ts_micros")
    for path in ["/tmp/pq_ts_int96", "/tmp/pq_ts_micros"]:
        rows, scanned = rows_scanned(spark.read.parquet(path).filter(window))
        print(path, len(rows), f"{scanned:,}")
    ```

    ```text
    /tmp/pq_ts_int96 1644 200,000
    /tmp/pq_ts_micros 1644 10,000
    ```

    The INT96 plan shows the timestamp filter in `PushedFilters` just
    like the MICROS one. `ParquetFilters` only converts a timestamp
    filter for TIMESTAMP_MICROS or TIMESTAMP_MILLIS columns (the doc of
    the internal `spark.sql.parquet.filterPushdown.timestamp`), and the
    INT96 file would have no statistics to test anyway, so the filter
    is dropped per file in step 2, with no message.

    While you are in the plan, look at the pushed values:

    ```text
    PushedFilters: [IsNotNull(ts), GreaterThanOrEqual(ts,2026-10-05 01:00:00.0), LessThan(ts,2026-10-05 03:00:00.0)]
    ```

    The session time zone is UTC and the query says 08:00. The pushed
    filter holds a `java.sql.Timestamp`, whose `toString` uses the
    **JVM default** time zone (this machine runs in PDT, UTC-7). The
    instant is right; only the display is local. Don't "fix" a filter
    because its plan string looks seven hours off.

    For new tables, write `TIMESTAMP_MICROS`. INT96 is the default for
    compatibility with older Hive and Impala readers.

