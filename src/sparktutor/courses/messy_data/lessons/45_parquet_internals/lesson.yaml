    ## Decoding the Footer Yourself

    The footer is a `FileMetaData` struct from `parquet.thrift` (the
    parquet-format project), serialized with Thrift's **compact
    protocol**. The protocol is small enough to read by hand:

    - A struct is a sequence of fields ending with a `0x00` byte (STOP).
    - Each field starts with one byte: the high nibble is the field id
      **delta** from the previous field (1 to 15), the low nibble the
      type. A delta of 0 means the full id follows as a zigzag varint.
    - Types: 1 and 2 are booleans (the value lives in the type nibble),
      3 is i8, 4, 5 and 6 are i16, i32 and i64 as zigzag varints, 7 a
      little-endian double, 8 binary (varint length, then bytes), 9 a
      list, 11 a map, 12 a nested struct.
    - A list header byte holds the size in its high nibble (15 means a
      varint size follows) and the element type in its low nibble.

    Here is a complete reader for everything a Parquet footer uses. It
    returns each struct as a `{field_id: value}` dict:

    ```python
    class Compact:
        def __init__(self, buf, pos=0):
            self.buf, self.pos = buf, pos

        def byte(self):
            b = self.buf[self.pos]
            self.pos += 1
            return b

        def varint(self):
            shift = result = 0
            while True:
                b = self.byte()
                result |= (b & 0x7F) << shift
                if not b & 0x80:
                    return result
                shift += 7

        def zigzag(self):
            n = self.varint()
            return (n >> 1) ^ -(n & 1)

        def value(self, t):
            if t in (1, 2):
                return t == 1
            if t == 3:
                return struct.unpack("b", bytes([self.byte()]))[0]
            if t in (4, 5, 6):
                return self.zigzag()
            if t == 7:
                v = struct.unpack_from("<d", self.buf, self.pos)[0]
                self.pos += 8
                return v
            if t == 8:
                n = self.varint()
                v = bytes(self.buf[self.pos:self.pos + n])
                self.pos += n
                return v
            if t in (9, 10):
                h = self.byte()
                size, et = h >> 4, h & 0x0F
                if size == 15:
                    size = self.varint()
                if et in (1, 2):          # booleans in a list: one byte each
                    return [self.byte() == 1 for _ in range(size)]
                return [self.value(et) for _ in range(size)]
            if t == 11:
                size = self.varint()
                if size == 0:
                    return {}
                kv = self.byte()
                return {self.value(kv >> 4): self.value(kv & 0x0F) for _ in range(size)}
            if t == 12:
                return self.struct()
            raise ValueError(f"unknown compact type {t} at byte {self.pos}")

        def struct(self):
            fields, last = {}, 0
            while True:
                h = self.byte()
                if h == 0:
                    return fields
                delta, t = h >> 4, h & 0x0F
                fid = last + delta if delta else self.zigzag()
                fields[fid] = self.value(t)
                last = fid

    meta = Compact(data, len(data) - 8 - footer_len).struct()
    print(sorted(meta))
    print("version", meta[1], "num_rows", meta[3], "row groups", len(meta[4]))
    print(meta[6].decode())
    for element in meta[2]:
        print(element)
    for kv in meta[5]:
        print(kv[1].decode(), "=", kv[2][:60].decode(), "...")
    ```

    ```text
    [1, 2, 3, 4, 5, 6, 7]
    version 1 num_rows 20 row groups 1
    parquet-mr version 1.17.0 (build fac0c746532e133beb928a7f6a7e57b510b477a1)
    {4: b'spark_schema', 5: 4}
    {1: 5, 3: 1, 4: b'amount'}
    {1: 6, 3: 1, 4: b'event', 6: 0, 10: {1: {}}}
    {1: 3, 3: 1, 4: b'ts'}
    {1: 2, 3: 1, 4: b'user_id'}
    org.apache.spark.version = 4.2.0 ...
    org.apache.spark.sql.parquet.row.metadata = {"type":"struct","fields":[{"name":"amount","type":"double", ...
    ```

