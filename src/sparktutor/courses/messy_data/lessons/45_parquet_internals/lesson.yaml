    ## Pages, Byte by Byte

    A column chunk is a sequence of pages, each a Thrift `PageHeader`
    followed by `compressed_page_size` bytes. Walk them with the same
    reader (written uncompressed so the bytes are readable):

    ```python
    (events.coalesce(1).sortWithinPartitions("user_id").write.mode("overwrite")
        .option("compression", "none").parquet("/tmp/pq_pages"))
    f = glob.glob("/tmp/pq_pages/*.parquet")[0]
    data = open(f, "rb").read()
    (n,) = struct.unpack("<I", data[-8:-4])
    meta = Compact(data, len(data) - 8 - n).struct()
    PAGE_TYPES = {0: "DATA_PAGE", 2: "DICTIONARY_PAGE", 3: "DATA_PAGE_V2"}

    def pages(chunk):
        md = chunk[3]
        pos = md.get(11, md[9])                 # dictionary page first, if any
        end = pos + md[7]                       # total_compressed_size
        while pos < end:
            r = Compact(data, pos)
            header = r.struct()
            yield pos, r.pos, header            # header start, body start, header
            pos = r.pos + header[3]             # skip compressed_page_size bytes

    for chunk in meta[4][0][1]:
        name = chunk[3][3][0].decode()
        for start, body, h in pages(chunk):
            detail = h.get(5) or h.get(7)       # data or dictionary page header
            print(f"{name:10} {PAGE_TYPES[h[1]]:15} at {start:8} size {h[3]:7} "
                  f"values {detail[1]:6} encoding {detail[2]}")
    ```

    An excerpt of the output:

    ```text
    user_id    DICTIONARY_PAGE at        4 size   40000 values   5000 encoding 2
    user_id    DATA_PAGE       at    40028 size    1494 values  20000 encoding 2
    user_id    DATA_PAGE       at    41548 size    1488 values  20000 encoding 2
    ...
    session_id DATA_PAGE       at    55444 size  400008 values  20000 encoding 0
    session_id DATA_PAGE       at   455481 size  400008 values  20000 encoding 0
    ...
    event      DICTIONARY_PAGE at  4055813 size      28 values      3 encoding 2
    event      DATA_PAGE       at  4055860 size    5042 values  20000 encoding 2
    ...
    ts         DICTIONARY_PAGE at  4452348 size  916044 values  76337 encoding 2
    ts         DATA_PAGE       at  5368416 size   37549 values  20000 encoding 2
    ts         DATA_PAGE       at  5405994 size   40049 values  20000 encoding 2
    ts         DATA_PAGE       at  5446072 size   40049 values  20000 encoding 2
    ts         DATA_PAGE       at  5486150 size   42549 values  20000 encoding 2
    ts         DATA_PAGE       at  5528728 size  240008 values  20000 encoding 0
    ts         DATA_PAGE       at  5768765 size  240008 values  20000 encoding 0
    ...
    ```

    Every column has ten data pages of 20,000 values: the page row
    limit, not the 1 MB page size, cut them. Three encoding stories are
    visible in the headers:

    - **user_id, event, amount**: a dictionary page (PLAIN values) and
      data pages of dictionary indices (encoding 2, PLAIN_DICTIONARY,
      which is the v1 name for dictionary indices).
    - **session_id**: no dictionary page at all, PLAIN pages of
      `4 + 16` bytes per value. 200,000 distinct random strings would
      make the dictionary bigger than the data, so the writer's
      fallback (`FallbackValuesWriter` in parquet-mr) switched to PLAIN
      before the first page was written.
    - **ts**: the most instructive one. The first four pages are
      dictionary indices; then the dictionary reached the 1 MB
      `parquet.dictionary.page.size` limit (76,337 distinct INT96 values
      of 12 bytes) and the writer **fell back mid-chunk**. The remaining
      six pages are PLAIN (`240008` bytes = 20,000 x 12 + 8). Encoding is
      decided page by page, which is why `ColumnMetaData.encodings` is a
      list.

