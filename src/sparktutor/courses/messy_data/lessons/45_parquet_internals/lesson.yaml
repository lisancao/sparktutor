    ## Bloom Filters: When Min/Max Can't Help

    `session_id` is random, so every row group's min/max spans almost
    the whole key space and dictionary filtering is off the table (no
    dictionary). A **split-block bloom filter** per column chunk
    answers "definitely not here" with a configurable false-positive
    rate. Spark has used them on read since 3.2 (SPARK-34562); on write
    you enable them per column with parquet-mr's options:

    ```python
    key = events.filter("user_id = 4321").select("session_id").first()[0]

    def write(path, **options):
        w = events.coalesce(1).write.mode("overwrite").option("parquet.block.row.count.limit", 2000)
        for k, v in options.items():
            w = w.option(k, v)
        w.parquet(path)
        f = glob.glob(path + "/*.parquet")[0]
        chunk = pq.ParquetFile(f).metadata.row_group(0).column(1)
        _, scanned = rows_scanned(spark.read.parquet(path).filter(sf.col("session_id") == key))
        print(f"{path:18} {os.path.getsize(f):>12,} bytes  bloom/row group {chunk.bloom_filter_length}  scanned {scanned:,}")

    write("/tmp/pq_nobloom")
    write("/tmp/pq_bloom_1mb", **{"parquet.bloom.filter.enabled#session_id": "true"})
    write("/tmp/pq_bloom", **{"parquet.bloom.filter.enabled#session_id": "true",
                              "parquet.bloom.filter.expected.ndv#session_id": "2000"})
    ```

    ```text
    /tmp/pq_nobloom       7,086,877 bytes  bloom/row group None  scanned 200,000
    /tmp/pq_bloom_1mb   111,947,277 bytes  bloom/row group 1048594  scanned 2,000
    /tmp/pq_bloom         7,498,877 bytes  bloom/row group 4112  scanned 2,000
    ```

    Both bloom layouts find the one row group. The middle line is the
    trap: without `parquet.bloom.filter.expected.ndv#col`, parquet-mr
    sizes every filter at `parquet.bloom.filter.max.bytes` (1 MiB), so
    100 row groups add 100 MiB to a 7 MB file. Size the filter for the
    distinct values **per row group**, not per table. With the expected
    NDV set to 2000 and the default false-positive probability
    (`parquet.bloom.filter.fpp`, 0.01) each filter is 4 KiB. Reading
    with `parquet.filter.bloom.enabled=false` scans all 200,000 rows
    again.

    Bloom filters only answer equality and `IN`. They are worth their
    bytes on high-cardinality columns that queries look up by value
    (ids, hashes, emails) and that you can't sort by.

