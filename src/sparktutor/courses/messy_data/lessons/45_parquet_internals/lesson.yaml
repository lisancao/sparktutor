- Class: text
  Depth: all
  Output: |
    ## Summary

    - A Parquet file is `PAR1`, row groups of column chunks of pages,
      page indexes and bloom filters, a Thrift compact `FileMetaData`,
      a 4-byte little-endian length and `PAR1`. You can decode all of
      it with a hundred lines of Python.
    - Pages carry their own encoding: dictionary indices in the
      RLE/bit-packed hybrid, PLAIN after a dictionary overflows
      (`parquet.dictionary.page.size`, 1 MB) or when values are too
      distinct, `DELTA_BYTE_ARRAY` and `RLE_DICTIONARY` with the v2
      writer. Sorting turns bit-packing into runs.
    - `PushedFilters` are candidates. Each task rebuilds
      `ParquetFilters` from its file's schema and drops what it can't
      map; parquet-mr then skips row groups by statistics, dictionaries
      and bloom filters, and pages by the column index. The scan's
      `number of output rows` measures what is left.
    - Silent defeats in 4.2.0: INT96 timestamps (the default output
      type) have no statistics; expressions and casts on a column;
      repeated fields (SPARK-39393); shredded VARIANT fields (their
      statistics are never consulted); `partitionBy` with a sort that
      doesn't start with the partition columns.
    - Bloom filters need `parquet.bloom.filter.expected.ndv#col`, or
      each costs 1 MiB per row group.
    - Above 10 values, an `IN` list is pushed as parquet-mr's `in`
      predicate, not as the min/max range the config doc describes.
    - Row groups are the unit of parallelism; splits keep the row
      groups whose midpoint they contain.

    Next: **The VARIANT Binary Format**, where you go one level deeper
    and decode the bytes inside those `v.value` and `v.metadata`
    columns by hand.
