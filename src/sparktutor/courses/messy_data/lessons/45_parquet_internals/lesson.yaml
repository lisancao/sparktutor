      straddle a boundary.
    - **Sorted, one row group**: the row group can't be skipped, but the
      **column index** keeps one page of 20,000 rows.

    Switching the mechanisms off one at a time, on the sorted
    one-row-group file (`spark.read.option(key, "false")`, which reaches
    the Hadoop conf of the scan):

    | Disabled | Rows scanned |
    |---|---|
    | nothing | 20,000 |
    | `parquet.filter.stats.enabled` | 20,000 |
    | `parquet.filter.dictionary.enabled` | 20,000 |
    | `parquet.filter.columnindex.enabled` | 200,000 |
    | all three | 200,000 |

