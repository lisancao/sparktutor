    ## The File from End to End

    A Parquet file is written front to back and read back to front:

    ```text
    "PAR1"                                  4 bytes of magic
    row group 0
      column chunk user_id    [dictionary page] data page, data page, ...
      column chunk event      [dictionary page] data page, ...
      ...
    row group 1
      ...
    column indexes and offset indexes       (page-level statistics)
    bloom filters                           (if enabled)
    FileMetaData                            Thrift compact protocol
    footer length                           4 bytes, little-endian
    "PAR1"                                  4 bytes of magic
    ```

    The writer cannot know the metadata until every row group is
    flushed, so the metadata goes last. A reader seeks to the end, reads
    8 bytes, and knows where the footer starts. Write the day-one events
    and look:

    ```python
    import glob, struct
    from pyspark.sql import functions as sf

    day1 = (spark.read.json("data/messy/events/events_2026-10-01.json")
            .withColumn("ts", sf.to_timestamp("ts")))
    day1.coalesce(1).write.mode("overwrite").parquet("/tmp/pq_day1")
    f = glob.glob("/tmp/pq_day1/*.parquet")[0]
    data = open(f, "rb").read()
    print(len(data), data[:4], data[-4:])
    print(data[-12:].hex(" "))
    (footer_len,) = struct.unpack("<I", data[-8:-4])
    print("footer:", footer_len, "bytes, starting at offset", len(data) - 8 - footer_len)
    ```

    ```text
    1619 b'PAR1' b'PAR1'
    1c 00 00 00 88 03 00 00 50 41 52 31
    footer: 904 bytes, starting at offset 707
    ```

    `88 03 00 00` is 904 in little-endian, and `50 41 52 31` is `PAR1`.
    The 20 rows of data take about 700 bytes; the metadata describing
    them takes 904. For tiny files the footer dominates, which is one
    more reason small files hurt: every reader of every file pays a seek
    to the end and a footer parse before it reads a single value.

