    ## From PushedFilters to a Skipped Row Group

    The plan's `PushedFilters` is a promise, not a result. Here is the
    path a filter takes in 4.2.0 (file paths under
    `sql/core/src/main/` in the Spark repo):

    1. `FileSourceStrategy` splits the filter into partition filters and
       data filters, and translates the data filters into
       `org.apache.spark.sql.sources.Filter` objects. Those are the
       `PushedFilters` you see. The `Filter` node stays in the plan above
       the scan, always, because skipping is coarse.
    2. In each task, `ParquetFileFormat.buildReaderWithPartitionValues`
       (`scala/.../datasources/parquet/ParquetFileFormat.scala`) reads
       **that file's** footer and builds a `ParquetFilters` from the
       file's own schema. `ParquetFilters.createFilter` converts each
       source filter into a parquet-mr `FilterPredicate`, or drops it
       when it can't (`flatMap`): a column missing from this file, an
       unsupported type, a type that has been disabled.
    3. The predicate goes into the Hadoop conf with
       `ParquetInputFormat.setFilterPredicate`.
    4. parquet-mr's `ParquetFileReader` drops whole row groups with
       three independent tests (`RowGroupFilter`): statistics
       (`parquet.filter.stats.enabled`), dictionaries
       (`parquet.filter.dictionary.enabled`) and bloom filters
       (`parquet.filter.bloom.enabled`). All default to true.
    5. In the surviving row groups, `ColumnIndexFilter` turns page
       statistics into row ranges (`parquet.filter.columnindex.enabled`,
       default true), and `readNextFilteredRowGroup` returns only the
       matching pages. Spark's `VectorizedParquetRecordReader` has
       handled those row ranges since 3.2 (SPARK-26345, with
       SPARK-34859 for synchronizing pages across columns).
    6. Rows inside surviving pages are **not** filtered by parquet-mr:
       record-level filtering (`spark.sql.parquet.recordLevelFilter.enabled`)
       is off by default and only applies to the non-vectorized reader.
       The `Filter` node above the scan does that work.

    Step 6 gives you a measuring instrument. The vectorized reader
    returns every row of every surviving page, so the scan's
    `number of output rows` metric counts exactly what skipping left.
    (Its `size of files read` metric is no help: it is the size of the
    files, not the bytes read.) In classic mode you can read it from the
    executed plan after an action:

    ```python
    def rows_scanned(df):
        rows = df.collect()
        plan = df._jdf.queryExecution().executedPlan()
        total = 0

        def walk(node):
            nonlocal total
            name = node.getClass().getSimpleName()
            if name == "AdaptiveSparkPlanExec":
                return walk(node.executedPlan())
            if name == "FileSourceScanExec":
                total += node.metrics().apply("numOutputRows").value()
            children = node.children().iterator()
            while children.hasNext():
                walk(children.next())

        walk(plan)
        return rows, total
    ```

    (A plan with a shuffle wraps stages in `QueryStageExec` leaves after
    AQE runs; the lookups in this lesson have no shuffle, so the walk
    stays simple.)

