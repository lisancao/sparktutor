  Output: |
    ## Designing for Skipping

    Everything above turns into a short list of layout rules:

    - **Sort by what you look up.** Statistics and the column index
      only skip when values are clustered. A sort costs one shuffle at
      write time and pays back on every read; it also shrinks the file
      (runs instead of bit-packing).
    - **You get one sort order.** Two lookup columns compete. Cluster by
      the coarse one (a day) and sort by the fine one inside it, or put
      a bloom filter on the column you can't sort by.
    - **Size row groups for the lookups and the parallelism.** Smaller
      row groups skip more finely; each one costs footer space, a seek
      and less compression. 128 MB is a throughput default, not a law.
    - **Use types that have statistics.** TIMESTAMP_MICROS, not INT96.
    - **Size bloom filters per row group** with
      `parquet.bloom.filter.expected.ndv#col`.
    - **Check `partitionBy`.** The planned-write rule `V1Writes`
      (`sql/core/.../datasources/V1Writes.scala`) requires the data to
      be sorted by the partition columns. If your sort doesn't start
      with them, it adds its own `Sort` on the partition columns and
      your order inside each partition is gone:

      ```python
      for order in [["user_id"], ["day", "user_id"]]:
          path = "/tmp/pq_by_day_" + "_".join(order)
          (events.withColumn("day", sf.to_date("ts")).repartition("day").sortWithinPartitions(*order)
              .write.mode("overwrite").partitionBy("day").option("parquet.block.row.count.limit", 1000).parquet(path))
          f = glob.glob(path + "/day=2026-10-05/*.parquet")[0]
          stats = row_group_stats(f, "user_id")
          print(order, "row groups", len(stats), "first ranges", [(lo, hi) for _, lo, hi in stats[:3]])
      ```

      ```text
      ['user_id'] row groups 21 first ranges [(1, 4997), (5, 4999), (1, 4997)]
      ['day', 'user_id'] row groups 21 first ranges [(0, 229), (229, 476), (476, 707)]
      ```

      Same data, same row groups; only the first layout's statistics are
      useless. Always sort by the partition columns first.
    - **Verify with the footer and the metric**, never with the plan
      alone.

