    ## Splits Are Byte Ranges, Row Groups Are Not

    A file bigger than `spark.sql.files.maxPartitionBytes` (128 MB by
    default) is split into byte ranges, one task each. Row groups don't
    line up with those ranges, so `ParquetFooterReader.buildFilter`
    passes the task's range to parquet-mr (`withRange`), which keeps
    the row groups whose **midpoint** falls inside it. With a 1 MB
    split size on the 6 MB, 20-row-group file:

    ```python
    spark.conf.set("spark.sql.files.maxPartitionBytes", "1m")
    d = spark.read.parquet("/tmp/pq_sorted_20_row_groups")
    print(d.rdd.getNumPartitions())
    print(d.groupBy(sf.spark_partition_id().alias("task")).count().orderBy("task").collect())
    ```

    ```text
    6
    [Row(task=0, count=30000), Row(task=1, count=40000), Row(task=2, count=30000), Row(task=3, count=40000), Row(task=4, count=30000), Row(task=5, count=30000)]
    ```

    Every task gets whole row groups (multiples of 10,000 rows). If a
    row group is bigger than the split size, some tasks get none at all
    and finish instantly: a row group is the unit of parallelism for
    Parquet. Writing 1 GB row groups doesn't make reads faster; it
    makes them serial.

