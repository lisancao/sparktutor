    ## Statistics and the Page Index

    Each column chunk carries `Statistics` in its metadata. For a
    10,000-row-group, user-sorted file:

    ```python
    (events.coalesce(1).sortWithinPartitions("user_id").write.mode("overwrite")
        .option("parquet.block.row.count.limit", 10000).parquet("/tmp/pq_sorted"))
    f = glob.glob("/tmp/pq_sorted/*.parquet")[0]
    data = open(f, "rb").read()
    (n,) = struct.unpack("<I", data[-8:-4])
    meta = Compact(data, len(data) - 8 - n).struct()
    for rg in meta[4][:3]:
        user, session, event, amount, ts = (c[3] for c in rg[1])
        print(rg[3], "user_id", user[12], "| ts", ts[12])
    ```

    ```text
    10000 user_id {1: b'\xf9\x00\x00\x00\x00\x00\x00\x00', 2: b'\x00\x00\x00\x00\x00\x00\x00\x00', 3: 0, 5: b'\xf9\x00\x00\x00\x00\x00\x00\x00', 6: b'\x00\x00\x00\x00\x00\x00\x00\x00'} | ts {3: 0}
    10000 user_id {1: b'\xee\x01\x00\x00\x00\x00\x00\x00', 2: b'\xf9\x00\x00\x00\x00\x00\x00\x00', 3: 0, 5: b'\xee\x01\x00\x00\x00\x00\x00\x00', 6: b'\xf9\x00\x00\x00\x00\x00\x00\x00'} | ts {3: 0}
    ...
    ```

    Values are PLAIN-encoded: `f9 00 ... 00` is the INT64 249. The
    writer fills both the deprecated `min`/`max` (fields 2 and 1) and
    the newer `min_value`/`max_value` (6 and 5) for signed integers.
    The old pair was defined with an ambiguous sort order, so readers
    only trust it where signed comparison is the right one; for strings
    only the new pair is written. And `ts`, an INT96, has only a null
    count: the Parquet format leaves INT96's sort order undefined, and
    parquet-mr writes no min/max for it.

    Row-group statistics are coarse. parquet-mr also stores a **column
    index** (min/max per page) and an **offset
    index** (where each page starts and its first row), after the row
    groups. In a single 200,000-row group sorted by user:

    ```python
    f = glob.glob("/tmp/pq_sorted_1_row_group/*.parquet")[0]   # written in the next section
    data = open(f, "rb").read()
    (n,) = struct.unpack("<I", data[-8:-4])
    meta = Compact(data, len(data) - 8 - n).struct()
    user_chunk = meta[4][0][1][0]
    ci = Compact(data, user_chunk[6]).struct()
    oi = Compact(data, user_chunk[4]).struct()
    print("boundary order", ci[4], "null pages", ci[1])
    print("page min/max", [(struct.unpack("<q", lo)[0], struct.unpack("<q", hi)[0])
                           for lo, hi in zip(ci[2], ci[3])])
    print("pages (offset, size, first row)", [(p[1], p[2], p[3]) for p in oi[1]])
    print("ts has a column index:", 6 in meta[4][0][1][4])
    ```

    ```text
    boundary order 1 null pages [False, False, False, False, False, False, False, False, False, False]
    page min/max [(0, 494), (494, 986), (986, 1481), (1481, 1984), (1984, 2492), (2492, 2987), (2987, 3491), (3491, 3989), (3989, 4495), (4495, 4999)]
    pages (offset, size, first row) [(20047, 1526, 0), (21573, 1520, 20000), (23093, 1529, 40000), (24622, 1562, 60000), (26184, 1568, 80000), (27752, 1529, 100000), (29281, 1566, 120000), (30847, 1538, 140000), (32385, 1562, 160000), (33947, 1567, 180000)]
    ts has a column index: False
    ```

    Boundary order 1 is ASCENDING: the writer noticed the pages are
    sorted, which lets a reader binary-search them. The INT96 column has
    no column index either. Long strings are truncated to 64 bytes in
    the column index (`parquet.columnindex.truncate.length`), while
    row-group statistics keep the full value by default
    (`parquet.statistics.truncate.length` is unlimited), so a column of
    long, similar URLs can have exact chunk statistics and nearly useless
    page statistics.

