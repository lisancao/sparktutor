    ## Nested Columns: Repetition and Definition Levels

    Parquet stores `items[].sku` as one flat column of leaf values plus
    two small integers per entry. The schema Spark writes for
    `items array<struct<sku:string,qty:bigint>>` is the three-level LIST
    layout:

    ```text
    optional group items (List) {          level 1: items is defined
      repeated group list {                level 2: at least one element; repeats
        optional group element {           level 3: the element is not null
          optional binary sku (String);    level 4: sku is not null
          optional int64 qty;
        }
      }
    }
    ```

    The **definition level** of an entry says how deep the path is
    defined (0 to 4 here); the **repetition level** says at which
    repeated level this entry starts a new element (0 means a new row,
    1 another element in the same list). Decode them from a real page:
    read a v1 data page header, then the repetition levels and the
    definition levels, each preceded by a 4-byte length and encoded
    with `rle_hybrid` at `max_level.bit_length()` bits:

    ```python
    def levels(path, leaf, max_rep, max_def):
        data = open(glob.glob(path + "/*.parquet")[0], "rb").read()
        (n,) = struct.unpack("<I", data[-8:-4])
        meta = Compact(data, len(data) - 8 - n).struct()
        chunk = next(c[3] for c in meta[4][0][1] if c[3][3][-1] == leaf.encode())
        r = Compact(data, chunk[9]); header = r.struct(); pos = r.pos
        count = header[5][1]
        out = []
        for max_level in (max_rep, max_def):     # v1 page: rep levels, then def levels
            (length,) = struct.unpack_from("<I", data, pos)
            lv, _ = rle_hybrid(data, pos + 4, pos + 4 + length, max_level.bit_length(), count)
            out.append(lv)
            pos += 4 + length
        return count, out[0], out[1]
    ```

    On the three days of events (sorted by `ts`, uncompressed), the sku
    column has 81 entries for 60 rows. Entries 18 to 23 cover the last
    two day-one rows (no `items`) and the first two day-two rows (three
    items, then one):

    ```text
    entries 18-23 rep: [0, 0, 0, 1, 1, 0]
    entries 18-23 def: [0, 0, 4, 4, 4, 4]
    ```

    The events have no empty lists or null elements, so build the full
    set of cases:

    ```python
    demo = spark.createDataFrame(
        [(1, None), (2, []), (3, [None]), (4, [("P1", None), (None, 2)]), (5, [("P4", 3), ("P2", 1)])],
        "id int, items array<struct<sku:string,qty:bigint>>")
    ```

    ```text
    sku rep [0, 0, 0, 0, 1, 0, 1] def [0, 1, 2, 4, 3, 4, 4]
    qty rep [0, 0, 0, 0, 1, 0, 1] def [0, 1, 2, 3, 4, 4, 4]
    ```

    | Row | items | sku entries (rep, def) |
    |---|---|---|
    | 1 | NULL | (0, 0) |
    | 2 | `[]` | (0, 1) |
    | 3 | `[NULL]` | (0, 2) |
    | 4 | `[{P1, NULL}, {NULL, 2}]` | (0, 4), (1, 3) |
    | 5 | `[{P4, 3}, {P2, 1}]` | (0, 4), (1, 4) |

    Each null, empty list and missing field costs one entry with a low
    definition level and no value. Two consequences for messy data: a
    reader must decode levels for every entry even when it wants one
    field, and a leaf has no per-row statistics that a row filter could
    use, which is the root of SPARK-39393.

