    ## Aggregates from the Footer

    `spark.sql.parquet.aggregatePushdown` (default false, since 3.3)
    answers MIN, MAX and COUNT from footer statistics. It only exists in
    the DSv2 Parquet scan, and Spark 4.2 still reads Parquet through the
    V1 `FileSourceScanExec` by default
    (`spark.sql.sources.useV1SourceList` defaults to
    `avro,csv,json,kafka,orc,parquet,text`). Setting the flag alone
    changes nothing; the plan keeps a `FileScan parquet` that reads
    every value. Remove `parquet` from the V1 list as well:

    ```python
    spark.conf.set("spark.sql.parquet.aggregatePushdown", "true")
    spark.conf.set("spark.sql.sources.useV1SourceList", "avro,csv,json,kafka,orc,text")
    spark.read.parquet("/tmp/pq_sorted_20_row_groups") \
        .agg(sf.min("user_id"), sf.max("user_id"), sf.count("*")).explain()
    ```

    ```text
    +- BatchScan parquet file:/tmp/pq_sorted_20_row_groups[min(user_id)#767L, max(user_id)#768L, count(*)#769L] ParquetScan ... PushedAggregation: [MIN(user_id), MAX(user_id), COUNT(*)], ...
    ```

    The result is the same (`0, 4999, 200000`), computed from 20 row
    group footers. The config doc warns that a file without statistics
    makes the query fail, and the switch to the V2 scan changes other
    behaviour too, so treat this as a targeted tool, not a default.

