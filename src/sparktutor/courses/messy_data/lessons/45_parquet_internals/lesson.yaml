    ## What You'll Learn

    Every messy-data pipeline in this course ends in Parquet, directly or
    under a table format. "Plans, Partitions and Caching" showed you
    `PushedFilters` in a plan, "Filter Pushdown" taught you what a source
    can be told, and "VARIANT Shredding and Performance" (intermediate
    level) used pyarrow to peek at a footer. Those lessons trusted the
    plan. This one opens the file.

    You will read Parquet the way a reader does, byte by byte: the magic
    number, the footer length, the Thrift-encoded metadata, the page
    headers, the RLE/bit-packed runs of a dictionary-encoded column and
    the repetition and definition levels of a nested one. Then you will
    follow a pushed filter from the plan into parquet-mr and measure,
    with Spark's own scan metric, how many rows each skipping mechanism
    really avoids.

    By the end you will be able to:

    - Decode a Parquet footer with a hand-written Thrift compact protocol
      reader and cross-check it with pyarrow
    - Walk the pages of a column chunk and decode dictionary indices and
      levels by hand
    - Name the code path from `PushedFilters` to a skipped row group in
      Spark 4.2.0 and parquet-mr 1.17.0, and the four independent
      skipping mechanisms (statistics, dictionaries, bloom filters, the
      column index)
    - Prove skipping with the `number of output rows` metric of the scan
    - Recognize the layouts and types that silently defeat skipping:
      INT96 timestamps, expressions, repeated fields, shredded VARIANT
      fields, oversized bloom filters, and a `partitionBy` that discards
      your sort order
    - Design a file layout for a set of queries and prove it works

    Everything here runs in classic mode: the scan metric is read from
    the JVM plan through `df._jdf`, as in "How Catalyst Plans Python".

