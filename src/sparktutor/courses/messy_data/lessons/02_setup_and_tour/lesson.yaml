    ## Long Tracebacks

    A failure inside a task (say, a Python UDF that raises) produces a
    long report: the Python traceback of your script, then Spark's
    summary, then the worker's own Python traceback, and in the logs a
    JVM stack trace. To find what went wrong:

    - Look for the error condition in brackets first
      (`[PYTHON_EXCEPTION]`, `[CAST_INVALID_INPUT]`, ...).
    - For a `PythonException`, the useful part is the **last** Python
      traceback, the one from the worker, which ends with your
      exception and the line of your function that raised it.
    - For JVM errors, read the `Caused by:` lines from the bottom up;
      the last one is the root cause.

    By default classic PySpark leaves the JVM stack trace out of the
    Python exception (`spark.sql.pyspark.jvmStacktrace.enabled` is
    `false`); setting it to `true` adds it, which is mostly useful when
    reporting a bug in Spark itself.

