    ## Reading Error Messages

    Spark 4 errors follow one format. A misspelled column:

    ```python
    events.select("evnt")
    ```

    ```
    pyspark.errors.exceptions.captured.AnalysisException: [UNRESOLVED_COLUMN.WITH_SUGGESTION]
    A column, variable, or function parameter with name `evnt` cannot be resolved. Did you
    mean one of the following? [`event`, `ts`, `amount`, `items`, `user`]. SQLSTATE: 42703;
    ```

    Read it in four parts:

    1. **The exception class**, `AnalysisException`: Spark rejected the
       query while checking it, before running anything. Other common
       ones are `PythonException` (your Python code failed inside a
       worker), `ArithmeticException` (for example an overflow under
       ANSI mode), `IllegalArgumentException` and `PySparkRuntimeError`.
    2. **The error condition** in brackets,
       `UNRESOLVED_COLUMN.WITH_SUGGESTION`: a stable name you can search
       for in the Spark documentation and match on in code. A dot
       separates a condition from its sub-condition.
    3. **The message**, with the details filled in, often including a
       "Did you mean" list of similar names.
    4. **The SQLSTATE**, `42703`: a five-character code from the SQL
       standard. The first two characters are the class: `42` means the
       query itself is wrong (syntax or names), `22` means a data value
       is wrong (a bad cast, an overflow), `0A` means a feature is not
       supported.

    A missing path looks like this:

    ```
    [PATH_NOT_FOUND] Path does not exist: file:/.../data/messy/event. SQLSTATE: 42K03
    ```

    Note the `file:/` and the full path: Spark resolved the relative path
    against the current folder, so this is also how you find out where
    it was looking.

