    ## Transformations and Actions, Again

    "Why Spark for Messy Data, and How It Runs Your Code" showed that
    transformations build a plan and actions run it. The everyday split:

    - **Transformations** (return a DataFrame, run nothing): `select`,
      `filter` / `where`, `withColumn`, `withColumns`, `drop`,
      `groupBy(...).agg(...)`, `join`, `orderBy`, `limit`, `distinct`,
      `union`.
    - **Actions** (run a job, return a value or write): `show`, `count`,
      `first`, `take`, `head`, `collect`, `toPandas`, `foreach`,
      `write...save()`.
    - **Neither**: `columns`, `dtypes`, `schema`, `printSchema()` and
      `explain()` only look at the plan (but reading JSON or CSV without
      a schema may already have run a job to infer it).

    A useful consequence: you can build a long chain step by step, and
    check it with `printSchema()` or `explain()` before spending any time
    running it.

