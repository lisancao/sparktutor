    ## SQL or Python? Both Make the Same Plan

    The same question in the DataFrame API:

    ```python
    by_file = (logs.filter(F.col("value").like("%ERROR%"))
                   .groupBy("file").agg(F.count("*").alias("n"))
                   .orderBy("file"))
    by_file.show()
    ```

    It prints the same table, and more importantly the same plan. After
    removing the internal id numbers, the `explain()` output of the SQL
    version and of this one were identical:

    ```
    AdaptiveSparkPlan isFinalPlan=false
    +- Sort [file ASC NULLS FIRST], true, 0
       +- Exchange rangepartitioning(file ASC NULLS FIRST, 200), ...
          +- HashAggregate(keys=[file], functions=[count(1)])
             +- Exchange hashpartitioning(file, 200), ...
                +- HashAggregate(keys=[file], functions=[partial_count(1)])
                   +- Project [_metadata.file_name AS file]
                      +- Filter (isnotnull(value) AND Contains(value, ERROR))
                         +- ...
                            +- FileScan text [value,file_name] ... PushedFilters: [IsNotNull(value), StringContains(value,ERROR)] ...
    ```

    Both go through the same optimizer, which even rewrote
    `LIKE '%ERROR%'` into a simple `Contains` and pushed it to the file
    reader. So choose by readability, not speed: SQL is often clearer for
    joins and aggregations, Python for logic you build in a loop or
    reuse as functions. Mixing them is normal; this course does both,
    and `F.expr("...")` and `selectExpr(...)` let you drop a SQL
    expression into DataFrame code ("Columns and Expressions: Cleaning
    Values" uses them).

