    ## SQL and Temporary Views

    Spark speaks SQL as well as Python. To query a DataFrame with SQL,
    give it a name as a **temporary view**:

    ```python
    logs = spark.read.text("data/messy/logs").withColumn("file", F.col("_metadata.file_name"))
    logs.createOrReplaceTempView("logs")

    spark.sql("""
        SELECT file, count(*) AS n
        FROM logs
        WHERE value LIKE '%ERROR%'
        GROUP BY file
        ORDER BY file
    """).show()
    ```

    ```
    +-------+---+
    |   file|  n|
    +-------+---+
    |app.log| 18|
    +-------+---+
    ```

    (`F` is `pyspark.sql.functions`, imported as
    `from pyspark.sql import functions as F`; the whole course uses that
    convention.)

    - A temporary view is just a name for a DataFrame's plan. It stores
      no data, belongs to this session, and disappears when the session
      stops. `createOrReplaceTempView` replaces a view of the same name;
      `spark.catalog.listTables()` lists the views.
    - `spark.sql(...)` returns a DataFrame, so you can keep going in
      Python (`.filter(...)`, `.show()`), and `spark.table("logs")` turns
      a view name back into a DataFrame.
    - SQL can also read files directly, with the format as a prefix and
      the path in backticks:
      ``spark.sql("SELECT count(*) FROM json.`data/messy/events`")``
      gave 61.

    **Gotcha: the hidden `_metadata` column does not pass through a
    view.** `SELECT _metadata.file_name FROM events` on a view made from
    `spark.read.json(...)` failed with
    `[UNRESOLVED_COLUMN.WITH_SUGGESTION]`. Select it into a normal column
    (`file` above) **before** you register the view. On a direct file
    query (``FROM json.`...` ``) `_metadata.file_name` does work.

