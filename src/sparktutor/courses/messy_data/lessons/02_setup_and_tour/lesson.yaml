    Turn the tour into checks. Implement:

    1. `files_per_folder(spark, root)`: a dict from each top-level folder
       of `data/messy` to its number of files at any depth, using
       `binaryFile` with `recursiveFileLookup` and `regexp_extract` on
       `path`. Don't read `content`.
    2. `register_views(spark, root)`: temporary views `events` (the JSON
       in `events/`) and `logs` (the text in `logs/`), each with a `file`
       column taken from `_metadata.file_name` **before** registering.
    3. `lines_per_file_sql(spark)`: lines per file of `logs`, as SQL,
       with columns `file` and `n`, ordered by `file`.
    4. `lines_per_file_df(spark)`: the same with the DataFrame API.
    5. `first_rows(df, n)`: the first n rows as a list, safely.
    6. `tour_facts(spark, root)`: the number of XML orders (rowTag
       `order`), of documents in `docs/` (one row per file), of files
       under `images/`, and of files in `audio/` whose first 4 bytes are
       `RIFF`.
    7. `error_condition(action)`: run `action()`, and return
       `(condition, sqlstate)` of the `PySparkException` it raises, or
       `None`.

    The checks: your folder counts equal a Python walk of the same
    folders (skipping hidden names as Spark does) and the core folders
    hold the expected files; the views exist and the events view has 20,
    20 and 21 rows per file; SQL and the DataFrame API both give
    `access.log 200, app.log 134`; `first_rows` returns 3 `Row` objects;
    the facts are 10 orders, 5 documents, 6 images and 3 WAV files; and
