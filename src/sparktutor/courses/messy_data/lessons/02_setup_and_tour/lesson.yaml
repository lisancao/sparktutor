    ## Rows

    Actions that return data give you `Row` objects. A `Row` works like
    a tuple and like a dict:

    ```python
    r = events.filter("event IS NOT NULL").first()
    print(r.event, r["amount"], r[1])
    print(r.user)
    print(list(r.asDict().keys()))
    ```

    ```
    purchase 32.83 32.83
    Row(geo=None, id=0, plan='pro')
    ['_corrupt_record', 'amount', 'event', 'event_type', 'items', 'ts', 'user', 'user_id']
    ```

    - `r.event` (attribute), `r["amount"]` (key) and `r[1]` (position)
      all work. Use the key form when a column name has spaces or
      clashes with a `Row` method such as `count`.
    - A struct column comes back as a nested `Row`, an array as a
      `list`.
    - `asDict()` turns the row into a dict (`asDict(recursive=True)`
      converts the nested rows too).

