    ## What You'll Learn

    "Why Spark for Messy Data, and How It Runs Your Code" explained what
    Spark does with your code. This lesson gets you working: it installs
    Spark from nothing, opens a first session, teaches the everyday tools
    for looking at a DataFrame, and walks through every folder of the
    sample data that the rest of the course uses. It follows chapter 2 of
    *Learning Spark* (getting started).

    By the end of this lesson you will be able to:

    - Install Java, Python and PySpark 4.2.0 on macOS, Linux or Windows,
      check the install, and fix the failures people hit most
    - Start and stop a `SparkSession`, and know what its start-up output
      means
    - Look at a DataFrame with `show`, `printSchema`, `columns`, `dtypes`
      and `count`, and work with `Row` objects
    - Get data out safely: `take`, `first`, `limit`, `collect` and
      `toPandas`, and why `collect` can take down your program
    - Query DataFrames with SQL through temporary views, and see that SQL
      and the DataFrame API produce the same plan
    - Open each folder of `data/messy/` with the right reader and know
      which lesson handles it
    - Read a Spark error: the error condition, the SQLSTATE and the
      message parameters, in code

