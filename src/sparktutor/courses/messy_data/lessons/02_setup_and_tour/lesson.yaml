    ## A Tour of the Sample Data

    The sample data lives in `data/messy/`. Every file is synthetic and
    made by scripts in the SparkTutor repository
    (`scripts/gen_messy_data.py` and `scripts/messy_gen/`) with fixed
    random seeds, so your files are byte for byte the ones the lessons
    describe. Start with an inventory that reads only file listings,
    never the bytes:

    ```python
    inventory = (spark.read.format("binaryFile")
        .option("recursiveFileLookup", "true")
        .load("data/messy")
        .select(F.regexp_extract("path", r"/data/messy/([^/]+)/", 1).alias("folder"), "length"))
    (inventory.groupBy("folder")
        .agg(F.count("*").alias("files"), F.sum("length").alias("bytes"))
        .orderBy("folder").show(30))
    ```

    ```
    +---------------+-----+-----+
    |         folder|files|bytes|
    +---------------+-----+-----+
    |          audio|    3|16132|
    |         binary|    6| 9262|
    |      casefiles|   35|49092|
    |checkout_events|    4| 3229|
    |       cleaning|    2| 3505|
    |    clickstream|    4| 5411|
    |      delimited|    7| 2636|
    |           docs|    5| 1215|
    |         events|    3| 8907|
    | geo_deliveries|    2| 6556|
    |         images|    6| 2079|
    |           logs|    2|31285|
    |           mail|    4| 1007|
    |         nested|    1|15515|
    |            pdf|    2| 1481|
    |        quality|    5|13024|
    |   service_logs|    1| 8565|
    |support_tickets|    6|49163|
    |            xml|    1| 1669|
    +---------------+-----+-----+
    ```

    - `binaryFile` gives one row per file, with its `path`, `length` and
      bytes ("Files as Files: binaryFile, Globs and Metadata" teaches it
      properly). Because this query never uses the bytes, Spark never
      opens the files.
    - `recursiveFileLookup` walks into subfolders; without it a folder
      that contains only folders reads as empty.
    - `regexp_extract` pulls the folder name out of the path.

    The whole set is a few hundred kilobytes. The lessons are about the
    **shape** of messy data, which these files have plenty of; nothing
    here needs a big machine. The data grows as lessons are added, so
    your table may have extra rows.

