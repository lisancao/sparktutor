    ## When the Install Goes Wrong

    These are the failures seen most often, each reproduced on PySpark
    4.2.0.

    **No Java found.** With no `java` on the `PATH` and no `JAVA_HOME`,
    creating a session prints `JAVA_HOME is not set` and then fails in
    Python with:

    ```
    pyspark.errors.exceptions.base.PySparkRuntimeError: [JAVA_GATEWAY_EXITED] Java gateway
    process exited before sending its port number.
    ```

    `JAVA_GATEWAY_EXITED` only says "the Java process died before it got
    going". The reason is always in the lines printed **above** the
    Python traceback, so scroll up.

    **`JAVA_HOME` points to the wrong place.** With `JAVA_HOME=/nope`:

    ```
    .../pyspark/bin/spark-class: line 71: /nope/bin/java: No such file or directory
    ```

    followed by the same `JAVA_GATEWAY_EXITED`. Fix `JAVA_HOME` (it must
    be the folder that contains `bin/java`) or unset it so the `java` on
    your `PATH` is used.

    **Java too old.** On Java 11 or older, the JVM cannot load Spark's
    class files (version 61, Java 17); it reports an
    `UnsupportedClassVersionError` above the same `JAVA_GATEWAY_EXITED`.
    Install Java 17 or 21.

    **The launchers can't find Spark.** Running
    `.venv/bin/spark-submit` without activating the virtual environment
    gave:

    ```
    Could not find valid SPARK_HOME while searching [...]
    .../.venv/bin/spark-submit: line 27: /bin/spark-class: No such file or directory
    ```

    The launcher scripts ask `python3` where PySpark is installed, and
    without the venv activated, `python3` is a different Python. Activate
    the environment first. (`python my_script.py` with the venv's own
    `python` works either way.)

    **Python versions differ.** If the Python that runs your UDFs (set by
    `PYSPARK_PYTHON`) is a different minor version from your script's
    Python, plain DataFrame queries still work, because they never start
    Python workers. The first Python UDF fails with a `PythonException`
    whose text contains:

    ```
    [PYTHON_VERSION_MISMATCH] Python in worker has different version: 3.11 than that in
    driver: 3.12, PySpark cannot run with different minor versions.
    ```

    Unset `PYSPARK_PYTHON`, or point it at the same Python as the venv.

    **Windows: `winutils.exe`.** Spark's Hadoop libraries look for a
    helper program, `winutils.exe`, on Windows. Without it they log
    messages naming `winutils.exe` and `HADOOP_HOME` and pointing to the
    Hadoop "WindowsProblems" wiki page, and writing files can fail. WSL
    2 avoids the issue entirely; otherwise follow that page.

    **Harmless warnings.** These appear on many machines and need no
    action:

    ```
    WARN Utils: Your hostname, ..., resolves to a loopback address: 127.0.1.1; using 192.168.50.13 instead
    WARN Utils: Set SPARK_LOCAL_IP if you need to bind to another address
    WARN NativeCodeLoader: Unable to load native-hadoop library for your platform... using builtin-java classes where applicable
    WARN Utils: Service 'SparkUI' could not bind on port 4040. Attempting port 4041.
    ```

