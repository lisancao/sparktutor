    ## Installing From Zero

    You need three things: **Java**, because Spark's engine runs on the
    JVM; **Python 3.10 or newer**; and the **PySpark** package, which
    contains Spark itself (all of Spark's jars are inside it, so there is
    nothing else to download).

    **1. Java (a JDK, version 17 or 21; 25 also works).** Check first:

    ```bash
    java -version
    ```

    ```
    openjdk version "17.0.20.1" 2026-08-18
    OpenJDK Runtime Environment (build 17.0.20.1+1-1-24.04-Ubuntu)
    OpenJDK 64-Bit Server VM (build 17.0.20.1+1-1-24.04-Ubuntu, mixed mode, sharing)
    ```

    If that fails or shows a version below 17, install one:

    - **macOS** (with Homebrew): `brew install openjdk@17`, then point
      `JAVA_HOME` at it, for example
      `export JAVA_HOME=$(/usr/libexec/java_home -v 17)` in your shell
      profile.
    - **Linux** (Debian or Ubuntu): `sudo apt install openjdk-17-jdk`.
      Other distributions have an equivalent package.
    - **Windows**: install a JDK such as Eclipse Temurin 17 with its
      installer, tick the option that sets `JAVA_HOME`, and open a new
      terminal. Many people find it simpler to run Spark inside WSL 2
      (the Linux environment built into Windows) and follow the Linux
      steps there.

    Spark 4 is compiled for Java 17: its classes have class file version
    61, which older Java versions refuse to load.

    **2. A virtual environment.** Many systems refuse a global
    `pip install`, and a virtual environment keeps this course's
    packages separate from everything else:

    ```bash
    python3 -m venv .venv
    source .venv/bin/activate          # macOS and Linux
    .venv\Scripts\activate             # Windows (Command Prompt or PowerShell)
    ```

    **3. PySpark.**

    ```bash
    pip install "pyspark[connect,pipelines]==4.2.0" "pandas<3"
    ```

    The extras add what Spark Connect and Declarative Pipelines need
    (gRPC, PyArrow, pandas and more). Inside the SparkTutor repository,
    `pip install -e '.[spark]'` installs exactly these. Then check:

    ```bash
    pyspark --version
    ```

    ```
    Welcome to
          ____              __
         / __/__  ___ _____/ /__
        _\ \/ _ \/ _ `/ __/  '_/
       /___/ .__/\_,_/_/ /_/\_\   version 4.2.0
          /_/

    Using Scala version 2.13.18, OpenJDK 64-Bit Server VM, 17.0.20.1
    ```

    That banner proves the whole chain works: the `pyspark` launcher
    found Java, and Java ran Spark 4.2.0. `spark-submit --version` prints
    the same.

