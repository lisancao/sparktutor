    ## Semi-Structured Folders: events and xml

    `events/` is the course's running example. You have already seen
    its eight inferred columns and that rows from three files look
    different; each day really does have its own shape:

    ```
    day 1: {"event": "view", "user_id": 0, "amount": 6.13, ...}
    day 2: {"event": "purchase", "user": {"id": 0, "plan": "pro"}, "amount": "32.83", "items": [...], ...}
    day 3: {"event_type": "purchase", "user": {..., "geo": {"country": "US"}}, "amount": {"value": 29.93, "currency": "CAD"}, ...}
    ```

    `xml/orders.xml` holds one `<order>` element per order. The XML
    source (built in since Spark 4.0) needs to know which element is one
    row, the `rowTag`:

    ```python
    orders = spark.read.option("rowTag", "order").xml("data/messy/xml")
    orders.printSchema()
    orders.show(3, truncate=False)
    ```

    ```
    root
     |-- _channel: string (nullable = true)
     |-- _id: long (nullable = true)
     |-- coupon: string (nullable = true)
     |-- customer: string (nullable = true)
     |-- items: struct (nullable = true)
     |    |-- item: array (nullable = true)
     |    |    |-- element: struct (containsNull = true)
     |    |    |    |-- _sku: string (nullable = true)
     |    |    |    |-- qty: long (nullable = true)

    +--------+---+------+--------+-----------------------------+
    |_channel|_id|coupon|customer|items                        |
    +--------+---+------+--------+-----------------------------+
    |store   |0  |SAVE0 |C0      |{[{P8, 2}, {P7, 3}]}         |
    |web     |1  |NULL  |C1      |{[{P9, 3}, {P8, 1}, {P4, 2}]}|
    |store   |2  |NULL  |C2      |{[{P1, 3}]}                  |
    +--------+---+------+--------+-----------------------------+
    only showing top 3 rows
    ```

    Attributes become columns starting with `_` (`_id`, `_channel`), and
    the optional `<coupon>` is NULL where it is missing. "XML" goes from
    here.

