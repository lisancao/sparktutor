    ## A First Session

    Every program starts by building a `SparkSession`:

    ```python
    from pyspark.sql import SparkSession

    spark = (SparkSession.builder
             .master("local[*]")                               # local mode, all cores
             .appName("FirstSession")                          # the name in the Spark UI
             .config("spark.sql.session.timeZone", "UTC")      # any setting, by name
             .getOrCreate())

    print(spark.version)      # 4.2.0
    spark.sparkContext.setLogLevel("ERROR")
    ```

    - `.master(...)` picks where Spark runs ("Why Spark for Messy Data,
      and How It Runs Your Code" explained local mode).
    - `.config(key, value)` sets any Spark setting. Every exercise in
      this course sets the session time zone to UTC so times print the
      same on every laptop.
    - `getOrCreate()` returns the session that already exists, if there
      is one, instead of making a second. After the session above, a
      later
      `SparkSession.builder.master("local[4]").appName("Other").config("spark.sql.shuffle.partitions", "7").getOrCreate()`
      returned the same object: `spark.sparkContext.master` was still
      `local[*]` and `spark.sparkContext.appName` still `FirstSession`.
      Only the SQL setting passed with `.config` (here
      `spark.sql.shuffle.partitions`, now `7`) was applied to it.
    - `setLogLevel("ERROR")` hides Spark's `INFO` and `WARN` log lines
      for the rest of the session. Lines printed before it (the start-up
      warnings) still appear.
    - `spark.stop()` ends the session and releases its memory and ports.
      Scripts should call it at the end, in a `finally:` block so it runs
      even after an error, which is what every exercise harness does.

    While a query runs you may also see a progress bar on the terminal:

    ```
    [Stage 1:>                                                          (0 + 1) / 1]
    ```

    It is stage 1, with 0 tasks finished, 1 running, and 1 in total.

