    ## Getting Data Out, Safely

    There are several ways to bring rows from Spark into your Python
    program, and they differ in how much they fetch:

    | Call | Returns | Fetches |
    |------|---------|---------|
    | `df.first()` / `df.head()` | one `Row` (or `None`) | one row |
    | `df.take(n)` / `df.head(n)` | a `list` of `Row` | n rows |
    | `df.limit(n)` | a **DataFrame** (lazy, nothing fetched yet) | n rows when an action runs |
    | `df.collect()` | a `list` of every `Row` | **everything** |
    | `df.toPandas()` | a pandas DataFrame | **everything** |

    `collect()` and `toPandas()` copy the whole result into the driver,
    the one process that runs your script. On a real dataset that is an
    out-of-memory crash waiting to happen. Spark has a guard,
    `spark.driver.maxResultSize` (default `1g`): when the results sent to
    the driver add up to more than that, the job is aborted. With the
    guard lowered to `1m`, collecting 3 million numbers failed with:

    ```
    Job aborted due to stage failure: Total size of serialized results of 1 tasks (3.6 MiB)
    is bigger than spark.driver.maxResultSize (1024.0 KiB)
    ```

    (In classic PySpark that reaches Python as a `Py4JJavaError`.) The
    guard protects the driver, but only after the work was done. The
    habit that protects you is: aggregate or filter in Spark, then bring
    back only the small answer, and use `take(n)` or `show(n)` to look.

    `toPandas()` converts through Apache Arrow, a columnar format shared
    by Spark and pandas; in 4.2 that is on by default
    (`spark.sql.execution.arrow.pyspark.enabled` is `true`). It is the
    fast way to hand a **small** result to pandas or a plotting library:

    ```python
    pdf = events.select("event", "amount").toPandas()
    print(type(pdf), pdf.shape)     # <class 'pandas.core.frame.DataFrame'> (61, 2)
    ```

