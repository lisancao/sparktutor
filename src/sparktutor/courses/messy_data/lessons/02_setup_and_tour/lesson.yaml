    ## DataFrames, Columns and Schemas

    A **DataFrame** is a table with named, typed columns, spread over
    partitions. You almost always get one from a reader:

    ```python
    events = spark.read.json("data/messy/events")
    print(events.count(), len(events.columns))
    print(events.columns)
    print(events.dtypes[:4])
    ```

    ```
    61 8
    ['_corrupt_record', 'amount', 'event', 'event_type', 'items', 'ts', 'user', 'user_id']
    [('_corrupt_record', 'string'), ('amount', 'string'), ('event', 'string'), ('event_type', 'string')]
    ```

    - `count()` is an action: it runs a job and returns the number of
      rows.
    - `columns` is the list of names; `dtypes` pairs each name with its
      type as a short string. Both come from the schema and run nothing.
    - `printSchema()` prints the schema as a tree, nested fields
      included. "Schemas for Data You Don't Control" is all about what
      you see there; for now, notice that Spark found eight columns in
      three files whose records all look different.

    `show()` prints rows as a table. By default 20 rows, with values cut
    to 20 characters:

    ```python
    events.select("event", "event_type", "user", "amount").show(3)
    ```

    ```
    +-----+----------+--------------+--------------------+
    |event|event_type|          user|              amount|
    +-----+----------+--------------+--------------------+
    | NULL|  purchase|{{US}, 0, pro}|{"value": 29.93, ...|
    | NULL|  purchase|{{CA}, 1, pro}|{"value": 8.19, "...|
    | NULL|  purchase|{{CA}, 2, pro}|{"value": 8.03, "...|
    +-----+----------+--------------+--------------------+
    only showing top 3 rows
    ```

    `truncate=False` shows whole values, and `vertical=True` prints one
    row per block, which is far easier to read for wide or nested rows:

    ```python
    events.select("event_type", "user", "amount", "ts").show(2, truncate=False, vertical=True)
    ```

    ```
    -RECORD 0-----------------------------------------
     event_type | purchase
     user       | {{US}, 0, pro}
     amount     | {"value": 29.93, "currency": "CAD"}
     ts         | 2026-10-03T12:00:00
    -RECORD 1-----------------------------------------
     event_type | purchase
     user       | {{CA}, 1, pro}
     amount     | {"value": 8.19, "currency": "CAD"}
     ts         | 2026-10-03T12:01:00
    only showing top 2 rows
    ```

    Structs print as `{...}` with their values in field order (here
    `geo`, `id`, `plan`), and `NULL` means no value.

    Notice that the first rows came from the **third** day's file.
    Unless you sort, a DataFrame has no row order: Spark reads partitions
    in whatever order it planned them, and in 4.2.0 the largest file
    happened to come first. Use `orderBy` whenever order matters.

