    ## Folders for Later Lessons

    The other folders each belong to one lesson, which introduces them
    properly. A glance at how they open:

    - **Tables as CSV** (`cleaning/`, `delimited/`, `geo_deliveries/`,
      `quality/`, `support_tickets/train.csv`):
      `spark.read.option("header", True).csv(path)` gives the columns
      named in the first line, every value as a string until you choose
      types. `delimited/` is deliberately hard (semicolons, decimal
      commas, a byte order mark, Latin-1, fixed-width lines) and is the
      subject of "CSV and Delimited Files".
    - **More JSON Lines** (`nested/`, `clickstream/`,
      `checkout_events/`, `support_tickets/inbox/`, `binary/`):
      `spark.read.json(path)`. The `binary/` files are JSON wrappers
      around base64 message bytes; the real content is Avro or Protobuf
      inside.
    - **A key=value log** (`service_logs/kv.log`): `spark.read.text`,
      one line per row, such as
      `ts=2026-10-07T09:00:44Z level=INFO user=u2 action=add_to_cart ms=37 region=vn-north`.
    - **A folder of folders** (`casefiles/`): one folder per case, each
      with a pretty-printed `case.json` (one JSON document over many
      lines, so it needs `option("multiLine", True)`), a change log and
      attachments of every type. No built-in reader understands the
      whole thing, which is the point of the final project.

