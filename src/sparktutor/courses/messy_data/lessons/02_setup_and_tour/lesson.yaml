    ## Binary Folders: images, audio and pdf

    Images, recordings and PDFs are bytes, so `binaryFile` is the way
    in. The first bytes of each file already say what it is:

    ```python
    media = (spark.read.format("binaryFile")
        .option("recursiveFileLookup", "true")
        .load(["data/messy/images", "data/messy/audio", "data/messy/pdf"]))
    (media.select(F.col("_metadata.file_name").alias("file"), "length",
                  F.hex(F.substring("content", 1, 4)).alias("first_4_bytes"))
          .orderBy("file").show(truncate=False))
    ```

    ```
    +-------------------+------+-------------+
    |file               |length|first_4_bytes|
    +-------------------+------+-------------+
    |corrupt.png        |24    |89504E47     |
    |gradient_32x32.png |1795  |89504E47     |
    |gray_20x10.png     |90    |89504E47     |
    |invoice_1001.pdf   |878   |25504446     |
    |invoice_1002.pdf   |603   |25504446     |
    |logo_rgba_12x12.png|81    |89504E47     |
    |readme.txt         |13    |6E6F7420     |
    |red_16x8.png       |76    |89504E47     |
    |silence.wav        |8044  |52494646     |
    |tone_440.wav       |4044  |52494646     |
    |tone_880_quiet.wav |4044  |52494646     |
    +-------------------+------+-------------+
    ```

    `89504E47` is `\x89PNG`, `25504446` is `%PDF`, `52494646` is `RIFF`
    (the start of a WAV file), and `6E6F7420` is the text `not `. A
    24-byte "PNG" is suspicious too. "Files as Files: binaryFile, Globs
    and Metadata" turns these clues into a file inventory, and "Images
    and Audio" decodes the pixels and samples.

