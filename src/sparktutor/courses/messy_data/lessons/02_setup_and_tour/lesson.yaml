    ## Errors in Code

    Every Spark error raised in Python is a `PySparkException`, which
    has methods for each part:

    ```python
    from pyspark.errors import PySparkException

    try:
        events.select("evnt")
    except PySparkException as e:
        print(e.getCondition())
        print(e.getSqlState())
        print(e.getMessageParameters())
    ```

    ```
    UNRESOLVED_COLUMN.WITH_SUGGESTION
    42703
    {'objectName': '`evnt`', 'proposal': '`event`, `ts`, `amount`, `items`, `user`'}
    ```

    Match on `getCondition()`, never on the message text: messages can
    be reworded between releases, conditions are meant to stay. Some
    errors that start deep in the JVM still reach classic PySpark as a
    plain `Py4JJavaError` without a condition (the `maxResultSize` error
    above is one); for those, the condition is in the text, after
    `Caused by:`.

    **Gotcha: the JSON line on stderr.** Since 4.0, PySpark also logs
    each such error as one JSON line, through its own Python logger, the
    moment the exception is created, even if your code catches it:

    ```
    {"ts": "...", "level": "ERROR", "logger": "DataFrameQueryContextLogger", "msg": "[UNRESOLVED_COLUMN.WITH_SUGGESTION] ...", "context": {...}, "exception": {...}}
    ```

    (`SQLQueryContextLogger` for errors in `spark.sql` text.)
    `setLogLevel` doesn't hide it, because that controls the JVM's logs
    and this is Python's `logging`. If you expect and handle errors,
    quiet it the Python way, as this lesson's exercise does:

    ```python
    import logging
    for name in ["DataFrameQueryContextLogger", "SQLQueryContextLogger"]:
        logging.getLogger(name).setLevel(logging.CRITICAL)
    ```

