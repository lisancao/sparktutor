    ## Hidden Files and Folders

    The inventory found 35 files in `casefiles/`, but there are more on
    disk: a `.DS_Store` file and a `_staging` folder. Spark's file
    listing skips any file or folder whose name starts with `.`, or
    starts with `_` and contains no `=` (so a partition folder such as
    `_day=1` is kept), except `_metadata` and `_common_metadata`, which
    Parquet needs. Names ending in `._COPYING_` (files still being
    copied) are skipped too. The rule is
    `HadoopFSUtils.shouldFilterOutPathName` in the 4.2.0 source.

    This is deliberate: tools write `_SUCCESS` markers, `_temporary`
    folders and `.crc` checksum files next to data, and you don't want
    them read as data. But it also means a producer that names files
    `_part1.json` will see them silently ignored. The exercise compares
    Spark's counts with a Python walk of the folders that applies the
    same rule.

    Two related facts about paths:

    - A **glob that matches nothing is an error.**
      `spark.read.json("data/messy/events/*.csv")` and
      `spark.read.format("binaryFile").load("data/messy/*/nothing*")`
      both failed with `[PATH_NOT_FOUND]`, the same as a misspelled
      folder.
    - A **folder that exists but has no matching files is not.**
      `binaryFile` on `data/messy/images` without `recursiveFileLookup`
      returned 0 rows, and so does a `pathGlobFilter` that matches no
      file name.

