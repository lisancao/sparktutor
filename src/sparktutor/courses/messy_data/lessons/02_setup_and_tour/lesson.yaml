    ## Summary

    In this lesson you learned:

    - **Installing**: a JDK 17 or 21, Python 3.10+, a virtual
      environment, and `pip install "pyspark[connect,pipelines]==4.2.0"
      "pandas<3"`; `pyspark --version` proves the chain works.
    - **Failures**: `JAVA_GATEWAY_EXITED` means Java died (the reason is
      printed above it); "Could not find valid SPARK_HOME" means the venv
      isn't active; `PYTHON_VERSION_MISMATCH` appears only when a UDF
      runs.
    - **Sessions**: `SparkSession.builder...getOrCreate()` returns an
      existing session if there is one; `setLogLevel`; `spark.stop()` in
      a `finally:` block.
    - **Looking at data**: `count`, `columns`, `dtypes`, `printSchema`,
      `show(n, truncate=False, vertical=True)`, and `Row` access by
      attribute, key or position. Without `orderBy` there is no row
      order.
    - **Getting data out**: `take`, `first` and `limit` fetch a few rows;
      `collect` and `toPandas` fetch everything, guarded by
      `spark.driver.maxResultSize` (1g).
    - **SQL**: temporary views, `spark.sql`, `spark.table`, direct file
      queries; `_metadata` doesn't pass through a view; SQL and the
      DataFrame API compile to the same plan.
    - **The sample data**: every folder of `data/messy/`, how to open it,
      and which lesson uses it; hidden names are skipped by the file
      listing, and a glob that matches nothing is `PATH_NOT_FOUND`.
    - **Errors**: exception class, condition, message and SQLSTATE;
      `getCondition()`, `getSqlState()`, `getMessageParameters()`; the
      JSON error line from PySpark's own logger.

    Next: **Schemas for Data You Don't Control**, which looks hard at the
    schemas you printed here: Spark's types, nullability, inference and
    its instability, and how to keep a contract with data that keeps
    changing shape.
