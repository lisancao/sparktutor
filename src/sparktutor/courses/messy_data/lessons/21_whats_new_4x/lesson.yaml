    ## UTF-8 Validation and the try_ Family

    "Columns and Expressions: Cleaning Values" covered UTF-8 validation
    (`is_valid_utf8`, `make_valid_utf8`, `validate_utf8`,
    `try_validate_utf8`, all 4.0) and the idea of `try_` functions. For
    reference, here are the
    `try_` functions that arrived in 4.x (checked against the function
    registry of each release; the others are older):

    | Function | Since |
    |---|---|
    | `try_parse_json`, `try_variant_get` | 4.0 |
    | `try_parse_url`, `try_url_decode` | 4.0 |
    | `try_make_timestamp`, `try_make_timestamp_ltz`, `try_make_timestamp_ntz`, `try_make_interval` | 4.0 |
    | `try_mod`, `try_reflect`, `try_validate_utf8` | 4.0 |
    | `try_to_date` | 4.1 (SPARK-52866) |
    | `try_to_time` | 4.1, but the TIME type is disabled (below) |

    `DESCRIBE FUNCTION EXTENDED try_to_date` says "Since: 4.0.0", but the
    function is not registered in 4.0.0; it arrived in 4.1. Code that
    must run on 4.0 should use `try_to_timestamp(...)` and `to_date`.

    Each `try_` variant turns one error condition into a NULL:

    ```python
    spark.sql("""SELECT
      try_url_decode('caf%C3%A9%2')                     AS url,   -- CANNOT_DECODE_URL
      try_parse_url('http://x.com/a b?q=1', 'QUERY')    AS query, -- INVALID_URL
      try_make_timestamp(2026, 2, 30, 10, 0, 0)         AS ts,    -- no 30 February
      try_mod(7, 0)                                     AS m,     -- DIVIDE_BY_ZERO
      try_reflect('java.lang.Integer', 'parseInt', 'x12') AS r""").show()
    ```

    ```text
    +----+-----+----+----+----+
    | url|query|  ts|   m|   r|
    +----+-----+----+----+----+
    |NULL| NULL|NULL|NULL|NULL|
    +----+-----+----+----+----+
    ```

