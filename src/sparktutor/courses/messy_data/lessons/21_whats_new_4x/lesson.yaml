    ## When to Reach for Apache Sedona

    Everything above is a workaround for a function library that is
    still small. **Apache Sedona** is the established spatial library
    for Spark: hundreds of `ST_` functions, spatial indexes, spatial
    joins and readers for shapefiles and GeoParquet. Check versions
    before you plan on it: as of October 2026 its latest release, 1.9.1,
    publishes builds for Spark 4.0 and 4.1 (`sedona-spark-4.1_2.13` on
    Maven Central) and its Python package requires `pyspark<4.2.0`, so
    there is no release for Spark 4.2 yet. Sedona also has its own
    geometry type, separate from Spark's native one; moving between them
    goes through WKB, which is one more reason to keep a `wkb` column.

