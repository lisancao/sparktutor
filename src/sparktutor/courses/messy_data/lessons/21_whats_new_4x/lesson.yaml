    ## WKB With Built-ins Only

    The Python UDF costs a trip to a Python worker per batch. If that
    matters, you can build the same point in the JVM. Spark has no
    function that returns a double's bytes, and under ANSI mode you
    cannot cast a `BIGINT` to `BINARY` (`DATATYPE_MISMATCH.CAST_WITH_CONF_SUGGESTION`),
    but `reflect` can call Java's `Double.doubleToLongBits`, and `hex()`
    of a `BIGINT` gives its 16 hex digits, most significant first. That
    is big-endian WKB (byte order `00`):

    ```python
    bits = lambda c: F.lpad(F.hex(F.expr(
        f"cast(reflect('java.lang.Double', 'doubleToLongBits', {c}) AS BIGINT)")), 16, "0")
    xdr = F.unhex(F.concat(F.lit("0000000001"), bits("lon"), bits("lat")))

    (geo.filter("geo IS NOT NULL")
        .select((F.st_asbinary(F.st_geogfromwkb(xdr)) == F.col("wkb")).alias("same"))
        .groupBy("same").count().show())
    ```

    ```text
    +----+-----+
    |same|count|
    +----+-----+
    |true|  149|
    +----+-----+
    ```

    `st_geogfromwkb` reads either byte order and `st_asbinary` writes
    little-endian by default, so all 149 points match the Python version
    byte for byte. It is clever and unreadable; prefer the UDF unless a
    profile says otherwise, and note that `reflect` is a general escape
    hatch that some platforms disable.

