    ## The Same Question With NEAREST BY (4.2)

    Spark 4.2's top-K join (SPIP SPARK-56395, covered in the "What's New
    in Apache Spark 4.x" lesson "CDC, NEAREST BY Joins, time_bucket and
    Metric Views") can rank by any expression, including the haversine
    distance:

    ```python
    hav = """2 * 6371.0 * asin(sqrt(pow(sin(radians(s.s_lat - d.lat) / 2), 2)
             + cos(radians(d.lat)) * cos(radians(s.s_lat))
             * pow(sin(radians(s.s_lon - d.lon) / 2), 2)))"""
    nearest = spark.sql(f"""
        SELECT d.delivery_id, s.store_id, {hav} AS km
        FROM (SELECT * FROM geo_points WHERE lat IS NOT NULL) d
        JOIN store_points s EXACT NEAREST 1 BY DISTANCE {hav}
    """)
    ```

    For the 143 deliveries that have a store nearby, it picks the same
    store as the grid. The other six differ: `NEAREST BY` always returns
    a store, so Calgary's nearest is Metrotown, 667.6 km away, and Huế's
    is Hải Châu at 81.2 km. Whether that is right depends on the
    question; a distance filter afterwards gives you the grid's answer.

    The plan shows the price: a `BroadcastNestedLoopJoin` (every
    delivery against every store) feeding a `min_by` aggregate per
    delivery. 4.2 has no index behind `NEAREST BY` yet: with `APPROX
    NEAREST` instead of `EXACT NEAREST` the plan is the same
    `BroadcastNestedLoopJoin`.
    Use it for small right sides, and pre-filter (a grid, a region
    match) when the right side is large.

