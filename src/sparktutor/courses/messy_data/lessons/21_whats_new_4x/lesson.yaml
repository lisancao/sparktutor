    ## What You'll Learn

    This is the last lesson of the basics level. Along the way you have
    used a lot of Spark 4.x without stopping to call it new: ANSI mode
    and the `try_` functions in "Columns and Expressions: Cleaning
    Values", VARIANT in "VARIANT Basics: Profiling and Nested Data", the
    built-in XML reader in "XML", Arrow UDFs in "Images and Audio",
    Python data sources in "Your First Python Data Source", and
    Arrow-optimized UDFs by default in "Running a Model over Your Data
    with pandas UDFs".

    This lesson collects those in one place, then goes deep on the 4.x
    features that matter for messy data and that no earlier lesson
    covered in full:

    - **Collations** beyond the basics: Unicode normalization, trailing
      spaces, language rules, what does not work with them, table
      defaults and their cost
    - The newer **`try_` functions**, and **UTF-8 validation** in brief
    - The **TIME** type, and why it is not ready to use in 4.2.0
    - **Geospatial types** applied to messy coordinates: validate,
      build WKB, find the nearest store with a grid and a haversine
      distance, tag zones with a point-in-polygon UDF
    - **SQL features** that make exploring messy data faster: pipe
      syntax, `QUALIFY`, `approx_top_k`, `listagg`, `randstr`, `DESCRIBE
      ... AS JSON`

    If you have taken the separate "What's New in Apache Spark 4.x"
    course, this lesson does not repeat it: it points to it for the
    general tour and spends its time on messy data.

