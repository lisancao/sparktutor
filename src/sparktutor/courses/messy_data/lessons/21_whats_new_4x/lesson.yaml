    ## Where Collations Stop

    Collated strings are a different type (`string collate
    UNICODE_CI_AI`), and not every function accepts them yet. Measured on
    4.2.0:

    - **`collect_set` refuses them**: `[DATATYPE_MISMATCH.UNSUPPORTED_INPUT_TYPE]
      ... The input of collect_set can't be "MAP" or "COLLATED STRING"
      type data.` Collect the original, uncollated column instead, as the
      exercise does.
    - **`LIKE`, `ILIKE` and `RLIKE` accept only `UTF8_BINARY` and
      `UTF8_LCASE`.** `'Montréal' COLLATE UNICODE_CI_AI LIKE 'mont%'`
      fails with `[DATATYPE_MISMATCH.UNEXPECTED_INPUT_TYPE] ... The first
      parameter requires the "STRING" type, however ... has the type
      "STRING COLLATE UNICODE_CI_AI".` The same with `UTF8_LCASE` works;
      `UTF8_LCASE_RTRIM` and plain `UNICODE` are refused too.
    - **Two different explicit collations cannot meet**: `'a' COLLATE
      UTF8_LCASE = 'A' COLLATE UNICODE_CI` fails with
      `COLLATION_MISMATCH.EXPLICIT`. Collate both sides the same way.
    - **A misspelt name** (`UNICODE_CIAI`) fails with
      `COLLATION_INVALID_NAME` and a suggestion.
    - **`hash()` and `xxhash64()` ignore the collation** by default
      (4.0.1 made that the default; `spark.sql.legacy.collationAwareHashFunctions`
      restores the old behaviour): `'Montréal'` and `'MONTREAL'` are equal
      under `UNICODE_CI_AI` but hash differently. Grouping, joins and
      shuffles are not affected, because Spark hashes a collation key
      internally; only your own `hash(...)` calls are.
    - **Which spelling represents a group is not defined.** In one run
      the Hà Nội group was labelled `Ha Noi` and Montréal `MONTRÉAL`. If
      you need a canonical name, join to a reference list (the exercise
      joins to the store list) or pick one with `min`/`max` on the
      original column.

