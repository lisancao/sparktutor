    ## The TIME Type: Not Yet

    A time of day without a date (a shop's opening hours, a shift
    start) is a classic messy-data value: `"9:30"`, `"09:30:00"`,
    `"24:00"`, `"closed"`. Spark 4.1 added a `TIME` type (SPIP
    SPARK-51162), with `to_time`, `try_to_time`, `make_time`,
    `time_trunc`, `time_diff` and `current_time`, and then switched it
    off before the release (SPARK-54609): `spark.sql.timeType.enabled`
    is an internal setting whose default is `false` outside Spark's own
    tests, in 4.1 and in 4.2.0.

    What happens on a stock 4.2.0 session:

    | Works | Fails with `UNSUPPORTED_TIME_TYPE` |
    |---|---|
    | the literal `TIME '09:30:00'` (`typeof` says `time(6)`) | `CAST('09:30' AS TIME)` |
    | comparing literals, `CAST(TIME '...' AS STRING)` | `to_time`, `try_to_time`, `make_time` |
    | `current_time()` | `hour(TIME '09:30:00')`, `time_trunc`, `time_diff` |
    | `createDataFrame` with Python `datetime.time` values | writing a TIME column to Parquet |

    The error is `[UNSUPPORTED_TIME_TYPE] The data type TIME is not
    supported. SQLSTATE: 0A000`. The pieces that work are not enough to
    store or compute with times, and the inconsistency (Python can create
    a TIME column that SQL cannot read with `hour()`) is a sign of a
    feature mid-construction. Setting the internal flag does make
    `to_time` work, but internal flags are not a supported interface;
    this course does not use it.

    Until it is enabled, store times of day as a day-time interval or
    as minutes since midnight:

    ```python
    spark.sql("""SELECT store, opens,
                   try_cast(opens AS INTERVAL HOUR TO MINUTE) AS as_interval,
                   hour(try_to_timestamp(opens, 'H:mm')) * 60
                     + minute(try_to_timestamp(opens, 'H:mm')) AS minutes
                 FROM VALUES ('S01', '09:00'), ('S02', '9:30'), ('S03', '24:00'),
                             ('S04', 'closed') AS t(store, opens)""").show(truncate=False)
    ```

    ```text
    +-----+------+-------------------------------+-------+
    |store|opens |as_interval                    |minutes|
    +-----+------+-------------------------------+-------+
    |S01  |09:00 |INTERVAL '09:00' HOUR TO MINUTE|540    |
    |S02  |9:30  |INTERVAL '09:30' HOUR TO MINUTE|570    |
    |S03  |24:00 |INTERVAL '24:00' HOUR TO MINUTE|NULL   |
    |S04  |closed|NULL                           |NULL   |
    +-----+------+-------------------------------+-------+
    ```

    Note the difference on `24:00`: the interval cast accepts it (an
    interval of 24 hours is valid, and `'25:00'` is too), while parsing
    it as a clock time with `H:mm` rejects it. Validate the range
    yourself when you use intervals.

