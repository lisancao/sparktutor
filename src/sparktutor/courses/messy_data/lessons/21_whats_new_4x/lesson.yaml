    ## SQL That Helps You Explore

    A few 4.x SQL features make the first hour with a messy file
    faster. **Pipe syntax** (4.0, SPARK-49555) writes the query in the
    order you think it:

    ```python
    raw.createOrReplaceTempView("deliveries")
    spark.sql("""
    FROM deliveries
    |> EXTEND try_cast(trim(lat) AS DOUBLE) AS lat_d, try_cast(trim(lon) AS DOUBLE) AS lon_d
    |> EXTEND CASE WHEN lat_d IS NULL OR lon_d IS NULL OR isnan(lat_d) OR isnan(lon_d) THEN 'bad number'
                   WHEN abs(lat_d) > 90 OR abs(lon_d) > 180 THEN 'out of range'
                   ELSE 'plausible' END AS verdict
    |> AGGREGATE count(*) AS n GROUP BY verdict
    |> ORDER BY n DESC
    """).show()
    ```

    ```text
    +------------+---+
    |     verdict|  n|
    +------------+---+
    |   plausible|145|
    |out of range| 13|
    |  bad number|  8|
    +------------+---+
    ```

    Each `|>` step works on the previous one, so you can run the first
    two lines alone while you build it up. (`out of range` here includes
    the swaps whose latitude is beyond ±90.)

    **Frequent values** with `approx_top_k` (4.1, SPARK-52515), a
    one-pass sketch:

    ```python
    spark.sql("SELECT approx_top_k(city, 5) AS top_spellings FROM deliveries").show(truncate=False)
    ```

    ```text
    +----------------------------------------------------------------------------------+
    |top_spellings                                                                     |
    +----------------------------------------------------------------------------------+
    |[{vancouver , 13}, { Vancouver, 11}, {Hồ Chí Minh, 10}, {ha noi, 9}, {TORONTO, 8}]|
    +----------------------------------------------------------------------------------+
    ```

    The two most common spellings of Vancouver both have a stray space.

    **All the variants in one cell** with `listagg` (4.0, SPARK-42746;
    `string_agg` is a synonym):

    ```python
    spark.sql("""
    SELECT collate(trim(city), 'UNICODE_CI_AI') AS city, count(*) AS n,
           listagg(DISTINCT city, ' | ') WITHIN GROUP (ORDER BY city) AS spellings
    FROM deliveries GROUP BY 1 ORDER BY n DESC
    """).show(truncate=False)
    ```

    ```text
    +-----------+---+-------------------------------------------------------------+
    |city       |n  |spellings                                                    |
    +-----------+---+-------------------------------------------------------------+
    |Vancouver  |46 | Vancouver | VANCOUVER | Vancouver | Vancouver   | vancouver |
    |Ha Noi     |33 |Ha Noi | Hà Nội | HÀ NỘI | Hà Nội | ha noi                |
    |Ho Chi Minh|27 |Ho Chi Minh | HỒ CHÍ MINH | Hồ Chí Minh | ho chi minh        |
    |Toronto    |23 | Toronto  | TORONTO | Toronto | toronto                      |
    |MONTRÉAL   |18 |MONTRÉAL | Montréal | Montréal | montreal                   |
    |Da Nang    |13 |Da Nang | da nang | ĐÀ NẴNG | Đà Nẵng                        |
    |Calgary    |2  |Calgary                                                      |
    |Huế        |2  |Huế                                                          |
    |Ottawa     |2  |Ottawa                                                       |
    +-----------+---+-------------------------------------------------------------+
    ```

    Two `Hà Nội`s and two `Montréal`s that look identical: one of each
    is the decomposed form. And notice the group labels (`Ha Noi`,
    `MONTRÉAL`): one of the members, not a canonical name.

    **`QUALIFY`** (4.2, SPARK-31561; first shown in "Window Functions in
    One Page") filters on a window function without a subquery, which turns "nearest store" into one statement
    (here as a cross join, fine for 12 stores; `points` is the cleaned
    view and `store_points` the stores with `s_lat`, `s_lon` doubles):

    ```python
    spark.sql("""
    SELECT d.delivery_id, s.store_id,
           2 * 6371.0 * asin(sqrt(pow(sin(radians(s.s_lat - d.lat) / 2), 2)
             + cos(radians(d.lat)) * cos(radians(s.s_lat))
             * pow(sin(radians(s.s_lon - d.lon) / 2), 2))) AS km
    FROM points d JOIN store_points s
    WHERE d.lat IS NOT NULL
    QUALIFY row_number() OVER (PARTITION BY d.delivery_id ORDER BY km) = 1
    ORDER BY d.delivery_id LIMIT 3
    """).show()
    ```

    ```text
    +-----------+--------+------------------+
    |delivery_id|store_id|                km|
    +-----------+--------+------------------+
    |       D001|     S03| 4.397734548127639|
    |       D002|     S06|3.1097775638770306|
    |       D003|     S12| 6.732799695929505|
    +-----------+--------+------------------+
    ```

    The same stores and distances as the grid, as it should be.

    **Test data** with `randstr` and `uniform` (4.0, SPARK-49505):
    `SELECT randstr(6, 42) AS junk_city, uniform(-180.0, 180.0, 42) AS
    junk_lon FROM range(3)` makes reproducible junk (the last argument
    is the seed) for testing a cleaning rule against values you did not
    think of.

    **Schemas as JSON** with `DESCRIBE TABLE t AS JSON` (4.0,
    SPARK-50541): one JSON document with every column, its type and,
    for strings, its collation, ready to store and compare between days
    the way "Schemas for Data You Don't Control" compared schemas.

