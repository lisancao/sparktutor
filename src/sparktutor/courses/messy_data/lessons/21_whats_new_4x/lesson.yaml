    ## Parsing Numbers: Four Surprises

    ```python
    spark.sql("""SELECT try_cast(' 49.25 ' AS DOUBLE) AS spaces,
                        try_cast('45.4767N' AS DOUBLE) AS suffix,
                        try_cast('NaN' AS DOUBLE) AS nan,
                        try_cast('1.5d' AS DOUBLE) AS d_suffix,
                        try_cast('' AS DOUBLE) AS empty""").show()
    ```

    ```text
    +------+------+---+--------+-----+
    |spaces|suffix|nan|d_suffix|empty|
    +------+------+---+--------+-----+
    | 49.25|  NULL|NaN|     1.5| NULL|
    +------+------+---+--------+-----+
    ```

    - Surrounding spaces are fine (trimming anyway costs nothing).
    - `NaN` is a valid double, so it **passes** `try_cast`.
    - `1.5d` parses, because Spark accepts the Java `d`/`f` suffixes.
      Harmless here, surprising if you use `try_cast(...) IS NOT NULL` as
      a "this is a plain number" test.
    - And NaN has its own comparison rules ("Columns and Expressions:
      Cleaning Values" showed them): NaN equals NaN and is larger than
      every other number, so `double('NaN') > 90` is true and a range
      check alone will not catch it.

    So test `isnan` explicitly, before any range check.

