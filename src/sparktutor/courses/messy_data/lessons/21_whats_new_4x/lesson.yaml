    Think of each Spark release as a new set of tools in the same
    workshop. Some tools you have been using for weeks without reading
    the label (ANSI mode is the reason a bad cast stops your job). Some
    are brand new and still have rough edges (geospatial types arrived
    with only five functions). Part of being good with a tool is knowing
    where its edges are, so this lesson tests every one of them on the
    course's messy data and shows you exactly where they stop.

