    ## Distance Without ST_Distance

    For points on a sphere, the **haversine** formula gives the
    great-circle distance, and every piece of it is a built-in function,
    so it runs in the JVM with no UDF:

    ```python
    EARTH_RADIUS_KM = 6371.0

    def haversine_km(lat1, lon1, lat2, lon2):
        dlat = F.radians(lat2 - lat1)
        dlon = F.radians(lon2 - lon1)
        a = (F.pow(F.sin(dlat / 2), 2)
             + F.cos(F.radians(lat1)) * F.cos(F.radians(lat2)) * F.pow(F.sin(dlon / 2), 2))
        return 2 * EARTH_RADIUS_KM * F.asin(F.sqrt(a))
    ```

    Vancouver (49.2827, -123.1207) to Montréal (45.5019, -73.5674) comes
    out at 3686.30 km. Haversine treats the Earth as a sphere of radius
    6371 km, which is within about 0.5% of the true ellipsoidal distance:
    plenty for "which store is closest", not for surveying.

