    ## Finding Collations

    There are 1164 built-in collations. Two ways to search them:

    ```python
    spark.sql("SHOW COLLATIONS LIKE 'UNICODE_CI*'").show(truncate=False)   # 4.2
    spark.sql("""SELECT NAME, LANGUAGE, ACCENT_SENSITIVITY, CASE_SENSITIVITY, PAD_ATTRIBUTE
                 FROM collations() WHERE NAME LIKE 'vi%'""").show()        # 4.0
    ```

    ```text
    +-------------------+--------+-------+------------------+----------------+-------------+-----------+
    |NAME               |LANGUAGE|COUNTRY|ACCENT_SENSITIVITY|CASE_SENSITIVITY|PAD_ATTRIBUTE|ICU_VERSION|
    +-------------------+--------+-------+------------------+----------------+-------------+-----------+
    |UNICODE_CI         |NULL    |NULL   |ACCENT_SENSITIVE  |CASE_INSENSITIVE|NO_PAD       |78.3.0.0   |
    |UNICODE_CI_AI      |NULL    |NULL   |ACCENT_INSENSITIVE|CASE_INSENSITIVE|NO_PAD       |78.3.0.0   |
    |UNICODE_CI_AI_RTRIM|NULL    |NULL   |ACCENT_INSENSITIVE|CASE_INSENSITIVE|RTRIM        |78.3.0.0   |
    |UNICODE_CI_RTRIM   |NULL    |NULL   |ACCENT_SENSITIVE  |CASE_INSENSITIVE|RTRIM        |78.3.0.0   |
    +-------------------+--------+-------+------------------+----------------+-------------+-----------+
    ```

    `SHOW COLLATIONS` is new in 4.2 (SPARK-49543); the `collations()`
    table function has been there since 4.0 and is the one to use in
    code that must also run on 4.0 or 4.1. The `ICU_VERSION` column
    tells you which Unicode rules you get; a Spark upgrade that bumps ICU
    can, in rare cases, change which strings compare equal.

