    ## From Coordinates to GEOGRAPHY

    With no `st_point`, build the WKB yourself. A point is 21 bytes: a
    byte-order flag (1 = little-endian), the type (1 = Point), then x and
    y as doubles:

    ```python
    import struct

    def point_wkb(lon, lat):
        if lon is None or lat is None:
            return None
        return struct.pack("<BIdd", 1, 1, lon, lat)

    to_wkb = F.udf(point_wkb, "binary")
    geo = (points.withColumn("wkb", to_wkb("lon", "lat"))
                 .withColumn("geo", F.st_geogfromwkb("wkb")))
    geo.filter("status = 'swapped'").select(
        "delivery_id", "lat", "lon", F.hex("wkb").alias("wkb"), F.st_srid("geo").alias("srid")
    ).show(3, truncate=False)
    ```

    ```text
    +-----------+--------+----------+------------------------------------------+----+
    |delivery_id|lat     |lon       |wkb                                       |srid|
    +-----------+--------+----------+------------------------------------------+----+
    |D015       |43.71964|-79.39139 |0101000000D07EA4880CD953C05C72DC291DDC4540|4326|
    |D022       |49.29137|-123.14097|0101000000E5ED08A705C95EC08C84B69C4BA54840|4326|
    |D031       |49.24378|-122.95228|0101000000A228D027F2BC5EC09EB5DB2E349F4840|4326|
    +-----------+--------+----------+------------------------------------------+----+
    ```

    Read the first one: `01` little-endian, `01000000` Point, then
    eight bytes of x (-79.39) and eight of y (43.72). The swap was fixed
    before the bytes were built. `geo` has type `geography(4326)`, and
    `collect()` gives `pyspark.sql.types.Geography` objects with
    `getBytes()` and `getSrid()`.

    **Validate before you convert.** There is no `try_` version of the
    ST functions, and `st_geogfromwkb` rejects any coordinate outside the
    valid ranges. One bad row fails the whole job:

    ```text
    [WKB_PARSE_ERROR] Error parsing WKB: Invalid coordinate value found at position 5 SQLSTATE: 22023
    ```

    And two things it does **not** catch: `st_geomfromwkb` (planar
    GEOMETRY) accepts a latitude of 123 without complaint, and
    `st_geogfromwkb` accepts NaN coordinates (`0101000000000000000000F87F...`
    round-trips unchanged). The ladder above, not the type, is your
    validation.

