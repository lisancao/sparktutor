    ## Collations, Deeper

    "Columns and Expressions: Cleaning Values" introduced collations: a
    string type can carry comparison rules (`UTF8_LCASE`, `UNICODE_CI`,
    `UNICODE_CI_AI`, ...), and grouping by a collated column treats
    equal-under-the-rules values as one group without changing the data.
    Real city names push those rules much harder.

    The sample file `data/messy/geo_deliveries/deliveries.csv` has 166
    deliveries whose `city` was typed by couriers and apps: 29 distinct
    raw strings for 9 real cities. Count the distinct values under each
    collation, without and with `trim` first:

    ```python
    raw = (spark.read.option("header", True)
           .csv("data/messy/geo_deliveries/deliveries.csv"))
    for coll in ["UTF8_LCASE", "UNICODE_CI", "UNICODE_CI_AI", "UNICODE_CI_AI_RTRIM"]:
        print(coll,
              raw.select(F.collate("city", coll)).distinct().count(),
              raw.select(F.collate(F.trim("city"), coll)).distinct().count())
    ```

    ```text
    UTF8_LCASE 20 15
    UNICODE_CI 18 13
    UNICODE_CI_AI 15 9
    UNICODE_CI_AI_RTRIM 11 9
    ```

    Only an accent-insensitive collation on trimmed values reaches 9.
    Each step teaches something.

