    ## Trailing and Leading Spaces

    The `_RTRIM` suffix (4.0) makes a collation ignore **trailing**
    spaces. Only trailing:

    ```python
    spark.sql("""SELECT 'Vancouver  ' = 'vancouver' COLLATE UNICODE_CI_RTRIM AS trailing,
                        ' Vancouver'  = 'vancouver' COLLATE UNICODE_CI_RTRIM AS leading""").show()
    ```

    ```text
    +--------+-------+
    |trailing|leading|
    +--------+-------+
    |    true|  false|
    +--------+-------+
    ```

    That is why `UNICODE_CI_AI_RTRIM` stopped at 11 groups: ` Vancouver`
    and ` Toronto ` kept their leading space. `RTRIM` exists because the
    SQL standard pads `CHAR` columns with trailing spaces; for messy
    input, `trim()` first and collate second. There is no collation that
    ignores leading spaces.

