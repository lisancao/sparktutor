    ## The Same Letters, Different Bytes

    `UTF8_LCASE` (case-insensitive) left three groups of Montréal. Look
    at the bytes:

    ```python
    (raw.filter(F.collate(F.trim("city"), "UNICODE_CI_AI") == "montreal")
        .groupBy(F.collate("city", "UTF8_LCASE").alias("utf8_lcase"))
        .agg(F.count("*").alias("n"), F.hex(F.encode(F.first("city"), "UTF-8")).alias("bytes"))
        .orderBy("bytes").show(truncate=False))
    ```

    ```text
    +----------+---+--------------------+
    |utf8_lcase|n  |bytes               |
    +----------+---+--------------------+
    |MONTRÉAL  |9  |4D4F4E5452C389414C  |
    |Montréal |5  |4D6F6E747265CC81616C|
    |montreal  |4  |6D6F6E747265616C20  |
    +----------+---+--------------------+
    ```

    The first two print the same word, but one has `C3 89` (the single
    character É) and the other has `65 CC 81` (a plain `e` followed by a
    combining acute accent). Unicode calls these **canonically
    equivalent**: two encodings of the same text. Text pasted from a Mac
    file name, a PDF or some keyboards often arrives in the decomposed
    form. `UTF8_LCASE` compares bytes after lower-casing, so it sees two
    different words. The `UNICODE...` collations use the ICU library,
    which compares canonically equivalent strings as equal. (The column
    widths also wobble: the decomposed `é` is two characters to `show()`.)

    If you need to group text that came from many sources, prefer a
    `UNICODE` collation over `UTF8_LCASE`, even when you only want case
    insensitivity.

