    ## Collations in Tables and Joins

    A table can declare a default collation for its string columns
    (`DEFAULT COLLATION`, part of the 4.0 collation work), and Parquet
    keeps it in the file's metadata:

    ```python
    spark.sql("""CREATE TABLE delivery_cities (city STRING, n INT)
                 USING parquet DEFAULT COLLATION UNICODE_CI_AI""")
    spark.sql("""INSERT INTO delivery_cities VALUES
                 ('Montréal', 1), ('MONTREAL', 2), ('Hà Nội', 3), ('ha noi', 4)""")
    spark.sql("SELECT city, sum(n) AS n FROM delivery_cities GROUP BY city ORDER BY n").show()
    spark.sql("SELECT * FROM delivery_cities WHERE city = 'montreal'").show()
    ```

    ```text
    +--------+---+
    |    city|  n|
    +--------+---+
    |Montréal|  3|
    |  Hà Nội|  7|
    +--------+---+

    +--------+---+
    |    city|  n|
    +--------+---+
    |Montréal|  1|
    |MONTREAL|  2|
    +--------+---+
    ```

    Reading the table's files back with `spark.read.parquet(...)` gives
    `StringType('UNICODE_CI_AI')`, so the rules travel with the data.
    That is convenient and a little dangerous: every query on the column
    now compares accent-insensitively, including filters nobody meant to
    be fuzzy. Use it for columns that are *names*, not codes.

    Joins work the same way. Collate both sides of the condition:

    ```python
    stores = spark.read.option("header", True).csv("data/messy/geo_deliveries/stores.csv")
    store_cities = stores.select(F.col("city").alias("store_city")).distinct()
    joined = raw.join(store_cities,
        F.collate(F.trim("city"), "UNICODE_CI_AI") == F.collate("store_city", "UNICODE_CI_AI"),
        "left")
    ```

    The plan shows Spark shuffling on the collated value, so equal names
    meet in the same task:

    ```text
    +- SortMergeJoin [collate(trim(city#18, None), UNICODE_CI_AI)], [collate(store_city#331, UNICODE_CI_AI)], LeftOuter
       :- Sort [collate(trim(city#18, None), UNICODE_CI_AI) ASC NULLS FIRST], false, 0
       :  +- Exchange hashpartitioning(collate(trim(city#18, None), UNICODE_CI_AI), 200), ...
    ```

    **The cost.** Grouping 2 million cached rows of 8 city spellings on
    `local[2]`, best of three runs on one laptop:

    | Collation | Groups | Time |
    |---|---|---|
    | `UTF8_BINARY` | 8 | 0.12 s |
    | `UTF8_LCASE` | 6 | 1.01 s |
    | `UNICODE` | 8 | 1.13 s |
    | `UNICODE_CI_AI` | 4 | 0.98 s |

    Any non-binary collation was roughly eight times slower here,
    because every comparison or hash computes a collation key instead of
    using the bytes. Fine for a cleaning step or a dimension table; for a
    hot join key on billions of rows, compute a normalized key once,
    store it, and join on that.

