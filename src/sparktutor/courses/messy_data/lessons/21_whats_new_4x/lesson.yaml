    ## Gotcha: Geo Columns Cannot Be Cached

    `cache()` on a DataFrame with a `GEOGRAPHY` or `GEOMETRY` column
    fails in 4.2.0 as soon as the cache is filled:

    ```text
    org.apache.spark.SparkException: not support type: GeographyType(4326).
    ```

    The in-memory columnar cache (`ColumnBuilder` in
    `sql/core/.../execution/columnar/`) has no encoder for the geo types
    yet, and `persist(StorageLevel.DISK_ONLY)` goes through the same
    code. The error has no proper condition (`_LEGACY_ERROR_TEMP_2100`)
    and in classic PySpark arrives as a `Py4JJavaError`. Two ways around
    it: cache the WKB `BINARY` column and apply `st_geogfromwkb` after
    the cache, or use `localCheckpoint()`, which stores rows in a
    different format and works.

