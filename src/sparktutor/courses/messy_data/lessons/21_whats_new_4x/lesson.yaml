    ## Language Rules

    `UNICODE_CI_AI` uses ICU's language-neutral rules. Spark also ships
    a collation for each language ICU knows, with the same suffixes
    (`fr_CI_AI`, `de_CI`, `vi_CI_AI_RTRIM`, ...). Language rules can
    disagree with the neutral ones:

    ```python
    spark.sql("""SELECT
      'Straße'  = 'STRASSE' COLLATE UNICODE_CI    AS ci,
      'Straße'  = 'STRASSE' COLLATE UNICODE_CI_AI AS ci_ai,
      'Đà Nẵng' = 'da nang' COLLATE UNICODE_CI_AI AS root_ai,
      'Đà Nẵng' = 'da nang' COLLATE vi_CI_AI      AS vi_ai,
      'Hà Nội'  = 'HÀ NỘI'  COLLATE vi_CI_AI      AS vi_ci""").show()
    ```

    ```text
    +-----+-----+-------+-----+-----+
    |   ci|ci_ai|root_ai|vi_ai|vi_ci|
    +-----+-----+-------+-----+-----+
    |false| true|   true|false| true|
    +-----+-----+-------+-----+-----+
    ```

    - `ß` and `ss` are equal only once accents are ignored.
    - Under the neutral rules `Đ` is a `D` with a mark, so `Đà Nẵng`
      equals `da nang`. In **Vietnamese**, `đ`, `ă`, `â`, `ê`, `ô`, `ơ`,
      `ư` are letters of their own, so `vi_CI_AI` keeps `Đà Nẵng` and
      `da nang` apart (it still ignores case).

    Which is right depends on the question. For "which deliveries went
    to Đà Nẵng", the neutral `UNICODE_CI_AI` matches what people type on
    an English keyboard. For sorting a Vietnamese customer list the way
    a Vietnamese reader expects, use `vi`. Ordering changes too:
    `ORDER BY x` sorts by bytes (`A B a b e f é`), and
    `ORDER BY x COLLATE UNICODE` sorts like a dictionary (`a A b B e é f`).

