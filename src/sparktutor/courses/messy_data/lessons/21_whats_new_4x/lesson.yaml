    ## Geospatial: From Messy Coordinates to GEOGRAPHY

    The "What's New in Apache Spark 4.x" lesson "Geospatial Types:
    GEOMETRY and GEOGRAPHY" covers the types themselves: `GEOGRAPHY(4326)`
    for longitude and latitude on the globe, `GEOMETRY(srid)` for flat
    coordinates, values stored as WKB (Well-Known Binary, x before y,
    so longitude first), and the five functions 4.2 has:
    `st_geomfromwkb`, `st_geogfromwkb`, `st_asbinary`, `st_srid` and
    `st_setsrid`. There is no `st_point`, no `st_distance` and no
    `st_contains`. The functions first appeared in 4.1 behind
    `spark.sql.geospatial.enabled`, which was off by default; 4.2 turned
    it on (SPARK-56771).

    That leaves the question this course cares about: what to do with
    coordinates that arrive as messy text. The courier app behind
    `deliveries.csv` produced all of these:

    ```text
    delivery_id,city,lat,lon
    D001,Vancouver, 49.25336,-122.95484
    D005,HỒ CHÍ MINH,10.75949 ,1067.26259
    D008,MONTRÉAL,45.4767N,73.5301W
    D015,Toronto,-79.39139, 43.71964
    D050,montreal ,0,0
    D053,Ho Chi Minh,NaN,106.73194
    D080,Toronto,43.68837,79.37243
    ```

    Stray spaces, a slipped decimal point (`1067`), compass letters,
    latitude and longitude swapped, "null island" (0, 0, the classic
    default for a GPS that had no fix), `NaN`, and a lost minus sign
    (`79.37` east instead of west puts Toronto in China).

