    ## A Validation Ladder

    Decide each row's fate with one `when` chain, checked in order. The
    order matters: NaN must be caught before a range check, and 0, 0 is
    in range but almost never real.

    ```python
    SERVICE_AREAS = [("Canada", 41.0, 84.0, -142.0, -52.0),
                     ("Vietnam", 8.0, 24.0, 102.0, 110.0)]

    def in_area(lat, lon):
        cond = F.lit(False)
        for _, lat_min, lat_max, lon_min, lon_max in SERVICE_AREAS:
            cond = cond | (lat.between(lat_min, lat_max) & lon.between(lon_min, lon_max))
        return cond

    lat_s, lon_s = F.trim("lat"), F.trim("lon")
    lat, lon = lat_s.try_cast("double"), lon_s.try_cast("double")
    status = (F.when(lat_s.isNull() | lon_s.isNull() | (lat_s == "") | (lon_s == ""), "missing")
        .when(lat.isNull() | lon.isNull() | F.isnan(lat) | F.isnan(lon), "unparseable")
        .when((lat == 0) & (lon == 0), "null_island")
        .when(in_area(lat, lon), "ok")
        .when(in_area(lon, lat), "swapped")
        .when(lat.between(-90, 90) & lon.between(-180, 180), "outside_area")
        .otherwise("out_of_range"))
    ```

    ```text
    +------------+-----+
    |      status|count|
    +------------+-----+
    |          ok|  134|
    |     swapped|   15|
    | unparseable|    7|
    |outside_area|    4|
    | null_island|    3|
    |out_of_range|    2|
    |     missing|    1|
    +------------+-----+
    ```

    Why a **service area** and not just the valid ranges? A range check
    catches a swap only when the longitude is beyond ±90: Vancouver
    swapped is latitude -123, impossible. Toronto swapped is latitude
    -79.39, longitude 43.72, a real place in the Southern Ocean. Only
    knowing where you deliver tells you that row is wrong, and that
    swapping it back lands in Toronto. The same knowledge flags the lost
    minus sign (`outside_area`) that no range check could see.

