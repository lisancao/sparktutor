      and precomposed accents as equal and `UTF8_LCASE` does not; `_RTRIM`
      ignores only trailing spaces, so `trim()` first; language
      collations (`vi_CI_AI`) follow that language's rules; `collect_set`
      and `LIKE` (except with `UTF8_LCASE`) refuse collated strings;
      `hash()` ignores collations; tables can declare `DEFAULT COLLATION`
      and Parquet keeps it; expect roughly an order of magnitude slower
      comparisons than binary
    - **`SHOW COLLATIONS`** (4.2) and `collations()` (4.0) to find them
    - **4.x `try_` functions** turn single error conditions into NULLs;
      `try_to_date` is 4.1 despite what `DESCRIBE FUNCTION` says
    - **TIME** is disabled in 4.2.0 (`UNSUPPORTED_TIME_TYPE`); use
      intervals or minutes since midnight
    - **Messy coordinates**: `try_cast` lets `NaN` and `1.5d` through,
      NaN is larger than every number in Spark, so check `isnan` first;
      validate against your service area to catch swaps and lost signs
    - **GEOGRAPHY from WKB** with a small UDF (or `reflect` for the
      brave); no `try_` ST functions, so validate first; geo columns
      cannot be cached in 4.2.0
    - **Nearest store** with a grid (cells, 3 x 3 neighbours, an
      equi-join) and a built-in haversine; `NEAREST BY` (4.2) is simpler
      and brute force
    - **Point in polygon** with ray casting in a UDF over `st_asbinary`;
      Apache Sedona has no Spark 4.2 release yet
    - **Exploring SQL**: pipe syntax, `approx_top_k`, `listagg`,
      `QUALIFY`, `randstr`/`uniform`, `DESCRIBE ... AS JSON`

    Next: **Reading a Custom File Format, in Parallel**, the first lesson
    of the intermediate level, where you build the docs data source that
    the intermediate capstone finishes.
