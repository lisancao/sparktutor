    ## Exercise: Clean Up the Delivery Map

    The helpers are written for you: `read_csv`, `point_wkb`,
    `point_from_wkb`, `point_in_ring`, `in_area`, `SERVICE_AREAS` and
    `ZONES`. Implement:

    1. `clean_points(raw)`: `delivery_id, city, lat, lon, status`, with
       the validation ladder from this lesson. `lat` and `lon` are
       doubles for `ok` and `swapped` rows (swapped back), NULL
       otherwise.
    2. `with_geography(points)`: add `wkb` (a UDF over `point_wkb`) and
       `geo` (`st_geogfromwkb`).
    3. `haversine_km(lat1, lon1, lat2, lon2)`: the distance in km from
       built-in functions only.
    4. `nearest_store(points, stores, cell_deg)`: the closest store in
       the 3 x 3 grid neighbourhood, with NULLs when there is none.
    5. `zone_of(geo_points)`: the `ZONES` name containing each point,
       with a UDF over `st_asbinary(geo)`.
    6. `city_groups(raw, stores)`: one row per real city, with the store
       list's spelling (or NULL), the delivery count and the sorted raw
       spellings, using a collation.

    The harness recomputes every answer in plain Python: each row's
    status and coordinates, the WKB bytes and SRID, the nearest store
    and distance by brute force over the same neighbourhood, the zone,
    and the city groups (with its own accent and case folding).
