    ## Nearest Store With a Grid

    Finding each delivery's nearest store by comparing it with every
    store is a cross join: 149 deliveries times 12 stores is 1788 pairs
    here, and billions for real data. A **grid** cuts that down. Give
    every point a cell number by rounding its coordinates down to
    `cell_deg` degrees:

    ```python
    cell = 0.1
    pts = (geo.filter("lat IS NOT NULL")
        .select("delivery_id", "lat", "lon",
                F.floor(F.col("lat") / cell).alias("cell_lat"),
                F.floor(F.col("lon") / cell).alias("cell_lon")))
    ```

    ```text
    +-----------+--------+----------+--------+--------+
    |delivery_id|     lat|       lon|cell_lat|cell_lon|
    +-----------+--------+----------+--------+--------+
    |       D001|49.25336|-122.95484|     492|   -1230|
    |       D002|43.64286| -79.43799|     436|    -795|
    |       D003|16.01392| 108.17913|     160|    1081|
    +-----------+--------+----------+--------+--------+
    ```

    A store near a cell's edge can be closer than a store inside the
    cell, so copy each store into its own cell and the 8 around it, then
    join on the cell numbers. An equi-join on cells is a normal hash
    join, not a cross join:

    ```python
    offsets = F.sequence(F.lit(-1), F.lit(1))
    cand = (stores.select("store_id", F.col("lat").cast("double").alias("s_lat"),
                          F.col("lon").cast("double").alias("s_lon"))
        .withColumn("dlat", F.explode(offsets))
        .withColumn("dlon", F.explode(offsets))
        .select("store_id", "s_lat", "s_lon",
                (F.floor(F.col("s_lat") / cell) + F.col("dlat")).alias("cell_lat"),
                (F.floor(F.col("s_lon") / cell) + F.col("dlon")).alias("cell_lon")))
    pairs = pts.join(cand, ["cell_lat", "cell_lon"], "left")
    ```

    The 12 stores become 108 store-cells, and the join compares 274
    pairs instead of 1788. Then compute `haversine_km` for each pair and
    keep the closest per delivery with `row_number()` over a window
    partitioned by `delivery_id` (or `QUALIFY`, below; "Window Functions
    in One Page" in "Binary Records: Avro and Protobuf" covers both, and
    why the order needs a tie-breaker). The six
    deliveries in Ottawa, Calgary and Huế find no store within one cell
    and come out with NULLs, which is the honest answer for "nearest
    store within roughly 10 km".

    Know the grid's limits:

    - It answers "nearest **within the neighbourhood**". A 0.1 degree
      cell is about 11 km north to south everywhere, but east to west it
      shrinks with latitude (about 7 km in Vancouver, 11 km in Hồ Chí
      Minh). Choose the cell from the largest search radius you need,
      at the highest latitude you serve.
    - Cells do not wrap at the 180° meridian or behave near the poles.
      For global data, use a real spatial index (H3, S2, geohash) from a
      library.
    - Skew: a city centre puts thousands of deliveries in one cell and
      one task. "Plans, Partitions and Caching" shows how to spot it.

