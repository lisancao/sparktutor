    ## Zones: Point in Polygon in Python

    "Is this delivery inside the downtown zone?" is `ST_Contains` in a
    spatial library, and 4.2 does not have it. A zone is a polygon: a
    closed ring of (lon, lat) corners. The **ray casting** test draws a
    line from the point towards the east and counts how many edges of the
    ring it crosses; an odd count means inside:

    ```python
    def point_in_ring(lon, lat, ring):
        inside = False
        for (x1, y1), (x2, y2) in zip(ring, ring[1:]):
            if (y1 > lat) != (y2 > lat):
                x_cross = x1 + (lat - y1) * (x2 - x1) / (y2 - y1)
                if lon < x_cross:
                    inside = not inside
        return inside
    ```

    It works for concave shapes, such as the exercise's L-shaped
    downtown zone. Wrap it in a UDF that reads the point back out of the
    geography's WKB with `st_asbinary`, so the column you pass around is
    the typed `geo` and not two loose doubles:

    ```python
    def point_from_wkb(wkb):
        wkb = bytes(wkb)
        order = "<" if wkb[0] == 1 else ">"
        return struct.unpack(order + "dd", wkb[5:21])
    ```

    On the sample data, 8 deliveries fall in "Downtown Vancouver", 6 in
    the "Old Quarter" of Hà Nội, and the other 135 in neither.

    Polygons can be stored as geography too: a WKB polygon (type 3, a
    ring count, then the points) goes through `st_geogfromwkb` just
    like a point (a five-corner ring is 93 bytes). Spark keeps it; it
    just cannot test containment against it yet. A ring with corners
    0.06 degrees apart is small enough that planar ray casting on
    longitude and latitude is accurate; for zones hundreds of kilometres
    wide, edges on a sphere curve and you need a geodesic library.

    4.2 also allows casting between the two geo types
    (`CAST(geo AS GEOMETRY(4326))`, SPARK-55539), which is how you would
    hand a geography column to code written for planar geometry.

