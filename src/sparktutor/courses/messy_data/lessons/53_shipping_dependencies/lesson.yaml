    ## What About `uv run`?

    The 4.2.0 packaging guide adds a `uv run` recipe: a wrapper script
    `uv_run` containing `exec uv run "$@"`, `PYSPARK_PYTHON=./uv_run`,
    and dependencies declared inline in the script (PEP 723). We tried
    it with uv 0.11.10, in local mode, with a script declaring
    `tabulate==0.9.0` and a UDF that imports it:

    ```text
    Installed 1 package in 4ms
    driver: /home/lnc/.cache/uv/environments-v2/app-45b6f186f18c50cc/bin/python 0.9.0
    worker: /home/lnc/.local/share/uv/python/cpython-3.14-linux-x86_64-gnu/bin/python3.14 ModuleNotFoundError("No module named 'tabulate'")
    ```

    The driver ran in an environment built from the inline metadata.
    The workers did not: Spark starts them as `./uv_run -m
    pyspark.daemon pyspark.worker`, so `uv run` sees a module, not your
    script, and has no metadata to read; here it picked uv's newest
    managed Python (3.14) with nothing installed. The two minor versions
    happened to match, so no `PYTHON_VERSION_MISMATCH` warned us. The
    driver also printed the Arrow fallback warning, because its
    environment had no `pyarrow`. Treat the recipe as a way to run the
    driver, and give executors an environment of their own (a project
    environment `uv run` can find from their working directory, an
    archive, or an image).

    (You also have to set `SPARK_HOME` when `PYSPARK_PYTHON` is a
    wrapper: the pip launcher scripts locate Spark by running
    `PYSPARK_PYTHON`, and with the wrapper they printed "Could not find
    valid SPARK_HOME".)

