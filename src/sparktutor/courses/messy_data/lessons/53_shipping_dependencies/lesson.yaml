    ## Three Places Python Runs

    A PySpark application has Python in more places than one:

    ```text
    your machine / driver host          executors (one per host or pod)
    +------------------------+          +-------------------------------+
    | driver Python          |  Py4J /  | JVM executor                  |
    |  (your script, Classic)| ------>  |   PythonWorkerFactory         |
    | or the Connect client  |  gRPC    |     python -m pyspark.daemon  |
    +------------------------+          |       forked pyspark.worker   |
                                        |       (your UDFs, read(), ...) |
    Connect server (driver JVM) also    +-------------------------------+
    starts Python for planning: Python
    data sources, UDTF analysis.
    ```

    The driver's `sys.path` is whatever your venv and `PYTHONPATH` say.
    A worker's is built by Spark, in three layers:

    1. **The process environment.** `PythonWorkerFactory`
       (`core/src/main/scala/org/apache/spark/api/python/PythonWorkerFactory.scala`)
       starts `<pythonExec> -m pyspark.daemon pyspark.worker` with
       `PYTHONPATH` set to `PythonUtils.sparkPythonPath` (Spark's own
       `pyspark.zip` and the py4j zip, plus the jar Spark itself was
       loaded from), then any
       `PYTHONPATH` in the function's environment, then the executor's
       own `PYTHONPATH`.
    2. **The current directory.** Python puts the working directory
       first on `sys.path` for `-m`. Remember this one; it causes the
       "works on my laptop" trap below.
    3. **Per task, from the protocol.** Before running your function,
       the JVM writes the files root and a list of *includes*
       (`PythonWorkerUtils.writeSparkFiles`), and
       `pyspark/worker_util.py` does this with them:

    ```python
    def setup_spark_files(infile: IO) -> None:
        spark_files_dir = utf8_deserializer.loads(infile)
        ...
        path_changed = add_path(spark_files_dir)  # *.py files that were added will be copied here
        num_python_includes = read_int(infile)
        for _ in range(num_python_includes):
            filename = utf8_deserializer.loads(infile)
            path_changed = add_path(os.path.join(spark_files_dir, filename)) or path_changed
    ```

    `add_path` inserts at position 1 and never twice, and a worker that
    is reused keeps what earlier tasks added. Everything in this lesson
    is a way to get a file into `spark_files_dir`, onto that include
    list, or into the interpreter itself.

    Here is what a worker sees on a stock local run (paths shortened:
    `<venv>` is the virtual environment, `<project>` the folder the
    script was started from):

    ```python
    from pyspark.sql import SparkSession, functions as F

    spark = SparkSession.builder.master("local[2]").getOrCreate()
    spark.sparkContext.setLogLevel("ERROR")

    @F.udf("string")
    def where_am_i(_):
        import os, sys
        from pyspark import SparkFiles
        return "\n".join([
            f"executable  {sys.executable}",
            f"cwd         {os.getcwd()}",
            f"files root  {SparkFiles.getRootDirectory()}",
            *[f"sys.path    {p}" for p in sys.path[:4]],
        ])

    print(spark.range(1).select(where_am_i("id")).first()[0])
    ```

    ```text
    executable  <venv>/bin/python
    cwd         <project>
    files root  /tmp/spark-7dbc15ca-.../userFiles-3d7628cb-...
    sys.path    <project>
    sys.path    /tmp/spark-7dbc15ca-.../userFiles-3d7628cb-...
    sys.path    <venv>/lib/python3.12/site-packages/pyspark/python/lib/pyspark.zip
    sys.path    <venv>/lib/python3.12/site-packages/pyspark/python/lib/py4j-0.10.9.9-src.zip
    ```

    Two things to notice. In local mode the executor *is* the driver
    JVM, so the worker inherits the driver's working directory, and
    `sys.path[0]` is your project folder: a `messytools/` package sitting
    next to your script is importable in every task, by accident. On a
    cluster the executor's working directory is somewhere else and the
    same job fails with `ModuleNotFoundError`. That is why the exercise
    writes its package to a temporary folder. Second, the files root is
    a temporary `userFiles-*` folder on the driver; on executors of a
    real cluster `SparkFiles.getRootDirectory()` is `"."`, the
    executor's working directory (`SparkFiles.scala`:
    `SparkEnv.get.driverTmpDir.getOrElse(".")`, and only the driver sets
    `driverTmpDir`). Keep that difference in mind for archives.

