  Output: |
    ## Connect Lifecycle Gotchas From the Exercise

    Running a local Connect server from a script, and two client
    sessions against it, surfaced three behaviours worth knowing:

    - Under `spark-submit` a master is already set, so
      `SparkSession.builder.remote("local[2]")` is refused with
      `CANNOT_CONFIGURE_SPARK_CONNECT_MASTER` ("Spark Connect server and
      Spark master cannot be configured together"). Use
      `.master("local[2]").config("spark.api.mode", "connect")`, as
      "Spark Connect" in the Learning Spark course recommends. It still
      warns `Failed to set spark.api.mode ... CANNOT_MODIFY_CONFIG`,
      which is harmless.
    - The same check refuses `SparkSession.builder.remote("sc://...")`
      for the second session. The Connect builder itself,
      `pyspark.sql.connect.session.SparkSession.builder.remote(url).create()`,
      skips it.
    - `stop()` on any Connect session in a process that started the
      local server stops the server too (it checks `SPARK_LOCAL_REMOTE`
      in `pyspark/sql/connect/session.py`). A second client that is
      still open then retries its RPCs, first in `stop()`
      (`release_session`) and otherwise at interpreter exit (an
      `atexit` hook cleans up its ML cache), and the process hangs for
      minutes. Release and close the extra clients
      (`client.release_session()`, `client.close()`) before stopping
      the session that owns the server.

