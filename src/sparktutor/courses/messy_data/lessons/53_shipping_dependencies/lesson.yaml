  Output: |
    ## Summary

    - A worker's `sys.path` is Spark's own zips, the working directory
      (from `python -m`), the files root, and the include list sent
      with each function. In local mode the working directory is the
      driver's, which hides missing dependencies.
    - Executors run `PYSPARK_PYTHON` (default `python3` from `PATH`),
      fixed when the context starts; `spark.pyspark.python` works
      through `spark-submit`. Minor versions must match
      (`PYTHON_VERSION_MISMATCH`), and in 4.2.0 even a plain `@udf`
      needs `pyarrow` on the workers.
    - `--py-files`, `spark.submit.pyFiles` and `addPyFile` put `.py`,
      `.zip`, `.egg` and `.jar` files on the path. Ship before you
      define Classic UDFs (their include list is captured once), never
      expect a new version to reload in reused workers, and keep native
      code out of zips.
    - `--archives`/`spark.archives` (3.1) unpack into the files root,
      which is the working directory on cluster executors but a temp
      folder in local mode, so `./environment/bin/python` works only on
      a cluster. A `pip install --target` folder plus `SparkFiles.get`
      works everywhere. `venv-pack` symlinks the interpreter.
    - Connect artifacts (`addArtifacts`, 3.5; Classic since 4.0) are
      per session: their own folder, their own workers, no overwrites
      (`ARTIFACT_ALREADY_EXISTS`), local files only, no wheels, and no
      way to change the interpreter.
    - On Kubernetes, bake dependencies into the image; in client mode
      the laptop's Python must match the image's.

    Next: **Observability: Listeners, Metrics and Profiling Executors**,
    where you watch these executors work: listeners, the event log, the
    metrics system and profilers for the Python running inside them.
