    ## Way 1: Python Files and Zips

    Three entry points end in the same place:

    | Entry point | When | Notes |
    |---|---|---|
    | `spark-submit --py-files a.zip,b.py` | at launch | also on the driver's path in client mode |
    | `spark.submit.pyFiles` (1.0.1) | at launch, or in the builder before the context starts | read in `SparkContext.__init__` |
    | `sc.addPyFile(path)` (0.7) | any time | Classic only; local, HDFS, HTTP(S) or FTP path |

    `addPyFile` is short enough to read in full
    (`pyspark/core/context.py`):

    ```python
    def addPyFile(self, path: str) -> None:
        self.addFile(path)
        dirname, filename = os.path.split(path)
        if filename[-4:].lower() in self.PACKAGE_EXTENSIONS:   # (".zip", ".egg", ".jar")
            self._python_includes.append(filename)
            # for tests in local mode
            sys.path.insert(1, os.path.join(SparkFiles.getRootDirectory(), filename))
        importlib.invalidate_caches()
    ```

    So a `.py` file is copied into the files root (always on the
    worker's path), a `.zip`, `.egg` or `.jar` also joins the include
    list, and anything else (a `.whl`, a `.tar.gz`) is copied but never
    put on a path. It also edits the **driver's** `sys.path`, which is
    why `import messytools` starts working in your script right after
    the call, even though nothing was installed.

    Both launch-time forms worked on 4.2.0 with the same zip:
    `spark-submit --master "local[2]" --py-files messytools.zip app.py`
    and `.config("spark.submit.pyFiles", "/abs/path/messytools.zip")` in
    the builder of a plain `python app.py`; in each case the driver and
    the tasks imported `.../userFiles-*/messytools.zip/messytools/__init__.py`.

    The zip itself has one rule: the package folder must be at the top
    of the archive, so `messytools/__init__.py` is an entry, not
    `src/messytools/__init__.py` or `__init__.py`. Leave bytecode out;
    `zipimport` compiles from source anyway:

    ```bash
    cd src && zip -qr ../messytools.zip messytools -x '*__pycache__*'
    unzip -l ../messytools.zip
    ```

    ```text
      Length      Date    Time    Name
    ---------  ---------- -----   ----
            0  2026-10-28 14:17   messytools/
           14  2026-10-28 14:17   messytools/__init__.py
    ```

