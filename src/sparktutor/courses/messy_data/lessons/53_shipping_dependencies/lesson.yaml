    ## What You'll Learn

    "Packaging, Registration, Testing and Debugging" (intermediate
    level) turned a data source into a pip package and left you with one
    rule: a class imported from an installed module is pickled by
    reference, so that module must be importable on every worker. "The
    Python Worker Protocol" showed how those workers start, fork from a
    daemon and get reused. "Spark Connect" in the Learning Spark course
    mentioned `spark.addArtifacts` in passing. This lesson is about the
    word *importable*: how a Python worker on an executor builds its
    `sys.path`, which interpreter it runs, and every supported way to
    put code and libraries in front of it.

    By the end you will be able to:

    - Read the worker's path setup in the 4.2.0 source
      (`worker_util.setup_spark_files`,
      `PythonWorkerUtils.writeSparkFiles`, `PythonWorkerFactory`) and
      predict where an import will be resolved
    - Pick the interpreter executors run, and recognize
      `PYTHON_VERSION_MISMATCH` and the missing-`pyarrow` failure that
      4.2's Arrow-optimized UDFs cause in a thin environment
    - Ship code with `--py-files`, `spark.submit.pyFiles` and
      `addPyFile`, and avoid three traps: the include list a UDF
      captured when it was first used, versions that never reload in
      reused workers, and native extensions inside a zip
    - Ship environments with `--archives`/`spark.archives` (3.1),
      `venv-pack` and a `pip install --target` folder, and explain why
      `PYSPARK_PYTHON=./environment/bin/python` fails in local mode
    - Use Spark Connect artifacts, which are private to one session,
      down to the per-session folder, daemon and error conditions
    - Build a Kubernetes image for PySpark and choose between client
      and cluster mode with the driver's Python in mind

    Everything runs on a laptop in local mode. Where a claim is about a
    cluster, it is backed by the code path in `~/repos/spark-v4.2.0`
    that a cluster takes, and said so.

