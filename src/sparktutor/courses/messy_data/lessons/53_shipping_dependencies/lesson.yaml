    ## A Thin Environment Meets Arrow UDFs

    Since 3.4 `spark.sql.execution.pythonUDF.arrow.enabled` exists, and
    in 4.2.0 its default is `true`: a plain `@udf` is evaluated through
    `ArrowEvalPython`, so the **worker** imports `pyarrow` even though
    your function never does. A worker environment with only your own
    libraries fails like this (a venv with `tabulate` and nothing else):

    ```text
    org.apache.spark.api.python.PythonException: [PYTHON_EXCEPTION] An exception was thrown from
    the Python worker: Traceback (most recent call last):
        func, profiler, deserializer, serializer = read_udfs(
        import pyarrow as pa
    ModuleNotFoundError: No module named 'pyarrow'
    ```

    The same UDF passed with the setting turned off, and also passed
    with Arrow on in a venv holding `pyarrow` 26.0.0 but no `pandas`:
    the Arrow path for plain UDFs needs `pyarrow` only (`pandas_udf`,
    `mapInPandas` and `applyInPandas` need `pandas` too). The minimums
    PySpark 4.2.0 checks are `pyarrow>=18.0.0`, `pandas>=2.2.0` and
    `numpy>=1.21` (`pyspark/sql/pandas/utils.py`). When the *driver*
    lacks them the fallback is silent apart from a warning ("Arrow
    optimization failed to enable because PyArrow or Pandas is not
    installed. Falling back to a non-Arrow-optimized UDF."); when only
    the workers lack them, the query fails. So a packed environment for
    executors needs `pyarrow` in it, whatever your code imports.

