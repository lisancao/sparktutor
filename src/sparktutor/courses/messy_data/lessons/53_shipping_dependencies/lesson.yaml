    ## Way 3: Spark Connect Artifacts

    With Spark Connect your program is a client; it has no
    `SparkContext` and cannot call `addPyFile`. It uploads files to the
    server instead:

    ```python
    spark.addArtifacts("messytools.zip", pyfile=True)        # .py, .zip, .egg, .jar
    spark.addArtifacts("deps.tar.gz#deps", archive=True)     # .zip, .jar, .tar.gz, .tgz, .tar
    ```

    `addArtifacts` appeared in 3.5 for Connect and works in Classic
    since 4.0 (`versionadded`/`versionchanged` in
    `pyspark/sql/session.py`). The client
    (`pyspark/sql/connect/client/artifact.py`) only accepts local files,
    and checks the extension before sending anything:

    ```text
    s3: PySparkRuntimeError [UNSUPPORTED_OPERATION] s3 scheme is not supported.
    whl: PySparkRuntimeError [UNSUPPORTED_OPERATION] /tmp/tmpi4rd9lbb/x-1.0-py3-none-any.whl file format is not supported.
    ```

    On the server, `ArtifactManager.addArtifact`
    (`sql/core/src/main/scala/org/apache/spark/sql/artifact/ArtifactManager.scala`)
    stores each file under a folder for the session and registers it
    with the `SparkContext`, keyed by that session. Then three things
    differ from Classic, all of which you can observe:

    - **A folder per session.** Tasks of a Connect session find
      `SparkFiles.getRootDirectory()` and their working directory at
      `<root>/<uuid>`. The uuid is the server-side
      `SparkSession.sessionUUID`, not the client's `session_id`; in one
      run the client id was `8156908f-...` and the folder
      `78469628-...`.
    - **Workers per session.** `PythonWorkerFactory` starts the daemon
      in that folder, and `SparkEnv` keeps one factory per
      `(pythonExec, module, envVars)`, where `envVars` includes
      `SPARK_JOB_ARTIFACT_UUID`. Two sessions never share a Python
      worker, so they can import two versions of one package at the
      same time.
    - **No overwrites.** Adding a file whose name exists with different
      bytes fails; identical bytes are accepted silently (the add is
      idempotent):

    ```text
    org.apache.spark.SparkRuntimeException: [ARTIFACT_ALREADY_EXISTS] The artifact
    pyfiles/messytools.zip already exists. Please choose a different name for the new artifact
    because it cannot be overwritten. SQLSTATE: 42713
    ```

    Two client sessions on one local server, A with the zip and a
    `deps` archive, B with nothing (task output, folder names shortened
    to their uuid):

    ```text
    A: cwd=feef3239-... root=feef3239-... zip=1.0 tar=feef3239-.../deps/site-packages/messyarch/__init__.py
    B: cwd=fc15ce2c-... root=fc15ce2c-... zip=missing tar=missing
    ```

    In Classic, `spark.addArtifacts` is only a front for
    `sc.addPyFile`, `sc.addArchive` and `sc.addFile`, with no isolation.
    It refuses a changed file under a name it already copied with
    `DUPLICATED_ARTIFACT` ("Duplicate Artifact: ... Artifacts cannot be
    overwritten."), where `addPyFile` ignores it.

    What artifacts cannot do: change the interpreter. The server's
    workers run the server's `PYSPARK_PYTHON` for every session, so an
    artifact can add pure Python code and data to a session, while
    native libraries and the Python version belong to the server's
    image. (`cloneSession()` on the Connect client copies the session's
    Python includes to the clone; see `ArtifactManager.clone`.)

