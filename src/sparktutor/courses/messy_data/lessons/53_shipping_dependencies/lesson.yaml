    ## Way 2: Archives and Packed Environments

    `--archives`, `spark.archives` (3.1, marked experimental in its
    doc) and `sc.addArchive` ship `.zip`, `.jar`, `.tar.gz`, `.tgz` or
    `.tar` files that Spark **unpacks** on every executor. A fragment
    names the folder: `deps.tar.gz#deps` is unpacked into a folder
    called `deps`. The code is `Executor.updateDependencies`
    (`core/src/main/scala/org/apache/spark/executor/Executor.scala`):

    ```scala
    val dest = new File(
      root,
      if (sourceURI.getFragment != null) sourceURI.getFragment else source.getName)
    ...
    Utils.deleteRecursively(dest)
    Utils.unpack(source, dest)
    ```

    `root` is `SparkFiles.getRootDirectory()`, or, for a Spark Connect
    session, a folder named after the session inside it. That one line
    explains the most common confusion about packed environments.

    **The cluster recipe.** Pack a whole venv (or conda env) and point
    the executors' interpreter at the unpacked copy:

    ```bash
    python -m venv pyspark_venv
    pyspark_venv/bin/pip install venv-pack pyarrow pandas
    pyspark_venv/bin/venv-pack -p pyspark_venv -o pyspark_venv.tar.gz
    export PYSPARK_DRIVER_PYTHON=python          # not in cluster mode
    export PYSPARK_PYTHON=./environment/bin/python
    spark-submit --archives pyspark_venv.tar.gz#environment app.py
    ```

    On executors of a real cluster the root is `"."`, the executor's
    working directory, so `./environment/bin/python` resolves (that is
    the recipe in the PySpark "Python Package Management" guide, which
    also covers conda-pack and PEX). Two warnings come with `venv-pack`
    0.2.0. It packs the interpreter as a symlink, and an absolute one:

    ```text
    $ tar tvzf pyspark_venv.tar.gz | grep bin/python
    lrwxrwxrwx lnc/lnc  0 2026-10-28 13:26 bin/python3.12 -> /usr/bin/python3.12
    lrwxrwxrwx lnc/lnc  0 2026-10-28 13:26 bin/python -> python3.12
    lrwxrwxrwx lnc/lnc  0 2026-10-28 13:26 bin/python3 -> python3.12
    ```

    so every executor needs that exact interpreter at that path
    (conda-pack ships the interpreter itself, which is its main
    advantage). And it packs everything in the venv, `pip` included: a
    venv holding only `pyarrow` and `tabulate` packed to 61 MB.

    **The same recipe in local mode fails**, because in local mode the
    executor is the driver and the root is the driver's temporary
    `userFiles-*` folder, not the working directory:

    ```text
    root: /tmp/spark-1bb52b14-.../userFiles-0be68f22-... ['environment']
    java.io.IOException: Cannot run program "./environment/bin/python": error=2, No such file or directory
    ```

    The archive was unpacked (`environment` is right there); the
    interpreter path simply does not point at it. Test packed
    environments on a real cluster manager, or in a container, not in
    `local[*]`.

    **A portable alternative for pure libraries** is a site folder, the
    layout `pip install --target` produces, shipped as an archive and
    added to `sys.path` inside the task. It keeps the cluster's
    interpreter and works in local mode, on clusters and on Connect,
    because `SparkFiles.get(name)` resolves the root for whichever mode
    the task runs in:

    ```python
    sc.addArchive(os.path.abspath("deps.tar.gz") + "#deps")

    @F.udf("string")
    def uses_deps(x):
        import os, sys
        from pyspark import SparkFiles
        site = os.path.join(SparkFiles.get("deps"), "site-packages")
        if site not in sys.path:
            sys.path.insert(0, site)
        import tabulate
        return tabulate.__file__
    ```

    You build exactly this in the exercise.

