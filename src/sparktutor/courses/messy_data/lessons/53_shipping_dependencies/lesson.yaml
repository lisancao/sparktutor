  Output: |
    ## A Contrast: Notebook-Scoped Libraries

    Some managed platforms let a notebook run `%pip install` and get a
    library for that notebook alone, on the driver and the executors,
    without restarting the cluster. In open source Spark the pieces are
    narrower: the interpreter and native libraries are per application
    (Classic) or per server (Connect), and only pure-Python code and
    data can be scoped to a Connect session with artifacts. When you
    read about per-notebook environments, ask which interpreter the
    executors run and where the native code comes from.

- Class: text
  Depth: all
  Output: |
    ## Choosing a Way

    | You need to ship | Classic | Connect | Notes |
    |---|---|---|---|
    | Your own pure-Python modules | `--py-files`, `addPyFile` | `addArtifacts(pyfile=True)` | ship before defining UDFs (Classic) |
    | Pure third-party libraries | zip of `pip install --target` | same, as `pyfile` | versions fixed for the app |
    | Libraries with native code | archive + `sys.path`, or packed env | archive with `archive=True` | match platform tag and Python |
    | A different interpreter | packed env + `PYSPARK_PYTHON` (cluster only), or an image | server image only | not testable in `local[*]` |
    | Several versions at once | separate applications | separate sessions | Connect isolates per session |

    And a checklist for the day it breaks: which interpreter ran
    (`sys.executable` in a task), which minor version, what its
    `sys.path` was, whether the UDF was defined before the files were
    added, and whether a reused worker already had an old module in
    `sys.modules`. The exercise turns most of these into checks.

