    ## Trap: The Include List Is Captured Once

    The include list is not looked up when a task runs. It is copied
    into the JVM `SimplePythonFunction` when the UDF is first turned into
    a JVM object (`_wrap_function` in `pyspark/sql/udf.py`), and
    `UserDefinedFunction._judf` caches that object. A UDF you used before
    `addPyFile` keeps the old, empty list. You can read it through Py4J:

    ```python
    @F.udf("string")
    def f(x): return "x"
    spark.range(1).select(f("id")).collect()
    print("before:", list(f._unwrapped._judf.func().pythonIncludes()),
          f._unwrapped._judf.func().pythonExec(), f._unwrapped._judf.func().pythonVer())
    spark.sparkContext.addPyFile(os.path.abspath("messytools.zip"))
    print("old udf after:", list(f._unwrapped._judf.func().pythonIncludes()))
    g = F.udf(f.func, "string")
    print("new udf:", list(g._unwrapped._judf.func().pythonIncludes()))
    ```

    ```text
    before: [] <venv>/bin/python 3.12
    old udf after: []
    new udf: ['messytools.zip']
    ```

    What that does to a job is worse than a clean failure. With an old
    UDF `where`, then a new copy `where2`, in one application (two
    reused workers, PIDs shown):

    ```text
    BEFORE
      3175550 ModuleNotFoundError: No module named 'messytools'
      3175551 ModuleNotFoundError: No module named 'messytools'
    AFTER (same udf object)
      3175551 ModuleNotFoundError: No module named 'messytools'
      3175550 ModuleNotFoundError: No module named 'messytools'
    AFTER (new udf object)
      3175551 /tmp/spark-.../userFiles-.../messytools.zip/messytools/__init__.py
      3175550 /tmp/spark-.../userFiles-.../messytools.zip/messytools/__init__.py
    AFTER (old udf again)
      3175551 /tmp/spark-.../userFiles-.../messytools.zip/messytools/__init__.py
      3175550 /tmp/spark-.../userFiles-.../messytools.zip/messytools/__init__.py
    ```

    The old UDF starts working only because the new one ran in the same
    reused workers first and `add_path` left the zip on their path. On a
    cluster, with fresh executors from dynamic allocation or a worker
    that crashed, it fails again. The fix is order: ship first, then
    define the UDFs (or rebuild them). `mapInPandas` and `mapInArrow`
    wrap the function again on every call (a new `pandas_udf` each
    time, in `pyspark/sql/pandas/map_ops.py`), so they pick up the
    current list. Spark Connect has no such trap: the server builds the
    function from the plan for every query, with the session's includes
    (`sessionHolder.artifactManager.getPythonIncludes` in
    `SparkConnectPlanner.scala`).

