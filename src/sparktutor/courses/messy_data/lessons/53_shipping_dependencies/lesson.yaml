    ## Which Python the Executors Run

    In Classic mode the interpreter is fixed when the `SparkContext`
    starts. `pyspark/core/context.py` reads it from the environment:

    ```python
    self.pythonExec = os.environ.get("PYSPARK_PYTHON", "python3")
    self.pythonVer = "%d.%d" % sys.version_info[:2]
    ```

    Both travel inside every Python function sent to the JVM
    (`SimplePythonFunction(..., sc.pythonExec, sc.pythonVer, ...)`), and
    the worker compares the version with its own. Three consequences:

    - **Unset means `python3` from the executor's `PATH`.** That is the
      system Python, not your venv, whenever the venv is not activated
      in the environment the executor inherits.
    - **`spark.pyspark.python` works only through the launcher.** The
      config exists (2.1), but it is turned into `PYSPARK_PYTHON` by
      `spark-submit`'s Python runner
      (`core/src/main/scala/org/apache/spark/deploy/PythonRunner.scala`).
      Set from the builder in a plain `python app.py` run it is ignored:

    ```python
    spark = (SparkSession.builder.master("local[1]")
             .config("spark.pyspark.python", "/home/lnc/.local/bin/python3.11")
             .getOrCreate())
    print("pythonExec:", spark.sparkContext.pythonExec)
    print(spark.range(1).select(F.udf(lambda x: __import__("sys").executable, "string")("id")).first()[0])
    ```

    ```text
    pythonExec: python3
    /usr/bin/python3
    ```

    With `spark-submit --conf spark.pyspark.python=<venv>/bin/python`
    the same script printed `<venv>/bin/python` twice.

    - **The minor version must match.** Pointing workers at Python 3.11
      from a 3.12 driver fails at the first task. The worker raises
      `PYTHON_VERSION_MISMATCH`, and you receive it wrapped in
      `PYTHON_EXCEPTION`:

    ```text
    $ PYSPARK_PYTHON=python3.11 spark-submit app.py
    pyspark.errors.exceptions.base.PySparkRuntimeError: [PYTHON_VERSION_MISMATCH] Python in worker
    has different version: 3.11 than that in driver: 3.12, PySpark cannot run with different minor
    versions.
    Please check environment variables PYSPARK_PYTHON and PYSPARK_DRIVER_PYTHON are correctly set.
    ```

    The check is `check_python_version` in `pyspark/worker_util.py`;
    only `major.minor` is compared, so 3.12.3 and 3.12.9 are fine.

