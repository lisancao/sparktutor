    ## Kubernetes: Put the Environment in the Image

    On Kubernetes the executors are pods started from an image, so the
    sturdiest way to ship dependencies is to bake them in. The official
    `apache/spark:4.2.0-python3` image (we read its config from the
    registry) is built on Ubuntu 22.04 with Java 21 and the distribution's
    `python3` package, runs as the user `spark`, works in
    `/opt/spark/work-dir` and starts through `/opt/entrypoint.sh`, which
    exports `PYSPARK_PYTHON` and `PYSPARK_DRIVER_PYTHON` when you set
    them. A derived image:

    ```dockerfile
    FROM apache/spark:4.2.0-python3
    USER root
    RUN pip install --no-cache-dir "pyarrow>=18.0.0" "pandas>=2.2.0"
    COPY dist/messytools-1.0-py3-none-any.whl /tmp/
    RUN pip install --no-cache-dir /tmp/messytools-1.0-py3-none-any.whl
    COPY app.py /opt/app/app.py
    USER spark
    ```

    ```bash
    spark-submit \
      --master k8s://https://<api-server>:443 \
      --deploy-mode cluster \
      --conf spark.kubernetes.container.image=registry.example.com/messy/spark-py:1.0 \
      --conf spark.kubernetes.namespace=etl \
      --conf spark.kubernetes.authenticate.driver.serviceAccountName=spark \
      local:///opt/app/app.py
    ```

    `local://` means "already in the image". Files on your machine
    passed with `--py-files` or `--archives` in cluster mode are first
    uploaded to `spark.kubernetes.file.upload.path` (an S3 or HDFS
    location you provide). Driver and executors can use different
    images (`spark.kubernetes.driver.container.image`,
    `spark.kubernetes.executor.container.image`). 4.2 also adds a
    default `NetworkPolicy` so executor pods only accept traffic from
    the driver and their peers (`docs/core-migration-guide.md`).

    **Client vs cluster mode** decides where the driver's Python lives.
    In cluster mode the driver is a pod from the same image, so its
    Python matches the executors' by construction. In client mode the
    driver is your notebook or laptop, and its minor version must match
    the image's: check with `docker run --rm <image> python3 --version`
    before you choose a laptop Python, or you meet
    `PYTHON_VERSION_MISMATCH` at the first UDF. Ubuntu 22.04's `python3`
    is 3.10, so a 3.12 laptop and the stock image do not match.

    This lesson does not build the image or run a cluster; the
    configuration names come
    from `resource-managers/kubernetes/core/src/main/scala/org/apache/spark/deploy/k8s/Config.scala`
    and the image facts from its published config.

