    ## Trap: New Versions Do Not Reload

    Shipping a fixed `messytools.zip` under the same path does nothing:
    `addPyFile` of a path that is already registered is ignored (the
    docstring says so), and the tasks kept returning `VERSION 1.0`. A
    new file name looks like the way out, but it is not, because a
    reused worker already holds `messytools` in `sys.modules`:

    ```python
    spark = (SparkSession.builder.master("local[2]")
             .config("spark.python.worker.reuse", sys.argv[1]).getOrCreate())
    def ver():
        f = F.udf(lambda _: f"{__import__('os').getpid()}:{__import__('messytools').VERSION}", "string")
        return sorted(r[0] for r in spark.range(4).repartition(2).select(f("id")).distinct().collect())
    spark.sparkContext.addPyFile(mk("messytools-1.zip", "1.0")); print("after v1:", ver())
    spark.sparkContext.addPyFile(mk("messytools-2.zip", "2.0")); print("after v2:", ver())
    ```

    ```text
    reuse=true
    after v1: ['3493206:1.0', '3493207:1.0']
    after v2: ['3493206:1.0', '3493207:1.0']
    reuse=false
    after v1: ['3494624:1.0', '3494626:1.0']
    after v2: ['3494821:2.0', '3494823:2.0']
    ```

    `spark.python.worker.reuse` defaults to `true`, and turning it off
    costs a process start per task. Treat the code you ship as fixed for
    the life of an application: a new version means a new application,
    or, on Connect, a new session (which gets its own workers, as you
    will see).

