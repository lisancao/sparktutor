    ## Trap: Native Code Cannot Live in a Zip

    Python's `zipimport` loads `.py` files from a zip but not extension
    modules (`.so`, `.pyd`). Anything with compiled code (`numpy`,
    `pyarrow`, `ujson`, most parsers and drivers) cannot travel through
    `--py-files`. To see it, install a pure package and a native one for
    the cluster's platform into a folder. The flags make pip fetch Linux
    wheels even from a Mac:

    ```bash
    pip install --target deps/site-packages \
        --platform manylinux2014_x86_64 --python-version 3.12 \
        --implementation cp --only-binary=:all: ujson tabulate
    grep Tag deps/site-packages/*.dist-info/WHEEL
    ```

    ```text
    deps/site-packages/tabulate-0.10.0.dist-info/WHEEL:Tag: py3-none-any
    deps/site-packages/ujson-6.0.0.dist-info/WHEEL:Tag: cp312-cp312-manylinux_2_17_x86_64
    deps/site-packages/ujson-6.0.0.dist-info/WHEEL:Tag: cp312-cp312-manylinux2014_x86_64
    ```

    Then ship the folder both ways, as `deps.zip` with `addPyFile` and as
    `deps.tar.gz#deps` with `addArchive`, and import both modules in a
    task:

    ```text
    zip    : tabulate: deps.zip/tabulate/__init__.py | ujson: ModuleNotFoundError: No module named 'ujson'
    archive: tabulate: deps/site-packages/tabulate/__init__.py | ujson: deps/site-packages/ujson.cpython-312-x86_64-linux-gnu.so
    ```

    The `.so` is in the zip; Python just cannot load it from there. The
    archive is unpacked to a real folder, so it can. Two details from
    the same experiments: a `.whl` passed to `addPyFile` is copied but
    never imported (`.whl` is not in `PACKAGE_EXTENSIONS`; the import
    failed with `ModuleNotFoundError`), while the same pure-Python wheel
    renamed to `.zip` imported fine, because a wheel is a zip with the
    package at its top level. That trick only works for `py3-none-any`
    wheels.

    The `manylinux` tag is the contract that matters: it promises the
    wheel only needs a glibc at least as new as the tag
    (`manylinux_2_17` means glibc 2.17). Build or download on the
    platform tag of the executors, with the executors' Python minor
    version (`cp312`), not your laptop's.

