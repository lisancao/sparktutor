    ## Exercise: Ship a Package Three Ways and Prove It

    The harness writes a small pure-Python package, `messytools` (with
    `VERSION` and `clean_name()`), to a temporary folder that is not on
    any path. You write:

    1. `build_zip(src_dir, zip_path)`: an importable zip, entries
       relative to `src_dir`, no `__pycache__` or `.pyc`.
    2. `build_site_archive(src_dir, tar_path)`: a `.tar.gz` laid out
       like `pip install --target`, with a single `site-packages/`
       folder at the top.
    3. `where_imported(spark, archive_name=None)`: a UDF that imports
       `messytools` inside a task and returns what it found (cleaned
       name, `VERSION`, `__file__`, PID), working in Classic and
       Connect; for an archive it first adds
       `<SparkFiles.get(archive_name)>/site-packages` to `sys.path`.
    4. `captured_includes(udf)`: the include list the JVM function of a
       Classic UDF captured, read through `_unwrapped._judf.func()`.

    The harness then checks, from inside the tasks: nothing is
    importable before shipping; after `addPyFile` every task imports the
    zip from the files root, a UDF used before `addPyFile` captured
    `[]` and one created after captured `['messytools.zip']`; a new
    session with `spark.archives=deps.tar.gz#deps` imports version 1.1
    from `deps/site-packages` in new worker processes; and two Spark
    Connect sessions import versions 2.0 and 3.0 of the same
    `messytools.zip` at once, from different folders and different
    workers, with `ARTIFACT_ALREADY_EXISTS` when one re-adds a changed
    file.
