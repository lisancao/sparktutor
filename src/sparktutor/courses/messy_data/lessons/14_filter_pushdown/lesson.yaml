- Class: text
  Depth: all
  Output: |
    ## Summary

    - `pushFilters(filters)` (4.1, SPARK-51271) receives the AND-ed parts
      of a query's condition that Spark can express, as `EqualTo`, `In`,
      `StringEndsWith`, comparisons and friends; `attribute` is a tuple
      of names. OR and functions of columns are never pushed.
    - Yield back what you do not apply; Spark only evaluates the filters
      you return, so a filter you keep and ignore gives **wrong results**.
    - Apply metadata filters in `partitions()` so unmatched files are
      never opened; prove it with an audit log and with `explain()` and
      `explain("formatted")` (`PushedFilters`).
    - In 4.2.0 set `spark.sql.python.filterPushdown.enabled=true`;
      otherwise a reader with `pushFilters` fails every query with
      `DATA_SOURCE_PUSHDOWN_DISABLED` at the first action.
    - 4.2.0 traps: a reused DataFrame or view keeps the plan of the last
      pushed query (call `load()` per query); relative paths silently
      find nothing on Spark Connect; a returned filter you built yourself
      triggers a broken error message (SPARK-59909).

    Next: **Writers**, where your data source learns to write: per-task
    files, a commit on the driver, save modes and Arrow writers.
