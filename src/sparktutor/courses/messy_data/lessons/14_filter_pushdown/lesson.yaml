    ## Seeing Pushdown in the Plan

    `df.explain()` shows what Spark still evaluates itself. For
    `kind = 'image' AND width > 12`:

    ```text
    +- *(1) Filter ((isnotnull(kind#106) AND isnotnull(width#108)) AND (width#108 > 12))
       +- BatchScan files[path#104, name#105, kind#106, size#107L, width#108, height#109] (Python) RuntimeFilters: []
    ```

    `kind = 'image'` is gone from the `Filter`: the reader took it over.
    `explain("formatted")` also lists what was pushed:

    ```text
    (1) BatchScan files
    Output [6]: [path#0, name#1, kind#2, size#3L, width#4, height#5]
    PushedFilters: [EqualTo(kind,image)]
    ReadSchema: struct<path:string,name:string,kind:string,size:bigint,width:int,height:int>
    ```

    Note the `ReadSchema`: it is always the full schema. Python data
    sources get no column pruning in 4.2, so `read()` must produce every
    column even when the query selects one.

    Capture the plan in a test with `contextlib.redirect_stdout`, which
    works on Spark Connect too (`df._jdf` only exists in classic
    sessions):

    ```python
    buf = io.StringIO()
    with contextlib.redirect_stdout(buf):
        df.explain()
    filters = [l for l in buf.getvalue().splitlines() if "Filter" in l and "Scan" not in l]
    ```

