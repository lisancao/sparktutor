    ## The Exercise Source: Files by Metadata

    The exercise's `files` source lists `data/messy` and returns one row
    per file: `path`, `name`, `kind` (from the extension), `size`, and the
    `width` and `height` read from a PNG header. The pushdown parts:

    ```python
    def pushFilters(self, filters):
        for f in filters:
            if isinstance(f, EqualTo) and f.attribute == ("kind",):
                self.kinds = {f.value}
            elif isinstance(f, In) and f.attribute == ("kind",):
                self.kinds = set(f.value)
            elif isinstance(f, StringEndsWith) and f.attribute == ("name",):
                self.suffixes.append(f.value)
            elif isinstance(f, (GreaterThan, GreaterThanOrEqual, LessThan,
                                LessThanOrEqual)) and f.attribute == ("size",):
                self.size_tests.append((type(f).__name__, f.value))
            else:
                yield f

    def partitions(self):
        files = [p for p, size in list_files(self.root) if self.matches(p, size)]
        ...
    ```

    `width > 12` is returned: the width is in the file's bytes, so the
    file has to be opened anyway. `IsNotNull(kind)` is returned too;
    harmless, since Spark then checks a condition that is always true.
    (A reader that knows a column is never NULL may take `IsNotNull`
    over as well.)

    To **prove** that files are skipped, `read()` writes every path it
    opens to an audit file in a directory given by the `audit_dir`
    option. With `kind = 'image'`, the audit lists the 5 PNGs and nothing
    else, out of 26 files.

