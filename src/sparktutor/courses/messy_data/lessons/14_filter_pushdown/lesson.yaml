    ## What You'll Learn

    A query like `df.filter(kind == "image")` on your data source makes
    the reader produce **every** row, and then Spark throws most of them
    away. For a folder of files that means opening every file to keep a
    handful; for an API it means downloading every page. **Filter
    pushdown** lets Spark tell your reader what the query wants, so the
    reader can skip the work.

    In "Reading a Custom File Format, in Parallel" your reader listed
    files on the driver and handed them to tasks. This lesson puts the
    query's filters into that listing.

    By the end of this lesson you will be able to:

    - Implement `pushFilters` and know which filters Spark sends
      (`EqualTo`, `In`, `StringEndsWith`, comparisons, ...)
    - Decide which filters to take over and return the rest to Spark
    - Apply pushed filters before opening files, and prove it with an
      audit log and the query plan
    - Turn on the flag that 4.2.0 needs, and recognize
      `DATA_SOURCE_PUSHDOWN_DISABLED`
    - Avoid the 4.2.0 traps: a reused DataFrame that keeps an old filter,
      relative paths on Spark Connect, and a broken error message

