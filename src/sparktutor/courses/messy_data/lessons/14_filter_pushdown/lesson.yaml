    ## The Filters Spark Sends

    Each filter has an `attribute`, the column as a tuple of names
    (`("kind",)`, or `("a", "b")` for a nested field `a.b`), and usually
    a `value` as a plain Python object. What arrived in the exercise's
    `pushFilters` for some conditions (4.2.0):

    | Condition | Filters passed to `pushFilters` |
    |---|---|
    | `kind = 'image' AND width > 12` | `IsNotNull(kind)`, `IsNotNull(width)`, `EqualTo(kind, 'image')`, `GreaterThan(width, 12)` |
    | `kind IN ('a', 'b')` | `In(kind, ['a', 'b'])` |
    | `name LIKE '%.eml'` or `endswith(".eml")` | `IsNotNull(name)`, `StringEndsWith(name, '.eml')` |
    | `name LIKE 'tone%'` | `IsNotNull(name)`, `StringStartsWith(name, 'tone')` |
    | `name LIKE '%one%'` | `IsNotNull(name)`, `StringContains(name, 'one')` |
    | `kind <> 'image'` | `IsNotNull(kind)`, `Not(EqualTo(kind, 'image'))` |
    | `size BETWEEN 10 AND 100` | `IsNotNull(size)`, `GreaterThanOrEqual(size, 10)`, `LessThanOrEqual(size, 100)` |
    | `width IS NULL` | `IsNull(width)` |
    | `lower(kind) = 'image'` | `IsNotNull(kind)` only |
    | `kind = 'audio' OR size < 100` | nothing: `pushFilters` is not called |
    | `kind = 'image' AND (size < 50 OR size > 1000)` | `IsNotNull(kind)`, `EqualTo(kind, 'image')` |

    The full list of classes: `EqualTo`, `EqualNullSafe`, `GreaterThan`,
    `GreaterThanOrEqual`, `LessThan`, `LessThanOrEqual`, `In`, `IsNull`,
    `IsNotNull`, `Not`, `StringStartsWith`, `StringEndsWith` and
    `StringContains`. Notice what never arrives:

    - **OR** across conditions (the `OR` part is simply not pushed; an
      `AND` beside it still is)
    - functions of a column (`lower(kind)`), arithmetic (`size % 2 = 1`),
      comparisons between two columns
    - Spark adds `IsNotNull` for the columns of a comparison, because
      `kind = 'image'` can only be true when `kind` is not NULL

