    ## Trap: Reusing a DataFrame After a Pushed Query (4.2.0)

    Testing this lesson turned up a behaviour that returns **wrong
    results** silently, in both classic and Spark Connect sessions:

    ```python
    df = spark.read.format("files").option("path", root).load()
    df.count()                                  # 26
    df.filter(sf.col("kind") == "image").count()  # 5
    df.count()                                  # 5, not 26
    df.filter("kind = 'audio' OR size < 100").count()  # computed over the 5 images only
    ```

    This is the plan reuse you saw in "Reading from an API"; with
    pushdown it becomes a correctness bug. The cause is in
    `PythonDataSourceV2` (4.2.0): the planned read (the
    reader and its partitions) is kept on the DataFrame's relation and
    reused by later queries. A query with pushable filters replaces it
    with the filtered plan. A later query whose filters cannot be pushed
    (none, or only an `OR`) never calls `pushFilters`, so it reuses the
    **filtered** plan. A temporary view over the source behaves the same
    way, because every query on the view shares the relation. A query
    with new pushable filters gets a fresh plan and is correct.

    Spark's master branch has already fixed this (as part of
    SPARK-58551, which keeps the planned read on each scan instead of
    on the relation), but 4.2.0 and the 4.3 branch still have it. On
    those versions, when pushdown is on:

    - call `load()` again for each query instead of reusing a DataFrame
      or a temporary view
    - or write the source's output to a table once and query the table

    The exercise builds a fresh DataFrame for every query, and prints the
    stale count so you can see it happen.

