    ## The Flag, and the Error When It Is Off

    In 4.2.0 pushdown is switched off by default, behind an internal
    setting (since 4.1):

    ```python
    spark.conf.set("spark.sql.python.filterPushdown.enabled", "true")
    ```

    With the flag off, a reader that **implements** `pushFilters` is not
    quietly read without pushdown. The first action fails (not `load()`,
    which succeeds):

    ```text
    [PYTHON_DATA_SOURCE_ERROR] Failed to initialize Python data source reader: ...
    PySparkAssertionError: [DATA_SOURCE_PUSHDOWN_DISABLED] FilesReader implements
    pushFilters() but filter pushdown is disabled because configuration
    'spark.sql.python.filterPushdown.enabled' is false. Set it to true to
    enable filter pushdown.
    ```

    This happens for **every** query on the source, even one with no
    filter at all. It is a deliberate guard against silently slow reads;
    SPARK-55087 (open) asks Spark to skip `pushFilters` instead. Until
    that changes, a reader you ship should document the flag.

