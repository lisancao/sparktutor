    ## How Pushdown Works

    Filter pushdown for Python data sources arrived in Spark 4.1
    (SPARK-51271). When a query has filters, Spark's optimizer:

    1. Splits the `WHERE` condition into parts joined by `AND`.
    2. Converts each part it can express into a filter object from
       `pyspark.sql.datasource` (parts it cannot express are kept back).
    3. Calls your reader's `pushFilters(filters)` once, during planning,
       before `partitions()`.
    4. Keeps evaluating, in its own `Filter` node, every filter that
       `pushFilters` **returns** (yields). The ones you do not return are
       your job from now on.

    ```python
    from pyspark.sql.datasource import EqualTo

    class FilesReader(DataSourceReader):
        def pushFilters(self, filters):
            for f in filters:
                if isinstance(f, EqualTo) and f.attribute == ("kind",):
                    self.kinds = {f.value}     # handled here, Spark stops checking it
                else:
                    yield f                    # Spark keeps checking this one
    ```

    `pushFilters` may change `self`: the reader object, with whatever you
    saved, is what `partitions()` and `read()` run on afterwards. It must
    stay picklable.

- Class: text
