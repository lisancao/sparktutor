    ## Two More 4.2.0 Surprises

    **Relative paths on Spark Connect.** In a classic session the Python
    workers run in the directory you started from, so `data/messy` works.
    On Spark Connect they run in a per-session directory of the server
    (something like `/tmp/spark-.../userFiles-.../<session id>`), so a
    relative path finds nothing, and a reader that lists a folder returns
    **zero rows without an error**. Pass absolute paths to Python data
    sources (`os.path.abspath(path)` on the client), as the exercise
    harness does. Spark's own readers (`spark.read.json(...)`) are not
    affected; they resolve paths in the server's JVM.

    **The extraneous filter error is broken.** If `pushFilters` yields a
    filter that is not one of its inputs (for example a new `EqualTo` it
    built), PySpark tries to raise `DATA_SOURCE_EXTRANEOUS_FILTERS`, but
    the call passes message parameters the template does not have. What
    you get is `PYTHON_DATA_SOURCE_ERROR` wrapping
    `AssertionError: Undefined error message parameter for error class:
    DATA_SOURCE_EXTRANEOUS_FILTERS`. That is SPARK-59909 (affects 4.0 to
    4.2, fixed in 4.3.0). If you see it, you returned a filter you did
    not receive.

