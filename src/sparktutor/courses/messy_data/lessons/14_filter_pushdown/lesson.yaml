    ## Exercise: Skip Files You Do Not Need

    The `files` source lists `data/messy`, and `read()` already writes the
    audit log and parses PNG headers. Complete:

    1. `FilesReader.pushFilters(filters)`: take over `EqualTo` and `In`
       on `kind`, `StringEndsWith` on `name`, and the four comparisons on
       `size`; yield everything else unchanged.
    2. `FilesReader.matches(path, size)`: apply what you took over.
       `partitions()` already calls it for every listed file.

    The harness checks the `DATA_SOURCE_PUSHDOWN_DISABLED` error with the
    flag off, then, with it on, for `kind = 'image'`, `kind IN (...)`,
    a name suffix and `size > 4000`: the right rows, an audit log that
    lists only the matching files, and a plan in which Spark no longer
    evaluates the pushed condition. It also checks that `width > 12`
    stays in Spark's `Filter` and that an `OR` still gives the right
    answer.
