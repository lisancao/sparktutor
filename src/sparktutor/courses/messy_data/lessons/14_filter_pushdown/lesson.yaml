  Depth: advanced
  Output: |
    ## Designing Pushdown for Real Sources

    - **Databases and APIs.** Translate filters into the backend's query
      language (`WHERE kind = ?`, `?status=open`), with parameters, never
      by pasting values into strings. Return what the backend cannot do.
    - **Types of values.** `value` is a Python object of the column's
      type: `int`, `float`, `str`, `bool`, `datetime.datetime` (for
      timestamps), lists for arrays. Compare it with values of the same
      type.
    - **Combining filters.** Several pushed filters on one column are
      AND-ed: `kind IN ('a','b') AND kind = 'a'` must keep only `a`
      (intersect the sets, as the exercise does).
    - **`Not`.** `Not(EqualTo(...))` arrives for `<>`. Handle it only if
      you handle what is inside; mind NULLs (`kind <> 'image'` is not
      true for a NULL kind).
    - **Planning cost.** With the flag on, `pushFilters` runs in a Python
      worker during planning, and the same worker then plans the
      partitions, so it costs one worker call, not two.
    - **Streaming.** `pushFilters` belongs to the batch
      `DataSourceReader`; streaming readers do not receive filters in
      4.2.

