    ## The Contract: Take Over Only What You Apply

    When you do not return a filter, **Spark stops checking it**. If your
    reader then ignores it, the query returns wrong results, with no
    error. A reader whose `pushFilters` returns nothing and filters
    nothing answers `kind = 'image'` with all 26 files of the sample
    folder.

    So take over a filter only when you can apply it **exactly**:

    - **Pushed into planning.** `kind` comes from the file extension and
      `size` from `os.stat`, so `partitions()` can decide both without
      opening a file. The files that fail never reach a task.
    - **Applied in `read()`.** For a filter on a value you only know
      after parsing (the PNG `width`), you could check it in `read()`
      and drop rows, but that saves no I/O. Usually it is simpler to
      return it and let Spark do it.
    - **Not at all.** Return it. Spark evaluates it after your rows
      arrive. This is always correct.

    A filter can also be pushed **and** returned: if an API only filters
    by day but your filter is by hour, ask the API for the day and return
    the filter, so Spark trims the rest.

    One more rule from the docstring: every filter you return must be one
    of the objects you were given, **by reference**. Do not build new
    ones.

