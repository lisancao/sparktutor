  Output: |
    Think of a librarian fetching books for you. Without pushdown you say
    "bring me everything", and you sort through the pile at your desk.
    With pushdown you say "I want images and anything over 4 KB"; the
    librarian checks the catalog and only walks to the shelves that
    match.

    The librarian can refuse part of the request ("I can't tell how wide
    a picture is without opening it"). Then you still check that part
    yourself. That is what returning a filter from `pushFilters` means.

