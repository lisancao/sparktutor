    ## Listing Files

    `data/messy` started with eight sample folders (`audio`, `docs`,
    `events`, `images`, `logs`, `mail`, `pdf`, `xml`); later lessons
    added others. This lesson, like its harness, reads a copy of just
    the original eight in a scratch folder:

    ```python
    import os, shutil, tempfile
    from pathlib import Path

    SAMPLE_FOLDERS = ["audio", "docs", "events", "images", "logs", "mail", "pdf", "xml"]
    sample = tempfile.mkdtemp(prefix="docs_input_")
    for folder in SAMPLE_FOLDERS:
        shutil.copytree(os.path.join("data/messy", folder), os.path.join(sample, folder))

    def list_files(root, pattern):
        return sorted((str(p.resolve()), p.stat().st_size)
                      for p in Path(root).glob(pattern) if p.is_file())

    files = list_files(sample, "**/*")
    print(len(files), files[0][0].endswith("audio/silence.wav"), files[0][1])
    ```

    ```
    26 True 8044
    ```

    - `Path.glob("**/*")` walks subfolders; a `glob` option lets users
      narrow it (`"**/*.png"`).
    - `resolve()` makes every listed path absolute, so the tasks do not
      depend on their own current directory (see the gotcha above).
    - `sorted(...)` makes the listing, and therefore the partitions,
      the same on every run. Deterministic plans make bugs reproducible
      and tests possible.
    - The size comes from `stat()`, which reads file-system metadata and
      not the file.

    Kinds come from the extension, which costs nothing:

    ```python
    import os

    KINDS = {".png": "image", ".wav": "audio", ".pdf": "pdf", ".eml": "email", ".md": "text",
             ".txt": "text", ".log": "log", ".json": "json", ".xml": "xml"}

    def kind_of(path):
        return KINDS.get(os.path.splitext(path)[1].lower(), "other")

    print(kind_of("a/b/Photo.PNG"), kind_of("notes"))
    ```

    ```
    image other
    ```

    "Files as Files: binaryFile, Globs and Metadata" showed that extensions can lie (a `.png` that is not a
    PNG). Here the extension decides the *kind*, which says which parser
    to try, and the parser checks the magic bytes before trusting
    anything. Deciding kinds without opening files is what lets "Filter Pushdown"
    skip whole groups of files.

