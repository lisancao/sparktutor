    ## Timestamps From Python

    `os.stat` gives the modification time as seconds since the epoch.
    `datetime.fromtimestamp(t, tz=datetime.timezone.utc)` turns it into a
    timezone-aware `datetime`, which Spark stores as the right instant
    for a `timestamp` column. A *naive* `datetime` (one without
    `tzinfo`) is read as local time of the Python worker. That is why
    `datetime.utcfromtimestamp(t)`, which returns a naive value meaning
    UTC, comes out shifted by the worker's offset (seven hours on a
    machine set to Pacific time in October). Workers on a cluster may
    have any time zone, so return aware datetimes from data sources,
    UDFs and UDTFs alike.

