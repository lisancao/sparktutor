    ## When Files Change Under You

    The plan is made at the first action, and later actions on the
    same DataFrame reuse it. Between planning and
    reading, files can disappear or grow. `docs` reports the size that
    `os.stat` sees in the task, so a grown file shows its new size; a
    deleted file makes `os.stat` raise `FileNotFoundError` inside
    `read()`, which fails the task with `PYTHON_EXCEPTION`. Whether that
    should fail the job or produce a row with an error column is a design
    choice: for a catalog of a busy upload folder, skipping vanished files
    (and counting them) is usually friendlier. "Streaming Readers and Writers" deals with files
    that keep arriving.

