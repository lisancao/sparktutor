    ## Parsing Headers, Not Whole Files

    The custom part of this format is reading facts out of the files'
    own bytes. Both formats here put what we need at the very start:

    - **PNG**: 8 signature bytes, then the `IHDR` chunk, whose data
      starts with the width and height as 4-byte big-endian integers.
      24 bytes are enough.
    - **WAV**: the `fmt ` and `data` chunk headers hold the sample rate
      and the number of frames. `wave.open(path)` reads the header and
      stops; it does not load the samples until you ask for them.

    ```python
    import struct, wave

    def png_size(head):
        if head[:8] == b"\x89PNG\r\n\x1a\n" and head[12:16] == b"IHDR" and len(head) >= 24:
            return struct.unpack(">II", head[16:24])
        return None, None

    def wav_seconds(path):
        try:
            with wave.open(path) as w:
                return w.getnframes() / w.getframerate()
        except (wave.Error, EOFError, ZeroDivisionError):
            return None

    with open("data/messy/images/products/red_16x8.png", "rb") as f:
        print(png_size(f.read(24)))
    with open("data/messy/images/scans/corrupt.png", "rb") as f:
        print(png_size(f.read(24)))
    print(wav_seconds("data/messy/audio/silence.wav"), wav_seconds("data/messy/mail/ticket_0.eml"))
    ```

    ```
    (16, 8)
    (None, None)
    0.5 None
    ```

    Both parsers are forgiving: a file that is not what its name says
    gives `None`, not an exception. As in "Documents to Rows", one bad file must not
    fail the read of a whole folder. Use `with open(...)` so the file is
    closed in the task that opened it.

