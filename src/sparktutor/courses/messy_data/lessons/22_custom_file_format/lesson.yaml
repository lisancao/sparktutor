    ## The Reader

    Planning and reading put together, with options checked up front:

    ```python
    from pyspark.sql.datasource import DataSource, DataSourceReader

    SCHEMA = ("path string, name string, kind string, size long, modified timestamp, "
              "width int, height int, seconds double")

    class DocsDataSource(DataSource):
        @classmethod
        def name(cls):
            return "docs"

        def schema(self):
            return SCHEMA

        def reader(self, schema):
            return DocsReader(self.options, schema)

    class DocsReader(DataSourceReader):
        def __init__(self, options, schema):
            if "path" not in options:
                raise ValueError("option 'path' is required: the folder to read")
            self.root = os.path.abspath(options["path"])
            if not os.path.isdir(self.root):
                raise ValueError(f"option 'path' must be an existing folder, got {options['path']!r}")
            self.pattern = options.get("glob", "**/*")
            self.max_partitions = int(options.get("partitions", "2"))
            self.columns = [f.name for f in schema.fields]

        def partitions(self):
            files = list_files(self.root, self.pattern)
            return [FilesPartition(g) for g in plan_files(files, self.max_partitions)]

        def read(self, partition):
            if not isinstance(partition, FilesPartition):
                return
            wanted = set(self.columns)
            for path in partition.files:
                row = describe(path, wanted)
                yield tuple(row[c] for c in self.columns)

    spark.dataSource.register(DocsDataSource)

    # `sample` is the scratch copy of the eight sample folders from "Listing Files"
    docs = spark.read.format("docs").option("path", sample).option("partitions", 3).load()
    (docs.groupBy("kind")
         .agg(F.count("*").alias("files"), F.sum("size").alias("bytes"))
         .orderBy("kind").show())
    ```

    ```
    +-----+-----+-----+
    | kind|files|bytes|
    +-----+-----+-----+
    |audio|    3|16132|
    |email|    4| 1007|
    |image|    5| 2066|
    | json|    3| 8907|
    |  log|    2|31285|
    |  pdf|    2| 1481|
    | text|    6| 1228|
    |  xml|    1| 1669|
    +-----+-----+-----+
    ```

    Things to notice:

    - The `isinstance` check in `read()` handles the empty folder: no
      files means no partitions, and Spark then calls `read()` once with
      `InputPartition(None)` ("Your First Python Data Source").
    - Every option problem raises `ValueError` in `__init__`, so the user
      sees `PYTHON_DATA_SOURCE_ERROR` with your message at the first
      action, before any task runs.
    - The helpers (`list_files`, `plan_files`, `describe`) are module
      functions. They are pickled along with the reader because your
      script is `__main__`, and you can test each one alone.

