    ## The Intermediate Level

    Basics gave you every built-in way to read messy data, a first look
    at Python data sources, and the core of Spark: plans, partitions,
    streaming, Delta and MLlib. The intermediate level is about building
    tools you would run every day: Python data sources for files, APIs
    and databases that read only what they need, write atomically and
    stream incrementally; UDTFs; tuning Python on Spark; quality-checked
    ingestion; similarity search, entity resolution and model inference
    in production. It ends with a capstone that builds an ingestion
    source and a catalog pipeline.

    It assumes the basics level, especially "Your First Python Data
    Source", "Plans, Partitions and Caching" and "Streaming Files: Your
    First Structured Streaming Job".

    ## What You'll Learn

    In "Your First Python Data Source" the counter source made up its data. Real sources read
    something that already exists. This lesson builds `docs`, a data
    source that reads a folder of mixed files (logs, JSON, e-mails, PDFs,
    PNGs, WAVs) and returns one row per file, with metadata from the file
    system and a few fields parsed from each file's own header bytes:
    the size of a PNG, the duration of a WAV.

    `docs` comes back in the capstone ("Capstone: An Unstructured
    Ingestion Source and a Catalog Pipeline"), which adds a parser per
    kind of file. The lessons in between each build a small source of
    their own for one idea ("Filter Pushdown", "Writers", "Streaming
    Readers and Writers", "Packaging, Registration, Testing and
    Debugging"). So this lesson pays attention to the shape of the code
    as well as to what it returns.

    By the end of this lesson you will be able to:

    - List files on the driver and turn them into partitions that carry
      only paths
    - Balance partitions by bytes rather than by file count
    - Parse binary headers inside `read()` without loading whole files
    - Resolve paths and validate options while planning, with clear
      errors
    - Honour a user-supplied schema and skip work it does not need, and
      know that `select()` alone does not prune columns for a Python
      source
    - Handle the empty folder, invalid files and timestamps correctly
    - Test listing, planning and parsing as plain Python

