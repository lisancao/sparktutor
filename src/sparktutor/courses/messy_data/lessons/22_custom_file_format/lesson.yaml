    ## Balancing Partitions by Bytes

    The eight sample folders hold 26 files, but they are far from equal:
    `access.log` is 21,213 bytes, about a third of the total, while
    `readme.txt` is 13 bytes. Dealing files out in turn (round robin)
    gives each task the same *number* of files and very different
    amounts of work. A stage finishes when its slowest task finishes, so
    that wastes the other cores.

    A simple, good rule: take the files largest first and give each one
    to the group with the smallest total so far.

    ```python
    def plan_files(files, n):
        groups = [[] for _ in range(max(n, 1))]
        totals = [0] * len(groups)
        for path, size in sorted(files, key=lambda f: (-f[1], f[0])):
            i = totals.index(min(totals))
            groups[i].append(path)
            totals[i] += size
        return [g for g in groups if g]

    print(plan_files([("a", 5), ("b", 4), ("c", 3), ("d", 3)], 2))

    groups = plan_files(files, 3)
    sizes = dict(files)
    print([(len(g), sum(sizes[p] for p in g)) for g in groups])
    ```

    ```
    [['a', 'd'], ['b', 'c']]
    [(3, 21266), (12, 21261), (11, 21248)]
    ```

    Three tasks with almost the same number of bytes: one gets the big
    log and two tiny files, the others share the many small files. The
    greedy rule guarantees that no group exceeds another by more than the
    largest single file, which is the best you can do without splitting
    files.

    How many partitions? A few per core is a good start. One partition
    per file sounds natural but backfires with thousands of small files:
    each task has a fixed start-up cost, and every partition is part of
    the plan. Cap the number of partitions with an option, and never plan
    more partitions than files (`plan_files` drops empty groups).

