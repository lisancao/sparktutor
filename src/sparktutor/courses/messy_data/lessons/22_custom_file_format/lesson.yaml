    ## Testing It Without Spark

    The same habit as "Your First Python Data Source", now with real files: create the reader
    with a `CaseInsensitiveDict` and a `StructType`, and call it the way
    Spark would.

    ```python
    import pickle
    from pyspark.sql.datasource import CaseInsensitiveDict
    from pyspark.sql.types import (DoubleType, IntegerType, LongType, StringType,
                                   StructField, StructType, TimestampType)

    SCHEMA_STRUCT = StructType([
        StructField("path", StringType()), StructField("name", StringType()),
        StructField("kind", StringType()), StructField("size", LongType()),
        StructField("modified", TimestampType()), StructField("width", IntegerType()),
        StructField("height", IntegerType()), StructField("seconds", DoubleType()),
    ])

    reader = DocsReader(CaseInsensitiveDict({"path": "data/messy/audio"}), SCHEMA_STRUCT)
    parts = reader.partitions()
    print([[os.path.basename(f) for f in p.files] for p in parts])
    print(sorted((r[1], r[7]) for p in parts for r in reader.read(p)))
    pickle.dumps(parts)
    ```

    ```
    [['silence.wav'], ['tone_440.wav', 'tone_880_quiet.wav']]
    [('silence.wav', 0.5), ('tone_440.wav', 0.25), ('tone_880_quiet.wav', 0.25)]
    ```

    Planning put the 8 KB recording alone and the two 4 KB tones
    together, which you can check by eye. Unit tests like this catch
    most bugs in a fraction of a second; keep one end-to-end read through
    Spark to catch type problems.

