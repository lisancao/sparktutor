    ## Summary

    In this lesson you learned:

    - **Planning lists, tasks read**: `partitions()` lists files once and
      returns partitions holding only paths; `read()` opens files in
      parallel
    - **Absolute, sorted listings** made while planning, on storage that
      every executor can reach
    - **Balance by bytes**: largest file first into the lightest group;
      cap the partition count and never plan empty partitions
    - **Header parsing** with `struct` and `wave` reads only the first
      bytes of each file, and returns `None` for files that do not parse
    - **Do only what the schema asks**: build rows from the schema's
      columns and skip opening files when no byte-derived column is
      requested
    - **No column pruning** for Python sources in 4.2.0: `select()` does
      not shrink the schema your reader gets; `.schema(...)` does
    - **Aware UTC datetimes** for timestamp columns, the empty-folder
      case, and `ValueError`s with clear messages for every option
    - **Plain Python tests** for listing, planning, parsing and pickling

    The intermediate capstone brings this source back, with pushdown on
    `kind` and a stream reader; the lessons before it teach each piece
    on a smaller source of their own.

    Next: **Reading from an API**, where you write a Python data source
    that pages through a REST API in parallel and returns loose payloads
    as VARIANT.