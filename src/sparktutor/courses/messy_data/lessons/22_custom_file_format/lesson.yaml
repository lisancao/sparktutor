    ## Exercise: The docs Source

    Build the `docs` source. `kind_of`, `list_files`, `png_size`,
    `wav_seconds`, `describe` and `FilesPartition` are written for you;
    you write the planning and the data source. The harness tests your
    code as plain Python first, before any Spark session exists.

    1. `plan_files(files, n)`: assign `(path, size)` pairs, largest
       first (ties by path), each to the group with the smallest total so
       far (ties to the lowest group number); drop empty groups.
    2. `DocsDataSource`: `name()` returns `"docs"`, `schema()` returns
       `SCHEMA`, `reader(schema)` returns a `DocsReader`.
    3. `DocsReader.__init__`: require `path` and make it absolute; fail
       if it is not a folder; read `glob` (default `"**/*"`) and
       `partitions` (default `"2"`, a whole number of at least 1); keep
       the schema's column names and reject unknown ones. Every failure
       is a `ValueError` whose message names the option.
    4. `partitions()`: list the files and return one `FilesPartition`
       per group from `plan_files`.
    5. `read(partition)`: yield nothing unless it is a `FilesPartition`;
       otherwise one tuple per file from `describe`, in the schema's
       column order.

    The harness checks the planner, the header parsers and a plain
    Python read of the audio folder, then through Spark: one row per
    file, 3 balanced partitions, kinds, PNG sizes and WAV durations,
    absolute paths, a user schema, the `glob` option, an empty folder,
    and the error messages for bad options.
