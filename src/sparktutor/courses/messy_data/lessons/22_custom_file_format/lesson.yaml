    Picture a library cart. Listing the folder is writing the titles on
    index cards. Planning partitions is dealing the cards to several
    helpers so that each gets about the same number of pages to carry,
    not the same number of books. Each helper then fetches only their
    books and fills in a form for each one. The cards (paths) are light;
    the books (file contents) never go back to the front desk.

