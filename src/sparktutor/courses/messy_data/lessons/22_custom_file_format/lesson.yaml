    ## Why a Data Source and Not binaryFile Plus a UDF?

    "Files as Files: binaryFile, Globs and Metadata", "Documents to Rows" and "Images and Audio" read folders with `binaryFile` and parsed the
    bytes with built-in functions and UDFs. That works, and for many jobs it is the right
    choice. A data source becomes worth it when you want to control the
    reading itself:

    - **Choose what to open.** `binaryFile` gives you either no content
      or the whole content of every file: to learn a PNG's width you
      load the entire file into a row. `docs` answers "how many PDFs,
      how big?" from the file system alone, and reads only the first 24
      bytes of a PNG when it needs the size.
    - **Plan the work.** You decide which files go to which task, so one
      huge log does not land in the same task as half the folder.
    - **One name for everyone.** `spark.read.format("docs")` and SQL
      `USING docs` hide the parsing from the people who use the data.
    - **Room to grow.** Filters, streaming and writing (later lessons)
      plug into the same classes.

