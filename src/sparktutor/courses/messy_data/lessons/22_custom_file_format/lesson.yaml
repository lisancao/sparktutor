    ## Two Sides of a File Source

    The split between planning and reading from "Your First Python Data Source" is the key to
    the whole design:

    | Planning (`reader.__init__`, `partitions()`) | Reading (`read(partition)`) |
    |----------------------------------------------|-----------------------------|
    | runs at a DataFrame's first action (later actions reuse the plan), in a Python worker on the driver side | runs once per partition, in parallel, in executor Python workers |
    | validates options, resolves the folder, lists files | opens files and parses them |
    | returns small `InputPartition`s: lists of paths | yields one row per file |

    Only the partitions travel from planning to the tasks, inside the
    query plan. Put **paths** in them, never file contents: a partition
    holding a whole file would be serialized into the plan and copied
    around before any task even starts.

    ```python
    from pyspark.sql.datasource import InputPartition

    class FilesPartition(InputPartition):
        def __init__(self, files):
            self.files = files
    ```

    One assumption hides here: the tasks must be able to open the paths
    the planner listed. In local mode they share your disk, so that is
    automatic. On a cluster the folder must be on storage that every
    executor can reach (a shared file system or an object store). For
    object stores, `pyarrow.fs` (installed with PySpark) can list and
    open S3 and Google Cloud Storage paths with the same planning and
    reading split.

    **Gotcha: relative paths depend on where planning runs.** A
    relative `path` option is resolved by the Python worker that plans
    the query, not by your script. Under `spark-submit` in local mode the
    workers start in your directory, so `"data/messy"` works. On Spark
    Connect, even with a local server, the workers run in a per-session
    folder under the server's temporary directory, so the same option
    fails with your "must be an existing folder" error. Make paths
    absolute in the client before passing them:

    ```python
    import os

    folder = os.path.abspath("data/messy")
    ```

    The built-in file sources do not have this problem because the
    server resolves their paths in the JVM. In your own source, treat
    every path option as "absolute, please" and say so in its
    documentation.

