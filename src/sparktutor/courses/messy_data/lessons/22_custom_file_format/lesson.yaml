    ## Do Only the Work the Schema Asks For

    Opening files is the expensive part, so `read()` opens a file only
    when a column that needs its bytes was asked for:

    ```python
    import datetime

    HEADER_COLUMNS = {"width", "height", "seconds"}

    def describe(path, wanted):
        st = os.stat(path)
        row = {"path": path, "name": os.path.basename(path), "kind": kind_of(path),
               "size": st.st_size,
               "modified": datetime.datetime.fromtimestamp(st.st_mtime, tz=datetime.timezone.utc),
               "width": None, "height": None, "seconds": None}
        if wanted & HEADER_COLUMNS:
            if row["kind"] == "image":
                with open(path, "rb") as f:
                    row["width"], row["height"] = png_size(f.read(24))
            elif row["kind"] == "audio":
                row["seconds"] = wav_seconds(path)
        return row

    print(describe(os.path.abspath("data/messy/pdf/invoice_1002.pdf"), {"kind", "size"})["size"])
    ```

    ```
    603
    ```

    `read()` builds each row from the schema's column names, exactly as
    the counter source did, so a user schema such as
    `"path string, kind string, size long"` never touches file contents.

    **Gotcha: `select()` does not prune columns for a Python source.**
    With built-in file sources, `df.select("path")` makes Spark read only
    that column. A Python data source in 4.2.0 always receives the full
    schema in `reader(schema)`, even when the query selects one column;
    the plan shows every column in the `BatchScan`. The only way for a
    user to ask your source for less is `.schema(...)` on the reader.
    That is a good reason to document which columns are cheap.

