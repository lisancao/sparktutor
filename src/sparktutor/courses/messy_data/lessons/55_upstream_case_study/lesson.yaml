    ## Read the Fix on Master

    Master fixed this inside SPARK-58551 ("Python Data Sources Limit
    Pushdown API", commit `b51665875a3`, fix version 4.4.0), because
    limit pushdown hit the same leak: `df.limit(2)` made `df` read two
    rows. The relevant part of the diff, condensed (comments
    shortened, limit pushdown left out):

    ```scala
    // PythonScanBuilder: the read info planned during pushdown stays on this scan
    private var readInfo: Option[PythonDataSourceReadInfo] = None
    ...
    readInfo = result.readInfo            // was: ds.setReadInfo(result.readInfo)
    ...
    new PythonScan(ds, shortName, outputSchema, options, supportedFilters, pushedLimit, readInfo)

    // PythonScan / PythonBatch: use the scan's own read info if it has one
    private lazy val infoInPython: PythonDataSourceReadInfo = {
      readInfo.getOrElse(
        ds.getOrCreateReadInfo(shortName, options, outputSchema, isStreaming = false))
    }

    // PythonDataSourceV2: setReadInfo is gone; the cache keeps only pushdown-free reads
    ```

    Why it works: state now lives exactly as long as the plan it
    describes. A read planned for one scan's filters is reachable only
    from that scan. The provider still caches a read, but only the
    one planned **without** pushdown, which is the same for every scan
    that pushes nothing, so sharing it is safe. (Master also records
    which pushdown flags were on when that cache was filled and
    recomputes when they change, so the `DATA_SOURCE_PUSHDOWN_DISABLED`
    check still runs after a flag flip.)

    Notice what the fix did not do: remove the cache, or plan every
    read twice. "Make it slower until it is right" fixes bugs too, but
    reviewers rightly push back on it when a scoping fix exists.

