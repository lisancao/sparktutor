    ## A Narrow Fix for the Maintenance Branches

    SPARK-58551 adds a public API (`DataSourceReader.pushLimit`) and a
    new config, and Spark's versioning policy says maintenance
    releases "contain bug fixes and security patches only; they do not
    introduce new features". So it will not be backported, and
    branch-4.2 and branch-4.3 need their own small patch: only the
    scoping part, against the 4.2.0 code.

    ```diff
    --- a/.../v2/python/PythonDataSourceV2.scala
    +++ b/.../v2/python/PythonDataSourceV2.scala
    +  // Caches the read info of scans that push nothing down. Every such scan plans the same
    +  // read, so it is safe to share across the scans of this provider. Read info planned during
    +  // filter pushdown is specific to one scan and is carried by that PythonScan instead.
       private var readInfo: PythonDataSourceReadInfo = _
    ...
    -  def setReadInfo(readInfo: PythonDataSourceReadInfo): Unit = {
    -    this.readInfo = readInfo
    -  }
    -
    --- a/.../v2/python/PythonScanBuilder.scala
    +++ b/.../v2/python/PythonScanBuilder.scala
       private var supportedFilters: Array[Filter] = Array.empty
    +  // Read info planned by filter pushdown. It belongs to this scan only: the provider `ds` is
    +  // shared by every scan of the relation, so storing it there would leak the pushed filters
    +  // into other scans.
    +  private var readInfo: Option[PythonDataSourceReadInfo] = None

       override def build(): Scan =
    -    new PythonScan(ds, shortName, outputSchema, options, supportedFilters)
    +    new PythonScan(ds, shortName, outputSchema, options, supportedFilters, readInfo)
    ...
    -        ds.setReadInfo(result.readInfo)
    +        readInfo = Some(result.readInfo)
    --- a/.../v2/python/PythonScan.scala
    +++ b/.../v2/python/PythonScan.scala
    -    supportedFilters: Array[Filter]
    +    supportedFilters: Array[Filter],
    +    readInfo: Option[PythonDataSourceReadInfo] = None
     ) extends Scan with SupportsMetadata {
    -  override def toBatch: Batch = new PythonBatch(ds, shortName, outputSchema, options)
    +  override def toBatch: Batch = new PythonBatch(ds, shortName, outputSchema, options, readInfo)
    ...
    -    options: CaseInsensitiveStringMap) extends Batch {
    +    options: CaseInsensitiveStringMap,
    +    readInfo: Option[PythonDataSourceReadInfo] = None) extends Batch {
    ...
       private lazy val infoInPython: PythonDataSourceReadInfo = {
    -    ds.getOrCreateReadInfo(shortName, options, outputSchema, isStreaming = false)
    +    readInfo.getOrElse(
    +      ds.getOrCreateReadInfo(shortName, options, outputSchema, isStreaming = false))
       }
    ```

    That is the whole patch. The streaming path (`PythonMicroBatchStream`) only calls
    `getOrCreateReadInfo` and never pushes filters, so it is untouched.

