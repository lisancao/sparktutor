    ## Experiment 1: Count Planned Reads

    `partitions()` runs exactly once per planned read, in a planning
    worker on the driver, whether the read was planned by the pushdown
    worker or by `plan_data_source_read.py`. A marker file per call
    turns that into a number the driver can read:

    ```python
    def partitions(self):
        if self.audit:
            import uuid
            with open(os.path.join(self.audit, f"plan-{uuid.uuid4().hex}"), "w") as f:
                f.write(repr(self.k))
        return [InputPartition(0)]
    ```

    The planning worker is a separate Python process, so a counter on
    `self` or a global would be lost with it; the file system is the
    simplest channel back. For `count`, `filter count`, `count` the
    planned reads were `[1, 1, 0]`: prediction 1 holds.

