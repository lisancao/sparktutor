    ## The Method in One Page

    Every correctness bug in a large system is investigated with the
    same loop. The steps are cheap at the start and expensive at the
    end, so do them in order:

    ```text
    notice      a number that should not change, changes
    minimize    the smallest program that still shows it
    boundary    where it happens and where it does not
    hypothesis  a precise claim about the code, with predictions
    experiment  evidence that confirms or kills each prediction
    test        an automated check that fails today
    fix         the smallest change that makes the test pass
    triage      duplicates, versions, priority, target branches
    report      a JIRA a committer can act on without asking you
    ```

    Skipping ahead is the classic mistake. A fix written before the
    boundary is known tends to cover the case you saw and miss the one
    you did not; you will see exactly that happen below, in master's
    own regression test.

