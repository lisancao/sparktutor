    ## Read the Source: Who Owns the State?

    The fastest way into unfamiliar code is to ask, for each object:
    how many of these exist, and how long does each live? Paths are
    under `sql/core/src/main/scala/org/apache/spark/sql/` in the 4.2.0
    source tree.

    | Object | How many | Created in |
    |---|---|---|
    | `PythonDataSourceV2` (the provider) | one per `load()` | `DataSource.lookupDataSourceV2`, `execution/datasources/DataSource.scala` line 763, called from `catalyst/analysis/ResolveDataSource.scala` |
    | `PythonTable` | one per provider | `PythonDataSourceV2.getTable` |
    | `DataSourceV2Relation` | one per `load()`, shared by every query built on that DataFrame | the analyzer |
    | `PythonScanBuilder` | one per scan, per planning | `PythonTable.newScanBuilder`, called by `V2ScanRelationPushDown` |
    | `PythonScan`, `PythonBatch` | one per scan | `PythonScanBuilder.build`, `PythonScan.toBatch` |

    The provider outlives every query; scans live for one plan. Now the
    state, in `execution/datasources/v2/python/PythonDataSourceV2.scala`:

    ```scala
    private var readInfo: PythonDataSourceReadInfo = _      // line 55

    def getOrCreateReadInfo(shortName: String, options: CaseInsensitiveStringMap,
        outputSchema: StructType, isStreaming: Boolean): PythonDataSourceReadInfo = {
      if (readInfo == null) {
        val creationResult = getOrCreateDataSourceInPython(shortName, options, Some(outputSchema))
        readInfo = source.createReadInfoInPython(creationResult, outputSchema, isStreaming)
      }
      readInfo
    }

    def setReadInfo(readInfo: PythonDataSourceReadInfo): Unit = {   // line 70
      this.readInfo = readInfo
    }
    ```

    `PythonDataSourceReadInfo` (in `UserDefinedPythonDataSource.scala`)
    is a pickled read function plus the pickled partitions. Who writes
    it? `PythonScanBuilder.pushFilters`, line 50:

    ```scala
    ds.source.pushdownFiltersInPython(dataSource, outputSchema, filters) match {
      case None => filters // No filters are supported.
      case Some(result) =>
        // Filter pushdown also returns partitions and the read function.
        // This helps reduce the number of Python worker calls.
        ds.setReadInfo(result.readInfo)
    ```

    And who reads it? `PythonBatch` in `PythonScan.scala`, line 87,
    lazily, during physical planning:

    ```scala
    private lazy val infoInPython: PythonDataSourceReadInfo = {
      ds.getOrCreateReadInfo(shortName, options, outputSchema, isStreaming = false)
    }
    ```

    The Python side explains why the read info is filter-specific. The
    pushdown worker, `python/pyspark/sql/worker/data_source_pushdown_filters.py`,
    calls your `pushFilters` on a fresh reader and then, "in the same
    worker as filter pushdown", calls `write_read_func_and_partitions`
    (from `plan_data_source_read.py`) on **that** reader. The pickled
    read function closes over the reader, with `self.k = 'a'` inside.

