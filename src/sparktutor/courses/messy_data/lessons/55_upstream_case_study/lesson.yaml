    ## Form the Hypothesis

    Put it as a claim precise enough to be wrong:

    > Filter pushdown plans a read with a reader that has seen the
    > pushed filters, and stores it on the provider, which every scan of
    > the relation shares. A scan that pushes nothing calls
    > `getOrCreateReadInfo`, finds that read, and uses it. Spark has
    > dropped no filter from that scan's plan, so nothing corrects the
    > rows.

    A good hypothesis makes predictions you have not checked yet:

    1. A query after a pushed query plans **no** read (it reuses one).
    2. The provider's `readInfo` holds a reader whose `k` is `'a'`
       after `filter("k = 'a'")`, and `None` before.
    3. In one query, the scan whose `pushFilters` runs last decides
       what every scan of that relation reads (hence 14, and the
       dropped filter in the self-join).
    4. Two `load()` calls have two providers and cannot interfere.
    5. Keeping the pushed read on the scan instead of the provider
       makes every case right.

    Prediction 4 is already confirmed by the boundary table. The rest
    need evidence.

