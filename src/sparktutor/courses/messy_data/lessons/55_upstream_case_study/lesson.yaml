    ## Experiment 2: Open the Provider

    In classic mode the JVM objects are one Py4J call away. The fields
    are private Scala vars, so read them with Java reflection:

    ```python
    import inspect
    from pyspark import cloudpickle

    def private(obj, field):
        f = obj.getClass().getDeclaredField(field)
        f.setAccessible(True)
        return f.get(obj)

    rel = df._jdf.queryExecution().analyzed()       # DataSourceV2Relation
    table = rel.table()                             # PythonTable
    print([f.getName() for f in table.getClass().getDeclaredFields()])
    ds = private(table, "ds")                       # PythonDataSourceV2
    print([f.getName() for f in ds.getClass().getDeclaredFields()])
    ```

    ```text
    ['ds', 'shortName', 'outputSchema']
    ['source', 'name', 'dataSourceInPython', 'readInfo', 'bitmap$0']
    ```

    Then fingerprint the cached read after each query:

    ```python
    import hashlib

    def read_info():
        info = private(ds, "readInfo")
        if info is None:
            return None
        func = bytes(info.func())
        return (info.getClass().getSimpleName(), hashlib.sha256(func).hexdigest()[:12],
                len(func), info.partitions().size())

    print("after load():", read_info())
    print("count", df.count(), read_info())
    print("filter count", df.filter("k = 'a'").count(), read_info())
    print("count", df.count(), read_info())
    other = spark.read.format("kv").load()
    ods = private(other._jdf.queryExecution().analyzed().table(), "ds")
    child = df.filter("k = 'a'")._jdf.queryExecution().analyzed().child()
    print("same provider object for a second load()?", ods.equals(ds),
          "| same for a filtered child?", private(child.table(), "ds").equals(ds))
    ```

    ```text
    after load(): None
    count 10 ('PythonDataSourceReadInfo', '18981234c728', 6068, 1)
    filter count 3 ('PythonDataSourceReadInfo', '0cc9ad7eb106', 6071, 1)
    count 3 ('PythonDataSourceReadInfo', '0cc9ad7eb106', 6071, 1)
    same provider object for a second load()? False | same for a filtered child? True
    ```

    The pushed query replaced the cached function (three bytes longer:
    the pickled `'a'`), and the next count used it. To see the reader
    itself, unpickle the function. `write_read_func_and_partitions`
    pickles the pair `(data_source_read_func, schema)`, and the reader
    is one of the function's free variables:

    ```python
    func, schema = cloudpickle.loads(bytes(private(ds, "readInfo").func()))
    print(sorted(inspect.getclosurevars(func).nonlocals))
    print(vars(inspect.getclosurevars(func).nonlocals["reader"]))
    ```

    ```text
    ['converter', 'data_source', 'max_arrow_batch_size', 'reader', 'return_type']
    {'k': 'a'}
    ```

    Prediction 2 holds, and the evidence is the actual object, not an
    inference from counts. This only works in classic mode (`_jdf` does
    not exist on Connect) and on private fields, so keep it to
    investigation and tests, never production code.

