    ## Testing the Fix Without Building Spark

    A full build takes a long time, and you can get strong evidence
    much sooner. The pip package ships the Scala compiler
    (`pyspark/jars/scala-compiler-2.13.18.jar` for 4.2.0, next to
    `scala-library` and `scala-reflect` of the same version), and the
    three changed classes only depend on classes in those jars. So
    compile the patched files against the release you have:

    ```bash
    J=$(python -c "import pyspark, os; print(os.path.dirname(pyspark.__file__))")/jars
    mkdir classes
    java -cp "$J/*" scala.tools.nsc.Main -usejavacp -nowarn -d classes \
      PythonDataSourceV2.scala PythonScanBuilder.scala PythonScan.scala
    ```

    It took about 3.5 seconds and produced the classes of
    `org/apache/spark/sql/execution/datasources/v2/python/` that those
    files define. Then put them in front of Spark's own jars:

    ```python
    spark = (SparkSession.builder.master("local[2]")
             .config("spark.driver.extraClassPath", "/path/to/classes")
             .config("spark.sql.python.filterPushdown.enabled", "true")
             .getOrCreate())
    ```

    In local mode the executors run in the driver JVM, so the driver
    classpath is enough. With the patched classes, the boundary script
    gave the right answer in every row of both tables, the PySpark
    tests above passed, and the same was true over Spark Connect
    (`.remote("local[2]")` with the same setting, plan cache on),
    including the self-join through a temporary view:

    ```text
    df.count() again (expect 10)                                 10     planning calls: 0
    df.filter(k = 'a' OR v > 8).count() (expect 4)               4      planning calls: 0
    fresh: union(filter a) count (expect 13)                     13     planning calls: 2
    fresh: filter a union filter b (expect 10)                   10     planning calls: 2
    ```

    Look at the planned reads: the third count still plans nothing.
    The unfiltered read is cached on the provider, as intended; only
    the filtered one moved.

    Know the limits of this trick before you rely on it. It works when
    every class that calls a changed signature is patched too. A new
    constructor parameter, even one with a default value, changes the
    constructor's signature in bytecode (Scala keeps the default in a
    separate method), so any class compiled against the old constructor
    would fail at run time with `NoSuchMethodError`. Here the only
    callers, `new PythonScan(` in `PythonScanBuilder` and
    `new PythonBatch(` in `PythonScan`, are in the patched files. It is
    evidence for you and a strong line in the
    JIRA; the PR still needs the real test suites.

