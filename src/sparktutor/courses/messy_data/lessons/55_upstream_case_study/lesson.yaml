    ## Write the Failing Test

    A regression test has one job: fail today, for the reason in the
    report, and pass once the bug is fixed. In PySpark's own suite the
    data source tests live in
    `python/pyspark/sql/tests/test_python_datasource.py`, in a mixin
    (`BasePythonDataSourceTestsMixin`) that runs once on
    `ReusedSQLTestCase` (classic) and once more through
    `python/pyspark/sql/tests/connect/test_parity_python_datasource.py`
    on `ReusedConnectTestCase`. A test added to the mixin covers both
    paths you found in the boundary. In that style:

    ```python
    import unittest

    from pyspark.sql.datasource import DataSource, DataSourceReader, EqualTo, InputPartition
    from pyspark.testing.sqlutils import ReusedSQLTestCase


    class FilterPushdownLeakTests(ReusedSQLTestCase):
        def _register(self):
            class LeakReader(DataSourceReader):
                def __init__(self):
                    self.k = None

                def pushFilters(self, filters):
                    for f in filters:
                        if isinstance(f, EqualTo) and f.attribute == ("k",):
                            self.k = f.value
                        else:
                            yield f

                def partitions(self):
                    return [InputPartition(0)]

                def read(self, partition):
                    for i in range(10):
                        k = "a" if i < 3 else "b"
                        if self.k is None or k == self.k:
                            yield (k, i)

            class LeakSource(DataSource):
                @classmethod
                def name(cls):
                    return "leak_kv"

                def schema(self):
                    return "k string, v int"

                def reader(self, schema):
                    return LeakReader()

            self.spark.dataSource.register(LeakSource)

        def test_filter_pushdown_does_not_leak_into_reused_scan(self):
            with self.sql_conf({"spark.sql.python.filterPushdown.enabled": True}):
                self._register()
                df = self.spark.read.format("leak_kv").load()
                self.assertEqual(df.filter("k = 'a'").count(), 3)
                self.assertEqual(df.count(), 10)

        def test_filter_pushdown_does_not_leak_within_one_query(self):
            with self.sql_conf({"spark.sql.python.filterPushdown.enabled": True}):
                self._register()
                df = self.spark.read.format("leak_kv").load()
                self.assertEqual(df.union(df.filter("k = 'a'")).count(), 13)


    if __name__ == "__main__":
        unittest.main(verbosity=2)
    ```

    `pyspark.testing` ships in the pip package, so this runs against
    stock 4.2.0 with plain `python test_leak.py` (output trimmed):

    ```text
    FAIL: test_filter_pushdown_does_not_leak_into_reused_scan
        self.assertEqual(df.count(), 10)
    AssertionError: 3 != 10

    FAIL: test_filter_pushdown_does_not_leak_within_one_query
        self.assertEqual(df.union(df.filter("k = 'a'")).count(), 13)
    AssertionError: 6 != 13

    Ran 4 tests in 12.134s
    FAILED (failures=2)
    ```

    (The extra two tests are both `test_assert_classic_mode`: one
    inherited by `FilterPushdownLeakTests`, and one from the imported
    `ReusedSQLTestCase` itself, which `unittest.main` also collects
    because it is a test case class in the module's namespace.) They are **failures**, not errors: the code
    ran and gave the wrong answer. A test that errors on the broken
    build (an import error, a typo) "fails" too, but proves nothing
    about the bug.

    Master's fix added this Scala test to
    `sql/core/src/test/scala/org/apache/spark/sql/execution/python/PythonDataSourceSuite.scala`
    (from `git -C <spark> show b51665875a3`):

    ```scala
    test("filter pushdown does not leak into a reused base scan") {
      assume(shouldTestPandasUDFs)
      // Same as above for filter pushdown: the read function bound to the pushed filters must not
      // leak into the base scan, which would make the base DataFrame return only filtered rows.
      val dataSourceScript =
        s"""
           |from pyspark.sql.datasource import DataSource, DataSourceReader, InputPartition
           |
           |class SimpleDataSourceReader(DataSourceReader):
           |    def pushFilters(self, filters):
           |        self._filtered = True
           |        return []
           |
           |    def partitions(self):
           |        return [InputPartition(0)]
           |
           |    def read(self, partition):
           |        if getattr(self, "_filtered", False):
           |            yield (1,)
           |        else:
           |            for i in range(10):
           |                yield (i,)
           |
           |class SimpleDataSource(DataSource):
           |    def schema(self):
           |        return "id int"
           |
           |    def reader(self, schema):
           |        return SimpleDataSourceReader()
           |""".stripMargin
      val schema = StructType.fromDDL("id INT")
      val dataSource =
        createUserDefinedPythonDataSource(name = dataSourceName, pythonScript = dataSourceScript)
      withSQLConf(SQLConf.PYTHON_FILTER_PUSHDOWN_ENABLED.key -> "true") {
        spark.dataSource.registerPython(dataSourceName, dataSource)
        val df = spark.read.format(dataSourceName).schema(schema).load()
        checkAnswer(df.filter("id = 1"), Seq(Row(1)))
        checkAnswer(df, (0 until 10).map(Row(_)))
      }
    }
    ```

    It covers the sequential case only. The fix also makes the union
    and the self-join right (you will check that below), but no test
    pins it. A backport is a good moment to add the in-query cases, so
    a later refactor cannot bring them back alone.

