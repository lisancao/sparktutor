    ## Where the Bug Came From

    Knowing when a bug was introduced tells committers how far back a
    fix must go. The history (in a clone of `apache/spark`):

    - **SPARK-51271** added the filter pushdown API for Python data
      sources (4.1.0). In that first version, `pushFilters` already
      replaced state on the provider: the pickled data source after
      pushdown, through `setDataSourceInPython`.
    - **SPARK-51575**, "Combine pushdown and partition planning
      workers" (commit `46bd9ccecef`, in the `v4.1.0` tag), made the
      pushdown worker plan the read too, to save one Python worker
      round trip, and introduced `ds.setReadInfo(result.readInfo)`.
      Its test plan was "Existing tests in `test_python_datasource.py`".
      Even in 4.2.0, every pushdown test in that file queries a
      DataFrame built as `load().filter(...)`; none queries the
      unfiltered DataFrame afterwards, so none could see the leak.
    - 4.0 is not affected: `PythonScanBuilder` in `v4.0.0` has no
      `pushFilters` at all.
    - The same `setReadInfo` line is in the `v4.1.0-rc1`, `v4.2.0-rc6`,
      `v4.2.1-rc3` and `v4.3.0-rc2` tags.

    ```bash
    git log --oneline --all --grep=SPARK-51575
    git show 46bd9ccecef -- sql/core/src/main/scala/org/apache/spark/sql/execution/datasources/v2/python/PythonScanBuilder.scala
    git tag --contains 46bd9ccecef | grep -E '^v4\.1\.0$'
    git show v4.3.0-rc2:sql/core/src/main/scala/org/apache/spark/sql/execution/datasources/v2/python/PythonScanBuilder.scala | grep -n setReadInfo
    ```

    ```text
    46bd9ccecef [SPARK-51575][PYTHON] Combine Python Data Source pushdown & plan read workers
    ...
    v4.1.0
    50:        ds.setReadInfo(result.readInfo)
    ```

    One gotcha: `git log -S setReadInfo` (the "pickaxe", which finds
    commits that add or remove a string) pointed at an unrelated commit
    in the clone used here, because it is a shallow clone and the
    oldest commit it has looks like it added every file. Search by JIRA
    key or deepen the clone before trusting `-S` or `git blame`.

    There is a review lesson in this history. `getOrCreateReadInfo`
    takes the options, the schema and `isStreaming` as arguments, but
    its cache ignores all of them: after the first call, it returns
    whatever was stored, by anyone. A method whose result depends on
    its call history rather than its arguments is worth a question in
    every review.

