    ## Notice: A Count That Changes

    The bug surfaced while testing "Filter Pushdown". The `files`
    source lists `data/messy`, and pushes `kind = 'image'` into the
    file listing:

    ```python
    df = spark.read.format("files").option("path", root).load()
    df.count()                                    # 26
    df.filter(sf.col("kind") == "image").count()  # 5
    df.count()                                    # 5, not 26
    ```

    Nothing failed. No error, no warning, and `df.explain()` for the
    last query shows a plain scan with no filter. The only signal was
    a number that had no reason to change.

    That is what makes correctness bugs expensive: they are found by
    someone who compares numbers, usually much later. Two habits catch
    them early. Check invariants you know (a count without a filter
    does not depend on what ran before it), and when a number surprises
    you, stop and write it down before you "fix" your own code around
    it.

