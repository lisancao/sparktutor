    ## Summary

    - The method: notice, minimize, find the boundary, state a
      hypothesis with predictions, confirm with your own evidence, write
      a test that fails for the right reason, fix narrowly, triage,
      report.
    - The bug: in 4.2.0 (and the identical code of 4.1.0 and the 4.3.0
      release candidates), `PythonScanBuilder.pushFilters`
      stores the read planned for one scan's filters on the shared
      `PythonDataSourceV2` (`setReadInfo`, from SPARK-51575), and
      `PythonBatch` of every other scan reads it through
      `getOrCreateReadInfo`. Results are wrong across queries on one
      DataFrame or view, and within a single self-union or self-join,
      where a pushed filter can even vanish.
    - Connect reproduces it through the server's cache of resolved
      `Read.DataSource` plans (`alwaysCacheDataSourceReadsEnabled`,
      4.1); the cache is fine, the shared state is not.
    - Evidence: zero planned reads on the wrong queries, and the
      reader with `k = 'a'` unpickled from the provider's `readInfo`
      through Py4J reflection.
    - Master fixed it inside SPARK-58551 by keeping pushdown read info
      on `PythonScan`; that change adds an API, so the maintenance
      branches need the three-file scoping patch, which you can compile
      with the Scala compiler in `pyspark/jars` and test against 4.2.0.
    - Workarounds: one `load()` per reference, or a checkpointed
      snapshot; turning the flag off does not work for a reader with
      `pushFilters`.

    Next: **Final Project: Your Own Connector**, where you build a
    connector for a new messy format that is safe from this bug by
    design.
