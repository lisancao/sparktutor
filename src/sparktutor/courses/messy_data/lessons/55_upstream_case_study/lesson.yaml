    ## Triage: Duplicates, Versions, Priority

    **Duplicates.** Search before you write. JIRA's REST API makes the
    search repeatable:

    ```bash
    curl -s -G "https://issues.apache.org/jira/rest/api/2/search" \
      --data-urlencode 'jql=project = SPARK AND text ~ "python data source" AND text ~ "pushdown" ORDER BY created DESC' \
      --data-urlencode "fields=summary,status" --data-urlencode "maxResults=15"
    ```

    On 2026-10-28 that returned SPARK-58551 (the limit pushdown work),
    SPARK-55087 (the `DATA_SOURCE_PUSHDOWN_DISABLED` default, open),
    SPARK-59909 (the broken error message from "Filter Pushdown"),
    SPARK-51575, SPARK-51271, SPARK-51883 (docs) and unrelated issues;
    searches for `setReadInfo`, and for `labels = correctness` on
    Python data sources, returned nothing. SPARK-58551 fixes the bug on
    master but does not describe it as a bug of released versions, so
    it is related, not a duplicate. Link it.

    **Affects versions.** Only list what you have shown: 4.2.0
    (reproduced on the pip package). 4.1.0 and the 4.3.0 release
    candidates have the identical `setReadInfo` code (the tags above);
    either reproduce there too or say "code identical" rather than
    "reproduced".

    **Priority.** Spark's contributing guide says priority should be
    Major or below for most reports, with one exception: "correctness or
    data-loss issues, which can be flagged as Blockers", and
    "Correctness and data loss issues should be considered Blockers for
    their target versions." Add the `correctness` label either way. The
    counter-argument is that pushdown sits behind an internal setting
    that is off by default. The self-join result (wrong on the first
    query of a fresh DataFrame) is the strongest fact for the higher
    priority; put it in the description and let committers decide.

    **Target branches.** Master is fixed. The maintenance branches
    (branch-4.2, inside its maintenance window, and branch-4.3, whose
    release candidates carry the bug) need the narrow patch. The policy
    page leaves "critical bug fixes (e.g., correctness issues) that may
    introduce behavior changes" to case-by-case evaluation; this fix
    changes no API and only makes wrong results right, which is the
    easy case. The usual flow is one PR against the oldest branch that
    should get it, or against branch-4.3 with backports requested.

