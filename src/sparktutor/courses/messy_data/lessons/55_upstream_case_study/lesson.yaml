    ## Workarounds Until a Fix Ships

    For users of the 4.1 and 4.2 releases (and the 4.3 release
    candidates) with pushdown on:

    - **One `load()` per reference**, not per query: a self-join needs
      two loads, not one DataFrame used twice. A temporary view is one
      relation for every reference to it, so a self-join through a view
      is affected too (it returned 10 instead of 3 on a fresh view).
    - **Materialize once** when the same data is queried many times:
      `localCheckpoint()` (or a table) of a fresh load. Later queries
      scan Spark's copy, never the source, so pushdown no longer saves
      I/O; take the snapshot before any filtered query on that load.
    - **Turning the flag off is not a workaround** for a reader that
      implements `pushFilters`: every query then fails with
      `DATA_SOURCE_PUSHDOWN_DISABLED` ("Filter Pushdown"). A connector
      can avoid this by offering a reader class without `pushFilters`
      as its default; you will build exactly that in the final project.
    - `cache()` does not help: it stores whatever the first action
      read.

    In the exercise you wrap the first two in a small class.

