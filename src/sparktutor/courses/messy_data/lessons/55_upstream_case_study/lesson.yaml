    ## Minimize the Repro

    A repro is minimal when every line is needed to show the bug. For a
    data source bug that means:

    - **No files, no network.** Rows come from `range()`. Anyone can run
      it, on any machine, and nothing outside the program can change.
    - **One partition, deterministic rows.** Ten rows, three with
      `k = 'a'`; the right answers are obvious.
    - **The least API.** One pushed filter type (`EqualTo`), no options.
    - **Expected values in the output**, so a reader sees the bug
      without running it.

    ```python
    from pyspark.sql import SparkSession
    from pyspark.sql.datasource import DataSource, DataSourceReader, EqualTo

    class Src(DataSource):
        @classmethod
        def name(cls): return "kv"
        def schema(self): return "k string, v int"
        def reader(self, schema): return R()

    class R(DataSourceReader):
        def __init__(self): self.k = None
        def pushFilters(self, filters):
            for f in filters:
                if isinstance(f, EqualTo) and f.attribute == ("k",): self.k = f.value
                else: yield f
        def read(self, partition):
            for i in range(10):
                k = "a" if i < 3 else "b"
                if self.k is None or k == self.k: yield (k, i)

    spark = (SparkSession.builder.master("local[2]")
             .config("spark.sql.python.filterPushdown.enabled", "true").getOrCreate())
    spark.dataSource.register(Src)
    df = spark.read.format("kv").load()
    print("count before any filter:", df.count())
    print("filter k='a':", df.filter("k = 'a'").count())
    print("count after filtered query (expect 10):", df.count())
    ```

    On the pip `pyspark==4.2.0` package:

    ```text
    count before any filter: 10
    filter k='a': 3
    count after filtered query (expect 10): 3
    ```

    Notice what is not in it: the reader does not implement
    `partitions()` (the default plans one partition) and does not
    read the schema. Each removed line is one less thing a reviewer
    has to rule out.

