    ## Classic and Connect: Same Bug, Different Path

    The same script with `.remote("local[2]")` gives the same wrong
    numbers. That is less obvious than it looks. On Spark Connect the
    client does not hold a JVM DataFrame; every action sends a protobuf
    plan and the server analyzes it again, so each `df.count()` could
    have built a fresh relation.

    It does not, because of a server-side cache. `SessionHolder`
    (`sql/connect/server/src/main/scala/org/apache/spark/sql/connect/service/SessionHolder.scala`,
    `usePlanCache`, around line 602) keeps resolved logical plans keyed
    by the protobuf `Relation`, which includes its plan id. Since 4.1
    it **always** caches the translation of a `Read.DataSource` node,
    under the internal setting
    `spark.connect.session.planCache.alwaysCacheDataSourceReadsEnabled`
    (default `true`, declared in `Connect.scala`). Reusing a client
    DataFrame reuses its plan id, so the server hands back the same
    `DataSourceV2Relation`, with the same provider inside.

    Turning the cache off is a clean experiment, because it changes
    nothing but the sharing:

    ```python
    spark.conf.set("spark.connect.session.planCache.alwaysCacheDataSourceReadsEnabled", "false")
    df = spark.read.format("kv").load()
    print(df.count(), df.filter("k = 'a'").count(), df.count())
    ```

    ```text
    default: 10 3 3
    cache of data source reads off: 10 3 10
    ```

    With `spark.connect.session.planCache.enabled` set to `false`
    instead, every DataFrame case in the boundary tables came out right
    on Connect, including the self-union and the self-join: without the
    cache, the server translates each reference to the DataFrame into
    its own relation. A self-join through a temporary view stayed wrong
    (10 instead of 3), because a view stores one analyzed plan, with
    one relation, for all its references. In classic mode there is no
    such switch, because `df` *is* the plan object.

    So the defect is not "Connect caches plans" (that cache is correct
    and valuable). The defect is state that is unsafe to share, living
    on an object that both modes share for good reasons. Do not ship
    the cache setting as a workaround: it is internal, it costs a full
    analysis per reference, and it does nothing for classic users.

