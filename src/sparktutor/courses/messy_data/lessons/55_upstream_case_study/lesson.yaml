    ## Find the Boundary

    Now vary one thing at a time and record what happens. The table
    below comes from one script on stock 4.2.0, classic mode, with an
    audit folder that counts **planned reads** (each call of the
    reader's `partitions()`, which runs once per planned read; how that
    counter works comes later). Correct results are in parentheses.

    | Query, in order, on one `df` | Result | Planned reads |
    |---|---|---|
    | `df.count()` | 10 | 1 |
    | `df.filter("k = 'a'").count()` | 3 | 1 |
    | `df.count()` | **3** (10) | 0 |
    | `df.filter("v > 5").count()` | 4 | 1 |
    | `df.filter("k = 'b'").count()` | 7 | 1 |
    | `df.count()` | **7** (10) | 0 |
    | `df.filter("k = 'a' OR v > 8").count()` | **1** (4) | 0 |

    And on fresh DataFrames, each line its own `load()`:

    | Query | Result | Planned reads |
    |---|---|---|
    | `f.union(f.filter("k = 'a'"))` | **6** (13) | 1 |
    | `g.filter("k = 'a'").union(g.filter("k = 'b'"))` | **14** (10) | 2 |
    | `h1.union(h2.filter("k = 'a'"))`, two loads | 13 | 2 |
    | self-join on `v`, then `x.k = 'a'` | **10** (3) | 2 |
    | `c.filter("k = 'a'")` first, then `c.cache().count()` | **3** (10) | 1 |

    What the boundary says:

    - **Zero planned reads is the tell.** Every wrong sequential answer
      comes from a query that planned nothing and reused something.
    - **A query whose filters reach `pushFilters` heals the DataFrame.**
      `v > 5` arrives as `IsNotNull(v)` and `GreaterThan(v, 5)`; the
      reader declines both, but the call still plans a new, unfiltered
      read, and the next count is right again. An `OR` never reaches
      `pushFilters` (lesson "Filter Pushdown"), so it does not heal.
    - **It is not only about reuse across queries.** A single query
      that mentions the same DataFrame twice is wrong on its very first
      run. In `a UNION b` the last pushed filter wins for both sides
      (7 + 7 = 14).
    - **It can drop a filter, not only add one.** In the self-join,
      Spark infers `IsNotNull(v)` for the right side (from the join
      condition), that side's pushdown runs last, and the left side
      reads every row although its `k = 'a'` was taken over by the
      reader. The plan even says so:

    ```text
    (1) BatchScan kv
    Output [2]: [k#42, v#43]
    PushedFilters: [EqualTo(k,a)]
    ReadSchema: struct<k:string,v:int>
    (2) Filter
    Input [2]: [k#42, v#43]
    Condition : (isnotnull(k#42) AND isnotnull(v#43))
    ```

    - **Two `load()` calls never interfere**, and `cache()` freezes
      whatever the first action computed, right or wrong.

    The self-join result changes the severity: "do not reuse a
    DataFrame" is a habit users can learn; "a self-join is wrong the
    first time" is not.

