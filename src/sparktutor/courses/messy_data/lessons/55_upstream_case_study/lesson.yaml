    ## What You'll Learn

    In "Filter Pushdown" (intermediate level) you met a trap: on Spark
    4.2.0, with pushdown on, a DataFrame that has run a filtered query
    keeps returning the filtered rows. That lesson gave you a
    workaround (load afresh per query and per reference) and moved
    on. This lesson does the opposite: it stays with the bug until it is understood, tested,
    fixed and written up, the way a Spark contributor works.

    It assumes "How Catalyst Plans Python" (where `PythonScanBuilder`,
    `PythonScan` and the planning workers were introduced) and "The
    Python Worker Protocol" (how a planning worker talks to the JVM).

    By the end of this lesson you will be able to:

    - Turn a symptom into a ten-line repro that anyone can run, and
      map where the bug starts and stops (classic and Connect, views,
      joins, caching)
    - Read `PythonDataSourceV2`, `PythonScanBuilder` and `PythonScan`
      in the 4.2.0 source and say which object owns which state
    - Confirm a hypothesis with evidence you produce yourself: a count
      of planned reads, and the reader object pulled out of the JVM's
      cache through Py4J
    - Write a regression test that fails on 4.2.0 for the right reason,
      in PySpark's `unittest` style and in Scala
    - Read master's fix, write the narrow version for the maintenance
      branches, and test it against the 4.2.0 jars without building
      Spark, using the Scala compiler that ships in `pyspark/jars`
    - Search JIRA for duplicates, choose priority and versions, and
      write the report

    One thing up front: at the time of writing, this bug has no JIRA
    issue. It is open on 4.2.0 and on the 4.3 branch. Writing that
    issue well is part of the work.

