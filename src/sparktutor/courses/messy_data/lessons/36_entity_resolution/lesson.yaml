    ## Summary

    - **Standardize** sources into one schema with a globally unique
      `id`, keep the raw values, and put normalized **matching keys** in
      new columns: sorted tokens without accents and with nicknames
      mapped, Gmail-aware e-mails, digit-only phones; empty means NULL.
    - **Exact duplicates** are a first pass (`dropDuplicates` keeps an
      undefined row; rank with `row_number` to choose); most real
      duplicates need fuzzy matching.
    - **String similarity**: `levenshtein` (threshold argument since
      3.5, returns -1 above it), `soundex` (returns non-ASCII-initial
      strings unchanged: strip accents first), Jaro-Winkler as a Python
      UDF (no built-in), Jaccard with `array_intersect`/`array_union`.
    - **Block** with several passes and measure blocking recall; it caps
      everything after it. The biggest blocks are the cost.
    - **Score** with evidence where a missing value is neutral, and pick
      the threshold from **precision and recall** on labelled pairs.
    - **Cluster** with label propagation; rounds grow with the chain
      length; **`localCheckpoint()`** each round or the plan doubles.
      Transitivity amplifies false matches: check clusters too.
    - **Golden records** come from explicit survivorship rules:
      `max_by` with a NULL ordering for "latest known value",
      `mode(..., deterministic=True)`, sorted `collect_set`, and a vote
      before recency for names.

    Next: **Model Inference in Production**, where a model (or a remote
    service) runs over every row, and reruns, retries and failures have
    to cost nothing extra.
