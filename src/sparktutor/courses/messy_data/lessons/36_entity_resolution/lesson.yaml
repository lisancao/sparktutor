- Class: text
  Depth: all
  Output: |
    ## What You'll Learn

    "Columns and Expressions: Cleaning Values" taught you to trim,
    lower-case, strip accents and standardize values, and "Feature
    Vectors and Similarity Search" found the files most like each other,
    with an exact search that compares every pair and the warning that
    it does not scale. This lesson applies both to the oldest messy-data
    problem there is: **the same customer recorded several times**, in
    several systems, never quite the same way.

    *Deduplication* removes copies inside one table. *Entity resolution*
    (also called record linkage) decides which records, from any number
    of sources, describe the same real-world thing, and builds one
    trustworthy record for it. The pipeline has five steps, and you will
    build each one in Spark:

    1. **Standardize**: one schema, then normalized matching keys.
    2. **Block**: propose candidate pairs cheaply instead of comparing
       every pair.
    3. **Score**: compare each candidate pair field by field.
    4. **Cluster**: turn matched pairs into groups (entities) with
       connected components.
    5. **Survive**: build a golden record per entity with explicit
       rules.

    By the end of this lesson you will be able to:

    - Remove exact duplicates and keep the latest row per key with
      `dropDuplicates` and `row_number`
    - Build matching keys for names (accents, case, word order,
      nicknames), e-mails (Gmail dots and plus tags) and phones
    - Use `levenshtein` (with its 3.5 threshold argument), `soundex`, a
      Jaro-Winkler Python UDF and array set functions, and know where
      each one fails
    - Block with several passes, and measure what blocking costs in
      missed pairs
    - Choose a match threshold from labelled pairs with precision and
      recall, and see how clustering changes both
    - Cluster matches with iterative label propagation, and keep the
      lineage short with `localCheckpoint()`
    - Write survivorship rules with `max_by`, `mode` and `collect_set`
      that never let a NULL or a typo win

