    ## The Data: Three Systems, One Set of Customers

    `data/messy/entities/` holds the same customers as three systems
    recorded them:

    - `crm.csv`: `crm_id, first_name, last_name, email, phone, city,
      updated_at`. A few customers were entered twice.
    - `shop.csv`: `customer_no, name, email, phone, city, last_order`.
      The name is one field, sometimes written `Last, First`.
    - `support.jsonl`: `contact_id, name, email, phone, seen` (a
      timestamp). The support desk never asks for a city.
    - `truth.csv`: `source, record_id, entity_id`, the answer key. Real
      projects rarely have one for every record; here it lets you
      measure every step. Never use it to *decide* a match.

    Every record is a noisy copy of a true person: nicknames, typos,
    missing accents, any case, Vietnamese names in both orders, Gmail
    addresses with and without dots, phones in five formats, missing
    values, and people who moved city. The hard cases are planted on
    purpose: different people with the same full name (two Robert
    Smiths, two Mei Chens, two José Garcías), and family members who
    share a surname, a phone number and a city.

    ```python
    from pyspark.sql import functions as F

    records = load_records(spark)          # you write it in the exercise
    records.groupBy("source").count().orderBy("source").show()
    ```

    ```text
    +-------+-----+
    | source|count|
    +-------+-----+
    |    crm|   55|
    |   shop|   44|
    |support|   40|
    +-------+-----+
    ```

    139 records describe 62 people. 105 pairs of records belong
    together; that is the number every later step is measured against.

