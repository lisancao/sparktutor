    ## Step 5: From Pairs to Entities

    Matches are pairs, but you want groups. If A matches B and B matches
    C, all three are one person even when A and C were never compared
    (or scored too low). In graph terms, records are nodes, matches are
    edges, and each entity is a **connected component**.

    **Label propagation** finds components with joins: every record
    starts with its own id as its label; in each round it takes the
    smallest label among itself and its neighbours; when a round changes
    nothing, every component carries the smallest id in it.

    ```python
    def connected_components(ids, edges, max_iterations=20):
        both = (edges.select(F.col("l").alias("src"), F.col("r").alias("dst"))
                .unionByName(edges.select(F.col("r").alias("src"), F.col("l").alias("dst"))))
        labels = ids.select("id", F.col("id").alias("label")).localCheckpoint()
        for rounds in range(1, max_iterations + 1):
            incoming = (both.join(labels.withColumnRenamed("id", "src"), "src")
                        .groupBy(F.col("dst").alias("id")).agg(F.min("label").alias("offer")))
            updated = (labels.join(incoming, "id", "left")
                       .select("id", F.least("label", F.coalesce("offer", "label")).alias("label"))
                       .localCheckpoint())
            changed = (updated.join(labels.withColumnRenamed("label", "old"), "id")
                       .filter(F.col("label") != F.col("old")).count())
            labels = updated
            if changed == 0:
                return labels, rounds
        raise RuntimeError("did not converge")
    ```

    On the 106 matched pairs it takes **4 rounds** (three that change
    labels and one that confirms nothing changes) and finds 61
    entities. The number of rounds grows with the longest chain of
    matches in a component (its *diameter*): a chain of 1000 records
    linked one after another needs about 1000 rounds. Customer data
    rarely forms long chains, which is why this simple loop is fine
    here; the advanced lesson "Distributed Connected Components" builds
    the large-star/small-star algorithm, which needs far fewer rounds on
    bad graphs, and tests it against union-find. GraphFrames, a separate
    package, also ships a connected components implementation.

