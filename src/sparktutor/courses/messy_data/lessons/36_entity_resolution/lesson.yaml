    ## Step 2: Matching Keys

    A matching key is a value two records of the same person are
    *likely to share*, whatever the source did to it. You met the tools
    in "Columns and Expressions: Cleaning Values"; here they are
    combined per field:

    ```python
    nick = F.create_map(*[F.lit(x) for pair in NICKNAMES.items() for x in pair])   # {"bob": "robert", ...}
    raw_tokens = F.split(F.regexp_replace(F.lower(unaccent("name")), "[^a-z ]", ""), " +")
    tokens = F.transform(F.filter(raw_tokens, lambda t: t != ""),
                         lambda t: F.coalesce(F.element_at(nick, t), t))

    email = F.nullif(F.lower(F.trim("email")), F.lit(""))
    local, domain = F.split(email, "@")[0], F.split(email, "@")[1]
    gmail_local = F.regexp_replace(F.split(local, "\\+")[0], "\\.", "")

    norm = (records
        .withColumn("id", F.concat_ws(":", "source", "record_id"))
        .withColumn("tokens", F.array_sort(tokens))
        .withColumn("name_key", F.array_join("tokens", " "))
        .withColumn("email_key", F.when(domain == "gmail.com", F.concat(gmail_local, F.lit("@gmail.com")))
                                  .otherwise(email))
        .withColumn("phone_key", F.nullif(F.right(F.regexp_replace("phone", "[^0-9]", ""), F.lit(10)), F.lit("")))
        .withColumn("city_key", F.lower(unaccent("city"))))
    ```

    ```text
    +-------------+--------------+--------------+------------------------+----------+
    |id           |name          |name_key      |email_key               |phone_key |
    +-------------+--------------+--------------+------------------------+----------+
    |crm:CRM-0004 |Mateo García  |garcia mateo  |mateogarcia@gmail.com   |4165551245|
    |crm:CRM-0005 |Bill Singh    |singh william |william.singh@example.ca|9025555794|
    |crm:CRM-0006 |Bob Ahmed     |ahmed robert  |robert.ahmed@example.ca |6135554144|
    |shop:10008   |Minh Tuan Le  |le minh tuan  |minhtuan.le@example.ca  |4165552394|
    |shop:10029   |Thu Trang Pham|pham thu trang|NULL                    |9025559952|
    |support:S-028|Phạm Thu Trang|pham thu trang|thutrangpham@gmail.com  |9025559952|
    +-------------+--------------+--------------+------------------------+----------+
    ```

    What each piece buys:

    - **Accents**: Spark 4.2 has no function that removes accents (see
      "Columns and Expressions: Cleaning Values"), so `unaccent` is a small pandas UDF around
      `unicodedata`. Vietnamese `Đ` is its own letter and needs a manual
      mapping.
    - **Sorted tokens** make word order irrelevant: `Thu Trang Pham` and
      `Phạm Thu Trang` get the same key.
    - **Nicknames** come from a mapping table. `element_at` on a map
      returns NULL for a missing key (checked with ANSI mode on in
      4.2.0), so `coalesce` keeps every non-nickname as it is. A real
      nickname list has thousands of entries; load it as a DataFrame and
      broadcast it, or keep it as a map literal as here while it is
      small.
    - **E-mail**: trimmed and lower-cased, and for `gmail.com` only,
      dots and `+tags` removed, because Gmail delivers `m.a.teo+shop`
      to `mateo`. Do not apply that rule to other domains, where a dot
      may be significant.
    - **Phone**: digits only, the last 10, so `+1 613 555 4144` and
      `613.555.4144` agree. Use a proper phone library for
      international numbers.
    - **Empty means unknown**: `nullif` turns `""` into NULL, so two
      blank e-mails never count as a match.

