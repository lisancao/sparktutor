    ## Step 6: The Golden Record

    Each cluster becomes one row, built by **survivorship rules**: for
    every field, an explicit rule that picks which record's value
    survives. Write them down, because "which address do we believe" is
    a business decision, not a technical one.

    ```python
    def latest(col):
        """The value of col on the most recent row where col is not NULL."""
        return F.max_by(col, F.when(col.isNotNull(), F.col("updated_at")))

    rest = (rows.groupBy("label")
            .agg(latest(F.col("email_key")).alias("email"),
                 F.mode("phone_key", deterministic=True).alias("phone"),
                 latest(F.col("city")).alias("city"),
                 F.array_sort(F.collect_set("source")).alias("sources"),
                 F.count("*").alias("records"),
                 F.max("updated_at").alias("last_seen")))
    ```

    The functions, and the traps checked on 4.2.0:

    - **`max_by(value, ordering)`** (SQL since 3.0, `F.max_by` since
      3.3; 4.2 adds an optional `k` for the top k values) returns the
      value from the row
      with the largest ordering. It **returns a NULL value** if that row
      has one (`max_by(v, d)` over `('x', 1), (NULL, 2)` is NULL), and
      it **ignores rows whose ordering is NULL**. So making the ordering
      NULL wherever the value is NULL (`when(col.isNotNull(),
      updated_at)`) gives "the latest known value", which is what you
      want for a customer who moved.
    - **`mode(col)`** (3.4) returns the most frequent non-NULL value;
      on a tie it returns any of them. `deterministic=True` (4.0) picks
      the smallest of the tied values instead, so reruns agree.
    - **`collect_set`** has no defined order; sort it.

    The name needs two steps, because "most recent" would let a typo
    win: first vote with `mode(name_key, deterministic=True)` so a one-off
    misspelling loses, then among the records with the winning key
    prefer a name written in full (no nickname), then one with accents
    (a system that strips accents loses information; none adds it), then
    the most recent, using `max_by` over a struct, which compares field
    by field:

    ```python
    F.max_by("clean", F.struct(written_in_full, has_accent, F.col("updated_at")))
    ```

    ```text
    +------------+-------------+---------------------------+----------+---------+--------------------+-------+----------+
    |label       |name         |email                      |phone     |city     |sources             |records|last_seen |
    +------------+-------------+---------------------------+----------+---------+--------------------+-------+----------+
    |crm:CRM-0049|Mei Chen     |meichen@gmail.com          |9025555398|Toronto  |[crm, shop, support]|6      |2026-08-04|
    |crm:CRM-0013|Priya Okafor |priya.okafor@example.ca    |4035554693|Montréal |[crm, shop, support]|4      |2026-04-20|
    |crm:CRM-0043|Ivan Chen    |ivanchen@gmail.com         |4035554965|Vancouver|[crm, shop, support]|4      |2026-06-01|
    ...
    ```

    The Mei Chen merge is plain to see: six records, in a library where
    nobody else has more than four. Two-record clusters show the limit
    of voting: with one correct spelling and one typo there is no
    majority, and the deterministic tie-break picks by alphabet, which is
    how `José Garcaí` became the golden name of one cluster. Small
    clusters need a better tie rule (prefer the source you trust most)
    or review.

