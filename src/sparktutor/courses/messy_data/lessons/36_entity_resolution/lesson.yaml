    ## Step 3: Blocking Instead of N Squared

    139 records make 139 x 138 / 2 = 9591 pairs. Scoring all of them is
    fine here and hopeless at a million customers (500 billion pairs).
    **Blocking** compares only records that share a *block key*, a
    cheap value true matches usually share. No single key catches
    everything, so run several passes and take the union:

    ```python
    def pairs_on(keyed):                         # keyed: columns id, bk
        k = keyed.filter(F.col("bk").isNotNull())
        return (k.alias("a").join(k.alias("b"), "bk")
                .filter(F.col("a.id") < F.col("b.id"))
                .select(F.col("a.id").alias("l"), F.col("b.id").alias("r")))

    by_email = pairs_on(norm.select("id", F.col("email_key").alias("bk")))
    by_phone = pairs_on(norm.select("id", F.col("phone_key").alias("bk")))
    by_name = pairs_on(norm.select("id", F.explode(F.filter("tokens", lambda t: F.length(t) > 1)).alias("t"))
                           .select("id", F.soundex("t").alias("bk")))
    candidates = by_email.unionByName(by_phone).unionByName(by_name).distinct()
    ```

    Measured against the answer key:

    | Pass | Candidate pairs | True pairs among them (of 105) |
    |---|---|---|
    | same `email_key` | 75 | 75 |
    | same `phone_key` | 78 | 70 |
    | a name token with the same soundex | 880 | 105 |
    | **union** | **882** (9.2% of 9591) | **105** |

    - E-mail is precise but misses every record without one. Phone
      catches more and also pairs family members (8 of its 78 pairs are
      wrong). The soundex pass alone finds everything here, at ten times
      the work.
    - `a.id < b.id` keeps each pair once and drops self pairs, and
      `distinct()` removes pairs found by several passes.
    - **Blocking recall is a hard ceiling**: a pair no pass proposes can
      never be matched later. Measure it on labelled data whenever you
      change a block key.

