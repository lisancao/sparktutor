    ## Why the Loop Needs localCheckpoint

    A DataFrame is a plan, not data ("Plans, Partitions and Caching").
    Each round's `labels` is built from the previous round's, so without
    a checkpoint the plan contains every earlier round, and it doubles
    each time:

    | Round | Optimized plan lines (no checkpoint) |
    |---|---|
    | 1 | 14 |
    | 2 | 38 |
    | 3 | 86 |
    | 4 | 182 |
    | 5 | 374 |

    After a few dozen rounds the plan is too large to analyse and
    optimize in reasonable time, long before any data is processed.
    `localCheckpoint()` (2.3) materializes the DataFrame and returns a
    new one whose plan is just a scan of the stored blocks:

    ```text
    LogicalRDD [id#68, label#1320], false
    ```

    Two kinds of checkpoint, both supported on Spark Connect since 4.0:

    - **`localCheckpoint()`** stores the data in the executors' block
      managers. Fast, needs no setup, but **not fault tolerant**: if an
      executor is lost, the job fails instead of recomputing. Right for
      a loop whose result you write out at the end.
    - **`checkpoint()`** writes to reliable storage and needs a
      checkpoint directory. In classic mode call
      `spark.sparkContext.setCheckpointDir(path)`; otherwise it fails
      with `Checkpoint directory has not been set in the SparkContext`.
      On Spark Connect there is no `sparkContext`, and setting
      `spark.checkpoint.dir` (4.0) at runtime fails with
      `[CANNOT_MODIFY_CONFIG] Cannot modify the value of the Spark
      config: "spark.checkpoint.dir"`. It is a static setting: pass it
      when the session (server) starts, for example
      `SparkSession.builder.remote("local[2]").config("spark.checkpoint.dir", d)`,
      which we checked works.

    The same loop also shows why `cache()` alone is not enough: caching
    keeps the data, but the plan still grows.

