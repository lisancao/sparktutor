    ## Step 1: One Schema

    Matching starts by giving every source the same columns. The
    mapping is plain DataFrame code, and each line handles one quirk:

    ```python
    crm = (spark.read.option("header", True).csv("data/messy/entities/crm.csv")
           .select(F.lit("crm").alias("source"), F.col("crm_id").alias("record_id"),
                   F.concat_ws(" ", "first_name", "last_name").alias("name"),
                   "email", "phone", "city", F.to_date("updated_at").alias("updated_at")))

    parts = F.split("name", ",")
    shop = (spark.read.option("header", True).csv("data/messy/entities/shop.csv")
            .select(F.lit("shop").alias("source"), F.col("customer_no").alias("record_id"),
                    F.when(F.col("name").contains(","),
                           F.concat_ws(" ", F.trim(parts[1]), F.trim(parts[0])))
                     .otherwise(F.col("name")).alias("name"),
                    "email", "phone", "city", F.to_date("last_order").alias("updated_at")))

    support = (spark.read.schema("contact_id string, name string, email string, phone string, seen timestamp")
               .json("data/messy/entities/support.jsonl")
               .select(F.lit("support").alias("source"), F.col("contact_id").alias("record_id"),
                       "name", "email", "phone", F.lit(None).cast("string").alias("city"),
                       F.to_date("seen").alias("updated_at")))

    records = crm.unionByName(shop).unionByName(support)
    ```

    ```text
    +-------+---------+------------+-------------------------+---------------+---------+----------+
    |source |record_id|name        |email                    |phone          |city     |updated_at|
    +-------+---------+------------+-------------------------+---------------+---------+----------+
    |crm    |CRM-0005 |Bill Singh  |William.singh@example.ca |9025555794     |Vancouver|2024-09-15|
    |crm    |CRM-0006 |Bob Ahmed   | robert.ahmed@example.ca |+1 613 555 4144|Ottawa   |2024-01-03|
    |shop   |10018    |José Smith  | jose.smith@mail.com     |5145554987     |Vancouver|2025-08-23|
    |shop   |10008    |Minh Tuan Le|Minhtuan.le@example.ca   |+1 416 555 2394|Ottawa   |2026-04-02|
    |support|S-004    |Rob Ahmd    |NULL                     |613.555.4144   |NULL     |2026-04-19|
    +-------+---------+------------+-------------------------+---------------+---------+----------+
    ```

    - `record_id` is only unique **within** a source (a shop number
      could collide with a support id), so later steps use `id =
      source:record_id`.
    - The missing city is an explicit typed NULL (`cast("string")`), so
      the column has the same type in every input of `unionByName`.
    - Keep the raw values. Normalized keys go in *new* columns, because
      the golden record at the end wants the original spellings.

