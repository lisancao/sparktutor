    ## Clustering Changes the Score

    Measure again after clustering, now over every pair of records that
    ended up in the same cluster:

    | | Pairs called matches | Correct | Precision | Recall |
    |---|---|---|---|---|
    | pair scores at 0.9 | 106 | 105 | 0.991 | 1.000 |
    | clusters from those pairs | 114 | 105 | 0.921 | 1.000 |

    One wrong edge joined the two Mei Chens, whose records (three and
    three) became one cluster of six, and every cross pair inside it
    counts as a false match: 9 false pairs from 1 wrong edge.
    **Transitivity amplifies mistakes**, and it does so most in the big,
    common-name clusters you care about most. Defences:

    - Raise the threshold for *edges* above the one you use for
      reporting, or require two independent kinds of evidence.
    - Check clusters, not just pairs: a cluster with two different
      e-mail keys and two different phone keys is suspicious; so is a
      cluster much bigger than the rest.
    - Send borderline edges to a review queue rather than to the
      clustering.

