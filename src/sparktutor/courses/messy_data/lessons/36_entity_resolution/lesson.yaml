    ## Comparing Strings

    Keys catch the easy cases. Typos need a *similarity*: a number that
    says how close two strings are.

    **`levenshtein(a, b)`** (1.5) counts the single-character edits
    (insert, delete, substitute) that turn one string into the other.
    Since 3.5 an optional third argument is a threshold: the result is
    the distance if it is at most the threshold, and `-1` otherwise,
    which lets Spark stop early:

    ```python
    spark.sql("""SELECT levenshtein('García','Garcia') a, levenshtein('Trembley','Tremblay') b,
      levenshtein('Bob','Robert') c, levenshtein('Tremblay','Trembley', 1) d,
      levenshtein('Tremblay','Smith', 2) e""").show()
    ```

    ```text
    +---+---+---+---+---+
    |  a|  b|  c|  d|  e|
    +---+---+---+---+---+
    |  1|  1|  4|  1| -1|
    +---+---+---+---+---+
    ```

    It counts characters, not bytes (`í` to `i` is one edit), and
    collations do not change it: `levenshtein('Côté' COLLATE
    UNICODE_CI_AI, 'cote')` is still 3. `Bob` and `Robert` are 4 edits
    apart, which is why nicknames need a table, not a distance.

    **`soundex(s)`** codes how an English surname sounds, so
    `Tremblay`/`Trembley` and `Smith`/`Smyth` share a code:

    ```text
    +----+----+----+----+----+----+-----+----+
    |   a|   b|   c|   d|   e|   f|    g|   h|
    +----+----+----+----+----+----+-----+----+
    |T651|T651|S530|S530|N250|Đặng|Émile|D520|
    +----+----+----+----+----+----+-----+----+
    ```

    (for `Tremblay, Trembley, Smith, Smyth, Nguyễn, Đặng, Émile,
    Dang`). Look at `f` and `g`: when the **first** character is not an
    ASCII letter, Spark's `soundex` returns the input unchanged (the
    4.2.0 source says "first character must be a letter"), and non-ASCII
    characters later in the word are skipped. Strip accents before
    calling it.

    **Jaro-Winkler** is the classic similarity for short names: 1.0 for
    identical strings, close to 1 for a transposed or dropped letter, a
    bonus for a common prefix. Spark 4.2.0 has **no built-in** for it,
    so the exercise gives you a plain Python version, used in a pandas
    UDF. The textbook values come out as expected
    (`martha`/`marhta` 0.9611, `dixon`/`dicksonx` 0.8133), and
    `tremblay`/`trembley` scores 0.95.

    **Token sets** handle word order and extra words. With arrays,
    Jaccard similarity is built in:

    ```python
    F.size(F.array_intersect("a", "b")) / F.size(F.array_union("a", "b"))
    ```

    For `[an, tran, van]` against `[an, tran]` that is 2/3. The
    exercise's `name_similarity` combines both ideas: each token is
    matched to its most similar token in the other name with
    Jaro-Winkler, averaged in both directions, keeping the lower. A
    reordered name with a typo (`[mateo, garcia]` against `[garccia,
    mateo]`) scores 0.9857; two people of one family (`[chen,
    nicholas]` against `[chen, linh]`) score 0.7986.

