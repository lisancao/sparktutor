    Imagine three address books kept by three people at the same
    company. One writes "Bob Ahmed", another "Robert Ahmed", the third
    "Rob Ahmd" with a typo, and one of them has an old phone number. A
    person reading them would say "these are all Robert", and also "but
    these two Robert Smiths are different people, they live in different
    cities". Entity resolution is teaching Spark to make those calls,
    and to show how often it gets them wrong.

