    ## Step 4: Scoring Pairs

    Each candidate pair gets a score from the evidence:

    ```python
    def evidence(key, agree, disagree):
        left, right = F.col(f"l_{key}"), F.col(f"r_{key}")
        return (F.when(left.isNull() | right.isNull(), F.lit(0.0))
                .when(left == right, F.lit(agree)).otherwise(F.lit(-disagree)))

    scored = (pairs        # candidates joined to l_ and r_ copies of norm
        .withColumn("name_sim", similarity("l_tokens", "r_tokens"))       # pandas UDF
        .withColumn("score", F.col("name_sim") + evidence("email_key", 0.5, 0.3)
                    + evidence("phone_key", 0.3, 0.2) + evidence("city_key", 0.1, 0.05)))
    ```

    The design choice that matters most is **missing is not a
    disagreement**. A support contact without an e-mail is not evidence
    against a match, so a NULL on either side adds 0. A *different*
    e-mail is evidence against (people do have two addresses, so it
    subtracts less than an equal one adds).

    The first version of this lesson used a plain weighted sum (`0.5 *
    name similarity + 0.3 * email_equal + 0.15 * phone_equal + 0.05 *
    city_equal`, with Jaro-Winkler on the sorted name key), where a
    missing value counted the same as a mismatch. At a threshold of 0.6
    it reached precision 0.989 at recall 0.876, and every true match it
    missed was a pair with no shared e-mail or phone. The evidence
    version reaches precision 0.991 at recall 1.0 on the same
    candidates.

    The weights here were set by hand and checked on the labels. With
    more labelled pairs you can learn them: the per-field comparisons
    are exactly the features of a classifier (MLlib's
    `LogisticRegression` takes them through `VectorAssembler`, as in
    the learning_spark course's MLlib lesson), and the classic Fellegi-Sunter
    model learns them from match and non-match frequencies.

