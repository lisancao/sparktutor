    ## Big Blocks Are the Cost

    A block of `n` records makes `n (n - 1) / 2` pairs, so the work
    is dominated by the biggest blocks:

    ```python
    sx = (norm.select("id", F.explode(F.filter("tokens", lambda t: F.length(t) > 1)).alias("t"))
              .select("id", F.soundex("t").alias("code"), "t"))
    (sx.groupBy("code")
       .agg(F.count_distinct("id").alias("records"), F.array_sort(F.collect_set("t")).alias("tokens"))
       .orderBy(F.desc("records")).show(5, truncate=60))
    ```

    ```text
    +----+-------+--------------------------------+
    |code|records|                          tokens|
    +----+-------+--------------------------------+
    |C500|     20| [chen, chne, coen, cohen, cohn]|
    |G620|     17|[garca, garcai, garccia, garcia]|
    |S530|     13|                         [smith]|
    |A530|     12|             [ahmd, ahmed, andy]|
    |J200|     10|                          [jose]|
    +----+-------+--------------------------------+
    ```

    Soundex is coarse: `Chen` and `Cohen` share `C500`, and `Ahmed` and
    `Andy` share `A530`. In a national customer base, a block for
    `Smith` or `Nguyen` holds hundreds of thousands of records, and its
    join becomes the one task that never finishes ("Tuning Python on
    Spark" covers skew). Standard remedies: block on combinations
    (soundex of the surname **and** the first initial, or the city),
    skip blocks above a size limit and log them, or cap each record's
    candidates. Each one trades recall for work, so measure both.

