    ## Choosing a Threshold

    Calling a pair a match when `score >= threshold` makes two kinds of
    mistakes, and two numbers measure them against labelled pairs:

    - **Precision**: of the pairs called matches, the fraction that
      really are. Low precision merges different people.
    - **Recall**: of the pairs that really match, the fraction called
      matches. Low recall leaves duplicates behind.

    ```python
    predicted = scored.filter(F.col("score") >= threshold).select("l", "r")
    tp = predicted.join(true_pairs, ["l", "r"]).count()
    precision, recall = tp / predicted.count(), tp / true_pairs.count()
    ```

    | Threshold | Predicted | Correct | Precision | Recall |
    |---|---|---|---|---|
    | 0.7 | 156 | 105 | 0.673 | 1.000 |
    | 0.8 | 115 | 105 | 0.913 | 1.000 |
    | 0.9 | 106 | 105 | 0.991 | 1.000 |
    | 1.0 | 102 | 101 | 0.990 | 0.962 |
    | 1.1 | 96 | 96 | 1.000 | 0.914 |

    At 0.9 the single false match is two different people called **Mei
    Chen**: the support record has no e-mail and no phone, so nothing
    but the name speaks, and the name is identical. No threshold fixes
    that pair without losing true matches; only more evidence does (an
    address, an order history), or a human.

    Labels in practice: the full answer key here is a luxury. Label a
    few hundred candidate pairs, sampled more densely near the
    threshold where the decisions are hard, and keep them as a test set
    you rerun after every change to keys, blocks or weights.

