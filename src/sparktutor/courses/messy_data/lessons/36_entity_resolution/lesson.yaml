    ## Exact Duplicates First

    The cheap win comes first: rows that are identical.
    `dropDuplicates()` with no arguments compares whole rows;
    `dropDuplicates([cols])` compares only those columns:

    ```python
    print(records.count(), records.dropDuplicates().count(),
          records.dropDuplicates(["name", "email", "phone"]).count())
    ```

    ```text
    139 139 137
    ```

    No two rows are identical (their ids differ), and two pairs agree on
    name, e-mail and phone: `Thomas Garcia` and `alexander lefebvre`
    each appear in the shop and in support with the same values. Which
    row `dropDuplicates` keeps is **not defined**; when it matters (keep
    the newest), rank explicitly:

    ```python
    from pyspark.sql import Window

    key = ["source", "name_key", "email_key", "phone_key"]
    w = Window.partitionBy(key).orderBy(F.desc("updated_at"), "record_id")
    latest = norm.withColumn("rn", F.row_number().over(w)).filter("rn = 1").drop("rn")
    ```

    On the normalized keys built next, the CRM has no exact copies
    left: its double entries differ by a typo, a nickname or a missing
    phone. That is typical. Exact deduplication is a first pass; nearly
    all the real duplicates need fuzzy matching.

