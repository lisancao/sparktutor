    ## Stable Entity Ids Across Runs

    The label of a cluster is its smallest record id. That is
    convenient and **unstable**: tomorrow a new record with a smaller
    id joins a cluster and its label changes, and every table that
    stored the old label points nowhere. Production systems keep a
    separate entity id:

    1. Keep last run's mapping `record id -> entity_id`.
    2. After clustering, give each new cluster the entity id held by
       most of its records last time (a join and a `mode`), and a new
       id (for example `uuid()`, stored, never recomputed) when none of
       its records had one.
    3. When two old entities merge, keep one id and record the other as
       an alias; when one splits, keep the id on the larger part.

    Write the mapping with the golden records in a table format that
    supports `MERGE` ("Landing Messy Data in Delta Lake") so that
    downstream tables join on an id that survives reruns.

