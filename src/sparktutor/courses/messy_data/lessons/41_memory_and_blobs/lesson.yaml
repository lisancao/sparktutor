    ## The Unified Memory Model

    In local mode the driver JVM is also the executor, so its heap is the
    executor heap. `UnifiedMemoryManager`
    (`core/src/main/scala/org/apache/spark/memory/UnifiedMemoryManager.scala`)
    divides it:

    ```text
    heap (spark.driver.memory / spark.executor.memory)
    ├─ reserved: 300 MiB (RESERVED_SYSTEM_MEMORY_BYTES)
    └─ usable = heap - 300 MiB
       ├─ unified pool = usable * spark.memory.fraction (0.6)
       │  ├─ storage region = pool * spark.memory.storageFraction (0.5)
       │  └─ execution: the rest of the pool
       └─ user memory = usable * 0.4: your objects, UDF buffers,
          and everything Spark allocates without asking the manager
    ```

    Both fractions date from 1.6. Read the real numbers through Py4J:

    ```python
    mm = spark._jvm.org.apache.spark.SparkEnv.get().memoryManager()
    heap = spark._jvm.java.lang.Runtime.getRuntime().maxMemory()
    print(heap >> 20, mm.maxHeapMemory() >> 20, mm.maxOnHeapStorageMemory() >> 20,
          mm.maxOffHeapStorageMemory() >> 20)
    ```

    | Run | `Runtime.maxMemory` | `maxHeapMemory` (pool) | `maxOnHeapStorageMemory` | `maxOffHeapStorageMemory` |
    |---|---|---|---|---|
    | `spark-submit` defaults | 1024 MiB | 434 MiB | 434 MiB | 0 |
    | `--driver-memory 2g`, off-heap 256m | 2048 MiB | 1048 MiB | 1048 MiB | 256 MiB |

    (1024 - 300) * 0.6 = 434.4, the same "434.4 MiB RAM" the
    `BlockManager` logs at startup. `maxOnHeapStorageMemory` is the whole
    pool, not half of it: the boundary is **soft**. From the class
    comment: storage can borrow all free execution memory, and execution
    can borrow all free storage memory; when execution needs its share
    back, cached blocks are evicted, but execution memory is never
    evicted for storage. So a cache can use the whole pool while nothing
    runs, and a big sort can push a cache out down to the storage region.

    Off-heap memory (`spark.memory.offHeap.enabled`,
    `spark.memory.offHeap.size`, both 1.6) is a second, separate pool
    outside the garbage-collected heap, used by Tungsten for execution
    and storage when enabled. It is not counted in the heap, so on a
    cluster it must fit into the container's overhead.

    Two edge cases from the same file. A heap below 1.5 * 300 MiB fails
    at startup with `INVALID_DRIVER_MEMORY`: "System memory ... must be
    at least ...". And when `spark.testing` is set (as `SPARK_TESTING=1`
    does), the reserved memory becomes 0, so test runs see different
    numbers; that is one more reason the course runs script exercises
    without it. Spark 4.1 also added tracking of memory that components
    such as the RocksDB state store manage themselves
    (`spark.memory.unmanagedMemoryPollingInterval`, off by default).

