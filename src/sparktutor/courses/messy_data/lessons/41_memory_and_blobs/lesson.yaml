    ## What Uses Which Memory

    **Execution memory** is taken by operators while a task runs:
    sorts (`UnsafeExternalSorter`), hash aggregates, sort-merge and
    shuffled hash joins, shuffle write buffers. Each task asks the
    `TaskMemoryManager` for pages; with N tasks running, each task is
    guaranteed at least 1/(2N) of the execution pool and may take up to
    1/N. When a request cannot be met, the operator **spills**: it
    writes what it has, sorted, to local disk, frees the memory and
    merges the pieces later.

    **Storage memory** holds cached blocks (`cache()`, `persist()`) and
    broadcast variables. When it is full, blocks are evicted, or written
    to disk if their storage level allows it.

    **User memory** is everything else on the heap: rows being built,
    the byte arrays of a `binaryFile` row, collections in your code,
    the Arrow buffers sent to Python. The memory manager does not track
    it, so nothing spills it; when it runs out, the JVM throws
    `OutOfMemoryError`.

    Python workers are outside all of this, as "The Python Worker
    Protocol" showed.

