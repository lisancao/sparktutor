    ## binaryFile and the 2 GiB Wall

    `binaryFile` returns a file as one row with a `content` column. Its
    reader is short enough to quote
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/datasources/binaryfile/BinaryFileFormat.scala`):

    ```scala
    requiredSchema.fieldNames.zipWithIndex.foreach {
      case (PATH, i) => writer.write(i, UTF8String.fromString(status.getPath.toString))
      case (LENGTH, i) => writer.write(i, status.getLen)
      ...
      case (CONTENT, i) =>
        if (status.getLen > maxLength) {
          throw QueryExecutionErrors.fileLengthExceedsMaxLengthError(status, maxLength)
        }
        val stream = fs.open(status.getPath)
        try {
          writer.write(i, stream.readAllBytes())
        } ...
    ```

    Four facts follow:

    1. **Content is read only when the query needs it.** The loop runs
       over `requiredSchema`, so `select("path", "length")` never opens
       a file.
    2. **The limit is a setting.** `maxLength` is
       `spark.sql.sources.binaryFile.maxLength` (internal, since 3.0,
       default `Int.MaxValue`, 2147483647 bytes), because a row is backed
       by one Java byte array.
    3. **The file is not splittable** (`isSplitable` returns `false`):
       one file, one task, one row.
    4. **The whole file is read into memory** with `readAllBytes()`,
       and then copied into the row.

    A sparse 2.5 GB file (created with `f.truncate(2_500_000_000)`, so
    it uses no disk blocks) shows the first two:

    ```text
    apparent size 2500000000 blocks on disk 0
    [Row(path='file:/tmp/tmpamdrd4or/huge.bin', length=2500000000)]   # select("path", "length")
    count 1
    Caused by: org.apache.spark.SparkException: The length of file:/tmp/tmpamdrd4or/huge.bin is
    2500000000, which exceeds the max length allowed: 2147483647.
    ```

    The error class is `_LEGACY_ERROR_TEMP_2076`. The check runs
    before anything is read, so it fails fast. Lowering the setting
    turns it into a guard against surprises:

    ```python
    spark.conf.set("spark.sql.sources.binaryFile.maxLength", str(100 * 1024 * 1024))
    ```

    ```text
    The length of file:/tmp/.../mid.bin is 314572800, which exceeds the max length allowed: 104857600.
    ```

