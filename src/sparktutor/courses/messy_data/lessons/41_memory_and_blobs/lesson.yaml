    ## Blobs on Their Way to Python

    When rows are blobs, the size of the Arrow batches Spark sends to a
    Python UDF or `mapInArrow` / `mapInPandas` matters more than the
    number of rows. Two settings bound a batch on the way **into**
    Python:

    - `spark.sql.execution.arrow.maxRecordsPerBatch` (2.3, default
      10000)
    - `spark.sql.execution.arrow.maxBytesPerBatch` (4.0, internal,
      default 64MB)

    `PythonArrowInput.writeSizedBatch`
    (`sql/core/src/main/scala/org/apache/spark/sql/execution/python/PythonArrowInput.scala`)
    keeps adding rows while both hold:

    ```scala
    def underBatchSizeLimit: Boolean =
      (maxBytesPerBatch == Int.MaxValue) || (arrowWriter.sizeInBytes() < maxBytesPerBatch)

    while (rowIter.hasNext && numRowsInBatch < maxRecordsPerBatch &&
      underBatchSizeLimit) {
      arrowWriter.write(rowIter.next())
      numRowsInBatch += 1
    }
    ```

    Measured: twelve 8 MiB files in one partition, through `mapInArrow`
    reporting each batch's rows and `nbytes`:

    | Setting | Batches (rows, MiB) |
    |---|---|
    | defaults | (8, 64), (4, 32) |
    | `maxBytesPerBatch` = 16 MiB | six of (2, 16) |
    | `maxRecordsPerBatch` = 2 | six of (2, 16) |

    The check happens **before** each row, so a batch stops at the first
    row that brings it to the limit or past it: it can exceed the limit
    by up to one row, and a single row larger than the limit is sent as
    a batch of one. With 300 MiB scans and the 64 MB default, every
    batch is one row of 300 MiB.

    In the other direction, from a **Python data source** to the JVM,
    only the record count applies: `records_to_arrow_batches` in
    `pyspark/sql/worker/plan_data_source_read.py` groups the tuples you
    yield by `maxRecordsPerBatch` alone. A reader yielding 10000 tuples
    with 1 MiB of bytes each builds a 10 GB batch in the worker. Either
    lower `maxRecordsPerBatch` for that job, or yield
    `pyarrow.RecordBatch`es that you size by bytes yourself ("Types,
    Arrow and Performance" showed how).

    One more limit: Arrow's `string` and `binary` columns use 32-bit
    offsets, so one column of one batch cannot hold more than 2 GiB.
    `spark.sql.execution.arrow.useLargeVarTypes` (3.5, default false)
    switches Spark to the 64-bit `large_string` / `large_binary` types,
    at a cost in memory per value. Remember from "Types, Arrow and
    Performance" that a Python data source's declared `string` must then
    match exactly, or the 4.2 schema check rejects the batch.

