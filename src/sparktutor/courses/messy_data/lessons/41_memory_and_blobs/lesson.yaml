    ## Strategy 3: Parse While You Stream

    Whatever the format, `read()` is a generator: it can hold one record
    at a time. The mistakes that bring a whole file into memory are
    small and common:

    - `f.read()` or `Path.read_bytes()` on the whole file, then parsing.
      Use `f.read(n)` in a loop, `iter(lambda: f.read(1 << 20), b"")`,
      or line iteration.
    - Building a list of all rows and returning it. Yield them.
    - Decompressing a whole `.gz` with `gzip.decompress`. Use
      `gzip.open` and iterate. (A gzip stream cannot be split by byte
      ranges at all: it must be one partition, or recompressed into a
      splittable format.)
    - JSON documents: `json.load` holds the whole document. For JSON
      Lines, iterate lines; for one huge JSON array, use an incremental
      parser, or convert it once.
    - Formats with an index (ZIP, Parquet, many archives) can be split
      by entry instead of by bytes: plan one partition per entry or
      group of entries from the index.

    The same goes for the other direction: `applyInPandas` hands each
    group to Python as one pandas DataFrame, so one giant group is one
    giant allocation in one worker. Check group sizes before grouping
    blobs (`groupBy(key).count()` is cheap), and salt or pre-aggregate
    skewed keys.

