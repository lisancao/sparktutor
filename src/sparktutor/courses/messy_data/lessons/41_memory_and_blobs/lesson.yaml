    ## Strategy 1: Inventory First, Content Later

    Most jobs over blobs need the bytes of a few files, or need them one
    at a time. Read the **inventory** (paths and lengths, which open no
    file), decide what to process, and let each task open its own files
    and stream them:

    ```python
    inv = (spark.read.format("binaryFile").option("recursiveFileLookup", "true")
           .load(folder).select("path", "length"))

    def sha256_files(batches):
        for pdf in batches:
            out = []
            for p in pdf["path"]:
                h = hashlib.sha256()
                with open(p.removeprefix("file:"), "rb") as f:
                    for block in iter(lambda: f.read(1 << 20), b""):
                        h.update(block)
                out.append(h.hexdigest())
            yield pdf.assign(sha256=out)

    inv.mapInPandas(sha256_files, "path string, length long, sha256 string").collect()
    ```

    Over a folder with a 300 MiB file (the one that killed the 1 GiB
    driver through `content`) and the sample images:

    ```text
    scan_300mb.bin 314572800 17a88af83717f68b
    gradient_32x32.png 1795 08617c474e4b9412
    gray_20x10.png 90 750a5916d260a937
    7 files hashed in 1.8s with a 1 GiB driver
    ```

    The JVM handled only paths; each worker read 1 MiB at a time. On a
    cluster the path must be readable from executors (an object store
    URI and a client library, or a shared file system), and a
    `binaryFile` path comes back as a URI (`file:/...`), hence
    `removeprefix`.

    The same idea applied to storage is to keep **pointers, not bytes**:
    a table of `(path, length, sha256, media_type)` with the content in
    object storage, and derived artifacts (text, thumbnails, embeddings)
    in their own tables keyed by hash. "Designing Tables for Blobs"
    builds that catalog with Delta.

