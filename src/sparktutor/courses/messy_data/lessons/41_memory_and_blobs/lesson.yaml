    ## Choosing a Layout for Blobs

    | Approach | Good for | Breaks when |
    |---|---|---|
    | `binaryFile` with `content` | many small files (KB to a few MB), each processed whole | files of hundreds of MB, or any near 2 GiB |
    | inventory plus lazy fetch in `mapInPandas` | any size, when each file is processed by streaming code | the processing itself needs the whole file in memory |
    | byte-range chunks in a data source | huge files with a record boundary rule (lines, fixed records, sync markers) | records without a recognisable start, compressed streams |
    | entries from an index | archives and formats with a directory | the index itself is huge or missing |
    | pointers in a table | catalogs, reprocessing, deletion and lineage | the pointed-to store changes behind your back |

    A rule of thumb from the measurements here: keep any single value
    that Spark materializes below a few percent of the heap per running
    task. With a 4 GiB executor running 4 tasks, a 50 MB blob is
    comfortable and a 500 MB blob is not, whatever
    `spark.sql.sources.binaryFile.maxLength` allows.

