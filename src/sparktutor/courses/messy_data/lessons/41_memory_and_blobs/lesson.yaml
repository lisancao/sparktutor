    ## What You'll Learn

    "The Python Worker Protocol" looked at memory from the Python side:
    workers outside the JVM, `RLIMIT_AS`, a worker killed for memory.
    This lesson looks at the JVM side and at the files that break naive
    jobs: scanned PDFs of hundreds of megabytes, raw sensor dumps,
    multi-gigabyte logs.

    It builds on "Plans, Partitions and Caching" (partitions, shuffles,
    caching), "Files as Files: binaryFile, Globs and Metadata" (the
    `binaryFile` source) and "Reading a Custom File Format, in Parallel"
    (planning partitions in a Python data source).

    By the end of this lesson you will be able to:

    - Compute the execution and storage memory Spark has from the heap
      size, and read the numbers from `UnifiedMemoryManager` yourself
    - Make a sort spill, measure memory and disk spill from the REST API,
      and remove it by changing partitioning
    - Explain why `binaryFile` cannot read a file over 2 GiB, why the
      practical limit is far lower, and what the error looks like
    - Predict the size of the Arrow batches Spark sends to Python when
      rows are blobs, and which settings bound them
    - Read huge files in byte-range chunks with a Python data source,
      with the line boundary rule that makes chunking correct
    - Choose between inline bytes, lazy fetching and pointers for blobs

    The experiments use small numbers so they run on a laptop: the
    default driver heap of 1 GiB that `spark-submit` gives you, files of
    hundreds of megabytes made in a temporary folder (sparse files where
    possible, so they take no disk space), and cleanup at the end. The
    ratios are what matter; on a cluster everything scales up together.

