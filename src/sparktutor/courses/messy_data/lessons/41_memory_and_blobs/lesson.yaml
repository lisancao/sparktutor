    ## Summary

    - `UnifiedMemoryManager`: (heap - 300 MiB) * `spark.memory.fraction`
      (0.6) is shared by execution and storage, with a soft boundary at
      `spark.memory.storageFraction` (0.5). A 1 GiB heap gives 434 MiB.
      Storage can be evicted for execution, never the reverse. The other
      40% is user memory, which nothing tracks or spills.
    - Spill is how sorts, aggregates and joins survive small memory.
      Read `memoryBytesSpilled` (in-memory size) and `diskBytesSpilled`
      (on-disk size) from the REST API; more, smaller partitions remove
      it, and AQE coalescing only merges.
    - `binaryFile` reads content only when selected, checks
      `spark.sql.sources.binaryFile.maxLength` (default `Int.MaxValue`;
      `_LEGACY_ERROR_TEMP_2076`), never splits a file, and costs about
      three times a file's size in heap while building its row: a
      300 MiB file killed a 1 GiB driver.
    - Batches into Python stop at `maxRecordsPerBatch` (10000) rows or
      when they reach `maxBytesPerBatch` (64MB, internal, 4.0), one row
      past the limit at most. Python data source output is batched by
      record count only.
    - For big blobs: inventory first and stream content inside tasks;
      split huge files into byte ranges with the "a line belongs to the
      chunk holding its first byte" rule; parse while streaming; store
      pointers rather than bytes.

    Next: **A DSv2 Connector in Java**, where you implement the scan
    interfaces that a Python data source cannot use: column pruning,
    limit and aggregate pushdown, and partitioning that Spark can reason
    about.
