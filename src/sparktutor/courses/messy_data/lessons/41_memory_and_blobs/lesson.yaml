    ## The Real Wall Is Much Lower

    Under the limit is not the same as safe. With the default 1 GiB heap
    and a single 100 MiB file, `select(F.length("content"))` returned
    `104857600` in 3 seconds. With a single **300 MiB** file the task
    died, and so did the application (exit status 52, Spark's exit code
    for an out-of-memory error):

    ```text
    ERROR Executor: Exception in task 0.0 in stage 0.0 (TID 0)
    java.lang.OutOfMemoryError: Java heap space
        at org.apache.spark.sql.catalyst.expressions.codegen.BufferHolder.grow(BufferHolder.java:85)
        at org.apache.spark.sql.catalyst.expressions.codegen.UnsafeWriter.grow(UnsafeWriter.java:65)
        at org.apache.spark.sql.catalyst.expressions.codegen.UnsafeWriter.writeUnalignedBytes(UnsafeWriter.java:133)
        ...
        at org.apache.spark.sql.execution.datasources.binaryfile.BinaryFileFormat.$anonfun$buildReader$5(BinaryFileFormat.scala:125)
    ERROR SparkUncaughtExceptionHandler: Uncaught exception in thread Thread[Executor task launch worker ...]
    ```

    Line 125 is `writer.write(i, stream.readAllBytes())`. The arithmetic:
    `readAllBytes()` allocates the 300 MiB array, then the row writer
    must grow its buffer to hold it, and `BufferHolder.grow`
    (`sql/catalyst/src/main/java/org/apache/spark/sql/catalyst/expressions/codegen/BufferHolder.java`)
    **doubles** the needed size (`length * 2`, while under half of its
    maximum): a 600 MiB array next to the 300 MiB one, before the old
    buffer is released, in a heap of 1024 MiB that has other things in
    it. A blob costs about three times its size in heap while its row is
    built, and that memory is user memory, invisible to the memory
    manager, so nothing spills.

    Near 2 GiB a different limit applies: the row buffer cannot exceed
    `ByteArrayMethods.MAX_ROUNDED_ARRAY_LENGTH` (`Integer.MAX_VALUE - 15`),
    and `BufferHolder.grow` throws `_LEGACY_ERROR_TEMP_3199`, "Cannot
    grow BufferHolder by size ... because the size after growing exceeds
    size limitation ...", when a row would pass it. So the useful rule
    for `binaryFile` content is: files of a few megabytes, many per
    task, are fine; files of hundreds of megabytes need several gigabytes
    of heap per running task; anything near 2 GiB cannot be a row at all.

