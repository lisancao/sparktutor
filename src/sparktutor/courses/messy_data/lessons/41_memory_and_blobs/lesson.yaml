    ## Exercise: A Chunked Reader for Very Large Files

    The harness makes a 29.9 MiB log with 260000 lines of random length
    (and a few edge cases: an empty file, a one-line file, a file without
    a final newline) in a temporary folder, and computes a reference
    line count and a sum of CRC32 values in plain Python. The
    `chunked_lines` data source is given; its `read()` writes how many
    bytes each task consumed to an audit folder. Complete:

    1. `plan_chunks(files, chunk_bytes)`: `(path, offset, length)`
       triples covering every byte of every file once.
    2. `read_chunk_lines(f, offset, length)`: yield
       `(line_offset, line_bytes)` for the lines whose first byte is in
       the range, with the boundary rule from this lesson.
    3. `blob_inventory(spark, folder)`: a `binaryFile` DataFrame of
       `path` and `length` only.

    The checks: your functions pass as plain Python for every chunk size
    of a small sample; with 2 MiB chunks the source makes one partition
    per started 2 MiB of each non-empty file; Spark returns every line
    exactly once, with the same CRC32 sum as the reference; the file
    without a final newline keeps its last line; no task read more than
    one chunk plus one line; and the inventory's `ReadSchema` has no
    `content`.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "plan_chunks: for offset in range(0, size, chunk_bytes). read_chunk_lines: if offset: f.seek(offset - 1); f.readline(). Then pos = f.tell(); while pos < offset + length: line = f.readline(); if not line: break; yield pos, line.rstrip(b'\\n'); pos += len(line)."

