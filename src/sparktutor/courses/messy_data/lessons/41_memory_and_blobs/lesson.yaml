    ## Strategy 2: Split One Huge File Into Byte Ranges

    A single 40 GB log is the opposite problem: one file, far too big
    for one task. Spark's own text and CSV readers split such files into
    ranges of `spark.sql.files.maxPartitionBytes` ("Plans, Partitions
    and Caching"). A Python data source can do the same: make each
    partition a `(path, offset, length)` triple instead of a file, and
    let `read()` produce only the records that belong to its range.

    Planning is arithmetic on file sizes, on the driver:

    ```python
    def plan_chunks(files, chunk_bytes):
        chunks = []
        for path, size in files:
            for offset in range(0, size, chunk_bytes):
                chunks.append((path, offset, min(chunk_bytes, size - offset)))
        return chunks
    ```

    Reading needs a rule for records that cross a boundary, and the
    standard one (the rule Hadoop's `LineRecordReader` follows) is: **a line
    belongs to the chunk that contains its first byte.** So a reader
    for the range `[offset, offset + length)`:

    1. If `offset > 0`, seeks to `offset - 1` and discards everything up
       to and including the next newline. If the byte before the chunk
       is itself a newline, that discards one byte and a line starts
       exactly at `offset`; otherwise it skips the tail of a line that
       the previous chunk owns.
    2. Reads whole lines while the **start** of the line is before
       `offset + length`, even if the line ends after it.
    3. Stops at the first line that starts at or after
       `offset + length`; the next chunk owns it.

    Worked through for `b"aa\nbbbb\n\nc\nddddd"` (17 bytes) in chunks of
    4 bytes:

    | Chunk | Byte before | Lines it yields (offset, text) |
    |---|---|---|
    | 0 to 4 | none | (0, `aa`), (3, `bbbb`) |
    | 4 to 8 | `b` at 3 | none: from byte 3 skips `bbbb\n`, lands at 8, and 8 is not before 8 |
    | 8 to 12 | `\n` at 7 | (8, empty line), (9, `c`), (11, `ddddd`) |
    | 12 to 16 | `d` at 11 | none: skips `ddddd` to the end of the file |
    | 16 to 17 | `d` at 15 | none |

    Every line once, from exactly one chunk, whatever the chunk size.
    The exercise checks that for every chunk size from 1 to 18 bytes
    before it ever starts Spark.

    Memory per task is now the read buffer plus one line, independent of
    the file's size. In the exercise, over a 29.9 MiB log in 2 MiB
    chunks, the task that read the most consumed 2097342 bytes: the
    chunk (2097152) plus 190 bytes to finish its last line.

