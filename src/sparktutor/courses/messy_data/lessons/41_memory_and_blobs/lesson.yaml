    ## Making a Sort Spill, and Measuring It

    Sort 6 million rows of about 170 bytes (an `id`, a SHA-256 hex
    string and 100 bytes of padding) into 2 partitions, with the default
    1 GiB heap and AQE off, and write them to the `noop` sink (a plain
    aggregate after `orderBy` would let the optimizer drop the sort):

    ```python
    spark.conf.set("spark.sql.shuffle.partitions", "2")
    df = spark.range(0, 6_000_000, 1, 4).select(
        "id", F.sha2(F.col("id").cast("string"), 256).alias("h"),
        F.repeat(F.lit("x"), 100).alias("pad"))
    df.orderBy("h").write.format("noop").mode("overwrite").save()
    ```

    Spill is a task metric. The UI's REST API sums it per stage:

    ```python
    import json, urllib.request
    sc = spark.sparkContext
    url = f"{sc.uiWebUrl}/api/v1/applications/{sc.applicationId}/stages?details=false"
    for s in json.load(urllib.request.urlopen(url)):
        print(s["stageId"], s["numTasks"], s["memoryBytesSpilled"], s["diskBytesSpilled"])
    ```

    | `spark.sql.shuffle.partitions` | AQE | Sort tasks | Memory spilled | Disk spilled | Time |
    |---|---|---|---|---|---|
    | 2 | off | 2 | 1103 MiB | 415 MiB | 9.7 s |
    | 16 | off | 16 | 0 | 0 | 6.8 s |
    | 200 | off | 200 | 0 | 0 | 6.7 s |
    | 2 | on | 2 | 1103 MiB | 415 MiB | 6.1 s |
    | 200 | on | 7 (coalesced) | 0 | 0 | 10.8 s |

    (One run each; the times are noisy on a shared machine. In every run
    the shuffle wrote about 410 MiB.)

    The two spill numbers measure different things.
    **`memoryBytesSpilled`** is the size the spilled data had **in
    memory**, deserialized, when it was released; **`diskBytesSpilled`**
    is what it took on disk, serialized and compressed. 1103 MiB of
    in-memory records became 415 MiB of spill files. Neither is "how
    much memory was missing".

    With 2 partitions each sort task held 200 MiB of shuffle data that
    expands in memory, more than its share of a 434 MiB pool with two
    tasks running. With 16 partitions each task's share fit. With AQE on
    and 200 partitions, `CoalesceShufflePartitions` merged them into 7
    partitions of about 60 MiB (its target is
    `spark.sql.adaptive.advisoryPartitionSizeInBytes`, 64 MB), which also
    fit. AQE cannot help in the first AQE row: it only coalesces, and 2
    partitions were already too few.

    Spill is not an error. It is the mechanism that lets a 1 GiB heap
    sort far more than 1 GiB. It costs disk I/O and serialization, so
    when a stage spills a lot, the usual fixes are more partitions, less
    data per row (select only the columns you need before a wide
    operation), or more memory per task (fewer cores per executor).

