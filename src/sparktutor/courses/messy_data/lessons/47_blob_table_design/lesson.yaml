    ## Exercise: A Content-Addressed Media Catalog

    The harness copies the sample media (`images`, `audio`, `pdf`,
    `docs`, `mail`) into an `incoming` folder and adds two random files
    above the 64 KiB inline limit and a copy of
    `images/products/red_16x8.png` under another name. Implement:

    1. `create_tables(spark, tables)`: the three Delta tables by path,
       clustered (`blobs` and `derived` by `content_hash`, `sources` by
       `uri`), with deletion vectors enabled.
    2. `scan(spark, root)`: every file as `uri, content_hash, media_type,
       size, content`, with the media type from magic bytes for PNG, WAV
       and PDF and from the extension for `.md`, `.txt` and `.eml`.
    3. `ingest(spark, scanned, tables, cas_root)`: large contents to the
       CAS (atomically, skipping existing objects), then idempotent
       MERGEs into `blobs` and `sources`.
    4. `derive(spark, tables)`: `png_size` (from a real IHDR only) and
       `wav_rate` for inline blobs, idempotent, with `extractor`.
    5. `forget(spark, tables, uri, cas_root)`: the end-to-end deletion;
       return whether the content was removed.
    6. `compact(spark, table_path)`.

    The harness ingests the media in one batch and the mail one file per
    commit, re-ingests everything (no table may get a new version that
    changes rows), compacts `sources` to one file, runs `derive` twice,
    forgets the duplicate (content must stay), then forgets a PNG and a
    large file and searches every Parquet file under the tables for
    their bytes.
