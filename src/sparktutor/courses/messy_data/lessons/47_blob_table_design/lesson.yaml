    ## A Media Table in Delta 4.4.1

    Create the blobs table with the features this lesson relies on, then
    ask Delta what it built:

    ```python
    spark.sql(f"""CREATE TABLE delta.`{t}` (content_hash STRING, media_type STRING, size BIGINT, content BINARY, uri STRING)
      USING delta CLUSTER BY (content_hash)
      TBLPROPERTIES ('delta.enableDeletionVectors'='true', 'delta.enableRowTracking'='true', 'delta.columnMapping.mode'='name')""")
    d = spark.sql(f"DESCRIBE DETAIL delta.`{t}`").first().asDict()
    for k in ["format", "numFiles", "sizeInBytes", "clusteringColumns", "minReaderVersion", "minWriterVersion", "tableFeatures"]:
        print(k, d.get(k))
    ```

    ```text
    format delta
    numFiles 0
    sizeInBytes 0
    clusteringColumns ['content_hash']
    minReaderVersion 3
    minWriterVersion 7
    tableFeatures ['appendOnly', 'clustering', 'columnMapping', 'deletionVectors', 'domainMetadata', 'invariants', 'rowTracking']
    ```

    Reader version 3 and writer version 7 mean "table features": a
    reader must support every listed feature, so older Delta readers
    and some other engines can't open this table. Enable what you use,
    not everything. What each one buys a media table:

    - **Liquid clustering** (`CLUSTER BY`): `OPTIMIZE` lays files out by
      the clustering columns, so a lookup by hash reads one file. It is
      the alternative to Hive-style partitioning (a table can't have
      both: `PARTITIONED BY` with `CLUSTER BY` is a `ParseException`),
      and you can change the columns later
      (`ALTER TABLE ... CLUSTER BY (uri)` worked on 4.4.1).
    - **Deletion vectors**: `DELETE`, `UPDATE` and `MERGE` mark rows as
      deleted in a small side file instead of rewriting a 128 MB file of
      images. Fast, and a trap for deletion, as you'll see.
    - **Row tracking**: stable row ids and commit versions, readable as
      `_metadata.row_id` and `_metadata.row_commit_version`, which give
      lineage ("which ingest wrote this row?") without your own columns.
    - **Column mapping** (`'name'` mode): Parquet columns get physical
      names, so `RENAME COLUMN` and `DROP COLUMN` are metadata-only.

    Load the sample files (every file under `data/messy`) with
    `binaryFile`:

    ```python
    files = spark.read.format("binaryFile").option("recursiveFileLookup", "true").load("data/messy")
    cat = files.select(sf.sha2("content", 256).alias("content_hash"), sf.lit("x").alias("media_type"),
                       sf.col("length").alias("size"), "content", sf.col("path").alias("uri"))
    cat.write.format("delta").mode("append").save(t)
    ```

