    ## Forgetting a File, End to End

    A deletion request names a file. With the design above, forgetting
    it means:

    1. Delete its row from `sources`.
    2. If another path still points at the same hash, stop: the content
       is still in use (a second copy of the same logo).
    3. Otherwise delete the hash from `blobs` and `derived`, and delete
       the CAS object.
    4. Purge deletion vectors (`REORG ... APPLY (PURGE)`) on the three
       tables and `VACUUM ... RETAIN 0 HOURS` (with the retention check
       off, see above).
    5. Prove it: scan every Parquet file under the tables for a sample of
       the bytes.

    Two things this does not cover, and a real system must: copies
    outside these tables (caches, exports, model training sets), and the
    transaction log, which stores no blob bytes but does keep paths in
    `add`/`remove` actions and column statistics (32-character prefixes
    of `uri`, as you saw) until log cleanup removes old commit files. If
    a path itself is personal data, don't use it as a column with
    statistics; store a hash of it.

    A Delta gotcha you will see while doing this: reading a table that
    has deletion vectors logs
    `ERROR DeltaParquetFileFormat: Failed to translate filter EqualTo(__delta_internal_is_row_deleted,0)`
    with Delta 4.4.1 on Spark 4.2. The results are correct (every check
    in this lesson passes with it in the log); it is noise, not a failed
    query.

