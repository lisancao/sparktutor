    ## Partitioning Versus Clustering for Media

    Hive-style `partitionBy` writes a folder per value. It is a good fit
    for a column with few values that nearly every query filters on, and
    a bad one for everything a media table is usually queried by:

    - **By hash** or by path: one folder per file. Every ingest makes
      tiny files, and listing the table becomes the bottleneck.
    - **By media type**: few values, but very uneven sizes. The video
      partition is huge, the icon partition tiny, and each partition is
      compacted separately.
    - **By ingest date**: useful for retention and incremental
      processing, useless for "find this hash".

    Liquid clustering keeps one flat layout and lets `OPTIMIZE` group
    rows by up to a few columns, and you can change the columns without
    rewriting the table first. For a catalog, cluster `blobs` and
    `derived` by `content_hash` and `sources` by `uri`. If you also need
    time-based retention, filter on an ingest timestamp column; with
    clustering on it too, old data stays in its own files.

