    ## Deletion Vectors and the Bytes They Leave Behind

    Twenty 2000-byte random blobs in one file, with deletion vectors on.
    Delete one row, then look for its bytes on disk:

    ```python
    def files_with(path, needle):
        hits = []
        for f in glob.glob(path + "/**/*.parquet", recursive=True):
            if needle in open(f, "rb").read():
                hits.append(os.path.relpath(f, path))
        return hits

    rng = random.Random(7)
    rows = [(f"id{i}", bytes(rng.getrandbits(8) for _ in range(2000))) for i in range(20)]
    secret = rows[3][1][:64]
    spark.createDataFrame(rows, "id string, content binary").coalesce(1).write.format("delta") \
        .option("delta.enableDeletionVectors", "true").save(t)
    print("files with secret:", files_with(t, secret))
    spark.sql(f"DELETE FROM delta.`{t}` WHERE id = 'id3'")
    print("after DELETE:", files_with(t, secret), spark.read.format("delta").load(t).filter("id='id3'").count())
    print(sorted(os.listdir(t)))
    ```

    ```text
    files with secret: ['part-00000-68b4fd09-6905-437d-bcb6-da02378a28d4-c000.snappy.parquet']
    after DELETE: ['part-00000-68b4fd09-6905-437d-bcb6-da02378a28d4-c000.snappy.parquet'] 0
    ['.deletion_vector_f6b8945a-....bin.crc', '.part-00000-....parquet.crc', '_delta_log', 'deletion_vector_f6b8945a-8c87-4591-a601-bd0c3f336612.bin', 'part-00000-68b4fd09-6905-437d-bcb6-da02378a28d4-c000.snappy.parquet']
    ```

    The row is gone from every query, and its bytes are exactly where
    they were. `DESCRIBE HISTORY` says why: `numDeletionVectorsAdded: 1`,
    no files removed. Without deletion vectors, the same DELETE rewrites
    the file (`numRemovedFiles: 1, numAddedFiles: 1, numCopiedRows: 19`),
    but the **old file is still on disk** too, kept for time travel.

    Making the bytes disappear takes two more steps:

    ```python
    spark.sql(f"REORG TABLE delta.`{t}` APPLY (PURGE)")
    print("after REORG:", files_with(t, secret))
    spark.conf.set("spark.databricks.delta.retentionDurationCheck.enabled", "false")
    spark.sql(f"VACUUM delta.`{t}` RETAIN 0 HOURS")
    print("after VACUUM:", files_with(t, secret))
    spark.conf.unset("spark.databricks.delta.retentionDurationCheck.enabled")
    ```

    ```text
    after REORG: ['part-00000-68b4fd09-6905-437d-bcb6-da02378a28d4-c000.snappy.parquet']
    Deleted 2 files and directories in a total of 1 directories.
    after VACUUM: []
    ```

    `REORG ... APPLY (PURGE)` rewrites files that have deletion vectors
    into new files without the deleted rows, and removes the old ones
    **from the log**: they are still on disk until `VACUUM` deletes
    files that are no longer referenced and older than the retention
    period. The history of that table reads
    `WRITE, DELETE, REORG, VACUUM START, VACUUM END`.

