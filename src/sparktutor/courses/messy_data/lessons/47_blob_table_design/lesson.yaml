    ## Small Files from Continuous Ingestion

    Media arrives a few files at a time: a stream with a short trigger,
    or a job per upload. Each commit adds at least one file, and each
    file adds a footer to read and a task to schedule:

    ```python
    for i in range(12):
        spark.range(i * 10, i * 10 + 10).withColumn("b", sf.lit(b"x" * 100)).coalesce(1) \
            .write.format("delta").mode("append").save(t3)
    print("files", spark.sql(f"DESCRIBE DETAIL delta.`{t3}`").first().numFiles)
    r = spark.sql(f"OPTIMIZE delta.`{t3}`").first()
    print(r.metrics.numFilesAdded, r.metrics.numFilesRemoved)
    print("files", spark.sql(f"DESCRIBE DETAIL delta.`{t3}`").first().numFiles,
          "on disk", len(glob.glob(t3 + "/*.parquet")))
    ```

    ```text
    files 12
    1 12
    files 1 on disk 13
    ```

    `OPTIMIZE` compacted twelve files into one in a new commit; the
    twelve are still on disk until a VACUUM, and time travel to the old
    versions still works. `delta.autoOptimize.autoCompact` exists in Delta
    4.4.1 and does fire: a table with it set to `true` ended 60 one-row
    appends with 11 files. On a clustered table, `OPTIMIZE` also
    clusters:

    ```python
    spark.sql(f"CREATE TABLE delta.`{t2}` (content_hash STRING, size BIGINT) USING delta CLUSTER BY (content_hash)")
    for i in range(8):
        spark.range(i * 5000, (i + 1) * 5000).select(
            sf.sha2(sf.col("id").cast("string"), 256).alias("content_hash"), sf.col("id").alias("size")) \
            .write.format("delta").mode("append").save(t2)
    key = spark.sql("select sha2('12345', 256)").first()[0]
    # files_read() sums the scan's "number of files read" metric, like rows_scanned in "Parquet from the Inside"
    print("before", spark.sql(f"DESCRIBE DETAIL delta.`{t2}`").first().numFiles,
          files_read(spark.read.format("delta").load(t2).filter(sf.col("content_hash") == key)))
    spark.conf.set("spark.databricks.delta.optimize.maxFileSize", 200000)
    spark.sql(f"OPTIMIZE delta.`{t2}`")
    print("after", spark.sql(f"DESCRIBE DETAIL delta.`{t2}`").first().numFiles,
          files_read(spark.read.format("delta").load(t2).filter(sf.col("content_hash") == key)))
    ```

    ```text
    before 16 16
    after 14 1
    ```

    Before clustering every file holds random hashes, so a lookup reads
    all 16. After `OPTIMIZE` (with a small target file size so this tiny
    table makes several files) each file covers a range of hashes and
    the lookup reads one. That is the right layout for a catalog looked
    up by hash.

