    ## Inline Bytes or Pointers

    A blob can live **in** the table (a `BINARY` column) or **next to**
    it (a path or URI in a `STRING` column, the bytes in object storage).
    The trade-off is mostly physics:

    | | Inline `BINARY` | Pointer to object storage |
    |---|---|---|
    | Atomic with the row | yes, one commit | no, two systems to keep in sync |
    | Readable by any engine | yes | only if it can reach the store |
    | Table file sizes | grow with the blobs | stay small |
    | Row groups | a few rows each | thousands of rows |
    | Delete for good | rewrite the file, then vacuum | delete the object |
    | Re-reading content | Parquet decoding | a plain GET, range reads possible |

    Measure the Parquet side yourself. Forty random 1 MB blobs, one file:

    ```python
    rng = random.Random(1)
    blobs = [(i, f"img{i}.bin", bytes(rng.getrandbits(8) for _ in range(1_000_000))) for i in range(40)]
    spark.createDataFrame(blobs, "id int, uri string, content binary").coalesce(1) \
        .write.format("delta").save(t)
    f = glob.glob(t + "/*.parquet")[0]
    md = pq.ParquetFile(f).metadata
    print("file", os.path.getsize(f), "row groups", md.num_row_groups,
          [md.row_group(i).num_rows for i in range(md.num_row_groups)])
    c = md.row_group(0).column(2)
    print(c.path_in_schema, c.total_compressed_size, c.statistics.has_min_max if c.statistics else None)
    ```

    ```text
    file 40003417 row groups 1 [40]
    content 40002032 False
    ```

    Forty rows make one 40 MB row group, and 99.99% of the file is one
    column chunk. Three consequences:

    - **Queries that don't need the bytes are still cheap**, as long as
      they don't select `content`: column pruning skips the whole chunk.
      `spark.read.format("delta").load(t).select("uri").explain()` shows
      `ReadSchema: struct<uri:string>` on the Delta scan. Put cheap metadata
      columns next to the blob and never `SELECT *` on a media table.
    - **Parallelism collapses.** A row group is the unit of a Parquet
      split ("Parquet from the Inside"), so one 128 MB row group of
      images is one task, however many cores you have.
    - **Random binary doesn't compress** (40 MB of content, 40 MB on
      disk), and binary columns get no min/max statistics, so the blob
      column can never help skipping.

    The usual answer is a threshold: inline small files (icons, short
    text, thumbnails) where atomicity is worth it, pointers above it.
    This lesson uses 64 KiB. Blobs above it go to a **content-addressed
    store**: a folder (or bucket) where each object's name is its
    SHA-256, `cas/<first 2 hex>/<hash>`.

