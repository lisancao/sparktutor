    ## Summary

    - Inline small blobs, point to large ones. Inline blobs make one
      huge column chunk per row group, get no statistics, and collapse
      parallelism; column pruning keeps metadata queries cheap if you
      never select `content` by accident.
    - Key content by SHA-256: free de-duplication, idempotent MERGEs,
      stable keys for derived data. Keep paths in their own `sources`
      table, and `dropDuplicates` before merging blobs (an insert-only
      MERGE won't).
    - Delta 4.4.1 on Spark 4.2: liquid clustering (`CLUSTER BY`, laid
      out by `OPTIMIZE`, a hash lookup read 1 of 14 files), deletion
      vectors, row tracking (`_metadata.row_id`), column mapping
      (physical `col-<uuid>` names, random file prefixes, renames),
      `DESCRIBE DETAIL` for features and protocol versions.
    - A DELETE with deletion vectors leaves the bytes in the data file;
      `REORG ... APPLY (PURGE)` rewrites without them and `VACUUM`
      deletes the old files, after the 168-hour retention or with
      `DELTA_VACUUM_RETENTION_PERIOD_TOO_SHORT` disabled deliberately.
    - Derived artifacts are keyed by hash and extractor version, so new
      content, changed content and new code are all an anti-join.
    - Prove deletion by searching the bytes, not by querying the table.

    Next: **Building LSH and an IVF Vector Index**, where the embeddings
    you would store in a derived table become a searchable index.
