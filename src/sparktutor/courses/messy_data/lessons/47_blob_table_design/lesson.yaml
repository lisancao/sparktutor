    ## VACUUM and Its Safety Check

    The default retention is 7 days (168 hours). Asking for less fails:

    ```text
    IllegalArgumentException [DELTA_VACUUM_RETENTION_PERIOD_TOO_SHORT] The specified VACUUM retention period is too low and may corrupt this Delta table if any writes are in progress.
    ```

    The check exists because a running job (a long query, a stream, a
    writer that hasn't committed yet) may still read files that the
    latest version no longer references. Turning it off with
    `spark.databricks.delta.retentionDurationCheck.enabled=false` is
    reasonable for a deletion you must complete now on a table you
    control; on a shared table, run the deletion and wait out the
    retention instead, or shorten `delta.deletedFileRetentionDuration`
    deliberately and tell the readers. VACUUM also ends time travel to
    versions whose files it deleted, which is the point for a deletion
    request and a loss for everything else.

    `VACUUM ... DRY RUN` lists what would go. On a freshly written table
    with the default retention it lists nothing: every file is younger
    than 168 hours.

