    ## Derived Artifacts That Stay Consistent

    Thumbnails, extracted text, image dimensions, embeddings: every
    derived artifact is a function of the **bytes** and of the **code**
    that computed it. Key it by both:

    ```text
    derived (content_hash, artifact, extractor, value)
             ab12...       png_size  headers-v1 32x32
    ```

    - **New content** gets artifacts by an anti-join: candidates minus
      what `derived` already has for this extractor version, then an
      insert-only MERGE. Running it twice adds nothing.
    - **Changed content** (a file overwritten in place) has a new hash.
      The `sources` MERGE repoints the path
      (`WHEN MATCHED AND t.content_hash <> s.content_hash THEN UPDATE`),
      and the new hash has no artifacts yet, so the anti-join picks it
      up. Old artifacts belong to the old hash and stay valid for any
      other path that still has it.
    - **New code** (`headers-v2`) is a new extractor value: compute it
      alongside, switch readers, delete the old rows.
    - **Deleted content** takes its artifacts with it: delete by hash.

    Messy inputs need guards in the extractor. `images/scans/corrupt.png`
    starts with the PNG signature and then says `not really a png`; an
    extractor that reads width and height from bytes 17 to 24 without
    checking for the `IHDR` chunk at bytes 13 to 16 would store garbage
    dimensions for it.

    Derived columns that are expensive and small (an embedding is a few
    KB) belong in their own table rather than as columns of `blobs`:
    recomputing them never rewrites the files that hold the blobs, and
    their files stay small enough for fast scans.

