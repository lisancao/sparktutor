    ## What the Log Records About Blobs

    Open the commit that added the files (`_delta_log/00000000000000000001.json`).
    Each `add` action carries per-file statistics; this is one, from the
    run behind this lesson:

    ```text
    {"add":{"path":"5h/part-00000-48228e87-...-c000.snappy.parquet","size":56289,
     "stats":"{\"numRecords\":32,
       \"minValues\":{\"col-6300247c-...\":\"03505f0117ceae57079104178b196847\",
                      \"col-62c177c1-...\":1072,
                      \"col-b84e968d-...\":\"file:/tmp/sparktutor_5umccve8/da\", ...},
       \"maxValues\":{\"col-6300247c-...\":\"f5d65693d8e9ffae7dfe2c0b9d265106\", ...},
       \"nullCount\":{..., \"col-f633c139-...\":0, ...},
       \"tightBounds\":true}",
     "baseRowId":0,"defaultRowCommitVersion":1}}
    ```

    Read it like a footer:

    - Columns appear by **physical name** (`col-<uuid>`), the effect of
      column mapping. Renaming `uri` changes only the table metadata.
    - The 64-character hashes and the paths are **truncated to 32
      characters** in min/max. Skipping by hash still works (the prefix
      is enough to exclude most files), it just can't be exact.
    - The `content` column (`col-f633...`) has a null count and **no
      min/max**, like the Parquet statistics of a binary column.
    - `baseRowId` and `defaultRowCommitVersion` are row tracking: row ids
      for this file start at 0, and its rows were written by version 1.
    - The data file sits in a short random folder (`5h/`). Testing
      tables with and without each feature, that came from column
      mapping, not from clustering:

      ```text
      cm False ['Ei', 'QG']
      cm True ['fd', 'tm']
      plain False ['part-00000-b64c63da-...-c000.snappy.parquet', 'part-00001-...']
      plain True ['part-00000-f415456d-...-c000.snappy.parquet', 'part-00001-...']
      ```

      Don't write tooling that expects data files at the table root.

    Column mapping is also what makes renames possible at all. Without
    it:

    ```text
    AnalysisException [DELTA_UNSUPPORTED_RENAME_COLUMN] Column rename is not supported for your Delta table.
    ```

    With it, `ALTER TABLE ... RENAME COLUMN uri TO source_uri` succeeds
    and the columns read back as
    `['content_hash', 'media_type', 'size', 'content', 'source_uri']`.
    Row tracking shows up the same way:

    ```python
    spark.read.format("delta").load(t).select("_metadata.row_id", "_metadata.row_commit_version").limit(3).collect()
    ```

    ```text
    [Row(row_id=12, row_commit_version=1), Row(row_id=13, row_commit_version=1), Row(row_id=14, row_commit_version=1)]
    ```

