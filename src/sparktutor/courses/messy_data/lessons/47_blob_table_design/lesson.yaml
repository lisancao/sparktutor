    ## Content Addressing

    Key every blob by the hash of its bytes, not by its path:

    - **De-duplication is free.** The same logo uploaded under five names
      is one blob row and one stored object.
    - **Writes are idempotent.** Re-ingesting a folder computes the same
      hashes; a `MERGE ... WHEN NOT MATCHED THEN INSERT` finds them all
      and inserts nothing.
    - **Derived data has a stable key.** A thumbnail or an embedding of
      hash `ab12...` is valid for any path that has those bytes, and
      becomes stale only when the bytes change, which changes the hash.
    - **Integrity is checkable.** Recompute the hash of a stored object
      and compare it with its name.

    Paths still matter (people delete files, not hashes), so keep two
    tables: `blobs` (one row per distinct content) and `sources` (one row
    per path, pointing at a hash). The design:

    ```text
    sources  (uri, content_hash, size)                 one row per file path
        |
        v
    blobs    (content_hash, media_type, size,          one row per distinct content
              content  -- inline, or NULL
              blob_uri -- cas/<h[:2]>/<h>, or NULL)
        |
        v
    derived  (content_hash, artifact, extractor, value) one row per artifact and extractor version
    ```

    `sha2(content, 256)` computes the hash in Spark; for files too large
    to read as one value ("Memory, Spill and Very Large Files"), hash
    them in chunks where they are written and store the result.

    One MERGE rule bites immediately. A batch that contains the same
    content twice (two paths, same bytes) must be de-duplicated before
    it is merged, or a `WHEN MATCHED` clause fails:

    ```python
    spark.createDataFrame([("h1", 1)], "h string, v int").write.format("delta").save(t5)
    src = spark.createDataFrame([("h1", 2), ("h1", 3), ("h2", 4), ("h2", 5)], "h string, v int")
    src.createOrReplaceTempView("src")
    spark.sql(f"MERGE INTO delta.`{t5}` t USING src s ON t.h = s.h "
              "WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *")
    ```

    ```text
    UnsupportedOperationException [DELTA_MULTIPLE_SOURCE_ROW_MATCHING_TARGET_ROW_IN_MERGE] Cannot perform Merge as multiple source rows matched and attempted to modify the same ...
    ```

    And an insert-only MERGE has the opposite trap: it does **not**
    check duplicates among the rows it inserts. Merging only the two
    `h2` rows inserted both:

    ```text
    [Row(h='h1', v=1), Row(h='h2', v=4), Row(h='h2', v=5)]
    MERGE {'numTargetRowsInserted': '2', 'numSourceRows': '2', ...}
    ```

    So `dropDuplicates(["content_hash"])` before every blob MERGE.

