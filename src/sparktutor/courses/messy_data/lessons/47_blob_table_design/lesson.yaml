    ## What You'll Learn

    "Files as Files: binaryFile, Globs and Metadata" and "Images and
    Audio" read unstructured files into DataFrames, "Landing Messy Data
    in Delta Lake" put messy records into Delta tables (MERGE, time
    travel, history), "Memory, Spill and Very Large Files" showed what
    big binary values do to a Spark job, and "Parquet from the Inside"
    showed how a column chunk is laid out on disk. This lesson puts those
    together into one design question: **how do you store unstructured
    data in tables** so that it stays cheap to query, correct when the
    sources change, and deletable when someone asks you to forget a
    file?

    By the end you will be able to:

    - Choose between inline bytes and pointers for each blob, and explain
      what each choice does to Parquet files, row groups and queries
    - Build a content-addressed catalog (hash as key) that de-duplicates
      and re-ingests idempotently with `MERGE`
    - Use the Delta Lake 4.4.1 features that matter for media tables,
      each verified on Spark 4.2: deletion vectors, row tracking, liquid
      clustering, `OPTIMIZE`, `VACUUM` and its retention check, column
      mapping, `DESCRIBE DETAIL`
    - Keep derived artifacts (dimensions, extracted text, embeddings)
      consistent with their sources, keyed by hash and versioned
    - Delete a source file end to end, and prove that no copy of its
      bytes is left in any data file

    Every example runs with `# spark-connectors: delta` (Delta 4.4.1 for
    Spark 4.2). Outside SparkTutor, the same session comes from
    `spark-submit --packages io.delta:delta-spark_4.2_2.13:4.4.1` with
    `spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension` and
    `spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog`.
    Always read with `.format("delta")`: a Delta folder read as plain
    Parquet silently returns deleted and superseded rows.

