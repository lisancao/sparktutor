- Class: text
  Depth: advanced
  Output: |
    ## Details Worth Knowing

    - **The numbered fields.** In `ReadSchema: struct<v:struct<0:string,1:double>>`
      each number is one requested extraction. The struct fields carry
      the path, the target type and whether the extraction is `try_` in
      their metadata, and the Parquet reader resolves each one against
      the file's own shredding schema. That is how one query can read
      files that were shredded differently.
    - **A forced schema.** `spark.sql.variant.forceShreddingSchemaForTest`
      exists, but as the name says it is for Spark's own tests. There is
      no public API in 4.2 to choose the shredding schema yourself; to
      control the layout, promote fields to columns.
    - **Turning it off.** If a writer of very large, chaotic payloads
      spends too long inferring, set the writer option
      `spark.sql.variant.inferShreddingSchema` to `false` for that write.
      With `spark.sql.variant.writeShredding.enabled=false` the footer is
      back to `v.value` and `v.metadata` only.
    - **Integers versus doubles.** JSON `1.5e3` parses to a VARIANT
      `DOUBLE`, while `12.34` parses to a `DECIMAL(4,2)`. A field mixing
      `1` and `2.5` is shredded as a decimal; a field mixing `1` and
      `1.5e3` is not shredded at all.

