    ## Shredding: VARIANT Split Into Typed Columns

    The Parquet format defines a **shredded** layout for VARIANT. For
    each field that is shredded, the file has a small group with two
    columns:

    - `typed_value`: the field as a real Parquet type (string, int64,
      decimal, ...), when the row's value has that type
    - `value`: a binary fallback for rows where the field has some other
      type

    Readers reassemble the original VARIANT from both, so shredding never
    changes query results; it only changes how fast you get them.

    Spark 4.0 can read shredded files and push variant field requests
    into the Parquet scan (SPARK-50615). Spark 4.1 made the Parquet
    writer **infer a shredding schema on its own** (SPARK-53659) and
    turned the shredding settings on by default (SPARK-54454), so every
    VARIANT column you write to Parquet in Spark 4.1 and 4.2 is shredded
    without you asking. Shredding is part
    of the Parquet format, so only the Parquet writer does it.

    The settings, with their 4.2.0 defaults (all are marked internal, so
    they do not appear in the public configuration docs):

    | Setting | Default | Since |
    |---|---|---|
    | `spark.sql.variant.writeShredding.enabled` | `true` | 4.0 |
    | `spark.sql.variant.inferShreddingSchema` | `true` | 4.1 |
    | `spark.sql.variant.shredding.maxSchemaWidth` | `300` | 4.1 |
    | `spark.sql.variant.shredding.maxSchemaDepth` | `50` | 4.1 |
    | `spark.sql.variant.pushVariantIntoScan` | `true` | 4.0 |

    `writeShredding.enabled` is the master switch: with it off, nothing is
    shredded. `inferShreddingSchema` can also be set for one write, as a
    writer option:

    ```python
    df.write.option("spark.sql.variant.inferShreddingSchema", "false").parquet(path)
    ```

