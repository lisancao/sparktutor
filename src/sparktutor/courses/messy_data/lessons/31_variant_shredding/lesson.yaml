    ## Why `amount` Was Not Shredded

    Remember the drift from "JSON Drift and Quarantine": on day one
    `amount` is a number, on day two it is sometimes the string `"32.83"`,
    and on day three it is an object `{"value": 29.93, "currency": "CAD"}`.
    A `typed_value` column has one Parquet type, so there is no type that
    fits all three. Spark gives up on that field and keeps it binary.

    The inference rules, from `InferVariantShreddingSchema` in the 4.2.0
    source:

    - **Spark looks at a sample, per file.** The writer buffers the first
      4096 rows of each output file (or 64 MB, whichever comes first),
      infers a schema from them, and then writes the whole file with it.
      A field that first appears after that sample is not shredded in
      that file.
    - **Rare fields are dropped.** A field that appears in fewer than 10%
      of the non-null values gets no column of its own.
    - **Scalar types must agree.** Integers and decimals merge (into a
      decimal), but a number and a string, or a long and a double, do
      not; the field falls back to binary.
    - **Types are widened.** Every integer becomes `INT64`, and decimals
      become `DECIMAL(18, s)` (or `DECIMAL(38, s)` when they need more
      digits).
    - **There is a budget.** At most `maxSchemaWidth` (300) columns per
      file, counting both `value` and `typed_value` columns, and nothing
      deeper than `maxSchemaDepth` (50) levels.
    - **Only VARIANT at the top level or inside structs is shredded.** A
      VARIANT nested inside an `ARRAY` or `MAP` column of your table is
      written unshredded. (Arrays *inside* a VARIANT value, like
      `items`, are fine.)

