    ## When a Cast Fails Inside the Scan

    Pushing extractions into the scan has a side effect on errors.
    `variant_get` (without `try_`) fails when a value cannot be cast, and
    on day three `amount` is an object:

    ```python
    spark.read.parquet("/tmp/events_v") \
        .select(sf.variant_get("v", "$.amount", "double")).collect()
    ```

    On the JSON source you get a clean
    `SparkRuntimeException [INVALID_VARIANT_CAST]`. On Parquet, the cast
    now runs inside the file reader, so the job fails with
    `FAILED_READ_FILE.NO_HINT` ("Encountered error while reading file
    ...") and `INVALID_VARIANT_CAST` appears only as the **cause**,
    further down the stack trace. In a `spark-submit` script PySpark
    raises it as a raw `py4j.protocol.Py4JJavaError`, not as a
    `PySparkException`, so an `except PySparkException` handler does not
    catch it. (With `spark.sql.variant.pushVariantIntoScan=false` the
    same query raises the clean `INVALID_VARIANT_CAST`.) This happens
    whether or not the file is shredded.

    Two habits avoid it: use `try_variant_get` for fields you have not
    normalized, and when a Parquet read fails with `FAILED_READ_FILE`,
    scroll to the `Caused by:` line before blaming the file.

