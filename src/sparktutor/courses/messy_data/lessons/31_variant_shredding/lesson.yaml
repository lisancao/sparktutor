    ## Reading Only the Field You Need

    Shredding pays off when a query asks for a field and Spark reads just
    its column. The rule that does this, `pushVariantIntoScan`, rewrites
    variant extractions into a request to the Parquet reader. You can see
    the request in the plan's `ReadSchema`:

    ```python
    v = spark.read.parquet("/tmp/events_v")
    v.groupBy(sf.try_variant_get("v", "$.user.plan", "string").alias("plan")) \
        .count().explain()
    ```

    ```text
    FileScan parquet [v#24] ... ReadSchema: struct<v:struct<0:string>>
    ```

    `struct<0:string>` means "from `v`, give me one field (numbered 0),
    as a string". The reader takes it from the shredded `plan` column and
    never touches the rest of the payload.

    Now the trap. The shorthand `v:user.plan::string` looks equivalent,
    and it returns the same rows, but the plan differs:

    ```text
    ReadSchema: struct<v:struct<0:variant>>
    ```

    `v:user.plan` extracts a **VARIANT**, and `::string` casts it after
    the scan. The reader has to rebuild the `user.plan` VARIANT for every
    row, and a filter on it is not handed to Parquet:

    ```python
    v.filter(sf.try_variant_get("v", "$.user.plan", "string") == "pro")
    # PushedFilters: [IsNotNull(v), EqualTo(v.`1`,pro)]

    v.filter("v:user.plan::string = 'pro'")
    # PushedFilters: [IsNotNull(v)]
    ```

    When performance matters, extract with
    `variant_get`/`try_variant_get(v, path, type)` and name the type in
    the call.

