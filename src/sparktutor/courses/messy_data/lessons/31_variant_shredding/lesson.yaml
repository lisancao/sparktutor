    ## How a VARIANT Value Is Stored

    A VARIANT value is two binary blobs:

    - **metadata**: a dictionary of the field names used in the value
      (`amount`, `user`, `id`, ...), stored once per value
    - **value**: the data itself, in a compact self-describing binary
      format. Every scalar carries its own type tag (string, long,
      decimal, ...), and every object lists its fields by their index in
      the dictionary.

    Without shredding, a Parquet file with a VARIANT column `v` has exactly
    two physical columns:

    ```text
    optional group v (Variant(1)) {
      required binary value;
      required binary metadata;
    }
    ```

    That is already much better than JSON text: Spark never re-parses
    characters, and it can jump to a field without scanning the whole
    document. But to answer `SELECT v:user.plan` it still has to read
    every row's full `value` blob from disk, decode it, and find the
    field. A query that touches one small field pays for the whole
    payload, and Parquet's tricks for typed columns (column pruning,
    dictionary encoding, min/max statistics) cannot help, because to
    Parquet the column is just bytes.

- Class: text
  Depth: beginner
  Output: |
    Think of an unshredded VARIANT column as a stack of sealed envelopes,
    one per row. To find every customer's plan you must open every
    envelope and read the letter inside.

    Shredding is like a clerk who, while filing the envelopes, copies the
    fields that appear in almost every letter (plan, user id, event type)
    onto a printed form with labeled boxes. Next time you want the plan,
    you read one column of boxes and never open an envelope. Anything that
    does not fit the form (a field that is sometimes a number and
    sometimes a word) stays in the envelope.

