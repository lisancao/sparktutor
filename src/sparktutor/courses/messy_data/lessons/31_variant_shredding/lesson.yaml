- Class: text
  Depth: all
  Output: |
    ## Summary

    - A VARIANT value is a **metadata** dictionary plus a binary
      **value**. Unshredded, a query reads and decodes the whole blob.
    - Since **Spark 4.1** the Parquet writer infers a **shredding**
      schema (SPARK-53659) and splits stable fields into `typed_value`
      columns, with a binary `value` fallback per field.
    - Inference is **per file**, from the first **4096 rows** (or 64 MB);
      fields under **10%** of rows and fields whose types disagree stay
      binary. That is why `amount` is shredded on day one and not in the
      mixed file.
    - Read the footer with `pyarrow.parquet.ParquetFile(f).schema` to see
      the layout for yourself.
    - `try_variant_get(v, path, type)` lets the scan read one typed
      column (`ReadSchema: struct<v:struct<0:string>>`); `v:path::type`
      rebuilds a VARIANT first and does not push filters.
    - With the scan pushdown, a failed `variant_get` cast on Parquet
      surfaces as `FAILED_READ_FILE.NO_HINT` caused by
      `INVALID_VARIANT_CAST`.
    - Promote the fields every query depends on to typed columns, keep
      the payload as VARIANT for the long tail.

    Next: **Tuning Python on Spark**, where you find where a Python-heavy
    job spends its time and fix it.