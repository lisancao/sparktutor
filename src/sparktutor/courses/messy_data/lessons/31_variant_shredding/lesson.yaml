    ## What It Buys You

    An indicative measurement on a laptop (`local[4]`, 1 million rows of
    small JSON documents with a long string field, best of three runs;
    your numbers will differ):

    | Storage | Query: rows per `user.plan` | Time |
    |---|---|---|
    | JSON text, `get_json_object` | parse every document | 0.67 s |
    | VARIANT Parquet, unshredded, `::string` | decode every blob | 0.31 s |
    | VARIANT Parquet, unshredded, `try_variant_get` | decode every blob | 0.26 s |
    | VARIANT Parquet, shredded, `::string` | rebuild one field | 0.27 s |
    | VARIANT Parquet, shredded, `try_variant_get` | read one column | 0.16 s |

    The files were 158 MB of JSON, 76 MB unshredded and 70 MB shredded:
    shredding did not cost space here, because the typed columns encode
    better than the same values inside binary blobs. The bigger the
    payload compared to the fields you query, the bigger the gap.

    Shredding is not free, though. The writer buffers up to 4096 rows per
    file to infer the schema, and a wide or chaotic payload produces a
    wide footer with mostly binary fallbacks.

- Class: text
  Depth: all
  Output: |
    ## When to Stop Using VARIANT

    VARIANT is the right type for the **long tail**: fields that are new,
    rare, nested in shapes you have not settled, or that you only display.
    It is the wrong type for the fields your pipeline depends on. Promote
    a field to a real column when:

    - **Every query uses it** (keys, timestamps, amounts). A typed column
      gets Parquet statistics, filter pushdown and partitioning, with no
      dependence on what the shredding sample saw.
    - **It has drifted and you have decided its meaning.** `amount` has
      three shapes; the business has one meaning. Put the `coalesce`
      over the shapes in one place (the silver table), not in every
      query.
    - **You need constraints or a stable contract.** A downstream table
      or a BI tool should see `amount DOUBLE`, not a VARIANT it has to
      probe.

    Keep the whole payload next to the typed columns, so nothing is lost
    and a field can be promoted later without going back to the raw
    files:

    ```python
    silver = events.filter("v IS NOT NULL").select(
        sf.coalesce(sf.try_variant_get("v", "$.event", "string"),
                    sf.try_variant_get("v", "$.event_type", "string")).alias("event"),
        sf.coalesce(sf.try_variant_get("v", "$.amount", "double"),
                    sf.try_variant_get("v", "$.amount.value", "double")).alias("amount"),
        sf.col("v").alias("payload"),
    )
    ```

    A filter on the promoted column is pushed to Parquet like any other:
    `PushedFilters: [IsNotNull(plan), EqualTo(plan,pro)]`.

