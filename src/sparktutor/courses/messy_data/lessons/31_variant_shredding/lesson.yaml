    ## What You'll Learn

    In "VARIANT Basics: Profiling and Nested Data" you loaded the drifting
    events into a VARIANT column and profiled their keys. That lesson
    treated VARIANT as a convenient type. This one looks at what happens
    when you **store** it.

    By the end of this lesson you will be able to:

    - Explain how a VARIANT value is encoded, and why that is slower to
      query than a typed column
    - Describe **shredding**: how Spark 4.1+ splits a VARIANT column into
      typed Parquet columns when it writes
    - Read a Parquet footer with pyarrow and see which fields were
      shredded, and why the others were not
    - Write queries that let Spark read only the shredded field they need
    - Recognize the error you get when a cast fails inside the scan
    - Decide which fields to promote to real columns, and when to stop
      using VARIANT

    Like "Filter Pushdown", this lesson's code imports
    `pyspark.sql.functions as sf`; it is the same module other lessons
    call `F`.

