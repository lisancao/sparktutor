    ## Look Inside the File

    You do not have to take shredding on faith: the Parquet footer lists
    every physical column, and pyarrow (installed with PySpark) can read
    it without Spark.

    ```python
    import glob
    import pyarrow.parquet as pq

    events = spark.read.option("singleVariantColumn", "v").json("data/messy/events")
    events.coalesce(1).write.mode("overwrite").parquet("/tmp/events_v")

    f = glob.glob("/tmp/events_v/*.parquet")[0]
    schema = pq.ParquetFile(f).schema
    for i in range(len(schema)):
        c = schema.column(i)
        print(c.path, c.physical_type, c.logical_type)
    ```

    Part of the output for the three days of events:

    ```text
    v.metadata BYTE_ARRAY None
    v.value BYTE_ARRAY None
    v.typed_value.amount.value BYTE_ARRAY None
    v.typed_value.event.value BYTE_ARRAY None
    v.typed_value.event.typed_value BYTE_ARRAY String
    v.typed_value.items.typed_value.list.element.typed_value.sku.typed_value BYTE_ARRAY String
    v.typed_value.user.typed_value.id.value BYTE_ARRAY None
    v.typed_value.user.typed_value.id.typed_value INT64 None
    v.typed_value.user.typed_value.plan.typed_value BYTE_ARRAY String
    ...
    ```

    Read each path from left to right: the column `v`, its shredded
    object (`typed_value`), the field `user`, its shredded object, the
    field `id`, and finally its typed column, an INT64. Arrays add
    `list.element`, so `items[].sku` is shredded too.

    Now look at `amount`: it has a `value` column and **no**
    `typed_value`. Every amount lives in the binary fallback.

