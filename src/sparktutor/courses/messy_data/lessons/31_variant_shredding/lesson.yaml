    ## Shredding Is Decided Per File

    Because inference runs on each output file's own sample, two files
    in the same table can be shredded differently. Write each day of
    events to its own file and compare the footers:

    ```text
    day=2026-10-01  amount, event, ts, user_id
    day=2026-10-02  event, items[].qty, items[].sku, ts, user.id, user.plan
    day=2026-10-03  amount.currency, amount.value, event_type, items[].qty,
                    items[].sku, ts, user.geo.country, user.id, user.plan
    ```

    On day one `amount` is always a decimal, so it is shredded as
    `DECIMAL(18,2)`. On day three it is always an object, so its two
    subfields are shredded. Day two, where `amount` is sometimes a number
    and sometimes a string, loses it, and so does a file that mixes all
    three days.

    This has practical consequences:

    - Readers handle any mix of layouts, so correctness never depends on
      it. Speed does.
    - How you lay out files changes how well they shred. Partitioning by
      something that separates the shapes (a schema version, a source
      system) gives each file a cleaner sample. One giant `coalesce(1)`
      across every shape gives the worst one.
    - Compacting or rewriting a table re-infers the schema from the new
      files' samples.

    The rarity rule works the same way. In a file of 100 rows where a
    key `rare` appears in 5 rows, it gets no column; in 10 rows, it does.

