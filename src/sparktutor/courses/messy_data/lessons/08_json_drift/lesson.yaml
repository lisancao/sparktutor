    ## Is the Union Schema Always the Answer?

    One wide schema with `coalesce` works well while the versions are a
    handful of field changes. When shapes diverge further, other designs
    scale better:

    - **Version field**: if producers add `"schema_version": 3`, read
      each version with its own schema and union the normalized outputs.
    - **VARIANT**: keep each record as one semi-structured value and
      pull fields out at query time. "VARIANT Basics: Profiling and
      Nested Data" does exactly this on the same files, with no schema
      at all.
    - **A contract at the source**: a schema registry or JSON Schema
      check where the data is produced stops drift before it reaches
      you.

    Databricks has a `rescuedDataColumn` option that collects fields that
    did not fit the schema. It is not part of Apache Spark (there is no
    such option in the 4.2.0 source); in OSS Spark, the STRING-and-parse
    pattern above, or VARIANT, fills that role.

- Class: text
  Depth: all
  Output: |
    ## Nested Arrays: explode Versus explode_outer

    Day 2 and day 3 events carry an `items` array; day 1 events have
    none. Turning items into rows is a job for the generator functions:

    | Function | Input row with NULL or empty array | Output columns |
    |----------|------------------------------------|----------------|
    | `explode(items)` | dropped | one column, `col`, holding each struct |
    | `explode_outer(items)` | one row with NULL | `col` |
    | `inline(items)` | dropped | one column per struct field (`sku`, `qty`) |
    | `inline_outer(items)` | one row of NULLs | `sku`, `qty` |

    On the 61 records read with `EVENT_SCHEMA`, `explode` gives 61 rows
    (one per item) and `inline_outer` gives 82 (one per item plus one for
    each of the 21 records without items). The difference matters as
    soon as you join or count: with `explode`, every day 1 event vanishes
    from the result, and nothing warns you.

    ```python
    items = silver.select("ts", "user_id", F.inline_outer("items"))
    ```

    Use the `_outer` forms by default, then filter out the NULL rows
    explicitly when you really mean "only events with items". The
    decision is then visible in your code.

