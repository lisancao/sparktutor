    Think of schema inference as someone reading every form in a pile
    and drawing one blank form that fits them all. If one form wrote the
    price as "12.50" and another as "twelve fifty", the only box that fits
    both is "write anything here". That is what `string` means in the
    inferred schema: Spark kept the value but stopped understanding it.

