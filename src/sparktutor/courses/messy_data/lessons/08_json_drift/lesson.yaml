    ## Parse Modes

    The `mode` option decides what happens to a line that cannot be
    parsed:

    | mode | Malformed line becomes | On these files |
    |------|------------------------|----------------|
    | `PERMISSIVE` (default) | a row of NULLs, with the raw text in the corrupt record column if there is one | 61 rows |
    | `DROPMALFORMED` | nothing: the row is silently dropped | 60 rows |
    | `FAILFAST` | an error | fails |

    `FAILFAST` fails earlier than you might expect: when the schema is
    inferred, the error comes from `spark.read...json(path)` itself,
    before any action, as
    `MALFORMED_RECORD_IN_PARSING.WITHOUT_SUGGESTION` ("Malformed records
    are detected in record parsing"). With an explicit schema it fails at
    the first action instead, as a `FAILED_READ_FILE.NO_HINT` error
    caused by the same `MALFORMED_RECORD_IN_PARSING` error; and with an
    explicit schema, a value of the wrong type (a string where you
    declared a `DOUBLE`) counts as malformed too.

    `DROPMALFORMED` is tempting and dangerous: it loses data and tells
    nobody. `FAILFAST` is right for inputs that must be perfect (a
    reference table you control). For everything else, use `PERMISSIVE`
    with a corrupt record column, and quarantine.

