    ## What You'll Learn

    JSON is self-describing, which sounds like it should make it easy.
    The catch is that nothing stops the description from changing.
    Producers add fields, rename them, nest them, and change a number
    into a string or an object, usually without telling the people who
    read the data. This is called **schema drift**, and it is the normal
    state of JSON in production.

    By the end of this lesson you will be able to:

    - Predict what schema inference does when types and shapes drift
    - Choose between the `PERMISSIVE`, `DROPMALFORMED` and `FAILFAST`
      parse modes, and know when each one fails
    - Capture malformed records with `columnNameOfCorruptRecord`, and
      avoid the `QUERY_ONLY_CORRUPT_RECORD_COLUMN` error
    - Write one explicit schema that absorbs drift, then unify renamed and
      moved fields with `coalesce`
    - Explode nested arrays without losing rows (`explode_outer`,
      `inline_outer`)
    - Parse JSON that sits inside a text column with `from_json` and
      `schema_of_json`

    Prerequisites: none beyond this course; "Text and Logs" introduced
    quarantining rejected lines, and "CSV and Delimited Files" the
    corrupt record column.

