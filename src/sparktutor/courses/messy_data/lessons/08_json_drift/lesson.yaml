    ## Absorbing Drift: STRING for the Fields That Change

    Declare the drifting field as `STRING`. When the schema says string,
    the JSON reader keeps whatever is there **as text**: a number such as
    `6.13`, a string such as `"32.83"`, or a whole object as its raw
    JSON `{"value": 29.93, "currency": "CAD"}`. Nothing is flagged, so
    only truly broken lines reach the corrupt column:

    ```python
    EVENT_SCHEMA = """
        event STRING, event_type STRING, user_id BIGINT,
        user STRUCT<id: BIGINT, plan: STRING, geo: STRUCT<country: STRING>>,
        amount STRING,
        items ARRAY<STRUCT<sku: STRING, qty: INT>>,
        ts TIMESTAMP,
        _corrupt STRING
    """
    ```

    Now one quarantined line in three files, and you decide how to read
    `amount`, trying each shape in turn:

    ```python
    amount = F.coalesce(
        F.col("amount").try_cast("double"),                          # 12.5 or "12.5"
        F.get_json_object("amount", "$.value").try_cast("double"))  # {"value": 12.5}
    ```

    `try_cast` (4.0 as a `Column` method) returns NULL where a plain
    `cast` would fail under ANSI mode, and `get_json_object` reads one
    path out of a JSON string. `coalesce` returns the first non-NULL
    reading.

    The same schema covers the other kinds of drift. A field that is
    missing from a record is simply NULL (no error), so renames and moves
    become `coalesce` calls too:

    ```python
    F.coalesce("event_type", "event")              # renamed
    F.coalesce(F.col("user.id"), F.col("user_id"))  # moved into an object
    ```

