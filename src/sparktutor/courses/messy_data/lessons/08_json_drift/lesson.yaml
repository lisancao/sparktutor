    ## Three Days of Drift

    `data/messy/events/` holds one file per day of order events, one JSON
    object per line (the "JSON Lines" layout that `spark.read.json`
    expects by default):

    ```
    day 1: {"event": "view", "user_id": 0, "amount": 6.13, "ts": "2026-10-01T10:00:00"}
    day 2: {"event": "purchase", "user": {"id": 0, "plan": "pro"}, "amount": "32.83",
            "items": [{"sku": "P4", "qty": 3}, ...], "ts": "2026-10-02T11:00:00"}
    day 3: {"event_type": "purchase", "user": {"id": 0, "plan": "pro", "geo": {"country": "US"}},
            "amount": {"value": 29.93, "currency": "CAD"}, "items": [{"sku": "P4", "qty": 1}],
            "ts": "2026-10-03T12:00:00"}
           {"event_type": "purchase", "user": {"id": 9           <- truncated line
    ```

    Every kind of drift is here:

    | Change | Example |
    |--------|---------|
    | type change | `amount`: number, then sometimes a string, then an object |
    | move | `user_id` becomes `user.id` |
    | rename | `event` becomes `event_type` |
    | new fields | `items`, `user.plan`, `user.geo.country` |
    | broken record | the last line of day 3 is cut off |

