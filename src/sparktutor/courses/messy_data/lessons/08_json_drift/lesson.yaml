    ## Summary

    In this lesson you learned:

    - **Inference unions fields and widens conflicting types to
      string**, leaves timestamps as strings unless `inferTimestamp` is
      set, costs an extra pass, and changes when the files change.
    - **Parse modes**: `PERMISSIVE` (default) keeps every line,
      `DROPMALFORMED` silently drops, `FAILFAST` fails (at `read` time
      when inferring, with `MALFORMED_RECORD_IN_PARSING.WITHOUT_SUGGESTION`).
    - **The corrupt record column** must be declared in an explicit
      schema and named with `columnNameOfCorruptRecord`. Querying it
      alone raises `UNSUPPORTED_FEATURE.QUERY_ONLY_CORRUPT_RECORD_COLUMN`;
      cache first.
    - **Strict types flag whole records** but keep the fields that
      parsed. Declare drifting fields as `STRING` and read every shape
      with `coalesce`, `try_cast` and `get_json_object`.
    - **Renames and moves** are `coalesce` over the old and new names.
    - **`explode` and `inline` drop rows** with NULL or empty arrays;
      the `_outer` forms keep them.
    - **JSON in text columns**: `from_json` with a DDL from
      `schema_of_json(F.lit(sample))`; malformed input gives a struct of
      NULLs; only `PERMISSIVE` and `FAILFAST` are supported.

    Next: **Complex Types and Higher-Order Functions**, where you work
    with the structs, arrays and maps inside these events directly.