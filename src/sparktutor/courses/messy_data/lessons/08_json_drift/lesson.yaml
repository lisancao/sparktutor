    ## Explicit Schemas: Strict Types Quarantine Too Much

    An explicit schema fixes the cost and the instability of inference.
    The natural first attempt declares what the data "should" be:

    ```python
    strict = """event STRING, event_type STRING, user_id BIGINT,
                user STRUCT<id BIGINT, plan STRING>, amount DOUBLE,
                ts TIMESTAMP, _bad STRING"""
    s = (spark.read.schema(strict)
         .option("columnNameOfCorruptRecord", "_bad")
         .json("data/messy/events"))
    ```

    ```
    +----------------------+---+---------+---+
    |file                  |n  |amount_ok|bad|
    +----------------------+---+---------+---+
    |events_2026-10-01.json|20 |20       |0  |
    |events_2026-10-02.json|20 |15       |5  |
    |events_2026-10-03.json|21 |0        |21 |
    +----------------------+---+---------+---+
    ```

    Day 2's five string amounts and every one of day 3's object amounts
    now count as malformed. Two details matter:

    - A record is flagged as a whole: `_bad` holds the entire raw line,
      even though only `amount` failed.
    - The fields that did parse are still filled in. Those day 3 rows
      still have their `event_type`, `user` and `ts`; only `amount` is
      NULL. So a flagged row is not empty, and code that keeps "rows where
      `_bad` is NULL" throws away good data along with the bad field.

    Strict types are the right choice when a type change really is an
    error you want to catch. For data you know drifts, there is a better
    way.

