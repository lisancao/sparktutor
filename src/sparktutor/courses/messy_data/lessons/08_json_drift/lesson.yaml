    ## JSON Inside a Text Column

    JSON also turns up inside other data: a log line, a CSV cell, a Kafka
    message value. `app.log` from "Text and Logs" ends with 20 JSON lines.
    `from_json` parses a string column with a schema, and
    `schema_of_json` infers that schema from one example:

    ```python
    lines = spark.read.text("data/messy/logs/app.log").filter(F.col("value").startswith("{"))
    sample = lines.first()["value"]
    ddl = spark.range(1).select(F.schema_of_json(F.lit(sample))).first()[0]
    # STRUCT<level: STRING, logger: STRING, ms: BIGINT, msg: STRING, order: BIGINT, ts: STRING>

    parsed = lines.select(F.from_json("value", ddl).alias("j")).select("j.*")
    ```

    Things that trip people up:

    - **`schema_of_json` wants a literal**, not a column. A plain string
      argument is taken as JSON text, so `F.schema_of_json("value")`
      tries to parse the word `value` and fails with a Jackson
      `JsonParseException` ("Unrecognized token 'value'"). Pass
      `F.lit(sample)`, as above.
    - **Malformed input gives a struct of NULLs, not NULL.** For
      `'{"a": 1'` with schema `a INT`, `from_json` returns `{NULL}`, so
      `j IS NULL` is false. Add a corrupt column to the schema and the
      option to capture the raw text:

      ```python
      F.from_json("s", "a INT, _corrupt_record STRING",
                  {"columnNameOfCorruptRecord": "_corrupt_record"})
      ```

    - **Only two modes.** `from_json` accepts `PERMISSIVE` and
      `FAILFAST`; `DROPMALFORMED` fails with `PARSE_MODE_UNSUPPORTED`.
    - **For one or two fields**, `get_json_object(col, "$.level")` or
      `json_tuple(col, "order", "ms")` read values without any schema
      (as strings).

