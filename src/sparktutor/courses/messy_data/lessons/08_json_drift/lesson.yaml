    ## What Inference Does

    ```python
    df = spark.read.json("data/messy/events")
    df.printSchema()
    ```

    ```
    root
     |-- _corrupt_record: string (nullable = true)
     |-- amount: string (nullable = true)
     |-- event: string (nullable = true)
     |-- event_type: string (nullable = true)
     |-- items: array (nullable = true)
     |    |-- element: struct (containsNull = true)
     |    |    |-- qty: long (nullable = true)
     |    |    |-- sku: string (nullable = true)
     |-- ts: string (nullable = true)
     |-- user: struct (nullable = true)
     |    |-- geo: struct (nullable = true)
     |    |    |-- country: string (nullable = true)
     |    |-- id: long (nullable = true)
     |    |-- plan: string (nullable = true)
     |-- user_id: long (nullable = true)
    ```

    Read it carefully:

    - **Fields are unioned.** `event` and `event_type`, `user_id` and
      `user` all appear. Each row fills the ones it has; the rest are
      NULL.
    - **Conflicting types widen to string.** `amount` was a number, a
      string and an object, so inference gives up and makes it `string`.
      Numbers become text such as `"6.13"`, and objects become their raw
      JSON text such as `{"value": 29.93, "currency": "CAD"}`.
    - **Timestamps stay strings.** `ts` is `string` because JSON
      inference does not try timestamps unless you set
      `option("inferTimestamp", True)`.
    - **A broken line adds `_corrupt_record`**, a column that exists only
      because some line could not be parsed.
    - **Fields sort alphabetically**, not in file order.

    Inference also costs a full extra pass over the data before your
    query even starts (`samplingRatio` reduces it, at the risk of
    missing rare shapes). And the schema you get depends on which files
    are in the folder today: tomorrow's file can change it.

