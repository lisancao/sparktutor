    ## The Corrupt Record Column

    In `PERMISSIVE` mode, Spark can keep the raw text of every line it
    could not parse in a string column. With inference, it is called
    `_corrupt_record` and appears automatically. With an explicit schema
    you must declare it yourself, as a `STRING` field, and name it with
    `columnNameOfCorruptRecord`:

    ```python
    raw = (spark.read
        .schema("event STRING, amount DOUBLE, ts TIMESTAMP, _corrupt STRING")
        .option("columnNameOfCorruptRecord", "_corrupt")
        .json("data/messy/events"))
    ```

    Leave the column out and nothing records the failure: the malformed
    line still becomes a row, but every field is NULL and you cannot tell
    it from a record that really had no values. With the schema
    `event STRING, amount DOUBLE` these files give 61 rows, 26 of them
    with a NULL `amount`, and no way to see why.

