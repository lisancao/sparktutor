    ## The QUERY_ONLY_CORRUPT_RECORD_COLUMN Trap

    The obvious way to look at bad records fails:

    ```python
    raw.filter(F.col("_corrupt").isNotNull()).count()
    ```

    ```
    [UNSUPPORTED_FEATURE.QUERY_ONLY_CORRUPT_RECORD_COLUMN] The feature is
    not supported: Queries from raw JSON/CSV/XML files are disallowed when
    the referenced columns only include the internal corrupt record column
    (named `_corrupt_record` by default).
    ```

    The corrupt column is filled as a side effect of parsing the *other*
    columns. A query that needs only the corrupt column would let Spark
    skip parsing, and then the column would always be NULL, so Spark
    refuses it. Selecting `_metadata.file_name` alongside does not help:
    it is file metadata, not parsed data.

    Two fixes:

    - **Cache first.** `raw = raw.cache()`; queries on the cached data
      see every column already parsed. This is the usual choice when you
      split one read into "good" and "quarantine" outputs.
    - **Reference a data column too**, for example
      `raw.filter("_corrupt IS NOT NULL").select("_corrupt", "ts")`.

