    ## Partitions as Key Ranges: How JDBC Does It

    One partition means one task and one query: no parallelism. Spark's
    JDBC source splits a table by ranges of a numeric (or date or
    timestamp) column, with four options that always come together:
    `partitionColumn` (or `column=` in `spark.read.jdbc`), `lowerBound`,
    `upperBound` and `numPartitions`. This example uses Derby, which
    ships inside PySpark, so you can run it as it is. The ids are 1 to
    1000 plus two late ids near one million and one row without an id:

    ```python
    url = "jdbc:derby:memory:shop;create=true"
    props = {"driver": "org.apache.derby.jdbc.EmbeddedDriver"}
    ids = list(range(1, 1001)) + [1_000_000, 1_000_001]
    (spark.createDataFrame([(i, f"c{i % 7}") for i in ids] + [(None, "nokey")],
                           "ID int, CUSTOMER string")
        .write.jdbc(url, "orders", mode="overwrite", properties=props))

    df = spark.read.jdbc(url, "orders", column="ID", lowerBound=1, upperBound=1000001,
                         numPartitions=4, properties=props)
    for p in df._jdf.queryExecution().toRdd().partitions():   # classic sessions only
        print(p.whereClause())
    df.groupBy(sf.spark_partition_id().alias("p")).count().orderBy("p").show()
    ```

    ```text
    "ID" < 250001 or "ID" is null
    "ID" >= 250001 AND "ID" < 500001
    "ID" >= 500001 AND "ID" < 750001
    "ID" >= 750001
    +---+-----+
    |  p|count|
    +---+-----+
    |  0| 1001|
    |  3|    2|
    +---+-----+
    ```

    (Upper-case names keep Derby's identifier rules out of the way.)
    What to notice:

    - **The bounds only choose the stride.** They are not filters: the
      first range is open below and takes NULL keys, the last is open
      above. With `lowerBound=100, upperBound=200` the read still
      returns all 1003 rows.
    - **The ranges are even in key space, not in rows.** 1001 rows land
      in the first task, two tasks get nothing, and the last gets 2. That
      is the classic JDBC skew: ids with gaps, late imports, or one big
      customer.
    - **Too many partitions for the range are reduced.** With bounds 1
      and 3 and `numPartitions=8`, Spark makes 2 partitions and logs a
      warning (`JDBCRelation.columnPartition` in the 4.2.0 source does
      the arithmetic, including a small alignment of the first and last
      stride).
    - **Each partition is one connection.** `numPartitions` is also the
      number of concurrent queries against the database. Choose it for
      what the database can take, not only for your cluster.

    When you know a better split, give the `WHERE` clauses yourself with
    `predicates`, one partition each:

    ```python
    by_hand = spark.read.jdbc(url, "orders", properties=props, predicates=[
        "ID < 500 OR ID IS NULL", "ID >= 500 AND ID < 1000", "ID >= 1000"])
    ```

    ```text
    +---+-----+
    |  p|count|
    +---+-----+
    |  0|  500|
    |  1|  500|
    |  2|    3|
    +---+-----+
    ```

    The predicates must cover every row exactly once, or rows are lost or
    read twice. Spark does not check that.

