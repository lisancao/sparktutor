    ## From Declared Types to a Spark Schema

    A Spark schema is a promise: every value in `amount` is a
    `decimal(10,2)` or NULL. The source has to keep that promise even
    when the table does not. The design in this lesson has two halves.

    **The schema follows the affinity**, refined by the declared name
    for NUMERIC columns:

    | Affinity | Spark type |
    |---|---|
    | INTEGER | `bigint` (SQLite integers are 64-bit) |
    | TEXT, BLOB (or no type) | `string` |
    | REAL | `double` |
    | NUMERIC named `DECIMAL(p,s)` or `NUMERIC(p,s)` | `decimal(p,s)` |
    | NUMERIC named `BOOL...` | `boolean` |
    | NUMERIC named `...DATE...` or `...TIME...` | `timestamp` |
    | other NUMERIC | `double` |

    **Values are converted one by one**, and a value that does not fit
    becomes NULL. The exercise's `to_spark_value(value, spark_type)` does
    this: for `bigint` it keeps Python `int`s only (so `'seven'` and
    `2.5` become NULL), for decimals it keeps numbers and rounds them
    to the scale, for `boolean` it accepts 0/1 and words like `yes` and
    `false`, and for `timestamp` it parses ISO text (with `T` or a space,
    with or without `Z`) and integer epoch seconds, as UTC.

    For the exercise's `orders` table that gives:

    ```text
    root
     |-- order_id: long (nullable = true)
     |-- customer: string (nullable = true)
     |-- status: string (nullable = true)
     |-- amount: decimal(10,2) (nullable = true)
     |-- qty: long (nullable = true)
     |-- placed_at: timestamp (nullable = true)
     |-- gift: boolean (nullable = true)
     |-- note: string (nullable = true)
    ```

    NULL is the honest answer for a value the source cannot read. If you
    also need to know **which** values were rejected, add a column such
    as `_rejected` (an array of column names) and fill it in `read()`;
    that is the same quarantine idea as in "JSON Drift and Quarantine".

