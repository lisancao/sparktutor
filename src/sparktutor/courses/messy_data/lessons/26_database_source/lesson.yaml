    ## The Same Ranges in a Python Source

    The exercise source accepts the same options as JDBC. In
    `partitions()` it computes split points and turns them into SQL
    fragments with `?` parameters:

    ```python
    def range_partitions(column, split_points):
        q = quote_ident(column)
        if not split_points:
            return [("1 = 1", [])]
        ranges = [(f"({q} < ? OR {q} IS NULL)", [split_points[0]])]
        for lo, hi in zip(split_points, split_points[1:]):
            ranges.append((f"({q} >= ? AND {q} < ?)", [lo, hi]))
        ranges.append((f"{q} >= ?", [split_points[-1]]))
        return ranges
    ```

    Each `InputPartition` carries its `where` string and its `params`,
    which pickle fine. The split points come from `lowerBound` and
    `upperBound` when given, and from `SELECT min(...), max(...)` on the
    driver otherwise.

    The best partition column in SQLite is an `INTEGER PRIMARY KEY`. It
    is the only column SQLite types strictly (it is an alias of the
    internal `rowid`, so every value is an integer), and range conditions
    on it use the table's own B-tree, so each task reads only its range.
    A range condition on a column without an index makes **every** task
    scan the whole table.

    The exercise's table has ids 1 to 1201 plus six legacy ids from
    100001. Four ranges over min..max:

    ```text
    Rows per partition, min..max ranges: [1201, 6]
    ```

    (Only partitions with rows appear in a `groupBy` on
    `spark_partition_id()`; the two middle ranges are empty.)

