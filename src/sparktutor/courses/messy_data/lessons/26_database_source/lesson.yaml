  Output: |
    ## One Read, Many Moments in Time

    Each partition opens its own connection, at its own moment: task 3
    might start minutes after task 0 on a busy cluster. A database
    transaction cannot span several processes, so nothing makes the
    tasks see the table at one point in time. Read two ranges with
    plain Python (no Spark), and change the table between them: move
    order 1 to id 1300 and insert a new order.

    The table had 1207 rows when planning started. Without protection
    the read returns **1209** rows: order 1 twice (as id 1 in the first
    range and as id 1300 in the second) and the new order. With the
    snapshot mark described next it returns 1208.

    The exercise adds a **snapshot mark**: `partitions()` reads
    `max(rowid)` on the driver and every task adds `rowid <= ?`. That
    stops rows inserted after planning (here, the new order). It does
    not stop updates and deletes: the moved order is still counted
    twice. Stronger options:

    - **Copy first.** Snapshot the database on the driver (SQLite's
      backup API is `sqlite3.Connection.backup` in Python) to storage the
      tasks can read, then read the copy. Simple and exact, but it costs
      a full copy.
    - **Use the database's own snapshots.** Postgres can export a
      snapshot from one transaction (`pg_export_snapshot()`) and import
      it in others (`SET TRANSACTION SNAPSHOT ...`); parallel `pg_dump`
      works this way. A source could do the same if every task uses it.
    - **Read from a replica or an export** (a nightly dump, change data
      capture into a table format), and let the table format give you
      snapshots.

    Spark's JDBC source has exactly the same limitation, so this is not
    a Python problem. Know which of these your downstream checks can
    tolerate before calling a read "consistent".

- Class: text
  Depth: advanced
  Output: |
    ## Production Notes

    - **Load on the database.** Every partition is one query running
      concurrently. Many ranges on a busy production database can hurt
      the people using it; read from a replica when you can.
    - **Statement timeouts and retries.** A task that fails is retried by
      Spark (on a cluster; local mode does not retry by default), which
      reruns the whole range query. Make queries cheap to repeat.
    - **Arrow batches.** For large tables, convert each `fetchmany` chunk
      into a `pyarrow.RecordBatch` (see "Types, Arrow and Performance"),
      but run `to_spark_value` first: Arrow is strict about types, and
      SQLite is not.
    - **Credentials** passed as options travel to every task inside the
      pickled reader. Prefer secrets the executors fetch themselves (a
      mounted file, an environment variable).
    - **Partition pruning by pushed filters.** `partitions()` runs after
      `pushFilters`, so a reader could drop ranges that cannot match a
      pushed condition on the key (`order_id < 100` needs only the first
      range). With an index on the key the database already skips the
      empty ranges quickly, so this mostly saves tasks, not I/O.

