    ## What You'll Learn

    In "Filter Pushdown" your reader received the query's filters and
    used them to skip files. A database is where pushdown pays off most:
    the database has indexes and can answer `WHERE status = 'shipped'`
    without sending you the other rows. It is also where pushdown is
    easiest to get **wrong**, because the database and Spark do not
    always agree on what a condition means.

    This lesson builds a Python data source over a SQLite table, using
    only `sqlite3` from Python's standard library. SQLite is a good
    teacher because it is messy in exactly the ways real databases are:
    its column types are suggestions, its `LIKE` ignores case, and it
    happily compares a word with a number.

    By the end of this lesson you will be able to:

    - Derive a Spark schema from a table definition, and convert values
      that do not fit their declared type into NULL instead of garbage
    - Split a table into key ranges the way Spark's JDBC source does
      (`partitionColumn`, `lowerBound`, `upperBound`, `numPartitions`),
      see why that skews, and balance it with quantile bounds
    - Push filters into each range's SQL `WHERE` clause with `?`
      parameters, never by pasting values into SQL text
    - Keep the database's answer identical to Spark's, including NULLs,
      case and values of the wrong type
    - Open connections in the right place, and explain why the
      partitions of one read do not see one consistent snapshot
    - Handle the 4.2.0 plan-reuse trap from "Filter Pushdown" by loading
      a fresh DataFrame per query and per reference

    You need the reader from "Your First Python Data Source", partitions
    from "Reading a Custom File Format, in Parallel" and the Python to
    Spark value rules from "Types, Arrow and Performance". The exercise
    creates its own database in a temporary folder, so there is no
    sample file to read.

