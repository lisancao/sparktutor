- Class: text
  Depth: all
  Output: |
    ## Summary

    - SQLite stores each value with its own type; the declared type only
      sets an **affinity**. Text like `'N/A'` stays in "decimal" columns,
      and `FLOATING POINT` has integer affinity.
    - Derive the Spark schema from the declared types and convert value
      by value, turning anything that does not fit into NULL. Spark's
      JDBC source trusts the driver instead, which with sqlite-jdbc reads
      `'two'` as 0 or fails the read.
    - Never keep a connection on the reader (`cannot pickle
      'sqlite3.Connection' object`); connect read-only in `read()` and
      close in `finally`.
    - Key ranges work like JDBC's `partitionColumn`, `lowerBound`,
      `upperBound`, `numPartitions`: bounds set the stride, not a
      filter, and ranges are even in keys, not rows. Quantile split
      points or explicit `predicates` fix the skew.
    - Push filters with `?` parameters; validate and quote names, which
      cannot be parameters.
    - A pushed filter must match Spark's semantics for every stored
      value: guard with `typeof`, map `IsNull` to "NULL or unconvertible",
      avoid case-insensitive `LIKE`, and leave the rest to Spark.
    - Python sources have no column, limit or aggregate pushdown in
      4.2.0. With pushdown on, load a fresh DataFrame per query and per
      reference (the plan-reuse trap).
    - Partitions read at different moments; a snapshot mark stops
      inserts, not updates. Copy or use database snapshots when you need
      a consistent read.

    Next: **Writers**, where Spark hands rows to your code and a commit
    protocol decides whether a failed job leaves garbage behind.
