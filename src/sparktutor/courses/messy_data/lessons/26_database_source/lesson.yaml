    ## Why Not Just Use JDBC?

    Spark has a built-in JDBC source (`spark.read.jdbc(...)` or
    `format("jdbc")`) and it is the right tool for Postgres, MySQL,
    SQL Server, Oracle and friends. It needs two things a Python source
    does not:

    - **A JDBC driver jar** on the classpath. Spark ships none for most
      databases. PySpark's own jars happen to include Apache Derby, an
      embedded Java database, which the examples below use because it
      runs with nothing else installed.
    - **A dialect** for SQL quirks. Spark 4.2.0 has dialects for DB2,
      Databricks, Derby, H2, SQL Server, MySQL, Oracle, Postgres,
      Snowflake and Teradata (`sql/core/src/main/scala/org/apache/spark/sql/jdbc/`).
      There is none for SQLite.

    A Python data source fits when the database has a good Python
    client and no good JDBC story (SQLite, DuckDB files, an embedded
    key-value store), when the "database" is really an API with a query
    language, or when you need conversion rules of your own for values
    that do not match their declared types. That last reason is the big
    one for messy data, as the next sections show.

