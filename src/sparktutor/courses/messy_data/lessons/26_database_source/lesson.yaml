    ## Pushing Filters: Parameters, Never Pasted Values

    `pushFilters` receives the same filter objects as in "Filter
    Pushdown". Here each one you take over becomes a SQL fragment that
    `read()` adds to its range's `WHERE`. The obvious way to build it is
    wrong:

    ```python
    # DON'T: the value is pasted into the SQL text
    self.pushed.append((f"\"customer\" = '{f.value}'", []))
    ```

    One customer in the exercise's table is literally named
    `x' OR '1'='1`. Filtering for that name:

    ```python
    df.filter(sf.col("customer") == "x' OR '1'='1").count()
    ```

    With the value pasted into the SQL this returns **1207**, every row
    in the table. With the value bound as a parameter it returns 1.
    The pasted version ran `"customer" = 'x' OR '1'='1' AND ...`, which
    is true for every row, and since the reader took the filter over,
    Spark did not check it again. A customer named `O'Brien` fails the
    task outright with `sqlite3.OperationalError: near "Brien": syntax
    error`. This is **SQL injection**, and in a pushdown it needs no
    attacker: a value in your own data is enough.

    With parameters, the SQL text holds a `?` and the value travels
    separately, so the database never parses it as SQL:

    ```python
    return f"({g} AND {q} = ?)", [f.value]
    ```

    **Names cannot be parameters.** A table or column name has to be in
    the SQL text. So check it against the database (the exercise's
    `table_columns` looks the table up in `sqlite_master` and fails with
    `ValueError: No table named 'orders; DROP TABLE orders' in the
    database` otherwise), and quote it with `quote_ident`, which wraps it
    in double quotes and doubles any quote inside.

