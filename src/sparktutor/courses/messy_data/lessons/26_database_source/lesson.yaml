    ## What Spark's JDBC Source Does With the Same Table

    For comparison, the exercise's table was also read through Spark's
    JDBC source with the third-party SQLite driver
    (`org.xerial:sqlite-jdbc:3.50.3.0`, added with `--packages` or
    `spark.jars`; it is not part of Spark). The JDBC source asks the
    **driver** for column types and values, so what you get is the
    driver's interpretation:

    | Column | Declared | JDBC + sqlite-jdbc 3.50.3.0 | This lesson's source |
    |---|---|---|---|
    | `qty` | `INT` | `bigint`; `'two'` read as 0, `2.5` as 2 | `bigint`; both NULL |
    | `gift` | `BOOLEAN` | `boolean`; `'yes'` read as false | `boolean`; `'yes'` is true |
    | `placed_at` | `DATETIME` | `date`; reading fails with `java.sql.SQLException: Error parsing date` on `2026-09-01T07:00:00Z` | `timestamp`, parsed |
    | `amount` | `DECIMAL(10,2)` | `decimal(10,2)`; reading fails with `java.sql.SQLException: column -1 out of bounds [1,1]` | NULL for `'N/A'` |
    | `note` | (none) | `decimal(38,18)`; reading fails the same way | `string` |

    None of this is a Spark bug: Spark trusts the driver's metadata, and
    this driver maps SQLite's loose values in its own way. It is the
    reason to own the conversion when the data is messy. With JDBC you
    can still take control with the `customSchema` option or by casting
    in a `query`, but you cannot change how the driver converts a value
    it has already decided is a number.

