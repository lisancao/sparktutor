    ## Balancing Ranges with Quantiles

    The database can tell you where the rows are. On an indexed key,
    `ORDER BY key LIMIT 1 OFFSET k` walks the index to the k-th key
    without sorting anything (SQLite's query plan for it is a plain
    `SCAN orders` in rowid order), so `n - 1` small queries on the driver
    give split points with the same number of rows on each side:

    ```python
    def quantile_bounds(conn, table, column, n):
        q, t = quote_ident(column), quote_ident(table)
        count = conn.execute(f"SELECT count({q}) FROM {t}").fetchone()[0]
        points = []
        for i in range(1, n):
            row = conn.execute(f"SELECT {q} FROM {t} WHERE {q} IS NOT NULL ORDER BY {q} "
                               f"LIMIT 1 OFFSET ?", (count * i // n,)).fetchone()
            if row and (not points or row[0] > points[-1]):
                points.append(row[0])
        return points
    ```

    ```text
    Rows per partition, quantile ranges: [301, 302, 302, 302]
    ```

    The cost is a little planning work, and the split is only as good as
    the moment it was computed. Other options, each with a catch:

    - **Modulo partitions** (`key % n = i`): perfectly even, but no index
      can serve them, so every task scans the whole table.
    - **Statistics from the database** (Postgres `pg_stats` histograms):
      free, but only as fresh as the last `ANALYZE`.
    - **Many small ranges** (say 4 times the number of cores): uneven
      ranges matter less when there are many of them, at the price of
      more queries.

