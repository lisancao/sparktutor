    Think of the database as a warehouse with its own staff. A plain
    reader asks the staff to bring out every box, and Spark sorts them
    on the loading dock. Pushdown hands the staff a written order ("only
    boxes for customer Ana"). That saves a lot of carrying, but only if
    the staff read the order the way you meant it. If their idea of
    "Ana" includes "ANA" and "ana", you get boxes you did not ask for,
    and nobody on the dock checks again.

