    ## No Column Pruning in 4.2

    Spark's JDBC source selects only the columns the query needs. For
    the Derby table:

    ```text
    (1) Scan JDBCRelation(orders) [numPartitions=4]  [codegen id : 1]
    Output [1]: [ID#11]
    PushedFilters: [*IsNotNull(CUSTOMER), *IsNotNull(ID), *EqualTo(CUSTOMER,c3), *GreaterThan(ID,500)]
    ReadSchema: struct<ID:int>
    External engine query: SELECT "ID" FROM orders  WHERE ("CUSTOMER" IS NOT NULL) AND ...
    ```

    A Python data source in 4.2.0 cannot do that. `reader(schema)`
    receives the **full** schema even for `select("order_id")`, there
    is no pruning method on `DataSourceReader`, and `read()` must yield
    every column. The plan says so:

    ```text
    (1) BatchScan sqlite
    Output [8]: [order_id#373L, customer#374, status#375, amount#376, ...]
    PushedFilters: [IsNotNull(status), IsNotNull(amount), EqualTo(status,shipped), GreaterThan(amount,100.00)]
    ReadSchema: struct<order_id:bigint,customer:string,status:string,amount:decimal(10,2),...>

    (2) Filter [codegen id : 1]
    Condition : (isnotnull(note#380) AND (note#380 = fragile))
    ```

    JDBC marks the filters it fully handles with `*`; the Python scan's
    list has no marks, so check Spark's `Filter` node to see what Spark
    still evaluates (here only the condition on `note`, as designed). If a
    table has wide columns most queries never need (documents, blobs),
    offer an option such as `columns` and let the user choose, or expose
    two tables. Also note: the Python filter API has no limit or
    aggregate pushdown in 4.2.0, so `limit(10)` and `count()` read every
    row of every range.

