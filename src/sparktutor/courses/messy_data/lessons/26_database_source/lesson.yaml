    ## Where Each Method Runs, and Where Connections Belong

    The same rule as every data source so far: some methods run on the
    driver during planning, `read()` runs in a task.

    | Method | Runs | Opens a connection? |
    |---|---|---|
    | `DataSource.schema()` | driver, once per `load()` | yes, to read `PRAGMA table_info`, then closes it |
    | `reader(schema)` and `DataSourceReader.__init__` | driver | may, briefly, for metadata |
    | `pushFilters(filters)` | driver, during planning | no: it only builds SQL |
    | `partitions()` | driver, after `pushFilters` | yes, for `min`/`max` or quantiles |
    | `read(partition)` | one task per partition | yes: its own connection, closed in `finally` |

    The reader object travels from the driver to every task by pickling,
    so it must not hold a connection. Keep one on `self` and the first
    action fails:

    ```python
    class BadReader(DataSourceReader):
        def __init__(self, options):
            self.conn = sqlite3.connect(options["path"])   # don't
    ```

    ```text
    AnalysisException: [PYTHON_DATA_SOURCE_ERROR] Failed to initialize
    Python data source reader: Traceback (most recent call last):
      ...
    TypeError: cannot pickle 'sqlite3.Connection' object
    ```

    Database clients for Postgres or MySQL fail the same way (sockets do
    not pickle). Store the connection **settings** (path, URL, user) on
    `self` and connect inside `read()`:

    ```python
    def connect_ro(path):
        """Open a SQLite file read-only."""
        return sqlite3.connect(pathlib.Path(path).resolve().as_uri() + "?mode=ro", uri=True)

    def read(self, partition):
        sql, params = self.build_query(partition)
        conn = connect_ro(self.path)
        try:
            cursor = conn.execute(sql, params)
            while True:
                rows = cursor.fetchmany(500)
                if not rows:
                    break
                for row in rows:
                    yield tuple(to_spark_value(v, self.types[c])
                                for v, c in zip(row, self.columns))
        finally:
            conn.close()
    ```

    Three details in there:

    - `?mode=ro` opens the file **read-only**. A reader should never be
      able to change the source; a write on such a connection fails with
      `sqlite3.OperationalError: attempt to write a readonly database`.
    - `fetchmany` streams rows in chunks instead of loading the whole
      range into memory with `fetchall`.
    - `finally` closes the connection even when converting a row raises
      half way through the range.

    Pass absolute paths: on Spark Connect the workers do not run in your
    directory (the relative-path surprise in "Reading a Custom File
    Format, in Parallel").

