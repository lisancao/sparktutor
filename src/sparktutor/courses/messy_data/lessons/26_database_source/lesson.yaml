  Output: |
    ## What to Push, and What to Leave to Spark

    The values Spark puts in the filters, measured on 4.2.0 with one
    column of each type:

    | Column type | Condition | Filter received |
    |---|---|---|
    | `decimal(10,2)` | `amount > 10` | `GreaterThan(('amount',), Decimal('10.00'))` |
    | `bigint` | `id > 1.5` | `GreaterThan(('id',), 1)` (the optimizer rewrote it) |
    | `double` | `score > 1` | `GreaterThan(('score',), 1.0)` |
    | `boolean` | `shipped` | `EqualTo(('shipped',), True)` |
    | `date` | `day = date'2026-10-01'` | `EqualTo(('day',), datetime.date(2026, 10, 1))` |
    | `timestamp` | `ts >= timestamp'2026-10-01 10:00:00'` | aware `datetime` in **UTC** |
    | `timestamp_ntz` | same | naive `datetime` |
    | `string` | `name IN ('a', NULL)` | `In(('name',), ['a', None])` |
    | `string` | `name LIKE 'a%b'` | `StringStartsWith` **and** `StringEndsWith` |
    | `bigint` | `NOT (id > 3)` | `LessThanOrEqual(('id',), 3)` |
    | `bigint` | `id = 2 OR id = 3` | nothing (`pushFilters` is not called) |

    For timestamps the value is the instant converted to UTC: with the
    session time zone `America/Los_Angeles`, `timestamp'2026-10-01
    10:00:00'` arrived as `datetime(2026, 10, 1, 17, 0,
    tzinfo=ZoneInfo('UTC'))`.

    The exercise pushes:

    - `EqualTo`, `GreaterThan`, `GreaterThanOrEqual`, `LessThan`,
      `LessThanOrEqual`, `In`, `IsNull`, `IsNotNull` on columns whose
      affinity is INTEGER, TEXT or REAL, and on decimals (bound as
      `float`, because `sqlite3` cannot bind `Decimal`; SQLite stores
      them as REAL anyway)
    - `StringStartsWith` on those string columns

    and returns everything else, including:

    - **`placed_at`**: the table stores three timestamp formats (ISO with
      a space, ISO with `T` and `Z`, epoch integers). No single SQL
      comparison matches all three the way the parsed values compare.
    - **`note`**, the untyped column: an integer 42 and the text `'42'`
      look the same to Spark after conversion (`"42"`), but `note = '42'`
      in SQLite only matches the text.
    - **`Not(...)`**, `EqualNullSafe`, `StringEndsWith`,
      `StringContains`: possible, but each needs its own NULL and
      wildcard care; returning them is always correct.

    Returning a filter costs only speed: Spark evaluates it on the rows
    you send. Taking it over wrongly costs correctness.

