    ## SQLite's Types Are Suggestions

    In most databases a column declared `INT` only holds integers.
    SQLite stores each **value** with its own storage class (`integer`,
    `real`, `text`, `blob` or `null`). The declared type only gives the
    column an **affinity**: a preference that converts a value on insert
    when the conversion loses nothing, and keeps the value as it is
    otherwise.

    ```python
    import sqlite3
    conn = sqlite3.connect(":memory:")
    conn.execute("""CREATE TABLE t (
        a DECIMAL(10,2), q INT, s VARCHAR(10), fp "FLOATING POINT", n)""")
    conn.executemany("INSERT INTO t VALUES (?, ?, ?, ?, ?)", [
        ("12.50", "7", 42, "2.0", "five"),
        ("N/A", "seven", "x", 2.7, 5),
        ("12,50", " 8", None, "1.5", b"\x00")])
    for row in conn.execute("""SELECT a, typeof(a), q, typeof(q), s, typeof(s),
                                      fp, typeof(fp), typeof(n) FROM t"""):
        print(row)
    ```

    ```text
    (12.5, 'real', 7, 'integer', '42', 'text', 2, 'integer', 'text')
    ('N/A', 'text', 'seven', 'text', 'x', 'text', 2.7, 'real', 'integer')
    ('12,50', 'text', 8, 'integer', None, 'null', 1.5, 'real', 'blob')
    ```

    Read it column by column:

    - `a DECIMAL(10,2)`: the text `"12.50"` became the number 12.5, but
      `"N/A"` and the decimal comma `"12,50"` stayed **text** in a
      "decimal" column.
    - `q INT`: `"7"` and even `" 8"` became integers; `"seven"` stayed
      text.
    - `s VARCHAR(10)`: the number 42 became the text `'42'`. Text
      affinity turns numbers into text, so text columns are the most
      predictable.
    - `fp "FLOATING POINT"`: `"2.0"` became the **integer** 2. The rule
      that decides affinity looks for `INT` first, and `POINT` contains
      `INT`, so this column has integer affinity.
    - `n` (no declared type): every value is kept exactly as given.

    The rules (from the SQLite documentation, "Datatypes In SQLite",
    section 3.1), checked in this order:

    | Declared type contains | Affinity |
    |---|---|
    | `INT` | INTEGER |
    | `CHAR`, `CLOB` or `TEXT` | TEXT |
    | `BLOB`, or no type at all | BLOB (keep as given) |
    | `REAL`, `FLOA` or `DOUB` | REAL |
    | anything else (`DECIMAL`, `NUMERIC`, `BOOLEAN`, `DATETIME`) | NUMERIC |

    `PRAGMA table_info(t)` returns the declared types, so a source can
    read them at planning time:

    ```text
    [(0, 'a', 'DECIMAL(10,2)', 0, None, 0), (1, 'q', 'INT', 0, None, 0),
     (2, 's', 'VARCHAR(10)', 0, None, 0), (3, 'fp', 'FLOATING POINT', 0, None, 0),
     (4, 'n', '', 0, None, 0)]
    ```

    Two other traps show up immediately. `sqlite3` cannot bind a
    `Decimal` parameter, and a connection cannot be pickled:

    ```text
    Error binding parameter 1: type 'decimal.Decimal' is not supported
    cannot pickle 'sqlite3.Connection' object
    ```

    Both matter below. (These outputs are from SQLite 3.45.1, the
    version bundled with the Python 3.12 used to test this course; the
    affinity rules have been stable for many years.)

