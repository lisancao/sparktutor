    ## The Plan-Reuse Trap, Again

    "Filter Pushdown" showed that in 4.2.0 a DataFrame over a Python
    source shares one planned read across every scan of its relation.
    With a database
    source and a temporary view:

    ```python
    df = spark.read.format("sqlite").option("path", db).option("table", "orders").load()
    df.createOrReplaceTempView("orders_v")
    spark.sql("SELECT count(*) FROM orders_v").first()[0]                          # 1207
    spark.sql("SELECT count(*) FROM orders_v WHERE status = 'shipped'").first()[0] # 610
    spark.sql("SELECT count(*) FROM orders_v").first()[0]                          # 610, not 1207
    spark.sql("SELECT count(*) FROM orders_v WHERE status = 'pending' OR qty = 4").first()[0]  # 152
    ```

    The last query should return 580 (a fresh `load()` does). The `OR`
    is not pushed, so `pushFilters` is not called, and the query reuses
    the partitions, and the `WHERE` clauses, of the `status = 'shipped'`
    query. The same happens on Spark Connect. Until you run a release
    with the fix (it is on Spark's master branch as part of SPARK-58551;
    4.2.0 and the 4.3 branch still have it), with pushdown on:

    - build a fresh DataFrame with `load()` for each query (the exercise
      harness has an `orders()` helper for exactly this), don't
      register long-lived views over a pushdown source, and use a
      separate `load()` for each reference to the source inside one
      query (a self-join or a union of two filters)
    - or copy the table into Parquet or Delta once and query that

