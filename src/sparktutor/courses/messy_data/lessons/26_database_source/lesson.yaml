    ## Same Answer as Spark, or a Wrong Answer

    Parameters make the SQL safe. They do not make it **correct**. The
    contract from "Filter Pushdown" still holds: Spark stops checking a
    filter you take over, so your SQL must keep exactly the rows Spark
    would keep. A straightforward translation (`amount > ?`,
    `amount IS NULL`, `status LIKE 'ship%'`) against the exercise's
    table, compared with letting Spark filter everything itself:

    | Condition | Spark filters itself | Straightforward SQL | Guarded SQL |
    |---|---|---|---|
    | `amount > 100` | 693 | **756** | 693 |
    | `qty > 3` | 300 | **330** | 300 |
    | `status LIKE 'ship%'` | 610 | **732** | 610 |
    | `amount IS NULL` | 81 | **18** | 81 |

    Each wrong number has a cause you have already seen:

    - **Text in a numeric column.** SQLite orders every number before
      every text value, so `'N/A' > 100` is **true**. Those rows come
      back with `amount` converted to NULL, and Spark shows NULL amounts
      in an `amount > 100` result.
    - **NULL is not the only NULL.** For Spark, `amount IS NULL` is true
      for real NULLs **and** for every `'N/A'`, `''` and `'12,50'` the
      source turned into NULL. SQL `IS NULL` sees only the first kind.
    - **LIKE ignores case** for ASCII letters in SQLite, so
      `'Shipped' LIKE 'ship%'` is true, while Spark's `startswith` is
      case-sensitive. `LIKE` also treats `%` and `_` inside the value as
      wildcards.

    The fix is one idea: a **guard** that is true exactly when
    `to_spark_value` would keep the value.

    ```python
    def guard(column, spark_type):
        q = quote_ident(column)
        if spark_type == "bigint":
            return f"typeof({q}) = 'integer'"
        if spark_type == "double" or spark_type.startswith("decimal"):
            return f"typeof({q}) IN ('integer', 'real')"
        return f"typeof({q}) = 'text'"
    ```

    Then every comparison is `guard AND column op ?`, `IsNotNull` is the
    guard itself, `IsNull` is `NOT (guard) OR column IS NULL`, and a
    prefix test compares `substr(column, 1, ?) = ?` instead of `LIKE`.
    The SQL generated for `amount > 100` on one partition:

    ```text
    SELECT "order_id", "customer", ... FROM "orders"
    WHERE ("order_id" < ? OR "order_id" IS NULL) AND rowid <= ?
      AND (typeof("amount") IN ('integer', 'real'))
      AND (typeof("amount") IN ('integer', 'real') AND "amount" > ?)
    params: [50003, 100006, 100.0]
    ```

    (The first guard comes from the `IsNotNull(amount)` that Spark adds
    to every comparison.) The general lesson for any database: **push a
    filter only when the backend's semantics match Spark's for every
    value the column can hold.** Collations, trailing spaces in `CHAR`
    columns, case-insensitive defaults (MySQL), NULL ordering and
    floating-point equality are the usual suspects.

