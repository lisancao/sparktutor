    ## What Reuse Keeps

    A reused worker runs `worker.main` again for the next task in the
    same process. That has consequences you can use, and some that bite:

    - **Imports and module globals survive.** A model loaded into a
      module-level variable stays loaded for later tasks on that worker,
      which is the trick behind loading a model "once per worker" in
      "Model Inference in Production".
    - **Broadcast variables are sent as differences.**
      `PythonWorkerUtils.writeBroadcasts` asks `PythonRDD.getWorkerBroadcasts(worker)`
      what the worker already has, and sends only new IDs, plus negative
      IDs (`-bid - 1`) for broadcasts to forget. The values are not sent
      over the socket at all: the worker receives a **file path** and
      reads the broadcast from local disk.
    - **The task context is reset.** `worker.main` sets
      `TaskContext._setTaskContext(None)` at the end, so stale context
      does not leak.
    - **Memory is not returned.** A reused worker keeps whatever its
      allocator kept. In one run below, a worker that had allocated
      900 MiB in a previous task started the next task with a
      virtual size of 1371 MiB instead of 302 MiB.
    - **The pool can be bounded.** `spark.python.factory.idleWorkerMaxPoolSize`
      (4.1) caps the number of idle workers kept, evicting the least
      recently used.

    The JVM decides whether to reuse at the end of each task: the worker
    must answer the final `END_OF_STREAM` marker with `END_OF_STREAM`.
    Any other ending, an exception or a crash destroys the worker.

