- Class: text
  Depth: all
  Output: |
    ## Summary

    - The JVM starts `python -m pyspark.daemon pyspark.worker` once;
      the daemon forks a worker per task slot. With
      `spark.python.worker.reuse` (default true) workers serve many
      tasks, but only in daemon mode, never on Windows.
    - `BasePythonRunner` writes one request per task: partition, Python
      version, task context JSON, files, broadcast IDs and paths, eval
      type, runner and eval conf, the UDFs (offsets, chained commands,
      result IDs), the data (pickled frames or a raw Arrow stream),
      `END_OF_STREAM`. Since 4.0 the runner is single-threaded with
      non-blocking I/O (SPARK-44705).
    - The worker answers with results (frames, or -6 and an Arrow
      stream), `TIMING_DATA`, spill counters, `END_OF_DATA_SECTION`,
      accumulator updates and `END_OF_STREAM`. Negative lengths are the
      control codes of `SpecialLengths`.
    - In 4.2 the Arrow UDF input schema moved to the eval conf
      (SPARK-56340); the columnar runner kept the old position and the
      worker read JSON as counts and lengths, hanging the task
      (SPARK-58241, fixed in 4.2.1 and 4.3.0).
    - `idleTimeoutSeconds` with `killOnIdleTimeout` turns hangs into
      `PythonWorkerException`s; `tracebackDumpIntervalSeconds` shows
      where the worker is stuck; faulthandler adds tracebacks to crashes
      it can catch.
    - Raised exceptions arrive as `PYTHON_EXCEPTION`; dead workers as
      "exited unexpectedly (crashed)" with an `EOFException`; `SIGKILL`
      (including the out-of-memory killer) leaves no Python traceback.
    - Commands over `spark.broadcast.UDFCompressionThreshold` (1 MiB)
      are broadcast for you; anything just under it is sent and unpickled with every task.
      Broadcast large objects yourself.
    - `spark.executor.pyspark.memory` becomes `RLIMIT_AS` per worker,
      a limit on virtual memory: about 300 MiB are gone before an Arrow
      UDF starts.

    Next: **Memory, Spill and Very Large Files**, which looks at the
    other side of memory: the JVM's unified memory manager, spilling,
    and how to read files far larger than any task should hold.
