    ## Planning Workers Speak the Same Language

    The driver-side workers that plan a Python data source, analyze a
    UDTF or look up registered sources use a simpler exchange in
    `PythonPlannerRunner.runInPython`: Python version, Spark files,
    broadcasts and the runner conf, then a request specific to the
    module (`pyspark.sql.worker.plan_data_source_read`,
    `data_source_pushdown_filters`, `create_data_source`,
    `analyze_udtf`, ...), then `END_OF_STREAM`; the answer ends with
    accumulator updates and `END_OF_STREAM`, and the worker is released
    for reuse like any other. Its I/O wrapper, `WorkerInputStream`, is
    "a port and simplified version of `PythonRunner.ReaderInputStream`"
    and honours the same idle timeout settings.

    `plan_data_source_read` receives, among other things,
    `max_arrow_batch_size` (an int) and an `enable_pushdown` flag, and
    returns the pickled partitions and the pickled read function. Those
    pickled partitions are what `PythonPartitionReaderFactory` later
    sends, one per task, as the single input row of an eval-type-207
    worker. So the `InputPartition` objects your `partitions()` returns
    travel twice: from a planning worker to the JVM, and from the JVM to
    an executor worker. Keep them small: paths and offsets, never data.

