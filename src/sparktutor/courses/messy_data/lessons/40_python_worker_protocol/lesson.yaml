    ## What spark.executor.pyspark.memory Really Limits

    `spark.executor.pyspark.memory` (2.4) sets a memory limit for the
    Python workers of an executor. The runner divides it by the
    executor's cores (`getWorkerMemoryMb`: `mem / cores`) and passes it
    as `PYSPARK_EXECUTOR_MEMORY_MB`; `worker.main` calls
    `setup_memory_limits` in `pyspark/worker_util.py`, which sets
    `resource.RLIMIT_AS` on Linux. Windows does not support it and macOS
    does not enforce it.

    `RLIMIT_AS` limits **virtual address space**, not resident memory,
    and that matters. From workers in local mode (one core, so the
    worker gets the whole value), with `/proc/self/status` read inside
    the UDF:

    | Limit | UDF | Worker at start | Allocate 100 / 400 / 900 MiB |
    |---|---|---|---|
    | 300m | pickled (`useArrow=False`) | VmSize 66 MiB, RSS 50 MiB | ok / `MemoryError` / `MemoryError` |
    | 300m | Arrow (the 4.2 default) | does not start | every query fails: `Python worker exited unexpectedly (crashed)`, caused by `IOException: Unexpected end of input. Missing schema.` |
    | 1g | pickled | 66 MiB | ok / ok / ok |
    | 1g | Arrow | VmSize 302 MiB, RSS 84 MiB | ok / ok / `MemoryError` |
    | 2g | Arrow, fresh worker | 302 MiB | 900 MiB ok, VmSize 1202 MiB after |
    | 2g | Arrow, the **reused** worker | 1371 MiB | 900 MiB fails: `MemoryError` |

    An Arrow worker maps about 300 MiB of address space just by
    importing PyArrow and pandas, while using under 100 MiB of real
    memory. A limit of 300m leaves it nothing, so it dies before it can
    read its input, and the JVM sees an Arrow stream that ends before
    its schema. The worker even prints its limits to stderr when it
    sets them (`Current mem limits: -1 of max -1`,
    `Setting mem limits to 314572800 of max 314572800`).

    A `MemoryError` raised inside your UDF is an ordinary Python
    exception (`PYTHON_EXCEPTION`); hitting the limit while PySpark's own
    code allocates can instead kill the worker. Practical advice: if you
    set `spark.executor.pyspark.memory`, start at 1g per core or more
    for Arrow UDFs, measure, and remember the limit is per worker
    process, while reused workers keep their address space between
    tasks. The driver-side planning workers (Python data source planning,
    UDTF analysis) have their own setting,
    `spark.sql.planner.pythonExecution.memory` (4.0, in MiB), passed as
    `PYSPARK_PLANNER_MEMORY_MB`.

    On YARN, `spark.executor.pyspark.memory` is also added to the
    container request (`pysparkWorkerMemory` in
    `resource-managers/yarn/.../deploy/yarn/Client.scala`), so the limit
    and the container agree; without it, Python workers silently share
    the overhead.

