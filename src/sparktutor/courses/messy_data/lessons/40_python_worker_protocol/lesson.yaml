    ## A Desync in the Wild: SPARK-58241

    Now the 4.2.0 hang from "How Catalyst Plans Python" makes sense.
    Spark 4.2.0 moved the Arrow UDF's input schema out of the UDF
    section into the eval conf (SPARK-56340, "Move input type schema
    transmit to eval conf"). `ArrowPythonWithNamedArgumentRunner` was
    updated: its `evalConf` adds `input_type`. The new columnar runner
    added in the same release, `ColumnarArrowPythonWithNamedArgumentRunner`
    (`sql/core/.../execution/python/ColumnarArrowPythonRunner.scala`),
    still wrote it the old way:

    ```scala
    override protected def writeUDF(dataOut: DataOutputStream): Unit = {
      if (evalType == PythonEvalType.SQL_ARROW_BATCHED_UDF) {
        PythonWorkerUtils.writeUTF(schema.json, dataOut)
      }
      PythonUDFRunner.writeUDFs(dataOut, funcs, argMetas)
    }
    ```

    Follow the worker reading that stream:

    1. `num_udfs = read_int(infile)` reads the **length of the schema
       JSON** (about 90) as the number of UDFs.
    2. `read_single_udf` reads `num_arg = read_int(infile)` from the first
       four characters of the JSON, `{"ty`, that is `0x7b227479`, about
       2 billion arguments.
    3. For each "argument" it reads an offset and a flag, and when a flag
       byte happens to be non-zero it reads a "name": a length taken from
       more JSON text, then `stream.read(length)`, which blocks until that
       many bytes arrive.
    4. They never arrive. The JVM has sent everything and is waiting for
       the first result. Neither side times out by default.

    You can watch this happen. Three settings added in 4.0 and 4.1 turn
    the hang into evidence:

    ```python
    spark = (SparkSession.builder.master("local[1]")
             .config("spark.sql.execution.pyspark.udf.idleTimeoutSeconds", "5")
             .config("spark.sql.execution.pyspark.udf.killOnIdleTimeout", "true")
             .config("spark.sql.execution.pyspark.udf.tracebackDumpIntervalSeconds", "3")
             .getOrCreate())
    q = spark.read.parquet(p).select(F.udf(lambda s: s + "!", "string")("s"))
    q.collect()
    ```

    ```text
    Timeout (0:00:03)!
    Thread 0x00007f4362b78080 (most recent call first):
      File ".../pyspark/serializers.py", line 541 in loads
      File ".../pyspark/worker.py", line 1072 in read_single_udf
      File ".../pyspark/worker.py", line 2496 in read_udfs
      File ".../pyspark/worker.py", line 3602 in main
      File ".../pyspark/daemon.py", line 90 in worker
      ...
    WARN ColumnarArrowPythonWithNamedArgumentRunner: Idle timeout reached for Python worker
      (timeout: 5 seconds). No data received from the worker process - handle.map(_.isAlive) =
      Some(true), channel.isConnected = true, ... hasInputs = false - task 0.0 in stage 2 (TID 2)
    WARN ColumnarArrowPythonWithNamedArgumentRunner: Terminating Python worker process due to
      idle timeout (timeout: 5 seconds) - task 0.0 in stage 2 (TID 2)
    ERROR Executor: Exception in task 0.0 in stage 2.0 (TID 2)
    org.apache.spark.api.python.PythonWorkerException: Python worker process terminated due to
      idle timeout (timeout: 5 seconds)
    ```

    The dump puts the worker in `read_single_udf` at line 1072, which is
    `name = utf8_deserializer.loads(infile)`, inside `loads` at line 541,
    `s = stream.read(length)`: exactly step 3. The runner's class name in
    the warning tells you which JVM writer was talking. With
    `spark.sql.execution.arrow.pythonUDF.columnarInput.enabled=false` the
    same query returned `['0!', '1!', '2!']`.

    SPARK-58241 ("Columnar Arrow Python UDF runner writes the input
    schema in the legacy protocol position, hanging the worker") is
    fixed in 4.2.1 and 4.3.0. The exercise rebuilds this exact desynced
    request from a real one and has your parser reject it in
    microseconds instead of blocking.

