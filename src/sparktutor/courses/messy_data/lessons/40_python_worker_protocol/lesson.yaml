    ## The Request, Byte by Byte

    For `spark.range(0, 3, 1, 1).selectExpr("concat('ab', id) AS s")` and
    `udf(lambda s: s.upper(), "string", useArrow=False)`, the tap
    recorded 4849 bytes going into the worker. The first bytes:

    ```text
    000000  00 00 00 00 00 00 00 04 33 2e 31 32 00 00 0f 5c   ........3.12...\
    000010  7b 22 73 65 63 72 65 74 22 3a 22 ...              {"secret":"...
    ```

    Every integer is big-endian (Java's `DataOutputStream`); strings
    and byte arrays are a 4-byte length and then the bytes. In order,
    from `BasePythonRunner.Writer.open` and Python's `worker.main`:

    | Field | Encoding | In this request |
    |---|---|---|
    | partition index | int | `00 00 00 00` = 0 |
    | Python version | string | `00 00 00 04` "3.12" (the worker checks it against its own) |
    | task context | string (JSON) | 0x0f5c bytes: `attemptNumber`, `connInfo`, `cpus`, `isBarrier`, `localProperties`, `partitionId`, `resources`, `secret`, `stageId`, `taskAttemptId` |
    | Spark files root | string | `/tmp/spark-.../userFiles-...` |
    | includes | int count, strings | 0 |
    | broadcasts | bool (decryption server), int count, then per broadcast a long ID and a path | false, 0 |
    | eval type | int | 100 (`SQL_BATCHED_UDF`) |
    | runner conf | int count, key and value strings | empty for this runner |
    | eval conf | same | empty |
    | UDFs | see below | one UDF |
    | data | see below | three rows |
    | end | int | -4 (`END_OF_STREAM`) |

    Most of the task context is `localProperties`, which carries every
    local property of the job (a lot of Spark configuration). The
    `secret` is used by barrier tasks and broadcast decryption to call
    back into the JVM.

    The UDF section is written by `PythonUDFRunner.writeUDFs`
    (`sql/core/.../execution/python/PythonUDFRunner.scala`) and read by
    `read_udfs` and `read_single_udf` in `pyspark/worker.py`:

    ```text
    int    number of UDFs
    per UDF:
      int    number of arguments
      per argument: int offset into the input row, bool named, [string name]
      int    number of chained functions (2 for f(g(x)) fused into one node)
      per function: bytes  the command, a cloudpickle of (function, return type)
      long   result ID
    ```

    Here: 1 UDF, 1 argument at offset 0, not named, 1 function whose
    command is 702 bytes, result ID 2.

    The data section of the pickled protocol is a sequence of frames,
    each a length and a pickle (written by the JVM with Pyrolite,
    pickle protocol 2) of a batch of rows, ended by
    `END_OF_DATA_SECTION`:

    ```text
    0012c1  1f 80 02 58 03 00 00 00 61 62 30 85 58 03 00 00   ...X....ab0.X...
    0012d1  00 61 62 31 85 58 03 00 00 00 61 62 32 85 87 2e   .ab1.X....ab2...
    0012e1  ff ff ff ff ff ff ff fc                           ........
    ```

    `80 02` is the pickle protocol 2 header, `58 03 00 00 00 61 62 30`
    is the string "ab0", `85` makes a one-element tuple (a row), `87`
    makes the tuple of three rows, `2e` ends the pickle. Then
    `ff ff ff ff` (-1, `END_OF_DATA_SECTION`) and `ff ff ff fc` (-4,
    `END_OF_STREAM`).

    For an Arrow UDF (eval type 101) the header is the same, but the
    runner conf carries the session time zone and pandas and Arrow
    settings, and the **eval conf** carries the UDF's input schema:

    ```text
    eval_conf {'input_type': '{"type":"struct","fields":[{"name":"_0","type":"string","nullable":true,"metadata":{}}]}'}
    ```

    and the data section is a raw Arrow IPC stream (a schema message,
    record batches, the end-of-stream marker `ff ff ff ff 00 00 00 00`)
    with no length prefix, followed by -4.

