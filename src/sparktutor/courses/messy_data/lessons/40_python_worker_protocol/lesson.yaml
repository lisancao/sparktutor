    ## The Processes

    In local mode, the processes behind one `spark-submit` job are:

    1. **Your driver Python process**, which talks to the JVM over Py4J.
    2. **The JVM**, which in local mode is the driver and the only
       executor.
    3. **A Python daemon**, started by the JVM with
       `python -m pyspark.daemon pyspark.worker` the first time a task
       needs Python (`PythonWorkerFactory.startDaemon` in
       `core/src/main/scala/org/apache/spark/api/python/PythonWorkerFactory.scala`).
    4. **Python workers**, forked by the daemon, one per running task
       that needs Python.

    The daemon exists because forking a Python process that has already
    imported PySpark is far cheaper than starting Python from the JVM.
    Its loop in `pyspark/daemon.py` waits on a listening socket; for
    each connection from the JVM it calls `os.fork()`, and the child
    writes its PID back, authenticates the JVM with a shared secret and
    then calls `pyspark.worker.main(infile, outfile)`. The worker module
    is imported **after** the fork, so threads that pandas or PyArrow
    start on import never exist in the daemon (a forked process only
    keeps the forking thread).

    An experiment: a UDF that returns `f"{os.getpid()}:{os.getppid()}"`,
    run over `spark.range(0, 8, 1, 4)` in three jobs on `local[2]`:

    ```text
    reuse=true daemon=true driver_python=3478984 jvm=3478621
      job 0: worker pids ['3479780', '3479782']
      job 1: worker pids ['3479780', '3479782']
      job 2: worker pids ['3479780', '3479782']
      distinct pids over 3 jobs: 2; parents: ['3479718']
    reuse=false daemon=true driver_python=3478984 jvm=3478621
      job 0: worker pids ['3480463', '3480467', '3480546', '3480548']
      ...
      distinct pids over 3 jobs: 12; parents: ['3480412']
    reuse=true daemon=false driver_python=3478984 jvm=3478621
      job 0: worker pids ['3480922', '3480986', '3481069', '3481152']
      ...
      distinct pids over 3 jobs: 12; parents: ['3478621']
    ```

    Read it closely:

    - With the defaults, the **same two workers** ran all twelve tasks:
      two task slots, two workers, reused across jobs. Their parent is
      the daemon, not the JVM and not your Python.
    - With `spark.python.worker.reuse=false`, every task got a new
      process.
    - With `spark.python.use.daemon=false`, workers are children of the
      JVM, and **reuse does not happen even though it is on**.
      `PythonWorkerFactory.releaseWorker` only keeps idle workers in
      daemon mode; otherwise it stops them. The daemon is also never used
      on Windows (`!Utils.isWindows && useDaemonEnabled`), so on Windows
      every task starts a fresh Python.

    Both settings are core settings read when the factory and the runner
    are created, so set them when the session starts, not with
    `spark.conf.set`.

