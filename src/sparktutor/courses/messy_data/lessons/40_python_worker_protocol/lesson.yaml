    ## The Debugging Settings

    All of these exist at two levels: a core setting
    `spark.python.worker.*` read when a runner starts, and a SQL
    setting `spark.sql.execution.pyspark.udf.*` that falls back to it
    and can be changed at runtime for DataFrame and SQL work.

    | Setting | Since | Default | Effect |
    |---|---|---|---|
    | `spark.python.worker.faulthandler.enabled` / `...udf.faulthandler.enabled` | 3.2 / 4.0 | false | the worker enables `faulthandler` and writes a crash traceback to a file the JVM appends to the error |
    | `spark.python.worker.idleTimeoutSeconds` / `...udf.idleTimeoutSeconds` | 4.0 | 0 (off) | log the socket state when no data arrives for this long |
    | `spark.python.worker.killOnIdleTimeout` / `...udf.killOnIdleTimeout` | 4.1 | false | also kill the worker, failing the task |
    | `spark.python.worker.tracebackDumpIntervalSeconds` / `...udf.tracebackDumpIntervalSeconds` | 4.1 | 0 (off) | the worker dumps all thread tracebacks to its stderr periodically |
    | `spark.python.daemon.killWorkerOnFlushFailure` / `...udf.daemonKillWorkerOnFlushFailure` | 4.1 | true | a worker whose final flush fails dies instead of continuing in a broken protocol state |
    | `spark.sql.pyspark.worker.logging.enabled` | 4.1 | false | collect worker logs into `python_worker_logs()` ("Packaging, Registration, Testing and Debugging") |

    With an idle timeout but without `killOnIdleTimeout`, Spark only logs
    the warning and the task keeps waiting. A sensible production
    setting for jobs with Python is a timeout longer than any honest
    pause of your function (a slow API call, a model load), with kill
    enabled, so a hang fails the task and the scheduler can retry it.

    In local mode the worker's stderr is your terminal, so the traceback
    dumps appear there; on a cluster they land in the executor's stderr
    log.

