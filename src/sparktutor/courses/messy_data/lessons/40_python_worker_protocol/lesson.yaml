    ## Recording the Bytes: a Wire Tap

    `spark.python.worker.module` (2.4) names the module whose `main` the
    daemon calls for each task. A module that wraps `pyspark.worker.main`
    and copies every byte it reads and writes to a file is a wire tap:

    ```python
    import io, os
    from pyspark.worker import main as real_main

    class TeeIn(io.RawIOBase):
        def __init__(self, inner, log):
            self.inner, self.log = inner, log
        def readable(self):
            return True
        def readinto(self, b):
            data = self.inner.read1(len(b))   # read1: never wait for more than is there
            b[:len(data)] = data
            self.log.write(data)
            return len(data)

    class TeeOut:
        def __init__(self, inner, log):
            self.inner, self.log = inner, log
        def write(self, data):
            self.log.write(data)
            return self.inner.write(data)
        def flush(self):
            self.log.flush()
            self.inner.flush()
        def __getattr__(self, name):
            return getattr(self.inner, name)

    def main(infile, outfile):
        d, pid = os.environ["TAP_DIR"], os.getpid()
        with open(os.path.join(d, f"{pid}.in"), "ab") as i, \
             open(os.path.join(d, f"{pid}.out"), "ab") as o:
            real_main(io.BufferedReader(TeeIn(infile, i), 65536), TeeOut(outfile, o))
    ```

    ```python
    spark = (SparkSession.builder.master("local[2]")
             .config("spark.python.worker.reuse", "false")       # one task per file
             .config("spark.python.worker.module", "pyspark_tap")
             .config("spark.executorEnv.PYTHONPATH", tapdir)      # where pyspark_tap.py is
             .config("spark.executorEnv.TAP_DIR", tapdir)
             .getOrCreate())
    ```

    Three things went wrong while building it, and each teaches
    something:

    - **The module name must start with `pyspark`.** `daemon.py` imports
      `sys.argv[1]` only `if sys.argv[1].startswith("pyspark")`, and
      otherwise silently runs `pyspark.worker`. A tap called
      `tapworker` produced no files and no error.
    - **`read` instead of `read1` hung the job.** A buffered `read(65536)`
      on a socket waits for 65536 bytes or end of file. The JVM sends a
      few kilobytes and then waits for an answer, so both sides waited
      forever. The real worker reads exact lengths for the same reason.
    - **`spark.executorEnv.PYTHONPATH` is merged into the workers'
      `PYTHONPATH`** (`PythonUtils.mergePythonPaths` in the factory), which
      is how the daemon finds a module that is not installed.

    The tap is in the exercise, ready to use. It is a debugging tool
    for a laptop, not something to run on a cluster: it writes every
    row to disk, and the request contains a secret.

