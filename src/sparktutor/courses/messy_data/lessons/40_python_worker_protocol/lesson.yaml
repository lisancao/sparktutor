    ## The Runner on the JVM Side

    `BasePythonRunner`
    (`core/src/main/scala/org/apache/spark/api/python/PythonRunner.scala`)
    is the JVM half of every UDF evaluation. Its `compute(inputIterator,
    partitionIndex, context)`:

    1. Builds the worker's environment: `SPARK_REUSE_WORKER`,
       `PYTHON_UDF_BATCH_SIZE` (from
       `spark.sql.execution.python.udf.maxRecordsPerBatch`, default 100),
       `PYSPARK_EXECUTOR_MEMORY_MB`, `PYTHON_FAULTHANDLER_DIR`,
       `OMP_NUM_THREADS` (set to `spark.task.cpus` unless you set it,
       SPARK-42613), and more.
    2. Gets a worker from `SparkEnv.createPythonWorker`, which goes
       through the `PythonWorkerFactory` for that Python executable,
       module and environment.
    3. Writes the request: a header with everything the worker needs,
       then the input rows, then a closing marker.
    4. Returns an iterator that reads the worker's answers.

    Since Spark 4.0 there is no writer thread. SPARK-44705 ("Make
    PythonRunner single-threaded") replaced it with non-blocking sockets:
    `ReaderInputStream` uses a `Selector` and, whenever the task asks for
    output, writes pending input if the socket can take it and reads
    output if there is some. That loop is also where the idle timeout
    lives, which you will use below.

    The subclasses decide the payload: `PythonUDFRunner` for pickled
    UDFs (`BatchEvalPythonExec`), `ArrowPythonRunner` and its relatives
    for Arrow (`ArrowEvalPythonExec`, `MapInBatchExec`, Python data
    source reads), each with its own `writeUDF` and data writer.

