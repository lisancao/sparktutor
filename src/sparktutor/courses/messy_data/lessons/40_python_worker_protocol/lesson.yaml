    ## How Your Function Travels

    A UDF's command is `CloudPickleSerializer().dumps((func, return_type))`.
    Cloudpickle pickles the function **by value**: its code object, its
    defaults, and every global and closure variable it uses. In a
    classic session `pyspark.core.rdd._prepare_for_python_RDD` does the
    pickling once, on the driver:

    ```python
    pickled_command = ser.dumps(command)
    if len(pickled_command) > sc._jvm.PythonUtils.getBroadcastThreshold(sc._jsc):  # Default 1M
        broadcast = sc.broadcast(pickled_command)
        pickled_command = ser.dumps(broadcast)
    ```

    The threshold is `spark.broadcast.UDFCompressionThreshold` (3.0,
    default 1 MiB). Below it, the command bytes are part of the plan:
    they go into the stage's task binary (which the `DAGScheduler`
    broadcasts once per stage), and the runner writes them into **every
    task's request** to a worker, which unpickles them for every task.
    Above it, the command becomes a broadcast and the request carries
    only a small pickled reference.
    Measured with a set of stop words captured by the closure, reading
    the command length through
    `udf._unwrapped._judf.func().command().length()`:

    | Closure | Command bytes per task | Broadcast vars |
    |---|---|---|
    | set of 300 000 words (3 790 622 bytes pickled), default threshold | 56 | 1 (made for you) |
    | the same, threshold raised to 100m | 3 790 663 | 0 |
    | set of 60 000 words, default threshold | 709 766 | 0 |
    | 300 000 words in an explicit `sc.broadcast`, read with `bc.value` | 745 | 1 |

    With the threshold raised, the driver logged
    `WARN DAGScheduler: Broadcasting large task binary with size 3.6 MiB`
    (`DAGScheduler` warns above `TaskSetManager.TASK_SIZE_TO_WARN_KIB`,
    1000 KiB). The 60 000-word case is the one to worry about: just
    under the threshold, so 700 KB is written into every task's request
    and unpickled by a worker for every task.

    Fixes, best first:

    - **Broadcast explicitly** (`bc = sc.broadcast(obj)`, use
      `bc.value` inside). The worker reads it from a local file once per
      worker and keeps it across reused tasks.
    - **Load inside the worker**: read the data from a file or a model
      store in a module-level cache, so nothing large is pickled at all.
    - **Watch what the closure captures.** A method of an object
      captures `self`, and every attribute with it; a function that
      refers to a DataFrame or the SparkSession fails to pickle.
      `len(cloudpickle.dumps(f))` before you register a UDF is a cheap
      check.

    On Spark Connect the command bytes travel inside the plan protobuf
    (the `command` field you saw in "How Catalyst Plans Python"), so a
    large closure also makes every request large.

