    ## Telling Failures Apart

    Four ways a UDF can fail, triggered on purpose in a classic session
    (`spark.range(1).select(udf(f)("id")).collect()`):

    | The UDF does | You get (driver side) | Key text |
    |---|---|---|
    | `raise ValueError("bad row 0")` | `PythonException`, `getCondition()` = `PYTHON_EXCEPTION` | `An exception was thrown from the Python worker:` and your traceback |
    | `raise MemoryError(...)` | the same | `MemoryError` |
    | `os._exit(3)` or `os.kill(os.getpid(), SIGKILL)` | `Py4JJavaError` (no condition) | `Python worker exited unexpectedly (crashed). Consider setting 'spark.sql.execution.pyspark.udf.faulthandler.enabled' or'spark.python.worker.faulthandler.enabled' ...`, caused by `java.io.EOFException` |
    | a segmentation fault (`ctypes.string_at(0)`), faulthandler on | `Py4JJavaError` | `Python worker exited unexpectedly (crashed): Fatal Python error: Segmentation fault` and the Python stack, `File ".../ctypes/__init__.py", line 525 in string_at` |
    | sleeps past an idle timeout with kill on | `Py4JJavaError` | `PythonWorkerException: Python worker process terminated due to idle timeout (timeout: 3 seconds)` |

    (The missing space in `or'spark.python...` is in Spark's message.)
    The reasons are in the protocol. A Python exception is **caught by
    the worker** (`handle_worker_exception`), which writes
    `PYTHON_EXCEPTION_THROWN` and the traceback, so the JVM can build a
    proper error. A process that dies writes nothing: the JVM reads end
    of file in the middle of a frame, `BasePythonRunner.ReaderIterator`
    turns the `EOFException` into "exited unexpectedly (crashed)", and
    all it can add is the faulthandler file, if there is one. With
    faulthandler on, `os._exit` and `SIGKILL` still give
    `(crashed): ` with nothing after the colon, because neither runs a
    signal handler.

    This is also what a **worker killed for memory** looks like. On
    YARN or Kubernetes, Python workers live outside the JVM heap, in the
    container's overhead (`spark.executor.memoryOverhead`, by default
    `spark.executor.memoryOverheadFactor` 0.10 of executor memory with a
    minimum of `spark.executor.minMemoryOverhead` 384m, and 0.40 for
    non-JVM jobs on Kubernetes). When the kernel or the container
    runtime kills a worker for memory, it sends `SIGKILL`, and you get
    the second row of the table, with no Python traceback, even with
    faulthandler on. When you see "crashed" with an empty message on a
    cluster, check the node's kernel log and the container's memory
    first.

