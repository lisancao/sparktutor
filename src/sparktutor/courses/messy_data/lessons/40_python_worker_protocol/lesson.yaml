    ## What You'll Learn

    "How Catalyst Plans Python" ended with an `ArrowEvalPython` node in
    a physical plan. This lesson follows that node out of the JVM: which
    process runs your function, how the process is started and reused,
    and exactly which bytes go over the socket in each direction. You
    will record those bytes yourself with a wire tap and decode them.

    It builds on "Packaging, Registration, Testing and Debugging" (worker
    logs with `python_worker_logs()`) and "Tuning Python on Spark" (the
    cost of crossing into Python), and it explains the 4.2.0 hang you
    met in the previous lesson.

    By the end of this lesson you will be able to:

    - Name the classes and modules involved: `PythonWorkerFactory`,
      `pyspark/daemon.py`, `pyspark/worker.py`, `BasePythonRunner`,
      `PythonWorkerUtils`, `SpecialLengths`
    - Prove worker reuse with process IDs, and say when it is off
    - Decode a UDF task's request and response byte by byte, for the
      pickled and the Arrow protocols
    - Measure a UDF's pickled closure, explain the 1 MiB broadcast
      threshold, and shrink a closure with a broadcast variable
    - Turn a silent hang into an error with an idle timeout, and see
      where the worker is stuck with periodic traceback dumps
    - Tell a Python exception, a crashed worker and a killed worker apart
      from the error alone
    - Explain what `spark.executor.pyspark.memory` really limits, and why
      a small value crashes every Arrow UDF

