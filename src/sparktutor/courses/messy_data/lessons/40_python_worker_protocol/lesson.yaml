    ## The Response, Byte by Byte

    The worker answered with 102 bytes:

    ```text
    000000  00 00 00 22 80 05 95 17 00 00 00 00 00 00 00 5d   ..."...........]
    000010  94 28 8c 03 41 42 30 94 8c 03 41 42 31 94 8c 03   .(..AB0...AB1...
    000020  41 42 32 94 65 2e ff ff ff fd 00 00 01 a1 84 5a   AB2.e..........Z
    000030  43 a7 00 00 01 a1 84 5a 44 12 00 00 01 a1 84 5a   C......ZD......Z
    000040  44 12 00 00 00 00 00 00 00 00 00 00 00 00 00 00   D...............
    000050  00 00 00 00 00 00 00 00 00 00 ff ff ff ff 00 00   ................
    000060  00 00 ff ff ff fc                                 ......
    ```

    - `00 00 00 22`: a 34-byte frame, a pickle (protocol 5, `80 05`,
      Python's own) of the list `['AB0', 'AB1', 'AB2']`.
    - `ff ff ff fd`: -3, `TIMING_DATA`, followed by four longs written by
      `report_times`: boot, init and finish times in milliseconds since
      the epoch (`0x1a1845a43a7` and so on) and the processing time in
      milliseconds (0).
    - Two longs: memory and disk bytes spilled by the worker (0, 0).
    - `ff ff ff ff`: -1, `END_OF_DATA_SECTION`, then the accumulator
      updates: an int count (0 here) and one length-prefixed pickle per
      update.
    - `ff ff ff fc`: -4, `END_OF_STREAM`. The worker can be reused.

    The special lengths, from `SpecialLengths` in `PythonRunner.scala`
    (Python's copy is in `pyspark/serializers.py`):

    | Value | Name | Meaning |
    |---|---|---|
    | -1 | `END_OF_DATA_SECTION` | no more data frames |
    | -2 | `PYTHON_EXCEPTION_THROWN` | a string with the Python traceback follows |
    | -3 | `TIMING_DATA` | timing longs follow |
    | -4 | `END_OF_STREAM` | the task is over; echoed back to allow reuse |
    | -5 | `NULL` | a null value where a frame was expected |
    | -6 | `START_ARROW_STREAM` | an Arrow IPC stream follows (Python to JVM) |
    | -7 | `END_OF_MICRO_BATCH` | defined only on the JVM side (no Python counterpart in 4.2.0) |

    A frame length is just an int, so a negative number is how either
    side says "this is not data". That is elegant and fragile: if the two
    sides ever disagree about where they are in the stream, a byte of a
    string can be read as a length, and nothing in the format notices.

    For the Arrow UDF the response began with `ff ff ff fa` (-6), then
    the Arrow stream of results, then the same timing tail; its
    `processing_ms` was 147.

