    ## The UI as JSON

    Everything in the UI is also served as JSON under `/api/v1`, which is
    handy for checking a job from code:

    ```python
    import json, urllib.request

    base, app = spark.sparkContext.uiWebUrl, spark.sparkContext.applicationId
    for s in json.load(urllib.request.urlopen(f"{base}/api/v1/applications/{app}/stages")):
        print(s["stageId"], s["status"], s["numTasks"], s["inputRecords"],
              s["shuffleWriteRecords"], s["shuffleReadRecords"])
    ```

    For the log-level query this printed:

    ```
    2 COMPLETE 1 0 0 3
    1 SKIPPED 2 0 0 0
    0 COMPLETE 2 334 3 0
    ```

    The same API exists for jobs, executors and SQL queries
    (`/jobs`, `/executors`, `/sql`). The advanced lesson
    "Observability: Listeners, Metrics and Profiling Executors" uses it,
    along with event logs that keep this information after the session
    ends.

