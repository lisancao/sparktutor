    ## Fault Tolerance You Can Watch

    A task can fail: a machine dies, a disk fills, a Python function
    hits a value it did not expect. Spark retries failed tasks, and
    because it knows each partition's lineage it reruns only the failed
    piece. On a cluster each task may fail up to `spark.task.maxFailures`
    times (default 4). **In local mode the limit is 1**: any task
    failure fails the job, unless you ask for retries with
    `local[N,F]`.

    `TaskContext` tells code running in a task which partition it is
    working on and which attempt this is. This UDF crashes on the first
    attempt of partition 1 only:

    ```python
    from pyspark import TaskContext

    @F.udf("long")
    def flaky(x):
        ctx = TaskContext.get()
        if ctx.partitionId() == 1 and ctx.attemptNumber() == 0:
            raise RuntimeError("simulated crash on the first attempt")
        return x * 10

    spark.range(0, 8, 1, 4).select(flaky("id").alias("v")).agg(F.sum("v")).collect()
    ```

    With `master("local[2]")`:

    ```
    ERROR Executor: Exception in task 1.0 in stage 0.0 (TID 1)
    org.apache.spark.api.python.PythonException: [PYTHON_EXCEPTION] An exception was
    thrown from the Python worker: ... RuntimeError: simulated crash on the first attempt
    ERROR TaskSetManager: Task 1 in stage 0.0 failed 1 times; aborting job
    ```

    and the action raises `PythonException` with condition
    `PYTHON_EXCEPTION`. With `master("local[2,3]")` the same log line
    about task `1.0` appears (task 1, attempt 0), then Spark runs attempt
    1, which succeeds, and the action returns `[Row(sum(v)=280)]`.

    Retries are why the code you run on data should not have side
    effects you can't repeat: a task that sent an e-mail before it
    crashed sends it again on the retry. The advanced lesson
    "Determinism, Retries and Fault Injection" goes deep on this.

