    ## Partitions You Can See

    `spark.range(n)` makes a DataFrame with one column, `id`, holding
    the numbers from 0 to n - 1. It is handy for experiments because you
    can choose the number of partitions:

    ```python
    print(spark.range(1_000_000).rdd.getNumPartitions())      # local[4]
    print(spark.range(0, 10, 1, 3).rdd.getNumPartitions())    # start, end, step, partitions
    ```

    ```
    4
    3
    ```

    `df.rdd` is the lower-level dataset (an RDD, resilient distributed
    dataset) underneath a DataFrame, and `getNumPartitions()` asks it how
    many partitions it has. Another way, which also works on Spark
    Connect where `df.rdd` does not exist, counts the distinct values of
    `spark_partition_id()` (it misses partitions that hold no rows):

    ```python
    from pyspark.sql import functions as F
    spark.range(0, 10, 1, 3).select(F.spark_partition_id().alias("p")).distinct().count()   # 3
    ```

    Files become partitions too. With the sample data:

    ```python
    spark.read.text("data/messy/logs").rdd.getNumPartitions()     # 2 files -> 2
    spark.read.json("data/messy/events").rdd.getNumPartitions()   # 3 files -> 3
    ```

    Here each small file got its own partition. Spark packs many small
    files into one partition and splits big ones into several; "Plans,
    Partitions and Caching" explains the rules and the settings behind
    them.

