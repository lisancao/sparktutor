    ## Local Mode: The Whole Cluster in One JVM

    Spark's engine is written in Scala and runs on the Java Virtual
    Machine (JVM). On your laptop you run it in **local mode**, chosen
    with the master setting:

    ```python
    from pyspark.sql import SparkSession

    spark = (SparkSession.builder
             .master("local[4]")        # local mode with 4 worker threads
             .appName("WhySpark")
             .getOrCreate())
    print(spark.sparkContext.master, spark.sparkContext.defaultParallelism)
    ```

    ```
    local[4] 4
    ```

    In local mode the driver and the one executor are **the same JVM
    process**, and tasks run on threads inside it. Spark's own start-up
    log says so: the executor's id is literally `driver`.

    ```
    INFO Executor: Starting executor ID driver on host 192.168.50.13
    ```

    The master string decides how many tasks run at once:

    | Master | Meaning |
    |--------|---------|
    | `local` | one thread |
    | `local[4]` | four threads |
    | `local[*]` | one thread per core the JVM sees |
    | `local[4,2]` | four threads, and a failed task is tried up to 2 times |

    `defaultParallelism` is the number of threads, and it is also how
    many partitions Spark uses when nothing else decides. Local mode is
    the real engine (the same planner, scheduler, shuffle and file
    readers as a cluster), which is why everything you learn here
    carries over.

