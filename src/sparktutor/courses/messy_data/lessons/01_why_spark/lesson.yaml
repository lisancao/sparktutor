    ## The Process Tree, Measured

    On Linux or macOS you can see the processes while a job runs. For a
    script `pids.py` launched with `spark-submit`, `ps -o pid,ppid,args`
    showed (long paths cut):

    ```
    PID     PPID    COMMAND
    3350132 3350130 /usr/lib/jvm/java-17-openjdk-amd64/bin/java ... org.apache.spark.deploy.SparkSubmit pids.py
    3350557 3350132 python3 .../pids.py                       <- your script, child of the JVM
    3351400 3350132 python3 -m pyspark.daemon pyspark.worker  <- the daemon, child of the JVM
    3351452 3351400 python3 -m pyspark.daemon pyspark.worker  <- a worker, forked by the daemon
    ```

    With `python pids.py` instead, the only child of the Python process
    was the `java` process. Either way there is one JVM doing the work,
    one Python process holding your script, and Python workers that
    appear when Python code has to run on the data.

    One practical consequence of the `spark-submit` layout: in the 4.2.0
    source, `PythonRunner` starts your script with a standard input pipe
    that nothing ever writes to, so `input()` waits forever under
    `spark-submit`. It also merges your script's stderr into its stdout.
    Use `python script.py` for anything interactive (like the Spark UI
    example below).

