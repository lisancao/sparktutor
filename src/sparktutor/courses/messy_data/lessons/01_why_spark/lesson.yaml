    ## How SparkTutor Exercises Run

    Each lesson is a series of steps: reading, quiz questions, short code
    questions and one exercise. Some steps are marked for a depth
    (beginner, intermediate or advanced); you see the steps for every
    depth plus the ones for the depth you picked.

    The exercise step gives you a **starter file**. It has the functions
    you write (marked `# TODO`) and, under
    `if __name__ == "__main__":`, a **test harness**: code that starts a
    local Spark session, calls your functions, checks the results with
    `assert`, and prints `All tests passed!` at the very end. The starter
    fails straight away with a message saying what is missing; each
    function you finish moves the failure further down.

    When you run an exercise, SparkTutor:

    1. creates a fresh temporary folder,
    2. writes your code into it as `exercise.py`,
    3. copies the course's sample data next to it as `data/`, and
    4. runs `spark-submit exercise.py` with that folder as the working
       directory.

    So exercises always read the sample files with **relative paths**
    such as `data/messy/logs/app.log`, and anything they write goes to a
    temporary folder made with `tempfile.mkdtemp()`, never into `data/`.
    Each run starts clean, so nothing from a previous run is left over.

    To run an exercise yourself outside SparkTutor, put it in a folder
    that has a copy of the sample data (in the SparkTutor repository it
    is `src/sparktutor/data`) under the name `data`, and run
    `spark-submit exercise.py` or `python exercise.py` from that folder.

