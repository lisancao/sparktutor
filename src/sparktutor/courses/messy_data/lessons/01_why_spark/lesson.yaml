    ## How Spark Runs Your Code

    A running Spark program is called an **application**. It has:

    - **One driver.** The process that runs your program, keeps the
      `SparkSession` (your handle on Spark), turns your DataFrame code
      into a plan, splits the plan into tasks and hands them out. It
      also collects any results you ask for.
    - **Executors.** Processes that run tasks on partitions of data and
      can keep partitions in memory. On a cluster there are many, on
      many machines.
    - **A cluster manager** (Standalone, YARN or Kubernetes in Spark 4)
      that starts the executors. In local mode there is none.

    The work is organized in four layers:

    ```
    action (show, count, collect, write)
      -> job       one or more per action
        -> stage   a run of steps that need no data movement
          -> task  one stage applied to one partition
    ```

    - A **partition** is a chunk of the data. A DataFrame with 8
      partitions is processed by 8 tasks per stage.
    - A **task** is the unit of work an executor runs: one stage's steps
      on one partition. Tasks of the same stage run in parallel, as many
      at once as there are cores.
    - A **shuffle** is when rows must move between partitions, because
      the answer for one key needs rows that sit in many partitions
      (`groupBy`, most joins, `orderBy`, `distinct`, `repartition`).
      Each task writes its rows sorted into buckets by key, and the next
      stage's tasks fetch their bucket from every writer.
    - A **stage** ends wherever a shuffle is needed. Steps such as
      `select`, `filter` and `withColumn` that work row by row inside a
      partition are **narrow** and share a stage. Steps that need a
      shuffle are **wide** and start a new one.

    A **job** is what one action asks for. Most simple actions start one
    job; with adaptive query execution (on by default since Spark 3.2,
    SPARK-33679) a query with a shuffle usually runs as one job per
    shuffle plus a final one, as you will see below.

