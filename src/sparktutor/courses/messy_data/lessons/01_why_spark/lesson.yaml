    ## Exercise: Make Spark Show Its Work

    Each idea in this lesson leaves evidence you can read from code. The
    harness starts Spark with `master("local[4,2]")` (4 threads, 2
    attempts per task) and asks your functions for that evidence.

    Implement:

    1. `partition_count(df)`: the number of partitions of `df`.
    2. `run_and_report(spark, group, action)`: tag jobs with
       `sc.setJobGroup(group, ...)`, call `action()`, call the provided
       `settle(spark)` (it waits until Spark has finished recording the
       jobs), then use `sc.statusTracker()` to return a dict with
       `result`, `jobs` (the number of jobs in the group), `tasks` (the
       completed tasks of each stage that ran, in stage id order,
       leaving out skipped stages with 0) and `failed_tasks`.
    3. `has_exchange(df)`: whether `df.explain()` prints an `Exchange`.
       `explain()` prints instead of returning, so capture its output
       with `contextlib.redirect_stdout`.
    4. `python_worker_pids(spark, partitions)`: the set of process ids
       reported by a UDF that returns `os.getpid()`.
    5. `flaky_sum(spark)`: make the UDF crash on attempt 0 of partition
       1, and return the sum.

    The checks connect each concept to its evidence:

    - 6 partitions when you ask for 6, and 4 (the default parallelism)
      when you don't
    - transformations alone start 0 jobs
    - a filter and `collect()` over 6 partitions run 1 job with tasks
      `[6]`; a `groupBy` runs tasks `[6, 1]`
    - `read.json` without a schema runs a job, with a schema it runs none
    - a `groupBy` plan has an `Exchange`, a filter plan does not
    - UDF process ids never include the driver's own
    - the flaky sum is still 280, with exactly 1 failed task attempt
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "Stage ids: for each job id in tracker.getJobIdsForGroup(group), extend a list with tracker.getJobInfo(job_id).stageIds; then for each sorted unique id, info = tracker.getStageInfo(s) and keep info.numCompletedTasks when it is above 0. For has_exchange: buf = io.StringIO(); with contextlib.redirect_stdout(buf): df.explain(); return 'Exchange' in buf.getvalue()."

