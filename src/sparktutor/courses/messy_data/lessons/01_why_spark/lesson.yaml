    ## A Plan With No Shuffle

    `explain()` prints the **physical plan**: the steps Spark will run,
    read from the bottom up.

    ```python
    evens.explain()
    ```

    ```
    == Physical Plan ==
    *(1) Project [id#0L, (id#0L * id#0L) AS sq#4L]
    +- *(1) Filter ((id#0L % 2) = 0)
       +- *(1) Range (0, 1000, step=1, splits=8)
    ```

    - `Range (... splits=8)`: produce the numbers in 8 partitions.
    - `Filter`, then `Project` (Spark's name for computing the selected
      columns).
    - `*(1)` marks steps that Spark fused into one piece of generated
      code (whole-stage code generation), so each row flows through all
      three without stopping.
    - `#0L` is an internal id for each column (`L` means long). You can
      ignore those numbers.

    Every step here is narrow, so this is one stage, and `collect()` on
    it runs one job with one task per partition: 8 tasks.

