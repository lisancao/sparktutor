    ## Lazy Evaluation: Plans First, Work Later

    DataFrame methods come in two kinds:

    - **Transformations** (`select`, `filter`, `withColumn`, `groupBy`
      with an aggregation, `join`, `orderBy`) return a new DataFrame
      that *describes* a computation. They run nothing.
    - **Actions** (`show`, `count`, `collect`, `take`, `first`,
      `toPandas`, `write...`) need an answer, so they make Spark plan the
      whole chain and run it.

    You can watch this with the status tracker, which lists the jobs a
    session has run. In a fresh session:

    ```python
    sc = spark.sparkContext
    tracker = sc.statusTracker()

    df = spark.range(0, 1000, 1, 8)
    evens = df.filter(F.col("id") % 2 == 0).withColumn("sq", F.col("id") * F.col("id"))
    print(tracker.getJobIdsForGroup())     # jobs so far
    print(evens.count())
    print(sorted(tracker.getJobIdsForGroup()))
    ```

    ```
    []
    500
    [0, 1]
    ```

    The filter and the new column ran nothing. `count()` started jobs.
    (`getJobIdsForGroup()` with no argument lists jobs that were not
    tagged with a job group; the exercise tags its own.)

    Laziness is what lets Spark optimize: by the time an action runs,
    Spark knows everything you want and can, for example, read only the
    columns you use. It also means an error in a transformation can
    surface later, at the action.

    One surprise: some reads are not lazy. Reading JSON **without a
    schema** runs a job straight away, because Spark must read the data
    to infer the columns and types:

    ```python
    spark.read.json("data/messy/events")                      # runs a job
    spark.read.schema("event STRING").json("data/messy/events")  # runs none
    spark.read.text("data/messy/logs")                         # runs none
    ```

    That inference pass is the first cost of not having a schema;
    "Schemas for Data You Don't Control" covers the rest.

