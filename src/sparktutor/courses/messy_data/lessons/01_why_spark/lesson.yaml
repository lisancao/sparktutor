    ## Where Python Fits

    Spark's engine is JVM code. So what is your Python script doing?

    In **classic PySpark** (what `.master(...)` and `spark-submit` give
    you), your script runs in a normal Python process next to the JVM.
    The two talk through **Py4J**, a library that lets Python call Java
    methods over a local socket. When you write

    ```python
    errors = logs.filter(F.col("value").contains("ERROR")).count()   # 18
    ```

    Python does not touch a single log line. It asks the JVM to build a
    plan. When an action runs, the JVM reads the files, filters, shuffles
    and aggregates, and sends back only the result. That is why
    DataFrame code in Python is about as fast as the same code in Scala:
    the work happens in the engine either way.

    Who starts whom depends on how you launch:

    - `python my_script.py`: your Python process starts the JVM as a
      child process.
    - `spark-submit my_script.py` (what SparkTutor uses): the JVM starts
      first and runs your script as its child Python process.

    Python code that must run **on the data** is different. A Python
    UDF (user-defined function: a Python function you apply to a
    column), a pandas UDF, `mapInPandas` and Python data sources run in
    separate **Python worker processes** that the executors start. Rows
    are sent to them, your function runs, and results are sent back.
    You can prove it with a UDF that reports its process id:

    ```python
    import os

    @F.udf("int")
    def worker_pid(_):
        return os.getpid()

    pids = {r[0] for r in spark.range(0, 100, 1, 4).select(worker_pid("id")).collect()}
    print("driver pid", os.getpid(), "udf pids", sorted(pids))
    ```

    ```
    driver pid 3171260 udf pids [3171688, 3171689, 3171692, 3171694]
    ```

    Four partitions, four worker processes, none of them your script.
    `ps` shows what they are: `python3 -m pyspark.daemon pyspark.worker`
    processes forked by one `pyspark.daemon` process, whose parent is the
    JVM. By default (`spark.python.worker.reuse`, true) a worker is kept
    and reused for later tasks instead of starting a new process each
    time.

    The plan shows the boundary too
    (`spark.range(0, 100, 1, 4).select(worker_pid("id")).explain()`):

    ```
    == Physical Plan ==
    *(2) Project [pythonUDF0#3 AS worker_pid(id)#2]
    +- ArrowEvalPython [worker_pid(id#0L)#1], [pythonUDF0#3], 101
       +- *(1) Range (0, 100, step=1, splits=4)
    ```

    `ArrowEvalPython` is the step that ships batches of rows to Python
    workers in Arrow format (Arrow-optimized Python UDFs are the default
    in Spark 4.2, SPARK-54555). Moving rows out of the JVM and back costs
    time, so the rule of thumb is: use built-in functions when one
    exists, and Python when you need Python. Later lessons ("Running a
    Model over Your Data with pandas UDFs", and "The Python Worker
    Protocol" in the advanced level) build on this.

