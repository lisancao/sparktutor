    ## The Spark UI

    While a session is alive, the driver serves a web UI, by default at
    `http://localhost:4040`. If that port is taken (another session is
    running), Spark logs

    ```
    WARN Utils: Service 'SparkUI' could not bind on port 4040. Attempting port 4041.
    ```

    and moves up one port. `spark.sparkContext.uiWebUrl` tells you where
    it ended up.

    The UI disappears when the session stops, and a script stops its
    session at the end. To look around, keep the session open. Save this
    as `first_look.py` in a folder that contains the sample `data/`
    folder, and run it with `python first_look.py` (not `spark-submit`,
    which does not connect `input()` to your keyboard):

    ```python
    from pyspark.sql import SparkSession, functions as F

    spark = SparkSession.builder.master("local[4]").appName("FirstLook").getOrCreate()

    logs = spark.read.text("data/messy/logs")
    levels = (logs
        .select(F.regexp_extract("value", r" (INFO|WARN|ERROR) ", 1).alias("level"))
        .filter(F.col("level") != "")
        .groupBy("level").count()
        .orderBy("level"))
    levels.show()

    print("Spark UI:", spark.sparkContext.uiWebUrl)
    input("Press Enter to stop Spark (the UI closes with it)...")
    spark.stop()
    ```

    Open the printed address. The tabs in 4.2.0 are **Jobs**,
    **Stages**, **Storage**, **Environment**, **Executors** and
    **SQL / DataFrame**:

    - **Jobs**: the two jobs from the table above, each with its stages
      and a task count such as `2/2`. Click a job for its stages.
    - **Stages**: one row per stage, with input size, shuffle read and
      shuffle write. The skipped stage is listed as skipped.
    - **SQL / DataFrame**: one entry per query, with a diagram of the
      plan that adaptive execution finally ran, and row counts on each
      step.
    - **Executors**: in local mode a single executor called `driver`,
      with 4 cores.
    - **Environment**: every setting in effect, handy for checking a
      configuration value.

    In a SparkTutor exercise the session ends when the script does, so
    use the UI in your own scripts and use `explain()` and the status
    tracker inside exercises.

