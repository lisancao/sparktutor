    ## Why a Laptop Script Stops Scaling

    For a few megabytes of data, plain Python or pandas is the right
    tool. Read the file, loop or call `df.groupby`, done. The trouble
    starts as the data grows:

    - **Memory.** pandas loads the whole dataset into the memory of one
      process, usually several times its size on disk once it is parsed.
      A 20 GB folder of JSON does not fit on most laptops.
    - **One core.** A Python loop runs on one CPU core at a time (the
      interpreter lock lets only one thread run Python code at once).
      Your laptop has several cores; a server has dozens.
    - **One machine.** When one machine is not enough, a script has no
      way to spread itself over ten.
    - **Failure.** A script that crashes after three hours on line 9
      million starts again from line 1.

    Spark changes the model instead of making Python faster:

    - **Partitions.** Spark splits data into chunks called partitions
      and processes them independently, so the work runs on every core
      of every machine you give it, and no single process needs to hold
      all the data. Data that does not fit in memory is processed a
      piece at a time and spilled to disk when needed.
    - **Lazy plans.** You describe *what* you want; Spark builds a plan
      and optimizes it before running anything. It can skip columns you
      never use, push filters down to the file reader, and choose how to
      join.
    - **Fault tolerance.** Spark remembers how each partition was
      computed (its lineage), so when a task fails or a machine
      disappears it recomputes just the lost pieces.
    - **The same code at any size.** The program you test on a laptop
      runs unchanged on a cluster.

    The costs are real too. Starting a Spark session took two to three
    seconds on the machine that wrote this lesson, every query has a
    planning overhead, and the sample files in this course (well under a
    megabyte) would be faster in pandas. Spark pays off when the data, or
    the number of files, or the need to survive failures, outgrows one
    process. Messy data hits that point early: millions of small JSON
    files, a folder of images, logs from a fleet of servers.

- Class: text
  Depth: beginner
  Output: |
    Think of grading a stack of 10,000 exam papers. One teacher working
    alone (a Python script) gets there eventually, if they don't fall ill
    half way. A school does it differently: the head teacher splits the
    stack into piles (partitions), hands one pile to each grader (tasks),
    and keeps track of who has which pile. If a grader goes home sick,
    only their pile is handed to someone else. When the head teacher
    wants "average score per class", each grader first totals their own
    pile by class, then the totals for each class are passed to one
    person who adds them up. That passing of papers between graders is
    what Spark calls a **shuffle**, and it is the expensive part.

