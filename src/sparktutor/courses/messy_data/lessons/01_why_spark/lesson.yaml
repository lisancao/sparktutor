    ## Spark Classic and Spark Connect

    PySpark 4.x can reach the engine in two ways:

    - **Spark Classic**: your Python process and the driver JVM sit side
      by side and talk through Py4J, as described above. Created with
      `.master(...)`, and what `spark-submit` runs.
    - **Spark Connect** (introduced in Spark 3.4): your Python program is
      a thin client. It builds an unresolved plan, sends it over the
      network (gRPC) to a Spark Connect server, and gets results back as
      Arrow batches. Created with `.remote("sc://host:15002")`, or
      `.remote("local[*]")` to start a local server for testing.

    The DataFrame and SQL APIs are the same. What changes, measured on
    4.2.0:

    | | Classic | Connect |
    |--|---------|---------|
    | `spark.sparkContext` | works | `JVM_ATTRIBUTE_NOT_SUPPORTED` |
    | `df.rdd` | works | `NOT_IMPLEMENTED` ("rdd is not implemented.") |
    | `df._jdf` (JVM handle) | works | `JVM_ATTRIBUTE_NOT_SUPPORTED` |
    | `df.select("nope")` | raises `UNRESOLVED_COLUMN.WITH_SUGGESTION` at once | returns; the error comes at the first action |
    | `spark.read.json("no/such/dir")` | raises `PATH_NOT_FOUND` at once | returns; the error comes later |

    The last two rows matter for messy data: on Connect, analysis happens
    on the server when the plan is executed, so typos and missing paths
    are reported later than you might expect.

    **What this course uses.** Exercises run in classic mode under
    `spark-submit`, so `sparkContext`, `df.rdd` and the status tracker
    all work, and this lesson's exercise uses them. Where a feature
    behaves differently on Connect, the lesson says so. Declarative
    Pipelines (used by the intermediate capstone) always run on a local
    Connect server, and the advanced level has a lesson on extending
    Connect ("Spark Connect Plugins").

