    ## Shuffles and Stages, With Real Data

    Now a query a person would actually write: count the log levels in
    the sample application logs.

    ```python
    logs = spark.read.text("data/messy/logs")        # one row per line, column "value"
    levels = (logs
        .select(F.regexp_extract("value", r" (INFO|WARN|ERROR) ", 1).alias("level"))
        .filter(F.col("level") != "")                 # lines with no level word
        .groupBy("level").count()
        .orderBy("level"))
    levels.show()
    ```

    ```
    +-----+-----+
    |level|count|
    +-----+-----+
    |ERROR|   18|
    | INFO|   26|
    | WARN|   16|
    +-----+-----+
    ```

    (`regexp_extract` returns the text matched by group 1 of the
    pattern, or an empty string when the line does not match; "Text and
    Logs" covers it properly.)

    The plan, trimmed:

    ```
    AdaptiveSparkPlan isFinalPlan=false
    +- Sort [level ASC NULLS FIRST], true, 0
       +- Exchange rangepartitioning(level ASC NULLS FIRST, 200)
          +- HashAggregate(keys=[level], functions=[count(1)])
             +- Exchange hashpartitioning(level, 200)
                +- HashAggregate(keys=[level], functions=[partial_count(1)])
                   +- Project [regexp_extract(value, ...) AS level]
                      +- Filter (... NOT (regexp_extract(value, ...) = ))
                         +- FileScan text [value] ...
    ```

    Read it bottom up:

    1. `FileScan text`: read the lines.
    2. `Filter` and `Project`: keep lines with a level, compute `level`.
    3. `HashAggregate ... partial_count`: each task counts the levels
       **in its own partition** first. This is the "each grader totals
       their own pile" step, and it is why only a few rows cross the
       shuffle.
    4. `Exchange hashpartitioning(level, 200)`: **the shuffle.** Rows
       move so that all counts for one level meet in one partition. 200
       is `spark.sql.shuffle.partitions`, the default number of shuffle
       partitions.
    5. `HashAggregate ... count`: add up the partial counts.
    6. `Exchange rangepartitioning` and `Sort`: the `orderBy`, which
       needs its own data movement.

    Every `Exchange` is a stage boundary. `AdaptiveSparkPlan
    isFinalPlan=false` says adaptive query execution may still change
    the plan while it runs, using real sizes measured at each shuffle.

