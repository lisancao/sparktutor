    ## What You'll Learn

    This is the first lesson of "Messy Data with Apache Spark 4.2: Zero
    to Internals". You need to know Python (functions, classes, dicts,
    `with` blocks, running a script from a terminal). You don't need to
    know anything about Spark, Java or distributed computing; this lesson
    builds those ideas from the ground up.

    By the end of this lesson you will be able to:

    - Say what this course means by messy data, how the course is laid
      out in three levels, and how its exercises run
    - Explain why a plain Python script stops coping as data grows, and
      what Spark adds (and what it costs)
    - Name the parts of a running Spark program (driver, executors,
      jobs, stages, tasks, partitions, shuffles) and point to each one
      in real output
    - Explain local mode, where the whole "cluster" is one Java process
      on your laptop
    - Say where your Python code runs: what stays in your script, what
      runs inside the Java engine, and what runs in separate Python
      worker processes
    - Watch Spark retry a task that crashed
    - Tell Spark Classic from Spark Connect, and know which one this
      course uses where
    - Open the Spark UI and read the jobs, stages and tasks of a query

    Every output in this lesson was produced by stock PySpark 4.2.0. Your
    process ids, ports and timings will differ; the structure won't.

