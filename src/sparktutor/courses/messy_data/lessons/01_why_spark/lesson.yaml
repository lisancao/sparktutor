    ## The Basics Level

    Basics follows the shape of the book *Learning Spark*: how Spark
    runs, getting started, the structured APIs, the built-in data
    sources, complex types and functions, plans and tuning, streaming, a
    table format, and running models, then what is new in Spark 4.x. The
    difference is the data: every lesson works on messy files.

    In order, the Basics lessons cover:

    - **Foundations**: how Spark runs (this lesson), setup and a tour of
      the sample data, schemas for data you don't control, and cleaning
      values with column expressions.
    - **Reading every kind of file**: files as bytes, text and logs, CSV,
      JSON drift, complex types, VARIANT, XML, Avro and Protobuf,
      documents, images and audio.
    - **Extending and running**: your first Python data source, plans
      and partitions, your first streaming job, landing data in Delta
      Lake, text analytics, running a model over your data, and what
      Spark 4.x adds.

    By the end of Basics you can take a folder of mixed, drifting,
    partly broken files and turn it into clean, typed tables with Spark,
    with the bad records kept aside for review rather than silently lost,
    and you can explain what Spark did to get there.

    **What it assumes**: Python only. Each Spark idea is explained the
    first time it appears. The free `learning_spark` course in SparkTutor
    is a good companion but not required.

