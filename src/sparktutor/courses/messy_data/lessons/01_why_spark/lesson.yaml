    ## The Course: Messy Data at Three Levels

    Most tutorials start from tidy tables. Real data rarely arrives that
    way. In this course **messy data** means anything that does not fit
    a fixed table without work:

    - **Semi-structured** records whose shape changes: JSON events where
      a field turns from a number into an object, XML with optional
      elements, logs that switch format half way through a day.
    - **Unstructured** text: Markdown policies, e-mails, PDFs, a file in
      an old encoding.
    - **Binary and multimodal** files: images, audio, files whose names
      lie about what they are, files that are cut off or corrupt.
    - **Plain dirty values**: blanks, duplicates, numbers stored as text,
      dates in three formats, keys that point at nothing.

    The sample data in `data/messy/` has all of these, planted on
    purpose and generated by a script so every run sees the same bytes.
    The next lesson tours it folder by folder.

    The course has three levels:

    | Level | From | To | You will |
    |-------|------|----|----------|
    | Basics | "Why Spark for Messy Data, and How It Runs Your Code" | "What Spark 4.x Adds for Messy Data" | read, clean and land every kind of messy data with Spark's built-in tools |
    | Intermediate | "Reading a Custom File Format, in Parallel" | "Capstone: An Unstructured Ingestion Source and a Catalog Pipeline" | build production tools: Python data sources, UDTFs, tuning, quality-checked ingestion, similarity search, entity resolution |
    | Advanced | "How Catalyst Plans Python" | "Final Project: Your Own Connector" | go inside the engine: plans, the Python worker protocol, Java connectors and extensions, Parquet and VARIANT bytes, distributed algorithms, reliability |

    Each level assumes the one before it. Lessons refer to each other by
    title, so when a lesson mentions "Text and Logs", that is the
    lesson to revisit.

