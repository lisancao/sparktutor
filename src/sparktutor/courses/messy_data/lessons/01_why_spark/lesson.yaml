    ## A Short History

    Spark began as a research project at UC Berkeley; 1.0 was released
    in 2014. Spark 2.0 (2016) made the DataFrame and `SparkSession` the
    main API. Spark 3.0 (2020) added adaptive query execution
    (SPARK-31412), turned on by default in 3.2. Spark 3.4 (2023)
    introduced Spark Connect. Spark 4.0 (2025) made ANSI SQL mode the
    default (SPARK-44444), so a bad cast fails instead of quietly
    becoming NULL, added the VARIANT type for semi-structured data
    (SPARK-45827) and a built-in XML source (SPARK-44265), and made
    Connect a first-class mode (the `spark.api.mode` setting and a
    separate `pyspark-client` package). Spark 4.1 followed in December
    2025 and Spark 4.2.0, which this course targets, in 2026. Lessons
    name the version where each feature they use arrived, and "What
    Spark 4.x Adds for Messy Data" closes the Basics level with the 4.x
    features that matter most for messy data.

