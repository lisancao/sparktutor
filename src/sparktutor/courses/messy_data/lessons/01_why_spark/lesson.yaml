    ## Summary

    In this lesson you learned:

    - **The course**: messy data (semi-structured, unstructured, binary,
      dirty values) at three levels, Basics, Intermediate and Advanced.
      Exercises run with `spark-submit` in a fresh folder with the sample
      data in `data/`, and finish with `All tests passed!`.
    - **Why Spark**: partitions processed in parallel, lazy optimized
      plans, retries from lineage, the same code at any size; at the
      price of start-up and planning overhead that small data doesn't
      repay.
    - **How it runs**: a driver plans, executors run tasks; an action
      starts one or more jobs, a job has stages split at shuffles, a
      stage runs one task per partition. `Exchange` in a plan is a
      shuffle.
    - **Local mode** is one JVM with N threads (`local[N]`), with no
      task retries unless you write `local[N,F]`.
    - **Python**: your script builds plans through Py4J; the engine does
      the work in the JVM; Python UDFs run in separate Python worker
      processes (`ArrowEvalPython` in the plan).
    - **Laziness**: transformations run nothing, actions run jobs, and
      reading JSON without a schema runs a job to infer it.
    - **Classic vs Connect**: Connect has no `sparkContext`, `rdd` or
      `_jdf`, and reports analysis errors at the first action. This
      course runs exercises in classic mode.
    - **The Spark UI** at port 4040 (or the next free port) shows jobs,
      stages, tasks and plans while the session is alive.

    Next: **Setup, a First Session and a Tour of the Sample Data**,
    where you install Spark from scratch, learn the everyday DataFrame
    tools, and open every folder of the sample data.
