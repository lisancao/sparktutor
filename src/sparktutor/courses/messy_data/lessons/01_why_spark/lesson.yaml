  Depth: all
  Output: |
    ## What Actually Ran

    The Spark UI (below) records every job and stage. For the
    `levels.show()` above, on `local[4]`, it reported:

    | Job | Stages | Tasks run | What happened |
    |-----|--------|-----------|---------------|
    | 0 | 0 | 2 | read 334 lines (2 files, 2 partitions), counted per partition, wrote 3 rows to the shuffle |
    | 1 | 1 (skipped), 2 | 1 | stage 1 was job 0's work, already done; stage 2 read the 3 shuffled rows and finished the query |

    Four things to notice:

    - **One action, two jobs.** Adaptive execution runs the part before
      a shuffle as its own job, looks at the result, then plans the
      rest. Here it saw tiny data and merged the 200 shuffle partitions
      into one, so the rest of the query needed only 1 task.
    - **Skipped stages** are stages whose output already exists. Spark
      lists them in the later job but does not run them again.
    - **334 rows in, 3 rows shuffled.** The partial aggregation before
      the shuffle did most of the work where the data was.
    - **No sort exchange ran.** `show()` only fetches the rows it prints
      (in the 4.2.0 source it calls `take(numRows + 1)`, so 21 rows by
      default; the extra row tells it whether to print "only showing top
      20 rows"). For "the first 21 rows in order" Spark plans a
      `TakeOrderedAndProject` step instead of a full `Sort` with its own
      exchange, as `levels.limit(21).explain()` shows. Run
      `levels.collect()` instead and the full sort runs: 4 jobs, one of
      them sampling the data to choose the sort ranges.

    So the plan `explain()` prints is for the DataFrame as written; the
    action you call and adaptive execution can both change what runs,
    and the UI shows what really did. "Plans, Partitions and Caching"
    goes deeper into both.

