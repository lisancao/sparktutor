    ## A 4.2.0 Hang: Plain UDFs Over Parquet Columns

    New in 4.2 (SPARK-56350): Arrow-based Python UDFs can take columnar
    input directly from a scan that produces Arrow-backed batches,
    skipping a conversion (`spark.sql.execution.arrow.pythonUDF.columnarInput.enabled`,
    default `true`). On stock 4.2.0 this path has a bug: a **plain
    `@sf.udf`** (Arrow-optimized, evaluation type 101) applied
    **to a column read by the vectorized Parquet reader**, directly or
    through some expressions such as `col + 0`, makes the Python worker
    wait forever. No error,
    no progress. It is SPARK-58241, fixed in 4.2.1 and 4.3.0.

    Reproduced for this lesson, with a timeout so the script ends:

    ```python
    spark.range(100).selectExpr("cast(id as int) as status").write.parquet(p)
    plus1 = sf.udf(lambda s: s + 1, "int")
    spark.read.parquet(p).select(plus1("status").alias("x")).agg(sf.sum("x")).first()
    ```

    The job never finished within 90 seconds; with
    `spark.conf.set("spark.sql.execution.arrow.pythonUDF.columnarInput.enabled",
    "false")` the same query returned 5050 at once. The shape matters.
    In our runs a `pandas_udf`, `useArrow=False`, or a `Filter` between
    the scan and the UDF (`filter("status >= 0")`) all returned 5050,
    while `plus1(sf.col("status") + 0)` hung just like `plus1("status")`,
    so don't count on an expression around the column. On 4.2.0, set the
    configuration to `false` in jobs that apply plain UDFs to Parquet
    columns, or upgrade to 4.2.1. The advanced lessons "How
    Catalyst Plans Python" and "The Python Worker Protocol" take this bug
    apart.

