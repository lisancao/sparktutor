    ## Python That Runs More Often Than You Think

    A UDF that counts its calls in an accumulator (`acc.add(1)` inside
    the function) shows what the plan implies. Over `spark.range(1000)`:

    | Query | Rows | UDF calls |
    |---|---|---|
    | `df.withColumn("y", f("id")).filter(sf.col("y") > 500)`, collected | 500 | **1500** |
    | the same with `f.asNondeterministic()` | 500 | 1000 |
    | `withColumn("y", f(...))` then two aggregations on `y` | | **2000** |
    | the same after `.cache()` | | 1000 |
    | `df.withColumn("y", f("id")).count()` | | **0** |

    **A filter on a UDF column evaluates the UDF twice.** The optimizer
    pushes the filter below the projection by copying the expression, so
    the plan has two Python nodes for the same function:

    ```text
    *(3) Project [id#0L, pythonUDF0#11L AS y#2L]
    +- ArrowEvalPython [plus1(id#0L)#1L], [pythonUDF0#11L], 101
       +- *(2) Project [id#0L]
          +- *(2) Filter (pythonUDF0#10L > 500)
             +- ArrowEvalPython [plus1(id#0L)#1L], [pythonUDF0#10L], 101
    ```

    Spark 4.2 has a guard against this double evaluation for Scala UDFs
    (SPARK-47672, `spark.sql.optimizer.avoidDoubleFilterEval`), but not
    for Python UDFs; that arrives in 4.4.0 (SPARK-59693). On 4.2, marking
    the UDF `asNondeterministic()` stops the copy (one node, 1000 calls),
    at the price of telling the optimizer something untrue that also
    blocks other rewrites. Often simpler: filter on the input columns
    instead, or cache after the UDF.

    **Every action recomputes everything** that is not cached, Python
    included. Two aggregations over a UDF column ran the UDF 2000 times;
    after `cache()` and a first action, 1000.

    **`count()` can run none of it.** Spark prunes columns the action
    does not need, so `df.withColumn("y", f("id")).count()` never called
    `f`. A "benchmark" that times `count()` measures nothing about your
    UDF. (The exercise counts calls through actions that use the
    column.)

