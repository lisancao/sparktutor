  EstimatedMinutes: 50

- Class: text
  Depth: all
  Output: |
    ## What You'll Learn

    "Plans, Partitions and Caching" taught you to read a plan, count
    partitions, choose between `repartition` and `coalesce`, control
    files per folder with `partitionBy`, and cache. "Types, Arrow and
    Performance" showed why yielding Arrow batches from a data source
    beats yielding tuples. This lesson applies both to the part of a job
    that usually costs the most with messy data: **your Python code**.

    By the end of this lesson you will be able to:

    - Explain where the time goes when Spark runs Python, and find every
      Python step in a plan (`BatchEvalPython`, `ArrowEvalPython`,
      `MapInPandas`, `MapInArrow`, `FlatMapGroupsInPandas`)
    - Measure built-ins against the kinds of Python UDF, with ratios you
      can trust more than absolute times
    - Spot Python that runs **more often than you think**: a filter that
      blocks pushdown, a filter on a UDF column that evaluates the UDF
      twice, several actions that recompute it, and a `count()` that
      runs none of it
    - Profile a UDF with the built-in profiler (4.0)
    - Spread Python work over cores when the input arrives in one piece,
      and split a hot key with salting
    - Know the worker and Arrow settings worth touching, and a 4.2.0 hang
      to avoid

    The exercise takes a deliberately slow error report over the web
    server log and tunes it. It is graded on plan shape, call counts and
    output files, never on timings, because timings depend on your
    machine.

- Class: text
  Depth: all
  Output: |
    ## Where the Time Goes

    Spark's own operators run in the JVM on binary rows. A Python UDF
    cannot: for every batch of rows, Spark

    1. converts the input columns to a wire format (pickled rows for the
       old path, Arrow record batches for the others),
    2. sends them over a local socket to a Python worker process (started
       or reused per task),
    3. the worker deserializes them, calls your function, serializes the
       results, and sends them back,
    4. Spark converts the results to its own rows and continues.

    So a Python step costs serialization both ways, a process boundary,
    and the Python interpreter itself, on top of whatever your function
    does. Every tuning rule in this lesson comes down to one of:

    - **don't cross at all** (use a built-in),
    - **cross fewer times** (fewer rows, fewer Python nodes, fewer
      actions),
    - **cross in bigger, cheaper units** (Arrow batches, vectorized
      pandas or pyarrow code), or
    - **cross in parallel** (enough partitions to keep every core busy).

    The advanced level opens the box: "How Catalyst Plans Python" for the
    planner rules and "The Python Worker Protocol" for the socket
    protocol and the worker's life.

- Class: text
  Depth: beginner
  Output: |
    Think of an interpreter at a meeting between two people who don't
    share a language. Every sentence is said, translated, answered and
    translated back. It works, but it is slow. You speed it up by saying
    things the other side already understands (built-ins), by sending
    whole paragraphs instead of single sentences (Arrow batches), by not
    asking the same question twice (caching), and by hiring more
    interpreters when there is a lot to say (more partitions).

