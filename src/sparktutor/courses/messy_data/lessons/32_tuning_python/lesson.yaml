- Class: text
  Depth: all
  Output: |
    ## How Much Slower? Measure It

    The same four status parsers over 2 million synthetic log lines (a
    cached DataFrame in 8 partitions, `local[4]` on a 16-core machine,
    `select(sf.sum(...)).first()`, best of three):

    | Parser | Time | Ratio |
    |---|---|---|
    | built-in `regexp_extract` | 0.27 s | 1.0 |
    | `pandas_udf` with `Series.str.extract` | 0.39 s | 1.5 |
    | `@sf.udf`, Arrow-optimized (4.2 default) | 0.73 s | 2.7 |
    | `@sf.udf`, `useArrow=False` | 0.98 s | 3.6 |

    Your numbers will differ; the order rarely does. Three lessons from
    the ratios: a built-in wins whenever one exists; a vectorized pandas
    function is close behind, because the per-row work happens in
    compiled code; and the default Arrow path is usually cheaper than
    the old pickled path for light functions like these. When the
    function itself dominates (a model, as in "Running a Model over Your
    Data with pandas UDFs"), the two come out close.

    When you measure yourself:

    - Make the action consume the column (`sum`, a `noop` write
      `df.write.format("noop").mode("overwrite").save()`), not
      `count()`: see the next section.
    - Cache the input first and run each variant more than once, so file
      reading and worker start-up are not part of the comparison.
    - Compare ratios on one machine. Absolute times on a laptop say
      little about a cluster.

