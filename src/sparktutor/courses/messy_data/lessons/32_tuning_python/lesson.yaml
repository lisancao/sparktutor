    ## Worker and Arrow Settings

    Settings that affect Python execution in 4.2.0 (checked in the
    source; the advanced "The Python Worker Protocol" shows them at
    work):

    | Setting | Default | What it does |
    |---|---|---|
    | `spark.sql.execution.pythonUDF.arrow.enabled` (3.4) | `true` since 4.2 | plain UDFs use Arrow batches; decided when the UDF is created |
    | `spark.sql.execution.arrow.maxRecordsPerBatch` (2.3) | `10000` | rows per Arrow batch sent to pandas and Arrow UDFs |
    | `spark.sql.execution.arrow.maxBytesPerBatch` (4.0, internal) | `64MB` | caps batch size in bytes too, for wide rows |
    | `spark.sql.execution.pythonUDF.arrow.concurrency.level` (4.0) | unset | run an Arrow-optimized plain UDF concurrently inside a worker (for I/O-heavy UDFs; must be above 1) |
    | `spark.sql.pyspark.udf.profiler` (4.0) | unset | `perf` or `memory` profiling |
    | `spark.python.worker.reuse` (1.2) | `true` | keep workers alive between tasks |
    | `spark.python.worker.faulthandler.enabled` (3.2) | `false` | a Python traceback when a worker crashes |
    | `spark.python.worker.idleTimeoutSeconds` (4.0) | `0` (off) | log a worker that has been silent this long |
    | `spark.python.worker.killOnIdleTimeout` (4.1) | `false` | also kill it |
    | `spark.python.worker.tracebackDumpIntervalSeconds` (4.1) | `0` (off) | dump worker tracebacks to stderr periodically |

    Batch size is easy to see with a pandas UDF that returns the length
    of each batch it gets. Over 25,000 rows in one partition it saw
    batches of 10000 and 5000 rows; with `maxRecordsPerBatch` set to
    `3000`, 3000 and 1000. Bigger batches mean fewer round trips and
    more memory per call; the default is sensible unless rows are very
    wide (documents, images), where a smaller batch keeps a worker's
    memory in check.

    The `spark.python.*` settings are fixed when the application starts:
    `spark.conf.set("spark.python.worker.reuse", "false")` fails with
    `[CANNOT_MODIFY_CONFIG] Cannot modify the value of the Spark config:
    "spark.python.worker.reuse"`. Set them on the builder or with
    `spark-submit --conf`.

