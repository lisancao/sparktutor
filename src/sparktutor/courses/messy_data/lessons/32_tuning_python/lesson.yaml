    ## Summary

    - Python costs serialization, a process boundary and the interpreter.
      Don't cross (built-ins), cross less (fewer rows, nodes and
      actions), cross in batches (Arrow, pandas), and cross in parallel.
    - Find Python in plans: `BatchEvalPython`, `ArrowEvalPython` (101
      plain Arrow UDF, 200 pandas UDF), `MapInPandas`, `MapInArrow`,
      `FlatMapGroupsInPandas`. Different UDF kinds in one select chain
      into separate nodes.
    - Measured ratios on one machine: built-in 1, pandas UDF 1.5, Arrow
      UDF 2.7, pickled UDF 3.6. Measure with actions that use the
      column; `count()` may skip the UDF entirely.
    - In 4.2 a filter on a UDF column evaluates the UDF twice (the guard
      covers Scala UDFs; Python follows in 4.4.0, SPARK-59693). Every
      action recomputes uncached Python. A Python filter blocks
      pushdown: filter with built-ins first.
    - On 4.2.0, a plain UDF over a Parquet column, directly or through
      some expressions such as `col + 0`, can hang (SPARK-58241, fixed
      in 4.2.1); set
      `spark.sql.execution.arrow.pythonUDF.columnarInput.enabled` to
      `false` or change the shape.
    - Profile with `spark.sql.pyspark.udf.profiler=perf` and
      `spark.profile.show()` (4.0).
    - Spread Python work after a one-partition read with `repartition`;
      salt hot keys when partial results combine.
    - `spark.python.*` settings are fixed at startup; check the output
      layout after tuning.

