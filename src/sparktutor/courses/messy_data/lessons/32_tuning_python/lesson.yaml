    ## A Python Filter Hides the Condition

    Spark cannot look inside a Python function, so it cannot push a
    Python filter into the scan. On a Parquet file with a `status`
    column:

    ```python
    pq.filter(sf.col("status") >= 400).explain()
    is_err = sf.udf(lambda s: s is not None and s >= 400, "boolean")
    pq.filter(is_err("status")).explain()
    ```

    ```text
    +- FileScan parquet [status#27,value#28] ... PushedFilters: [IsNotNull(status), GreaterThanOrEqual(status,400)], ...

    +- *(1) Filter pythonUDF0#31: boolean
       +- ArrowEvalPython [<lambda>(status#27)#30], [pythonUDF0#31], 101
          +- FileScan parquet [status#27,value#28] ... PushedFilters: [], ...
    ```

    With the built-in, the Parquet reader skips row groups whose
    statistics rule the condition out, and every row it does return
    skips Python. With the UDF, every row is read and sent to Python just
    to decide that most of them are not wanted. The order rule follows:
    **filter with built-ins first, then run Python on what is left.** The
    exercise checks for it by finding the `Filter` below the
    `ArrowEvalPython` node.

    This example is for reading plans. If you run it on stock 4.2.0,
    the UDF over the Parquet column can hang (the section on the 4.2.0
    hang below explains why); set
    `spark.conf.set("spark.sql.execution.arrow.pythonUDF.columnarInput.enabled", "false")`
    first.

    One more Python call hides in there. In the exercise's slow job the
    status is parsed by a UDF and filtered by another, and the plan
    parses the status twice, once for the filter and once for the output
    (`BatchEvalPython [<lambda>(get(value#0)#115)#121]` below the filter,
    `get(value#0)#115` again above it): the double evaluation from the
    previous section, on a real job.

