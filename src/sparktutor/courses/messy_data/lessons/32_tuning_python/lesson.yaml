    ## Exercise: Tune an Error Report

    `slow_report(lines, counter)` builds a report of the log's error
    lines (status 400 and up) with the internal network of each client:
    four row-at-a-time UDFs re-parse every line, a Python UDF filters,
    and the network lookup runs again for every action. `slow_write`
    scatters 8 files into each status folder. Both are written; keep
    them as the reference. The harness splits the 21 KB log into 8 KB
    pieces (3 partitions), as if it were big. Complete:

    1. `parse(lines)`: `ip`, `path`, `status` (int) and `bytes` (bigint)
       with `sf.regexp_extract` and casts, no Python.
    2. `errors_only(parsed)`: a built-in filter.
    3. `make_network_udf(counter)`: a pandas UDF that maps `network_of`
       over a batch and adds the batch length to `counter`.
    4. `fast_report(lines, counter)`: parse, filter, add `network`, and
       cache.
    5. `write_by_status(enriched, out)`: one file per status folder.

    The harness checks: no Python node in the parse and the filter; one
    `ArrowEvalPython` node in the report, above the status filter, and no
    `BatchEvalPython`; the report is cached; the network UDF processed
    each error row exactly once across a write, a summary and a collect;
    the same rows and summary as the slow job; and exactly one file in
    each status folder. It prints the slow and fast call counts and file
    layouts.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "parse: lines.select(sf.regexp_extract('value', LINE, 1).alias('ip'), ...); errors_only: parsed.filter(sf.col('status') >= 400); fast_report: errors_only(parse(lines)).withColumn('network', make_network_udf(counter)('ip')).cache(); write_by_status: enriched.repartition('status').write.mode('overwrite').partitionBy('status').parquet(out)."

