    ## Profiling a UDF (4.0)

    When a UDF is slow and you don't know why, profile it on the
    executors. Since 4.0, a SQL setting turns the profiler on for Python
    and pandas UDFs, and `spark.profile` shows the results on the
    driver:

    ```python
    NETS = [(ipaddress.ip_network("10.0.0.0/23"), "office"),
            (ipaddress.ip_network("10.0.2.0/24"), "vpn")]

    @sf.pandas_udf("string")
    def network(ips: pd.Series) -> pd.Series:
        def one(ip):
            a = ipaddress.ip_address(ip)
            for net, name in NETS:
                if a in net:
                    return name
            return "other"
        return ips.map(one)

    spark.conf.set("spark.sql.pyspark.udf.profiler", "perf")
    df.groupBy(network("ip").alias("n")).count().collect()
    spark.profile.show(type="perf")
    ```

    ```text
    ============================================================
    Profile of UDF<id=2>
    ============================================================
             560286 function calls (560278 primitive calls) in 0.108 seconds

       Ordered by: internal time, cumulative time

       ncalls  tottime  percall  cumtime  percall filename:lineno(function)
        80000    0.034    0.000    0.048    0.000 ipaddress.py:1213(_parse_octet)
        20000    0.010    0.000    0.058    0.000 {built-in method from_bytes}
        20000    0.009    0.000    0.071    0.000 ipaddress.py:1187(_ip_int_from_string)
        20000    0.009    0.000    0.083    0.000 ipaddress.py:1286(__init__)
        20000    0.008    0.000    0.104    0.000 p4_prof.py:10(one)
        30000    0.006    0.000    0.008    0.000 ipaddress.py:739(__contains__)
    ...
    ```

    Over 20,000 addresses, most of the time is spent parsing the address
    string (`_parse_octet` four times per address), not in the network
    lookup. That points at the fix (parse once per distinct address, or
    compare integer ranges), which is the point of profiling.

    Details:

    - The setting accepts `perf` or `memory`; unset it to stop
      profiling. It is a SQL setting, so `spark.conf.set` works at
      runtime, and it works on Spark Connect too (tested).
    - `memory` needs the `memory_profiler` package on the workers.
      Without it, PySpark only warns (`UserWarning: Install the
      'memory_profiler' library in the cluster to enable memory
      profiling`) and shows nothing.
    - `spark.profile.dump(path)` writes the profiles to files and
      `spark.profile.clear()` forgets them. Profiling has overhead: turn
      it on to investigate, not in production.

