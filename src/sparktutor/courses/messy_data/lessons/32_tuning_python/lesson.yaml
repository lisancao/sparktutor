    ## Writing the Output

    "Plans, Partitions and Caching" showed that a `partitionBy` write
    makes one file per task per value. Tuning a Python job often changes
    the number of tasks (a `repartition` to spread Python work, a
    different read split), and with it the number of files. Check the
    layout after tuning, not before: in the exercise, the slow job's
    `repartition(8)` before `partitionBy("status")` writes 8 files into
    each status folder; `repartition("status")` writes one.

