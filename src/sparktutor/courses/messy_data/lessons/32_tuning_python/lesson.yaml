    ## Finding Python in a Plan

    Parsing the status code of each line of `data/messy/logs/access.log`
    four ways:

    ```python
    STATUS = r'" (\d{3}) '

    @sf.udf("int")
    def status_udf(line):
        m = re.search(STATUS, line)
        return int(m.group(1)) if m else None

    status_row = sf.udf(lambda l: int(re.search(STATUS, l).group(1)), "int", useArrow=False)

    @sf.pandas_udf("int")
    def status_pd(s: pd.Series) -> pd.Series:
        return s.str.extract(r'" (\d{3}) ', expand=False).astype("Int32")

    built_in = sf.regexp_extract("value", STATUS, 1).cast("int")
    ```

    The node each one adds above the `FileScan text` (from
    `lines.select(...).explain()`):

    | Code | Plan node |
    |---|---|
    | `@sf.udf` (4.2 default) | `ArrowEvalPython [status_udf(value#0)#1], [pythonUDF0#6], 101` |
    | `sf.udf(..., useArrow=False)` | `BatchEvalPython [<lambda>(value#0)#2], [pythonUDF0#8]` |
    | `@sf.pandas_udf` | `ArrowEvalPython [status_pd(value#0)#3], [pythonUDF0#10], 200` |
    | `regexp_extract` | none: `Project [cast(regexp_extract(value#0, ...) as int) AS status#11]` |

    The number after `ArrowEvalPython` is the evaluation type
    (`PythonEvalType` in `pyspark/util.py`): 101 is an Arrow-optimized
    plain UDF (`SQL_ARROW_BATCHED_UDF`; plain UDFs are Arrow-optimized
    by default since 4.2, SPARK-54555), 200 a pandas UDF. The other
    Python operators have their own nodes:

    | Code | Plan node |
    |---|---|
    | `df.mapInPandas(f, schema)` | `MapInPandas` |
    | `df.mapInArrow(f, schema)` | `MapInArrow` |
    | `df.groupBy(k).applyInPandas(f, schema)` | `FlatMapGroupsInPandas`, after an `Exchange` and a `Sort` |
    | a UDTF ("Python UDTFs in Depth") | `ArrowEvalPythonUDTF` or `BatchEvalPythonUDTF` |

    How UDFs combine matters. Nested calls of the same kind are fused
    into one node (`plus1(status_udf(value))` gave a single
    `ArrowEvalPython [plus1(status_udf(value#0)#21)#22]`). Calls of
    **different** kinds in one `select` become a chain, one round trip
    each:

    ```text
    +- ArrowEvalPython [status_pd(value#0)#14], [pythonUDF0#20], 200
       +- BatchEvalPython [<lambda>(value#0)#13], [pythonUDF0#19]
          +- ArrowEvalPython [status_udf(value#0)#12], [pythonUDF0#18], 101
             +- FileScan text [value#0] ...
    ```

    A first tuning pass is just this: list the Python nodes, and for each
    ask whether a built-in could replace it and whether it could merge
    with its neighbours.

