    ## Big Inputs in One Piece: Spread the Python Work

    "Plans, Partitions and Caching" showed that a gzip file is read by
    one task, whatever its size. If expensive Python work runs right
    after that read, it runs on one core too. A `repartition` before the
    Python step pays for a shuffle and lets every core run Python:

    ```python
    raw = spark.read.text(path)          # one 400,000-line .log.gz: 1 partition
    raw.select(sf.sum(slow_status("value"))).first()
    raw.repartition(8).select(sf.sum(slow_status("value"))).first()
    ```

    ```text
    +- ArrowEvalPython [slow_status(value#0)#48], [pythonUDF0#50], 101
       +- Exchange RoundRobinPartitioning(8), REPARTITION_BY_NUM, [plan_id=399]
          +- FileScan text [value#0] ... big.log.gz ...
    ```

    Measured on `local[4]`, best of three, for two versions of
    `slow_status` (a regex plus a loop that makes it more or less
    expensive):

    | Python work per line | As read (1 task) | `repartition(8)` first |
    |---|---|---|
    | light | 0.70 s | 0.53 s |
    | heavy | 3.49 s | 1.33 s |

    The heavier the Python work compared with reading, the more the
    shuffle pays off. It cannot help when one **row** is the problem: a
    single 2 GB file read with `binaryFile` is one row, and one Python
    call. Split such inputs while reading instead (byte ranges, as in
    "Reading a Custom File Format, in Parallel"; the advanced "Memory,
    Spill and Very Large Files" goes further).

