    ## Hot Keys: Salting a Grouped Python Step

    `applyInPandas` hands each group to one Python call as one pandas
    DataFrame. If one key holds most rows (a default user id, a bot, a
    `NULL` turned into `0`), one task does most of the work and that
    worker holds the whole group in memory. Adaptive query execution
    splits skewed **joins**; it does not split a group.

    When the per-group result can be combined from partial results
    (counts, sums, min and max, sketches), split the hot group with a
    **salt**, process the pieces, and combine:

    ```python
    def stats(pdf: pd.DataFrame) -> pd.DataFrame:
        return pd.DataFrame({"user": [pdf.user.iloc[0]], "n": [len(pdf)],
                             "total": [int(pdf.v.sum())]})

    SALT = 8
    salted = (df.withColumn("salt", sf.col("v") % SALT)   # any well-spread column, or rand()
                .groupBy("user", "salt").applyInPandas(stats, "user long, n long, total long")
                .groupBy("user").agg(sf.sum("n").alias("n"), sf.sum("total").alias("total")))
    ```

    On 100,000 rows where user 0 had 90,000, the salted result equalled
    the plain `groupBy("user").applyInPandas(stats, ...)` result, and the
    largest pandas DataFrame any call received shrank from 90,000 rows to
    13,847. If the per-group logic needs every row of the group at once
    and in order (sessionization, for example), salting does not apply;
    filter or split the hot key out and handle it separately.

