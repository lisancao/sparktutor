  Depth: all
  Output: |
    ## Summary

    - A stream reader's offset is your own JSON-friendly dict; Spark
      stores it in `offsets/<batchId>` before each batch. Version it,
      and choose a key that matches how files arrive (here
      `(mtime_ns, name)`).
    - `latestOffset(start, limit)` and `getDefaultReadLimit()` (4.2)
      cap batch size; always honour `ReadAllAvailable`.
    - `SupportsTriggerAvailableNow` (4.2) gives `availableNow` runs
      rate-limited batches; without it the whole backlog is one batch.
    - Restarting with the same checkpoint continues at the next batch id
      and reads only new data. The memory sink cannot restart.
    - Stream writers commit once per micro-batch with a `batchId`.
      Batches can be replayed with the same id, so make
      `commit(messages, batchId)` idempotent.
    - Read progress with attributes (`p.numInputRows`), which work in
      Classic and Connect.

    Next: **Packaging, Registration, Testing and Debugging**, where the
    source leaves the exercise file and becomes something you can
    install, test and debug.
