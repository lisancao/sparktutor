    ## Exercise: An Inbox That Publishes Each Batch Once

    The starter has `InboxDataSource` with a stream reader and a stream
    writer, plus the helpers `list_inbox(root)` (every file as a
    `(mtime_ns, name)` key, oldest first), `key_of(offset)` and
    `offset_of(key)`. Complete:

    1. `prepareForTriggerAvailableNow()`: freeze the newest key as
       `self.target`.
    2. `latestOffset(start, limit)`: the new keys after `start`, capped
       by the target and by `limit.max_files` unless the limit is
       `ReadAllAvailable`; return `start` when nothing is new.
    3. `partitions(start, end)`: one `FilePartition` per file with
       `start < key <= end`.
    4. `BatchFolderWriter.commit(messages, batchId)`: publish the staged
       files into `batch=<id>/` with a `_SUMMARY.json`, or, if the
       summary already exists, discard the copy and log the replay.

    The harness drops four e-mails into an inbox and runs the query
    with `availableNow` (batches of 3 and 1), adds four more files and
    restarts with a `processingTime` trigger (batches 2 and 3, new
    files only), then deletes `commits/3` to force a replay and checks
    that the sink still holds each file exactly once.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "latestOffset: new = [k for k in list_inbox(self.root) if k > key_of(start)], then filter by self.target, then new[:limit.max_files] unless isinstance(limit, ReadAllAvailable). commit: check os.path.exists(summary) first."

