    ## The Micro-Batch Loop

    A streaming query is a loop. For each micro-batch, Spark asks the
    source how far to read, records that decision in the checkpoint,
    reads the data, hands it to the sink, and records that the batch is
    done:

    | Step | Reader or writer method | Checkpoint |
    |---|---|---|
    | Where does a new query start? | `initialOffset()` (first run only) | |
    | How far should this batch go? | `latestOffset(start, limit)` | writes `offsets/<batchId>` |
    | Split the batch into tasks | `partitions(start, end)` | |
    | Produce the rows (executors) | `read(partition)` | |
    | Write the rows (executors) | stream writer `write(rows)` | |
    | Publish the batch (driver) | stream writer `commit(messages, batchId)` | writes `commits/<batchId>` |
    | Tell the source it may forget old data | `commit(end)` | |

    An **offset** is a dict of JSON-friendly values (numbers, strings,
    booleans, nested dicts) that you design. Spark never looks inside
    it; it stores it in the checkpoint and gives it back to you as the
    `start` of the next batch. If `latestOffset` returns `start`
    unchanged, there is nothing new and Spark runs no batch.

    A checkpoint after two batches looks like this:

    ```text
    checkpoint/metadata
    checkpoint/offsets/0   checkpoint/offsets/1
    checkpoint/commits/0   checkpoint/commits/1
    ```

    The last line of `offsets/1` is your own offset, exactly as you
    returned it:

    ```text
    {"v": 1, "mtime_ns": 1790000003000000000, "name": "ticket_3.eml"}
    ```

- Class: text
