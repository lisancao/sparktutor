    ## Offsets for a Growing Folder

    The offset must answer one question: "which files have I already
    read?" Some tempting answers break:

    - **How many files I have seen.** Sort the names, read from index
      `n`. A new file whose name sorts before the old ones (`a.eml`
      after `ticket_3.eml`) shifts every index, so one old file is read
      twice and the new one is skipped.
    - **The last file name.** Read names greater than the last one. A
      new file with a smaller name is never read.
    - **Every file name seen.** Correct, but the offset grows forever
      and is copied into every `offsets/` file.

    This lesson uses the key `(modification time in nanoseconds, name)`
    of the last file read, stored as
    `{"v": 1, "mtime_ns": ..., "name": ...}`. New files almost always
    have a newer modification time, and the name breaks ties between
    files written in the same instant. The `"v": 1` is a format version:
    offsets live in checkpoints for months, and the day you change their
    shape you will want to tell old ones apart.

    The key still has a blind spot worth knowing: a tool that preserves
    old modification times when it copies (`cp -p`, `rsync -t`,
    unzipping an archive) can drop a file whose key is older than the
    bookmark, and it is never read. Spark's built-in file source avoids
    this by remembering every file it has seen in a log inside the
    checkpoint. For your own sources, choose the offset to match how
    files really arrive.

    `partitions(start, end)` returns one partition per file with
    `start < key <= end`, and `read()` turns a file into rows. The
    folder is listed again in `partitions()`, which is fine because the
    `end` offset, not the listing, decides which files belong to the
    batch.

