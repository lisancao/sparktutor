    ## Admission Control: Limits per Batch (4.2)

    Spark 4.2 changed `latestOffset` to take the batch's `start` offset
    and a **read limit** (SPARK-55304). The source reports its preferred
    limit in `getDefaultReadLimit()`, usually from an option, and must
    respect whatever limit Spark passes in:

    ```python
    from pyspark.sql.streaming.datasource import ReadAllAvailable, ReadMaxFiles

    def getDefaultReadLimit(self):
        return ReadMaxFiles(self.max_files)

    def latestOffset(self, start, limit):
        new = [k for k in list_inbox(self.root) if k > key_of(start)]
        if self.target is not None:
            new = [k for k in new if k <= self.target]
        if not isinstance(limit, ReadAllAvailable):
            new = new[:limit.max_files]
        if not new:
            return start          # nothing new: no batch
        return offset_of(new[-1])
    ```

    The built-in limits are `ReadAllAvailable`, `ReadMaxFiles`,
    `ReadMaxRows`, `ReadMinRows` and `ReadMaxBytes`, all in
    `pyspark.sql.streaming.datasource`. They are dataclasses with
    snake-case fields: `limit.max_files`, `limit.max_rows`. As of 4.2.0
    only these built-in limits are supported.

    Spark may pass `ReadAllAvailable` even if your default is a limit,
    and then your source must ignore its own option. With
    `maxFilesPerTrigger` set to 3 and 4 files waiting, a `processingTime`
    trigger runs two batches of 3 and 1 files.

