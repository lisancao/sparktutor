    ## Restarting from a Checkpoint

    Start the same query again with the same `checkpointLocation`, and
    Spark reads the last offset from `offsets/`, passes it to
    `latestOffset` as `start`, and continues with the next batch id. In
    the exercise the second run starts at batch 2 and reads only the
    four files that arrived after the first run.

    The checkpoint belongs to one query. Change the source's offset
    format, the sink, or the query's shape, and old checkpoints may not
    work anymore. Start a fresh checkpoint when you change the query.

    Not every sink can restart. The memory sink, handy in notebooks,
    refuses an existing checkpoint in append mode:

    ```text
    [_LEGACY_ERROR_TEMP_1299] This query does not support recovering
    from checkpoint location. Delete .../offsets to start over.
    ```

    Use a file sink (Parquet, JSON) or your own stream writer when you
    want to test restarts.

