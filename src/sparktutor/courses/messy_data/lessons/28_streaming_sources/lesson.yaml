    ## Watching Progress

    Each finished micro-batch adds a `StreamingQueryProgress` to
    `query.recentProgress` (and `query.lastProgress`). Read its fields as
    attributes:

    ```python
    [(p.batchId, p.numInputRows) for p in query.recentProgress]
    ```

    Use attributes rather than `p["numInputRows"]`, which returns `None`
    on Spark Connect ("Streaming Files: Your First Structured Streaming
    Job" showed this).

    Spark 4.2 also added `reportLatestOffset()` to stream readers:
    return the newest offset available upstream (or `None`) and Spark
    shows it in the query's progress, which lets you watch how far
    behind the query is.

- Class: text
  Depth: advanced
  Output: |
    ## Stream Reader Gotchas

    - **`read()` must be stateless.** It runs on executors, possibly in
      a different process for every batch. Put everything it needs in
      the partition object.
    - **`latestOffset` runs on the driver for every trigger.** Listing a
      folder with millions of files each time is slow. Real file sources
      keep a log of seen files or rely on a notification service.
    - **`commit(end)` is where a source may clean up**: move processed
      files to an archive folder, or delete them. Do it there and not in
      `read()`, because a batch can be re-run until it is committed.
    - **`SimpleDataSourceStreamReader`** is the alternative for sources
      that cannot be split into partitions (one cursor over an API). Its
      single `read(start)` returns rows and the next offset; in 4.2 a
      `read()` that returns rows without advancing the offset fails with
      `SIMPLE_STREAM_READER_OFFSET_DID_NOT_ADVANCE`.

