    ## Replays and Idempotent Commits

    Look again at the loop: the offsets for batch N are written
    *before* the batch runs, and `commits/N` is written *after* the
    sink's `commit()`. If the driver dies in between, the sink has
    published batch N but the checkpoint does not know it. On restart
    Spark finds `offsets/N` without `commits/N` and **runs batch N
    again**, with the same offsets and the same batch id.

    So a sink that wants each row exactly once must make
    `commit(messages, batchId)` idempotent: committing the same batch id
    twice has the same effect as committing it once. The batch id is
    the key:

    ```python
    def commit(self, messages, batchId):
        target = os.path.join(self.root, f"batch={batchId:05d}")
        summary = os.path.join(target, "_SUMMARY.json")
        if os.path.exists(summary):
            # A replay of a batch we already published: drop the new copy.
            for m in messages:
                os.remove(os.path.join(self.staging, m.file))
            with open(os.path.join(self.root, "_replays.log"), "a") as f:
                f.write(f"{batchId}\n")
            return
        ...
    ```

    Tasks stage their files under random names, and `commit()` moves
    them into `batch=<id>/` and writes `_SUMMARY.json` last. A replay
    finds the summary and throws its copy away.

    You can watch a replay happen: stop the query, delete the newest
    file in `checkpoint/commits/` (and its `.crc` file), and start the
    query again. Spark re-runs that batch id. The exercise does this to
    prove the sink writes no duplicates. Do it only in a test; editing a
    production checkpoint is a good way to lose or duplicate data.

    For remote systems the same idea applies: send the batch id along
    (as an idempotency key, a version number, or part of a primary key)
    so the destination can recognise a repeat.

