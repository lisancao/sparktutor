    ## Trigger.AvailableNow (4.2)

    `trigger(availableNow=True)` means: process everything that is
    there now, in batches that respect the read limit, then stop. It is
    the right trigger for a job that a scheduler starts every hour.

    A Python source opts in by mixing in `SupportsTriggerAvailableNow`
    (4.2, SPARK-55304) and implementing one method:

    ```python
    class InboxStreamReader(DataSourceStreamReader, SupportsTriggerAvailableNow):
        def prepareForTriggerAvailableNow(self):
            keys = list_inbox(self.root)
            self.target = keys[-1] if keys else (0, "")
    ```

    Spark calls it once when the query starts. From then on,
    `latestOffset` must never go past `self.target`, so files that
    arrive during the run wait for the next one, and the query ends
    once `latestOffset` returns `start` unchanged.

    What happens **without** the mixin? The query still runs and still
    stops, but Spark calls `latestOffset` with `ReadAllAvailable` and
    reads everything in one batch. With 8 files and
    `maxFilesPerTrigger` 3, the run with the mixin made batches of 3, 1,
    3 and 1 files across two runs; a reader without it made a single
    batch of 8. On a large backlog that single batch is exactly what the
    limit was meant to prevent.

