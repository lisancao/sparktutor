    ## What You'll Learn

    Files rarely arrive all at once. Scans land in a folder through the
    day, a mail gateway drops `.eml` files every few minutes, a partner
    uploads invoices at night. A streaming query processes each new
    file once, in small micro-batches, and remembers how far it got so
    a restart picks up where it stopped.

    In this lesson you give a Python data source both streaming halves:
    a **stream reader** that turns new files in a folder into rows, and
    a **stream writer** that publishes each micro-batch exactly once,
    even when Spark replays a batch.

    By the end you will be able to:

    - Explain the micro-batch loop and which reader method Spark calls
      at each step
    - Design offsets for a growing folder, and know why "the number of
      files seen" is a bad offset
    - Cap batch size with admission control: `getDefaultReadLimit()`
      and `latestOffset(start, limit)` (4.2)
    - Support `trigger(availableNow=True)` with
      `SupportsTriggerAvailableNow` (4.2), and know what happens
      without it
    - Restart a query from its checkpoint and read only new files
    - Write a stream writer whose `commit(messages, batchId)` is
      idempotent, and prove it by replaying a batch

    This lesson builds on "Writers" (commit messages, staging, abort)
    and on the streaming reader preview in "Python Data Sources: Batch,
    Pushdown and Streaming" in the What's New in Apache Spark 4.x
    course, if you took it.

