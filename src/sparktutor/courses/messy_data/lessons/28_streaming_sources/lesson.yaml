    ## Stream Writers (4.0)

    A stream writer is a batch writer with a batch id. The source's
    `streamWriter(schema, overwrite)` returns a `DataSourceStreamWriter`
    with three methods:

    - `write(rows)`: once per task of a micro-batch, on an executor;
      returns a `WriterCommitMessage`, exactly as in "Writers"
    - `commit(messages, batchId)`: once per micro-batch, on the driver,
      when every task succeeded
    - `abort(messages, batchId)`: once per micro-batch, on the driver,
      when a task failed

    `DataSourceStreamArrowWriter` (4.1, SPARK-53030) is the Arrow
    version: its `write()` receives `pyarrow.RecordBatch` objects, like
    the batch Arrow writer.

    The same class can be a source and a sink: `InboxDataSource` in the
    exercise implements both `streamReader()` and `streamWriter()`, and
    the query reads `format("inbox")` and writes `format("inbox")` with
    different paths.

