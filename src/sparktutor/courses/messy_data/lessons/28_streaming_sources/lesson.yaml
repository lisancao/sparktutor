  Output: |
    Think of a bookmark in a book that keeps getting new pages glued to
    the end. The offset is the bookmark. Each micro-batch reads from the
    bookmark to a new spot, then moves the bookmark. The checkpoint is a
    notebook where Spark writes down every bookmark position *before*
    reading, and "done" *after* writing, so after a crash it knows
    exactly which pages to read again.

