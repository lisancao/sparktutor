    ## A Safety Net: spark.sql.sources.binaryFile.maxLength

    Each `content` value is held in memory as one byte array, so a single
    huge file can hurt a task. The setting
    `spark.sql.sources.binaryFile.maxLength` (an internal setting since
    3.0, default `2147483647` bytes, the largest Java array) makes the
    reader refuse files above a size **when it is about to read their
    content**:

    ```python
    spark.conf.set("spark.sql.sources.binaryFile.maxLength", "1000")

    files.select("path", "length").count()   # 3: no content read
    files.select("content").collect()         # fails
    ```

    The failure is a task error, `FAILED_READ_FILE.NO_HINT` ("Encountered
    error while reading file ..."), caused by:

    ```
    The length of file:/.../silence.wav is 8044, which exceeds the max
    length allowed: 1000.
    ```

    In classic PySpark it reaches Python as a `Py4JJavaError` without a
    condition, so match on the message if you catch it. The useful
    lesson is the asymmetry: metadata queries keep working under any
    limit, because they never read the bytes.

