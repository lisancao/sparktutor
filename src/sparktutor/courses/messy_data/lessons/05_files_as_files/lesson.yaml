    ## Listing Details Worth Knowing

    - **Partition discovery**: without `recursiveFileLookup`, a subfolder
      named `key=value` (for example `day=2026-10-01`) becomes a partition
      column. With `recursiveFileLookup` on, partition discovery is
      switched off and no such column appears. Pick one style per
      dataset.
    - **Hidden files** (such as `_SUCCESS` or `.DS_Store`) are skipped by
      the file listing; "Setup, a First Session and a Tour of the Sample
      Data" gives the exact rule.
    - **Empty is sometimes not an error**: a path or glob that matches
      nothing fails with `PATH_NOT_FOUND`, but a `pathGlobFilter` (or
      `modifiedAfter`) that excludes every file gives an empty DataFrame.
      In a job, assert on the count when an empty input would be a bug.
    - **Packing**: many small files are packed into each task (controlled
      by `spark.sql.files.maxPartitionBytes` and
      `spark.sql.files.openCostInBytes`), so thousands of tiny files do not
      mean thousands of tasks.

