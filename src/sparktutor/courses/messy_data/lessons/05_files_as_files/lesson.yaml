    ## Don't Read Bytes You Don't Need

    Listing a million files is cheap. Reading a million files is not. The
    good news: `binaryFile` opens a file **only if the query uses the
    `content` column**. In the 4.2.0 source, the reader fills `path`,
    `length` and `modificationTime` from the file system's file status
    and calls `open` only for `content`.

    Spark also pushes filters on `length` and `modificationTime` into the
    reader, which then skips files before reading them. You can see both
    effects in the plan:

    ```python
    big = files.filter(F.col("length") > 5000).select("path", "length")
    big.explain()
    ```

    ```
    FileScan binaryFile [path#0,length#2L] ...
      PushedFilters: [IsNotNull(length), GreaterThan(length,5000)],
      ReadSchema: struct<path:string,length:bigint>
    ```

    `ReadSchema` has no `content`, and the size filter is pushed down. So
    the cheap pattern for large folders is: list and filter on metadata
    first, and only then select `content` for the rows you really want to
    parse.

