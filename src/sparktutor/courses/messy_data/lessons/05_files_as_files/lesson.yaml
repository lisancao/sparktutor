    ## Finding Duplicates by Hash

    Two files with the same content have the same cryptographic hash,
    whatever their names, folders or timestamps. `F.sha2(col, 256)`
    returns the SHA-256 of a binary (or string) column as 64 hex
    characters:

    ```python
    inv = files.select("path", F.sha2("content", 256).alias("sha256"))

    dups = (inv.groupBy("sha256")
        .agg(F.count("*").alias("n"),
             F.sort_array(F.collect_list("path")).alias("paths"))
        .filter("n > 1"))
    ```

    Why SHA-256 and not `hash()` or `xxhash64()`? Those return 32 or 64
    bit numbers designed for hash tables; collisions between different
    files are rare but possible at scale. SHA-256 collisions are, for
    practical purposes, impossible, so equal hashes mean equal bytes.
    (`md5` and `sha1` also exist in Spark; they are fine for spotting
    accidental copies but are no longer trusted against deliberate
    tampering.)

    Hashing reads every byte of every file, so filter on `length` first
    when you can: two files can only be identical if they have the same
    size.

- Class: text
  Depth: advanced
  Output: |
    ## Limits and Trade-offs

    - **One file, one value.** `content` holds the whole file. Images,
      PDFs and short recordings are fine. Multi-gigabyte videos are not:
      the limit is the 2 GB Java array, and a task holding a few of them
      at once will run out of memory long before that. For huge files,
      keep only `path` and `length` in Spark and let each task read and
      stream the file itself (a Python data source, "Reading a Custom File Format, in Parallel", is a clean
      way to do that).
    - **Caching and shuffling bytes.** Caching or shuffling a DataFrame
      with `content` copies all the bytes. Select it late, after
      filtering, and drop it as soon as you have parsed what you need.
    - **Streaming.** `spark.readStream.format("binaryFile")` works for
      folders that grow, but needs the schema passed with `.schema(...)`
      ("Images and Audio" shows it).
    - **Spark Connect.** The reads in this lesson give the same results
      on a Spark Connect session, and collected `content` is `bytes` there
      too. What changes is when errors appear: a missing path or a glob
      that matches nothing is reported at the first action, not when you
      call `load`, as "Why Spark for Messy Data, and How It Runs Your
      Code" shows.

