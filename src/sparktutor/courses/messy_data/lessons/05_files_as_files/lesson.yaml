    ## Magic Bytes: What a File Really Is

    Most binary formats start with a fixed signature, often called
    **magic bytes**. They are a far better guide than the file name:

    | Format | First bytes (hex) | As text |
    |--------|-------------------|---------|
    | PNG | `89 50 4E 47 0D 0A 1A 0A` | `\x89PNG\r\n\x1a\n` |
    | WAV | `52 49 46 46`, then `57 41 56 45` at byte 9 | `RIFF....WAVE` |
    | PDF | `25 50 44 46 2D` | `%PDF-` |
    | gzip | `1F 8B` | |
    | ZIP (also .docx, .xlsx) | `50 4B 03 04` | `PK..` |

    Spark's ordinary string functions work on `binary` columns too, and
    count **bytes, starting at 1**:

    - `F.substring("content", 1, 8)`: the first 8 bytes, still binary
    - `F.hex(...)`: those bytes as an upper-case hex string, easy to
      compare with the table above

    ```python
    head8 = F.hex(F.substring("content", 1, 8))
    kind = (F.when(head8 == "89504E470D0A1A0A", "png")
             .when(F.hex(F.substring("content", 1, 5)) == "255044462D", "pdf")
             .otherwise("other"))
    ```

    For signatures that are plain ASCII you can also cast the bytes to a
    string: `F.substring("content", 1, 5).cast("string")` gives `%PDF-`.
    Use `hex` when a signature contains non-text bytes, as PNG's does.

    Files with no signature (plain text, Markdown, `.eml` e-mails) need
    other clues: the extension, a known first line, or trying to parse
    them. They stay "other" in this lesson's inventory.

