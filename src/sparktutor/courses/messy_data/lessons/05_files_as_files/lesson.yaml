    ## Validate Before You Parse

    `data/messy/images/scans/corrupt.png` starts with a perfect PNG
    signature followed by the text `not really a png`. Run the header
    formulas on it anyway and you get:

    ```
    +-----------+----------+---------+
    |file       |width     |height   |
    +-----------+----------+---------+
    |corrupt.png|1819877473|544239207|
    +-----------+----------+---------+
    ```

    Those "widths" are the letters `ly a` and ` png` read as numbers.
    SQL will happily decode any bytes you point it at, so check the
    structure before trusting a field: here, that bytes 13 to 16 really
    spell `IHDR`. Wrap the fields in `F.when(valid, ...)` so invalid files
    get `NULL` instead of nonsense, and keep a flag column so you can
    count and report them.

