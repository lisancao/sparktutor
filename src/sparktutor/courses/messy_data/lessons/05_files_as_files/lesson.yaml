    ## Reading a Binary Header With SQL

    Headers also hold useful numbers. A PNG file is the 8-byte signature,
    then a chunk called `IHDR` that holds the image size:

    | Bytes | Meaning |
    |-------|---------|
    | 1 to 8 | signature |
    | 9 to 12 | chunk length (13) |
    | 13 to 16 | chunk type, the letters `IHDR` (hex `49484452`) |
    | 17 to 20 | width, a 4-byte big-endian integer |
    | 21 to 24 | height, a 4-byte big-endian integer |

    Big-endian means the most significant byte comes first, which is the
    same order hex digits are written. So the hex string of those four
    bytes, read as a base-16 number, is the width. `conv` converts
    between bases:

    ```python
    width = F.conv(F.hex(F.substring("content", 17, 4)), 16, 10).cast("long")
    height = F.conv(F.hex(F.substring("content", 21, 4)), 16, 10).cast("long")
    ```

    For `red_16x8.png` the width bytes are `00 00 00 10`, hex `00000010`,
    which is 16 in base 10.

    No Python, no image library: the whole thing runs inside Spark's
    engine. For anything beyond a few fixed fields, a Python UDF with the
    standard library `struct` module is easier to read ("Images and Audio" does
    that for WAV files).

