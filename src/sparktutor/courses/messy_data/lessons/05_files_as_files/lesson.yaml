    The sample files live under `data/messy/` (SparkTutor copies them next
    to every exercise). "Setup, a First Session and a Tour of the Sample
    Data" showed what each folder holds; this lesson starts with the
    rawest view of them, as files.

    ## What You'll Learn

    Before you parse anything, you need to know what you have. This lesson
    treats files as files: a path, a size, a timestamp and a bag of bytes.

    By the end of this lesson you will be able to:

    - Read a folder as one row per file with the `binaryFile` source
    - Choose files with `recursiveFileLookup`, `pathGlobFilter`, globs in
      the path, and `modifiedAfter` / `modifiedBefore`
    - Use the hidden `_metadata` column for file names, sizes and times
    - Avoid reading file contents you do not need, and see the proof in
      the query plan
    - Identify a file's real type from its first bytes ("magic bytes")
      and read numbers out of a binary header with SQL functions
    - Find duplicate files by hashing their content

- Class: text
  Depth: all
  Output: |
    ## Why Start With Bytes?

    The text, JSON and CSV readers all assume they know what is inside a
    file. When that assumption is wrong (a `.png` that is really a text
    file, a half-uploaded PDF, a folder that mixes three formats) they
    either fail or quietly produce garbage.

    Reading files as bytes first gives you a safe first step for any
    folder:

    - **Inventory**: what files are there, how big, how old?
    - **Triage**: which ones are really PNG, WAV or PDF, whatever their
      names say?
    - **Deduplication**: which uploads are byte-for-byte copies?
    - **Routing**: send each kind of file to the parser that understands
      it (later lessons cover those parsers).

    Spark has a built-in source for exactly this, `binaryFile`, added in
    Spark 3.0 (SPARK-25348).

- Class: text
  Depth: beginner
  Output: |
    Think of a mail room. Before anyone opens a parcel, the clerk logs
    each one: the sender label, the weight, the date it arrived. Some
    parcels are labelled "books" but rattle like dishes, so the clerk
    checks the shape, not the label. Two identical parcels from the same
    sender get flagged as duplicates.

    `binaryFile` is that clerk. It gives you the label (path), the weight
    (length), the arrival date (modification time) and, only if you ask
    for it, the contents.

- Class: text
  Depth: all
  Output: |
    ## The binaryFile Source

    ```python
    files = spark.read.format("binaryFile").load("data/messy/audio")
    files.printSchema()
    ```

    ```
    root
     |-- path: string (nullable = true)
     |-- modificationTime: timestamp (nullable = true)
     |-- length: long (nullable = true)
     |-- content: binary (nullable = true)
    ```

    Every file becomes exactly one row:

    - `path`: the full URI, such as
      `file:/home/you/data/messy/audio/silence.wav`
    - `modificationTime`: when the file was last changed, as reported by
      the file system
    - `length`: the size in bytes
    - `content`: the whole file as a `binary` value (Python `bytes` when
      you collect it)

    The schema is fixed; there is nothing to infer. A file is never split
    across rows or tasks (the source reports files as not splittable), so
    each task reads whole files. That is exactly what you want for formats
    such as PNG, where the bytes only make sense together.

    `binaryFile` is read-only. Trying to write with it fails with
    `UNSUPPORTED_FEATURE.WRITE_FOR_BINARY_SOURCE`. To store file contents,
    write the DataFrame as Parquet (a `binary` column is fine there), or
    write the bytes back to files yourself.

