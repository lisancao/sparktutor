    ## The Hidden _metadata Column

    Every file-based source (Spark 3.3, SPARK-37273) has a hidden column
    called `_metadata`. It does not appear in `printSchema()` or
    `select("*")`, but you can select it by name:

    ```python
    files.select("_metadata.*").printSchema()
    ```

    ```
    root
     |-- file_path: string (nullable = false)
     |-- file_name: string (nullable = false)
     |-- file_size: long (nullable = false)
     |-- file_block_start: long (nullable = false)
     |-- file_block_length: long (nullable = false)
     |-- file_modification_time: timestamp (nullable = false)
    ```

    ```python
    files.select("_metadata.file_name", "_metadata.file_size", "length").show()
    ```

    ```
    +------------------+---------+------+
    |file_name         |file_size|length|
    +------------------+---------+------+
    |silence.wav       |8044     |8044  |
    |tone_440.wav      |4044     |4044  |
    |tone_880_quiet.wav|4044     |4044  |
    +------------------+---------+------+
    ```

    For `binaryFile`, `path` and `length` already carry most of this, but
    `_metadata.file_name` saves you splitting the path yourself. The real
    value of `_metadata` is that it works the same way on JSON, CSV,
    text, XML and Parquet, where each row is a record inside a file and
    you otherwise lose track of which file it came from. You will use it
    for lineage in most lessons that follow.

