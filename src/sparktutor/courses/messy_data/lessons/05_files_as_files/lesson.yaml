    ## Only New Files: modifiedAfter and modifiedBefore

    Spark 3.1 added two listing options for batch reads (SPARK-31962):

    ```python
    recent = (spark.read.format("binaryFile")
        .option("modifiedAfter", "2025-01-01T00:00:00")
        .load(uploads))
    ```

    Only files whose modification time is after (or, for
    `modifiedBefore`, before) the given instant are listed. Give an
    ISO-style value such as `2025-01-01T00:00:00` (in datetime pattern
    letters, `yyyy-MM-dd'T'HH:mm:ss`, with lowercase `yyyy` and `dd` as
    "Columns and Expressions: Cleaning Values" explained). Shorter ISO
    forms such as `2025-01-01` also work, but a value like `01/01/2025`
    fails at read time with "The timestamp provided for the
    'modifiedafter' option is invalid". (That message writes the expected
    format as `YYYY-MM-DDTHH:mm:ss`: a description for humans, not a
    pattern to pass to `to_timestamp`.)
    The time is interpreted in the session time zone
    (`spark.sql.session.timeZone`) unless you pass a `timeZone` option, so
    set the time zone explicitly when the cut-off matters.

    These options filter the file **listing**, so excluded files are never
    opened. They are a quick way to pick up "everything since the last
    run" in a batch job; for real incremental ingestion, a streaming file
    source with a checkpoint is the robust tool ("Images and Audio" streams
    `binaryFile` that way; "Streaming Readers and Writers" builds a custom stream reader).

