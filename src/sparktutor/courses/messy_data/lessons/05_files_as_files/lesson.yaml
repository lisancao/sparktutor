    ## Choosing Which Files to Read

    The sample data has a folder that holds only subfolders:

    ```
    data/messy/images/
      products/  gradient_32x32.png  logo_rgba_12x12.png  red_16x8.png
      scans/     corrupt.png  gray_20x10.png  readme.txt
    ```

    Load the top folder and you get **zero rows**, with no error:

    ```python
    spark.read.format("binaryFile").load("data/messy/images").count()   # 0
    ```

    File sources only list the files directly inside the folder you name
    (subfolders are treated as possible partition folders such as
    `year=2026`, and `products` is not one). These options and path forms
    control the listing:

    ```python
    pngs = (spark.read.format("binaryFile")
        .option("recursiveFileLookup", "true")   # walk every subfolder (3.0)
        .option("pathGlobFilter", "*.png")       # keep matching file names (3.0)
        .load("data/messy/images"))
    # corrupt.png, gradient_32x32.png, gray_20x10.png,
    # logo_rgba_12x12.png, red_16x8.png

    # A glob in the path itself: any subfolder, then any .png
    spark.read.format("binaryFile").load("data/messy/images/*/*.png")   # 5 files

    # Several roots at once
    spark.read.format("binaryFile").load(["data/messy/pdf", "data/messy/mail"])
    ```

    - `recursiveFileLookup` (SPARK-27990) lists files at any depth.
    - `pathGlobFilter` (SPARK-27627) is a glob matched against each **file
      name**, not the folder path. It works on every file source, not only
      `binaryFile`.
    - A glob in the path (`*/*.png`) matches folders and files by
      position, so it suits fixed layouts.

    These options have nothing to do with the bytes in the file: a text
    file named `fake.png` passes `*.png`. You will deal with that below.

