    ## Exercise: A File Inventory

    Build the inventory a data platform would keep for a landing folder.
    The harness creates a pretend `uploads` folder holding a fresh copy
    of `red_16x8.png` (named `upload_0001.png`) and an old copy of
    `tone_440.wav` (named `voice_note.wav`, its modification time set to
    2020), and reads it together with `data/messy/images`, `audio`, `pdf`
    and `mail`.

    Implement four functions:

    1. `inventory(spark, paths)`: read every file under `paths`
       **recursively** with `binaryFile` and return the columns `path`,
       `file_name` (from `_metadata`), `length`, `sha256`
       (`sha2(content, 256)`), `kind`, `png_ok`, `png_width` and
       `png_height`.
       - `kind` is `"png"`, `"wav"`, `"pdf"` or `"other"`, decided from
         the magic bytes. The starter's helpers `head_hex(start, n)` (the
         hex of any byte range) and `be_uint32(start)` (a 4-byte
         big-endian number) do the byte work for you.
       - `png_ok` is true when a PNG's bytes 13 to 16 are `IHDR`, false
         for a PNG without them, and NULL for files that are not PNGs.
       - `png_width` and `png_height` come from bytes 17 to 20 and 21 to
         24, and are NULL unless `png_ok` is true.
    2. `duplicates(inv)`: groups of files with the same `sha256`, with
       columns `sha256`, `n` and `files` (the sorted list of file names),
       only where `n > 1`.
    3. `recent_files(spark, folder, since)`: `path` and `length` of the
       files modified after `since`, using the `modifiedAfter` option.
    4. `sizes_only(spark, folder)`: `path`, `file_name` and `length`,
       without touching `content`. The harness runs it with
       `spark.sql.sources.binaryFile.maxLength` set to 1000 bytes, so it
       fails if it reads any file's bytes.

    The checks: 17 files (6 PNG, 4 WAV, 2 PDF, 5 other), `corrupt.png`
    flagged, the right width and height for the four real PNGs, two
    duplicate groups, one recent upload, and the size listing working
    under the tiny `maxLength`.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "Read with format('binaryFile').option('recursiveFileLookup', 'true').load(paths). kind: F.when(head_hex(1, 8) == PNG_MAGIC, 'png').when((head_hex(1, 4) == '52494646') & (head_hex(9, 4) == '57415645'), 'wav').when(head_hex(1, 5) == '255044462D', 'pdf').otherwise('other'). Width: F.conv(head_hex(17, 4), 16, 10).cast('long'). Duplicates: groupBy('sha256').agg(count, sort_array(collect_list('file_name'))) then filter n > 1."

- Class: text
  Depth: all
  Output: |
    ## Summary

    In this lesson you learned:

    - **`binaryFile`** (3.0) reads one row per file: `path`,
      `modificationTime`, `length` and `content`. It never splits files,
      and it cannot write.
    - **Choosing files**: `recursiveFileLookup` for nested folders (a
      folder of only subfolders gives 0 rows without it),
      `pathGlobFilter` for file names, globs in the path, and
      `modifiedAfter` / `modifiedBefore` (3.1) for time windows in the
      session time zone.
    - **`_metadata`** (3.3) is a hidden column on every file source with
      `file_path`, `file_name`, `file_size` and
      `file_modification_time`.
    - **Content is read only when you select it**, and filters on
      `length` and `modificationTime` are pushed into the reader.
      `spark.sql.sources.binaryFile.maxLength` guards against huge files
      and only bites when content is read.
    - **Magic bytes** tell you what a file really is: `substring` on
      binary counts bytes from 1, `hex` makes them comparable, and `conv`
      turns big-endian header fields into numbers. Validate the
      structure before trusting a field.
    - **`sha2(content, 256)`** finds byte-identical files.

    Next: **Text and Logs**, where the bytes are text and the job is to
    turn lines, stack traces and mixed-format logs into typed records.
