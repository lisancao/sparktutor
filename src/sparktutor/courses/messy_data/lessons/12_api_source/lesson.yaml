    ## Validate Options Early

    Options arrive as strings in a case-insensitive dictionary, so
    convert them yourself (`int(options.get("page_size", 20))`) and check
    the required ones where they fail fastest:

    ```python
    class TicketsDataSource(DataSource):
        def __init__(self, options):
            super().__init__(options)
            if "url" not in options:
                raise ValueError("option 'url' is required")
    ```

    Spark creates the `DataSource` while analyzing the plan, to ask for
    its schema. In a `spark-submit` script that is `load()` itself; on
    Spark Connect, where `load()` is lazy, it is the first call that
    needs the schema (`.columns`, `.printSchema()`, or an action). Either
    way it happens before any task runs, and the error is

    ```text
    [PYTHON_DATA_SOURCE_ERROR] Failed to create Python data source instance:
    ...
    ValueError: option 'url' is required
    ```

    A check in the reader's `__init__` still works, but only fires when
    the first action plans partitions. One catch: if the user passes
    `.schema(...)` to the reader, Spark has no reason to create the data
    source at analysis, and even the `__init__` check waits for the first
    action.

