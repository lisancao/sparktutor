    Picture a library with a catalog of 95 index cards in 5 drawers. The
    driver-only approach is one person carrying every drawer to their
    desk. The data source approach is one person who checks how many
    drawers there are (planning) and then hands one drawer to each of
    five helpers (tasks), who copy their cards at the same time.

    The helpers never share a desk with the planner. Anything the planner
    gives them (which drawer to read, the address of the library) has to
    be written on a note they can carry, which is why partitions and
    readers must be picklable and why each helper opens their own
    connection.

