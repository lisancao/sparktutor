    ## Retries: Yours, Not Spark's

    Real APIs fail now and then: a 503 during a deploy, a dropped
    connection, a 429 when you go too fast. Spark can retry a failed
    task, but:

    - **In local mode it does not.** `local[*]` allows exactly one attempt
      per task (`MAX_LOCAL_TASK_FAILURES = 1` in `SparkContext`). Use the
      master `local[4, 3]` (4 threads, up to 3 attempts) if you want
      task retries locally.
    - **On a cluster** a task gets `spark.task.maxFailures` attempts
      (default 4), but a retry re-runs the whole partition, possibly on
      another machine, with no pause in between. A flaky server gets hit
      again immediately.

    Retry inside the reader instead, only for errors that can succeed
    later, with a growing pause:

    ```python
    def fetch_json(url, timeout, retries):
        import json, time
        from urllib.error import HTTPError, URLError
        from urllib.request import urlopen

        for attempt in range(retries + 1):
            try:
                with urlopen(url, timeout=timeout) as response:
                    return json.load(response)
            except HTTPError as e:
                if e.code < 500 or attempt == retries:
                    raise          # 4xx: our request is wrong, retrying won't help
            except URLError:
                if attempt == retries:
                    raise          # network error: give up after the last try
            time.sleep(0.1 * 2 ** attempt)
    ```

    `HTTPError` is a subclass of `URLError`, so it must be caught first.
    For a 429, real code should also read the `Retry-After` header and
    wait that long. Retrying is only safe because a `GET` of a page has no
    side effects; never blindly retry a call that creates something.

    When the retries run out, the task fails and the job reports
    `PYTHON_EXCEPTION` with your Python traceback, including
    `urllib.error.HTTPError: HTTP Error 503: Service Unavailable`.

