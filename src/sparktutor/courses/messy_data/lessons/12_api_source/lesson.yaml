    ## Summary

    - **Page-number pagination** becomes one partition per page;
      **cursor** pagination is a chain and reads as one partition (split
      on another dimension if the API allows it).
    - `partitions()` runs once per DataFrame before the first tasks;
      `read()` runs in every task of every action. Keep network calls in
      `read()`, and always pass a **timeout**.
    - **Retry inside the reader** for 5xx and network errors, with a
      pause. `local[*]` never retries a task; clusters retry the whole
      partition with no pause.
    - Return loose payloads as **VARIANT** with `VariantVal.parseJson`;
      yielding a dict fails with `MALFORMED_VARIANT`.
    - Validate options in `DataSource.__init__` so a missing one fails
      with `PYTHON_DATA_SOURCE_ERROR` when the plan is analyzed.
    - Every uncached action calls the API again; **cache** or land the
      data in a table.

    Next: **Types, Arrow and Performance**, where you make a reader fast
    by yielding Arrow batches instead of tuples, and learn to read the
    type errors Spark 4.2 now raises.
