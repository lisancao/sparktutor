    ## A Local API for the Exercise

    The exercise starts its own API: a standard-library
    `ThreadingHTTPServer` on `127.0.0.1` with port `0` (the operating
    system picks a free port), running in a background thread of the
    driver. No internet connection, no API key, and the same responses
    every run.

    ```python
    server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
    threading.Thread(target=server.serve_forever, daemon=True).start()
    url = f"http://127.0.0.1:{server.server_port}/tickets"
    ```

    `GET /tickets?page=N&page_size=M` returns

    ```json
    {"items": [{"id": 0, "status": "open", "subject": "Where is my order?",
                "meta": {"tags": [], "priority": "high",
                         "customer": {"id": "C0", "tier": "gold"}}}, ...],
     "page": 0, "page_size": 20, "total": 95}
    ```

    `meta` is the messy part: `tags` is always there, `priority` and
    `customer` only sometimes. And page 3 is flaky on purpose: every other
    request to it gets an HTTP 503.

    In local mode the Python workers that run `read()` are processes on
    the same machine, so `127.0.0.1` reaches the server. On a real
    cluster, executors run on other machines: the API must be reachable
    from every executor, and `127.0.0.1` would mean the executor itself.

