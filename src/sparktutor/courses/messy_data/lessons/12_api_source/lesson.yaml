    ## The Loose Part as VARIANT

    The stable fields (`id`, `status`, `subject`) get real columns. The
    part that changes from record to record (`meta`) is exactly what
    VARIANT is for:

    ```python
    def schema(self):
        return "id int, status string, subject string, meta variant"
    ```

    For a VARIANT column, `read()` must yield a
    `pyspark.sql.types.VariantVal`, built from JSON text with
    `VariantVal.parseJson(json.dumps(value))` (4.1). Yielding the dict
    itself, or the JSON string, fails in the task with
    `PySparkValueError: [MALFORMED_VARIANT] Variant binary is malformed`,
    which says nothing about dicts; remember this one.

    Downstream, query `meta` as in "VARIANT Basics: Profiling and Nested
    Data":

    ```python
    df.select(sf.explode(sf.try_variant_get("meta", "$.tags", "array<string>")).alias("tag")) \
        .groupBy("tag").count().show()

    df.filter(sf.try_variant_get("meta", "$.customer.tier", "string") == "gold").count()
    ```

    A record without `customer` simply gives NULL; nothing fails when the
    vendor adds or drops a key.

