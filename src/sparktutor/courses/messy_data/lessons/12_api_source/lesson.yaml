    ## What You'll Learn

    A lot of messy data does not live in files. Support tickets, payments,
    events from a SaaS tool: you get them from a REST API, one page of
    JSON at a time, and the shape of each record is whatever the vendor
    shipped this month.

    In "Your First Python Data Source" you wrote a reader and saw where
    each method runs; in "Reading a Custom File Format, in Parallel" you
    planned partitions from a list of files. This lesson applies the same
    ideas to an API, where the network adds its own problems: pages,
    timeouts, flaky servers, and calls that cost money or count against a
    rate limit.

    By the end of this lesson you will be able to:

    - Turn page-numbered pagination into partitions, and recognize when
      an API cannot be read in parallel
    - Keep every network call inside `read()`, with a timeout
    - Retry server errors inside the reader, and know why Spark's own
      task retries are not enough (and do not exist in local mode)
    - Return the loose part of each record as VARIANT
    - Validate options so a mistake fails at load time
    - Know how many API calls each action makes, and when to cache

