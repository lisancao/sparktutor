    ## Why Not Just Call the API on the Driver?

    The first version everyone writes looks like this:

    ```python
    import json, urllib.request
    rows = []
    for page in range(5):
        with urllib.request.urlopen(f"{url}?page={page}") as r:
            rows += json.load(r)["items"]
    df = spark.createDataFrame(rows)
    ```

    On a good day it works for five pages. (Against the exercise API it
    stops at the flaky page 3 with `urllib.error.HTTPError: HTTP Error
    503`.) Even when it works, it fails in the ways that matter later: the
    driver fetches every page one after another, holds everything in
    memory, and infers the schema from whatever the first records look
    like. Nothing is reusable, and nothing can become a stream.

    A Python data source splits the same work the Spark way:

    | Method | Runs | Here it does |
    |---|---|---|
    | `DataSource.__init__`, `schema()` | when the plan is analyzed | check options, declare columns |
    | `reader()`, `partitions()` | once per DataFrame, before the first tasks | ask page 0 how many pages exist |
    | `read(partition)` | in a task, in parallel | fetch one page, yield its rows |

    The pages are fetched in parallel by tasks, rows stream out without
    collecting on the driver, and the schema is yours, not inferred.

