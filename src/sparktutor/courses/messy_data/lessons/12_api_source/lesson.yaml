    ## Pagination Decides Your Partitions

    How an API pages its results decides whether you can read it in
    parallel:

    - **Page numbers or offsets** (`?page=3`, `?offset=60&limit=20`): you
      can compute every page's address up front, so each page can be a
      partition. Ask once for the total (most APIs return it on every
      page) and plan `ceil(total / page_size)` partitions.
    - **Cursors or next links** (`?cursor=eyJpZCI6...`, a `next` URL in
      each response): page 4's address is only known after reading
      page 3. The pages are a chain, and a chain is one partition. You
      can still parallelize on another dimension the API filters by, for
      example one partition per day (`?since=...&until=...`), each
      following its own chain of cursors.

    ```python
    class PagePartition(InputPartition):
        def __init__(self, page):
            self.page = page

    def partitions(self):
        first = fetch_json(self.page_url(0), self.timeout, self.retries)
        pages = math.ceil(first["total"] / self.page_size)
        return [PagePartition(p) for p in range(pages)]
    ```

    The partition object carries only the page number: a small, plain
    value that pickles. The reader object, with the URL and settings, is
    pickled and sent to every task too.

