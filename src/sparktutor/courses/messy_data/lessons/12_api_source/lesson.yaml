    ## How Many Calls Does a Query Make?

    APIs are slow and often metered, so count the calls. With the request
    log of the exercise server:

    - `load()` makes **no** request. Neither does `explain()`.
    - The **first action** on a DataFrame calls `partitions()` (one
      request for page 0), then runs one task per page (five requests,
      plus a retry of page 3).
    - **Later actions on the same DataFrame** reuse the planned
      partitions, but every task runs `read()` again: five more page
      requests per action (plus page 3's retry). `count()`, then `groupBy("status").count()`, then a
      filter is three full passes over the API.
    - After `df.cache()` and one action to fill the cache, queries on
      `df` make **no** requests at all.

    The reuse of partitions comes from Spark keeping the planned read
    (`PythonDataSourceV2.getOrCreateReadInfo` in the 4.2.0 source) on the
    DataFrame's relation. It has a side effect: pages that appear in the
    API after the first action are not planned for that DataFrame. Call
    `load()` again for a fresh plan.

    For anything beyond exploration, land the API data in a table once
    (a bronze table) and query the table. That also gives you a record of
    what the API returned, which you will want the day it changes.

