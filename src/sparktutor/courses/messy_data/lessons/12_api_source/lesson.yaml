    ## Network Calls Belong in `read()`, With a Timeout

    Open connections inside `read()`, never in `__init__` or
    `partitions()`: sockets and HTTP sessions do not pickle, and an open
    connection made on the driver means nothing on an executor. Import
    inside the method too, so the code works wherever the task lands.

    ```python
    def read(self, partition):
        import json
        from pyspark.sql.types import VariantVal

        body = fetch_json(self.page_url(partition.page), self.timeout, self.retries)
        for item in body["items"]:
            yield (item["id"], item["status"], item["subject"],
                   VariantVal.parseJson(json.dumps(item["meta"])))
    ```

    Always pass a timeout. `urllib.request.urlopen(url)` without one uses
    the global socket default, which is no timeout at all: a server that
    accepts the connection and never answers leaves the task hanging
    forever, and the job with it. `urlopen(url, timeout=10)` raises
    instead, and the error tells you which page stalled.

