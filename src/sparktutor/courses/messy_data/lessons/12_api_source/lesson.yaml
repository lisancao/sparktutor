    ## Being a Good API Citizen

    - **Concurrency is your partition count.** With one partition per page
      and `local[*]` on an 8-core laptop, up to 8 requests run at once; on
      a cluster it can be hundreds. If the API has a rate limit, cap the
      parallelism: give each partition a range of pages (for example a
      `pages_per_partition` option) so fewer tasks run, or read with fewer
      cores.
    - **Secrets.** Pass a token as an option (`.option("token", ...)`)
      rather than in the source code. Remember that the reader object,
      options included, is pickled and sent to every task.
    - **Big pages beat many pages.** Each request has a fixed cost. Use the
      largest page size the API allows, which also means fewer partitions
      to plan.
    - **Stable ordering.** Page-number pagination is only correct if the
      API sorts by something stable (an id or a creation time). If new
      records are inserted at the front while you read, rows shift across
      pages and you can get duplicates or gaps. Check the result for
      duplicate ids, as the exercise does.

