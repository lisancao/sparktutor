    ## Reshaping to a Target Schema

    Three tools, each with limits worth knowing.

    **`cast` and `try_cast`.** `cast` converts a column to a type and,
    under ANSI mode, fails on a bad value. `try_cast` (a `Column` method
    since 4.0) returns NULL instead. Both work only between types that
    can be converted at all. A struct can't become a double, and
    `try_cast` doesn't change that; the query fails before it runs:

    ```python
    d3.select(F.col("amount").try_cast("double"))
    # [DATATYPE_MISMATCH.CAST_WITHOUT_SUGGESTION] Cannot resolve "TRY_CAST(amount AS DOUBLE)"
    #   due to data type mismatch: cannot cast "STRUCT<currency: STRING, value: DOUBLE>" to "DOUBLE".
    ```

    `try_cast` protects you from bad **values**, not from incompatible
    **types**. Check the types first (that is what the drift report is
    for).

    **`DataFrame.to(schema)`** (Spark 3.4, SPARK-39625) reorders columns
    by name, drops columns the schema doesn't list, and casts where the
    cast is safe. What it did on 4.2.0:

    | Case | Result |
    |------|--------|
    | columns in another order | reordered |
    | extra columns | dropped |
    | `bigint` to `int`, `double` to `string` | cast |
    | `string` to `double` | ``[INVALID_COLUMN_OR_FIELD_DATA_TYPE] Column or field `amount` is of type "STRING" while it's required to be "DOUBLE".`` |
    | nullable column, target `NOT NULL` | ``[NULLABLE_COLUMN_OR_FIELD] Column or field `user_id` is nullable while it's required to be non-nullable.`` |
    | missing nullable column | **filled with NULL** |
    | missing `NOT NULL` column | `[UNRESOLVED_COLUMN.WITH_SUGGESTION]` |

    The "missing nullable column" row contradicts the 4.2.0 docstring,
    which says missing columns lead to failures; the 4.2.0 source
    (`Project.reorderFields`) fills them with NULL. Test this behaviour
    if you rely on it.

    **Your own select.** For messy data the most predictable tool is a
    `select` you build from the target schema: for each target column,
    keep it if the type already matches, `try_cast` it if both types are
    plain, rebuild a struct field by field if both are structs, and use
    `F.lit(None).cast(type)` (a typed NULL) when the column is missing or
    can't be converted. The exercise builds exactly this.

