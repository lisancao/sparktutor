    ## Exercise: A Schema Contract for the Events

    The team has agreed on a contract for order events (`CONTRACT_DDL` in
    the starter):

    ```
    event STRING, user STRUCT<id: BIGINT, plan: STRING>, amount DOUBLE,
    items ARRAY<STRUCT<qty: BIGINT, sku: STRING>>, ts TIMESTAMP
    ```

    Implement:

    1. `save_contract(schema, path)` and `load_contract(path)`: store the
       schema as JSON text and read it back with `StructType.fromJson`.
    2. `schema_drift(expected, actual)`: a sorted list of
       `(kind, path, detail)` tuples, `kind` being `missing`, `added` or
       `type_changed`, comparing types with `simpleString()` and going
       inside structs that both sides have (nested paths use dots).
    3. `load_with_contract(spark, path, contract_path)`: return
       `(df, drift)`. `df` is the files read with the contract as their
       schema, plus a `_file` column from `_metadata.file_name`. `drift`
       compares the contract with the schema Spark infers for the same
       files (with `inferTimestamp` on).
    4. `align_column` and `align_to(df, contract)`: reshape a DataFrame
       read by inference to exactly the contract's schema. The struct
       case is written for you; add the plain-type case (`try_cast`) and
       the fallback (a typed NULL), then build the `select`.

    The checks: the contract survives a round trip through a file; the
    drift for day 1 and day 3 matches exactly; the folder read through
    the contract has the contract's columns plus `_file`, 61 rows and
    20, 15 and 0 usable amounts per day; day 3 aligned to the contract
    keeps every `user.id`, turns its object amounts into NULL and gains a
    NULL `event`; and aligned day 1 and day 3 combine with `unionByName`
    into 41 rows.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "save: open(path, 'w').write(schema.json()). load: StructType.fromJson(json.load(open(path))). In schema_drift, e = field.dataType and a = actual_fields[field.name].dataType; when both are StructType, extend with schema_drift(e, a, path + '.'); otherwise compare e.simpleString() with a.simpleString(). In align_to: df.select(*[align_column(F.col(f.name), have[f.name], f.dataType).alias(f.name) if f.name in have else F.lit(None).cast(f.dataType).alias(f.name) for f in contract.fields])."

