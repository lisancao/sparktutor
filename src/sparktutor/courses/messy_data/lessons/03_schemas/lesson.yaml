    ## Parquet and mergeSchema

    When Parquet files in one folder have different columns, Spark by
    default takes the schema from one of them (`spark.sql.parquet.mergeSchema`
    is `false`), so columns that exist only in other files disappear.
    The `mergeSchema` option reads every file's footer and unions the
    columns. Day 1 and day 2 of the events, written as Parquet under
    `day=1` and `day=2` folders (with day 2's `amount` cast to double
    first):

    ```python
    print(spark.read.parquet(p).schema.simpleString())
    print(spark.read.option("mergeSchema", "true").parquet(p).schema.simpleString())
    ```

    ```
    struct<amount:double,event:string,ts:string,user_id:bigint,day:int>
    struct<amount:double,event:string,ts:string,user_id:bigint,items:array<struct<qty:bigint,sku:string>>,user:struct<id:bigint,plan:string>,day:int>
    ```

    (`day` is a partition column, made from the `day=1` folder names.)
    Merging costs a read of every footer, which is why it is off by
    default. It only unions columns; it does not reconcile types. Without
    the cast, day 2's string `amount` against day 1's double failed at
    read time with `[CANNOT_MERGE_SCHEMAS] Failed merging schemas`,
    caused by `[CANNOT_MERGE_INCOMPATIBLE_DATA_TYPE] Failed to merge
    incompatible data types "DOUBLE" and "STRING"` (in classic PySpark it
    reaches Python as a `Py4JJavaError` with that text, not as an
    exception with a condition).

