    ## Detecting Drift in Code

    **Drift** is any difference between the schema you expect and the
    one that arrives: a field added, a field missing, a type changed. To
    catch it automatically, compare two schemas field by field.

    - Compare **types** with `simpleString()`, so nullability (which
      file sources reset anyway) doesn't count as drift.
    - **Recurse into structs**, so a new field deep inside `user` is
      reported as `user.geo`, not as "the whole user changed".
    - Report three kinds: `added`, `missing`, `type_changed`.

    The heart of it:

    ```python
    def schema_drift(expected, actual, prefix=""):
        drift = []
        actual_fields = {f.name: f for f in actual.fields}
        for field in expected.fields:
            path = prefix + field.name
            if field.name not in actual_fields:
                drift.append(("missing", path, field.dataType.simpleString()))
            # ... recurse into structs, compare simpleString(), then find the added fields
        return sorted(drift)
    ```

    Comparing the agreed contract (the exercise's `CONTRACT_DDL`) with
    day 1's schema, inferred with `inferTimestamp` on, gives:

    ```
    [('added', 'user_id', 'bigint'),
     ('missing', 'items', 'array<struct<qty:bigint,sku:string>>'),
     ('missing', 'user', 'struct<id:bigint,plan:string>')]
    ```

    A report like this can fail a job, open a ticket, or just be logged
    next to the data. You will finish the function in the exercise.

    One trap: field **order** is part of a struct type, and JSON
    inference sorts fields by name. A contract that says
    `STRUCT<sku: STRING, qty: BIGINT>` has a different `simpleString()`
    from the inferred `struct<qty:bigint,sku:string>`, so a naive
    comparison reports a change that isn't one. Write nested fields of a
    contract in alphabetical order, or compare struct fields by name, as
    the recursive function does for structs (it still compares a struct
    inside an array by its `simpleString()`).

