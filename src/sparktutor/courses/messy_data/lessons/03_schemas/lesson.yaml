    ## Reading Through an Enforced Schema

    The cure for unstable inference is to read with a schema you chose.
    Reading is then faster (no inference pass) and the output shape is
    always the same. Values that don't fit the declared type become
    NULL, and fields the schema doesn't mention are ignored:

    ```python
    c = spark.read.schema("event STRING, amount DOUBLE").json("data/messy/events")
    (c.groupBy(F.col("_metadata.file_name").alias("file"))
      .agg(F.count("*").alias("rows"), F.count("amount").alias("amount_ok"))
      .orderBy("file").show(truncate=False))
    ```

    ```
    +----------------------+----+---------+
    |file                  |rows|amount_ok|
    +----------------------+----+---------+
    |events_2026-10-01.json|20  |20       |
    |events_2026-10-02.json|20  |15       |
    |events_2026-10-03.json|21  |0        |
    +----------------------+----+---------+
    ```

    (`F.count("amount")` counts non-NULL values; `_metadata.file_name`
    is the hidden column with the source file name, covered in "Files as
    Files: binaryFile, Globs and Metadata".)

    The schema held, and the numbers tell you exactly how much data
    didn't fit: day 2's five amounts written as strings and every one of
    day 3's object amounts. Losing them silently would be bad; counting
    them is the first step. "JSON Drift and Quarantine" shows how to
    keep the raw record of each one (the corrupt record column and parse
    modes) and how to read every shape of `amount`.

    Formats that store their schema behave differently. Parquet records
    each column's physical type, and reading a column with an
    incompatible type fails instead of giving NULL. A folder of two
    Parquet files, one with `amount` as a double and one as a string,
    read without `mergeSchema` (so Spark took `double` from one file's
    footer), failed at `collect()` with:

    ```
    [FAILED_READ_FILE.PARQUET_COLUMN_DATA_TYPE_MISMATCH] Encountered error while reading file
