    ## Column Names From the Wild

    Producers name things however they like. What Spark 4.2.0 does with
    awkward names:

    **Spaces** work in the DataFrame API but must be quoted with
    backticks inside SQL expressions:

    ```python
    weird = spark.createDataFrame([(1, 2, 3)], ["order id", "user.name", "Amount"])
    weird.select("order id")                          # works
    weird.selectExpr("order id")                      # [UNRESOLVED_COLUMN.WITH_SUGGESTION] ... `order`
    weird.selectExpr("`order id` AS order_id")        # works
    ```

    **Dots** mean "field of a struct" to Spark, so a column literally
    named `user.name` needs backticks even in the DataFrame API:

    ```python
    weird.select("user.name")      # [UNRESOLVED_COLUMN.WITH_SUGGESTION] `user`.`name` cannot be resolved.
                                   #   Did you mean one of the following? [`user.name`, ...]
    weird.select("`user.name`")    # works
    weird.withColumnRenamed("user.name", "user_name")   # works: renaming takes the plain name
    ```

    **Case.** Spark resolves names case-insensitively by default
    (`spark.sql.caseSensitive` is `false`): `weird.select("amount")` finds
    `Amount`. That turns into an error when a source has two names that
    differ only in case. A JSON line `{"amount": 1, "Amount": 2}` fails at
    read time with ``[COLUMN_ALREADY_EXISTS] The column `amount` already
    exists.``, and so does a JSON object with a repeated key such as
    `{"a": 1, "a": 2}`. With `spark.sql.caseSensitive` set to `true`, the
    first one reads as two columns, `Amount` and `amount`; prefer
    renaming at the edge over flipping that setting for a whole job.
    A DataFrame with columns `a` and `A` gives
    ``[AMBIGUOUS_REFERENCE] Reference `a` is ambiguous`` when you select
    `a`.

    **Duplicates and blanks in CSV headers.** A header
    `id,name,name,,total amount` read with `header=True` gave the columns
    `['id', 'name1', 'name2', '_c3', 'total amount']`: Spark numbers
    duplicate names and names an empty one by its position. "CSV and
    Delimited Files" covers headers in depth.

    The cure is the same in every case: rename to plain `snake_case`
    names as the first step after reading, with `withColumnsRenamed`
    (3.4) for a dict of renames or `toDF(*new_names)` to replace them
    all, and keep the original names only in your documentation.

