    ## Schema Metadata

    Each `StructField` carries a `metadata` dict that travels with the
    schema through `json()`, `fromJson`, Parquet files and most
    transformations. It is a place for comments or lineage notes, and
    SQL's `COMMENT` clause uses it:

    ```python
    s = StructType.fromDDL("amount DOUBLE COMMENT 'order total in CAD'")
    print(s["amount"].metadata)       # {'comment': 'order total in CAD'}
    ```

    Remember that `StructType` equality includes metadata, so two
    schemas that differ only in a comment are not `==`. Another reason
    to compare `simpleString()` (or your own normalized form) when
    checking for drift.

