    ## Nested Types, and a First Look at VARIANT

    Messy data is usually nested. The inferred schema of the events has
    all three complex types' worth of nesting:

    - `items: array<struct<qty: bigint, sku: string>>`: a list of
      structs, one per line item
    - `user: struct<geo: struct<country: string>, id: bigint, plan: string>`:
      a struct inside a struct

    A **struct** has fixed, named fields (like a row inside a row). An
    **array** holds any number of elements of one type. A **map** holds
    key to value pairs where keys are not known in advance (a
    `map<string,string>` of free-form tags, for example). You reach into
    them by path: `F.col("user.geo.country")`, `F.col("items")[0]`,
    `F.col("tags")["color"]`. "Complex Types and Higher-Order Functions"
    teaches them in depth.

    A schema object lets you navigate the same way:

    ```python
    events = spark.read.json("data/messy/events")
    print(events.schema["user"].dataType["geo"])
    print(events.schema.fieldNames())
    print(events.dtypes[:3])
    ```

    ```
    StructField('geo', StructType([StructField('country', StringType(), True)]), True)
    ['_corrupt_record', 'amount', 'event', 'event_type', 'items', 'ts', 'user', 'user_id']
    [('_corrupt_record', 'string'), ('amount', 'string'), ('event', 'string')]
    ```

    `schema["user"]` is a `StructField` (name, type, nullable); its
    `dataType` is the nested `StructType`, which you can index again.

    All of these types need you to know the shape. **VARIANT** (Spark
    4.0, SPARK-45827) is for when you don't: one column that holds any
    JSON-like value, object, array, number or string, in an efficient
    binary form, with fields pulled out at query time. "VARIANT Basics:
    Profiling and Nested Data" uses it on these same events.

