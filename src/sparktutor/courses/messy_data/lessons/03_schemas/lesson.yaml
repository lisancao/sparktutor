    ## Summary

    In this lesson you learned:

    - **Types**: integers by size, `DOUBLE` for measurements and
      `DECIMAL(p,s)` for money (`DecimalType()` is `(10,0)`); ANSI mode
      (4.0) turns overflow into `CAST_OVERFLOW`, `ARITHMETIC_OVERFLOW` or
      `NUMERIC_VALUE_OUT_OF_RANGE` errors, and `try_cast` into NULL.
    - **Time**: `TIMESTAMP` is an instant converted with
      `spark.sql.session.timeZone`; `TIMESTAMP_NTZ` (3.4) is a wall-clock
      value. `collect()` gives datetimes in the Python process's zone.
      Year-month intervals can't be collected in 4.2.0.
    - **Nested types**: struct, array, map, and VARIANT (4.0) when the
      shape is unknown.
    - **Nullability** is a hint for file sources (every field becomes
      nullable); `createDataFrame` checks it, and `verifySchema=False`
      turned a `None` into `0`.
    - **Writing schemas**: DDL strings or `StructType`;
      `fromDDL`/`toDDL` (4.0) need a session; `simpleString()`,
      `treeString()`, and `json()`/`fromJson` for storing contracts.
    - **Inference** costs a pass over the data and changes with the
      data; `samplingRatio` can drop fields or produce an empty schema.
    - **Enforced schemas** give a stable shape; values that don't fit
      become NULL for JSON, and fail for Parquet. `mergeSchema` unions
      Parquet columns but not types.
    - **Drift** is found by comparing schemas field by field with
      `simpleString()`, recursing into structs.
    - **Combining shapes**: `unionByName(allowMissingColumns=True)`
      (3.1) fills missing columns but fails on incompatible types;
      `try_cast` fixes bad values, not impossible types; `DataFrame.to`
      (3.4) reorders, drops and fills missing nullable columns.
    - **Names**: backticks for spaces in SQL and for dots everywhere,
      case-insensitive resolution by default, `COLUMN_ALREADY_EXISTS` for
      JSON keys that differ only in case, and renaming right after
      reading.

    Next: **Columns and Expressions: Cleaning Values**, where the schema
    holds and the job becomes fixing the values inside it: strings,
    numbers, dates and nulls.
