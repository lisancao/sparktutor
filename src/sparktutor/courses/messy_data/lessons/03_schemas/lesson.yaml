    ## Schemas in Production

    A few habits that pay off as soon as more than one job reads a
    source:

    - **Keep the contract next to the code**, as a `.json` file from
      `schema.json()` or as a DDL string, under version control. Change
      it deliberately, in review, like code.
    - **Read with the contract, profile with inference.** The job reads
      through the contract (stable output), and a separate check infers
      the schema of new files and compares it with the contract to
      report drift. That is what the exercise's `load_with_contract`
      does.
    - **Decide per field what drift means.** A new field is usually
      harmless (log it). A missing field may be a renamed one. A type
      change is the one that silently loses data, so it is the one to
      alert on.
    - **Write the result to a table format that enforces the schema**
      ("Landing Messy Data in Delta Lake" shows how Delta rejects
      drifted writes, and what `mergeSchema` means there).
    - **Plan for the shapes you can't predict**: keep the raw record
      next to the parsed columns, or keep the whole record as VARIANT.

