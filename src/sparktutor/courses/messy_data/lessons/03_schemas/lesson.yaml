    ## Combining DataFrames of Different Shapes

    `union` stacks two DataFrames **by position**: column 1 with column
    1, whatever the names. On drifted data it fails, or worse, succeeds
    and mixes columns. `unionByName` matches columns by name. With day 1
    (`d1`) and day 3 (`d3`) of the events read by inference:

    ```python
    d1.union(d3)
    # [NUM_COLUMNS_MISMATCH] UNION can only be performed on inputs with the same number of
    #   columns, but the first input has 4 columns and the second input has 6 columns.

    d1.unionByName(d3)
    # [UNRESOLVED_COLUMN_AMONG_FIELD_NAMES] Cannot resolve column name "event" among
    #   (_corrupt_record, amount, event_type, items, ts, user).
    ```

    `allowMissingColumns=True` (Spark 3.1, SPARK-29358) fills a column
    that one side lacks with NULL. Day 1 with day 2 then works:

    ```python
    d1.unionByName(d2, allowMissingColumns=True).schema.simpleString()
    # struct<amount:double,event:string,ts:string,user_id:bigint,
    #        items:array<struct<qty:bigint,sku:string>>,user:struct<id:bigint,plan:string>>
    ```

    Wait: day 2's `amount` is a string, yet the result says `double`.
    The union found a common type and added a plain
    `cast(amount as double)` to day 2's side (`explain()` shows it), so
    `'32.83'` became `32.83`. That cast is strict under ANSI mode: one
    amount such as `'n/a'` would fail the whole query with
    `CAST_INVALID_INPUT` when it runs. And matching names does not fix
    types that can't be combined at all. Day 1 with day 3:

    ```python
    d1.unionByName(d3, allowMissingColumns=True)
    # [INCOMPATIBLE_COLUMN_TYPE] UNION can only be performed on tables with compatible column
    #   types. The first column of the second table is "STRUCT<currency: STRING, value: DOUBLE>"
    #   type which is not compatible with "DOUBLE" at the same column of the first table.
    ```

    So before combining sources, reshape each one to a common target.

