    ## Numbers: Overflow, Doubles and Decimals

    Since Spark 4.0, ANSI SQL mode is on by default (SPARK-44444), so a
    number that doesn't fit its type is an error, not a silent wrap:

    ```python
    spark.sql("SELECT CAST(300 AS TINYINT)").collect()
    # [CAST_OVERFLOW] The value 300 of the type "INT" cannot be cast to "TINYINT"
    #   due to an overflow. Use `try_cast` to tolerate overflow and return NULL instead.

    spark.sql("SELECT 2147483647 + 1").collect()
    # [ARITHMETIC_OVERFLOW] overflow. Use 'try_add' to tolerate overflow and return NULL instead.
    ```

    `FLOAT` and `DOUBLE` are binary fractions, so most decimal numbers
    are stored approximately. That is fine for measurements and wrong for
    money:

    ```python
    spark.sql("SELECT 0.1D + 0.2D AS as_double, 0.1BD + 0.2BD AS as_decimal").show()
    ```

    ```
    +-------------------+----------+
    |          as_double|as_decimal|
    +-------------------+----------+
    |0.30000000000000004|       0.3|
    +-------------------+----------+
    ```

    `DECIMAL(p, s)` stores exactly `p` digits, `s` of them after the
    point, up to 38 digits. `DecimalType()` with no arguments is
    `DecimalType(10,0)`: no digits after the point, a common surprise.
    A value too big for the declared precision fails under ANSI mode:

    ```python
    spark.sql("SELECT CAST(12345.678 AS DECIMAL(5,2))").collect()
    # [NUMERIC_VALUE_OUT_OF_RANGE.WITH_SUGGESTION] 12345.678 cannot be represented as Decimal(5, 2).

    spark.sql("SELECT TRY_CAST(12345.678 AS DECIMAL(5,2)) d, CAST(123.456 AS DECIMAL(5,2)) r").collect()
    # [Row(d=None, r=Decimal('123.46'))]   (too big: NULL; too many decimals: rounded)
    ```

    For JSON, inference makes every whole number a `BIGINT` and every
    number with a point a `DOUBLE`. The option `prefersDecimal` makes it
    choose decimals instead: on the first events file, `amount` became
    `decimal(4,2)` instead of `double`.

