    ## Inference: What It Costs and Why It Wobbles

    Without a schema, the JSON reader reads every record once just to
    decide the schema, before your query even starts ("Why Spark for
    Messy Data, and How It Runs Your Code" showed that `spark.read.json`
    runs a job straight away). Then it reads the data again for the
    query. For a large folder that first pass can cost as much as the
    query.

    The result also depends on exactly which records it saw. Read the
    event files one day at a time:

    ```python
    for day in ["01", "02", "03"]:
        print(day, spark.read.json(f"data/messy/events/events_2026-10-{day}.json").schema.simpleString())
    ```

    ```
    01 struct<amount:double,event:string,ts:string,user_id:bigint>
    02 struct<amount:string,event:string,items:array<struct<qty:bigint,sku:string>>,ts:string,user:struct<id:bigint,plan:string>>
    03 struct<_corrupt_record:string,amount:struct<currency:string,value:double>,event_type:string,items:array<struct<qty:bigint,sku:string>>,ts:string,user:struct<geo:struct<country:string>,id:bigint,plan:string>>
    ```

    Three days, three schemas; `amount` is a `double`, a `string` and a
    `struct`. A job that infers will change its output schema whenever a
    new kind of file lands. A few rules of JSON inference are visible
    here: fields are sorted by name, whole numbers become `bigint`,
    conflicting types widen to `string`, and timestamps stay strings
    unless you set `option("inferTimestamp", True)` (off by default).
    "JSON Drift and Quarantine" takes these rules apart in detail.

    `samplingRatio` makes inference read only a fraction of the records.
    Faster, and less stable still. On the whole folder with `local[4]`:

    ```python
    for r in [1.0, 0.1, 0.05, 0.01]:
        print(r, spark.read.option("samplingRatio", r).json("data/messy/events").schema.simpleString())
    ```

    ```
    1.0  struct<_corrupt_record:string,amount:string,event:string,event_type:string,items:...,ts:string,user:struct<geo:struct<country:string>,id:bigint,plan:string>,user_id:bigint>
    0.1  struct<_corrupt_record:string,amount:string,event:string,event_type:string,items:...,ts:string,user:struct<geo:struct<country:string>,id:bigint,plan:string>>
    0.05 struct<amount:double,event:string,items:array<struct<qty:bigint,sku:string>>,ts:string,user:struct<id:bigint,plan:string>>
    0.01 struct<>
    ```

    At 0.1 `user_id` vanished; at 0.05 `amount` turned back into a
    `double`, so string amounts would now fail to parse; at 0.01 the
    sample was empty and the schema has **no columns at all**. That last
    DataFrame still has 61 rows, and `columns` is `[]`. The sample uses
    a fixed seed (1, in the 4.2.0 source), so the same files give the
    same answer, but it is drawn per partition, so the answer changes
    with the number of files and cores.

