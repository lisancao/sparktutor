    ## What You'll Learn

    From "Why Spark for Messy Data, and How It Runs Your Code" you know
    how Spark plans and runs a query, and from "Setup, a First Session
    and a Tour of the Sample Data" you can open a session, read a folder
    and look at `printSchema()`. This lesson is about that schema: what it
    is made of, where it comes from, and what to do when the data you
    receive keeps changing shape. It follows chapter 3 of *Learning
    Spark* (the structured APIs), with data that doesn't follow the
    rules.

    By the end of this lesson you will be able to:

    - Name Spark's data types and pick the right one for numbers, money,
      text, bytes, dates and times, nested data and VARIANT
    - Explain what nullability means in a schema, and why for files it is
      only a hint
    - Write a schema as a DDL string or a `StructType`, print it in
      several forms, and store it in a file with `schema.json()`
    - Explain what schema inference costs and why it is unstable on
      messy data, with `samplingRatio` as the proof
    - Read files through an enforced schema, and merge Parquet schemas
      with `mergeSchema`
    - Detect drift by comparing two schemas in code
    - Combine DataFrames of different shapes with
      `unionByName(allowMissingColumns=True)`, and reshape one to a target
      schema with `try_cast` and `DataFrame.to`
    - Handle column names with spaces, dots, duplicates and different
      cases

    The examples use `data/messy/events/`: three days of order events
    whose shape changes every day.

