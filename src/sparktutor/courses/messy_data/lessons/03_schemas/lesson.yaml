    ## Storing a Schema in a File

    A schema that lives only in code is hard to share with the team that
    produces the data. `schema.json()` gives a JSON document that
    describes it completely, nullability and nested types included, and
    `StructType.fromJson` reads it back. This needs no session:

    ```python
    import json

    text = s.json()
    print(text[:120])
    restored = StructType.fromJson(json.loads(text))
    print(restored == s)
    ```

    ```
    {"fields":[{"metadata":{},"name":"id","nullable":false,"type":"long"},{"metadata":{},"name":"name","nullable":true,"type
    True
    ```

    Write that text to a file next to your job, put it under version
    control, and you have a **schema contract**: the agreed shape of the
    data, which code can load, compare with what really arrives, and use
    to read files. That is this lesson's exercise.

    Equality of `StructType` objects compares everything: names, types,
    nullability, the order of fields, and metadata. Two schemas that
    differ only in nullability are not `==`, while their
    `simpleString()` values are equal.

