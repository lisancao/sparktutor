    ## What a Schema Is

    Every DataFrame has a **schema**: an ordered list of columns, each
    with a **name**, a **data type** and a **nullable** flag (whether it
    may hold NULL, Spark's "no value"). Spark needs it before it runs
    anything: the planner uses the types to choose operations, and the
    file readers use it to decode bytes.

    A schema comes from one of three places:

    1. **You.** You pass it to the reader: `spark.read.schema(...)`.
    2. **The file.** Parquet, ORC, Avro and Delta tables store their
       schema in the file or table metadata, so reading it is cheap.
    3. **Inference.** For JSON, CSV and XML, which store text, Spark
       reads the data and guesses.

    Two philosophies follow from that. **Schema on write** (a database,
    a Delta table) checks data against the schema when it is written,
    so readers can trust it. **Schema on read** (a folder of JSON files)
    stores whatever producers sent, and each reader decides what the data
    means when it reads. Messy data is schema on read almost by
    definition, which is why this lesson exists: you have to bring the
    schema, check the data against it, and decide what to do with what
    doesn't fit.

- Class: text
  Depth: beginner
  Output: |
    Think of a schema as the column headings of a paper form, with a rule
    under each: "Date of birth (a date)", "Phone (digits only)". A clerk
    who receives a pile of filled-in forms can trust the answers only as
    far as someone checked them against those rules. Schema on write is
    the clerk who rejects a form at the counter. Schema on read is the
    clerk who files everything and checks only when someone asks a
    question. This lesson teaches you to be the second clerk without
    being fooled.

