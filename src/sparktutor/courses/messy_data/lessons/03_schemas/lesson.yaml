    ## Writing Schemas: DDL Strings and StructType

    You can write a schema in two equivalent ways. A **DDL string**
    (DDL is "data definition language", the SQL used in `CREATE TABLE`)
    is short:

    ```python
    ddl = "id BIGINT NOT NULL, name STRING, tags ARRAY<STRING>, address STRUCT<city: STRING, zip: STRING>"
    ```

    A **`StructType`** is the same thing as Python objects, which is
    what you want when a program builds or inspects a schema:

    ```python
    from pyspark.sql.types import StructType, StructField, LongType, StringType, ArrayType

    schema = StructType([
        StructField("id", LongType(), False),
        StructField("name", StringType()),                 # nullable defaults to True
        StructField("tags", ArrayType(StringType())),
        StructField("address", StructType([
            StructField("city", StringType()),
            StructField("zip", StringType()),
        ])),
    ])
    ```

    Every reader and `createDataFrame` accept either form. To turn one
    into the other, `StructType.fromDDL(ddl)` (4.0) parses DDL, and
    `schema.toDDL()` (4.0) prints it back. Both need a running session,
    because the parsing is done by Spark's SQL parser in the JVM; without
    one you get
    `[SESSION_OR_CONTEXT_NOT_EXISTS] SparkContext or SparkSession should be created first.`

    A schema prints several ways:

    ```python
    s = StructType.fromDDL(ddl)
    print(s.simpleString())
    print(s.toDDL())
    print(s.treeString())     # what printSchema() prints (4.0)
    ```

    ```
    struct<id:bigint,name:string,tags:array<string>,address:struct<city:string,zip:string>>
    id BIGINT NOT NULL,name STRING,tags ARRAY<STRING>,address STRUCT<city: STRING, zip: STRING>
    root
     |-- id: long (nullable = false)
     |-- name: string (nullable = true)
     |-- tags: array (nullable = true)
     |    |-- element: string (containsNull = true)
     |-- address: struct (nullable = true)
     |    |-- city: string (nullable = true)
     |    |-- zip: string (nullable = true)
    ```

    `simpleString()` leaves out nullability, which makes it handy for
    comparing types. Note `long` in the tree and `bigint` elsewhere: they
    are two names for the same type.

