    ## Dates, Times and Time Zones

    Spark has two timestamp types, and mixing them up is the most common
    source of "the times are off by a few hours":

    - **`TIMESTAMP`** (also called `TIMESTAMP_LTZ`, local time zone) is an
      **instant**: a point on the world's timeline, stored as
      microseconds since 1970-01-01 00:00 UTC. Text is converted to and
      from it using the session time zone,
      `spark.sql.session.timeZone`.
    - **`TIMESTAMP_NTZ`** (no time zone, Spark 3.4, SPARK-35662) is a
      **wall-clock reading**, "10:00 on 1 October", with no zone at all.
      It never shifts.

    The same text under two session time zones:

    ```python
    q = "SELECT TIMESTAMP '2026-10-01 10:00:00' AS ts, TIMESTAMP_NTZ '2026-10-01 10:00:00' AS ntz"
    for tz in ["UTC", "America/Vancouver"]:
        spark.conf.set("spark.sql.session.timeZone", tz)
        spark.sql(q).withColumn("epoch", F.unix_timestamp("ts")).show()
    ```

    ```
    +-------------------+-------------------+----------+
    |                 ts|                ntz|     epoch|
    +-------------------+-------------------+----------+
    |2026-10-01 10:00:00|2026-10-01 10:00:00|1790848800|
    +-------------------+-------------------+----------+
    +-------------------+-------------------+----------+
    |                 ts|                ntz|     epoch|
    +-------------------+-------------------+----------+
    |2026-10-01 10:00:00|2026-10-01 10:00:00|1790874000|
    +-------------------+-------------------+----------+
    ```

    The text looks identical, but `epoch` (seconds since 1970 UTC) shows
    two different instants, 25200 seconds (7 hours) apart: "10:00 in UTC"
    and "10:00 in Vancouver". A plain `TIMESTAMP` column in DDL means
    `TIMESTAMP_LTZ` because `spark.sql.timestampType` defaults to
    `TIMESTAMP_LTZ`.

    **Gotcha: collecting to Python.** `collect()` turns a `TIMESTAMP` into
    a naive `datetime` in the **Python process's** local time zone, not
    the session's. With the session in UTC, the same row collected on
    machines in different zones gave:

    ```
    TZ=UTC               datetime.datetime(2026, 10, 1, 10, 0)
    TZ=Asia/Ho_Chi_Minh  datetime.datetime(2026, 10, 1, 17, 0)
    ```

    while `toPandas()` printed `2026-10-01 10:00:00` (the session zone)
    on both. Set `spark.sql.session.timeZone` explicitly in every job (all
    the exercises in this course set it to UTC), and compare instants
    inside Spark rather than after collecting.

    **Intervals** are lengths of time. Subtracting two timestamps gives
    an `interval day to second`, which collects as a `timedelta`
    (`TIMESTAMP '2026-10-03 12:00:00' - TIMESTAMP '2026-10-01 10:00:00'`
    collected as `timedelta(days=2, seconds=7200)`). Year-month intervals
    cannot be collected to Python in 4.2.0: `collect()` fails with
    `[NOT_IMPLEMENTED] YearMonthIntervalType.fromInternal is not
    implemented.` Cast them to string first if you need to look at them.

