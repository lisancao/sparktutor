    ## Nullability: A Promise Spark Doesn't Always Keep

    Each field has a `nullable` flag. `False` promises the column never
    holds NULL, which lets the optimizer skip null checks. For data you
    don't control, the important fact is this: **file sources ignore the
    promise.** When you read files with a schema that says `NOT NULL`,
    Spark makes every field nullable, because nothing guarantees the
    files agree (in the 4.2.0 source, `DataSource.resolveRelation` calls
    `dataSchema.asNullable` for file relations):

    ```python
    d = spark.read.schema("event STRING NOT NULL, user_id BIGINT NOT NULL").json("data/messy/events")
    d.printSchema()
    print(d.filter("user_id IS NULL").count())
    ```

    ```
    root
     |-- event: string (nullable = true)
     |-- user_id: long (nullable = true)

    41
    ```

    41 of the 61 events have no `user_id`, and nothing failed. So
    `NOT NULL` in a reading schema is documentation, not a check. To
    enforce it, count the NULLs yourself (later lessons build quality
    rules for this) or write to a table format that enforces it.

    Where Spark does check is when it builds data from Python objects:

    ```python
    from pyspark.sql.types import StructType, StructField, IntegerType
    st = StructType([StructField("id", IntegerType(), False)])
    spark.createDataFrame([(1,), (None,)], st)
    # [FIELD_NOT_NULLABLE_WITH_NAME] field id: This field is not nullable, but got None.
    ```

    And a gotcha: `createDataFrame(..., verifySchema=False)` skips that
    check, and the `None` did not become NULL. It came back as
    `Row(id=0)`, a made-up zero. Don't turn off verification for data you
    don't trust.

