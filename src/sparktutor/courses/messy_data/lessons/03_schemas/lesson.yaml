    ## Spark's Data Types

    `typeof()` is a SQL function that names the type of any value. The
    literals below show the main types (`1Y` is a tinyint literal, `1L` a
    bigint, `1.5D` a double, `X'00'` a binary):

    ```python
    spark.sql("""
    SELECT typeof(true) AS a, typeof(1Y) AS b, typeof(1S) AS c, typeof(1) AS d, typeof(1L) AS e,
           typeof(1.5F) AS f, typeof(1.5D) AS g, typeof(1.5) AS h, typeof('x') AS i,
           typeof(X'00') AS j, typeof(DATE'2026-10-01') AS k
    """).show()
    ```

    ```
    +-------+-------+--------+---+------+-----+------+------------+------+------+----+
    |      a|      b|       c|  d|     e|    f|     g|           h|     i|     j|   k|
    +-------+-------+--------+---+------+-----+------+------------+------+------+----+
    |boolean|tinyint|smallint|int|bigint|float|double|decimal(2,1)|string|binary|date|
    +-------+-------+--------+---+------+-----+------+------------+------+------+----+
    ```

    | DDL name | Python class | Holds | Python value |
    |----------|--------------|-------|--------------|
    | `BOOLEAN` | `BooleanType` | true / false | `bool` |
    | `TINYINT`, `SMALLINT` | `ByteType`, `ShortType` | 1- and 2-byte integers (-128 to 127, -32768 to 32767) | `int` |
    | `INT` | `IntegerType` | 4-byte integers (about plus or minus 2.1 billion) | `int` |
    | `BIGINT` | `LongType` | 8-byte integers | `int` |
    | `FLOAT`, `DOUBLE` | `FloatType`, `DoubleType` | binary floating point | `float` |
    | `DECIMAL(p,s)` | `DecimalType(p, s)` | exact decimals, p digits with s after the point | `decimal.Decimal` |
    | `STRING` | `StringType` | text | `str` |
    | `BINARY` | `BinaryType` | raw bytes | `bytes` / `bytearray` |
    | `DATE` | `DateType` | a calendar day | `datetime.date` |
    | `TIMESTAMP` | `TimestampType` | an instant in time | `datetime.datetime` |
    | `TIMESTAMP_NTZ` | `TimestampNTZType` | a wall-clock date and time, no zone | `datetime.datetime` |
    | `INTERVAL ...` | `DayTimeIntervalType`, `YearMonthIntervalType` | a length of time | `datetime.timedelta` (day-time only) |
    | `ARRAY<T>` | `ArrayType(T)` | an ordered list | `list` |
    | `MAP<K,V>` | `MapType(K, V)` | key to value pairs | `dict` |
    | `STRUCT<...>` | `StructType([...])` | named fields, like a nested row | `Row` |
    | `VARIANT` | `VariantType` | any JSON-like value (4.0) | `VariantVal` |

    The complex and newer types, again with `typeof`:

    ```
    +---------+-------------+------------+----------------------+----------+---------------+--------------------------+-------+
    |ts       |ntz          |dt          |ym                    |arr       |m              |st                        |v      |
    +---------+-------------+------------+----------------------+----------+---------------+--------------------------+-------+
    |timestamp|timestamp_ntz|interval day|interval year to month|array<int>|map<string,int>|struct<id:int,plan:string>|variant|
    +---------+-------------+------------+----------------------+----------+---------------+--------------------------+-------+
    ```

