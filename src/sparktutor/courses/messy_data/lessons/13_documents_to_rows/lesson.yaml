    ## The Left Lateral Join Trap

    A file that yields no pages (not really a PDF, or a scan with no text)
    produces no rows in an inner lateral join, so it disappears from the
    result. To keep it with `NULL` page columns you want a left join. In
    Spark 4.2.0 the join condition matters:

    ```python
    mixed = spark.createDataFrame(
        [("invoice_1002.pdf", open("data/messy/pdf/invoice_1002.pdf", "rb").read()),
         ("scan.pdf", b"%PDF-1.4 image only")],
        "file string, content binary")

    # how="left" alone: scan.pdf is still dropped
    print(mixed.lateralJoin(pdf_pages_udtf(F.col("content").outer()),
                            how="left").select("file", "page").collect())

    # how="left" with an explicit always-true condition: scan.pdf is kept
    print(mixed.lateralJoin(pdf_pages_udtf(F.col("content").outer()),
                            on=F.lit(True), how="left").select("file", "page").collect())
    ```

    ```
    [Row(file='invoice_1002.pdf', page=1)]
    [Row(file='invoice_1002.pdf', page=1), Row(file='scan.pdf', page=None)]
    ```

    SQL behaves the same: `LEFT JOIN LATERAL pdf_pages(content) p` drops
    the file, `LEFT JOIN LATERAL pdf_pages(content) p ON true` keeps it.
    Always write the condition, and count files before and after the join
    when you need every file accounted for.

