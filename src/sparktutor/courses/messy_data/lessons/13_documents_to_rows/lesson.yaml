    ## Step 1: Bytes and File Names

    ```python
    from pyspark.sql import functions as F

    mail = (spark.read.format("binaryFile")
            .option("pathGlobFilter", "*.eml")
            .load("data/messy/mail"))

    raw = mail.select(F.col("_metadata.file_name").alias("file"), "content")
    raw.show(truncate=40)
    ```

    ```
    +------------+----------------------------------------+
    |        file|                                 content|
    +------------+----------------------------------------+
    |ticket_2.eml|[46 72 6F 6D 3A 20 63 75 73 74 6F 6D ...|
    ...
    ```

    In Spark 4.1 and later a `binary` column arrives in Python (UDFs,
    UDTFs, `collect()`) as `bytes`; older versions gave `bytearray` in
    some paths.

    **Gotcha: views hide `_metadata`.** As "Setup, a First Session and a
    Tour of the Sample Data" showed, select `_metadata.file_name` into a
    normal column (as `raw` does) before you create a temporary view.

