    ## PDFs: Pages Are the Rows

    A PDF is a set of numbered objects. Each page object points to a
    *content stream*: drawing instructions for that page. In the sample
    invoices the streams are uncompressed and each page draws one string:

    ```
    4 0 obj
    << /Length 59 >>
    stream
    BT /F1 12 Tf 72 720 Td (Invoice 1001 total 42.50 CAD) Tj ET
    endstream
    endobj
    ```

    `BT ... ET` is a text block and `(...) Tj` shows a string. For these
    toy files a regular expression over the bytes finds the text of each
    page in order:

    ```python
    import re

    pdf_bytes = open("data/messy/pdf/invoice_1001.pdf", "rb").read()
    print(re.findall(rb"BT .*?\((.*?)\) Tj ET", pdf_bytes, re.S))
    ```

    ```
    [b'Invoice 1001 total 42.50 CAD', b'Thank you for shopping']
    ```

    **Be honest about the limits.** This works only because we generated
    the PDFs. Real PDFs compress their streams (`/FlateDecode`), split
    text into many small pieces with positioning in between, use font
    encodings that do not map bytes to letters directly, and store pages
    in any order. For real files use a parser library. `pypdf` is pure
    Python (BSD licence) and is not installed with SparkTutor; if you
    install it, the page loop becomes:

    ```
    import io
    from pypdf import PdfReader

    reader = PdfReader(io.BytesIO(content))
    for number, page in enumerate(reader.pages, start=1):
        yield number, page.extract_text()
    ```

    Scanned PDFs contain images, not text; getting text out of them needs
    OCR, which is outside Spark.

