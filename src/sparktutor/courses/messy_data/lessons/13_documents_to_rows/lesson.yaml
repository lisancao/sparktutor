    ## Summary

    In this lesson you learned:

    - **Decide what a row is** (message, page, paragraph) and carry the
      file name and part number on every row
    - **`binaryFile` plus `_metadata.file_name`**, selected into a normal
      column before you create a view (views hide `_metadata`)
    - **E-mail** with the standard `email` package in a UDF that returns
      a struct; timezone-aware datetimes become correct timestamps
    - **Create UDFs and UDTFs after the session exists**: DDL return
      types need a session, and the 4.2 Arrow defaults (SPARK-54555) are
      read when the function is created
    - **Forgiving parsers** return `None` or an error field instead of
      failing the job with `PYTHON_EXCEPTION`, and plain-Python parsers
      can be tested without Spark
    - **Python UDTFs** for one-to-many parsing, called with
      `lateralJoin(... .outer())` (4.0) or SQL `LATERAL`; a left lateral
      join needs an explicit `on=F.lit(True)` to keep files with no
      output
    - **Built-in functions** for Markdown: `split`, `filter`,
      `posexplode`, `regexp_extract`, and `trim` with explicit characters
    - **Chunking** with overlap, a common shape for all documents, and
      hashing to find exact repeats
    - The regex PDF reader works only for the generated files; real PDFs
      need a library such as `pypdf`

