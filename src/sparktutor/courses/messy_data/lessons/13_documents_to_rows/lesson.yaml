    ## Choosing the Tool

    | Situation | Tool | Example here |
    |-----------|------|--------------|
    | Text with simple, regular structure | Built-in functions (`split`, `regexp_extract`, `posexplode`) | Markdown paragraphs |
    | One row in, one parsed value out, logic needs Python | Python UDF returning a struct | E-mail headers and body |
    | One row in, many rows out | Python UDTF with `lateralJoin` or SQL `LATERAL` | PDF pages, chunks |
    | Real-world binary formats | A parser library inside the UDF or UDTF | `pypdf` for real PDFs |
    | The file format itself should be a source (`format("docs")`) | A Python data source | "Your First Python Data Source" and "Reading a Custom File Format, in Parallel" |

    Built-in functions run inside the JVM and are the fastest. Python
    UDFs and UDTFs cost a trip to a Python worker, made cheaper in 4.2 by
    Arrow batches, and they let you use any Python library. A data source
    goes one step further: it owns listing and reading the files, which
    you will build in "Your First Python Data Source" and "Reading a Custom File Format, in Parallel".

