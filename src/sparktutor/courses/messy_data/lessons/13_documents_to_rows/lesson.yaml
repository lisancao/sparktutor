    ## Create UDFs After the Session Exists

    Spark 4.2 runs regular Python UDFs through Arrow by default
    (`spark.sql.execution.pythonUDF.arrow.enabled` is now `true`,
    SPARK-54555): rows travel to Python in columnar batches instead of
    being pickled one at a time. The plan shows `ArrowEvalPython` instead
    of `BatchEvalPython`.

    Two details of `udf()` make the moment you create a UDF matter:

    - A return type given as a DDL string (`"string"`, `"struct<...>"`)
      is parsed by Spark, so it needs an active session. Calling
      `F.udf(f, "string")` at import time, before `getOrCreate()`, fails
      with `SESSION_OR_CONTEXT_NOT_EXISTS`.
    - The Arrow default is read from the active session when the UDF is
      created. A UDF created before any session exists (for example with
      a `StringType()` object) silently becomes a classic pickled UDF.

    ```python
    import contextlib, io

    def python_nodes(df):
        buf = io.StringIO()
        with contextlib.redirect_stdout(buf):
            df.explain()
        return [line.strip()[:40] for line in buf.getvalue().splitlines()
                if "EvalPython" in line]

    print(python_nodes(raw.select(parse_eml("content"))))
    ```

    ```
    ['+- ArrowEvalPython [parse_eml_bytes(cont']
    ```

    The pattern this course uses: keep the parsing logic in a plain
    function at module level (easy to test), and create the UDF inside
    the function that builds the DataFrame, after the session exists.

