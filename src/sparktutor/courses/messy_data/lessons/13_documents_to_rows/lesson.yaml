    ## Exercise: Documents to Rows

    Turn the sample e-mails, PDFs and Markdown policies into rows. The
    parsing helpers are written for you as plain Python
    (`parse_eml_bytes` and the `PdfPages` UDTF class), so you can focus
    on wiring them into Spark.

    1. `parse_emails(spark, folder)`: read `*.eml` with `binaryFile`,
       create a UDF from `parse_eml_bytes` with `EMAIL_TYPE`, and return
       `file, sender, subject, sent, body, order_id`, where `order_id`
       is the number after "order " in the body, as an `int`
       (`regexp_extract` then `try_cast("int")`).
    2. `pdf_pages(spark, folder)`: read `*.pdf`, create a UDTF from
