    ## One Table for All Documents

    E-mails, pages and paragraphs now have different columns. To search
    or count them together, map each to one common shape and union:

    ```python
    docs_table = (
        emails.select(F.col("file").alias("doc"), F.lit(1).alias("part"),
                      F.lit("email").alias("kind"),
                      F.col("subject").alias("title"), F.col("body").alias("text"))
        .unionByName(pages.select(F.col("file").alias("doc"), F.col("page").alias("part"),
                                  F.lit("pdf").alias("kind"),
                                  F.lit(None).cast("string").alias("title"), "text"))
        .unionByName(chunks.select(F.col("file").alias("doc"), F.col("chunk").alias("part"),
                                   F.lit("markdown").alias("kind"), "title", "text")))
    docs_table.groupBy("kind").count().show()
    ```

    `(doc, part)` identifies every row, and `kind` says how to interpret
    it. `unionByName` matches columns by name. The `NULL` title of a PDF
    page gets an explicit `cast("string")`, because a bare `F.lit(None)`
    has type `void` and you want the column's type to be clear.

    Documents repeat themselves. Each sample policy says the same thing
    three times, and real tickets quote earlier replies. A content hash
    finds exact repeats cheaply:

    ```python
    (docs_table.groupBy("doc", F.sha2("text", 256).alias("h"))
               .count()
               .filter("count > 1")
               .show(truncate=20))
    ```

    Near-duplicates (the same text with small edits) need something
    smarter; "Text Analytics Without an LLM" uses MinHash for that.

