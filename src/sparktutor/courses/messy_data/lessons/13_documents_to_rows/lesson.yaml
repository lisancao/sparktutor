    ## Make Parsers Forgiving

    A folder of documents always contains a surprise: an empty file, a
    message with no `Date`, a file that is not an e-mail at all. If your
    parser raises, the task fails and the whole job stops with
    `PYTHON_EXCEPTION` and your Python traceback:

    ```python
    def strict(content):
        raise ValueError("cannot parse this file")

    raw.select(F.udf(strict, "string")("content")).collect()
    ```

    ```
    PythonException: [PYTHON_EXCEPTION] An exception was thrown from the
    Python worker: ... ValueError: cannot parse this file
    ```

    One bad file out of a million should not cost you the other 999,999.
    Return `None` for fields you cannot read (as `parse_eml_bytes` does),
    and when you need to know why, return an error field too and
    quarantine those rows, the same idea as "JSON Drift and Quarantine"'s corrupt-record
    column:

    ```python
    def parse_or_explain(content):
        try:
            sender, subject, sent, body = parse_eml_bytes(content)
            if sent is None:
                return (sender, subject, sent, body, "missing Date header")
            return (sender, subject, sent, body, None)
        except Exception as e:
            return (None, None, None, None, f"{type(e).__name__}: {e}")

    safe = F.udf(parse_or_explain,
                 "struct<sender:string, subject:string, sent:timestamp, "
                 "body:string, error:string>")

    junk = spark.createDataFrame([("note.eml", b"just some bytes")],
                                 "file string, content binary")
    (raw.unionByName(junk)
        .select("file", safe("content").alias("m"))
        .select("file", "m.subject", "m.error")
        .show(truncate=False))
    ```

    Because `parse_eml_bytes` is plain Python, you can also test it
    without starting Spark at all: `parse_eml_bytes(b"junk")` returns a
    tuple of `None`s instead of raising. "Your First Python Data Source" uses the same idea to
    test a data source.

