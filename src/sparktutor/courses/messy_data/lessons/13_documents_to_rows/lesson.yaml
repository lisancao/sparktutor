    Think of a document as a parcel. `binaryFile` hands you the parcel
    with its shipping label (path, size, modification time). Parsing is
    opening it and sorting the contents onto shelves. A UDF takes one
    parcel and puts one item on the shelf; a UDTF can take one parcel and
    put many items on the shelf, each with a note saying which parcel it
    came from.

