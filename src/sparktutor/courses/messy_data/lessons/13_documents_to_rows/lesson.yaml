    ## One Row In, Many Rows Out: Python UDTFs

    A UDF returns exactly one value per input row, so it cannot turn one
    PDF into three pages. A **Python user-defined table function** (UDTF,
    Spark 3.5) can: it is a class whose `eval` method `yield`s as many
    output rows as it likes.

    ```python
    class PdfPages:
        def eval(self, content):
            import re
            if content is None:
                return
            for number, raw_text in enumerate(
                    re.findall(rb"BT .*?\((.*?)\) Tj ET", content, re.S), start=1):
                yield number, raw_text.decode("latin-1")

    pdf_pages_udtf = F.udtf(PdfPages, returnType="page int, text string")

    pdfs = (spark.read.format("binaryFile")
            .option("pathGlobFilter", "*.pdf")
            .load("data/messy/pdf")
            .select(F.col("_metadata.file_name").alias("file"), "content"))

    pages = (pdfs
             .lateralJoin(pdf_pages_udtf(F.col("content").outer()))
             .drop("content"))
    pages.orderBy("file", "page").show(truncate=False)
    ```

    ```
    +----------------+----+----------------------------+
    |file            |page|text                        |
    +----------------+----+----------------------------+
    |invoice_1001.pdf|1   |Invoice 1001 total 42.50 CAD|
    |invoice_1001.pdf|2   |Thank you for shopping      |
    |invoice_1002.pdf|1   |Invoice 1002 total 17.00 CAD|
    +----------------+----+----------------------------+
    ```

    How the pieces fit:

    - `F.udtf(PdfPages, returnType=...)` turns the class into a table
      function. Create it after the session exists, for the same reasons
      as a UDF. In 4.2 UDTFs are Arrow-optimized by default too
      (`spark.sql.execution.pythonUDTF.arrow.enabled`, SPARK-54555); the
      plan shows `ArrowEvalPythonUDTF`.
    - `DataFrame.lateralJoin` (Spark 4.0) calls the table function once
      per row of `pdfs` and joins each output row back to the row that
      produced it, so `file` travels along.
    - `.outer()` marks `content` as a column of the outer DataFrame. Pass
      `F.col("content")` without it and the analyzer looks for `content`
      inside the function's own output and fails with
      `UNRESOLVED_COLUMN.WITHOUT_SUGGESTION`.
    - `latin-1` maps every byte to a character, so decoding never fails;
      it is right for these ASCII strings and a safe fallback for unknown
      bytes.

