    ## Timestamps Coming Back to Python

    `collect()` hands back the `sent` timestamps as naive Python
    `datetime` values in the driver machine's local time zone, not the
    session's, as "Schemas for Data You Don't Control" showed. When you
    test a timestamp column, compare strings formatted in Spark (for
    example `F.date_format("sent", "yyyy-MM-dd HH:mm")`) instead.

