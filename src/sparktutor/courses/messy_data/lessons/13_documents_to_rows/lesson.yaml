    ## Parsing E-mail With the Standard Library

    An `.eml` file looks like text you could split with a regular
    expression:

    ```
    From: customer2@example.com
    To: support@example.com
    Subject: Where is my order?
    Date: Sat, 03 Oct 2026 09:00:00 +0000
    Content-Type: text/plain; charset="utf-8"
    ...

    Hello, order 1002 has a problem. Please help.
    ```

    Real e-mail is harder than it looks: headers can be folded over
    several lines, subjects can be encoded (`=?utf-8?b?...?=`), bodies
    can be base64 or quoted-printable, and a message can have plain text,
    HTML and attachments in nested MIME parts. Python's `email` package
    handles all of that, and it ships with Python, so every executor has
    it.

    Write the parser as a plain Python function first:

    ```python
    def parse_eml_bytes(content):
        from email import policy
        from email.parser import BytesParser

        if content is None:
            return None
        msg = BytesParser(policy=policy.default).parsebytes(content)
        date = msg["Date"]
        body = msg.get_body(preferencelist=("plain",))
        return (
            str(msg["From"]) if msg["From"] else None,
            str(msg["Subject"]) if msg["Subject"] else None,
            date.datetime if date is not None and date.datetime is not None else None,
            body.get_content().strip() if body is not None else None,
        )

    sample = open("data/messy/mail/ticket_2.eml", "rb").read()
    print(parse_eml_bytes(sample))
    ```

    With `policy.default`, `msg["Date"]` is a header object whose
    `.datetime` is a timezone-aware `datetime`, and `get_body()` picks
    the best plain-text part for you. The imports are inside the
    function on purpose: the function is pickled and run on executors,
    and imports inside it run where it runs.

    Then wrap it as a UDF that returns a struct, and expand the struct
    with `"m.*"`:

    ```python
    EMAIL_TYPE = "struct<sender:string, subject:string, sent:timestamp, body:string>"
    parse_eml = F.udf(parse_eml_bytes, EMAIL_TYPE)

    emails = (raw.select("file", parse_eml("content").alias("m"))
                 .select("file", "m.*"))
    emails.show(truncate=False)
    ```

    ```
    +------------+---------------------+------------------+-------------------+---------------------------------------------+
    |file        |sender               |subject           |sent               |body                                         |
    +------------+---------------------+------------------+-------------------+---------------------------------------------+
    |ticket_2.eml|customer2@example.com|Where is my order?|2026-10-03 09:00:00|Hello, order 1002 has a problem. Please help.|
    ...
    ```

    Returning one struct (instead of four separate UDFs) parses each
    message once. A timezone-aware `datetime` returned for a `timestamp`
    field is converted correctly; `show()` displays it in the session
    time zone (UTC in these exercises).

