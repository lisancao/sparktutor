    ## Markdown: Built-in Functions Are Enough

    Markdown is plain text with light structure: `# ` starts a heading,
    a blank line separates paragraphs. No Python is needed. Read each file
    as one row (remember from "Text and Logs": pass `wholetext=True` as the
    keyword, not as an `.option`), pull the title out with a regular
    expression, split on blank lines and explode:

    ```python
    docs = spark.read.text("data/messy/docs/*.md", wholetext=True)

    ws = F.lit(" \t\r\n")
    paragraphs = F.filter(
        F.split("value", r"\n\s*\n"),
        lambda p: (F.trim(p, ws) != "") & ~F.trim(p, ws).startswith("#"),
    )

    chunks = (docs
        .select(F.col("_metadata.file_name").alias("file"),
                F.regexp_extract("value", r"(?m)^# (.+)$", 1).alias("title"),
                F.posexplode(paragraphs).alias("pos", "text"))
        .select("file", "title", (F.col("pos") + 1).alias("chunk"),
                F.trim("text", ws).alias("text")))
    chunks.filter("file = 'shipping.md'").show(truncate=50)
    ```

    ```
    +-----------+---------------+-----+--------------------------------------------------+
    |       file|          title|chunk|                                              text|
    +-----------+---------------+-----+--------------------------------------------------+
    |shipping.md|Shipping policy|    1|Standard shipping takes 3 to 5 business days. E...|
    |shipping.md|Shipping policy|    2|Standard shipping takes 3 to 5 business days. E...|
    |shipping.md|Shipping policy|    3|Standard shipping takes 3 to 5 business days. E...|
    +-----------+---------------+-----+--------------------------------------------------+
    ```

    What each piece does:

    - `split(value, '\n\s*\n')` cuts the file at blank lines.
    - `filter(array, lambda)` (a higher-order function) drops the heading
      and empty pieces before exploding, so chunk numbers stay
      consecutive.
    - `posexplode` gives each paragraph its position as well as its text.
    - `(?m)` makes `^` and `$` match at line boundaries, so the title
      regex finds the heading line inside the whole file.

    **Gotcha: `trim` strips spaces only**, as "Columns and Expressions:
    Cleaning Values" showed, so the last paragraph keeps its trailing
    newline; `F.trim(col, F.lit(" \t\r\n"))` strips spaces, tabs and line breaks.

