    ## What You'll Learn

    Support tickets arrive as e-mails, invoices as PDFs, policies as
    Markdown files. None of them is a table, but every question you want
    to ask ("which tickets mention an order?", "what did invoice 1001
    total?", "which policy talks about shipping?") is a query over rows.
    This lesson turns documents into rows you can query.

    By the end of this lesson you will be able to:

    - Read documents as bytes with their file metadata, and keep that
      metadata attached to every row you derive
    - Parse e-mails with Python's standard `email` package inside a UDF
      that returns a struct
    - Create UDFs at the right moment so Spark 4.2 runs them through
      Arrow, and write parsers you can test without Spark
    - Split one file into many rows (PDF pages) with a Python UDTF and
      `lateralJoin`, and avoid the left-join trap
    - Split Markdown into paragraphs with built-in functions only, and
      chunk long text for search
    - Combine different kinds of documents into one table with a common
      shape
    - Decide when a built-in function is enough, when you need a UDF or
      UDTF, and when you need a real parser library

