    ## Chunking Long Text

    Paragraphs are a good unit for short policies. For long documents
    (contracts, manuals, transcripts) search and retrieval systems usually
    want chunks of a bounded size, with a small overlap so a sentence cut
    at a boundary still appears whole in one of the chunks. That is
    another one-to-many job for a UDTF:

    ```python
    class Chunks:
        def eval(self, text, size, overlap):
            words = text.split()
            step = size - overlap
            for n, start in enumerate(range(0, max(len(words) - overlap, 1), step), start=1):
                yield n, " ".join(words[start:start + size])

    chunks_udtf = F.udtf(Chunks, returnType="chunk int, text string")

    (spark.read.text("data/messy/docs/shipping.md", wholetext=True)
        .lateralJoin(chunks_udtf(F.col("value").outer(), F.lit(20), F.lit(5)))
        .select("chunk", "text")
        .show(truncate=False))
    ```

    Each chunk has at most 20 words and repeats the last 5 words of the
    one before. Real systems count tokens rather than words and try to
    cut at sentence or heading boundaries, but the shape of the code is
    the same. "Text Analytics Without an LLM" searches over rows like these.

