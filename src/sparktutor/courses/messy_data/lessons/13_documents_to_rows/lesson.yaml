    ## The Same UDTF From SQL

    Register the UDTF to call it from SQL with `LATERAL`:

    ```python
    spark.udtf.register("pdf_pages", pdf_pages_udtf)
    pdfs.createOrReplaceTempView("pdfs")

    spark.sql("""
        SELECT file, p.page, p.text
        FROM pdfs, LATERAL pdf_pages(content) p
        ORDER BY file, page
    """).show(truncate=False)
    ```

    Note that `pdfs` already has `file` as a normal column, so the view
    works (remember the `_metadata` gotcha above).

