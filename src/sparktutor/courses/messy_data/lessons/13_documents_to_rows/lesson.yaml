    ## One File, Many Rows

    A document is a container. Before you can analyze it, decide what one
    row should be:

    | Document | Natural row | Files to rows |
    |----------|-------------|---------------|
    | E-mail (`.eml`) | one message | one to one |
    | PDF | one page | one to many |
    | Markdown or long text | one paragraph or chunk | one to many |

    Whatever the row is, it must carry where it came from: the file name,
    and the page or chunk number inside the file. Without that, a search
    hit or a wrong number cannot be traced back to its source.

    The plan for every document type is the same:

    1. Read the files as bytes with `binaryFile` ("Files as Files: binaryFile, Globs and Metadata"), or as whole
       text files with `text(..., wholetext=True)` ("Text and Logs").
    2. Take the file name from `_metadata` right away.
    3. Parse the bytes into fields with the cheapest tool that works:
       built-in functions first, then a Python UDF (one row in, one value
       out), then a Python UDTF (one row in, many rows out).

