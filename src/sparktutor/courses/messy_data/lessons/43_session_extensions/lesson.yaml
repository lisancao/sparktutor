    ## A Catalyst Expression, by Hand

    Spark's built-in functions are Scala case classes that extend
    `Expression` (`sql/catalyst/.../expressions/Expression.scala`). The
    case class generates `equals`, `hashCode`, `copy`, the `Product`
    methods that tree operations use, and `Serializable`. From Java you
    write each of these yourself. The shape of `is_png`:

    ```java
    public class IsPng extends Expression implements CodegenFallback, Serializable {
      private final Expression child;
      public IsPng(Expression child) { this.child = child; }

      public static boolean check(byte[] b) { ... }          // the actual test

      @Override public Object eval(InternalRow row) {        // interpreted evaluation
        Object v = child.eval(row);
        return v == null ? null : check((byte[]) v);
      }
      @Override public ExprCode doGenCode(CodegenContext ctx, ExprCode ev) {
        return CodegenFallback.super.doGenCode(ctx, ev);
      }
      @Override public DataType dataType() { return DataTypes.BooleanType; }
      @Override public boolean nullable() { return child.nullable(); }
      @Override public Seq<Expression> children() { ... }    // a Scala Seq of one child
      @Override public Expression withNewChildrenInternal(IndexedSeq<Expression> c) { ... }
      // productArity, productElement, canEqual, equals, hashCode
    }
    ```

    Building this lesson hit five traps, each worth knowing by its
    message.

    **1. Scala traits do not always work from Java.** The natural base
    class for one child is `UnaryExpression`. From Java it does not
    compile:

    ```text
    error: IsPng is not abstract and does not override abstract method
    withNewChildrenInternal(IndexedSeq<Expression>) in TreeNode
    ```

    and implementing that method gives `name clash ... have the same
    erasure, yet neither overrides the other`. The method lives in the
    Scala trait `UnaryLike`, with a generic signature that `javac`
    cannot reconcile. Extending `Expression` directly and writing
    `children()` and `withNewChildrenInternal` yourself avoids the
    trait. In the same way, `CodegenFallback` provides `doGenCode` as a
    Java default method, but `Expression` declares it abstract and Java
    lets the class declaration win, so you must override it and call
    `CodegenFallback.super.doGenCode(ctx, ev)` explicitly.

    **2. Expressions travel to executors.** Without `Serializable` the
    first query fails before any task starts:

    ```text
    org.apache.spark.SparkException: Task not serializable
    Caused by: java.io.NotSerializableException: jext.IsPng
    Serialization stack:
        - object not serializable (class: jext.IsPng, value: is_png(null))
    ```

    **3. `nullable` is a promise.** `nullable()` returns
    `child.nullable()`, so for a non-NULL literal Spark generates code
    that never checks for NULL. An `eval` that returns `null` anyway
    (as the exercise's starter does) crashes in generated code:

    ```text
    Caused by: java.lang.NullPointerException
        at org.apache.spark.sql.catalyst.expressions.GeneratedClass$SpecificUnsafeProjection.apply(Unknown Source)
    ```

    **4. Check input types during analysis.** Without
    `checkInputDataTypes`, `is_png('not binary')` passes analysis and
    fails in a task with a `ClassCastException`. With it:

    ```text
    [DATATYPE_MISMATCH.TYPE_CHECK_FAILURE_WITH_HINT] Cannot resolve "is_png(not binary)" due
    to data type mismatch: is_png expects BINARY, got string. SQLSTATE: 42K09
    ```

    **5. An untyped NULL has its own type.** The first version accepted
    only `BinaryType` and rejected `is_png(NULL)` with `... got void`.
    A bare `NULL` literal has `NullType` (shown as `void`); built-in
    functions accept it through implicit casts. `is_png` accepts
    `NullType` explicitly and returns NULL for it.

