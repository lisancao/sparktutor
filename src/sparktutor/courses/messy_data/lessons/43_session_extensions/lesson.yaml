  Output: |
    ## When Is a Rewrite Safe?

    A rule that changes results is a bug that no test of yours will
    catch, because users never see the original. `PngRule` rewrites only
    when every one of these holds:

    - the UDF's `name()` is `is_png` (the function's `__name__` in
      Python; it is a contract between your team and the rule)
    - `udfDeterministic()` is true (a UDF marked `asNondeterministic()`
      may have side effects or randomness the native code lacks)
    - it returns `BOOLEAN` and takes exactly one `BINARY` argument

    And the replacement must match the UDF on **every** input. The
    Python function returns `False` for `None`; the native `is_png`
    returns NULL for NULL, like every SQL function. A plain swap would
    turn `False` into NULL, and `filter(~is_png(content))` would lose
    the NULL rows. The rule therefore emits
    `coalesce(is_png(content), false)`. The exercise checks this with a
    NULL row unioned onto the files.

    Two more properties a rule needs:

    - **It must reach a fixed point.** Optimizer batches run their rules
      repeatedly until the plan stops changing. After the rewrite the
      expression is a `Coalesce`, not a `PythonUDF`, so the rule finds
      nothing the second time. A rule that always produces a "new" plan
      runs until the batch's iteration limit.
    - **It must run before Python extraction.** Rules from
      `injectOptimizerRule` join the operator optimization batches
      (`customOperatorOptimizationRules` in
      `BaseSessionStateBuilder.scala`). In `SparkOptimizer.scala` the
      "Extract Python UDFs" batch, which pulls `PythonUDF`s out into
      `ArrowEvalPython` and `BatchEvalPython` nodes, comes after all of
      them (its comment on `postHocOptimizationBatches` says it runs
      even after those).

    Watch the rule fire with the plan change log:

    ```python
    spark.conf.set("spark.sql.planChangeLog.level", "WARN")
    spark.conf.set("spark.sql.planChangeLog.rules", "jext.PngRule")
    imgs.select(is_png("content").alias("png")).collect()
    ```

    ```text
    === Applying Rule jext.PngRule ===
    !Project [is_png(content#11)#12 AS png#13]                                  Project [coalesce(is_png(content#11), false) AS png#13]
     +- Relation [path#8,modificationTime#9,length#10L,content#11] binaryFile   +- Relation [path#8,modificationTime#9,length#10L,content#11] binaryFile

    Output Information:
    !Project <output=png#13[nullable=true]>   Project <output=png#13[nullable=false]>
    ...
    === Result of Batch Operator Optimization before Inferring Filters ===
    ```

    The log names the batch, and the output information shows a bonus:
    the column became non-nullable, which later rules can use.

