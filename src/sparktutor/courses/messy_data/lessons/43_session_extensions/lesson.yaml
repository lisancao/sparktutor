    ## Summary

    - `SparkSessionExtensions` offers injection points for the parser,
      analyzer, check rules, optimizer, planner, columnar and AQE rules,
      and functions. Load an extension with the static
      `spark.sql.extensions` (or a `SparkSessionExtensionsProvider`
      service file). The API is experimental and unstable: build per
      Spark version.
    - From Java: extend `AbstractFunction1<SparkSessionExtensions,
      BoxedUnit>`, use lambdas for Scala functions, and
      `AbstractPartialFunction` for `transform*` calls.
    - A Java `Expression` must be `Serializable`, implement the tree and
      `Product` methods, keep its `nullable()` promise, check input types
      in `checkInputDataTypes` (accepting `NullType`), and call
      `CodegenFallback.super.doGenCode` explicitly.
    - `CodegenFallback` takes the operator out of whole-stage codegen;
      a `StaticInvoke` of a static method keeps it in.
    - `F.call_function` (3.5) and `F.expr` call native functions from
      Python; a thin wrapper makes them feel built in.
    - Optimizer rules run in the operator batches, before Python UDFs are
      extracted, so they can replace a `PythonUDF` with native code. A
      safe rewrite matches name, determinism and types exactly and keeps
      the UDF's NULL behaviour; `spark.sql.planChangeLog.*` shows it fire.
    - Check rules run on every analyzed plan (eagerly in classic
      sessions) and reject plans by throwing.
    - Benchmark with a new DataFrame per run; a reused one can skip most
      of its work.

    Next: **Spark Connect Plugins**, where the same JVM code has to
    reach a client that has no Py4J gateway: relation, expression and
    command plugins, and custom protobuf messages from Python.
