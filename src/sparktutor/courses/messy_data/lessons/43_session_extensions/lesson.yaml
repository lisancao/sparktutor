    ## The Injection Points

    `SparkSessionExtensions`
    (`sql/core/src/main/scala/org/apache/spark/sql/SparkSessionExtensions.scala`)
    is a holder of builders. Your extension class receives it once for
    each new session and calls `inject*` methods. The ones in 4.2.0, and
    where they act:

    | Method | Builder type (Scala) | Acts in |
    |---|---|---|
    | `injectParser` | `(SparkSession, ParserInterface) => ParserInterface` | parsing SQL text (wrap the previous parser) |
    | `injectResolutionRule`, `injectHintResolutionRule`, `injectPostHocResolutionRule` | `SparkSession => Rule[LogicalPlan]` | the analyzer |
    | `injectCheckRule` | `SparkSession => LogicalPlan => Unit` | after analysis: throw to reject a plan |
    | `injectPlanNormalizationRule` | `SparkSession => Rule[LogicalPlan]` | normalizing plans for cache lookup |
    | `injectOptimizerRule` | `SparkSession => Rule[LogicalPlan]` | the optimizer's operator batches |
    | `injectPreCBORule` | `SparkSession => Rule[LogicalPlan]` | once after operator optimization, before rules that use statistics |
    | `injectPlannerStrategy` | `SparkSession => Strategy` | logical to physical planning |
    | `injectColumnar` | `SparkSession => ColumnarRule` | physical plan, row/columnar transitions |
    | `injectQueryPostPlannerStrategyRule`, `injectQueryStagePrepRule`, `injectRuntimeOptimizerRule`, `injectQueryStageOptimizerRule` | various | adaptive query execution |
    | `injectFunction`, `injectTableFunction` | `(FunctionIdentifier, ExpressionInfo, Seq[Expression] => ...)` | the function registry |

    The class is marked `@DeveloperApi @Experimental @Unstable` and its
    doc says: "We make NO guarantee about the stability regarding binary
    compatibility and source compatibility of methods here." Catalyst
    classes (`Expression`, `LogicalPlan`, `PythonUDF`) are internal too.
    An extension is compiled against one Spark version; test it again
    on every upgrade, as Delta Lake does with one build per Spark minor
    version.

    Three ways to load an extension class:

    - `spark.sql.extensions`: a **static**, comma-separated list of
      classes with a no-argument constructor, applied in order (for
      function name conflicts, the last one wins). It must be set before
      the session starts.
    - `SparkSession.builder.withExtensions(...)`: Scala and Java only.
    - A `META-INF/services/org.apache.spark.sql.SparkSessionExtensionsProvider`
      file listing classes that implement `SparkSessionExtensionsProvider`
      (3.2), found with `ServiceLoader` when a session is created.

