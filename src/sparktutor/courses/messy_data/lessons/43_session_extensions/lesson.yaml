    ## Check Rules

    A check rule receives the analyzed plan and throws to reject it:

    ```java
    ext.injectCheckRule(session -> plan -> {
      plan.foreach(node -> {
        if (node instanceof Aggregate a) {
          a.groupingExpressions().foreach(g -> {
            if (g.resolved() && g.dataType() instanceof BinaryType)
              throw new IllegalArgumentException("Grouping by a BINARY column (" + g.sql()
                  + ") compares whole file contents; group by sha2(" + g.sql() + ", 256) instead");
            return BoxedUnit.UNIT;
          });
        }
        return BoxedUnit.UNIT;
      });
      return BoxedUnit.UNIT;
    });
    ```

    Grouping a `binaryFile` read by `content` hashes and compares whole
    files in the shuffle; a fixed-size hash does the same deduplication
    with a fraction of the shuffle bytes. The rule turns that advice into
    an error:

    ```python
    imgs.groupBy("content").count()
    ```

    ```text
    pyspark.errors.exceptions.captured.IllegalArgumentException: Grouping by a BINARY column
    (content) compares whole file contents; group by sha2(content, 256) instead
    ```

    It fails at the `count()` that builds the DataFrame, before any
    action: classic sessions analyze each new DataFrame eagerly, and
    check rules are part of analysis. That is also a warning: check
    rules see **every** analyzed plan, including every intermediate
    DataFrame. A rule that rejects "a binaryFile read without a limit"
    would reject `spark.read.format("binaryFile").load(...)` itself.
    Check constructs that are wrong anywhere they appear.

    A Java `IllegalArgumentException` reaches Python as PySpark's
    `IllegalArgumentException`. Spark's own error classes (such as
    `DATATYPE_MISMATCH`) need entries in Spark's error registry, which
    an extension cannot add to, so clear standard exceptions are the
    honest choice.

