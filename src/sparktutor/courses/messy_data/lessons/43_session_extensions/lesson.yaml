    Think of Catalyst as a factory line with stations: parse, check,
    resolve, optimize, plan, run. Extensions let you add a worker at a
    station. A check rule is an inspector who stops the line. An
    optimizer rule is a worker who swaps a slow part for a faster one
    that does the same job. A native function is a new tool everyone on
    the line can use.

