    ## Registering and Calling the Function

    `injectFunction` takes a Scala `Tuple3`: the name, an
    `ExpressionInfo` (what `DESCRIBE FUNCTION` shows) and a builder from
    the argument list to an expression:

    ```java
    ext.injectFunction(new Tuple3<>(
        new FunctionIdentifier("is_png"),
        new ExpressionInfo(IsPng.class.getName(), null, "is_png",
            "is_png(bytes) - true if bytes start with the PNG signature", ""),
        (Function1<Seq<Expression>, Expression>) args -> {
          if (args.size() != 1) throw new IllegalArgumentException("is_png takes 1 argument, got " + args.size());
          return new IsPng(args.apply(0));
        }));
    ```

    ```python
    spark.sql("DESCRIBE FUNCTION EXTENDED is_png").show(truncate=False)
    ```

    ```text
    +-----------------------------------------------------------------+
    |function_desc                                                    |
    +-----------------------------------------------------------------+
    |Function: is_png                                                 |
    |Class: jext.IsPng                                                |
    |Usage: is_png(bytes) - true if bytes start with the PNG signature|
    |Extended Usage:\n    No example/argument for is_png.\n           |
    +-----------------------------------------------------------------+
    ```

    The builder runs during analysis, before the arguments are resolved,
    so it can check how many there are but not their types (that is
    `checkInputDataTypes`' job). `is_png(X'00', X'01')` fails with
    `pyspark.errors.exceptions.captured.IllegalArgumentException: is_png
    takes 1 argument, got 2`.

    From Python there is no `F.is_png`. Use the name:

    ```python
    imgs = (spark.read.format("binaryFile").option("recursiveFileLookup", "true")
            .load(os.path.abspath("data/messy/images")))
    imgs.select("path", F.call_function("is_png", "content"))    # 3.5
    imgs.select("path", F.expr("is_png(content)"))
    ```

    `F.call_function` (3.5) is the better one in libraries: it takes
    `Column`s, so no SQL string has to be built. A thin Python wrapper
    is a good way to ship a native function to Python users:

    ```python
    def is_png(col):
        """True if the bytes start with the PNG signature (native, jext)."""
        return F.call_function("is_png", col)
    ```

    `recursiveFileLookup` matters here: `data/messy/images` has
    subfolders (`products/`, `scans/`) and `binaryFile` does not descend
    into folders that are not `key=value` partitions, so without it the
    read returns no rows at all.

