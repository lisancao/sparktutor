    ## The Extension Class in Java

    The setting expects a `Function1[SparkSessionExtensions, Unit]`. In
    Java that is `scala.runtime.AbstractFunction1` with `BoxedUnit` as
    the result type:

    ```java
    public class Extensions extends AbstractFunction1<SparkSessionExtensions, BoxedUnit> {
      @Override public BoxedUnit apply(SparkSessionExtensions ext) {
        ext.injectOptimizerRule(session -> new PngRule());
        ext.injectCheckRule(session -> plan -> { /* ... */ return BoxedUnit.UNIT; });
        return BoxedUnit.UNIT;
      }
    }
    ```

    Scala 2.13 compiles `Function1` to an interface whose only abstract
    method is `apply`, so Java lambdas can stand in for Scala functions
    (`session -> new PngRule()`). A Scala function returning `Unit` is a
    Java function returning `BoxedUnit.UNIT`.

    The session is created as in "A DSv2 Connector in Java", with one
    more static setting:

    ```python
    spark = (SparkSession.builder.master("local[2]")
             .config("spark.jars", jar)
             .config("spark.sql.extensions", "jext.Extensions")
             .getOrCreate())
    ```

    With `spark-submit`, the same is
    `--jars jext.jar --conf spark.sql.extensions=jext.Extensions`. The
    Maven project from the previous lesson builds these sources
    unchanged (only the `artifactId` differs); `spark-sql_2.13` brings
    `spark-catalyst` along as a dependency.

