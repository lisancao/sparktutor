    ## Code Generation: CodegenFallback vs StaticInvoke

    `CodegenFallback` means "generated code should call my `eval`". It
    is correct but has a cost you can see in the plan. Compare
    `is_png` with `is_png_fast`, the same check registered as a
    `StaticInvoke` of `IsPng.check`:

    ```text
    == Physical Plan ==
    Project [is_png(content#3) AS is_png(content)#8]
    +- FileScan binaryFile [content#3] ...
    ```

    ```text
    == Physical Plan ==
    *(1) Project [static_invoke(jext.IsPng.check(content#3)) AS static_invoke(jext.IsPng.check(content))#9]
    +- FileScan binaryFile [content#3] ...
    ```

    The `*(1)` marks an operator inside whole-stage code generation; the
    first `Project` has none. The reason is in
    `sql/core/.../execution/WholeStageCodegenExec.scala`:

    ```scala
    private def supportCodegen(e: Expression): Boolean = e match {
      case e: LeafExpression => true
      // CodegenFallback requires the input to be an InternalRow
      case e: CodegenFallback => false
      case _ => true
    }
    ```

    One `CodegenFallback` expression takes its whole operator out of
    the fused stage. `StaticInvoke`
    (`sql/catalyst/.../expressions/objects/objects.scala`) generates a
    direct call to a static Java method, with NULL propagation handled
    for you (`propagateNull = true`). Many built-ins are written this
    way: `UrlEncode` is a `RuntimeReplaceable` whose `replacement` is a
    `StaticInvoke` of `UrlCodec.encode`. From Java, a function builder
    that returns a `StaticInvoke` is the shortest path to a native
    function with real code generation:

    ```java
    (Function1<Seq<Expression>, Expression>) args -> new StaticInvoke(
        IsPng.class, DataTypes.BooleanType, "check", args,
        CollectionConverters.asScala(List.<AbstractDataType>of(DataTypes.BinaryType)).toSeq(),
        true, true, true, Option.empty())
    ```

    (Java has no default arguments, so all nine constructor parameters
    are spelled out: class, result type, method name, arguments, input
    types, `propagateNull`, `returnNullable`, `isDeterministic`,
    `scalarFunction`.) The display name is less friendly
    (`static_invoke(jext.IsPng.check(...))`); a `RuntimeReplaceable`
    wrapper in Scala gives both a nice name and the `StaticInvoke`.

    One more thing the extended plan shows: your expression can run on
    the **driver**. For `SELECT is_png(content) FROM VALUES (X'00')`,
    the optimized plan is just `LocalRelation [is_png(content)#30]`: the
    optimizer evaluated the expression with `eval` while folding a local
    relation. Expressions must not assume they run in a task.

