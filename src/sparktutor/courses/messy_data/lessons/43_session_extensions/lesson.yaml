    ## A Rule That Replaces a Python UDF

    Messy-data code is full of small Python UDFs that wrap a check like
    this one. Each one costs a round trip to a Python worker per batch
    of rows. If your team already has a native version, an optimizer
    rule can swap it in without anyone changing their code:

    ```python
    @F.udf("boolean")
    def is_png(b):
        return b is not None and bytes(b[:8]) == b"\x89PNG\r\n\x1a\n"

    imgs.filter(is_png("content")).select("path").explain()
    ```

    Without the rule (here with the same UDF under another name, so the
    rule leaves it alone), the plan sends every file's bytes to Python:

    ```text
    *(1) Project [path#0]
    +- *(1) Filter pythonUDF0#6: boolean
       +- ArrowEvalPython [looks_like_png(content#3)#4], [pythonUDF0#6], 101
          +- FileScan binaryFile [path#0,content#3] Batched: false, DataFilters: [], ...
    ```

    (`ArrowEvalPython` with eval type `101` is the Arrow-optimized
    Python UDF, the default for regular Python UDFs in 4.2.0 per the
    PySpark migration guide.) With the rule:

    ```text
    *(1) Project [path#0]
    +- Filter coalesce(is_png(content#3), false)
       +- FileScan binaryFile [path#0,content#3] Batched: false, DataFilters: [coalesce(is_png(content#3), false)], ...
    ```

    No Python node, and the condition is now a plain Catalyst
    expression, so it even appears among the scan's `DataFilters`.

    The rule in Java:

    ```java
    public class PngRule extends Rule<LogicalPlan> {
      @Override public LogicalPlan apply(LogicalPlan plan) {
        return (LogicalPlan) plan.transformAllExpressions(
            new AbstractPartialFunction<Expression, Expression>() {
              @Override public boolean isDefinedAt(Expression e) { return matches(e); }
              @Override public <A1 extends Expression, B1> B1 applyOrElse(A1 e, Function1<A1, B1> otherwise) {
                if (!matches(e)) return otherwise.apply(e);
                return (B1) replacement((PythonUDF) e);
              }
            });
      }
    }
    ```

    `transformAllExpressions` takes a Scala `PartialFunction`; from Java
    that is `scala.runtime.AbstractPartialFunction` with `isDefinedAt`
    and `applyOrElse`. `PythonUDF`
    (`sql/catalyst/.../expressions/PythonUDF.scala`) is a case class
    with `name`, `func`, `dataType`, `children`, `evalType`,
    `udfDeterministic` and `resultId`.

