    ## What You'll Learn

    "How Catalyst Plans Python" showed how a query moves through the
    analyzer and the optimizer, and how a Python UDF becomes an
    `ArrowEvalPython` or `BatchEvalPython` node that ships rows to a
    Python worker. "A DSv2 Connector in Java" plugged a data source into
    Spark from Java. This lesson plugs into Catalyst itself, through
    `SparkSessionExtensions`, with three pieces of Java:

    - a **native function**, `is_png(bytes)`, written as a Catalyst
      `Expression`, plus a second version built on `StaticInvoke` that
      takes part in whole-stage code generation
    - an **optimizer rule** that finds a Python UDF called `is_png` and
      replaces it with the native expression, so the query no longer
      needs a Python worker, without changing a single result (NULLs
      included)
    - a **check rule** that rejects a messy-data mistake (grouping by a
      whole file's bytes) at analysis time

    By the end of this lesson you will be able to:

    - Write an extension class and load it with `spark.sql.extensions`
    - Implement a Catalyst `Expression` from Java, and know the five
      traps that a Scala case class would have hidden (Scala traits,
      `Serializable`, `nullable`, input type checks, `NullType`)
    - Register it with `injectFunction` and call it from SQL, `F.expr`
      and `F.call_function`
    - Explain why `CodegenFallback` takes an operator out of whole-stage
      code generation and how `StaticInvoke` keeps it in
    - Write a `Rule[LogicalPlan]` in Java, watch it fire with
      `spark.sql.planChangeLog.*`, and decide when a rewrite is safe
    - Measure a native function against Python UDFs without fooling
      yourself

