    ## How Much Faster? Measuring Honestly

    The benchmark: 2,000,000 cached binary values (a third of them
    start with the PNG signature), `local[2]`, Java 17, on the 16-core
    machine used for this lesson. Each query counts the matches; each
    time is the best of three runs after a warm-up, and the ratio is
    against `is_png_fast`:

    | Version | Best time | Ratio |
    |---|---|---|
    | `is_png_fast` (StaticInvoke, codegen) | 0.071 s | 1.0 |
    | Python UDF `is_png`, rewritten by `PngRule` | 0.077 s | 1.1 |
    | `is_png` (CodegenFallback) | 0.093 s | 1.3 |
    | built-in `substring(b, 1, 8) = X'89504E47...'` | 0.104 s | 1.5 |
    | pandas UDF | 0.319 s | 4.5 |
    | Python UDF (Arrow, the 4.2.0 default) | 0.616 s | 8.7 |

    Read it carefully. The rewritten UDF runs at native speed because it
    **is** the native expression; the Python worker never starts. The
    Python UDF costs about nine times the native check here, the pandas
    UDF about four and a half. On a real folder the files' I/O usually
    dominates and the ratios shrink, so measure your own job before
    promising a speed-up. Note also that the built-in `substring`
    comparison was not the fastest: a static Java method can beat a
    composition of built-ins.

    **The benchmarking trap.** The first version of this benchmark ran
    the same DataFrame object three times, and every Python UDF took
    about 20 ms for 2 million rows. That was not Python being fast:
    re-running a DataFrame reuses its physical plan, and the shuffle
    files of its earlier run, so only the final aggregation step ran
    again. Build a **new** DataFrame for each timed run, and sanity-check
    that a timing is physically possible before you believe it.

