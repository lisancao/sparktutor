    ## Encodings: When Text Is Not UTF-8

    `data/messy/docs/notes_latin1.txt` was saved in Latin-1 (ISO-8859-1),
    an encoding still common in older systems and Windows exports. Read it
    with the text source and the accented letters are broken:

    ```python
    spark.read.text("data/messy/docs/notes_latin1.txt").first()[0]
    # 'Caf� cr�me, r�sum�: d�j� vu.'
    ```

    The `text` source **always decodes UTF-8**. It has an `encoding`
    option, but in 4.2.0 that option only changes how a custom `lineSep`
    is turned into bytes; the content is still read as UTF-8 (the result
    above is identical with `option("encoding", "ISO-8859-1")`). The
    `csv` and `json` sources do honour `encoding`; `text` does not.

    The reliable fix is to read bytes and decode them yourself:

    ```python
    (spark.read.format("binaryFile").load("data/messy/docs/notes_latin1.txt")
        .select(F.decode("content", "ISO-8859-1").alias("text")))
    # 'Café crème, résumé: déjà vu.\n'
    ```

    To find files that are not valid UTF-8, `F.is_valid_utf8(col)` (4.0)
    returns false for them, and `F.make_valid_utf8(col)` (4.0) replaces
    bad bytes with the replacement character U+FFFD.

- Class: text
  Depth: intermediate
  Output: |
    ## Spark Connect and Invalid UTF-8

    With classic PySpark, collecting that badly decoded string gives you
    replacement characters, as shown above. On a **Spark Connect**
    session, the same `first()` raises in the client:

    ```
    UnicodeDecodeError: 'utf-8' codec can't decode byte 0xe9 in
    position 3: invalid continuation byte
    ```

    The string column really holds the invalid bytes, and the Connect
    client decodes results strictly. Display (`show()`) still works,
    because the server formats it. So on Connect, fix the text on the
    server before collecting: decode from bytes as above, or apply
    `make_valid_utf8` first.

