    ## Timestamps: Patterns, Failures and Time Zones

    `01/Oct/2026:10:00:00 +0000` is not a format Spark can guess, so give
    it the pattern:

    ```python
    ts = F.try_to_timestamp(F.col("raw_ts"), F.lit("dd/MMM/yyyy:HH:mm:ss Z"))
    ```

    Pattern letters follow Spark's datetime patterns (`dd` day, `MMM`
    short month name such as `Oct`, `yyyy` year, `HH` 24-hour clock, `Z`
    an offset like `+0000`, `X` an offset that may be the letter `Z`,
    `SSS` milliseconds). The application log uses
    `yyyy-MM-dd HH:mm:ss,SSS`, and its JSON half uses
    `yyyy-MM-dd'T'HH:mm:ssX` (quote literal letters such as `T`).

    **`to_timestamp` versus `try_to_timestamp`.** Since Spark 4.0, ANSI
    mode is on by default, and `to_timestamp` fails the whole query on the
    first value it cannot parse:

    ```
    [CANNOT_PARSE_TIMESTAMP] Text '31/Sep/2026:11:00:00 +0000' could not
    be parsed: Invalid date 'SEPTEMBER 31'. Use `try_to_timestamp` to
    tolerate invalid input string and return NULL instead.
    ```

    `try_to_timestamp` (3.5) returns `NULL` instead, which is what you
    want while parsing: count the NULLs, quarantine those lines, keep
    going.

    **Time zones.** A Spark `TIMESTAMP` is an instant; how it is shown,
    and how text without an offset is read, depends on
    `spark.sql.session.timeZone`. The access log carries `+0000`, so
    10:00 UTC is stored correctly, but on a laptop in Toronto it is
    displayed as `06:00:00`. The application log's text half has no
    offset at all, so `10:00:00,123` means 10:00 in the session time zone.
    Set the session time zone explicitly (the exercises use `UTC`) and
    know which of your logs carry an offset.

