    ## Multi-Line Records: Stack Traces

    When the application fails, it writes one event over three lines:

    ```
    2026-10-01 10:02:00,123 ERROR [worker-2] order.Service - processed order=2 ms=769
    java.lang.IllegalStateException: inventory negative for sku=P3
    	at order.Inventory.reserve(Inventory.java:88)
    	at order.Service.process(Service.java:41)
    ```

    In line mode those become four unrelated rows, and the stack trace
    loses its event. Lines from one file can also land in different
    tasks, so "attach this line to the previous one" is not something you
    can do reliably row by row.

    The fix for files of a sensible size: read each file whole, then split
    it where a **new event starts**, using a regex lookahead that matches
    the newline but keeps the next line's start:

    ```python
    EVENT_START = r"\n(?=\d{4}-\d{2}-\d{2} |\{)"

    recs = (spark.read.text("data/messy/logs/app.log", wholetext=True)
        .select(F.explode(F.split("value", EVENT_START)).alias("rec")))
    recs.count()   # 80 events from 134 lines
    ```

    `(?=...)` means "followed by", without consuming it: a newline
    followed by a date or by `{` ends an event. Continuation lines (the
    exception and its `at ...` frames) never start that way, so they stay
    with their event. Then pull the pieces out of each record:

    ```python
    recs.select(
        F.regexp_extract("rec", r"\n([\w.$]+(?:Exception|Error)):", 1).alias("exception"),
        F.regexp_extract_all("rec", F.lit(r"\tat ([\w.$]+)\("), F.lit(1)).alias("frames"))
    ```

    ```
    +-------------------------------+------------------------------------------------+
    |exception                      |frames                                          |
    +-------------------------------+------------------------------------------------+
    |java.lang.IllegalStateException|[order.Inventory.reserve, order.Service.process]|
    ```

