    ## A Python Gotcha: Patterns Must Be Columns Sometimes

    In PySpark, `regexp_extract(str, pattern, idx)` takes the pattern as a
    plain Python string. Several newer functions, including
    `regexp_extract_all`, `regexp_substr` and `regexp_count` (all 3.5 in
    Python), take it as a **column**, and a plain string passed to a
    column argument means "the column with this name":

    ```python
    F.regexp_extract_all("rec", r"\tat ([\w.$]+)\(", 1)
    # AnalysisException: [UNRESOLVED_COLUMN.WITH_SUGGESTION] A column,
    # variable, or function parameter with name `\tat ([\w`.`$]+)\(`
    # cannot be resolved.

    F.regexp_extract_all("rec", F.lit(r"\tat ([\w.$]+)\("), 1)   # works
    ```

    When an error message names a "column" that is obviously your
    pattern, wrap the pattern in `F.lit(...)`.

