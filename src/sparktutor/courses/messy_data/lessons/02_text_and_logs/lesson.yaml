    ## Summary

    In this lesson you learned:

    - **The `text` source** gives one row per line (split in parallel)
      or, with `wholetext`, one row per file. In PySpark, pass
      `wholetext=True` to `text()` or use `format("text").option(...)`:
      `option("wholetext", True).text(path)` is silently overridden.
    - **Regular expressions**: `regexp_extract` returns `""` on no match,
      `regexp_extract_all` returns `[]`, `regexp_substr` returns `NULL`,
      and `rlike` tells you whether a line matched. Newer functions take
      the pattern as a column, so wrap it in `F.lit`.
    - **Timestamps**: explicit patterns, `try_to_timestamp` instead of
      `to_timestamp` (which fails the query under ANSI mode), and an
      explicit `spark.sql.session.timeZone`.
    - **URLs**: `split_part` and `try_parse_url`.
    - **Multi-line records**: read whole files and split on a lookahead
      at each event start; keep files small or log JSON lines.
    - **Mixed formats**: detect per record and parse with `F.when`, using
      `try_parse_json` and `try_variant_get` for the JSON part.
    - **Quarantine**: keep rejected lines with their file, and check that
      parsed plus rejected equals the input.
    - **Encodings**: `text` always decodes UTF-8; read other encodings as
      bytes and `decode` them. On Spark Connect, collecting invalid UTF-8
      raises `UnicodeDecodeError`.

    Next: **JSON Drift and Quarantine**, where the records are already
    structured, but their structure keeps changing.
