    ## Mixed Formats: Text, Then JSON

    Half way through the day the team switched to JSON logs:

    ```
    {"ts": "2026-10-01T11:00:00Z", "level": "INFO", "logger": "order.Service", "msg": "processed", "order": 100, "ms": 91}
    ```

    Both kinds of record now live in one file. Detect the format per
    record, and parse each kind its own way with `F.when`:

    ```python
    is_json = F.col("rec").startswith("{")
    j = F.try_parse_json("rec")

    events = recs.select(
        F.when(is_json, F.try_variant_get(j, "$.level", "string"))
         .otherwise(F.regexp_extract("rec", r"^\S+ \S+ (\w+)", 1)).alias("level"),
        F.when(is_json, F.try_variant_get(j, "$.ms", "int"))
         .otherwise(F.regexp_extract("rec", r"ms=(\d+)", 1).try_cast("int")).alias("ms"))
    ```

    `try_parse_json` (4.0) turns a string into a `VARIANT`, or `NULL` if
    it is not valid JSON, and `try_variant_get` (4.0) reads one field as
    a type, or `NULL` if it is missing or of another type. You will meet
    both again in the VARIANT lesson. For now they are a convenient way to
    read a few fields from JSON without declaring a schema.

    The result, grouped by format and level:

    ```
    +----+-----+---+------+
    | fmt|level|  n|avg_ms|
    +----+-----+---+------+
    |json| INFO| 20| 415.0|
    |text|ERROR| 18| 535.0|
    |text| INFO| 26| 410.0|
    |text| WARN| 16| 477.0|
    +----+-----+---+------+
    ```

    The JSON half has no WARN or ERROR events at all. That may be true,
    or the new logger may write errors somewhere else: exactly the kind of
    question a format change should make you ask.

