    ## Beyond Parsing: Sessions From Access Logs

    Once timestamps are typed, time-based analysis is plain Spark. One
    example: `session_window` (3.2) groups events into sessions that close
    after a gap of inactivity, per key:

    ```python
    (parsed.groupBy("ip", F.session_window("ts", "30 seconds"))
        .count()
        .orderBy(F.desc("count")))
    ```

    Each output row has a `session_window` struct with `start` and `end`.
    Unlike fixed `window(...)` buckets, sessions have different lengths:
    a session ends 30 seconds after the last event from that IP. The same
    function works on streaming DataFrames with a watermark, which is how
    sessionization is usually done in production.

