    ## Whole Files: wholetext, and Its Trap

    Some text only makes sense as a whole: a Markdown document, a JSON
    file pretty-printed over many lines, a log where one event spans
    several lines. `wholetext` reads **each file as one row**:

    ```python
    docs = spark.read.text("data/messy/docs", wholetext=True)
    docs.count()   # 5, one per file (line mode gives 29)
    ```

    Now the trap. These two lines look equivalent and are not:

    ```python
    spark.read.option("wholetext", True).text("data/messy/logs/app.log").count()  # 134
    spark.read.text("data/messy/logs/app.log", wholetext=True).count()            # 1
    ```

    PySpark's `text()` method has a keyword argument `wholetext` whose
    default is `False`, and it always sets that option, so it silently
    replaces the `option("wholetext", True)` you set earlier. Both classic
    PySpark and Spark Connect in 4.2.0 behave this way. Either pass the
    keyword, or use the generic form, which has no such default:

    ```python
    spark.read.format("text").option("wholetext", True).load(path)   # 1 row
    ```

    `lineSep` does not have this problem (its keyword default is `None`,
    which `text()` skips), but the habit of using `format("text")` with
    options, or keywords only, avoids the question.

    Whole-file mode puts an entire file in one string and one task, so
    keep it for files of a few megabytes at most.

