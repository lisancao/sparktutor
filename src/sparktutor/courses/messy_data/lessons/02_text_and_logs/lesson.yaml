    ## The text Source: One Line, One Row

    ```python
    lines = spark.read.text("data/messy/logs/app.log")
    lines.printSchema()
    lines.count()   # 134
    ```

    ```
    root
     |-- value: string (nullable = true)
    ```

    Each line becomes a row with a single string column, `value`, and the
    line ending is removed. The source splits on `\n`, `\r\n` or `\r` by
    default; set `lineSep` for anything else. Large files are split into
    byte ranges and read by several tasks in parallel, which is why line
    mode scales to huge logs.

    Like every file source, `text` accepts folders, globs,
    `pathGlobFilter`, `recursiveFileLookup` and the hidden `_metadata`
    column from the last lesson. It also decompresses files by extension:
    `app.log.gz` is read as text without any option (a gzip file cannot be
    split, so one task reads it).

- Class: text
  Depth: beginner
  Output: |
    A log line is a sentence written by a program, for a person. Parsing
    it means teaching Spark to read that sentence: "the part in square
    brackets is the time, the three digits after the quote are the status
    code". Regular expressions are the tool for describing those patterns.
    If regular expressions are new to you, read each pattern in this
    lesson piece by piece: `\S+` means "one or more characters that are
    not spaces", `\d{3}` means "exactly three digits", and parentheses mark
    the part you want to keep.

