    ## Splitting URLs

    The request path `/api/orders/42?session=s9` mixes a path and a query
    string. Two helpers take it apart:

    ```python
    F.split_part("url", F.lit("?"), F.lit(1))                     # /api/orders/42
    F.try_parse_url("url", F.lit("QUERY"), F.lit("session"))      # s9
    ```

    - `split_part(str, delimiter, n)` (3.5) returns the n-th piece
      (counting from 1), or an empty string if there are fewer pieces. The
      delimiter is plain text, not a regular expression, so `?` needs no
      escaping.
    - `parse_url(url, part, key)` (3.5 in Python) extracts `HOST`, `PATH`,
      `QUERY` and other parts, or one query parameter when you pass a
      key. It accepts a path without a host, as here. On a malformed URL
      it fails with `INVALID_URL`; `try_parse_url` (4.0) returns `NULL`
      instead.

