    ## Regular Expressions in Spark

    An access log line looks like this:

    ```
    10.0.2.238 - - [01/Oct/2026:10:00:00 +0000] "GET /?session=s1 HTTP/1.1" 404 7708 "-" "Mozilla/5.0"
    ```

    One pattern with a capture group per field describes it:

    ```python
    ACCESS_RE = r'^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) (\S+) (\S+)" (\d{3}) (\d+)'

    parsed = lines.select(
        F.regexp_extract("value", ACCESS_RE, 1).alias("ip"),
        F.regexp_extract("value", ACCESS_RE, 2).alias("raw_ts"),
        F.regexp_extract("value", ACCESS_RE, 4).alias("url"),
        F.regexp_extract("value", ACCESS_RE, 6).cast("int").alias("status"),
    )
    ```

    Spark uses Java regular expressions. Write patterns as Python raw
    strings (`r'...'`) so backslashes reach Spark untouched.

    Know what each function returns when the pattern does **not** match,
    because that is where bad lines hide:

    | Function | No match | Use it for |
    |----------|----------|------------|
    | `regexp_extract(col, pattern, i)` | `""` (empty string) | one capture group |
    | `regexp_extract_all(col, pattern, i)` | `[]` | every match of a group |
    | `regexp_substr(col, pattern)` | `NULL` | the first whole match |
    | `col.rlike(pattern)` | `false` | does the line match at all? |

    The empty string from `regexp_extract` is easy to miss: casting `""`
    to `int` gives `NULL`, so a broken line turns into a row of NULLs and
    empty strings instead of an error. Test `rlike` explicitly when you
    need to know which lines did not parse.

