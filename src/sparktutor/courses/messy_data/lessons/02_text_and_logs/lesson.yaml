    ## When Files Are Too Big for wholetext

    The split-the-whole-file approach needs each file to fit comfortably
    in one task's memory. Options for bigger logs:

    - **Fix it at the source**: log as JSON lines with the stack trace in
      one field. One event per line is the single best change a team can
      make for log analysis.
    - **Rotate smaller files**, so each file stays small enough.
    - **Group in line mode**: keep `_metadata.file_name` and
      `_metadata.file_block_start` plus a running counter of event starts
      within each file (a window `sum` over a flag), then `groupBy` the
      counter. This works only when an event never crosses the boundary
      between two input splits, which you cannot guarantee for plain text
      files larger than `spark.sql.files.maxPartitionBytes`.
    - **A custom reader** that keeps events whole across splits, such as a
      Python data source (lesson 9).

