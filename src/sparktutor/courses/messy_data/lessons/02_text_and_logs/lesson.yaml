    ## What You'll Learn

    Logs are the most common messy data there is. Every service writes
    them, nobody designs them for analysis, and their format changes
    whenever someone upgrades a logging library. In the last lesson you
    treated files as bytes. Now the bytes are text, and the job is to turn
    lines into typed records.

    By the end of this lesson you will be able to:

    - Read text one line per row or one file per row, and avoid the
      `wholetext` trap in the PySpark `text()` method
    - Pull fields out of lines with `regexp_extract`, `regexp_extract_all`
      (3.5 in Python) and `rlike`, knowing what each returns when nothing
      matches
    - Parse timestamps with explicit patterns and time zones, using
      `try_to_timestamp` (3.5) so one bad line does not fail the job
    - Split URLs with `split_part` (3.5) and `try_parse_url` (4.0)
    - Rebuild multi-line records such as stack traces
    - Handle a log whose format changes from plain text to JSON lines
    - Read files that are not UTF-8, and know what goes wrong when you
      don't

    The sample files are `data/messy/logs/access.log` (a web server log in
    the Apache combined format) and `data/messy/logs/app.log` (an
    application log with stack traces that switches to JSON half way
    through the day).

