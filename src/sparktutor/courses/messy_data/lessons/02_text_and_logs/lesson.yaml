    ## Quarantine, Don't Drop

    A parser that silently loses lines is worse than one that fails. The
    pattern used throughout this course:

    1. Compute every field with tolerant functions (`regexp_extract`,
       `try_to_timestamp`, `try_cast`) plus an explicit "did it parse?"
       flag such as `rlike(pattern) AND ts IS NOT NULL`.
    2. Split into two DataFrames: `parsed` where the flag is true, and
       `rejects` with the raw line and the file it came from.
    3. Check the books: `parsed.count() + rejects.count()` must equal the
       number of input lines.

    ```python
    good = F.col("value").rlike(ACCESS_RE) & F.col("ts").isNotNull()
    parsed = candidates.filter(good)
    rejects = candidates.filter(~good).select("value", "file")
    ```

    Write `rejects` somewhere people will look at it. A sudden jump in
    rejects is often the first sign that a format changed upstream.

