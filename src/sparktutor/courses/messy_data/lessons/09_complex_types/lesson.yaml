    ## Sorting Arrays of Structs

    Four orders have their `status_history` out of time order. Two ways
    to put it right:

    **A comparator.** `array_sort(arr, (l, r) -> ...)` takes a function
    that returns a negative number, 0 or a positive number (the
    comparator form is in Python since 3.4):

    ```python
    by_time = F.array_sort(
        "status_history",
        lambda a, b: F.when(a.at < b.at, -1).when(a.at > b.at, 1).otherwise(0))
    ```

    For O-1002, `[paid, placed]` becomes `[placed, paid]`.
    `F.element_at(by_time, -1).status` is then the latest status.

    **Struct ordering.** `sort_array` on structs sorts by the first
    field, then the second. Put the sort key first:

    ```sql
    transform(sort_array(transform(status_history, h -> struct(h.at, h.status))),
              x -> x.status)
    ```

    The same idea finds the latest entry without sorting at all:
    `array_max(transform(status_history, h -> struct(h.at, h.status))).status`
    takes the largest `(at, status)` pair. For aggregations across rows
    rather than within an array, `max_by(status, at)` does the same
    job, and 4.2 added a `k` argument that returns the top `k` as an
    array: `max_by(status, at, 2)` gives the statuses of the two latest
    rows, latest first (optional background: `learning_spark` lesson 4).

