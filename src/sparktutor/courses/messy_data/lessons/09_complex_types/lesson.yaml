    ## Flattening a Nested Schema

    Many tools downstream (a CSV export, a spreadsheet, some BI tools,
    a relational database) want flat columns. Writing
    `customer.address.geo.lat AS customer_address_geo_lat` by hand for
    every field is tedious and breaks when the schema changes. Instead,
    walk the schema: `df.schema` is a `StructType` whose `fields` each
    have a `name` and a `dataType`, and a struct column's `dataType` is
    itself a `StructType`.

    One level deep, the idea looks like this:

    ```python
    from pyspark.sql.types import StructType

    cols = []
    for field in orders.schema.fields:
        if isinstance(field.dataType, StructType):
            for sub in field.dataType.fields:
                cols.append(F.col(f"`{field.name}`.`{sub.name}`").alias(f"{field.name}_{sub.name}"))
        else:
            cols.append(F.col(f"`{field.name}`"))
    ```

    Make it recursive (a function that takes a schema and the path so
    far) and it reaches every depth; the exercise asks you to. On the
    orders, the result has `customer_id`, `customer_name`,
    `customer_email`, `customer_address_city`, `customer_address_country`,
    `customer_address_geo_lat`, `customer_address_geo_lon`, and the
    array columns untouched.

    The limits are real, and worth stating in your code:

    - **Arrays and maps do not flatten into columns.** An order has any
      number of lines, so there is no fixed set of columns to make. You
      either explode (one row per element) or keep the array, as the
      exercise does.
    - **Names can collide.** A struct `a` with a field `b` and a
      top-level column `a_b` both flatten to `a_b`; Spark allows the
      duplicate names in `select`, then fails with
      `[AMBIGUOUS_REFERENCE] Reference `a_b` is ambiguous` when you use
      one. Check for duplicates after flattening.
    - **Quote every part with backticks**, or a field called `x.y` is
      read as a path. With backticks, a struct `geo.v1` with a field
      `x.y` flattens to a column called `geo.v1_x.y`.

