    ## Editing Structs: withField and dropFields

    Changing one field deep inside a struct used to mean rebuilding the
    whole struct by hand. Since Spark 3.1, two `Column` methods do it
    for you, and they take dotted paths:

    ```python
    fixed = orders.withColumn(
        "customer",
        F.col("customer")
         .dropFields("email", "address.geo")                       # remove
         .withField("address.country", F.upper("customer.address.country")))  # replace
    ```

    ```
     |-- customer: struct (nullable = true)
     |    |-- id: string (nullable = true)
     |    |-- name: string (nullable = true)
     |    |-- address: struct (nullable = true)
     |    |    |-- city: string (nullable = true)
     |    |    |-- country: string (nullable = true)
    ```

    `withField` replaces a field that exists and appends one that does
    not (`withField("vip", F.lit(True))` adds `vip` at the end). The
    rules at the edges:

    - **A NULL struct stays NULL.** `withField("lat", F.lit(1.0))` on
      O-1011's missing `geo` gives NULL, not `{1.0, NULL}`. If you need
      the struct to exist, build it with `F.struct` or
      `F.coalesce(col, F.struct(...))`.
    - **You cannot drop every field.** Dropping both `lat` and `lon`
      from `geo` fails with
      `DATATYPE_MISMATCH.CANNOT_DROP_ALL_FIELDS` ("Cannot drop all
      fields in struct"). Drop the struct itself instead.
    - **They work on structs, not on arrays of structs.**
      `F.col("lines").withField("qty", ...)` fails with
      `DATATYPE_MISMATCH.UNEXPECTED_INPUT_TYPE` ("The first parameter
      requires the "STRUCT" type, however "lines" has the type
      "ARRAY<STRUCT<...>>""). Edit each element with `transform`:

      ```python
      F.transform("lines", lambda l: l.withField("qty", F.coalesce(l.qty, F.lit(0))))
      ```

    - **They are DataFrame methods only.** SQL has no `withField`; in
      SQL you rebuild the struct with `named_struct`.

    Dropping a personal field such as `email` with `dropFields` before
    data leaves the raw layer is a common use; the exercise does it.

