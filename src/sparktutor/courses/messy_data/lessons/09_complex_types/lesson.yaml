    ## Higher-Order Functions in Python and SQL

    A higher-order function takes a function (a **lambda**) and applies
    it to each element of an array, keeping one row per input row.
    Python and SQL write the lambda differently and build the same
    expression:

    ```python
    clean = F.array_sort(F.array_distinct(
        F.filter(F.transform("tags", lambda t: F.lower(F.trim(t))),
                 lambda t: t.isNotNull())))
    orders.select("order_id", "tags", clean.alias("clean"))
    ```

    ```sql
    SELECT order_id, tags,
           array_sort(array_distinct(
               filter(transform(tags, t -> lower(trim(t))), t -> t IS NOT NULL))) AS clean
    FROM orders
    ```

    ```
    +--------+-------------------------------+---------------+
    |order_id|tags                           |clean          |
    +--------+-------------------------------+---------------+
    |O-1001  |[fragile, Gift]                |[fragile, gift]|
    |O-1002  |[gift]                         |[gift]         |
    |O-1003  |[Gift, gift,  GIFT, NULL, rush]|[gift, rush]   |
    |O-1004  |NULL                           |NULL           |
    |O-1005  |[]                             |[]             |
    |O-1006  |[ rush , gift]                 |[gift, rush]   |
    +--------+-------------------------------+---------------+
    ```

    Read it inside out: `transform` cleans each tag, `filter` drops the
    NULL, `array_distinct` merges the duplicates that cleaning created,
    and `array_sort` makes the result stable. Note O-1004: a NULL array
    stays NULL through every step. Wrap the input in
    `F.coalesce("tags", F.array())` when you want `[]` instead
    (`F.array()` with no arguments takes the element type from the other
    side of the `coalesce`).

    In SQL, a lambda is `x -> expr`, or `(x, i) -> expr` for two
    arguments. `transform` and `filter` accept an optional second
    argument, the 0-based index: `transform(array('a','b'), (x, i) ->
    concat(i, ':', x))` is `[0:a, 1:b]`. In Python, write
    `lambda x, i: ...`.

    The SQL forms of `transform`, `filter`, `exists` and `aggregate`
    date from Spark 2.4; the Python functions arrived in 3.1.

