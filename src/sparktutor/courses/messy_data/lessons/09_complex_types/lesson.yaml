    ## to_json and from_json With Nested Values

    `to_json` turns any struct, array or map into JSON text, and
    `from_json` with the same type turns it back:

    ```python
    orders.select(F.to_json("customer")).first()[0]
    # {"id":"C2","name":"Linh Tran","email":"user0@example.com",
    #  "address":{"city":"Toronto","country":"ca","geo":{"lat":47.8056,"lon":10.9042}}}

    t = orders.schema["customer"].dataType
    orders.select("customer", F.from_json(F.to_json("customer"), t).alias("c2")) \
          .filter("customer <=> c2").count()        # 24 of 24: a lossless round trip
    ```

    Details worth knowing:

    - **NULL fields are left out.** `to_json(named_struct('a', 1, 'b',
      NULL))` is `{"a":1}`. Pass `{"ignoreNullFields": "false"}` as
      options to get `{"a":1,"b":null}`.
    - **A NULL array gives NULL**, not `"null"`; `[]` gives `"[]"`.
    - **Timestamps are written in the session time zone** with an
      offset: `{"placed_at":"2026-10-05T08:00:00.000Z"}` with
      `spark.sql.session.timeZone` set to `UTC`.
    - **Maps become JSON objects**: `{"engraving":"Happy 30th"}`.

    `schema_of_json` on one sample is how you got a DDL string in "JSON
    Drift and Quarantine". On nested data it has a quiet failure mode.
    The first order's lines only have an `engraving` attribute, so:

    ```
    lines: ARRAY<STRUCT<attrs: STRUCT<engraving: STRING>, ...>>
    ```

    Parse the file with that DDL and O-1002's `color` and `size` are
    gone, without an error: `{Happy 30th}` instead of
    `{color -> red, size -> S, engraving -> Happy 30th}`. A schema
    inferred from one record knows only that record's keys. Use it as a
    starting point, then fix the parts with open-ended keys by hand (a
    `MAP`).

