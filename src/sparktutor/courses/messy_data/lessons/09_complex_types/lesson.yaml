    ## Building Structs

    `F.struct` groups columns into a struct. Field names come from the
    columns: a path keeps its last part, an alias wins, and an
    expression without a name gets `col1`, `col2`, ... by position:

    ```python
    orders.select(F.struct("order_id", F.col("customer.id"), F.lit(1)).alias("s")).printSchema()
    ```

    ```
     |-- s: struct (nullable = false)
     |    |-- order_id: string (nullable = true)
     |    |-- id: string (nullable = true)
     |    |-- col3: integer (nullable = false)
    ```

    In SQL, `struct(order_id, customer.id)` names fields the same way,
    and `named_struct('a', 1, 'b', 'x')` takes explicit names (it is also
    `F.named_struct` in Python since 3.5). A struct built this way is
    never NULL itself (`nullable = false`), even when every field is.

    Structs compare field by field, in order: `struct(1, 'b') >
    struct(1, 'a')` is true. That is what makes structs useful for
    sorting and for "the latest X" tricks later in this lesson, and why
    you can `groupBy("customer.address")` and `orderBy` a struct column.

