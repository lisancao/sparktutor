    ## Maps: Objects Whose Keys Change

    A struct is right when every record has the same fields. `attrs` is
    the opposite: each line has a few keys out of an open-ended set
    (`color`, `size`, `engraving`, `gift_wrap`, `warranty_years`, and
    whatever the shop adds next month). Declared as
    `MAP<STRING, STRING>`, it keeps exactly the keys each line has:

    ```
    +--------+-------------------------------------------------------------------------------------------+
    |order_id|attrs                                                                                      |
    +--------+-------------------------------------------------------------------------------------------+
    |O-1001  |[{engraving -> Happy 30th}, {}]                                                            |
    |O-1002  |[{color -> red, size -> S, engraving -> Happy 30th}]                                       |
    |O-1003  |[{warranty_years -> 2}]                                                                    |
    |O-1004  |[{size -> S, engraving -> Happy 30th}, {color -> red, engraving -> L.T., gift_wrap -> yes}]|
    +--------+-------------------------------------------------------------------------------------------+
    ```

    Inference never gives you this (it always makes a struct), so a map
    needs an explicit schema, or `from_json(col, 'MAP<STRING, STRING>')`
    on a string. Declaring the values as `STRING` is the forgiving
    choice: a number, a boolean, even a nested object is kept as its
    text (`{"x": 1, "y": true, "z": {"a": 1}}` reads as
    `{x -> 1, y -> true, z -> {"a":1}}`). Declare `MAP<STRING, INT>`
    and a single string value makes the whole map NULL.

    Profiling the keys is two explodes and a group by (an exploded map
    gives `key` and `value`):

    ```sql
    SELECT k, count(*) AS n
    FROM orders
    LATERAL VIEW explode(lines) l AS line
    LATERAL VIEW explode(map_keys(line.attrs)) m AS k
    GROUP BY k ORDER BY k
    ```

    ```
    +--------------+---+
    |k             |n  |
    +--------------+---+
    |color         |16 |
    |engraving     |17 |
    |gift_wrap     |6  |
    |size          |14 |
    |warranty_years|12 |
    +--------------+---+
    ```

    Reading and reshaping maps:

    | Expression | Result |
    |------------|--------|
    | `element_at(m, 'z')`, `m['z']` | value, or NULL for a missing key (no ANSI error for maps) |
    | `map_contains_key(m, 'a')` (3.3) | true or false |
    | `map_keys(m)`, `map_values(m)`, `map_entries(m)` | arrays |
    | `map_filter(map('a',1,'b',2), (k, v) -> v > 1)` | `{b -> 2}` |
    | `transform_values(map('a',1), (k, v) -> v * 10)` | `{a -> 10}` |
    | `transform_keys(map('a',1), (k, v) -> upper(k))` | `{A -> 1}` |
    | `map_from_arrays(array('a','b'), array(1,2))` | `{a -> 1, b -> 2}` |
    | `map_from_entries(array(struct('a', 1), struct('b', 2)))` | `{a -> 1, b -> 2}` |
    | `str_to_map('color=red;size=M', ';', '=')` | `{color -> red, size -> M}` |
    | `map_zip_with(m1, m2, (k, v1, v2) -> ...)` | merge two maps key by key |

    A map keeps its entries in insertion order:
    `map_keys(map('b', 1, 'a', 2))` is `[b, a]`.

