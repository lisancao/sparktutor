  Output: |
    ## The Array Toolbox, and What It Does With NULL

    These run in SQL exactly as shown, and each has an `F.` twin in
    Python. Every output was produced on Spark 4.2.0:

    | Expression | Result |
    |------------|--------|
    | `array_distinct(array('a','a',NULL,NULL,'b'))` | `[a, NULL, b]` (one NULL survives) |
    | `array_compact(array('a',NULL,'b'))` (3.4) | `[a, b]` |
    | `sort_array(array(3,NULL,1))` | `[NULL, 1, 3]` |
    | `sort_array(array(3,NULL,1), false)` | `[3, 1, NULL]` |
    | `array_sort(array(3,NULL,1))` | `[1, 3, NULL]` |
    | `flatten(array(array(1,2), array(3), NULL))` | `NULL` (one NULL inner array) |
    | `sequence(1, 10, 3)` | `[1, 4, 7, 10]` |
    | `slice(array(1,2,3,4), 2, 2)` | `[2, 3]` (start is 1-based) |
    | `slice(array(1,2,3,4), -2, 2)` | `[3, 4]` |
    | `arrays_zip(array(1,2,3), array('a','b'))` | `[{1, a}, {2, b}, {3, NULL}]` |
    | `array_union(array(1,2,2), array(2,3))` | `[1, 2, 3]` |
    | `array_intersect(array(1,2,2), array(2,3))` | `[2]` |
    | `array_except(array(1,2,2,4), array(2))` | `[1, 4]` |
    | `array_join(array('a',NULL,'b'), ',')` | `a,b` (NULLs skipped) |
    | `array_join(array('a',NULL,'b'), ',', '?')` | `a,?,b` |
    | `array_position(array('a','b','a'), 'a')` | `1` (1-based, 0 if absent) |
    | `array_remove(array(1,2,1,NULL), 1)` | `[2, NULL]` |
    | `array_insert(array(1,2,3), 2, 9)` (3.4) | `[1, 9, 2, 3]` |
    | `array_append(array(1,2), 3)` (3.4) | `[1, 2, 3]` |

    Watch the NULL rules, because messy arrays have NULLs in them:

    - **`size` of a NULL array is NULL** under ANSI mode (the default
      since 4.0). With ANSI off it is `-1`, a Hive leftover. On the
      orders, `size(tags)` is NULL for O-1004 (no key) and `0` for O-1005
      (`[]`). `array_size` and `cardinality` behave the same.
    - **`array_contains` returns NULL, not false, when the array has a
      NULL and no match:** `array_contains(array('a', NULL), 'b')` is
      NULL. In a `filter` that acts like false, but `NOT
      array_contains(...)` drops the row too.
    - **`sort_array` and `array_sort` put NULLs at opposite ends**
      (above). Pick one and stay with it.
    - **Set operations remove duplicates.** `array_union` and
      `array_intersect` return sets, not multisets.

    Indexing under ANSI mode: `arr[i]` (0-based) and `element_at(arr, i)`
    (1-based) fail out of range with `INVALID_ARRAY_INDEX` and
    `INVALID_ARRAY_INDEX_IN_ELEMENT_AT`, while `get(arr, i)` (0-based) and
    `try_element_at(arr, i)` (1-based) return NULL instead (optional
    background: `learning_spark` lesson 4). Two more edges from 4.2.0:
    `element_at(arr, 0)` fails with `INVALID_INDEX_OF_ZERO` (it is
    1-based, and `-1` means the last element), and `slice(arr, 0, 2)`
    fails with `INVALID_PARAMETER_VALUE.START`.

    And one trap that bites on real data: `lines[0].attrs` works on
    every order you test, then a query reaches O-1006, whose `lines` is
    `[]`, and fails with `[INVALID_ARRAY_INDEX] The index 0 is out of
    bounds. The array has 0 elements.` Use `get(lines, 0)` (0-based) or
    `try_element_at(lines, 1)` whenever an array can be empty.

