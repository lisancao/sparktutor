       `at`) and `has_engraving` (any line with an `engraving` key).
       Orders with missing or empty arrays get `0`, `0.0`, `[]` and
       `false`, never NULL.
    3. `redact_customer(orders)`: drop `customer.email` and upper-case
       `customer.address.country`, keeping everything else.
    4. `attr_profile(orders)`: one row per attrs key with `key`, `n`
       (the number of lines that have it) and `values` (sorted distinct
       values), sorted by key.
    5. `flatten_structs(df)`: a generic function that turns every
       struct field at any depth into a column named `a_b_c`, keeps
       arrays and maps as they are, and survives names with dots and
       spaces.
    6. `lines_long(orders)`: one row per line with `order_id`,
       `line_no` (1-based), `sku`, `qty`, `unit_price` and
       `discount_pct` (the sum of the line's discounts), keeping orders
       without lines as one row of NULLs.
    7. `skus_in_line_order(lines)`: from `lines_long`'s output, one row
       per order (with lines) and its `skus` array in line order.

    The harness reads the file with Python's `json` module, computes
    every expected value, and checks each function on every order,
