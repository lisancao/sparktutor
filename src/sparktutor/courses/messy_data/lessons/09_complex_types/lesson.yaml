    ## Rows Back to Arrays, in Order

    After exploding, you often need to build the arrays again.
    `collect_list` gathers values into an array, but **it promises no
    order**: the elements arrive in whatever order the tasks deliver
    them, and after a shuffle that is not the original order. (It also
    skips NULLs; in 4.2 SQL, `collect_list(x) RESPECT NULLS` keeps them,
    so `(1), (NULL), (2)` gives `[1, NULL, 2]` instead of `[1, 2]`.)

    The fix is to carry the position with the value, sort, and drop the
    position:

    ```python
    pairs = (orders.select("order_id", F.posexplode("lines").alias("pos", "line"))
             .groupBy("order_id")
             .agg(F.array_sort(F.collect_list(F.struct("pos", "line.sku"))).alias("pairs")))
    pairs.select("order_id", F.transform("pairs", lambda p: p.sku).alias("skus"))
    ```

    `array_sort` orders the structs by `pos` first (struct ordering
    again), so `skus` comes back in line order no matter how the rows
    travelled. On a small local run, a plain `collect_list` often
    happens to give the right order too; that is luck, not a guarantee,
    and it is exactly the kind of bug that appears only on a cluster.

