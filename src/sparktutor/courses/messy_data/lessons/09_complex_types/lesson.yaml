    ## aggregate: Zero Values, NULLs and a Finish Function

    `aggregate(array, zero, merge, finish)` folds an array into one
    value (`reduce` is the same function under another name, in Python
    since 3.5). Three details decide whether it works on real data.

    **The zero sets the type, and SQL literals are not Python
    literals.** In Python, `F.lit(0.0)` is a `DOUBLE`. In SQL, `0.0` is
    a `DECIMAL(1,1)`, so this fails:

    ```sql
    SELECT aggregate(array(1.5, 2.25), 0.0, (a, x) -> a + x)
    ```

    ```
    [DATATYPE_MISMATCH.UNEXPECTED_INPUT_TYPE] ... The third parameter
    requires the "DECIMAL(1,1)" type, however "lambdafunction(...)" has
    the type "DECIMAL(4,2)".
    ```

    Write `0D` (a double) or `CAST(0 AS DOUBLE)` in SQL. Likewise an
    integer zero with a double merge fails ("requires the "INT" type,
    however ... has the type "DOUBLE"").

    **One NULL element poisons the result.** O-1008 has a line with
    `qty` NULL:

    ```sql
    SELECT order_id,
           aggregate(lines, 0, (acc, l) -> acc + l.qty) AS total_qty,
           aggregate(lines, 0, (acc, l) -> acc + coalesce(l.qty, 0)) AS total_qty2
    FROM orders WHERE order_id IN ('O-1006', 'O-1007', 'O-1008')
    ```

    ```
    +--------+---------+----------+
    |order_id|total_qty|total_qty2|
    +--------+---------+----------+
    |O-1006  |0        |0         |
    |O-1007  |NULL     |NULL      |
    |O-1008  |NULL     |0         |
    +--------+---------+----------+
    ```

    `acc + NULL` is NULL, and it stays NULL for the rest of the fold.
    O-1006 (`[]`) returns the zero; O-1007 (no `lines`) is NULL because
    the array itself is NULL. `coalesce` the element inside the lambda,
    and the array outside it.

    **The finish function turns the accumulator into the answer.** A
    struct accumulator carries several running values; an average of an
    array:

    ```sql
    SELECT aggregate(array(1, 2, 3, 4),
                     named_struct('s', 0, 'n', 0),
                     (acc, x) -> named_struct('s', acc.s + x, 'n', acc.n + 1),
                     acc -> acc.s / acc.n) AS avg       -- 2.5
    ```

    Lambdas nest. The net value of an order, applying each line's
    discounts, is an `aggregate` over lines with another `aggregate`
    over that line's discounts inside:

    ```sql
    aggregate(lines, 0D, (acc, l) ->
        acc + l.qty * l.unit_price
              * (1 - aggregate(l.discounts, 0, (d, x) -> d + x.pct) / 100.0))
    ```

    which gives 124.75 for O-1001 and 153.6 for O-1004.

