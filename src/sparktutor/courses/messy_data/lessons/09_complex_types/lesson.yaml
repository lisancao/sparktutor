    ## Generators, One Level Deeper

    "JSON Drift and Quarantine" compared `explode` with `explode_outer`.
    The rest of the family:

    ```python
    orders.select("order_id", F.posexplode_outer("lines").alias("pos", "line"))
    ```

    ```
    +--------+----+--------------------+
    |order_id| pos|                line|
    +--------+----+--------------------+
    |  O-1001|   0|{P6, 4, 30.0, [],...|
    |  O-1001|   1|{P5, 2, 2.5, [{VI...|
    |  O-1006|NULL|                NULL|
    |  O-1007|NULL|                NULL|
    ```

    - `posexplode` adds the 0-based position, which is how you keep
      "line 1, line 2" after exploding. O-1006 (`[]`) and O-1007 (no
      `lines`) survive only because of `_outer`.
    - `inline` explodes an array of structs straight into one column per
      field (`sku`, `qty`, `unit_price`, `discounts`, `attrs`).
    - `explode` on a **map** gives two columns, `key` and `value`
      (`posexplode` adds `pos`).

    In SQL the same generators appear in three places: in the `SELECT`
    list, in a `LATERAL VIEW` (the Hive form, with `OUTER` for the
    outer variant), or as a table-valued function in `FROM`:

    ```sql
    SELECT order_id, pos, l.sku
    FROM orders LATERAL VIEW OUTER posexplode(lines) t AS pos, l

    SELECT o.order_id, l.col.sku FROM orders o, LATERAL explode(o.lines) l
    ```

    Python has the table-valued form too:
    `orders.lateralJoin(spark.tvf.explode_outer(F.col("tags").outer()))`
    (4.0), as "VARIANT Basics: Profiling and Nested Data" will use for
    `variant_explode`.

    The plan shows why `explode` drops rows. For
    `ev.select(F.inline("items"))` on the events:

    ```
    *(1) Generate inline(items#5), false, [sku#1005, qty#1006]
    +- *(1) Filter ((size(items#5, false) > 0) AND isnotnull(items#5))
    ```

    The optimizer adds a filter that removes empty and NULL arrays before
    the generator runs; the `_outer` forms have no such filter.

