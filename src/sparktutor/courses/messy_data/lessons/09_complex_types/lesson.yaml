    ## A NULL Struct Is Not a Struct of NULLs

    Order O-1011 has no `geo` object. Its `customer.address.geo` is a
    NULL struct, and every field read through it is NULL too:

    ```
    +----+------------------------------+----+
    | geo|(customer.address.geo IS NULL)| lat|
    +----+------------------------------+----+
    |NULL|                          true|NULL|
    +----+------------------------------+----+
    ```

    A struct whose fields are all NULL is a different value:

    ```sql
    SELECT struct(CAST(NULL AS INT) AS a) AS s,
           struct(CAST(NULL AS INT) AS a) IS NULL AS n
    ```

    ```
    +------+-----+
    |     s|    n|
    +------+-----+
    |{NULL}|false|
    +------+-----+
    ```

    `show()` prints the first as `NULL` and the second as `{NULL}`. The
    difference matters when you check "is there an address?": a parser
    that always builds the struct (as `from_json` does for malformed
    input, which you saw in "JSON Drift and Quarantine") never gives you
    a NULL struct, so `IS NULL` on the struct is always false and you
    must test a field inside it instead.

