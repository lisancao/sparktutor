    ## Reading Structs

    A dot walks into a struct, as deep as you like. All of these name a
    field:

    ```python
    orders.select(
        "order_id",
        "customer.address.city",                  # a string path
        F.col("customer.address.geo.lat"),        # the same in F.col
        orders.customer.getField("name"),         # getField
        orders["customer"]["id"])                 # indexing
    ```

    ```
    +--------+--------+-------+-------------+-----------+
    |order_id|    city|    lat|customer.name|customer.id|
    +--------+--------+-------+-------------+-----------+
    |  O-1001| Toronto|47.8056|    Linh Tran|         C2|
    |  O-1002|Montreal|42.4062|      Sam Roy|         C3|
    |  O-1003|   Hanoi| 27.029|  Priya Patel|         C9|
    +--------+--------+-------+-------------+-----------+
    ```

    The output column is named after the last part of the path (`city`)
    for string paths, and after the whole expression for `getField` and
    indexing. Alias when the name matters. `"customer.*"` expands one
    level into separate columns (`id`, `name`, `email`, `address`), and
    `"customer.address.*"` expands the next level.

    Two things to know:

    - **A field that is not in the schema is an error at analysis
      time**, not a NULL: `orders.select("customer.phone")` fails with
      `[FIELD_NOT_FOUND] No such struct field `phone` in `id`, `name`,
      `email`, `address``. With an explicit schema, the schema decides
      what exists; a record that lacks the field just gives NULL.
    - **A field name with a dot in it needs backticks.** For a column
      called `a.b`, `select("a.b")` looks for field `b` inside a column
      `a` and fails with `UNRESOLVED_COLUMN.WITH_SUGGESTION` (helpfully
      suggesting `` `a.b` ``); `select("`a.b`")` works. Producers that
      write keys like `geo.v1` cause exactly this.

