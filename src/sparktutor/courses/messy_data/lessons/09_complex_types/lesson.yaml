    ## exists and forall Use Three-Valued Logic

    `exists` is true if any element matches and `forall` if every
    element does. With NULLs in the array, they can also return NULL:

    | Expression | Result |
    |------------|--------|
    | `exists(array(1, NULL), x -> x = 2)` | `NULL` |
    | `exists(array(1, NULL), x -> x = 1)` | `true` |
    | `forall(array(1, NULL), x -> x > 0)` | `NULL` |
    | `forall(array(1, NULL), x -> x > 5)` | `false` |
    | `exists(array(), x -> x = 1)` | `false` |
    | `forall(array(), x -> x = 1)` | `true` |

    "Is 2 in `[1, unknown]`?" has no definite answer, so the answer is
    NULL. This is the SQL standard behaviour, controlled by the internal
    setting `spark.sql.legacy.followThreeValuedLogicInArrayExists`
    (`true` by default). It matters in the same way as for
    `array_contains`: `filter(~F.exists(...))` drops the NULL rows as
    well as the true ones. Wrap in `F.coalesce(..., F.lit(False))` when
    you mean "no known match".

