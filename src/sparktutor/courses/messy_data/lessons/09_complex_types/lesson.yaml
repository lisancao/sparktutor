    ## Two Generators in One SELECT

    Two rules about where generators may appear, both checked in 4.2.0:

    - **A generator cannot sit inside another expression.**
      `F.upper(F.explode("tags"))` fails with
      `UNSUPPORTED_GENERATOR.NESTED_IN_EXPRESSIONS`. Explode first, then
      transform the new column (or transform the array, then explode).
    - **Two generators in one plain `SELECT` multiply.**
      `SELECT explode(array(1,2)) a, explode(array('x','y')) b` gives
      four rows, `(1,x) (1,y) (2,x) (2,y)`: every element of the first
      paired with every element of the second, per input row. If you
      wanted them side by side, explode one `arrays_zip(...)` instead.
      In a `SELECT` with an aggregate, two generators fail with
      `UNSUPPORTED_GENERATOR.MULTI_GENERATOR` ("only one generator
      allowed per SELECT clause").

    Exploding lines and tags in one select is a classic accident: an
    order with 3 lines and 4 tags becomes 12 rows, and every sum over
    lines is now four times too big.

