    ## What You'll Learn

    In "JSON Drift and Quarantine" you met nested data from the outside:
    you wrote a schema with a `STRUCT` for `user` and an
    `ARRAY<STRUCT<...>>` for `items`, read old and new field locations
    with `coalesce`, and used `explode_outer` and `inline_outer` to turn
    items into rows. This lesson works on the nested values from the
    inside, without turning them into rows first.

    Spark has three **complex types**, and every nested format you will
    meet in this course (JSON, XML, Avro, Protobuf, Parquet) maps onto
    them:

    | Type | Holds | DDL |
    |------|-------|-----|
    | struct | a fixed set of named fields, each with its own type | `STRUCT<city: STRING, lat: DOUBLE>` |
    | array | any number of values of one type, in order | `ARRAY<STRING>` |
    | map | any number of key/value pairs, keys of one type, values of one type | `MAP<STRING, STRING>` |

    If you did `learning_spark` lesson 4 ("Complex Types & Higher-Order
    Functions") you have seen `explode`, `transform`, `filter`,
    `aggregate` and the basic map functions on small hand-made
    DataFrames. Here they meet messy data, and you go further.

    By the end of this lesson you will be able to:

    - Read, build and edit structs at any depth (`withField` and
      `dropFields`, Spark 3.1), and know when a NULL struct differs from
      a struct of NULLs
    - Use the array toolbox (`array_distinct`, `array_sort` with a
      comparator, `flatten`, `slice`, `arrays_zip`, set operations) and
      predict what each does with NULL
    - Write higher-order functions in both Python and SQL lambda syntax,
      and recognise the errors you get when a Python lambda does
      something Spark cannot translate
    - Choose a map instead of a struct for objects whose keys change,
      and avoid `DUPLICATED_MAP_KEY` and `NULL_MAP_KEY`
    - Turn rows back into arrays in a guaranteed order
    - Flatten a deeply nested schema into `a_b_c` columns by walking
      `df.schema`
    - Tell when structs stop being the right tool, which is where the
      next lesson's VARIANT comes in

