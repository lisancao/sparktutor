  Depth: advanced
  Output: |
    ## Nested Data and Performance

    Columnar formats store each leaf field of a struct as its own
    column, and Spark reads only the leaves a query uses (nested schema
    pruning, `spark.sql.optimizer.nestedSchemaPruning.enabled`, on by
    default). Write the orders to Parquet and look at `ReadSchema` in
    `explain()`:

    | Query on the Parquet copy | ReadSchema |
    |---------------------------|------------|
    | `select("customer.address.city")` | `struct<customer:struct<address:struct<city:string>>>` |
    | `select("lines.sku")` | `struct<lines:array<struct<sku:string>>>` |
    | `select(F.transform("lines", lambda l: l.qty))` | all of `lines`, every field |
    | `filter("customer.address.country = 'CA'")` | only `country`, and `PushedFilters: [IsNotNull(customer.address.country), EqualTo(customer.address.country,CA)]` |

    So a dot path into a struct is as cheap as a top-level column, and a
    filter on a nested field can be pushed into the Parquet reader. A
    lambda over an array of structs reads every field of those structs
    in 4.2.0, even the ones the lambda never touches; if that array is
    large, select the fields you need first (`lines.qty`) and run the
    higher-order function on the smaller array.

    On the JSON file itself, `ReadSchema` lists the whole `customer`
    struct even when you select one field: JSON is text and every line
    is parsed anyway. That is one reason the raw layer is JSON and the
    next layer is a columnar format.

    Exploding costs more than it looks: every element becomes a row, so
    the data grows and any later join or group by shuffles all of those
    rows, while a higher-order function works inside each row and keeps
    the row count the same. The rule of thumb: stay inside the array
    with higher-order functions unless you need to join or group by
    individual elements.

