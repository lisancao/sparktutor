    ## What a Python Lambda May Do

    A Python lambda in `F.transform` is called **once**, on the driver,
    with placeholder `Column` objects; whatever `Column` it returns
    becomes the expression that runs in the JVM for every element. So
    the lambda must be built from `Column` operations, and these
    mistakes fail immediately:

    | You write | You get |
    |-----------|---------|
    | `lambda x: x + 1 if x > 0 else x` | `[CANNOT_CONVERT_COLUMN_INTO_BOOL]`: a Python `if` needs a real bool; use `F.when(x > 0, x + 1).otherwise(x)` |
    | `lambda x: 1` | `[HIGHER_ORDER_FUNCTION_SHOULD_RETURN_COLUMN] Function <lambda> should return Column, got int`; use `F.lit(1)` |
    | `lambda x: x.upper()` | `TypeError: 'Column' object is not callable`: `x.upper` is read as the struct field `upper`; use `F.upper(x)` |
    | `lambda *a: a[0]` | `[UNSUPPORTED_PARAM_TYPE_FOR_HIGHER_ORDER_FUNCTION]` |
    | `lambda x, i, j: x` in `transform` | `[INVALID_LAMBDA_FUNCTION_CALL.NUM_ARGS_MISMATCH]` |
    | a Python UDF called inside the lambda | `[UNSUPPORTED_FEATURE.LAMBDA_FUNCTION_WITH_PYTHON_UDF]` |

    The last one matters for messy data: when the per-element logic is
    too complex for built-in functions, you cannot call a UDF per
    element. Either pass the whole array to a UDF, or explode, apply the
    UDF to the rows, and collect back.

    A lambda can use columns from the same row, not only its argument:
    `transform(lines, l -> concat(order_id, '/', l.sku))` gives
    `[O-1001/P6, O-1001/P5]`.

