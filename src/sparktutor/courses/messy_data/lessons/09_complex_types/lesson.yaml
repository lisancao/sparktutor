    ## Pairing Arrays: zip_with and arrays_zip

    `lines.sku` and `lines.qty` are two parallel arrays. `zip_with`
    combines them element by element with a lambda, and `arrays_zip`
    pairs them into structs:

    ```sql
    SELECT order_id, zip_with(lines.sku, lines.qty, (s, q) -> concat(s, 'x', q)) AS z
    FROM orders
    -- O-1001: [P6x4, P5x2]
    ```

    Both pad the shorter array with NULLs:
    `zip_with(array(1,2,3), array(10,20), (a, b) -> a + b)` is
    `[11, 22, NULL]`. When the arrays come from the same array of
    structs, they always have the same length; when they come from two
    different producers, a length mismatch is silent, so check
    `size(a) = size(b)` first.

    In Python, `F.arrays_zip("lines.sku", "lines.qty")` names the struct
    fields after the inputs (`sku`, `qty`).

