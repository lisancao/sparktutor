    ## Arrays: Fields Through an Array

    A dot path also goes *through* an array of structs. `lines.sku`
    takes the `sku` of every element and gives an array:

    ```python
    orders.select("order_id", "lines.sku", "lines.qty").show(4)
    ```

    ```
    +--------+--------+------+
    |order_id|sku     |qty   |
    +--------+--------+------+
    |O-1001  |[P6, P5]|[4, 2]|
    |O-1002  |[P6]    |[5]   |
    |O-1003  |[P3]    |[3]   |
    |O-1004  |[P6, P2]|[4, 4]|
    +--------+--------+------+
    ```

    It only goes through **one** array. `lines.discounts` is an array of
    arrays, and `lines.discounts.code` fails with a confusing message:

    ```
    [DATATYPE_MISMATCH.UNEXPECTED_INPUT_TYPE] Cannot resolve
    "lines.discounts[code]" due to data type mismatch: The second
    parameter requires the "INTEGRAL" type, however "code" has the type
    "STRING".
    ```

    Spark read `.code` on an array of arrays as an array index. Flatten
    the outer level first:

    ```sql
    SELECT order_id, flatten(lines.discounts).code AS codes FROM orders
    ```

    ```
    +--------+--------------+
    |order_id|codes         |
    +--------+--------------+
    |O-1001  |[VIP5]        |
    |O-1004  |[FALL10, VIP5]|
    ```

