    ## Summary

    In this lesson you learned:

    - **Structs**: dot paths at any depth (`FIELD_NOT_FOUND` for fields
      not in the schema, backticks for names with dots); a NULL struct
      is not a struct of NULLs; structs compare and sort field by field.
    - **Editing structs**: `withField` and `dropFields` (3.1) take
      dotted paths, leave NULL structs NULL, cannot drop every field,
      and work on arrays of structs only through `transform`.
    - **Arrays**: a path goes through one array level (`flatten` for
      arrays of arrays); `size(NULL)` is NULL under ANSI;
      `array_contains`, `exists` and `forall` can return NULL;
      `sort_array` and `array_sort` place NULLs at opposite ends;
      `arr[0]` fails on an empty array, `get` does not.
    - **Generators**: `posexplode` keeps positions, `inline` explodes
      structs into columns, a map explodes into `key` and `value`, two
      generators in one `SELECT` multiply rows, and a generator cannot
      be nested in an expression.
    - **Higher-order functions**: Python lambdas build Column
      expressions once (no Python `if`, no UDFs inside); SQL uses
      `x -> ...`; `aggregate`'s zero sets the type (`0D` in SQL, not
      `0.0`), and one NULL element poisons the fold.
    - **Maps** for objects with open-ended keys, declared explicitly
      (inference never makes a map); `DUPLICATED_MAP_KEY` and
      `NULL_MAP_KEY` fail at run time; maps cannot be compared or
      deduplicated, but can be grouped since 4.0.
    - **Order after collecting** is not guaranteed; collect
      `(position, value)` structs and `array_sort`.
    - **Flattening** by walking `df.schema`, with its limits (arrays,
      maps, collisions).

    Next: **VARIANT Basics: Profiling and Nested Data**, where the same
    drifting events are loaded with no field-level schema at all.
