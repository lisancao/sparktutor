    ## The Orders File

    `data/messy/nested/orders.json` holds web shop orders, one JSON
    object per line. One record, pretty-printed:

    ```json
    {"order_id": "O-1002", "placed_at": "2026-10-06T09:07:00",
     "customer": {"id": "C3", "name": "Sam Roy", "email": "user1@example.com",
                  "address": {"city": "Montreal", "country": "CA",
                              "geo": {"lat": 42.4062, "lon": 43.5345}}},
     "lines": [{"sku": "P6", "qty": 5, "unit_price": 30.0, "discounts": [],
                "attrs": {"color": "red", "size": "S", "engraving": "Happy 30th"}}],
     "tags": ["gift"],
     "payments": [{"method": "card", "amount": 150.0}],
     "status_history": [{"status": "paid", "at": "2026-10-06T10:07:00"},
                        {"status": "placed", "at": "2026-10-06T09:07:00"}]}
    ```

    It has the problems real nested data has:

    | Problem | Where |
    |---------|-------|
    | tags in mixed case, with spaces, duplicates and a NULL | `["Gift", "gift", " GIFT", null, "rush"]` in O-1003 |
    | a missing array and an empty one | O-1004 has no `tags` key, O-1005 has `[]` |
    | an order with no lines, and one with no `lines` key | O-1006 and O-1007 |
    | a NULL inside a struct in an array | `qty` of O-1008's first line |
    | objects whose keys change from line to line | `attrs` |
    | country codes in mixed case | `ca`, `CA`, `Ca` |
    | a history out of time order | O-1002 above, and three more |
    | a struct that is missing | O-1011 has no `geo` |

    Inference reads it without complaint:

    ```python
    spark.read.json("data/messy/nested/orders.json").printSchema()
    ```

    ```
     |-- lines: array (nullable = true)
     |    |-- element: struct (containsNull = true)
     |    |    |-- attrs: struct (nullable = true)
     |    |    |    |-- color: string (nullable = true)
     |    |    |    |-- engraving: string (nullable = true)
     |    |    |    |-- gift_wrap: string (nullable = true)
     |    |    |    |-- size: string (nullable = true)
     |    |    |    |-- warranty_years: string (nullable = true)
     |    |    |-- discounts: array (nullable = true)
     ...
    ```

    Look at `attrs`. Every key that appears anywhere became a struct
    field, so the schema changes whenever a producer invents a new
    attribute, and most fields are NULL in most rows. JSON inference
    never produces a map. You will fix that with an explicit schema in
    the maps section; for now, read the file with this one (the
    exercise starter has it too):

    ```python
    ORDER_SCHEMA = """
        order_id STRING,
        placed_at TIMESTAMP,
        customer STRUCT<id: STRING, name: STRING, email: STRING,
                        address: STRUCT<city: STRING, country: STRING,
                                        geo: STRUCT<lat: DOUBLE, lon: DOUBLE>>>,
        lines ARRAY<STRUCT<sku: STRING, qty: INT, unit_price: DOUBLE,
                           discounts: ARRAY<STRUCT<code: STRING, pct: INT>>,
                           attrs: MAP<STRING, STRING>>>,
        tags ARRAY<STRING>,
        payments ARRAY<STRUCT<method: STRING, amount: DOUBLE>>,
        status_history ARRAY<STRUCT<status: STRING, at: TIMESTAMP>>
    """
    orders = spark.read.schema(ORDER_SCHEMA).json("data/messy/nested/orders.json")
    orders.createOrReplaceTempView("orders")
    ```

    The examples below use `orders` (and the `orders` view for SQL),
    with `from pyspark.sql import functions as F`.

- Class: text
  Depth: beginner
  Output: |
    A struct is a form with labelled boxes: every order's customer has
    the same boxes (id, name, email, address), and a box can hold another
    form (the address has its own boxes). An array is a numbered list
    stapled to the form: any length, every entry the same kind of thing.
    A map is a sticky-note pad: each note has a label you choose and a
    value, and no two notes may share a label. Picking the right one for
    each part of your data is most of the work in this lesson.

