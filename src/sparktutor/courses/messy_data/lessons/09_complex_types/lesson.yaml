    ## Map Rules That Fail Queries

    Maps have two hard rules, and messy data breaks both.

    **Keys must be unique.** By default (`spark.sql.mapKeyDedupPolicy`
    is `EXCEPTION`), building a map with a repeated key fails at run
    time:

    ```
    [DUPLICATED_MAP_KEY] Duplicate map key a was found, please check the
    input data. If you want to remove the duplicated keys, you can set
    "spark.sql.mapKeyDedupPolicy" to "LAST_WIN" so that the key inserted
    at last takes precedence.
    ```

    In 4.2.0 every one of these raises it: `map('a', 1, 'a', 2)`,
    `map_from_arrays(array('a', 'a'), ...)`, `map_concat(map('a', 1),
    map('a', 2))`, `str_to_map('a=1;a=2', ';', '=')`, and the sneaky one,
    `transform_keys(map('a', 1, 'A', 2), (k, v) -> upper(k))`, where
    cleaning the keys creates the duplicate. `LAST_WIN` makes
    `map_concat` give `{a -> 2}`; decide whether "last wins" is really
    what your data means before you turn it on.

    **Keys cannot be NULL.** `map_from_arrays(array('a', NULL), ...)`
    fails with `[NULL_MAP_KEY] Cannot use null as map key`. Filter or
    `coalesce` keys before building a map from data.

    And maps are not comparable. `map('a', 1) = map('a', 1)` fails with
    `DATATYPE_MISMATCH.INVALID_ORDERING_TYPE`, so does `ORDER BY` on a
    map, and `distinct()` on a DataFrame with a map column fails with
    `UNSUPPORTED_FEATURE.SET_OPERATION_ON_MAP_TYPE`. `GROUP BY` on a
    map column does work since 4.0 (SPARK-47430: Spark sorts each map's
    keys before grouping). To compare or deduplicate maps, compare
    `to_json(map_from_entries(array_sort(map_entries(m))))` or another
    canonical string.

