    ## When Structs Stop Being the Right Tool

    Structs, arrays and maps all need you to know the **shape** in
    advance, even when you do not know the keys (a map still fixes the
    value type). That is fine for data that changes slowly and for the
    tables you publish. It is painful when:

    - the same field has different types in different records (the
      events' `amount`: number, string, object);
    - objects nest to unknown depth, or values inside a map are
      themselves objects of varying shape;
    - you want to keep the full record exactly as received, and decide
      later which fields matter.

    For that, Spark 4.0 added a type that carries its shape inside each
    value: **VARIANT**. It is the subject of the next lesson. Everything
    you learned here still applies after you extract fields from a
    VARIANT: you get ordinary structs, arrays and maps back, and you
    work on them with the same functions.

