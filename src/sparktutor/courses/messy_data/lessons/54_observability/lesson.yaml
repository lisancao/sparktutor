    ## What You'll Learn

    You have met pieces of Spark's telemetry already: the Spark UI in
    "Plans, Partitions and Caching", `observe` and quality metrics in
    "Production Ingestion: Quality Rules, Quarantine and Pipelines",
    `python_worker_logs()` in "Packaging, Registration, Testing and
    Debugging", and the UDF profiler's basics in "Tuning Python on
    Spark" (all earlier levels). "Shipping Python Dependencies to a
    Cluster" ended with Python running on executors you cannot see.
    This lesson is about seeing them, after the fact and from code,
    without clicking through a UI.

    By the end you will be able to:

    - Trace any number in the Spark UI back to its source: the listener
      bus, task metrics, SQL metrics (accumulators) or the metrics
      system, with the 4.2.0 classes that produce each one
    - Write Python listeners for streaming queries in Classic and
      Connect, and a Py4J listener for batch queries in Classic, and know
      where each one runs
    - Read the 4.x event log (rolling, zstd) with Spark itself, tame its
      messy JSON (spaces, dotted keys, mixed types, re-planned queries)
      and attribute Python time to a plan node
    - Query the REST API of a live application and of the History
      Server, including task quantiles for skew
    - Expose metrics as JSON and Prometheus, and know what the metric
      names contain
    - Profile Python UDFs and, new in 4.2, Python data sources, and read
      the profiles critically (the profiler can be most of what you
      measure)
    - Sample executors with `py-spy`, and turn on structured JSON logs
      for the JVM and for Python and query them with Spark

    The exercise is a messy-data problem: diagnose a job from nothing
    but its event log, and prove your numbers against the REST API.

