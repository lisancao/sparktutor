    ## Streaming Listeners in Python

    `StreamingQueryListener` (3.4; `onQueryIdle` added in 3.5) is the one
    listener with a Python API. Here it collects every event of a query
    over the drifting JSON events, with an `observe` that counts rows
    and missing `user` values per batch:

    ```python
    class Collector(StreamingQueryListener):
        def __init__(self):
            self.events = []
        def onQueryStarted(self, e):
            self.events.append(("started", e.id, e.runId, e.name))
        def onQueryProgress(self, e):
            p = e.progress
            self.events.append(("progress", p.batchId, p.numInputRows, p.durationMs,
                                p.observedMetrics, p.sources[0].description, p.sink.description))
        def onQueryIdle(self, e):
            self.events.append(("idle",))
        def onQueryTerminated(self, e):
            self.events.append(("terminated", e.exception))

    c = Collector()
    spark.streams.addListener(c)
    schema = spark.read.json("data/messy/events").schema
    q = (spark.readStream.schema(schema).option("maxFilesPerTrigger", 1).json("data/messy/events")
         .observe("quality", F.count(F.lit(1)).alias("rows"),
                  F.sum(F.col("user").isNull().cast("int")).alias("null_users"))
         .writeStream.format("noop").option("checkpointLocation", ck)
         .trigger(availableNow=True).queryName("events_q").start())
    q.awaitTermination()
    # then poll: listener events arrive asynchronously, wait for "terminated"
    ```

    ```text
    ('started', UUID('2e6e5728-...'), UUID('ca3ed2b2-...'), 'events_q')
    ('progress', 0, 21, {'triggerExecution': 318, 'queryPlanning': 49, 'getBatch': 17, 'commitOffsets': 20,
      'latestOffset': 22, 'addBatch': 179, 'walCommit': 24}, {'quality': Row(rows=21, null_users=1)},
      'FileStreamSource[file:.../data/messy/events]', 'NoopTable')
    ('progress', 1, 20, {...}, {'quality': Row(rows=20, null_users=20)}, ...)
    ('progress', 2, 20, {...}, {'quality': Row(rows=20, null_users=0)}, ...)
    ('terminated', None)
    ```

    Batch 1 is the drifted file where `user` was renamed: 20 of 20 rows
    have no `user`. That is the observability payoff of `observe` in a
    stream: the drift shows up in a metric before anyone looks at the
    data. `durationMs` splits a trigger into phases (`addBatch` is your
    sink's work, `walCommit` and `commitOffsets` the checkpoint writes).
    `onQueryIdle` did not fire: an `availableNow` query stops instead of
    idling.

    Details that bite:

    - Since 4.0 `StreamingQueryProgress` is a `dict` subclass, but
      `json.dumps(q.lastProgress)` fails with `TypeError: Object of type
      UUID is not JSON serializable`. Use `q.lastProgress.json` (or
      `.prettyJson`).
    - **Where the callbacks run.** In Classic they run in your driver
      Python, called from the JVM through the Py4J callback server. On
      Spark Connect in 4.2 they run in the **client** too: the client
      keeps a `StreamingQueryListenerBus`
      (`pyspark/sql/connect/streaming/query.py`) and the server streams
      events to it. We checked: every callback reported the client's
      PID. (Spark 3.5 ran Connect listeners on the server; older
      articles say so.)
    - On Connect, remove listeners before `spark.stop()`. Otherwise the
      stop prints `Failed to remove the listener because of exception:
      [NO_ACTIVE_SESSION]`.

