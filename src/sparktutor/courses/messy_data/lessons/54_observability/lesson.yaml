    ## The REST API, Live and After the Fact

    The UI's data is a REST API at `<ui>/api/v1`
    (`core/.../status/api/v1/`). The port starts at 4040 and moves up
    when it is taken ("Service 'SparkUI' could not bind on port 4040.
    Attempting port 4041."), so build the URL from
    `spark.sparkContext.uiWebUrl` instead of hard-coding it:

    ```python
    base = f"{sc.uiWebUrl}/api/v1/applications/{sc.applicationId}"
    get = lambda p: json.load(urllib.request.urlopen(base + p))
    print("jobs:", [(j["jobId"], j["status"], j["numTasks"]) for j in get("/jobs")])
    st = get("/stages")
    print("stages:", [(s["stageId"], s["status"], s["numTasks"], s["shuffleReadRecords"]) for s in st])
    ts = get(f"/stages/{sid}/0/taskSummary?quantiles=0.0,0.5,1.0")
    print("records read quantiles:", ts["shuffleReadMetrics"]["readRecords"])
    print("executorRunTime quantiles:", ts["executorRunTime"])
    print("sql:", [(q["id"], q["status"], len(q.get("nodes", []))) for q in get("/sql")])
    ```

    ```text
    jobs: [(0, 'SUCCEEDED', 6)]
    stages: [(1, 'COMPLETE', 4, 60000), (0, 'COMPLETE', 2, 0)]
    records read quantiles: [0.0, 2572.0, 56571.0]
    executorRunTime quantiles: [10.0, 65.0, 85.0]
    sql: [(0, 'COMPLETED', 7)]
    ```

    `taskSummary` is the skew detector: the median task of stage 1
    read 2,572 records and the largest 56,571 (90% of the rows had the
    same key). Notice that run time hardly shows it here (85 ms against
    65 ms), because counting is cheap; record counts are the stable
    signal, time is the expensive one. The stage objects also carry
    `executorRunTime`, `memoryBytesSpilled`, `diskBytesSpilled`,
    `inputRecords`, `shuffleReadRecords`, `peakExecutionMemory` and
    more, summed over tasks.

    The API dies with the application. The **History Server** replays
    event logs into the same API. From a pip install (`SPARK_HOME` is
    the `pyspark` package folder):

    ```bash
    SPARK_HOME=$SH SPARK_HISTORY_OPTS="-Dspark.history.fs.logDirectory=file:/tmp/tmpszk95_g0 -Dspark.history.ui.port=18181" \
      $SH/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    curl -s localhost:18181/api/v1/applications
    ```

    ```text
    [ {
      "id" : "local-1793220246135",
      "name" : "a1.py",
      "attempts" : [ {
        ...
        "completed" : true,
        "appSparkVersion" : "4.2.0",
        "logSourceName" : "file:/tmp/tmpszk95_g0",
    ```

    and `/api/v1/applications/local-1793220246135/stages` returned the
    same stages as the live API. `sbin/start-history-server.sh` is in
    the pip package too, but `sbin/spark-daemon.sh` writes its logs to
    `${SPARK_HOME}/logs`, inside your venv, unless you set
    `SPARK_LOG_DIR`.

