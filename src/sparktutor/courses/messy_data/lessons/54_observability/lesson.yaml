    ## The Event Log

    `EventLoggingListener` writes every event to storage as one JSON
    object per line (`core/.../util/JsonProtocol.scala` defines the
    format). The settings that matter in 4.2.0:

    | Config | Default | Since |
    |---|---|---|
    | `spark.eventLog.enabled` | `false` | 1.0 |
    | `spark.eventLog.dir` | `/tmp/spark-events` | 1.0 |
    | `spark.eventLog.rolling.enabled` | `true` (since 4.0) | 3.0 |
    | `spark.eventLog.rolling.maxFileSize` | `128m` | 3.0 |
    | `spark.eventLog.compress` | `true` (since 4.0) | 1.0 |
    | `spark.eventLog.compression.codec` | `zstd` | 3.0 |
    | `spark.eventLog.logStageExecutorMetrics` | `false` | 3.0 |

    The two 4.0 changes are in `docs/core-migration-guide.md`. Together
    they mean that a 4.x log is not a file but a folder
    (`RollingEventLogFilesWriter`, `EventLogFileWriters.scala`):

    ```text
    while running:
      <logdir>/eventlog_v2_local-1793220246135
        ['.appstatus_local-1793220246135.inprogress.crc', 'events_1_local-1793220246135.zstd',
         'appstatus_local-1793220246135.inprogress']
    after spark.stop():
      <logdir>/eventlog_v2_local-1793220246135
        ['appstatus_local-1793220246135', '.appstatus_local-1793220246135.crc',
         'events_1_local-1793220246135.zstd']
    ```

    `events_<n>_<appId>.zstd` are the events; a new numbered file starts
    when one reaches `maxFileSize`. `appstatus_*` is an empty marker whose
    `.inprogress` suffix disappears when the application ends cleanly;
    an application that never stopped cleanly keeps it.

    Spark reads the events directly, zstd and all: since 4.1 file
    sources decompress `.zstd` and `.zst` files (SPARK-52482,
    `core/.../io/HadoopCodecStreams.scala`).

    ```python
    events = spark.read.json(log_dir + "/eventlog_v2_*/events_*")
    print(len(events.columns), "top-level columns")
    events.groupBy("Event").count().orderBy(F.desc("count")).show(40, truncate=False)
    ```

    ```text
    49 top-level columns
    +-------------------------------------------------------------------------+-----+
    |Event                                                                    |count|
    +-------------------------------------------------------------------------+-----+
    |SparkListenerTaskStart                                                   |3    |
    |org.apache.spark.sql.execution.ui.SparkListenerSQLAdaptiveExecutionUpdate|3    |
    |SparkListenerTaskEnd                                                     |3    |
    |SparkListenerJobStart                                                    |2    |
    |SparkListenerStageCompleted                                              |2    |
    |SparkListenerJobEnd                                                      |2    |
    |org.apache.spark.sql.execution.ui.SparkListenerDriverAccumUpdates        |2    |
    |SparkListenerStageSubmitted                                              |2    |
    |org.apache.spark.sql.execution.ui.SparkListenerSQLExecutionEnd           |1    |
    |SparkListenerBlockManagerAdded                                           |1    |
    |SparkListenerResourceProfileAdded                                        |1    |
    |SparkListenerApplicationEnd                                              |1    |
    |SparkListenerLogStart                                                    |1    |
    |SparkListenerExecutorAdded                                               |1    |
    |org.apache.spark.sql.execution.ui.SparkListenerSQLExecutionStart         |1    |
    |SparkListenerEnvironmentUpdate                                           |1    |
    |SparkListenerApplicationStart                                            |1    |
    +-------------------------------------------------------------------------+-----+
    ```

    (One small application with a Python UDF and AQE on.) Schema
    inference merges every event type into 49 sparse columns: this is
    "JSON Drift and Quarantine" all over again, with Spark as the
    producer.

