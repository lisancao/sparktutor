    ## Summary

    - Events flow through `LiveListenerBus` to the UI's status store, the
      event log and your listeners; queues are bounded and drop events
      when a listener is slow. The metrics system is separate.
    - Task metrics are fixed per task; SQL metrics are accumulators per
      plan node, Python nodes included (`PythonSQLMetrics`).
    - `StreamingQueryListener` is the Python listener (3.4); on Connect
      in 4.2 it runs in the client. Batch listeners are Java
      (`spark.extraListeners`, `spark.sql.queryExecutionListeners`), or
      Py4J callbacks in Classic.
    - 4.x event logs are rolling folders of zstd JSON (4.0 defaults);
      Spark reads them directly (4.1). Mind spaces, dotted keys, string
      metric updates and AQE plan versions.
    - The REST API (`/api/v1`, with `taskSummary` quantiles) serves live
      apps, and the History Server serves logs.
    - Metrics go to `/metrics/json` by default; Prometheus needs the
      servlet sink, and stable names need `spark.metrics.namespace`.
    - The UDF profiler (4.0) wraps every call of a row UDF, so its own
      cost can dominate; the data source profiler (4.2, SPARK-55161)
      also profiles planning. `py-spy` sees everything, given ptrace
      rights.
    - Structured logging (4.0) is a launch-time setting; read JVM and
      Python logs with `SPARK_LOG_SCHEMA` and normalize levels and time
      zones.

    Next: **From Wrong Results to a Fix: An Upstream Case Study**, where
    these tools meet a real wrong-results bug in Spark 4.2.0.
