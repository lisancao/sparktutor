    ## The Messy Parts of a Task End Event

    A trimmed `SparkListenerTaskEnd` (the real one has more metrics):

    ```text
    {"Event": "SparkListenerTaskEnd", "Stage ID": 0, "Stage Attempt ID": 0,
     "Task Type": "ShuffleMapTask", "Task End Reason": {"Reason": "Success"},
     "Task Info": {"Task ID": 1, "Index": 1, "Attempt": 0, "Partition ID": 1,
                   "Launch Time": 1793220253639, "Finish Time": 1793220255004,
                   "Executor ID": "driver", "Failed": false, "Killed": false,
                   "Accumulables": [
                     {"ID": ..., "Name": "time to execute Python code", "Update": "235", "Value": "235"},
                     {"ID": ..., "Name": "internal.metrics.executorRunTime", "Update": 1277, "Value": 1277}, ...]},
     "Task Metrics": {"Executor Run Time": 1277, "JVM GC Time": 17,
                      "Memory Bytes Spilled": 0, "Disk Bytes Spilled": 0,
                      "Shuffle Read Metrics": {"Local Bytes Read": 0, "Total Records Read": 0, ...},
                      "Shuffle Write Metrics": {"Shuffle Bytes Written": 201, ...},
                      "Input Metrics": {"Bytes Read": 0, "Records Read": 100000}, ...}}
    ```

    Four kinds of mess:

    1. **Spaces in names**: every field needs backticks,
       `` F.col("`Task Metrics`.`Executor Run Time`") ``.
    2. **Dots in names**: job properties land as a struct with fields
       like `spark.job.description`, so
       ``F.col("Properties.`spark.job.description`")``. Without the
       backticks Spark looks for a field `spark` and fails.
    3. **Mixed types**: SQL metric updates are JSON *strings* (`"235"`),
       internal task metrics are numbers (`1277`). Inference widens
       `Update` to `string` for all of them. Cast before you sum.
    4. **Plans that change**: with AQE the plan in
       `SQLExecutionStart` is replaced by
       `SQLAdaptiveExecutionUpdate` events, and the new plan nodes carry
       new accumulator ids. Join task updates to plans by accumulator
       id across *all* plan versions, or you find nothing (our first
       attempt, using only the start event, returned an empty table).

    Put together, this attributes every SQL metric to the plan node
    that owns it, which the task metrics cannot do:

    ```python
    plans = (events.where(F.col("sparkPlanInfo").isNotNull())
             .select("Event", F.to_json("sparkPlanInfo").alias("plan")).collect())
    metric_owner = {}
    def walk(node):
        for m in node.get("metrics") or []:
            metric_owner[m["accumulatorId"]] = (node["nodeName"], m["name"])
        for child in node.get("children") or []:
            walk(child)
    for p in plans:
        walk(json.loads(p["plan"]))
    owners = spark.createDataFrame(
        [(k, v[0], v[1]) for k, v in metric_owner.items()], "id long, node string, metric string")

    updates = (events.where(F.col("Event") == "SparkListenerTaskEnd")
               .select(F.explode("`Task Info`.Accumulables").alias("a"))
               .select(F.col("a.ID").alias("id"), F.col("a.Update").cast("long").alias("update")))
    (updates.join(owners, "id").groupBy("node", "metric").agg(F.sum("update").alias("total"))
     .where(F.col("node").contains("Python")).orderBy("metric").show(truncate=False))
    ```

    ```text
    +---------------+---------------------------------+-------+
    |node           |metric                           |total  |
    +---------------+---------------------------------+-------+
    |ArrowEvalPython|data returned from Python workers|1602880|
    |ArrowEvalPython|data sent to Python workers      |1628000|
    |ArrowEvalPython|number of output rows            |200000 |
    |ArrowEvalPython|time to execute Python code      |491    |
    |ArrowEvalPython|time to initialize Python workers|437    |
    |ArrowEvalPython|time to run Python workers       |2219   |
    |ArrowEvalPython|time to start Python workers     |1289   |
    +---------------+---------------------------------+-------+
    ```

    For this small UDF (`x * 2` over 200,000 rows) the workers spent
    491 ms in your code and more than 1.7 s starting and initializing.
    The plan is a tree of unknown depth, so it is walked in Python on
    the driver; it is one row per plan version, not data.

