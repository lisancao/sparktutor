    ## Your Own Counters

    - **Accumulators** (`sc.accumulator`) are Classic only: on Connect
      `spark.sparkContext` fails with `JVM_ATTRIBUTE_NOT_SUPPORTED`. Their
      updates from transformations can be applied more than once when a
      task or stage is retried ("Determinism, Retries and Fault
      Injection").
    - **`observe`** works in both modes and in streams, as above and in
      "Production Ingestion: Quality Rules, Quarantine and Pipelines".
    - **Python data sources** have no custom-metric API in 4.2.0
      (`pyspark/sql/datasource.py` defines none). A Java DSv2 connector
      can declare `CustomMetric`s and report them per task, which show
      up in the scan node in the UI ("A DSv2 Connector in Java").

