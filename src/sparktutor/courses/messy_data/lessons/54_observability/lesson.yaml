    ## Sampling Executors with py-spy

    The profilers above only see your function. `py-spy` (a separate
    tool, not part of PySpark; we used 0.4.2 in a scratch venv) samples
    a whole Python process from outside, with no code changes,
    including stuck ones. Attaching to a running worker needs ptrace
    rights. On this Linux machine (`/proc/sys/kernel/yama/ptrace_scope`
    is `1`), `py-spy dump --pid <worker>` from another shell failed:

    ```text
    Permission Denied: Try running again with elevated permissions by going 'sudo env "PATH=$PATH" !!'
    ```

    A process may always trace its own descendants, though, and every
    Python worker descends from the driver in local mode. So launch the
    driver *under* py-spy and follow subprocesses:

    ```bash
    py-spy record --subprocesses --format raw -o busy.txt -- python a8.py
    ```

    ```text
    py-spy> Stopped sampling because process exited
    py-spy> Wrote raw flamegraph data to 'busy.txt'. Samples: 693 Errors: 0
    ```

    Summing the raw stacks by process and by innermost frame:

    ```text
    439 process (worker.py:3612)
    176 process 3477247:""                      (the driver)
     78 .../bin/python -m pyspark.daemon pyspark.worker"

    307 busy (a8.py:8)
     79 busy (a8.py:7)
     44 _compile_source (<frozen zipimport>:637)
     42 run (py4j/clientserver.py:58)
     36 _compile_bytecode (<frozen importlib._bootstrap_external>:753)
    ```

    The UDF's loop dominates, as it should, but notice
    `_compile_source (<frozen zipimport>)`: workers import PySpark from
    `pyspark.zip` on their `PYTHONPATH` ("Shipping Python Dependencies
    to a Cluster"), and `zipimport` compiles those modules from source.
    No in-process profiler shows you that. Use `--format speedscope` or
    the default SVG for a flame graph.

    On a cluster you attach inside the executor's host or container
    (for Kubernetes, `kubectl exec` into the executor pod), where the
    container needs the `SYS_PTRACE` capability, per py-spy's own
    documentation. For a hang, `py-spy dump` prints every thread's
    stack at once, which is the quickest answer to "what is it doing";
    "The Python Worker Protocol" covers the built-in alternative,
    Python's `faulthandler` in workers.

    A task that never finishes and never fails is when a stack dump
    (`py-spy dump`, or a JVM thread dump from the UI's Executors tab)
    beats every metric. SPARK-58241 on stock 4.2.0 ("How Catalyst Plans
    Python", "The Python Worker Protocol") is such a hang; this lesson's
    workloads read no Parquet, so they never meet it.

