    ## Exercise: Diagnose a Job From Its Event Log

    The harness runs an application with the event log on (AQE off for
    a stable stage layout, four shuffle partitions): a job
    `skewed_scoring` sends events where 90% belong to one user through a
    deliberately slow Python UDF, and a job `spilling_sort` sorts with
    the sorter forced to spill every 2,000 rows
    (`spark.shuffle.spill.numElementsForceSpillThreshold`, internal). It
    reads the REST API's stage list, stops the application, and starts a
    new one that has only the log. You write:

    1. `load_events(spark, log_dir)`: every event, from the rolling
       folder and its zstd files.
    2. `stage_descriptions(events)`: stage id to the job description set
       with `setJobDescription`, from `StageSubmitted` properties.
    3. `task_metrics(events)`: one row per successful task, including
       `python_ms` summed from the accumulables named
       `time to execute Python code` (strings).
    4. `diagnose(tasks, descriptions)`: one row per stage with tasks,
       sums, max and exact median of records read, `record_skew`, and
       `flags` (`skew`, `spill`, `python`).

    The checks compare your counts, run times, records and spill bytes
    with the REST API stage by stage (exact equality, so they hold on
    any machine), and check that only the UDF stage is flagged `skew`
    and `python` and that only `spilling_sort` spills.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "Backticks for every name with spaces or dots: F.col('`Task Metrics`.`Executor Run Time`'), F.col('Properties.`spark.job.description`'). python_ms: F.aggregate(F.filter(acc, lambda a: a['Name'] == PYTHON_TIME), F.lit(0).cast('long'), lambda s, a: s + a['Update'].cast('long')). Flags: F.array_compact(F.array(F.when(...), ...))."

