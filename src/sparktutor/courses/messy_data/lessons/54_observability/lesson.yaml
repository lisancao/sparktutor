    ## The Metrics System

    `MetricsSystem` is independent of the listener bus: Dropwizard
    metrics from sources (JVM, BlockManager, DAGScheduler, executors,
    streaming queries when `spark.sql.streaming.metricsEnabled` is
    `true`) pushed to or pulled by sinks. Configuration comes from a
    `metrics.properties` file (`spark.metrics.conf`, template in
    `conf/metrics.properties.template`) or from `spark.metrics.conf.*`
    settings. With no configuration, `MetricsConfig.setDefaultProperties`
    adds a JSON servlet at `/metrics/json`. This session added
    Prometheus:

    ```python
    spark = (SparkSession.builder.master("local[2]")
             .config("spark.metrics.conf.*.sink.prometheusServlet.class",
                     "org.apache.spark.metrics.sink.PrometheusServlet")
             .config("spark.metrics.conf.*.sink.prometheusServlet.path", "/metrics/prometheus")
             .getOrCreate())
    ```

    ```text
    == /metrics/json/ 13200
    {"version":"4.0.0","gauges":{"local-1793220343059.driver.BlockManager.disk.diskSpaceUsed_MB":{"value":0},...
    == /metrics/prometheus/ 37839
    metrics_local_1793220343059_driver_BlockManager_disk_diskSpaceUsed_MB_Number{type="gauges"} 0
    metrics_local_1793220343059_driver_BlockManager_memory_maxMem_MB_Number{type="gauges"} 434
    == /metrics/executors/prometheus/ 5424
    spark_info{version="4.2.0", revision="32f7299601108917fb01920a54e084595b7b3bf8"} 1.0
    metrics_executor_memoryUsed_bytes{application_id="local-1793220343059", application_name="a3.py", executor_id="driver"} 312293
    metrics_executor_totalCores{application_id="local-1793220343059", application_name="a3.py", executor_id="driver"} 2
    ```

    Three things to read correctly. The `"version":"4.0.0"` in the JSON
    is the Dropwizard metrics format, not Spark's version. The metric
    names contain the application id, so every run is a new time series
    in Prometheus; set `spark.metrics.namespace` (2.1), for example to
    `${spark.app.name}`, to get stable names. And
    `/metrics/executors/prometheus` comes from a different switch,
    `spark.ui.prometheus.enabled` (an internal setting, default `true`
    in 4.2.0), and uses labels instead of names. The other sinks
    (`CsvSink`, `JmxSink`, `GraphiteSink`, `StatsdSink`, `Slf4jSink`,
    `ConsoleSink`) live in `core/.../metrics/sink/`.

