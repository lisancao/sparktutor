    ## Where the Numbers Come From

    Almost every number you see about a Spark application starts as an
    event on one bus:

    ```text
    DAGScheduler, TaskSetManager, SQLExecution, StreamExecution ...
                    |  post(event)
                    v
    LiveListenerBus (core/.../scheduler/LiveListenerBus.scala)
      queues: appStatus | executorManagement | eventLog | shared | streams
        |                    |                   |            |
        v                    v                   v            v
    AppStatusListener   ExecutorAllocation   EventLogging   your SparkListeners,
    SQLAppStatusListener  Manager            Listener       ExecutionListenerBus
        |                                       |
        v                                       v
    status store -> Spark UI, REST /api/v1   eventlog_v2_<appId>/events_*.zstd
                                              -> History Server (same REST API)

    MetricsSystem (core/.../metrics/MetricsSystem.scala), separate:
      sources (JVM, BlockManager, DAGScheduler, executor ...) -> sinks
      (MetricsServlet /metrics/json, PrometheusServlet, CSV, JMX, Graphite,
       StatsD, Slf4j, Console)
    ```

    Two kinds of per-task numbers ride on those events:

    - **Task metrics**: `Executor Run Time`, `JVM GC Time`, spill, shuffle
      read and write, input and output. Fixed fields, produced by the
      executor for every task.
    - **SQL metrics**: one `SQLMetric` accumulator per plan-node metric
      (`number of output rows`, `peak memory`, and, for Python nodes, the
      ones in `PythonSQLMetrics.scala`: `data sent to Python workers`,
      `time to start Python workers`, `time to initialize Python
      workers`, `time to run Python workers`, `time to execute Python
      code`, ...). Their per-task updates travel in the task's
      accumulables.

    Each queue is bounded by `spark.scheduler.listenerbus.eventqueue.capacity`
    (default 10000). A slow listener does not slow the job; its queue
    fills and events are **dropped** (`AsyncEventQueue` counts them and
    logs a warning). Keep listener callbacks fast, and never treat a
    listener as a source of truth for billing or correctness.

