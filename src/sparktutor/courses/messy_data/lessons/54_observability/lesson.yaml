    ## New in 4.2: Profiling Python Data Sources

    `spark.sql.pyspark.dataSource.profiler` (4.2.0, SPARK-55161) takes
    the same `perf`/`memory` values for Python data sources. Before
    4.2 the UDF profiler happened to cover data source reads, because
    reads run as a UDF internally; the commit notes that it no longer
    does. With a two-partition source whose `read()` calls a helper:

    ```python
    spark.dataSource.register(Nums)
    spark.conf.set("spark.sql.pyspark.dataSource.profiler", "perf")
    print(spark.read.format("nums").load().count())
    ```

    ```text
    2000
    ['Profile of create_data_source', 'Profile of plan_data_source_read', 'Profile of UDF<id=10>', 'Profile of UDF<id=11>']
            1    0.000    0.000    0.000    0.000 a5.py:13(partitions)
         1000    0.000    0.000    0.004    0.000 a5.py:17(slow_square)
         1001    0.000    0.000    0.005    0.000 a5.py:14(read)
    ```

    The profile covers the **planning workers** too: `create_data_source`
    (where `schema()` and the reader are created) and
    `plan_data_source_read` (where `partitions()` runs), both on the
    driver, then the read tasks. The switch is
    `read_single_udf` in `pyspark/worker.py`: functions from modules
    under `pyspark.sql.worker.` use the data source profiler setting,
    everything else the UDF one. A slow `partitions()` (listing a bucket,
    calling an API) is a planning cost you could not see before.

