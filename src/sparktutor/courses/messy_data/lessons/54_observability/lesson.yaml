    ## Structured Logs, JVM and Python

    `spark.log.structuredLogging.enabled` (4.0, default `false`) switches
    the JVM's log4j layout to JSON lines with the context Spark attaches
    to each message. It is read when logging is set up, so set it at
    launch. With `spark-submit --conf spark.log.structuredLogging.enabled=true`
    the log printed "Using Spark's default log4j profile:
    org/apache/spark/log4j2-json-layout.properties" and then JSON:

    ```text
    {"ts":"2026-10-28T20:47:33.334Z","level":"INFO","msg":"Running Spark version 4.2.0","context":{"spark_version":"4.2.0"},"logger":"SparkContext"}
    ```

    The same setting in `SparkSession.builder.config(...)` of a plain
    `python app.py` produced plain text: logging was already configured
    by then. (The config's doc also says it does not apply to
    interactive shells.)

    Read the logs back with the schema PySpark exports,
    `pyspark.logger.SPARK_LOG_SCHEMA` (the Scala twin is
    `LogUtils.SPARK_LOG_SCHEMA`):

    ```python
    from pyspark.logger import SPARK_LOG_SCHEMA
    logs = spark.read.schema(SPARK_LOG_SCHEMA).json("s1.log")
    print("rows:", logs.count(), "non-json rows:", logs.filter("ts IS NULL").count())
    logs.select(F.explode(F.map_keys("context")).alias("k")).groupBy("k").count() \
        .orderBy(F.desc("count")).show(6)
    ```

    ```text
    ts TIMESTAMP, level STRING, msg STRING, context map<STRING, STRING>, exception STRUCT<class STRING, msg STRING, stacktrace ARRAY<STRUCT<class STRING, method STRING, file STRING, line STRING>>>, logger STRING
    rows: 120 non-json rows: 5
    +-----------+-----+
    |          k|count|
    +-----------+-----+
    |  task_name|   21|
    |       host|    9|
    |modify_acls|    9|
    |      stage|    9|
    |  view_acls|    9|
    |executor_id|    7|
    +-----------+-----+
    ```

    The five non-JSON rows are lines printed before log4j switched
    layouts; with an explicit schema they become all-NULL rows instead
    of failures. The context keys are the MDC fields
    (`task_name` replaced `mdc.taskName` in 4.0, per the core migration
    guide), so "every log line of task 7 in stage 3" is a filter on
    `context['task_name']`.

    On the Python side, `pyspark.logger.PySparkLogger` (4.0) writes the
    same shape, and PySpark itself uses it: an error with a query
    context is logged as JSON by the `SQLQueryContextLogger` or
    `DataFrameQueryContextLogger` loggers (`_log_exception` in
    `pyspark/errors/exceptions/base.py`), which is the JSON line you
    may have noticed on stderr after a failed query:

    ```python
    from pyspark.logger import PySparkLogger
    log = PySparkLogger.getLogger("ingest")
    log.warning("quarantined rows", table="events", rows=20)
    ```

    ```text
    {"ts": "2026-10-28 14:24:26.981", "level": "WARNING", "logger": "ingest", "msg": "quarantined rows", "context": {"table": "events", "rows": 20}}
    ```

    Reading both files with one schema works, and shows the remaining
    mess:

    ```text
    +-----------------------+-------+----------------+-----------------------------+
    |ts                     |level  |logger          |context                      |
    +-----------------------+-------+----------------+-----------------------------+
    |2026-10-28 13:47:33.381|WARN   |NativeCodeLoader|NULL                         |
    |2026-10-28 14:24:26.981|WARNING|ingest          |{table -> events, rows -> 20}|
    +-----------------------+-------+----------------+-----------------------------+
    ```

    The JVM writes `WARN` and a UTC timestamp with `Z`; Python writes
    `WARNING` and a local time without an offset, which Spark reads in
    the session time zone. Normalize levels and zones before you join
    them. For logs of Python workers on executors, use
    `python_worker_logs()` from "Packaging, Registration, Testing and
    Debugging".

