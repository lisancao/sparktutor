    ## Batch Listeners: Java, or Py4J in Classic

    There is no Python API for `SparkListener` or
    `QueryExecutionListener`. The supported routes are Java (or Scala)
    classes named in `spark.extraListeners` (1.3, for `SparkListener`)
    or `spark.sql.queryExecutionListeners` (2.3, a static SQL config for
    `org.apache.spark.sql.util.QueryExecutionListener`), on the
    classpath at startup. "Catalyst Extensions: Rules and Native
    Functions" shows how to compile and load such classes from a
    SparkTutor exercise.

    In Classic you can also implement the Java interface in Python and
    let Py4J call it back, which is handy for one-off debugging. A
    `QueryExecutionListener` has two methods, and sees the
    `QueryExecution` of every action:

    ```python
    class QEL:
        def __init__(self): self.seen = []
        def onSuccess(self, funcName, qe, durationNs):
            self.seen.append((funcName, durationNs // 1_000_000, qe.executedPlan().nodeName()))
        def onFailure(self, funcName, qe, exc):
            self.seen.append((funcName, "FAILED", str(exc.getMessage())[:80]))
        class Java:
            implements = ["org.apache.spark.sql.util.QueryExecutionListener"]

    from pyspark.java_gateway import ensure_callback_server_started
    ensure_callback_server_started(spark.sparkContext._gateway)
    l = QEL()
    spark._jsparkSession.listenerManager().register(l)
    spark.range(100).groupBy((F.col("id") % 3).alias("k")).count().collect()
    try:
        spark.sql("select 1/0").collect()
    except Exception:
        pass
    # poll l.seen: the ExecutionListenerBus delivers asynchronously
    ```

    ```text
    listener saw: [('collectToPython', 335, 'AdaptiveSparkPlan'),
      ('collectToPython', 'FAILED', '[DIVIDE_BY_ZERO] Division by zero. Use `try_divide` to tolerate divisor being 0 ')]
    ```

    `qe` is the live JVM `QueryExecution`, so `qe.executedPlan()` and its
    metrics are there to read. The callback runs on a listener thread
    that waits for Python, so keep it tiny. This needs Py4J and therefore
    does not exist on Connect.

