    ## Profiling Python Inside Executors

    "Tuning Python on Spark" introduced `spark.sql.pyspark.udf.profiler`
    (4.0; `perf` or `memory`) and `spark.profile.show`. Here is what
    the profile is made of, and how to keep it from fooling you. A
    row-at-a-time UDF and a pandas UDF doing the same work over 20,000
    strings:

    ```python
    spark.conf.set("spark.sql.pyspark.udf.profiler", "perf")

    @F.udf("string")
    def norm(s):
        import unicodedata
        return unicodedata.normalize("NFKC", s).strip().lower() if s else s

    @F.pandas_udf("string")
    def norm_vec(s: pd.Series) -> pd.Series:
        return s.str.normalize("NFKC").str.strip().str.lower()

    df = spark.range(20000).select(F.concat(F.lit(" Ｃity "), F.col("id").cast("string")).alias("c"))
    q = df.select(norm("c").alias("a"), norm_vec("c").alias("b"))
    q.explain()
    q.write.format("noop").mode("overwrite").save()
    ```

    ```text
    == Physical Plan ==
    *(2) Project [pythonUDF0#6 AS a#4, pythonUDF0#7 AS b#5]
    +- ArrowEvalPython [norm_vec(c#1)#3], [pythonUDF0#7], 200
       +- ArrowEvalPython [norm(c#1)#2], [pythonUDF0#6], 101
          +- *(1) Project [concat( Ｃity , cast(id#0L as string)) AS c#1]
             +- *(1) Range (0, 20000, step=1, splits=2)
    ```

    The profile ids are the UDFs' expression ids from the plan,
    `norm(c#1)#2` and `norm_vec(c#1)#3`; the numbers 101 and 200 are
    the eval types (`SQL_ARROW_BATCHED_UDF`, `SQL_SCALAR_PANDAS_UDF`).
    `spark.profile.render` (4.0) accepts a callable that receives the
    `pstats.Stats`, which lets code read a profile:

    ```python
    def own_time(stats):
        mine = sum(v[3] for (file, _, name), v in stats.stats.items()
                   if file.endswith("a12.py") and name in ("norm", "norm_vec"))
        prof = sum(v[2] for (file, _, name), v in stats.stats.items()
                   if "_lsprof" in name or file.endswith("profiler.py"))
        calls = sum(v[1] for (file, _, name), v in stats.stats.items()
                    if file.endswith("a12.py") and name in ("norm", "norm_vec"))
        return round(mine, 3), round(prof, 3), calls

    print(2, spark.profile.render(2, renderer=own_time))
    print(3, spark.profile.render(3, renderer=own_time))
    ```

    ```text
    2 (0.04, 0.281, 20000)
    3 (0.029, 0.0, 2)
    ```

    The row UDF was called 20,000 times and spent 0.04 s in `norm`, and
    0.281 s inside the profiler itself. The reason is in
    `pyspark/worker.py`: `wrap_perf_profiler` wraps **every call** of a
    non-iterator UDF in `with WorkerPerfProfiler(...)`, which enables
    and disables cProfile each time. In `spark.profile.show` that
    appears as the top line `{method 'disable' of '_lsprof.Profiler'
    objects}`. The pandas UDF was called once per batch (twice) and
    the profiler cost nothing. So read the cumulative time of your own
    functions, not the total, and never compare a profiled row UDF's
    wall time with anything.

    Also from the source: `spark.profile.dump(path)` writes one
    `udf_<id>_perf.pstats` per UDF (we got `udf_2_perf.pstats` and
    `udf_3_perf.pstats`), readable with `pstats` or snakeviz. The
    `memory` profiler needs the `memory_profiler` package on the
    executors; without it the worker silently returns the unwrapped
    function, the query runs, and `show` only warns: "Install the
    'memory_profiler' library in the cluster to enable memory
    profiling".

