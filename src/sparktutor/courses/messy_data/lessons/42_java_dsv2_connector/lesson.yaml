    ## What the Python API Leaves Out

    A Python data source is a DSv2 source whose Java half Spark wrote
    for you. The 4.2.0 files are in
    `sql/core/src/main/scala/org/apache/spark/sql/execution/datasources/v2/python/`.
    The scan builder is short enough to quote its declaration:

    ```scala
    class PythonScanBuilder(
        ds: PythonDataSourceV2,
        shortName: String,
        outputSchema: StructType,
        options: CaseInsensitiveStringMap)
        extends ScanBuilder
        with SupportsPushDownFilters {
    ```

    One mix-in, `SupportsPushDownFilters`, which uses the older V1
    `org.apache.spark.sql.sources.Filter` classes (that is where the
    `EqualTo` and `StringEndsWith` of "Filter Pushdown" come from).
    Everything else in the read API is left at its default:

    | DSv2 capability (Java interface) | Python data source in 4.2.0 | Java source |
    |---|---|---|
    | Filters (`SupportsPushDownV2Filters`) | V1 filters, AND-ed parts only | V2 `Predicate`s, including `OR`, `NOT`, functions |
    | Column pruning (`SupportsPushDownRequiredColumns`) | no: `reader(schema)` always gets the full schema | yes |
    | `LIMIT`, top N, `OFFSET` (`SupportsPushDownLimit`, `...TopN`, `...Offset`) | no | yes |
    | Aggregates (`SupportsPushDownAggregates`) | no | yes, complete or partial |
    | Statistics (`SupportsReportStatistics`) | no | yes |
    | Partitioning (`SupportsReportPartitioning`) | no | yes, avoids shuffles |
    | Runtime filters (`SupportsRuntimeV2Filtering`) | no | yes |
    | Columnar reads (`PartitionReaderFactory.supportColumnarReads`) | rows only | `ColumnarBatch` |
    | Rows | Python tuples, converted through Arrow | `InternalRow`, no conversion |

    None of this makes Python sources bad. For an API or a folder of
    odd files, Python is usually the right tool. Java earns its place
    when the optimizer has to know things about your data: how many
    rows, which columns, how it is partitioned, or when the source can
    answer part of the query itself.

- Class: text
  Depth: beginner
  Output: |
    Think of the Python API as a form with a few boxes: the planner
    fills in "filters" and your code reads them. The Java API is a
    conversation. The planner asks a series of questions ("can you
    filter by this? can you count for me? which columns do you need?
    how many rows will you return?") and plans the rest of the query
    around your answers.

