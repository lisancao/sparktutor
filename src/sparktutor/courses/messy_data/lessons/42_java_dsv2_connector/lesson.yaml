    ## Rows the Way Spark Stores Them

    A `PartitionReader<InternalRow>` hands Spark rows in its **internal**
    format, with no conversion step. You must use Spark's internal value
    types, which `InternalRow` and `SpecificInternalRow`
    (`sql/catalyst/.../InternalRow.scala`) list per data type:

    | Spark type | Java value in an `InternalRow` |
    |---|---|
    | `StringType` | `org.apache.spark.unsafe.types.UTF8String` |
    | `IntegerType`, `DateType` | `int` (a date is days since 1970-01-01) |
    | `LongType`, `TimestampType`, `TimestampNTZType` | `long` (timestamps are microseconds since the epoch) |
    | `DoubleType`, `BooleanType`, `BinaryType` | `double`, `boolean`, `byte[]` |
    | `DecimalType` | `org.apache.spark.sql.types.Decimal` |
    | `ArrayType`, `MapType`, `StructType` | `ArrayData`, `MapData`, `InternalRow` |
    | any nullable column | `null` |

    The reader in `jdocs` fills an `Object[]` in the order of the read
    schema and wraps it in a `GenericInternalRow`:

    ```java
    values[c] = switch (columns[c]) {
      case "name" -> UTF8String.fromString(f.name);
      case "size" -> f.size;                         // long
      case "modified" -> f.modifiedMicros;           // microseconds
      case "width" -> wh == null ? null : wh[0];     // int or null
      ...
    };
    current = new GenericInternalRow(values);
    ```

    Get a type wrong and nothing checks it until a task touches the
    value. Putting a `java.lang.String` in the `name` slot compiles and
    plans fine, then every query that reads `name` fails in the task:

    ```text
    java.lang.ClassCastException: class java.lang.String cannot be cast to class
    org.apache.spark.unsafe.types.UTF8String
    ```

    The modification time comes from
    `BasicFileAttributes.lastModifiedTime().to(TimeUnit.MICROSECONDS)`,
    which is exactly what a `TimestampType` slot needs. The exercise
    compares every row with a Python data source that computes the same
    value from `os.stat(...).st_mtime_ns // 1000`; a float `st_mtime`
    can differ from it by a microsecond.

