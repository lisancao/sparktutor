    ## Seeing Pushdown in the Plan

    ```python
    q = jdocs().filter("kind = 'image'").select("name", "width")
    q.explain()
    ```

    ```text
    == Physical Plan ==
    *(1) Project [name#1, width#5]
    +- BatchScan jdocs[name#1, width#5] jdocs[files=5, pushed=[kind = 'image']] RuntimeFilters: []
    ```

    Read the scan line from left to right:

    - `jdocs[name#1, width#5]`: the scan's output. Column pruning
      worked: `pruneColumns` received only `name` and `width`. The query
      also uses `kind`, but only in a filter the scan took over, so the
      scan does not have to return it.
    - `jdocs[files=5, pushed=[kind = 'image']]`: this part is
      **yours**. `BatchScanExec` prints `scan.description()` there, and
      nothing else about pushdown. Without overriding `description()`
      the plan says `class jdocs.DocsScan`. The `PushedFilters:` line
      you saw for Python sources comes from `PythonScan` implementing an
      internal trait, `SupportsMetadata`; a third-party Java scan should
      put what it pushed into `description()`.
    - No `Filter` node: Spark trusts the scan for `kind = 'image'`.

    The audit counter agrees: only the five PNGs were opened, because
    `width` needs the header bytes. A query that selects only
    `name, size` opens nothing at all.

