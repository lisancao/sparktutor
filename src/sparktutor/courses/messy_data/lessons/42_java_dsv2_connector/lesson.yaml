    ## Java From a Python Exercise

    This lesson's exercise starts with the line `# spark-run: python`.
    SparkTutor then runs it as plain `python exercise.py` instead of
    under `spark-submit`, so the script can create its own session with
    settings that must be known before the JVM starts. `spark.jars` is
    one of those: the jar has to be on the driver's classpath when the
    session is created.

    You need a **JDK** (not only a Java runtime): run `javac -version`
    and expect `javac 17` or later. The exercise keeps the Java sources
    as strings in a dict, writes them to a temporary folder, and
    compiles them against the jars that ship inside pyspark:

    ```python
    import glob, os, subprocess, tempfile, pyspark
    from pathlib import Path

    def build_jar(java, resources, name="jdocs"):
        work = Path(tempfile.mkdtemp(prefix=name + "_"))
        for rel, code in java.items():                 # "jdocs/DocsSource.java": "..."
            f = work / "src" / rel
            f.parent.mkdir(parents=True, exist_ok=True)
            f.write_text(code)
        classes = work / "classes"
        for rel, text in resources.items():            # the META-INF/services file
            f = classes / rel
            f.parent.mkdir(parents=True, exist_ok=True)
            f.write_text(text)
        jars = glob.glob(os.path.join(os.path.dirname(pyspark.__file__), "jars", "*.jar"))
        subprocess.run(["javac", "--release", "17", "-d", str(classes),
                        "-cp", os.pathsep.join(jars),
                        *map(str, sorted((work / "src").rglob("*.java")))], check=True)
        jar = work / f"{name}.jar"
        subprocess.run(["jar", "cf", str(jar), "-C", str(classes), "."], check=True)
        return str(jar)

    jar = build_jar(JAVA, RESOURCES)
    spark = (SparkSession.builder.master("local[2]")
             .config("spark.jars", jar)
             .getOrCreate())
    ```

    `pyspark/jars/` holds every jar of Spark 4.2.0 (Scala 2.13), so the
    Java code compiles against exactly the classes it will run with.
    Compiling the connector took about a second on the machine used for
    this lesson; starting the session takes a few more.

    In local mode the driver and the executors are one JVM, and PySpark
    talks to it through Py4J. That gives tests a back door:
    `spark._jvm.jdocs.Audit.opened()` calls a static method of your
    class in the same JVM the tasks ran in. It only works in a classic
    session in local mode; on a cluster each executor has its own JVM,
    and Spark Connect has no `_jvm` at all ("Spark Connect Plugins"
    deals with that).

