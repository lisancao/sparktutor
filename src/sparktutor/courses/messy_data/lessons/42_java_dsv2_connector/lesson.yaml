    ## Statistics for the Optimizer

    `SupportsReportStatistics.estimateStatistics()` returns
    `sizeInBytes` and `numRows` (and optional `columnStats`). Spark asks
    **after** pushdown, so the numbers can reflect the pushed filters.
    `explain("cost")` shows them on the relation:

    ```text
    == Optimized Logical Plan ==
    RelationV2[path#49, name#50, kind#51, size#52L, modified#53, width#54, height#55] jdocs,
      Statistics(sizeInBytes=240.0 B, rowCount=2)
    ```

    That was `kind = 'pdf'`: two files times the 120 bytes per row that
    `jdocs` estimates. The optimizer uses `sizeInBytes` to decide
    whether a side of a join is small enough to broadcast
    (`spark.sql.autoBroadcastJoinThreshold`, 10 MB by default). A
    source with no statistics gets the default size, which is
    enormous, so it is never broadcast. Report the size of the data
    your scan **returns**, not the size of the files it reads: `jdocs`
    returns metadata rows, not file contents.

