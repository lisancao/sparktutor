    ## Filters as V2 Predicates

    `SupportsPushDownV2Filters` has two methods:

    ```java
    Predicate[] pushPredicates(Predicate[] predicates);   // return what Spark must still evaluate
    Predicate[] pushedPredicates();                       // what you took over, for explain and rules
    ```

    A `Predicate` (`connector/expressions/filter/Predicate.java`) is a
    `GeneralScalarExpression`: an upper-case `name()` and `children()`.
    Children are `NamedReference`s (columns), `Literal`s, or other
    expressions. This is what arrived in `jdocs` for some conditions,
    printed from inside `pushPredicates` (4.2.0, with `width` and
    `height` nullable and the other columns declared non-null):

    | Condition | `name()` and children | `toString()` |
    |---|---|---|
    | `kind = 'image' AND width > 12` | `IS_NOT_NULL(width)`, `=(kind, lit)`, `>(width, lit)` | `width IS NOT NULL`, `kind = 'image'`, `width > 12` |
    | `kind IN ('a','b')` | `IN(kind, lit, lit)` | `kind IN ('a', 'b')` |
    | `name LIKE '%.png'` | `ENDS_WITH(name, lit)` | `name LIKE '%.png' ESCAPE '\'` |
    | `name LIKE 'red%'` | `STARTS_WITH(name, lit)` | `name LIKE 'red%' ESCAPE '\'` |
    | `name LIKE '%ra%'` | `CONTAINS(name, lit)` | `name LIKE '%ra%' ESCAPE '\'` |
    | `kind <> 'image'` | `NOT(=(kind, lit))` | `NOT (kind = 'image')` |
    | `size BETWEEN 10 AND 100` | `>=(size, lit)`, `<=(size, lit)` | `size >= 10`, `size <= 100` |
    | `width IS NULL` | `IS_NULL(width)` | `width IS NULL` |
    | `lower(kind) = 'image'` | `=(LOWER(kind), lit)` | `LOWER(kind) = 'image'` |
    | `kind = 'audio' OR size < 100` | `OR(pred, pred)` | `(kind = 'audio') OR (size < 100)` |
    | `size % 2 = 1` | `=(%(size, lit), lit)` | `(size % 2) = 1` |
    | `width > height` | two `IS_NOT_NULL`s, `>(width, height)` | `width > height` |
    | `modified > TIMESTAMP '2020-01-01 00:00:00'` | `>(modified, lit)` | `modified > 1577865600000000` |

    (`lit` is a `LiteralValue`, `pred` a nested `Predicate`, and
    `LOWER(...)` or `%` a `GeneralScalarExpression`.)

    Compare it with the table in "Filter Pushdown": the V2 API also
    carries `OR`, functions, arithmetic and column-to-column
    comparisons. Three details matter when you translate them:

    - **Literal values are internal values.** A string literal's
      `value()` is a `UTF8String`, a `bigint` literal is a `Long`, and a
      timestamp is a `Long` in microseconds, already converted with the
      session time zone (the run above used `America/Los_Angeles`, so
      midnight on 2020-01-01 is `1577865600000000`).
    - **Spark casts literals to the column's type** during analysis:
      `size > 4000` arrives with a `Long` 4000 because `size` is a
      `bigint`, while `width > 12` arrives with an `Integer`.
    - **Non-null columns get no `IS_NOT_NULL`.** Spark infers
      `isnotnull(col)` from a comparison only for nullable columns. For
      nullable ones it is offered like any other predicate; `jdocs`
      accepts `IS_NOT_NULL` on columns it knows are never null and
      returns the rest.

    The contract is the one from "Filter Pushdown": return every
    predicate you do not apply **exactly**, unchanged. If you keep it
    and ignore it, the query silently returns too many rows.

