    ## The Same Build With Maven

    A real connector is a Maven (or sbt, or Gradle) project. This
    `pom.xml` built the lesson's sources into a jar that
    `spark-submit --jars target/jdocs-0.1.0.jar` loaded by its short
    name:

    ```xml
    <project xmlns="http://maven.apache.org/POM/4.0.0">
      <modelVersion>4.0.0</modelVersion>
      <groupId>com.example</groupId>
      <artifactId>jdocs</artifactId>
      <version>0.1.0</version>

      <properties>
        <maven.compiler.release>17</maven.compiler.release>
        <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
        <spark.version>4.2.0</spark.version>
      </properties>

      <dependencies>
        <!-- provided: Spark is on the cluster's classpath already, do not bundle it -->
        <dependency>
          <groupId>org.apache.spark</groupId>
          <artifactId>spark-sql_2.13</artifactId>
          <version>${spark.version}</version>
          <scope>provided</scope>
        </dependency>
      </dependencies>

      <build>
        <plugins>
          <!-- Pin the compiler plugin: the old default ignores maven.compiler.release -->
          <plugin>
            <groupId>org.apache.maven.plugins</groupId>
            <artifactId>maven-compiler-plugin</artifactId>
            <version>3.13.0</version>
          </plugin>
        </plugins>
      </build>
    </project>
    ```

    Sources go in `src/main/java/jdocs/`, and the service file in
    `src/main/resources/META-INF/services/`. Two details matter:

    - **`provided` scope.** Spark's own jars are on every cluster
      already. Bundling them makes a huge jar and, worse, two copies of
      Spark classes on one classpath.
    - **Pin `maven-compiler-plugin`.** Without the `<plugin>` block,
      Maven 3.8 used its built-in compiler plugin 3.1, which ignores
      `maven.compiler.release` and failed with `Source option 5 is no
      longer supported. Use 7 or later.`

    The artifact name ends in `_2.13` because Spark 4 is built only
    for Scala 2.13. If your connector has its own dependencies, build a
    shaded jar (the `maven-shade-plugin`) and relocate libraries that
    Spark also ships, such as Guava or Jackson, so the two versions do
    not collide.

