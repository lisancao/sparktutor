    ## Registering a Short Name

    `spark.read.format("jdocs")` works because the jar contains a
    service file, `META-INF/services/org.apache.spark.sql.sources.DataSourceRegister`,
    with one line: `jdocs.DocsSource`. Spark loads every class listed
    in such files with Java's `ServiceLoader` and picks the one whose
    `shortName()` returns `"jdocs"`.

    Without the service file the short name fails at `load()`:

    ```text
    org.apache.spark.SparkClassNotFoundException: [DATA_SOURCE_NOT_FOUND] Failed to find the
    data source: jdocs. Make sure the provider name is correct and the package is properly
    registered and compatible with your Spark version. SQLSTATE: 42K02
    Caused by: java.lang.ClassNotFoundException: jdocs.DefaultSource
    ```

    The `Caused by` line shows the fallback: after the service lookup
    Spark tries the name as a class, then `<name>.DefaultSource`. So
    `format("jdocs.DocsSource")` (the full class name) works without
    any service file, and so would a class called
    `jdocs.DefaultSource`. Short names are for users; the class name is
    handy in tests.

    SQL uses the same lookup:

    ```python
    spark.sql(f"CREATE TEMPORARY VIEW images USING jdocs OPTIONS (path '{root}')")
    spark.sql("SELECT kind, count(*) AS files FROM images GROUP BY kind").show()
    ```

    ```text
    +-----+-----+
    | kind|files|
    +-----+-----+
    |image|    5|
    | text|    1|
    +-----+-----+
    ```

    (`root` is the absolute path of `data/messy/images`, which holds
    five PNGs and a `readme.txt`.)

