    ## The Read Path, Class by Class

    Every interface below is in
    `sql/catalyst/src/main/java/org/apache/spark/sql/connector/`
    (`catalog/` and `read/`), except `DataSourceRegister`, which lives
    in `org.apache.spark.sql.sources`.

    | Class in jdocs | Implements | Runs on | Called when |
    |---|---|---|---|
    | `DocsSource` | `TableProvider`, `DataSourceRegister` | driver | `load()`: `inferSchema`, then `getTable` |
    | `DocsTable` | `Table`, `SupportsRead` | driver | `load()` keeps it in a `DataSourceV2Relation` |
    | `DocsScanBuilder` | `ScanBuilder` + `SupportsPushDown*` | driver | optimization: `newScanBuilder`, pushdown, `build()` |
    | `DocsScan` | `Scan`, `Batch`, `SupportsReportStatistics` | driver | physical planning: `toBatch`, `planInputPartitions` |
    | `DocsPartition` | `InputPartition` (`Serializable`) | serialized into each task | |
    | `DocsReaderFactory` | `PartitionReaderFactory` (`Serializable`) | serialized to executors | once per task: `createReader` |
    | `DocsReader` | `PartitionReader<InternalRow>` | executor | `next()` / `get()` per row, then `close()` |

    The rule that turns the relation into a scan is
    `V2ScanRelationPushDown`
    (`sql/core/.../datasources/v2/V2ScanRelationPushDown.scala`). Its
    `apply` runs these steps in order in 4.2.0:

    ```scala
    createScanBuilder, pushDownSample, pushDownFilters, pushDownJoin,
    pushDownAggregates, pushDownVariants, pushDownLimitAndOffset,
    buildScanWithPushedAggregate, buildScanWithPushedJoin,
    buildScanWithPushedVariants, pruneColumns
    ```

    `createScanBuilder` calls `table.newScanBuilder(options)` for every
    scan, so each scan gets a **fresh** builder, and pushdown state kept
    in the builder and its `Scan` cannot leak. The 4.2.0 Python data
    source gets fresh builders too, but its builder stores the planned
    read on the provider, which every scan of the relation shares, so
    it leaks across queries and within one query ("From Wrong Results
    to a Fix: An Upstream Case Study" traces it).

