    ## The Rest of the Read API

    You will meet these in other connectors; all are in
    `connector/read/` in 4.2.0:

    - **`SupportsPushDownTopN`** (`ORDER BY ... LIMIT n`),
      **`SupportsPushDownOffset`** and **`SupportsPushDownTableSample`**:
      the same pattern as `pushLimit`. JDBC implements them so a
      database does the sorting.
    - **`SupportsPushDownJoin`** (`@since 4.1.0`): push a join of two
      scans of the same source into the source, for JDBC sources on the
      same database.
    - **`SupportsPushDownVariantExtractions`** (`@since 4.1.0`,
      `@Experimental`): receive the `variant_get` paths a query
      extracts, so a source can read only those fields ("VARIANT
      Shredding and Performance" explains why that matters).
    - **Columnar reads**: a `PartitionReaderFactory` whose
      `supportColumnarReads(partition)` returns `true` implements
      `createColumnarReader` and returns `ColumnarBatch`es. Parquet and
      ORC do this; it skips row-by-row work entirely.
    - **Custom metrics**: `Scan.supportedCustomMetrics()` declares
      metrics (`CustomSumMetric`, `CustomAvgMetric` in
      `connector/metric/`) and `PartitionReader.currentMetricsValues()`
      reports them per task. They appear on the scan node in the SQL
      tab of the Spark UI, which is how you would show "files opened" in
      production instead of a static counter.
    - **`SupportsPushDownFilters`**: the V1 filter version, still
      supported, and what Python sources use. Prefer V2 in new code; the
      javadoc of `SupportsPushDownV2Filters` notes V1 "is less
      efficient due to the internal -> external data conversion".

