    ## COUNT(*) Without Reading a File

    `SupportsPushDownAggregates` has two methods. Spark calls
    `supportCompletePushDown(agg)` first; if it returns `true` and
    `pushAggregation(agg)` accepts, Spark **removes its own Aggregate**
    and uses the scan's rows as the final answer. With `false`, a
    source can still return partial results (one count per partition)
    that Spark aggregates again.

    An `Aggregation` (a Java `record` in 4.2.0) has
    `aggregateExpressions()` (`CountStar`, `Count`, `Sum`, `Min`, `Max`,
    `Avg`, or `GeneralAggregateFunc`) and `groupByExpressions()`.
    `jdocs` accepts exactly one `CountStar`, with no grouping or
    grouped by `kind`, because the listing alone answers both. Its
    scan is a `LocalScan`, which returns `InternalRow[]` on the driver:

    ```java
    public class CountScan implements LocalScan {
      @Override public StructType readSchema() {        // grouping columns first, then aggregates
        StructType s = new StructType();
        if (byKind) s = s.add("kind", DataTypes.StringType, false);
        return s.add("count", DataTypes.LongType, false);
      }
      @Override public InternalRow[] rows() { ... }     // counted from the listing
    }
    ```

    ```python
    jdocs().groupBy("kind").count().explain()
    ```

    ```text
    == Physical Plan ==
    *(1) Project [kind#65, count#66L AS count(1)#62L AS count#54L]
    +- *(1) LocalTableScan [kind#65, count#66L]
    ```

    No `BatchScan`, no `HashAggregate`, no `Exchange`, no task: a
    `LocalTableScan` of the rows `CountScan` computed while planning.
    `count(*) WHERE kind = 'image'` works too, because the filter was
    fully pushed first. `sum(size)` is refused (`pushAggregation`
    returns `false`) and Spark plans a normal scan and aggregate.

    One subtlety: if `jdocs` had returned a predicate (for example an
    `IS_NOT_NULL` it did not need to return), a post-scan filter would
    remain and Spark would not even ask about the aggregate. Accepting
    predicates that are trivially true for your data is what keeps the
    rest of the pushdown chain open.

