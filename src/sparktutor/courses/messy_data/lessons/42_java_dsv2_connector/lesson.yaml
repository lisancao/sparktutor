    ## LIMIT, and the Order of Pushdown

    `SupportsPushDownLimit.pushLimit(int)` returns whether the source
    takes the limit; `isPartiallyPushed()` (default `true`) says whether
    Spark must apply it again. In `jdocs` one file is one row and every
    pushed filter is exact, so the scan can cut the listing to `n`
    files and say it is complete:

    ```text
    BatchScan jdocs[name#1] jdocs[files=3, pushed=[], limit=3] RuntimeFilters: []
    ```

    There is no `Limit` node left in the plan. Spark only pushes a
    limit when **no** filter remains to be evaluated after the scan
    (`pushDownLimit` matches `PhysicalOperation(_, Nil, ...)`): a limit
    applied before an unpushed filter would return too few rows. The
    same rule guards aggregates, and it is why the order on the
    previous page matters. Filters go first; whatever they leave behind
    decides whether aggregate and limit pushdown can happen at all.

