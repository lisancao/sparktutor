    ## When Each Method Runs

    In a classic session `load()` analyzes the plan right away, which
    calls `inferSchema` and `getTable`. The scan builder is not created
    until the plan is **optimized**, at the first action or `explain()`.
    That decides when your errors appear. `jdocs` checks its `path`
    option while listing, in `build()`:

    ```python
    df = spark.read.format("jdocs").option("path", "/nope").load()
    print("load() returned", df.columns)
    df.explain()
    ```

    ```text
    load() returned ['path', 'name', 'kind', 'size', 'modified', 'width', 'height']
    ...
    pyspark.errors.exceptions.captured.IllegalArgumentException: option 'path' must be an
    existing folder, got '/nope'
    ```

    `load()` succeeded and `explain()` failed. If you want bad options
    to fail at `load()`, check them in `getTable` (or `inferSchema`).
    Notice also that PySpark turned the Java
    `IllegalArgumentException` into its own `IllegalArgumentException`
    with the message intact. Spark's error classes (`[SOME_CLASS] ...`)
    need an entry in Spark's error registry, so a connector that throws
    standard Java exceptions with clear messages is doing the right
    thing.

