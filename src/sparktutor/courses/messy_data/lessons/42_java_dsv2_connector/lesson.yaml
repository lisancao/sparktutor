    ## Runtime Filters From a Join

    Dynamic partition pruning (DPP) lets a join pass the keys of its
    small, filtered side to the scan of the big side **while the query
    runs**. A DSv2 scan joins in by implementing
    `SupportsRuntimeV2Filtering`:

    ```java
    @Override public NamedReference[] filterAttributes() {
      return new NamedReference[] {Expressions.column("kind")};
    }
    @Override public void filter(Predicate[] predicates) {
      // drop the files whose kind cannot match, before planInputPartitions runs again
    }
    ```

    Joined with a small Parquet table filtered on `grp = 'media'`:

    ```text
    +- Project [kind#6, path#4, name#5, size#7L, modified#8, width#9, height#10, grp#3]
       +- BroadcastHashJoin [kind#6], [kind#2], Inner, BuildRight, false, false
          :- Project [path#4, name#5, kind#6, size#7L, modified#8, width#9, height#10]
          :  +- BatchScan jdocs[path#4, name#5, kind#6, size#7L, modified#8, width#9, height#10] jdocs[files=55, pushed=[]] RuntimeFilters: [dynamicpruningexpression(kind#6 IN dynamicpruning#19)]
          :        +- SubqueryAdaptiveBroadcast dynamicpruning#19, [0], true, Filter ((isnotnull(grp#3) AND (grp#3 = media)) AND isnotnull(kind#2)), [kind#2]
          :           +- AdaptiveSparkPlan isFinalPlan=false
    ```

    and inside `filter()` the scan received:

    ```text
    RUNTIME FILTER: [kind IN ('image', 'audio')]
    ```

    The conditions come from the `PartitionPruning` rule
    (`sql/core/.../dynamicpruning/PartitionPruning.scala`): the join key
    must be one of the `filterAttributes`, and the other side must
    contain a predicate that `isLikelySelective` accepts (a comparison,
    `IN`, `LIKE`; a bare boolean column such as `WHERE media` does not
    count). With the default
    `spark.sql.optimizer.dynamicPartitionPruning.reuseBroadcastOnly=true`
    the filter is only added when it can reuse the join's broadcast. In
    the runs for this lesson, a filtered in-memory `VALUES` table did
    not trigger it: the optimizer had already evaluated the filter
    into a `LocalTableScan`, leaving no `Filter` to find.

    4.2.0 adds `supportsIterativePushdown()` and `pushedPredicates()`
    to this interface (both `@since 4.2.0`), so Spark can push a second
    round of `PartitionPredicate`s. Leave them at their defaults unless
    your source has partition transforms.

