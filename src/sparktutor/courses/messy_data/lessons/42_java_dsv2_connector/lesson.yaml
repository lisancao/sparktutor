    ## Reporting Partitioning: Removing a Shuffle

    A `groupBy("kind")` normally needs an `Exchange` so that all rows of
    a kind meet in one task. If the source already put each kind in its
    own partition, it can say so: the scan implements
    `SupportsReportPartitioning` and returns a `KeyGroupedPartitioning`,
    and every partition implements `HasPartitionKey`.

    ```java
    @Override public Partitioning outputPartitioning() {
      return new KeyGroupedPartitioning(
          new Expression[] {Expressions.identity("kind")}, numberOfKinds);
    }

    public class KindPartition extends DocsPartition implements HasPartitionKey {
      @Override public InternalRow partitionKey() {
        return new GenericInternalRow(new Object[] {UTF8String.fromString(kind)});
      }
    }
    ```

    Here are both plans for `groupBy("kind").agg(sum("size"))`, first
    with the usual size-balanced partitions, then with an option that
    plans one partition per kind:

    ```text
    +- HashAggregate(keys=[kind#2], functions=[sum(size#3L)])
       +- Exchange hashpartitioning(kind#2, 200), ENSURE_REQUIREMENTS, [plan_id=13]
          +- HashAggregate(keys=[kind#2], functions=[partial_sum(size#3L)])
             +- Project [kind#2, size#3L]
                +- BatchScan jdocs[kind#2, size#3L] jdocs[files=55, pushed=[]] RuntimeFilters: []
    ```

    ```text
    +- HashAggregate(keys=[kind#22], functions=[sum(size#23L)])
       +- HashAggregate(keys=[kind#22], functions=[partial_sum(size#23L)])
          +- Project [kind#22, size#23L]
             +- BatchScan jdocs[kind#22, size#23L] jdocs[files=55, pushed=[]] RuntimeFilters: []
    ```

    The `Exchange` is gone. (`files=55` is the number of files in
    `data/messy` when this ran; the folder grows as the course adds
    data.) The same reporting lets two sources partitioned the same way
    join without a shuffle (storage-partitioned join, behind
    `spark.sql.sources.v2.bucketing.enabled`, `true` by default since
    3.3).

    The promise is yours to keep: the javadoc of `HasPartitionKey` says
    "Spark doesn't check this property". A partition that claims
    `kind = 'image'` and holds a PDF row gives wrong results with no
    error. Every partition must implement `HasPartitionKey`, or Spark
    cannot use the partitioning at all.

