  Output: |
    ## Summary

    - A DSv2 read goes `TableProvider` -> `Table` (`SupportsRead`) ->
      `ScanBuilder` -> `Scan` -> `Batch` -> `InputPartition`s and a
      `PartitionReaderFactory` -> `PartitionReader<InternalRow>`. The
      first four run on the driver; partitions and the factory are
      serialized into tasks.
    - `load()` calls `inferSchema` and `getTable`; the scan builder is
      created fresh for every optimization, at the first action or
      `explain()`, and that is when pushdown and `build()` run.
    - Short names come from `DataSourceRegister` plus a
      `META-INF/services` file; otherwise `DATA_SOURCE_NOT_FOUND`, and
      the full class name still works.
    - `InternalRow`s carry internal values: `UTF8String`, `int` days,
      `long` microseconds, `Decimal`, `ArrayData`. Wrong types fail in
      tasks with `ClassCastException`.
    - V2 `Predicate`s are richer than Python's filters (`OR`, functions,
      column comparisons); literals arrive as internal values; return
      everything you do not apply exactly.
    - Column pruning, `LIMIT` and `COUNT(*)` pushdown are Java-only in
      4.2.0. Limits and aggregates are pushed only when no filter is
      left after the scan. A `LocalScan` answers on the driver.
    - `description()` is the only pushdown information `explain()` shows
      for your scan.
    - Statistics feed join planning; `KeyGroupedPartitioning` removes
      shuffles (unchecked by Spark); `SupportsRuntimeV2Filtering`
      receives DPP filters at run time.
    - For real projects: Maven with `spark-sql_2.13:4.2.0` as
      `provided`, and a pinned `maven-compiler-plugin`.

    Next: **Catalyst Extensions: Rules and Native Functions**, where you
    stay in Java and change Spark's optimizer itself: a native
    expression, a rule that rewrites a Python UDF into it, and a check
    rule that rejects a bad query pattern.
