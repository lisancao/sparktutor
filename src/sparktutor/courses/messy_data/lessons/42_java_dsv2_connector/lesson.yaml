    ## Exercise: jdocs, the docs Source in Java

    The exercise file holds the whole connector as Java strings in a
    dict called `JAVA`: entry point, table, scan builder, scans, reader
    factory and reader, plus a counter class `Audit`. The harness
    compiles it, starts a local session with the jar, registers a small
    Python data source over the same folder, and compares the two.
    Complete three TODOs in the Java:

    1. **`Filters.accept(Predicate p)`**: take over `IS_NOT_NULL` on the
       never-null columns, `=` and `IN` on `kind` (string values), `=`
       and the four comparisons on `size`, and `ENDS_WITH` on `name`, by
       recording them with the helpers (`keepKinds`, `sizeTest`,
       `nameSuffixes`). Return `false` for everything else.
       `matches()` already applies what you record.
    2. **`DocsScanBuilder.answerable(Aggregation agg)`**: `true` for a
       single `CountStar` with no grouping, or grouped by the column
       `kind` only.
    3. **`DocsReader.next()`**: advance to the next file and build its
       `InternalRow` in the order of the read schema, with the internal
       types from the table above. Open a PNG only when `width` or
       `height` was asked for.

    The harness checks, in order: one row per file, identical to the
    Python source (types and values); a pruned scan output for
    `select("name", "size")` that opens no file; `kind = 'image'`
    pushed with no Spark `Filter` and only the PNGs opened; `IN`,
    `ENDS_WITH` and size ranges fully pushed with nothing opened;
    `width > 12` and an `OR` left to Spark with correct results;
    `COUNT(*)` answered by a `LocalTableScan` with nothing opened,
    `GROUP BY kind` counts, `sum(size)` refused; and `limit(3)` pushed.

    A `javac` error stops the script and prints the compiler's message
    with the file and line inside the temporary source folder.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "In accept(): switch (p.name()) { case \"IS_NOT_NULL\": return NEVER_NULL.contains(col); case \"=\": if (col.equals(\"kind\") && value(c[1]) instanceof String s) { keepKinds(Set.of(s)); return true; } return sizeTest(col, \"=\", c[1]); ... }. In next(): if (++i >= files.size()) return false; then fill values[c] with a switch on columns[c] and wrap them in new GenericInternalRow(values)."

- Class: text
