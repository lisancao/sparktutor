    ## What You'll Learn

    In the intermediate level you built `docs`, a Python data source
    that lists a folder and reads file headers ("Reading a Custom File
    Format, in Parallel"), and taught it to skip files with
    `pushFilters` ("Filter Pushdown"). "How Catalyst Plans Python"
    showed that a Python data source is planned by JVM classes
    (`PythonDataSourceV2`, `PythonScanBuilder`, `PythonScan`). Those
    classes implement Spark's Java connector API, **DataSource V2**
    (DSv2), and they implement only a small part of it.

    This lesson writes `jdocs`, the same source, directly against DSv2
    in Java. You compile it from inside a Python exercise, load it with
    `spark.jars`, and prove what it does with plans and counters read
    from the JVM. The Java side can do things the Python API cannot:
    prune columns, answer `COUNT(*)` without a task, push `LIMIT`,
    accept `OR` and function predicates, report statistics and
    partitioning to the optimizer, and take runtime filters from a join.

    By the end of this lesson you will be able to:

    - Name every class on the DSv2 read path in Spark 4.2.0 and say
      where each one runs (driver or executor) and when (load, optimize
      or execute)
    - Register a source by short name with `DataSourceRegister` and a
      `META-INF/services` file, and read `DATA_SOURCE_NOT_FOUND`
    - Produce `InternalRow`s with Spark's internal value types
      (`UTF8String`, microseconds, `null`)
    - Implement `SupportsPushDownV2Filters` with the `Predicate` API,
      `SupportsPushDownRequiredColumns`, `SupportsPushDownLimit` and
      `SupportsPushDownAggregates`, and check each one in `explain()`
    - Report `Statistics` and `KeyGroupedPartitioning`, and see Spark
      drop an `Exchange` because of it
    - Receive dynamic partition pruning filters with
      `SupportsRuntimeV2Filtering`
    - Build the same connector with Maven for a real project

