    ## Pipeline Architecture

    ```
    Raw CSV (trips, drivers, ratings)
         ↓
    Read with explicit schemas (Lesson 3, 5)
         ↓
    Enrich trips (time_bucket, fare_per_mile) (Lesson 4)
         ↓
    Join trips + drivers + ratings (Lesson 7)
         ↓
    City dashboard + Driver profiles (Lesson 6, 7)
         ↓
    Rank top drivers per city (Lesson 8)
         ↓
    Write Parquet (Lesson 5) + Cache for reuse (Lesson 11)
    ```

    Each stage uses patterns from prior lessons. The capstone
    exercise implements this full pipeline.

- Class: text
  Depth: all
  Output: |
    ## Error Handling and Validation

    In production, add:
    - **Schema validation** — reject rows that don't match the schema
    - **Null checks** — filter or fill nulls in critical columns
    - **Date range validation** — ensure pickup_time is reasonable
    - **Idempotent writes** — overwrite mode or merge for reruns

    For the capstone, we keep it simple: assume valid input. In a
    real system, you would add checks and log bad rows to a dead-letter
    path.

- Class: text
  Depth: intermediate
  Output: |
    ## Assembling the Outputs

    The platform produces:
    1. **Cleaned trips** — Parquet, partitioned by date
    2. **City dashboard** — trips per day, avg fare, peak hour
    3. **Driver profiles** — total trips, total fare, avg rating
    4. **Top performers** — drivers ranked by earnings per city

    These feed dashboards, reports, and downstream ML models. The
    capstone exercise builds all four from the same source data.

