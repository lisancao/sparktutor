- Class: script
  Depth: all
  Output: |
    ## Exercise: Full End-to-End Platform

    Implement `run_analytics_platform` that:
    1. Creates a tuned SparkSession (shuffle partitions=8)
    2. Reads trips, drivers, ratings from CSV paths (with schemas from Lesson 3)
    3. Enriches trips with time_bucket and fare_per_mile (Lesson 4)
    4. Joins trips with drivers (broadcast) and ratings (Lesson 7)
    5. Caches the joined DataFrame
    6. Builds: (a) city_dashboard (trips per day, avg fare per city),
       (b) driver_profiles (total_trips, total_fare, avg_rating per driver),
       (c) top_drivers (rank drivers by total_fare within city, filter rank<=3)
    7. Writes city_dashboard and driver_profiles to Parquet (overwrite)
    8. Unpersists the cache
    9. Returns (city_dashboard, driver_profiles, top_drivers)

    This is the complete platform. Use patterns from Lessons 1-11.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "Chain: read with schema, enrich, join (broadcast drivers), cache. Build 3 outputs. Write 2 to Parquet. Unpersist. Return all 3."

