    ## Beyond GroupBy: Per-Row Context

    Aggregations (Lesson 6) collapse rows into groups. Sometimes you need
    to compute a value for each row while seeing other rows in its
    partition — e.g., "rank drivers by earnings per city" or "7-day moving
    average of trip counts". **Window functions** give you that: they
    operate on a window of rows (partition + order + frame) and produce
    one value per row.

- Class: text
  Depth: all
  Output: |
    ## The Window Spec: partitionBy + orderBy + frame

    A window is defined by:

    ```python
    from pyspark.sql.window import Window

    w = Window.partitionBy("city").orderBy(f.col("total_fare").desc())
    df.withColumn("rank", f.row_number().over(w))
    ```

    - **partitionBy** — group rows (like groupBy, but no collapse)
    - **orderBy** — order within each partition
    - **frame** (optional) — which rows to include (e.g., "current row
      and 6 preceding" for 7-day moving avg). Default: unbounded
      preceding to current row for ranking functions.

- Class: text
  Depth: all
  Output: |
    ## Ranking: row_number, rank, dense_rank

    - **row_number** — unique rank 1,2,3,... (ties get arbitrary order)
    - **rank** — ties get same rank, next rank has gaps (1,2,2,4)
    - **dense_rank** — ties get same rank, no gaps (1,2,2,3)

    For "top 5 drivers per city", use row_number and filter rank <= 5.
    For "percentile within city", dense_rank is often cleaner.

- Class: text
  Depth: intermediate
  Output: |
    ## Aggregation Windows: Running Totals, Moving Averages

    Use sum, avg, etc. over a window:

    ```python
    w = Window.partitionBy("city").orderBy("date")
    df.withColumn("running_trips", f.sum("trips").over(w))

    w_ma = Window.partitionBy("city").orderBy("date").rowsBetween(-6, 0)
    df.withColumn("trips_7d_ma", f.avg("trips").over(w_ma))
    ```

    `rowsBetween(-6, 0)` means current row and 6 preceding. For moving
    average you need enough preceding rows; handle boundaries (e.g.,
    first 6 days) — avg over fewer rows or null.

- Class: text
  Depth: all
  Output: |
    ## Lead and Lag: Sequential Analysis

    **lag** — value from a previous row. **lead** — value from a next row.

    ```python
    w = Window.partitionBy("driver_id").orderBy("pickup_time")
    df.withColumn("prev_fare", f.lag("fare", 1).over(w))
    df.withColumn("next_fare", f.lead("fare", 1).over(w))
    ```

    Useful for "trip-to-trip" analysis: fare change, time gap between
    trips. Default offset 1; use 2, 3, etc. for further back/forward.

