    ## 7-Day Moving Average: Handling Boundaries

    For a 7-day moving average, the first 6 rows in each partition have
    fewer than 7 preceding rows. Spark's avg over rowsBetween(-6,0)
    computes the average of available rows (e.g., first row gets just
    itself). That's often acceptable. For strict "only when 7 values
    exist", use a conditional or filter.

