    ## Distance Categories and Enrichment Patterns

    For the ride-sharing platform, common enrichments:

    - **distance_category**: short (<3 mi), medium (3-10), long (>10)
    - **time_of_day**: morning_rush (6-9), midday (9-17), evening_rush (17-20), late_night
    - **surge_flag**: true when fare/distance is unusually high

    These become dimensions for dashboards (Lesson 6) and inputs to window
    functions (Lesson 8). Define them once in a silver layer; reuse everywhere.

