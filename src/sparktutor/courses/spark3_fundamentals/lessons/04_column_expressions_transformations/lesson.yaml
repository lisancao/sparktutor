- Class: cmd_question
  Depth: all
  Output: |
    Given a DataFrame with columns fare and distance_miles, write a
    withColumn that adds is_surge_pricing (True when fare > 15 and
    distance_miles < 5, else False).
  CorrectAnswer: |
    from pyspark.sql import functions as f

    result = df.withColumn("is_surge_pricing",
        (f.col("fare") > 15) & (f.col("distance_miles") < 5))
  Hint: "Combine two conditions with & for AND. The result is a boolean column."

