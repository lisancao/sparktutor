    ## Three Ways to Reference Columns

    Spark gives you three equivalent ways to build column expressions:

    ```python
    from pyspark.sql import functions as f

    df.select(f.col("fare") * 2)
    df.select(df["fare"] * 2)
    df.select(f.expr("fare * 2"))
    ```

    - **col("name")** — type-safe, works with autocomplete. Use for
      DataFrame API style.
    - **df["name"]** — bracket notation. Shorter, but no autocomplete.
    - **expr("SQL expression")** — full SQL syntax. Use for complex
      expressions: `f.expr("CASE WHEN fare > 20 THEN 'premium' ELSE 'standard' END")`

    All produce the same logical plan. Choose based on readability.

