    ## User-Defined Expressions with expr()

    When the built-in functions are cumbersome, `f.expr()` lets you write
    SQL-style expressions:

    ```python
    df.withColumn("fare_per_mile", f.expr("fare / distance_miles"))
    df.withColumn("is_surge", f.expr("fare > 15 AND distance_miles < 3"))
    ```

    Useful for complex formulas, nested CASE statements, or when you are
    more comfortable with SQL than the DataFrame API.

