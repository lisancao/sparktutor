    ## String, Date, and Math Functions

    The `f` module provides hundreds of functions:

    - **String**: `f.upper`, `f.lower`, `f.substring`, `f.split`, `f.regexp_extract`
    - **Date**: `f.to_timestamp`, `f.date_format`, `f.hour`, `f.dayofweek`
    - **Math**: `f.round`, `f.abs`, `f.sqrt`, `f.log`

    For time-of-day buckets from a timestamp string:

    ```python
    df.withColumn("pickup_ts", f.to_timestamp("pickup_time"))
      .withColumn("hour", f.hour("pickup_ts"))
      .withColumn("time_bucket",
          f.when(f.col("hour").between(6, 9), "morning_rush")
          .when(f.col("hour").between(17, 20), "evening_rush")
          .otherwise("off_peak"))
    ```

