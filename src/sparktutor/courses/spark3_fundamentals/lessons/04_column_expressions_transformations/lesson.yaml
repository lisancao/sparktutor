    ## when/otherwise: Conditional Logic

    For ride-sharing, you need conditional logic: surge pricing, distance
    categories, time-of-day buckets. Use `f.when()` and `f.otherwise()`:

    ```python
    from pyspark.sql import functions as f

    df.withColumn("fare_tier",
        f.when(f.col("fare") >= 20, "premium")
        .when(f.col("fare") >= 10, "standard")
        .otherwise("budget"))
    ```

    This is equivalent to SQL `CASE WHEN ... THEN ... ELSE ... END`.
    Chain multiple `.when()` for multiple conditions; `.otherwise()` is
    the default.

