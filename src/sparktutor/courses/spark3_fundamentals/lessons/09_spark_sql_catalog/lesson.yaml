    ## What You'll Learn

    You have been working entirely with the DataFrame API — Python method
    calls on DataFrame objects. But Spark has a second interface for the
    exact same engine: **SQL**. Every DataFrame query you have written so
    far can be expressed as a SQL string, and vice versa.

    In this lesson you will bridge these two worlds by building a SQL-based
    reporting layer on top of the ride-sharing DataFrames from prior
    lessons.

    By the end of this lesson you will be able to:

    - Register DataFrames as temporary views
    - Write complex SQL queries with `spark.sql()`
    - Mix SQL and DataFrame API in the same pipeline
    - Create and use UDFs (User-Defined Functions)
    - Understand why SQL and DataFrames produce the same execution plan

