    ## Temporary Views: Making DataFrames Queryable with SQL

    To query a DataFrame with SQL, you first register it as a **view**:

    ```python
    trips_df.createOrReplaceTempView("trips")
    drivers_df.createOrReplaceTempView("drivers")

    result = spark.sql("""
        SELECT driver_id, COUNT(*) AS trip_count
        FROM trips
        GROUP BY driver_id
        ORDER BY trip_count DESC
    """)
    ```

    `createOrReplaceTempView` creates a session-scoped view — visible only
    within the current SparkSession. If you call it again with the same
    name, it replaces the old view. This is safe for iterative development
    and pipeline steps that re-run.

    For application-wide visibility across sessions, use
    `createOrReplaceGlobalTempView` and reference it as
    `global_temp.view_name`.

- Class: text
  Depth: beginner
  Output: |
    Think of views as **aliases**. When you register `trips_df` as the
    view `"trips"`, you are telling Spark: "whenever someone writes
    `FROM trips` in SQL, use this DataFrame." The data is not copied or
    moved — the view is just a named reference to the DataFrame's
    logical plan.

    This is exactly how database views work. The SQL engine resolves
    the name, finds the plan, and optimizes the whole query together.

