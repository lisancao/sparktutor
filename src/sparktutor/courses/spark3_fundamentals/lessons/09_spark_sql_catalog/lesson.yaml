    ## Catalog API: Inspecting Your Data

    The `spark.catalog` namespace lets you explore registered tables,
    views, functions, and databases programmatically:

    ```python
    spark.catalog.listTables()       # all tables and views
    spark.catalog.listColumns("trips")  # columns in a table/view
    spark.catalog.tableExists("trips")  # check if registered
    spark.catalog.dropTempView("trips") # remove a view
    ```

    This is useful for dynamic pipelines where you need to check what
    data is available at runtime, or for cleanup after processing.

