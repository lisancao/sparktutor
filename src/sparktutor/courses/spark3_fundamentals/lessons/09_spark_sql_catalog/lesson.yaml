    ## User-Defined Functions (UDFs)

    When Spark's built-in functions are not enough, you can define custom
    logic with UDFs:

    ```python
    from pyspark.sql.types import StringType

    @f.udf(StringType())
    def fare_category(fare):
        if fare is None:
            return "unknown"
        if fare < 10:
            return "budget"
        elif fare < 30:
            return "standard"
        else:
            return "premium"

    trips_df.withColumn("fare_tier", fare_category(f.col("fare")))
    ```

    **Warning**: UDFs serialize data to Python, process it row by row,
    and send it back. This disables Tungsten's optimized memory layout
    and Catalyst's expression optimization. A UDF can be 10-100x slower
    than the equivalent built-in expression.

    **Rule**: always try to express logic with built-in functions first.
    Use `f.when().otherwise()` chains before reaching for a UDF.

- Class: text
  Depth: advanced
  Output: |
    ## Why UDFs Kill Performance

    Spark's execution engine (Tungsten) stores data in off-heap binary
    format optimized for CPU cache lines. When you call a UDF:

    1. Each row is **deserialized** from Tungsten format to a Python object
    2. The Python function runs on the object
    3. The result is **serialized** back to Tungsten format

    This serialization round-trip happens for **every row**. On a 100M
    row DataFrame, that is 100M serialize/deserialize cycles.

    Additionally, Catalyst cannot see inside a UDF — it cannot push
    predicates through it, fold constants, or reorder operations. The
    UDF is an opaque black box in the query plan.

    Pandas UDFs (vectorized UDFs) improve this by processing batches of
    rows as pandas Series, reducing serialization overhead by ~10x. But
    built-in functions are still faster.

