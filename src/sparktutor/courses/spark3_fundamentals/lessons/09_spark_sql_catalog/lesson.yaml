    ## Registering UDFs for SQL

    To use a UDF in SQL queries, register it with `spark.udf.register`:

    ```python
    def fare_category(fare):
        if fare is None:
            return "unknown"
        if fare < 10:
            return "budget"
        elif fare < 30:
            return "standard"
        else:
            return "premium"

    spark.udf.register("fare_category", fare_category, StringType())

    spark.sql("""
        SELECT trip_id, fare, fare_category(fare) AS tier
        FROM trips
    """)
    ```

    Registered UDFs are available in all SQL queries for the session.
    The same performance caveats apply — this is still a Python UDF
    behind the scenes.

