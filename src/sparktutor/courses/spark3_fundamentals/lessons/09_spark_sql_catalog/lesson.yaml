    ## Summary

    In this lesson you learned:

    - **Temporary views** — register DataFrames with
      `createOrReplaceTempView` to query them with SQL
    - **SQL + DataFrame API** — both produce the same execution plan;
      mix them freely in your pipelines
    - **Complex SQL** — multi-table joins and subqueries are often
      more readable as SQL than chained DataFrame methods
    - **UDFs** — custom Python functions for logic not covered by
      built-ins, with significant performance trade-offs
    - **Catalog API** — programmatically inspect and manage views

    You now have two complementary interfaces to the same engine. In
    the next lesson, you will look under the hood at the **query plan**
    — the execution strategy Spark builds from your code.
