    ## SQL + DataFrame API: Same Engine, Different Syntax

    A critical insight: **SQL and the DataFrame API produce the same
    execution plan.** The Catalyst optimizer does not care which syntax
    you used — it receives a logical plan either way.

    This means you can freely mix them:

    ```python
    trips_df.createOrReplaceTempView("trips")

    top_cities = spark.sql("""
        SELECT city, SUM(fare) AS total_revenue
        FROM trips
        GROUP BY city
    """)

    top_cities.filter(f.col("total_revenue") > 1000).show()
    ```

    The SQL query produces a DataFrame. You can chain DataFrame methods
    on it. Going the other direction, you can register a filtered
    DataFrame as a view and query it with SQL. Choose whichever is more
    readable for each part of your pipeline.

