    ## Complex SQL Queries

    SQL shines for multi-table joins and subqueries that would be verbose
    in the DataFrame API:

    ```python
    spark.sql("""
        SELECT t.driver_id, d.name,
               COUNT(*) AS total_trips,
               SUM(t.fare) AS total_fare,
               AVG(r.rating) AS avg_rating
        FROM trips t
        JOIN drivers d ON t.driver_id = d.driver_id
        LEFT JOIN ratings r ON t.trip_id = r.trip_id
        GROUP BY t.driver_id, d.name
        ORDER BY total_fare DESC
    """)
    ```

    This three-table join with aggregation is readable as SQL. The
    equivalent DataFrame code would require `.join()` twice, then
    `.groupBy().agg()`, then `.orderBy()` — functional but longer.

    Neither approach is universally better. Use SQL for ad-hoc analysis
    and complex joins. Use the DataFrame API for programmatic pipelines
    where you build queries dynamically.

