  Output: |
    Write two versions of a query: (A) filter trips by city then join
    with drivers, (B) join first then filter. Call explain(True) on both
    and describe which might be more efficient (conceptually).
  CorrectAnswer: |
    plan_a = trips_df.filter(f.col("city") == "SF").join(drivers_df, "driver_id")
    plan_b = trips_df.join(drivers_df, "driver_id").filter(f.col("city") == "SF")
    plan_a.explain(True)
    plan_b.explain(True)
  Hint: "Filter-then-join typically reduces data before the expensive join. Catalyst may optimize B to match A."

