  Output: |
    ## Comparing Plans: Same Query, Different Writes

    Two equivalent queries can produce different plans. Example: filter
    before join vs. after join. Catalyst often pushes the filter down
    anyway, but not always. Use explain() to verify. The more selective
    filter is applied first, the less data flows through the pipeline.

- Class: cmd_question
