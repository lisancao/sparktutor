    ## What Spark Does Behind the Scenes

    You have written transformations, joins, and aggregations. Spark
    converts them into an execution plan. Understanding that plan helps
    you write faster code and debug performance. This lesson covers
    explain(), the Catalyst optimizer, and Adaptive Query Execution.

- Class: text
  Depth: all
  Output: |
    ## explain(): Reading Logical and Physical Plans

    Call `df.explain()` or `df.explain(True)` to see the plan:

    ```python
    df.filter(f.col("city") == "SF").groupBy("date").agg(f.sum("fare")).explain()
    ```

    - **Logical plan** — what you asked for (filter, aggregate)
    - **Physical plan** — how Spark will run it (Exchange for shuffle,
      HashAggregate, etc.)

    Look for: Exchange (shuffle), number of partitions, BroadcastHashJoin
    (good for small tables), SortMergeJoin (default for large tables).

- Class: text
  Depth: all
  Output: |
    ## Catalyst Optimizer: What It Does for You

    Catalyst rewrites your logical plan before execution:

    - **Predicate pushdown** — push filters down to the data source.
      Reading Parquet with `WHERE city = 'SF'` can skip entire row groups.
    - **Column pruning** — only read columns you use. Parquet benefits
      greatly (columnar format).
    - **Join reordering** — put the smaller table on the build side
      when possible.
    - **Constant folding** — evaluate constant expressions at plan time.

    You get these optimizations for free. Writing clear, filter-early
    code helps Catalyst do its job.

- Class: text
  Depth: intermediate
  Output: |
    ## Adaptive Query Execution (AQE)

    Spark 3.0+ includes AQE — runtime re-optimization:

    - **Coalesce partitions** — reduce excessive partitions after a
      shuffle (e.g., 200 → 8 when data is small).
    - **Convert sort-merge join to broadcast** — if the build side
      turns out small at runtime, switch to broadcast.
    - **Optimize skew joins** — split skewed partitions.

    Enable with `spark.sql.adaptive.enabled=true` (default in Spark 3).
    AQE fixes many "wrong partition count" and "skew" issues automatically.

