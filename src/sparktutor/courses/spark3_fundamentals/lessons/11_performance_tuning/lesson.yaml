    ## Making the Platform Fast

    The ride-sharing analytics platform is complete. Now we make it
    performant. Slow pipelines waste money and delay insights. This
    lesson covers the tuning process: Spark UI, skew, shuffles,
    partitions, and caching. You will take a deliberately slow
    pipeline and optimize it.

- Class: text
  Depth: all
  Output: |
    ## The Tuning Process: Spark UI → Skew → Shuffles → Partitions → Caching

    1. **Spark UI** — identify slow stages, tasks that run much longer
       than others (skew), and where time is spent (read, shuffle, compute).
    2. **Skew** — one partition has way more data. Fix with salting
       (Lesson 7), or repartition by a different key.
    3. **Shuffles** — minimize them. Filter early, avoid unnecessary
       groupBys, use broadcast for small joins.
    4. **Partitions** — too many = overhead; too few = underutilization.
       Rule of thumb: 2-4x number of cores. For shuffle output,
       `spark.sql.shuffle.partitions` (default 200) is often too high
       for small data.
    5. **Caching** — when a DataFrame is reused, cache it. But cache
       has cost (memory); use only when the same data is read multiple
       times.

- Class: text
  Depth: all
  Output: |
    ## Key Configs

    - **spark.sql.shuffle.partitions** — partitions after shuffle.
      Default 200. For development/small data, set to 8-16.
    - **spark.executor.memory** — RAM per executor. Increase for
      memory-intensive workloads.
    - **spark.sql.autoBroadcastJoinThreshold** — max size (bytes) for
      auto-broadcast. Default 10MB. Increase to broadcast larger tables.

- Class: text
  Depth: intermediate
  Output: |
    ## repartition vs coalesce

    - **repartition(n)** — shuffle data into n partitions. Use when
      increasing partitions or changing distribution.
    - **coalesce(n)** — reduce to n partitions without full shuffle.
      Merges partitions (no data movement across executors). Use when
      reducing partition count (e.g., before writing a small result).

    repartition(8) before a chain of narrow transformations spreads
    work. coalesce(1) before write.parquet() avoids many small files.

- Class: text
  Depth: all
  Output: |
    ## Caching Strategy

    **When to cache**: DataFrame used 2+ times in the same job (e.g.,
    base trips table joined with drivers, then with ratings, then
    aggregated). Cache the base after it is fully built.

    **When not to cache**: One-time use, or when memory is tight.
    Caching evicts other data; can cause recomputation elsewhere.

    **Storage levels**: `cache()` = MEMORY_AND_DISK. `persist(StorageLevel.MEMORY_ONLY)` for
    smaller datasets. `unpersist()` when done to free memory.

- Class: mult_question
  Depth: all
  Output: "When should you use coalesce instead of repartition?"
  AnswerChoices: "When increasing partitions;When reducing partitions without a full shuffle;When sorting data;When joining"
  CorrectAnswer: "When reducing partitions without a full shuffle"
  Hint: "Coalesce merges partitions on the same executor — no shuffle. Repartition always shuffles."

