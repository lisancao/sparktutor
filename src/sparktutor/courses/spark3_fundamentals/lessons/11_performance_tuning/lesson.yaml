    ## Optimizing the Ride-Sharing Pipeline

    For our platform: (1) Read Parquet with schema, filter by date early.
    (2) Broadcast drivers and ratings (small tables). (3) Set
    shuffle.partitions to match data size. (4) Cache the enriched
    trips DataFrame if it feeds multiple aggregations. (5) Coalesce
    before writing small outputs to avoid many small files.

