  Depth: all
  Output: |
    ## CSV, JSON, Parquet, ORC: When to Use Each

    - **CSV**: Human-readable, universal. Use for raw ingestion, exports.
      Slow for analytics (no column pruning, full scan).
    - **JSON**: Semi-structured, good for APIs. Similar tradeoffs to CSV.
    - **Parquet**: Columnar, compressed. Spark's preferred format. Fast
      reads (column pruning), small files. Use for processed/silver data.
    - **ORC**: Like Parquet, popular in Hive. Slightly different compression.

    For our platform: CSV for raw trip logs, Parquet for cleaned data
    that Lesson 6 and 7 will consume.

- Class: text
  Depth: beginner
  Output: |
    ## Performance Comparison (Conceptual)

    Reading 1GB of trip data:
    - CSV with inferSchema: ~2x read (two passes) + full scan
    - CSV with explicit schema: 1 pass, but still full scan
    - Parquet: Columnar read — only requested columns are read. 5-10x
      faster for typical analytical queries.

    Writing: Parquet compresses well (often 5-10x smaller than CSV).
    Partitioning (next section) makes reads even faster when you filter
    by partition columns.

- Class: text
  Depth: all
  Output: |
    ## DataFrameWriter: Modes and Partitioning

    ```python
    (df.write
        .format("parquet")
        .mode("overwrite")
        .partitionBy("city", "date")
        .save("/path/to/output/"))
    ```

    **Modes**:
    - `error` (default) — fail if path exists
    - `overwrite` — replace existing data
    - `append` — add to existing (use with care for partitioned data)
    - `ignore` — do nothing if path exists

    **partitionBy** — creates subdirectories (e.g., city=SF/date=2024-01-15/).
    Reads that filter by city and date can skip entire partitions.

