    ## Partitioning Output by Date and Region

    For ride-sharing analytics, partitioning by date lets you process
    incremental data (e.g., only yesterday's trips). Partitioning by
    city supports regional dashboards. Combine both:

    ```python
    df.write.mode("overwrite").partitionBy("date", "city").parquet("/output/")
    ```

    The directory structure becomes date=2024-01-15/city=SF/, etc. A
    query filtering `WHERE date = '2024-01-15'` skips all other date
    partitions — partition pruning.

