    ## DataFrameReader: format → options → schema → load

    The read API follows a consistent pattern:

    ```python
    df = (spark.read
        .format("csv")
        .option("header", "true")
        .option("sep", ",")
        .schema(trips_schema)
        .load("/path/to/trips/"))
    ```

    - **format** — csv, json, parquet, orc
    - **option** — format-specific settings (header, sep, nullValue for CSV)
    - **schema** — use the StructType from Lesson 3; avoids inferSchema
    - **load** — path to file or directory (supports globs)

    Order matters: options before schema, schema before load.

