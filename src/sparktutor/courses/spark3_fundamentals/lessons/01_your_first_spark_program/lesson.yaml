    ## The Ride-Sharing Analytics Platform

    Over the next 12 lessons, you will build a complete **ride-sharing analytics
    platform** — the kind of system that powers companies like Uber and Lyft.
    Your data includes trips, drivers, riders, payments, and ratings. Every lesson
    adds a real capability to this platform. By the capstone, you will have a
    working end-to-end pipeline.

    This first lesson gets you from zero to your first Spark program. You will
    create a SparkSession, build a DataFrame from trip data, and understand
    why Spark's lazy evaluation model matters.

