    ## SparkSession: The Entry Point

    Every Spark program starts with a **SparkSession**. It is the gateway to
    DataFrames, SQL, and the catalog. You create one using the **builder pattern**:

    ```python
    from pyspark.sql import SparkSession

    spark = (SparkSession.builder
        .appName("RideShareAnalytics")
        .master("local[*]")
        .getOrCreate())
    ```

    - `appName` — identifies your application in the Spark UI
    - `master("local[*]")` — run locally using all CPU cores (for development)
    - `getOrCreate()` — creates a new session or returns the existing one

    For production, you would set `master` to a cluster URL (e.g., `spark://host:7077`).

