    ## Why Distributed Computing Exists

    Imagine your ride-sharing company stores 10 billion trip records. A single
    machine cannot hold that data in memory. Even if it could, processing it
    sequentially would take days. **Distributed computing** splits the work
    across many machines. Each machine processes its slice in parallel. What
    would take one machine a week might take 100 machines a few hours.

    Apache Spark is built for exactly this: processing data that does not fit
    on one machine, across a cluster of machines, with a simple programming
    model. You write transformations; Spark figures out how to run them in
    parallel.

- Class: text
  Depth: beginner
