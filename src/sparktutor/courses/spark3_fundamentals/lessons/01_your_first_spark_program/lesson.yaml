    ## Actions vs Transformations: The Lazy Evaluation Model

    Spark uses **lazy evaluation**. When you call `select()`, `filter()`, or
    `withColumn()`, Spark does *not* execute immediately. It builds a **logical
    plan** — a recipe for what to compute. Nothing runs until you call an
    **action** — a method that produces a result or side effect.

    **Transformations** (lazy): `select`, `filter`, `withColumn`, `groupBy`, `join`
    **Actions** (eager): `show()`, `count()`, `collect()`, `write`

    Why lazy? Spark can analyze the entire plan, optimize it (e.g., push filters
    down to the data source), and execute it in one shot. If you called
    `count()` and then `show()`, Spark would run the plan twice. Lazy
    evaluation lets it fuse operations and run once.

