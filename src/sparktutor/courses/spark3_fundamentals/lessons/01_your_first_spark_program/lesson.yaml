    ## Your First DataFrame: Trip Data

    Let's create a DataFrame from Python data representing ride-sharing trips.
    Each row is one trip: city, rider_id, fare, distance_miles, and timestamp.

    ```python
    trips_data = [
        ("SF", "r1", 12.50, 5.2, "2024-01-15 08:30:00"),
        ("NYC", "r2", 22.00, 8.1, "2024-01-15 09:15:00"),
        ("SF", "r3", 8.75, 3.0, "2024-01-15 10:00:00"),
        ("LA", "r1", 15.00, 6.5, "2024-01-15 11:00:00"),
    ]
    columns = ["city", "rider_id", "fare", "distance_miles", "pickup_time"]

    trips_df = spark.createDataFrame(trips_data, columns)
    trips_df.show()
    ```

    `createDataFrame` turns Python structures into a distributed DataFrame.
    The data is partitioned across executors; you work with it as one logical
    table.

