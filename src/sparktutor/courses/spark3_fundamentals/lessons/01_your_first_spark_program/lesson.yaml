    ## Analogy: The Trip Coordinator

    Think of Spark like a ride-sharing operations center:

    - The **Driver** is the **dispatcher** — it receives your program (the
      "order"), plans which workers handle which data, and coordinates the
      result. It does not process trip records itself.
    - **Executors** are the **field analysts** — each one processes its
      assigned chunk of trips (filtering, aggregating, joining). They work
      in parallel across the cluster.
    - When you ask "how many trips per city?", the dispatcher breaks the
      question into tasks and sends them to analysts. Each analyst counts
      their partition; results are combined and returned.

