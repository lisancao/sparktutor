    ## Counting Rides per City

    To answer "how many trips per city?", you chain transformations and finish
    with an action:

    ```python
    from pyspark.sql import functions as f

    trips_per_city = (trips_df
        .groupBy("city")
        .agg(f.count("*").alias("trip_count"))
        .orderBy(f.col("trip_count").desc()))

    trips_per_city.show()
    ```

    - `groupBy("city")` — groups rows by city
    - `agg(f.count("*").alias("trip_count"))` — counts rows per group
    - `orderBy(f.col("trip_count").desc())` — sorts by count descending

    The `show()` at the end is the action that triggers execution.

- Class: text
  Depth: advanced
  Output: |
    ## What Happens When You Call an Action

    When you call `show()` or `count()`, Spark's execution engine kicks in:

    1. **DAG Scheduler** — converts your logical plan into a Directed Acyclic
       Graph (DAG) of stages. Stages are separated at **shuffle boundaries** —
       points where data must be redistributed (e.g., after `groupBy`).

    2. **Task Scheduler** — creates one task per partition per stage. Tasks
       run in parallel on executors.

    3. **Shuffle** — for `groupBy`, rows with the same key (city) must end up
       on the same partition. Spark shuffles data across the network. This is
       the most expensive operation; we will learn to optimize it later.

