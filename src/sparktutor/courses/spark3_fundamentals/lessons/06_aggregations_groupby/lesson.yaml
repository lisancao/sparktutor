    Implement `city_dashboard` that takes a trips DataFrame (from Lesson 5
    Parquet: city, date, fare, distance_miles, and optionally time_bucket
    if enriched) and returns a DataFrame with:
    - city
    - trips_per_day (avg trips per date for that city)
    - avg_fare
