- Class: text
  Depth: all
  Output: |
    ## groupBy + agg: The Fundamental Pattern

    Every aggregation in Spark follows the same pattern:

    ```python
    df.groupBy("city").agg(f.count("*").alias("trip_count"))
    df.groupBy("city", "date").agg(
        f.count("*").alias("trips"),
        f.avg("fare").alias("avg_fare"),
        f.sum("distance_miles").alias("total_miles"))
    ```

    - **groupBy** — partition rows by unique values of the key columns
    - **agg** — apply aggregate functions to each group. Multiple aggs
      in one call are more efficient than multiple groupBys.

- Class: text
  Depth: all
  Output: |
    ## Built-in Aggregate Functions

    - **count**, **countDistinct** — number of rows, unique values
    - **sum**, **avg** — totals and averages
    - **min**, **max** — extremes
    - **first**, **last** — first/last value in group (order-dependent)

    For ride-sharing: count trips, avg fare, sum distance, countDistinct
    riders/drivers. Use alias() to name output columns for clarity.

- Class: text
  Depth: intermediate
  Output: |
    ## Pivot Tables: Reshaping Data

    Sometimes you want columns to become rows, or vice versa. **pivot**
    reshapes:

    ```python
    df.groupBy("city").pivot("time_bucket").agg(f.count("*"))
    ```

    Produces columns like city, morning_rush, evening_rush, off_peak —
    one column per pivot value. Useful for dashboards that need
    cross-tabulated metrics.

- Class: text
  Depth: all
  Output: |
    ## cube and rollup: Multi-Dimensional Aggregations

    **cube** produces aggregations for all combinations of grouping
    columns (including grand total). **rollup** produces hierarchical
    subtotals (e.g., by city, then by city+date, then total).

    ```python
    df.cube("city", "date").agg(f.count("*").alias("trips"))
    df.rollup("city", "date").agg(f.count("*").alias("trips"))
    ```

    Use when you need multiple levels of aggregation in one pass.

