    ## Peak Hours and Dashboard Metrics

    For the city dashboard, we want:
    - Trips per day per city
    - Average fare per city
    - Peak hour (hour with most trips) — use groupBy city and hour,
      count, then orderBy and take the top hour per city. Or use
      window functions (Lesson 8) for a cleaner approach.

    The aggregation layer feeds directly into dashboards and reports.
    Cache the result if multiple downstream consumers need it.

