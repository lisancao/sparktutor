      extract hour, group by city and hour, then for each city take the
      hour with max count — use a self-join or window; for simplicity,
      return the hour with max trips per city via groupBy city, hour,
      count, then orderBy and first)

    For the peak_hour simplification: group by city and hour, count,
    then use a window (row_number) partitioned by city ordered by count
    desc, filter for rank=1, select city and hour. Or: aggregate to
    (city, hour, cnt), then for each city take argmax of cnt. Use
    struct(cnt, hour) and max to get the hour with max count.
