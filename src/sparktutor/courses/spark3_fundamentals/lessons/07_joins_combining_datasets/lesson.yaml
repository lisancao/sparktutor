    ## Why Joins Are the Most Expensive Operation

    In Lessons 5 and 6 you read trips, wrote Parquet, and built the city
    dashboard. Now we combine trips with drivers and ratings to build
    driver performance profiles. Joins are the most expensive Spark
    operation: they require shuffling data so that rows with matching
    keys end up on the same partition. A bad join can dominate runtime.
    This lesson teaches join types, broadcast optimization, and skew handling.

- Class: text
  Depth: all
  Output: |
    ## Join Types: Inner, Left, Right, Full Outer, Cross, Anti, Semi

    - **inner** — keep only rows with matches in both tables
    - **left** — keep all left rows; right columns null when no match
    - **right** — keep all right rows; left columns null when no match
    - **full_outer** — keep all rows from both; nulls where no match
    - **cross** — Cartesian product (every left row × every right row)
    - **left_anti** — keep left rows that have NO match in right
    - **left_semi** — keep left rows that HAVE a match in right (no right columns)

    For driver profiles: inner join trips with drivers (we want only
    trips with known drivers), then left join with ratings (not all
    trips have ratings).

- Class: text
  Depth: all
  Output: |
    ## Join Syntax

    ```python
    trips.join(drivers, trips.driver_id == drivers.driver_id, "inner")
    trips.join(drivers, "driver_id", "left")
    ```

    When the join key has the same name in both tables, use the string
    form: `"driver_id"`. Spark automatically handles the duplicate
    column (one copy in output). With different names, use the condition
    form and alias or drop the duplicate column afterward.

- Class: text
  Depth: intermediate
  Output: |
    ## Broadcast Joins: When the Right Table Is Small

    If one table is small (e.g., drivers with 10K rows), broadcast it
    to every executor. No shuffle of the large table:

    ```python
    from pyspark.sql.functions import broadcast

    trips.join(broadcast(drivers), "driver_id")
    ```

    Spark may auto-broadcast if the small table is under
    `spark.sql.autoBroadcastJoinThreshold` (default 10MB). Explicit
    broadcast guarantees it and can override the threshold for
    slightly larger tables.

