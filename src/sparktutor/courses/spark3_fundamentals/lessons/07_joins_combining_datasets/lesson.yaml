    ## Handling Join Skew: Salting

    When one key (e.g., a superstar driver with 50% of trips) dominates,
    one partition gets most of the data — skew. **Salting** adds a random
    suffix to the key, spreading the hot key across partitions:

    ```python
    from pyspark.sql import functions as f

    trips_salted = trips.withColumn("salt", (f.rand() * 10).cast("int"))
    drivers_salted = drivers.withColumn("salt", f.explode(f.array([f.lit(i) for i in range(10)])))
    trips_salted.join(drivers_salted, ["driver_id", "salt"])
    ```

    The driver row is replicated 10 times (one per salt); each trip
    gets a random salt. The join distributes the hot driver across
    10 partitions.

