    ## Immutability: Why It Matters for Distributed Systems

    Spark DataFrames are **immutable**. When you call `filter()` or
    `withColumn()`, you get a *new* DataFrame. The original is unchanged.
    This is not just a style choice — it enables:

    - **Fault tolerance**: If an executor fails, Spark can recompute from
      the immutable lineage. No need to restore mutated state.
    - **Optimization**: The optimizer can reorder or fuse operations
      because it knows no transformation modifies data in place.
    - **Parallelism**: Different partitions can be processed independently
      without coordination. Mutations would require locks.

    Think of it like Git: each commit is immutable; you never edit a
    commit, you create a new one.

