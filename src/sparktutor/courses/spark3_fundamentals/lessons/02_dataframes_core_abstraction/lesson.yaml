    ## select, filter, withColumn, drop, withColumnRenamed

    The DataFrame API provides a small set of primitives that compose:

    - **select** — pick columns (and add expressions). `df.select("city", "fare")`
    - **filter** / **where** — keep rows matching a condition. `df.filter(f.col("fare") > 10)`
    - **withColumn** — add or replace a column. `df.withColumn("fare_doubled", f.col("fare") * 2)`
    - **drop** — remove columns. `df.drop("rider_id")`
    - **withColumnRenamed** — rename a column. `df.withColumnRenamed("city", "pickup_city")`

    Each returns a new DataFrame. You chain them to build pipelines.

