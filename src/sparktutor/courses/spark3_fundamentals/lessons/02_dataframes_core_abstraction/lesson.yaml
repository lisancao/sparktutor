    ## Computed Columns for Trip Analytics

    For our ride-sharing platform, useful computed columns include:

    - **trip_duration** — if you have start and end timestamps, the difference
    - **fare_per_mile** — fare / distance_miles (pricing efficiency)
    - **is_long_trip** — distance_miles > 10 (for surge or premium logic)

    These enrich the raw data for downstream aggregations and dashboards.
    In Lesson 6 we will aggregate these; in Lesson 8 we will use them in
    window functions.

- Class: text
  Depth: advanced
  Output: |
    ## Column Expressions and f.col()

    When you write `f.col("fare")`, you get a **Column** object representing
    that column in an expression. You can combine columns with operators:

    ```python
    f.col("fare") / f.col("distance_miles")
    f.col("fare") > 10
    f.col("city").isin("SF", "NYC", "LA")
    ```

    For string columns, use `f.col("city") == "SF"`. For numeric, use
    `f.col("fare").between(5, 20)`. The `f` module (`pyspark.sql.functions`)
    provides hundreds of functions: `f.sum`, `f.avg`, `f.when`, etc.

- Class: cmd_question
  Depth: all
  Output: |
    Given a DataFrame `trips_df` with columns city, fare, distance_miles,
    write code to filter for trips where fare is greater than 10 and
    distance_miles is at least 5, then add a column fare_per_mile.
  CorrectAnswer: |
    from pyspark.sql import functions as f

    result = (trips_df
        .filter((f.col("fare") > 10) & (f.col("distance_miles") >= 5))
        .withColumn("fare_per_mile", f.col("fare") / f.col("distance_miles")))
  Hint: "Chain filter (with & for AND) and withColumn."

