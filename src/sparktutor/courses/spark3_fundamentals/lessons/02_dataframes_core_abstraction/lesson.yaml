    ## Filtering by Date Range

    For ride-sharing analytics, you often filter trips by date. If
    `pickup_time` is a string, you can compare lexicographically for
    ISO-style dates:

    ```python
    trips_df.filter(
        (f.col("pickup_time") >= "2024-01-15") &
        (f.col("pickup_time") < "2024-01-16")
    )
    ```

    In Lesson 4 we will cast to proper date/timestamp types and use date
    functions. For now, string comparison works for well-formatted dates.

