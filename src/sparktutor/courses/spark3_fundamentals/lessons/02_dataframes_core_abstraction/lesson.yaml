    ## Chaining: The Fluent API

    Spark's DataFrame API is **fluent** — you chain method calls:

    ```python
    enriched = (trips_df
        .filter(f.col("fare") > 10)
        .withColumn("fare_per_mile", f.col("fare") / f.col("distance_miles"))
        .select("city", "fare", "distance_miles", "fare_per_mile"))
    ```

    Each step produces a new DataFrame; the next step operates on it. No
    intermediate variables needed. The plan is built lazily; execution
    happens only when you call an action like `show()`.

