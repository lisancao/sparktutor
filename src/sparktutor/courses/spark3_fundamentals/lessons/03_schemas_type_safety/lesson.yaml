    ## Nullable vs Non-Nullable: Catching Data Issues Early

    When `nullable=False`, Spark rejects rows with null in that column.
    This fails fast — you discover bad data at read time instead of
    downstream when a join or aggregation produces wrong results.

    Use `nullable=False` for columns that must always be present (trip_id,
    city, fare). Use `nullable=True` for optional fields (driver_id if
    some trips are rider-only, ratings if not all trips are rated).

