    ## Exercise: Define Schemas for Trips, Drivers, and Ratings

    Implement `get_trips_schema`, `get_drivers_schema`, and `get_ratings_schema`
    that return StructType schemas for our ride-sharing platform:

    - **trips**: trip_id (string, non-null), city (string, non-null),
      driver_id (string, nullable), rider_id (string, non-null), fare
      (double, non-null), distance_miles (double, non-null),
      pickup_time (string, non-null)
    - **drivers**: driver_id (string, non-null), name (string, non-null),
      city (string, nullable), vehicle_count (int, nullable)
    - **ratings**: rating_id (string, non-null), trip_id (string, non-null),
      rider_id (string, non-null), rating (int, non-null), comment (string, nullable)

    These schemas will be used in Lesson 5 when we read CSV files and in
    Lesson 7 when we join trips with drivers and ratings.
