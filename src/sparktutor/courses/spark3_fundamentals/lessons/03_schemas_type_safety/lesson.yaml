    ## Complex Types: ArrayType, MapType, Nested StructType

    Ride-sharing data can have structure. A driver's available vehicles,
    a rider's payment methods, or tags on a trip:

    ```python
    from pyspark.sql.types import ArrayType, MapType

    StructField("vehicle_ids", ArrayType(StringType()), True),
    StructField("payment_prefs", MapType(StringType(), StringType()), True),
    StructField("metadata", StructType([
        StructField("source", StringType(), True),
        StructField("version", IntegerType(), True),
    ]), True),
    ```

    - **ArrayType** — list of values (e.g., `["v1", "v2"]`)
    - **MapType** — key-value pairs (e.g., `{"card": "visa"}`)
    - **StructType** — nested object

