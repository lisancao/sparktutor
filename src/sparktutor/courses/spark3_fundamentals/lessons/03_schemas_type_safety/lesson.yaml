    ## Failure First: See the Garbled Types

    Try reading a trip CSV without a schema:

    ```python
    df = spark.read.csv("trips.csv", header=True, inferSchema=True)
    df.printSchema()
    ```

    You might see `fare` as `string` (because of one null or bad value),
    or `distance_miles` as `double` when you expected `int`. Aggregations
    and joins will behave unexpectedly. The fix: define the schema
    explicitly so Spark (and you) know exactly what each column is.

