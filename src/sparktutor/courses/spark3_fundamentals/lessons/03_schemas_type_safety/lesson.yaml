    ## StructType and StructField: Explicit Schemas

    You define a schema with `StructType` and `StructField`:

    ```python
    from pyspark.sql.types import StructType, StructField, StringType, DoubleType, IntegerType

    trips_schema = StructType([
        StructField("trip_id", StringType(), False),
        StructField("city", StringType(), False),
        StructField("driver_id", StringType(), True),
        StructField("rider_id", StringType(), False),
        StructField("fare", DoubleType(), False),
        StructField("distance_miles", DoubleType(), False),
        StructField("pickup_time", StringType(), False),
    ])

    df = spark.read.schema(trips_schema).csv("trips.csv", header=True)
    ```

    - `StructField(name, dataType, nullable)` — one column
    - `nullable=True` — allows nulls; `False` — rejects nulls (validates at read)

