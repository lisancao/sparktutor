    ## Why Schemas Matter for the Ride-Sharing Platform

    In Lessons 1 and 2 you built DataFrames from Python data and applied
    transformations. When reading from files (CSV, JSON), Spark can infer
    schemas — but that leads to problems. This lesson shows what goes wrong
    with schema inference, then teaches explicit schemas that will be the
    foundation for our file-based pipeline in Lesson 5.

- Class: text
  Depth: all
  Output: |
    ## What Goes Wrong with inferSchema

    When you read CSV with `inferSchema=True`, Spark samples the data to
    guess types. Problems:

    1. **Wrong types**: A column with mostly integers but one "N/A" becomes
       string. A date column might become string or get misparsed.
    2. **Doubled read time**: Spark makes two passes — one to sample and
       infer, another to load. For large files, this doubles I/O.
    3. **Inconsistent across runs**: Different samples can produce different
       schemas. A job that worked yesterday may fail today if new data
       changes the inferred type.

    For our trips table, `fare` could be inferred as string if a single row
    has "pending". `pickup_time` might become string when we need timestamp.

