    Define a StructType schema for a `drivers` table with columns:
    driver_id (string, non-nullable), name (string, non-nullable),
    city (string, nullable), vehicle_count (integer, nullable).
  CorrectAnswer: |
    from pyspark.sql.types import StructType, StructField, StringType, IntegerType

    drivers_schema = StructType([
        StructField("driver_id", StringType(), False),
        StructField("name", StringType(), False),
        StructField("city", StringType(), True),
        StructField("vehicle_count", IntegerType(), True),
    ])
  Hint: "Use StructType([StructField(...), ...]). Third arg is nullable: False for non-nullable."

