- Class: text
  Depth: all
  Output: |
    ## 写入模式

    DataFrameWriter 控制数据如何持久化：

    ```python
    df.write.format("parquet").mode("overwrite").save("/output/data")
    ```

    | 模式 | 行为 |
    |------|----------|
    | `error`（默认）| 数据已存在则失败 |
    | `overwrite` | 删除已有数据，写入新数据 |
    | `append` | 在已有数据旁追加新数据 |
    | `ignore` | 数据已存在则静默跳过 |

    对于我们的管道：批量运行用 `overwrite`（保证幂等性），
    只有增量/流处理管道才用 `append`。

