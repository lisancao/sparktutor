  Output: |
    ## Parquet：首选的管道格式

    **Parquet** 是管道中间数据和输出数据的推荐格式，因为：

    - **列式存储** —— 只读取查询所需的列
    - **压缩** —— 默认 Snappy 压缩，压缩比优秀
    - **内嵌 schema** —— 读回时无需推断
    - **谓词下推** —— Spark 可以跳过不匹配过滤条件的行组

    读取 Parquet 是 Spark 中最简单的读取方式：
    ```python
    df = spark.read.parquet("/data/orders.parquet")
    ```

    在我们的管道中，bronze 将中间数据写为临时视图（内存中）。
    对于管道运行之间的持久化存储，Parquet 或 Iceberg 表是标准选择。

- Class: cmd_question
  Depth: intermediate
  Output: |
    读取 `'/data/events.parquet'` 处的 Parquet 文件，过滤出
    `event_type` 等于 `'purchase'` 的行，并将结果以 overwrite 模式
    写入 `'/output/purchases'`。
  CorrectAnswer: |
    from pyspark.sql import functions as f
    events = spark.read.parquet("/data/events.parquet")
    purchases = events.filter(f.col("event_type") == "purchase")
    purchases.write.mode("overwrite").parquet("/output/purchases")
  Hint: "链式调用 read → filter → write。过滤条件用 f.col()。"

- Class: text
  Depth: advanced
  Output: |
    ## Iceberg 表：管道级 ACID

    对于生产管道，**Iceberg** 在 Parquet 之上增加了 ACID 事务、
    时间旅行和 schema 演进：

    ```python
    # Write to an Iceberg table
    df.writeTo("lakehouse.db.orders").using("iceberg").createOrReplace()

    # Read from an Iceberg table
    df = spark.table("lakehouse.db.orders")

    # Time travel — read a previous snapshot
    spark.read.option("snapshot-id", 12345).table("lakehouse.db.orders")
    ```

    对管道的关键好处：
    - **原子性** —— 部分写入绝不会损坏表
    - **Schema 演进** —— 添加列无需重写数据
    - **分区演进** —— 更改分区方式无需重写数据
    - **时间旅行** —— 可查询任意历史版本用于调试

