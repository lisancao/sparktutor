    ## 你将学到什么

    一条管道只有在能够从外部世界**摄入**数据并**持久化**结果时才有用。
    本课你将学习 Spark 的 I/O 层 —— DataFrameReader 和
    DataFrameWriter API。

    学完本课后，你将能够：

    - 用显式 schema 读取 CSV 和 JSON 文件
    - 以 Parquet 格式写入数据（Spark 首选格式）
    - 选择正确的写入模式（overwrite、append、error、ignore）
    - 解释为什么生产管道必须使用显式 schema
    - 写入 Iceberg 表以实现符合 ACID 规范的存储（高级）

    这些技能直接支撑 **bronze 层** —— 读取原始文件是每条管道
    的第一步。

- Class: text
  Depth: beginner
  Output: |
    读取 CSV 文件最简单的方式：

    ```python
    df = spark.read.csv("/data/orders.csv", header=True, inferSchema=True)
    ```

    `header=True` 表示第一行包含列名。
    `inferSchema=True` 让 Spark 扫描文件来猜测列类型。
    这对探索数据很方便，但在大文件上很慢 —— Spark 会读两遍数据
    （一遍推断类型，一遍加载数据）。

- Class: text
