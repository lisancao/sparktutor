    ## Write Modes

    The DataFrameWriter controls how data is persisted:

    ```python
    df.write.format("parquet").mode("overwrite").save("/output/data")
    ```

    | Mode | Behavior |
    |------|----------|
    | `error` (default) | Fail if data already exists |
    | `overwrite` | Delete existing data, write new |
    | `append` | Add new data alongside existing |
    | `ignore` | Silently skip if data exists |

    For our pipeline: use `overwrite` for batch runs (ensures
    idempotency), `append` only for incremental/streaming pipelines.

