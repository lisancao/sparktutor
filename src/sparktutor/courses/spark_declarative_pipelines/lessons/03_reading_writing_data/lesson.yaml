    ## Parquet: The Preferred Pipeline Format

    **Parquet** is the recommended format for pipeline intermediate and
    output data because:

    - **Columnar** — reads only the columns your query needs
    - **Compressed** — Snappy compression by default, excellent ratios
    - **Schema embedded** — no inference needed when reading back
    - **Predicate pushdown** — Spark can skip row groups that do not match
      your filters

    Reading Parquet is the simplest read in Spark:
    ```python
    df = spark.read.parquet("/data/orders.parquet")
    ```

    In our pipeline, bronze writes intermediate data as temp views (in
    memory). For persistent storage between pipeline runs, Parquet or
    Iceberg tables are the standard choice.

- Class: cmd_question
  Depth: intermediate
  Output: |
    Read a Parquet file at `'/data/events.parquet'`, filter to rows where
    `event_type` equals `'purchase'`, and write the result to
    `'/output/purchases'` in overwrite mode.
  CorrectAnswer: |
    from pyspark.sql import functions as f
    events = spark.read.parquet("/data/events.parquet")
    purchases = events.filter(f.col("event_type") == "purchase")
    purchases.write.mode("overwrite").parquet("/output/purchases")
  Hint: "Chain read → filter → write. Use f.col() for the filter condition."

