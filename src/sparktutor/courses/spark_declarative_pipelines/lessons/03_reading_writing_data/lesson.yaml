    ## Summary

    You now know how to read and write data in Spark:

    - **DataFrameReader** — format, options, schema, load
    - **Explicit schemas** — always use them in production (no inferSchema)
    - **Parquet** — the default format for analytics and pipelines
    - **Write modes** — overwrite for idempotent batch pipelines
    - **Iceberg** — ACID transactions for production table storage

    You have all the building blocks: a SparkSession, transformations, and
    I/O. In the next lesson, you will build the **Pipeline Framework** —
    a reusable class that ties transformations together with automatic
    dependency resolution.
