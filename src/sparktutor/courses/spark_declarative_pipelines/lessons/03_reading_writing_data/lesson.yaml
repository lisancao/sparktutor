    ## 小结

    你现在知道如何在 Spark 中读写数据了：

    - **DataFrameReader** —— format、options、schema、load
    - **显式 schema** —— 生产环境始终使用（不要用 inferSchema）
    - **Parquet** —— 分析和管道的默认格式
    - **写入模式** —— 幂等批量管道用 overwrite
    - **Iceberg** —— 生产级表存储的 ACID 事务

    你已经掌握了所有构建块：SparkSession、转换和 I/O。
    下一课中，你将构建 **Pipeline Framework** —— 一个可复用的类，
    通过自动依赖解析将各种转换串联起来。
