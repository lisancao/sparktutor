    ## What You'll Learn

    A pipeline is only useful if it can **ingest** data from the outside
    world and **persist** results. In this lesson you will learn Spark's
    I/O layer — the DataFrameReader and DataFrameWriter APIs.

    By the end of this lesson you will be able to:

    - Read CSV and JSON files with explicit schemas
    - Write data in Parquet format (Spark's preferred format)
    - Choose the right write mode (overwrite, append, error, ignore)
    - Explain why explicit schemas are required for production pipelines
    - Write to Iceberg tables for ACID-compliant storage (advanced)

    These skills directly power the **bronze layer** — reading raw files
    is the first step of every pipeline.

- Class: text
  Depth: beginner
  Output: |
    The simplest way to read a CSV file:

    ```python
    df = spark.read.csv("/data/orders.csv", header=True, inferSchema=True)
    ```

    `header=True` means the first row contains column names.
    `inferSchema=True` makes Spark scan the file to guess column types.
    This is convenient for exploration but slow on large files — Spark
    reads the data twice (once to infer, once to load).

- Class: text
