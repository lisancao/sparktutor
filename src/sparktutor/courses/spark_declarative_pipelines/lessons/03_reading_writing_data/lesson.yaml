    ## Explicit Schemas: The Production Standard

    For production pipelines, **never** rely on `inferSchema`. Define the
    schema explicitly with `StructType`:

    ```python
    from pyspark.sql.types import (
        StructType, StructField, StringType, DoubleType, IntegerType
    )

    schema = StructType([
        StructField("order_id", StringType(), nullable=False),
        StructField("product", StringType()),
        StructField("price", DoubleType()),
        StructField("quantity", IntegerType()),
    ])

    df = spark.read.csv("/data/orders.csv", header=True, schema=schema)
    ```

    Benefits:
    - **Faster** — no extra scan to detect types
    - **Safer** — bad data becomes `null` instead of being silently mistyped
    - **Self-documenting** — the schema is your contract

    In our pipeline, the **bronze layer** will read with all-string schemas
    (schema-on-read), and the **silver layer** will cast to proper types.

    **Docs:**
    [StructType](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.types.StructType.html) |
    [StructField](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.types.StructField.html)
    — `StructField(name, dataType, nullable)` and all type classes.

