    ## The DataFrameReader Pattern

    Every data read follows the same structure:

    ```python
    df = (spark.read
        .format("csv")             # what format
        .option("header", "true")  # format-specific settings
        .schema(my_schema)         # explicit schema (recommended)
        .load("/data/input"))      # where to read from
    ```

    The chain is always: **format → options → schema → load**.

    Shorthand methods are also available:
    ```python
    spark.read.csv(path, header=True, schema=schema)
    spark.read.json(path, schema=schema)
    spark.read.parquet(path)  # schema embedded, no options needed
    ```

    **Docs:**
    [DataFrameReader.csv](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameReader.csv.html) |
    [.json](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameReader.json.html) |
    [.parquet](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameReader.parquet.html) |
    [DataFrameWriter.mode](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameWriter.mode.html) |
    [.parquet](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameWriter.parquet.html)

