    ## Iceberg Tables: ACID for Pipelines

    For production pipelines, **Iceberg** adds ACID transactions, time
    travel, and schema evolution on top of Parquet:

    ```python
    # Write to an Iceberg table
    df.writeTo("lakehouse.db.orders").using("iceberg").createOrReplace()

    # Read from an Iceberg table
    df = spark.table("lakehouse.db.orders")

    # Time travel — read a previous snapshot
    spark.read.option("snapshot-id", 12345).table("lakehouse.db.orders")
    ```

    Key benefits for pipelines:
    - **Atomicity** — partial writes never corrupt the table
    - **Schema evolution** — add columns without rewriting data
    - **Partition evolution** — change partitioning without rewriting data
    - **Time travel** — query any previous version for debugging

