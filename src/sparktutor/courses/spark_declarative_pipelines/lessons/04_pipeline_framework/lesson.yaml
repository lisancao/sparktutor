    ## What You'll Learn

    Over the last three lessons you learned to create a SparkSession,
    transform data, and read/write files. But real-world pipelines have
    **multiple steps that depend on each other**: you cannot build the
    silver layer until bronze is ready, and gold depends on silver.

    In this lesson you will build a lightweight **Pipeline class** that:
    1. Registers transformation functions with a decorator
    2. Auto-detects dependencies between them
    3. Runs them in the correct order using topological sort

    By the end you will have a reusable framework for the bronze, silver,
    and gold layers you build in the next three lessons.

