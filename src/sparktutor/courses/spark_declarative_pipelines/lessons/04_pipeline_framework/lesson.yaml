    Python **装饰器**是一个包装另一个函数以增加行为的函数。
    你可能见过 `@property` 或 `@staticmethod`。
    我们将创建一个 `@pipeline.materialized_view()` 装饰器，
    把一个函数注册为管道步骤：

    ```python
    @pipeline.materialized_view()
    def bronze_orders(spark):
        return spark.read.csv("/data/orders.csv", header=True)
    ```

    当管道运行时，它调用 `bronze_orders(spark)` 并将结果保存为
    名为 `bronze_orders` 的临时视图。函数名即表名 —— 这就是
    "声明式"的部分。

