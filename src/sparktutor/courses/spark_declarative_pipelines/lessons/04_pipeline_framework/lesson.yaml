    ## 装饰器模式

    装饰器将每个函数存到一个注册表字典中：

    ```python
    class Pipeline:
        def __init__(self, spark):
            self.spark = spark
            self._flows = {}  # name -> function

        def materialized_view(self):
            def decorator(func):
                self._flows[func.__name__] = func
                return func
            return decorator
    ```

    当你装饰一个函数时，它会以函数名为键加入 `_flows`。
    函数本身不变 —— 它仍然接收 `spark` 并返回一个 DataFrame。

    这种模式将**声明**（每一步做什么）与**编排**（按什么顺序运行）
    分离开来。你声明步骤；框架负责排序。

