    ## The run() Method

    Finally, `run()` ties it all together:

    ```python
    def run(self):
        # Build dependency graph
        graph = {}
        for name, func in self._flows.items():
            graph[name] = self._detect_deps(func)

        # Sort
        order = self._topo_sort(graph)

        # Execute
        for name in order:
            df = self._flows[name](self.spark)
            df.createOrReplaceTempView(name)
            print(f"Materialized: {name} ({df.count()} rows)")
    ```

    Each step's result is registered as a **temp view** so downstream
    steps can reference it with `spark.table("step_name")`. This is the
    contract that makes dependency detection work.

