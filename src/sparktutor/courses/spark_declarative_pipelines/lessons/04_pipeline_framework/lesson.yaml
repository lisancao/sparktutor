    ## Topological Sort

    Given a dependency graph, **topological sort** produces an ordering
    where every function runs after its dependencies. We use Kahn's
    algorithm:

    1. Compute **in-degree** (number of dependencies) for each node
    2. Start with nodes that have in-degree 0 (no dependencies)
    3. Process each node, decrementing in-degree of its dependents
    4. Repeat until all nodes are processed
    5. If the queue empties before all nodes are processed → cycle detected

    ```python
    from collections import deque

    def _topo_sort(self, graph):
        in_degree = {n: 0 for n in graph}
        for node, deps in graph.items():
            for dep in deps:
                in_degree[node] += 1

        queue = deque(n for n, d in in_degree.items() if d == 0)
        order = []

        while queue:
            node = queue.popleft()
            order.append(node)
            for candidate, deps in graph.items():
                if node in deps:
                    in_degree[candidate] -= 1
                    if in_degree[candidate] == 0:
                        queue.append(candidate)

        if len(order) != len(graph):
            raise ValueError("Cycle detected in pipeline dependencies")
        return order
    ```

