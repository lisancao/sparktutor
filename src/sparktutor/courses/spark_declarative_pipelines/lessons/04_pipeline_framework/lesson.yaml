    ## Summary

    You now have a reusable Pipeline framework with:

    - **Declarative registration** — `@pipe.materialized_view()` registers
      steps by function name
    - **Automatic dependency detection** — regex inspection of
      `spark.table()` calls
    - **Topological execution** — Kahn's algorithm ensures correct ordering
    - **Cycle detection** — circular dependencies raise clear errors

    This is the backbone of everything that follows. In the next three
    lessons you will use this framework to build real **bronze**, **silver**,
    and **gold** layers for a data pipeline.
