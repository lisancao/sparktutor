    ## Schema-on-Read

    **Schema-on-read** means you do not enforce strict types at the
    bronze layer. Instead, read everything as strings and let the silver
    layer handle type casting.

    ```python
    from pyspark.sql.types import StructType, StructField, StringType

    raw_schema = StructType([
        StructField("order_id", StringType()),
        StructField("product", StringType()),
        StructField("price", StringType()),    # string, not double!
        StructField("quantity", StringType()),  # string, not int!
    ])
    ```

    Why? If a price column contains "N/A" or "pending", casting to double
    would lose that row. Keeping it as a string preserves the original
    data. The silver layer decides how to handle these cases.

