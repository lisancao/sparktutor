    给定一个包含 `event_id`、`user_id`、`action` 和
    `_ingested_at` 列的 DataFrame `raw_df`，按 `event_id`
    去重，只保留最新一次接入（`_ingested_at` 最大的那条）。
    使用带 `row_number` 的窗口函数。
  CorrectAnswer: |
    from pyspark.sql import functions as f
    from pyspark.sql import Window

    w = Window.partitionBy("event_id").orderBy(f.col("_ingested_at").desc())
    deduped = (raw_df
        .withColumn("_rn", f.row_number().over(w))
        .filter(f.col("_rn") == 1)
        .drop("_rn"))
  Hint: "按 event_id 分区，按 _ingested_at 降序排列，取 row_number == 1。"

- Class: text
  Depth: advanced
  Output: |
    ## 增量接入

    每次运行都重新读取整个源是浪费的。增量接入有三种方式：

    **1. 基于文件的水位线（watermark）** —— 利用
    `_source_file` 元数据追踪哪些文件已经处理过：
    ```python
    processed = spark.table("bronze_orders").select("_source_file").distinct()
    new_files = all_files.subtract(processed)
    ```

    **2. 基于时间戳的水位线** —— 保存上一次运行的最大
    `updated_at`，只筛选源中更新的行。

    **3. Structured Streaming** —— 使用 `spark.readStream`
    配合文件源，自动检测新出现的文件：
    ```python
    stream = (spark.readStream
        .schema(raw_schema)
        .csv("/data/incoming/"))
    ```

    本课程使用批处理模式，但你搭建的 Pipeline 框架可以
    很容易地包装流式数据源。

