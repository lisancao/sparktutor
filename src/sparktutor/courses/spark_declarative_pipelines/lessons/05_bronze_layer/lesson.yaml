    ## What You'll Learn

    With the Pipeline framework built, it is time to create the first
    layer. The **bronze layer** is the foundation of every medallion
    architecture pipeline. It has one job: get raw data in safely.

    By the end of this lesson you will be able to:

    - Explain the role of bronze in the medallion architecture
    - Ingest raw CSV/JSON data with all-string schemas (schema-on-read)
    - Add lineage metadata columns (`_ingested_at`, `_source_file`)
    - Deduplicate records using `dropDuplicates` and window functions
    - Understand incremental ingestion patterns (advanced)

