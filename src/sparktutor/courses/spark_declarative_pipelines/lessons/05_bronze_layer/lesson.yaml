    ## Incremental Ingestion

    Re-reading the entire source every run is wasteful. Three approaches
    for incremental ingestion:

    **1. File-based watermark** — track which files have been processed
    using the `_source_file` metadata:
    ```python
    processed = spark.table("bronze_orders").select("_source_file").distinct()
    new_files = all_files.subtract(processed)
    ```

    **2. Timestamp-based watermark** — store the max `updated_at` from the
    previous run and filter the source to only newer rows.

    **3. Structured Streaming** — use `spark.readStream` with a file
    source to automatically detect new files as they appear:
    ```python
    stream = (spark.readStream
        .schema(raw_schema)
        .csv("/data/incoming/"))
    ```

    For this course we use batch mode, but the Pipeline framework you
    built could easily wrap streaming sources.

