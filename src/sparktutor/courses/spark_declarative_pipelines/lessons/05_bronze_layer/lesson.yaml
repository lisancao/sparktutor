- Class: text
  Depth: intermediate
  Output: |
    ## 去重

    原始数据经常包含重复 —— 文件被重复投递、事件被重放、
    API 响应被缓存。Bronze 处理简单的情况：

    **完全重复** —— 使用 `dropDuplicates`：
    ```python
    df = df.dropDuplicates(["order_id"])
    ```

    **保留最新** —— 当存在重复但你想要最新的一条时，
    使用窗口函数：
    ```python
    from pyspark.sql import Window

    w = Window.partitionBy("order_id").orderBy(
        f.col("_ingested_at").desc())
    df = (df.withColumn("_rn", f.row_number().over(w))
            .filter(f.col("_rn") == 1)
            .drop("_rn"))
    ```

