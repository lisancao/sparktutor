    ## Summary

    Your bronze layer is ready. It:

    - **Ingests** raw data preserving original values (schema-on-read)
    - **Annotates** every row with ingestion timestamp and source file
    - **Deduplicates** by primary key

    These three steps give you a reliable, auditable foundation. In the
    next lesson, you will build the **silver layer** to clean, type-cast,
    and enrich this data.
