    ## Deduplication

    Raw data often contains duplicates — files re-delivered, events
    replayed, API responses cached. Bronze handles the simple case:

    **Exact duplicates** — use `dropDuplicates`:
    ```python
    df = df.dropDuplicates(["order_id"])
    ```

    **Keep the latest** — when duplicates exist but you want the most
    recent, use a window function:
    ```python
    from pyspark.sql import Window

    w = Window.partitionBy("order_id").orderBy(
        f.col("_ingested_at").desc())
    df = (df.withColumn("_rn", f.row_number().over(w))
            .filter(f.col("_rn") == 1)
            .drop("_rn"))
    ```

