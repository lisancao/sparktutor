    ## 小结

    你的 bronze 层已经准备好了。它：

    - **接入** 原始数据并保留原始值（schema-on-read）
    - **标注** 每一行的接入时间戳和源文件
    - 按主键**去重**

    这三步为你提供了一个可靠、可审计的基础。在下一课中，
    你将构建 **silver 层**来清洗、类型转换并丰富这些数据。
