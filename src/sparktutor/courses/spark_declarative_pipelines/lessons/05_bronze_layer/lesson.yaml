    ## The Bronze Layer's Role

    Bronze does four things:

    1. **Ingest** — read raw data from external sources (CSV, JSON, APIs)
    2. **Preserve** — keep the original data as-is (no transformations)
    3. **Annotate** — add metadata columns for tracking and auditing
    4. **Deduplicate** — remove obvious exact duplicates

    Bronze tables are your safety net. If anything goes wrong in silver or
    gold, you can always re-process from bronze. This is why you preserve
    the raw data without transforming it.

- Class: text
  Depth: beginner
  Output: |
    A minimal bronze ingestion reads a raw file and adds two metadata
    columns:

    ```python
    from pyspark.sql import functions as f

    def bronze_orders(spark):
        return (spark.read.csv("/data/raw/orders.csv",
                    header=True, inferSchema=True)
            .withColumn("_ingested_at", f.current_timestamp())
            .withColumn("_source_file", f.input_file_name())
        )
    ```

    - `_ingested_at` records **when** the row was loaded
    - `_source_file` records **where** it came from

    These columns create an audit trail — you can always trace a row back
    to its source.

    **Docs:**
    [f.current_timestamp](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.current_timestamp.html) |
    [f.input_file_name](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.input_file_name.html) |
    [dropDuplicates](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.dropDuplicates.html)
    — `subset` parameter for dedup by specific columns.

