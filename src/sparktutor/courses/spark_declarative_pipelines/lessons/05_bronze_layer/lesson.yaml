    ## 你将学到什么

    Pipeline 框架已经搭建完成，现在是创建第一层的时候了。
    **Bronze 层**是每一个 medallion 架构管道的基础。它只有
    一项任务：安全地把原始数据接入进来。

    学完本课后，你将能够：

    - 解释 bronze 在 medallion 架构中的角色
    - 用全字符串 schema（schema-on-read）接入原始 CSV/JSON 数据
    - 添加血缘元数据列（`_ingested_at`、`_source_file`）
    - 使用 `dropDuplicates` 和窗口函数对记录去重
    - 理解增量接入模式（高级）

- Class: text
  Depth: all
  Output: |
    ## Bronze 层的职责

    Bronze 做四件事：

    1. **接入（Ingest）** —— 从外部数据源（CSV、JSON、API）读取原始数据
    2. **保留（Preserve）** —— 原样保留原始数据（不做任何转换）
    3. **标注（Annotate）** —— 添加元数据列用于追踪和审计
    4. **去重（Deduplicate）** —— 去除明显的完全重复记录

    Bronze 表是你的安全网。如果 silver 或 gold 出了问题，
    你总能从 bronze 重新处理。这就是为什么要保留原始数据而
    不做转换。

- Class: text
  Depth: beginner
  Output: |
    一个最小化的 bronze 接入逻辑读取原始文件并添加两个元数据列：

    ```python
    from pyspark.sql import functions as f

    def bronze_orders(spark):
        return (spark.read.csv("/data/raw/orders.csv",
                    header=True, inferSchema=True)
            .withColumn("_ingested_at", f.current_timestamp())
            .withColumn("_source_file", f.input_file_name())
        )
    ```

    - `_ingested_at` 记录行是**何时**加载的
    - `_source_file` 记录它来自**哪里**

    这些列构成了一条审计追踪链 —— 你总能把一行数据追溯到它
    的源头。

    **文档：**
    [f.current_timestamp](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.current_timestamp.html) |
    [f.input_file_name](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.input_file_name.html) |
    [dropDuplicates](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.dropDuplicates.html)
    —— `subset` 参数用于按指定列去重。

