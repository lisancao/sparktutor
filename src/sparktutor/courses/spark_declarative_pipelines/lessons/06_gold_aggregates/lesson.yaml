    ## Aggregations and Windows

    `groupBy().agg()` collapses rows. Window functions compute over a set
    of rows *without* collapsing them, which is how you add ranks, running
    totals and shares to an aggregate:

    ```python
    from pyspark.sql.window import Window

    running = Window.orderBy("order_date").rowsBetween(Window.unboundedPreceding, Window.currentRow)
    by_revenue = Window.orderBy(F.col("revenue").desc())
    everyone = Window.partitionBy()

    daily.withColumn("cumulative_revenue", F.sum("revenue").over(running))
    customers.withColumn("revenue_rank", F.dense_rank().over(by_revenue))
    customers.withColumn("revenue_share", F.col("revenue") / F.sum("revenue").over(everyone))
    ```

    `rank` leaves gaps after ties (1, 1, 3); `dense_rank` does not
    (1, 1, 2); `row_number` breaks ties arbitrarily (1, 2, 3).

