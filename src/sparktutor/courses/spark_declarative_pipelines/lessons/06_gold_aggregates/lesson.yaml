    ## Rules for Loop-Generated Datasets

    The SDP guide warns that the list driving the loop must only ever grow.
    Removing a value removes the dataset from the graph: SDP stops
    refreshing it (its files stay on disk, going stale), and anything
    downstream that still reads it fails with `TABLE_OR_VIEW_NOT_FOUND`.
    Keep the list additive. Generating the list from a query at registration
    time (`collect()` at module scope) works, but it runs on every
    registration and couples your graph's shape to data; prefer a static
    list or configuration.

    Materialized views are recomputed each run. When a gold table becomes
    expensive, the options are to partition or cluster it
    (`partition_cols` / `cluster_by`), to pre-aggregate in a streaming
    table, or, in Spark 4.2, to define a metric view over the gold table
    (`CREATE VIEW ... WITH METRICS LANGUAGE YAML AS $$ ... $$`, new in
    4.2) that dashboards query by dimension. Pipeline SQL files cannot
    declare metric views, so create it outside the pipeline.

