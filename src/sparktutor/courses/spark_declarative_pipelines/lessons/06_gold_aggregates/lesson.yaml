    ## Generating Datasets in a Loop

    A pipeline file is Python, so a loop can define several datasets:

    ```python
    CATEGORIES = ["hardware", "merch"]

    for category in CATEGORIES:
        @dp.materialized_view(name=f"gold_revenue_{category}")
        def revenue_for_category(category: str = category) -> DataFrame:
            return (spark.table("billable_orders")
                    .join(spark.table("silver_products").where(F.col("category") == category), "product_id")
                    .groupBy("product_id").agg(F.sum("line_total").alias("revenue")))
    ```

    Two details matter:

    - `name=` gives each dataset a distinct name; the function name is the
      same every iteration.
    - `category: str = category` binds the *current* value. Open source
      Spark 4.2 calls each function immediately, while the decorator
      registers it, so the loop works even without the default argument.
      Keep it anyway: environments that call the functions later (such as
      Databricks) would otherwise give every table the loop variable's
      final value, because Python closures capture variables, not values.

