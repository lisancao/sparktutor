    ## Summary

    - Gold tables answer specific questions and carry the business rules,
      ideally through one shared view.
    - Windows add ranks, running totals and shares without collapsing rows;
      apply them after aggregating.
    - Loops can generate datasets; give each a distinct `name` and bind the
      loop variable with a default argument.

    Next: keeping a table in sync with a source that sends inserts,
    updates and deletes, with Spark 4.2's Auto CDC.
