    ## Gold Is Shaped by Questions

    Silver is shaped by the source: one row per order. Gold is shaped by a
    question: "revenue per day", "who are our best customers", "how is each
    category doing". Each gold table should be small, named after the
    question, and cheap to read from a dashboard.

    Business rules live here too. Silver keeps cancelled orders because
    they are real, valid events; gold decides they do not count as revenue.
    Putting that rule in one shared temporary view keeps every gold table
    consistent:

    ```python
    @dp.temporary_view
    def billable_orders():
        return spark.table("silver_orders").where("status <> 'cancelled'")
    ```

