    ## Windows Without partitionBy

    `Window.orderBy(...)` and `Window.partitionBy()` with no columns put
    every row in a single partition on one task. That is fine for a gold
    table with a few thousand rows (and Spark warns you about it in the
    log), and a real problem on a fact table with billions. Rank and share
    *after* aggregating, never on the raw fact rows.

    Since Spark 4.2 you can also write the "top N per group" pattern in SQL
    with `QUALIFY`, which filters on a window function the way `HAVING`
    filters on an aggregate:

    ```sql
    CREATE MATERIALIZED VIEW top_customer_per_city AS
    SELECT city, customer_id, revenue
    FROM gold_customer_value
    QUALIFY row_number() OVER (PARTITION BY city ORDER BY revenue DESC) = 1;
    ```

