    ## Dependency Detection

    How does the pipeline know that `silver_orders` depends on
    `bronze_orders`? We inspect the function's source code for calls to
    `spark.table("...")`:

    ```python
    import inspect, re

    def _detect_deps(self, func):
        source = inspect.getsource(func)
        return re.findall(r'spark\.table\(["\'](\w+)["\']\)', source)
    ```

    If `silver_orders` calls `spark.table("bronze_orders")`, the regex
    finds `"bronze_orders"` as a dependency. This is a simple but
    effective heuristic; it works because our convention is to use
    `spark.table()` to read from pipeline steps.

