    ## What You'll Learn

    This optional lesson rebuilds a toy version of what
    `spark-pipelines run` does with your definitions, in plain Python and
    classic PySpark. Building it yourself makes the real framework's
    behaviour (and its error messages) much less mysterious.

    Your mini framework will:
    1. Register dataset functions with a decorator, like `@dp.materialized_view`
    2. Detect dependencies between them
    3. Run them in dependency order using a topological sort, and reject cycles

    The real SDP does the same three steps on the Spark Connect server, with
    far more care: it analyzes each query's logical plan instead of
    scanning source code, writes real tables instead of temp views, and
    runs independent flows in parallel.

