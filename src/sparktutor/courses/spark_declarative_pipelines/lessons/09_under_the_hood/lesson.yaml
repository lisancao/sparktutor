    A Python **decorator** is a function that wraps another function to
    add behavior. You have probably seen `@property` or `@staticmethod`.
    We will create a `@pipeline.materialized_view()` decorator that
    registers a function as a pipeline step:

    ```python
    @pipeline.materialized_view()
    def bronze_orders(spark):
        return spark.read.csv("/data/orders.csv", header=True)
    ```

    When the pipeline runs, it calls `bronze_orders(spark)` and saves the
    result as a temp view named `bronze_orders`. The function name becomes
    the table name; this is the "declarative" part.

