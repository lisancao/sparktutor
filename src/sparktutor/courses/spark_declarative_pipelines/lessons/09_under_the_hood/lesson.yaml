    ## Summary

    You now have a toy pipeline framework with:

    - **Declarative registration**: `@pipe.materialized_view()` registers
      steps by function name.
    - **Dependency detection**: a regex over `spark.table()` calls.
    - **Topological execution**: Kahn's algorithm orders the steps.
    - **Cycle detection**: circular dependencies raise clear errors.

    How the real thing differs:

    - SDP finds dependencies by resolving each flow's *query plan*, so
      `spark.table(name)` built from a variable, SQL files and joins all
      work. Regex over source code would miss them.
    - It reports cycles as `CircularDependencyException` before running
      anything, which is what `dry-run` relies on.
    - It writes materialized views and streaming tables to the catalog,
      keeps checkpoints in `storage`, and runs independent flows
      concurrently (bounded by
      `spark.sql.pipelines.execution.maxConcurrentFlows`).
    - It retries failed flows (`spark.sql.pipelines.maxFlowRetryAttempts`)
      and skips everything downstream of a failure.
