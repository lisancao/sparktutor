    ## Datasets, Flows and Pipelines

    SDP has three concepts, and everything else in this course builds on
    them:

    - **Dataset**: a queryable object the pipeline produces. There are three
      kinds: a *materialized view* (a batch query precomputed into a table),
      a *streaming table* (a table fed incrementally by streaming flows) and
      a *temporary view* (an intermediate result that only exists during the
      run).
    - **Flow**: the query that reads a source and writes into a dataset.
      When you decorate a function with `@dp.materialized_view`, SDP creates
      the dataset *and* a flow for it. Lesson 2 shows how to attach several
      flows to one streaming table.
    - **Pipeline**: the unit you run. It is a set of source files (Python or
      SQL) plus a spec file, `spark-pipeline.yml`, that says where the files
      are and where to keep checkpoints.

- Class: text
  Depth: beginner
  Output: |
    ## Your First Materialized View

    ```python
    from pyspark import pipelines as dp
    from pyspark.sql import DataFrame, SparkSession

    spark: SparkSession

    @dp.materialized_view
    def products() -> DataFrame:
        return spark.read.option("header", True).csv("data/products.csv")
    ```

    Line by line:

    - `from pyspark import pipelines as dp` is the import every pipeline file
      needs; `dp` is the conventional alias.
    - `spark: SparkSession` is only a type annotation. Since Spark 4.2 the
      framework injects `spark` into every pipeline file before running it,
      so you do not create a session yourself. The annotation keeps your
      editor from flagging `spark` as undefined.
    - The function name, `products`, becomes the table name.
    - The function returns a DataFrame and does nothing else.

    In this course, `data/` contains a small retail dataset: orders,
    customers, products and customer change events.

