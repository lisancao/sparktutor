    ## Welcome to Spark Declarative Pipelines

    Spark Declarative Pipelines (SDP) shipped in Apache Spark 4.1 as the open
    source version of the framework Databricks has run for years as Delta
    Live Tables / Lakeflow Declarative Pipelines. Spark 4.2 extends it with
    Auto CDC flows, which you will build in lesson 7.

    This course uses the real API: `pyspark.pipelines` and the
    `spark-pipelines` command line tool. Every exercise you submit is laid
    out as a pipeline project and executed with `spark-pipelines run`, the
    same way you would run it in production.

    ## What You'll Learn

    - The difference between imperative and declarative pipelines
    - The three building blocks: datasets, flows and pipelines
    - How to define your first materialized views with `@dp.materialized_view`
    - Why you never call `.write`, `.collect()` or `.count()` inside a pipeline

- Class: text
  Depth: all
  Output: |
    ## Imperative vs Declarative

    An imperative Spark job tells Spark *how* to build each table, in order:

    ```python
    orders = spark.read.json("data/orders")
    orders.write.mode("overwrite").saveAsTable("bronze_orders")

    silver = spark.table("bronze_orders").where("quantity > 0")
    silver.write.mode("overwrite").saveAsTable("silver_orders")
    ```

    You own the ordering, the write modes, the checkpoints for streaming,
    the retry logic and the bookkeeping for what was already processed. Add
    twenty tables and that orchestration code is most of your codebase.

    A declarative pipeline only says *what* each table should contain:

    ```python
    from pyspark import pipelines as dp

    @dp.materialized_view
    def bronze_orders():
        return spark.read.json("data/orders")

    @dp.materialized_view
    def silver_orders():
        return spark.table("bronze_orders").where("quantity > 0")
    ```

    Each function returns a DataFrame. SDP reads the functions, notices that
    `silver_orders` reads `bronze_orders`, builds a dependency graph, and then
    decides the order, the parallelism, the write mode and the checkpoint
    locations itself.

