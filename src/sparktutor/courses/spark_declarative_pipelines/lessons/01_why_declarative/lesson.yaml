  Output: |
    ## Where `spark` Comes From

    In Spark 4.1 every pipeline file had to start with
    `spark = SparkSession.active()`. Spark 4.2 injects `spark` into each
    module's namespace before executing it, so the assignment is optional.

    If you do assign it, use `SparkSession.active()`. The pipeline owns the
    session, so code that tries to change it is blocked: `spark.conf.set(...)`
    fails with `SESSION_MUTATION_IN_DECLARATIVE_PIPELINE`, and so do
    `setCurrentCatalog`, `setCurrentDatabase`, creating or dropping temp
    views and registering UDFs. `SparkSession.builder.config(...)` is not
    blocked, but it is a trap: `getOrCreate()` quietly returns the
    pipeline's session with your setting applied to it. Use the injected
    `spark`, and put settings in the spec file's `configuration` block or
    a decorator's `spark_conf`.

    Pipelines always run on Spark Connect. The `spark-pipelines` CLI starts
    a local Connect server when you do not pass `--remote`, which is why you
    will see Connect-style errors in this course.

- Class: text
  Depth: advanced
  Output: |
    ## Evaluation Model

    SDP imports your file to *register* graph elements, then resolves the
    graph, then executes flows. Open source Spark 4.2 calls each function
    once, at registration, to capture its query plan; other implementations
    may call it more than once. Either way, a function must only build and
    return a DataFrame. Actions such as `collect()`, `count()`,
    `toPandas()`, `save()`, `saveAsTable()`, `start()` and `toTable()`
    fail inside it with `ATTEMPT_ANALYSIS_IN_PIPELINE_QUERY_FUNCTION`.
    Side effects at module scope run at registration time, which is also
    why session changes such as `spark.conf.set(...)` are blocked there.

    Names resolve in the pipeline's default catalog and database
    (`catalog` / `database` in the spec), so `spark.table("bronze_orders")`
    finds the pipeline's own dataset before anything else in the catalog.

