- Class: text
  Depth: all
  Output: |
    ## Summary

    - SDP lets you declare *what* each table contains; the framework decides
      ordering, parallelism, write modes and checkpoints.
    - A pipeline is made of datasets (materialized views, streaming tables,
      temporary views) and the flows that fill them.
    - `@dp.materialized_view` turns a function returning a DataFrame into a
      table named after the function.
    - Since Spark 4.2, `spark` is injected into pipeline files; never build
      your own session or call actions inside dataset code.

    Next: the other two dataset types, and how several flows can write into
    one streaming table.
