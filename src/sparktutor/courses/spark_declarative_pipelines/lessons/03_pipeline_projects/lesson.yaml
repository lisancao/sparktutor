- Class: text
  Depth: all
  Output: |
    ## Project Layout

    `spark-pipelines init --name retail` generates:

    ```
    retail/
    ├── spark-pipeline.yml
    └── transformations/
        ├── example_python_materialized_view.py
        └── example_sql_materialized_view.sql
    ```

    The spec file is the only thing the CLI needs to find your code:

    ```yaml
    name: retail
    libraries:
      - glob:
          include: transformations/**
    storage: file:///abs/path/retail/pipeline-storage
    catalog: lake             # optional default catalog
    database: retail          # optional default database (alias: schema)
    configuration:            # optional Spark confs for the pipeline session
      spark.sql.shuffle.partitions: "8"
    ```

    - `name`, `libraries` and `storage` are required.
    - `libraries` globs are resolved relative to the spec file; every
      matching `.py` and `.sql` file is loaded.
    - `storage` holds streaming checkpoints. Lose it and every streaming
      table starts over.
    - `catalog` and `database` decide where unqualified dataset names live.
    - `configuration` is where session settings go. This is also the
      reliable place for catalog plugins such as
      `spark.sql.catalog.lake: org.apache.iceberg.spark.SparkCatalog`.

    Every exercise in this course is run by writing exactly such a project
    (your file becomes `transformations/exercise.py`, and the sample data is
    copied to `data/`).

