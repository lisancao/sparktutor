- Class: text
  Depth: all
  Output: |
    ## The CLI

    ```bash
    spark-pipelines init --name retail      # scaffold a project
    spark-pipelines dry-run                 # validate the graph, write nothing
    spark-pipelines run                     # incremental update of every dataset
    spark-pipelines run --full-refresh orders_raw,customers
    spark-pipelines run --full-refresh-all
    spark-pipelines run --refresh daily_revenue
    spark-pipelines run --spec path/to/spark-pipeline.yml
    spark-pipelines run --remote sc://cluster:15002
    ```

    Without `--spec`, the CLI looks for `spark-pipeline.yml` or
    `spark-pipeline.yaml` in the current directory and its parents.

    `dry-run` registers every dataset and analyzes every query without
    reading or writing data. It catches syntax errors, references to
    datasets that do not exist, unresolved columns and cyclic dependencies.

- Class: text
  Depth: intermediate
  Output: |
    ## Refresh Selection

    - No flag: incremental update. Streaming tables process new input only;
      materialized views are recomputed.
    - `--full-refresh a,b`: clear the data *and checkpoints* of `a` and `b`
      and recompute them from scratch. Use it after changing a streaming
      query's logic.
    - `--full-refresh-all`: the same for the whole graph.
    - `--refresh a,b`: update only those datasets, without clearing them.

    `--full-refresh-all` cannot be combined with the other two;
    `--full-refresh` and `--refresh` can be combined to treat different
    datasets differently.

- Class: text
  Depth: advanced
  Output: |
    ## spark-submit Arguments Go Before the Subcommand

    `spark-pipelines` is a thin wrapper over `spark-submit` (it launches
    `org.apache.spark.deploy.SparkPipelines`, which forces
    `spark.api.mode=connect` and starts a local Connect server unless you
    pass `--remote`). It accepts every `spark-submit` option except
    `--class`, but its argument parser stops at the first non-option, so
    `spark-submit` options must come *before* `run`:

    ```bash
    # correct: --driver-memory reaches spark-submit
    spark-pipelines --driver-memory 4g run --spec spark-pipeline.yml

    # wrong: everything after `run` is handed to the pipeline CLI instead
    spark-pipelines run --spec spark-pipeline.yml --driver-memory 4g
    ```

    Extra jars are a second trap: with the default local Connect server,
    classes from `--packages` were not visible to session extensions in
    our 4.2.0 tests, while `--driver-class-path` worked. Put catalog
    settings in the spec's `configuration` block rather than `--conf`.

- Class: text
  Depth: all
  Output: |
    ## SQL Files

    A `.sql` file in `transformations/` defines datasets with DDL. SQL and
    Python files share one graph, so each can read the other's datasets.
    With `orders_bronze` defined in Python, `transformations/silver.sql`
    can contain:

    ```sql
    CREATE STREAMING TABLE orders_placed
    AS SELECT * FROM STREAM orders_bronze WHERE status = 'placed';

    CREATE MATERIALIZED VIEW orders_by_status
    AS SELECT status, count(*) AS order_count
       FROM orders_bronze GROUP BY status;

    CREATE TEMPORARY VIEW recent_orders
    AS SELECT * FROM orders_bronze WHERE order_ts >= '2026-10-02';
    ```

    `STREAM orders_bronze` (or `STREAM(orders_bronze)`) marks a streaming
    read. SQL pipelines do not support `PIVOT`, and sinks are Python-only.
    (Some vendor docs show `read_files(...)` for ingestion; that function
    is not part of open source Spark 4.2, so ingest files from Python.)

