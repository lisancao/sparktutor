- Class: script
  Depth: all
  Output: |
    ## Exercise: Make the Dry Run Pass

    The starter file is a pipeline with three bugs. Its first line,
    `# spark-pipelines: dry-run`, tells the tutor to run
    `spark-pipelines dry-run` instead of `run`, so nothing is written.

    Submit it once as-is and read the error. Fix one bug at a time; they
    surface in this order because SDP validates the graph's shape before
    it analyzes each query:

    1. Two materialized views read each other. `revenue_by_customer`
       should aggregate `orders_enriched`; `top_customers` ranks its output.
    2. A dataset reads a table name that does not exist. SDP reports every
       downstream dataset as "failed to resolve due to upstream failure";
       look for the one line that says `Failed to resolve flow` without
       "upstream", and the `TABLE_OR_VIEW_NOT_FOUND` error under it.
    3. An aggregation groups by a column the input does not have
       (customers live in a `city`).

    Keep every dataset; the grader checks that they are all still defined.
  StarterFile: starter.py
  SolutionFile: solution.py
  RequiresExecution: true
  Validation:
    - "ast_contains(function='orders_enriched')"
    - "ast_contains(function='revenue_by_city')"
    - "ast_contains(function='revenue_by_customer')"
    - "ast_contains(function='top_customers')"
    - execution
  Hint: "Read the error class: TABLE_OR_VIEW_NOT_FOUND, UNRESOLVED_COLUMN and a circular dependency message each point at one dataset."

- Class: text
  Depth: all
  Output: |
    ## Summary

    - A pipeline project is a spec file plus source files matched by
      `libraries` globs; `storage` holds checkpoints.
    - `dry-run` validates the whole graph without touching data; make it
      part of your edit loop and your CI.
    - `--full-refresh` resets datasets (data and checkpoints);
      `--refresh` updates selected datasets incrementally.
    - `spark-submit` options go before the subcommand; catalog settings go
      in the spec's `configuration`.

    Next: the bronze layer, ingesting raw files into streaming tables.
