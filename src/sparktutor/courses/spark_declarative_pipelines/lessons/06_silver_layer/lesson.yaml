  AnswerChoices: "当一侧小到能放进 executor 内存时;当两张表都很大时;当你想去除重复时;当按多列关联时"
  CorrectAnswer: "当一侧小到能放进 executor 内存时"
  Hint: "广播会把整张小表发送到每个 executor，消除了 shuffle。"

