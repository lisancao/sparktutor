- Class: text
  Depth: intermediate
  Output: |
    ## 用关联做数据丰富

    Silver 是把事务数据与参考数据关联的地方。对小的查找表
    使用 `f.broadcast()`，以避免代价高昂的 shuffle：

    ```python
    products = spark.table("dim_products")  # small reference table

    enriched = orders.join(
        f.broadcast(products),
        on="product_id",
        how="left"
    )
    ```

    `f.broadcast()` 把小表发送到每个 executor，因此大的
    orders 表保持原地不动。这比 shuffle join 快得多。

    **文档：** [f.broadcast](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.broadcast.html) —— 包装小 DataFrame |
    [DataFrame.join](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.join.html) —— `on`、`how` 参数

- Class: mult_question
