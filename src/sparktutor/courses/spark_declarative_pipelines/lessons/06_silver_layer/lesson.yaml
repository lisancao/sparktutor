    ## What You'll Learn

    Bronze preserved raw data faithfully. Now the **silver layer**
    transforms it into clean, typed, enriched data that downstream
    consumers can trust.

    By the end of this lesson you will be able to:

    - Cast bronze string columns to proper types (double, int, timestamp)
    - Handle null values from failed casts
    - Compute derived columns (totals, time extractions)
    - Enrich records by joining with reference tables
    - Parse embedded JSON columns (intermediate)
    - Implement SCD Type 2 joins for historical dimensions (advanced)

