    ## Silver Layer Responsibilities

    The silver layer performs four kinds of transformations:

    1. **Type casting** — convert strings to proper types
    2. **Data cleaning** — handle nulls, trim whitespace, standardize
    3. **Enrichment** — join with reference/dimension tables
    4. **Feature extraction** — parse nested fields, extract time components

    Each of these makes the data more useful for gold-layer aggregations
    and analytics.

- Class: text
  Depth: beginner
  Output: |
    The most common silver operation is casting bronze string columns:

    ```python
    from pyspark.sql import functions as f

    def silver_orders(spark):
        bronze = spark.table("bronze_orders")
        return (bronze
            .withColumn("price", f.col("price").cast("double"))
            .withColumn("quantity", f.col("quantity").cast("int"))
            .withColumn("order_date",
                f.to_date(f.col("order_date_str"), "yyyy-MM-dd"))
            .drop("order_date_str")
        )
    ```

    If a value cannot be cast (e.g., "N/A" to double), Spark produces
    `null`. Those rows can be filtered out or sent to a quarantine table.

    **Docs:**
    [Column.cast](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.Column.cast.html) — `cast("double")`, `cast("int")`, `cast(TimestampType())` |
    [f.to_date](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.to_date.html) — `format` parameter for date patterns |
    [f.from_json](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.from_json.html) — `schema` parameter for parsing JSON strings

