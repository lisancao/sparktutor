    ## Enrichment with Joins

    Silver is where you join transactional data with reference data.
    Use `f.broadcast()` for small lookup tables to avoid expensive
    shuffles:

    ```python
    products = spark.table("dim_products")  # small reference table

    enriched = orders.join(
        f.broadcast(products),
        on="product_id",
        how="left"
    )
    ```

    `f.broadcast()` sends the small table to every executor, so the
    large orders table stays in place. This is significantly faster than
    a shuffle join.

    **Docs:** [f.broadcast](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.broadcast.html) — wrap the small DataFrame |
    [DataFrame.join](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.join.html) — `on`, `how` parameters

