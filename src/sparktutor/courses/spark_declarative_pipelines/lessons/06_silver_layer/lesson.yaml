    ## Parsing JSON Columns

    Bronze data from APIs or Kafka often contains raw JSON strings. The
    silver layer parses them into structured columns:

    ```python
    from pyspark.sql.types import StructType, StructField, StringType

    payload_schema = StructType([
        StructField("action", StringType()),
        StructField("item_count", IntegerType()),
    ])

    df = (df
        .withColumn("parsed", f.from_json(f.col("payload"), payload_schema))
        .select("*", "parsed.action", "parsed.item_count")
        .drop("parsed", "payload"))
    ```

    `from_json` converts a JSON string column into a struct column. You
    then access individual fields with dot notation (`parsed.action`).

