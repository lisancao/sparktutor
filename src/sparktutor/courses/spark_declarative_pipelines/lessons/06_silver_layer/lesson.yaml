    ## SCD Type 2 Joins

    **Slowly Changing Dimensions (SCD Type 2)** track historical changes
    to reference data. Each dimension row has `valid_from` and `valid_to`
    timestamps.

    To join a fact table against an SCD-2 dimension, match on key AND
    time range:

    ```python
    enriched = facts.join(dim,
        (facts.product_id == dim.product_id) &
        (facts.order_date >= dim.valid_from) &
        (facts.order_date < dim.valid_to),
        how="left")
    ```

    **Data quality flags** can also be added in silver to catch suspicious
    records before they reach gold:

    ```python
    df = df.withColumn("_dq_price_valid",
        f.when(f.col("price") > 0, True).otherwise(False))
    ```

