    ## 解析 JSON 列

    来自 API 或 Kafka 的 bronze 数据通常包含原始 JSON 字符串。
    silver 层把它们解析成结构化列：

    ```python
    from pyspark.sql.types import StructType, StructField, StringType

    payload_schema = StructType([
        StructField("action", StringType()),
        StructField("item_count", IntegerType()),
    ])

    df = (df
        .withColumn("parsed", f.from_json(f.col("payload"), payload_schema))
        .select("*", "parsed.action", "parsed.item_count")
        .drop("parsed", "payload"))
    ```

    `from_json` 把一个 JSON 字符串列转成 struct 列。然后你
    用点号访问各个字段（`parsed.action`）。

- Class: cmd_question
  Depth: intermediate
  Output: |
    给定一个 DataFrame `events_df`，其中有一个字符串列
    `metadata`，内容是类似 `{"browser": "Chrome", "os": "Linux"}`
    的 JSON，把它解析成独立的 `browser` 和 `os` 列。
    并删除原始的 `metadata` 列。
  CorrectAnswer: |
    from pyspark.sql import functions as f
    from pyspark.sql.types import StructType, StructField, StringType

    meta_schema = StructType([
        StructField("browser", StringType()),
        StructField("os", StringType()),
    ])

    result = (events_df
        .withColumn("parsed", f.from_json(f.col("metadata"), meta_schema))
        .select("*", "parsed.browser", "parsed.os")
        .drop("parsed", "metadata"))
  Hint: "为 JSON 定义一个 StructType，用 f.from_json，然后 select 嵌套字段。"

