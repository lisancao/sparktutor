    ## 小结

    你的 silver 层现在产出干净、类型化、经过丰富的数据：

    - **类型转换** —— 字符串转 double、int、timestamp
    - **Null 处理** —— 过滤或隔离无法解析的值
    - **派生列** —— 计算合计、提取时间分量
    - **数据丰富** —— 与维表做 broadcast join
    - **JSON 解析** —— 从原始 JSON 字符串生成结构化列

    Silver 数据值得信赖、可直接用于分析。在下一课中，
    你将构建 **gold 层** —— 回答具体业务问题的聚合和排名。
