    ## SCD Type 2 关联

    **缓慢变化维（SCD Type 2）**追踪参考数据的历史变化。
    每个维度行都有 `valid_from` 和 `valid_to` 时间戳。

    要把事实表与 SCD-2 维度关联，需要同时匹配键**和**时间范围：

    ```python
    enriched = facts.join(dim,
        (facts.product_id == dim.product_id) &
        (facts.order_date >= dim.valid_from) &
        (facts.order_date < dim.valid_to),
        how="left")
    ```

    **数据质量标志**也可以在 silver 层添加，在可疑记录到达
    gold 之前捕获它们：

    ```python
    df = df.withColumn("_dq_price_valid",
        f.when(f.col("price") > 0, True).otherwise(False))
    ```

