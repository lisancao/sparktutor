    ## 你将学到什么

    Bronze 忠实地保留了原始数据。现在 **silver 层**将其
    转换为干净、类型化、经过丰富的数据，供下游使用者信任。

    学完本课后，你将能够：

    - 把 bronze 字符串列转换为正确类型（double、int、timestamp）
    - 处理转换失败产生的 null 值
    - 计算派生列（合计、时间提取）
    - 通过关联维表来丰富记录
    - 解析内嵌的 JSON 列（中级）
    - 为历史维度实现 SCD Type 2 关联（高级）

- Class: text
  Depth: all
  Output: |
    ## Silver 层的职责

    silver 层执行四类转换：

    1. **类型转换** —— 把字符串转成正确类型
    2. **数据清洗** —— 处理 null、去除空格、标准化
    3. **丰富（Enrichment）** —— 与维表/维度表关联
    4. **特征提取** —— 解析嵌套字段、提取时间分量

    每一步都让数据对 gold 层的聚合和分析更有用。

- Class: text
  Depth: beginner
  Output: |
    最常见的 silver 操作是转换 bronze 字符串列：

    ```python
    from pyspark.sql import functions as f

    def silver_orders(spark):
        bronze = spark.table("bronze_orders")
        return (bronze
            .withColumn("price", f.col("price").cast("double"))
            .withColumn("quantity", f.col("quantity").cast("int"))
            .withColumn("order_date",
                f.to_date(f.col("order_date_str"), "yyyy-MM-dd"))
            .drop("order_date_str")
        )
    ```

    如果某个值无法转换（例如把 "N/A" 转成 double），Spark
    会产生 `null`。这些行可以被过滤掉，或发送到隔离表。

    **文档：**
    [Column.cast](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.Column.cast.html) —— `cast("double")`、`cast("int")`、`cast(TimestampType())` |
    [f.to_date](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.to_date.html) —— 日期模式的 `format` 参数 |
    [f.from_json](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.from_json.html) —— 解析 JSON 字符串的 `schema` 参数

