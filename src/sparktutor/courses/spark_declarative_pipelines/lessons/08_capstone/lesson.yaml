    ## What You'll Build

    One pipeline file that takes the raw retail files to business-ready
    tables, plus an outbound feed:

    ```
    data/orders/*.json ──> bronze_orders ──> orders_typed ──> orders_checked ──┬─> silver_orders ──> billable_orders ──┬─> gold_daily_revenue
                                 │                                 ▲            └─> quarantine_orders                   ├─> gold_customer_value
    data/customers.csv ──> bronze_customers ──> silver_customers ──┘                                                    └─> gold_revenue_<category>
    data/products.csv  ──────────────────────> silver_products ─────────────────────────────────────────────────────────────┘
                                 │
                                 └──> shipped_orders_to_feed ──> shipping_feed (JSON sink)
    ```

    You have written every piece already. The new parts are the sink and
    the reconciliation checks, which test the layers *against each other*
    instead of against fixed numbers alone.

