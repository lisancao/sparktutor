    ## Sinks: Writing Outside the Pipeline

    Datasets are tables the pipeline owns. A *sink* is an external
    destination: a Kafka topic for a downstream service, files for a
    partner, an event hub. Sinks are Python-only and streaming-only: you
    declare one, then attach append flows to it.

    ```python
    dp.create_sink(
        name="shipping_feed",
        format="json",                                   # any streaming sink format
        options={"path": "exports/shipping_feed"},
    )

    @dp.append_flow(target="shipping_feed")
    def shipped_orders_to_feed():
        return (spark.readStream.table("bronze_orders")
                .where("status = 'shipped'")
                .select("order_id", "customer_id", "product_id", "quantity", "order_ts"))
    ```

    For Kafka, use `format="kafka"` with `kafka.bootstrap.servers` and
    `topic` options, and produce `key`/`value` columns (for example
    `to_json(struct("*"))` as the value).

    A full refresh resets a sink flow's checkpoint but cannot un-send what
    was already delivered: downstream consumers must tolerate replays.

