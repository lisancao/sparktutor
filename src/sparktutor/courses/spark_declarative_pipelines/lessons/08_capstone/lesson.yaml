    ## Course Complete

    You have built, with the real Spark 4.2 API:

    - materialized views, streaming tables, temporary views and multi-flow
      targets,
    - a pipeline project validated with `dry-run` and run with
      `spark-pipelines run`,
    - bronze ingestion with lineage, silver typing, deduplication and
      quarantine, gold aggregates with windows and generated datasets,
    - an Auto CDC flow (SCD Type 1) and an outbound sink,
    - data quality checks that reconcile layers with each other.

    The last lesson is optional: it rebuilds a toy version of the SDP
    scheduler from scratch, so you can see what the framework does with
    the graph you declare.
