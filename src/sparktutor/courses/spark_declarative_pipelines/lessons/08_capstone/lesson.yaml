    ## Reconciliation Checks

    Fixed-number checks ("silver has 7 rows") only work on known data.
    Production pipelines check invariants between layers, which hold for
    any input:

    - **Conservation**: every unique bronze order lands in exactly one of
      silver or quarantine.
    - **Reconciliation**: every gold table that sums revenue agrees with
      the billable silver total.

    ```python
    @dp.materialized_view
    def check_gold_reconciles_with_silver():
        billable = spark.table("silver_orders").where("status <> 'cancelled'").agg(F.sum("line_total").alias("s"))
        daily = spark.table("gold_daily_revenue").agg(F.sum("revenue").alias("d"))
        return billable.crossJoin(daily).select(
            F.assert_true(F.col("s") == F.col("d"), "gold_daily_revenue does not reconcile").alias("ok"))
    ```

    If someone later "fixes" one gold table to include cancelled orders,
    this check fails the run before anybody reads a wrong dashboard.

