    ## Taking It to Production

    - **Catalog**: set `catalog`/`database` in the spec and configure an
      Iceberg catalog in `configuration`, so tables are transactional and
      visible to other engines. This is also what lets lesson 7's Auto CDC
      flows run.
    - **Cluster**: `spark-pipelines --master spark://host:7077 run` or
      `--remote sc://host:15002`; spark-submit options before `run`.
    - **Scheduling**: a pipeline run is a batch job with available-now
      streaming semantics, so any scheduler (Airflow, cron, Kubernetes
      CronJob) can trigger `spark-pipelines run`.
    - **CI**: run `spark-pipelines dry-run` on every change; it catches
      broken references, unresolved columns and cycles in seconds.
    - **Known 4.2.0 gaps** covered in this course: several append flows
      into one parquet table race on the file sink's commit log, and
      `dropDuplicates([...])` / `.drop(...)` on pipeline datasets fail at
      registration.

