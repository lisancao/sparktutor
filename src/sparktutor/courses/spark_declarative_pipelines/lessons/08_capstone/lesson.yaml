    ## Running It for Real

    Outside the tutor, this file is `transformations/retail.py` in a
    project:

    ```bash
    spark-pipelines init --name retail
    # replace the example files with retail.py and copy data/ next to the spec
    cd retail
    spark-pipelines dry-run
    spark-pipelines run
    spark-pipelines run                         # second run: no new files, bronze appends nothing
    spark-pipelines run --full-refresh-all      # rebuild everything from the raw files
    ```

    Add a new file to `data/orders/` between runs and watch only that file
    flow through bronze, while every materialized view recomputes.

