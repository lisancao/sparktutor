  Output: |
    ## Summary

    - Bronze is append-only, faithful and lineage-rich; cleaning waits for
      silver.
    - Streaming file sources need explicit schemas; keep fragile fields as
      strings and convert them later with `try_cast`.
    - `_metadata.file_name` / `_metadata.file_path` record lineage for
      files; `topic`/`partition`/`offset` do the same for Kafka.

    Next: silver, where duplicates, malformed values and orphans are dealt
    with.
