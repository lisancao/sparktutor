- Class: text
  Depth: all
  Output: |
    ## The Bronze Contract

    Bronze is the system of record for what arrived. It answers "what did
    the source send us, and when?", so it should be:

    - **Append-only**: a streaming table, so each run only adds new input.
    - **Faithful**: no filtering, no deduplication, no business rules. If
      the source sent a duplicate or an `"N/A"` price, bronze keeps it;
      that is how you debug the source later.
    - **Lineage-rich**: which file (or Kafka partition and offset) each row
      came from, and when it was ingested.

    Cleaning happens in silver. Keeping the two apart means you can always
    rebuild silver from bronze when the rules change.

