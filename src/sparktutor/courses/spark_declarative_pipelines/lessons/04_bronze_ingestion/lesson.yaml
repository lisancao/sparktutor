    ## Explicit Schemas for Streaming Files

    Streaming file sources require a schema up front:

    ```python
    ORDER_SCHEMA = (
        "order_id STRING, customer_id STRING, product_id STRING, quantity INT, "
        "unit_price STRING, status STRING, order_ts STRING"
    )

    @dp.table
    def bronze_orders() -> DataFrame:
        return spark.readStream.schema(ORDER_SCHEMA).json("data/orders")
    ```

    Notice `unit_price STRING` and `order_ts STRING`. The source sometimes
    sends `"N/A"` for a price; with ANSI mode on (the default since Spark
    4.0) a strict cast would fail the whole run. Bronze stores the raw
    string, and silver converts it with `try_cast`, which turns malformed
    values into NULL so they can be quarantined.

- Class: text
  Depth: beginner
  Output: |
    ## Lineage Columns

    Every file-based DataFrame has a hidden `_metadata` struct. Select its
    fields to record where a row came from:

    ```python
    from pyspark.sql import functions as F

    (spark.readStream.schema(ORDER_SCHEMA).json("data/orders")
        .withColumn("_source_file", F.col("_metadata.file_name"))
        .withColumn("_ingested_at", F.current_timestamp()))
    ```

    `_metadata` also has `file_path`, `file_size`,
    `file_modification_time` and `file_block_start`. The leading underscore
    on the new columns is a convention: these describe ingestion, not the
    business data.

- Class: text
  Depth: intermediate
  Output: |
    ## Useful File Source Options

    ```python
    (spark.readStream
        .schema(ORDER_SCHEMA)
        .option("maxFilesPerTrigger", 100)       # cap work per micro-batch
        .option("pathGlobFilter", "*.json")      # only matching file names
        .option("recursiveFileLookup", "true")   # descend into subdirectories
        .json("landing/orders"))
    ```

    A pipeline run uses available-now semantics: it processes every file
    that arrived since the last checkpoint (in as many micro-batches as
    `maxFilesPerTrigger` requires) and then stops. Files are identified by
    path, so rewriting a file in place does not re-ingest it.

    Older tutorials use `input_file_name()` for lineage. It still works,
    but `_metadata` gives you the path, name, size and modification time
    in one struct, and makes it obvious in the code that the value comes
    from the file source.

- Class: text
  Depth: advanced
  Output: |
    ## Bronze from Kafka

    ```python
    @dp.table(comment="Raw order events from Kafka")
    def bronze_orders_kafka() -> DataFrame:
        return (
            spark.readStream.format("kafka")
            .option("kafka.bootstrap.servers", "localhost:9092")
            .option("subscribe", "orders")
            .option("startingOffsets", "earliest")
            .load()
            .select(
                F.col("key").cast("string"),
                F.col("value").cast("string").alias("payload"),
                "topic", "partition", "offset",
                F.col("timestamp").alias("_kafka_ts"),
            )
        )
    ```

    Keep the payload as a string (or binary) in bronze and parse it with
    `from_json` in silver: a schema change upstream then breaks silver
    loudly instead of silently dropping fields at ingestion.
    `topic`/`partition`/`offset` are your lineage. The Kafka source needs
    the `spark-sql-kafka-0-10_2.13` package matching your Spark version;
    the lakehouse execution mode has it preinstalled.

