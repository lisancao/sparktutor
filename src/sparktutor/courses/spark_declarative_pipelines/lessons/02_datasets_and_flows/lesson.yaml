    ## Summary

    - Streaming tables (`@dp.table`) for append-only input, materialized
      views for recomputed results, temporary views for shared logic.
    - `dp.create_streaming_table` + `@dp.append_flow` let several flows feed
      one table, each with its own checkpoint.
    - Dataset decorators share options such as `name`, `comment`,
      `partition_cols`, `cluster_by`, `schema` and `table_properties`.

    Next: the pipeline project around your code, and the `spark-pipelines`
    CLI that runs it.
