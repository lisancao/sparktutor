- Class: text
  Depth: advanced
  Output: |
    ## How Incrementality Is Tracked

    Each streaming flow gets a checkpoint under
    `<storage>/_checkpoints/<catalog>/<database>/<table>/<flow>`. A run executes
    streaming flows with available-now semantics: process everything new,
    then stop. Run twice without new files and the second run appends
    nothing.

    Consequences worth internalizing:

    - Renaming a flow abandons its checkpoint; the renamed flow starts from
      scratch and will re-append everything. Name flows deliberately.
    - Changing a streaming query (new filter, new column) does not rewrite
      old rows. Use `spark-pipelines run --full-refresh orders_raw` to clear
      the table and its checkpoints and recompute.
    - Materialized views have no checkpoint; every run recomputes them from
      their inputs.

