- Class: text
  Depth: all
  Output: |
    ## Known Issue in Spark 4.2.0: Concurrent Flows into a Parquet Table

    While building this course we ran two append flows into one
    parquet-backed streaming table on local Spark 4.2.0. Both flows started
    at once, both tried to commit batch 0 to the table's shared
    `_spark_metadata` log, and one failed with
    `IllegalStateException: Race while writing batch 0`. After the automatic
    retry the run reported success, but readers saw only one flow's rows:
    the other flow's parquet files were on disk yet missing from the log.

    The API is right; the default parquet file sink is the problem, because
    it keeps a single commit log per table. Until that is fixed, treat
    multi-flow targets as something to run on a table format with real
    transactional commits (Iceberg, through a catalog in the spec), and
    always put a row-count check downstream of them. The exercise below
    uses one append flow, which is safe on parquet.

