- Class: text
  Depth: beginner
  Output: |
    ## A Streaming Table

    ```python
    @dp.table
    def bronze_orders() -> DataFrame:
        return spark.readStream.schema(ORDER_SCHEMA).json("data/orders")
    ```

    The only difference from a materialized view is `readStream` instead of
    `read`, and `@dp.table` instead of `@dp.materialized_view`. Streaming
    file sources need an explicit schema, because Spark cannot sample files
    that have not arrived yet.

    A downstream materialized view can read a streaming table in batch with
    `spark.table("bronze_orders")`; a downstream streaming table reads it
    incrementally with `spark.readStream.table("bronze_orders")`.

- Class: text
  Depth: all
  Output: |
    ## Several Flows, One Table

    A decorator like `@dp.table` creates a dataset and its single flow
    together. Sometimes one table needs several writers: a one-time backfill
    plus a live feed, or one feed per region. Split the two steps:

    ```python
    dp.create_streaming_table("orders_raw")

    @dp.append_flow(target="orders_raw")
    def backfill() -> DataFrame:
        return spark.readStream.schema(ORDER_SCHEMA).json("archive/orders")

    @dp.append_flow(target="orders_raw")
    def live() -> DataFrame:
        return spark.readStream.schema(ORDER_SCHEMA).json("landing/orders")
    ```

    Each append flow has its own checkpoint, so you can add a new flow later
    without reprocessing the others. (Read the known issue below before you
    point several flows at a parquet table.) The SQL equivalent is
    `CREATE STREAMING TABLE orders_raw;` followed by
    `CREATE FLOW backfill AS INSERT INTO orders_raw SELECT * FROM STREAM(...)`.

