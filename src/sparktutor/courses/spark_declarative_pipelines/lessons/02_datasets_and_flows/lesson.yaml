- Class: text
  Depth: all
  Output: |
    ## The Three Dataset Types

    | Decorator | Dataset | Query | Refresh behaviour |
    |-----------|---------|-------|-------------------|
    | `@dp.materialized_view` | Materialized view | batch (`spark.read`, `spark.table`) | recomputed from its inputs on each run |
    | `@dp.table` | Streaming table | streaming (`spark.readStream`) | processes only data that arrived since the last run |
    | `@dp.temporary_view` | Temporary view | batch or streaming | not stored; exists only during the run |

    The deciding question is *how the input grows*:

    - Append-only input (files landing in a directory, Kafka topics, event
      logs) fits a **streaming table**: each run picks up only new records,
      tracked by a checkpoint in the pipeline's `storage` directory.
    - Small or frequently corrected input (dimension tables, aggregates
      over everything) fits a **materialized view**: the result always
      equals the query over the current inputs.
    - Shared intermediate logic that does not need to be stored fits a
      **temporary view**.

