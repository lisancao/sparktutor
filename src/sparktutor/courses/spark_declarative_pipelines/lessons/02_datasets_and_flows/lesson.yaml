  Output: |
    ## Dataset Options

    `@dp.materialized_view` and `@dp.table` accept the same keyword
    arguments (verified against the Spark 4.2 `pyspark.pipelines.api`):

    ```python
    @dp.table(
        name="orders_bronze",            # table name, defaults to the function name
        comment="Raw order events",
        table_properties={"quality": "bronze"},
        partition_cols=["order_date"],   # or cluster_by=[...], not both
        schema="order_id STRING, ...",   # enforce the output schema
        format="parquet",                # table format; parquet unless the catalog says otherwise
        spark_conf={"spark.sql.shuffle.partitions": "8"},  # per-flow configuration
    )
    def bronze_orders(): ...
    ```

    `dp.create_streaming_table` takes the same options, plus `name` as its
    first argument. `@dp.append_flow` accepts `target`, `name` and
    `spark_conf`. `@dp.temporary_view` accepts `name`, `comment` and
    `spark_conf` (it is never stored, so storage options do not apply).

