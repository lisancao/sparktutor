    ## The Quarantine Pattern

    Compute a `_reason` once, then split on it:

    ```python
    @dp.temporary_view
    def orders_checked():
        known = spark.table("silver_customers").select("customer_id", F.lit(True).alias("_known"))
        return (
            spark.table("orders_typed").join(known, "customer_id", "left")
            .withColumn("_reason",
                F.when(F.col("unit_price").isNull(), "invalid_price")
                 .when(F.col("quantity") <= 0, "invalid_quantity")
                 .when(F.col("_known").isNull(), "unknown_customer"))
        )

    @dp.materialized_view
    def silver_orders():
        return spark.table("orders_checked").where("_reason IS NULL").select(...)

    @dp.materialized_view
    def quarantine_orders():
        return spark.table("orders_checked").where("_reason IS NOT NULL").select(...)
    ```

    Because both tables come from the same view, every row lands in
    exactly one of them. That invariant is easy to check: the two counts
    must add up to the deduplicated input.

