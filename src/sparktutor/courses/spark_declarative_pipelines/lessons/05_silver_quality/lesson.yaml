    ## What Silver Promises

    Silver is the layer analysts and downstream jobs trust. Each row has:

    - correct types (decimals, timestamps, dates, not strings),
    - one row per business key (no duplicate events),
    - valid values, and references that resolve (no orders for customers
      that do not exist).

    Rows that break a rule are not silently dropped. They go to a
    *quarantine* table with the reason, so someone can fix the source.

