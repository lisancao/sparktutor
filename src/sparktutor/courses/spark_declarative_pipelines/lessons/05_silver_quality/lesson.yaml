    ## Summary

    - Cast with `try_cast` so malformed values become NULL instead of
      failing the run under ANSI mode.
    - Deduplicate with `row_number()` over a window; in 4.2.0 pipelines,
      avoid `dropDuplicates([...])` and `.drop(...)` on pipeline datasets.
    - Split rows into silver and quarantine from one checked view, so every
      input row is accounted for.
    - OSS SDP has no expectation decorators; use quarantine tables and
      `assert_true` check datasets.

    Next: gold aggregates for the business.
