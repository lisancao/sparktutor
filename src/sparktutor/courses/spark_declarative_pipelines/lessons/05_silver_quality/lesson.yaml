    ## Deduplicating Inside a Pipeline

    The natural code is `spark.table("bronze_orders").dropDuplicates(["order_id"])`.
    In Spark 4.2.0 that fails while the pipeline is *registering* the
    dataset, with `TABLE_OR_VIEW_NOT_FOUND` for `bronze_orders`, even
    though `bronze_orders` is defined. The same happens with
    `.drop("some_column")`.

    The cause is in the Spark Connect planner: for those two operations it
    resolves column names against the input eagerly, at registration time,
    before the pipeline's own datasets exist in the catalog. Operations
    such as `select`, `where`, `withColumn`, `join` and window functions
    are resolved later and work fine.

    The window pattern avoids it, and it is more explicit about *which*
    duplicate wins:

    ```python
    from pyspark.sql.window import Window

    latest_first = Window.partitionBy("order_id").orderBy(F.col("_ingested_at").desc())

    (spark.table("bronze_orders")
        .withColumn("_rn", F.row_number().over(latest_first))
        .where("_rn = 1")
        .select("order_id", "customer_id", ...))   # explicit select instead of .drop("_rn")
    ```

