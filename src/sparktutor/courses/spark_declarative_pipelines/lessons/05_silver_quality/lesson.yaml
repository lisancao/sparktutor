    The starter already contains the bronze layer from lesson 4. Add:

    1. `silver_customers` (materialized view): `bronze_customers` with
       `signup_date` cast to DATE; columns `customer_id, name, email, city, signup_date`.
    2. `orders_typed` (temporary view): `bronze_orders` deduplicated on
       `order_id` with a window (keep the latest `_ingested_at`), with
       `unit_price` as `DECIMAL(10,2)` via `try_cast` and `order_ts` as a
       timestamp.
    3. `orders_checked` (temporary view): `orders_typed` plus `_reason`
       (`invalid_price`, `invalid_quantity` or `unknown_customer`, else NULL).
    4. `silver_orders` (materialized view): rows with no `_reason`, plus
       `city` from `silver_customers` and `line_total` = quantity * unit_price.
    5. `quarantine_orders` (materialized view): rows with a `_reason`.

    Cancelled orders are valid silver rows; whether to count them is a
    gold decision.
