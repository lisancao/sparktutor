    ## Data Quality in Open Source SDP

    Databricks pipelines have expectation decorators (`@dlt.expect`,
    `expect_or_drop`, `expect_or_fail`). Open source Spark 4.2's
    `pyspark.pipelines` does not: its public API is `materialized_view`,
    `table`, `temporary_view`, `create_streaming_table`, `append_flow`,
    `create_sink` and `create_auto_cdc_flow`.

    Two building blocks cover most needs:

    - **Quarantine tables** for row-level rules (keep the bad rows, with a
      reason).
    - **Check datasets** for table-level rules: a materialized view that
      aggregates and calls `assert_true`, which fails the run with your
      message. Every exercise in this course is graded that way:

    ```python
    @dp.materialized_view
    def check_silver_orders():
        return spark.table("silver_orders").agg(F.count("*").alias("n")).select(
            F.assert_true(F.col("n") > 0, "silver_orders is empty").alias("ok"))
    ```

    Aggregate before asserting, so the check always produces exactly one
    row; a filter that matches nothing would otherwise pass silently.

