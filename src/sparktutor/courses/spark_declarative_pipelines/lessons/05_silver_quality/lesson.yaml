    ## Safe Casting Under ANSI Mode

    ANSI SQL mode has been on by default since Spark 4.0. Under ANSI rules,
    `CAST('N/A' AS DECIMAL(10,2))` raises `CAST_INVALID_INPUT` and fails the
    flow. In Spark 3 the same cast quietly returned NULL.

    `try_cast` keeps the Spark 3 behaviour on purpose, one expression at a
    time:

    ```python
    F.expr("try_cast(unit_price AS DECIMAL(10,2))").alias("unit_price")
    F.col("unit_price").try_cast("decimal(10,2)")          # Column API, Spark 4.0+
    F.to_timestamp("order_ts").alias("order_ts")
    ```

    A NULL from `try_cast` where the input was not NULL means "malformed",
    which is exactly the signal the quarantine needs.

