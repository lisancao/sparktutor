    ## Streaming Silver

    Here silver is a materialized view, recomputed each run, which is right
    for corrections and small data. For high-volume append-only data you
    would make silver a streaming table that reads
    `spark.readStream.table("bronze_orders")`. Then:

    - deduplication needs bounded state:
      `withWatermark("order_ts", "1 day")` plus
      `dropDuplicatesWithinWatermark(["order_id"])` (Spark 3.5+), keeping
      the registration-time caveat above in mind;
    - stream-static joins against a materialized view dimension see the
      dimension as of each micro-batch;
    - late corrections to already-written rows need a CDC flow (lesson 7)
      rather than an append.

