  Output: |
    ## 你将学到什么

    有了 SparkSession，是时候学习驱动每个管道阶段的转换了。
    bronze 层用它们来添加元数据列。silver 层用它们来做类型转换
    并过滤脏数据。gold 层用它们来计算聚合。

    学完本课后，你将能够：

    - 使用 `select()`、`filter()` 和 `withColumn()` 转换数据
    - 用 `f.col()` 引用列，用 `f.lit()` 创建常量
    - 用 `f.when().otherwise()` 编写条件逻辑
    - 将转换链式组合成可读的管道
    - 编写 Arrow 优化的 UDF 实现自定义逻辑（高级）

- Class: text
  Depth: all
  Output: |
    Spark 在 `pyspark.sql.functions` 中内置了数百个函数。
    惯例是将其导入为 `f`：

    ```python
    from pyspark.sql import functions as f
    ```

    你几乎在每个管道步骤中都会用到的三个转换：

    - `select()` —— 选择要保留哪些列
    - `filter()`（或 `where()`）—— 只保留满足条件的行
    - `withColumn()` —— 添加或替换一列

    所有转换都是**惰性的**。在调用 `.show()`、`.count()` 或 `.write`
    等**动作**之前，什么都不会执行。

- Class: text
  Depth: beginner
  Output: |
    下面是一个简单示例。假设有一个 DataFrame `df`，包含列
    `name`、`age` 和 `city`：

    ```python
    # Keep only name and age
    df.select("name", "age")

    # Keep rows where age > 30
    df.filter(f.col("age") > 30)

    # Add a computed column
    df.withColumn("birth_year", f.lit(2026) - f.col("age"))
    ```

    关键辅助函数：
    - `f.col("name")` —— 按名称引用一列
    - `f.lit(42)` —— 创建一个常量（字面量）列
    - `f.when(condition, value).otherwise(default)` —— 条件逻辑

    **文档：**
    [select](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.select.html) |
    [filter](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.filter.html) |
    [withColumn](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.withColumn.html) |
    [f.col](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.col.html) |
    [f.lit](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.lit.html) |
    [f.when](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.when.html)

