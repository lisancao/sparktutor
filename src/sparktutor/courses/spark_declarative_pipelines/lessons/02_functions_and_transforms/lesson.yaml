  Output: |
    ## Chaining Transformations

    Real pipeline code chains multiple transformations together. Spark
    builds a logical plan and only executes when an action triggers it:

    ```python
    result = (df
        .filter(f.col("quantity") > 0)
        .withColumn("total", f.col("price") * f.col("quantity"))
        .select("product", "total")
    )
    result.show()  # action triggers execution
    ```

    This pattern — filter bad data, compute derived columns, select the
    final output — is exactly what the silver layer of our pipeline will
    do. You are building the vocabulary for it now.

