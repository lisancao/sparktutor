  Output: |
    ## 链式组合转换

    真实的管道代码会将多个转换链式组合在一起。Spark
    构建一个逻辑计划，只有当动作触发时才执行：

    ```python
    result = (df
        .filter(f.col("quantity") > 0)
        .withColumn("total", f.col("price") * f.col("quantity"))
        .select("product", "total")
    )
    result.show()  # action triggers execution
    ```

    这种模式 —— 过滤脏数据、计算派生列、选择最终输出 ——
    正是我们管道的 silver 层将要做的事情。你现在正在为它
    积累词汇。

