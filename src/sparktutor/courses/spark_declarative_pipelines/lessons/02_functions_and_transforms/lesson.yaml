    ## 小结

    你现在掌握了核心的转换词汇：

    - `select()` —— 选择列
    - `filter()` —— 选择行
    - `withColumn()` —— 添加或替换列
    - `f.col()`、`f.lit()`、`f.when().otherwise()` —— 列表达式
    - Arrow UDF 用于自定义逻辑（高级）

    这些转换是每一层管道的构建块。下一课中，你将学习
    **读写数据** —— 将你的转换与外部世界连接起来的 I/O 层。
