- Class: cmd_question
  Depth: advanced
  Output: |
    Write a pandas UDF called `normalize` that takes a pandas Series of
    doubles and returns each value divided by the series maximum. Declare
    the return type as `'double'`.
  CorrectAnswer: |
    import pandas as pd
    from pyspark.sql.functions import pandas_udf

    @pandas_udf("double")
    def normalize(s: pd.Series) -> pd.Series:
        return s / s.max()
  Hint: "Use @pandas_udf('double') decorator. Divide the series by s.max()."

