  Hint: "f.when(condition, value).otherwise(default_value) returns a Column expression."

- Class: text
  Depth: advanced
  Output: |
    ## Arrow-Optimized UDFs

    When built-in functions are not enough, you can write custom logic
    with UDFs. Classic Python UDFs serialize data row-by-row between the
    JVM and Python, which is slow.

    Spark 4.x encourages **Arrow-optimized UDFs** (also called pandas
    UDFs) that operate on batches using Apache Arrow:

    ```python
    import pandas as pd
    from pyspark.sql.functions import pandas_udf

    @pandas_udf("double")
    def discount(price: pd.Series) -> pd.Series:
        return price * 0.9

    df.withColumn("sale_price", discount(f.col("price")))
    ```

    Arrow UDFs are typically 3-100x faster because they avoid per-row
    serialization. In our pipeline, we will use built-in functions
    whenever possible, but Arrow UDFs are your escape hatch for custom
    business logic.

