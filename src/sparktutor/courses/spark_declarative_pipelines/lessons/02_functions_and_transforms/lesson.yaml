    ## Summary

    You now have the core transformation vocabulary:

    - `select()` — choose columns
    - `filter()` — choose rows
    - `withColumn()` — add or replace columns
    - `f.col()`, `f.lit()`, `f.when().otherwise()` — column expressions
    - Arrow UDFs for custom logic (advanced)

    These transformations are the building blocks for every pipeline layer.
    In the next lesson, you will learn to **read and write data** — the I/O
    layer that connects your transformations to the outside world.
