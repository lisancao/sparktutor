    ## What You'll Learn

    With a SparkSession ready, it is time to learn the transformations
    that power every pipeline stage. The bronze layer uses them to add
    metadata columns. The silver layer uses them to cast types and filter
    bad data. The gold layer uses them to compute aggregations.

    By the end of this lesson you will be able to:

    - Use `select()`, `filter()`, and `withColumn()` to transform data
    - Reference columns with `f.col()` and create constants with `f.lit()`
    - Write conditional logic with `f.when().otherwise()`
    - Chain transformations into readable pipelines
    - Write Arrow-optimized UDFs for custom logic (advanced)

- Class: text
  Depth: all
  Output: |
    Spark ships hundreds of built-in functions in `pyspark.sql.functions`.
    The convention is to import it as `f`:

    ```python
    from pyspark.sql import functions as f
    ```

    The three transformations you will use in nearly every pipeline step:

    - `select()` — choose which columns to keep
    - `filter()` (or `where()`) — keep only rows matching a condition
    - `withColumn()` — add or replace a column

    All transformations are **lazy**. Nothing executes until you call an
    **action** like `.show()`, `.count()`, or `.write`.

- Class: text
  Depth: beginner
  Output: |
    Here is a quick example. Given a DataFrame `df` with columns `name`,
    `age`, and `city`:

    ```python
    # Keep only name and age
    df.select("name", "age")

    # Keep rows where age > 30
    df.filter(f.col("age") > 30)

    # Add a computed column
    df.withColumn("birth_year", f.lit(2026) - f.col("age"))
    ```

    Key helpers:
    - `f.col("name")` — reference a column by name
    - `f.lit(42)` — create a constant (literal) column
    - `f.when(condition, value).otherwise(default)` — conditional logic

    **Docs:**
    [select](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.select.html) |
    [filter](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.filter.html) |
    [withColumn](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.withColumn.html) |
    [f.col](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.col.html) |
    [f.lit](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.lit.html) |
    [f.when](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.when.html)

