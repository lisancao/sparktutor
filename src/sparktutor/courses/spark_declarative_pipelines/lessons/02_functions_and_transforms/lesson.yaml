  AnswerChoices: "它们通过 Arrow 批量处理，避免逐行序列化;它们在 GPU 上运行;它们跳过了 Catalyst 优化器;它们占用更少内存"
  CorrectAnswer: "它们通过 Arrow 批量处理，避免逐行序列化"
  Hint: "关键优势是用零拷贝的 Arrow 格式做批处理。"

- Class: cmd_question
  Depth: advanced
  Output: |
    编写一个名为 `normalize` 的 pandas UDF，接收一个 double 类型的
    pandas Series，返回每个值除以该 Series 的最大值。将返回类型
    声明为 `'double'`。
  CorrectAnswer: |
    import pandas as pd
    from pyspark.sql.functions import pandas_udf

    @pandas_udf("double")
    def normalize(s: pd.Series) -> pd.Series:
        return s / s.max()
  Hint: "使用 @pandas_udf('double') 装饰器。将 Series 除以 s.max()。"

