- Class: text
  Depth: advanced
  Output: |
    ## Arrow 优化的 UDF

    当内置函数不够用时，你可以用 UDF 编写自定义逻辑。
    经典 Python UDF 在 JVM 和 Python 之间逐行序列化数据，
    速度很慢。

    Spark 4.x 推荐使用 **Arrow 优化的 UDF**（也叫 pandas
    UDF），它基于 Apache Arrow 批量处理：

    ```python
    import pandas as pd
    from pyspark.sql.functions import pandas_udf

    @pandas_udf("double")
    def discount(price: pd.Series) -> pd.Series:
        return price * 0.9

    df.withColumn("sale_price", discount(f.col("price")))
    ```

    Arrow UDF 通常快 3-100 倍，因为它避免了逐行序列化。
    在我们的管道中，会尽可能使用内置函数，但 Arrow UDF
    是你处理自定义业务逻辑的逃生舱。

