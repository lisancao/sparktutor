    ## 欢迎来到 Spark 声明式管道

    在本课程中，你将使用 Apache Spark 4.1 构建一条完整的 **bronze-silver-gold
    数据管道**。学完后，你将拥有一个生产级框架：摄入原始数据、清洗数据，
    并产出可直接用于业务的聚合结果。

    **8 节课中你将构建的内容：**

    ```
    Raw CSV → [Bronze] → [Silver] → [Gold] → Business Reports
               ingest     clean      aggregate
               metadata   type cast  rank
               dedup      enrich     summarize
    ```

    第一课讲解 **SparkSession** —— 后续一切内容的点火钥匙。
    每一次转换、每一条查询、每一张表的读取，都从 SparkSession 开始。

- Class: text
  Depth: all
  Output: |
    ## 你将学到什么

    - 用建造者模式创建 SparkSession
    - 配置管道工作负载的关键设置
    - 理解 SparkSession 提供了什么（DataFrame、SQL、Catalog）
