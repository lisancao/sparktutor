- Class: text
  Depth: beginner
  Output: |
    Think of SparkSession as the ignition key for a car. Without it,
    nothing moves. You create one with a simple builder pattern:

    ```python
    from pyspark.sql import SparkSession

    spark = SparkSession.builder.appName("MyPipeline").getOrCreate()
    ```

    `getOrCreate()` either creates a brand-new session or returns one that
    already exists. This means you can safely call it multiple times without
    creating duplicate sessions.

    **Docs:** [SparkSession](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.SparkSession.html)
    — `builder.appName()`, `builder.config()`, `builder.master()`, `getOrCreate()`.

- Class: text
  Depth: intermediate
  Output: |
    SparkSession replaced the older SQLContext and HiveContext from Spark
    1.x. It is the single entry point for:

    - Creating DataFrames: `spark.createDataFrame(data, schema)`
    - Running SQL queries: `spark.sql("SELECT ...")`
    - Accessing the catalog: `spark.catalog.listTables()`
    - Reading data: `spark.read.csv(...)`, `spark.read.parquet(...)`

    For pipeline workloads, two configurations matter most:

    - `spark.sql.shuffle.partitions` — controls partitions after shuffles
      like `groupBy`. Default is 200, but for development and small
      datasets, set it to 8-16.
    - `spark.driver.memory` — how much RAM the driver gets. Increase for
      pipelines that collect large results.

