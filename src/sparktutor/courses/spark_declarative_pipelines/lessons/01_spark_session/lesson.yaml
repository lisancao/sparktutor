    ## 小结

    你现在知道如何创建和配置 SparkSession 了 —— 它是每一层管道
    都会使用的基础。要点回顾：

    - `SparkSession.builder.appName(...).getOrCreate()` 是入口
    - 根据数据规模配置 `shuffle.partitions`
    - 高级：挂载 Iceberg catalog 以获得符合 ACID 规范的表存储

    下一课中，你将学习驱动每个管道阶段的 **DataFrame 转换**：
    select、filter、withColumn 以及条件逻辑。
