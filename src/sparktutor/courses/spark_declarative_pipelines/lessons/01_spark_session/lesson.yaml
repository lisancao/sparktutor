    ## Welcome to Spark Declarative Pipelines

    In this course you will build a complete **bronze-silver-gold data
    pipeline** using Apache Spark 4.1. By the end, you will have a
    production-ready framework that ingests raw data, cleans it, and
    produces business-ready aggregations.

    **What you'll build across the 8 lessons:**

    ```
    Raw CSV → [Bronze] → [Silver] → [Gold] → Business Reports
               ingest     clean      aggregate
               metadata   type cast  rank
               dedup      enrich     summarize
    ```

    This first lesson covers the **SparkSession** — the ignition key for
    everything that follows. Every transformation, every query, every
    table read starts with a SparkSession.

