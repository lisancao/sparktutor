    Create a SparkSession named `'PipelineApp'` with shuffle partitions
    set to 8 and driver memory set to `'2g'`.
  CorrectAnswer: |
    from pyspark.sql import SparkSession
    spark = (SparkSession.builder
        .appName("PipelineApp")
        .config("spark.sql.shuffle.partitions", "8")
