- Class: cmd_question
  Depth: intermediate
  Output: |
    创建一个名为 `'PipelineApp'` 的 SparkSession，shuffle 分区数
    设为 8，driver 内存设为 `'2g'`。
  CorrectAnswer: |
    from pyspark.sql import SparkSession
    spark = (SparkSession.builder
        .appName("PipelineApp")
        .config("spark.sql.shuffle.partitions", "8")
        .config("spark.driver.memory", "2g")
        .getOrCreate())
  Hint: "在 .getOrCreate() 之前链式调用多个 .config(key, value)。"

- Class: text
  Depth: advanced
  Output: |
    在底层，SparkSession 封装了一个 `SparkContext`（集群连接）和一个
    `SessionState`，后者持有 Catalyst 优化器、分析器和物理计划生成器。

    当你调用 `spark.sql("SELECT ...")` 时，查询会依次经过：
    1. **解析器（Parser）** —— 将 SQL 字符串转换为未解析的逻辑计划
    2. **分析器（Analyzer）** —— 通过 Catalog 解析列名/表名
    3. **优化器（Optimizer）** —— 应用 Catalyst 规则（谓词下推等）
    4. **计划器（Planner）** —— 转换为带有具体算子的物理计划

    对于管道工作负载，你可以在创建会话时挂载一个 **Iceberg catalog**。
    这会为你的管道提供 ACID 事务、schema 演进和时间旅行能力：

    ```python
    spark = (SparkSession.builder
        .config("spark.sql.catalog.lakehouse",
                "org.apache.iceberg.spark.SparkCatalog")
        .config("spark.sql.catalog.lakehouse.type", "hadoop")
        .config("spark.sql.catalog.lakehouse.warehouse", "/warehouse")
        .getOrCreate())
    ```

- Class: mult_question
  Depth: advanced
  Output: "在 Catalyst 优化器管道中，解析之后紧接着发生什么？"
  AnswerChoices: "分析 —— 通过 Catalog 解析名称;物理计划生成;代码生成;分区裁剪"
  CorrectAnswer: "分析 —— 通过 Catalog 解析名称"
  Hint: "解析器产生的是*未解析*的计划。下一阶段会解析列名和表名。"

- Class: cmd_question
  Depth: advanced
  Output: |
    创建一个 SparkSession，挂载一个名为 `'lakehouse'` 的 Iceberg catalog，
    使用 hadoop catalog 类型，warehouse 路径为 `'/warehouse/iceberg'`。
  CorrectAnswer: |
    from pyspark.sql import SparkSession
    spark = (SparkSession.builder
        .appName("IcebergPipeline")
        .config("spark.sql.catalog.lakehouse", "org.apache.iceberg.spark.SparkCatalog")
        .config("spark.sql.catalog.lakehouse.type", "hadoop")
        .config("spark.sql.catalog.lakehouse.warehouse", "/warehouse/iceberg")
        .getOrCreate())
  Hint: "Iceberg catalog 配置遵循 spark.sql.catalog.<name>.<property> 的模式。"

