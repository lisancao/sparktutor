- Class: text
  Depth: advanced
  Output: |
    Under the hood, SparkSession wraps a `SparkContext` (the cluster
    connection) and a `SessionState` that holds the Catalyst optimizer,
    analyzer, and physical planner.

    When you call `spark.sql("SELECT ...")`, the query travels through:
    1. **Parser** — SQL string to unresolved logical plan
    2. **Analyzer** — resolves column/table names via the Catalog
    3. **Optimizer** — applies Catalyst rules (predicate pushdown, etc.)
    4. **Planner** — converts to a physical plan with concrete operators

    For pipeline workloads, you can attach an **Iceberg catalog** at
    session creation. This gives your pipeline ACID transactions, schema
    evolution, and time travel:

    ```python
    spark = (SparkSession.builder
        .config("spark.sql.catalog.lakehouse",
                "org.apache.iceberg.spark.SparkCatalog")
        .config("spark.sql.catalog.lakehouse.type", "hadoop")
        .config("spark.sql.catalog.lakehouse.warehouse", "/warehouse")
        .getOrCreate())
    ```

- Class: mult_question
  Depth: advanced
  Output: "In the Catalyst optimizer pipeline, what happens immediately after parsing?"
  AnswerChoices: "Analysis — resolve names via the Catalog;Physical planning;Code generation;Partition pruning"
  CorrectAnswer: "Analysis — resolve names via the Catalog"
  Hint: "The parser produces an *unresolved* plan. The next stage resolves column and table names."

- Class: cmd_question
  Depth: advanced
  Output: |
    Create a SparkSession with an Iceberg catalog named `'lakehouse'`
    using the hadoop catalog type and warehouse path `'/warehouse/iceberg'`.
  CorrectAnswer: |
    from pyspark.sql import SparkSession
    spark = (SparkSession.builder
        .appName("IcebergPipeline")
        .config("spark.sql.catalog.lakehouse", "org.apache.iceberg.spark.SparkCatalog")
        .config("spark.sql.catalog.lakehouse.type", "hadoop")
        .config("spark.sql.catalog.lakehouse.warehouse", "/warehouse/iceberg")
        .getOrCreate())
  Hint: "Iceberg catalog configs follow the pattern spark.sql.catalog.<name>.<property>."

