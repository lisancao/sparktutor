- Class: text
  Depth: beginner
  Output: |
    把 SparkSession 想象成汽车的点火钥匙。没有它，什么都动不了。
    用简单的建造者模式创建它：

    ```python
    from pyspark.sql import SparkSession

    spark = SparkSession.builder.appName("MyPipeline").getOrCreate()
    ```

    `getOrCreate()` 要么创建一个全新的会话，要么返回已存在的会话。
    这意味着你可以安全地多次调用它，而不会创建重复的会话。

    **文档：** [SparkSession](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.SparkSession.html)
    —— `builder.appName()`、`builder.config()`、`builder.master()`、`getOrCreate()`。

- Class: text
  Depth: intermediate
  Output: |
    SparkSession 取代了 Spark 1.x 时代的旧版 SQLContext 和 HiveContext。
    它是以下操作的唯一入口：

    - 创建 DataFrame：`spark.createDataFrame(data, schema)`
    - 运行 SQL 查询：`spark.sql("SELECT ...")`
    - 访问 catalog：`spark.catalog.listTables()`
    - 读取数据：`spark.read.csv(...)`、`spark.read.parquet(...)`

    对于管道工作负载，两个配置最为重要：

    - `spark.sql.shuffle.partitions` —— 控制 `groupBy` 等 shuffle
      操作之后的分区数。默认是 200，但对于开发和小数据集，
      建议设为 8-16。
    - `spark.driver.memory` —— 驱动程序分配多少内存。对于需要
      收集大量结果的管道，应调大。

