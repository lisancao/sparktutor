    ## Summary

    You now know how to create and configure a SparkSession — the
    foundation that every pipeline layer will use. Key takeaways:

    - `SparkSession.builder.appName(...).getOrCreate()` is the entry point
    - Configure `shuffle.partitions` for your data size
    - Advanced: attach an Iceberg catalog for ACID-compliant table storage

    In the next lesson, you will learn the **DataFrame transformations**
    that power every pipeline stage: select, filter, withColumn, and
    conditional logic.
