    ## What the Target Must Support

    Auto CDC writes with row-level operations (`MERGE`, `UPDATE`,
    `DELETE`), so the target must be a table whose connector implements
    Spark's Data Source V2 row-level interface
    (`SupportsRowLevelOperations`). When it does not, the flow fails at
    start with `AUTOCDC_TARGET_DOES_NOT_SUPPORT_MERGE`. The *source* has no
    such requirement: any streaming DataFrame of change events works.

    Where open source stands for Spark 4.2.0 targets (checked October 2026):

    | Target | Works as an Auto CDC target? |
    |---|---|
    | Default tables (parquet) | No: rejected |
    | Delta Lake 4.4.1 | No: rejected. Delta runs `MERGE` through its own SQL extension, not through the DSv2 interface Auto CDC needs |
    | Apache Iceberg | Implements the interface, but the newest release (1.12.0) supports Spark up to 4.1, and its 4.1 runtime fails to load on 4.2 |
    | Apache Paimon, Apache Hudi | No Spark 4.2 builds published yet |

    So that you can still watch Auto CDC work, the exercise writes its
    target into **Spark's own test catalog**, an in-memory catalog with
    `MERGE` support that Spark uses to test this feature. It ships in the
    `spark-catalyst_2.13-4.2.0-tests.jar` artifact on Maven Central. The
    first line of the exercise, `# spark-connectors: test-catalog`, tells
    SparkTutor to download that jar and register the catalog as `mem`,
    which is why the target is named `mem.crm.customers_current`.

    Two things to know about it:

    - It is in memory. The table disappears when the run ends, so the
      exercise copies it into `customers_current_preview` (a normal table)
      for you to look at.
    - It is a test fixture, not a storage format. Use it to learn and to
      test pipeline logic, never for data you want to keep.

    Outside SparkTutor, the same setup is a spec entry plus a jar:

    ```yaml
    # spark-pipeline.yml
    configuration:
      spark.sql.catalog.mem: org.apache.spark.sql.connector.catalog.SharedTablesInMemoryRowLevelOperationTableCatalog
    ```

    ```bash
    spark-pipelines \
      --jars https://repo1.maven.org/maven2/org/apache/spark/spark-catalyst_2.13/4.2.0/spark-catalyst_2.13-4.2.0-tests.jar \
      run
    ```

    Use the `SharedTables...` variant. Streaming micro-batches run in
    cloned Spark sessions, and the plain
    `InMemoryRowLevelOperationTableCatalog` gives every session its own
    empty set of tables, so Auto CDC fails to find its own state table. When a
    format with a Spark 4.2 build supports row-level operations, point the
    target at that catalog instead; the flow definition stays the same.

