    ## Under the Hood

    The target gets a reserved column, `__spark_autocdc_metadata`, which
    Auto CDC uses to track per-key sequencing. A user-specified target
    schema therefore has to account for it. Deletes are
    remembered as tombstones so that a late upsert with an older sequence
    value does not resurrect a deleted row. That bookkeeping lives in an
    auxiliary table next to the target
    (`__spark_autocdc_aux_state_<target>`), so the target's catalog must be
    durable: the in-memory test catalog loses it, and the target, when the
    run ends. That is fine for an exercise and wrong for anything else.

    You can see the metadata column if you read the target with
    `select("*")`: it is a struct holding the winning sequence value per
    key. Downstream datasets should select the columns they need, as
    `customers_current_preview` does.

    Auto CDC complements Spark 4.2's other CDC feature: the SQL `CHANGES`
    clause and DataFrame `changes()` API *read* a change feed from tables
    whose connector implements it, while `create_auto_cdc_flow` *applies*
    a change feed to a target.

