    ## The Problem

    Operational databases change rows in place. Change data capture (CDC)
    turns those changes into a stream of events: a tool like Debezium
    publishing to Kafka, or a table format's change feed such as Delta
    Lake's. Either way you get rows like these:

    | customer_id | city | op | seq |
    |---|---|---|---|
    | c-01 | Toronto | UPSERT | 1 |
    | c-02 | Vancouver | UPSERT | 2 |
    | c-03 | Montreal | UPSERT | 3 |
    | c-01 | Hanoi | UPSERT | 5 |
    | c-02 | Vancouver | DELETE | 6 |
    | c-01 | Ottawa | UPSERT | 4 |

    That is `data/customer_changes`. Appending it gives three rows for
    `c-01` and keeps `c-02`, which was deleted. What you want is the
    *current* state: one row per customer, deletes applied, and events
    applied in `seq` order even though `seq 4` arrived after `seq 5`.

    Doing that by hand means a `MERGE` per micro-batch, ordering logic,
    tombstones for late deletes and state for out-of-order events. Auto CDC
    does it for you.

