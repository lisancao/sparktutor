    ## The API

    ```python
    dp.create_streaming_table("customers_current")

    dp.create_auto_cdc_flow(
        target="customers_current",
        source="bronze_customer_changes",
        keys=["customer_id"],
        sequence_by="seq",
        apply_as_deletes=F.expr("op = 'DELETE'"),
        except_column_list=["op", "seq", "_source_file", "_ingested_at"],
        stored_as_scd_type=1,
    )
    ```

    - `target` must already be declared with `dp.create_streaming_table`.
    - `source` is a streaming dataset of change events (here, the bronze
      streaming table).
    - `keys` identify a row. The key set is part of the flow's persisted
      state: changing it later needs a full refresh of the target.
    - `sequence_by` orders events per key; the highest value wins, so late,
      out-of-order events cannot overwrite newer data.
    - `apply_as_deletes` marks delete events (a SQL string or a Column).
    - `column_list` / `except_column_list` choose the output columns (one
      or the other, unqualified names only).
    - `stored_as_scd_type` accepts only `1` in Spark 4.2: keep the latest
      version of each row. SCD Type 2 (keep history) is being built
      upstream but is not in 4.2.

