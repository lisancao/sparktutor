- Class: text
  Depth: all
  Output: |
    ## Summary

    - CDC feeds must be *applied*, not appended; Auto CDC (Spark 4.2) does
      it declaratively with `dp.create_auto_cdc_flow`.
    - `keys` identify rows, `sequence_by` orders changes per key,
      `apply_as_deletes` marks deletes; 4.2 supports SCD Type 1.
    - Sources are flexible: files, a Delta change data feed
      (`readChangeFeed`, filtering out `update_preimage`), or Kafka.
    - The target must support Spark's row-level operations. On Spark 4.2.0
      no open-source format does yet (parquet and Delta are rejected; no
      Iceberg build for 4.2), so learn and test with the in-memory test
      catalog.

    Next: the capstone, a complete pipeline from raw files to gold.
