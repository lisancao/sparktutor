    ## Feeding Auto CDC from a Real Change Feed

    The exercise reads change events from JSON files. In production the
    events usually come from a Delta table's change data feed or a Kafka
    topic. Both work as Auto CDC sources in Spark 4.2.0; only the source
    view changes.

    **From a Delta table's change data feed.** Delta records row-level
    changes for tables created with
    `TBLPROPERTIES (delta.enableChangeDataFeed = true)`. Each change row
    carries `_change_type` (`insert`, `update_preimage`,
    `update_postimage`, `delete`), `_commit_version` and
    `_commit_timestamp`:

    ```python
    @dp.temporary_view
    def customer_changes() -> DataFrame:
        return (
            spark.readStream.format("delta")
            .option("readChangeFeed", "true")
            .option("startingVersion", 1)
            .load("/data/crm/customers")          # or .table("crm.customers")
            .where("_change_type <> 'update_preimage'")   # keep the new value only
        )

    dp.create_auto_cdc_flow(
        target="mem.crm.customers_current",
        source="customer_changes",
        keys=["customer_id"],
        sequence_by="_commit_version",
        apply_as_deletes=F.expr("_change_type = 'delete'"),
        except_column_list=["_change_type", "_commit_version", "_commit_timestamp"],
        stored_as_scd_type=1,
    )
    ```

    Keep `.format("delta")` when you load by path. Without it Spark reads
    the directory as plain parquet: no error, no change columns, and every
    superseded and deleted row comes back.

    Delta is not part of pyspark, so add its jars when you launch. Use
    `--jars`: in Spark 4.2.0, `spark-pipelines` does not make `--packages`
    jars visible to pipeline code, and the run fails with
    `DATA_SOURCE_NOT_FOUND`.

    ```bash
    spark-pipelines \
      --jars https://repo1.maven.org/maven2/io/delta/delta-spark_4.2_2.13/4.4.1/delta-spark_4.2_2.13-4.4.1.jar,https://repo1.maven.org/maven2/io/delta/delta-storage/4.4.1/delta-storage-4.4.1.jar \
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
      run
    ```

    You will see a `UserWarning: Failed to set spark.sql.extensions`. It is
    harmless: the extension took effect when the local server started; the
    Connect client then re-applies every `spark.sql.*` option to its
    session, and a static option cannot change at that point.

    **From Kafka.** Parse the message value into columns, then use your own
    sequence column:

    ```python
    CHANGE_SCHEMA = "customer_id STRING, name STRING, city STRING, op STRING, seq INT"

    @dp.temporary_view
    def customer_changes() -> DataFrame:
        return (
            spark.readStream.format("kafka")
            .option("kafka.bootstrap.servers", "localhost:9092")
            .option("subscribe", "customer_changes")
            .option("startingOffsets", "earliest")
            .load()
            .select(F.from_json(F.col("value").cast("string"), CHANGE_SCHEMA).alias("e"))
            .select("e.*")
        )
    ```

    The Auto CDC flow is then exactly the exercise's, with
    `except_column_list=["op", "seq"]`. Lesson 4 lists the jars the Kafka
    source needs. Do not sequence by the Kafka `offset`: offsets are only
    ordered within one partition, and they record when an event arrived,
    not when the change happened.

