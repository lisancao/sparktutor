- Class: text
  Depth: all
  Output: |
    ## The Problem

    Operational databases change rows in place. A CDC tool (Debezium, a
    database's change feed, Spark 4.2's own `CHANGES` clause on supporting
    tables) turns those changes into events:

    | customer_id | city | op | seq |
    |---|---|---|---|
    | c-01 | Toronto | UPSERT | 1 |
    | c-02 | Vancouver | UPSERT | 2 |
    | c-03 | Montreal | UPSERT | 3 |
    | c-01 | Hanoi | UPSERT | 5 |
    | c-02 | Vancouver | DELETE | 6 |
    | c-01 | Ottawa | UPSERT | 4 |

    That is `data/customer_changes`. Appending it gives three rows for
    `c-01` and keeps `c-02`, which was deleted. What you want is the
    *current* state: one row per customer, deletes applied, and events
    applied in `seq` order even though `seq 4` arrived after `seq 5`.

    Doing that by hand means a `MERGE` per micro-batch, ordering logic,
    tombstones for late deletes and state for out-of-order events. Auto CDC
    does it for you.

- Class: mult_question
  Depth: all
  Output: "After applying every event above in seq order, what is c-01's city?"
  AnswerChoices: "Hanoi;Ottawa;Toronto;c-01 is deleted"
  CorrectAnswer: "Hanoi"
  Hint: "Order by seq, not by arrival: seq 5 (Hanoi) is the latest change, even though seq 4 arrived last."

- Class: text
  Depth: all
  Output: |
    ## The API

    ```python
    dp.create_streaming_table("customers_current")

    dp.create_auto_cdc_flow(
        target="customers_current",
        source="bronze_customer_changes",
        keys=["customer_id"],
        sequence_by="seq",
        apply_as_deletes=F.expr("op = 'DELETE'"),
        except_column_list=["op", "seq", "_source_file", "_ingested_at"],
        stored_as_scd_type=1,
    )
    ```

    - `target` must already be declared with `dp.create_streaming_table`.
    - `source` is a streaming dataset of change events (here, the bronze
      streaming table).
    - `keys` identify a row. The key set is part of the flow's persisted
      state: changing it later needs a full refresh of the target.
    - `sequence_by` orders events per key; the highest value wins, so late,
      out-of-order events cannot overwrite newer data.
    - `apply_as_deletes` marks delete events (a SQL string or a Column).
    - `column_list` / `except_column_list` choose the output columns (one
      or the other, unqualified names only).
    - `stored_as_scd_type` accepts only `1` in Spark 4.2: keep the latest
      version of each row. SCD Type 2 (keep history) is being built
      upstream but is not in 4.2.

