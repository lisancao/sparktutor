  Output: |
    ## What the Target Must Support

    Auto CDC writes with row-level operations (`MERGE`, `UPDATE`,
    `DELETE`), so the target's table format must implement Spark's Data
    Source V2 `SupportsRowLevelOperations`. When it does not, the flow
    fails at start with `AUTOCDC_TARGET_DOES_NOT_SUPPORT_MERGE`.

    What we found on stock Spark 4.2.0 while building this lesson:

    - The default parquet `spark_catalog` target is rejected.
    - Delta Lake (`delta-spark_4.2_2.13` 4.4.1) loads, but its tables are
      rejected too: Delta does not implement the DSv2 row-level interface.
    - Apache Iceberg implements it, and is the format the feature was
      tested against. At the time of writing there is no released
      `iceberg-spark-runtime-4.2` artifact, and the 4.1 runtime fails on
      4.2 with `SparkView can not implement ... View, because it is not an
      interface` (Spark 4.2 changed `View` into a class).

    So the exercise runs as a **dry run**, which fully validates the flow
    (source, keys, sequencing column, column lists) without writing. To run
    it for real, point the spec's `catalog` at an Iceberg catalog built for
    Spark 4.2 (the lakehouse execution mode), for example:

    ```yaml
    catalog: lake
    database: crm
    configuration:
      spark.sql.catalog.lake: org.apache.iceberg.spark.SparkCatalog
      spark.sql.catalog.lake.type: hadoop
      spark.sql.catalog.lake.warehouse: file:///abs/path/warehouse
    ```

- Class: text
  Depth: advanced
  Output: |
    ## Under the Hood

    The target gets a reserved column, `__spark_autocdc_metadata`, which
    Auto CDC uses to track per-key sequencing. A user-specified target
    schema therefore has to account for it. Deletes are
    remembered as tombstones so that a late upsert with an older sequence
    value does not resurrect a deleted row. Because that bookkeeping lives
    next to the target, the target's catalog must be durable: an in-memory
    catalog loses it on restart.

    Auto CDC complements Spark 4.2's other CDC feature: the SQL `CHANGES`
    clause and DataFrame `changes()` API *read* a change feed from tables
    whose connector exposes one, while `create_auto_cdc_flow` *applies* a
    change feed to a target.

