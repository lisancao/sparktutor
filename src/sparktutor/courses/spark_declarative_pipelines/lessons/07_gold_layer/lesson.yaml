    ## What You'll Learn

    Bronze preserved raw data. Silver cleaned and enriched it. Now the
    **gold layer** transforms that trusted data into business-ready
    aggregations that answer specific questions.

    By the end of this lesson you will be able to:

    - Use `groupBy().agg()` to compute summaries (count, sum, avg, min, max)
    - Name aggregated columns clearly with `alias()`
    - Build hourly/daily summaries from time-extracted columns
    - Use window functions for running totals and rankings (intermediate)
    - Handle data skew with two-phase salted aggregation (advanced)

    Gold tables are the ones your stakeholders actually see — in
    dashboards, reports, and ML feature stores.

