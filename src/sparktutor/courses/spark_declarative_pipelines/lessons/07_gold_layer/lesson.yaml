    给 `silver_df` 添加一个 `running_total` 列，它是 `total`
    按 `product` 分区、按 `order_ts` 排序后的累计求和。
  CorrectAnswer: |
    from pyspark.sql import functions as f
    from pyspark.sql import Window

    w = Window.partitionBy("product").orderBy("order_ts").rowsBetween(
        Window.unboundedPreceding, Window.currentRow
    )
    result = silver_df.withColumn("running_total", f.sum("total").over(w))
  Hint: "用 partitionBy、orderBy 和 rowsBetween 定义 Window。用 f.sum().over(window)。"

- Class: text
  Depth: intermediate
  Output: |
    ## 用窗口函数做排名

    gold 层的一个常见模式是排名 —— "哪个产品收入最高？"
    在按指标排序的窗口上使用 `f.rank()` 或 `f.dense_rank()`：

    ```python
    rank_window = Window.orderBy(f.col("revenue").desc())
    gold = gold.withColumn("revenue_rank", f.rank().over(rank_window))
    ```

    - `f.rank()` —— 并列得到相同名次，跳过下一个名次（1, 2, 2, 4）
    - `f.dense_rank()` —— 并列得到相同名次，不跳号（1, 2, 2, 3）
    - `f.row_number()` —— 不允许并列，任意打破平局（1, 2, 3, 4）

    排名对 "top N" 查询特别有用 —— 过滤 `revenue_rank <= 10`
    就能得到前 10 个产品。

