    ## 你将学到什么

    Bronze 保留了原始数据。Silver 清洗并丰富了它。现在
    **gold 层**把这些可信数据转换成可直接用于业务的聚合，
    以回答具体问题。

    学完本课后，你将能够：

    - 使用 `groupBy().agg()` 计算汇总（count、sum、avg、min、max）
    - 用 `alias()` 清晰地命名聚合列
    - 从时间提取列构建按小时/按天的汇总
    - 使用窗口函数做累计求和和排名（中级）
    - 用两阶段加盐聚合处理数据倾斜（高级）

    Gold 表是你的利益相关者真正能看到的表 —— 出现在仪表盘、
    报表和 ML 特征存储中。

- Class: text
  Depth: all
  Output: |
    ## 从 Silver 到 Gold

    你在上一课构建的 silver 层产出一个 DataFrame，带有干净的
    类型、一个计算好的 `total` 列，以及从时间戳提取出的
    `order_hour`。Gold 读取 silver 的输出，回答类似这样的
    业务问题：

    - "每个产品的总收入是多少？"
    - "每小时有多少订单？"
    - "哪个产品贡献的收入最多？"

    模式永远是：**group → aggregate → （可选）rank 或 sort**。

- Class: text
  Depth: beginner
  Output: |
    gold 层的主力是 `groupBy().agg()`：

    ```python
    from pyspark.sql import functions as f

    gold = (silver
        .groupBy("product")
        .agg(
            f.count("*").alias("order_count"),
            f.sum("total").alias("revenue"),
            f.avg("total").alias("avg_order_value"),
        )
    )
    ```

    `groupBy("product")` 为每个唯一的 product 值创建一个组。
    然后 `agg()` 在每个组内计算一个或多个聚合表达式。
    `alias()` 给每个结果列一个有意义的名字 —— 没有它，
    Spark 会生成像 `sum(total)` 这样的名字，下游很难使用。

- Class: text
