    ## Summary

    Your gold layer produces clean, aggregated, business-ready data:

    - **groupBy + agg** — the core pattern for summaries
    - **Aggregate functions** — count, sum, avg, min, max, countDistinct
    - **alias()** — give computed columns meaningful names
    - **Window functions** — running totals, rankings, moving averages
    - **Two-phase aggregation** — handle data skew for hot keys

    You now have all three layers of the medallion architecture. In the
    final lesson, you will connect them into a **single end-to-end
    pipeline** with error handling and deployment patterns.
