    ## 常用聚合函数

    这些是你在 `agg()` 中最常用的函数：

    | 函数                    | 说明                  |
    |-------------------------|-----------------------|
    | `f.count("*")`          | 行数                  |
    | `f.sum("col")`          | 值的求和              |
    | `f.avg("col")`          | 平均值                |
    | `f.min("col")`          | 最小值                |
    | `f.max("col")`          | 最大值                |
    | `f.countDistinct("c")`  | 唯一值的数量          |

    你可以把多个表达式传给 `agg()` —— Spark 在一次数据扫描中
    把它们全部算出来。

    **文档：**
    [f.sum](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.sum.html) |
    [f.avg](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.avg.html) |
    [f.count](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.count.html) |
    [f.countDistinct](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.countDistinct.html) |
    [Column.alias](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.Column.alias.html)

