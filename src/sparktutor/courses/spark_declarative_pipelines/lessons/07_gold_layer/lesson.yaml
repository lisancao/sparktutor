- Class: text
  Depth: advanced
  Output: |
    ## Gold 聚合的性能调优

    gold 层的聚合涉及 shuffle —— Spark 必须重新分布数据，
    让相同键的所有行落到同一个分区上。三种让它更快的技巧：

    **1. 调整 shuffle 分区数。** 默认的
    `spark.sql.shuffle.partitions` 是 200，对中小型数据集
    来说太多了。对于几 GB 以下的数据集，试试 8-32 个分区。

    **2. 缓存 silver 输入。** 如果多个 gold 表从同一个
    silver DataFrame 读取，缓存它以避免重复计算：
    ```python
    silver_df.cache()
    silver_df.count()  # materialize the cache
    ```

    **3. 两阶段（加盐）聚合。** 当单个键在数据中占主导
    （例如 80% 的订单都是同一个产品），该键的分区就会成为
    瓶颈。解决方案：加一个随机盐，先部分聚合，然后去掉盐
    再聚合一次。

