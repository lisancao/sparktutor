    ## Performance Tuning for Gold Aggregations

    Gold-layer aggregations involve shuffles — Spark must redistribute
    data so all rows with the same key end up on the same partition.
    Three techniques to make this faster:

    **1. Tune shuffle partitions.** The default `spark.sql.shuffle.partitions`
    is 200, which is too many for small to medium datasets. For datasets
    under a few GB, try 8-32 partitions.

    **2. Cache the silver input.** If multiple gold tables read from the
    same silver DataFrame, cache it to avoid recomputation:
    ```python
    silver_df.cache()
    silver_df.count()  # materialize the cache
    ```

    **3. Two-phase (salted) aggregation.** When a single key dominates
    the data (e.g., 80% of orders are for one product), that key's
    partition becomes a bottleneck. The solution: add a random salt,
    aggregate partially, then aggregate again without the salt.

