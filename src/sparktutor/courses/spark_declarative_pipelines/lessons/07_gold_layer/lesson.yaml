    ## From Silver to Gold

    The silver layer you built in the previous lesson produces a DataFrame
    with clean types, a computed `total` column, and an `order_hour`
    extracted from the timestamp. Gold reads that silver output and
    answers business questions like:

    - "What is the total revenue per product?"
    - "How many orders per hour?"
    - "Which product generates the most revenue?"

    The pattern is always: **group → aggregate → (optionally) rank or sort**.

- Class: text
  Depth: beginner
  Output: |
    The workhorse of the gold layer is `groupBy().agg()`:

    ```python
    from pyspark.sql import functions as f

    gold = (silver
        .groupBy("product")
        .agg(
            f.count("*").alias("order_count"),
            f.sum("total").alias("revenue"),
            f.avg("total").alias("avg_order_value"),
        )
    )
    ```

    `groupBy("product")` creates one group per unique product value.
    `agg()` then computes one or more aggregate expressions within each
    group. `alias()` gives each result column a meaningful name — without
    it, Spark generates names like `sum(total)` which are hard to work
    with downstream.

- Class: text
