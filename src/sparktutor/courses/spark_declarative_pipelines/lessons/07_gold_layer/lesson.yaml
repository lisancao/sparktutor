    ## 小结

    你的 gold 层产出干净、经过聚合、可直接用于业务的数据：

    - **groupBy + agg** —— 汇总的核心模式
    - **聚合函数** —— count、sum、avg、min、max、countDistinct
    - **alias()** —— 给计算出的列起有意义的名字
    - **窗口函数** —— 累计求和、排名、移动平均
    - **两阶段聚合** —— 处理热点键的数据倾斜

