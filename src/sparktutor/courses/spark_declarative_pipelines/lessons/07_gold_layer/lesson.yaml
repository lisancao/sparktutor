    ## Window Functions: Aggregation Without Collapse

    `groupBy` collapses rows — one output row per group. **Window
    functions** compute values across related rows while keeping every
    row in the output. This makes them perfect for:

    - **Running totals** — cumulative sum up to the current row
    - **Rankings** — rank products by revenue
    - **Moving averages** — average over a sliding window of rows

    ```python
    from pyspark.sql import Window

    w = Window.partitionBy("product").orderBy("order_date").rowsBetween(
        Window.unboundedPreceding, Window.currentRow
    )

    df = df.withColumn("running_revenue", f.sum("total").over(w))
    ```

    `partitionBy` defines the groups (like groupBy, but rows are not
    collapsed). `orderBy` defines the row ordering within each group.
    `rowsBetween` defines which rows to include in the computation
    relative to the current row.

    **Docs:**
    [Window](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.Window.html) — `partitionBy()`, `orderBy()`, `rowsBetween()`, `rangeBetween()` |
    [f.rank](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.rank.html) |
    [f.dense_rank](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.dense_rank.html) |
    [f.row_number](https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.row_number.html)

