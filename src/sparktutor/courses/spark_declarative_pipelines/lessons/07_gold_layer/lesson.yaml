  Depth: advanced
  Output: "两阶段（加盐）聚合的目的是什么？"
  AnswerChoices: "通过把热点键分散到多个分区来处理数据倾斜;为了加速 I/O;为了减少内存使用;为了提升 join 性能"
  CorrectAnswer: "通过把热点键分散到多个分区来处理数据倾斜"
  Hint: "加随机盐把单个热点键拆成多个子键，用于第一阶段。"

- Class: cmd_question
  Depth: advanced
  Output: |
    实现一个两阶段聚合，按 `product` 对 `total` 求和。
    第一阶段：加一个盐列（随机整数 0-9），按 product + salt
    分组，对 total 求和。第二阶段：去掉 salt，按 product
    分组，再求和一次。
  CorrectAnswer: |
    from pyspark.sql import functions as f

    # Phase 1: salted partial aggregation
    salted = silver_df.withColumn("_salt", (f.rand() * 10).cast("int"))
    partial = (salted
        .groupBy("product", "_salt")
        .agg(f.sum("total").alias("partial_revenue"))
    )

    # Phase 2: final aggregation without salt
    final = (partial
        .groupBy("product")
        .agg(f.sum("partial_revenue").alias("revenue"))
    )
  Hint: "添加一个随机 _salt 列，第一阶段 groupBy(product, _salt)，第二阶段 groupBy(product)。"

