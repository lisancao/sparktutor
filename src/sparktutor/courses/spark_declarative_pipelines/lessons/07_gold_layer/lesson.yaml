    ## Rankings with Window Functions

    A common gold-layer pattern is ranking — "which product has the
    highest revenue?" Use `f.rank()` or `f.dense_rank()` over a window
    ordered by the metric:

    ```python
    rank_window = Window.orderBy(f.col("revenue").desc())
    gold = gold.withColumn("revenue_rank", f.rank().over(rank_window))
    ```

    - `f.rank()` — ties get the same rank, next rank is skipped (1, 2, 2, 4)
    - `f.dense_rank()` — ties get the same rank, no gap (1, 2, 2, 3)
    - `f.row_number()` — no ties, arbitrary tiebreaking (1, 2, 3, 4)

    Rankings are especially useful for "top N" queries — filter to
    `revenue_rank <= 10` to get the top 10 products.

