    ## 你将学到什么

    这是结业课。你已经分别构建了每一个部件：一个
    SparkSession、各种转换、I/O、一个 Pipeline 框架，以及
    三层 medallion 架构。现在你要把它们**连接成一条端到端的
    完整管道**，并学习如何让它达到生产可用。

    学完本课后，你将能够：

    - 把 bronze、silver、gold 函数接入同一个 Pipeline
    - 追踪数据在三层之间的流动
    - 给 Pipeline 运行器添加错误处理和日志
    - 理解幂等性以及它对批处理管道为何重要
    - 为生产环境选择部署模式（高级）

- Class: text
  Depth: all
  Output: |
    ## 完整图景

    这是你在本课程中构建的架构：

    ```
    Raw CSV  ──>  [Bronze]  ──>  [Silver]  ──>  [Gold]
                   │ ingest        │ cast types     │ groupBy/agg
                   │ metadata      │ compute total  │ rankings
                   │ dedup         │ filter nulls   │ window funcs
                   │               │ extract hour   │
                   ▼               ▼                ▼
                 temp view      temp view        temp view
                 "bronze_       "silver_         "gold_product_
                  orders"        orders"          summary"
    ```

    每一层都用 `spark.table()` 读取上一层的临时视图。
    Pipeline 框架会检测这些依赖，并按正确顺序运行所有内容。

- Class: text
  Depth: beginner
  Output: |
    连接各层很简单。用管道装饰器注册每个函数，依赖检测会
    处理剩下的事：

    ```python
    pipe = Pipeline(spark)

    @pipe.materialized_view()
    def bronze_orders(spark):
        # Read raw CSV, add metadata, deduplicate
        ...

    @pipe.materialized_view()
    def silver_orders(spark):
        df = spark.table("bronze_orders")  # dependency detected!
        # Cast types, compute total, filter nulls
        ...

    @pipe.materialized_view()
    def gold_summary(spark):
        df = spark.table("silver_orders")  # dependency detected!
        # Aggregate and rank
        ...

    pipe.run()  # Executes: bronze → silver → gold
    ```

    `pipe.run()` 调用会构建依赖图、对其做拓扑排序，并按顺序
    执行每个函数。你声明每一步**做什么**；框架负责**何时**
    运行它。

