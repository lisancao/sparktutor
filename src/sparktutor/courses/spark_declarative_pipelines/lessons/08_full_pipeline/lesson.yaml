    ## 结业练习：端到端管道

    这是最后一个练习。打开 starter 文件，构建一条连接全部
    三层的完整管道：

    1. **Bronze**（`bronze_orders`）：用全字符串 schema 读取
       原始 CSV，添加 `_ingested_at` 和 `_source_file` 元数据，
       按 `order_id` 去重
    2. **Silver**（`silver_orders`）：从 `bronze_orders`
       临时视图读取，把 `price` 转成 double、`quantity` 转成
       int，计算 `total`（price * quantity），过滤掉 null
       price，从时间戳提取 `order_hour`
    3. **Gold**（`gold_product_summary`）：从 `silver_orders`
       临时视图读取，按 `product` 分组，计算 `order_count`、
       `total_revenue`、`avg_order_value`，并添加 `revenue_rank`
    4. 用 `@pipe.materialized_view()` 注册全部三个函数，
       然后调用 `pipe.run()`

    测试框架会喂入一个同时包含干净行和脏行的 CSV，然后
    验证三层是否都产出正确输出。
