- Class: text
  Depth: advanced
  Output: |
    ## 部署模式

    你的 Pipeline 类在本课程中本地运行，但同样的代码可以用
    不同的提交方式在生产环境运行：

    **1. spark-submit** —— 运行 Spark 作业的标准方式：
    ```bash
    spark-submit --master spark://master:7077 pipeline.py
    ```

    **2. 编排（Airflow/Dagster）** —— 调度管道运行、处理
    重试，并管理多条管道之间的依赖。每条管道成为 DAG 中
    的一个任务。

    **3. 容器化（Kubernetes）** —— 把 Spark + 你的代码打包
    进 Docker 镜像，通过 `spark-submit --master k8s://...`
    提交。Executor pod 按作业创建和销毁。

    **4. 监控** —— 把管道指标（处理行数、耗时、错误）暴露
    给 Prometheus/Grafana。`run_with_logging` 返回的
    `results` 字典是一个天然的起点。

