    ## The Complete Picture

    Here is the architecture you have built across this course:

    ```
    Raw CSV  ──>  [Bronze]  ──>  [Silver]  ──>  [Gold]
                   │ ingest        │ cast types     │ groupBy/agg
                   │ metadata      │ compute total  │ rankings
                   │ dedup         │ filter nulls   │ window funcs
                   │               │ extract hour   │
                   ▼               ▼                ▼
                 temp view      temp view        temp view
                 "bronze_       "silver_         "gold_product_
                  orders"        orders"          summary"
    ```

    Each layer reads from the previous layer's temp view using
    `spark.table()`. The Pipeline framework detects these dependencies
    and runs everything in the correct order.

- Class: text
  Depth: beginner
  Output: |
    Connecting the layers is straightforward. Register each function
    with the pipeline decorator, and dependency detection handles the
    rest:

    ```python
    pipe = Pipeline(spark)

    @pipe.materialized_view()
    def bronze_orders(spark):
        # Read raw CSV, add metadata, deduplicate
        ...

    @pipe.materialized_view()
    def silver_orders(spark):
        df = spark.table("bronze_orders")  # dependency detected!
        # Cast types, compute total, filter nulls
        ...

    @pipe.materialized_view()
    def gold_summary(spark):
        df = spark.table("silver_orders")  # dependency detected!
        # Aggregate and rank
        ...

    pipe.run()  # Executes: bronze → silver → gold
    ```

    The `pipe.run()` call builds the dependency graph, topologically
    sorts it, and executes each function in order. You declare **what**
    each step does; the framework handles **when** to run it.

