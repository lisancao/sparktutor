    ## Capstone Exercise: End-to-End Pipeline

    This is the final exercise. Open the starter file and build a
    complete pipeline that connects all three layers:

    1. **Bronze** (`bronze_orders`): read raw CSV with an all-string
       schema, add `_ingested_at` and `_source_file` metadata,
       deduplicate by `order_id`
    2. **Silver** (`silver_orders`): read from `bronze_orders` temp
       view, cast `price` to double and `quantity` to int, compute
       `total` (price * quantity), filter out null prices, extract
       `order_hour` from the timestamp
    3. **Gold** (`gold_product_summary`): read from `silver_orders`
       temp view, group by `product`, compute `order_count`,
       `total_revenue`, `avg_order_value`, and add `revenue_rank`
    4. Register all three with `@pipe.materialized_view()` and
       call `pipe.run()`

    The test harness feeds in a CSV with clean and dirty rows, then
    verifies all three layers produce correct output.
