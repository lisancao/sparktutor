- Class: cmd_question
  Depth: intermediate
  Output: |
    为一个 Pipeline 类编写一个 `run_with_logging` 方法，
    遍历排序后的 flows，在 try/except 中执行每一个，并把
    结果收集到一个字典中，键为 'status' 和 'rows'（或
    'error'）。使用 Python 的 `logging` 模块。重新抛出异常，
    使下游步骤不被执行。
  CorrectAnswer: |
    import logging

    logger = logging.getLogger("pipeline")

    def run_with_logging(self):
        graph = {name: self._detect_deps(func) for name, func in self._flows.items()}
        order = self._topo_sort(graph)

        results = {}
        for name in order:
            try:
                df = self._flows[name](self.spark)
                df.createOrReplaceTempView(name)
                count = df.count()
                results[name] = {"status": "success", "rows": count}
                logger.info(f"Materialized {name}: {count} rows")
            except Exception as e:
                results[name] = {"status": "error", "error": str(e)}
                logger.error(f"Failed to materialize {name}: {e}")
                raise
        return results
  Hint: "遍历排序后的 flows，每个包在 try/except 中，把状态收集到字典里。"

- Class: text
  Depth: advanced
  Output: |
    ## 幂等性：跑两次，得到相同结果

    如果用相同输入运行两次管道产生相同输出且没有副作用，
    那么这个管道是**幂等的**。这对生产环境至关重要，因为
    管道在失败后会被重试。

    你的管道已经是幂等的，因为：

    1. **Bronze 按 `order_id` 去重** —— 重复接入同一个
       CSV 会产生相同的行集合
    2. **Silver 使用确定性转换** —— 转换、过滤和算术对
       相同输入产生相同输出
    3. **临时视图是替换的** —— `createOrReplaceTempView`
       会覆盖之前的结果，而不是追加

    如果你把结果持久化到存储，使用 `mode("overwrite")` 或
    Iceberg 的 `createOrReplace` —— 批处理管道永远不要用
    `mode("append")`，因为重跑会产生重复行。

