    ## Error Handling and Logging

    Production pipelines need to report what happened — which steps
    succeeded, how many rows were processed, and what went wrong.
    Enhance the `run()` method with logging and error tracking:

    ```python
    import logging

    logger = logging.getLogger("pipeline")

    def run(self):
        graph = {name: self._detect_deps(func)
                 for name, func in self._flows.items()}
        order = self._topo_sort(graph)

        results = {}
        for name in order:
            try:
                df = self._flows[name](self.spark)
                df.createOrReplaceTempView(name)
                count = df.count()
                results[name] = {"status": "success", "rows": count}
                logger.info(f"Materialized {name}: {count} rows")
            except Exception as e:
                results[name] = {"status": "error", "error": str(e)}
                logger.error(f"Failed to materialize {name}: {e}")
                raise

        return results
    ```

    The `results` dictionary becomes a pipeline run report. In
    production, you would persist this to a monitoring system.

