- Class: text
  Depth: all
  Output: |
    ## 为什么这个设计有效

    medallion 架构给你带来几个重要特性：

    **可重处理性。** 如果 silver 逻辑变了（例如新增了一种
    类型转换），你可以从未改动的 bronze 数据重新运行 silver
    和 gold。你永远不需要从原始数据源重新接入。

    **可调试性。** 当 gold 的数字看起来不对时，你可以检查
    silver 临时视图看清洗是否正确，或检查 bronze 视图看
    原始输入。每一层都可以独立查询。

    **关注点分离。** Bronze 工程师关心接入可靠性。Silver
    工程师关心数据质量。Gold 工程师关心业务逻辑。每一层
    都有明确的负责人和契约。

