    ## 课程完成！

    你已经从零构建了一条生产级的数据管道。以下是你在全部
    八课中学到的内容：

    | 课程 | 你构建了什么 |
    |------|-------------|
    | 1. SparkSession | 入口点 —— 为本地开发配置 |
    | 2. 函数与转换 | select、filter、withColumn、f.col、f.when |
    | 3. 读写数据 | DataFrameReader/Writer、schema、Parquet、写入模式 |
    | 4. Pipeline 框架 | 装饰器注册、依赖检测、拓扑排序 |
    | 5. Bronze 层 | 原始数据接入、元数据列、去重 |
    | 6. Silver 层 | 类型转换、null 处理、丰富性 join、JSON 解析 |
    | 7. Gold 层 | 聚合、窗口函数、排名 |
    | 8. 完整管道 | 端到端接线、错误处理、幂等性 |

    前三课给了你 Spark 的词汇。第 4 课给了你编排框架。
    第 5-7 课用这两者构建了三层 medallion 架构。而这一课
    把一切连接成一条可运行的管道。

    **接下来去哪里：**
    - 用 Parquet 或 Iceberg 表添加持久化存储
    - 把 CSV 源替换成 Kafka 流
    - 用 spark-submit 或 Airflow 之类的编排器部署
    - 在层与层之间添加数据质量检查

    现在你已经具备了用 Apache Spark 构建生产级数据管道的
    能力。工程愉快！
