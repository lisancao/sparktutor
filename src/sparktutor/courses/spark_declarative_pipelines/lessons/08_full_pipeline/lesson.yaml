    ## Deployment Patterns

    Your Pipeline class runs locally in this course, but the same code
    runs in production with different submission methods:

    **1. spark-submit** — the standard way to run Spark jobs:
    ```bash
    spark-submit --master spark://master:7077 pipeline.py
    ```

    **2. Orchestration (Airflow/Dagster)** — schedule pipeline runs,
    handle retries, and manage dependencies between multiple pipelines.
    Each pipeline becomes a task in a DAG.

    **3. Containerized (Kubernetes)** — package Spark + your code in a
    Docker image and submit via `spark-submit --master k8s://...`.
    Executor pods are created and destroyed per job.

    **4. Monitoring** — expose pipeline metrics (rows processed,
    duration, errors) to Prometheus/Grafana. The `results` dictionary
    from `run_with_logging` is a natural starting point.

