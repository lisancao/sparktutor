    ## Why This Design Works

    The medallion architecture gives you several important properties:

    **Reprocessability.** If the silver logic changes (e.g., a new type
    cast), you re-run silver and gold from the unchanged bronze data.
    You never need to re-ingest from the original source.

    **Debuggability.** When gold numbers look wrong, you can inspect
    the silver temp view to see if cleaning was correct, or the bronze
    view to see the raw input. Each layer is independently queryable.

    **Separation of concerns.** Bronze engineers worry about ingestion
    reliability. Silver engineers worry about data quality. Gold
    engineers worry about business logic. Each layer has a clear owner
    and contract.

