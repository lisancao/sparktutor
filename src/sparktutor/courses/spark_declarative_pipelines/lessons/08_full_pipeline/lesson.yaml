    ## Idempotency: Run It Twice, Get the Same Result

    A pipeline is **idempotent** if running it twice with the same input
    produces the same output without side effects. This is critical for
    production because pipelines will be retried after failures.

    Your pipeline is already idempotent because:

    1. **Bronze deduplicates** by `order_id` — re-ingesting the same
       CSV produces the same set of rows
    2. **Silver uses deterministic transforms** — casts, filters, and
       arithmetic produce the same output for the same input
    3. **Temp views are replaced** — `createOrReplaceTempView` overwrites
       the previous result, not appends to it

    If you persist results to storage, use `mode("overwrite")` or
    Iceberg's `createOrReplace` — never `mode("append")` for batch
    pipelines, as re-running would create duplicate rows.

