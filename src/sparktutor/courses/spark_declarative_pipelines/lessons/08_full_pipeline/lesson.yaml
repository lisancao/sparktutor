    ## What You'll Learn

    This is the capstone lesson. You have built every piece individually:
    a SparkSession, transformations, I/O, a Pipeline framework, and
    three medallion layers. Now you will **connect them into a single
    end-to-end pipeline** and learn how to make it production-ready.

    By the end of this lesson you will be able to:

    - Wire bronze, silver, and gold functions into one Pipeline
    - Trace data flow through all three layers
    - Add error handling and logging to the Pipeline runner
    - Understand idempotency and why it matters for batch pipelines
    - Choose a deployment pattern for production (advanced)

