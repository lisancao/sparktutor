course:
  id: spark_declarative_pipelines
  title: "Spark 4.1 声明式管道"
  description: "构建生产级别的 Bronze-Silver-Gold 数据管道"
  version: "1.0.0"
  requires_lakehouse: true
  prerequisites:
    - "Python 3.10+"
    - "pip install pyspark"
    - "Docker Desktop（用于 Lakehouse Stack 模式 —— Kafka、Iceberg）"
    - "lakehouse-stack 仓库（可选，用于完整基础设施）"
  lessons:
    - 01_spark_session
    - 02_functions_and_transforms
    - 03_reading_writing_data
    - 04_pipeline_framework
    - 05_bronze_layer
    - 06_silver_layer
    - 07_gold_layer
    - 08_full_pipeline
