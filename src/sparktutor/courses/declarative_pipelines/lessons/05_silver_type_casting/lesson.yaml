    ## Building a cast_columns Helper

    A reusable pattern:

    ```python
    def cast_columns(df, casts):
        for col_name, target_type in casts.items():
            df = df.withColumn(col_name, f.col(col_name).cast(target_type))
        return df
    ```

    casts = {"price": "double", "quantity": "int", "ts": "timestamp"}

    To log failures: before casting, identify rows that will fail. Add a
    _cast_failures column that records which columns failed. Split into
    valid and quarantine DataFrames. Write quarantine to a separate table.

