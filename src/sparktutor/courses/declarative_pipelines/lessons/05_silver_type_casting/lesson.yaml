    ## From Bronze Strings to Silver Types

    Bronze preserved everything as strings. Silver's first job: cast to
    proper types. ShopStream's click events have timestamp, product_id,
    event_type. Payments have amount (double), created_at (timestamp).
    Inventory has quantity (int).

    But what happens when a value fails to cast? "pending" for price.
    "invalid" for timestamp. Empty string for quantity. This lesson shows
    the failure first, then the fix: safe casting with quarantine.

- Class: text
  Depth: beginner
  Output: |
    ## The Failure: What Happens When Casting Fails

    ```python
    df.withColumn("price", f.col("price").cast("double"))
    ```

    If price contains "pending", "N/A", or "", the cast produces null.
    The row stays, but you lose the original value. Downstream: revenue
    aggregation ignores nulls (correct) but you have no record of what
    failed. No audit. No fix.

    Worse: if you use `.cast()` and expect it to throw — it doesn't.
    Spark's cast returns null for invalid values. Silent data loss.

- Class: text
  Depth: intermediate
  Output: |
    ## Safe Casting with try_cast and when/otherwise

    **try_cast** (Spark 3.0+): Like cast, but returns null on failure.
    Same as cast for most types. Use when you want null for bad values.

    **when/otherwise**: Explicit handling:
    ```python
    f.when(f.col("price").cast("double").isNotNull(), f.col("price").cast("double"))
      .otherwise(None)
    ```
    Or: check if the string matches a pattern before casting.

    **Custom logic**: Detect bad values, route to quarantine:
    ```python
    valid = df.filter(f.col("price").rlike(r"^\d+\.?\d*$"))
    invalid = df.filter(~f.col("price").rlike(r"^\d+\.?\d*$"))
    ```

