    ## Quarantine Table Schema

    Quarantine rows need: original columns (as strings), _quarantine_reason,
    _quarantine_at. Store the raw values so you can fix and backfill.

    ```python
    quarantine = invalid_df.withColumn("_quarantine_reason", f.lit("price_cast_failed"))
    quarantine = quarantine.withColumn("_quarantine_at", f.current_timestamp())
    ```

    Production: write quarantine to a Delta/Iceberg table. Set up alerts
    when quarantine count exceeds threshold. Weekly review to fix sources.

