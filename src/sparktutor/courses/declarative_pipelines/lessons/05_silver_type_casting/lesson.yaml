    ## Summary

    Silver type casting with quarantine:

    - **Safe casting** — f.col().cast(), f.to_timestamp()
    - **Failure handling** — null for bad values; don't drop silently
    - **Quarantine** — route failed rows to a separate DataFrame with
      _quarantine_reason, _quarantine_at
    - **Auditability** — preserve raw values in quarantine for fix/backfill

    In the next lesson, you will add **data quality rules** — row-level
    and column-level validation beyond type casting.
