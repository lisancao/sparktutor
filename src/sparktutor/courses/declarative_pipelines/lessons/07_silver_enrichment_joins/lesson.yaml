    ## Summary

    Silver enrichment with joins:

    - **Left join** — preserve all fact rows, lookups add columns
    - **Broadcast** — optimize small lookup joins
    - **Multiple lookups** — chain joins: clicks → products → users
    - **SCD** — Type 1 for simple overwrite, Type 2 for history

    Enriched silver feeds gold. In the next lesson, you will build
    **gold aggregations** — daily revenue by category, conversion rates —
    the business metrics for dashboards.
