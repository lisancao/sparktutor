    ## Enriching Click Events

    Bronze clicks have product_id. Silver has cast types and passed
    quality checks. But the executive dashboard needs **product names**,
    **user segments**, and **geo data**. That requires joining with
    lookup tables.

    ShopStream's lookups: product catalog (product_id → name, category),
    user profiles (user_id → segment), geo (ip/country → region). This
    lesson builds the enrichment joins that create rich silver records.

- Class: text
  Depth: beginner
  Output: |
    ## Joining Bronze Tables

    Silver can join multiple bronze (or silver) tables:

    ```python
    clicks = spark.table("bronze_clicks")
    products = spark.table("product_catalog")
    enriched = clicks.join(products, "product_id", "left")
    ```

    Use **left** join to preserve all clicks. Products not in catalog
    get null for product name. Use **inner** only when you want to drop
    clicks with unknown products.

- Class: text
  Depth: intermediate
  Output: |
    ## Lookup Tables

    Lookups are typically small: product catalog (thousands of rows),
    user segments (millions but still small vs events). Best practices:

    - **Broadcast** small lookups: `f.broadcast(products)` in join.
      Spark sends the small table to every executor. Avoids shuffle.
    - **Refresh strategy**: Lookups change. Product catalog updates
      daily. User segments might be batch. Decide: full refresh or
      incremental. For this course we assume lookups are provided as
      DataFrames.

