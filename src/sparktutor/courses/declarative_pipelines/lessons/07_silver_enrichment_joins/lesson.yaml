- Class: text
  Depth: intermediate
  Output: |
    ## Broadcast Optimization

    When one side of the join is small (< 10MB typically), broadcast it:

    ```python
    enriched = clicks.join(f.broadcast(products), "product_id", "left")
    ```

    Spark sends the products table to every executor. No shuffle of the
    large clicks table. Join happens locally. Set
    spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "10m") to
    let Spark auto-broadcast small tables.

- Class: mult_question
  Depth: intermediate
  Output: "When should you use broadcast join?"
  AnswerChoices: "When one side is small — avoids shuffle of large table;When both tables are huge;When you need a full outer join;Never — it uses more memory"
  CorrectAnswer: "When one side is small — avoids shuffle of large table"
  Hint: "Broadcast sends the small table to executors. The large table stays put. No shuffle."

- Class: text
  Depth: advanced
  Output: |
    ## Slowly Changing Dimensions (SCD)

    **Type 1**: Overwrite. Product name changes? Update the row. No
    history. Simple.

    **Type 2**: Keep history. Product name changes? Add new row with
    effective_from, effective_to. Queries use effective_to is null for
    current. Complex but supports point-in-time correctness.

    For ShopStream we use Type 1 — product catalog is overwritten daily.
    Silver joins on product_id. No history needed for this course.

