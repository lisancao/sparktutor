    ## Deduplication Strategies

    **dropDuplicates**: Removes rows that are identical across all
    columns (or a subset). Fast, simple. Use when duplicates are exact
    copies.

    ```python
    df.dropDuplicates(["event_id"])
    ```

    **Window-based**: When "duplicates" differ (e.g. same event_id,
    different _ingested_at because of retries), keep the latest:

    ```python
    from pyspark.sql import Window
    w = Window.partitionBy("event_id").orderBy(f.col("_ingested_at").desc())
    df.withColumn("_rn", f.row_number().over(w)).filter(f.col("_rn") == 1).drop("_rn")
    ```

    For ShopStream clicks, event_id is the natural key. If no event_id,
    use (user_id, session_id, product_id, timestamp) as composite key.

