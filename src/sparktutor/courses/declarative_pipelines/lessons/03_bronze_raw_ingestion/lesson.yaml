    ## Exercise: Ingest ShopStream Click Events

    Implement `bronze_clicks(spark, csv_path)` that:

    1. Defines an all-StringType schema: event_id, user_id, product_id,
       event_type, timestamp
    2. Reads the CSV with header=True and that schema
    3. Adds _ingested_at (current_timestamp) and _source_file
       (input_file_name) metadata columns
    4. Deduplicates by event_id using dropDuplicates
    5. Returns the bronze DataFrame

    The test harness creates a CSV with a duplicate event_id and
    verifies your function returns 2 rows (not 3). It also checks that
    price-like columns remain as StringType.
