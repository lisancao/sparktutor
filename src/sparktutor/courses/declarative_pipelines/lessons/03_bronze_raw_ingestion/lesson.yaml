  Output: |
    ## input_file_name() and Multiple Files

    When you read with a glob (`/data/clicks/*.csv`), each partition may
    have rows from different files. `input_file_name()` returns the file
    path for each row. Useful for:
    - Debugging: "Which file had the bad data?"
    - Incremental processing: track which files are already in bronze
    - Data lineage: attach file path to every row for compliance

    Note: input_file_name() can be null for DataFrames created from
    createDataFrame or other non-file sources. In tests, you may need to
    mock or accept null.

