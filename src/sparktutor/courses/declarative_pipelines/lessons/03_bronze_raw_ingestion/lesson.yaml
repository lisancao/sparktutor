    ## ShopStream Click Events

    ShopStream's web analytics system emits click events: user_id,
    session_id, product_id, event_type, timestamp, and sometimes extra
    fields. Files arrive as CSV, one file per hour. Duplicates happen when
    the collector retries. Schema changes when the frontend team adds
    a new tracking dimension.

    This lesson builds the bronze ingestion for these clicks. By the end,
    you will have a function that reads the CSV, adds metadata, and
    deduplicates — the foundation that silver and gold will consume.

- Class: text
  Depth: beginner
  Output: |
    ## Schema-on-Read: Why Everything Is StringType

    At bronze, we read with an **all-string schema**. Every column is
    StringType. Why?

    - **timestamp** might be "2024-01-15T10:30:00" or "invalid" or ""
    - **product_id** might be "P-123" or "N/A"
    - **event_type** might be "click" or "CLICK" or "click " (trailing space)

    If we use inferSchema or cast to types at read time, bad values become
    null or cause failures. We lose the original. Bronze's job: preserve
    everything. Silver will cast, validate, and decide what to do with
    "invalid" and "N/A".

- Class: text
