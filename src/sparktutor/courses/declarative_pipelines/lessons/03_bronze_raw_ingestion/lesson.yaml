    ## Metadata Columns

    Every bronze row gets three metadata columns:

    - **_ingested_at**: `f.current_timestamp()` — when this row was loaded
    - **_source_file**: `f.input_file_name()` — which file it came from
    - **_batch_id**: optional — a run identifier for reprocessing

    These columns create an audit trail. "Where did this duplicate come
    from?" Check _source_file. "When was this batch loaded?" Check
    _ingested_at. "Which pipeline run produced this?" Check _batch_id.

