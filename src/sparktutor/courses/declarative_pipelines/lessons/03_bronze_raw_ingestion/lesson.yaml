    ## Failure First: What Happens Without Dedup

    Imagine ShopStream's collector sends the same click twice. Without
    deduplication:
    - Silver aggregates: 2 clicks instead of 1
    - Gold conversion rate: inflated (same user counted twice)
    - Revenue: could double-count if payment and click both duplicate

    We will see this failure in the exercise: ingest without dedup, then
    with dedup. The difference in downstream counts is the lesson.

- Class: cmd_question
  Depth: all
  Output: |
    Write code to read a CSV from path with an all-StringType schema
    (event_id, user_id, product_id, event_type, timestamp) and add
    _ingested_at and _source_file columns.
  CorrectAnswer: |
    from pyspark.sql.types import StructType, StructField, StringType
    from pyspark.sql import functions as f

    schema = StructType([
        StructField("event_id", StringType()),
        StructField("user_id", StringType()),
        StructField("product_id", StringType()),
        StructField("event_type", StringType()),
        StructField("timestamp", StringType()),
    ])
    df = (spark.read.csv(path, header=True, schema=schema)
        .withColumn("_ingested_at", f.current_timestamp())
        .withColumn("_source_file", f.input_file_name()))
  Hint: "StructType with StructField for each column, all StringType. spark.read.csv with schema=, then withColumn for metadata."

- Class: text
