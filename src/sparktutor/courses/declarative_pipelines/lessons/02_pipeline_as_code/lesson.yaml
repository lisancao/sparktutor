    ## The Run Method

    Once you have steps and dependencies, `run()` does:

    1. Build the dependency graph
    2. Topological sort to get execution order
    3. For each step in order: call the function, register the result
       as a temp view or table with the step name
    4. Return a report (steps run, row counts, duration)

    The spark session must be passed to each function (or captured in
    closure). Each step's output becomes available for the next.

