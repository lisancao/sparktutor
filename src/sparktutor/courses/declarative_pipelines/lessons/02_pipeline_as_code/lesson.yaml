    ## The @materialized_view() Decorator

    A materialized view is a named result that gets computed and stored.
    In our Pipeline, each step is a function that produces a DataFrame
    and registers it as a table:

    ```python
    pipeline = Pipeline(spark)

    @pipeline.materialized_view("bronze_clicks")
    def bronze_clicks():
        return spark.read.csv("/data/clicks.csv", header=True)
    ```

    When the pipeline runs, it will execute `bronze_clicks()`, take the
    result, and register it as the table `bronze_clicks`. Any later step
    that does `spark.table("bronze_clicks")` depends on this step.

