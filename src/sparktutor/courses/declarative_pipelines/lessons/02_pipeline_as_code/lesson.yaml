    ## Topological Sort for Execution

    A directed acyclic graph (DAG) of steps: A → B → C means A must run
    before B, B before C. Topological sort produces a valid order: [A, B, C].

    Algorithm: repeatedly pick a node with no unvisited predecessors,
    add it to the order, mark it visited. Repeat until all nodes are done.

    If the graph has a cycle (A → B → C → A), no valid order exists. The
    Pipeline should detect this and raise an error.

- Class: cmd_question
  Depth: all
  Output: |
    Write a Pipeline class with a `materialized_view(name)` decorator that
    appends (name, func) to a list `self.steps`. Assume `__init__(self, spark)`
    stores spark and initializes steps.
  CorrectAnswer: |
    class Pipeline:
        def __init__(self, spark):
            self.spark = spark
            self.steps = []

        def materialized_view(self, name):
            def decorator(func):
                self.steps.append((name, func))
                return func
            return decorator
  Hint: "The decorator is a function that returns a decorator. The inner decorator receives func and appends (name, func) to self.steps."

