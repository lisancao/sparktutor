    ## Why Declarative Over Imperative

    **Imperative**: "First run bronze, then silver, then gold. Call each
    function in order. If silver fails, catch the exception and log it."
    You write the execution order. You maintain the dependency graph by
    hand. Add a new step? Update three places.

    **Declarative**: "Here are my pipeline steps. Each one declares what
    it reads and what it writes. Figure out the order." The framework
    infers dependencies from `spark.table()` calls. Add a new step? Just
    register it. Order is automatic.

    For ShopStream, we want: bronze_clicks → silver_clicks → gold_daily.
    The Pipeline class will detect that silver_clicks reads bronze_clicks
    and gold_daily reads silver_clicks, then execute in topological order.

