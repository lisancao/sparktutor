    ## Summary

    You built a declarative Pipeline framework:

    - **@materialized_view(name)** — registers a step that produces a named table
    - **Dependency detection** — spark.table() references define the graph
    - **Topological sort** — execution order is automatic
    - **run()** — executes in order, registers results, returns report

    In the next lesson, you will implement **bronze ingestion** for
    ShopStream click events — the first real data layer that this
    Pipeline will orchestrate.
