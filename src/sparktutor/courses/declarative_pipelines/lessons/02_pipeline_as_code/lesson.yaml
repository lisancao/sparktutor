    ## Dependency Detection via spark.table()

    The Pipeline inspects each function's implementation. If the body
    contains a call to `spark.table("some_name")`, that step depends on
    the step that produces `some_name`.

    ```python
    @pipeline.materialized_view("silver_clicks")
    def silver_clicks():
        raw = spark.table("bronze_clicks")  # dependency!
        return raw.withColumn("price", f.col("price").cast("double"))
    ```

    The Pipeline parses this, builds a graph: bronze_clicks → silver_clicks.
    Topological sort yields execution order: bronze_clicks first, then
    silver_clicks.

    **Limitation**: This requires static analysis. Dynamic table names
    like `spark.table(tbl)` won't be detected. For this course we use
    literal strings.

