    ## Extracting spark.table() References

    To detect dependencies, the Pipeline must parse each function's source
    code. Options:

    1. **ast.parse** — Parse the function's `__code__` or inspect.getsource.
      Walk the AST for `Call` nodes where the function is `spark.table`
      or `self.spark.table`, and the argument is a string literal.
    2. **Regex** — Simpler but fragile: match `spark\.table\s*\(\s*["'](\w+)["']`
      to extract table names.

    For this course, a simple regex or AST walk is sufficient. Production
    pipelines might use more sophisticated analysis or explicit dependency
    declarations.

- Class: cmd_question
  Depth: intermediate
  Output: |
    Given a list of steps [(name, func), ...] where func may call
    spark.table("dep_name"), write a function `get_dependencies(step_name, func)`
    that returns a list of table names the func depends on. Use a simple
    regex: spark\.table\s*\(\s*["'](\w+)["']\s*\)
  CorrectAnswer: |
    import re
    def get_dependencies(step_name, func):
        import inspect
        src = inspect.getsource(func)
        return re.findall(r'spark\.table\s*\(\s*["\'](\w+)["\']\s*\)', src)
  Hint: "inspect.getsource(func) gives the source; re.findall with the pattern extracts table names."

