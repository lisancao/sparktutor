- Class: cmd_question
  Depth: all
  Output: |
    Write a run_step wrapper that executes func(), catches Exception,
    returns (success: bool, row_count: int, error: str|None). On success,
    row_count = df.count(); on failure, row_count=0, error=str(e).
  CorrectAnswer: |
    def run_step(func):
        try:
            df = func()
            return (True, df.count(), None)
        except Exception as e:
            return (False, 0, str(e))
  Hint: "try/except. On success: df.count(). On except: return False, 0, str(e)."

