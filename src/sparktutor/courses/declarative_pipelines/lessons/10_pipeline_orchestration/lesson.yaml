  Output: |
    ## Structured Logging

    ```python
    import logging
    import json

    log = {"step": name, "rows": count, "duration_sec": duration, "status": "ok"}
    logging.info(json.dumps(log))
    ```

    Structured logs (JSON) are parseable. Tools like Datadog, Splunk can
    index and alert. Include: step name, row count, duration, status,
    error message if failed. Pipeline run ID for correlation.

