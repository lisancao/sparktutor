- Class: text
  Depth: beginner
  Output: |
    ## Error Handling: Try/Except Per Step

    ```python
    for name in order:
        try:
            df = run_step(name)
            report.append({"step": name, "status": "ok", "rows": df.count()})
        except Exception as e:
            report.append({"step": name, "status": "failed", "error": str(e)})
            if abort_on_failure:
                raise
    ```

    Each step runs in try/except. On failure: log, add to report, optionally
    re-raise to stop the pipeline. Downstream steps depend on upstream —
    if bronze fails, silver cannot run. So abort_on_failure=True is typical.

- Class: text
  Depth: intermediate
  Output: |
    ## Partial Pipeline Runs

    Sometimes you want to resume: bronze and silver succeeded yesterday.
    Today, only run silver and gold (bronze reads new files). Implement
    with a `from_step` parameter: skip steps before from_step in the
    topological order. Or: check if a step's output already exists (table
    or path), skip if fresh.

    For this course we run the full pipeline. Partial runs are an
    extension.

