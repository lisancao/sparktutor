    ## Pipeline Run Reports

    At the end of a run, emit a report:

    ```json
    {
      "run_id": "uuid",
      "started_at": "2024-01-15T10:00:00",
      "finished_at": "2024-01-15T10:05:00",
      "steps": [
        {"name": "bronze_clicks", "status": "ok", "rows": 10000},
        {"name": "silver_clicks", "status": "ok", "rows": 9998},
        {"name": "gold_daily", "status": "ok", "rows": 50}
      ]
    }
    ```

    Write to a file, send to a monitoring system, or store in a table.
    Enables: "How many rows did each step produce?" "Did any step fail?"

