    ## Summary

    Testing and idempotency:

    - **Idempotency** — same input → same output. Overwrite, merge, dedup.
    - **Unit tests** — mock DataFrames, assert schema, counts, values
    - **Integration tests** — fixtures, full pipeline, assert gold
    - **Idempotency tests** — run twice, compare output

    In the final lesson, you will build the **capstone** — the complete
    production ShopStream pipeline with all patterns from the course.
