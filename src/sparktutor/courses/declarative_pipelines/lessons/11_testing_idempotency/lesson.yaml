    ## Overwrite vs Append: The Idempotency Trap

    **Append**: Each run adds rows. Run twice → double the rows. Not
    idempotent unless you deduplicate at read or use merge/upsert.

    **Overwrite**: Each run replaces the table. Run twice → same result.
    Idempotent. But: you lose history. For daily gold tables, overwrite
    by partition (e.g. overwrite only today's partition) is common.

    **Merge/Upsert**: Insert new, update changed. Idempotent if keys are
    correct. Delta and Iceberg support merge.

