    ## Why Idempotency Matters

    Pipelines run on a schedule. They retry on failure. They backfill.
    **Idempotency**: running the pipeline twice with the same input
    produces the same output. No duplicate rows. No double-counting.

    Without idempotency: retry after a partial failure → duplicate rows
    in gold. Backfill last week → revenue counted twice. This lesson
    teaches how to achieve idempotency and how to test it.

- Class: text
  Depth: beginner
