    ## Unit Testing Pipeline Functions

    ```python
    def test_bronze_clicks():
        spark = SparkSession.builder.master("local[*]").getOrCreate()
        df = bronze_clicks(spark, "test.csv")
        assert df.count() == 2
        assert "_ingested_at" in df.columns
        assert df.schema["event_id"].dataType == StringType()
    ```

    Use mock DataFrames: createDataFrame with known data. Assert schema,
    row count, specific values. No external files needed for pure logic
    tests. For I/O, use temp files.

