    ## Integration Testing with Test Fixtures

    Create fixtures: sample CSV, JSON files that represent real data
    (including edge cases: duplicates, nulls, invalid values). Run the
    full pipeline. Assert final gold row counts, key values.

    ```python
    def test_full_pipeline():
        with tempfile.TemporaryDirectory() as tmp:
            create_fixture_clicks(tmp)
            report = run_pipeline(spark, tmp)
            gold = spark.table("gold_daily")
            assert gold.filter(f.col("date") == "2024-01-15").count() > 0
    ```

