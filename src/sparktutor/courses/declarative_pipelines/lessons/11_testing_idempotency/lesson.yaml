    ## Verifying Idempotency in Tests

    ```python
    def test_bronze_idempotent():
        df1 = bronze_clicks(spark, path)
        df2 = bronze_clicks(spark, path)
        assert df1.count() == df2.count()
        # Or: run pipeline twice, compare gold
        run_pipeline(spark, path)
        gold1 = spark.table("gold_daily").collect()
        run_pipeline(spark, path)
        gold2 = spark.table("gold_daily").collect()
        assert gold1 == gold2
    ```

    For overwrite mode, second run replaces first. Same result. For
    append, you'd need merge or dedup to achieve idempotency.

