    ## The Complete Production Pipeline

    You have built every layer: bronze (single and multi-source), silver
    (casting, quality, enrichment), gold (aggregations, windows),
    orchestration, testing, and Airflow deployment patterns. This
    capstone assembles them into one **production ShopStream pipeline**.

    Requirements: multi-source bronze → validated silver → analytics
    gold. Monitoring hooks (row counts, freshness, quality scores). Edge
    case handling (empty files, all-null batches, duplicate deliveries).

- Class: text
  Depth: all
  Output: |
    ## Pipeline Architecture

    ```
    [clicks.csv]  → bronze_clicks  → silver_clicks  → gold_daily_revenue
    [payments.json] → bronze_payments → silver_payments ─┘
    [inventory.json] → bronze_inventory → (used for product lookup)
    [products.csv]  → product_catalog (lookup)
    ```

    Silver clicks: cast, validate, enrich with products. Silver payments:
    cast, validate. Gold: join clicks and payments for conversion,
    aggregate revenue by date and category.

- Class: text
  Depth: beginner
  Output: |
    ## Edge Case: Empty Files

    What if a file has only a header? spark.read.csv returns 0 rows.
    Bronze handles it: 0 rows with metadata. Silver: 0 rows. Gold: no
    new data for that run. Pipeline should not fail. Log: "bronze_clicks:
    0 rows" and continue.

- Class: text
  Depth: intermediate
  Output: |
    ## Edge Case: All-Null Batch

    What if every row fails validation? Silver: valid=0, quarantine=N.
    Gold reads valid. 0 rows. Gold table might have no new rows for that
    date. Pipeline succeeds. Optional: alert if quarantine rate > 50%.

