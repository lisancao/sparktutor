- Class: cmd_question
  Depth: all
  Output: |
    Write a function that takes (valid_count, quarantine_count) and
    returns quality_score as a float between 0 and 1. Handle total=0.
  CorrectAnswer: |
    def quality_score(valid_count, quarantine_count):
        total = valid_count + quarantine_count
        return valid_count / total if total > 0 else 1.0
  Hint: "total = valid + quarantine. If total > 0, return valid/total. Else 1.0 (no data = perfect?)."

- Class: text
  Depth: advanced
  Output: |
    ## Duplicate Deliveries

    A source might deliver the same file twice. Bronze deduplication
    handles it: dropDuplicates by key. If we're appending to bronze,
    we'd get duplicates. Solution: overwrite bronze by partition (e.g.
    by date) or use merge. For this capstone we assume overwrite: each
    run overwrites the bronze table for that source. Idempotent.

