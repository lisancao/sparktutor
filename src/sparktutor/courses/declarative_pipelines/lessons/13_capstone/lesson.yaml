    ## Exercise: Complete Production Pipeline

    Implement `run_production_pipeline(spark, data_dir)` that:

    1. **Bronze**: Ingest clicks (CSV), payments (JSON) from data_dir.
       Use bronze_clicks and bronze_payments from earlier lessons.
       Handle empty files (0 rows is ok).

    2. **Silver**: Cast and validate both. Silver_clicks: cast timestamp,
       quarantine failures. Silver_payments: cast amount, validate.
       Enrich clicks with a product lookup (create minimal products df).

    3. **Gold**: gold_daily_revenue from silver_payments (aggregate by
       date, category). gold_conversion from silver_clicks + silver_payments
       (hourly conversion rate).

    4. **Monitoring**: Return a report dict with keys: bronze_rows,
       silver_valid, silver_quarantine, gold_rows, quality_score.

    The test creates a minimal data_dir with clicks.csv and payments.json.
    Verifies pipeline runs and report contains expected keys.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "Wire bronze, silver, gold. Use products from lesson 7 or inline. Report: collect counts per layer. quality_score = valid/(valid+quarantine)."

