    ## Monitoring Hooks

    - **Row counts per layer**: bronze, silver, gold. Log after each step.
    - **Data freshness**: max(timestamp) in gold. Alert if stale.
    - **Quality score**: valid / (valid + quarantine). Alert if < 95%.

    Implement as simple functions that return metrics. In production,
    send to monitoring (Datadog, Prometheus) or write to a metrics table.

