    ## Window Frame Specifications: Rows vs Range

    Window frames can be defined in two ways:

    **`rowsBetween(start, end)`** — counts physical rows. `-6, 0` means
    "the current row and the 6 rows before it," regardless of the values
    in the order column. Gaps in dates are ignored.

    **`rangeBetween(start, end)`** — counts by value. For a date-ordered
    window, `rangeBetween(-6, 0)` would mean "rows whose date value is
    within 6 units of the current date." But this requires numeric order
    columns; Spark does not natively support date ranges in rangeBetween.

    For most analytics, `rowsBetween` is what you want. If your data
    has gaps (missing days), you need to fill them first with a date
    spine before computing a true calendar-based moving average.

    The default frame when no `rowsBetween`/`rangeBetween` is specified
    depends on whether there is an ORDER BY:
    - With ORDER BY: `rangeBetween(unboundedPreceding, currentRow)`
    - Without ORDER BY: `rowsBetween(unboundedPreceding, unboundedFollowing)`

