    ## What You'll Learn

    In the previous lesson you built gold aggregation tables for
    ShopStream — daily revenue by category and hourly conversion rates.
    Those tables answer "how much" and "how many." But executives want
    more: "which products are winning?", "are we trending up or down?",
    "how does this week compare to last week?"

    These questions require **window functions** — operations that compute
    across rows related to the current row without collapsing groups.

    By the end of this lesson you will be able to:

    - Rank products by revenue within categories
    - Compute running totals and 7-day moving averages
    - Calculate period-over-period percentage changes
    - Understand window frame specifications (rows vs range)
    - Build an executive dashboard gold table

