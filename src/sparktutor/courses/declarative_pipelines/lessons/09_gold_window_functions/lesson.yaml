    ## Ranking: row_number, rank, dense_rank

    Three ranking functions, each handles ties differently:

    ```python
    w = Window.partitionBy("category").orderBy(f.col("revenue").desc())

    df.withColumn("row_num", f.row_number().over(w))  # 1,2,3,4,5
    df.withColumn("rank", f.rank().over(w))            # 1,2,2,4,5
    df.withColumn("dense", f.dense_rank().over(w))     # 1,2,2,3,4
    ```

    - `row_number()` — always unique, ties broken arbitrarily
    - `rank()` — ties get the same rank, next rank skips
    - `dense_rank()` — ties get the same rank, next rank is consecutive

    For "top N products per category," use `row_number()` and filter
    where `rank <= N`. For "products in the top 3 revenue tiers," use
    `dense_rank()`.

