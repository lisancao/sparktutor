    ## Moving Averages

    A 7-day moving average smooths daily fluctuations:

    ```python
    w = Window.orderBy("date").rowsBetween(-6, 0)

    df.withColumn("ma7", f.avg("revenue").over(w))
    ```

    `rowsBetween(-6, 0)` means "the current row and the 6 rows before
    it" — a 7-row window. For the first 6 rows where there are not
    enough preceding rows, Spark averages whatever is available.

    Moving averages reveal trends that daily noise obscures. A single
    bad day looks alarming in raw data but barely dents a 7-day average.

