    ## Running Totals

    A running total sums all rows from the start up to the current row:

    ```python
    w = Window.orderBy("date").rowsBetween(
        Window.unboundedPreceding, Window.currentRow)

    df.withColumn("running_revenue", f.sum("revenue").over(w))
    ```

    `rowsBetween(unboundedPreceding, currentRow)` defines the frame:
    "from the very first row in this partition up to and including the
    current row." As you move down the rows (ordered by date), the sum
    accumulates.

    Running totals are essential for tracking progress toward goals:
    "We are at $1.2M of our $2M quarterly target."

