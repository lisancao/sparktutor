    ## Summary

    In this lesson you learned:

    - **Window vs GROUP BY** — windows preserve rows while adding
      computed columns; GROUP BY collapses rows
    - **Ranking** — row_number (unique), rank (ties skip), dense_rank
      (ties consecutive)
    - **Running totals** — unboundedPreceding to currentRow frame
    - **Moving averages** — fixed-size row frames like rowsBetween(-6, 0)
    - **Period-over-period** — lag() for previous values, handle nulls
      and zero division
    - **Frame types** — rowsBetween counts rows, rangeBetween counts
      values

    Your gold layer now has rankings, trends, and comparisons — the
    metrics executives actually look at. In the next lesson, you will
    wire everything together with **pipeline orchestration**.
