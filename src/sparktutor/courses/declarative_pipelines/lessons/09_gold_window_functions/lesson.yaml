    ## Window Functions vs GROUP BY

    GROUP BY **collapses** rows — 100 rows become 5 groups. Window
    functions **preserve** rows — 100 rows stay as 100 rows, but each
    row gains new columns computed from related rows.

    ```python
    from pyspark.sql import Window

    w = Window.partitionBy("category").orderBy(f.col("revenue").desc())
    df.withColumn("rank", f.row_number().over(w))
    ```

    This adds a `rank` column to every row. Rows are partitioned by
    category and ranked by revenue within each category. The original
    data is untouched — you just gain a new computed column.

    Window functions are essential for gold layer analytics because
    executives want both the detail AND the ranking in the same view.

- Class: text
  Depth: beginner
  Output: |
    Think of window functions like a spreadsheet formula that looks at
    other rows in the same column. If you have a column of daily revenues
    and want a "running total" column, you write a formula that sums
    everything above the current cell. That is exactly what a window
    function does — it looks at a "window" of related rows and computes
    a value.

    The window has three parts:
    1. **Partition** — which rows belong to the same group (like category)
    2. **Order** — how to sort rows within the group (like by date)
    3. **Frame** — which rows around the current row to include (like
       "the 6 rows before me" for a 7-day average)

