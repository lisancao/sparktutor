    ## Sessionization with Window Functions

    For ShopStream click data, you might want to group clicks into
    sessions — sequences of activity with gaps of less than 30 minutes.

    ```python
    w = Window.partitionBy("user_id").orderBy("click_time")

    df = (df
        .withColumn("prev_time", f.lag("click_time").over(w))
        .withColumn("gap_minutes",
            (f.unix_timestamp("click_time") -
             f.unix_timestamp("prev_time")) / 60)
        .withColumn("new_session",
            f.when(f.col("gap_minutes") > 30, 1).otherwise(0))
        .withColumn("session_id",
            f.sum("new_session").over(w.rowsBetween(
                Window.unboundedPreceding, Window.currentRow))))
    ```

    The running sum of `new_session` flags increments each time a gap
    exceeds 30 minutes, creating a natural session identifier.

