    ## Period-over-Period Comparison

    The `lag()` function looks at a previous row in the window:

    ```python
    w = Window.partitionBy("category", "product_id").orderBy("date")

    df = df.withColumn("prev_revenue", f.lag("revenue", 1).over(w))
    df = df.withColumn("pct_change",
        f.when(
            f.col("prev_revenue").isNotNull() &
            (f.col("prev_revenue") != 0),
            (f.col("revenue") - f.col("prev_revenue")) /
                f.col("prev_revenue")
        ).otherwise(None))
    ```

    `lag("revenue", 1)` returns the revenue from the previous row
    (ordered by date, within the same category and product). The
    percentage change shows growth or decline day over day.

    Handle the edge cases: the first row has no previous value (None),
    and division by zero if the previous value was 0.

