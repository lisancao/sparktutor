    ## Exercise: ShopStream Airflow Pipeline

    Build the complete ShopStream deployment configuration. Since we
    can't run Airflow in the exercise, you will implement the **pipeline
    runner functions** that Airflow would call, plus a **DAG builder**
    function that returns the task dependency structure.

    Implement three functions:

    **`build_dag_config()`**
    Return a dict describing the DAG:
    ```python
    {
        "dag_id": "shopstream_daily",
        "schedule": "0 2 * * *",
        "retries": 3,
        "retry_delay_minutes": 5,
        "tasks": ["bronze_clicks", "bronze_payments", "silver_clicks",
                  "silver_payments", "gold_revenue", "monitor"],
        "dependencies": {
            "silver_clicks": ["bronze_clicks", "bronze_payments"],
            "silver_payments": ["bronze_payments"],
            "gold_revenue": ["silver_clicks", "silver_payments"],
            "monitor": ["gold_revenue"],
        },
    }
    ```

    **`run_pipeline_task(spark, task_name, execution_date, data_dir)`**
    Given a task name, run the appropriate pipeline step:
    - "bronze_clicks": read clicks CSV, add metadata, dedup → return row count
    - "bronze_payments": read payments JSON, add metadata → return row count
    - "silver_clicks": read bronze_clicks view, cast timestamp, filter invalid → return (valid_count, quarantine_count)
    - "silver_payments": read bronze_payments view, cast amount → return row count
    - "gold_revenue": read silver_payments, groupBy date + category, sum amount → return row count
    - "monitor": collect counts from prior steps (passed as kwargs), return report dict

    **`run_full_pipeline(spark, data_dir, execution_date)`**
    Execute tasks in dependency order (topological sort), collecting
    results. Return the final monitoring report with keys: bronze_rows,
    silver_valid, silver_quarantine, gold_rows, quality_score.
