    ## Airflow Core Concepts

    **DAG (Directed Acyclic Graph):** A collection of tasks with
    dependencies. The DAG defines the order: "run bronze, then silver,
    then gold." No cycles — a task cannot depend on itself.

    **Task:** A single unit of work. For ShopStream: "run bronze_clicks"
    is a task, "run silver_clicks" is another.

    **Operator:** The type of work a task performs. Common operators:
    - `PythonOperator` — run a Python function
    - `SparkSubmitOperator` — submit a Spark job
    - `BashOperator` — run a shell command

    **Schedule:** When the DAG runs. `@daily`, `@hourly`, or a cron
    expression like `0 2 * * *` (2 AM daily).

    **Execution Date:** The logical date the DAG run represents. A daily
    DAG running at 2 AM on Jan 16 processes Jan 15's data. The
    execution date is Jan 15, not Jan 16.

