    ## Why You Need an Orchestrator

    Running a pipeline manually works for development. In production,
    you face questions your Pipeline class cannot answer:

    - **When?** — Run daily at 2 AM UTC after upstream data lands
    - **What if it fails?** — Retry 3 times with exponential backoff
    - **What about dependencies?** — Don't run gold until silver succeeds
    - **What ran yesterday?** — Full audit trail of every execution
    - **How do I backfill?** — Re-run last Tuesday's pipeline for a data fix

    Airflow handles all of these. Your Pipeline class handles the
    **what** (transform data). Airflow handles the **when**, **how
    often**, **what if**, and **in what order**.

- Class: text
  Depth: beginner
  Output: |
    Think of Airflow as a **train schedule system**. Your pipeline is
    the train (it moves data from A to B). Airflow is the dispatcher
    that decides when each train departs, monitors whether it arrived
    on time, re-dispatches if it breaks down, and logs everything.

    Without Airflow, you are manually pushing a train down the tracks
    every time you want it to run. With Airflow, trains run on schedule
    and you only get a phone call when something goes wrong.

