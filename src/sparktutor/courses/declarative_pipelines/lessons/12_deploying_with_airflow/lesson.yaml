    ## Parameterizing with Execution Date

    Airflow provides **template variables** that inject runtime context
    into your tasks. The most important is `{{ ds }}` — the execution
    date as `YYYY-MM-DD`:

    ```python
    def run_bronze(**context):
        execution_date = context["ds"]  # "2024-01-15"
        data_path = f"/data/raw/{execution_date}/"
        output_path = f"/data/bronze/{execution_date}/"
        spark = SparkSession.builder.getOrCreate()
        bronze_clicks(spark, data_path, output_path)
        spark.stop()
    ```

    This makes your pipeline **date-aware**:
    - Each run processes one day's data
    - Re-running Jan 15 reprocesses only Jan 15's data
    - Backfilling a date range processes each date independently

    Combined with overwrite-by-partition writes, this gives you
    idempotent, backfillable pipeline runs.

