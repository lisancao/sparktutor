    ## Your First Airflow DAG

    An Airflow DAG for ShopStream's daily pipeline:

    ```python
    from airflow import DAG
    from airflow.operators.python import PythonOperator
    from datetime import datetime, timedelta

    default_args = {
        "owner": "data-team",
        "retries": 3,
        "retry_delay": timedelta(minutes=5),
        "execution_timeout": timedelta(hours=2),
    }

    with DAG(
        dag_id="shopstream_daily_pipeline",
        default_args=default_args,
        schedule="0 2 * * *",
        start_date=datetime(2024, 1, 1),
        catchup=False,
        tags=["shopstream", "production"],
    ) as dag:

        bronze = PythonOperator(
            task_id="bronze_ingestion",
            python_callable=run_bronze,
        )
        silver = PythonOperator(
            task_id="silver_validation",
            python_callable=run_silver,
        )
        gold = PythonOperator(
            task_id="gold_aggregation",
            python_callable=run_gold,
        )

        bronze >> silver >> gold
    ```

    The `>>` operator defines the dependency chain: bronze must
    complete before silver starts, silver before gold. If bronze fails,
    silver and gold are skipped automatically.

