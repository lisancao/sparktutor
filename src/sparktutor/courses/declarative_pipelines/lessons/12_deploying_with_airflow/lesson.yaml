    ## Retries, Timeouts, and SLAs

    Production pipelines fail. Network issues, data delays, cluster
    problems. Airflow's retry mechanism handles transient failures:

    ```python
    default_args = {
        "retries": 3,
        "retry_delay": timedelta(minutes=5),
        "retry_exponential_backoff": True,
        "max_retry_delay": timedelta(minutes=30),
        "execution_timeout": timedelta(hours=2),
    }
    ```

    - **retries**: how many times to retry a failed task
    - **retry_delay**: wait time before first retry
    - **retry_exponential_backoff**: double the delay each retry
      (5 min, 10 min, 20 min)
    - **execution_timeout**: kill the task if it runs too long
    - **sla**: alert if the task hasn't completed within a time window

    Set SLAs on gold tasks that power dashboards. If gold hasn't
    completed by 6 AM, the dashboard team needs to know:

    ```python
    gold = PythonOperator(
        task_id="gold_aggregation",
        python_callable=run_gold,
        sla=timedelta(hours=4),  # must complete within 4 hours of DAG start
    )
    ```

