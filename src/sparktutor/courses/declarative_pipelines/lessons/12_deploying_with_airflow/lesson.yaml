    ## SparkPipelinesOperator — The Dedicated SDP Operator

    Spark Declarative Pipelines (Lakeflow SDP) has a **dedicated Airflow
    operator** in the Apache Spark provider: `SparkPipelinesOperator`.
    This wraps the `spark-pipelines` CLI — a purpose-built binary for
    executing declarative pipelines defined in YAML specification files.

    Unlike `SparkSubmitOperator` (which calls `spark-submit` with a
    Python script), `SparkPipelinesOperator` calls `spark-pipelines`
    with a **pipeline spec** — a YAML file that declares your pipeline's
    name, storage location, and library paths:

    ```yaml
    # pipeline.yml — Spark Declarative Pipeline Spec
    name: shopstream_daily
    storage: file:///data/pipeline-storage
    libraries:
      - glob:
          include: transformations/**
    ```

    The operator:
    ```python
    from airflow.providers.apache.spark.operators.spark_pipelines import (
        SparkPipelinesOperator,
    )

    run_pipeline = SparkPipelinesOperator(
        task_id="run_shopstream_pipeline",
        pipeline_spec="/path/to/pipeline.yml",
        pipeline_command="run",
        conn_id="spark_default",
        num_executors=4,
        executor_cores=4,
        executor_memory="4G",
        driver_memory="2G",
    )
    ```

    Key parameters:
    - **`pipeline_spec`** — path to your pipeline YAML definition
    - **`pipeline_command`** — `"run"` to execute, `"dry-run"` to
      validate without executing (useful in CI)
    - Standard Spark resource configs: `num_executors`, `executor_cores`,
      `executor_memory`, `driver_memory`
    - **`conn_id`** — Spark connection configured in Airflow

    Under the hood, `SparkPipelinesOperator` uses `SparkPipelinesHook`,
    which extends `SparkSubmitHook` — so it inherits connection
    management, environment variables, deploy mode, and YARN queue
    support. The key difference is the binary: `spark-pipelines`
    instead of `spark-submit`.

