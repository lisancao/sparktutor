    ## What You'll Learn

    You have a tested, idempotent pipeline that processes ShopStream data
    through bronze, silver, and gold layers. But it only runs when you
    execute it manually. Production pipelines need to run **on a schedule**,
    **retry on failure**, handle **dependencies between pipelines**, and
    provide **visibility** into what ran, when, and whether it succeeded.

    Apache Airflow is the most widely adopted orchestrator for data
    pipelines. It defines workflows as Python code (DAGs), manages
    scheduling and retries, and provides a web UI for monitoring.

    By the end of this lesson you will be able to:

    - Explain what Airflow is and why pipelines need orchestration
    - Write an Airflow DAG that runs your ShopStream pipeline
    - Use the dedicated `SparkPipelinesOperator` to run Spark
      Declarative Pipelines via the `spark-pipelines` CLI
    - Understand how `SparkPipelinesOperator` relates to
      `SparkSubmitOperator` and `PythonOperator`
    - Write pipeline spec YAML files that define your SDP pipeline
    - Use `dry-run` mode to validate pipelines before execution
    - Configure retries, timeouts, and SLAs
    - Handle inter-task dependencies and data handoffs
    - Design DAGs for daily batch and hourly incremental patterns
    - Integrate pipeline monitoring and alerting

