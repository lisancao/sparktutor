    ## XComs: Passing Data Between Tasks

    Tasks communicate via **XComs** (cross-communications). A task can
    push a value, and downstream tasks pull it:

    ```python
    def run_bronze(**context):
        spark = SparkSession.builder.getOrCreate()
        df = bronze_clicks(spark, "/data/clicks.csv")
        row_count = df.count()
        context["ti"].xcom_push(key="bronze_rows", value=row_count)
        spark.stop()

    def run_silver(**context):
        bronze_rows = context["ti"].xcom_pull(
            task_ids="bronze_ingestion", key="bronze_rows")
        if bronze_rows == 0:
            print("No data from bronze, skipping silver")
            return
        # ... run silver
    ```

    Use XComs for **metadata** (row counts, file paths, quality scores)
    — not for large DataFrames. XCom values are stored in Airflow's
    metadata database and should be small (strings, numbers, short
    lists).

    For ShopStream, push the pipeline report dict (bronze_rows,
    silver_valid, silver_quarantine, quality_score) from each task.
    The monitoring task at the end collects all XComs and decides
    whether to alert.

