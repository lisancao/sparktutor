    ## SparkSubmitOperator vs PythonOperator

    Two ways to run Spark from Airflow:

    **`PythonOperator`** — runs a Python function inside the Airflow
    worker process. Works for local-mode Spark or Spark Connect:
    ```python
    def run_bronze(**context):
        spark = SparkSession.builder.appName("Bronze").getOrCreate()
        bronze_clicks(spark, "/data/clicks.csv")
        spark.stop()

    PythonOperator(task_id="bronze", python_callable=run_bronze)
    ```

    **`SparkSubmitOperator`** — submits a Spark job to a cluster via
    `spark-submit`. Better for production clusters:
    ```python
    from airflow.providers.apache.spark.operators.spark_submit import (
        SparkSubmitOperator,
    )

    SparkSubmitOperator(
        task_id="bronze",
        application="/path/to/pipeline.py",
        conn_id="spark_default",
        conf={"spark.sql.shuffle.partitions": "200"},
        application_args=["--layer", "bronze", "--date", "{{ ds }}"],
    )
    ```

    Use `PythonOperator` for development and small workloads. Use
    `SparkSubmitOperator` for production clusters where Spark needs its
    own resource allocation.

