    ## Summary

    In this lesson you learned:

    - **Why orchestration** — scheduling, retries, dependencies, audit,
      backfill — things your Pipeline class cannot do alone
    - **Airflow DAGs** — define workflows as Python code with tasks and
      dependency operators (`>>`)
    - **Operators** — `PythonOperator` for in-process Spark,
      `SparkSubmitOperator` for cluster submission,
      `SparkPipelinesOperator` for declarative pipelines via YAML specs
    - **SparkPipelinesOperator** — the dedicated SDP operator that wraps
      the `spark-pipelines` CLI with `run` and `dry-run` commands
    - **Execution date** — parameterize tasks by date for idempotent,
      backfillable runs
    - **Retries and SLAs** — handle transient failures and alert on
      delayed completion
    - **DAG patterns** — linear chains, fan-out/fan-in, sensor-gated
    - **XComs** — pass metadata between tasks (row counts, quality scores)
    - **Monitoring** — trigger_rule="all_done" for health checks that
      always run

    In the final lesson, you will build the complete ShopStream
    capstone — the production pipeline with all patterns from the
    course, ready for Airflow deployment.
