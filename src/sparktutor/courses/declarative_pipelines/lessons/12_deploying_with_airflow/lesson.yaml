    ## DAG Design Patterns for ShopStream

    **Pattern 1: Linear chain** — simple bronze → silver → gold:
    ```python
    bronze >> silver >> gold
    ```

    **Pattern 2: Fan-out / fan-in** — multiple bronze sources converge:
    ```python
    bronze_clicks = PythonOperator(...)
    bronze_payments = PythonOperator(...)
    bronze_inventory = PythonOperator(...)

    silver_clicks = PythonOperator(...)
    silver_payments = PythonOperator(...)

    gold_revenue = PythonOperator(...)

    [bronze_clicks, bronze_payments, bronze_inventory] >> silver_clicks
    [bronze_clicks, bronze_payments] >> silver_payments
    [silver_clicks, silver_payments] >> gold_revenue
    ```

    Bronze sources run **in parallel** (no dependencies between them).
    Silver waits for its required bronze sources. Gold waits for all
    silver tasks. This maximizes parallelism while respecting data
    dependencies.

    **Pattern 3: Sensor-gated** — wait for upstream data to arrive:
    ```python
    from airflow.sensors.filesystem import FileSensor

    wait_for_clicks = FileSensor(
        task_id="wait_for_clicks",
        filepath="/data/raw/{{ ds }}/clicks.csv",
        poke_interval=300,
        timeout=7200,
    )

    wait_for_clicks >> bronze_clicks >> silver_clicks >> gold
    ```

    The `FileSensor` polls for the file every 5 minutes, timing out
    after 2 hours. Bronze only starts once the data has landed.

