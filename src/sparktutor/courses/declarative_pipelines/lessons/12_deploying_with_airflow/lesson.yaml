    ## Backfilling and Catchup

    When you deploy a new DAG with `start_date=datetime(2024, 1, 1)`
    and `catchup=True`, Airflow creates a run for **every scheduled
    interval** from start_date to now. For a daily DAG, that is 365+
    runs.

    **When to use catchup=True:**
    - You have historical data to process
    - Your pipeline is date-partitioned and idempotent
    - You want to backfill the entire history on first deploy

    **When to use catchup=False (default for ShopStream):**
    - You only want to process going forward
    - Historical data was already loaded by another process

    **Manual backfill:** Even with `catchup=False`, you can backfill
    specific dates via the CLI:
    ```bash
    airflow dags backfill shopstream_daily \
        --start-date 2024-01-10 \
        --end-date 2024-01-15
    ```

    This is safer than catchup — you control exactly which dates
    to reprocess. Combined with overwrite-by-partition, backfilling
    is idempotent.

