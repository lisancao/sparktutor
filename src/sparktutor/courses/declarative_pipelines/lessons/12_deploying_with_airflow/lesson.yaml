    ## Choosing the Right Operator

    You now have three Airflow operators for Spark workloads. Here is
    when to use each:

    | Operator | Binary | Use Case |
    |---|---|---|
    | `PythonOperator` | (in-process) | Dev/test, Spark Connect, small jobs |
    | `SparkSubmitOperator` | `spark-submit` | Ad-hoc Spark scripts, JARs, PySpark apps |
    | `SparkPipelinesOperator` | `spark-pipelines` | Declarative pipelines defined in YAML specs |

    For ShopStream's declarative pipeline architecture:

    ```python
    with DAG(dag_id="shopstream_sdp", schedule="0 2 * * *", ...) as dag:

        validate = SparkPipelinesOperator(
            task_id="validate",
            pipeline_spec="/pipelines/shopstream.yml",
            pipeline_command="dry-run",
            conn_id="spark_default",
        )

        run = SparkPipelinesOperator(
            task_id="run_pipeline",
            pipeline_spec="/pipelines/shopstream.yml",
            pipeline_command="run",
            conn_id="spark_default",
            num_executors=4,
            executor_memory="4G",
            conf={"spark.sql.shuffle.partitions": "200"},
        )

        monitor = PythonOperator(
            task_id="monitor",
            python_callable=check_pipeline_health,
            trigger_rule="all_done",
        )

        validate >> run >> monitor
    ```

    The pipeline spec YAML handles the bronze → silver → gold dependency
    graph internally. Airflow handles scheduling, retries, and
    monitoring. Each tool does what it does best.

