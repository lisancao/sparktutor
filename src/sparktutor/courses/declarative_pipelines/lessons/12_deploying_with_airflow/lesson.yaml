    ## Dry-Run Validation in CI

    One major advantage of the dedicated operator is the `dry-run`
    command. In your CI/CD pipeline, validate your pipeline definition
    without actually processing data:

    ```python
    validate_pipeline = SparkPipelinesOperator(
        task_id="validate_shopstream",
        pipeline_spec="/path/to/pipeline.yml",
        pipeline_command="dry-run",
        conn_id="spark_default",
    )

    run_pipeline = SparkPipelinesOperator(
        task_id="run_shopstream",
        pipeline_spec="/path/to/pipeline.yml",
        pipeline_command="run",
        conn_id="spark_default",
        num_executors=4,
        executor_memory="4G",
    )

    validate_pipeline >> run_pipeline
    ```

    The dry-run catches schema mismatches, missing tables, and
    configuration errors before you spend compute running the full
    pipeline. Gate production runs behind a successful dry-run.

