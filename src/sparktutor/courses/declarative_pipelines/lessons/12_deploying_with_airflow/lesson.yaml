    ## Monitoring Your DAG

    Airflow's web UI shows:
    - **Tree view** — status of every task for every DAG run (green =
      success, red = failed, yellow = running, pink = retrying)
    - **Gantt chart** — execution timeline showing parallelism and
      bottlenecks
    - **Task logs** — stdout/stderr for each task execution

    For ShopStream, add a final monitoring task that collects XComs
    from all pipeline tasks and raises an alert if quality_score drops
    below threshold:

    ```python
    def check_pipeline_health(**context):
        ti = context["ti"]
        bronze_rows = ti.xcom_pull(task_ids="bronze", key="bronze_rows")
        quality = ti.xcom_pull(task_ids="silver", key="quality_score")
        if quality is not None and quality < 0.95:
            raise ValueError(f"Quality score {quality} below 95% threshold")
        if bronze_rows == 0:
            print("WARNING: No bronze data ingested")

    monitor = PythonOperator(
        task_id="monitor",
        python_callable=check_pipeline_health,
        trigger_rule="all_done",
    )
    gold >> monitor
    ```

    `trigger_rule="all_done"` means the monitor runs even if upstream
    tasks failed — it should always report the pipeline's health.

