    ## The ShopStream Story

    Meet **ShopStream** — an e-commerce company whose data platform is in
    chaos. Raw events pour in from web clicks, mobile apps, payment
    processors, and inventory systems. Each source has different formats,
    schemas change without notice, and duplicate deliveries are common.

    By the end of this course, you will build the complete pipeline that
    turns this mess into executive dashboards. Every lesson adds a real
    layer. The bronze function from lesson 3 is literally used in lesson
    10's orchestration. Code accumulates.

    This first lesson answers: **why do we need layers at all?**

- Class: text
  Depth: all
  Output: |
    ## The Problem: Raw Data Is Messy

    Consider what ShopStream's raw data looks like:

    - **Web clicks**: CSV files, sometimes with extra columns, sometimes
      missing them. Timestamps in ISO format... or not.
    - **Payments**: JSON from Stripe. Nested structures. Webhook retries
      mean the same payment appears multiple times.
    - **Inventory**: Another JSON format. Product IDs that don't match
      the click stream. Schema changes when the warehouse system upgrades.

    If you transform this data in one big step — cast types, join tables,
    aggregate — what happens when a source format changes? You reprocess
    everything. You lose the ability to trace a bad row back to its
    origin. You cannot fix a silver bug without re-ingesting from scratch.

- Class: text
  Depth: beginner
  Output: |
    ## Bronze, Silver, Gold: A Separation of Concerns

    The **medallion architecture** splits your pipeline into three layers:

    - **Bronze**: Raw ingestion. Preserve everything. Add metadata
      (_ingested_at, _source_file). Deduplicate. No transformations.
    - **Silver**: Clean, typed, validated. Cast columns. Apply quality
      rules. Enrich with lookups. Business-ready records.
    - **Gold**: Aggregations for consumption. KPIs, dashboards, reports.
      Pre-computed for speed.

    Think of it like a restaurant: Bronze is receiving the delivery
    (check the boxes, log what arrived). Silver is prep (wash, chop,
    portion). Gold is plating (the final dish for the customer).

- Class: text
  Depth: intermediate
  Output: |
    ## Why NOT Transform in Bronze

    Two critical reasons to keep bronze dumb:

    **1. Reprocessability** — If your silver logic has a bug, you fix it
    and re-run. Bronze is already correct. You never re-ingest from the
    source. Reprocessing from bronze is fast; re-fetching from APIs or
    re-reading terabytes of raw files is slow and sometimes impossible.

    **2. Auditability** — Every row in silver and gold can be traced back
    to bronze. You can answer: "Where did this bad value come from?"
    Bronze is your source of truth. Transform it and you lose the trail.

