- Class: text
  Depth: advanced
  Output: |
    ## Schema Evolution and the Medallion

    When a source adds a column, medallion layers handle it differently:

    - **Bronze**: New column appears as string (schema-on-read). No code
      change if you use a flexible schema. Existing rows get null for the
      new column. Reprocessability: you can backfill by re-reading.
    - **Silver**: You explicitly add the new column to your cast_columns
      logic. Or you use schema evolution in your table format (Delta,
      Iceberg) to add columns without rewriting.
    - **Gold**: Aggregations may or may not need the new column. You
      decide. No raw re-ingestion required.

    Single-step ETL: new column = schema change = job fails until you
    update and redeploy. Medallion: bronze absorbs it; silver and gold
    evolve independently.

