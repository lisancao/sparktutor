  Output: |
    ## Summary

    You now understand why the medallion architecture exists:

    - **Raw data is messy** — formats change, duplicates arrive, schemas evolve
    - **Bronze preserves** — ingest, metadata, dedup. No transforms.
    - **Silver cleans** — type casting, validation, enrichment
    - **Gold aggregates** — KPIs, dashboards, business metrics
    - **Reprocessability and auditability** — fix bugs without re-ingesting

    In the next lesson, you will build the **Pipeline** class — a
    declarative framework that wires these layers together with
    dependency detection and topological execution order.
