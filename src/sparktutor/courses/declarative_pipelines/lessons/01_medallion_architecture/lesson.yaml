    ## Single-Step ETL vs Medallion: What Breaks

    **Single-step approach**: Read CSV → cast types → join → aggregate →
    write. One job. Simple.

    What breaks:
    - Source adds a new column. Your schema breaks. Job fails.
    - You find a bug in the aggregation. You must re-read the raw CSV
      and re-run everything. Raw files may be gone or overwritten.
    - A customer asks: "Why does this order show wrong revenue?" You
      cannot trace it. The transformation is lost.

    **Medallion approach**: Bronze preserves raw. Silver cleans. Gold
    aggregates. Each layer is independently fixable and auditable.

