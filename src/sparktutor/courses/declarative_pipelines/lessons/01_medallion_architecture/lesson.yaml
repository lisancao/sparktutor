    ## Active Recall: Revenue Aggregation

    If a price column contains the string "pending" and you aggregate
    revenue with `f.sum("price")` without type casting, what happens?

    Spark will either fail (if price is string, sum is undefined) or
    produce wrong results. The fix: cast in silver, handle "pending"
    explicitly (null, 0, or quarantine), then aggregate in gold.

    This is failure-driven learning: we will show the failure first,
    then teach the fix.

