    ## Handling Schema Evolution

    When a source adds a column:
    - **Bronze**: Add the column to your schema as StringType (or
      optional). Existing files won't have it — they get null. New files
      will have it. No reprocessing of old data required.
    - **Schema evolution in table formats**: Delta and Iceberg support
      ALTER TABLE ADD COLUMN. You can add columns without rewriting.

    When a column is renamed: Trickier. You may need a mapping layer
    (old_name -> new_name) for backward compatibility during transition.

