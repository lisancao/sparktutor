  Output: |
    ## Union-Compatible Ingestion

    To combine clicks, payments, and inventory in silver, we need
    union-compatible schemas. Options:

    1. **Separate bronze tables** — bronze_clicks, bronze_payments,
       bronze_inventory. Silver joins them. No union needed.
    2. **Unified bronze** — One bronze table with a _source column.
       Each source's columns map to a common schema. Missing columns
       get null. Use unionByName(allowMissingColumns=True) in Spark 3.1+.

    For ShopStream, we keep separate bronze tables. Silver will join
    them on business keys (user_id, product_id, etc.).

- Class: cmd_question
  Depth: all
  Output: |
    Write a function that reads JSON from path with a schema that has
    payment_id, amount (DoubleType), customer_id, created_at (StringType).
    Add _ingested_at and _source_file. Deduplicate by payment_id.
  CorrectAnswer: |
    from pyspark.sql.types import StructType, StructField, StringType, DoubleType

    schema = StructType([
        StructField("payment_id", StringType()),
        StructField("amount", DoubleType()),
        StructField("customer_id", StringType()),
        StructField("created_at", StringType()),
    ])
    df = (spark.read.json(path, schema=schema)
        .withColumn("_ingested_at", f.current_timestamp())
        .withColumn("_source_file", f.input_file_name())
        .dropDuplicates(["payment_id"]))
  Hint: "spark.read.json(path, schema=schema). For JSON, schema can have typed columns. Add metadata, dedup."

- Class: text
  Depth: advanced
  Output: |
    ## Nested JSON: Flatten or Preserve?

    Payments JSON: `{"payment_id": "p1", "amount": 99.99, "customer": {"id": "c1", "email": "x@y.com"}}`

    **Flatten at bronze**: customer_id, customer_email. Simpler for
    silver. Loses structure.

    **Preserve at bronze**: customer as StructType. Silver flattens.
    Keeps raw structure for debugging.

    For this course we flatten at read using a schema that has
    customer_id, customer_email as top-level columns. The JSON reader
    can use dot notation or we pre-process. Simpler: use a schema that
    matches the flattened structure and let Spark's from_json handle it.

