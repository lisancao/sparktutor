    ## Summary

    You now ingest multiple ShopStream sources:

    - **Clicks** — CSV with schema-on-read
    - **Payments** — JSON with schema
    - **Inventory** — JSON with schema
    - **Schema registry** — centralized definitions
    - **Metadata and dedup** — same pattern for all

    These bronze tables feed into silver in the next lessons. Silver will
    cast types, validate, and join them. First: **type casting and
    validation** in lesson 5.
