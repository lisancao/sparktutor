  Output: |
    ## ShopStream's Multiple Data Sources

    ShopStream receives data from three systems:

    1. **Clicks** — CSV from web analytics. Columns: event_id, user_id,
       product_id, event_type, timestamp.
    2. **Payments** — JSON from Stripe webhooks. Nested: payment_id,
       amount, currency, customer_id, created_at.
    3. **Inventory** — JSON from warehouse. Nested: sku, quantity,
       warehouse_id, updated_at. Different structure than payments.

    Each source has different formats, schemas, and evolution patterns.
    This lesson teaches how to ingest all three into bronze tables while
    handling schema differences and preparing for union-compatible silver.

- Class: text
  Depth: beginner
  Output: |
    ## Different Sources, Different Formats

    **CSV**: Flat, header row, comma-separated. Use spark.read.csv with
    schema. Good for clicks, exports, logs.

    **JSON**: Semi-structured. spark.read.json infers schema from data,
    or you provide schema. Handles nested objects. Payments and inventory
    arrive as JSON.

    **Nested JSON**: Use schema with StructType containing nested
    StructTypes. Or use inferSchema and let Spark figure it out (risky for
    production — schema can change between files).

- Class: text
  Depth: intermediate
  Output: |
    ## Schema Registry Pattern

    Centralize schema definitions in one place:

    ```python
    SCHEMAS = {
        "clicks": StructType([...]),
        "payments": StructType([...]),
        "inventory": StructType([...]),
    }
    ```

    Benefits: single source of truth, easy to evolve, reuse across
    ingestion functions. When a source adds a column, update the schema
    once. Bronze ingestion functions reference SCHEMAS["source_name"].

