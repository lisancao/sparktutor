    ## Designing Gold Around Business Questions

    Silver has clean, enriched records. Gold answers business questions:
    "What was daily revenue by product category?" "What's the hourly
    conversion rate?" "Which products sell best?"

    Gold tables are **pre-aggregated** for dashboards. Instead of
    querying silver with complex groupBy every time, we materialize the
    result. Dashboards read gold. Fast. Simple.

- Class: text
  Depth: beginner
  Output: |
    ## groupBy + agg Patterns

    ```python
    daily_revenue = (orders
        .groupBy(f.to_date("created_at").alias("date"), "category")
        .agg(f.sum("amount").alias("revenue"), f.count("*").alias("order_count"))
        .orderBy("date", f.col("revenue").desc()))
    ```

    Key: choose the right grouping columns (date, category, product).
    Aggregations: sum, count, avg, min, max. Alias for clarity.

