    ## Conversion Rate as a KPI

    Conversion = (purchases / sessions) or (orders / clicks). Requires
    joining or aggregating different event types.

    ```python
    clicks_per_hour = (clicks.filter(f.col("event_type") == "click")
        .groupBy(f.date_trunc("hour", "timestamp").alias("hour"))
        .agg(f.count("*").alias("clicks")))
    orders_per_hour = orders.groupBy(...).agg(f.count("*").alias("orders"))
    conversion = clicks_per_hour.join(orders_per_hour, "hour").withColumn(
        "conversion_rate", f.col("orders") / f.col("clicks"))
    ```

