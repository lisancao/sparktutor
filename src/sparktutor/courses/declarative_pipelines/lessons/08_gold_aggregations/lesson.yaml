    ## Pre-Aggregated vs Ad-Hoc

    **Pre-aggregate** when:
    - The query is run often (dashboard refresh)
    - The aggregation is expensive (large silver table)
    - You need consistent metrics (same logic for everyone)

    **Ad-hoc** when:
    - One-off analysis
    - Exploratory queries
    - Metrics change frequently

    ShopStream: daily revenue by category — pre-aggregate. Ad-hoc:
    "Revenue by zip code last Tuesday" — query silver or a more granular
    gold table.

