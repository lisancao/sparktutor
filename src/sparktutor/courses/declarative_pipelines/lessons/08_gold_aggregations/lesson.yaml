    ## Granularity Trade-offs

    Daily revenue by category: 365 * 10 = 3,650 rows per year. Small.
    Hourly revenue by product: 8760 * 1000 = 8.7M rows. Larger.
    Event-level: don't aggregate — that's silver.

    Choose granularity based on: dashboard needs, storage, refresh time.
    Can have multiple gold tables at different granularities for
    different use cases.

