    ## Email and Pattern Validation

    ```python
    df.withColumn("_email_valid", f.col("email").rlike(r"^[^@]+@[^@]+\.[^@]+$"))
    ```

    rlike uses regex. For complex patterns, use regexp_extract or
    regexp_replace. Consider: very strict validation may reject valid
    edge cases. Balance strictness with business needs.

