    Implement a DataQualityChecker class and use it for orders:

    1. DataQualityChecker(rules) — rules is list of (name, condition)
    2. check(df) — returns (valid_df, invalid_df). Invalid rows get
       _quarantine_reason = first failed rule name, _quarantine_at = now
    3. For orders: amount > 0, customer_id not null, order_id not null

    The test creates order data with one invalid row (amount=-5). Verify
    valid has 2 rows, invalid has 1 with _quarantine_reason indicating
    amount_positive or similar.
