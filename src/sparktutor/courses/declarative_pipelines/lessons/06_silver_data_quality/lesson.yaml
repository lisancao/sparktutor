    ## Building a DataQualityChecker Class

    ```python
    class DataQualityChecker:
        def __init__(self, rules):
            self.rules = rules  # list of (name, condition)

        def check(self, df):
            passes = f.lit(True)
            for name, cond in self.rules:
                passes = passes & cond
            valid = df.filter(passes)
            invalid = df.filter(~passes)
            return valid, invalid
    ```

    rules = [
        ("amount_positive", f.col("amount") > 0),
        ("customer_not_null", f.col("customer_id").isNotNull()),
    ]

    Extend: record which rule failed for each invalid row. Use
    when/otherwise to set _failed_rule column.

