    ## Beyond Type Casting: Business Rules

    Silver has cast types. But what about: price must be > 0? Email must
    match a pattern? Timestamp must be within a valid range? User_id must
    not be empty?

    These are **data quality rules** — expectations that go beyond
    "is it a valid number." ShopStream's orders: amount > 0, customer_id
    not null, created_at not in the future. Violations go to quarantine.

- Class: text
  Depth: beginner
  Output: |
    ## Row-Level Validation

    Each row is checked against rules. Pass → valid. Fail → quarantine.

    ```python
    valid = df.filter((f.col("amount") > 0) & (f.col("customer_id").isNotNull()))
    invalid = df.filter(~((f.col("amount") > 0) & (f.col("customer_id").isNotNull())))
    ```

    For multiple rules, build a boolean column:
    ```python
    passes = (f.col("amount") > 0) & (f.col("customer_id").isNotNull()) & ...
    valid = df.filter(passes)
    invalid = df.filter(~passes)
    ```

