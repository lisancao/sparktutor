    ## Summary

    Data quality rules in silver:

    - **Row-level** — filter by conditions, split valid/invalid
    - **Quarantine** — route failures with _quarantine_reason
    - **DataQualityChecker** — reusable rule engine
    - **Column-level** — null rate, distinct count for monitoring

    In the next lesson, you will **enrich** silver data with joins —
    product names, user segments, geo data — to create rich records for
