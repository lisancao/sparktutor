    ## Column-Level Checks

    Not just per-row. Column-level: null rate, distinct count, min/max.

    - **Null rate**: `f.sum(f.when(f.col("x").isNull(), 1).otherwise(0)) / count`
    - **Distinct count**: `df.select("x").distinct().count()`
    - **Statistical bounds**: `df.agg(f.min("price"), f.max("price")).collect()`

    Use these for monitoring: "If null rate > 5%, alert." Or for
    validation: "If distinct user_ids < expected, something is wrong."

