    Write a filter that keeps rows where: amount > 0, customer_id is not
    null, and created_at is not in the future (<= current_timestamp).
  CorrectAnswer: |
    from pyspark.sql import functions as f

    valid = df.filter(
        (f.col("amount") > 0) &
        (f.col("customer_id").isNotNull()) &
        (f.col("created_at") <= f.current_timestamp())
    )
  Hint: "Combine conditions with &. Use f.current_timestamp() for 'now'."

