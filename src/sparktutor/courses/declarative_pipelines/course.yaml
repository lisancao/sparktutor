course:
  id: declarative_pipelines
  title: "Declarative Pipelines: Building Production Data Platforms"
  description: "Build a production-grade e-commerce data platform from raw events to executive dashboards using the medallion architecture"
  version: "1.0.0"
  requires_lakehouse: false
  prerequisites:
    - "Python 3.10+"
    - "pip install pyspark"
    - "Completed Spark 3 Fundamentals course (recommended)"
  lessons:
    - 01_medallion_architecture
    - 02_pipeline_as_code
    - 03_bronze_raw_ingestion
    - 04_bronze_multi_source
    - 05_silver_type_casting
    - 06_silver_data_quality
    - 07_silver_enrichment_joins
    - 08_gold_aggregations
    - 09_gold_window_functions
    - 10_pipeline_orchestration
    - 11_testing_idempotency
    - 12_deploying_with_airflow
    - 13_capstone
