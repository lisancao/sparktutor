course:
  id: learning_spark
  title: "Learning Spark 4.2: From Fundamentals to Production"
  description: "Apache Spark 4.2 from the ground up: DataFrames, SQL (pipe syntax, QUALIFY, scripting), VARIANT, streaming with transformWithState and Real-Time Mode, optimization, joins, lakehouses and CDC, MLlib, and Spark Connect"
  version: "2.0.0"
  requires_lakehouse: false
  prerequisites:
    - "Python 3.10+"
    - "Java 17, 21, or 25 (Spark 4.2 no longer runs on Java 8 or 11)"
    - "pip install \"pyspark[connect]==4.2.0\""
  lessons:
    - 01_getting_started
    - 02_dataframes_schemas
    - 03_data_sources
    - 04_external_sources_hof
    - 05_spark_sql_deep_dive
    - 06_optimization_tuning
    - 07_join_strategies
    - 08_structured_streaming
    - 09_data_lakes
    - 10_mllib
    - 11_spark_connect
