    ## Which Package?

    | Package | What you get | Use it when |
    |---------|--------------|-------------|
    | `pip install "pyspark[connect]==4.2.0"` | Full PySpark (with the JVM jars) plus the Connect client dependencies (grpcio, pandas, pyarrow, zstandard) | You want to run both Classic and Connect, or start local Connect servers |
    | `pip install "pyspark-client==4.2.0"` | Only the pure-Python Connect client, no jars | Your code only ever talks to a remote server |

    Keep the client version aligned with the server's Spark version. The
    protocol is designed for compatibility, but new APIs (like the 4.2
    additions below) need a server that implements them.

- Class: text
  Depth: all
  Output: |
    ## What Is Different Under Connect

    The DataFrame, Column, SQL, Catalog, streaming, and `pyspark.ml` APIs
    work the same. What is gone is everything that reaches into the driver
    JVM or the cluster's execution layer:

    | Classic-only | Under Connect |
    |--------------|---------------|
    | `spark.sparkContext`, `sc.setLogLevel` | `JVM_ATTRIBUTE_NOT_SUPPORTED` |
    | `df.rdd`, `rdd.map`, `rdd.zipWithIndex` | `NOT_IMPLEMENTED`; use DataFrame APIs |
    | `df._jdf`, `spark._jvm` | `JVM_ATTRIBUTE_NOT_SUPPORTED` |
    | `spark.newSession()` | Not supported; each client session is already isolated |

    Two behaviours change too:

    - **Errors arrive later.** The client does not analyze plans, so a
      misspelled column surfaces when the plan is analyzed (on an action,
      or when you ask for `df.schema`), not when you write `df.typo`. Since
      4.1/4.2 even `df["typo"]` and `df.typo` skip eager validation.
    - **Configuration is per session.** `spark.conf.set` changes SQL
      configs for your session only; cluster-level settings cannot be
      changed from a client.

