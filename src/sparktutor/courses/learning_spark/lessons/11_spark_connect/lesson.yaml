    ## Writing Code That Runs in Both Modes

    A few habits make a codebase portable between Classic and Connect:

    - Never use `_jdf`, `_jvm`, `sparkContext`, or RDDs in library code.
    - Capture plans by redirecting stdout around `df.explain()`; it prints
      in both modes.
    - Count partitions with `df.select(f.spark_partition_id()).distinct()`
      (non-empty partitions) instead of `df.rdd.getNumPartitions()`.
    - Use `pyspark.sql.utils.is_remote()` when you truly need to branch.
    - Run your tests in both modes: the same suite with `.master("local[2]")`
      and with `.config("spark.api.mode", "connect")` catches accidental JVM
      access early.

    The solutions in Lessons 5, 6, and 7 already follow these rules, which
    is why they use a `plan_text()` helper instead of the query execution
    object.

- Class: cmd_question
  Depth: advanced
  Output: |
    Write a function `plan_text(df)` that returns the text `df.explain()`
    prints, without using `df._jdf`, so it works under Spark Connect.
  CorrectAnswer: |
    import contextlib
    import io

    def plan_text(df):
        buf = io.StringIO()
        with contextlib.redirect_stdout(buf):
            df.explain()
        return buf.getvalue()
  Hint: "explain() prints in both modes. contextlib.redirect_stdout with an io.StringIO captures what it prints."

