    ## Summary

    In this lesson you learned:

    - **Architecture**: the client builds unresolved plans, sends them over
      gRPC, and gets Arrow batches back; the server does all analysis and
      execution
    - **Connecting**: `remote("sc://host:15002")`, `SPARK_REMOTE`, or
      `spark.api.mode=connect`; `remote("local[*]")` for tests
    - **Packages**: `pyspark[connect]` for both modes, `pyspark-client` for
      a pure client
    - **Gone under Connect**: `sparkContext`, RDDs, `_jdf`; errors surface
      at analysis time; configs are per session
    - **4.2 additions**: `zipWithIndex`, `toJSON`, DataFrame input to
      `read.json/csv/xml`, GetStatus, release-on-exit, Connect tab in the
      History Server
    - **Remote execution**: UDFs, `foreachBatch`, listeners, and ML models
      all live on the server
    - **Portability**: avoid JVM handles, capture plans via stdout, test in
      both modes

    That completes Learning Spark for Spark 4.2. The Spark Declarative
    Pipelines course builds on all of it, and its pipelines run over Spark
    Connect too.
