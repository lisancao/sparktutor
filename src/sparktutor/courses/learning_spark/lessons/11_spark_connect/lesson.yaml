    ## Spark 4.2 Closes More Gaps

    Spark 4.2 continues adding DataFrame equivalents for things people used
    to drop to RDDs for (SPARK-55227), plus operational features:

    - `DataFrame.zipWithIndex(indexColName="index")` appends consecutive
      0-based indices (SPARK-55229).
    - `DataFrame.toJSON()` works on the Python Connect client, returning a
      DataFrame of JSON strings rather than an RDD (SPARK-55090).
    - `spark.read.json()`, `.csv()`, and `.xml()` accept a DataFrame of
      strings as input on Connect, the old `spark.read.json(rdd)` pattern
      (SPARK-56253 to SPARK-56255).
    - `head()`, `take()`, and `tail()` avoid full table scans
      (SPARK-55887).
    - A **GetStatus** RPC reports the status of running operations
      (SPARK-55606, SPARK-55691).
    - Setting `SPARK_CONNECT_RELEASE_SESSION_ON_EXIT=true` releases the
      server-side session when the client process exits (SPARK-55326).
    - The **Connect** tab in the Spark UI is available in the History
      Server (SPARK-57601).

    Session methods that started on Connect (3.5) and also work in Classic
    since 4.0: `spark.addArtifacts("deps.zip", pyfile=True)` ships Python
    files to the server, `spark.addTag("nightly")` /
    `spark.interruptTag("nightly")` cancel groups of running operations, and
    `spark.interruptAll()` cancels everything the session started.

