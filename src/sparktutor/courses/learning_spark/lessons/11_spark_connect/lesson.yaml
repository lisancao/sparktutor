    ## Connecting

    Start a server that ships with Spark:

    ```bash
    ./sbin/start-connect-server.sh
    ```

    Then point a client at it, in any of three ways:

    ```python
    from pyspark.sql import SparkSession

    # 1. Explicit URL in code
    spark = SparkSession.builder.remote("sc://localhost:15002").getOrCreate()

    # 2. Environment variable, no code change at all
    #    export SPARK_REMOTE="sc://spark.example.com:443/;use_ssl=true;token=..."
    spark = SparkSession.builder.getOrCreate()

    # 3. API mode: start a local Connect server and return a Connect session
    spark = (SparkSession.builder
        .master("local[*]")
        .config("spark.api.mode", "connect")
        .getOrCreate())
    ```

    For tests, `SparkSession.builder.remote("local[*]")` starts a local
    Connect server inside the process. `remote()` only accepts `local*`
    values for that purpose; `spark.api.mode=connect` also works with
    cluster masters such as `spark://` and is the option that works under
    `spark-submit`, which already sets a master.

    The connection string takes parameters after `/;`: `token` (bearer
    auth), `use_ssl`, `user_id`, `user_agent`, and `session_id`.

