    ## Exercise: A Connect-Safe Report

    Implement `connect_report(spark)`. The harness starts a **local Spark
    Connect server** with `spark.api.mode=connect`, so any JVM-only API you
    reach for will fail.

    1. Record the session mode with `is_remote()` (`"connect"` or
       `"classic"`)
    2. Parse `RAW_ORDERS`, a DataFrame of JSON strings, with
       `spark.read.schema(ORDER_SCHEMA).json(raw_df)`
    3. Aggregate revenue (`sum(amount)`) and order count per region,
       highest revenue first
    4. Number the rows with `zipWithIndex("rank")` (Spark 4.2)
    5. Add a `tier` column with a Python UDF: `"gold"` when revenue is at
       least 150, otherwise `"standard"`
    6. Capture the plan with the provided `plan_text()` helper
    7. Convert the report to JSON strings with `toJSON()`
    8. Return everything in a dict
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "zipWithIndex numbers rows in the DataFrame's current order, so apply it after orderBy. The UDF can be @f.udf('string') on a plain Python function."

