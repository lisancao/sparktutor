    ## UDFs, Streaming, and ML When the Driver Is Remote

    **Python UDFs** are serialized with cloudpickle on the client and run in
    Python workers on the server's executors. The server therefore needs a
    compatible Python and every library your function imports; ship pure
    Python modules with `spark.addArtifacts(..., pyfile=True)`. In 4.2 these
    UDFs are Arrow-optimized by default in both modes.

    **Large local data**: `spark.createDataFrame(local_rows)` uploads the
    rows inside the plan. Big local relations are cached on the server in
    chunks and capped by `spark.sql.session.localRelationSizeLimit`; 4.2
    also enforces a client-side limit (SPARK-55047). Load big inputs from
    storage instead of from client memory.

    **Streaming**: `readStream`/`writeStream` work. Functions you pass to
    `foreachBatch` and `StreamingQueryListener` implementations run in a
    Python process on the server, not in your client, so they cannot touch
    client-side state.

    **MLlib**: `pyspark.ml` runs on Connect since 4.0. `fit()` trains on the
    server and returns a handle to a model kept in a per-session cache
    (Lesson 10).

