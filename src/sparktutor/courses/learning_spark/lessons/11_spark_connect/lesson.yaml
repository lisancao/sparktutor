    ## What You'll Learn

    Every lesson so far ran Spark in **Classic** mode: your Python process
    and the Spark driver are joined at the hip through Py4J. Spark 4.x makes
    a second architecture first-class: **Spark Connect**, where your program
    is a thin client that talks to a remote Spark server.

    By the end of this lesson you will be able to:

    - Explain how Spark Connect works and why it exists
    - Connect to a server with `remote()`, `SPARK_REMOTE`, or
      `spark.api.mode`, and start a local server for testing
    - Pick the right package (`pyspark[connect]` or `pyspark-client`)
    - Know which APIs do not exist under Connect, and their replacements,
      including the ones Spark 4.2 added
    - Reason about UDFs, streaming, and MLlib when the driver is remote
    - Write code that runs unchanged in both modes

- Class: text
  Depth: beginner
  Output: |
    In Classic mode your program is a cook standing in the kitchen: it can
    reach every pot directly, but if it trips, the whole kitchen stops.

    With Spark Connect your program is a customer in the dining room. It
    writes an order (a query plan), the waiter (gRPC) carries it to the
    kitchen (the Spark server), and the dish (Arrow-encoded results) comes
    back. The customer cannot touch the pots, but it also cannot knock them
    over, and the kitchen can serve many customers at once.

- Class: text
  Depth: all
  Output: |
    ## How Spark Connect Works

    The client library builds the same DataFrame and SQL plans you have been
    writing, but as **unresolved logical plans** encoded with protocol
    buffers. Nothing is analyzed on the client.

    1. Your code builds a plan (`spark.read...`, `df.filter(...)`).
    2. On an action (`collect`, `show`, `write`), the client sends the plan
       to the server over **gRPC** (default port **15002**).
    3. The server analyzes, optimizes, and executes it with the normal
       Catalyst and scheduler machinery, exactly as in Classic mode.
    4. Results stream back as **Apache Arrow** record batches.

    Why it matters:
    - **Stability**: a client that runs out of memory takes down only
      itself, not the driver other users share.
    - **Upgradability**: the server can be upgraded independently of
      client applications.
    - **Reach**: a client is a small library you can embed in an IDE, a
      notebook, a web service, or another language.

    **Docs:** [Spark Connect Overview](https://spark.apache.org/docs/4.2.0/spark-connect-overview.html) |
    [Application Development with Spark Connect](https://spark.apache.org/docs/4.2.0/app-dev-spark-connect.html)

