    ## Summary

    In this lesson you learned:

    - **Complex types** — `ArrayType`, `MapType`, and nested `StructType`
      model real-world nested data
    - **explode / posexplode** — flatten arrays into rows for per-element
      analysis
    - **collect_list / collect_set** — reassemble rows into arrays during
      aggregation
    - **Higher-order functions** — `transform`, `filter`, `exists`, and
      `aggregate` operate on arrays without creating extra rows
    - **Map operations** — `element_at`, `map_keys`, `map_values`, and
      `create_map`

    You can now handle any data shape Spark throws at you. In the next
    lesson, you will dive into Spark SQL — the query engine that powers
    both the DataFrame API and SQL queries — and learn to read execution
    plans and write user-defined functions.
