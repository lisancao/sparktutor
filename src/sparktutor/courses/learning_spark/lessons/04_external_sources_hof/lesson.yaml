    ## Collect：行转回数组

    explode 的反向操作 —— `collect_list()` 和 `collect_set()`
    在聚合时将行重新收集为数组：

    ```python
    # 将每个用户的所有标签收集到一个数组中
    df.groupBy("user_id").agg(
        f.collect_list("tag").alias("all_tags"),
        f.collect_set("tag").alias("unique_tags")
    )
    ```

    `collect_list` 保留重复项和顺序。`collect_set` 去除重复项
    （顺序不保证）。

