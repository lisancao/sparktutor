    Think of complex types in terms of everyday data:

    - An **array** is like a shopping list — ordered items:
      `["milk", "eggs", "bread"]`
    - A **map** is like a settings page — keys and values:
      `{"theme": "dark", "language": "en"}`
    - A **nested struct** is like a mailing label — a group of related
      fields bundled together: `{city: "SF", state: "CA", zip: "94102"}`

    Spark can read, filter, and transform all of these without you having
    to flatten them first.

