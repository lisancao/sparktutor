    ## Collect: Rows Back to Arrays

    The reverse of explode — `collect_list()` and `collect_set()` gather
    rows back into arrays during aggregation:

    ```python
    # Collect all tags per user into an array
    df.groupBy("user_id").agg(
        f.collect_list("tag").alias("all_tags"),
        f.collect_set("tag").alias("unique_tags")
    )
    ```

    `collect_list` preserves duplicates and order. `collect_set` removes
    duplicates (order is not guaranteed).

