    ## Aggregate：折叠数组

    `aggregate()` 将数组折叠为单个值，类似 Python 的
    `functools.reduce()`。它接受四个参数：

    ```python
    f.aggregate(
        "column",          # 数组列
        f.lit(0),          # 初始累加器值（零）
        lambda acc, x: acc + x,   # 合并函数
        lambda acc: acc           # 完成函数（可选）
    )
    ```

    **示例 —— 对数组中所有元素求和：**
    ```python
    df.select(f.aggregate("scores", f.lit(0), lambda acc, x: acc + x).alias("total"))
    ```

    **示例 —— 用分隔符连接字符串：**
    ```python
    df.select(f.aggregate(
        "words",
        f.lit(""),
        lambda acc, x: f.concat(acc, f.lit(" "), x),
        lambda acc: f.trim(acc)
    ).alias("sentence"))
    ```

