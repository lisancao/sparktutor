    ## 小结

    本课你学到了：

    - **复杂类型** —— `ArrayType`、`MapType` 和嵌套 `StructType`
      建模现实中的嵌套数据
    - **explode / posexplode** —— 将数组扁平化为多行以进行逐元素分析
    - **collect_list / collect_set** —— 在聚合时将行重新组装为数组
    - **高阶函数** —— `transform`、`filter`、`exists` 和
      `aggregate` 操作数组而不创建额外行
    - **映射操作** —— `element_at`、`map_keys`、`map_values` 和
      `create_map`

    你现在可以处理 Spark 抛给你的任何数据形状。在下一课中，你将深入
    Spark SQL —— 为 DataFrame API 和 SQL 查询提供动力的查询引擎 ——
    学习阅读执行计划和编写用户自定义函数。
