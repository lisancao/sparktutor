    ## Working with Maps

    Map columns store key-value pairs. Access values with bracket notation
    or `element_at()`:

    ```python
    # Access a specific key
    df.select(df["preferences"]["theme"])      # bracket notation
    df.select(f.element_at("preferences", "theme"))  # function

    # Get all keys or values
    df.select(f.map_keys("preferences"))
    df.select(f.map_values("preferences"))

    # Explode a map into key-value rows
    df.select(f.explode("preferences").alias("key", "value"))
    ```

    You can also create maps:
    ```python
    df.withColumn("meta", f.create_map(
        f.lit("source"), f.col("source_name"),
        f.lit("version"), f.col("version")
    ))
    ```

