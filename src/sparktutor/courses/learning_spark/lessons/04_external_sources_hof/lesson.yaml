    ## Collect: Rows Back to Arrays

    The reverse of explode: `collect_list()` (alias `array_agg()`) and
    `collect_set()` gather rows back into arrays during aggregation:

    ```python
    # Collect all tags per user into an array
    df.groupBy("user_id").agg(
        f.collect_list("tag").alias("all_tags"),
        f.collect_set("tag").alias("unique_tags")
    )
    ```

    `collect_list` keeps duplicates; `collect_set` removes them. Neither
    guarantees element order after a shuffle; if order matters, collect
    structs and sort them, or use `array_sort`.

    Both skip `NULL` inputs by default. Spark 4.2 makes that explicit in SQL
    and lets you opt out (SPARK-55256, SPARK-55533):

    ```sql
    SELECT array_agg(x) IGNORE NULLS   AS no_nulls,     -- [1, 2]
           collect_list(x) RESPECT NULLS AS with_nulls  -- [1, NULL, 2]
    FROM VALUES (1), (NULL), (2) AS t(x)
    ```

