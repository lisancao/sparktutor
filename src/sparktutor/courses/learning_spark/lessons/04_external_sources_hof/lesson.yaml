    ## Performance: Explode vs. Higher-Order Functions

    `explode()` is convenient but has a cost: it multiplies the number of
    rows, which increases shuffle sizes and memory usage. Exploding a column
    whose arrays average ten elements makes the DataFrame about ten times
    larger.

    Higher-order functions (`transform`, `filter`, `aggregate`, `zip_with`,
    `array_sort` with a comparator) avoid this by operating within each
    row. They are:
    - More memory-efficient (no row multiplication)
    - Faster for large arrays (no shuffle expansion)
    - Easier to reason about (output has same row count as input)

    **When to explode**: you need to join or group by individual array
    elements. **When to use HOFs**: you need to transform, filter, or
    reduce array contents while keeping the row structure intact.

    Two 4.2 aggregate additions remove common explode-then-rank patterns:
    `max_by(x, y, k)` and `min_by(x, y, k)` return the top or bottom `k`
    values of `x` ordered by `y` as an array (SPARK-55322), and
    `listagg(x, ',') WITHIN GROUP (ORDER BY y)` (since 4.0) builds an
    ordered delimited string.

    VARIANT has a cost model of its own: every `variant_get` walks the
    binary encoding, so a field you read in every query is worth promoting
    to a real column once its shape settles.

