    ## Higher-Order Functions

    Exploding an array creates many rows, which is expensive. For
    transformations that should stay within the array, Spark provides
    **higher-order functions** that operate element-by-element:

    **`transform()`** — apply a function to every element (like Python's
    `map()`):
    ```python
    df.select(f.transform("prices", lambda x: x * 1.1).alias("with_tax"))
    ```

    **`filter()`** — keep elements matching a condition:
    ```python
    df.select(f.filter("scores", lambda x: x > 80).alias("passing"))
    ```

    **`exists()`** — true if any element matches:
    ```python
    df.select(f.exists("tags", lambda x: x == "urgent").alias("is_urgent"))
    ```

    These keep your DataFrame structure intact — no explosion of rows.

    **Docs:**
    [transform](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.transform.html) |
    [filter (HOF)](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.filter.html) |
    [exists](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.exists.html) |
    [aggregate](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.aggregate.html) |
    [explode](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.explode.html) |
    [collect_list](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.collect_list.html)

