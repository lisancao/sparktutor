    ## Aggregate: Folding an Array

    `aggregate()` folds an array into a single value, like Python's
    `functools.reduce()`. It takes four arguments:

    ```python
    f.aggregate(
        "column",          # the array column
        f.lit(0),          # initial accumulator value (zero)
        lambda acc, x: acc + x,   # merge function
        lambda acc: acc           # finish function (optional)
    )
    ```

    **Example — sum all elements in an array:**
    ```python
    df.select(f.aggregate("scores", f.lit(0), lambda acc, x: acc + x).alias("total"))
    ```

    **Example — concatenate strings with a separator:**
    ```python
    df.select(f.aggregate(
        "words",
        f.lit(""),
        lambda acc, x: f.concat(acc, f.lit(" "), x),
        lambda acc: f.trim(acc)
    ).alias("sentence"))
    ```

