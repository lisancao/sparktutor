    ## 操作映射

    映射列存储键值对。用方括号语法或 `element_at()` 访问值：

    ```python
    # 访问特定键
    df.select(df["preferences"]["theme"])      # 方括号语法
    df.select(f.element_at("preferences", "theme"))  # 函数

    # 获取所有键或值
    df.select(f.map_keys("preferences"))
    df.select(f.map_values("preferences"))

    # 将映射展开为键值对行
    df.select(f.explode("preferences").alias("key", "value"))
    ```

    你也可以创建映射：
    ```python
    df.withColumn("meta", f.create_map(
        f.lit("source"), f.col("source_name"),
        f.lit("version"), f.col("version")
    ))
    ```

- Class: text
  Depth: advanced
  Output: |
    ## 性能：Explode vs. 高阶函数

    `explode()` 很方便但有代价：它使行数成倍增加，从而增大 shuffle
    大小和内存使用。如果一个数组列平均有 10 个元素，展开它会让你的
    DataFrame 大 10 倍。

    高阶函数（`transform`、`filter`、`aggregate`）通过在每行内部操作
    来避免这个问题。它们：
    - 更节省内存（没有行倍增）
    - 对大数组更快（没有 shuffle 扩展）
    - 更容易推理（输出行数与输入相同）

    **何时用 explode**：你需要按数组中的单个元素做 join 或 group by。
    **何时用 HOF**：你需要在保持行结构不变的同时转换、过滤或归约数组内容。

