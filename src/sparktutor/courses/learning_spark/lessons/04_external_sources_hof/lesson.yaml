    ## Array Access Under ANSI Mode

    ANSI mode (default since 4.0) makes out-of-bounds array access an
    error instead of a silent `NULL`:

    | Expression on a 3-element array | Spark 4.x result |
    |---------------------------------|------------------|
    | `f.col("arr")[10]` (0-based) | error `INVALID_ARRAY_INDEX` |
    | `f.element_at("arr", 10)` (1-based) | error `INVALID_ARRAY_INDEX_IN_ELEMENT_AT` |
    | `f.get("arr", 10)` (0-based) | `NULL` |
    | `f.try_element_at("arr", f.lit(10))` | `NULL` |

    Missing **map** keys still return `NULL` with both `[]` and
    `element_at`. When array length varies by row, reach for `get` or
    `try_element_at` rather than turning ANSI off.

