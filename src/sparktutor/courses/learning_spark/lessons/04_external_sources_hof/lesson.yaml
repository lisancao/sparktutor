    ## 复杂类型 Schema

    Spark 在 `StructType` schema 中支持三种复杂类型：

    **ArrayType** —— 有序元素列表（所有元素同类型）：
    ```python
    StructField("tags", ArrayType(StringType()))
    ```

    **MapType** —— 键值对：
    ```python
    StructField("preferences", MapType(StringType(), StringType()))
    ```

    **嵌套 StructType** —— 结构体中的结构体：
    ```python
    StructField("address", StructType([
        StructField("city", StringType()),
        StructField("state", StringType()),
        StructField("zip", StringType()),
    ]))
    ```

    你用点号语法访问嵌套字段：`col("address.city")`。

- Class: text
  Depth: beginner
  Output: |
    用日常数据来理解复杂类型：

    - **数组（array）** 就像购物清单 —— 有序的条目：
      `["milk", "eggs", "bread"]`
    - **映射（map）** 就像设置页面 —— 键和值：
      `{"theme": "dark", "language": "en"}`
    - **嵌套结构体（nested struct）** 就像邮寄标签 —— 一组相关字段
      捆绑在一起：`{city: "SF", state: "CA", zip: "94102"}`

    Spark 可以读取、过滤和转换所有这些，而不需要你先将它们扁平化。

