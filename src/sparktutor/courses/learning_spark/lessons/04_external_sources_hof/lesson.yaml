    ## Summary

    In this lesson you learned:

    - **Complex types**: `ArrayType`, `MapType`, and nested `StructType`
      model real-world nested data
    - **explode / posexplode**: flatten arrays into rows for per-element
      analysis
    - **collect_list / collect_set**: reassemble rows into arrays; 4.2 adds
      `IGNORE NULLS` / `RESPECT NULLS`
    - **Higher-order functions**: `transform`, `filter`, `exists`,
      `forall`, and `aggregate` operate on arrays without creating extra rows
    - **Map operations**: `element_at`, `map_keys`, `map_values`,
      `map_filter`, `transform_values`, and `create_map`
    - **ANSI array access**: out-of-bounds indexes raise; `get` and
      `try_element_at` return `NULL`
    - **VARIANT**: `parse_json`, `variant_get`, `try_variant_get`, and the
      `:` path syntax for JSON whose shape varies

    In the next lesson, you will dive into Spark SQL, the query engine
    that powers both the DataFrame API and SQL queries, along with the SQL
    syntax Spark 4.x added and how Python UDFs run in 4.2.
