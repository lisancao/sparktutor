    ## 你将学到什么

    现实世界的数据很少是扁平的。来自 API 的 JSON 包含嵌套对象和数组。
    事件日志携带标签列表。用户画像有偏好的映射。Spark 原生处理所有这些。

    在上一课中，你读取了扁平的 CSV 和 Parquet 文件。现在你将学习处理
    真实数据中出现的**复杂类型**：

    - 数组、映射和嵌套结构体
    - 用 `explode` 将数组展开为多行
    - **高阶函数**（`transform`、`filter`、`exists`、`aggregate`），
      它们*不*展开数组就能操作数组
    - 用 `collect_list` 和 `collect_set` 将行重新组装为数组

