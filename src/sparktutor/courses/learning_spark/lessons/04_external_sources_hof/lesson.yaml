    ## Complex Type Schemas

    Spark supports three complex types within `StructType` schemas:

    **ArrayType**: an ordered list of elements (all same type):
    ```python
    StructField("tags", ArrayType(StringType()))
    ```

    **MapType**: key-value pairs:
    ```python
    StructField("preferences", MapType(StringType(), StringType()))
    ```

    **Nested StructType**: a struct within a struct:
    ```python
    StructField("address", StructType([
        StructField("city", StringType()),
        StructField("state", StringType()),
        StructField("zip", StringType()),
    ]))
    ```

    You access nested fields with dot notation: `col("address.city")`.
    In DDL form the same types read `ARRAY<STRING>`,
    `MAP<STRING, STRING>`, and `STRUCT<city: STRING, state: STRING>`.

- Class: text
