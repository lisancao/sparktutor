    ## Explode: Arrays to Rows

    `explode()` turns each element of an array into its own row. This is a
    one-to-many operation:

    ```python
    from pyspark.sql import functions as f

    # Before: id=1, tags=["spark", "python", "data"]
    # After:  three rows — (1, "spark"), (1, "python"), (1, "data")

    df.select("id", f.explode("tags").alias("tag"))
    ```

    `posexplode()` also returns the position index:
    ```python
    df.select("id", f.posexplode("tags").alias("pos", "tag"))
    # (1, 0, "spark"), (1, 1, "python"), (1, 2, "data")
    ```

    Use explode when you need to analyze individual array elements as rows.

