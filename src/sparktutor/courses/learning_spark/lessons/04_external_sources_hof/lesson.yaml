    ## What You'll Learn

    Real-world data is rarely flat. JSON from APIs contains nested objects
    and arrays. Event logs carry lists of tags. User profiles have maps of
    preferences. Spark handles all of this natively.

    In the previous lesson you read flat CSV and Parquet files. Now you
    will learn to work with the **complex types** that appear in real data:

    - Arrays, maps, and nested structs
    - `explode` to flatten arrays into rows
    - Higher-order functions (`transform`, `filter`, `exists`, `aggregate`)
      that operate on arrays *without* exploding them
    - `collect_list` and `collect_set` to reassemble arrays from rows

