    ## Explode：数组转多行

    `explode()` 将数组的每个元素变成自己的一行。这是一对多操作：

    ```python
    from pyspark.sql import functions as f

    # 之前：id=1, tags=["spark", "python", "data"]
    # 之后： 三行 —— (1, "spark"), (1, "python"), (1, "data")

    df.select("id", f.explode("tags").alias("tag"))
    ```

    `posexplode()` 还会返回位置索引：
    ```python
    df.select("id", f.posexplode("tags").alias("pos", "tag"))
    # (1, 0, "spark"), (1, 1, "python"), (1, 2, "data")
    ```

    当你需要将数组元素逐行分析时，使用 explode。

