    ## VARIANT: JSON Without a Fixed Schema

    Structs need you to know the shape up front. When the shape varies from
    record to record (third-party webhooks, event payloads, config blobs),
    Spark 4.0's `VARIANT` type stores the parsed document in a compact
    binary form and lets each query pull out what it needs:

    ```python
    events = raw.withColumn("payload", f.parse_json("payload_json"))

    events.select(
        f.variant_get("payload", "$.priority", "string").alias("priority"),
        f.try_variant_get("payload", "$.gift", "boolean").alias("gift"),
    )
    ```

    - `parse_json(str)` builds a VARIANT; malformed JSON raises an error,
      `try_parse_json` returns `NULL` instead.
    - `variant_get(v, path, type)` extracts and casts. A missing path gives
      `NULL`; a value that cannot be cast (the string `"x"` as `int`)
      raises `INVALID_VARIANT_CAST`. `try_variant_get` returns `NULL` for
      both.
    - In SQL, the `:` path operator is shorthand:
      `SELECT payload:priority::string FROM events`.
    - `schema_of_variant(v)` describes one value; `schema_of_variant_agg(v)`
      merges the shapes across all rows, which is useful when you are ready
      to promote a VARIANT column to a proper struct.

    **Docs:** [parse_json](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.parse_json.html) |
    [variant_get](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.variant_get.html)

