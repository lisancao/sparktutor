    ## Higher-Order Functions

    Exploding an array creates many rows, which is expensive. For
    transformations that should stay within the array, Spark provides
    **higher-order functions** that operate element-by-element:

    **`transform()`**: apply a function to every element (like Python's
    `map()`):
    ```python
    df.select(f.transform("prices", lambda x: x * 1.1).alias("with_tax"))
    ```

    **`filter()`**: keep elements matching a condition:
    ```python
    df.select(f.filter("scores", lambda x: x > 80).alias("passing"))
    ```

    **`exists()`** and **`forall()`**: true if any (or every) element
    matches:
    ```python
    df.select(f.exists("tags", lambda x: x == "urgent").alias("is_urgent"))
    ```

    These keep your DataFrame structure intact; no explosion of rows. The
    lambdas are not Python code at runtime: PySpark calls them once to build
    a Catalyst expression, which then runs in the JVM like any built-in
    function. That is why they are fast, and why only Column operations
    (not arbitrary Python) work inside them.

    **Docs:**
    [transform](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.transform.html) |
    [filter (HOF)](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.filter.html) |
    [exists](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.exists.html) |
    [aggregate](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.aggregate.html) |
    [explode](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.explode.html) |
    [collect_list](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.collect_list.html)

