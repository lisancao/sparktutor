    ## Performance: Explode vs. Higher-Order Functions

    `explode()` is convenient but has a cost: it multiplies the number of
    rows, which increases shuffle sizes and memory usage. If an array
    column averages 10 elements, exploding it makes your DataFrame 10x
    larger.

    Higher-order functions (`transform`, `filter`, `aggregate`) avoid this
    by operating within each row. They are:
    - More memory-efficient (no row multiplication)
    - Faster for large arrays (no shuffle expansion)
    - Easier to reason about (output has same row count as input)

    **When to explode**: you need to join or group by individual array
    elements. **When to use HOFs**: you need to transform, filter, or
    reduce array contents while keeping the row structure intact.

