    ## Parquet: Spark's Preferred Format

    **Parquet** is a columnar storage format. Instead of storing rows
    together (like CSV), it stores each column together. This gives three
    advantages:

    1. **Column pruning** — if your query only needs 3 of 50 columns, Spark
       reads only those 3. CSV would read all 50.
    2. **Efficient compression** — similar values in a column compress
       better than mixed values in a row.
    3. **Schema embedded** — the column names and types are stored in the
       file, so no schema inference or header parsing is needed.

    Parquet also supports **predicate pushdown**: if you filter on a column,
    Spark can skip entire row groups whose metadata shows they cannot match
    the filter.

    ```python
    # Reading Parquet — no options needed, schema is in the file
    df = spark.read.parquet("/data/flights.parquet")

    # Writing Parquet
    df.write.parquet("/output/flights")
    ```

