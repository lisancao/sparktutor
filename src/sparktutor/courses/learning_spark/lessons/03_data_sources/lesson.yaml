    ## Exercise: Multi-Format Data Pipeline

    Implement two functions that exercise the full read-write-query cycle.

    `data_pipeline(spark, output_path)`:
    1. Create a sample DataFrame of flight delay data
    2. Write it to Parquet at the given path (overwrite mode)
    3. Read the Parquet back into a new DataFrame
    4. Create a temporary SQL view called `"flights"`
    5. Run a SQL query to find the top 3 destinations by total delay
    6. Return the query result DataFrame

    `xml_roundtrip(spark, df, xml_path)`:
    1. Write `df` as XML (overwrite mode) with `rootTag` `"delays"` and
       `rowTag` `"route"`
    2. Read it back with the same `rowTag` and return the DataFrame

    This exercise ties together reading, writing, format conversion, SQL
    views, queries, and the built-in XML source from Spark 4.0.
