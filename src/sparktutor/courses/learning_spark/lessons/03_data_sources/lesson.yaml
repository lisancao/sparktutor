    ## The DataFrameWriter API

    Writing follows a similar pattern to reading:

    ```python
    df.write.format("parquet").mode("overwrite").save("/output/data")
    ```

    Or using shorthand: `df.write.parquet("/output/data")`.

    **Write modes** control what happens when the output path already exists:

    | Mode | Behavior |
    |------|----------|
    | `error` / `errorifexists` (default) | Raise an error if data exists |
    | `overwrite` | Delete existing data, write new |
    | `append` | Add new data alongside existing |
    | `ignore` | Silently skip if data exists |

    Use `mode("overwrite")` for development and `mode("append")` for
    incremental production pipelines. Plain file directories give you no
    atomicity: a failed overwrite can leave a half-written directory. That
    gap is what table formats like Delta Lake and Iceberg close (Lesson 9).

