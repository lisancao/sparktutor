- Class: text
  Depth: advanced
  Output: |
    ## 格式对比：何时用什么

    | 格式 | 存储 | Schema | 压缩 | 最适合 |
    |--------|---------|--------|-------------|----------|
    | Parquet | 列式 | 内嵌 | 极佳 | 分析、数据湖 |
    | ORC | 列式 | 内嵌 | 极佳 | Hive 生态 |
    | CSV | 行式 | 外部 | 默认无 | 交换、调试 |
    | JSON | 行式 | 自描述 | 中等 | API、半结构化 |
    | Avro | 行式 | 内嵌 | 良好 | 流式、Kafka |

    对于 Spark 工作负载，默认用 **Parquet**。CSV/JSON 仅用于从外部系统
    摄入数据。与 Kafka 集成或 schema 演进很关键时用 Avro。

    **谓词下推支持**：Parquet 和 ORC 将过滤下推到文件读取器中
    （跳过行组）。CSV 和 JSON 做不到 —— Spark 必须读取并过滤所有行。

