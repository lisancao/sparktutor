    ## CSV: Human-Readable but Inefficient

    CSV is the most common interchange format, but it has drawbacks: no
    type information, no compression by default, and Spark must read every
    column even if you only need one.

    Key options when reading CSV:

    ```python
    df = (spark.read
        .option("header", "true")       # first row has column names
        .option("inferSchema", "true")  # auto-detect types (extra scan)
        .option("sep", ",")             # field delimiter
        .option("nullValue", "NA")      # treat "NA" as null
        .option("quote", '"')           # quote character
        .option("mode", "FAILFAST")     # fail on malformed rows
        .csv("/data/orders.csv"))
    ```

    The `mode` option controls malformed rows: `PERMISSIVE` (default; bad
    fields become null, optionally captured in `columnNameOfCorruptRecord`),
    `DROPMALFORMED`, or `FAILFAST`. For production, replace `inferSchema`
    with an explicit schema.

