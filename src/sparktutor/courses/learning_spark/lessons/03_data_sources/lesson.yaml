    ## JSON: Semi-Structured Data

    Spark reads **single-line JSON** by default, one JSON object per line
    (also called JSON Lines or NDJSON):

    ```json
    {"name": "Alice", "age": 30}
    {"name": "Bob", "age": 25}
    ```

    For multi-line JSON (one big array or pretty-printed objects), set
    `multiLine`:

    ```python
    df = spark.read.option("multiLine", "true").json("/data/users.json")
    ```

    JSON handles nested data naturally: Spark maps nested objects to
    `StructType` and arrays to `ArrayType`.

