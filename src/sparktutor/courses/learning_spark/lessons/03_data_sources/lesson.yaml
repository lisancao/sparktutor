    ## The DataFrameReader API

    Every data read in Spark follows the same pattern:

    ```python
    df = (spark.read
        .format("csv")            # what format
        .option("header", "true") # format-specific settings
        .schema(my_schema)        # explicit schema (recommended)
        .load("/path/to/data"))   # where to read from
    ```

    The chain is always: **format, options, schema, load**. Spark also
    provides shorthand methods: `spark.read.csv()`, `spark.read.json()`,
    `spark.read.parquet()`, `spark.read.orc()`, `spark.read.xml()`.

    **Docs:**
    [DataFrameReader.csv](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameReader.csv.html) |
    [.json](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameReader.json.html) |
    [.parquet](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameReader.parquet.html) |
    [DataFrameWriter.mode](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameWriter.mode.html) |
    [Generic data source options](https://spark.apache.org/docs/4.2.0/sql-data-sources-generic-options.html)

