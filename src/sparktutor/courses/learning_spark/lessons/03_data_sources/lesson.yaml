    ## ORC, Avro, and XML

    **ORC** (Optimized Row Columnar) is similar to Parquet: columnar,
    compressed, with an embedded schema. It is historically preferred in the
    Hive ecosystem. For most Spark workloads, Parquet and ORC perform
    comparably.

    **Avro** is a **row-based** format, better suited for write-heavy
    workloads and schema evolution. It is commonly used as a serialization
    format with Kafka. The `avro` source ships with Spark as the external
    `spark-avro` module, so add it to the classpath before reading:

    ```python
    df = spark.read.format("avro").load("/data/events.avro")
    ```

    **XML** became a **built-in** source in Spark 4.0 (it used to require
    the separate spark-xml package). `rowTag` names the element that
    becomes one row:

    ```python
    books = spark.read.option("rowTag", "book").xml("/data/books.xml")

    (df.write
        .option("rootTag", "delays")
        .option("rowTag", "route")
        .xml("/output/delays_xml"))
    ```

    XML attributes become columns prefixed with `_` (`<book id="1">` gives
    `_id`).

    **Rule of thumb**: use Parquet for analytics (read-heavy), Avro for
    streaming and messaging (write-heavy with schema evolution), and
    CSV/JSON/XML at the edges where other systems hand you data.

    **Docs:** [XML files](https://spark.apache.org/docs/4.2.0/sql-data-sources-xml.html)

