    ## JSON into VARIANT

    Schema inference on JSON has a weakness: if records disagree on shape,
    the inferred struct is the union of every field Spark saw, and a field
    that is a number in one record and an object in another collapses to a
    string. Spark 4.x can skip inference entirely and load each record as a
    `VARIANT`:

    ```python
    raw = spark.read.option("singleVariantColumn", "raw").json("/data/events/")
    raw.printSchema()
    # root
    #  |-- raw: variant (nullable = true)

    raw.select(f.variant_get("raw", "$.payload.device", "string").alias("device"))
    ```

    You can also mix fixed and flexible columns in a DDL schema:
    `spark.read.schema("id INT, payload VARIANT").json(path)`. VARIANT
    columns write to Parquet natively, so the raw shape survives the bronze
    layer of a pipeline untouched.

