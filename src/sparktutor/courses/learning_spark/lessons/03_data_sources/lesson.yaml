    ## Custom Sources in Pure Python

    Since Spark 4.0 you can write a data source in Python, no JVM code
    required. Subclass `DataSource` for the metadata and `DataSourceReader`
    for the rows, register it, and use it like any built-in format:

    ```python
    from pyspark.sql.datasource import DataSource, DataSourceReader

    class Counter(DataSource):
        @classmethod
        def name(cls):
            return "counter"

        def schema(self):
            return "n INT, sq INT"

        def reader(self, schema):
            return CounterReader(self.options)

    class CounterReader(DataSourceReader):
        def __init__(self, options):
            self.limit = int(options.get("limit", 3))

        def read(self, partition):
            for i in range(self.limit):
                yield (i, i * i)

    spark.dataSource.register(Counter)
    spark.read.format("counter").option("limit", 4).load().show()
    ```

    The same API covers writers (`DataSourceWriter`) and streaming readers
    (`DataSourceStreamReader`); in 4.2, Python streaming readers also support
    admission control and `Trigger.AvailableNow` (SPARK-55304). One 4.2
    behaviour change: if the Arrow data a Python source returns does not
    match its declared column types, the read fails with
    `DATA_SOURCE_RETURN_SCHEMA_MISMATCH`.

    **Docs:** [Python Data Source API](https://spark.apache.org/docs/4.2.0/api/python/tutorial/sql/python_data_source.html)

