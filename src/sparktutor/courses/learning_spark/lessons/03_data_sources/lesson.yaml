    ## SQL Views: Querying DataFrames with SQL

    Once you create a view, you can query it with standard SQL:

    ```python
    df.createOrReplaceTempView("flights")

    result = spark.sql("""
        SELECT destination, SUM(delay) AS total_delay
        FROM flights
        GROUP BY destination
        ORDER BY total_delay DESC
    """)
    ```

    Session-scoped views (`createOrReplaceTempView`) are visible only within
    the current SparkSession. For application-wide visibility, use
    `createOrReplaceGlobalTempView` and access via `global_temp.view_name`.

    SQL and the DataFrame API produce the **same execution plan** — the
    Catalyst optimizer treats them identically. Choose whichever is more
    readable for your use case.

