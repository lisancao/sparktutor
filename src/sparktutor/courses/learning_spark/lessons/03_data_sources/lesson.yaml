    ## Format Comparison: When to Use What

    | Format | Storage | Schema | Compression | Best For |
    |--------|---------|--------|-------------|----------|
    | Parquet | Columnar | Embedded | Excellent | Analytics, data lakes |
    | ORC | Columnar | Embedded | Excellent | Hive ecosystem |
    | CSV | Row | External | None by default | Interchange, debugging |
    | JSON | Row | Self-describing | Moderate | APIs, semi-structured |
    | XML | Row | Self-describing | Moderate | Legacy and enterprise feeds |
    | Avro | Row | Embedded | Good | Streaming, Kafka |

    For Spark workloads, default to **Parquet** (or a table format built on
    it). Use CSV/JSON/XML only for ingestion from external systems. Use Avro
    when integrating with Kafka or when schema evolution is critical.

    **Predicate pushdown support**: Parquet and ORC push filters into the
    file reader (skip row groups and stripes). CSV and JSON parse every row
    before filtering, though Spark can still push simple filters into the
    parser to skip building rows it would discard.

