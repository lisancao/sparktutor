    ## Summary

    In this lesson you learned:

    - **DataFrameReader**: the universal API for reading any format
    - **Parquet**: Spark's default columnar format with column pruning,
      compression, and embedded schemas
    - **CSV** and **JSON**: common interchange formats with more options
      to configure, including parse `mode`
    - **VARIANT ingestion**: `singleVariantColumn` loads JSON without
      fixing a schema
    - **XML**: built in since Spark 4.0 via `rowTag`/`rootTag`
    - **DataFrameWriter**: write modes (error, overwrite, append, ignore)
    - **SQL views**: `createOrReplaceTempView` lets you query DataFrames
      with standard SQL
    - **Partitioning**: organize output by column values for efficient
      filtering
    - **Python Data Source API**: custom batch and streaming sources in
      pure Python

    In the next lesson, you will work with complex data types (arrays,
    maps, nested structs, and VARIANT) and the higher-order functions that
    manipulate them.
