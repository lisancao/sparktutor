    ## ORC 与 Avro

    **ORC**（Optimized Row Columnar）与 Parquet 类似 —— 列式、压缩、
    内嵌 schema。它在 Hive 生态中历史上更受青睐。对于大多数 Spark
    工作负载，Parquet 和 ORC 性能相当。

    **Avro** 是一种**行式**格式，更适合写密集型工作负载和 schema 演进。
    它通常用作 Kafka 的序列化格式。用以下方式读取：

    ```python
    df = spark.read.format("avro").load("/data/events.avro")
    ```

    **经验法则**：分析（读密集）用 Parquet，流式和消息（写密集且需
    schema 演进）用 Avro。

- Class: text
  Depth: all
  Output: |
    ## DataFrameWriter API

    写入遵循与读取类似的模式：

    ```python
    df.write.format("parquet").mode("overwrite").save("/output/data")
    ```

    或者使用简写：`df.write.parquet("/output/data")`。

    **写入模式**控制输出路径已存在时的行为：

    | 模式 | 行为 |
    |------|------|
    | `error`（默认） | 如果数据已存在则报错 |
    | `overwrite` | 删除已有数据，写入新数据 |
    | `append` | 在已有数据旁追加新数据 |
    | `ignore` | 如果数据已存在则静默跳过 |

    开发时用 `mode("overwrite")`，增量生产管道用 `mode("append")`。

