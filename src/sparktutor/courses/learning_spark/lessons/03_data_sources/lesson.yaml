    ## Parquet: Spark's Default Format

    **Parquet** is a columnar storage format. Instead of storing rows
    together (like CSV), it stores each column together. This gives three
    advantages:

    1. **Column pruning**: if your query only needs a handful of columns,
       Spark reads only those. CSV would read every column.
    2. **Efficient compression**: similar values in a column compress
       better than mixed values in a row. Spark writes Snappy-compressed
       Parquet by default (`spark.sql.parquet.compression.codec`).
    3. **Schema embedded**: column names and types are stored in the file,
       so no schema inference or header parsing is needed.

    Parquet also supports **predicate pushdown**: if you filter on a column,
    Spark can skip entire row groups whose min/max statistics show they
    cannot match the filter.

    ```python
    # Reading Parquet: no options needed, the schema is in the file
    df = spark.read.parquet("/data/flights.parquet")

    # Writing Parquet
    df.write.parquet("/output/flights")
    ```

    `spark.sql.sources.default` is `parquet`, so `df.write.save(path)` with
    no format also writes Parquet.

