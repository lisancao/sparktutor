    Think of DataFrameReader as a universal file opener. You tell it the
    format (CSV, JSON, Parquet), pass any options it needs (like "this file
    has a header row"), and it hands you back a DataFrame. No matter what
    format the data starts in, you get the same DataFrame API to work with.

    DataFrameWriter is the reverse — it takes your DataFrame and saves it
    in whatever format you choose.

