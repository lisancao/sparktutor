    ## Write Partitioning

    Partitioning organizes output files into subdirectories by column
    values:

    ```python
    df.write.partitionBy("year", "month").parquet("/output/data")
    ```

    This creates a directory structure like:
    ```
    /output/data/year=2025/month=01/part-00000.parquet
    /output/data/year=2025/month=02/part-00000.parquet
    /output/data/year=2024/month=12/part-00000.parquet
    ```

    **Partition pruning**: when you filter on a partitioned column, Spark
    skips entire directories that cannot match. A query for `year = 2025`
    never touches the `year=2024` directory.

    **Warning**: do not partition by high-cardinality columns (e.g., user
    IDs). You will create a flood of tiny files, which hurts performance
    more than it helps.

