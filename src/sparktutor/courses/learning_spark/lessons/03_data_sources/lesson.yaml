    ## What You'll Learn

    In the previous lesson you defined schemas and created DataFrames from
    Python data. Real Spark applications read from files (CSV, JSON,
    Parquet, ORC, XML) and write results back for downstream consumers.

    By the end of this lesson you will be able to:

    - Use the DataFrameReader and DataFrameWriter APIs
    - Read and write CSV, JSON, Parquet, ORC, and XML
    - Explain why Parquet is Spark's default format
    - Choose the right write mode (append, overwrite, ignore, error)
    - Create SQL views from DataFrames and query them with `spark.sql()`
    - Partition output files by column values
    - Load JSON into a `VARIANT` column and write a custom source with the
      Python Data Source API

