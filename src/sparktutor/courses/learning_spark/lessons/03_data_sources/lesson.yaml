    把 DataFrameReader 想象成一个通用的文件打开器。你告诉它格式
    （CSV、JSON、Parquet），传入它需要的选项（比如"这个文件有表头行"），
    它就把一个 DataFrame 交还给你。无论数据最初是什么格式，
    你都用同一个 DataFrame API 来处理。

    DataFrameWriter 则相反 —— 它接收你的 DataFrame 并以你选择的
    任意格式保存。

