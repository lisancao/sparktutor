    ## Bucketed Tables

    If two tables are frequently joined on the same key, save them as
    **bucketed** tables. Bucketing pre-partitions and pre-sorts the data,
    so joins between same-bucketed tables skip the shuffle entirely:

    ```python
    # Write bucketed
    (orders_df.write
        .bucketBy(8, "user_id")
        .sortBy("user_id")
        .saveAsTable("orders_bucketed"))

    (users_df.write
        .bucketBy(8, "user_id")
        .sortBy("user_id")
        .saveAsTable("users_bucketed"))

    # Join — no shuffle needed!
    orders = spark.table("orders_bucketed")
    users = spark.table("users_bucketed")
    result = orders.join(users, "user_id")
    ```

    Both tables must have the **same number of buckets** and the **same
    bucket column** for the optimization to apply.

