    ## AQE Rewrites Joins at Runtime

    The static planner chooses a join strategy from size *estimates*. AQE
    (on by default) re-plans after each shuffle stage using real sizes:

    - **SMJ to BHJ**: if a side turns out to be small after filters ran,
      AQE switches to a broadcast join. The threshold for this runtime
      decision is `spark.sql.adaptive.autoBroadcastJoinThreshold`, which
      defaults to the regular `autoBroadcastJoinThreshold`.
    - **Local shuffle reader**: once AQE has converted to a broadcast join,
      it reads the already-written shuffle files locally instead of
      shuffling again (`spark.sql.adaptive.localShuffleReader.enabled`).
    - **SMJ to SHJ**: if every partition of one side is below
      `spark.sql.adaptive.maxShuffledHashJoinLocalMapThreshold` (default
      0, which means off), AQE can switch to a shuffled hash join.
    - **Skew splitting**: covered below.

    You will only see these decisions in the *final* plan, so call
    `explain()` after an action, or open the SQL tab in the 4.2 Web UI,
    which shows the initial and final plans side by side.

