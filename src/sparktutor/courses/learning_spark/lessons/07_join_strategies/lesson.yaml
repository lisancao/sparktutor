    ## Bucketed Tables

    If two tables are frequently joined on the same key, save them as
    **bucketed** tables. Bucketing pre-partitions and pre-sorts the data,
    so joins between compatibly bucketed tables skip the shuffle:

    ```python
    (orders_df.write
        .bucketBy(8, "user_id")
        .sortBy("user_id")
        .saveAsTable("orders_bucketed"))

    (users_df.write
        .bucketBy(8, "user_id")
        .sortBy("user_id")
        .saveAsTable("users_bucketed"))

    orders = spark.table("orders_bucketed")
    users = spark.table("users_bucketed")
    result = orders.join(users, "user_id")   # no Exchange in the plan
    ```

    Both tables must be bucketed on the join key, and the bucket counts must
    match. (With `spark.sql.bucketing.coalesceBucketsInJoin.enabled`, off by
    default, Spark can also join tables whose bucket counts divide evenly.)
    Bucketing only works for tables written with
    `saveAsTable`, not for plain `parquet(path)` output.

    Table formats offer the DSv2 analogue: **storage-partitioned joins**
    let Spark skip the shuffle when both sides of a join are partitioned
    compatibly by the connector (for example, Iceberg tables with matching
    partition transforms).

