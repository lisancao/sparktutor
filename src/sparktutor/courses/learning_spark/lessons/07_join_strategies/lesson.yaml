  Output: |
    想象你有一本巨大的电话簿（大表）和一份简短的客人名单（小表）。
    与其为每个客人翻遍电话簿，不如复印客人名单，给每个工人一份。
    每个工人将自己负责的电话簿部分与本地客人名单进行匹配。
    没有人需要移动电话簿 —— 这就是 **Broadcast Hash Join**。

    如果两张表都很大（两本电话簿），你别无选择，只能排序和合并它们
    —— 这就是 **Sort Merge Join**。它更慢，因为两侧都必须先
    经过 shuffle 和排序。

- Class: text
  Depth: all
  Output: |
    ## Broadcast Hash Join（BHJ）

    当一张表小到足以放入执行器内存时，Spark 会将其 **广播**
    到每个执行器。大表保持不动 —— 不需要为它做 shuffle。
    这是最快的 join 策略。

    当一侧小于 `spark.sql.autoBroadcastJoinThreshold`
    （默认：**10MB**）时，Spark 会自动使用 BHJ。

    你可以用 hint 强制广播：

    ```python
    from pyspark.sql import functions as f

    result = large_df.join(f.broadcast(small_df), "key")
    ```

    用 `explain()` 检查执行计划 —— 查找 `BroadcastHashJoin`。

    **文档：** [f.broadcast](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.broadcast.html)
    —— 在 join 调用中用 `f.broadcast(df)` 包装小 DataFrame。

