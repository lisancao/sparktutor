    ## Handling Data Skew in Joins

    Data skew occurs when one join key has far more rows than others — a
    single partition becomes a bottleneck while other partitions finish
    quickly. Common causes: null keys, popular users, default categories.

    **Solution 1: AQE Skew Join** (automatic in Spark 3.2+)
    AQE detects skewed partitions at runtime and splits them into smaller
    sub-partitions. Enable with:
    ```python
    spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
    spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionFactor", "5")
    ```

    **Solution 2: Salting** — add a random prefix to the skewed key to
    spread it across partitions:
    ```python
    from pyspark.sql import functions as f
    salted = df.withColumn("salted_key",
        f.concat(f.col("key"), f.lit("_"), (f.rand() * 10).cast("int")))
    ```
    Then join on the salted key. This trades a slightly larger shuffle for
    eliminating the bottleneck.

    **Solution 3: Filter nulls** — if null keys cause the skew, filter
    them out, handle them separately, then union the results.

