    ## Summary

    In this lesson you learned:

    - **Join types**: inner, left/right/full outer, left_semi (EXISTS),
      left_anti (NOT EXISTS), cross, and lateral
    - **Broadcast Hash Join**: fastest for small-large joins; auto-selected
      below the 10MB threshold; force with `f.broadcast()` or `BROADCAST`
    - **Sort Merge Join**: default for large-large joins; shuffle, sort,
      merge
    - **Shuffled Hash Join** and the `shuffle_hash` / `merge` /
      `shuffle_replicate_nl` hints
    - **AQE**: runtime switch to broadcast, local shuffle reads, skew
      splitting; visible in the final plan
    - **Bucketed tables** and storage-partitioned joins skip shuffles
    - **Skew handling**: AQE skew join, salting, or null filtering
    - **Nearest-by joins** (4.2): top-k matches per row by distance or
      similarity

    You can now write efficient joins and diagnose join performance with
    `explain()`. In the next lesson, you will shift from batch to
    **streaming**: processing data continuously as it arrives.
