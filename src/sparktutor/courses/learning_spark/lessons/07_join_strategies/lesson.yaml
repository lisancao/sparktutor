    ## Broadcast Hash Join (BHJ)

    When one table is small enough to fit in executor memory, Spark
    **broadcasts** it to every executor. The large table stays put — no
    shuffle needed for it. This is the fastest join strategy.

    Spark automatically uses BHJ when one side is below
    `spark.sql.autoBroadcastJoinThreshold` (default: **10MB**).

    You can force a broadcast with a hint:

    ```python
    from pyspark.sql import functions as f

    result = large_df.join(f.broadcast(small_df), "key")
    ```

    Check the plan with `explain()` — look for `BroadcastHashJoin`.

    **Docs:** [f.broadcast](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.broadcast.html)
    — wrap the small DataFrame in `f.broadcast(df)` inside the join call.

