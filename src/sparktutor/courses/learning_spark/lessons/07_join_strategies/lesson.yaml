    ## 处理 Join 中的数据倾斜

    当某个 join 键的行数远多于其他键时就会发生数据倾斜 ——
    单个分区成为瓶颈，而其他分区很快完成。常见原因：null 键、
    热门用户、默认类别。

    **解决方案 1：AQE 倾斜 Join**（Spark 3.2+ 自动启用）
    AQE 在运行时检测倾斜的分区，并将其拆分成更小的子分区。
    用以下配置启用：
    ```python
    spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
    spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionFactor", "5")
    ```

    **解决方案 2：加盐（Salting）** —— 给倾斜的键添加随机前缀
    以将其分散到多个分区：
    ```python
    from pyspark.sql import functions as f
    salted = df.withColumn("salted_key",
        f.concat(f.col("key"), f.lit("_"), (f.rand() * 10).cast("int")))
    ```
    然后在加盐后的键上 join。这用略大的 shuffle 换来了
    瓶颈的消除。

    **解决方案 3：过滤 null** —— 如果 null 键导致倾斜，
    过滤掉它们，单独处理，然后 union 结果。

