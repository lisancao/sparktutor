    ## What You'll Learn

    Joins combine data from multiple sources, and they are the most
    expensive operation in distributed computing. The wrong join strategy
    can turn a quick query into one that runs for an hour.

    In the previous lesson you learned to tune partitions and caching.
    Now you will learn to choose and optimize joins:

    - The join types (inner, outer, semi, anti, cross, lateral)
    - Broadcast Hash Join, the fastest strategy for small-large joins
    - Sort Merge Join, the default for large-large joins
    - Shuffled Hash Join and the join hints that select each strategy
    - How AQE changes join strategies at runtime
    - Bucketed tables, which pre-partition data to skip shuffles
    - Handling data skew in joins
    - The nearest-neighbour join Spark 4.2 added

