    ## Lateral Joins and Nearest-Neighbour Joins

    **LATERAL** (SQL since 3.x, `DataFrame.lateralJoin` since 4.0) lets the
    right side reference columns of the current left row, which makes
    "top-N per group" a join instead of a window:

    ```sql
    SELECT u.name, t.order_id, t.amount
    FROM users u
    JOIN LATERAL (
      SELECT order_id, amount FROM orders o
      WHERE o.user_id = u.user_id
      ORDER BY amount DESC LIMIT 1
    ) t
    ```

    **Nearest-by joins** (new in 4.2, SPARK-56395) return, for each left
    row, the `k` right rows that rank best on an expression, such as the
    closest store to each customer:

    ```python
    dist = f.sqrt((f.col("cx") - f.col("sx")) ** 2 + (f.col("cy") - f.col("sy")) ** 2)
    customers.nearestByJoin(stores, dist, numResults=1, mode="exact", direction="distance")
    ```

    ```sql
    SELECT c.cid, s.store
    FROM customers c JOIN stores s
      EXACT NEAREST 2 BY DISTANCE sqrt(pow(cx - sx, 2) + pow(cy - sy, 2))
    ```

    `direction` is `distance` (smallest first) or `similarity` (largest
    first); `mode` is `exact` or `approx`. In 4.2.0 both modes evaluate the
    full cross product (the plan contains a `CartesianProduct`) and keep
    the best `k` per left row; index-backed approximate search is planned
    but not implemented. Pre-filter the right side when it is large.

