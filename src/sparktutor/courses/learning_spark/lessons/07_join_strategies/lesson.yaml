    ## 小结

    本课你学到了：

    - **Join 类型** —— inner、left/right/full outer、left_semi（EXISTS）、
      left_anti（NOT EXISTS）
    - **Broadcast Hash Join** —— 小表与大表 join 最快；低于 10MB
      阈值时自动选择；用 `f.broadcast()` 强制
    - **Sort Merge Join** —— 大表与大表 join 的默认策略；
      shuffle + sort + merge
    - **Bucket 表** —— 预分区数据以在频繁 join 时跳过 shuffle
    - **倾斜处理** —— AQE 倾斜 join、加盐或 null 过滤

    你现在可以编写高效的 join 并用 `explain()` 诊断 join 性能。
    在下一课中，你将从批处理转向**流处理** —— 在数据到达时
    持续处理数据。
