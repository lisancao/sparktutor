    ## Join Hints and Shuffled Hash Join

    There is a third strategy between the two. **Shuffled Hash Join (SHJ)**
    shuffles both sides like SMJ, but instead of sorting, it builds a hash
    table from the smaller side of each partition. It skips the sort, so it
    can beat SMJ when one side is moderately small per partition, but it
    needs that build side to fit in memory. Spark prefers SMJ by default
    (`spark.sql.join.preferSortMergeJoin=true`).

    Hints let you choose the strategy explicitly, from either API:

    ```python
    orders.join(users.hint("broadcast"), "user_id")      # BroadcastHashJoin
    orders.join(users.hint("shuffle_hash"), "user_id")   # ShuffledHashJoin
    orders.join(users.hint("merge"), "user_id")          # SortMergeJoin
    ```

    ```sql
    SELECT /*+ BROADCAST(u) */ * FROM orders o JOIN users u USING (user_id);
    SELECT /*+ SHUFFLE_HASH(u) */ * FROM orders o JOIN users u USING (user_id);
    SELECT /*+ MERGE(o, u) */ * FROM orders o JOIN users u USING (user_id);
    ```

    `SHUFFLE_REPLICATE_NL` asks for a shuffle-and-replicate nested loop
    join; it only applies to inner-like joins and is rarely what you want.
    A hint is a request: if the strategy cannot handle the join type,
    Spark ignores it and logs a warning.

    To see SMJ without hints, disable automatic broadcasting:

    ```python
    spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "-1")
    result = df1.join(df2, "key")
    spark.conf.unset("spark.sql.autoBroadcastJoinThreshold")   # back to default
    ```

    **Docs:** [Join strategy hints](https://spark.apache.org/docs/4.2.0/sql-ref-syntax-qry-select-hints.html)

