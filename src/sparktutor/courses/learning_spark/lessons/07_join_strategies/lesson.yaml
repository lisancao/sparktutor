    ## Forcing a Specific Join Strategy

    Sometimes you know better than the optimizer:

    ```python
    # Force broadcast (even if above threshold)
    result = big_df.join(f.broadcast(medium_df), "key")

    # Force sort-merge (disable broadcast for testing)
    spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "-1")
    result = df1.join(df2, "key")

    # Reset to default
    spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "10485760")
    ```

    Use `explain()` after the join to confirm the strategy Spark chose.

