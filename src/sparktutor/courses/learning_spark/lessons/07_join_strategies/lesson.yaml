    ## Handling Data Skew in Joins

    Data skew occurs when one join key has far more rows than others; a
    single partition becomes a bottleneck while other partitions finish
    quickly. Common causes: null keys, popular users, default categories.

    **Solution 1: AQE skew join** (on by default). AQE treats a partition as
    skewed when it is larger than `skewedPartitionFactor` (default 5) times
    the median partition size **and** larger than
    `skewedPartitionThresholdInBytes` (default 256MB). It splits that
    partition and replicates the matching partition on the other side:
    ```python
    spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
    spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionFactor", "5")
    spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes", "256m")
    ```

    **Solution 2: Salting**: add a random suffix to the skewed key on the
    big side, and replicate the small side once per suffix:
    ```python
    from pyspark.sql import functions as f
    SALTS = 10
    big = big.withColumn("salt", (f.rand() * SALTS).cast("int"))
    small = small.crossJoin(spark.range(SALTS).withColumnRenamed("id", "salt"))
    result = big.join(small, ["key", "salt"])
    ```
    This trades a larger small side for eliminating the bottleneck.

    **Solution 3: Filter nulls**: if null keys cause the skew, filter
    them out, handle them separately, then union the results. (Inner and
    left joins never match null keys anyway.)

