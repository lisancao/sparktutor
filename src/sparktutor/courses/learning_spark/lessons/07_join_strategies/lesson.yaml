  Output: |
    Imagine you have a huge phone book (big table) and a short guest list
    (small table). Instead of searching the phone book for each guest, you
    photocopy the guest list and hand one to every worker. Each worker
    matches their section of the phone book against the local guest list.
    No one needs to move the phone book around; that is a **Broadcast
    Hash Join**.

    If both tables are huge (two phone books), you have no choice but to
    sort and merge them; that is a **Sort Merge Join**. It is slower
    because both sides must be shuffled and sorted first.

