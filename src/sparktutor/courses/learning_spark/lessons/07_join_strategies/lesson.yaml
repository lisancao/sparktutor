    ## Bucket 表

    如果两张表经常在同一个键上 join，将它们保存为 **bucketed** 表。
    Bucketing 会预分区并预排序数据，因此相同 bucketing 的表之间
    的 join 完全跳过 shuffle：

    ```python
    # Write bucketed
    (orders_df.write
        .bucketBy(8, "user_id")
        .sortBy("user_id")
        .saveAsTable("orders_bucketed"))

    (users_df.write
        .bucketBy(8, "user_id")
        .sortBy("user_id")
        .saveAsTable("users_bucketed"))

    # Join — no shuffle needed!
    orders = spark.table("orders_bucketed")
    users = spark.table("users_bucketed")
    result = orders.join(users, "user_id")
    ```

    两张表必须有**相同数量的 bucket** 和**相同的 bucket 列**，
    该优化才会生效。

