    ## 你将学到什么

    Join 将来自多个数据源的数据合并 —— 它们是分布式计算中
    最昂贵的操作。错误的 join 策略可以把一个 10 秒的查询
    变成 10 分钟的查询。

    在上一课中，你学习了调优分区和缓存。现在你将学习
    如何选择和优化 join：

    - 五种 join 类型（inner、outer、semi、anti、cross）
    - Broadcast Hash Join —— 小表与大表 join 的最快策略
    - Sort Merge Join —— 大表与大表 join 的默认策略
    - Bucket 表 —— 预分区数据以跳过 shuffle
    - 处理 join 中的数据倾斜

- Class: text
  Depth: all
  Output: |
    ## Join 类型

    Spark 支持五种 join 类型：

    ```python
    # Inner — only matching rows from both sides
    df1.join(df2, "key", "inner")

    # Left outer — all from left, matching from right (nulls for no match)
    df1.join(df2, "key", "left")

    # Full outer — all from both sides
    df1.join(df2, "key", "full")

    # Left semi — rows from left that HAVE a match (like SQL EXISTS)
    df1.join(df2, "key", "left_semi")

    # Left anti — rows from left that have NO match (like SQL NOT EXISTS)
    df1.join(df2, "key", "left_anti")
    ```

    `left_semi` 和 `left_anti` 在不过实际引入右侧列的情况下
    进行过滤，非常强大。

    **文档：** [DataFrame.join](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.join.html)
    —— `on`（列名或表达式）、`how`（`inner`、`left`、`full`、`left_semi`、`left_anti`、`cross`）。

- Class: text
