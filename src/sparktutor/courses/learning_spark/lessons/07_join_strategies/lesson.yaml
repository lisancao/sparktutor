    ## Join Types

    Spark supports these join types:

    ```python
    # Inner: only matching rows from both sides
    df1.join(df2, "key", "inner")

    # Left outer: all from left, matching from right (nulls for no match)
    df1.join(df2, "key", "left")

    # Full outer: all from both sides
    df1.join(df2, "key", "full")

    # Left semi: rows from left that HAVE a match (like SQL EXISTS)
    df1.join(df2, "key", "left_semi")

    # Left anti: rows from left that have NO match (like SQL NOT EXISTS)
    df1.join(df2, "key", "left_anti")

    # Cross: every pair (use deliberately)
    df1.crossJoin(df2)
    ```

    `left_semi` and `left_anti` are powerful for filtering without actually
    bringing in columns from the right side.

    **Docs:** [DataFrame.join](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.join.html)
    (`on` as a column name, list, or expression; `how` as `inner`, `left`,
    `right`, `full`, `left_semi`, `left_anti`, `cross`).

- Class: text
