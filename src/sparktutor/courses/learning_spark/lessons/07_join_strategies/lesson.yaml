    ## Sort Merge Join (SMJ)

    When both tables are too large to broadcast, Spark falls back to
    Sort Merge Join:

    1. **Shuffle**: both sides are partitioned by the join key
    2. **Sort**: each partition is sorted by the join key
    3. **Merge**: sorted partitions are merged (like merge sort)

    The shuffle is the expensive part: every row is sent across the
    network to the partition that owns its key's hash. This is unavoidable
    for large-large joins unless the data is already partitioned by the
    key (see bucketing below).

    You can verify the strategy with `explain()`; look for
    `SortMergeJoin` in the physical plan, with an `Exchange
    hashpartitioning` and a `Sort` under each side.

