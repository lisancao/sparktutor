- Class: text
  Depth: all
  Output: |
    ## Sort Merge Join（SMJ）

    当两张表都太大无法广播时，Spark 回退到 Sort Merge Join：

    1. **Shuffle** —— 两侧都按 join 键分区
    2. **Sort** —— 每个分区按 join 键排序
    3. **Merge** —— 排序后的分区被合并（类似归并排序）

    shuffle 是代价高昂的部分 —— 每一行都必须通过网络发送到
    拥有其键哈希值的分区。对于大表与大表的 join，这是不可避免的。

    你可以用 `explain()` 验证策略 —— 在物理计划中查找
    `SortMergeJoin`。

- Class: text
