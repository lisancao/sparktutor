    ## Exercise: Streaming Word Count and Sensor Alerts

    The first two functions practice streaming logic on batch DataFrames,
    which is how you unit-test streaming code. The last two run real
    streaming queries over a directory of JSON files, using
    `trigger(availableNow=True)` and the `memory` sink so they finish on
    their own.

    1. `streaming_word_count(spark)`: split lines into words, group by
       word, count, order by count descending
    2. `streaming_windowed_count(spark)`: count words in 10-minute tumbling
       windows, ordered by window
    3. `sensor_window_stream(spark, input_dir, checkpoint_dir)`: stream the
       JSON files in `input_dir` (schema `READING_SCHEMA`), apply a
       10-minute watermark on `event_time`, compute `max(temp)` as
       `max_temp` per 10-minute window and sensor, and write to the memory
       sink as query `sensor_windows` in complete mode. Wait for it to
       finish and return `spark.table("sensor_windows")`.
    4. `sensor_violations(spark, input_dir, checkpoint_dir)`: stream the
       same files through the provided `ViolationCounter` processor with
       `transformWithState` (RocksDB state store, update mode), write to
       the memory sink as query `sensor_violations`, wait, and return
       `spark.table("sensor_violations")`.
