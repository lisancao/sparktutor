    ## 小结

    本课你学到了：

    - **流式模型** —— 无界输入表增量处理
    - **数据源与数据汇** —— readStream/writeStream，熟悉的格式
    - **输出模式** —— append（新行）、update（变更行）、
      complete（全部）
    - **触发器** —— 控制处理频率；`availableNow` 衔接批处理和流处理
    - **窗口聚合** —— 滚动和滑动时间窗口
    - **水位线** —— 通过定义迟到数据阈值来限制状态
    - **Checkpoint** —— 实现恰好一次容错

    你现在可以用 Spark 处理批处理和流式数据了。在下一课中，
    你将学习**数据湖和湖仓** —— 这个存储层通过 ACID 事务和
    时间旅行让大规模数据变得可靠。
