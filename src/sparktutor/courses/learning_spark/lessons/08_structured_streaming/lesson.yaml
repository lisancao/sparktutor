    ## Stateless vs. Stateful Transforms

    **Stateless** — operate on individual rows without history: `select`,
    `filter`, `withColumn`, `flatMap`. These work with all output modes
    and require no special configuration.

    **Stateful** — maintain state across micro-batches: `groupBy`
    aggregations, windowed aggregations, stream-stream joins,
    `dropDuplicates`. These need state management and may restrict output
    modes.

    The distinction matters because stateful operations accumulate memory.
    Without bounds (like watermarks), state can grow indefinitely.

