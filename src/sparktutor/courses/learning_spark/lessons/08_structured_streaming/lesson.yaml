    ## Stream-Stream and Stream-Static Joins

    **Stream-static join** — join a streaming DataFrame with a batch
    DataFrame. The static side is re-read each micro-batch. Useful for
    enrichment (e.g., joining click events with a product catalog):

    ```python
    enriched = click_stream.join(product_catalog, "product_id")
    ```

    **Stream-stream join** — both sides are streams. Requires watermarks
    to bound state. Spark buffers rows from both sides and matches them
    as they arrive:

    ```python
    clicks = clicks.withWatermark("click_time", "10 minutes")
    impressions = impressions.withWatermark("imp_time", "10 minutes")

    matched = clicks.join(impressions,
        expr("click_id = imp_id AND click_time BETWEEN imp_time AND imp_time + interval 5 minutes"))
    ```

