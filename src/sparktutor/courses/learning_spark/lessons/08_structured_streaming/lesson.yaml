    ## Output Modes

    The output mode determines **what** is written to the sink each trigger:

    **`append`** — only new rows since the last trigger. Use for stateless
    transforms (select, filter, map) or after watermark-based aggregations.

    **`update`** — only rows that changed since the last trigger. Good for
    aggregations where you only care about the latest value.

    **`complete`** — the entire result table every trigger. Required for
    aggregations without watermarks. Can be expensive for large results.

    Not all modes work with all operations. Aggregations require `complete`
    or `update`. Stateless transforms support all three modes.

