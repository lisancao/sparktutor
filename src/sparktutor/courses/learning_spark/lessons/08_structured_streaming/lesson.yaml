    ## Summary

    In this lesson you learned:

    - **Streaming model** — unbounded input table processed incrementally
    - **Sources and sinks** — readStream/writeStream with familiar formats
    - **Output modes** — append (new rows), update (changed rows), complete
      (everything)
    - **Triggers** — control processing frequency; `availableNow` bridges
      batch and streaming
    - **Windowed aggregations** — tumbling and sliding time windows
    - **Watermarks** — bound state by defining a late-data threshold
    - **Checkpointing** — enables exactly-once fault tolerance

    You can now process both batch and streaming data with Spark. In the
    next lesson, you will learn about **data lakes and lakehouses** — the
    storage layer that makes large-scale data reliable with ACID
    transactions and time travel.
