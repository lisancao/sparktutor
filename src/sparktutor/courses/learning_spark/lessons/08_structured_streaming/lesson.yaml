    Imagine a conveyor belt of packages arriving at a warehouse. Instead
    of waiting for all packages to arrive before sorting them, you process
    each batch as it comes. You keep a running tally (state) that updates
    with each new batch.

    Structured Streaming works the same way: by default it processes data
    in micro-batches, applying your familiar DataFrame operations to each
    batch. Your code looks almost identical to batch code.

- Class: text
  Depth: all
  Output: |
    ## The Streaming Model

    Structured Streaming treats a live data stream as a **continuously
    appended table**. New data arriving is like new rows being appended
    to an unbounded input table. Your query runs incrementally on this
    table, producing results in an output table.

    The core components:

    - **Source**: where data comes from: files, Kafka, rate (synthetic),
      socket (testing only), or a Python data source
    - **Query**: your DataFrame transformations (same API as batch)
    - **Sink**: where results go: files, Kafka, console, memory,
      `foreach`, `foreachBatch`
    - **Trigger**: when to process the next batch of data
    - **Output mode**: what to write to the sink each trigger
    - **Checkpoint**: where progress and state are stored so the query can
      restart exactly where it stopped

