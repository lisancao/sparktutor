    ## Watermarks: Handling Late Data

    In the real world, events can arrive late: a sensor reading from
    several minutes ago arrives now. Watermarks tell Spark how long to wait:

    ```python
    result = (events
        .withWatermark("event_time", "10 minutes")
        .groupBy(window("event_time", "5 minutes"))
        .count())
    ```

    Spark tracks the maximum event time seen so far. The watermark is that
    maximum minus 10 minutes; events older than the watermark may be
    dropped, and state for windows that end before it is discarded. That is
    what bounds memory.

    Without a watermark, stateful operations keep all state forever,
    eventually running out of memory.

    **Docs:** [f.window](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.window.html)
    (`windowDuration`, `slideDuration`, and `startTime`)

