    ## 你将学到什么

    到目前为止，我们做的都是**批处理** —— 读取完整数据集，
    转换它，写出结果。但真实数据通常是持续到达的：用户点击、
    传感器读数、交易事件。

    Structured Streaming 让你在数据到达时就处理它，
    而且使用的是你已经熟悉的 DataFrame API。

    学完本课后，你将能够：

    - 解释流式执行模型（无界表）
    - 设置数据源（文件、Kafka、socket）和数据汇（文件、控制台）
    - 选择合适的输出模式（append、update、complete）
    - 配置触发器以控制处理频率
    - 应用水位线来处理迟到数据
    - 通过 checkpoint 理解容错机制

- Class: text
  Depth: beginner
  Output: |
    想象一条传送带上包裹不断到达仓库。你不需要等所有包裹到齐再
    分拣，而是每来一批就处理一批。你维护一个累计计数（状态），
    每来新一批就更新它。

    Structured Streaming 的工作方式相同 —— 它以微批方式处理数据，
    将你熟悉的 DataFrame 操作应用到每个批次上。你的代码看起来
    几乎和批处理代码一模一样。

- Class: text
  Depth: all
  Output: |
    ## 流式模型

    Structured Streaming 将实时数据流视为一张**持续追加的表**。
    新数据到达就像向一张无界输入表追加新行。你的查询在这张表上
    增量运行，在输出表中产生结果。

    核心组件：

    - **Source（数据源）** —— 数据从哪里来：文件、Kafka、socket、
      rate（合成数据）
    - **Query（查询）** —— 你的 DataFrame 转换（与批处理相同的 API）
    - **Sink（数据汇）** —— 结果写到哪里：文件、Kafka、控制台、
      内存、foreach
    - **Trigger（触发器）** —— 多久检查一次新数据
    - **Output mode（输出模式）** —— 每次触发器向 sink 写入什么

- Class: text
  Depth: all
  Output: |
    ## 读取流

    用 `spark.readStream` 替换 `spark.read`：

    ```python
    # File source — picks up new files as they appear
    stream_df = (spark.readStream
        .format("csv")
        .option("header", "true")
        .schema(my_schema)       # required for streaming!
        .load("/data/incoming/"))

    # Socket source — for development/testing
    lines = (spark.readStream
        .format("socket")
        .option("host", "localhost")
        .option("port", 9999)
        .load())
    ```

    **重要**：流式数据源**必须**显式指定 schema。
    `inferSchema` 不可用，因为没有完整的数据集可供采样。

    **文档：** [Structured Streaming Programming Guide](https://spark.apache.org/docs/3.5.0/structured-streaming-programming-guide.html)
    —— 数据源、数据汇、输出模式、触发器、水位线、容错，
    以及流-流 join，均有完整代码示例。

