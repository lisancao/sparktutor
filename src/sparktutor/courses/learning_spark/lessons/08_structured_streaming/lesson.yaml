    ## Writing a Stream

    Replace `df.write` with `df.writeStream`:

    ```python
    query = (result_df.writeStream
        .outputMode("complete")
        .format("console")
        .trigger(processingTime="10 seconds")
        .start())

    query.awaitTermination()  # blocks until the stream is stopped
    ```

    `start()` returns a `StreamingQuery` object you can use to monitor
    and stop the stream.

