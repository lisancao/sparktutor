    ## Writing a Stream

    Replace `df.write` with `df.writeStream`:

    ```python
    query = (result_df.writeStream
        .outputMode("complete")
        .format("console")
        .option("checkpointLocation", "/checkpoints/word_count")
        .trigger(processingTime="10 seconds")
        .start())

    query.awaitTermination()  # blocks until the stream stops
    ```

    `start()` returns a `StreamingQuery` you can use to monitor
    (`query.status`, `query.lastProgress`, `query.recentProgress`) and stop
    (`query.stop()`) the stream.

    For anything the built-in sinks cannot do, `foreachBatch` hands you
    each micro-batch as a regular DataFrame plus a batch id:

    ```python
    def upsert(batch_df, batch_id):
        batch_df.write.mode("append").parquet("/output/events")

    query = stream_df.writeStream.foreachBatch(upsert).start()
    ```

