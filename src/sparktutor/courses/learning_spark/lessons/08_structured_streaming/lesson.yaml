    ## Fault Tolerance: Checkpointing

    Structured Streaming uses **checkpointing** for exactly-once
    processing with replayable sources and idempotent or transactional
    sinks. Set a checkpoint location in your writeStream:

    ```python
    query = (result.writeStream
        .outputMode("append")
        .option("checkpointLocation", "/checkpoints/my_query")
        .format("parquet")
        .start("/output/data"))
    ```

    On restart, Spark reads the offset and commit logs and the state store
    snapshot, then resumes. Rules to remember:
    1. Do not change the query in incompatible ways (new stateful
       operators, different grouping keys) without a new checkpoint
    2. Never share a checkpoint location between different queries
    3. Since 4.2, restarting from a checkpoint whose metadata file is
       missing while the offset or commit logs have data fails with
       `STREAMING_CHECKPOINT_MISSING_METADATA_FILE`, instead of silently
       starting a new query id and risking duplicates

    You can inspect a checkpoint's state as a table with the state data
    source: `spark.read.format("statestore").load("/checkpoints/my_query")`.

