    ## Custom State with transformWithState

    Built-in aggregations cover counts and sums. For anything else (alerts,
    sessionization with custom rules, deduplication with expiry) you write
    a **stateful processor**. `transformWithState` replaces the older
    `applyInPandasWithState` / `flatMapGroupsWithState` APIs. In Python
    there are two flavours: `transformWithStateInPandas` (4.0, pandas
    DataFrames in and out) and `transformWithState` (4.1, `Row` objects in
    and out).

    ```python
    from pyspark.sql import Row
    from pyspark.sql.streaming import StatefulProcessor, StatefulProcessorHandle

    class Violations(StatefulProcessor):
        def init(self, handle: StatefulProcessorHandle):
            # one value per key, persisted in the state store
            self.count = handle.getValueState("violations", "count INT")

        def handleInputRows(self, key, rows, timerValues):
            n = self.count.get()[0] if self.count.exists() else 0
            for r in rows:
                if r.temp > 100:
                    n += 1
            self.count.update((n,))
            yield Row(sensor=key[0], violations=n)

        def close(self):
            pass

    spark.conf.set("spark.sql.streaming.stateStore.providerClass",
        "org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider")

    alerts = (readings.groupBy("sensor").transformWithState(
        statefulProcessor=Violations(),
        outputStructType="sensor STRING, violations INT",
        outputMode="Update",
        timeMode="None"))
    ```

    Notes from the API:
    - The **RocksDB state store** is required; the default HDFS-backed
      provider does not support this operator.
    - State variables: `getValueState`, `getListState`, `getMapState`, each
      with an optional `ttlDurationMs` for automatic expiry.
    - **Timers**: with `timeMode="ProcessingTime"` or `"EventTime"`,
      `handle.registerTimer(ms)` schedules a callback to
      `handleExpiredTimer`.
    - `key` is a tuple of the grouping values, hence `key[0]`.
    - An optional `initialState` seeds state on the first batch; 4.2 made
      that path faster (SPARK-54392).

    **Docs:** [transformWithState guide](https://spark.apache.org/docs/4.2.0/streaming/structured-streaming-transform-with-state.html)

