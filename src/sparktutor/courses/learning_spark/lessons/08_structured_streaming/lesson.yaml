    ## Output Modes

    The output mode determines **what** is written to the sink each trigger:

    **`append`** (default): only rows that will never change again. For a
    stateless query that is every new row. For a windowed aggregation it
    means a window is emitted once, after the watermark passes the end of
    the window.

    **`update`**: only rows that changed since the last trigger. Good for
    aggregations where downstream consumers want the latest value.

    **`complete`**: the entire result table every trigger. Only allowed for
    aggregations, and the state grows with the number of groups, so keep it
    for small result tables.

    Not every mode works with every query. Aggregations without a watermark
    support `update` and `complete` but not `append` (Spark could never be
    sure a group is final). With a watermark on the event-time column, an
    aggregation also supports `append`.

