    ## Reading a Stream

    Replace `spark.read` with `spark.readStream`:

    ```python
    # File source: picks up new files as they appear in the directory
    stream_df = (spark.readStream
        .format("json")
        .schema("sensor STRING, temp INT, event_time TIMESTAMP")
        .load("/data/incoming/"))

    # Kafka source (needs the spark-sql-kafka connector on the classpath)
    events = (spark.readStream
        .format("kafka")
        .option("kafka.bootstrap.servers", "broker:9092")
        .option("subscribe", "events")
        .load())

    # Rate source: generates rows for testing
    rate = spark.readStream.format("rate").option("rowsPerSecond", 10).load()
    ```

    **Important**: file sources **require** an explicit schema by default.
    Inference would need the whole (unbounded) dataset, so it is off unless
    you set `spark.sql.streaming.schemaInference`.

    **Docs:** [Structured Streaming Programming Guide](https://spark.apache.org/docs/4.2.0/streaming/index.html)

