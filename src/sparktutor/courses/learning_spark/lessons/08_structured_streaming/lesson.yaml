  Output: |
    ## 触发器

    触发器控制 Spark 多久检查一次新数据：

    ```python
    # Process every 10 seconds
    .trigger(processingTime="10 seconds")

    # Process all available data in one batch, then stop
    .trigger(availableNow=True)

    # Process one micro-batch, then stop (for testing)
    .trigger(once=True)

    # Default: process as fast as possible
    # (no trigger specified)
    ```

    `availableNow` 对于衔接批处理和流处理特别有用 ——
    按计划运行（例如通过 cron 每小时一次）来处理积累的数据。

