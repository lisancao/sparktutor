    ## Naming Sources so Queries Can Evolve

    A checkpoint identifies sources by their position in the query, so
    adding, removing, or reordering sources used to break it. Spark 4.2
    lets you give each source a stable name (SPARK-54909):

    ```python
    spark.conf.set("spark.sql.streaming.queryEvolution.enableSourceEvolution", "true")

    orders = spark.readStream.format("kafka").name("orders_topic") \
        .option("subscribe", "orders").option("kafka.bootstrap.servers", "broker:9092").load()
    ```

    The SQL form is `IDENTIFIED BY`. Two caveats from the 4.2.0 source:
    the API is marked experimental, and it only works with the
    `enableSourceEvolution` config switched on (an internal flag, off by
    default). Without the flag, `.name()` fails with
    `SOURCE_NAMING_NOT_SUPPORTED`; with it, *every* source in the query
    must be named. Names may contain only ASCII letters, digits, and
    underscores. Treat it as something to try on new queries, not to
    retrofit onto production ones yet.

