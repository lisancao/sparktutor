    Imagine a conveyor belt of packages arriving at a warehouse. Instead
    of waiting for all packages to arrive before sorting them, you process
    each batch as it comes. You keep a running tally (state) that updates
    with each new batch.

    Structured Streaming works the same way — it processes data in
    micro-batches, applying your familiar DataFrame operations to each
    batch. Your code looks almost identical to batch code.

