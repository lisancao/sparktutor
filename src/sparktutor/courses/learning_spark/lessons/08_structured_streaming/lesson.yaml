    ## Fault Tolerance: Checkpointing

    Structured Streaming uses **checkpointing** for exactly-once
    processing. Set a checkpoint location in your writeStream:

    ```python
    query = (result.writeStream
        .outputMode("update")
        .option("checkpointLocation", "/checkpoints/my_query")
        .format("parquet")
        .start("/output/data"))
    ```

    On restart, Spark replays from the checkpoint to recover state. Two
    rules to remember:
    1. Never change the query logic between restarts without clearing
       the checkpoint
    2. Never share checkpoint locations between different queries

