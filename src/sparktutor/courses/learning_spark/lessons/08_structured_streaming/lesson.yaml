    ## What You'll Learn

    Everything so far has been **batch** processing: read a complete
    dataset, transform it, write the output. But real data often arrives
    continuously: user clicks, sensor readings, transaction events.

    Structured Streaming lets you process this data as it arrives, using
    the same DataFrame API you already know.

    By the end of this lesson you will be able to:

    - Explain the streaming execution model (unbounded table)
    - Set up sources (files, Kafka, rate) and sinks (files, Kafka, console,
      memory, foreachBatch)
    - Choose the right output mode (append, update, complete)
    - Configure triggers, including `availableNow` and the Real-Time Mode
      trigger PySpark gained in 4.2
    - Apply watermarks to handle late-arriving data
    - Write custom stateful logic with `transformWithState` (Python, 4.x)
    - Understand fault tolerance via checkpointing, and the 4.2 work on
      evolving a query without losing its checkpoint

- Class: text
