    ## Windowed Aggregations

    Group events into time-based windows:

    ```python
    from pyspark.sql.functions import window

    # Tumbling windows (non-overlapping, 10-minute buckets)
    windowed = (events
        .groupBy(window("event_time", "10 minutes"))
        .count())

    # Sliding windows (10-minute windows, sliding every 5 minutes)
    windowed = (events
        .groupBy(window("event_time", "10 minutes", "5 minutes"))
        .count())

    # Session windows: a session closes after 5 minutes of inactivity
    sessions = (events
        .groupBy("user_id", f.session_window("event_time", "5 minutes"))
        .count())
    ```

    Tumbling windows partition time into non-overlapping buckets. Sliding
    windows overlap, so each event appears in multiple windows. Session
    windows have a dynamic length per key.

