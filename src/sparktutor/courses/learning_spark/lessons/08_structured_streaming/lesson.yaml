    ## Triggers

    Triggers control when Spark processes the next batch:

    ```python
    # Micro-batch every 10 seconds
    .trigger(processingTime="10 seconds")

    # Process everything available now (in several batches), then stop
    .trigger(availableNow=True)

    # Deprecated since 3.4: one batch, then stop. Use availableNow instead.
    .trigger(once=True)

    # Real-Time Mode (PySpark since 4.2): long-running batches, low latency
    .trigger(realTime="5 seconds")

    # Default: start the next micro-batch as soon as the previous one ends
    # (no trigger specified)
    ```

    `availableNow` bridges batch and streaming: run the query on a schedule
    and it processes whatever accumulated since the last run, with the same
    exactly-once checkpointing as a continuous stream. Since 4.0, if any
    source does not support `availableNow`, Spark falls back to a single
    batch rather than risk duplicates or data loss.

    The older `continuous="1 second"` trigger (Continuous Processing) still
    exists but is experimental and limited; Real-Time Mode is the newer path
    to low latency.

