    Create a streaming word count from a socket source on localhost:9999.
    Split lines into words, group by word, count, and write to console in
    complete mode.
  CorrectAnswer: |
    from pyspark.sql import functions as f

    lines = (spark.readStream
        .format("socket")
        .option("host", "localhost")
        .option("port", 9999)
        .load())

    words = lines.select(f.explode(f.split("value", " ")).alias("word"))

    counts = words.groupBy("word").count()

    query = (counts.writeStream
        .outputMode("complete")
        .format("console")
        .start())
