    ## Watermarks: Handling Late Data

    In the real world, events can arrive late — a sensor reading from
    5 minutes ago arrives now. Watermarks tell Spark how long to wait:

    ```python
    result = (events
        .withWatermark("event_time", "10 minutes")
        .groupBy(window("event_time", "5 minutes"))
        .count())
    ```

    Spark tracks the maximum event time seen so far. Any event arriving
    more than 10 minutes behind the max is dropped. This lets Spark
    discard old state and bound memory usage.

    Without a watermark, stateful operations keep all state forever,
    eventually running out of memory.

    **Docs:** [f.window](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.window.html)
    — `windowDuration`, `slideDuration`, and `startTime` parameters for
    tumbling and sliding windows.

