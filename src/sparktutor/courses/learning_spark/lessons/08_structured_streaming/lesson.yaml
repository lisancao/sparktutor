    ## Reading a Stream

    Replace `spark.read` with `spark.readStream`:

    ```python
    # File source — picks up new files as they appear
    stream_df = (spark.readStream
        .format("csv")
        .option("header", "true")
        .schema(my_schema)       # required for streaming!
        .load("/data/incoming/"))

    # Socket source — for development/testing
    lines = (spark.readStream
        .format("socket")
        .option("host", "localhost")
        .option("port", 9999)
        .load())
    ```

    **Important**: streaming sources **require** an explicit schema.
    `inferSchema` is not available because there is no complete dataset
    to sample from.

    **Docs:** [Structured Streaming Programming Guide](https://spark.apache.org/docs/3.5.0/structured-streaming-programming-guide.html)
    — sources, sinks, output modes, triggers, watermarks, fault tolerance,
    and stream-stream joins with full code examples.

