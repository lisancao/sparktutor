    ## Summary

    In this lesson you learned:

    - **Streaming model**: unbounded input table processed incrementally
    - **Sources and sinks**: `readStream`/`writeStream` with familiar
      formats, plus `foreachBatch` for anything custom
    - **Output modes**: append (final rows), update (changed rows),
      complete (everything), and which queries allow which
    - **Triggers**: `processingTime`, `availableNow` (bridges batch and
      streaming), and `realTime` for Real-Time Mode, now in PySpark 4.2
    - **Windowed aggregations**: tumbling, sliding, and session windows
    - **Watermarks**: bound state by defining a late-data threshold
    - **transformWithState**: custom per-key state with TTL and timers, on
      the RocksDB state store
    - **Checkpointing**: exactly-once recovery; 4.2 refuses to restart from
      a checkpoint that lost its metadata, and experimental source naming
      lets queries evolve

    You can now process both batch and streaming data with Spark. In the
    next lesson, you will learn about **data lakes and lakehouses**: the
    storage layer that makes large-scale data reliable with ACID
    transactions, time travel, and change data capture.
