    ## Stateless vs. Stateful Transforms

    **Stateless**: operate on individual rows without history: `select`,
    `filter`, `withColumn`, `explode`. They need no state store and support
    `append` and `update`.

    **Stateful**: maintain state across micro-batches: `groupBy`
    aggregations, windowed aggregations, stream-stream joins,
    `dropDuplicates` / `dropDuplicatesWithinWatermark`, and arbitrary
    stateful operators like `transformWithState`. These need state
    management and may restrict output modes.

    The distinction matters because stateful operations accumulate state.
    Without bounds (like watermarks or state TTL), state can grow
    indefinitely.

