    ## Stream-Stream and Stream-Static Joins

    **Stream-static join**: join a streaming DataFrame with a batch
    DataFrame. Useful for enrichment (e.g., joining click events with a
    product catalog):

    ```python
    enriched = click_stream.join(product_catalog, "product_id")
    ```

    **Stream-stream join**: both sides are streams. Spark buffers rows from
    both sides and matches them as they arrive. Watermarks plus a time-range
    condition bound that buffer:

    ```python
    clicks = clicks.withWatermark("click_time", "10 minutes")
    impressions = impressions.withWatermark("imp_time", "10 minutes")

    matched = clicks.join(impressions, f.expr(
        "click_ad_id = imp_ad_id AND "
        "click_time BETWEEN imp_time AND imp_time + interval 5 minutes"))
    ```

    Spark 4.2 adds `update` output mode for non-outer stream-stream joins
    (SPARK-56384) and integrates a new state format for stream-stream
    joins (V4, SPARK-55628).

