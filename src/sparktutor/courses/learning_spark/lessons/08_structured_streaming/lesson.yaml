    ## Real-Time Mode

    Micro-batches pay a fixed scheduling cost per batch, which puts a floor
    under latency. **Real-Time Mode** (Scala in 4.1, PySpark in 4.2 via
    SPARK-54660) runs long-lived batches whose tasks process records as they
    arrive and stream results to the sink, with checkpoints at each batch
    boundary:

    ```python
    query = (kafka_df
        .selectExpr("CAST(key AS STRING) AS k", "CAST(value AS STRING) AS v")
        .where("v IS NOT NULL")
        .writeStream
        .format("kafka")
        .option("kafka.bootstrap.servers", "broker:9092")
        .option("topic", "clean-events")
        .option("checkpointLocation", "/checkpoints/rtm")
        .outputMode("update")
        .trigger(realTime="5 seconds")
        .start())
    ```

    The constraints in 4.2.0, from the source:

    - **Sources**: the source must support real-time reads; in the
      built-in connectors that is **Kafka**.
    - **Sinks**: Kafka, `foreach`, and console (an allowlist checked at
      start; `spark.sql.streaming.realTimeMode.allowlistCheck`).
    - **Output mode**: `update` only.
    - **Operators**: stateless ones (project, filter, explode, union,
      broadcast joins against static data, watermarks); stateful
      aggregations are not on the allowlist.
    - **Batch duration**: at least
      `spark.sql.streaming.realTimeMode.minBatchDuration` (default 5s); this
      is the checkpoint interval, not the latency.
    - Async progress tracking must be off.

