  Output: |
    ## 读取数据：选项与格式

    `option()` 方法配置 Spark 如何读取文件。对于 CSV：

    - `header` —— 第一行是否为列名（true/false）
    - `inferSchema` —— 是否扫描文件来检测类型（true/false）
    - `sep` —— 字段分隔符（默认逗号）
    - `nullValue` —— 视为 null 的字符串

    CSV 之外的常见格式：**JSON**（半结构化）、**Parquet**
    （列式存储、压缩 —— Spark 首选格式）和 **ORC**（与 Parquet 类似，
    在 Hive 生态中流行）。

    我们将在下一节关于数据源的课程中深入探讨所有这些格式。

- Class: text
  Depth: advanced
  Output: |
    ## 为什么 inferSchema 有代价

    当你对 CSV 或 JSON 设置 `inferSchema=true` 时，Spark 会对数据
    做**两遍**扫描：一遍采样行并推断类型，另一遍实际加载数据。
    对于大文件，这会使读取时间翻倍。

    在生产环境中，始终用 `StructType` 显式定义 schema。你将在下一节
    课程中学到如何做。目前，`inferSchema` 适合探索和小数据集。

