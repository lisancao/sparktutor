    ## SparkSession: The Unified Entry Point

    Starting in Spark 2.0, `SparkSession` replaced the older SparkContext,
    SQLContext, and HiveContext. You create one with the **builder pattern**:

    ```python
    from pyspark.sql import SparkSession

    spark = (SparkSession.builder
        .appName("MyApp")
        .master("local[*]")
        .config("spark.some.option", "value")
        .getOrCreate())
    ```

    The `master` setting controls where Spark runs:
    - `local[*]` — use all local CPU cores (great for development)
    - `local[4]` — use exactly 4 cores
    - `spark://host:7077` — connect to a Standalone cluster
    - `k8s://...` — connect to a Kubernetes cluster

    `getOrCreate()` either creates a new session or returns the existing one,
    so calling it multiple times is safe.

    **Docs:** [SparkSession](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.SparkSession.html)
    — builder pattern, `appName()`, `master()`, `config()`, `getOrCreate()`.

