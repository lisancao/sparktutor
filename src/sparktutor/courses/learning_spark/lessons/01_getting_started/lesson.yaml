    ## What Is Apache Spark?

    Apache Spark is a **unified analytics engine** for large-scale data
    processing. It handles SQL queries, streaming data, machine learning, and
    graph processing through a single framework.

    Spark's key idea is **in-memory processing**. The earlier MapReduce
    model writes intermediate results to disk after every step. Spark keeps
    data in memory across operations, which makes iterative workloads (like
    ML training) dramatically faster.

    Spark provides APIs in Python, Scala, Java, and R (SparkR is deprecated
    in 4.x). Throughout this course we use PySpark, the Python API. PySpark
    drives the same JVM-based engine, so you get full Spark performance
    while writing Python.

- Class: text
