    ## The Execution Model in Detail

    When you call an action, Spark's execution engine kicks in:

    1. **DAG Scheduler** — analyzes the chain of transformations and builds a
       Directed Acyclic Graph (DAG). It breaks the DAG into stages at
       **shuffle boundaries** — points where data must be redistributed
       across partitions.

    2. **Task Scheduler** — takes each stage and creates tasks (one per
       partition), then assigns them to available executors.

    **Narrow vs. Wide Transformations:**
    - **Narrow** (e.g., `map`, `filter`, `select`) — each input partition
      contributes to exactly one output partition. No data movement.
    - **Wide** (e.g., `groupBy`, `join`, `repartition`) — input partitions
      contribute to multiple output partitions. Requires a **shuffle** —
      expensive network I/O.

    **Lazy Evaluation:**
    Transformations build up a logical plan. Only actions trigger execution.
    This lets Spark's Catalyst optimizer analyze the entire pipeline and
    rewrite it before generating code — predicate pushdown, column pruning,
    join reordering — all happen transparently.

