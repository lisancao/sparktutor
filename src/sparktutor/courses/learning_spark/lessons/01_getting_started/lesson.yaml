    ## Spark Architecture

    A Spark application has four core components:

    - **Driver Program** — runs your `main()` function, creates the
      SparkSession, and coordinates execution across the cluster.
    - **Cluster Manager** — allocates resources. Options include Standalone,
      YARN, Mesos, and Kubernetes.
    - **Worker Nodes** — machines in the cluster that host Executors.
    - **Executors** — JVM processes on workers that run tasks and cache data.

    The execution hierarchy:

    ```
    Application  →  Jobs  →  Stages  →  Tasks
    ```

    A **job** is triggered by an action (e.g., `show()`, `count()`). Jobs are
    divided into **stages** at shuffle boundaries. Stages contain **tasks** —
    one per data partition — that run in parallel across executors.

