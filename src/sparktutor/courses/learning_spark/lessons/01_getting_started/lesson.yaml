    ## Reading Data: Options and Formats

    The `option()` method configures how Spark reads files. For CSV:

    - `header`: first row contains column names (true/false)
    - `inferSchema`: scan the file to detect types (true/false)
    - `sep`: field delimiter (default: comma)
    - `nullValue`: string to treat as null

    Common formats beyond CSV: **JSON** (semi-structured), **Parquet**
    (columnar, compressed; Spark's default format), **ORC** (similar to
    Parquet, popular in Hive ecosystems), and **XML**, which has been a
    built-in source since Spark 4.0.

    We will explore all of these in depth in the lesson on Data Sources.

- Class: text
  Depth: advanced
  Output: |
    ## Why inferSchema Costs You

    When you set `inferSchema=true` on CSV, Spark makes an extra pass over
    the data to infer types before it actually loads it. JSON has no
    `inferSchema` option; it always infers a schema unless you pass one, so
    it pays the same extra pass. For large files that pass can cost as much
    as the read itself.

    In production, define schemas explicitly with `StructType` or a DDL
    string such as `"State STRING, Color STRING, Count INT"`. You will learn
    how in the next lesson. For now, `inferSchema` is fine for exploration
    and small datasets.

    ANSI mode adds a second reason. If a schema says `INT` and a later
    transformation casts a value like `"n/a"` to it, Spark 4.x fails the
    query with `CAST_INVALID_INPUT` instead of producing a silent null.
    Explicit schemas plus `try_cast` at the edges keep those failures
    intentional.

