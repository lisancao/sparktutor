    ## Reading Data

    Spark reads data through the **DataFrameReader** API. The most common
    pattern:

    ```python
    df = (spark.read
        .format("csv")
        .option("header", "true")
        .option("inferSchema", "true")
        .load("/path/to/file.csv"))
    ```

    Or using the shorthand:

    ```python
    df = spark.read.csv("/path/to/file.csv", header=True, inferSchema=True)
    ```

    This gives you a **DataFrame** — a distributed table with named, typed
    columns. Think of it as a spreadsheet that can span thousands of machines.

    **Docs:** [DataFrameReader.csv](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameReader.csv.html)
    — all parameters for `header`, `inferSchema`, `schema`, `sep`, `nullValue`, etc.

