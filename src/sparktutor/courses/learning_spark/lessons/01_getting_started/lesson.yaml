    ## Spark 4.x at a Glance

    If you learned Spark on 3.x, these are the platform changes that matter
    in day-to-day work:

    - **Runtime**: Spark 4.2 runs on Java 17, 21, or 25, Scala 2.13, and
      Python 3.10+. Java 8 and 11 are gone.
    - **ANSI SQL mode is on by default** (since 4.0). Invalid casts,
      integer overflow, and division by zero raise errors instead of
      silently returning `NULL`. Use `try_cast`, `try_divide`, and the other
      `try_*` functions when you want the lenient behaviour.
    - **Spark Connect** is a first-class client-server mode. A thin Python
      client sends query plans to a remote Spark server over gRPC.
    - **Arrow everywhere in PySpark**. In 4.2, Arrow-based data exchange
      (`toPandas`, `createDataFrame` from pandas) and Arrow-optimized Python
      UDFs are on by default (SPARK-54555).

    Install the version this course targets. First install a JDK (Java 17
    or 21, for example Eclipse Temurin) and check that `java -version` works
    or that `JAVA_HOME` is set. Then install PySpark in a virtual
    environment, since many systems block global `pip` installs:

    ```bash
    python3 -m venv .venv
    source .venv/bin/activate
    pip install "pyspark[connect]==4.2.0"
    ```

    The `pyspark` package bundles the Spark jars and runs them on that JDK.
    The `connect` extra pulls in the gRPC, pandas, and PyArrow dependencies
    Spark Connect needs. The separate `pyspark-client` package is a
    Connect-only client that needs no Java; use it when you only talk to a
    remote Spark Connect server.

    **Docs:** [Spark 4.2.0 overview](https://spark.apache.org/docs/4.2.0/) |
    [ANSI compliance](https://spark.apache.org/docs/4.2.0/sql-ref-ansi-compliance.html)

