    ## Reading Data: Options and Formats

    The `option()` method configures how Spark reads files. For CSV:

    - `header` — first row contains column names (true/false)
    - `inferSchema` — scan the file to detect types (true/false)
    - `sep` — field delimiter (default: comma)
    - `nullValue` — string to treat as null

    Common formats beyond CSV: **JSON** (semi-structured), **Parquet**
    (columnar, compressed — Spark's preferred format), and **ORC** (similar
    to Parquet, popular in Hive ecosystems).

    We will explore all of these in depth in the next lesson on Data Sources.

