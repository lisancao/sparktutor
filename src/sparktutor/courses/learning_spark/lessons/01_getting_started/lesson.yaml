    ## Aggregations and Filtering

    Once you have a DataFrame, you can analyze it with transformations:

    ```python
    from pyspark.sql import functions as f

    result = (df
        .groupBy("State", "Color")
        .agg(f.sum("Count").alias("Total"))
        .orderBy(f.col("Total").desc()))
    ```

    Breaking this down:
    - `groupBy("State", "Color")` — groups rows by unique combinations
    - `agg(f.sum("Count").alias("Total"))` — sums the Count column, names
      it "Total"
    - `orderBy(f.col("Total").desc())` — sorts descending by Total

    `filter()` and `where()` select rows matching a condition:

    ```python
    ca_only = result.filter(f.col("State") == "CA")
    ```

    **Docs:**
    [f.col](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.col.html) |
    [f.sum](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.sum.html) |
    [DataFrame.groupBy](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.groupBy.html) |
    [Column.alias](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.Column.alias.html)

