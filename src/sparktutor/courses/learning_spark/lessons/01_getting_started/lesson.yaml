  Output: |
    ## 什么是 Apache Spark？

    Apache Spark 是一个面向大规模数据处理的**统一分析引擎**。
    它通过单一框架处理 SQL 查询、流数据、机器学习和图计算。

    Spark 的核心创新是**内存计算**。早期的 MapReduce 模型在每一步
    都将中间结果写入磁盘。Spark 在操作之间将数据保留在内存中，
    这使得迭代式工作负载（如机器学习训练）速度提升 10-100 倍。

    Spark 提供 Python、Scala、Java 和 R 的 API。本课程全程使用
    PySpark —— 即 Python API。在底层，PySpark 与同一个基于 JVM 的
    引擎通信，因此你在编写 Python 的同时能获得完整的 Spark 性能。

- Class: text
  Depth: beginner
  Output: |
    ## 类比：把 Spark 想象成餐厅后厨

    把 Spark 想象成一个繁忙的餐厅后厨：

    - **Driver（驱动程序）** 是**主厨** —— 它读取订单（你的代码），
      规划步骤，并协调谁做什么。它自己不做菜。
    - **Executor（执行器）** 是**后厨厨师** —— 它们在分配到的数据
      分片上做实际工作：切配、烹饪、摆盘。
    - **Cluster Manager（集群管理器）** 是**餐厅经理** —— 它决定
      有多少厨师可用并分配资源。

    当你提交一个 Spark 作业时，主厨（Driver）将其拆分成多个任务，
    交给后厨厨师（Executor），他们并行工作以快速产出结果。
    厨师越多 = 并行度越高 = 结果越快。

- Class: text
  Depth: all
  Output: |
    ## Spark 架构

    一个 Spark 应用有四个核心组件：

    - **Driver Program（驱动程序）** —— 运行你的 `main()` 函数，
      创建 SparkSession，并协调整个集群的执行。
    - **Cluster Manager（集群管理器）** —— 分配资源。可选方案包括
      Standalone、YARN、Mesos 和 Kubernetes。
    - **Worker Nodes（工作节点）** —— 集群中托管 Executor 的机器。
    - **Executors（执行器）** —— Worker 上运行任务并缓存数据的
      JVM 进程。

    执行层级：

    ```
    Application  →  Jobs  →  Stages  →  Tasks
    ```

    一个 **job** 由一个 action 触发（例如 `show()`、`count()`）。
    Job 在 shuffle 边界处被划分为多个 **stage**。Stage 包含多个
    **task** —— 每个数据分区一个 —— 它们在各个 executor 上并行运行。

- Class: text
