    ## Why inferSchema Costs You

    When you set `inferSchema=true` on CSV or JSON, Spark makes **two passes**
    over the data: one to sample rows and infer types, another to actually
    load. For large files this doubles read time.

    In production, always define schemas explicitly with `StructType`. You
    will learn how in the next lesson. For now, `inferSchema` is fine for
    exploration and small datasets.

