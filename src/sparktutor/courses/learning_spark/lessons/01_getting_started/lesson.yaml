    ## SparkSession：统一的入口

    从 Spark 2.0 开始，`SparkSession` 取代了旧的 SparkContext、
    SQLContext 和 HiveContext。你通过**建造者模式**创建它：

    ```python
    from pyspark.sql import SparkSession

    spark = (SparkSession.builder
        .appName("MyApp")
        .master("local[*]")
        .config("spark.some.option", "value")
        .getOrCreate())
    ```

    `master` 设置控制 Spark 在哪里运行：
    - `local[*]` —— 使用所有本地 CPU 核心（适合开发）
    - `local[4]` —— 恰好使用 4 个核心
    - `spark://host:7077` —— 连接到 Standalone 集群
    - `k8s://...` —— 连接到 Kubernetes 集群

    `getOrCreate()` 会创建新会话或返回已存在的会话，因此多次调用
    是安全的。

    **文档：** [SparkSession](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.SparkSession.html)
    —— 建造者模式、`appName()`、`master()`、`config()`、`getOrCreate()`。

