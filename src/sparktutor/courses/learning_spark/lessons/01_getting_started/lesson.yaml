    ## Spark Classic vs. Spark Connect

    PySpark 4.x can reach the engine in two ways:

    **Spark Classic**: your Python process starts (or attaches to) the
    driver JVM and talks to it through Py4J. This is what `.master(...)`
    gives you, and what `spark-submit` runs.

    **Spark Connect**: your Python process is a thin client. It builds an
    unresolved logical plan, serializes it with protocol buffers, and sends
    it over gRPC to a Spark Connect server, which plans and runs it. Results
    come back as Arrow batches.

    ```python
    # Remote server (default port 15002)
    spark = SparkSession.builder.remote("sc://spark-host:15002").getOrCreate()

    # Local Connect server started for you, handy for testing
    spark = SparkSession.builder.remote("local[*]").getOrCreate()

    # Switch an existing Classic app to Connect with one config
    spark = (SparkSession.builder
        .config("spark.api.mode", "connect")
        .master("local[*]")
        .getOrCreate())
    ```

    The DataFrame and SQL APIs are the same in both modes. What you lose in
    Connect is anything that reaches into the driver JVM: `sparkContext`,
    RDDs, and private handles like `df._jdf`. Lesson 11 covers Connect in
    depth.

