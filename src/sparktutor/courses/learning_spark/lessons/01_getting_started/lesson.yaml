    ## The Execution Model in Detail

    When you call an action, Spark's execution engine kicks in:

    1. **DAG Scheduler**: analyzes the chain of transformations and builds a
       Directed Acyclic Graph (DAG). It breaks the DAG into stages at
       **shuffle boundaries**, points where data must be redistributed
       across partitions.

    2. **Task Scheduler**: takes each stage and creates tasks (one per
       partition), then assigns them to available executors.

    **Narrow vs. Wide Transformations:**
    - **Narrow** (e.g., `select`, `filter`, `withColumn`): each input
      partition contributes to exactly one output partition. No data
      movement.
    - **Wide** (e.g., `groupBy`, `join`, `repartition`): input partitions
      contribute to multiple output partitions. Requires a **shuffle**,
      which means expensive network and disk I/O.

    **Lazy Evaluation:**
    Transformations build up a logical plan. Only actions trigger execution.
    This lets Spark's Catalyst optimizer analyze the entire pipeline and
    rewrite it before generating code; predicate pushdown and column
    pruning both happen transparently.

    With Adaptive Query Execution (on by default since 3.2), planning does
    not stop when the job starts. At each shuffle boundary Spark looks at the
    real shuffle statistics and can re-plan the rest of the query. Lessons 5
    and 6 show what that looks like in a plan.

    Spark Connect does not change any of this. The client only builds the
    plan; analysis, optimization, and scheduling all happen on the server,
    exactly as in Classic mode.

