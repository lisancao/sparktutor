    ## Summary

    In this lesson you learned:

    - **What Spark is**: a unified analytics engine with in-memory processing
    - **Spark architecture**: the Driver coordinates, Executors do the work,
      the Cluster Manager (Standalone, YARN, Kubernetes) assigns resources
    - **Spark 4.x platform**: Java 17/21/25, Scala 2.13, Python 3.10+, ANSI
      mode on by default, Arrow on by default for PySpark data exchange
    - **Classic vs. Connect**: `.master()` runs Spark in-process through
      Py4J; `.remote()` talks to a Spark Connect server over gRPC
    - **SparkSession**: the entry point, created with the builder pattern
    - **Reading data**: `spark.read.csv()` with options like header and
      inferSchema
    - **Aggregations**: `groupBy`, `agg`, `orderBy` for data analysis
    - **Filtering**: `filter()` to narrow results

    You wrote your first complete Spark program. In the next lesson, you
    will learn how DataFrames work under the hood: schemas, column
    expressions, and the type system that makes Spark reliable at scale.
