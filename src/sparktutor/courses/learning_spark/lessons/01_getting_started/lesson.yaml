    ## SparkSession: The Unified Entry Point

    `SparkSession` (since Spark 2.0) replaced the older SparkContext,
    SQLContext, and HiveContext as the entry point. You create one with the
    **builder pattern**:

    ```python
    from pyspark.sql import SparkSession

    spark = (SparkSession.builder
        .appName("MyApp")
        .master("local[*]")
        .config("spark.sql.shuffle.partitions", "8")
        .getOrCreate())

    print(spark.version)   # '4.2.0'
    ```

    The `master` setting controls where Spark runs:
    - `local[*]`: use all local CPU cores (great for development)
    - `local[4]`: use exactly four cores
    - `spark://host:7077`: connect to a Standalone cluster
    - `yarn`: submit to a Hadoop YARN cluster
    - `k8s://https://host:port`: run on Kubernetes

    `getOrCreate()` either creates a new session or returns the existing one,
    so calling it multiple times is safe.

    **Docs:** [SparkSession](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.SparkSession.html)
    (builder pattern, `appName()`, `master()`, `remote()`, `config()`,
    `getOrCreate()`).

