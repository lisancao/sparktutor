    ## 读取数据

    Spark 通过 **DataFrameReader** API 读取数据。最常见的模式：

    ```python
    df = (spark.read
        .format("csv")
        .option("header", "true")
        .option("inferSchema", "true")
        .load("/path/to/file.csv"))
    ```

    或者使用简写：

    ```python
    df = spark.read.csv("/path/to/file.csv", header=True, inferSchema=True)
    ```

    这会得到一个 **DataFrame** —— 一张具有命名类型化列的分布式表。
    可以把它想象成一张能横跨数千台机器的电子表格。

    **文档：** [DataFrameReader.csv](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrameReader.csv.html)
    —— `header`、`inferSchema`、`schema`、`sep`、`nullValue` 等全部参数。

- Class: text
  Depth: all
  Output: |
    ## 聚合与过滤

    一旦有了 DataFrame，就可以用转换来分析数据：

    ```python
    from pyspark.sql import functions as f

    result = (df
        .groupBy("State", "Color")
        .agg(f.sum("Count").alias("Total"))
        .orderBy(f.col("Total").desc()))
    ```

    逐一拆解：
    - `groupBy("State", "Color")` —— 按唯一组合对行分组
    - `agg(f.sum("Count").alias("Total"))` —— 对 Count 列求和，
      命名为 "Total"
    - `orderBy(f.col("Total").desc())` —— 按 Total 降序排列

    `filter()` 和 `where()` 选择满足条件的行：

    ```python
    ca_only = result.filter(f.col("State") == "CA")
    ```

    **文档：**
    [f.col](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.col.html) |
    [f.sum](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.sum.html) |
    [DataFrame.groupBy](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.groupBy.html) |
    [Column.alias](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.Column.alias.html)

