    ## What Is Apache Spark?

    Apache Spark is a **unified analytics engine** for large-scale data
    processing. It handles SQL queries, streaming data, machine learning, and
    graph processing — all through a single framework.

    Spark's key innovation is **in-memory processing**. The earlier MapReduce
    model writes intermediate results to disk after every step. Spark keeps
    data in memory across operations, which can make iterative workloads
    (like ML training) 10-100x faster.

    Spark provides APIs in Python, Scala, Java, and R. Throughout this course
    we use PySpark — the Python API. Under the hood, PySpark communicates
    with the same JVM-based engine, so you get full Spark performance while
    writing Python.

