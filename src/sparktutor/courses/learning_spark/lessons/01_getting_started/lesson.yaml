    ## Analogy: Spark as a Restaurant Kitchen

    Think of Spark like a busy restaurant kitchen:

    - The **Driver** is the **head chef**. It reads the order (your code),
      plans the steps, and coordinates who does what. It does not cook
      the food itself.
    - **Executors** are the **line cooks**. They do the actual work on their
      assigned portion of the data: slicing, grilling, plating.
    - The **Cluster Manager** is the **restaurant manager**. It decides how
      many cooks are available and assigns resources.

    When you submit a Spark job, the head chef (Driver) breaks it into tasks
    and hands them to line cooks (Executors), who work in parallel to get
    the result out fast. More cooks means more parallelism and faster
    results.

    Spark Connect (later in this lesson) adds a waiter: you place your order
    from the dining room, and the waiter carries it to the kitchen. You never
    have to stand in the kitchen yourself.

