    把 ML 管道想象成一条工厂装配线。原材料（数据）从一端进入，
    经过各个工位被塑形和准备：一个工位将类别转换为数字，
    另一个将特征组装成一个整体包。最后一个工位（模型）
    从准备好的数据中学习模式并产生预测。

    Spark 的 Pipeline API 自动化了整个流程，让你能够可靠地复现它。

- Class: text
  Depth: all
  Output: |
    ## ML 管道抽象

    MLlib 有三个核心概念：

    **Transformer** —— 接收一个 DataFrame，产生带有额外列的
    新 DataFrame。示例：模型预测、特征编码器。
    所有 transformer 都有一个 `.transform(df)` 方法。

    **Estimator** —— 从数据中学习并产生一个 Transformer。示例：
    训练算法如 `LinearRegression`，特征学习器如 `StringIndexer`。
    所有 estimator 都有一个 `.fit(df)` 方法。

    **Pipeline** —— 将多个 Transformer 和 Estimator 链接成一个
    工作流。当你调用 `pipeline.fit(train_df)` 时，它按顺序运行每个
    阶段，拟合 estimator 并将结果传递下去。

    ```
    Estimator.fit(data)  →  Transformer (trained model)
    Transformer.transform(data)  →  DataFrame with predictions
    ```

    **文档：** [MLlib Guide](https://spark.apache.org/docs/3.5.0/ml-guide.html) |
    [ML Pipelines](https://spark.apache.org/docs/3.5.0/ml-pipeline.html)
    —— Transformer/Estimator 模式、`Pipeline.fit()`、
    `PipelineModel.transform()` 以及阶段链接。

- Class: text
