    Think of an ML pipeline like a factory assembly line. Raw materials
    (data) enter one end and pass through stations that shape and prepare
    them: one station converts categories to numbers, another assembles
    features into a single package. The final station (the model) learns
    patterns from the prepared data and produces predictions.

    Spark's Pipeline API automates this entire flow so you can reproduce
    it reliably.

