    ## Feature Preparation

    ML models require numeric input vectors. Real-world data has strings,
    categories, and multiple columns. MLlib provides stages to handle this:

    **StringIndexer**: converts string columns to numeric indices (the most
    frequent value gets 0.0 by default):
    ```python
    from pyspark.ml.feature import StringIndexer

    indexer = StringIndexer(inputCol="city", outputCol="cityIndex",
                            handleInvalid="keep")
    ```

    **OneHotEncoder**: converts indices to sparse binary vectors (for linear
    models, which would otherwise read the index as an ordered number):
    ```python
    from pyspark.ml.feature import OneHotEncoder

    encoder = OneHotEncoder(inputCol="cityIndex", outputCol="cityVec")
    ```

    **VectorAssembler**: combines multiple feature columns into a single
    `features` vector (the input every MLlib model expects):
    ```python
    from pyspark.ml.feature import VectorAssembler

    assembler = VectorAssembler(
        inputCols=["age", "income", "cityVec"],
        outputCol="features")
    ```

    `handleInvalid` decides what happens to a category seen at prediction
    time but not during training: `error` (default), `skip` the row, or
    `keep` it in an extra bucket.

    **Docs:**
    [VectorAssembler](https://spark.apache.org/docs/4.2.0/api/python/reference/api/pyspark.ml.feature.VectorAssembler.html) |
    [StringIndexer](https://spark.apache.org/docs/4.2.0/api/python/reference/api/pyspark.ml.feature.StringIndexer.html) |
    [OneHotEncoder](https://spark.apache.org/docs/4.2.0/api/python/reference/api/pyspark.ml.feature.OneHotEncoder.html)

