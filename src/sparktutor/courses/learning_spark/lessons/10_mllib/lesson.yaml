    ## Evaluating Models

    After generating predictions, measure how good they are:

    ```python
    from pyspark.ml.evaluation import RegressionEvaluator

    evaluator = RegressionEvaluator(
        labelCol="price",
        predictionCol="prediction")

    rmse = evaluator.setMetricName("rmse").evaluate(predictions)
    r2 = evaluator.setMetricName("r2").evaluate(predictions)
    mae = evaluator.setMetricName("mae").evaluate(predictions)
    ```

    - **RMSE** (Root Mean Squared Error) — penalizes large errors more;
      lower is better
    - **R2** (Coefficient of Determination) — how much variance the model
      explains; closer to 1.0 is better
    - **MAE** (Mean Absolute Error) — average error magnitude; lower is
      better

