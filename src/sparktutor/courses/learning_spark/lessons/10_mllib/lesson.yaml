    ## MLflow Integration

    For production ML, track experiments with MLflow (a separate project
    you install alongside PySpark):

    ```python
    import mlflow
    import mlflow.spark

    with mlflow.start_run():
        mlflow.log_param("num_trees", 20)
        model = pipeline.fit(train_df)
        predictions = model.transform(test_df)
        rmse = evaluator.setMetricName("rmse").evaluate(predictions)
        mlflow.log_metric("rmse", rmse)
        mlflow.spark.log_model(model, "model")
    ```

    MLflow provides a UI to compare runs, a model registry for deployment,
    and reproducible experiment tracking. Check that your MLflow version
    supports Spark Connect models before logging them from a Connect
    session.

