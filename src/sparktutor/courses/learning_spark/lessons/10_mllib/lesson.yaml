    ## What You'll Learn

    This is the final lesson of the course. You have learned to read data,
    transform it, optimize queries, process streams, and store results in
    reliable lakehouse tables. Now you will use these skills to build
    **machine learning pipelines** with Spark MLlib.

    By the end of this lesson you will be able to:

