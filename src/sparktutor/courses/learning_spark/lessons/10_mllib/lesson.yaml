    ## Course Summary

    You have reached the end of the core course. Here is everything you
    learned:

    1. **Getting Started**: SparkSession, architecture, Spark 4.x defaults,
       Classic vs. Connect
    2. **DataFrames & Schemas**: immutable tables, StructType and DDL,
       VARIANT, ANSI mode
    3. **Data Sources**: CSV, JSON, Parquet, ORC, XML, Python data sources
    4. **Complex Types & HOFs**: arrays, maps, transform, filter,
       aggregate, VARIANT
    5. **Spark SQL**: Catalyst, execution plans, pipe syntax, QUALIFY,
       scripting, Arrow UDFs
    6. **Optimization**: caching, partitioning, AQE, the 4.2 Spark UI
    7. **Joins**: broadcast, sort-merge, shuffled hash, hints, skew,
       nearest-by joins
    8. **Streaming**: sources, sinks, watermarks, transformWithState,
       Real-Time Mode
    9. **Data Lakes**: ACID transactions, schema evolution, time travel,
       CDC
    10. **MLlib**: pipelines, feature prep, training, evaluation, ML on
        Connect

    The final lesson takes a closer look at **Spark Connect**, the
    client-server architecture that runs everything you have learned from a
    thin client. After that, the Spark Declarative Pipelines course is a
    natural next step to apply these skills to production-grade data
    engineering.
