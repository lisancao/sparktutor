    ## MLlib on Spark Connect

    Since Spark 4.0 (SPARK-49907), `pyspark.ml` works over Spark Connect
    with no code changes. The pipeline in this lesson runs as-is against
    `SparkSession.builder.remote(...)`.

    What happens underneath is different from Classic mode:

    - `fit()` sends the estimator and its parameters to the server, which
      trains the model there. The client gets back a **reference** to a
      server-side model object, not the model's weights.
    - `transform()` on that model adds a plan node that the server
      resolves against the cached model.
    - Model attributes (`featureImportances`, `coefficients`, summaries)
      are fetched from the server when you access them.
    - `save()` / `load()` read and write on the server's filesystem.

    Because models live in a per-session cache on the server, 4.1 added
    controls for it under
    `spark.connect.session.connectML.mlCache.memoryControl.*`: models
    beyond `maxInMemorySize` are offloaded to the driver's local disk, a
    single model is capped by `maxModelSize` (default 1g), and the total
    cache by `maxStorageSize` (default 10g). Very large models (big tree
    ensembles, wide feature hashing) are where you will meet these limits.

    The RDD-based `pyspark.mllib` API is not available over Connect.

