    ## The ML Pipeline Abstraction

    MLlib's DataFrame-based API (`pyspark.ml`) has three core concepts:

    **Transformer**: takes a DataFrame and produces a new DataFrame with
    additional columns. Examples: trained models, feature encoders.
    All transformers have a `.transform(df)` method.

    **Estimator**: learns from data and produces a Transformer. Examples:
    training algorithms like `LinearRegression`, feature learners like
    `StringIndexer`. All estimators have a `.fit(df)` method.

    **Pipeline**: chains multiple Transformers and Estimators into a
    single workflow. When you call `pipeline.fit(train_df)`, it runs each
    stage in order, fitting estimators and passing results forward. The
    result is a `PipelineModel`, itself a Transformer.

    ```
    Estimator.fit(data)          ->  Transformer (trained model)
    Transformer.transform(data)  ->  DataFrame with predictions
    ```

    The older RDD-based `pyspark.mllib` package has been in maintenance mode
    for years and, because it is built on RDDs, does not work under Spark
    Connect. Use `pyspark.ml` for new code.

    **Docs:** [MLlib Guide](https://spark.apache.org/docs/4.2.0/ml-guide.html) |
    [ML Pipelines](https://spark.apache.org/docs/4.2.0/ml-pipeline.html)

