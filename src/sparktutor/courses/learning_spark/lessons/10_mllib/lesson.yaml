    ## Feature Preparation

    ML models require numeric input vectors. Real-world data has strings,
    categories, and multiple columns. MLlib provides stages to handle this:

    **StringIndexer** — converts string columns to numeric indices:
    ```python
    from pyspark.ml.feature import StringIndexer

    indexer = StringIndexer(inputCol="city", outputCol="cityIndex")
    ```

    **OneHotEncoder** — converts indices to binary vectors (for linear
    models):
    ```python
    from pyspark.ml.feature import OneHotEncoder

    encoder = OneHotEncoder(inputCol="cityIndex", outputCol="cityVec")
    ```

    **VectorAssembler** — combines multiple feature columns into a single
    `features` vector (required by all MLlib models):
    ```python
    from pyspark.ml.feature import VectorAssembler

    assembler = VectorAssembler(
        inputCols=["age", "income", "cityVec"],
        outputCol="features")
    ```

    **Docs:**
    [VectorAssembler](https://spark.apache.org/docs/3.5.0/api/python/reference/api/pyspark.ml.feature.VectorAssembler.html) |
    [StringIndexer](https://spark.apache.org/docs/3.5.0/api/python/reference/api/pyspark.ml.feature.StringIndexer.html) |
    [OneHotEncoder](https://spark.apache.org/docs/3.5.0/api/python/reference/api/pyspark.ml.feature.OneHotEncoder.html)
    — `inputCol`, `outputCol`, `inputCols`, `handleInvalid` parameters.

