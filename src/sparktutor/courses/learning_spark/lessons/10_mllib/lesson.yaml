    ## 保存与加载模型

    训练好的模型是可序列化的 —— 保存以备后用：

    ```python
    # Save
    model.write().overwrite().save("/models/price_predictor")

    # Load
    from pyspark.ml import PipelineModel
    loaded_model = PipelineModel.load("/models/price_predictor")
    predictions = loaded_model.transform(new_data)
    ```

    保存的模型包含所有管道阶段（索引器、组装器、训练好的模型），
    因此加载它就能得到完整的预测管道。

- Class: text
