    ## Saving and Loading Models

    Trained models are serializable — save them for later use:

    ```python
    # Save
    model.write().overwrite().save("/models/price_predictor")

    # Load
    from pyspark.ml import PipelineModel
    loaded_model = PipelineModel.load("/models/price_predictor")
    predictions = loaded_model.transform(new_data)
    ```

    The saved model includes all pipeline stages (indexers, assemblers,
    trained model), so loading it gives you the complete prediction
    pipeline.

