    ## Cross-Validation and Hyperparameter Tuning

    Different hyperparameters (number of trees, regularization strength)
    produce different model quality. `CrossValidator` automates the search:

    ```python
    from pyspark.ml.tuning import CrossValidator, ParamGridBuilder

    paramGrid = (ParamGridBuilder()
        .addGrid(rf.numTrees, [10, 20, 50])
        .addGrid(rf.maxDepth, [5, 10, 15])
        .build())

    cv = CrossValidator(
        estimator=pipeline,
        estimatorParamMaps=paramGrid,
        evaluator=evaluator,
        numFolds=3)

    cv_model = cv.fit(train_df)
    best_model = cv_model.bestModel
    ```

    CrossValidator trains the pipeline with every parameter combination
    across k folds. With 9 combinations and 3 folds, it trains 27 models.
    This is computationally expensive but finds better hyperparameters
    than guessing.

