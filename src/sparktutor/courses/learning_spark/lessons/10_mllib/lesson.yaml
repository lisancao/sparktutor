    ## The ML Pipeline Abstraction

    MLlib has three core concepts:

    **Transformer** — takes a DataFrame and produces a new DataFrame with
    additional columns. Examples: model predictions, feature encoders.
    All transformers have a `.transform(df)` method.

    **Estimator** — learns from data and produces a Transformer. Examples:
    training algorithms like `LinearRegression`, feature learners like
    `StringIndexer`. All estimators have a `.fit(df)` method.

    **Pipeline** — chains multiple Transformers and Estimators into a
    single workflow. When you call `pipeline.fit(train_df)`, it runs each
    stage in order, fitting estimators and passing results forward.

    ```
    Estimator.fit(data)  →  Transformer (trained model)
    Transformer.transform(data)  →  DataFrame with predictions
    ```

    **Docs:** [MLlib Guide](https://spark.apache.org/docs/3.5.0/ml-guide.html) |
    [ML Pipelines](https://spark.apache.org/docs/3.5.0/ml-pipeline.html)
    — Transformer/Estimator pattern, `Pipeline.fit()`, `PipelineModel.transform()`,
    and stage chaining.

