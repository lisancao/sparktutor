    ## Cross-Validation and Hyperparameter Tuning

    Different hyperparameters (number of trees, regularization strength)
    produce different model quality. `CrossValidator` automates the search:

    ```python
    from pyspark.ml.tuning import CrossValidator, ParamGridBuilder

    paramGrid = (ParamGridBuilder()
        .addGrid(rf.numTrees, [10, 20, 50])
        .addGrid(rf.maxDepth, [5, 10, 15])
        .build())

    cv = CrossValidator(
        estimator=pipeline,
        estimatorParamMaps=paramGrid,
        evaluator=evaluator,
        numFolds=3,
        parallelism=4)

    cv_model = cv.fit(train_df)
    best_model = cv_model.bestModel
    ```

    CrossValidator trains the pipeline for every parameter combination in
    every fold: nine combinations over three folds is 27 fits, plus one
    final fit on the full training set. `parallelism` controls how many of
    those fits run concurrently. `TrainValidationSplit` evaluates each
    combination once on a single held-out split, which is much cheaper
    when data is plentiful.

