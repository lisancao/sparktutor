    ## What You'll Learn

    You have learned to read data, transform it, optimize queries, process
    streams, and store results in reliable lakehouse tables. Now you will
    use these skills to build **machine learning pipelines** with Spark
    MLlib.

    By the end of this lesson you will be able to:

    - Explain the Transformer/Estimator/Pipeline abstraction
    - Prepare features with StringIndexer, OneHotEncoder, VectorAssembler
    - Train a model, make predictions, and evaluate results
    - Use cross-validation for hyperparameter tuning
    - Save and load models for production use
    - Run the same pipeline over Spark Connect, which `pyspark.ml` supports
      since Spark 4.0

