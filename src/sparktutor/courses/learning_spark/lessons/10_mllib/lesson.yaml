    ## Regression and Classification Models

    MLlib includes several regression algorithms. All share the same
    API: set `labelCol` and `featuresCol`, call `fit()`, then
    `transform()`:

    - **LinearRegression**: simple, interpretable, good baseline
    - **DecisionTreeRegressor**: handles non-linear relationships,
      interpretable
    - **RandomForestRegressor**: ensemble of trees, more robust, less
      overfitting
    - **GBTRegressor**: gradient-boosted trees, often best accuracy
      but slower to train

    For classification, swap to `LogisticRegression`,
    `RandomForestClassifier`, `GBTClassifier`, etc. Same API, same Pipeline.
    Tree ensembles expose `featureImportances`, a vector with one entry per
    slot of the assembled `features` vector. It lines up with the
    assembler's `inputCols` only when every input is a single numeric
    column (a one-hot vector expands to several slots). It is the first
    thing to check when a model behaves oddly.

