    ## Building a Pipeline

    Chain all preparation stages and the model into a Pipeline:

    ```python
    from pyspark.ml import Pipeline
    from pyspark.ml.feature import StringIndexer, VectorAssembler
    from pyspark.ml.regression import RandomForestRegressor

    # Stage 1: encode categorical column
    indexer = StringIndexer(inputCol="category", outputCol="catIndex")

    # Stage 2: assemble features
    assembler = VectorAssembler(
        inputCols=["catIndex", "size", "weight"],
        outputCol="features")

    # Stage 3: train model
    rf = RandomForestRegressor(
        labelCol="price",
        featuresCol="features",
        numTrees=20)

    # Build and train
    pipeline = Pipeline(stages=[indexer, assembler, rf])
    model = pipeline.fit(train_df)
    predictions = model.transform(test_df)
    ```

    The Pipeline ensures that the same preprocessing happens during both
    training and prediction — a common source of bugs when done manually.

