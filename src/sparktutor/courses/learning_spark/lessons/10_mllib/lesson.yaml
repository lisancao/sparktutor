    ## Exercise: Build a Prediction Pipeline

    Implement `build_pipeline(spark, model_path)` that creates a complete
    ML workflow:

    1. Create the sample housing dataset with categorical and numeric
       features
    2. Split into train/test sets (80/20, seed 42)
    3. Build a Pipeline with StringIndexers for `neighborhood` and
       `condition`, a VectorAssembler over `FEATURE_COLS`, and a
       RandomForestRegressor
    4. Train the pipeline on training data
    5. Evaluate RMSE and R2 on test predictions
    6. Map the forest's `featureImportances` back to `FEATURE_COLS` as a
       dict
    7. Save the fitted model to `model_path`, load it back with
       `PipelineModel.load`, and confirm it predicts the same values
    8. Return a dict with the model, predictions, metrics, importances,
       and the loaded model

    The harness runs on Spark Classic. Because `pyspark.ml` supports Spark
    Connect, the same function runs unchanged on a Connect session.
