    ## 回归模型

    MLlib 包含多种回归算法。它们共享相同的 API ——
    设置 `labelCol` 和 `featuresCol`，调用 `fit()`，
    然后 `transform()`：

    - **LinearRegression** —— 简单、可解释、良好的基线
    - **DecisionTreeRegressor** —— 处理非线性关系，可解释
    - **RandomForestRegressor** —— 树的集成，更鲁棒，
      过拟合更少
    - **GBTRegressor** —— 梯度提升树，通常准确率最高
      但训练更慢

    对于分类，换成 `LogisticRegression`、`RandomForestClassifier` 等。
    相同的 API，相同的 Pipeline。

- Class: text
