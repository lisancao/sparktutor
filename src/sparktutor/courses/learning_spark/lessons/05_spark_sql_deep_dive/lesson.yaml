    ## Key Catalyst Optimizations

    **Predicate pushdown**: filters are pushed as close to the data source
    as possible. If you filter after a join, Catalyst moves the filter
    *before* the join (when applicable), reducing the amount of data
    shuffled.

    **Column pruning**: only columns actually used in the query are read.
    With Parquet, this means entire columns are skipped at the file level.

    **Constant folding**: expressions like `1 + 2` or `lit("a") == lit("a")`
    are evaluated at plan time, not at runtime for every row. Under ANSI
    mode this has a visible side effect: `SELECT 1/0` fails during
    optimization, before any data is read.

    **Join reordering**: with both `spark.sql.cbo.enabled` and
    `spark.sql.cbo.joinReorder.enabled` set to `true` (both are off by
    default) and table statistics collected with `ANALYZE TABLE`, Catalyst
    can rearrange multi-way joins to minimize intermediate result sizes.

    The other optimizations happen automatically. You get them for free by using
    the DataFrame API or SQL.

    **Docs:** [Spark SQL Programming Guide](https://spark.apache.org/docs/4.2.0/sql-programming-guide.html) |
    [Performance Tuning](https://spark.apache.org/docs/4.2.0/sql-performance-tuning.html)

