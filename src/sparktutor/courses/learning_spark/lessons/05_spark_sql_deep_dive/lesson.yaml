    ## More 4.x SQL Worth Knowing

    **Time bucketing** (4.2, SPARK-56594): `time_bucket` returns the start
    of the fixed-size interval a timestamp falls into, optionally aligned to
    an origin:

    ```sql
    SELECT time_bucket(INTERVAL '15' MINUTE, event_time) AS bucket, COUNT(*)
    FROM events GROUP BY 1
    ```

    Unlike `window()`, it is a plain scalar function, so it works in any
    `SELECT`, `GROUP BY`, or join condition.

    **Session variables** (4.0): `DECLARE VARIABLE min_sal DOUBLE DEFAULT
    90000;` then `SELECT name FROM employees WHERE salary > min_sal`.
    `SET VAR min_sal = 100000` changes it.

    **EXECUTE IMMEDIATE** (4.0) runs a SQL string with bound parameters:
    `EXECUTE IMMEDIATE 'SELECT count(*) FROM employees WHERE department = ?' USING 'Sales'`.

    **Collations** (4.0): `WHERE name = 'alice' COLLATE UTF8_LCASE` compares
    case-insensitively; 4.2 adds `SHOW COLLATIONS`.

    **Top-k aggregates** (4.2): `max_by(name, salary, 3)` returns the three
    highest-paid names as an array.

