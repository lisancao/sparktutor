    ## User-Defined Functions (UDFs)

    When built-in functions are not enough, you can write custom logic
    with UDFs:

    ```python
    from pyspark.sql.functions import udf

    @udf(returnType="string")
    def normalize_name(name):
        return name.strip().title() if name else None

    df.withColumn("clean_name", normalize_name(col("name")))
    spark.udf.register("normalize_name", normalize_name)   # use from SQL
    ```

    **What changed in Spark 4.2**: regular Python UDFs are
    **Arrow-optimized by default** (SPARK-54555;
    `spark.sql.execution.pythonUDF.arrow.enabled` now defaults to `true`).
    Rows move between the JVM and the Python worker in Arrow columnar
    batches instead of being pickled one by one. In a plan you will see
    `ArrowEvalPython` where 4.1 showed `BatchEvalPython`. Your function body
    does not change; you opt out per UDF with `@udf(..., useArrow=False)`.
    Python UDTFs are Arrow-optimized by default in 4.2 as well.

    Two vectorized alternatives process a whole batch per call:

    ```python
    import pandas as pd
    import pyarrow as pa
    import pyarrow.compute as pc
    from pyspark.sql.functions import pandas_udf, arrow_udf

    @pandas_udf("string")
    def upper_pd(s: pd.Series) -> pd.Series:
        return s.str.upper()

    @arrow_udf("string")                     # since 4.1
    def upper_arrow(s: pa.Array) -> pa.Array:
        return pc.utf8_upper(s)
    ```

    **Tradeoffs that still hold:**
    - UDFs are **opaque** to Catalyst; the optimizer cannot push filters
      through them or reason about their output
    - Every UDF call still crosses the JVM-to-Python boundary; Arrow makes
      the crossing cheaper, not free
    - Prefer built-in functions when possible; they run natively in the
      JVM and are optimized by Catalyst

    **Docs:**
    [udf](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.udf.html) |
    [arrow_udf](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.arrow_udf.html) |
    [pandas_udf](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.pandas_udf.html) |
    [Arrow Python UDFs](https://spark.apache.org/docs/4.2.0/api/python/tutorial/sql/arrow_python_udf.html)

