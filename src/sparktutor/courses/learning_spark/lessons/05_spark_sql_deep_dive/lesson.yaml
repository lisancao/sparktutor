    ## DataFrames vs. RDDs

    Spark has two main APIs: DataFrames and RDDs (Resilient Distributed
    Datasets). DataFrames are almost always better because:

    - **Catalyst optimization**: DataFrames go through the full optimizer
      pipeline. RDD lambdas are opaque; Spark cannot optimize them.
    - **Tungsten memory**: DataFrames use Spark's compact binary row format.
      RDDs of Python objects pay for pickling on every hop.
    - **Code generation**: Spark generates JVM bytecode for DataFrame
      operations. RDD operations run your functions as written.
    - **Portability**: RDDs are not available under Spark Connect at all.
      Spark 4.2 keeps closing the gap with DataFrame equivalents such as
      `DataFrame.zipWithIndex()` and `DataFrame.toJSON()` on Connect.

    Use DataFrames unless you need fine-grained control over partitioning
    that the DataFrame API cannot express.

