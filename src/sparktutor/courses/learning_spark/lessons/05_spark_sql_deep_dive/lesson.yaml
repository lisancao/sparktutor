- Class: text
  Depth: all
  Output: |
    ## Catalyst 优化器

    Spark SQL 不仅仅是一种查询语言 —— 它是一个**优化引擎**。
    无论你编写 DataFrame API 代码还是原始 SQL，你的查询都经过
    相同的四阶段管道：

    1. **解析（Parsing）** —— 你的代码被转换为未解析的逻辑计划
       （带有占位符列名的操作树）
    2. **分析（Analysis）** —— 使用 catalog 解析列名、表引用和类型
    3. **优化（Optimization）** —— 用谓词下推、常量折叠和列裁剪等
       规则重写计划
    4. **物理计划（Physical Planning）** —— Spark 选择执行策略
       （join 算法、扫描方法）并生成 JVM 字节码

    这就是为什么 `df.filter(...).select(...)` 和
    `spark.sql("SELECT ... WHERE ...")` 产生相同的结果 —— 它们都经过
    Catalyst。

- Class: text
  Depth: beginner
  Output: |
    把 Catalyst 想象成 GPS 导航系统。你告诉它你想去哪里（你的查询），
    它计算出最佳路线（执行计划）。它考虑捷径（跳过不需要列等优化）和
    路况（数据统计）来找到最快路径。你不需要知道路线 —— 只需知道目的地。

