    ## Key Catalyst Optimizations

    **Predicate pushdown** — filters are pushed as close to the data source
    as possible. If you filter after a join, Catalyst moves the filter
    *before* the join (when applicable), reducing the amount of data
    shuffled.

    **Column pruning** — only columns actually used in the query are read.
    With Parquet, this means entire columns are skipped at the file level.

    **Constant folding** — expressions like `1 + 2` or `lit("a") == lit("a")`
    are evaluated at plan time, not at runtime for every row.

    **Join reordering** — when joining multiple tables, Catalyst can
    rearrange the join order to minimize intermediate result sizes.

    These optimizations happen automatically. You get them for free by using
    the DataFrame API or SQL.

    **Docs:** [Spark SQL Programming Guide](https://spark.apache.org/docs/3.5.0/sql-programming-guide.html)
    — covers Catalyst phases, predicate pushdown, column pruning, and plan optimization.

