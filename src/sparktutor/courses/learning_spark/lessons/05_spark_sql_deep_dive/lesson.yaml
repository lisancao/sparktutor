    ## Adaptive Query Execution (AQE)

    Enabled by default since Spark 3.2, AQE re-optimizes the plan at
    **runtime** based on actual shuffle statistics. It fixes problems that
    the static optimizer cannot predict:

    **1. Coalescing post-shuffle partitions** — after a shuffle, many
    partitions may be tiny. AQE merges them to reduce task overhead and
    small file problems.

    **2. Switching join strategies** — if the optimizer planned a Sort
    Merge Join but one side turns out to be small after filtering, AQE
    converts it to a Broadcast Hash Join at runtime.

    **3. Skew join optimization** — if one partition is much larger than
    others (data skew), AQE splits it into smaller sub-partitions to
    prevent stragglers.

    ```python
    # AQE is on by default; explicit configuration:
    spark.conf.set("spark.sql.adaptive.enabled", "true")
    spark.conf.set("spark.sql.adaptive.coalescePartitions.enabled", "true")
    spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
    ```

