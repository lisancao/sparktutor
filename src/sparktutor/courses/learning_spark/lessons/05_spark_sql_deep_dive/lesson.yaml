    ## SQL Queries with spark.sql()

    You have already used `createOrReplaceTempView` to register a
    DataFrame as a SQL table. Here is the full workflow:

    ```python
    employees_df.createOrReplaceTempView("employees")

    result = spark.sql("""
        SELECT department, AVG(salary) AS avg_salary
        FROM employees
        WHERE hire_date > :since
        GROUP BY department
        HAVING AVG(salary) > :floor
        ORDER BY avg_salary DESC
    """, args={"since": "2020-01-01", "floor": 80000})
    ```

    Pass values through **parameter markers** rather than f-strings.
    `args` takes a dict for named markers (`:since`) or a list for
    positional ones (`?`). The values are bound as literals, so there is no
    SQL injection and no quoting bugs. To reference a table whose name is a
    parameter, use `IDENTIFIER(:tbl)`. You can also hand DataFrames straight
    to `spark.sql` as keyword arguments:
    `spark.sql("SELECT * FROM {t} WHERE salary > {m}", t=df, m=90000)`.

    SQL and DataFrames are interchangeable. Use SQL when the query is
    naturally expressed as a SELECT statement. Use DataFrames when you
    need programmatic composition (building queries dynamically).

