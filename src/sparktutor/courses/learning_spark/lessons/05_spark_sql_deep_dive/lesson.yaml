    ## 小结

    本课你学到了：

    - **Catalyst 优化器** —— 为所有 Spark 查询提供动力的四阶段管道
      （解析、分析、优化、物理计划）
    - **关键优化** —— 谓词下推、列裁剪、常量折叠和 join 重排序
      自动发生
    - **explain()** —— 阅读执行计划以理解和调试 Spark 实际做了什么
    - **SQL 查询** —— 带临时视图的 `spark.sql()` 让你在 DataFrame
      API 之外使用完整 SQL
    - **UDF** —— 带性能权衡的自定义逻辑；尽可能优先用内置函数
    - **AQE** —— 适应实际数据的运行时重新优化

    理解优化器是区分 Spark 用户和 Spark 专家的关键。在下一课中，
    你将运用这些知识来调优性能 —— 缓存、分区和配置。
