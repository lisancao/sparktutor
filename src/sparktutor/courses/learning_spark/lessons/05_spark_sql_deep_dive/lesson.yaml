    ## SQL Queries with spark.sql()

    You have already used `createOrReplaceTempView` to register a
    DataFrame as a SQL table. Here is the full workflow:

    ```python
    # Register the DataFrame as a SQL view
    employees_df.createOrReplaceTempView("employees")

    # Query with standard SQL
    result = spark.sql("""
        SELECT department, AVG(salary) AS avg_salary
        FROM employees
        WHERE hire_date > '2020-01-01'
        GROUP BY department
        HAVING AVG(salary) > 80000
        ORDER BY avg_salary DESC
    """)
    ```

    SQL and DataFrames are interchangeable. Use SQL when the query is
    naturally expressed as a SELECT statement. Use DataFrames when you
    need programmatic composition (building queries dynamically).

