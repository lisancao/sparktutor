    ## SQL Pipe Syntax

    Spark 4.0 added **pipe syntax**: a query is a starting table followed
    by a chain of operators, each consuming the result of the previous one.
    It reads top to bottom in the order Spark executes it, much like a
    DataFrame chain:

    ```sql
    FROM employees
    |> WHERE salary > 50000
    |> EXTEND salary * 1.1 AS proposed
    |> AGGREGATE AVG(salary) AS avg_salary, COUNT(*) AS n
       GROUP BY department
    |> ORDER BY avg_salary DESC
    |> LIMIT 10
    ```

    Operators include `SELECT`, `EXTEND` (add columns), `SET` (replace
    columns), `DROP`, `AS` (alias the table), `WHERE`, `AGGREGATE`, `JOIN`,
    `ORDER BY`, `LIMIT`, `UNION ALL`, `TABLESAMPLE`, `PIVOT`, and `UNPIVOT`.
    You can apply `WHERE` after `AGGREGATE`, which replaces `HAVING`, and
    you can mix pipe queries with regular SQL anywhere a subquery fits.

    Two 4.2 additions (SPARK-51518, SPARK-54292):

    ```sql
    -- `|` works as an alias for `|>`
    TABLE employees | WHERE department = 'Engineering' | SELECT name, salary

    -- aggregate functions and GROUP BY are allowed in a pipe SELECT
    FROM employees |> SELECT department, MAX(salary) AS top GROUP BY department
    ```

    **Docs:** [SQL Pipe Syntax](https://spark.apache.org/docs/4.2.0/sql-pipe-syntax.html)

