    ## 用 spark.sql() 编写 SQL 查询

    你已经使用过 `createOrReplaceTempView` 将 DataFrame 注册为
    SQL 表。以下是完整工作流程：

    ```python
    # 将 DataFrame 注册为 SQL 视图
    employees_df.createOrReplaceTempView("employees")

    # 用标准 SQL 查询
    result = spark.sql("""
        SELECT department, AVG(salary) AS avg_salary
        FROM employees
        WHERE hire_date > '2020-01-01'
        GROUP BY department
        HAVING AVG(salary) > 80000
        ORDER BY avg_salary DESC
    """)
    ```

    SQL 和 DataFrame 可以互换。当查询自然地表达为 SELECT 语句时用 SQL。
    当你需要程序化组合（动态构建查询）时用 DataFrame。

- Class: text
  Depth: intermediate
  Output: |
    ## 用户自定义函数（UDF）

    当内置函数不够用时，你可以用 UDF 编写自定义逻辑：

    ```python
    from pyspark.sql.functions import udf
    from pyspark.sql.types import StringType

    @udf(returnType=StringType())
    def normalize_name(name):
        return name.strip().title() if name else None

    df.withColumn("clean_name", normalize_name(col("name")))
    ```

    **重要权衡：**
    - UDF 对 Catalyst 是**不透明的** —— 优化器无法查看其内部来下推
      过滤器或裁剪逻辑
    - Python UDF 增加**序列化开销** —— 数据对每一行都要从 JVM 发送到
      Python 再发回来
    - 尽可能优先用内置函数 —— 它们在 JVM 中原生运行并由 Catalyst 优化

    **文档：**
    [udf](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.udf.html) |
    [pandas_udf](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.pandas_udf.html) |
    [Arrow in PySpark](https://spark.apache.org/docs/3.5.0/api/python/user_guide/sql/arrow_pandas.html)
    —— `returnType` 参数、批量 UDF 签名和性能指导。

