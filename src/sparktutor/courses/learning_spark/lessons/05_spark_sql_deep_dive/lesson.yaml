    ## Summary

    In this lesson you learned:

    - **Catalyst optimizer**: the four-phase pipeline (parse, analyze,
      optimize, physical plan) that powers all Spark queries
    - **Key optimizations**: predicate pushdown, column pruning, constant
      folding, and cost-based join reordering
    - **explain()**: read execution plans to understand and debug what
      Spark actually does; capture stdout instead of using `_jdf`
    - **Parameterized SQL**: `spark.sql(query, args=...)` with `:name` or
      `?` markers
    - **Pipe syntax**: `FROM t |> WHERE ... |> AGGREGATE ...`, with `|` and
      aggregates in pipe `SELECT` new in 4.2
    - **QUALIFY** (4.2), `time_bucket` (4.2), session variables, `EXECUTE
      IMMEDIATE`, and SQL scripting (4.0)
    - **UDFs**: Arrow-optimized by default in 4.2; `arrow_udf` and
      `pandas_udf` for vectorized logic; built-ins still win
    - **AQE**: runtime re-optimization that adapts to actual data

    Understanding the optimizer is what separates Spark users from Spark
    experts. In the next lesson, you will use this knowledge to tune
    performance: caching, partitioning, configuration, and the Spark UI.
