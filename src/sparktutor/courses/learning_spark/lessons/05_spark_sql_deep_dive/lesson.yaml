    ## QUALIFY: Filtering on Window Functions

    "Top earner per department" used to need a subquery, because `WHERE`
    runs before window functions are computed. Spark 4.2 adds the `QUALIFY`
    clause (SPARK-31561), which filters *after* window functions:

    ```sql
    SELECT department, name, salary,
           RANK() OVER (PARTITION BY department ORDER BY salary DESC) AS rnk
    FROM employees
    QUALIFY rnk = 1
    ```

    You can also put the window function directly in the condition:
    `QUALIFY ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) = 1`.
    The `SELECT` list or the `QUALIFY` condition must contain at least one
    window function, and plain aggregates are not allowed in `QUALIFY`.

    **Docs:** [QUALIFY clause](https://spark.apache.org/docs/4.2.0/sql-ref-syntax-qry-select-qualify.html)

