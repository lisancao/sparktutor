    ## Reading Execution Plans

    Use `explain()` to see what Spark will actually do:

    ```python
    df.filter(col("age") > 30).select("name").explain()
    ```

    The `explain()` method has several modes:

    - `explain()` or `explain("simple")`: physical plan only
    - `explain("extended")`: all plans (parsed, analyzed, optimized,
      physical)
    - `explain("formatted")`: an operator outline followed by numbered
      details for each node
    - `explain("cost")`: logical plan with statistics estimates
    - `explain("codegen")`: the generated Java code

    Start with `explain("formatted")`; it is the most readable. Look for:
    - `FileScan` / `Scan`: how data is read (which columns, pushed filters)
    - `Filter`: where filtering happens in the plan
    - `HashAggregate` / `SortAggregate`: aggregation strategy
    - `BroadcastHashJoin` / `SortMergeJoin`: join strategy
    - `AdaptiveSparkPlan isFinalPlan=false|true`: AQE is in charge; the
      plan becomes final only after the query has run

    `explain()` prints to stdout in both Classic and Connect mode. To keep a
    plan as a string, capture stdout (`contextlib.redirect_stdout`) rather
    than reaching for `df._jdf`, which does not exist under Spark Connect.

