    ## SQL Scripting

    Since Spark 4.0, a single `spark.sql()` call can run a **script**: a
    `BEGIN ... END` compound statement with local variables, control flow,
    and error handlers. The result of the last statement that returns rows
    is the result of the call. `spark.sql.scripting.enabled` defaults to
    `true` in 4.2.

    ```python
    verdict = spark.sql("""
    BEGIN
      DECLARE total DOUBLE DEFAULT 0;
      FOR r AS SELECT salary FROM employees WHERE salary > 60000 DO
        SET total = total + r.salary;
      END FOR;
      IF total > 300000 THEN
        SELECT 'big payroll' AS verdict, total;
      ELSE
        SELECT 'small payroll' AS verdict, total;
      END IF;
    END
    """)
    ```

    Available constructs include `IF`/`ELSEIF`/`ELSE`, `CASE`, `WHILE`,
    `REPEAT`, `LOOP`, `FOR`, `LEAVE`/`ITERATE`, and `DECLARE EXIT HANDLER`
    for exceptions (CONTINUE handlers are not enabled in 4.2.0). Cursor
    support (SPARK-54759) is in the 4.2 codebase but sits behind an
    internal flag that is off by default, so `DECLARE ... CURSOR` fails on
    a stock build. Scripting is for orchestration glue that belongs next to
    the data (conditional DDL, small loops over metadata); row-by-row loops
    over large tables are still a job for set-based SQL.

    **Docs:** [SQL Scripting](https://spark.apache.org/docs/4.2.0/sql-ref-scripting.html)

