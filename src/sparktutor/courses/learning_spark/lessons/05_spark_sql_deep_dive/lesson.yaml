    ## 关键 Catalyst 优化

    **谓词下推（Predicate pushdown）** —— 过滤器被下推到尽可能靠近
    数据源的位置。如果你在 join 之后过滤，Catalyst 会将过滤器移到
    join *之前*（在适用时），减少 shuffle 的数据量。

    **列裁剪（Column pruning）** —— 只读取查询中实际使用的列。
    对于 Parquet，这意味着在文件级别跳过整列。

    **常量折叠（Constant folding）** —— 像 `1 + 2` 或
    `lit("a") == lit("a")` 这样的表达式在计划时求值，
    而不是对每行在运行时求值。

    **Join 重排序（Join reordering）** —— 当连接多个表时，Catalyst
    可以重新排列 join 顺序以最小化中间结果大小。

    这些优化自动发生。你通过使用 DataFrame API 或 SQL 免费获得它们。

    **文档：** [Spark SQL Programming Guide](https://spark.apache.org/docs/3.5.0/sql-programming-guide.html)
    —— 涵盖 Catalyst 阶段、谓词下推、列裁剪和计划优化。

- Class: text
  Depth: all
  Output: |
    ## 阅读执行计划

    用 `explain()` 查看 Spark 实际会做什么：

    ```python
    df.filter(col("age") > 30).select("name").explain()
    ```

    `explain()` 方法有几种模式：

    - `explain()` 或 `explain("simple")` —— 仅物理计划
    - `explain("extended")` —— 所有计划（解析、分析、优化、物理）
    - `explain("formatted")` —— 带章节标题的人类可读格式
    - `explain("cost")` —— 包含统计信息估算
    - `explain("codegen")` —— 显示生成的 Java 字节码

    从 `explain("formatted")` 开始 —— 它最易读。寻找：
    - `FileScan` —— 如何读取数据（哪些列、下推的过滤器）
    - `Filter` —— 过滤在计划中的位置
    - `HashAggregate` / `SortAggregate` —— 聚合策略
    - `BroadcastHashJoin` / `SortMergeJoin` —— join 策略

