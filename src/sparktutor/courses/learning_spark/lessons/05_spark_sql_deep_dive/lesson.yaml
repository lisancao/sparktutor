    ## The Catalyst Optimizer

    Spark SQL is not just a query language — it is an **optimization
    engine**. Whether you write DataFrame API code or raw SQL, your query
    passes through the same four-phase pipeline:

    1. **Parsing** — your code is converted into an unresolved logical plan
       (a tree of operations with placeholder column names)
    2. **Analysis** — column names, table references, and types are resolved
       using the catalog
    3. **Optimization** — the plan is rewritten with rules like predicate
       pushdown, constant folding, and column pruning
    4. **Physical Planning** — Spark chooses execution strategies (join
       algorithms, scan methods) and generates JVM bytecode

    This is why `df.filter(...).select(...)` and
    `spark.sql("SELECT ... WHERE ...")` produce identical results — they
    both go through Catalyst.

- Class: text
  Depth: beginner
  Output: |
    Think of Catalyst like a GPS navigation system. You tell it where you
    want to go (your query), and it figures out the best route (execution
    plan). It considers shortcuts (optimizations like skipping unneeded
    columns) and traffic conditions (data statistics) to find the fastest
    path. You do not need to know the route — just the destination.

