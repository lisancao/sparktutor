  Output: |
    ## DataFrame 与 RDD 的对比

    Spark 有两个主要 API：DataFrame 和 RDD（Resilient Distributed
    Datasets）。DataFrame 几乎总是更好，因为：

    - **Catalyst 优化** —— DataFrame 经过完整的优化器管道。RDD 是
      不透明的 —— Spark 无法优化你的 lambda。
    - **Tungsten 内存** —— DataFrame 使用 Spark 的紧凑二进制格式。
      RDD 使用 Java 对象序列化（更慢、更多内存）。
    - **代码生成** —— Spark 为 DataFrame 操作生成 JVM 字节码。
      RDD 操作是解释执行的。

    除非你需要对分区进行细粒度控制，或处理不映射到 Spark 类型系统的
    类型，否则使用 DataFrame。

- Class: text
  Depth: advanced
  Output: |
    ## 自适应查询执行（AQE）

    自 Spark 3.2 起默认启用，AQE 在**运行时**基于实际 shuffle 统计
    重新优化计划。它修复静态优化器无法预测的问题：

    **1. 合并 shuffle 后分区** —— shuffle 后，许多分区可能很小。
    AQE 合并它们以减少任务开销和小文件问题。

    **2. 切换 join 策略** —— 如果优化器计划了 Sort Merge Join，
    但过滤后某一边很小，AQE 在运行时将其转换为 Broadcast Hash Join。

    **3. 倾斜 join 优化** —— 如果一个分区比其他分区大得多
    （数据倾斜），AQE 将其拆分为更小的子分区以防止掉队任务。

    ```python
    # AQE 默认开启；显式配置：
    spark.conf.set("spark.sql.adaptive.enabled", "true")
    spark.conf.set("spark.sql.adaptive.coalescePartitions.enabled", "true")
    spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
    ```

