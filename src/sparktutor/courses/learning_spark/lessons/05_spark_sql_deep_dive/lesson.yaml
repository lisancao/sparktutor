    ## What You'll Learn

    You have been using the DataFrame API for several lessons. Behind the
    scenes, every `select()`, `filter()`, and `groupBy()` passes through
    the same engine: **Spark SQL**. In this lesson you will look under the
    hood, then at the SQL language itself, which grew a lot in the 4.x line.

    By the end of this lesson you will be able to:

    - Explain the four phases of the Catalyst optimizer pipeline
    - Read execution plans with `explain()`
    - Write parameterized SQL against DataFrames using temporary views
    - Use SQL pipe syntax (`|>`, and the `|` alias added in 4.2)
    - Filter on window functions with `QUALIFY` (4.2)
    - Write procedural logic with SQL scripting (4.0)
    - Choose between Python UDFs, Arrow UDFs, and pandas UDFs, knowing that
      Python UDFs are Arrow-optimized by default in 4.2
    - Explain what Adaptive Query Execution (AQE) does at runtime

