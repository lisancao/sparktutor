    ## Let AQE Size Your Shuffles

    With AQE on (the default), a hand-picked `spark.sql.shuffle.partitions`
    matters less than it used to. After each shuffle stage AQE reads the
    real partition sizes and merges small neighbours:

    ```
    AdaptiveSparkPlan isFinalPlan=true
    +- == Final Plan ==
       ResultQueryStage 1
       +- *(2) HashAggregate(keys=[department], functions=[sum(revenue)])
          +- AQEShuffleRead coalesced
             +- ShuffleQueryStage 0
                +- Exchange hashpartitioning(department, 8)
    +- == Initial Plan ==
       ...
    ```

    `AQEShuffleRead coalesced` means the exchange wrote eight partitions
    and AQE read them back as fewer. `isFinalPlan=true` appears only once
    the DataFrame's own plan has executed. Call `explain()` after
    `collect()` (or `toPandas()`) to see what AQE actually did; `count()`,
    `show()` and writes run a derived plan, so the DataFrame's plan still
    says `isFinalPlan=false` after them.

    Use `repartition` yourself when you need a specific layout (for
    example, to control file counts or to partition by a key before a
    write); let AQE handle "how many partitions after this groupBy".

