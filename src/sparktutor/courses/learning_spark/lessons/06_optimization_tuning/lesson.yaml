    ## PySpark Data Exchange Is Arrow by Default in 4.2

    Moving data between the JVM and Python is often the hidden cost in a
    PySpark job. Spark 4.2 turns Arrow on for all of it (SPARK-54555):

    - `spark.sql.execution.arrow.pyspark.enabled` now defaults to `true`, so
      `toPandas()` and `createDataFrame(pandas_df)` transfer columnar Arrow
      batches instead of pickled rows.
    - `spark.sql.execution.pythonUDF.arrow.enabled` and
      `spark.sql.execution.pythonUDTF.arrow.enabled` default to `true`, so
      plain Python UDFs and UDTFs use Arrow batches too.
    - `df.toArrow()` (since 4.0) returns a `pyarrow.Table` with no pandas
      step at all.
    - `spark.sql.execution.arrow.maxRecordsPerBatch` (default 10000) caps
      the rows per Arrow batch; lower it if Python workers run out of memory
      on wide rows.

    When you benchmark against a 3.x or 4.1 baseline, remember these
    defaults moved. A regression after upgrading can be a plain `@udf` that
    used to run as `BatchEvalPython` (pickled rows) and now shows up as
    `ArrowEvalPython` in the plan. Pass `useArrow=False` to that UDF, or set
    `spark.sql.execution.pythonUDF.arrow.enabled` to `false`, to confirm
    before rewriting code. Pandas UDFs always used Arrow, and nullable
    integer columns still reach them as `float64` by default; 4.2.0 adds
    `spark.sql.execution.pythonUDF.pandas.preferIntExtensionDtype` (default
    `false`) to opt in to `Int64`-style extension dtypes instead.

