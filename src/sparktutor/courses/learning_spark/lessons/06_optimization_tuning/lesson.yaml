  Output: |
    Think of Spark partitions like lanes on a highway. More lanes
    (partitions) let more cars (tasks) move in parallel, but too many
    lanes waste space and create merge overhead. The goal is to match
    the number of partitions to your cluster's capacity and your data size.

    Tuning Spark is about finding the right balance between parallelism,
    memory usage, and shuffle overhead.

- Class: text
