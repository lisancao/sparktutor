    ## Repartition 与 Coalesce 的对比

    两个用于改变分区数量的工具：

    **`repartition(n)`** —— 将数据 shuffle 成恰好 `n` 个分区。
    这是一次完整的 shuffle（代价高），但产生均衡的分区。
    当你需要*增加*分区或*重新平衡*倾斜数据时使用。

    **`coalesce(n)`** —— 通过合并相邻分区来减少分区数。
    没有 shuffle —— 只是重新分配。当*减少*分区时使用
    （例如，在写入小输出文件之前）。

    ```python
    # Increase to 100 partitions (full shuffle)
    df = df.repartition(100)

    # Reduce to 10 partitions (no shuffle)
    df = df.coalesce(10)
    ```

    **经验法则**：减少分区时始终用 `coalesce`，
    增加分区或需要均衡分区时用 `repartition`。

