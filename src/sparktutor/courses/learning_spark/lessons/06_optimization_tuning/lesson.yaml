  Depth: advanced
  Output: |
    ## Monitoring Cache Usage

    The **Storage tab** in the Spark UI shows what is cached, memory used,
    and the fraction cached. If a DataFrame shows less than 100% cached,
    partitions did not fit: with a `MEMORY_AND_DISK*` level the rest went
    to disk, and with `MEMORY_ONLY` it will be recomputed on each use.

    **Practical tip**: cache the *filtered* DataFrame, not the raw read.
    Caching a huge raw read is wasteful; a filtered and aggregated
    intermediate result is a good cache candidate.

- Class: text
  Depth: advanced
  Output: |
    ## Defaults That Cost (a Little) for Correctness

    Two 4.x defaults trade a small amount of speed for correctness. Know
    them before you blame your code:

    - **ANSI mode** adds overflow and cast checks to arithmetic and casts.
      The checks are cheap; the bigger effect is that bad data now fails
      the job instead of silently producing nulls.
    - **Order-independent shuffle checksums** (on by default in 4.2):
      Spark checksums each mapper's shuffle output. If an indeterminate
      stage is retried and produces different data, Spark detects the
      mismatch and re-runs the dependent stages instead of silently mixing
      old and new output. Disable with
      `spark.sql.shuffle.orderIndependentChecksum.enabled=false` only if you
      have measured a real cost and your stages are deterministic.

