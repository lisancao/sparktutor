    ## Caching and Persistence

    When a DataFrame is used **multiple times** in your application,
    caching avoids recomputing it from scratch each time:

    ```python
    df.cache()      # mark for caching
    df.count()      # triggers caching (cache is lazy!)
    # ... use df multiple times ...
    df.unpersist()  # release memory when done
    ```

    Caching is **lazy**: calling `cache()` only marks the DataFrame.
    The actual data is materialized on the first action after `cache()`.
    `df.storageLevel` tells you what level a DataFrame is cached at.

    **Docs:**
    [cache](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.cache.html) |
    [persist](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.persist.html) |
    [unpersist](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.unpersist.html)

- Class: text
  Depth: intermediate
  Output: |
    ## Storage Levels

    For a DataFrame, `cache()` is `persist()` with the default level, which
    in PySpark is `MEMORY_AND_DISK_DESER`: keep deserialized blocks in
    memory and spill to disk when memory runs out. `persist()` lets you
    choose another level from `pyspark.StorageLevel`:

    | Level | Where | Tradeoff |
    |-------|-------|----------|
    | `MEMORY_AND_DISK_DESER` | RAM, spill to disk | DataFrame default |
    | `MEMORY_AND_DISK` | RAM (serialized), spill to disk | Smaller footprint, CPU to deserialize |
    | `MEMORY_ONLY` | RAM | Partitions that do not fit are recomputed |
    | `DISK_ONLY` | Disk | Slowest, memory-safe |
    | `OFF_HEAP` | Off-heap memory | Outside JVM GC; needs off-heap memory configured |
    | `..._2` variants | Two replicas | Survives losing an executor |

    ```python
    from pyspark import StorageLevel
    df.persist(StorageLevel.DISK_ONLY)
    ```

    For most cases, `cache()` is the right choice. Python's
    `StorageLevel` has no `_SER` variants; those names exist only in the
    Scala/Java API.

