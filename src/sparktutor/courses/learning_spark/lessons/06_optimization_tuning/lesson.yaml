    ## Repartition vs. Coalesce

    Two tools for changing the number of partitions:

    **`repartition(n)`** — shuffles data into exactly `n` partitions. This
    is a full shuffle (expensive) but produces evenly-balanced partitions.
    Use when you need to *increase* partitions or *rebalance* skewed data.

    **`coalesce(n)`** — reduces partitions by merging adjacent ones.
    No shuffle — just reassignment. Use when *decreasing* partitions
    (e.g., before writing small output files).

    ```python
    # Increase to 100 partitions (full shuffle)
    df = df.repartition(100)

    # Reduce to 10 partitions (no shuffle)
    df = df.coalesce(10)
    ```

    **Rule of thumb**: always use `coalesce` when reducing, `repartition`
    when increasing or when you need balanced partitions.

