    ## 缓存与持久化

    当一个 DataFrame 在应用中被**多次使用**时，
    缓存可以避免每次都从头重新计算：

    ```python
    df.cache()      # shorthand for persist(MEMORY_AND_DISK)
    df.count()      # triggers caching (cache is lazy!)
    # ... use df multiple times ...
    df.unpersist()  # release memory when done
    ```

    缓存是**惰性的** —— 调用 `cache()` 只是标记 DataFrame。
    实际数据在 cache() 之后的第一个 action 时才物化。

    **文档：**
    [cache](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.cache.html) |
    [persist](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.persist.html) |
    [unpersist](https://spark.apache.org/docs/3.5.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.unpersist.html)
    —— `persist()` 的 `StorageLevel` 参数、惰性物化行为。

- Class: text
  Depth: intermediate
  Output: |
    ## 存储级别

    `cache()` 默认使用 `MEMORY_AND_DISK`。`persist()` 给你更多控制权：

    | 级别 | 存储位置 | 权衡 |
    |------|----------|------|
    | `MEMORY_ONLY` | 内存 | 最快，有 OOM 风险 |
    | `MEMORY_AND_DISK` | 内存 + 磁盘 | 安全的默认值 |
    | `DISK_ONLY` | 磁盘 | 最慢，内存安全 |
    | `MEMORY_ONLY_SER` | 内存（序列化） | 更省内存，有 CPU 开销 |
    | `OFF_HEAP` | Tungsten 内存 | 不受 JVM GC 管理 |

    ```python
    from pyspark import StorageLevel
    df.persist(StorageLevel.MEMORY_ONLY_SER)
    ```

    对大多数情况，`cache()`（MEMORY_AND_DISK）是正确选择。当需要缓存的
    数据超过反序列化形式能容纳的大小时，使用 `MEMORY_ONLY_SER`。

