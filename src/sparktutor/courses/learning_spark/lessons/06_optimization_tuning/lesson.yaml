    ## The Spark 4.2 Web UI

    Spark 4.2 reworked the Web UI (SPARK-55760). The changes that matter for
    tuning:

    - **SQL plan visualization** is compact, with a detail side panel per
      node, pan and zoom, and search that highlights matching nodes
      (SPARK-55785, SPARK-56792, SPARK-56799). Large plans are finally
      navigable.
    - **Initial vs. Final plan, side by side** for AQE queries
      (SPARK-55877), so you can see exactly which joins AQE switched and
      which shuffles it coalesced.
    - **Job Timeline on the SQL execution page** ties a query to the jobs
      and stages it spawned.
    - **Copy plan text and share link** buttons on the SQL execution page
      (SPARK-56048), and sortable, paginated query lists on the SQL tab.
    - **Environment page** highlights configuration values that differ from
      the defaults and can export the config (SPARK-55835, SPARK-55839).
      When a job is mysteriously slow, check this first.
    - The **Query ID** is displayed (SPARK-55008), and there is a dark mode
      toggle (SPARK-55766).

    In Spark Connect deployments, the **Connect** tab lists sessions and
    the operations they ran, and it is fixed to appear in the History
    Server (SPARK-57601, also backported to 4.1.3 and 4.0.4).

