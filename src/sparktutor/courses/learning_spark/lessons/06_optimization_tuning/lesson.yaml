    ## When to Cache (and When Not To)

    **Cache when:**
    - A DataFrame is used more than once AND is expensive to compute
      (joins, aggregations, complex transformations)
    - A DataFrame is the input to an iterative algorithm (ML training)

    **Do NOT cache when:**
    - The DataFrame is used only once (caching adds overhead for no benefit)
    - The DataFrame is too large to fit in cluster memory
    - The DataFrame is cheap to recompute (simple file read without complex
      transforms)
    - You are writing output immediately (just write it, don't cache first)

    Always `unpersist()` when you are done. Forgotten caches consume cluster
    memory and push later stages into spilling. `spark.catalog.clearCache()`
    drops every cached table and DataFrame in the session.

