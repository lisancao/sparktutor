- Class: text
  Depth: all
  Output: |
    ## 何时缓存（以及何时不要缓存）

    **在以下情况缓存：**
    - 一个 DataFrame 被使用 2 次以上**且**计算代价高昂（join、
      聚合、复杂转换）
    - 一个 DataFrame 是迭代算法的输入（ML 训练）

    **在以下情况不要缓存：**
    - DataFrame 只被使用一次（缓存只会增加开销而无收益）
    - DataFrame 太大，无法放入集群内存
    - DataFrame 重新计算代价很低（没有复杂转换的简单文件读取）
    - 你马上就要写输出（直接写就行，不要先缓存）

    用完后始终调用 `unpersist()`。被遗忘的缓存会消耗集群内存，
    并可能在后续 stage 中导致 OOM 错误。

