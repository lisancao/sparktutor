    ## Summary

    In this lesson you learned:

    - **Key configs** — `shuffle.partitions`, executor/driver memory, and
      file partition sizes are the most impactful settings
    - **repartition vs. coalesce** — repartition for increasing or
      balancing; coalesce for reducing without shuffle
    - **Caching** — cache DataFrames reused 2+ times; always unpersist
    - **Storage levels** — MEMORY_AND_DISK is the safe default; use SER
      variants to fit more data
    - **Tuning process** — Spark UI → skew → shuffles → partitions → caching

    You now have the tools to diagnose and fix performance problems. In
    the next lesson, you will tackle **joins** — the most expensive and
    most important operation in distributed data processing.
