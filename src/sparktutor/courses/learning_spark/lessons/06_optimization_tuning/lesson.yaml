    ## What You'll Learn

    In the previous lesson you learned how the Catalyst optimizer works
    and how to read execution plans. Now you will apply that knowledge
    to **tune** Spark applications for real-world performance.

    By the end of this lesson you will be able to:

    - Configure the most impactful Spark settings
    - Manage partitions with `repartition` and `coalesce`, and know when
      AQE does it for you
    - Cache DataFrames strategically and know when NOT to cache
    - Read the Spark UI, including the reworked SQL views in 4.2
    - Account for 4.x defaults (Arrow data exchange, ANSI mode, shuffle
      checksums) when you measure performance
    - Apply a systematic approach to Spark tuning

- Class: text
