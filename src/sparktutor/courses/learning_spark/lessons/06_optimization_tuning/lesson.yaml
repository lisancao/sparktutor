- Class: text
  Depth: advanced
  Output: |
    ## 系统化的调优方法

    当 Spark 作业运行缓慢时，遵循以下诊断流程：

    **1. 查看 Spark UI** —— 查看 stage 时间线、任务时长和 shuffle 大小。
    UI 能揭示代码无法发现的瓶颈。

    **2. 查找数据倾斜** —— 某个任务比其他任务慢 10 倍意味着某个分区
    拥有不成比例的数据。解决方案：加盐（salting）、AQE 倾斜 join，
    或按更好的键重新分区。

    **3. 检查 shuffle 大小** —— 大的 shuffle（每个任务 >1GB）表明
    分区太少或缺少 broadcast 机会。

    **4. 检查分区数量** —— `df.rdd.getNumPartitions()`。
    目标是每个分区约 128MB。太少 = 核心利用不足。
    太多 = 调度开销。

    **5. 检查不必要的计算** —— 同一个 DataFrame 是否被多次重新计算？
    缓存它。你是否在读取不需要的列？尽早使用 `select()`。

- Class: text
  Depth: advanced
  Output: |
    ## 监控缓存使用情况

    Spark UI 中的 **Storage 标签页**显示缓存了什么、使用了多少内存
    以及缓存比例。如果一个 DataFrame 显示 < 100% 缓存，说明数据
    正在溢写到磁盘 —— 要么是集群内存受限，要么是你缓存了太多数据。

    **实用提示**：缓存*过滤后*的 DataFrame，而不是原始读取。
    缓存 100GB 的原始读取是浪费；一个 5GB 的过滤+聚合中间结果
    才是合适的缓存候选。

