    ## Summary

    In this lesson you learned:

    - **Key configs**: `shuffle.partitions`, executor/driver memory, file
      partition sizes, and the `spark.sql.adaptive.*` family
    - **repartition vs. coalesce**: repartition for increasing or
      balancing; coalesce for reducing without shuffle; AQE coalesces
      shuffle output for you
    - **Caching**: cache DataFrames that are reused and expensive; always
      unpersist; the PySpark default level is `MEMORY_AND_DISK_DESER`
    - **Arrow by default**: 4.2 uses Arrow for `toPandas`, `createDataFrame`
      from pandas, and Python UDFs
    - **Spark UI**: the 4.2 SQL views (initial vs. final plans, search,
      timelines) and the Environment page's non-default highlighting
    - **Tuning process**: Spark UI, then skew, shuffles, partitions,
      caching

    You now have the tools to diagnose and fix performance problems. In
    the next lesson, you will tackle **joins**, the most expensive and
    most important operation in distributed data processing.
