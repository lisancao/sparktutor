    ## Storage Levels

    `cache()` uses `MEMORY_AND_DISK` by default. `persist()` gives you
    more control:

    | Level | Where | Tradeoff |
    |-------|-------|----------|
    | `MEMORY_ONLY` | RAM | Fastest, risks OOM |
    | `MEMORY_AND_DISK` | RAM + disk | Safe default |
    | `DISK_ONLY` | Disk | Slowest, memory-safe |
    | `MEMORY_ONLY_SER` | RAM (serialized) | Less memory, CPU overhead |
    | `OFF_HEAP` | Tungsten memory | Outside JVM GC |

    ```python
    from pyspark import StorageLevel
    df.persist(StorageLevel.MEMORY_ONLY_SER)
    ```

    For most cases, `cache()` (MEMORY_AND_DISK) is the right choice. Use
    `MEMORY_ONLY_SER` when you need to cache more data than fits in
    deserialized form.

