    ## 你将学到什么

    在上一课中，你学习了 Catalyst 优化器的工作原理以及如何阅读执行计划。
    现在你将把这些知识应用到 **调优** Spark 应用上，以获得真实世界的性能表现。

    学完本课后，你将能够：

    - 配置影响最大的 Spark 设置
    - 使用 `repartition` 和 `coalesce` 管理分区
    - 有策略地缓存 DataFrame，并知道何时**不要**缓存
    - 阅读执行计划以诊断性能瓶颈
    - 运用系统化的 Spark 调优方法

- Class: text
  Depth: beginner
  Output: |
    把 Spark 分区想象成高速公路上的车道。更多的车道（分区）
    让更多的车辆（任务）并行行驶，但车道过多会浪费空间并产生合并开销。
    目标是让分区数量与集群容量和数据规模相匹配。

    调优 Spark 就是在并行度、内存使用和 shuffle 开销之间
    找到恰当的平衡。

- Class: text
  Depth: all
  Output: |
    ## 影响最大的配置项

    Spark 有数百个配置旋钮，但只有少数几个对性能起决定性作用：

    **并行度：**
    - `spark.sql.shuffle.partitions` —— shuffle 之后的分区数
      （默认：200）。设置为执行器总核心数的 2-3 倍。
    - `spark.default.parallelism` —— RDD 操作的默认分区数

    **内存：**
    - `spark.executor.memory` —— 每个执行器的内存（例如 `4g`）
    - `spark.driver.memory` —— 驱动程序的内存
    - `spark.memory.fraction` —— 用于执行和存储的执行器内存比例
      （默认：0.6）

    **文件读取：**
    - `spark.sql.files.maxPartitionBytes` —— 读取文件时每个分区的
      最大大小（默认：128MB）

    通过建造者、配置文件或运行时设置配置：
    ```python
    spark.conf.set("spark.sql.shuffle.partitions", "50")
    ```

    **文档：** [Spark Configuration](https://spark.apache.org/docs/3.5.0/configuration.html)
    —— 可搜索的全部配置属性列表，包括 `spark.sql.shuffle.partitions`、
    `spark.executor.memory`、`spark.memory.fraction` 等。

