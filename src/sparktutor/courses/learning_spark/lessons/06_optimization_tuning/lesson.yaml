    ## A Systematic Tuning Approach

    When a Spark job is slow, follow this diagnostic process:

    **1. Check the Spark UI** (port 4040 on the driver). Look at stage
    timelines, task durations, and shuffle sizes. The UI reveals
    bottlenecks that code cannot.

    **2. Look for data skew**: one task running far longer than its
    siblings means a partition has disproportionate data. Solutions: AQE
    skew join, salting, or repartitioning by a better key.

    **3. Check shuffle sizes**: very large shuffle reads per task suggest
    too few partitions or a missing broadcast opportunity.

    **4. Check partition counts**: `df.rdd.getNumPartitions()` in Classic
    mode, or `df.select(f.spark_partition_id()).distinct().count()` (counts
    non-empty partitions) anywhere, including Spark Connect. Target roughly
    100 to 200MB per partition. Too few means idle cores; too many means
    scheduling overhead.

    **5. Check for unnecessary computation**: is the same DataFrame
    recomputed multiple times? Cache it. Are you reading columns you
    don't need? Use `select()` early.

