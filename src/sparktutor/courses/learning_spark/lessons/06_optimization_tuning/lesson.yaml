    ## A Systematic Tuning Approach

    When a Spark job is slow, follow this diagnostic process:

    **1. Check the Spark UI** — look at stage timelines, task durations,
    and shuffle sizes. The UI reveals bottlenecks that code cannot.

    **2. Look for data skew** — one task taking 10x longer than others
    means a partition has disproportionate data. Solutions: salting,
    AQE skew join, or repartitioning by a better key.

    **3. Check shuffle sizes** — large shuffles (>1GB per task) suggest
    too few partitions or missing broadcast opportunities.

    **4. Check partition counts** — `df.rdd.getNumPartitions()`. Target
    ~128MB per partition. Too few = underutilized cores. Too many =
    scheduling overhead.

    **5. Check for unnecessary computation** — is the same DataFrame
    recomputed multiple times? Cache it. Are you reading columns you
    don't need? Use `select()` early.

- Class: text
  Depth: advanced
  Output: |
    ## Monitoring Cache Usage

    The **Storage tab** in the Spark UI shows what is cached, memory used,
    and the fraction cached. If a DataFrame shows < 100% cached, data is
    spilling to disk — either the cluster is memory-constrained or you are
    caching too much.

    **Practical tip**: cache the *filtered* DataFrame, not the raw read.
    A 100GB raw read cached is wasteful; a 5GB filtered + aggregated
    intermediate result is a good cache candidate.

