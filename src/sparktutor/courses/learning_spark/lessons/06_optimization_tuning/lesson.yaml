    ## The Most Impactful Configurations

    Spark has hundreds of config knobs, but a handful dominate performance:

    **Parallelism:**
    - `spark.sql.shuffle.partitions`: number of partitions after a shuffle
      (default: 200). With AQE on, treat this as the *starting* count that
      AQE coalesces down from; set it high enough for your largest stage.
    - `spark.default.parallelism`: default partitions for RDD operations

    **Memory:**
    - `spark.executor.memory`: memory per executor (e.g., `4g`)
    - `spark.driver.memory`: memory for the driver
    - `spark.memory.fraction`: fraction of the heap (minus 300MB reserved)
      used for execution and storage (default: 0.6)

    **File reading:**
    - `spark.sql.files.maxPartitionBytes`: max size per partition when
      reading files (default: 128MB)

    **Adaptive execution:**
    - `spark.sql.adaptive.enabled` (default `true`)
    - `spark.sql.adaptive.advisoryPartitionSizeInBytes` (default 64MB)
    - `spark.sql.adaptive.coalescePartitions.parallelismFirst` (default
      `true`): ignore the advisory size and coalesce only as far as keeps
      the cluster's default parallelism busy. Set it to `false` on a busy
      shared cluster so AQE produces fewer, right-sized partitions.

    Set configs via the builder, `spark-defaults.conf`, or at runtime:
    ```python
    spark.conf.set("spark.sql.shuffle.partitions", "50")
    ```

    Runtime `spark.conf.set` works only for SQL configs. Static settings
    like `spark.executor.memory` must be set before the session starts;
    setting them later raises `CANNOT_MODIFY_CONFIG`.

    **Docs:** [Spark Configuration](https://spark.apache.org/docs/4.2.0/configuration.html) |
    [Performance Tuning](https://spark.apache.org/docs/4.2.0/sql-performance-tuning.html)

