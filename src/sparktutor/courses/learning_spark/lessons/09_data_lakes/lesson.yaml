- Class: text
  Depth: advanced
  Output: |
    ## Delta Lake 与 Iceberg：选择格式

    | 特性 | Delta Lake | Apache Iceberg |
    |------|-----------|----------------|
    | 事务日志 | JSON + checkpoint Parquet | 元数据文件 + manifest |
    | 多引擎 | 以 Spark 为中心（正在扩展） | Spark、Trino、Flink、Dremio |
    | 分区 | 显式 `PARTITIONED BY` | 隐藏分区、分区演进 |
    | Schema 演进 | mergeSchema 选项 | ALTER TABLE、完整类型提升 |
    | 社区 | Databricks 主导 | Apache 基金会，多厂商 |

    **选择 Delta** 当主要使用 Spark 和 Databricks 时。
    **选择 Iceberg** 当你需要多引擎访问或高级分区管理时。

    两者都支持 ACID、时间旅行、schema 演进和合并操作。

- Class: text
  Depth: advanced
  Output: |
    ## 维护操作

    湖仓表会随时间积累旧数据文件。定期维护保持其高性能：

    **Compaction（合并）** —— 将小文件合并成更大的文件，
    以获得更好的读取性能。

    **Vacuum / 过期快照** —— 移除不再被任何活跃版本需要的
    旧数据文件：
    ```python
    # Delta Lake
    spark.sql("VACUUM delta.`/data/events` RETAIN 168 HOURS")

    # Iceberg
    spark.sql("CALL catalog.system.expire_snapshots('db.events', TIMESTAMP '2025-01-01')")
    ```

    **History（历史）** —— 查看所有操作：
    ```python
    spark.sql("DESCRIBE HISTORY delta.`/data/events`")
    ```

    除非你确定没有长时间运行的查询需要旧版本，否则不要
    在低于默认保留期（Delta 为 7 天）的情况下执行 vacuum。

