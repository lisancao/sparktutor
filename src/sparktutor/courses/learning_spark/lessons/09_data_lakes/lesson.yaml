    ## Summary

    In this lesson you learned:

    - **Data architecture evolution**: databases, warehouses, lakes, then
      lakehouses
    - **Three formats**: Delta Lake, Apache Iceberg, and Apache Hudi
      provide ACID transactions on data lake storage, as connectors you add
      to Spark
    - **ACID guarantees**: atomicity, consistency, isolation, durability
      prevent corruption from failures and concurrency
    - **Schema enforcement/evolution**: reject bad writes, safely add
      columns; `INSERT WITH SCHEMA EVOLUTION` (4.2) and
      `MERGE WITH SCHEMA EVOLUTION` (4.0)
    - **Time travel**: `VERSION AS OF` / `TIMESTAMP AS OF` for auditing,
      debugging, and reproducibility
    - **MERGE INTO** and `DataFrame.mergeInto` for upserts
    - **CDC**: Delta's change data feed (`readChangeFeed`,
      `table_changes`) in batch and streaming; Spark 4.2's engine-level
      `changes()` / `CHANGES` API works where a table format implements it
      (not plain Parquet; a preview in Delta 4.4.1)
    - **Maintenance**: vacuum/expire old snapshots, compact small files

    You now understand the storage layer that production data platforms
    are built on. In the next lesson you will use everything you have
    learned to build **machine learning pipelines with MLlib**.
