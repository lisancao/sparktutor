    ## Time Travel: Querying Historical Data

    Every write creates a new **version** (or **snapshot**). You can query
    any previous version. Spark's SQL grammar has standard syntax that
    table formats implement:

    ```sql
    SELECT * FROM catalog.db.events VERSION AS OF 5;
    SELECT * FROM catalog.db.events TIMESTAMP AS OF '2025-01-15 00:00:00';
    ```

    And the reader options:

    ```python
    # Delta Lake: by version number or timestamp
    spark.read.format("delta").option("versionAsOf", 5).load(path)
    spark.read.format("delta").option("timestampAsOf", "2025-01-15").load(path)

    # Iceberg: by snapshot ID
    spark.read.option("snapshot-id", 10963874102873).table("catalog.db.events")
    ```

    Use cases for time travel:
    - **Auditing**: prove what data looked like at a specific date
    - **Debugging**: compare current vs. previous versions to find when
      data went wrong
    - **Reproducibility**: re-run an analysis on the exact data it
      originally used

