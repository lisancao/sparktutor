    ## Exercise: A Real Delta Table

    This exercise uses Delta Lake 4.4.1. Its first line,
    `# spark-connectors: delta`, makes SparkTutor add the Delta jars and
    settings from "Adding Delta Lake to Spark 4.2"; the first submit
    downloads them (a few MB) once.

    Implement `delta_lakehouse(spark, path)`:

    1. Write `INITIAL_DATA` to `path` in Delta format with the option
       `delta.enableChangeDataFeed` set to `"true"`. That commit is
       version 0.
    2. Register `UPDATES` as a temp view `updates` and `MERGE` it into the
       table (`{table}` in the starter is ``delta.`<path>` ``, the SQL name for
       a Delta table stored at a path): update all columns when the id
       matches, insert when it does not. Version 1.
    3. Delete the employee with id 3. Version 2.
    4. Read the current table, and version 0 with `versionAsOf`.
    5. Collect `DESCRIBE HISTORY` as `(version, operation)` pairs, oldest
       first.
    6. Read the change data feed from version 1.

    Look at the printed change feed: Bob's raise appears twice
    (`update_preimage` with the old salary, `update_postimage` with the
    new one), and each row tells you which commit made it.

    Always read a Delta table with `format("delta")` (or by table name).
    `spark.read.parquet(path)` on a Delta directory raises no error but
    returns every data file ever written, including rows that were updated
    or deleted since.
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "Write with .write.format('delta').option('delta.enableChangeDataFeed', 'true').save(path). MERGE: WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *. Reads: spark.read.format('delta').option('versionAsOf', 0).load(path) and .option('readChangeFeed', 'true').option('startingVersion', 1)."

