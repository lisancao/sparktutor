    ## Change Data Capture: Reading What Changed

    Time travel answers "what did the table look like?". **Change data
    capture (CDC)** answers "which rows changed, and how?", which is what
    incremental pipelines need: process only the new changes instead of
    re-reading the whole table.

    **Delta Lake's change data feed** is how you do this on Delta today.
    Turn it on per table, then read changes in batch or as a stream:

    ```sql
    CREATE TABLE hr.employees (id INT, name STRING, salary DOUBLE)
      USING delta
      TBLPROPERTIES (delta.enableChangeDataFeed = true);
    ```

    ```python
    # Batch: every change from version 1 on (add endingVersion to stop early)
    changes = (spark.read
        .option("readChangeFeed", "true")
        .option("startingVersion", 1)
        .table("hr.employees"))

    # Streaming: new changes as they are committed
    stream = (spark.readStream
        .option("readChangeFeed", "true")
        .option("startingVersion", 1)
        .table("hr.employees"))
    ```

    ```sql
    SELECT * FROM table_changes('hr.employees', 1);
    ```

    Each change row has the table's columns plus:

    - `_change_type`: `insert`, `delete`, or for an update two rows,
      `update_preimage` (old values) and `update_postimage` (new values)
    - `_commit_version`: the table version that made the change
    - `_commit_timestamp`: when that version was committed

    Changes are recorded only from the moment the feed is enabled, and only
    for versions that `VACUUM` has not cleaned up.

- Class: text
  Depth: all
  Output: |
    ## Spark 4.2's Change Data Capture API

    Each format has its own CDC syntax (Delta's `readChangeFeed` /
    `table_changes`, Iceberg's changelog views). Spark 4.2 adds one
    engine-level API that any table format can implement (SPARK-55668):

    ```python
    changes = (spark.read
        .option("startingVersion", "10")
        .option("endingVersion", "20")
        .changes("catalog.db.orders"))
    ```

    ```sql
    SELECT * FROM catalog.db.orders CHANGES FROM VERSION 10 TO VERSION 20;
    SELECT * FROM catalog.db.orders
      CHANGES FROM VERSION 10
      WITH ('deduplicationMode' = 'netChanges');
    ```

    The rows have the same `_change_type`, `_commit_version` and
    `_commit_timestamp` columns as Delta's feed.

    **Where it works today**: only on tables whose catalog implements
    `TableCatalog.loadChangelog()`. Spark ships no such catalog, so on
    plain Parquet tables both forms fail with
    `UNSUPPORTED_FEATURE.CHANGE_DATA_CAPTURE` ("Catalog spark_catalog does
    not support Change Data Capture"). Delta 4.4.1 contains an early
    implementation that is off by default: it needs the internal setting
    `spark.databricks.delta.changelogV2.enabled=true` and a table with
    `delta.enableRowTracking = true`, answers batch queries only (a
    streaming `readStream.changes()` fails), and reports updates as a
    `delete` plus an `insert` unless you add `'computeUpdates' = 'true'`.
    Treat it as a preview; for Delta tables, use the change data feed
    above.

