    ## Three Major Lakehouse Formats

    **Delta Lake** — developed by Databricks. Uses a JSON-based
    transaction log (`_delta_log/`). Deep Spark integration. Strong
    community and tooling.

    **Apache Iceberg** — developed at Netflix. Uses metadata files with
    manifest lists. Designed for multi-engine access (Spark, Trino, Flink,
    Dremio). Supports hidden partitioning and partition evolution.

    **Apache Hudi** — developed at Uber. Optimized for upserts and
    incremental processing. Good for streaming + change data capture (CDC).

    All three provide ACID transactions, schema enforcement, time travel,
    and merge (upsert) operations. The choice depends on your ecosystem.

    **Docs:**
    [Delta Lake Quickstart](https://docs.delta.io/latest/quick-start.html) |
    [Iceberg Spark Guide](https://iceberg.apache.org/docs/latest/spark-getting-started/) |
    [Hudi Spark Guide](https://hudi.apache.org/docs/quick-start-guide)
    — setup, read/write, time travel, and schema evolution for each format.

