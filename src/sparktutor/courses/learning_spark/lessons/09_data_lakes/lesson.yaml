    ## 你将学到什么

    你已经学会了读取 Parquet 文件、运行 SQL 查询，甚至处理流数据。
    但当两个作业同时写入同一张表时会发生什么？如果写入中途失败呢？
    如何查询上周版本的数据？

    普通文件（Parquet、CSV）无法回答这些问题。**湖仓表格式**
    将数据库的可靠性与数据湖的规模结合起来。

    学完本课后，你将能够：

    - 解释从数据湖到湖仓的演进
    - 对比 Delta Lake、Apache Iceberg 和 Apache Hudi
    - 描述 ACID 保证及其重要性
    - 使用 schema 约束和 schema 演进
    - 通过时间旅行查询历史数据
    - 理解何时选择哪种格式

- Class: text
  Depth: all
  Output: |
    ## 数据架构的演进

    **数据库**（1970s-2000s）—— 结构化、符合 ACID、规模有限。
    适合事务，大规模分析成本高昂。

    **数据仓库** —— 为分析优化、结构化数据、扩展成本高昂。
    适合 BI，但 schema 僵化。

    **数据湖**（2010s）—— 以低成本在分布式存储（HDFS、S3、ADLS）上
    存储一切。Schema-on-read 意味着任何格式都行。
    问题：没有事务、没有质量约束，数据变成"数据沼泽"。

    **湖仓**（2020s）—— 将湖存储与仓库可靠性结合。
    你以低成本、可扩展的存储获得 ACID 事务、schema 约束
    和时间旅行。

- Class: text
  Depth: beginner
  Output: |
    数据湖就像一个巨大的仓库，你把所有东西都倒进去 ——
    一箱箱文件、照片、录音 —— 不管什么格式。它便宜又灵活，
    但很快就会变得一团糟。你无法撤销错误，两个人同时放箱子
    还会互相损坏对方的工作。

    湖仓增加了组织性：带标签的货架（schema 约束）、
    库存系统（事务日志）和撤销错误的能力（时间旅行）。
    你保留了湖的灵活性，同时获得了数据库的可靠性。

- Class: text
  Depth: all
  Output: |
    ## 三大湖仓格式

    **Delta Lake** —— 由 Databricks 开发。使用基于 JSON 的
    事务日志（`_delta_log/`）。与 Spark 深度集成。
    强大的社区和工具生态。

    **Apache Iceberg** —— 在 Netflix 开发。使用带有 manifest 列表的
    元数据文件。为多引擎访问设计（Spark、Trino、Flink、Dremio）。
    支持隐藏分区和分区演进。

    **Apache Hudi** —— 在 Uber 开发。针对 upsert 和增量处理优化。
    适合流处理 + 变更数据捕获（CDC）。

    三者都提供 ACID 事务、schema 约束、时间旅行和合并（upsert）操作。
    选择取决于你的技术生态。

    **文档：**
    [Delta Lake Quickstart](https://docs.delta.io/latest/quick-start.html) |
    [Iceberg Spark Guide](https://iceberg.apache.org/docs/latest/spark-getting-started/) |
    [Hudi Spark Guide](https://hudi.apache.org/docs/quick-start-guide)
    —— 每种格式的安装、读写、时间旅行和 schema 演进。

