    ## Upserts: MERGE INTO

    `MERGE INTO` applies inserts, updates, and deletes from a source in one
    atomic commit:

    ```sql
    MERGE INTO catalog.hr.employees t
    USING updates s
    ON t.id = s.id
    WHEN MATCHED THEN UPDATE SET *
    WHEN NOT MATCHED THEN INSERT *
    WHEN NOT MATCHED BY SOURCE THEN DELETE
    ```

    Since Spark 4.0 the same thing is available from the DataFrame API:

    ```python
    (updates_df.alias("s")
        .mergeInto("hr.employees", f.expr("employees.id = s.id"))
        .whenMatched().updateAll()
        .whenNotMatched().insertAll()
        .whenNotMatchedBySource().delete()
        .merge())
    ```

    Alias the source DataFrame and refer to the target by its table name:
    `mergeInto` has no way to alias the target.

    `withSchemaEvolution()` on the builder is the DataFrame form of
    `MERGE WITH SCHEMA EVOLUTION`. Both need a table format that implements
    `MERGE` (Delta, Iceberg, Hudi); plain Parquet tables do not. Delta
    4.4.1 on Spark 4.2 runs both the SQL and the DataFrame form.

    To replace a slice of a table in one atomic commit,
    `INSERT INTO t REPLACE WHERE <predicate> SELECT ...` (since Spark 3.4)
    deletes the rows that match the predicate and inserts the new ones; it
    works on Delta. Spark 4.2 adds grammar for key-based
    `INSERT INTO ... REPLACE ON <condition>` and `REPLACE USING (cols)`
    (SPARK-56001), but in 4.2.0 no table supports them yet: they fail with
    `UNSUPPORTED_FEATURE.TABLE_OPERATION`. DSv2 now also records row
    metrics (updated, deleted, inserted, copied) for `UPDATE`, `DELETE`
    and `INSERT`, shown in the SQL tab of the UI (SPARK-56524, SPARK-56551,
    SPARK-56680); `MERGE` has had them since 4.1.

