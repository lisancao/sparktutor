    ## What You'll Learn

    You have learned to read Parquet files, run SQL queries, and even
    process streaming data. But what happens when two jobs write to the
    same table at once? What if a write fails halfway? How do you query
    last week's version of your data?

    Plain files (Parquet, CSV) cannot answer these questions. **Lakehouse
    table formats** add the reliability of a database to the scale of a
    data lake.

    By the end of this lesson you will be able to:

    - Explain the evolution from data lakes to lakehouses
    - Compare Delta Lake, Apache Iceberg, and Apache Hudi
    - Describe ACID guarantees and why they matter
    - Use schema enforcement and schema evolution
    - Query historical data with time travel
    - Understand when to choose which format

- Class: text
  Depth: all
  Output: |
    ## The Evolution of Data Architectures

    **Databases** (1970s-2000s) — structured, ACID-compliant, limited
    scale. Great for transactions, expensive for large analytics.

    **Data warehouses** — optimized for analytics, structured data,
    expensive to scale. Good for BI but rigid schemas.

    **Data lakes** (2010s) — store everything cheaply on distributed
    storage (HDFS, S3, ADLS). Schema-on-read means any format goes.
    Problem: no transactions, no quality enforcement, data becomes a
    "data swamp."

    **Lakehouses** (2020s) — combine lake storage with warehouse
    reliability. You get cheap, scalable storage with ACID transactions,
    schema enforcement, and time travel.

- Class: text
  Depth: beginner
  Output: |
    A data lake is like a massive warehouse where you dump everything —
    boxes of documents, photos, recordings — in whatever format. It is
    cheap and flexible, but things get messy fast. You cannot undo a
    mistake, and two people dropping boxes at the same time can corrupt
    each other's work.

    A lakehouse adds organization: labeled shelves (schema enforcement),
    an inventory system (transaction log), and the ability to undo
    mistakes (time travel). You keep the flexibility of a lake with the
    reliability of a database.

