    ## 小结

    本课你学到了：

    - **数据架构演进** —— 数据库 → 仓库 → 数据湖 → 湖仓
    - **三种格式** —— Delta Lake、Apache Iceberg、Apache Hudi
      在数据湖存储上提供 ACID 事务
    - **ACID 保证** —— 原子性、一致性、隔离性、持久性
      防止故障和并发导致的损坏
    - **Schema 约束/演进** —— 拒绝坏写入，安全添加列
    - **时间旅行** —— 查询任何历史版本以用于审计、
      调试或可复现性
    - **维护** —— vacuum/过期旧快照、合并小文件

    你现在理解了生产数据平台赖以构建的存储层。在最后一课中，
    你将运用所学的一切，探索 **MLlib 机器学习** —— Spark 内置的
    大规模模型训练和部署库。
