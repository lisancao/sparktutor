    ## Upserts: MERGE INTO

    `MERGE INTO` applies inserts, updates, and deletes from a source in one
    atomic commit:

    ```sql
    MERGE INTO catalog.hr.employees t
    USING updates s
    ON t.id = s.id
    WHEN MATCHED THEN UPDATE SET *
    WHEN NOT MATCHED THEN INSERT *
    WHEN NOT MATCHED BY SOURCE THEN DELETE
    ```

    Since Spark 4.0 the same thing is available from the DataFrame API:

    ```python
    (updates_df.mergeInto("catalog.hr.employees", f.expr("t.id = s.id"))
        .whenMatched().updateAll()
        .whenNotMatched().insertAll()
        .whenNotMatchedBySource().delete()
        .merge())
    ```

    `withSchemaEvolution()` on the builder is the DataFrame form of
    `MERGE WITH SCHEMA EVOLUTION`. Both need a target table whose connector
    supports row-level operations (Delta, Iceberg, Hudi); plain
    `spark_catalog` Parquet tables do not. For simple partition-scoped
    replacement, 4.2 also adds `INSERT INTO ... REPLACE WHERE <condition>`
    and `INSERT INTO ... REPLACE USING (cols)` (SPARK-56001), and DSv2 now
    reports row counts for `UPDATE`, `DELETE`, `INSERT`, and `MERGE`
    (SPARK-56524, SPARK-56551, SPARK-56680).

