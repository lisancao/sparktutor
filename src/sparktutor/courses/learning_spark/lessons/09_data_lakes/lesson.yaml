    ## CDC Post-Processing Options

    A raw changelog is noisy. Copy-on-write table formats rewrite whole
    files, so an update to one row can appear as a delete and re-insert of
    every *other* row in that file (carry-over rows). The CDC API cleans
    this up for you, controlled by options on `.option(...)` or the SQL
    `WITH (...)` clause:

    - `deduplicationMode`:
      - `dropCarryovers` (default): remove identical insert/delete pairs
        produced by file rewrites
      - `netChanges`: collapse all changes to a row identity within the
        range into its net effect (inserted then deleted means nothing)
      - `none`: raw rows from the connector
    - `computeUpdates` (default `false`): derive `update_preimage` /
      `update_postimage` pairs from matching delete/insert pairs, for
      connectors that record updates that way

    Connectors declare which clean-up they need (`containsCarryoverRows`,
    `containsIntermediateChanges`, `representsUpdateAsDeleteAndInsert` on
    the `Changelog` interface), so Spark skips the work when the source is
    already clean. Streaming reads support row-level post-processing and
    `netChanges` too (SPARK-56686, SPARK-56687).

    On top of the same machinery, Spark Declarative Pipelines gained
    **Auto CDC** in 4.2 (SPARK-56249): Python APIs that apply a CDC feed to
    a target as SCD Type 1 (latest value wins).

- Class: text
  Depth: advanced
  Output: |
    ## Delta Lake vs. Iceberg: Choosing a Format

    | Feature | Delta Lake | Apache Iceberg |
    |---------|-----------|----------------|
    | Transaction log | JSON commits + Parquet checkpoints | Metadata files + manifest lists + manifests |
    | Multi-engine | Spark-first, growing elsewhere | Designed for many engines |
    | Partitioning | Explicit partition columns (plus liquid clustering) | Hidden partitioning, partition evolution |
    | Schema evolution | `mergeSchema`, ALTER TABLE | ALTER TABLE, type promotion |
    | Governance | Linux Foundation | Apache Software Foundation |

    **Choose Delta** when you work primarily with Spark and Databricks.
    **Choose Iceberg** when you need multi-engine access or advanced
    partition management.

    Both support ACID, time travel, schema evolution, and merge operations.

- Class: text
  Depth: advanced
  Output: |
    ## Maintenance Operations

    Lakehouse tables accumulate old data files over time. Regular
    maintenance keeps them performant:

    **Compaction**: merge small files into larger ones for better read
    performance (`OPTIMIZE` in Delta, `rewrite_data_files` in Iceberg).

    **Vacuum / Expire snapshots**: remove old data files no longer
    needed by any retained version:
    ```python
    # Delta Lake
    spark.sql("VACUUM delta.`/data/events` RETAIN 168 HOURS")

    # Iceberg
    spark.sql("CALL catalog.system.expire_snapshots('db.events', TIMESTAMP '2025-01-01 00:00:00')")
    ```

    **History**: view all operations:
    ```python
    spark.sql("DESCRIBE HISTORY delta.`/data/events`")
    ```

    Expiring snapshots also ends time travel and CDC to those versions.
    Never vacuum below the default retention (7 days for Delta) unless you
    are certain no long-running query or downstream CDC consumer needs older
    versions.

