  Output: |
    ## ACID 保证

    湖仓提供与数据库相同的 ACID 特性：

    - **原子性（Atomicity）** —— 写入要么完全成功，要么完全不发生。
      不会留下导致数据损坏的部分写入。
    - **一致性（Consistency）** —— schema 约束确保每行都符合表 schema。
      坏数据在写入时被拒绝。
    - **隔离性（Isolation）** —— 并发读取者看到一致的快照。
      读取者永远不会看到写了一半的批次。
    - **持久性（Durability）** —— 一旦写入被提交，它就是永久的 ——
      存储在事务日志中。

    这些保证意味着你可以放心地运行管道，无需担心故障或并发
    导致的数据损坏。

- Class: text
  Depth: all
  Output: |
    ## Schema 约束与演进

    **Schema 约束**拒绝不符合表 schema 的写入。如果你的管道
    意外产生了类型错误的列，写入会立即失败，而不是默默地
    损坏数据。

    **Schema 演进**让你可以安全地添加列或拓宽类型，
    而无需重写现有数据：

    ```python
    # Delta Lake — merge schema on append
    (new_df.write
        .format("delta")
        .mode("append")
        .option("mergeSchema", "true")
        .save(path))

    # Iceberg — ALTER TABLE
    spark.sql("ALTER TABLE catalog.db.events ADD COLUMN browser STRING")
    ```

    现有数据不变 —— 新列在旧行中显示为 `null`。

- Class: text
  Depth: intermediate
  Output: |
    ## 时间旅行：查询历史数据

    每次写入都会创建一个新的**版本**（或**快照**）。
    你可以查询任何历史版本：

    ```python
    # Delta Lake — by version number
    spark.read.format("delta").option("versionAsOf", 5).load(path)

    # Delta Lake — by timestamp
    spark.read.format("delta").option("timestampAsOf", "2025-01-15").load(path)

    # Iceberg — by snapshot ID
    spark.read.format("iceberg").option("snapshot-id", 12345).load("db.table")
    ```

    时间旅行的用例：
    - **审计** —— 证明数据在特定日期的样子
    - **调试** —— 对比当前版本与历史版本，找到数据出错的时间点
    - **可复现性** —— 在最初使用的确切数据上重新运行分析

