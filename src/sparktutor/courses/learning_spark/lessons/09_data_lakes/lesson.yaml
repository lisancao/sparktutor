  Output: |
    ## Delta Lake vs. Iceberg: Choosing a Format

    | Feature | Delta Lake | Apache Iceberg |
    |---------|-----------|----------------|
    | Transaction log | JSON + checkpoint Parquet | Metadata files + manifests |
    | Multi-engine | Spark-centric (expanding) | Spark, Trino, Flink, Dremio |
    | Partitioning | Explicit `PARTITIONED BY` | Hidden partitioning, partition evolution |
    | Schema evolution | mergeSchema option | ALTER TABLE, full type promotion |
    | Community | Databricks-led | Apache Foundation, multi-vendor |

    **Choose Delta** when working primarily with Spark and Databricks.
    **Choose Iceberg** when you need multi-engine access or advanced
    partition management.

    Both support ACID, time travel, schema evolution, and merge operations.

- Class: text
  Depth: advanced
  Output: |
    ## Maintenance Operations

    Lakehouse tables accumulate old data files over time. Regular
    maintenance keeps them performant:

    **Compaction** — merge small files into larger ones for better read
    performance.

    **Vacuum / Expire snapshots** — remove old data files no longer
    needed by any active version:
    ```python
    # Delta Lake
    spark.sql("VACUUM delta.`/data/events` RETAIN 168 HOURS")

    # Iceberg
    spark.sql("CALL catalog.system.expire_snapshots('db.events', TIMESTAMP '2025-01-01')")
    ```

    **History** — view all operations:
    ```python
    spark.sql("DESCRIBE HISTORY delta.`/data/events`")
    ```

    Never vacuum below the default retention (7 days for Delta) unless
    you are certain no long-running queries need older versions.

