    ## What You'll Learn

    You have learned to read Parquet files, run SQL queries, and even
    process streaming data. But what happens when two jobs write to the
    same table at once? What if a write fails halfway? How do you query
    last week's version of your data, or ask for just the rows that changed
    since yesterday?

    Plain files (Parquet, CSV) cannot answer these questions. **Lakehouse
    table formats** add the reliability of a database to the scale of a
    data lake.

    By the end of this lesson you will be able to:

    - Explain the evolution from data lakes to lakehouses
    - Compare Delta Lake, Apache Iceberg, and Apache Hudi
    - Describe ACID guarantees and why they matter
    - Use schema enforcement and schema evolution, including the
      `INSERT WITH SCHEMA EVOLUTION` SQL that Spark 4.2 added
    - Query historical data with time travel
    - Upsert with `MERGE INTO` and the DataFrame `mergeInto` API (4.0)
    - Read row-level changes with Delta Lake's change data feed, and know
      where Spark 4.2's new Change Data Capture API (`changes()` and the
      `CHANGES` clause) stands
    - Add Delta Lake to Spark 4.2 yourself and use it from a real exercise

- Class: text
  Depth: all
  Output: |
    ## The Evolution of Data Architectures

    **Databases**: structured, ACID-compliant, limited scale. Great for
    transactions, expensive for large analytics.

    **Data warehouses**: optimized for analytics on structured data,
    expensive to scale. Good for BI but rigid schemas.

    **Data lakes**: store everything cheaply on distributed storage (HDFS,
    S3, ADLS, GCS). Schema-on-read means any format goes. Problem: no
    transactions, no quality enforcement, and data becomes a "data swamp."

    **Lakehouses**: combine lake storage with warehouse reliability. You get
    cheap, scalable storage with ACID transactions, schema enforcement, and
    time travel, through an open table format sitting on top of Parquet
    files.

- Class: text
  Depth: beginner
  Output: |
    A data lake is like a massive warehouse where you dump everything
    (boxes of documents, photos, recordings) in whatever format. It is
    cheap and flexible, but things get messy fast. You cannot undo a
    mistake, and two people dropping boxes at the same time can corrupt
    each other's work.

    A lakehouse adds organization: labeled shelves (schema enforcement),
    an inventory system (transaction log), the ability to undo mistakes
    (time travel), and a delivery log that lists every box that came in or
    went out (change data capture). You keep the flexibility of a lake with
    the reliability of a database.

- Class: text
  Depth: all
  Output: |
    ## Three Major Lakehouse Formats

    **Delta Lake**: created at Databricks, now a Linux Foundation project.
    Uses a transaction log of JSON commits plus Parquet checkpoints
    (`_delta_log/`). Deep Spark integration.

    **Apache Iceberg**: created at Netflix, an Apache project. Uses a tree
    of metadata files, manifest lists, and manifests. Designed for
    multi-engine access (Spark, Trino, Flink, and others). Supports hidden
    partitioning and partition evolution.

    **Apache Hudi**: created at Uber, an Apache project. Optimized for
    upserts and incremental processing; strong for streaming ingestion and
    change data capture (CDC).

    All three provide ACID transactions, schema enforcement, time travel,
    and merge (upsert) operations. None of them ships inside Apache Spark:
    each is a separate connector you add to Spark, and connector releases
    trail Spark releases. As of October 2026, Delta Lake 4.4.1 has a build
    for Spark 4.2; Iceberg (1.12.0), Hudi and Paimon support Spark up to
    4.1. Check the format's compatibility matrix before you upgrade Spark.

    **Docs:**
    [Delta Lake Quickstart](https://docs.delta.io/latest/quick-start.html) |
    [Iceberg Spark Guide](https://iceberg.apache.org/docs/latest/spark-getting-started/) |
    [Hudi Spark Guide](https://hudi.apache.org/docs/quick-start-guide)

