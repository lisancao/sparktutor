    ## ACID Guarantees

    Lakehouses provide the same ACID properties as databases:

    - **Atomicity**: a write either succeeds completely or not at all.
      No partial writes that leave corrupt data.
    - **Consistency**: schema enforcement ensures every row matches the
      table schema. Bad data is rejected at write time.
    - **Isolation**: concurrent readers see consistent snapshots. A reader
      never sees a half-written batch. Concurrent writers are resolved by
      optimistic concurrency: one commit wins, the other retries or fails.
    - **Durability**: once a write is committed, it is permanent, recorded
      in the transaction log.

    These guarantees mean you can run pipelines confidently without
    worrying about data corruption from failures or concurrency.

