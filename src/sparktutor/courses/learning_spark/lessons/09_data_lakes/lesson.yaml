    ## Adding Delta Lake to Spark 4.2

    Delta needs its jars on Spark's classpath plus two settings: a SQL
    extension (for `MERGE`, `DESCRIBE HISTORY`, `VACUUM` and friends) and a
    catalog that understands Delta tables. Pick one of these.

    **With spark-submit** (Spark downloads the jars from Maven Central on
    the first run and caches them):

    ```bash
    spark-submit \
      --packages io.delta:delta-spark_4.2_2.13:4.4.1 \
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
      my_job.py
    ```

    **With pip**, for scripts you start with `python my_job.py`:

    ```bash
    pip install "delta-spark==4.4.1"
    ```

    ```python
    from delta import configure_spark_with_delta_pip
    from pyspark.sql import SparkSession

    builder = (SparkSession.builder
        .config("spark.sql.extensions", "io.delta.sql.DeltaSparkSessionExtension")
        .config("spark.sql.catalog.spark_catalog",
                "org.apache.spark.sql.delta.catalog.DeltaCatalog"))
    spark = configure_spark_with_delta_pip(builder).getOrCreate()
    ```

    The artifact name carries the Spark version: `delta-spark_4.2_2.13` is
    Delta for Spark 4.2 and Scala 2.13; always use the build that matches
    your Spark version. In SparkTutor, the exercise's first line
    `# spark-connectors: delta` does all of this for you.

    If `--packages` fails with `download failed` for a jar that is plainly
    on Maven Central, look in `~/.m2/repository`: an earlier Maven build can
    leave a library's metadata there without its jar, and Spark's resolver
    trusts it. Deleting that library's folder fixes it.

