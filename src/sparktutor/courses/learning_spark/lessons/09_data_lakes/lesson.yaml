    ## Schema Enforcement and Evolution

    **Schema enforcement** rejects writes that do not match the table
    schema. If your pipeline accidentally produces a column with the wrong
    type, the write fails immediately instead of silently corrupting data.

    **Schema evolution** lets you safely add columns or widen types without
    rewriting existing data:

    ```python
    # Delta Lake: merge schema on append
    (new_df.write
        .format("delta")
        .mode("append")
        .option("mergeSchema", "true")
        .save(path))

    # Any table format: explicit DDL
    spark.sql("ALTER TABLE catalog.db.events ADD COLUMN browser STRING")
    ```

    Spark 4.2 adds a format-neutral SQL form for DSv2 tables
    (SPARK-54971, SPARK-55690): the insert itself declares that new source
    columns may be added to the target.

    ```sql
    INSERT WITH SCHEMA EVOLUTION INTO catalog.db.events
    SELECT * FROM staged_events
    ```

    `MERGE WITH SCHEMA EVOLUTION INTO ...` is the merge equivalent. The
    connector decides which changes it supports. Existing data is unchanged;
    new columns appear as `NULL` in old rows.

