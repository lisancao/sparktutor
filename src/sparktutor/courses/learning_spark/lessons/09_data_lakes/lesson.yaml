    ## Exercise: Lakehouse Simulation

    This exercise runs on plain PySpark (no Delta or Iceberg JARs), so you
    will simulate lakehouse concepts with versioned Parquet directories and
    build the change feed yourself, in the same shape as Spark 4.2's CDC
    API.

    Implement `lakehouse_simulation(spark, base_path)`:

    1. Write the initial employees as version 0 (`v0/`)
    2. Build version 1: the initial employees with Bob's raise applied
       (`RAISES`), plus the new hires. Write it to `v1/`.
    3. Read both versions back (time travel)
    4. Verify the schemas match
    5. Compute the changes from v0 to v1 with `exceptAll` in both
       directions. Rows only in v1 are `insert`, rows only in v0 are
       `delete`. Add `_change_type` and `_commit_version` (1) columns.
    6. Return a dict with both versions, their counts, the schema check,
       and the changes DataFrame

    A changed row (Bob) shows up as a delete plus an insert, which is
    exactly the shape `computeUpdates` turns into
    `update_preimage`/`update_postimage`.
