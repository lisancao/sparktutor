    ## Change Data Capture in Spark 4.2

    Time travel answers "what did the table look like?". **Change data
    capture (CDC)** answers "which rows changed between two versions?",
    which is what incremental pipelines need. Each format used to expose
    this its own way (Delta's change data feed, Iceberg's changelog views).
    Spark 4.2 adds one engine-level API (SPARK-55668):

    ```python
    # Batch: changes between two versions
    changes = (spark.read
        .option("startingVersion", "10")
        .option("endingVersion", "20")
        .changes("catalog.db.orders"))

    # Streaming: an open-ended change feed
    stream = spark.readStream.changes("catalog.db.orders")
    ```

    ```sql
    SELECT * FROM catalog.db.orders CHANGES FROM VERSION 10 TO VERSION 20;
    SELECT * FROM catalog.db.orders
      CHANGES FROM TIMESTAMP '2025-01-01 00:00:00'
      WITH ('deduplicationMode' = 'netChanges');
    ```

    Every change row carries the data columns plus `_change_type`
    (`insert`, `delete`, `update_preimage`, `update_postimage`),
    `_commit_version`, and `_commit_timestamp`.

    **Where it works**: only on DSv2 tables whose catalog implements
    `TableCatalog.loadChangelog()`. Spark itself ships no such catalog. On
    the built-in `spark_catalog` with Parquet tables, both forms fail with
    `UNSUPPORTED_FEATURE.CHANGE_DATA_CAPTURE` ("Catalog spark_catalog does
    not support Change Data Capture"). You get CDC once your table format's
    connector implements the new interface.

