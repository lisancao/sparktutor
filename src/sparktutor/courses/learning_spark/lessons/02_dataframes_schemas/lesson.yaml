    ## Schema Definition with StructType

    A schema describes a DataFrame's structure: column names, data types,
    and nullability. You define one with `StructType` and `StructField`:

    ```python
    from pyspark.sql.types import (
        StructType, StructField, StringType, IntegerType, ArrayType)

    schema = StructType([
        StructField("Id", IntegerType(), False),       # not nullable
        StructField("First", StringType(), False),
        StructField("Last", StringType(), False),
        StructField("Hits", IntegerType(), False),
        StructField("Campaigns", ArrayType(StringType()), False),
    ])
    ```

    Each `StructField` takes three arguments: **name**, **type**, **nullable**.

    The same schema as a **DDL string**, which every API that takes a schema
    also accepts:

    ```python
    schema = "Id INT NOT NULL, First STRING NOT NULL, Last STRING NOT NULL, " \
             "Hits INT NOT NULL, Campaigns ARRAY<STRING> NOT NULL"
    ```

    Common types: `StringType`, `IntegerType`, `LongType`, `DoubleType`,
    `DecimalType`, `BooleanType`, `DateType`, `TimestampType`,
    `TimestampNTZType` (timestamp without time zone).

    Complex types: `ArrayType(elementType)`, `MapType(keyType, valueType)`,
    and nested `StructType` for struct-within-struct.

    **Docs:**
    [StructType](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.types.StructType.html) |
    [ArrayType](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.types.ArrayType.html) |
    [MapType](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.types.MapType.html) |
    [Data types reference](https://spark.apache.org/docs/4.2.0/sql-ref-datatypes.html)

