    ## Creating DataFrames from Python Data

    You can build a DataFrame from Python lists:

    ```python
    data = [
        [1, "Alice", 30],
        [2, "Bob", 25],
    ]
    df = spark.createDataFrame(data, schema)
    ```

    Or using **Row objects** (column names come from keyword arguments):

    ```python
    from pyspark.sql import Row

    rows = [
        Row(id=1, name="Alice", age=30),
        Row(id=2, name="Bob", age=25),
    ]
    df = spark.createDataFrame(rows)
    ```

    Row objects are convenient for quick prototyping. For production code,
    prefer explicit schemas; they are unambiguous and self-documenting.

    `createDataFrame` also accepts a pandas DataFrame, a PyArrow `Table`, or
    a NumPy array. In 4.2 these conversions go through Arrow by default
    (`spark.sql.execution.arrow.pyspark.enabled` now defaults to `true`), and
    `df.toArrow()` (since 4.0) returns a `pyarrow.Table` without going
    through pandas at all.

