    ## DataFrames: Distributed Tables

    A DataFrame is a distributed collection of data organized into named,
    typed columns, like a table in a relational database. Two critical
    properties:

    1. **Immutable**: every transformation returns a *new* DataFrame. The
       original is never modified. This makes Spark programs safe to
       parallelize.
    2. **Lazy**: transformations build up a logical plan. Nothing executes
       until you call an action like `show()`, `count()`, or `collect()`.

    Under the hood, a DataFrame tracks a **schema** (column names and types)
    and a **logical plan** (the chain of transformations that produces it).
    In Spark Connect mode the client holds exactly that: a schema it can ask
    the server for, and a plan it ships to the server on each action.

