    ## Analogy: DataFrames as Spreadsheets

    Think of a DataFrame like a spreadsheet. Each column has a name and a
    type (text, number, date). You cannot change cells in place; instead,
    you create a new sheet with your changes applied.

    - `filter()`: highlight rows matching a condition, copy them to a new
      sheet
    - `withColumn()`: add a new column computed from existing ones
    - `select()`: pick only the columns you need
    - `drop()`: remove a column

    The original sheet is never touched. This copy-on-write approach is
    what makes Spark safe to run across hundreds of machines simultaneously.

