    ## What You'll Learn

    In the previous lesson you created a SparkSession and performed your
    first aggregation. Now you will understand the **DataFrame**, Spark's
    core data abstraction, and the **schema system** that gives it
    structure.

    By the end of this lesson you will be able to:

    - Explain what a DataFrame is and why it is immutable
    - Use `select`, `filter`, `withColumn`, `withColumns`, `drop`, and
      `withColumnRenamed`
    - Write column expressions with `col()`, bracket notation, and `expr()`
    - Define explicit schemas with `StructType` or DDL strings
    - Create DataFrames from Python data
    - Work with complex types (arrays, maps, nested structs) and know which
      types Spark 4.x added
    - Explain how ANSI mode changes type conversion and arithmetic

