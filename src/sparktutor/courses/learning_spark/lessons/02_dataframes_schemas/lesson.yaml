    ## Schema Inference vs. Explicit Schemas

    When reading CSV or JSON, Spark can infer the schema:

    ```python
    df = spark.read.option("inferSchema", "true").csv("data.csv")
    ```

    However, **inferSchema reads the data twice** — once to sample rows and
    determine types, once to actually load. For production workloads, always
    define schemas explicitly:

    - **Faster** — avoids the extra scan
    - **More reliable** — you control the types, not Spark's guesses
    - **Catches issues early** — malformed data raises errors at load time
      instead of producing silent nulls

    Parquet and ORC embed schemas in their file metadata, so inference is
    free for those formats. This is one reason Parquet is Spark's preferred
    format.

