    ## Common DataFrame Operations

    These are the transformations you will use most often:

    **Selecting columns:**
    ```python
    df.select("First", "Last", "Hits")
    ```

    **Filtering rows:**
    ```python
    from pyspark.sql.functions import col
    df.filter(col("Hits") > 10000)
    ```

    **Adding or replacing a column:**
    ```python
    df.withColumn("Double_Hits", col("Hits") * 2)
    ```

    **Adding several columns in one step** (one projection in the plan
    instead of one per call):
    ```python
    df.withColumns({
        "Double_Hits": col("Hits") * 2,
        "Full_Name": f.concat_ws(" ", "First", "Last"),
    })
    ```

    **Removing a column:**
    ```python
    df.drop("Url")
    ```

    **Renaming columns:**
    ```python
    df.withColumnRenamed("First", "FirstName")
    df.withColumnsRenamed({"First": "FirstName", "Last": "LastName"})
    ```

    All of these return new DataFrames. They are transformations (lazy);
    nothing executes until you call an action.

    **Docs:**
    [select](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.select.html) |
    [filter](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.filter.html) |
    [withColumn](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.withColumn.html) |
    [withColumns](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.withColumns.html) |
    [drop](https://spark.apache.org/docs/4.2.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.drop.html)

