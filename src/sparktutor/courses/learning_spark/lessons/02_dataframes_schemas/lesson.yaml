    ## Types Added in Spark 4.x

    **VARIANT** (`VariantType`, since 4.0) stores semi-structured data such
    as JSON in an efficient binary encoding, without fixing a schema up
    front. You create it with `parse_json()` and read fields out with
    `variant_get()` or the `:` path syntax in SQL:

    ```python
    events = df.select(f.parse_json("payload_json").alias("payload"))
    events.select(f.variant_get("payload", "$.device.os", "string"))
    spark.sql("SELECT payload:device.os::string FROM events")
    ```

    VARIANT is the right type when the shape of the data varies from row
    to row; a `StructType` is still better when the shape is fixed. Lesson 4
    covers it in detail.

    **Collated strings** (since 4.0) attach comparison rules to a string
    type. `STRING COLLATE UTF8_LCASE` compares case-insensitively, so
    `'Alice'` and `'alice'` group, join, and deduplicate as equal:

    ```python
    df = spark.createDataFrame([("Alice",), ("alice",)], "name STRING COLLATE UTF8_LCASE")
    df.distinct().count()   # 1
    ```

    A `TIME` type (time of day without a date) exists in the 4.2 codebase
    but sits behind an internal flag that is off by default, so `TIME`
    literals fail with `UNSUPPORTED_TIME_TYPE` on a stock 4.2.0 build. Treat
    it as not yet available.

