    ## Column Expressions

    There are three equivalent ways to reference a column:

    ```python
    from pyspark.sql.functions import col, expr

    col("Hits")          # function-based (most common in PySpark)
    df["Hits"]           # bracket notation
    expr("Hits")         # SQL expression string
    ```

    `expr()` is the most flexible because it accepts full SQL syntax:

    ```python
    expr("Hits * 2")
    expr("Hits > 10000")
    expr("CASE WHEN Hits > 10000 THEN 'big' ELSE 'small' END")
    ```

    All three produce **Column objects**: lazy descriptions of computation.
    They describe *what* to compute, not *when*. Spark evaluates them only
    when an action triggers execution.

