    ## Summary

    In this lesson you learned:

    - **DataFrames** are immutable, distributed tables with named, typed
      columns; every transformation returns a new DataFrame
    - **Core operations**: `select`, `filter`, `withColumn`, `withColumns`,
      `drop`, and `withColumnRenamed` are your daily tools
    - **Column expressions**: `col()`, `df["col"]`, and `expr()` all
      produce lazy Column objects; `expr()` supports full SQL syntax
    - **Schemas**: `StructType`/`StructField` or a DDL string; explicit
      schemas beat inference for production
    - **Complex and new types**: arrays, maps, nested structs, plus
      `VARIANT` and collated strings from Spark 4.x
    - **ANSI mode**: strict casts and arithmetic by default, with `try_*`
      functions for deliberate leniency

    Next, you will learn how to read and write data in multiple formats
    (CSV, JSON, Parquet, ORC, XML) and when to use each.
