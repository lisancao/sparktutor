    ## 从 Python 数据创建 DataFrame

    你可以从 Python 列表构建 DataFrame：

    ```python
    data = [
        [1, "Alice", 30],
        [2, "Bob", 25],
    ]
    df = spark.createDataFrame(data, schema)
    ```

    或者使用 **Row 对象**（列名来自关键字参数）：

    ```python
    from pyspark.sql import Row

    rows = [
        Row(id=1, name="Alice", age=30),
        Row(id=2, name="Bob", age=25),
    ]
    df = spark.createDataFrame(rows)
    ```

    Row 对象适合快速原型开发。对于生产代码，优先使用显式 schema ——
    它们没有歧义且自带文档。

