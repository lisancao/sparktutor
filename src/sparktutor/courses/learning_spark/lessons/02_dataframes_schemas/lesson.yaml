    ## Summary

    In this lesson you learned:

    - **DataFrames** are immutable, distributed tables with named, typed
      columns — every transformation returns a new DataFrame
    - **Core operations** — `select`, `filter`, `withColumn`, `drop`, and
      `withColumnRenamed` are your daily tools
    - **Column expressions** — `col()`, `df["col"]`, and `expr()` all
      produce lazy Column objects; `expr()` supports full SQL syntax
    - **Schemas** — `StructType` and `StructField` define structure;
      explicit schemas beat inference for production
    - **Complex types** — `ArrayType`, `MapType`, and nested `StructType`
      handle real-world nested data
    - **createDataFrame** — build DataFrames from Python lists or Row objects

    Next, you will learn how to read and write data in multiple formats —
    CSV, JSON, Parquet, and ORC — and understand when to use each.
