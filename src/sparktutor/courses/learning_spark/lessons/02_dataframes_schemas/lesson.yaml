    ## 列表达式

    有三种等价方式引用列：

    ```python
    from pyspark.sql.functions import col, expr

    col("Hits")          # 函数式（PySpark 中最常见）
    df["Hits"]           # 方括号语法
    expr("Hits")         # SQL 表达式字符串
    ```

    `expr()` 最强大，因为它接受完整的 SQL 语法：

    ```python
    expr("Hits * 2")
    expr("Hits > 10000")
    expr("CASE WHEN Hits > 10000 THEN 'big' ELSE 'small' END")
    ```

    三者都产生 **Column 对象** —— 对计算的惰性描述。它们描述*计算什么*，
    而不是*何时计算*。Spark 只在 action 触发执行时才对它们求值。

