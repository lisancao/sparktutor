    ## Schema Inference vs. Explicit Schemas

    When reading CSV or JSON, Spark can infer the schema:

    ```python
    df = spark.read.option("inferSchema", "true").csv("data.csv")
    ```

    However, **inferSchema scans the data an extra time** to determine
    types before loading it. For production workloads, define schemas
    explicitly:

    - **Faster**: avoids the extra scan
    - **More reliable**: you control the types, not Spark's guesses
    - **Catches issues early**: in the default PERMISSIVE parse mode,
      malformed fields become nulls, and with `mode="FAILFAST"` they raise
      immediately; either way the type is the one you chose

    Parquet and ORC embed schemas in their file metadata, so inference is
    free for those formats. This is one reason Parquet is Spark's default
    format.

