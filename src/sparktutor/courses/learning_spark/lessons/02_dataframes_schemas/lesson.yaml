    ## ANSI Mode: Types Mean What They Say

    Since Spark 4.0, `spark.sql.ansi.enabled` defaults to `true`. The type
    system stops papering over bad data:

    | Operation | Spark 3.x default | Spark 4.x default |
    |-----------|-------------------|-------------------|
    | `CAST('x' AS INT)` | `NULL` | error `CAST_INVALID_INPUT` |
    | `INT` overflow (`2147483647 + 1`) | wraps around | error `ARITHMETIC_OVERFLOW` |
    | `1 / 0` | `NULL` | error `DIVIDE_BY_ZERO` |
    | `to_date('13/45/2019', 'M/d/yyyy')` | `NULL` | error `CANNOT_PARSE_TIMESTAMP` |

    Every strict operation has a lenient twin that returns `NULL`:

    ```python
    f.col("s").try_cast("int")          # Column.try_cast, since 4.0
    f.try_divide("a", "b")
    f.try_add("a", "b")
    f.try_to_date("Published", "M/d/yyyy")
    ```

    Use the strict form by default so bad data fails loudly, and the `try_`
    form only where you have decided a `NULL` is an acceptable answer.

