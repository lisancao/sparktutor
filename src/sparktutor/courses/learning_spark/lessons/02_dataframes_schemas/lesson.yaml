    ## 你将学到什么

    在上一课中，你创建了 SparkSession 并完成了第一次聚合。现在你将深入理解
    **DataFrame** —— Spark 的核心数据抽象 —— 以及赋予其结构的
    **schema 系统**。

    学完本课后，你将能够：

    - 解释什么是 DataFrame 以及它为什么不可变
    - 使用 `select`、`filter`、`withColumn`、`drop` 和 `withColumnRenamed`
    - 用 `col()`、方括号语法和 `expr()` 编写列表达式
    - 用 `StructType` 和 `StructField` 定义显式 schema
    - 从 Python 数据创建 DataFrame
    - 处理复杂类型：数组、映射和嵌套结构体

- Class: text
  Depth: all
  Output: |
    ## DataFrame：分布式表

    DataFrame 是组织成具名、类型化列的分布式数据集合 —— 就像关系数据库中的表。
    两个关键属性：

    1. **不可变（Immutable）** —— 每次转换都返回一个*新的* DataFrame。
       原始 DataFrame 永不修改。这使得 Spark 程序可以安全地并行化。
    2. **惰性（Lazy）** —— 转换会构建一个逻辑计划。在你调用
       `show()`、`count()` 或 `collect()` 等 action 之前，什么都不会执行。

    在底层，DataFrame 跟踪一个 **schema**（列名和类型）和一个
    **逻辑计划**（产生它的转换链）。

- Class: text
  Depth: beginner
  Output: |
    ## 类比：把 DataFrame 想象成电子表格

    把 DataFrame 想象成电子表格。每列有名称和类型（文本、数字、日期）。
    你不能原地修改单元格 —— 而是创建一个应用了更改的新工作表。

    - `filter()` —— 高亮匹配条件的行，复制到新工作表
    - `withColumn()` —— 添加一列由已有列计算出的新列
    - `select()` —— 只选取你需要的列
    - `drop()` —— 移除一列

    原始工作表从不被触碰。这种"写时复制"（copy-on-write）方法正是
    Spark 能同时在数百台机器上安全运行的原因。

- Class: text
