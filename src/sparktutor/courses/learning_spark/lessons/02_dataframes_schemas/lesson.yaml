  Output: |
    ## Schema 推断 vs. 显式 Schema

    读取 CSV 或 JSON 时，Spark 可以推断 schema：

    ```python
    df = spark.read.option("inferSchema", "true").csv("data.csv")
    ```

    然而，**inferSchema 会读取数据两次** —— 一次采样行并确定类型，
    一次实际加载。对于生产工作负载，始终显式定义 schema：

    - **更快** —— 避免额外的扫描
    - **更可靠** —— 类型由你控制，而非 Spark 的猜测
    - **尽早发现问题** —— 格式错误的数据在加载时就报错，
      而不是静默产生 null

    Parquet 和 ORC 将 schema 嵌入文件元数据中，因此对这些格式而言
    推断是免费的。这是 Parquet 成为 Spark 首选格式的原因之一。

