    ## Column Expressions Under the Hood

    Both `col()` and `expr()` produce Column objects, but they take
    different paths through Spark:

    - `col("name")` creates a direct **UnresolvedAttribute** reference.
    - `expr("name * 2")` is fed through Spark's SQL parser, producing an
      expression tree that supports arithmetic, function calls, CASE/WHEN,
      and nested field access.

    Because Column objects are lazy, chaining transformations like:

    ```python
    df.select(col("a") + col("b")).filter(col("c") > 10)
    ```

    builds a **logical plan**. Spark's Catalyst optimizer then rewrites
    this plan — pushing filters below projections, pruning unused columns,
    folding constants — before generating the physical execution plan.

    Defining schemas explicitly helps the optimizer: it knows exact types
    and can choose more efficient operations (integer comparison vs. string
    comparison).

