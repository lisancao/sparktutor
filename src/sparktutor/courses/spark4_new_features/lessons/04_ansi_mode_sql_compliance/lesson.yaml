    ## ANSI Config Options

    You can disable ANSI for specific operations or the whole session:

    ```python
    spark.conf.set("spark.sql.ansi.enabled", "false")
    ```

    Or enable it on Spark 3 for migration testing:

    ```python
    spark.conf.set("spark.sql.ansi.enabled", "true")
    ```

    Best practice: fix with try_* and keep ANSI on. Disabling is a temporary
    escape hatch.

