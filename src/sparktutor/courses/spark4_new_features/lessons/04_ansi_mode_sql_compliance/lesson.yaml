  Output: |
    ## Example: Revenue Per Order

    Spark 3 code that might overflow or divide by zero:

    ```python
    df.withColumn("avg_price", f.col("revenue") / f.col("order_count"))
    ```

    If order_count is 0, Spark 4 throws. Fix:

    ```python
    df.withColumn("avg_price", f.try_divide(f.col("revenue"), f.col("order_count")))
    ```

    If revenue * quantity overflows for large values:

    ```python
    df.withColumn("line_total", f.try_multiply(f.col("price"), f.col("quantity")))
    ```

