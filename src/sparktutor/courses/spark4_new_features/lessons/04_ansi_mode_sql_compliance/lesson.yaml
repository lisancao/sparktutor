    ## try_* Functions: Safe Alternatives

    Spark provides `try_*` variants that return null on failure:

    - `try_cast(expr, type)` — like cast, returns null on invalid input
    - `try_divide(num, divisor)` — returns null when divisor is 0
    - `try_add`, `try_subtract`, `try_multiply` — return null on overflow
    - `try_to_timestamp(str, format)` — returns null on parse failure

    ```python
    from pyspark.sql import functions as f

    df.withColumn("safe_ratio", f.try_divide(f.col("revenue"), f.col("orders")))
    df.withColumn("safe_total", f.try_add(f.col("a"), f.col("b")))
    df.withColumn("safe_int", f.try_cast(f.col("str_col"), "int"))
    ```

- Class: text
  Depth: all
  Output: |
    ## Migration Strategy

    When a Spark 3 pipeline breaks under ANSI mode:

    1. **Identify the failing operation** — overflow, divide-by-zero, cast
    2. **Replace with try_*** — use try_divide, try_add, try_cast where
       invalid data is possible
    3. **Handle nulls downstream** — coalesce, fill, or filter as needed
    4. **Optionally disable ANSI** — only for legacy compatibility; prefer
       fixing with try_* for long-term data quality

- Class: text
