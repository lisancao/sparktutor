    ## When the Pipeline Breaks

    Your e-commerce pipeline from Lessons 01–03 runs on Spark 4. Suddenly,
    queries that worked in Spark 3 fail with overflow errors, division-by-zero
    exceptions, or type mismatch errors. **ANSI mode** is the culprit — Spark 4
    defaults to strict SQL compliance. This lesson teaches what breaks and how
    to fix it with `try_*` functions.

- Class: text
  Depth: all
  Output: |
    ## What ANSI Mode Means

    ANSI SQL compliance enforces:

    1. **Strict type checking** — Implicit casts (e.g., string to int) fail.
       Use `cast()` or `try_cast()` explicitly.

    2. **Overflow errors** — Integer addition/multiplication that overflows
       throws instead of wrapping. Use `try_add`, `try_multiply` for safe
       fallback to null.

    3. **Division by zero** — Throws instead of returning null. Use
       `try_divide` to get null on divide-by-zero.

    4. **Invalid datetime** — Malformed dates throw. Use `try_to_timestamp`
       for null on parse failure.

    The goal: surface data quality issues early rather than silently
    corrupting results.

