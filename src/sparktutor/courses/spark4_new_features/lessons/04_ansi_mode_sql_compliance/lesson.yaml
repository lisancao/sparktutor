    ## What Was Permissive in Spark 3

    In Spark 3 with ANSI off (default):

    ```python
    # Spark 3 — silent overflow
    f.col("a") + f.col("b")  # Overflow wraps to negative
    f.col("x") / f.lit(0)    # Returns null
    f.col("s").cast("int")   # "abc" might become 0 or null
    ```

    In Spark 4 with ANSI on (default):

    ```python
    # Spark 4 — throws
    f.col("a") + f.col("b")  # OverflowException
    f.col("x") / f.lit(0)    # DivideByZeroException
    f.col("s").cast("int")   # NumberFormatException for "abc"
    ```

    Your e-commerce pipeline may have relied on these permissive behaviors.

- Class: text
