    ## Replacing flatMap with UDTF

    Spark 3 flatMap pattern:

    ```python
    rdd.flatMap(lambda row: [(row.order_id, item) for item in row.line_items])
    ```

    Over Spark Connect, RDD is not available. UDTF is the DataFrame-native
    replacement: it runs on the server, integrates with the optimizer, and
    supports Python.

