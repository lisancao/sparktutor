    ## What UDTFs Are

    A **User-Defined Table Function** (UDTF) takes one or more input rows and
    produces zero or more output rows. It's "1-row-in, N-rows-out". Contrast with
    UDFs (1-row-in, 1-row-out) and UDAFs (N-rows-in, 1-row-out).

    Use cases: explode nested structures with validation, split strings into
    rows, generate sequences, lookup tables that return multiple matches.

