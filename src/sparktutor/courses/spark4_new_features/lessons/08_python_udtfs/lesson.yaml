    ## Stateful UDTFs: __init__ and terminate

    For stateful processing, use `__init__` and `terminate`:

    ```python
    @udtf(returnType=...)
    class StatefulUDTF:
        def __init__(self):
            self.buffer = []

        def eval(self, ...):
            self.buffer.append(...)
            yield (...)

        def terminate(self):
            for item in self.buffer:
                yield item
    ```

    `terminate` is called after all input rows; use it to flush buffered output.

