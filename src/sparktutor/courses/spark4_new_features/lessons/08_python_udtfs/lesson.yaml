    ## Polymorphic UDTFs with analyze()

    When the UDTF needs to infer schema from arguments, use `analyze`:

    ```python
    @udtf(returnType=...)
    class PolymorphicUDTF:
        @staticmethod
        def analyze(order_id, line_items):
            return StructType([...])
    ```

    `analyze` returns the schema for the given argument types. This enables
    UDTFs that adapt to different input schemas.

