    ## Using the UDTF

    Register and use it like a built-in table function:

    ```python
    spark.udtf.register("explode_order_lines", ExplodeOrderLines)

    df = spark.sql("""
        SELECT * FROM explode_order_lines(
            LATERAL VIEW inline(order_data)
        )
    """)
    ```

    Or with the DataFrame API:

    ```python
    df = df.join(ExplodeOrderLines(f.col("order_id"), f.col("line_items")), how="cross")
    ```

    The UDTF is invoked per input row; its yields become the output rows.

