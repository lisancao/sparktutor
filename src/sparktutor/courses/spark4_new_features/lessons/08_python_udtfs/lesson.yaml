    ## UDTF vs explode + withColumn

    For simple array explosion, `explode` is sufficient. UDTFs shine when you
    need: validation (skip invalid items), transformation (compute derived
    columns), or multiple outputs per input (e.g., generate date range). The
    UDTF gives you full Python logic per row.

