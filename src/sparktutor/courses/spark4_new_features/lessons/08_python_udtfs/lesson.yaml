    Write a simple UDTF that takes (word: str) and yields (word, len(word)).
    Use @udtf with returnType StructType([StructField("word", StringType()),
    StructField("length", IntegerType())]).
  CorrectAnswer: |
    from pyspark.sql.functions import udtf
    from pyspark.sql.types import StructType, StructField, StringType, IntegerType

    @udtf(returnType=StructType([
        StructField("word", StringType()),
        StructField("length", IntegerType()),
    ]))
    class WordLength:
        def eval(self, word: str):
            yield (word, len(word))
  Hint: "eval takes word, yields (word, len(word))."

