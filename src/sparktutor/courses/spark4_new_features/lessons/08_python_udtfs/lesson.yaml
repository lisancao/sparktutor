    ## Exploding Nested Order Data

    Your e-commerce pipeline has order records with nested line items (array of
    structs). In Spark 3, you used `explode` or `flatMap` to flatten them. Spark 4
    makes **Python UDTFs** first-class: you can write a table function in Python
    that takes one row and returns multiple rows, with validation and state. This
    lesson replaces a complex flatMap chain with a UDTF.

