    ## The @udtf Decorator

    In Spark 4, you define a UDTF with the `@udtf` decorator and a return schema:

    ```python
    from pyspark.sql.functions import udtf
    from pyspark.sql.types import StructType, StructField, StringType, IntegerType, DoubleType

    @udtf(returnType=StructType([
        StructField("order_id", StringType()),
        StructField("product_id", StringType()),
        StructField("quantity", IntegerType()),
        StructField("price", DoubleType()),
    ]))
    class ExplodeOrderLines:
        def eval(self, order_id: str, line_items: list):
            for item in line_items:
                yield (order_id, item["product_id"], item["quantity"], item["price"])
    ```

    The class has an `eval` method. Each `yield` produces one output row.

