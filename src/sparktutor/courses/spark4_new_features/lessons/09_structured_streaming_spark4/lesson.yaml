    ## RocksDB State Store

    The RocksDB state store persists state to disk. Spark 4 improvements:
    - Better compaction to reduce disk usage
    - Improved memory management for large state
    - Configurable checkpoint intervals

    For the e-commerce pipeline, product-level revenue state can grow large.
    RocksDB handles it efficiently.

- Class: text
  Depth: intermediate
  Output: |
    ## Migration Strategy

    When migrating flatMapGroupsWithState to transformWithState:

    1. Define state schema (e.g., total_revenue DOUBLE)
    2. Define output schema (e.g., product_id, total_revenue)
    3. Implement the state update function: (key, batch_values, state) -> output_rows
    4. Replace flatMapGroupsWithState with transformWithState
    5. Test with the same checkpoint location for compatibility (or use a new
       checkpoint for a clean migration)

