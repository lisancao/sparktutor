    ## Real-Time Order Aggregation

    Your e-commerce pipeline needs real-time metrics: revenue by product, order
    counts, session analytics. Structured Streaming has been in Spark since 2.x,
    but Spark 4 adds improvements: **async progress tracking**, **stateful
    processing v2**, **RocksDB enhancements**, and **transformWithState** (replacing
    flatMapGroupsWithState). This lesson migrates a streaming aggregation to the
    new state management API.

- Class: text
  Depth: all
  Output: |
    ## Streaming Improvements in Spark 4

    **Async progress tracking** — Streaming queries report progress
    asynchronously, reducing latency for downstream consumers.

    **Stateful processing v2** — A new state store implementation with better
    fault tolerance and performance. RocksDB state store has improved
    compaction and memory management.

    **transformWithState** — Replaces flatMapGroupsWithState with a cleaner API.
    You define state schema, update logic, and output. The API is more
    explicit and easier to reason about.

- Class: text
  Depth: all
  Output: |
    ## flatMapGroupsWithState (Spark 3)

    In Spark 3, you used flatMapGroupsWithState for stateful streaming:

    ```python
    def update_state(key, values, state):
        total = state.getOption(0).getOrElse(0) + sum(v for v in values)
        state.update(total)
        yield (key, total)

    query = (df.groupByKey(lambda r: r.product_id)
        .flatMapGroupsWithState(update_state, ...)
        .writeStream...)
    ```

    The API was complex: GroupState, timeout handling, and output schema
    required careful setup.

- Class: text
  Depth: all
  Output: |
    ## transformWithState (Spark 4)

    transformWithState provides a simpler model:

    ```python
    def state_func(key, values, state):
        total = state.getOption(0).getOrElse(0) + sum(v for v in values)
        state.update(total)
        return [(key, total)]

    df.transformWithState(state_func, state_schema, output_schema)
    ```

    State schema and output schema are explicit. The function returns a list
    of output rows. Timeout and watermark handling are integrated.

