    ## The Complete E-Commerce Pipeline

    You have migrated each component across nine lessons: version-aware session,
    Connect-compatible code, transform() composition, ANSI-safe aggregates,
    VARIANT for JSON, table defaults, collation, UDTF/explode patterns, and
    streaming aggregation. This capstone wires everything into one **Spark 4
