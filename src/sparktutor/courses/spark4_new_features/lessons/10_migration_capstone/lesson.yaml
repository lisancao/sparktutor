- Class: cmd_question
  Depth: all
  Output: |
    Write a function `merge_pipelines(spark, orders_df, lines_df, products_df)` that
    joins lines with orders on order_id, joins with products on product_id,
    adds revenue = quantity * price, and returns the enriched DataFrame.
  CorrectAnswer: |
    from pyspark.sql import functions as f

    def merge_pipelines(spark, orders_df, lines_df, products_df):
        return (lines_df
            .join(orders_df, "order_id")
            .join(products_df, "product_id")
            .withColumn("revenue", f.col("quantity") * f.col("price")))
  Hint: "Join lines to orders, then to products. Add revenue column."

