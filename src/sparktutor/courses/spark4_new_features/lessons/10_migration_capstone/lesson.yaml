- Class: text
  Depth: all
  Output: |
    ## Systematic Migration Checklist

    1. **Version detection** — Use create_spark_session() or spark.version to
       branch behavior. Test on Spark 3 and 4.

    2. **Connect compatibility** — Remove RDD, sparkContext, accumulators.
       Use DataFrame API only.

    3. **ANSI mode** — Replace / with try_divide, * with try_multiply where
       overflow or divide-by-zero is possible. Use try_cast for risky casts.

    4. **JSON to VARIANT** — Migrate get_json_object to parse_json +
       variant_get. Parse once, extract many.

    5. **Table features** — Add DEFAULT and GENERATED ALWAYS AS where
       appropriate. Plan for governance (masks, filters).

    6. **String handling** — Use collation for case-insensitive matching, or
       lower() as fallback.

    7. **Explode patterns** — Prefer explode + filter; use UDTF when you need
       validation or complex per-row logic.

    8. **Streaming** — Migrate flatMapGroupsWithState to transformWithState.
       Use RocksDB for large state.

- Class: text
  Depth: all
  Output: |
    ## Testing Strategy

    Run Spark 3 and 4 side by side:

    - **Dual runtime** — Install both pyspark 3.5 and 4.0. Run the pipeline
      on each; compare outputs with a diff or checksum.

    - **Golden output** — Capture Spark 3 output as "golden". After migration,
      assert Spark 4 output matches (within tolerance for floating point).

    - **Incremental migration** — Migrate one module at a time. Use version
      branching so the same codebase runs on both during transition.

- Class: text
  Depth: all
  Output: |
    ## Pipeline Architecture

    The full e-commerce pipeline:

    1. **Ingest** — Orders (order_id, status, total), line items (order_id,
       product_id, quantity, price), products (product_id, name, category from
       JSON).

    2. **Transform** — Add revenue (quantity * price), filter valid rows,
       join with products for category. Aggregate revenue by product and
       category.

    3. **Output** — Top products by revenue, revenue by category, order counts.

    All steps use: Connect-compatible API, try_* for ANSI safety, transform()
    for composition, VARIANT or get_json_object fallback for products.

- Class: text
  Depth: intermediate
  Output: |
    ## Wire-Together Pattern

    ```python
    def full_pipeline(spark):
        orders = load_orders(spark)
        lines = load_line_items(spark)
        products = load_products_variant(spark)
        enriched = (lines
            .transform(add_revenue)
            .transform(filter_valid)
            .join(products, "product_id"))
        return enriched.groupBy("category").agg(f.sum("revenue").alias("total"))
    ```

    Each function (load_orders, add_revenue, etc.) was built in prior lessons.
    The capstone assembles them.

- Class: text
  Depth: advanced
  Output: |
    ## Production Considerations

    - **Checkpointing** — For streaming, use a dedicated checkpoint path.
      Do not reuse Spark 3 checkpoints with Spark 4 without testing.

    - **Config migration** — spark.sql.ansi.enabled, spark.sql.session.timeZone,
      etc. Document all config changes.

    - **Dependency versions** — PySpark 4.x, Delta 3.x, etc. Ensure
      compatibility matrix.

