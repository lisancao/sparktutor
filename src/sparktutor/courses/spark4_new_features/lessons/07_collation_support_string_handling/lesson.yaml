    ## What You'll Learn

    String comparison in Spark 3 was always binary — `"Widget"` and
    `"WIDGET"` are different values in JOINs, GROUP BY, DISTINCT, and
    filters. For our e-commerce pipeline, this means a customer searching
    for "widget" would miss products named "Widget" or "WIDGET."

    Spark 4 introduces **collation support** — locale-aware, case-sensitive
    or case-insensitive string comparisons built into the engine.

    By the end of this lesson you will be able to:

    - Explain what collations are and why they matter
    - Use the COLLATE clause on columns and expressions
    - Understand the impact on JOINs, GROUP BY, and DISTINCT
    - Migrate Spark 3 workarounds (lower/upper) to native collations
    - Handle multi-language product catalogs correctly

