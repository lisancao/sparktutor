    ## The Spark 3 Problem: Binary String Comparison

    In Spark 3, all string comparisons are **binary** — byte-by-byte.
    This creates real problems for our e-commerce product catalog:

    ```python
    # Spark 3: These are three DIFFERENT groups
    products = [("Widget",), ("WIDGET",), ("widget",)]
    df = spark.createDataFrame(products, ["name"])
    df.groupBy("name").count().show()
    # +------+-----+
    # |  name|count|
    # +------+-----+
    # |Widget|    1|
    # |WIDGET|    1|
    # |widget|    1|
    # +------+-----+
    ```

    The workaround was to normalize everything with `lower()` or
    `upper()`:

    ```python
    df.groupBy(f.lower("name")).count()
    ```

    This works for English but fails for languages where lowercasing
    is not straightforward (Turkish dotted I, German ß, etc.).

