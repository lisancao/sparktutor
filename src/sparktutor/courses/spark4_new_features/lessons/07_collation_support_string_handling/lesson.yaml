    Think of collation like sorting rules in a library. An English
    library might file "A" and "a" together because they are the same
    letter. A computer without collation treats them as completely
    different characters (A=65, a=97 in ASCII).

    Collation tells Spark: "these characters should be treated as
    equivalent for comparison purposes." Case-insensitive collation
    means `"Widget" == "WIDGET"` evaluates to `true`.

