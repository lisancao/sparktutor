    ## Summary

    In this lesson you learned:

    - **Binary comparison** — Spark 3's default treats "Widget" and
      "WIDGET" as different values, breaking case-insensitive use cases
    - **Native collation** — Spark 4 supports UTF8_LCASE, UNICODE_CI,
      and other collation types at the column and expression level
    - **Impact on operations** — collation affects =, GROUP BY, JOIN,
      DISTINCT, ORDER BY, and LIKE
    - **Performance benefits** — native collation enables predicate
      pushdown and avoids per-row function evaluation
    - **Migration pattern** — use try/except wrappers for code that
      must run on both Spark 3 and 4

    In the next lesson, you will learn about Python UDTFs — a powerful
    new way to write table-generating functions in Spark 4.
