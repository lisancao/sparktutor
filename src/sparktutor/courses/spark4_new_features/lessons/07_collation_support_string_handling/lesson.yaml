    ## Available Collation Types

    Spark 4 supports several collation providers:

    | Collation | Behavior |
    |-----------|----------|
    | `UTF8_BINARY` | Default — byte-by-byte (Spark 3 behavior) |
    | `UTF8_LCASE` | Case-insensitive using Unicode lowercase |
    | `UNICODE` | Unicode Collation Algorithm — locale-aware |
    | `UNICODE_CI` | Unicode case-insensitive |

    `UTF8_LCASE` handles most Latin-script needs. For proper
    multi-language support (CJK, Arabic, Cyrillic), use `UNICODE_CI`.

    Collation affects: `=`, `<>`, `<`, `>`, `LIKE`, `IN`, `GROUP BY`,
    `DISTINCT`, `ORDER BY`, and JOIN conditions. Basically every
    operation that compares strings.

