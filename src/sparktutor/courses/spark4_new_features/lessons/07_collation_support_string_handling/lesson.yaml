    ## Collation and Performance

    Native collation in Spark 4 is faster than the `lower()` workaround
    because:

    1. **No expression evaluation** — collation is a property of the
       comparison, not an extra function call on every row
    2. **Predicate pushdown** — collated comparisons can push down to
       data sources (Parquet, Iceberg) that support collation-aware
       predicates
    3. **Hash optimization** — GROUP BY and JOIN hash tables use
       collation-aware hashing, so "Widget" and "WIDGET" hash to the
       same bucket directly

    The `lower()` approach creates a derived column, preventing predicate
    pushdown and adding a function evaluation per row. On a 1B row table,
    this difference is significant.

