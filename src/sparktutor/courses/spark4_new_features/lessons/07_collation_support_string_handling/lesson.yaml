    ## Migration Strategy

    When migrating the e-commerce pipeline:

    **Step 1**: Identify all `lower()`/`upper()` calls used for
    case-insensitive matching.

    **Step 2**: Replace with collation where running on Spark 4:
    ```python
    # Before (Spark 3)
    df.filter(f.lower("name") == f.lower(f.lit("widget")))

    # After (Spark 4)
    df.filter(f.col("name").collate("UTF8_LCASE") == "widget")
    ```

    **Step 3**: For code that must run on both Spark 3 and 4, use a
    compatibility wrapper:
    ```python
    def ci_equals(col, value):
        try:
            return col.collate("UTF8_LCASE") == value
        except (AttributeError, TypeError):
            return f.lower(col) == f.lower(f.lit(value))
    ```

    **Step 4**: For new tables on Spark 4, define collation at the
    column level in DDL so all queries benefit automatically.

