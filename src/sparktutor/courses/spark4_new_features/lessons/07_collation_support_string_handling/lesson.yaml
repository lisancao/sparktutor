    ## Spark 4: Native Collation Support

    Spark 4 lets you specify collation at the column level or in
    expressions:

    ```sql
    -- Column-level collation in CREATE TABLE
    CREATE TABLE products (
        product_id STRING,
        name STRING COLLATE 'UTF8_LCASE'
    );

    -- Expression-level collation
    SELECT * FROM products
    WHERE name COLLATE 'UTF8_LCASE' = 'widget';
    ```

    In PySpark:

    ```python
    from pyspark.sql.types import StringType

    df.filter(
        f.col("name").collate("UTF8_LCASE") == "widget"
    )
    ```

    `UTF8_LCASE` means UTF-8 encoding with lowercase comparison —
    effectively case-insensitive matching. Spark handles the comparison
    at the engine level, no Python UDF needed.

