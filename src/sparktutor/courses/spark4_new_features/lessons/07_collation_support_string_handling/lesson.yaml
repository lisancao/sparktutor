    ## Impact on JOINs and GROUP BY

    Collation changes how joins match rows:

    ```python
    # Spark 3: these DON'T match without lower()
    orders = [("1", "Widget")]
    products = [("Widget",), ("WIDGET",)]

    # Spark 4 with collation: they DO match
    orders_df = spark.createDataFrame(orders, ["id", "product"])
    products_df = spark.createDataFrame(products, ["name"])

    joined = orders_df.join(
        products_df,
        orders_df["product"].collate("UTF8_LCASE") ==
            products_df["name"].collate("UTF8_LCASE")
    )
    ```

    For GROUP BY, collation collapses groups that differ only in case:

    ```python
    df.groupBy(f.col("name").collate("UTF8_LCASE")).count()
    # Now "Widget", "WIDGET", "widget" are ONE group
    ```

    This is the correct behavior for product analytics — you want a
    single count for the product regardless of how users typed the name.

