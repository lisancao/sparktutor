    ## Product Catalog Migration

    Your e-commerce pipeline stores product metadata as JSON strings. In Spark 3,
    you used `get_json_object` or `from_json` to parse them. Spark 4 introduces
    the **VARIANT** type — a native semi-structured column type with better
    performance and simpler querying. This lesson migrates your product catalog
    JSON handling to VARIANT.

- Class: text
  Depth: all
  Output: |
    ## The VARIANT Type

    VARIANT is Spark's native type for semi-structured data (JSON, BSON). Unlike
    a string column holding JSON, VARIANT stores the parsed structure internally.
    You can index into it with `variant_get()` and infer schema with
    `schema_of_variant()`.

    ```python
    from pyspark.sql import functions as f

    df = df.withColumn("attrs", f.parse_json(f.col("json_str")))
    df = df.withColumn("name", f.variant_get(f.col("attrs"), "$.name"))
    df = df.withColumn("price", f.variant_get(f.col("attrs"), "$.price"))
    ```

    `parse_json` converts a string to VARIANT. `variant_get(col, path)` extracts
    a value at a JSON path. Paths use `$.` notation like JSONPath.

