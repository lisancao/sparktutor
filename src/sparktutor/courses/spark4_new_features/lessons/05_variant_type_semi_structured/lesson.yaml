    ## Spark 3 Way: get_json_object / from_json

    In Spark 3, you typically did:

    ```python
    # Spark 3 — string-based JSON
    df.withColumn("name", f.get_json_object(f.col("json_str"), "$.name"))
    df.withColumn("price", f.get_json_object(f.col("json_str"), "$.price"))
    ```

    Or with from_json and a schema:

    ```python
    schema = "name STRING, price DOUBLE, tags ARRAY<STRING>"
    df.withColumn("parsed", f.from_json(f.col("json_str"), schema))
    ```

    Problems: get_json_object parses the string repeatedly per column;
    from_json requires a fixed schema. VARIANT avoids both.

- Class: text
  Depth: all
  Output: |
    ## Spark 4 Way: parse_json and variant_get

    ```python
    df = df.withColumn("variant_col", f.parse_json(f.col("json_str")))
    df = df.withColumn("name", f.variant_get(f.col("variant_col"), "$.name"))
    df = df.withColumn("price", f.variant_get(f.col("variant_col"), "$.price"))
    ```

    Benefits:
    - Parse once, extract many — the JSON is parsed into VARIANT once
    - No fixed schema — extract any path on demand
    - Native storage — VARIANT can be stored in columnar format efficiently
    - schema_of_variant(col) — returns the inferred schema for the variant

- Class: text
  Depth: all
  Output: |
    ## schema_of_variant

    To discover the structure of a VARIANT column:

    ```python
    df.select(f.schema_of_variant(f.col("variant_col"))).show(truncate=False)
    ```

    Returns a schema string (e.g., "STRUCT<name: STRING, price: DOUBLE>") that
    you can use with from_json if you need to flatten to a struct. For ad-hoc
    extraction, variant_get is usually enough.

