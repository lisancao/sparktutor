    ## Performance Advantages

    With get_json_object, each call re-parses the JSON string. With VARIANT:
    parse_json runs once; variant_get reads from the in-memory structure. For
    wide JSON with many extracted columns, VARIANT is significantly faster.
    Storage: VARIANT in Delta/Iceberg can use columnar encoding; JSON strings
    cannot.

