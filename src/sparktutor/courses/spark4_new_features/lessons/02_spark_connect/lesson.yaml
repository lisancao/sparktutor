- Class: cmd_question
  Depth: all
  Output: |
    Write a function `create_session(use_connect: bool, url: str = "sc://localhost:15002")`
    that returns a SparkSession. If use_connect is True, use remote(url);
    otherwise use master("local[*]"). App name always "ECommerce".
  CorrectAnswer: |
    from pyspark.sql import SparkSession

    def create_session(use_connect: bool, url: str = "sc://localhost:15002"):
        builder = SparkSession.builder.appName("ECommerce")
        if use_connect:
            return builder.remote(url).getOrCreate()
        return builder.master("local[*]").getOrCreate()
  Hint: "Branch on use_connect; use .remote(url) or .master('local[*]')."

