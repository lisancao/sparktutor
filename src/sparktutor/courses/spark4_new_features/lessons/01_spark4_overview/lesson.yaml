    Write a function `get_spark_version(spark)` that returns a tuple of two integers:
    (major, minor). For example, spark.version "4.0.0" returns (4, 0).
  CorrectAnswer: |
    def get_spark_version(spark):
        parts = spark.version.split(".")
        major = int(parts[0]) if len(parts) > 0 else 0
        minor = int(parts[1]) if len(parts) > 1 else 0
        return (major, minor)
  Hint: "Split spark.version by '.', convert to int, handle edge cases."

