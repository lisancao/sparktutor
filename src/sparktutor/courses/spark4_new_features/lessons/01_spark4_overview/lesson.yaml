    ## Version Detection

    Your migration code must know which Spark version it runs on. Use:

    ```python
    from pyspark.sql import SparkSession

    spark = SparkSession.builder.appName("ECommerce").master("local[*]").getOrCreate()
    version = spark.version
    major = int(version.split(".")[0])
    is_spark4 = major >= 4
    ```

    Spark 3.5.x returns `"3.5"`; Spark 4.0.0 returns `"4.0"`. Use `major >= 4`
    for forward compatibility.

- Class: text
  Depth: all
  Output: |
    ## Compatibility Patterns

    **Pattern 1: Runtime branching** — If you must support both Spark 3 and 4
    during migration, branch on version:

    ```python
    if is_spark4:
        df = df.withColumn("amount", f.try_multiply("price", "qty"))
    else:
        df = df.withColumn("amount", f.col("price") * f.col("qty"))
    ```

    In Spark 4, `try_multiply` returns null on overflow instead of raising
    an error (ANSI mode default). The Spark 3 branch uses the classic
    operator which silently wraps on overflow.

    **Pattern 2: Config at session creation** — ANSI mode, timezone, etc. are
    configured when building the SparkSession. A version-aware factory can set
    different configs for Spark 3 vs 4.

- Class: text
