    ## What Happens When You Call spark.version

    The version string comes from Spark's build metadata. It's set at compile
    time and reflects the Spark runtime, not PySpark. PySpark 4.x bundles
    Spark 4.0.0+; the client and server versions should match when using
    Spark Connect. Mismatches can cause protocol errors.

