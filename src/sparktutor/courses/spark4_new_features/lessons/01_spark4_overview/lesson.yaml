    ## Breaking Changes Overview

    When migrating Spark 3 → 4, expect these categories:

    **ANSI mode default** — Integer overflow throws, division by zero throws,
    implicit casts fail. Use `try_cast`, `try_divide`, `try_add` for safe fallbacks.

    **Removed APIs** — Deprecated methods in Spark 3 are removed. Examples:
    `spark.sql.udf.register` (use `spark.udf.register`), `DataFrame.toPandas()` with
    certain options (use Arrow). Check your codebase for deprecation warnings.

    **Behavior changes** — `collect()` on empty DataFrame returns `[]`; some
    join semantics changed. Null handling in aggregations is stricter.

    **Python UDFs** — Arrow-optimized by default; some legacy UDF patterns may
    need adjustment.

