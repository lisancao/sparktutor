    ## The E-Commerce Migration Story

    Over the next 10 lessons, you will migrate a **real e-commerce analytics
    pipeline** from Spark 3 to Spark 4. The pipeline processes product orders,
    customer sessions, inventory, and revenue metrics. Each lesson tackles a
    migration area: you'll see what worked in Spark 3, what breaks in Spark 4,
    and how to fix it.

    This first lesson sets the stage: Spark 4's philosophy, breaking changes,
    and how to detect your runtime version so you can write code that adapts.

- Class: text
  Depth: all
  Output: |
    ## The Philosophy Behind Spark 4

    Spark 4 is not just a version bump. It reflects three design principles:

    1. **Stricter defaults** — Spark 3 tolerated silent overflow, implicit casts,
       and permissive SQL. Spark 4 defaults to ANSI mode: errors surface instead
       of corrupting data. You must opt-in to legacy behavior when needed.

    2. **Better Python experience** — Spark Connect makes Python a thin client; the
       driver runs remotely. The DataFrame API is type-annotated; UDTFs are
       first-class. Python is no longer a second-class citizen.

    3. **Protocol-first architecture** — Spark Connect uses a protocol buffer
       protocol. Clients (Python, Scala, etc.) talk to the same server. This
       enables notebook-to-cluster workflows, IDE integrations, and language
       parity.

