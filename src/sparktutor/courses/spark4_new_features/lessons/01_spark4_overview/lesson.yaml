    ## SparkSession Builder: Spark 3 vs Spark 4

    In Spark 3, you might configure:

    ```python
    spark = (SparkSession.builder
        .appName("ECommerce")
        .master("local[*]")
        .config("spark.sql.ansi.enabled", "false")
        .getOrCreate())
    ```

    In Spark 4, ANSI is on by default. To match Spark 3 behavior during
    migration, you explicitly disable it. A version-aware factory would:
    - For Spark 4: set ANSI if you want strict mode; otherwise leave default.
    - For Spark 3: optionally enable ANSI to test migration early.

