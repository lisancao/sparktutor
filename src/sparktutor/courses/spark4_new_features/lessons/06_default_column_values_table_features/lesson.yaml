    ## Table Schema Evolution

    Your e-commerce pipeline creates product and order tables. In Spark 3, you
    defined columns and inserted rows with explicit values for every column.
    Spark 4 adds **DEFAULT** values, **generated columns**, and **governance**
    features (column masks, row filters). This lesson creates product and order
    tables using these new capabilities.

- Class: text
  Depth: all
  Output: |
    ## DEFAULT Keyword

    In CREATE TABLE and ALTER TABLE, you can specify a default for a column:

    ```sql
    CREATE TABLE products (
        product_id STRING,
        name STRING,
        created_at TIMESTAMP DEFAULT current_timestamp(),
        updated_at TIMESTAMP DEFAULT current_timestamp()
    );
    ```

    When you INSERT without specifying created_at or updated_at, Spark uses the
    default. For INSERT ... VALUES, omit the column or use DEFAULT keyword:

    ```sql
    INSERT INTO products (product_id, name) VALUES ('p1', 'Widget');
    ```

    This reduces boilerplate and ensures consistency (e.g., audit timestamps).

- Class: text
  Depth: all
  Output: |
    ## Generated Columns (GENERATED ALWAYS AS)

    A generated column is computed from other columns. You define it in the
    schema; Spark maintains it automatically:

    ```sql
    CREATE TABLE order_lines (
        order_id STRING,
        product_id STRING,
        quantity INT,
        unit_price DOUBLE,
        line_total DOUBLE GENERATED ALWAYS AS (quantity * unit_price)
    );
    ```

    You cannot insert into line_total — it's always computed. This enforces
    correctness and avoids drift between quantity/price and line_total.

