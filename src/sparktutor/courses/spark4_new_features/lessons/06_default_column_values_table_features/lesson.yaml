    ## Column Masks and Row Filters

    For governance, Spark supports:

    - **Column masks** — Transform a column's value based on the user's
      permissions. E.g., mask email to "***@***.com" for unprivileged users.
    - **Row filters** — Filter rows based on the user. E.g., show only rows
      where region = user_region.

    These are typically configured in the catalog (Unity Catalog in Databricks).
    The syntax varies by catalog implementation. The concept: sensitive columns
    and rows are protected at read time.

- Class: text
  Depth: all
  Output: |
    ## Spark 3 vs Spark 4 Table DDL

    Spark 3: No DEFAULT in standard Spark SQL. Some runtimes (Delta, etc.) had
    extensions. Spark 4: DEFAULT and GENERATED ALWAYS AS are part of the SQL
    standard support. Your migration can add defaults to existing tables via
    ALTER TABLE ... ADD COLUMN ... DEFAULT value.

- Class: text
  Depth: intermediate
  Output: |
    ## Creating Tables Programmatically

    In PySpark, you use spark.sql() for DDL:

    ```python
    spark.sql("""
        CREATE TABLE IF NOT EXISTS products (
            product_id STRING,
            name STRING,
            category STRING DEFAULT 'Uncategorized',
            created_at TIMESTAMP DEFAULT current_timestamp()
        )
        USING DELTA
        LOCATION '/tmp/products'
    """)
    ```

    For Delta tables, you need a Delta-enabled Spark session. For in-memory
    tables, omit USING and LOCATION.

- Class: text
  Depth: advanced
  Output: |
    ## Generated Column Limitations

    Generated columns can only reference other columns in the same row. No
    aggregations, no subqueries. The expression must be deterministic. Some
    catalogs restrict which functions can be used in generated columns.

