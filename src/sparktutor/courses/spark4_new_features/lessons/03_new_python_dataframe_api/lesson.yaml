    ## Type-Annotated Column Class

    In Spark 3, `Column` had no type hints. In Spark 4, the Python API is
    fully type-annotated:

    ```python
    # Spark 4 — Column is typed
    from pyspark.sql import Column
    def add_tax(col: Column, rate: float) -> Column:
        return col * (1 + rate)
    ```

    IDEs and type checkers can infer types. Method signatures like
    `DataFrame.select(*cols: Column) -> DataFrame` make chaining predictable.
    Error messages improve: "expected Column, got str" instead of cryptic JVM
    stack traces.

