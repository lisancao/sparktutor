  Output: |
    Write a function `add_discount(df)` that adds a column "discounted_price"
    = price * (1 - 0.1) when a column "price" exists. Use .transform() in
    the caller. Return the transformed DataFrame.
  CorrectAnswer: |
    from pyspark.sql import DataFrame
    from pyspark.sql import functions as f

    def add_discount(df: DataFrame) -> DataFrame:
        return df.withColumn("discounted_price", f.col("price") * 0.9)
  Hint: "withColumn with price * 0.9. The caller uses df.transform(add_discount)."

