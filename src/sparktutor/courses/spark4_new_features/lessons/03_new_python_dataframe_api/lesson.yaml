    ## New Chaining Patterns

    Spark 4 encourages fluent chaining. Methods return `DataFrame` so you can
    chain without intermediate variables:

    ```python
    # Spark 3 — same, but Spark 4 has better inference
    df = (orders_df
        .select("order_id", "product_id", "quantity", "price")
        .withColumn("line_total", f.col("quantity") * f.col("price"))
        .filter(f.col("quantity") > 0))
    ```

    Spark 4 adds `.transform()` — pass a function that takes a DataFrame and
    returns a DataFrame. This enables reusable pipeline stages.

