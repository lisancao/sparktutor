    ## Improved Error Messages

    Spark 3 often surfaced JVM exceptions. Spark 4's Python layer validates
    arguments and raises clearer errors:

    - Passing a string where a Column is expected: "condition must be a
      Column expression"
    - Invalid column name: "column 'xyz' not found"
    - Type mismatch in UDF: Python-side validation before JVM call

    This speeds up debugging during migration.

