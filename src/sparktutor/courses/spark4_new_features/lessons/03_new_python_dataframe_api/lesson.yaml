    ## The .transform() Method

    `.transform(func)` applies a function to the DataFrame and returns the
    result. The function signature: `(df: DataFrame) -> DataFrame`.

    ```python
    def add_line_total(df):
        return df.withColumn("line_total", f.col("quantity") * f.col("price"))

    def filter_valid_quantity(df):
        return df.filter(f.col("quantity") > 0)

    result = (orders_df
        .transform(add_line_total)
        .transform(filter_valid_quantity))
    ```

    This is composable: each function is a pipeline stage. You can test
    stages in isolation and combine them in different orders.

