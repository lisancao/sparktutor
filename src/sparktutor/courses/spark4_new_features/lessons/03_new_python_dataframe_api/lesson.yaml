    ## Python-Native Type Hints

    Throughout the API you'll see:

    - `DataFrame.select(*cols: Union[str, Column]) -> DataFrame`
    - `DataFrame.filter(condition: Column) -> DataFrame`
    - `functions.col(name: str) -> Column`

    Use these for better tooling. Your product analytics functions can be
    annotated:

    ```python
    def product_revenue_by_category(df: DataFrame) -> DataFrame:
        return df.groupBy("category").agg(f.sum("revenue").alias("total_revenue"))
    ```

