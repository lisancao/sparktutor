    ## transform() Under the Hood

    `df.transform(func)` is equivalent to `func(df)`. It's syntactic sugar
    for function composition. The logical plan is unchanged — Spark still
    optimizes the full pipeline. The benefit is code organization: small
    functions, each doing one thing, composed via transform.

