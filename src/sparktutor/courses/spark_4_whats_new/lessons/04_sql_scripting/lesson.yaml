    ## Condition Handlers

    A handler catches errors raised in its compound statement:

    ```sql
    BEGIN
      DECLARE EXIT HANDLER FOR DIVIDE_BY_ZERO
        BEGIN
          SELECT 'fallback' AS outcome;
        END;
      SELECT sum(balance) / min(balance) AS outcome FROM accounts;
    END
    ```

    You can name what to catch three ways, from most to least specific:

    - an **error condition**: `FOR DIVIDE_BY_ZERO`
    - a **SQLSTATE**: `FOR SQLSTATE '22012'`
    - a **class**: `FOR SQLEXCEPTION` (anything not `XX` or `02`), or
      `FOR NOT FOUND` (SQLSTATE `02xxx`, such as running off the end of a
      cursor)

    An `EXIT` handler runs and then leaves the block. A `CONTINUE` handler
    runs and resumes at the next statement, but in 4.2 `CONTINUE` handlers
    are still behind the internal flag
    `spark.sql.scripting.continueHandlerEnabled` (default `false`); without
    it you get `UNSUPPORTED_FEATURE.CONTINUE_EXCEPTION_HANDLER`.

