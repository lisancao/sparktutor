    ## Cursors (Spark 4.2, Behind a Flag)

    A `FOR` loop covers most row-by-row needs. Cursors give you explicit
    control: open a query, fetch one row at a time into variables, stop
    whenever you like.

    ```sql
    BEGIN
      DECLARE bal DOUBLE;
      DECLARE done BOOLEAN DEFAULT false;
      DECLARE total DOUBLE DEFAULT 0;
      DECLARE c CURSOR FOR SELECT balance FROM accounts WHERE balance < 100;
      DECLARE CONTINUE HANDLER FOR NOT FOUND SET done = true;
      OPEN c;
      REPEAT
        FETCH c INTO bal;
        IF NOT done THEN SET total = total + bal; END IF;
      UNTIL done END REPEAT;
      CLOSE c;
      SELECT total;
    END
    ```

    Fetching past the end raises `CURSOR_NO_MORE_ROWS` (SQLSTATE `02000`),
    which the `NOT FOUND` handler turns into `done = true`. Without a
    handler, that `FETCH` is a silent no-op (`02xxx` is a no-data
    condition, not an error), so `done` never flips and the loop never
    ends. Always declare a `NOT FOUND` handler.

    In 4.2.0 cursors ship disabled. Both of these internal flags must be on,
    otherwise you get `UNSUPPORTED_FEATURE.SQL_CURSOR` or
    `UNSUPPORTED_FEATURE.CONTINUE_EXCEPTION_HANDLER`:

    ```python
    spark.conf.set("spark.sql.scripting.cursorEnabled", "true")
    spark.conf.set("spark.sql.scripting.continueHandlerEnabled", "true")
    ```

    Internal flags carry no compatibility promise; treat cursors as a
    preview.

