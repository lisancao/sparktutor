    ## Compound Statements and Variables

    Every script is a compound statement. Declarations come first
    (variables, conditions, handlers, cursors), then the body:

    ```sql
    BEGIN
      DECLARE threshold DOUBLE DEFAULT 50;
      DECLARE n BIGINT;
      SET n = (SELECT count(*) FROM accounts WHERE balance > threshold);
      IF n > 3 THEN
        SELECT 'many' AS verdict;
      ELSEIF n > 0 THEN
        SELECT 'some' AS verdict;
      ELSE
        SELECT 'none' AS verdict;
      END IF;
    END
    ```

    - **Local variables** live inside the block. Nested `BEGIN ... END`
      blocks create nested scopes; labels (`outer: BEGIN ...`) disambiguate.
    - **Session variables** (4.0) outlive a script:
      `DECLARE OR REPLACE VARIABLE cutoff INT DEFAULT 10;` then
      `SET VAR cutoff = 20;`. Use them to pass values between scripts.
    - **Parameter markers** pass values in from Python:
      `spark.sql("BEGIN ... WHILE i < :n DO ... END", args={"n": 10})`.
    - **What comes back:** `spark.sql(script)` returns the result set of the
      last statement that produced one.

    **Docs:** [SQL Scripting](https://spark.apache.org/docs/4.2.0/sql-ref-scripting.html)

