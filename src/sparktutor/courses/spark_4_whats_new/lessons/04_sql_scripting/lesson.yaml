    ## What You'll Learn

    Until Spark 4, any logic beyond a single statement lived in Python: a
    loop that runs a query, checks a value, runs another. That forced SQL
    teams to own Python glue code. Spark 4 makes SQL procedural.

    By the end of this lesson you will be able to:

    - Write **SQL scripts** with `BEGIN ... END`, local variables, `IF`,
      `CASE`, `WHILE`, `REPEAT`, `LOOP` and `FOR` (preview in 4.0, GA and on
      by default in 4.1 via SPARK-54499)
    - Catch errors with **condition handlers** by name, SQLSTATE or class
    - Define **SQL UDFs**, both scalar and table-valued (4.0, SPARK-46057)
    - Iterate with **cursors** (4.2, SPARK-54759, behind a flag)
    - Control name resolution with **SET PATH** and `current_path()` (4.2)

- Class: text
  Depth: beginner
  Output: |
    A SQL script is a small program written in SQL. It has variables you
    can declare and update, and control flow like any language:

    ```sql
    BEGIN
      DECLARE total INT DEFAULT 0;
      DECLARE i INT DEFAULT 1;
      WHILE i <= 5 DO
        SET total = total + i;
        SET i = i + 1;
      END WHILE;
      SELECT total;      -- 15
    END
    ```

    You run it with one `spark.sql(...)` call. The DataFrame you get back is
    the result of the last query the script ran.

- Class: text
