    ## Loops

    ```sql
    -- WHILE: test first
    WHILE i < 10 DO SET i = i + 1; END WHILE;

    -- REPEAT: test last
    REPEAT SET i = i + 1; UNTIL i >= 10 END REPEAT;

    -- LOOP with LEAVE (break) and ITERATE (continue); needs a label
    lbl: LOOP
      SET i = i + 1;
      IF i >= 10 THEN LEAVE lbl; END IF;
    END LOOP lbl;

    -- FOR: iterate over a query's rows
    FOR r AS SELECT account, balance FROM accounts DO
      IF r.balance > 500 THEN SET golds = golds || r.account; END IF;
    END FOR;
    ```

    A `FOR` loop is the most common shape: run a query, act on each row.
    Remember that each iteration is driver-side control flow; a loop that
    issues a query per row is a slow loop. Push set-based work into one
    query and use loops for orchestration.

