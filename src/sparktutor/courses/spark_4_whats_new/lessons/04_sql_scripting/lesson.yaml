    ## Summary

    - **SQL scripting** (preview 4.0, GA 4.1): `BEGIN ... END`, variables,
      `IF`/`CASE`/`WHILE`/`REPEAT`/`LOOP`/`FOR`; the last result set is
      returned.
    - **Handlers** catch by condition, SQLSTATE or class. `EXIT` works out of
      the box; `CONTINUE` is flag-gated in 4.2.
    - **SQL UDFs** (4.0) are inlined by Catalyst; parameters are not
      constants.
    - **Cursors** (4.2) work behind two internal flags.
    - **SET PATH / current_path()** (4.2) control unqualified name
      resolution; `SET PATH` needs `spark.sql.path.enabled`.

    Next: the new GEOMETRY and GEOGRAPHY types.
