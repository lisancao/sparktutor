    ## Handler Gotchas in 4.2.0

    - **Keep risky work in its own statement.** In 4.2.0, a runtime error
      raised while evaluating a scalar subquery in `SET x = (SELECT ...)` is
      not matched by any handler; the script dies with a
      `NullPointerException`. The same query as a standalone `SELECT`
      statement is caught normally. Verified on PySpark 4.2.0.
    - **There is no `SELECT ... INTO`.** Assign with
      `SET x = (SELECT ...)` or `FETCH` from a cursor.
    - **No tuple assignment to local variables.** `SET (a, b) = (b, a + b)`
      is a parse error inside a script; use a temporary variable.
    - **`SIGNAL` is not supported** in 4.2.0 (`SIGNAL SQLSTATE ...` is a
      parse error), so you cannot raise custom conditions from SQL yet.

