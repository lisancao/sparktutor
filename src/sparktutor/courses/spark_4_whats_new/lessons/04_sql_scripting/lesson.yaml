    ## The SQL Path (Spark 4.2)

    Spark 4.2 adds path-based name resolution (SPARK-54806). The **SQL path**
    is the ordered list of schemas Spark searches for unqualified functions,
    tables, views and variables; the first match wins.

    ```sql
    SELECT current_path();
    -- system.builtin,system.session,spark_catalog.default

    SET PATH = system.session, system.builtin, spark_catalog.analytics;
    SET PATH = PATH, spark_catalog.shared;   -- append
    SET PATH = DEFAULT_PATH;                  -- reset
    ```

    `system.builtin` holds built-in functions and `system.session` holds
    temporary views, temporary functions and session variables. You can
    always qualify explicitly: `system.builtin.upper(x)`,
    `session.my_var`.

    Details that matter:

    - `current_path()` always works, but `SET PATH` requires
      `spark.sql.path.enabled=true` (default `false`); otherwise
      `UNSUPPORTED_FEATURE.SET_PATH_WHEN_DISABLED`.
    - DDL ignores the path: `CREATE TABLE t` always goes to the current
      schema.
    - Persistent views and SQL UDFs freeze the path at `CREATE` time, so a
      caller's `SET PATH` cannot change what a view's body resolves to.
    - Change the default for every session with `spark.sql.defaultPath`.

    **Docs:** [SET PATH](https://spark.apache.org/docs/4.2.0/sql-ref-syntax-aux-conf-mgmt-set-path.html)

- Class: text
  Depth: advanced
  Output: |
    ## Related SQL Features

    - **`EXECUTE IMMEDIATE`** (4.0) runs dynamic SQL with parameters:
      `EXECUTE IMMEDIATE 'SELECT ? * 2 AS doubled' USING 21`. Inside scripts
      it is how you build statements from variables.
    - **Recursive CTEs** (4.1, SPARK-24497):
      `WITH RECURSIVE r(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r WHERE n < 5) SELECT sum(n) FROM r`.
      Many loops people wrote in scripts are better as recursive CTEs,
      because they stay set-based.

