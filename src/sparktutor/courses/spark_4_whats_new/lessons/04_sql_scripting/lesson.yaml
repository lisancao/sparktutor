    ## SQL UDFs (Spark 4.0)

    SQL UDFs are functions whose body is a SQL expression or query. Unlike
    Python UDFs they are transparent to Catalyst: the body is inlined into
    the calling plan, so filters push through them and there is no Python
    serialization cost.

    ```sql
    -- Scalar
    CREATE OR REPLACE TEMPORARY FUNCTION tier(balance DOUBLE)
    RETURNS STRING
    RETURN CASE WHEN balance >= 500 THEN 'gold'
                WHEN balance >= 50 THEN 'silver' ELSE 'basic' END;

    -- Table-valued
    CREATE OR REPLACE TEMPORARY FUNCTION accounts_above(min_balance DOUBLE)
    RETURNS TABLE (account STRING, balance DOUBLE)
    RETURN SELECT account, balance FROM accounts WHERE balance > min_balance;

    SELECT account, tier(balance) FROM accounts_above(10);
    ```

    Gotchas: parameters are not constants, so `LIMIT n` with a parameter
    fails (`INVALID_LIMIT_LIKE_EXPRESSION.IS_UNFOLDABLE`); filter with
    `WHERE` instead. And you cannot shadow a built-in name.
    `CREATE OR REPLACE TEMPORARY FUNCTION upper ...` fails with
    `USER_DEFINED_FUNCTIONS.CANNOT_REPLACE_NON_SQL_UDF_WITH_SQL_UDF`.
    A plain `CREATE [TEMPORARY] FUNCTION upper ...` succeeds, but an unqualified
    `upper(...)` never calls it, because `system.builtin` is searched first.

    **Docs:** [CREATE FUNCTION (SQL)](https://spark.apache.org/docs/4.2.0/sql-ref-syntax-ddl-create-sql-function.html)

