    ## Upgrade Gotchas With ANSI

    The failures you hit in practice after a 3.5 to 4.x upgrade:

    - **CSV/JSON string columns cast to numbers.** Any dirty value now kills
      the job. Audit with `try_cast(...) IS NULL AND col IS NOT NULL` to find
      the offending rows before switching to strict casts.
    - **Integer overflow in aggregates over INT columns.** `sum` widens to
      BIGINT, but expressions like `col_a * col_b` on two INT columns do not.
      Cast to BIGINT before multiplying.
    - **Implicit string to number comparisons.** `WHERE int_col = '1x'` used
      to compare as NULL; now the cast fails.
    - **Pandas API on Spark** works under ANSI mode since 4.1, when
      `compute.ansi_mode_support` is `True` (the default) (SPARK-53295).

    If you must ship a legacy job unchanged, set
    `spark.sql.ansi.enabled=false` for that job only, and treat it as debt.

