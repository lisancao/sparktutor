- Class: text
  Depth: intermediate
  Output: |
    ## Connect Behavior Differences

    Code that runs on both still has a few semantic differences:

    - **Analysis is lazy.** In Classic, `df.select("nope")` fails
      immediately. In Connect, the plan is not analyzed until an action or
      a schema access, so the error surfaces later. In 4.2, `df.nope`
      attribute access on Connect also stopped validating eagerly; set
      `PYSPARK_VALIDATE_COLUMN_NAME_LEGACY=1` to restore it.
    - **Exceptions come from a different module.** Connect raises
      `pyspark.errors.exceptions.connect.ArithmeticException`, Classic raises
      `pyspark.errors.exceptions.captured.ArithmeticException`. Both are
      `PySparkException`, so catch the base class and match on condition.
    - **Caught errors are still logged.** The server logs the error with a
      full JVM stack trace before your `except` runs. Do not panic at the log.

