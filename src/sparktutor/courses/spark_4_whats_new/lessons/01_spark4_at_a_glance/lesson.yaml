- Class: text
  Depth: all
  Output: |
    ## Summary

    - **ANSI mode (4.0)** makes bad casts, overflow and division by zero
      fail. Use `try_cast`, `try_divide` and friends per expression rather
      than turning ANSI off.
    - **Error conditions and SQLSTATE** are the stable contract. Catch
      `PySparkException`, match `getCondition()`, route on `getSqlState()`.
      In 4.2 PySpark-side errors carry a SQLSTATE too.
    - **Spark Connect** runs the same DataFrame code over gRPC.
      `spark.api.mode=connect` (4.0) switches without code changes; analysis
      becomes lazy and the RDD API is unavailable.
    - **4.2 defaults:** Arrow-optimized Python UDFs, UDTFs and Arrow-based
      pandas conversion are on; PyArrow 18 is the minimum.
    - **Runtimes:** Java 17+ since 4.0, Java 25 support in 4.2.

    Next: the VARIANT type, Spark's answer to JSON columns.
