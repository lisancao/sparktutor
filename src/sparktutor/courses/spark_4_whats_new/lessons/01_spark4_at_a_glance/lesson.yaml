  Depth: all
  Output: |
    ## Spark Connect vs. Spark Classic

    Spark Connect decouples the client from the driver. Your Python process
    builds unresolved logical plans and ships them over gRPC to a Spark
    Connect server, which analyzes, optimizes and executes them. Spark
    Classic is the original model: your Python process *is* the driver,
    talking to a JVM over Py4J.

    Why it matters:

    - **Thin clients.** `pip install pyspark-client` gives you a pure Python
      client with no JVM.
    - **Isolation.** A client crash or a runaway `collect()` cannot take
      down a shared driver, and client and server can upgrade separately.
    - **Same API.** DataFrame and SQL code is the same; a few low level
      escape hatches (`df.rdd`, `sparkContext`, `_jdf`) do not exist.

    Three ways to get a Connect session:

    ```python
    # 1. Connect to a running server
    spark = SparkSession.builder.remote("sc://host:15002").getOrCreate()

    # 2. Start a local server in-process and connect to it (plain python)
    spark = SparkSession.builder.remote("local[*]").getOrCreate()

    # 3. Flip the API mode: works with spark-submit too
    spark = SparkSession.builder.config("spark.api.mode", "connect").getOrCreate()
    ```

    `spark.api.mode` arrived in 4.0 (SPARK-50605) to make migration a config
    change. Option 2 refuses to run under `spark-submit`, because a Spark
    master and a Connect URL cannot both be set
    (`CANNOT_CONFIGURE_SPARK_CONNECT_MASTER`). This lesson's exercise uses
    option 3 for that reason.

    **Docs:** [Spark Connect Overview](https://spark.apache.org/docs/4.2.0/spark-connect-overview.html)

