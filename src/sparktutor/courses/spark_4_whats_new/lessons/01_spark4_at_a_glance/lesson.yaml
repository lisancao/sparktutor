  Output: |
    ## The try_* Escape Hatches

    Turning ANSI off globally (`spark.sql.ansi.enabled=false`) is the blunt
    fix and the wrong one: it brings back silent corruption everywhere.
    Use the per-expression tolerant variants instead:

    | Strict (fails)            | Tolerant (returns NULL)        |
    |---------------------------|--------------------------------|
    | `CAST(x AS INT)`          | `try_cast(x AS INT)`           |
    | `a / b`                   | `try_divide(a, b)`             |
    | `a + b`, `a * b`          | `try_add(a, b)`, `try_multiply(a, b)` |
    | `element_at(arr, i)`      | `try_element_at(arr, i)`       |
    | `to_number(s, fmt)`       | `try_to_number(s, fmt)`        |
    | `to_timestamp(s, fmt)`    | `try_to_timestamp(s, fmt)`     |

    In the DataFrame API, `Column.try_cast` mirrors `Column.cast`:

    ```python
    from pyspark.sql import functions as sf

    clean = raw.select(
        sf.col("amount").try_cast("double").alias("amount"),
        sf.try_divide("amount", "qty").alias("unit_price"),
    )
    ```

    Most `try_*` functions existed in 3.x; ANSI-by-default is what turned
    them from niche to essential.

