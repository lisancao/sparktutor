    ## Error Conditions and SQLSTATE

    Spark 4 errors are structured. Every engine error has:

    - an **error condition** (formerly "error class"), a stable identifier
      such as `CAST_INVALID_INPUT` or `UNRESOLVED_COLUMN.WITH_SUGGESTION`
    - a five-character **SQLSTATE** from the SQL standard, such as `22018`
      (invalid character value for cast) or `42703` (undefined column)
    - message parameters you can read programmatically

    SQLSTATE became mandatory for engine errors in 4.0 (SPARK-45581). In
    PySpark most engine errors surface as subclasses of
    `pyspark.errors.PySparkException`:

    ```python
    from pyspark.errors import PySparkException

    try:
        spark.sql("SELECT 1/0").collect()
    except PySparkException as e:
        e.getCondition()          # 'DIVIDE_BY_ZERO'
        e.getSqlState()           # '22012'
        e.getMessageParameters()  # {'config': '"spark.sql.ansi.enabled"'}
    ```

    Match on the condition, never on message text: messages get reworded
    between releases, conditions do not.

    In Spark Classic a few errors still arrive as
    `py4j.protocol.Py4JJavaError` instead: some runtime `SparkException`s
    (such as `parse_json` raising `MALFORMED_RECORD_IN_PARSING`), SQL
    scripting errors, and internal errors. Catch both when you need to be
    exhaustive. In Connect they all arrive as `PySparkException`
    subclasses.

    **New in 4.2 (SPARK-54532):** errors raised by PySpark itself, before
    anything reaches the JVM, now carry a SQLSTATE as well. Passing a plain
    Python value where a Column is expected raises a `PySparkTypeError` with
    condition `NOT_EXPECTED_TYPE` and SQLSTATE `42K09`. One `except
    PySparkException` handler can now route both kinds of failure by
    SQLSTATE class.

    **Docs:** [Error Conditions](https://spark.apache.org/docs/4.2.0/sql-error-conditions.html)

