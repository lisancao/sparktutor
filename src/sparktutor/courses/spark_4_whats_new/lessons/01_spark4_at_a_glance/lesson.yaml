    ## Python UDFs and Arrow in 4.2

    Spark 4.2 flips three defaults (SPARK-54555):

    - `spark.sql.execution.pythonUDF.arrow.enabled` is `true`: plain `@udf`
      functions run through Arrow batches (`ArrowEvalPython` in the plan)
      instead of pickled rows (`BatchEvalPython`).
    - `spark.sql.execution.pythonUDTF.arrow.enabled` is `true`: regular
      Python UDTFs are Arrow-optimized.
    - `spark.sql.execution.arrow.pyspark.enabled` is `true`: `toPandas()`
      and `createDataFrame(pandas_df)` use Arrow.

    Set any of them to `false` to restore the legacy behavior. Opt a single
    UDF out with `@udf(returnType, useArrow=False)`.

    Related 4.2 changes from the PySpark migration guide: the minimum
    PyArrow is now 18.0.0, PyPy is no longer supported, and a pandas UDF
    that receives a nullable integer column with nulls now sees a pandas
    nullable dtype (`Int64`) instead of `float64`.

    4.1 added `@arrow_udf` and `@arrow_udtf` (SPARK-52214, SPARK-52979),
    which hand your function `pyarrow` arrays directly with no pandas
    conversion at all.

    **Docs:** [PySpark Migration Guide](https://spark.apache.org/docs/4.2.0/api/python/migration_guide/pyspark_upgrade.html)

