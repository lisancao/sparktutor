  Output: |
    ## Runtimes and Platform

    - **Java 17 is the minimum** since 4.0 (SPARK-45315 dropped JDK 8 and
      11). Java 21 is supported. 4.2 adds build and run support for
      **Java 25** (SPARK-51167), and the Kubernetes image moved to a
      `25-jre` base.
    - **Scala 2.13 only.** Scala 2.12 builds are gone since 4.0.
    - **Python 3.9+** for PySpark 4.0, **3.10+** since 4.1.

    If you pin a container image, check the Java version first: a Spark 4
    job on a Java 11 image fails at JVM startup, not at your code.

