    ## What You'll Learn

    Spark 4.0 shipped in May 2025, 4.1 followed, and 4.2.0 is the current
    release. Most of this course is about shiny new features, but this first
    lesson covers the defaults that changed under you. If you upgrade a 3.5
    job and something breaks, it is almost always one of these.

    By the end of this lesson you will be able to:

    - Explain why ANSI mode is now the default (4.0) and what it breaks
    - Use the `try_*` family to opt back into lenient behavior, per expression
    - Catch errors by **condition** and **SQLSTATE** instead of parsing messages,
      including errors raised on the Python side (4.2)
    - Run the same PySpark code over **Spark Connect** or **Spark Classic**
    - Know what changed for Python UDFs and Arrow in 4.2, and which runtimes
      Spark 4 supports (Java 17 minimum since 4.0, Java 25 support in 4.2)

    Every feature in this course is tagged with the release it landed in, and
    every code sample was run against PySpark 4.2.0.

- Class: text
  Depth: beginner
  Output: |
    A quick mental model before we start. Spark 3.x was forgiving: if you
    asked it to turn the string `'abc'` into a number, it quietly gave you
    `NULL` and kept going. That sounds friendly until a typo in a feed turns
    a revenue column into NULLs and nobody notices for a month.

    Spark 4 behaves like a strict database. Bad input stops the query with
    a clear error. When you *want* the forgiving behavior, you ask for it
    explicitly, one expression at a time, with functions whose names start
    with `try_`.

