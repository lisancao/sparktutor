  Output: |
    ## SQLSTATE Classes Worth Knowing

    The first two characters are the class. Routing on the class gives you
    coarse, stable error handling:

    - `22xxx` data exception (bad cast `22018`, divide by zero `22012`,
      overflow `22003`). Usually a bad record: quarantine and continue.
    - `42xxx` syntax or access rule violation (unresolved column `42703`,
      unresolved routine `42883`, type mismatch `42K09`). A code bug: fail fast.
    - `0A000` feature not supported. You hit a disabled or unimplemented
      feature; you will see this several times in this course.
    - `XX000` internal error. A Spark bug; report it.

    SQL scripting condition handlers (lesson 4) can also catch by SQLSTATE,
    so the same taxonomy works in SQL and in Python.

