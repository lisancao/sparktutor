    ## ANSI Mode Is the Default (Spark 4.0)

    `spark.sql.ansi.enabled` defaults to `true` since 4.0 (SPARK-44444).
    ANSI mode changes three families of behavior:

    - **Invalid casts fail.** `CAST('abc' AS INT)` raises
      `CAST_INVALID_INPUT` instead of returning NULL.
    - **Arithmetic overflow fails.** `2147483647 + 1` on INT raises
      `ARITHMETIC_OVERFLOW` instead of wrapping to a negative number.
    - **Division by zero fails.** `1/0` raises `DIVIDE_BY_ZERO` instead of
      returning NULL.

    It also tightens implicit type coercion and makes out-of-range array
    and map access an error (`element_at(array(1,2), 5)` fails).

    Why the change: silent NULLs and wrapped integers are data corruption
    that looks like data. Every other serious SQL engine fails loudly here,
    and the Spark community decided correctness should be the default and
    leniency the opt-in.

    ```sql
    SELECT CAST('abc' AS INT);
    -- [CAST_INVALID_INPUT] The value 'abc' of the type "STRING" cannot be
    -- cast to "INT" because it is malformed. ... Use `try_cast` to tolerate
    -- malformed input and return NULL instead. SQLSTATE: 22018
    ```

    Notice that the error message tells you the fix.

    **Docs:** [ANSI Compliance](https://spark.apache.org/docs/4.2.0/sql-ref-ansi-compliance.html)

