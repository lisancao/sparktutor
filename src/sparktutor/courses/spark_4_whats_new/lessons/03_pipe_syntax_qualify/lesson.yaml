  Output: |
    ## Summary

    - **Pipe syntax (4.0)** writes queries in execution order with `|>`; every
      prefix is a valid query, which makes debugging trivial.
    - **4.2** adds `|` as a shorter pipe token and aggregates in pipe `SELECT`.
    - **QUALIFY (4.2)** filters on window function results without a
      subquery; it needs a window function and rejects bare aggregates.
    - Pipe and regular SQL mix freely, so you can adopt pipes one query at a
      time.

    Next: SQL scripting, where SQL gets variables, loops and error handlers.
