  Output: |
    ## Pipe Syntax Basics (Spark 4.0)

    A pipe query starts from any table expression (`FROM t`, `TABLE t`, or
    a whole regular query) and chains operators with `|>`:

    - `|> WHERE cond`: filter rows. After an aggregate it acts like HAVING.
    - `|> SELECT exprs`: project (window functions allowed).
    - `|> EXTEND expr AS c`: add columns, keep the existing ones.
    - `|> SET c = expr`: replace a column in place.
    - `|> DROP c1, c2`: remove columns.
    - `|> AS alias`: name the intermediate result for later references.
    - `|> AGGREGATE aggs GROUP BY keys`: aggregate; output is keys, then aggregates.
    - `|> JOIN t ON ...`: join the current result with another table.
    - `|> ORDER BY`, `|> LIMIT`: sort, limit.
    - `|> UNION ALL`, `|> PIVOT`, `|> UNPIVOT`, `|> TABLESAMPLE`: as in regular SQL.

    Each operator sees only the output of the previous one, so every prefix
    of a pipe chain is itself a valid query. Highlight the first three lines
    in a notebook, run them, and you are debugging the intermediate result.

    **Docs:** [SQL Pipe Syntax](https://spark.apache.org/docs/4.2.0/sql-pipe-syntax.html)

