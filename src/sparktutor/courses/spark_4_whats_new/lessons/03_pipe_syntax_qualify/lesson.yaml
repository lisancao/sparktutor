- Class: text
  Depth: intermediate
  Output: |
    ## QUALIFY Rules and Errors

    - **A window function is required** somewhere in the `SELECT` list or the
      `QUALIFY` condition. `SELECT region FROM sales QUALIFY region = 'east'`
      fails with `QUALIFY_REQUIRES_WINDOW_FUNCTION`.
    - **No bare aggregates in the condition.** `QUALIFY sum(amt) > 10` is
      rejected; use `HAVING` for that. Aggregates *inside* a window over a
      grouped query are fine:
      `... GROUP BY region QUALIFY rank() OVER (ORDER BY sum(amt) DESC) = 1`.
    - **Name collisions.** If a `SELECT` alias matches an input column name,
      the input column wins inside `QUALIFY`. Give window aliases distinct
      names (`rk`, `rn`) to avoid surprises.
    - **Ties.** `row_number()` picks one row arbitrarily among ties; use
      `rank()` if you want all tied rows, and add a tiebreaker to `ORDER BY`
      if you want determinism.

- Class: text
  Depth: advanced
  Output: |
    ## Pipes, Windows and QUALIFY Together

    Pipe syntax has no `QUALIFY` operator because it does not need one: the
    pipe `WHERE` already filters the output of the previous step, window
    columns included.

    ```sql
    FROM orders
    |> AGGREGATE sum(amount) AS revenue GROUP BY region, product
    |> EXTEND rank() OVER (PARTITION BY region ORDER BY revenue DESC) AS rk
    |> WHERE rk = 1
    |> DROP rk
    ```

    Note the `EXTEND` after `AGGREGATE`: a window over aggregated results
    without a nested subquery, which in regular SQL needs either a subquery
    or `QUALIFY` with the aggregate repeated inside the window.

    Pipe syntax is also valid inside views, CTEs and subqueries, and you can
    append pipe operators to any regular query
    (`SELECT ... FROM t WHERE ... |> EXTEND ...`). That makes it a low-risk
    refactoring tool: convert the outermost layer first.

