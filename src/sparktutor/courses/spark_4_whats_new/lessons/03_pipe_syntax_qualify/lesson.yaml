    ## QUALIFY (Spark 4.2)

    Window functions run after `WHERE` and `HAVING`, so you cannot filter
    on them there. The classic workaround is a subquery:

    ```sql
    SELECT * FROM (
      SELECT *, row_number() OVER (PARTITION BY customer ORDER BY order_date DESC) AS rn
      FROM orders
    ) WHERE rn = 1
    ```

    `QUALIFY` is a `WHERE` that runs after window functions:

    ```sql
    SELECT customer, order_id, order_date
    FROM orders
    QUALIFY row_number() OVER (PARTITION BY customer ORDER BY order_date DESC) = 1
    ```

    It can reference a window alias from the `SELECT` list
    (`... AS rk FROM t QUALIFY rk <= 3`) or define the window inline, and it
    works with a named `WINDOW` clause. Clause order: `WHERE`, `GROUP BY`,
    `HAVING`, `WINDOW`, `QUALIFY`, then `ORDER BY`.

    **Docs:** [QUALIFY Clause](https://spark.apache.org/docs/4.2.0/sql-ref-syntax-qry-select-qualify.html)

