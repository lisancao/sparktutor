  Output: |
    ## What You'll Learn

    SQL's clause order (`SELECT ... FROM ... WHERE ... GROUP BY ...`) is not
    the order it executes in, which is why real queries turn into nested
    subqueries read inside out. Spark 4.0 added **pipe syntax** (SPARK-49555),
    which lets you write a query top to bottom in execution order. 4.2 makes
    it nicer to type and adds **QUALIFY**, the missing clause for filtering on
    window functions.

    By the end of this lesson you will be able to:

    - Write queries with `|>` and the pipe operators (`WHERE`, `AGGREGATE`,
      `EXTEND`, `SET`, `DROP`, `AS`, `JOIN`, ...)
    - Use the 4.2 additions: `|` as the pipe token (SPARK-51518) and aggregate
      functions in a pipe `SELECT` (SPARK-54292)
    - Replace "subquery plus `WHERE rn = 1`" with `QUALIFY` (SPARK-31561, 4.2)
    - Mix pipe and regular SQL freely

- Class: text
  Depth: beginner
  Output: |
    Think of a pipe query as a recipe. Start with a table, then apply one
    step at a time, each step working on the result of the step before:

    ```sql
    FROM orders                    -- start with all orders
    |> WHERE amount > 5            -- keep the bigger ones
    |> AGGREGATE sum(amount) AS revenue GROUP BY region
    |> ORDER BY revenue DESC       -- sort the result
    ```

    You read it in the same order Spark runs it. No jumping back to the
    top to figure out what a column name refers to.

