    ## What 4.2 Adds to Pipes

    **`|` as the pipe token** (SPARK-51518). `FROM orders | WHERE amount > 5`
    works, controlled by `spark.sql.parser.singleCharacterPipeOperator.enabled`
    (default `true`). The parser tells the two meanings apart by position:
    `SELECT 1 | 2` is still bitwise OR and returns `3`.

    **Aggregates in pipe `SELECT`** (SPARK-54292). Before 4.2 you had to use
    `AGGREGATE`; a pipe `SELECT` containing `sum()` was an error. Now both work:

    ```sql
    FROM orders |> SELECT region, sum(amount) AS revenue GROUP BY region
    FROM orders |> AGGREGATE sum(amount) AS revenue GROUP BY region
    ```

    One difference: `SELECT ... GROUP BY` keeps your column order, while
    `AGGREGATE` always emits the grouping keys first.

    Gotcha: the 4.2.0 pipe syntax docs page still says aggregates are not
    supported in the pipe `SELECT` operator. The engine and the release notes
    say otherwise; trust the engine.

