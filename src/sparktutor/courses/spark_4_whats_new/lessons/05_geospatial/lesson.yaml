- Class: text
  Depth: all
  Output: |
    ## What You'll Learn

    Location data in Spark has always been an afterthought: latitude and
    longitude as two doubles, or a WKB blob in a BINARY column that only a
    third-party library understood. Spark 4.2 ships native **GEOMETRY** and
    **GEOGRAPHY** types (SPIP SPARK-51658), enabled by default (SPARK-56771),
    with Parquet read and write support (SPARK-55260, SPARK-55261).

    By the end of this lesson you will be able to:

    - Choose between GEOMETRY (planar) and GEOGRAPHY (on the sphere)
    - Declare typed columns with an SRID: `GEOGRAPHY(4326)`, `GEOMETRY(3857)`
    - Build values from WKB in SQL and from Python objects
    - Round-trip geo columns through Parquet
    - Work within what 4.2 does and does not yet provide

    Be clear on scope: 4.2 delivers the **types and their storage**. The
    function library is deliberately small. There is no `ST_Distance` or
    `ST_Contains` yet; this lesson shows how to work around that.

- Class: text
  Depth: beginner
  Output: |
    Two ideas to hold onto:

    - **WKB (Well-Known Binary)** is the standard byte format for shapes.
      A point is 21 bytes: one byte for byte order, four for the shape type,
      then two 8-byte numbers for x and y. Spark stores geo values as WKB.
    - **SRID (Spatial Reference ID)** says what the numbers mean. SRID 4326
      means "longitude and latitude in degrees on the WGS 84 globe", the
      coordinates your phone's GPS gives you. SRID 3857 means "metres on a
      flat Web Mercator map", the projection most web maps draw.

    The same pair of numbers means something completely different under a
    different SRID, which is why Spark makes the SRID part of the type.

- Class: text
  Depth: all
  Output: |
    ## GEOMETRY vs GEOGRAPHY

    - **GEOMETRY** is Cartesian: a flat plane. Use it for projected or local
      coordinates (Web Mercator `3857`, UTM zones, CAD drawings) and for
      small areas where Earth's curvature does not matter. It accepts any
      SRID in the registry, including `0` (unspecified).
    - **GEOGRAPHY** is on the sphere, coordinates in degrees, edges
      interpolated spherically. Use it for global data and anything where
      distance or area must respect curvature. Only geographic SRIDs are
      allowed (most commonly `4326`), and longitude must be in [-180, 180],
      latitude in [-90, 90].

    The docs' example: the shortest path from London to New York on the
    sphere crosses Canada; a planar GEOMETRY line does not.

    **Docs:** [Geospatial Types](https://spark.apache.org/docs/4.2.0/sql-ref-geospatial-types.html)

