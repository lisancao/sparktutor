    ## Building Points From Python

    There is no `ST_Point(lon, lat)` constructor in 4.2, so build WKB
    yourself. A 2D point in little-endian WKB is a fixed layout:

    ```python
    import struct
    from pyspark.sql.types import StructType, StructField, StringType, GeographyType, Geography

    def point_wkb(lon, lat):
        return struct.pack("<BIdd", 1, 1, lon, lat)   # byte order, type=Point, x, y

    schema = StructType([
        StructField("store", StringType()),
        StructField("loc", GeographyType(4326)),
    ])
    stores = spark.createDataFrame(
        [("downtown", Geography.fromWKB(point_wkb(-123.1207, 49.2827), 4326))],
        schema,
    )
    ```

    Note the axis order: WKB is **x then y**, so longitude first. Swapping
    them is the classic geo bug, and for GEOGRAPHY Spark rejects latitudes
    outside [-90, 90] with `WKB_PARSE_ERROR`, which catches some of these.

