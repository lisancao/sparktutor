    ## Errors You Will Meet

    - **SRID mismatch on write.** Inserting a `GEOMETRY(0)` into a
      `GEOMETRY(4326)` column fails with
      `INCOMPATIBLE_DATA_FOR_TABLE.CANNOT_SAFELY_CAST`. Use `ST_SetSrid` to
      label the value.
    - **Invalid SRID for the type.** `ST_SetSrid(geog, 3857)` fails with
      `ST_INVALID_SRID_VALUE`: 3857 is projected, not geographic.
    - **No comparisons.** `g1 = g2` and `ORDER BY g` fail at analysis with
      `INVALID_ORDERING_TYPE`, like VARIANT. `GROUP BY g` is worse: in 4.2.0
      it passes analysis and then crashes the task with a `scala.MatchError`.
      Group, join and compare on `ST_AsBinary(g)` (plus `ST_Srid(g)`) instead.
    - **`show()` is unhelpful.** Classic `show()` prints an internal object
      reference for geo columns. Display `hex(ST_AsBinary(g))` and
      `ST_Srid(g)` instead; `collect()` returns proper `Geometry` objects.

