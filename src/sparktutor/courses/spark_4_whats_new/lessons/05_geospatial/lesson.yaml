- Class: text
  Depth: all
  Output: |
    ## Summary

    - **GEOMETRY and GEOGRAPHY (on by default in 4.2)** are native types with
      the SRID in the type: `GEOGRAPHY(4326)`, `GEOMETRY(3857)`;
      `GEOMETRY(ANY)` exists for expressions but not Parquet columns.
    - Values are **WKB**, x before y (longitude first).
    - 4.2's functions convert and label (`ST_GeomFromWKB`, `ST_GeogFromWKB`,
      `ST_AsBinary`, `ST_Srid`, `ST_SetSrid`); measurement is not there yet.
    - **Parquet I/O** preserves the types and SRIDs.
    - Geo values cannot be compared, grouped or sorted directly; use
      `ST_AsBinary` when you need a key.

    Next: writing your own data sources in pure Python.
