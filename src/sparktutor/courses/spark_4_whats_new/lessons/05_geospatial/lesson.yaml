    ## Working Without ST_Distance

    Because 4.2 has no measurement functions, you compute in a UDF over the
    WKB bytes. For points that is a few lines of `struct.unpack` plus the
    haversine formula:

    ```python
    @sf.udf(DoubleType())
    def haversine_km(wkb_a, wkb_b):
        lon1, lat1 = struct.unpack("<dd", bytes(wkb_a)[5:21])
        lon2, lat2 = struct.unpack("<dd", bytes(wkb_b)[5:21])
        ...
    ```

    Pass `st_asbinary(loc)` to it, so the UDF sees plain bytes in a known
    byte order (`st_asbinary` defaults to little-endian NDR). With 4.2's
    Arrow-optimized UDFs this is reasonably fast, but it is a stopgap: it
    only handles points, and a UDF is opaque to the optimizer.

    Lesson 8 shows `NEAREST BY`, the 4.2 top-K join, which pairs naturally
    with a distance expression like this one.

- Class: text
  Depth: advanced
  Output: |
    ## Storage and Interop

    Parquet support (4.2) writes geo columns using Parquet's GEOMETRY and
    GEOGRAPHY logical types. Inspect a written file with `pyarrow` and you
    see `binary g (Geography(crs=OGC:CRS84, algorithm=spherical))` for a
    `GEOGRAPHY(4326)` column and `Geometry(crs=EPSG:3857)` for a
    `GEOMETRY(3857)` one, so the SRID survives the round trip:
    reading the files back yields `GeographyType(4326)`, not BINARY. That is
    the real value of this release: geo columns become first-class in
    tables, schemas and files, and other Parquet readers that understand
    the logical types see them as geo data.

    The SRID registry ships inside Spark's SQL API jar
    (`org/apache/spark/sql/srs_registry.csv` in `spark-sql-api_*.jar`,
    generated from the PROJ database), so the type system can validate that
    an SRID is real, and geographic where GEOGRAPHY requires it.

    The cost of the small function library is that heavy spatial joins
    still belong in a dedicated library (Apache Sedona is the usual choice)
    or in UDFs over WKB. Expect the ST function set to grow in later
    releases; `SYSTEM_PATH` in the SQL path docs already mentions reserving
    room for built-in geospatial functions.

