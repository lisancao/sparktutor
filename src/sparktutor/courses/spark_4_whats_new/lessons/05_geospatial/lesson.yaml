    ## Types, SRIDs and Construction

    In SQL the SRID is part of the type, and you must give one:

    ```sql
    CREATE TABLE places (id INT, loc GEOGRAPHY(4326)) USING parquet;
    CREATE TABLE tiles (id INT, g GEOMETRY(3857)) USING parquet;
    ```

    `GEOMETRY(ANY)` is a valid type for expressions that mix SRIDs (a
    `UNION` of SRID 4326 and 3857 values has type `geometry(any)`), but in
    4.2.0 a Parquet table column cannot store it; `CREATE TABLE` fails with
    `UNSUPPORTED_DATA_TYPE_FOR_DATASOURCE`. The same goes for
    `GEOGRAPHY(ANY)`. Give each table column a fixed SRID.

    The ST functions in 4.2:

    - `ST_GeomFromWKB(wkb[, srid])` returns GEOMETRY (SRID `0` if omitted)
    - `ST_GeogFromWKB(wkb)` returns GEOGRAPHY with SRID `4326`
    - `ST_AsBinary(geo[, 'NDR' | 'XDR'])` returns WKB (little or big endian)
    - `ST_Srid(geo)` returns the SRID
    - `ST_SetSrid(geo, srid)` returns the value with a new SRID

    ```sql
    SELECT ST_Srid(ST_GeogFromWKB(X'0101000000000000000000F03F0000000000000040'));  -- 4326
    SELECT typeof(ST_GeomFromWKB(X'0101000000000000000000F03F0000000000000040'));   -- geometry(0)
    ```

    In PySpark the types are `GeometryType(srid)` and `GeographyType(srid)`,
    the values are `Geometry` and `Geography` objects, and the functions are
    `sf.st_geomfromwkb`, `sf.st_geogfromwkb`, `sf.st_asbinary`, `sf.st_srid`
    and `sf.st_setsrid`. The Python classes have existed since 4.1; 4.2 is the
    release that enables the feature by default.

