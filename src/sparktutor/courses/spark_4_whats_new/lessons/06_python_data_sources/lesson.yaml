    ## A Batch Data Source

    ```python
    from pyspark.sql.datasource import DataSource, DataSourceReader, InputPartition

    class RangePartition(InputPartition):
        def __init__(self, start, end):
            self.start, self.end = start, end

    class SensorDataSource(DataSource):
        @classmethod
        def name(cls):
            return "sensors"

        def schema(self):
            return "seq int, sensor string, value double"

        def reader(self, schema):
            return SensorBatchReader(self.options)

    class SensorBatchReader(DataSourceReader):
        def __init__(self, options):
            self.rows = int(options.get("rows", 30))

        def partitions(self):
            return [RangePartition(0, 15), RangePartition(15, 30)]

        def read(self, partition):
            for i in range(partition.start, partition.end):
                yield (i, f"s{i % 3}", 20.0 + i)

    spark.dataSource.register(SensorDataSource)
    df = spark.read.format("sensors").option("rows", 30).load()
    ```

    Rules that bite:

    - **Everything must pickle.** The reader and partitions are serialized
      to executors. Open connections and clients inside `read()`, not in
      `__init__`.
    - **Options arrive as strings** in a case-insensitive dict. Convert
      types yourself.
    - **`read()` can yield `pyarrow.RecordBatch`** instead of tuples, which
      skips per-row conversion for large reads.
    - **Schema must match exactly (4.2).** Returning Arrow data whose column
      types differ from the declared schema now fails with
      `DATA_SOURCE_RETURN_SCHEMA_MISMATCH`; earlier versions only checked
      column count and names.

    **Docs:** [Python Data Source API](https://spark.apache.org/docs/4.2.0/api/python/tutorial/sql/python_data_source.html)

