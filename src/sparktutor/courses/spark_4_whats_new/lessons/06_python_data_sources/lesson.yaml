    ## Writers and Production Notes

    - **Writers.** `DataSource.writer(schema, overwrite)` returns a
      `DataSourceWriter` whose `write(iterator)` runs per task and returns a
      `WriterCommitMessage`; `commit(messages)` runs once on the driver.
      `streamWriter` adds a `batchId`. `DataSourceArrowWriter` (4.0) and
      `DataSourceStreamArrowWriter` (4.1) receive `pyarrow.RecordBatch`es.
    - **Offsets are your contract.** They are written to the checkpoint as
      JSON. Change their shape and old checkpoints break; version them
      (`{"v": 1, "seq": ...}`) from day one.
    - **`reportLatestOffset()`** (4.2) lets the source report how far the
      upstream data goes, which shows up in query progress for lag
      monitoring.
    - **Overriding a statically registered source** (one discovered from an
      installed package) with `spark.dataSource.register` is allowed since
      4.1 (SPARK-51919).

