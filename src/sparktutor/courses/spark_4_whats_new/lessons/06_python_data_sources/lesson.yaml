    ## Streaming Readers

    A `DataSourceStreamReader` adds offsets. Offsets are JSON-able dicts
    that Spark checkpoints, so a restarted query resumes where it left off:

    - `initialOffset()`: where a brand new query starts
    - `latestOffset(start, limit)`: how far to read in the next micro-batch
    - `partitions(start, end)`: split one micro-batch into tasks
    - `read(partition)`: produce the rows (runs on executors)
    - `commit(end)`: Spark has durably processed everything up to `end`

    The 4.2 `latestOffset` signature takes the batch's `start` offset and a
    **`ReadLimit`**, which is how admission control works: implement
    `getDefaultReadLimit()` to return `ReadMaxRows(n)` (or `ReadMinRows`,
    `ReadMaxFiles`, `ReadMaxBytes`) and respect the limit you are given.

    ```python
    from pyspark.sql.streaming.datasource import ReadAllAvailable, ReadMaxRows

    def getDefaultReadLimit(self):
        return ReadMaxRows(self.max_rows)

    def latestOffset(self, start, limit):
        if isinstance(limit, ReadAllAvailable):
            return {"seq": self.total}
        return {"seq": min(self.total, start["seq"] + limit.max_rows)}
    ```

    Note the attribute name: the `ReadMaxRows` dataclass field is
    `max_rows`. The 4.2.0 docstring example for `latestOffset` says
    `limit.maxRows`, which raises `AttributeError`.

    The engine may still pass `ReadAllAvailable` (for example for some
    triggers) even when your default is a limit. Always honor the limit you
    receive, not the one you configured.

