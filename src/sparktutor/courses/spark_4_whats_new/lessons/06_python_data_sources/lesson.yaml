    ## SimpleDataSourceStreamReader

    For sources that cannot be partitioned (a single cursor-based API),
    `SimpleDataSourceStreamReader` collapses planning and reading into one
    driver-side `read(start) -> (rows, end_offset)`. Spark caches the rows
    and replays them by offset range.

    4.2 adds a guard: if `read()` returns rows without advancing the end
    offset past the start, the query fails with
    `SIMPLE_STREAM_READER_OFFSET_DID_NOT_ADVANCE`. Earlier versions
    reprocessed the same batch forever while the prefetch cache grew. If you
    have a simple reader that returned `start` alongside data, it was
    already buggy; 4.2 makes it loud.

    `SupportsTriggerAvailableNow` works with the simple reader too.

