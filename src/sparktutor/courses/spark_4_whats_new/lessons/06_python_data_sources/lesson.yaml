    ## Trigger.AvailableNow (Spark 4.2)

    `trigger(availableNow=True)` means "process everything that exists now,
    in rate-limited batches, then stop". It is the right trigger for
    scheduled incremental jobs. A source opts in by mixing in
    `SupportsTriggerAvailableNow`:

    ```python
    class SensorStreamReader(DataSourceStreamReader, SupportsTriggerAvailableNow):
        def prepareForTriggerAvailableNow(self):
            self.target = self.total     # freeze "now"
    ```

    Spark calls `prepareForTriggerAvailableNow()` once at query start; from
    then on `latestOffset` must never go past the frozen target, and must
    eventually return `start` unchanged so the query knows it is done.

    With 25 rows and `ReadMaxRows(10)`, the query runs three micro-batches of
    10, 10 and 5 rows and terminates.

