    ## Summary

    - **Python Data Source API (4.0):** `DataSource` + `DataSourceReader` +
      `InputPartition` give parallel reads in pure Python; writers and
      streaming readers use the same pattern.
    - **Filter pushdown (4.1)** via `pushFilters`; flag-gated in 4.2, and
      implementing it with the flag off is an error.
    - **Admission control (4.2):** `latestOffset(start, limit)` plus
      `getDefaultReadLimit()` cap micro-batch size.
    - **Trigger.AvailableNow (4.2)** via `SupportsTriggerAvailableNow`.
    - **4.2 validation:** schema type mismatches and non-advancing simple
      readers now fail loudly.

    Next: stateful streaming with `transformWithState`.
