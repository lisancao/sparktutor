    ## What You'll Learn

    Before Spark 4, a custom connector meant Scala or Java against the
    DataSource V2 interfaces, a JAR, and a build. Python users wrapped REST
    APIs in `spark.createDataFrame(requests.get(...).json())`, which runs
    on the driver and does not scale or stream.

    The **Python Data Source API** (SPIP SPARK-44076, Spark 4.0) lets you
    write a real connector in pure Python: partitioned parallel reads on
    executors, writers, and streaming. 4.1 added filter pushdown
    (SPARK-51271). 4.2 adds **admission control** and
    **Trigger.AvailableNow** for streaming readers (SPARK-55304).

    By the end of this lesson you will be able to:

    - Implement `DataSource`, `DataSourceReader` and `InputPartition`
    - Push filters into your source with `pushFilters`
    - Write a streaming reader with offsets, a read limit, and AvailableNow
    - Recognize the new 4.2 validation errors

- Class: text
  Depth: beginner
  Output: |
    The shape of a data source, in plain words:

    - A **DataSource** class has a name (so you can write
      `spark.read.format("sensors")`) and a schema.
    - Its **reader** decides how to split the work into **partitions**.
      Spark runs one task per partition, in parallel, on the executors.
    - Each task calls the reader's **read(partition)**, which yields rows as
      Python tuples.

    For streaming, Spark also asks "how far does the data go now?" (an
    **offset**) before each micro-batch, then reads everything between the
    last offset and the new one.

