    ## Filter Pushdown (Spark 4.1)

    Without pushdown, `df.filter(sensor == 's2')` makes your source produce
    every row and Spark discards most of them. If the backend can filter
    (a SQL database, an API with query parameters), let it:

    ```python
    from pyspark.sql.datasource import EqualTo

    class SensorBatchReader(DataSourceReader):
        def pushFilters(self, filters):
            for f in filters:
                if isinstance(f, EqualTo) and f.attribute == ("sensor",):
                    self.sensor_filter = f.value    # handle it ourselves
                else:
                    yield f                         # Spark keeps this one
    ```

    `pushFilters` receives the AND-ed conjuncts Spark can express
    (`EqualTo`, `GreaterThan`, `In`, `IsNull`, `StringStartsWith`, ...) and
    must return the ones you did **not** handle. `attribute` is a tuple
    path, so a top-level column `sensor` is `("sensor",)`. OR conditions are
    not pushed.

    Two traps in 4.2:

    - Pushdown is behind the internal flag
      `spark.sql.python.filterPushdown.enabled` (default `false`).
    - With the flag off, a reader that **implements** `pushFilters` does not
      silently skip it: the read fails with `DATA_SOURCE_PUSHDOWN_DISABLED`.
      Set the flag before the first read, or do not implement the method.

