    ## Discovering the Shape of Your Data

    With JSON strings you discover the schema by reading samples. With
    VARIANT you ask Spark:

    ```sql
    SELECT schema_of_variant(v) FROM events;           -- per row
    SELECT schema_of_variant_agg(v) FROM events;       -- merged across rows
    ```

    The merged schema is the union of every field seen. When a field has
    different types in different rows, the merged type is `VARIANT`: that is
    your signal that the producer is inconsistent. For example, an `amount`
    that is sometimes `49.5` and sometimes `"12.00"` merges to
    `amount: VARIANT`.

    To iterate over keys, use the table-valued function `variant_explode`:

    ```sql
    SELECT key, value FROM events, LATERAL variant_explode(v);
    ```

- Class: text
  Depth: intermediate
  Output: |
    ## VARIANT Gotchas

    - **No comparison, no grouping, no sorting.** `v1 = v2`, `GROUP BY v`
      and `ORDER BY v` all fail at analysis (`INVALID_ORDERING_TYPE`,
      `GROUP_EXPRESSION_TYPE_IS_NOT_ORDERABLE`). Extract and cast the fields
      you want to compare first.
    - **No VARIANT join keys.** Same reason. Join on `v:id::bigint`.
    - **JSON null vs SQL NULL.** `parse_json('null')` is a VARIANT holding a
      JSON null, which is not SQL NULL. Test it with `is_variant_null(v)`.
    - **Cast at the edge, not everywhere.** If a field is queried in every
      dashboard, promote it to a typed column in your silver layer. VARIANT
      is for the long tail of fields, not a reason to never model data.

- Class: text
  Depth: advanced
  Output: |
    ## Shredding and Storage

    When Spark writes VARIANT to Parquet, 4.1 infers a **shredding schema**
    from the data being written (SPARK-53659): common fields with stable
    types are stored as typed Parquet columns alongside the residual binary.
    Readers then push `v:user.id::int` style extractions into the scan, read
    only that column, and use its min/max statistics for data skipping.

    The knobs are internal confs (`spark.sql.variant.writeShredding.enabled`,
    `spark.sql.variant.inferShreddingSchema`,
    `spark.sql.variant.shredding.maxSchemaWidth`), all on with sensible
    defaults; there is no public API to control the shredding schema yet.
    4.1 also reads the Parquet VARIANT logical type (SPARK-54410), which is
    what makes VARIANT files readable by other engines that implement the
    spec. The spec is not finalized, and Spark's implementation does not yet
    support UUID, TIME or nanosecond timestamps inside a VARIANT.

    Practical consequence: the stable fields in a VARIANT column are close
    to free to query. The fields whose type wobbles are the ones that stay
    in the binary residual and cost you a decode.

