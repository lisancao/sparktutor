- Class: text
  Depth: all
  Output: |
    ## Summary

    - **VARIANT (4.0; shredding on by default in 4.1)** stores
      semi-structured data pre-parsed, so extraction is a lookup and
      Parquet can shred stable fields into real columns.
    - **Ingest** with `try_parse_json` at the edge; `parse_json` is strict.
    - **Extract** with `v:path::type` (`:` since 4.1, `::` since 4.0) or
      `variant_get`; use `try_variant_get` when the type is unreliable.
    - **Explore** with `schema_of_variant_agg`; a merged type of `VARIANT`
      means the producer is inconsistent.
    - **Do not** compare, group, sort or join on a raw VARIANT: extract and
      cast first.

    Next: SQL pipe syntax and QUALIFY.
