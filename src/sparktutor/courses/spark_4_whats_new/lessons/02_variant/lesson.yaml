- Class: text
  Depth: all
  Output: |
    ## What You'll Learn

    Every data platform has a column called `payload` holding JSON as a
    string. Spark 4.0 added a real type for it: **VARIANT** (SPARK-45827).
    4.1 turned on **shredded** Parquet writes and the Parquet VARIANT
    logical type by default (SPARK-54454), and added the `:` path operator
    (SPARK-52494).

    By the end of this lesson you will be able to:

    - Explain what VARIANT replaces and why it is faster than JSON strings
    - Parse JSON into VARIANT with `parse_json` and `try_parse_json`
    - Extract fields with `variant_get`, `try_variant_get`, `:` paths and
      `::` casts
    - Discover the shape of messy data with `schema_of_variant` and
      `schema_of_variant_agg`
    - Avoid the VARIANT gotchas: no equality, no grouping, strict casts

- Class: text
  Depth: beginner
  Output: |
    Picture a column of JSON strings. Every time a query wants one field,
    Spark has to read the whole string and parse it from the first brace,
    on every row, in every query. A VARIANT stores the JSON already parsed,
    in a compact binary format that knows where each field lives. Asking
    for one field becomes a lookup instead of a parse.

    You still get the flexibility of JSON: rows do not need the same fields,
    and new fields can show up tomorrow without a schema change.

- Class: text
  Depth: all
  Output: |
    ## Why Not a String, and Why Not a Struct?

    Before VARIANT you had two options for semi-structured data:

    - **JSON string + `from_json`/`get_json_object`.** Flexible, but every
      read re-parses the text, and the column stats Parquet keeps are useless
      for a string blob.
    - **A STRUCT with a fixed schema.** Fast, but the schema is frozen at
      write time. A new field upstream means a migration; a field that is
      sometimes a number and sometimes a string breaks the write.

    VARIANT is a self-describing binary encoding whose spec is developed in
    the Apache Parquet project (Spark's `common/variant/README.md` pins the
    version it implements). Each value carries its own types and field offsets, so
    extraction skips straight to the field. With **shredding** (4.1), the
    Parquet writer pulls frequently occurring fields out into real typed
    columns behind the scenes, so readers get columnar pruning and statistics
    on fields you never declared.

    **Docs:** [Data Types](https://spark.apache.org/docs/4.2.0/sql-ref-datatypes.html)

