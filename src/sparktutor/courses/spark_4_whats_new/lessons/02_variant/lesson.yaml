  Output: |
    ## Getting Data Into VARIANT

    ```sql
    SELECT parse_json('{"user": {"id": 1}, "tags": ["a", "b"]}') AS v;
    SELECT try_parse_json('{not json') AS v;   -- NULL, no error
    ```

    `parse_json` fails the query on malformed input, whatever the ANSI
    setting (turning ANSI mode off does not make it lenient).
    `try_parse_json` returns NULL, which is what you want at the edge of a
    pipeline: parse leniently, count the NULLs, quarantine them.

    You can also build a VARIANT from typed data with `to_variant_object`
    (structs, maps, arrays) or `CAST(x AS VARIANT)` for scalars, and turn
    one back into JSON text with `to_json(v)` or `CAST(v AS STRING)`.

    In Python, collecting a VARIANT gives you a `pyspark.sql.types.VariantVal`.
    Call `.toPython()` for dicts and lists, or `.toJson()` for a string.

- Class: text
  Depth: all
  Output: |
    ## Extracting Fields

    Three equivalent ways to pull out `user.id` as an INT:

    ```sql
    SELECT variant_get(v, '$.user.id', 'int')  FROM events;  -- 4.0
    SELECT v:user.id::int                      FROM events;  -- `:` is 4.1, `::` is 4.0
    SELECT CAST(v:user.id AS INT)              FROM events;
    ```

    Path syntax: `.field` for keys, `[n]` for array positions (zero-based),
    and `['key with spaces']` for awkward names. Keys are **case-sensitive**:
    `v:User` is not `v:user`. A missing path returns NULL, not an error.

    Without a cast, `v:user` returns a VARIANT, so you can keep drilling or
    keep the sub-object flexible.

    **The cast is where strictness bites.** If the value at the path cannot
    become the target type, `variant_get` and `::` raise
    `INVALID_VARIANT_CAST`. Use `try_variant_get` to get NULL instead:

    ```sql
    SELECT try_variant_get(v, '$.amount', 'double') AS amount FROM events;
    ```

    Variant casts follow normal cast rules, so a JSON string `"12.00"`
    becomes the double `12.0`, but `"n/a"` does not.

