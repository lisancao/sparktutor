    ## Real-Time Mode and Named Sources (Spark 4.2)

    **Real-time mode** (RTM) arrived for Scala stateless queries in 4.1
    (SPARK-53736): instead of discrete micro-batches, long-running batches
    process records as they arrive, for sub-second latency. 4.2 adds the
    PySpark trigger:

    ```python
    query = df.writeStream.outputMode("update").trigger(realTime="5 seconds").start()
    ```

    The duration is how long each long-running batch lasts (minimum
    `spark.sql.streaming.realTimeMode.minBatchDuration`, default 5 seconds).
    RTM is narrow on purpose: in 4.2 the source must support it (Kafka),
    sinks are limited to an allowlist (console, foreach, Kafka and a
    memory sink), and the output mode must be `update`. Anything
    else fails at start-up, for example
    `STREAMING_REAL_TIME_MODE.INPUT_STREAM_NOT_SUPPORTED` for the rate
    source.

    **Named sources** make checkpoints survive query edits. Positional
    source identity is why adding a second source to a query used to break
    its checkpoint. 4.2 lets you name each source:

    ```python
    events = spark.readStream.schema(s).name("spend_events").json(path)
    ```

    In SQL the same idea is `STREAM t IDENTIFIED BY spend_events`. In 4.2.0
    this is experimental and requires the internal flag
    `spark.sql.streaming.queryEvolution.enableSourceEvolution=true`;
    without it, `.name()` fails with `SOURCE_NAMING_NOT_SUPPORTED`. With it
    on, **every** streaming source in the session's queries must be named
    (`UNNAMED_STREAMING_SOURCES_WITH_ENFORCEMENT`).

