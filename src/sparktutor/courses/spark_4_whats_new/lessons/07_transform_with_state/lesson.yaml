    ## Summary

    - **transformWithState** (4.0; row-based Python API in 4.1) replaces
      `mapGroupsWithState` with typed `ValueState`, `ListState` and
      `MapState`, TTL, and timers.
    - It **requires RocksDB** as the state store provider.
    - **initialState** seeds state from a batch DataFrame in the first batch.
    - The **statestore** reader exposes state from a checkpoint.
    - **Real-time mode** (PySpark trigger in 4.2) is for stateless Kafka
      pipelines in update mode.
    - **Named sources** (`.name()`, 4.2, flag-gated) decouple checkpoints
      from source order.

    Next: CDC, NEAREST BY joins, time buckets and metric views.
