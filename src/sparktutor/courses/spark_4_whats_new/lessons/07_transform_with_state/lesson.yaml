- Class: text
  Depth: advanced
  Output: |
    ## Design Notes

    - **State schema evolution.** You can add state variables between runs,
      and remove one by calling `handle.deleteIfExists(name)` in `init`.
      Evolving the schema *inside* a variable (add, remove, widen or reorder
      fields) requires `spark.sql.streaming.stateStore.encodingFormat=avro`;
      renames and narrowing are not supported, and key schemas cannot
      evolve.
    - **`handleInputRows` must consume or ignore rows deliberately.** The
      iterator can be large; do not `list()` it unless you need random
      access.
    - **Event-time timers** fire on watermark advance, so they need
      `eventTimeColumnName` (or a watermark on the input) and
      `timeMode="EventTime"`.
    - **Sink naming.** 4.2's release notes add `.name()` for streaming
      sinks (SPARK-56719); PySpark's `DataStreamWriter` in 4.2.0 does not
      expose it, only `DataStreamReader.name()`.

