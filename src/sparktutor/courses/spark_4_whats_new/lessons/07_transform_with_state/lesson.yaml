    ## Requirements and Gotchas

    - **RocksDB state store is mandatory.** With the default HDFS-backed
      provider the query fails with
      `UNSUPPORTED_FEATURE.STORE_BACKEND_NOT_SUPPORTED_FOR_TWS`. Set
      `spark.sql.streaming.stateStore.providerClass` to
      `org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider`
      when you build the session.
    - **Output mode** is passed to `transformWithState` *and* set on the
      writer; keep them consistent (`Update` or `Append`).
    - **The memory sink appends** every emitted row even in update mode, so
      a key that changes twice appears twice. Deduplicate when reading it,
      or use `foreachBatch` with a MERGE for a real sink.
    - **No output for keys without input.** A key that appears only in the
      initial state produces no row until input arrives for it.

