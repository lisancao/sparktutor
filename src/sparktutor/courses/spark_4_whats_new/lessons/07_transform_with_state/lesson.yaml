    ## State Variable Types

    - **`ValueState`**: one value per key. `get`, `update`, `exists`, `clear`.
    - **`ListState`**: an append-friendly list per key. `appendValue`,
      `appendList`, `put`, `get` (an iterator), `clear`. Appending does not
      rewrite the existing list, which is the big win over v1.
    - **`MapState`**: a map per key. `getValue`, `updateValue`,
      `containsKey`, `keys`, `values`, `iterator`, `removeKey`.

    Every getter accepts an optional `ttlDurationMs`. With TTL, a value
    expires that long after its last update and is evicted automatically,
    which is how you bound state for keys that go quiet.

    **Timers** replace v1 timeouts. Call
    `self.handle.registerTimer(ms)` (keep the handle from `init`), and Spark
    calls `handleExpiredTimer(key, timerValues, expiredTimerInfo)` when it
    fires. Choose `timeMode="ProcessingTime"` or `"EventTime"` for timers;
    `"None"` disables them.

