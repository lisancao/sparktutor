    ## What You'll Learn

    Arbitrary stateful streaming in Spark 3 meant `mapGroupsWithState` or
    `applyInPandasWithState`: one opaque state object per key, timeouts as
    the only clock, no schema evolution, and no clean way to keep a list or
    a map without rewriting the whole blob every batch.

    Spark 4.0 introduced **transformWithState** (Arbitrary State API v2,
    SPARK-46815), with `transformWithStateInPandas` for Python. 4.1 added the
    row-based Python `transformWithState` (SPARK-51814). 4.2 brings faster
    initial state handling in Python (SPARK-54392), the **real-time mode**
    trigger in PySpark (SPARK-54660), and **named streaming sources**
    (SPARK-54909).

    By the end of this lesson you will be able to:

    - Write a `StatefulProcessor` with typed `ValueState`, `ListState` and
      `MapState` variables
    - Seed state from a batch DataFrame with `initialState`
    - Read operator state from a checkpoint with the state data source
    - Know when real-time mode applies, and name your sources

- Class: text
  Depth: beginner
  Output: |
    Streaming state is memory that survives between micro-batches. Imagine
    a running tab per customer: each new purchase adds to the tab, and the
    tab is still there when the next purchase arrives, even if the job
    restarts.

    With `transformWithState`, you write a small class. Spark gives it one
    group of rows at a time (all the new rows for one customer), plus
    access to that customer's saved state. Your class updates the state and
    yields output rows. Spark handles storage, checkpoints and recovery.

- Class: text
  Depth: all
  Output: |
    ## The StatefulProcessor

    ```python
    from pyspark.sql import Row
    from pyspark.sql.streaming import StatefulProcessor, StatefulProcessorHandle

    class SpendTracker(StatefulProcessor):
        def init(self, handle: StatefulProcessorHandle) -> None:
            self.total = handle.getValueState("total", "amount long")
            self.history = handle.getListState("history", "amount long")

        def handleInputRows(self, key, rows, timerValues):
            (user,) = key
            total = self.total.get()[0] if self.total.exists() else 0
            for r in rows:
                total += r.amount
                self.history.appendValue((r.amount,))
            self.total.update((total,))
            yield Row(user=user, total=total)

        def close(self) -> None:
            pass

    out = events.groupBy("user").transformWithState(
        statefulProcessor=SpendTracker(),
        outputStructType="user string, total long",
        outputMode="Update",
        timeMode="None",
    )
    ```

    - **`init`** declares state variables, each with a name and a schema.
      Values are tuples matching the schema.
    - **`handleInputRows(key, rows, timerValues)`** is called per key per
      micro-batch. `key` is a tuple of the grouping columns; `rows` is an
      iterator of `Row` (or of pandas DataFrames for
      `transformWithStateInPandas`).
    - **State is per key.** `self.total.get()` returns the current key's
      value; you never index by key yourself.

    **Docs:** [transformWithState](https://spark.apache.org/docs/4.2.0/streaming/structured-streaming-transform-with-state.html)

