    ## Inspecting State From the Checkpoint

    The **state data source** (4.0, SPARK-45511) reads operator state
    directly from a checkpoint as a DataFrame, which is how you debug "why
    did this key emit that":

    ```python
    (spark.read.format("statestore")
         .option("stateVarName", "total")
         .load("/path/to/checkpoint")
         .select("key", "value")
         .show())
    ```

    For `transformWithState` pass `stateVarName`; each state variable is
    stored separately. It works on a stopped query's checkpoint, so you can
    inspect production state offline.

