    ## Initial State

    Migrating a running tally from another system, or backfilling from a
    table? Pass a grouped batch DataFrame as `initialState`:

    ```python
    opening = spark.createDataFrame([("ann", 50)], "user string, opening_balance long")

    events.groupBy("user").transformWithState(
        SpendTracker(), "user string, total long", "Update", "None",
        initialState=opening.groupBy("user"),
    )

    # in the processor
    def handleInitialState(self, key, initialState, timerValues):
        self.total.update((initialState.opening_balance,))
    ```

    `handleInitialState` runs only in the query's first batch, once per
    initial-state row, before input rows for that key. The initial state
    must be grouped by the same key columns. Restarting from a checkpoint
    ignores it, because the state is already there.

    4.2 reworked how initial state travels from the JVM to the Python
    worker (SPARK-54392), which matters when you seed millions of keys.

