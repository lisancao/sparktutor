    ## Metric Views (Spark 4.2)

    Every BI team has redefined "revenue" in five dashboards. A **metric
    view** defines dimensions and measures once, in YAML, on top of a table
    or query; consumers pick dimensions and Spark generates the aggregation:

    ```sql
    CREATE VIEW order_metrics
    WITH METRICS
    LANGUAGE YAML
    AS $$
    version: "0.1"
    source: orders_t            # a table name or a SQL query
    filter: qty > 0             # optional
    dimensions:
      - name: region
        expr: region
    measures:
      - name: revenue
        expr: sum(qty * price)
    $$;

    SELECT region, measure(revenue) FROM order_metrics GROUP BY region;
    SELECT measure(revenue) FROM order_metrics WHERE region = 'east';
    ```

    The measure is an aggregate expression evaluated at whatever grain the
    query asks for. That is the difference from a regular view with a
    `GROUP BY` baked in: a ratio like `sum(a) / sum(b)` stays correct at any
    grain instead of being averaged across pre-aggregated rows.

    **Docs:** [CREATE VIEW](https://spark.apache.org/docs/4.2.0/sql-ref-syntax-ddl-create-view.html)

