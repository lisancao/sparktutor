    ## NEAREST BY Performance and Semantics

    The 4.2 implementation evaluates every (left, right) pair and keeps a
    bounded heap of `k` per left row: work is
    `O(|left| x |right| x log k)`, memory is bounded by `k` per row. That is
    fine for thousands of candidates and painful for millions. Pre-filter the
    right side (a bounding box, a region match) in a subquery.

    Ties are broken arbitrarily. Output rows per left row come out best
    first, but downstream operators may reorder; add `ORDER BY` if order
    matters. For geospatial points (lesson 5), a haversine expression over
    extracted coordinates works as the ranking expression.

