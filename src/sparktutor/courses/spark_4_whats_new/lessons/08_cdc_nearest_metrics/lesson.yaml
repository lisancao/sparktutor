    ## Metric View Gotchas in 4.2.0

    - **Always wrap measures in `measure()`.** `SELECT total_qty FROM
      order_metrics` without `measure()` fails with an `INTERNAL_ERROR` at
      planning in 4.2.0, not a friendly message.
    - **Persistent only.** `CREATE TEMP VIEW ... WITH METRICS` is a parse
      error. You need a catalog: the local session catalog works (the view
      lives in the warehouse directory), and 4.2 also supports metric views
      on DSv2 catalogs.
    - **`DESCRIBE TABLE EXTENDED`** shows `Type: METRIC_VIEW`, the YAML text,
      and the source and filter as table properties.
    - Dimensions can be expressions (`upper(region)`), and `WHERE` on a
      dimension filters before aggregation.

