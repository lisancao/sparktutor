- Class: text
  Depth: advanced
  Output: |
    ## CDC Internals Worth Knowing

    - **Pushdown is restricted.** When post-processing applies, Spark only
      pushes predicates on `_commit_version`, `_commit_timestamp` and the
      row id columns into the connector. Pushing a filter on `_change_type`
      could drop half of a delete/insert pair and corrupt update detection.
    - **Streaming output lags by one commit.** Streaming post-processing
      uses `_commit_timestamp` as event time with a zero-delay watermark, so
      a commit's rows are emitted when a later batch advances the watermark
      past it. The last commit is emitted when the source terminates.
    - **netChanges in streaming** only merges changes buffered together; for
      a full-range collapse use a batch read.
    - **Declarative pipelines.** 4.2 also adds Auto CDC to Spark Declarative
      Pipelines (SPARK-56249): `create_auto_cdc_flow(target, source, keys,
      sequence_by, ...)` in `pyspark.pipelines` applies a CDC feed to a
      streaming table as SCD Type 1. It runs inside a pipeline
      (`spark-pipelines run`), not in a plain script, so it is not part of
      this exercise.

