    ## NEAREST BY: Top-K Joins (Spark 4.2)

    "For each store, the two closest warehouses" used to be a cross join,
    a window function and a filter. 4.2 makes it a join type:

    ```sql
    SELECT s.store, w.warehouse
    FROM stores s
    JOIN warehouses w
      EXACT NEAREST 2 BY DISTANCE sqrt(pow(s.sx - w.wx, 2) + pow(s.sy - w.wy, 2))
    ```

    Grammar: `{ APPROX | EXACT } NEAREST [k] BY { DISTANCE | SIMILARITY } expr`.

    - `DISTANCE` keeps the smallest values; `SIMILARITY` keeps the largest
      (use it with cosine similarity or a negated distance).
    - `k` is 1 to 100000, default 1.
    - Only `INNER` (default) and `LEFT OUTER` are allowed; `FULL OUTER`
      fails with `NEAREST_BY_JOIN.UNSUPPORTED_JOIN_TYPE`.
    - `EXACT` forces brute force and requires a deterministic expression;
      `APPROX` allows index-backed strategies, which are planned but not
      implemented yet, so today both evaluate the full cross product.

    The DataFrame API is `nearestByJoin`:

    ```python
    stores.nearestByJoin(warehouses, ranking_expr, 1, "exact", "distance")
    ```

    **Docs:** [JOIN (nearest_by_clause)](https://spark.apache.org/docs/4.2.0/sql-ref-syntax-qry-select-join.html)

