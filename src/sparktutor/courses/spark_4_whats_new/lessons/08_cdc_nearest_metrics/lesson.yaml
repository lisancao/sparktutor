    ## CDC: Why It Fails Locally

    `CHANGES` and `changes()` work only for DSv2 tables whose catalog
    implements `TableCatalog.loadChangelog()`. Spark's built-in session
    catalog does not, so on a local Parquet table:

    ```text
    [UNSUPPORTED_FEATURE.CHANGE_DATA_CAPTURE] The feature is not supported:
    Catalog spark_catalog does not support Change Data Capture (CDC). SQLSTATE: 0A000
    ```

    That is by design: change tracking is a property of the table format
    (it needs versioned commits), not of Spark. Spark 4.2 standardizes the
    query surface, the metadata columns and the post-processing; a connector
    (a table format's catalog) supplies the raw changes through the
    `Changelog` interface. In the Spark source tree, the only implementation
    is the test-only `InMemoryChangelogCatalog`.

    The exercise catches this error by condition, then builds the same
    changelog shape by diffing two snapshots, which is what you would do
    against a table format without CDC support.

