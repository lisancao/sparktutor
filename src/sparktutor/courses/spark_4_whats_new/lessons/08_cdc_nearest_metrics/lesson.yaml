    ## Summary

    - **CDC (4.2):** `CHANGES FROM VERSION ...` and `read.changes()` return
      rows with `_change_type`, `_commit_version`, `_commit_timestamp`. It
      needs a connector whose catalog implements `loadChangelog()`; the
      built-in catalog raises `UNSUPPORTED_FEATURE.CHANGE_DATA_CAPTURE`.
    - **NEAREST BY (4.2):** a top-K join with `DISTANCE` or `SIMILARITY`,
      brute force today, `INNER` or `LEFT OUTER` only.
    - **time_bucket (4.2):** arbitrary fixed-size buckets with an origin.
    - **Metric views (4.2):** measures defined once in YAML, queried with
      `measure()` at any grain.

    That completes the tour. You have now run code for the major Spark 4.0,
    4.1 and 4.2 features: ANSI by default, Spark Connect, VARIANT, pipe
    syntax and QUALIFY, SQL scripting, geospatial types, Python data
    sources, transformWithState, and the 4.2 analytics additions.
