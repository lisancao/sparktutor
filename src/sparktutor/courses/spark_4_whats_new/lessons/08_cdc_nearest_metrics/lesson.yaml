    ## time_bucket (Spark 4.2)

    `time_bucket(bucket_size, ts[, origin])` returns the start of the
    fixed-size bucket containing `ts`, aligned to `origin` (default
    `1970-01-01 00:00:00`):

    ```sql
    SELECT time_bucket(INTERVAL '15' MINUTE, TIMESTAMP '2024-06-20 09:47:00');
    -- 2024-06-20 09:45:00
    SELECT time_bucket(INTERVAL '1' HOUR, ts, TIMESTAMP '2024-01-01 00:30:00');
    -- hourly buckets starting at half past
    ```

    Compared with `window()` it returns a plain timestamp (not a struct),
    supports month and year intervals, and takes an explicit origin.
    `date_trunc` only knows calendar units; `time_bucket` does any size.

    Rules: the bucket size must be a positive, constant interval (not a
    string like `'15 minutes'`); `ts` and `origin` must be the same flavor
    (`TIMESTAMP` or `TIMESTAMP_NTZ`); dates and strings are rejected. For
    `TIMESTAMP_NTZ`, bucketing is done in UTC; for `TIMESTAMP`, month and
    day components align to the session time zone. Use `TIMESTAMP_NTZ` when
    you want results that do not depend on the session zone.

