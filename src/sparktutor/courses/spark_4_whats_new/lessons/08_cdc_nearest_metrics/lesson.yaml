    ## What You'll Learn

    The last lesson covers four Spark 4.2 additions that target everyday
    analytics plumbing:

    - **Change Data Capture**: a SQL `CHANGES` clause and a DataFrame
      `changes()` API for reading row-level changes (SPARK-55668)
    - **NEAREST BY**: a top-K ranking join for nearest-neighbor queries
      (SPIP SPARK-56395)
    - **time_bucket**: fixed-size time buckets with an origin (SPARK-56594)
    - **Metric views**: `CREATE VIEW ... WITH METRICS`, measures defined once
      and sliced by any dimension (SPARK-54119)

    One honest caveat up front: CDC is an **API and a connector contract**.
    The tables Spark ships with (the built-in session catalog) do not
    produce changelogs, so you cannot run `CHANGES` against a local Parquet
    table. This lesson shows the exact error, teaches the contract, and
    builds a runnable approximation with the same output shape.

- Class: text
  Depth: beginner
  Output: |
    Change Data Capture answers "what changed in this table since version
    N?" Instead of re-reading the whole table and comparing, you read a
    feed of changes: this row was inserted, that one deleted, this one
    updated from 100 to 90.

    Every incremental pipeline needs this, and before 4.2 each table format
    had its own way to ask (Delta's `table_changes`, Iceberg's changelog
    views). 4.2 gives Spark one standard way to ask, and each table format
    plugs into it.

- Class: text
  Depth: all
  Output: |
    ## CDC: The Query Surface (Spark 4.2)

    ```sql
    -- Batch: changes between two versions (or timestamps)
    SELECT * FROM inventory CHANGES FROM VERSION 10 TO VERSION 20;
    SELECT * FROM inventory CHANGES FROM TIMESTAMP '2026-01-01' EXCLUSIVE;

    -- Streaming: the start is optional
    SELECT * FROM STREAM inventory CHANGES FROM VERSION 10;
    ```

    ```python
    spark.read.option("startingVersion", "10").option("endingVersion", "20").changes("inventory")
    spark.readStream.option("startingVersion", "10").changes("inventory")
    ```

    Every row carries three metadata columns:

    - `_change_type`: `insert`, `delete`, `update_preimage`, `update_postimage`
    - `_commit_version`: the version that made the change (LONG or STRING)
    - `_commit_timestamp`: when that version committed

    Options control post-processing: `deduplicationMode` is `none`,
    `dropCarryovers` (the default; removes identical delete/insert pairs
    that copy-on-write file rewrites produce) or `netChanges` (collapse to
    one net change per row across the range), and `computeUpdates` derives
    pre/post images from delete/insert pairs.

